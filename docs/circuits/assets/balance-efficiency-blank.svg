<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460">
  <title>同一串数同一电流的均衡效率空表示意图</title>
  <rect width="880" height="460" fill="#f8fafc"/>
  <style>
  text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
  @media (prefers-color-scheme: dark){
  rect[fill="#f8fafc"]{fill:#0f172a}
  rect[fill="#fff"]{fill:#1e293b}
  [fill="#e2e8f0"]{fill:#334155}
  [stroke="#e2e8f0"]{stroke:#334155}
  [fill="#334155"]{fill:#e2e8f0}
  [stroke="#334155"]{stroke:#e2e8f0}
  [fill="#1e293b"]{fill:#f1f5f9}
  [stroke="#1e293b"]{stroke:#f1f5f9}
  [fill="#dbeafe"]{fill:#1e3a8a}
  [stroke="#dbeafe"]{stroke:#1e3a8a}
  [fill="#1d4ed8"]{fill:#60a5fa}
  [stroke="#1d4ed8"]{stroke:#60a5fa}
  [fill="#ecfdf5"]{fill:#022c22}
  [fill="#059669"]{fill:#34d399}
  [stroke="#059669"]{stroke:#34d399}
  [fill="#fffbeb"]{fill:#451a03}
  [fill="#fef3c7"]{fill:#78350f}
  [fill="#b45309"]{fill:#fbbf24}
  [stroke="#b45309"]{stroke:#fbbf24}
  [fill="#fef2f2"]{fill:#450a0a}
  [fill="#fecaca"]{fill:#7f1d1d}
  [fill="#dc2626"]{fill:#f87171}
  [stroke="#dc2626"]{stroke:#f87171}
  }
  </style>

  <text x="440" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">同一工作点才能比效率</text>
  <text x="440" y="50" text-anchor="middle" font-size="13" fill="#b45309">示意图·待实测</text>
  <rect x="24" y="70" width="400" height="250" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="40" y="98" font-size="15" font-weight="bold" fill="#1e293b">电感式 · 4 串</text>
  <rect x="48" y="116" width="70" height="40" rx="4" fill="#fecaca" stroke="#334155"><animate attributeName="stroke-width" values="5;2;5" keyTimes="0;0.5;1" dur="5s" repeatCount="indefinite"/></rect>
  <text x="83" y="141" text-anchor="middle" font-size="12" fill="#1e293b">高节</text>
  <rect x="160" y="116" width="90" height="40" rx="4" fill="#fffbeb" stroke="#b45309"/>
  <text x="205" y="141" text-anchor="middle" font-size="12" fill="#1e293b">电感</text>
  <rect x="292" y="116" width="70" height="40" rx="4" fill="#dbeafe" stroke="#1d4ed8"><animate attributeName="stroke-width" values="2;5;2" keyTimes="0;0.5;1" dur="5s" repeatCount="indefinite"/></rect>
  <text x="327" y="141" text-anchor="middle" font-size="12" fill="#1e293b">低节</text>
  <circle cy="136" r="5" fill="#b45309">
    <animate attributeName="cx" values="83;327;83" keyTimes="0;0.5;1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <text x="48" y="186" font-size="13" fill="#334155">I_bal：待填，与右图同一值</text>
  <text x="48" y="210" font-size="13" fill="#334155">起始电压对：待填，同一对</text>
  <text x="48" y="234" font-size="13" fill="#334155">开关频率：待填</text>
  <text x="48" y="266" font-size="15" font-weight="bold" fill="#1e293b">η = 待测</text>
  <text x="48" y="292" font-size="12" fill="#334155">低节收到的能量 / 高节交出的能量</text>
  <rect x="448" y="70" width="408" height="250" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="464" y="98" font-size="15" font-weight="bold" fill="#1e293b">开关电容式 · 4 串</text>
  <rect x="472" y="116" width="70" height="40" rx="4" fill="#fecaca" stroke="#334155"/>
  <text x="507" y="141" text-anchor="middle" font-size="12" fill="#1e293b">高节</text>
  <rect x="584" y="116" width="90" height="40" rx="4" fill="#ecfdf5" stroke="#059669"/>
  <text x="629" y="141" text-anchor="middle" font-size="12" fill="#1e293b">电容</text>
  <rect x="716" y="116" width="70" height="40" rx="4" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="751" y="141" text-anchor="middle" font-size="12" fill="#1e293b">低节</text>
  <circle cy="136" r="5" fill="#059669">
    <animate attributeName="cx" values="507;751;507" keyTimes="0;0.5;1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <text x="472" y="186" font-size="13" fill="#334155">I_bal：与左图填写同一个数</text>
  <text x="472" y="210" font-size="13" fill="#334155">起始电压对：与左图同一对</text>
  <text x="472" y="234" font-size="13" fill="#334155">开关频率：待填</text>
  <text x="472" y="266" font-size="15" font-weight="bold" fill="#1e293b">η = 待测</text>
  <text x="472" y="292" font-size="12" fill="#334155">同一套表、同一个时间窗</text>
  <text x="24" y="352" font-size="14" fill="#1e293b">Shang 的 94.5% 是四节开关电容、输出 0.91 W。Dai 的 86% 是六节、节到模组。</text>
  <text x="24" y="376" font-size="14" fill="#334155">两篇不填进这一对空格。空格要等同一电流、同一串数的测量。</text>
  <text x="24" y="408" font-size="14" fill="#334155">黄点和绿点只表示能量从高节移向低节。这张不是某台板的效率。</text>

</svg>
