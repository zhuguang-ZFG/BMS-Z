    }
</style><rect class="bg" x="0" y="-156" width="800" height="680" /><text class="title" x="24" y="-128">Modbus RTU：静默比 CRC 先划出帧界</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① Modbus RTU：静默比 CRC 先划出帧界<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 正常：字符紧挨着，帧间停满 3.5 字符<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 帧间静默 3.5 字符<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="468" width="752" height="44" rx="6" /><text class="small" x="40" y="496">波特率不超过 19200 时按字符时间算；更高波特率用规范里的固定 t1.5 与 t3.5。示意。</text><rect class="bg" width="800" height="460" />
  <text class="txt" x="40" y="78">正常：字符紧挨着，帧间停满 3.5 字符</text>
  <rect class="byte" x="40" y="96" width="64" height="40" rx="4" />
  <rect class="byte" x="112" y="96" width="64" height="40" rx="4" />
  <rect class="byte" x="184" y="96" width="64" height="40" rx="4" />
  <rect class="byte" x="256" y="96" width="64" height="40" rx="4" />
  <text class="small" x="72" y="122" text-anchor="middle">地址</text>
  <text class="small" x="144" y="122" text-anchor="middle">功能</text>
  <text class="small" x="216" y="122" text-anchor="middle">数据</text>
  <text class="small" x="288" y="122" text-anchor="middle">CRC</text>
  <rect class="gap" x="336" y="96" width="150" height="40" rx="4">
    <animate attributeName="width" values="24;150;150" keyTimes="0;0.35;1" dur="8s" repeatCount="indefinite" />
  </rect>
  <text class="small" x="411" y="170" text-anchor="middle">帧间静默 3.5 字符</text>
  <rect class="byte" x="510" y="96" width="64" height="40" rx="4" opacity="0.25">
    <animate attributeName="opacity" values="0.25;0.25;1;1" keyTimes="0;0.35;0.5;1" dur="8s" repeatCount="indefinite" />
  </rect>
  <rect class="byte" x="582" y="96" width="64" height="40" rx="4" opacity="0.25">
    <animate attributeName="opacity" values="0.25;0.25;1;1" keyTimes="0;0.35;0.5;1" dur="8s" repeatCount="indefinite" />
  </rect>
  <text class="small" x="542" y="122" text-anchor="middle">下一帧</text>
  <text class="small" x="614" y="122" text-anchor="middle">…</text>
  <text class="ok" x="40" y="200" opacity="0">静默够了：上一帧结束，可以验 CRC
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.5;0.72;1" dur="8s" repeatCount="indefinite" />
  </text>
  <text class="txt" x="40" y="250">损坏：帧中间停超过 1.5 字符</text>
  <rect class="byte" x="40" y="268" width="64" height="40" rx="4" />
  <rect class="byte" x="112" y="268" width="64" height="40" rx="4" />
  <rect class="bad" x="184" y="268" width="110" height="40" rx="4" />
  <text class="small" x="239" y="294" text-anchor="middle">1.5+</text>
  <rect class="byte" x="306" y="268" width="64" height="40" rx="4" />
  <text class="small" x="72" y="294" text-anchor="middle">地址</text>
  <text class="small" x="144" y="294" text-anchor="middle">功能</text>
  <text class="small" x="338" y="294" text-anchor="middle">CRC</text>
  <text class="no" x="40" y="348">这帧丢掉。不要拿残缺字节去算 CRC 碰运气。</text>
  <text class="small" x="400" y="400" text-anchor="middle">波特率不超过 19200 时按字符时间算；更高波特率用规范里的固定 t1.5 与 t3.5。</text>
  <text class="small" x="400" y="428" text-anchor="middle">方向脚切早切晚，丢的是首尾字节；静默定时器管的是整帧边界。两件事先分开查。</text>
</svg>