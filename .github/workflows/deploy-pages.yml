name: deploy-pages

# 站点部署：统一成书链（设计 §7.4）产物发到 GitHub Pages。
# book/build.py all 一次产出站点（VitePress）、两卷单文件 HTML、A4/16K PDF、EPUB、
# 两卷下载目录（HTML/PDF/EPUB + SHA-256）与总审计；对账脚本在真正要发布的
# book/dist/site 上跑，任何死链、孤儿页或检索缺失都直接阻止部署。
# 与 tests 分开：闸门（tests）挡的是代码与文档质量，这里挡的是"能不能上线"；
# 部署失败不连累 tests 变红，反之 tests 全绿也不代表产物里链接条条可达。
on:
  push:
    branches: [main]
    # BMS*.html 是仓库根上由站点托管的那一页（BMS学习路径.html）：它的相对路径引用
    # 会被 copy-site-assets.mjs 改写，改写规则和它自己改了都得重新发布才算数。
    # 用通配而不是中文文件名，避免过滤规则在非 ASCII 路径上匹配不到。
    paths: ["docs/**", "analog/**", "bms-book/**", "book/**", "BMS*.md", "BMS*.html",
            "package.json", "package-lock.json", ".github/workflows/deploy-pages.yml",
            ".github/scripts/check_pages.py", ".github/scripts/check_search.mjs"]
  workflow_dispatch:

# 部署必须串行：两个部署并发会互相踢下线。与 tests/links 的排队组分开，
# 文档站上线不该排在 C 测试后面。
concurrency:
  group: bms-z-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    # runner 镜像钉死 24.04：理由见 tests.yml 顶部注释（ubuntu-latest 正在迁 Ubuntu 26）。
    # checkout / setup-node 取 Node 24 大版本：Node 20 已被 GitHub 弃用，理由同上。
    runs-on: ubuntu-24.04
    # 与 book.yml 同量级：两卷全链路在共享 runner 上 60–90 分钟属正常波动。
    timeout-minutes: 150
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            analog/requirements.txt
            analog/analog-book/requirements.txt
            bms-book/requirements.txt
      - run: pip install -r analog/requirements.txt -r analog/analog-book/requirements.txt -r bms-book/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('analog/analog-book/requirements.txt') }}
      - run: python -m playwright install --with-deps chromium
      # runner 无中文字体时 PDF 是豆腐块（v0.6.2 线上件即如此）：字体是构建输入。
      - name: 安装中文字体
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      # 全链路一次到位：站点 + 四类介质 + 下载目录 + 总审计。
      # npm run docs:build（在 all 内部）末尾的 check_site_bundle.mjs 守 bundle 预算。
      - name: 两卷全链路构建（站点 + 介质 + 下载包 + 审计）
        run: python book/build.py all
      - name: 站内链接与锚点对账（产物侧）
        run: python3 .github/scripts/check_pages.py book/dist/site
      - name: 中文检索对账（正文有的词搜索必须翻到）
        run: node .github/scripts/check_search.mjs book/dist/site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: book/dist/site
      - id: deployment
        uses: actions/deploy-pages@v5
