<rect data-beta="10" x="140" y="176" width="84" height="26" fill="#1f5d7a" stroke="#16202b"/>
<text x="36" y="259" font-size="20" fill="#a8321f" text-anchor="start">β = 2</text><text x="640" y="259" font-size="20" fill="#a8321f" text-anchor="end">35 mA</text>
<rect data-beta="2" x="140" y="238" width="420" height="26" fill="#a8321f" stroke="#16202b"/>
