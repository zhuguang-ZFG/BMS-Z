<path d="M780 145 Q779.00 240.00 780 335" fill="none" stroke="#c9bb9d" stroke-dasharray="3 5"/>
<text x="780.0" y="370" font-size="22" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">4</text>
<path d="M900 145 Q899.92 240.00 900 335" fill="none" stroke="#c9bb9d" stroke-dasharray="3 5"/>
