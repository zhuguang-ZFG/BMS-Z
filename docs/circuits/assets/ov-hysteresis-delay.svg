      .boxb { fill: #12233a; stroke: #4493f8; }
    }
  </style>

  <!-- formula: trip 4.28 hold 1.0s; release 4.18; spike 1.5-1.8s ignored -->
  <rect class="bg" width="800" height="544"/>
  <text class="title" x="24" y="32">阈值、回差、确认时间，三件事叠在同一条电压上（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="128" rx="6"/>
  <text class="txt" x="40" y="72" opacity="0.28">① 毛刺 0.3 s<tspan class="small">　1.5–1.8 s 冲到 4.34 V。不够 1.0 s，MOS 不动。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="98" opacity="0.28">② 真的越过<tspan class="small">　3.0 s 起停在 4.32 V。比较器翻了，计时开始。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="124" opacity="0.28">③ 确认满 1.0 s<tspan class="small">　4.0 s 断开充电 MOS。回差让它先别急着合。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="150" opacity="0.28">④ 落到恢复线以下<tspan class="small">　6.2 s 电压 4.12 V，低于 4.18，才允许合上。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
