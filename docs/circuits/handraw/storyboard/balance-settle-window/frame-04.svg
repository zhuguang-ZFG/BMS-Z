<text x="480" y="520" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="middle">时序是：关均衡 → 等 2–3 个 τ → 采样 → 判据 → 再开，不是「关一下就采」。</text>
<text x="480" y="544" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="middle" opacity="0.75">原理示意 / 非实拍　τ 与回路电阻取自书稿 §9.9 的合成电芯</text>
