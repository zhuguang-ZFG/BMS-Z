<polygon points="200,256 200,304 252,280" fill="#e6f6f2" stroke="#14213d" stroke-width="2" stroke-linejoin="round"/>
<text x="204" y="318" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" fill="#14213d">比较器B（2脚）</text>

<!-- 6/2 pin wire -->
<path d="M202 440 V420 H180 V232 H200" fill="none" stroke="#14213d" stroke-width="1.8"/>
<path d="M180 292 H200" fill="none" stroke="#14213d" stroke-width="1.8"/>
<circle cx="180" cy="292" r="3" fill="#14213d"/>

<!-- RS flip-flop -->
<rect x="290" y="190" width="100" height="120" rx="4" fill="#ffffff" stroke="#14213d" stroke-width="1.8"/>
<text x="340" y="242" text-anchor="middle" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="13.5" fill="#14213d">RS 触发器</text>
<text x="294" y="214" font-family="'Book Mono',monospace" font-size="10" fill="#52606d">R</text>
<text x="294" y="284" font-family="'Book Mono',monospace" font-size="10" fill="#52606d">S</text>
<path d="M252 220 H268 V210 H290" fill="none" stroke="#14213d" stroke-width="1.8"/>
