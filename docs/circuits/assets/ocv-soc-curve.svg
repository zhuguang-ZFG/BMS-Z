</style><rect class="bg" x="0" y="-156" width="800" height="806" /><text class="title" x="24" y="-128">OCV-SOC 曲线：为什么铁锂的 SOC 不能只靠电压估</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 开路电压对荷电，铁锂中间有一段平台。<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 平台上斜率很小，几十毫伏能换很多荷电。<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 两端变陡，同样的毫伏换到的荷电少。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 底栏数字是示意，不是某一颗电芯的实测。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect width="800" height="650" class="bg" />
  <line x1="60" y1="360" x2="750" y2="360" stroke-width="2" class="stroke-axis" />
  <line x1="60" y1="360" x2="60" y2="60" stroke-width="2" class="stroke-axis" />
  
  <text x="700" y="396" font-size="12" class="txt">SOC %</text>
  <text x="66" y="72" font-size="12" class="txt">OCV</text>
  <g font-size="12" class="fill-muted">
    <text x="50" y="364" text-anchor="end">2.5V</text>
    <text x="50" y="250" text-anchor="end">3.3V</text>
    <text x="50" y="114" text-anchor="end">4.2V</text>
    <text x="60" y="376">0</text>
    <text x="740" y="376" text-anchor="end">100</text>
  </g>

  
  <path d="M60,320 C300,290 500,180 740,114" fill="none" stroke-width="3.5" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000" class="stroke-b">
    <animate attributeName="stroke-dashoffset" values="1000;0;0" keyTimes="0;0.45;1" dur="8s" repeatCount="indefinite" />
  </path>
  <text x="560" y="150" font-size="13" font-weight="bold" opacity="0" class="hi">三元 NCM：斜率明显
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.42;0.46;1" dur="8s" repeatCount="indefinite" />
  </text>

  
  <path d="M60,330 C150,300 185,253 260,249 C400,246 560,245 620,245 C680,243 715,205 740,196" fill="none" stroke-width="3.5" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000" class="stroke-g">
    <animate attributeName="stroke-dashoffset" values="1000;0;0" keyTimes="0;0.45;1" dur="8s" repeatCount="indefinite" />
  </path>
  <text x="120" y="290" font-size="13" font-weight="bold" opacity="0" class="ok">铁锂 LFP
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.42;0.46;1" dur="8s" repeatCount="indefinite" />
  </text>

  
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.54;1" dur="8s" repeatCount="indefinite" />
    <line x1="260" y1="249" x2="620" y2="245" stroke-width="2" stroke-dasharray="6 4" class="stroke-r" />
    <rect x="270" y="50" width="380" height="86" rx="8" class="fill-boxr stroke-r" />
    <text x="460" y="74" text-anchor="middle" font-size="14" font-weight="bold" class="warn">平台区放大看（SOC 30% → 70%）</text>
    <text x="460" y="96" text-anchor="middle" font-size="13" class="warn">电压只从 3.28V 爬到 3.31V —— 40% 的 SOC 变化，</text>
    <text x="460" y="116" text-anchor="middle" font-size="13" class="warn">电压只动 30mV，而采样噪声就有 2–5mV！</text>
  </g>

  
  <circle r="7" stroke-width="2" opacity="0" class="fill-r stroke-check">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.52;0.56;1" dur="8s" repeatCount="indefinite" />
    <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.56;0.94;1" path="M260,249 C400,246 560,245 620,245" />
  </circle>

  <text x="400" y="418" text-anchor="middle" font-size="14" class="small">结论：LFP 平台区纯电压法基本失效 → 必须上"积分 + 滤波融合"（见 EKF 动画）</text>
<rect x="24" y="448.0" width="752" height="188" rx="6" class="panel" /><text x="40" y="468.0" font-size="13" class="txt">底栏：30%→70% 只爬 30 mV。斜率 0.75 mV / 每个百分点</text><text x="40" y="484.0" font-size="12" class="small">电压 V</text><line x1="70.0" y1="484.0" x2="70.0" y2="598.0" stroke-width="1.5" class="stroke-axis" /><line x1="70.0" y1="598.0" x2="460.0" y2="598.0" stroke-width="1.5" class="stroke-axis" /><line x1="70.0" y1="598.0" x2="70.0" y2="603.0" class="stroke-axis" /><text x="70.0" y="616.0" text-anchor="middle" font-size="12" class="small">30</text><line x1="265.0" y1="598.0" x2="265.0" y2="603.0" class="stroke-axis" /><text x="265.0" y="616.0" text-anchor="middle" font-size="12" class="small">50</text><line x1="460.0" y1="598.0" x2="460.0" y2="603.0" class="stroke-axis" /><text x="460.0" y="616.0" text-anchor="middle" font-size="12" class="small">70</text><line x1="65.0" y1="575.2" x2="70.0" y2="575.2" class="stroke-axis" /><text x="62.0" y="579.2" text-anchor="end" font-size="12" class="small">3.28</text><line x1="65.0" y1="541.0" x2="70.0" y2="541.0" class="stroke-axis" /><text x="62.0" y="545.0" text-anchor="end" font-size="12" class="small">3.295</text><line x1="65.0" y1="506.8" x2="70.0" y2="506.8" class="stroke-axis" /><text x="62.0" y="510.8" text-anchor="end" font-size="12" class="small">3.31</text><polyline points="70.0,575.2 79.8,573.5 89.5,571.8 99.2,570.1 109.0,568.4 118.8,566.7 128.5,564.9 138.2,563.2 148.0,561.5 157.8,559.8 167.5,558.1 177.2,556.4 187.0,554.7 196.8,553.0 206.5,551.3 216.2,549.6 226.0,547.8 235.8,546.1 245.5,544.4 255.2,542.7 265.0,541.0 274.8,539.3 284.5,537.6 294.2,535.9 304.0,534.2 313.8,532.5 323.5,530.7 333.2,529.0 343.0,527.3 352.8,525.6 362.5,523.9 372.2,522.2 382.0,520.5 391.8,518.8 401.5,517.1 411.2,515.3 421.0,513.6 430.8,511.9 440.5,510.2 450.2,508.5 460.0,506.8" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" class="stroke-g" /><circle r="5" class="fill-y"><animate attributeName="cx" values="70.0;118.8;167.5;216.2;265.0;313.8;362.5;411.2;460.0" keyTimes="0.0000;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1.0000" dur="8s" repeatCount="indefinite" /><animate attributeName="cy" values="575.2;566.7;558.1;549.6;541.0;532.5;523.9;515.3;506.8" keyTimes="0.0000;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1.0000" dur="8s" repeatCount="indefinite" /></circle><text x="479.4" y="616.0" text-anchor="start" font-size="12" class="small">SOC %</text><text x="480" y="526.0" font-size="12" class="txt">50% 时是 3.295 V。噪声 2–5 mV 能盖住好几步。</text>
</svg>