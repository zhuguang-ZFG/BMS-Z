  <polyline class="lineb" points="165.4,410.5 171.9,410.3 178.3,410.0 184.8,409.8 191.3,409.5 197.7,409.3 204.2,409.1 210.6,408.8 217.1,408.6 223.5,408.3 230.0,408.1 236.5,407.8 242.9,407.6 249.4,407.4 255.8,407.1 262.3,406.9 268.8,406.6 275.2,406.4 281.7,406.1 288.1,405.9 294.6,405.7 301.1,405.4 307.5,405.2 314.0,404.9 320.4,404.7 326.9,404.4 333.4,404.2 339.8,403.9 346.3,403.7 352.7,403.5 359.2,403.2 365.7,403.0 372.1,402.7 378.6,402.5 385.0,402.2 391.5,402.0 397.9,401.8 404.4,401.5 410.9,401.3 417.3,401.0 423.8,400.8 430.2,400.5 436.7,400.3 443.2,400.1 449.6,399.8 456.1,399.6 462.5,399.3 469.0,399.1 475.5,398.8 481.9,398.6 488.4,398.3 494.8,398.1 501.3,397.9 507.8,397.6 514.2,397.4 520.7,397.1 527.1,396.9 533.6,396.6 540.1,396.4 546.5,396.2 553.0,395.9 559.4,395.7 565.9,395.4 572.3,395.2 578.8,394.9 585.3,394.7 591.7,394.5 598.2,394.2 604.6,394.0 611.1,393.7 617.6,393.5 624.0,393.2 630.5,393.0 636.9,392.7 643.4,392.5 649.9,392.3 656.3,392.0 662.8,391.8 669.2,391.5 675.7,391.3 682.2,391.0" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="doty" r="6"><animate attributeName="cx" values="165.4;210.6;249.4;294.6;339.8;378.6;423.8;469.0;507.8;553.0;598.2;636.9;682.2" keyTimes="0.0000;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1.0000" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="410.5;408.8;407.4;405.7;403.9;402.5;400.8;399.1;397.6;395.9;394.2;392.7;391.0" keyTimes="0.0000;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1.0000" dur="12s" repeatCount="indefinite"/></circle>
  <text class="warn" x="347.2" y="271.3">集中：0.10×N</text>
  <text class="hi" x="347.2" y="383.8">分布：1.20+0.0125×N</text>
  <text class="small" x="24" y="528">100 µs/节、模块 1.2 ms、每节转发 12.5 µs 都是示意，不是某一颗 AFE 的转换时间。</text>
</svg>
