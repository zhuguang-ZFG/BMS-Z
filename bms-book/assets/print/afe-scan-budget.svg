<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 800 544" font-family="ui-monospace, Consolas, monospace" data-snapshot-time="9">
  <title>AFE 扫描预算：每节稳定加转换。忘掉稳定时间会把一圈算短。数字为示意。</title>
  <desc>亮点沿斜线扫过第 1、5、16 节三个工况，一圈时间按每节稳定加转换逐节往上加。</desc>

  <style>
    .bg { fill: #fffdf5; }
    .panel { fill: #f7f2e5; stroke: #cfc6b2; }
    .axis { stroke: #626d65; stroke-width: 1.5; fill: none; }
    .grid { stroke: #cfc6b2; stroke-width: 1; fill: none; }
    .txt { fill: #293b3a; font-size: 13px; }
    .small { fill: #626d65; font-size: 12px; }
    .title { fill: #293b3a; font-size: 16px; font-weight: bold; }
    .hi { fill: #176b73; }
    .warn { fill: #b84745; }
    .ok { fill: #377b60; }
    .gold { fill: #926717; }
    .lineb { stroke: #176b73; stroke-width: 2.5; fill: none; }
    .liner { stroke: #b84745; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #377b60; stroke-width: 2.5; fill: none; }
    .liney { stroke: #926717; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .dotb { fill: #176b73; }
    .dotr { fill: #b84745; }
    .doty { fill: #926717; }
    .boxb { fill: #e4f0df; stroke: #176b73; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #192727; }
      .panel { fill: #223333; stroke: #496160; }
      .axis { stroke: #b0beb3; }
      .grid { stroke: #496160; }
      .txt { fill: #edf0e5; }
      .small { fill: #b0beb3; }
      .title { fill: #edf0e5; }
      .hi { fill: #7ec5c5; }
      .warn { fill: #f39b91; }
      .ok { fill: #8fc7a2; }
      .gold { fill: #dfbd78; }
      .lineb { stroke: #7ec5c5; }
      .liner { stroke: #f39b91; }
      .lineg { stroke: #8fc7a2; }
      .liney { stroke: #dfbd78; }
      .dotb { fill: #7ec5c5; }
      .dotr { fill: #f39b91; }
      .doty { fill: #dfbd78; }
      .boxb { fill: #293f35; stroke: #7ec5c5; }
    }
  </style><style id="bms-motion">
    /* bms-motion: 手帐式动效注记（纯装饰，不改技术几何与既有 SMIL 时序） */
    .bms-marker { fill: #fbefc7; opacity: .78; }
    .bms-under { fill: none; stroke: #926717; stroke-width: 2.4; stroke-linecap: round; opacity: .9; }
    .bms-spark-line { fill: none; stroke: #926717; stroke-width: 1.9; stroke-linecap: round; }
    .bms-spark-fill { fill: #926717; }
    .bms-spark-soft { fill: #176b73; opacity: .8; }
    .bms-sticker { fill: none; stroke: #926717; stroke-width: 2; stroke-dasharray: 7 5; stroke-linecap: round; opacity: .85; }
    .bms-halo { fill: none; stroke: #926717; stroke-width: 2; }
    .bms-marker, .bms-under, .bms-sticker, .bms-halo,
    .bms-spark, .bms-success, .bms-doodle { pointer-events: none; }
    circle:has(&gt; animateMotion) { filter: drop-shadow(0 0 2px rgba(146,103,23,.5)) drop-shadow(0 0 5px rgba(196,145,52,.45)); }
    rect:has(&gt; animateMotion) { filter: drop-shadow(0 0 3px rgba(196,145,52,.75)); }
    g:has(&gt; circle):has(&gt; path.stroke-check) { filter: drop-shadow(0 0 5px rgba(55,123,96,.5)); }
    @media (prefers-color-scheme: dark) {
      .bms-marker { fill: #453e2b; opacity: .85; }
      .bms-under { stroke: #dfbd78; }
      .bms-spark-line { stroke: #dfbd78; }
      .bms-spark-fill { fill: #dfbd78; }
      .bms-spark-soft { fill: #7ec5c5; }
      .bms-sticker { stroke: #dfbd78; }
      .bms-halo { stroke: #dfbd78; }
      circle:has(&gt; animateMotion) { filter: drop-shadow(0 0 2px rgba(223,189,120,.8)) drop-shadow(0 0 7px rgba(223,189,120,.9)); }
      rect:has(&gt; animateMotion) { filter: drop-shadow(0 0 6px rgba(223,189,120,.8)); }
      g:has(&gt; circle):has(&gt; path.stroke-check) { filter: drop-shadow(0 0 6px rgba(143,199,162,.7)); }
    }
    @media (prefers-reduced-motion: reduce) { .bms-spark, .bms-success, .bms-doodle { display: none; } }
</style>

  <!-- formula: T=N*(80+20) us; bare=N*20 us -->
  <rect class="bg" width="800" height="544"/>
  <rect class="bms-marker" aria-hidden="true" x="18.0" y="17.1" width="334.0" height="17.3" rx="3.8" transform="rotate(-.5 18.0 25.8)"/><path class="bms-under" aria-hidden="true" d="M24.0 40.0 q 24.0 -2.4 48.0 0 t 48 0 t 48 0 t 48 0 t 48 0 t 48 0"/><text class="title" x="24" y="32">一圈要多久，先把「等稳定」加进去（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="128" rx="6"/><g class="bms-doodle" aria-hidden="true" transform="matrix(0.9989171118547928 0.046525301113258394 -0.046525301113258394 0.9989171118547928 746 72)" opacity="1" style="opacity: 1;"><path class="bms-spark-fill" d="M0 -9 L2.3 -2.3 L9 0 L2.3 2.3 L0 9 L-2.3 2.3 L-9 0 L-2.3 -2.3 Z"/></g><g class="bms-doodle" aria-hidden="true" transform="matrix(0.9985091400619244 -0.05458477088709462 0.05458477088709462 0.9985091400619244 710 62)" opacity="0.536364" style="opacity: 0.536364;"><path class="bms-spark-soft" d="M0 -5.5 L1.4 -1.4 L5.5 0 L1.4 1.4 L0 5.5 L-1.4 1.4 L-5.5 0 L-1.4 -1.4 Z"/></g><g class="bms-doodle" aria-hidden="true"><circle class="bms-spark-fill" cx="728.0" cy="81.0" r="1.3"/><circle class="bms-spark-soft" cx="696.0" cy="78.0" r="1.1"/></g>
  <text class="txt" x="40" y="72" opacity="1" style="opacity: 1;">① 第 1 节<tspan class="small">　80 µs 等稳定，20 µs 转换，一共 0.10 ms。</tspan></text>
  <text class="txt" x="40" y="98" opacity="1" style="opacity: 1;">② 斜率是常数<tspan class="small">　每多一节就再加 0.10 ms。直线过原点。</tspan></text>
  <text class="txt" x="40" y="124" opacity="1" style="opacity: 1;">③ 5 节<tspan class="small">　0.50 ms。若忘掉稳定时间，会误以为只有 0.10 ms。</tspan></text>
  <text class="txt" x="40" y="150" opacity="1" style="opacity: 1;">④ 16 节<tspan class="small">　1.60 ms。绿线只有 0.32 ms，差的就是那 80 µs×16。</tspan></text>
  <rect class="panel" x="24" y="188" width="752" height="304" rx="6"/>
  <text class="small" x="40" y="210">一圈时间 ms（示意）</text>
  <line class="axis" x1="108.0" y1="228.0" x2="108.0" y2="430.0"/>
  <line class="axis" x1="108.0" y1="430.0" x2="730.0" y2="430.0"/>
  <text class="small" x="730.0" y="468.0" text-anchor="end">节数 N</text>
  <line class="grid" x1="144.6" y1="430.0" x2="144.6" y2="436.0"/>
  <text class="small" x="144.6" y="452.0" text-anchor="middle">1</text>
  <line class="grid" x1="290.9" y1="430.0" x2="290.9" y2="436.0"/>
  <text class="small" x="290.9" y="452.0" text-anchor="middle">5</text>
  <line class="grid" x1="400.7" y1="430.0" x2="400.7" y2="436.0"/>
  <text class="small" x="400.7" y="452.0" text-anchor="middle">8</text>
  <line class="grid" x1="693.4" y1="430.0" x2="693.4" y2="436.0"/>
  <text class="small" x="693.4" y="452.0" text-anchor="middle">16</text>
  <line class="grid" x1="102.0" y1="394.1" x2="108.0" y2="394.1"/>
  <text class="small" x="98.0" y="398.1" text-anchor="end">0.32</text>
  <line class="grid" x1="102.0" y1="373.9" x2="108.0" y2="373.9"/>
  <text class="small" x="98.0" y="377.9" text-anchor="end">0.50</text>
  <line class="grid" x1="102.0" y1="250.4" x2="108.0" y2="250.4"/>
  <text class="small" x="98.0" y="254.4" text-anchor="end">1.60</text>
  <polyline class="lineg" points="144.6,427.8 181.2,425.5 217.8,423.3 254.4,421.0 290.9,418.8 327.5,416.5 364.1,414.3 400.7,412.0 437.3,409.8 473.9,407.6 510.5,405.3 547.1,403.1 583.6,400.8 620.2,398.6 656.8,396.3 693.4,394.1" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline class="lineb" points="144.6,418.8 181.2,407.6 217.8,396.3 254.4,385.1 290.9,373.9 327.5,362.7 364.1,351.4 400.7,340.2 437.3,329.0 473.9,317.8 510.5,306.6 547.1,295.3 583.6,284.1 620.2,272.9 656.8,261.7 693.4,250.4" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="doty" r="6" cx="547.0999755859375" cy="295.29998779296875"/>
  <text class="ok" x="327.5" y="368.3">只算转换 20 µs</text>
  <text class="hi" x="327.5" y="278.5">稳定 80 + 转换 20</text>
  <text class="small" x="24" y="528">80 µs、20 µs 是示意，不是某一颗 AFE 手册里的建立时间。换芯片只换这两个数，直线形状不变。</text>
</svg>
