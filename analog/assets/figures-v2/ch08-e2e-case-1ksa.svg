<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1448 1086" role="img" aria-labelledby="title desc" data-print-width-mm="138" data-composition="technical-overlay-v1" data-base-medium="python-svg"><title id="title">1kSa/s 采样保持五步走查</title><desc id="desc">五步走查 1kSa/s 记录仪：单电源家族、1MΩ 负载下 0.005%、10nF C0G、8.3τ≈104µs 远小于 1ms、2nA 漏流 1ms 掉 0.4LSB；每步都标“过”。</desc><rect width="1448" height="1086" fill="#e2d9cf" /><g id="paper-illustration"><path data-paper-shadow="true" transform="translate(8 12)" d="M194,196 L699.98,194 L1373,197 L1376,614.66 L1373,930 L640.6800000000001,932 L190,928 Z" fill="#535453" opacity="0.08" /><path data-paper-shadow="true" transform="translate(4 7)" d="M194,196 L699.98,194 L1373,197 L1376,614.66 L1373,930 L640.6800000000001,932 L190,928 Z" fill="#535453" opacity="0.12" /><path data-paper-shadow="true" transform="translate(2 3)" d="M194,196 L699.98,194 L1373,197 L1376,614.66 L1373,930 L640.6800000000001,932 L190,928 Z" fill="#535453" opacity="0.15" /><path d="M194,196 L699.98,194 L1373,197 L1376,614.66 L1373,930 L640.6800000000001,932 L190,928 Z" fill="#f6f2ed" stroke="#c4b9ab" stroke-width="1.4" /><path d="M196,198L1369,199" fill="none" stroke="#ffffff" stroke-width="2" opacity=".7" /><path d="M208,208 L1360,210 L1362,916 L210,918 Z" fill="none" stroke="#c4b9ab" stroke-width="2" opacity=".55" />
