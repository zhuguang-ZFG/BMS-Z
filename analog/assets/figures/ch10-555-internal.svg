<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">555 无稳态：内部框图与充放电波形对照</title>
<desc id="figDesc">左图：555 内部框图——三只 5kΩ 电阻分压出 2/3VCC=6V 与 1/3VCC=3V 两个阈值，比较器 A 监视 6 脚、比较器 B 监视 2 脚，输出送进 RS 触发器；Q 驱动 3 脚输出，Q̅ 控制 7 脚对地的放电管。外部 R1=1kΩ、R2=6.8kΩ、C=100nF 串在 VCC 与地之间，7 脚接 R1-R2 中点、6 脚与 2 脚并接在电容上端；青色虚线箭头为充电路径（经 R1+R2），琥珀色虚线箭头为放电路径（只经 R2 进 7 脚）。右图：Vc 在 3V 与 6V 之间指数充放电，输出同步方波；t_H=0.693(R1+R2)C≈541µs 为高电平，t_L=0.693·R2·C≈471µs 为低电平，周期 1012µs、f≈990Hz、占空比≈53%。底部说明 ln2 的来历（阈值与充电目标同挂一条分压链，VCC 被约掉）与上电首拍偏长约 1.6 倍。</desc>
<rect width="960" height="640" fill="#fffdf8"/>

<defs>
<marker id="arrowInk" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 z" fill="#14213d"/></marker>
<marker id="arrowTeal" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 z" fill="#0f766e"/></marker>
<marker id="arrowAmber" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 z" fill="#b45309"/></marker>
</defs>

<text x="36" y="46" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="27" font-weight="700" fill="#14213d">555 无稳态：框图与波形对上了</text>
<text x="36" y="74" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="14" fill="#52606d">R1=1kΩ · R2=6.8kΩ · C=100nF · VCC=9V —— 充电走 R1+R2、放电只走 R2，占空比因此 &gt;50%</text>
<line x1="36" y1="92" x2="924" y2="92" stroke="#14213d" stroke-width="2"/>

<!-- left panel: internal structure -->
<g transform="rotate(-0.5 253 318)">
