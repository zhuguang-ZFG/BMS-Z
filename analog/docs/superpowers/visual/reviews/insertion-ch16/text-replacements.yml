changes:
- id: ch16-instrument-trust
  source: docs/p4-01-ch16.md#16.3
  before: 还有两类仪器自身的坑，表里装不下，单独记。**万用表自动量程**在跳变信号上会来回换档，读数迟迟稳定不下来，急的时候手动定档更快；**电流档的压降**（burden voltage）在小电流档位上足以改变被测电路的工作点。示例仪表的
    µA 档内阻取 100Ω、mA 档取 2Ω（仅作压降演算，实际档位查手册）。测 100mA 时，2Ω 就产生 0.2V 压降。测待机电流要么接受这个压降并把它算进结论，要么改用"测小电阻两端压降"的间接法。示波器侧也有一条常被遗忘：**一台示波器的所有通道共地**。两只探头地夹分别夹在不同电位上，等于拿示波器的内部地线把这两点短接：轻则波形全乱，重则烧掉被测板。多通道测量时，所有地夹必须夹同一个地。
  after: 图中用示例内阻解释仪表的负担电压：µA 档 100Ω、mA 档 2Ω，100mA 流过 2Ω 产生 0.2V；实际以仪表手册为准。跳变量用手动量程减少等待；待机电流也可测已知小电阻压降，并计入它对工作点的影响。普通台式示波器的各通道通常共地，地夹必须接同一安全参考地，不能用两只地夹连接不同电位。
  caption: 先检查测量链，再相信读数。右栏内阻仅为压降算例，不是所有万用表的规格。
  removed_prose_chars: 167
  relationship: replaces-text
- id: ch16-probe-compensation
  source: docs/p4-01-ch16.md#16.6
  before: 无源 ×10 探头先接机身校准方波：欠补偿时上升沿圆钝、缓慢趋近平顶；过补偿时顶角过冲后回落；正确补偿呈方角平顶。校准只校正探头与该通道的补偿匹配，不能消除长地线的电感，也不能代替全带宽验证。
  after: 用已知方波调补偿，三种形状见图。补偿匹配不消除地线电感，也不保证全带宽性能；每次换通道或探头后重新检查。
  caption: 同一方波的三种补偿状态：过补偿先过冲再回落，欠补偿圆钝上升，正确补偿方角平顶。定性示意，不标时间刻度。
  removed_prose_chars: 42
  relationship: replaces-text
- id: ch16-bandwidth-five
  source: docs/p4-01-ch16.md#16.6
  before: 落笔前再查三件事：幅度是否落在有效量程内；换探头或通道后特征是否还在；测得的时间常数是否符合电路模型。记录测量带宽，不能把仪器滤掉的现象写成“电路没有”。
  after: 落笔前核对量程、换探头/通道复测、比较电路时间常数，并记录测量带宽。
  caption: 五倍带宽规则只在给定模型下估算正弦幅值误差；不能据此保证任意边沿与振铃不失真。
  removed_prose_chars: 43
  relationship: replaces-text
- id: ch16-record-card
  source: docs/p4-01-ch16.md#16.9
  before: 记录表不是流程负担。它是一张索引。三个月后板子再坏，你能从这一页迅速想起当时查过什么、排除过什么、为什么那样修。下面这张表按"一页纸"设计，字段不多，但每个都对应五步法里的一个动作。最好在排故开始时就摊开，而不是修完再补；症状、复现条件、测量值都是当场最清楚，等板子修好再回忆，细节往往已经被"结论"改写过一遍。
  after: 记录表是现场证据的索引。按图中“现场—推演—收口”三栏组织，从排故开始就记症状、条件和测量值；交接时让下一位工程师看清哪些假设已证伪、哪些实验还没做。
  caption: 一页纸排故记录表：一张能接上的索引。记录不是给领导看的，是给三个月后的自己；超过一页，通常说明问题还没想清楚
  removed_prose_chars: 81
  relationship: replaces-text
- id: ch16-postmortem-split
  source: docs/p4-01-ch16.md#16.8
  before: 复盘不是追责会。把"谁没看走线""谁改的钢网"写在记录里，除了让人下次不敢说话，对防再发没有半点帮助。要追的是机制：为什么换料评审没覆盖环路稳定性？为什么布局评审没检查晶振与 SW 的间距？为什么钢网开口改了却没留档？机制补上，换谁来都不会再犯；机制不补，换谁都会再犯。记录也一样：把名字拿掉，把机制留下来。
  after: 复盘追查评审与工艺机制：换料是否核过环路，布局是否检查晶振与 SW 耦合，钢网变更是否留档。把修正落实到规则、测试工况与回归用例，保留责任人与完成日期。
  caption: 复盘先把“根因”和“触发条件”分开。根因是本来就存在的缺陷；触发条件只是把它暴露出来的那阵风
  removed_prose_chars: 78
  relationship: replaces-text
