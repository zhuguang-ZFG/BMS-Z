<path d="M310 140 Q350.00 140.35 390 140" fill="none" stroke="#37424e" stroke-width="2.5"/>
<text x="330" y="126" font-size="11" font-weight="bold" fill="#1f5d7a">去 ADC</text>
<circle cx="350" cy="140" r="3.5" fill="#37424e"/>
<path d="M350 140 Q350.15 162.50 350 185" fill="none" stroke="#37424e" stroke-width="2"/>
<path d="M350 185 Q297.00 185.42 244 185" fill="none" stroke="#37424e" stroke-width="2"/>
