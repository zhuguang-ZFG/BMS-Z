<text x="480" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b">虚短探针：沿反馈回路核对读数</text>
<text x="480" y="54" text-anchor="middle" font-size="12.5" fill="#5b666f">两输入相差 8mV，还要核前提、算误差、看输出</text>
<rect x="56" y="92" width="564" height="410" rx="12" fill="#f6eedb" stroke="#c9bb9d" stroke-width="1.6"/>
<text x="80" y="126" font-size="22" fill="#37424e">反相级：按原理图核对</text>
<polygon points="320,245 320,365 490,305" fill="#fdf8ea" stroke="#37424e" stroke-width="2.4"/>
<line x1="80" y1="275" x2="150" y2="275" stroke="#16202b" stroke-width="2.4"/>
<rect x="150" y="259" width="70" height="32" fill="#fdf8ea" stroke="#16202b" stroke-width="2"/>
<line x1="220" y1="275" x2="320" y2="275" stroke="#16202b" stroke-width="2.4"/>
<text x="80" y="244" font-size="22" fill="#37424e">信号</text>
<text x="160" y="320" font-size="22" fill="#37424e">Rin</text>
<line x1="80" y1="335" x2="320" y2="335" stroke="#16202b" stroke-width="2.4"/>
<text x="80" y="372" font-size="22" fill="#37424e">参考点</text>
<text x="335" y="282" font-size="22" font-weight="bold" fill="#16202b">−</text>
<text x="335" y="344" font-size="22" font-weight="bold" fill="#16202b">+</text>
<text x="382" y="312" font-size="22" fill="#5b666f">运放</text>
<text x="246" y="306" font-size="22" fill="#1f5d7a">V−</text>
<text x="270" y="372" font-size="22" fill="#a8321f">V+</text>
<line x1="490" y1="305" x2="592" y2="305" stroke="#16202b" stroke-width="2.4"/>
<text x="510" y="340" font-size="22" fill="#37424e">Vout</text>
<polyline points="562,305 562,180 460,180" fill="none" stroke="#3d6b4a" stroke-width="2.6"/>
<rect data-component="Rf" x="390" y="164" width="70" height="32" fill="#fdf8ea" stroke="#3d6b4a" stroke-width="2.2"/>
<polyline points="390,180 270,180 270,275" fill="none" stroke="#3d6b4a" stroke-width="2.6"/>
<circle cx="562" cy="305" r="4" fill="#3d6b4a"/>
<circle cx="270" cy="275" r="4" fill="#3d6b4a"/>
<text x="350" y="224" font-size="22" fill="#3d6b4a">Rf：先核通断</text>
<text x="80" y="438" font-size="22" fill="#16202b">回路按原理图示意，通断尚需核对。</text>
<text x="80" y="476" font-size="22" fill="#16202b">先量供电、输出，再读输入压差。</text>
<rect x="644" y="92" width="280" height="190" rx="12" fill="#f6eedb" stroke="#c9bb9d" stroke-width="1.6"/>
<text x="666" y="126" font-size="22" font-weight="bold" fill="#37424e">万用表：同一工况</text>
<g data-beat="认脚" opacity="0"><text x="666" y="172" font-size="24" font-weight="bold" fill="#5b666f">V−：—</text>
<text x="666" y="220" font-size="24" font-weight="bold" fill="#5b666f">V+：—</text><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="0s" dur="0.45s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="1.5s" dur="0.4s" fill="freeze"/></g>
<g data-beat="量V-" opacity="0"><circle cx="300" cy="275" r="9" fill="#e6eff3" stroke="#1f5d7a" stroke-width="2"/>
<text x="666" y="172" font-size="24" font-weight="bold" fill="#1f5d7a">V−：2.500V</text>
<text x="666" y="220" font-size="24" font-weight="bold" fill="#5b666f">V+：—</text><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="1.5s" dur="0.45s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="3s" dur="0.4s" fill="freeze"/></g>
<g data-beat="量V+" opacity="0"><circle cx="300" cy="335" r="9" fill="#f6e7e1" stroke="#a8321f" stroke-width="2"/>
<text x="666" y="172" font-size="24" font-weight="bold" fill="#1f5d7a">V−：2.500V</text>
<text x="666" y="220" font-size="24" font-weight="bold" fill="#a8321f">V+：2.508V</text><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="3s" dur="0.45s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="4.5s" dur="0.4s" fill="freeze"/></g>
<g data-beat="算压差" opacity="0"><text x="666" y="172" font-size="24" font-weight="bold" fill="#1f5d7a">V−：2.500V</text>
<text x="666" y="220" font-size="24" font-weight="bold" fill="#a8321f">V+：2.508V</text>
<rect x="644" y="304" width="280" height="158" rx="12" fill="#f7eedb" stroke="#a4630f" stroke-width="1.8"/>
<text x="666" y="338" font-size="22" fill="#a4630f">两次读数相减</text>
<text x="666" y="376" font-size="22" fill="#16202b">2.508 − 2.500</text>
<text x="666" y="422" font-size="26" font-weight="bold" fill="#a4630f">= 8mV（读数）</text><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="4.5s" dur="0.45s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="6s" dur="0.4s" fill="freeze"/></g>
<g data-beat="判读" opacity="0"><text x="666" y="172" font-size="24" font-weight="bold" fill="#1f5d7a">V−：2.500V</text>
<text x="666" y="220" font-size="24" font-weight="bold" fill="#a8321f">V+：2.508V</text>
<rect x="644" y="304" width="280" height="158" rx="12" fill="#f7eedb" stroke="#a4630f" stroke-width="1.8"/>
<text x="666" y="338" font-size="22" fill="#a4630f">两次读数相减</text>
<text x="666" y="376" font-size="22" fill="#16202b">2.508 − 2.500</text>
<text x="666" y="422" font-size="26" font-weight="bold" fill="#a4630f">= 8mV（读数）</text>
<rect x="56" y="530" width="868" height="250" rx="12" fill="#f7eedb" stroke="#a4630f" stroke-width="2"/>
<text x="80" y="568" font-size="26" font-weight="bold" fill="#a4630f">8mV 是线索，不是通用合格线</text>
<text x="80" y="610" font-size="22" fill="#16202b">先核供电、共模与输出摆幅；负反馈是否闭合？</text>
<text x="80" y="648" font-size="22" fill="#16202b">再按失调、开环增益和仪器误差估算应有压差。</text>
<text x="80" y="686" font-size="22" fill="#16202b">最后看小信号能否沿反馈规律传到输出。</text>
<text x="80" y="738" font-size="22" font-weight="bold" fill="#a8321f">输入接近，不等于增益正确，也不能排除振荡。</text><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="6s" dur="0.45s" fill="freeze"/></g>
<rect x="24" y="796" width="912" height="34" rx="9" fill="#f7eedb" stroke="#c9bb9d" stroke-width="1.2"/>
<g data-caption="认脚" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="0s" dur="0.2s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="1.3s" dur="0.2s" fill="freeze"/><text x="480" y="820" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f5d7a">先沿原理图核对负反馈，再量输入端与输出工况</text></g>
<g data-caption="量V-" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="1.5s" dur="0.2s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="2.8s" dur="0.2s" fill="freeze"/><text x="480" y="820" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f5d7a">同一静态工况：表笔落 V-，读数 2.500V</text></g>
<g data-caption="量V+" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="3s" dur="0.2s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="4.3s" dur="0.2s" fill="freeze"/><text x="480" y="820" text-anchor="middle" font-size="13" font-weight="bold" fill="#a8321f">保持工况不变：表笔落 V+，读数 2.508V</text></g>
<g data-caption="算压差" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="4.5s" dur="0.2s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="5.8s" dur="0.2s" fill="freeze"/><text x="480" y="820" text-anchor="middle" font-size="13" font-weight="bold" fill="#a4630f">2.508 − 2.500 = 8mV：先记读数，不急着判合格</text></g>
<g data-caption="判读" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="6s" dur="0.2s" fill="freeze"/><text x="480" y="820" text-anchor="middle" font-size="13" font-weight="bold" fill="#a4630f">小压差只是线索；核前提、算误差、再看输出响应</text></g>
