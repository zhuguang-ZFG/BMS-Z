dur="10s" repeatCount="indefinite"/></rect><text x="400" y="520" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1f5d7a" opacity="0">③ 唯一能自己刹住车的是负反馈：Re 把 I_C 的增量变成 V_BE 的减量<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.54;0.6;0.78;0.84;1" dur="10s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.84;0.9;1" dur="10s" repeatCount="indefinite"/><rect x="109.1" y="506.9" width="581.9" height="24.1" rx="12.0" fill="#3d6b4a" fill-opacity="0.09" stroke="#3d6b4a" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.84;0.9;1" dur="10s" repeatCount="indefinite"/></rect><text x="400" y="520" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#3d6b4a" opacity="0">④ 实战三招：射极电阻、散热片降 Rth、降额使用——别再靠「应该不会那么热」<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.84;0.9;1" dur="10s" repeatCount="indefinite"/></text></g><g opacity="0">
