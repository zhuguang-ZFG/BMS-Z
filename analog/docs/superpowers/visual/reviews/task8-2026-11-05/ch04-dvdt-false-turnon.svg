<polygon class="marker-wash" points="42.6,22.7 226.8,20.7 644.1,25.0 647.0,64.3 247.7,64.6 44.1,64.7" fill="#a4630f" opacity="0.13"/>
<text x="52" y="58" font-size="38" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">半桥直通：栅极是被 dv/dt 灌开的</text><text x="52" y="94" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">上管开通把开关节点拉向母线，下管的 Cgd 把位移电流灌进自己的栅极。</text>
<rect x="50" y="130" width="430" height="290" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<rect class="ink-echo" x="50" y="130" width="430" height="290" rx="6" stroke="#37424e" stroke-width="2" fill="none" opacity="0.32" transform="translate(1.46 -0.92) rotate(-0.00 265.0 275.0)"/>
<text x="74" y="172" font-size="24" fill="#a8321f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">位移电流怎么来的</text>
<path d="M150 210 Q150.63 250.00 150 290" fill="none" stroke="#37424e" stroke-width="3"/>
<path d="M150 290 Q150.51 335.00 150 380" fill="none" stroke="#37424e" stroke-width="3"/>
<text x="166" y="226" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">上管开通</text>
<path d="M200 290 Q249.75 264.51 300 240" fill="none" stroke="#a8321f" stroke-width="2.5" stroke-linecap="round"/><polygon points="300,240 290,235 290,245" fill="#a8321f"/>
<text x="312" y="236" font-size="24" fill="#a8321f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">20V/ns</text>
<text x="166" y="320" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">下管本该关断</text>
<path d="M300 300 Q299.74 320.00 300 340" fill="none" stroke="#1f5d7a" stroke-width="4"/>
<path d="M314 300 Q314.22 320.00 314 340" fill="none" stroke="#1f5d7a" stroke-width="4"/>
<text x="330" y="326" font-size="22" fill="#1f5d7a" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">Crss 50pF</text>
<text x="74" y="400" font-size="22" fill="#a8321f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">50pF × 20V/ns 给出 1A 瞬态电流</text>
<rect x="520" y="130" width="430" height="290" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<rect class="ink-echo" x="520" y="130" width="430" height="290" rx="6" stroke="#37424e" stroke-width="2" fill="none" opacity="0.32" transform="translate(-1.04 -0.63) rotate(-0.10 735.0 275.0)"/>
<text x="544" y="172" font-size="24" fill="#a4630f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">这 1A 落在哪</text>
<text x="544" y="216" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">关断回路阻抗 10Ω</text>
<text x="544" y="254" font-size="24" fill="#a8321f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">压降可达 10V 量级</text>
<text x="544" y="292" font-size="22" fill="#a8321f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">足以把管子重新打开</text>
<path d="M544 312 Q735.00 311.73 926 312" fill="none" stroke="#c9bb9d" stroke-width="2"/>
<text x="544" y="350" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">更保守的上界用电容分压估</text>
<text x="544" y="388" font-size="22" fill="#a4630f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">400V × 50pF/(50+1000)pF ≈ 19V</text>
<text x="544" y="414" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">实际 Crss 随 VDS 升高急剧缩小</text>
<rect x="50" y="446" width="900" height="114" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<rect class="ink-echo" x="50" y="446" width="900" height="114" rx="6" stroke="#37424e" stroke-width="2" fill="none" opacity="0.32" transform="translate(1.11 -0.97) rotate(0.02 500.0 503.0)"/>
<text x="76" y="486" font-size="24" fill="#3d6b4a" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">对策三条：减小关断回路阻抗、负压关断、选带米勒钳位的驱动器。</text>
<text x="76" y="522" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">余量必须按最高结温下的 VTH 核对——结温越高，门槛越低。</text>
<text x="76" y="550" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">米勒钳位的做法是低电平时把栅极短接到源。</text>
<text x="500" y="622" font-size="22" fill="#a4630f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="middle">方向明确：dv/dt 越陡，灌进栅极的电流越大。</text>
</svg>
