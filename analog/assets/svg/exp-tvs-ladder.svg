<svg xmlns="http://www.w3.org/2000/svg" width="800" height="680" viewBox="0 0 800 680" role="img" aria-labelledby="ttl">
<title id="ttl">接口防护三级削减：TVS → 电阻 → 钳位</title>
<desc>接口防护三级削减：TVS → 电阻 → 钳位</desc>
<defs>
