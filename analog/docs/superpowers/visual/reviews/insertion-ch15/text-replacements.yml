- id: ch15-trace-drop
  source: docs/p3-02-ch15.md#15.1
  before: 一条 8 cm 的 3.3 V 供电走线给 300 mA 负载供电：$\Delta V=8\ \mathrm{m\Omega}\times0.3\ \mathrm{A}=2.4\ \mathrm{mV}$，看似无碍。但同一负载瞬态电流若
    1 A，压降 8 mV 叠在地和电源两侧，对参考电压敏感的电路（如用 3.3 V 当 ADC 基准）直接损失精度。
