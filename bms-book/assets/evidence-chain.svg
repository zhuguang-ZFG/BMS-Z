<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 296" width="960" height="296" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">
  <title id="title">BMS 的证据链：现象、测量、模型、判定、动作、记录、签字七个环节依次相连</title>
  <desc id="desc">七个环节各带步骤徽章一到七，每格内列三问：输入是什么、错了会怎样、谁能复算。底部醒目注：断在哪一环，结论就停在哪一环。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#626d65"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="296" fill="#fffdf5"/>
  <text x="24" y="36" font-size="19" font-weight="800" fill="#293b3a" letter-spacing="0.5px">BMS 的证据链：七环缺一不可</text>

  <!-- ① 现象 -->
  <g>
    <rect x="12" y="56" width="120" height="140" rx="10" fill="#e4f0df" stroke="#176b73" stroke-width="2"/>
    <circle cx="12" cy="56" r="13" fill="#176b73"/>
    <text x="12" y="61" font-size="14.5" font-weight="800" fill="#fffdf5" text-anchor="middle" letter-spacing="0.3px">1</text>
    <text x="72" y="94" font-size="15.5" font-weight="800" fill="#176b73" text-anchor="middle" letter-spacing="0.3px">现象</text>
    <text x="72" y="118" font-size="12.5" fill="#626d65" text-anchor="middle" letter-spacing="0.3px">电压跳变 / 温升</text>
    <text x="72" y="144" font-size="12.5" fill="#626d65" text-anchor="middle" letter-spacing="0.3px">输入是什么？</text>
    <text x="72" y="164" font-size="12.5" fill="#626d65" text-anchor="middle" letter-spacing="0.3px">错了会怎样？</text>
    <text x="72" y="184" font-size="12.5" fill="#626d65" text-anchor="middle" letter-spacing="0.3px">谁能复算？</text>
  </g>
  <!-- ② 测量 -->
  <g>
    <rect x="148" y="56" width="120" height="140" rx="10" fill="#e4f0df" stroke="#377b60" stroke-width="2"/>
    <circle cx="148" cy="56" r="13" fill="#377b60"/>
    <text x="148" y="61" font-size="14.5" font-weight="800" fill="#fffdf5" text-anchor="middle" letter-spacing="0.3px">2</text>
    <text x="208" y="94" font-size="15.5" font-weight="800" fill="#377b60" text-anchor="middle" letter-spacing="0.3px">测量</text>
    <text x="208" y="118" font-size="12.5" fill="#626d65" text-anchor="middle" letter-spacing="0.3px">谁量的 / 几次</text>
    <text x="208" y="144" font-size="12.5" fill="#626d65" text-anchor="middle" letter-spacing="0.3px">输入是什么？</text>
    <text x="208" y="164" font-size="12.5" fill="#626d65" text-anchor="middle" letter-spacing="0.3px">错了会怎样？</text>
    <text x="208" y="184" font-size="12.5" fill="#626d65" text-anchor="middle" letter-spacing="0.3px">谁能复算？</text>
  </g>
  <!-- ③ 模型 -->
  <g>
    <rect x="284" y="56" width="120" height="140" rx="10" fill="#f6e2df" stroke="#7c648e" stroke-width="2"/>
    <circle cx="284" cy="56" r="13" fill="#7c648e"/>
    <text x="284" y="61" font-size="14.5" font-weight="800" fill="#fffdf5" text-anchor="middle" letter-spacing="0.3px">3</text>
    <text x="344" y="94" font-size="15.5" font-weight="800" fill="#7c648e" text-anchor="middle" letter-spacing="0.3px">模型</text>
    <text x="344" y="118" font-size="12.5" fill="#626d65" text-anchor="middle" letter-spacing="0.3px">预测 / 参数</text>
    <text x="344" y="144" font-size="12.5" fill="#626d65" text-anchor="middle" letter-spacing="0.3px">输入是什么？</text>
    <text x="344" y="164" font-size="12.5" fill="#626d65" text-anchor="middle" letter-spacing="0.3px">错了会怎样？</text>
    <text x="344" y="184" font-size="12.5" fill="#626d65" text-anchor="middle" letter-spacing="0.3px">谁能复算？</text>
  </g>
  <!-- ④ 判定 -->
  <g>
    <rect x="420" y="56" width="120" height="140" rx="10" fill="#fbefc7" stroke="#926717" stroke-width="2"/>
    <circle cx="420" cy="56" r="13" fill="#926717"/>
    <text x="420" y="61" font-size="14.5" font-weight="800" fill="#fffdf5" text-anchor="middle" letter-spacing="0.3px">4</text>
    <text x="480" y="94" font-size="15.5" font-weight="800" fill="#926717" text-anchor="middle" letter-spacing="0.3px">判定</text>
    <text x="480" y="118" font-size="12.5" fill="#626d65" text-anchor="middle" letter-spacing="0.3px">阈值 / 延时</text>
    <text x="480" y="144" font-size="12.5" fill="#626d65" text-anchor="middle" letter-spacing="0.3px">输入是什么？</text>
    <text x="480" y="164" font-size="12.5" fill="#626d65" text-anchor="middle" letter-spacing="0.3px">错了会怎样？</text>
    <text x="480" y="184" font-size="12.5" fill="#626d65" text-anchor="middle" letter-spacing="0.3px">谁能复算？</text>
  </g>
  <!-- ⑤ 动作 -->
  <g>
    <rect x="556" y="56" width="120" height="140" rx="10" fill="#f6e2df" stroke="#b84745" stroke-width="2"/>
    <circle cx="556" cy="56" r="13" fill="#b84745"/>
    <text x="556" y="61" font-size="14.5" font-weight="800" fill="#fffdf5" text-anchor="middle" letter-spacing="0.3px">5</text>
    <text x="616" y="94" font-size="15.5" font-weight="800" fill="#b84745" text-anchor="middle" letter-spacing="0.3px">动作</text>
    <text x="616" y="118" font-size="12.5" fill="#626d65" text-anchor="middle" letter-spacing="0.3px">断口 / 限流</text>
    <text x="616" y="144" font-size="12.5" fill="#626d65" text-anchor="middle" letter-spacing="0.3px">输入是什么？</text>
    <text x="616" y="164" font-size="12.5" fill="#626d65" text-anchor="middle" letter-spacing="0.3px">错了会怎样？</text>
    <text x="616" y="184" font-size="12.5" fill="#626d65" text-anchor="middle" letter-spacing="0.3px">谁能复算？</text>
  </g>
  <!-- ⑥ 记录 -->
  <g>
    <rect x="692" y="56" width="120" height="140" rx="10" fill="#e4f0df" stroke="#377b60" stroke-width="2"/>
    <circle cx="692" cy="56" r="13" fill="#377b60"/>
    <text x="692" y="61" font-size="14.5" font-weight="800" fill="#fffdf5" text-anchor="middle" letter-spacing="0.3px">6</text>
    <text x="752" y="94" font-size="15.5" font-weight="800" fill="#377b60" text-anchor="middle" letter-spacing="0.3px">记录</text>
    <text x="752" y="118" font-size="12.5" fill="#626d65" text-anchor="middle" letter-spacing="0.3px">原始数据 / 版本</text>
    <text x="752" y="144" font-size="12.5" fill="#626d65" text-anchor="middle" letter-spacing="0.3px">输入是什么？</text>
    <text x="752" y="164" font-size="12.5" fill="#626d65" text-anchor="middle" letter-spacing="0.3px">错了会怎样？</text>
    <text x="752" y="184" font-size="12.5" fill="#626d65" text-anchor="middle" letter-spacing="0.3px">谁能复算？</text>
  </g>
  <!-- ⑦ 签字 -->
  <g>
    <rect x="828" y="56" width="120" height="140" rx="10" fill="#e4f0df" stroke="#176b73" stroke-width="2"/>
    <circle cx="828" cy="56" r="13" fill="#176b73"/>
    <text x="828" y="61" font-size="14.5" font-weight="800" fill="#fffdf5" text-anchor="middle" letter-spacing="0.3px">7</text>
    <text x="888" y="94" font-size="15.5" font-weight="800" fill="#176b73" text-anchor="middle" letter-spacing="0.3px">签字</text>
    <text x="888" y="118" font-size="12.5" fill="#626d65" text-anchor="middle" letter-spacing="0.3px">谁签的</text>
    <text x="888" y="144" font-size="12.5" fill="#626d65" text-anchor="middle" letter-spacing="0.3px">输入是什么？</text>
    <text x="888" y="164" font-size="12.5" fill="#626d65" text-anchor="middle" letter-spacing="0.3px">错了会怎样？</text>
    <text x="888" y="184" font-size="12.5" fill="#626d65" text-anchor="middle" letter-spacing="0.3px">谁能复算？</text>
  </g>

  <g stroke="#626d65" stroke-width="2" marker-end="url(#arrow)">
    <line x1="135" y1="126" x2="145" y2="126"/>
    <line x1="271" y1="126" x2="281" y2="126"/>
    <line x1="407" y1="126" x2="417" y2="126"/>
    <line x1="543" y1="126" x2="553" y2="126"/>
    <line x1="679" y1="126" x2="689" y2="126"/>
    <line x1="815" y1="126" x2="825" y2="126"/>
  </g>

  <text x="480" y="226" font-size="13.5" fill="#626d65" text-anchor="middle" letter-spacing="0.3px">每一格都要能回答：输入是什么、错了会怎样、谁能复算。</text>
  <rect x="12" y="242" width="936" height="42" rx="8" fill="#223333"/>
  <text x="480" y="269" font-size="16.5" font-weight="800" fill="#edf0e5" text-anchor="middle" letter-spacing="0.3px">断在哪一环，结论就停在哪一环。</text>
</svg>
