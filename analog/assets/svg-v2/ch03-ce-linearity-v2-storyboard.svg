<text x="36" y="610" font-size="22" fill="#2a2927" text-anchor="start">③ 8 Vpp 来自轨道余量；不能据此保证低失真。</text>
<text x="36" y="650" font-size="22" fill="#2a2927" text-anchor="start">④ 减小输入或增加负反馈，并按失真要求验收。</text>
<text x="36" y="694" font-size="18" fill="#2a2927" text-anchor="start">示意：VC = 12 − 6 exp(vBE / 26 mV)，下限 2 V。</text>
<text x="36" y="730" font-size="18" fill="#2a2927" text-anchor="start">Q 点：3 mA、RC 2 kΩ、VC 6 V、VE 1.8 V。</text>
<text x="36" y="768" font-size="18" fill="#2a2927" text-anchor="start">固定发射极电位、忽略厄利效应；不替代器件仿真。</text>
