name: tests

on:
  push:
    paths: ["code/**", "docs/**", "README.md", "ruff.toml", ".github/workflows/tests.yml", ".github/scripts/**"]
  pull_request:
    paths: ["code/**", "docs/**", "README.md", "ruff.toml", ".github/workflows/tests.yml", ".github/scripts/**"]

jobs:
  docs-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: SVG count + relative links + code paths
        run: python .github/scripts/check_docs.py

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 只抓 bug，不查格式：规则集与理由见 ruff.toml 顶部注释。
      # 版本钉死——否则 ruff 发新版加了规则，CI 会毫无征兆变红。
      # 升级：本地装同版本跑 `ruff check` 确认全绿，再改这里的 version。
      - uses: astral-sh/ruff-action@v4
        with:
          version: "0.15.21"
          args: check

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/requirements.txt
      - run: pip install -r code/requirements.txt
      - name: soc tests
        working-directory: code/soc
        run: python -m pytest tests/ -q
      - name: protocol tests
        working-directory: code/protocol
        run: python -m pytest tests/ -q
      - name: soc comparison smoke run
        working-directory: code/soc
        run: python compare.py

  c-firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build and run state machine tests
        working-directory: code/firmware
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -o test_bms bms.c test_bms.c
          ./test_bms
