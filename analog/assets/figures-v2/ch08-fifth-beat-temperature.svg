<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1448 1086" role="img" aria-labelledby="title desc" data-print-width-mm="138" data-composition="technical-overlay-v1" data-base-medium="python-svg"><title id="title">第五拍温度与 kT/C 硬币</title><desc id="desc">五行温度动作：R_ON ×1.3~1.5、漏流每 10°C 翻倍、注入随 VTH 漂移、750Ω×10nF 得 21kHz、热噪声等于 kT/C；结论是加大 Chold 而非换低阻开关。</desc><rect width="1448" height="1086" fill="#e2d9cf" /><g id="paper-illustration"><path data-paper-shadow="true" transform="translate(8 12)" d="M68,206 L631.6,204 L1381,207 L1384,605.28 L1381,906 L565.6,908 L64,904 Z" fill="#535453" opacity="0.08" /><path data-paper-shadow="true" transform="translate(4 7)" d="M68,206 L631.6,204 L1381,207 L1384,605.28 L1381,906 L565.6,908 L64,904 Z" fill="#535453" opacity="0.12" /><path data-paper-shadow="true" transform="translate(2 3)" d="M68,206 L631.6,204 L1381,207 L1384,605.28 L1381,906 L565.6,908 L64,904 Z" fill="#535453" opacity="0.15" /><path d="M68,206 L631.6,204 L1381,207 L1384,605.28 L1381,906 L565.6,908 L64,904 Z" fill="#f6f2ed" stroke="#c4b9ab" stroke-width="1.4" /><path d="M70,208L1377,209" fill="none" stroke="#ffffff" stroke-width="2" opacity=".7" /><path d="M82,218 L1368,220 L1370,892 L84,894 Z" fill="none" stroke="#c4b9ab" stroke-width="2" opacity=".55" />
