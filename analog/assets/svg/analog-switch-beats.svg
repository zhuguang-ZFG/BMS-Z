<text x="425" y="314" text-anchor="middle" font-size="13" font-weight="bold" fill="#37424e">一次采样：控制信号 EN 与保持电容电压 V_C（注入台阶放大）</text>
<rect x="80" y="340" width="680" height="118" fill="#e0d3b8" opacity="0.15"/>
<text x="24" y="370" font-size="11" font-weight="bold" fill="#1f5d7a">V_C</text>
