  <circle class="doty" r="6"><animate attributeName="cx" values="108.0;149.5;185.8;222.0;263.5;305.0;341.3;377.5;419.0;460.5;496.8;533.0;574.5;616.0;652.2;688.5;730.0" keyTimes="0.0000;0.0625;0.1250;0.1875;0.2500;0.3125;0.3750;0.4375;0.5000;0.5625;0.6250;0.6875;0.7500;0.8125;0.8750;0.9375;1.0000" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="430.0;430.0;429.8;423.8;350.7;257.5;350.7;420.5;426.4;398.8;345.6;334.5;392.1;425.2;429.7;430.0;430.0" keyTimes="0.0000;0.0625;0.1250;0.1875;0.2500;0.3125;0.3750;0.4375;0.5000;0.5625;0.6250;0.6875;0.7500;0.8125;0.8750;0.9375;1.0000" dur="12s" repeatCount="indefinite"/></circle>
  <text class="small" x="24" y="528">峰位置和高度都是教学高斯，不是某一正负极的 ICA 实验。温度和倍率变了，峰会搬迁。</text>
</svg>
