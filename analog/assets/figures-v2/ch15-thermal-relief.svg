<rect x="60" y="140" width="420" height="420" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<rect class="ink-echo" x="60" y="140" width="420" height="420" rx="6" stroke="#37424e" stroke-width="2" fill="none" opacity="0.32" transform="translate(-1.50 0.92) rotate(0.04 270.0 350.0)"/>
