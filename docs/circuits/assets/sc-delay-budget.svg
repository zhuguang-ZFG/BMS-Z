<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>短路保护分段延时：比较器翻转、栅极抽走、MOS 电流下降。微秒数为示意。</title>
  <desc>示意分段：0 时刻越过门槛，约 2 微秒比较器翻转，约 6 微秒栅压掉下去，约 10 微秒沟道电流断。不是某一颗保护 IC 手册上的典型值。</desc>

  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.5; fill: none; }
    .liney { stroke: #bf8700; stroke-width: 2.5; fill: none; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .dotg { fill: #1a7f37; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    .boxr { fill: #ffebe9; stroke: #cf222e; }
    .boxg { fill: #dafbe1; stroke: #1a7f37; }
    .boxy { fill: #fff8c5; stroke: #bf8700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .dotg { fill: #3fb950; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
      .boxr { fill: #3d1214; stroke: #ff7b72; }
      .boxg { fill: #12261e; stroke: #3fb950; }
      .boxy { fill: #3d2e00; stroke: #d29922; }
    }
  </style>

  <rect class="bg" width="800" height="500"/>

  <text class="title" x="24" y="32">短路：从越过门槛到 MOS 电流掉下来（示意分段）</text>
  <rect class="panel" x="24" y="48" width="752" height="122" rx="6"/>
  <text class="txt" x="40" y="68" opacity="0.28">① t=0<tspan class="small">　电流越过比较器门槛。这一拍还没有软件。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="94" opacity="0.28">② 约 2 µs<tspan class="small">　比较器翻转。和短路时间尺度那张图的示意口径对齐。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="120" opacity="0.28">③ 约 6 µs<tspan class="small">　栅极电荷被抽走，栅压掉到阈值以下。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="146" opacity="0.28">④ 约 10 µs<tspan class="small">　沟道电流掉下来。软件若 1 ms 才轮询，能量大约差两个数量级。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="180" width="752" height="210" rx="6"/>
  <line class="axis" x1="60" y1="340" x2="740" y2="340"/>
  <line class="liner" x1="80.0" y1="340" x2="80.0" y2="318"/>
  <line class="liney" x1="180.0" y1="340" x2="180.0" y2="318"/>
  <line class="lineb" x1="380.0" y1="340" x2="380.0" y2="318"/>
  <line class="lineg" x1="580.0" y1="340" x2="580.0" y2="318"/>
  <path class="liner" d="M80.0 230 L580.0 230 L580.0 310 L680.0 310" stroke-linejoin="round" stroke-linecap="round"/>
  <text class="small" x="40" y="220">沟道电流</text>
  <text class="warn" x="74" y="378">0</text>
  <text class="gold" x="150" y="378">约 2 µs</text>
  <text class="hi" x="340" y="378">约 6 µs</text>
  <text class="ok" x="540" y="378">约 10 µs</text>
  <circle class="doty" r="7">
    <animate attributeName="cx" values="80.0;180.0;380.0;580.0;580.0;680.0" keyTimes="0;0.25;0.5;0.74;0.75;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="230;230;230;230;310;310" keyTimes="0;0.25;0.5;0.74;0.75;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <rect class="panel" x="24" y="400" width="752" height="84" rx="6"/>
  <text class="small" x="40" y="428">约 2 µs 比较器翻转，约 6 µs 栅压掉到阈值下，约 10 µs 沟道电流断。</text>
  <text class="small" x="40" y="452">1 ms 的软件轮询大约晚 100 倍。保护 IC 手册上的短路延时才是你那颗芯片的数。</text>
  <text class="small" x="40" y="474">2 µs、6 µs、10 µs 都是示意分段，不是某份 datasheet 的典型值。</text>

</svg>
