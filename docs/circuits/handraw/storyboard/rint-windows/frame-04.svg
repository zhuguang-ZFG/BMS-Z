<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
<defs>
 <filter id="w" filterUnits="userSpaceOnUse" x="0" y="0" width="960" height="560">
  <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="11" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="4.5" xChannelSelector="R" yChannelSelector="G"/>
 </filter>
 <filter id="grain" filterUnits="userSpaceOnUse" x="0" y="0" width="960" height="560">
  <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="5"/>
  <feColorMatrix type="saturate" values="0"/></filter>
</defs>
<rect width="960" height="560" fill="#f6f1e3"/>
<rect width="960" height="560" filter="url(#grain)" opacity="0.22"/>
<text x="480" y="62" font-family="KaiTi" font-size="20" fill="#003153" text-anchor="middle">更慢的两层：热账与老化漂移</text>
<g class="motion" data-x="1">
<line x1="180" y1="334" x2="900" y2="334" stroke="#003153" stroke-width="1.7" filter="url(#w)"/>
<line x1="180" y1="334" x2="180" y2="325" stroke="#003153" stroke-width="1.3"/>
<text x="180" y="354" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="middle">10⁻⁴</text>
<line x1="245" y1="334" x2="245" y2="325" stroke="#003153" stroke-width="1.3"/>
<text x="245" y="354" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="middle">10⁻³</text>
<line x1="311" y1="334" x2="311" y2="325" stroke="#003153" stroke-width="1.3"/>
<text x="311" y="354" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="middle">10⁻²</text>
<line x1="376" y1="334" x2="376" y2="325" stroke="#003153" stroke-width="1.3"/>
<text x="376" y="354" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="middle">10⁻¹</text>
<line x1="442" y1="334" x2="442" y2="325" stroke="#003153" stroke-width="1.3"/>
<text x="442" y="354" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="middle">1</text>
<line x1="507" y1="334" x2="507" y2="325" stroke="#003153" stroke-width="1.3"/>
<text x="507" y="354" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="middle">10</text>
<line x1="573" y1="334" x2="573" y2="325" stroke="#003153" stroke-width="1.3"/>
<text x="573" y="354" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="middle">10²</text>
<line x1="638" y1="334" x2="638" y2="325" stroke="#003153" stroke-width="1.3"/>
<text x="638" y="354" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="middle">10³</text>
<line x1="704" y1="334" x2="704" y2="325" stroke="#003153" stroke-width="1.3"/>
<text x="704" y="354" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="middle">10⁴</text>
<line x1="769" y1="334" x2="769" y2="325" stroke="#003153" stroke-width="1.3"/>
<text x="769" y="354" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="middle">10⁵</text>
<line x1="835" y1="334" x2="835" y2="325" stroke="#003153" stroke-width="1.3"/>
<text x="835" y="354" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="middle">10⁶</text>
<line x1="900" y1="334" x2="900" y2="325" stroke="#003153" stroke-width="1.3"/>
<text x="900" y="354" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="middle">10⁷</text>
<text x="914" y="354" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="middle">s</text>
<text x="170" y="338" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="end">观察时间</text>
</g>
<g class="motion" data-x="1">
<rect x="180" y="142" width="65" height="15" fill="none" stroke="#003153" stroke-width="1.6" filter="url(#w)"/>
<text x="170" y="155" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="end">仪器能分辨的最快阶跃</text>
<text x="186" y="137" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="start">导体、接触、电解液的快速压降</text>
<text x="251" y="155" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="start" opacity="0.85">R₀ 的一部分</text>
<rect x="245" y="180" width="196" height="15" fill="none" stroke="#003153" stroke-width="1.6" filter="url(#w)"/>
<text x="170" y="193" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="end">毫秒至秒</text>
<text x="251" y="175" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="start">界面反应与双电层</text>
<text x="448" y="193" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="start" opacity="0.85">高频 RC、电荷转移阻力</text>
<rect x="442" y="218" width="223" height="15" fill="none" stroke="#003153" stroke-width="1.6" filter="url(#w)"/>
<text x="170" y="231" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="end">秒至数十分钟</text>
<text x="448" y="213" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="start">固相／电解液扩散</text>
<text x="670" y="231" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="start" opacity="0.85">一个或多个 RᵢCᵢ</text>
<rect x="540" y="256" width="164" height="15" fill="none" stroke="#003153" stroke-width="1.6" filter="url(#w)"/>
<text x="170" y="269" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="end">数十秒至数小时</text>
<text x="546" y="251" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="start">热积累与散热</text>
<text x="710" y="269" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="start" opacity="0.85">热阻–热容网络</text>
<rect x="769" y="294" width="131" height="15" fill="none" stroke="#003153" stroke-width="1.6" filter="url(#w)"/>
<text x="170" y="307" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="end">循环至日历时间</text>
<text x="900" y="289" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="end">容量和阻抗慢慢变化 → 老化参数漂移</text>
</g>
<text x="48" y="512" font-family="KaiTi" font-size="12" fill="#003153">④ 数十秒至数小时是热积累与散热（热阻–热容网络）；循环至日历时间才看见容量和阻抗慢慢变化（老化参数漂移）。</text>
<text x="480" y="546" font-family="KaiTi" font-size="14" opacity="0.8" text-anchor="middle" fill="#003153">原理示意 / 非实拍</text>
</svg>
