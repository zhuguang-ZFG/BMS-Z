name: links

# 外链巡检：PR 改文档时检查 + 每月定时巡检（链接会腐烂，见 README"维护"节）。
# 注意 .lychee.toml 里对反爬站点的 accept/exclude 配置——
# 新增站点若报假死，先去核实再改配置，别顺手把真 404 也洗白。
on:
  push:
    branches: [main]
    paths: ["**/*.md", "**/*.html", ".lychee.toml", ".github/workflows/links.yml"]
  pull_request:
    paths: ["**/*.md", "**/*.html", ".lychee.toml", ".github/workflows/links.yml"]
  schedule:
    - cron: "23 3 5 * *"   # 每月 5 日凌晨（错峰）
  workflow_dispatch:

jobs:
  lychee:
    # 镜像与 action 大版本策略同 tests.yml 顶部注释（Ubuntu 26 迁移 / Node 20 弃用）。
    # lychee-action 是 composite action，不受 Node 版本影响，留在 v2。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # 两轮制：GitHub 的 blob HTML 路由会分钟级抖 503/504（判据正确、无抗性）。
      # 第 1 轮红就等 3 分钟再跑一轮，只有两轮都红才判红——不放宽 accept 表，
      # 5xx 依然算失败，只是不给一次瞬时抖动投票权。第 1 轮绿则第 2 轮整个跳过。
      - name: 链接巡检（第 1 轮）
        id: round1
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          # 卷 I 有自己的巡检 job（域名排除清单不同，见下）；这里把 analog/ 整树
          # 排除，否则卷 I 的 doi.org / ti.com 等条目会按卷 II 的 accept 表误报。
          args: --config .lychee.toml --no-progress --root-dir "${{ github.workspace }}/docs/public" --exclude-path 'analog' --exclude-path 'analog/**' './**/*.md' './**/*.html'
          output: lychee-report-1.md
          fail: true
      - name: 等上游恢复（仅第 1 轮红时）
        if: steps.round1.outcome == 'failure'
        run: |
          echo "::notice::第 1 轮报红，等 180 s 后复跑一轮再定成败"
          sleep 180
      - name: 把第 1 轮的报告挪出扫描范围（仅第 1 轮红时）
        # 两轮共用同一句 glob './**/*.md'，而 lychee-action 把第 1 轮的报告就写在
        # 仓库根——于是第 2 轮会把"上一轮的失败清单"当成一份普通 Markdown 再巡
        # 一遍。run 38059686439 的第 2 轮里，Errors 与 Timeouts 各多出一整节
        # `in lychee-report-1.md`：判红的证据不再是仓库里的文件，而是检查器自己
        # 生成的那张表，而且同一批抖动的 URL 被重复打了两遍。报告挪成点文件
        #（glob 的 * 默认不匹配隐藏项），内容先打进日志，证据不丢。
        if: steps.round1.outcome == 'failure'
        run: |
          echo "—— 第 1 轮报告（挪出 glob 前留档）——"
          cat lychee-report-1.md || echo "（没有报告文件）"
          mv lychee-report-1.md .lychee-report-1.md
      - name: 链接巡检（第 2 轮，红才跑）
        if: steps.round1.outcome == 'failure'
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml --no-progress --root-dir "${{ github.workspace }}/docs/public" --exclude-path 'analog' --exclude-path 'analog/**' './**/*.md' './**/*.html'
          output: lychee-report-2.md
          fail: true

  # 卷 I 外链巡检（迁自 analog/.github/workflows/links.yml）。
  # 排除的域名都是「站点拒机器人」（502/超时，或对数据中心 IP 返回 301→404），
  # 不是链接腐烂：地址保留在 BOOK.md，靠每周巡检人工复核。
  # ti.com 自 2026-11 起对 GitHub Runner 稳定返回 404，浏览器可开。
  # README.md 只是短入口，外链全在 BOOK.md，两个都要巡。
  lychee-analog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,202,204,301,302,403,429
            --timeout 25
            --max-retries 3
            --exclude-loopback
            --exclude 'doi\.org'
            --exclude 'onsemi\.com'
            --exclude 'microchip\.com'
            --exclude 'analog\.com'
            --exclude 'eevblog\.com'
            --exclude 'ti\.com'
            './analog/README.md'
            './analog/BOOK.md'
            './analog/CONTRIBUTORS.md'
            './analog/CONTRIBUTING.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
