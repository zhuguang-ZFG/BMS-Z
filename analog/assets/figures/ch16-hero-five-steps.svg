<text x="240" y="147" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="14" fill="#b45309">②</text>
<text x="262" y="149" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="18" font-weight="700" fill="#14213d">二分定位</text>
<text x="232" y="184" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="13" fill="#52606d">对数收敛</text>
<text x="232" y="206" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="13" fill="#52606d">6 节点最多 3 刀</text>
<text x="232" y="272" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="13" fill="#0f766e">防乱枪</text>

<circle cx="420" cy="142" r="13" fill="#fdf3e3" stroke="#b45309" stroke-width="1.6"/>
<text x="420" y="147" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="14" fill="#b45309">③</text>
