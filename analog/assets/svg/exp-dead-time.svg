<rect x="89" y="374" width="202" height="24" rx="6" fill="#f6eedb" stroke="#a8321f" stroke-width="1"/><text x="190" y="390" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a8321f">推挽图腾柱同一时刻只能一人上岗</text><rect x="400" y="110" width="352" height="58" rx="7" fill="none" stroke="#a4630f" stroke-width="1.8" opacity="0.9"><animate attributeName="y" values="134;192;250;308;308" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/></rect>
<text x="412" y="134" font-size="11.5" font-weight="bold" fill="#a4630f">① 换向瞬间</text><text x="412" y="159" font-size="14.5" font-weight="bold" fill="#16202b">上管未关、下管已开</text><text x="412" y="176" font-size="10.5" fill="#5b666f">电源到地直通短路</text>
<text x="412" y="192" font-size="11.5" font-weight="bold" fill="#a4630f">② 直通电流</text><text x="412" y="217" font-size="14.5" font-weight="bold" fill="#16202b">只受内阻限制，可达数十安</text><text x="412" y="234" font-size="10.5" fill="#5b666f">发热与 EMI 都来了</text><rect x="400" y="168" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.25;0.28;1" dur="14s" repeatCount="indefinite"/></rect>
<text x="412" y="250" font-size="11.5" font-weight="bold" fill="#a4630f">③ 死区</text><text x="412" y="275" font-size="14.5" font-weight="bold" fill="#16202b">先断后合，留几百 ns</text><text x="412" y="292" font-size="10.5" fill="#5b666f">桥臂换向的保命窗</text><rect x="400" y="226" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.5;0.53;1" dur="14s" repeatCount="indefinite"/></rect>
<text x="412" y="308" font-size="11.5" font-weight="bold" fill="#a4630f">④ 代价</text><text x="412" y="333" font-size="14.5" font-weight="bold" fill="#16202b">占空比损失一点点</text><text x="412" y="350" font-size="10.5" fill="#5b666f">换来不炸管</text><rect x="400" y="284" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.75;0.78;1" dur="14s" repeatCount="indefinite"/></rect>
<g><rect x="30" y="612" width="740" height="34.0" rx="9" fill="#e8efe6" stroke="#3d6b4a" stroke-width="1.5" filter="url(#soft)"/><rect x="36" y="619" width="3" height="20.0" rx="1.5" fill="#3d6b4a"/><text x="400" y="634.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3d6b4a">两管同岗 = 电源直灌地。死区让换向「先断后合」，代价只是几纳秒的占空比（5.1/13.7 节）</text></g></svg>