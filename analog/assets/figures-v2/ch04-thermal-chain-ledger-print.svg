<text x="76" y="660" font-size="22" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">雪崩不是免费保险：100 nH × 0.5 A/ns 就是 50 V，直接叠在母线上</text>
