<text x="332" y="272" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a8321f">ΔVc = −A·ΔVb</text>
<path d="M168 300 Q167.81 248.00 168 196" fill="none" stroke="#2f7f96" stroke-width="2.2"/>
<path d="M168 196 Q202.00 195.78 236 196" fill="none" stroke="#2f7f96" stroke-width="2.2"/>
