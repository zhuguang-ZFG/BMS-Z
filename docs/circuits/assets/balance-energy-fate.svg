    <animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.7 0 0.84 0" attributeName="y" values="150;150;182;150" keyTimes="0;0.5;0.85;1" dur="8s" repeatCount="indefinite" />
  </rect>
