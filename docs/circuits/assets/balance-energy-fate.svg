<svg xmlns="http://www.w3.org/2000/svg" width="880" height="530" viewBox="0 0 880 530">
  <title>被动均衡把电变成热，主动均衡把电搬到低节</title>
  <rect width="880" height="530" fill="#f8fafc"/>
  <style>
  text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
  /* 深色模式：GitHub 深色主题下对调底色与文字色，只覆盖配色，不动几何与动画。
     stroke="#fff" 保持白色——那是彩色徽标上的勾选，不在覆盖范围内。 */
  @media (prefers-color-scheme: dark){
  rect[fill="#f8fafc"]{fill:#0f172a}
  rect[fill="#fff"]{fill:#1e293b}
  [fill="#f1f5f9"]{fill:#1e293b}
  [stroke="#f1f5f9"]{stroke:#1e293b}
  [fill="#e2e8f0"]{fill:#334155}
  [stroke="#e2e8f0"]{stroke:#334155}
  [fill="#cbd5e1"]{fill:#475569}
  [stroke="#cbd5e1"]{stroke:#475569}
  [fill="#64748b"]{fill:#94a3b8}
  [stroke="#64748b"]{stroke:#94a3b8}
  [fill="#475569"]{fill:#cbd5e1}
  [stroke="#475569"]{stroke:#cbd5e1}
  [fill="#334155"]{fill:#e2e8f0}
  [stroke="#334155"]{stroke:#e2e8f0}
  [fill="#1e293b"]{fill:#f1f5f9}
  [stroke="#1e293b"]{stroke:#f1f5f9}
  [fill="#dbeafe"]{fill:#1e3a8a}
  [stroke="#dbeafe"]{stroke:#1e3a8a}
  [fill="#eff6ff"]{fill:#172554}
  [stroke="#eff6ff"]{stroke:#172554}
  [fill="#bfdbfe"]{fill:#1e40af}
  [stroke="#bfdbfe"]{stroke:#1e40af}
  [fill="#1d4ed8"]{fill:#60a5fa}
  [stroke="#1d4ed8"]{stroke:#60a5fa}
  [fill="#1e40af"]{fill:#93c5fd}
  [stroke="#1e40af"]{stroke:#93c5fd}
  [fill="#2563eb"]{fill:#60a5fa}
  [stroke="#2563eb"]{stroke:#60a5fa}
  [fill="#3b82f6"]{fill:#60a5fa}
  [stroke="#3b82f6"]{stroke:#60a5fa}
  [fill="#ecfdf5"]{fill:#022c22}
  [stroke="#ecfdf5"]{stroke:#022c22}
  [fill="#a7f3d0"]{fill:#065f46}
  [stroke="#a7f3d0"]{stroke:#065f46}
  [fill="#86efac"]{fill:#166534}
  [stroke="#86efac"]{stroke:#166534}
  [fill="#065f46"]{fill:#6ee7b7}
  [stroke="#065f46"]{stroke:#6ee7b7}
  [fill="#059669"]{fill:#34d399}
  [stroke="#059669"]{stroke:#34d399}
  [fill="#fef2f2"]{fill:#450a0a}
  [stroke="#fef2f2"]{stroke:#450a0a}
  [fill="#fecaca"]{fill:#7f1d1d}
  [stroke="#fecaca"]{stroke:#7f1d1d}
  [fill="#fca5a5"]{fill:#b91c1c}
  [stroke="#fca5a5"]{stroke:#b91c1c}
  [fill="#991b1b"]{fill:#fca5a5}
  [stroke="#991b1b"]{stroke:#fca5a5}
  [fill="#dc2626"]{fill:#f87171}
  [stroke="#dc2626"]{stroke:#f87171}
  [fill="#fffbeb"]{fill:#451a03}
  [stroke="#fffbeb"]{stroke:#451a03}
  [fill="#fef3c7"]{fill:#78350f}
  [stroke="#fef3c7"]{stroke:#78350f}
  [fill="#92400e"]{fill:#fcd34d}
  [stroke="#92400e"]{stroke:#fcd34d}
  [fill="#b45309"]{fill:#fbbf24}
  [stroke="#b45309"]{stroke:#fbbf24}
  }
</style>

  <text x="440" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">能量去哪：左边烧掉，右边搬走</text>
  <rect x="24" y="52" width="400" height="250" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="2">
    <animate attributeName="stroke-width" values="5;2;5" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="224" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">被动：开阀放掉</text>
  <rect x="70" y="110" width="70" height="140" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
  <rect x="78" y="150" width="54" height="92" fill="#2563eb">
    <animate attributeName="height" values="92;40;92" keyTimes="0;0.45;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="y" values="150;202;150" keyTimes="0;0.45;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="105" y="268" text-anchor="middle" font-size="12" fill="#1e293b">高节</text>
  <rect x="200" y="150" width="36" height="70" fill="#fecaca" stroke="#dc2626"/>
  <text x="218" y="242" text-anchor="middle" font-size="12" fill="#991b1b">电阻</text>
  <text x="300" y="140" font-size="13" fill="#dc2626">热量离开电池</text>
  <text x="300" y="164" font-size="13" fill="#334155">电荷没有进别的节</text>
  <circle cy="130" r="5" fill="#dc2626">
    <animate attributeName="cx" values="140;218;300;140" keyTimes="0;0.25;0.45;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.48;0.9;1" dur="8s" repeatCount="indefinite"/>
  </circle>

  <rect x="456" y="52" width="400" height="250" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="2">
    <animate attributeName="stroke-width" values="2;5;2" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="656" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#065f46">主动：搬到矮节</text>
  <rect x="500" y="110" width="70" height="140" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
  <rect x="508" y="150" width="54" height="92" fill="#2563eb">
    <animate attributeName="height" values="92;92;60;92" keyTimes="0;0.5;0.85;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="y" values="150;150;182;150" keyTimes="0;0.5;0.85;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <rect x="700" y="110" width="70" height="140" rx="6" fill="#ecfdf5" stroke="#059669"/>
  <rect x="708" y="190" width="54" height="52" fill="#059669">
    <animate attributeName="height" values="52;52;84;52" keyTimes="0;0.5;0.85;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="y" values="190;190;158;190" keyTimes="0;0.5;0.85;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="535" y="268" text-anchor="middle" font-size="12" fill="#1e293b">高节</text>
  <text x="735" y="268" text-anchor="middle" font-size="12" fill="#1e293b">低节</text>
  <line x1="570" y1="160" x2="700" y2="160" stroke="#059669" stroke-width="3" stroke-dasharray="8 6">
    <animate attributeName="stroke-dashoffset" values="40;0;40" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite"/>
  </line>
  <text x="635" y="150" text-anchor="middle" font-size="12" fill="#065f46">电荷换了一节</text>
  <circle cy="160" r="5" fill="#059669" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.48;0.55;0.85;0.92;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="560;700;560" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite"/>
  </circle>

  <text x="440" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#dc2626" opacity="0">错：主动均衡也是把电烧掉
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.15;0.35;1" dur="8s" repeatCount="indefinite"/>
  </text>
  <text x="440" y="372" text-anchor="middle" font-size="15" fill="#065f46" opacity="0">对：被动进电阻变热；主动交给低的那一节。开关和磁件仍有损耗。
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.45;0.55;1" dur="8s" repeatCount="indefinite"/>
  </text>
  <text x="440" y="414" text-anchor="middle" font-size="13" fill="#475569">示意图。没有同一电流、同一串数的实测效率，不在这张图上写百分数。</text>


  <rect x="24" y="430" width="832" height="86" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="40" y="458" font-size="14" fill="#1e293b">示意账：被动 4.2 V、42 mA、1 小时 ≈ 0.18 Wh 变成热，邻居收到 0。</text>
  <text x="40" y="482" font-size="14" fill="#065f46">主动一拍 ½×10 µH×(2 A)² = 20 µJ。损耗仍在，这张图不写效率百分数。</text>
  <circle cx="820" cy="470" r="6" fill="#b45309">
    <animate attributeName="opacity" values="1;0.2;1" keyTimes="0;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>

</svg>
