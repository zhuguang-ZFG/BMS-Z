<svg xmlns="http://www.w3.org/2000/svg" width="800" height="732" viewBox="0 0 800 732" role="img" aria-labelledby="ttl">
<title id="ttl">CD4051：八路传感器共用一个 ADC</title>
<desc>CD4051：八路传感器共用一个 ADC；节拍：① 三位地址选通一路：8 个传感器轮流接到同一个 ADC——省掉 7 个 ADC；② 通道是双向的：COM 既能输出（送 ADC）、也能输入（做信号分配）；③ 切换瞬间有电荷注入与 Ron 变化——别在转换中途切通道（见 8.6）；④ 同族选型：4052 双 4 选 1、4053 三路 2 选 1、74HC4051 高速版</desc>
