</style><rect class="bg" x="0" y="-156" width="800" height="740" /><text class="title" x="24" y="-128">锂电池 CC-CV 充电：先恒流，后恒压</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 先恒流：电流不动，电压往上爬。<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 到 4.2 V 改恒压，电流自己往下落。<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 电压刚到 4.2 V 还不叫充满。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 示意 2 Ah：恒流约 1.6 Ah，恒压再约 0.3 Ah。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="528" width="752" height="44" rx="6" /><text class="small" x="40" y="556">电压刚到 4.2 V 时那 0.3 Ah 还在外面。数字是教学拆分，不是某一次充电记录。示意。</text><rect width="800" height="520" class="bg" />
  <line x1="60" y1="370" x2="750" y2="370" stroke-width="2" class="stroke-axis" />
  <line x1="60" y1="370" x2="60" y2="60" stroke-width="2" class="stroke-axis" />
  <text x="720" y="392" font-size="13" class="txt">时间 t</text>
  <text x="66" y="72" font-size="13" class="hi">电压 U</text>
  <text x="66" y="92" font-size="13" class="gold">电流 I</text>

  
  <line x1="60" y1="122" x2="750" y2="122" stroke-width="1" stroke-dasharray="5 4" class="stroke-axis" />
  <text x="700" y="114" font-size="12" class="small">满充电压 4.2V</text>

  
  <line x1="60" y1="320" x2="750" y2="320" stroke-width="1" stroke-dasharray="5 4" class="stroke-axis" />
  <text x="690" y="312" font-size="12" class="small">截止电流 0.05C</text>

  
