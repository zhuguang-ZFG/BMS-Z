  <text class="small" x="154.8" y="432" text-anchor="middle">0.1</text>
  <line class="grid" x1="406.0" y1="400.0" x2="406.0" y2="406.0"/>
  <text class="small" x="406.0" y="432" text-anchor="middle">0.5</text>
  <line class="grid" x1="594.4" y1="400.0" x2="594.4" y2="406.0"/>
  <text class="small" x="594.4" y="432" text-anchor="middle">0.8</text>
  <line class="grid" x1="720.0" y1="400.0" x2="720.0" y2="406.0"/>
  <text class="small" x="720.0" y="432" text-anchor="middle">1</text>
  <line class="grid" x1="86.0" y1="400.0" x2="92.0" y2="400.0"/>
  <text class="small" x="82.0" y="404.0" text-anchor="end">0</text>
  <line class="grid" x1="86.0" y1="322.5" x2="92.0" y2="322.5"/>
  <text class="small" x="82.0" y="326.5" text-anchor="end">25</text>
  <line class="grid" x1="86.0" y1="245.0" x2="92.0" y2="245.0"/>
  <text class="small" x="82.0" y="249.0" text-anchor="end">50</text>
