<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="核心温度相对表面 NTC 的响应滞后：核心 45 摄氏度时，10 秒后的表面读数仅 30.7 摄氏度">
  <rect width="960" height="430" fill="#fffdf5"/>
  <text x="24" y="32" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#293b3a">NTC 看到的是测点，不是整颗电芯</text>
  <text x="24" y="55" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" fill="#626d65">教学阶跃：核心等效温度 25 → 45 °C；表面测点按 30 s 时间常数追随。10 s 后 NTC 仅 30.7 °C。</text>

  <rect x="45" y="112" width="155" height="170" rx="30" fill="#f6e2df" stroke="#b84745" stroke-width="2"/>
  <rect x="70" y="139" width="105" height="116" rx="22" fill="#f6e2df" stroke="#b84745"/>
  <text x="123" y="184" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#ad4644">核心</text>
  <text x="123" y="216" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#ad4644">45 °C</text>
  <text x="123" y="302" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#626d65">产热先在内部出现</text>

  <line x1="200" y1="196" x2="285" y2="196" stroke="#926717" stroke-width="5" stroke-linecap="round"/>
  <polygon points="300,196 280,184 280,208" fill="#926717"/>
  <text x="250" y="180" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#926717">热阻 + 热容</text>

  <rect x="300" y="132" width="145" height="128" rx="16" fill="#e4f0df" stroke="#176b73" stroke-width="2"/>
  <circle cx="332" cy="164" r="12" fill="#176b73"/>
  <line x1="332" y1="176" x2="332" y2="222" stroke="#176b73" stroke-width="6" stroke-linecap="round"/>
  <text x="375" y="169" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#176b73">表面 NTC</text>
  <text x="375" y="211" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#176b73">30.7 °C</text>
  <text x="373" y="244" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#626d65">10 s 后的读数</text>

  <rect x="54" y="330" width="390" height="44" rx="22" fill="#fbefc7" stroke="#926717"/>
  <text x="249" y="357" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#8e6518">核心 − 测点 = 14.3 K：表面还凉，不代表内部安全</text>

  <text x="505" y="88" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#626d65">温度随时间</text>
  <line x1="520" y1="330" x2="910" y2="330" stroke="#626d65" stroke-width="1.5"/>
  <line x1="520" y1="96" x2="520" y2="330" stroke="#626d65" stroke-width="1.5"/>
  <g font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#626d65">
    <text x="506" y="334" text-anchor="end">25</text>
    <text x="506" y="104" text-anchor="end">45 °C</text>
    <text x="520" y="350" text-anchor="middle">0</text>
    <text x="563" y="350" text-anchor="middle">10 s</text>
    <text x="910" y="350" text-anchor="middle">90 s</text>
  </g>
  <polyline points="520,330 520,100 910,100" fill="none" stroke="#b84745" stroke-width="4"/>
  <text x="790" y="91" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#b84745">核心等效温度</text>
  <polyline points="520,330 542,295 563,265 585,240 607,218 650,185 715,151 780,131 910,111" fill="none" stroke="#176b73" stroke-width="4"/>
  <text x="760" y="166" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#176b73">表面 NTC</text>
  <line x1="563" y1="100" x2="563" y2="265" stroke="#7c648e" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="563" cy="265" r="5" fill="#176b73"/>
  <rect x="580" y="202" width="174" height="48" rx="10" fill="#f6e2df" stroke="#7c648e"/>
  <text x="667" y="222" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#736085">t = 10 s</text>
  <text x="667" y="241" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#736085">45 − 30.7 = 14.3 K</text>

  <text x="505" y="398" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#626d65">这张图隔离的是测点滞后，不代表真实核心会瞬间跳温。</text>
  <text x="505" y="417" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#626d65">产品判据还要联合功率、升温率、相邻温差和传感器诊断。</text>
</svg>
