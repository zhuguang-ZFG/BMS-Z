:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#a4630f"]{fill:#553a17}
[stroke="#a4630f"]{stroke:#c08a45}
text[fill="#6b3f63"]{fill:#c4a2bf}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#6b3f63"]{fill:#452c40}
[stroke="#6b3f63"]{stroke:#a17c9b}
}
</style>

<text x="600" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#16202b">分压公式：从同一股电流开始·分镜</text>
<text x="600" y="56" text-anchor="middle" font-size="12" fill="#5b666f">适用条件：空载；接负载后须重新计算下臂等效电阻</text>
<rect x="20" y="70" width="570" height="300" rx="10" fill="#fdf8ea" stroke="#c9bb9d" stroke-width="1.2"/>
<g data-storyboard-beat="空载条件" transform="translate(134 84) scale(0.2844)"><line x1="130" y1="270" x2="180" y2="270" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="180" y1="270" x2="210" y2="270" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="360" y1="270" x2="390" y2="270" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><rect x="210" y="243" width="150" height="54" fill="#e2d9cf" stroke="#2a2927" stroke-width="4"/><text x="285" y="225" font-size="32" fill="#2a2927" text-anchor="middle">R1</text><line x1="390" y1="270" x2="420" y2="270" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="420" y1="270" x2="420" y2="440" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="420" y1="440" x2="390" y2="440" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="180" y1="440" x2="210" y2="440" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="360" y1="440" x2="390" y2="440" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><rect x="210" y="413" width="150" height="54" fill="#e2d9cf" stroke="#2a2927" stroke-width="4"/><text x="285" y="395" font-size="32" fill="#2a2927" text-anchor="middle">R2</text><line x1="180" y1="440" x2="130" y2="440" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><text x="80" y="220" font-size="32" fill="#2a2927" text-anchor="start">V</text><text x="420" y="220" font-size="32" fill="#2a2927" text-anchor="middle">Vout</text><line x1="420" y1="270" x2="460" y2="270" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="130" y1="440" x2="130" y2="490" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="100" y1="490" x2="160" y2="490" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="110" y1="505" x2="150" y2="505" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="120" y1="520" x2="140" y2="520" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><text x="90" y="600" font-size="28" fill="#2a2927" text-anchor="start">输出开路，无支流</text>
<rect x="70" y="175" width="410" height="470" rx="8" fill="none" stroke="#a4441d" stroke-width="5"/></g>
<text x="32" y="348" font-size="12" font-weight="bold" fill="#1f5d7a">1. 空载条件</text>
<rect x="610" y="70" width="570" height="300" rx="10" fill="#fdf8ea" stroke="#c9bb9d" stroke-width="1.2"/>
<g data-storyboard-beat="先求电流" transform="translate(724 84) scale(0.2844)"><line x1="130" y1="270" x2="180" y2="270" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="180" y1="270" x2="210" y2="270" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="360" y1="270" x2="390" y2="270" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><rect x="210" y="243" width="150" height="54" fill="#e2d9cf" stroke="#2a2927" stroke-width="4"/><text x="285" y="225" font-size="32" fill="#2a2927" text-anchor="middle">R1</text><line x1="390" y1="270" x2="420" y2="270" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="420" y1="270" x2="420" y2="440" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="420" y1="440" x2="390" y2="440" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="180" y1="440" x2="210" y2="440" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="360" y1="440" x2="390" y2="440" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><rect x="210" y="413" width="150" height="54" fill="#e2d9cf" stroke="#2a2927" stroke-width="4"/><text x="285" y="395" font-size="32" fill="#2a2927" text-anchor="middle">R2</text><line x1="180" y1="440" x2="130" y2="440" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><text x="80" y="220" font-size="32" fill="#2a2927" text-anchor="start">V</text><text x="420" y="220" font-size="32" fill="#2a2927" text-anchor="middle">Vout</text><line x1="420" y1="270" x2="460" y2="270" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="130" y1="440" x2="130" y2="490" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="100" y1="490" x2="160" y2="490" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="110" y1="505" x2="150" y2="505" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="120" y1="520" x2="140" y2="520" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><text x="90" y="600" font-size="28" fill="#2a2927" text-anchor="start">输出开路，无支流</text>
<g transform="translate(0 -5)"><text x="487.04" y="210" font-size="30" fill="#2a2927" text-anchor="start">I = V / (R1 + R2)</text></g><rect x="477.04" y="168" width="660.96" height="62" rx="8" fill="none" stroke="#a4441d" stroke-width="5"/></g>
<text x="622" y="348" font-size="12" font-weight="bold" fill="#1f5d7a">2. 先求电流</text>
<rect x="20" y="388" width="570" height="300" rx="10" fill="#fdf8ea" stroke="#c9bb9d" stroke-width="1.2"/>
<g data-storyboard-beat="下臂压降" transform="translate(134 402) scale(0.2844)"><line x1="130" y1="270" x2="180" y2="270" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="180" y1="270" x2="210" y2="270" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="360" y1="270" x2="390" y2="270" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><rect x="210" y="243" width="150" height="54" fill="#e2d9cf" stroke="#2a2927" stroke-width="4"/><text x="285" y="225" font-size="32" fill="#2a2927" text-anchor="middle">R1</text><line x1="390" y1="270" x2="420" y2="270" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="420" y1="270" x2="420" y2="440" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="420" y1="440" x2="390" y2="440" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="180" y1="440" x2="210" y2="440" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="360" y1="440" x2="390" y2="440" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><rect x="210" y="413" width="150" height="54" fill="#e2d9cf" stroke="#2a2927" stroke-width="4"/><text x="285" y="395" font-size="32" fill="#2a2927" text-anchor="middle">R2</text><line x1="180" y1="440" x2="130" y2="440" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><text x="80" y="220" font-size="32" fill="#2a2927" text-anchor="start">V</text><text x="420" y="220" font-size="32" fill="#2a2927" text-anchor="middle">Vout</text><line x1="420" y1="270" x2="460" y2="270" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="130" y1="440" x2="130" y2="490" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="100" y1="490" x2="160" y2="490" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="110" y1="505" x2="150" y2="505" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="120" y1="520" x2="140" y2="520" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><text x="90" y="600" font-size="28" fill="#2a2927" text-anchor="start">输出开路，无支流</text>
<g transform="translate(0 -5)"><text x="487.04" y="210" font-size="30" fill="#2a2927" text-anchor="start">I = V / (R1 + R2)</text><text x="487.04" y="320" font-size="30" fill="#2a2927" text-anchor="start">Vout = I × R2</text></g><rect x="477.04" y="278" width="660.96" height="62" rx="8" fill="none" stroke="#a4441d" stroke-width="5"/></g>
<text x="32" y="666" font-size="12" font-weight="bold" fill="#1f5d7a">3. 下臂压降</text>
<rect x="610" y="388" width="570" height="300" rx="10" fill="#fdf8ea" stroke="#c9bb9d" stroke-width="1.2"/>
<g data-storyboard-beat="代入消元" transform="translate(724 402) scale(0.2844)"><line x1="130" y1="270" x2="180" y2="270" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="180" y1="270" x2="210" y2="270" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="360" y1="270" x2="390" y2="270" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><rect x="210" y="243" width="150" height="54" fill="#e2d9cf" stroke="#2a2927" stroke-width="4"/><text x="285" y="225" font-size="32" fill="#2a2927" text-anchor="middle">R1</text><line x1="390" y1="270" x2="420" y2="270" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="420" y1="270" x2="420" y2="440" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="420" y1="440" x2="390" y2="440" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="180" y1="440" x2="210" y2="440" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="360" y1="440" x2="390" y2="440" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><rect x="210" y="413" width="150" height="54" fill="#e2d9cf" stroke="#2a2927" stroke-width="4"/><text x="285" y="395" font-size="32" fill="#2a2927" text-anchor="middle">R2</text><line x1="180" y1="440" x2="130" y2="440" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><text x="80" y="220" font-size="32" fill="#2a2927" text-anchor="start">V</text><text x="420" y="220" font-size="32" fill="#2a2927" text-anchor="middle">Vout</text><line x1="420" y1="270" x2="460" y2="270" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="130" y1="440" x2="130" y2="490" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="100" y1="490" x2="160" y2="490" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="110" y1="505" x2="150" y2="505" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="120" y1="520" x2="140" y2="520" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><text x="90" y="600" font-size="28" fill="#2a2927" text-anchor="start">输出开路，无支流</text>
<g transform="translate(0 -5)"><text x="487.04" y="210" font-size="30" fill="#2a2927" text-anchor="start">I = V / (R1 + R2)</text><text x="487.04" y="320" font-size="30" fill="#2a2927" text-anchor="start">Vout = I × R2</text><text x="487.04" y="430" font-size="30" fill="#2a2927" text-anchor="start">Vout = V × R2 / (R1 + R2)</text><text x="487.04" y="540" font-size="30" fill="#2a2927" text-anchor="start">空载成立；带载重新列式</text></g><rect x="477.04" y="388" width="660.96" height="62" rx="8" fill="none" stroke="#a4441d" stroke-width="5"/></g>
<text x="622" y="666" font-size="12" font-weight="bold" fill="#1f5d7a">4. 代入消元</text>
<text x="24" y="718" font-size="22" fill="#16202b">1. 输出不抽取电流，串联两电阻中的电流相同。</text>
<text x="24" y="748" font-size="22" fill="#16202b">2. 把两只串联电阻相加，先求 I。</text>
<text x="24" y="778" font-size="22" fill="#16202b">3. Vout 是 R2 上的压降，用欧姆定律。</text>
<text x="24" y="808" font-size="22" fill="#16202b">4. 把 I 代入后，Vout = V × R2 / (R1 + R2)。</text>
</svg>
