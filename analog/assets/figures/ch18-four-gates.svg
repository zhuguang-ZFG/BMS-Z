<text x="277" y="472" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" fill="#52606d">打勾：去耦贴脸 &lt;2mm</text>
<text x="277" y="492" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" fill="#52606d">回流紧贴去路正下方</text>
<line x1="277" y1="502" x2="443" y2="502" stroke="#d0d5dd" stroke-width="1"/>
<text x="277" y="522" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" font-weight="700" fill="#b45309">漏了 → 17.1 / 17.4</text>
<text x="277" y="542" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="10.5" fill="#52606d">对应 17.1 电源 / 17.4 振荡</text>

<rect x="475" y="428" width="190" height="140" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
