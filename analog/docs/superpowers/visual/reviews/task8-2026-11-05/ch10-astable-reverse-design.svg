<text x="50" y="165" font-size="25" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">RA + 2RB = 1 / (ln2 × 38 kHz × 1 nF) ≈ 37.966 kΩ</text>
