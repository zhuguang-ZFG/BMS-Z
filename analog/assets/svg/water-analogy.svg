<text x="92" y="330" text-anchor="end" font-size="10" fill="#5b666f">栅压一声令下</text>
<text x="400" y="252" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f7f96">水 流 = 电 流 I（必须成环）</text>
