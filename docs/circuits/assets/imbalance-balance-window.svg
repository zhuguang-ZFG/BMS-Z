<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="ui-monospace, Consolas, monospace">
  <title>不均衡若每圈固定长大，不管就会直线爬升；均衡窗把它在 30 mV 拉回 10 mV，留下锯齿。数字为示意。</title>
  <desc>亮点先看不管时每圈 +0.20 mV 的直线爬升，再看开窗均衡把极差拉回 10 mV 后留下的锯齿。</desc>

  <style>
