<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">SOC 与 SOH 是两只不同的油箱</title>
  <desc id="desc">上方一只无刻度半圆油表红针直上；下方左边油箱高大、右边油箱矮小，两箱液面同样接近箱口；两条虚线把油表分别引到两只油箱；右箱底部接出一根更窄的出水管；一个小人站在两箱之间双手各搭一箱。全图无文字无数字。</desc>
