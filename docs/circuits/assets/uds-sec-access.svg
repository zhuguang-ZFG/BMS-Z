  <rect class="panel" x="24" y="484" width="752" height="52" rx="6"/>
  <text class="small" x="40" y="514" opacity="1">t≈0.2 s　27 01 请求种子 →　← 67 01 种子 A7 F3 12 9C（示意）<animate attributeName="opacity" values="1;0;0;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="spline" keySplines="0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40" y="514" opacity="0">t≈3 s　KDF(种子, 共享密钥) = 5E 04 … → 27 02 发回（示意）<animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="spline" keySplines="0.16 1 0.3 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40" y="514" opacity="0">t≈6 s　67 02 · 已解锁等级 1 · 0x2E 写参数可发（示意）<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.7 0 0.84 0;0.42 0 0.58 1" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40" y="514" opacity="0">t≈9 s　错 3 次每次 7F 27 35 → 7F 27 36 · 罚等未到 7F 27 37（示意 10 s，OEM 定）<animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.7 0 0.84 0" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="24" y="562">0x35 / 0x36 / 0x37 是 ISO 14229 的否定响应码。种子、密钥字节、次数与罚等时长都是示意；固定密钥等于没锁。</text>
