<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="ui-monospace, Consolas, monospace">
  <title>SOH 老化双指标：满充容量随循环衰减至 80% 寿命终点线，内阻同步增长且往往先咬到功率能力</title>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .cap { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .res { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .eol { stroke: #bf8700; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .dot1 { fill: #0969da; }
    .dot2 { fill: #cf222e; }
    .warn { fill: #cf222e; font-size: 13px; font-weight: bold; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .cap { stroke: #4493f8; }
      .res { stroke: #ff7b72; }
      .eol { stroke: #d29922; }
      .dot1 { fill: #4493f8; }
      .dot2 { fill: #ff7b72; }
      .warn { fill: #ff7b72; }
    }
  </style>
  <rect class="bg" width="800" height="450"/>
  <text class="title" x="30" y="34">SOH 老化双指标：容量衰减 + 内阻增长</text>

  <rect class="panel" x="60" y="54" width="680" height="220" rx="6"/>
  <!-- 轴 -->
  <text class="small" x="66" y="76">%（相对新电池）</text>
  <text class="small" x="690" y="266">循环数 →</text>
  <text class="small" x="82" y="262">0</text>
  <text class="small" x="348" y="262">1500</text>
  <text class="small" x="612" y="262">3000</text>

  <!-- EOL 80% 线 -->
  <line class="eol" x1="90" y1="216" x2="720" y2="216"/>
  <text class="small" x="430" y="208">EOL 惯用线：容量 80%</text>

  <!-- 容量曲线 100% -> 78% -->
  <path class="cap" d="M90.0 88.0 L103.8 88.7 L117.5 89.9 L131.2 91.4 L145.0 93.1 L158.8 95.0 L172.5 97.0 L186.2 99.2 L200.0 101.4 L213.8 103.9 L227.5 106.4 L241.2 109.0 L255.0 111.7 L268.8 114.5 L282.5 117.4 L296.2 120.4 L310.0 123.5 L323.8 126.6 L337.5 129.9 L351.2 133.1 L365.0 136.5 L378.8 139.9 L392.5 143.4 L406.2 147.0 L420.0 150.6 L433.8 154.3 L447.5 158.0 L461.2 161.8 L475.0 165.7 L488.8 169.6 L502.5 173.6 L516.2 177.6 L530.0 181.7 L543.8 185.8 L557.5 190.0 L571.2 194.2 L585.0 198.4 L598.8 202.8 L612.5 207.1 L626.2 211.5 L640.0 216.0"/>
  <text class="txt" x="500" y="102" fill="#0969da" style="fill:#0969da">满充容量 Q（先慢后快）</text>

  <!-- 内阻曲线 100% -> 170%（右轴感：画成上行） -->
  <path class="res" d="M90.0 88.0 L103.8 107.0 L117.5 114.0 L131.2 119.2 L145.0 123.5 L158.8 127.2 L172.5 130.6 L186.2 133.6 L200.0 136.5 L213.8 139.1 L227.5 141.6 L241.2 143.9 L255.0 146.2 L268.8 148.3 L282.5 150.3 L296.2 152.3 L310.0 154.2 L323.8 156.0 L337.5 157.8 L351.2 159.5 L365.0 161.2 L378.8 162.8 L392.5 164.4 L406.2 166.0 L420.0 167.5 L433.8 168.9 L447.5 170.4 L461.2 171.8 L475.0 173.2 L488.8 174.5 L502.5 175.9 L516.2 177.2 L530.0 178.4 L543.8 179.7 L557.5 180.9 L571.2 182.2 L585.0 183.4 L598.8 184.6 L612.5 185.7 L626.2 186.9 L640.0 188.0"/>
  <text class="txt" x="200" y="176" fill="#cf222e" style="fill:#cf222e">R0：20→45 mΩ（往下变大，不是这条 % 轴）</text>

  <!-- 交叉点标注：内阻先咬功率 -->
  <circle cx="200.0" cy="136.5" r="4" class="dot2">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text class="small" x="210" y="128">约 600 次：R 已到 32 mΩ，Q 仍约 98%</text>

  <!-- 巡游双光点 -->
  <circle class="dot1" r="5">
    <animateMotion dur="8s" repeatCount="indefinite" path="M90.0 88.0 L103.8 88.7 L117.5 89.9 L131.2 91.4 L145.0 93.1 L158.8 95.0 L172.5 97.0 L186.2 99.2 L200.0 101.4 L213.8 103.9 L227.5 106.4 L241.2 109.0 L255.0 111.7 L268.8 114.5 L282.5 117.4 L296.2 120.4 L310.0 123.5 L323.8 126.6 L337.5 129.9 L351.2 133.1 L365.0 136.5 L378.8 139.9 L392.5 143.4 L406.2 147.0 L420.0 150.6 L433.8 154.3 L447.5 158.0 L461.2 161.8 L475.0 165.7 L488.8 169.6 L502.5 173.6 L516.2 177.6 L530.0 181.7 L543.8 185.8 L557.5 190.0 L571.2 194.2 L585.0 198.4 L598.8 202.8 L612.5 207.1 L626.2 211.5 L640.0 216.0"/>
  </circle>
  <circle class="dot2" r="5">
    <animateMotion dur="8s" repeatCount="indefinite" path="M90.0 88.0 L103.8 107.0 L117.5 114.0 L131.2 119.2 L145.0 123.5 L158.8 127.2 L172.5 130.6 L186.2 133.6 L200.0 136.5 L213.8 139.1 L227.5 141.6 L241.2 143.9 L255.0 146.2 L268.8 148.3 L282.5 150.3 L296.2 152.3 L310.0 154.2 L323.8 156.0 L337.5 157.8 L351.2 159.5 L365.0 161.2 L378.8 162.8 L392.5 164.4 L406.2 166.0 L420.0 167.5 L433.8 168.9 L447.5 170.4 L461.2 171.8 L475.0 173.2 L488.8 174.5 L502.5 175.9 L516.2 177.2 L530.0 178.4 L543.8 179.7 L557.5 180.9 L571.2 182.2 L585.0 183.4 L598.8 184.6 L612.5 185.7 L626.2 186.9 L640.0 188.0"/>
  </circle>

  <!-- 底部结论 -->
  <rect class="panel" x="30" y="284" width="740" height="42" rx="6"/>
  <text class="txt" x="44" y="302">两个指标都能写进状态向量联合估计（双 EKF：快估 SOC、慢估 Q/R₀）</text>
  <text class="small" x="44" y="318">可观测性条件：参数只有在电流激励下才「看得见」——长期静置时冻结参数更新，别让慢滤波器在黑暗中乱走</text>

  <rect class="panel" x="30" y="332" width="740" height="96" rx="6"/>
  <text class="txt" x="44" y="356">示意前后对照，不是某一批循环数据</text>
  <text class="small" x="44" y="380">新：5.0 Ah，R0=20 mΩ。走到容量 80%：4.0 Ah，R0 示意升到 45 mΩ。</text>
  <text class="small" x="44" y="404">20 A 时欧姆压降从 0.40 V 变成 0.90 V。容量还没到报废线，功率先被内阻收走。</text>
  <text class="warn" x="620" y="380">
    <animate attributeName="opacity" values="0.3;1;0.3" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite"/>
    先咬功率
  </text>

</svg>
