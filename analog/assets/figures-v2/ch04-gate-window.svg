<polygon class="marker-wash" points="44.5,24.6 171.0,20.7 441.7,22.8 440.0,64.6 303.7,62.5 45.2,65.1" fill="#a4630f" opacity="0.13"/>
<text x="52" y="58" font-size="38" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">栅极保护是一扇电压窗</text><text x="52" y="94" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">钳位要高于驱动、低于栅氧额定；窗口外面不是余量，是击穿。</text>
<rect x="50" y="140" width="520" height="360" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<rect class="ink-echo" x="50" y="140" width="520" height="360" rx="6" stroke="#37424e" stroke-width="2" fill="none" opacity="0.32" transform="translate(-1.42 0.72) rotate(-0.01 310.0 320.0)"/>
<rect x="74" y="176" width="470" height="70" rx="8" fill="#f3ddd7" stroke="#a8321f" stroke-width="2"/>
<rect class="ink-echo" x="74" y="176" width="470" height="70" rx="8" stroke="#a8321f" stroke-width="2" fill="none" opacity="0.32" transform="translate(1.58 0.95) rotate(0.06 309.0 211.0)"/>
<text x="96" y="220" font-size="27" fill="#a8321f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">栅氧额定 ±20 V</text>
<rect x="74" y="276" width="470" height="70" rx="8" fill="#f6e6d2" stroke="#a4630f" stroke-width="2"/>
<rect class="ink-echo" x="74" y="276" width="470" height="70" rx="8" stroke="#a4630f" stroke-width="2" fill="none" opacity="0.32" transform="translate(1.55 -0.68) rotate(-0.07 309.0 311.0)"/>
<text x="96" y="320" font-size="27" fill="#a4630f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">钳位 13–16 V</text>
<rect x="74" y="376" width="470" height="70" rx="8" fill="#e2ebe0" stroke="#3d6b4a" stroke-width="2"/>
<rect class="ink-echo" x="74" y="376" width="470" height="70" rx="8" stroke="#3d6b4a" stroke-width="2" fill="none" opacity="0.32" transform="translate(1.41 0.71) rotate(0.08 309.0 411.0)"/>
<text x="96" y="420" font-size="27" fill="#3d6b4a" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">驱动 12 V</text>
<text x="74" y="478" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">钳位动作点必须落在这两条线之间。</text>
<rect x="600" y="140" width="350" height="360" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<rect class="ink-echo" x="600" y="140" width="350" height="360" rx="6" stroke="#37424e" stroke-width="2" fill="none" opacity="0.32" transform="translate(1.37 0.78) rotate(-0.02 775.0 320.0)"/>
<text x="624" y="190" font-size="23" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">钳位 &gt; 驱动</text>
<text x="624" y="218" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">动作电压高于 12 V</text>
<text x="624" y="266" font-size="23" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">钳位 &lt; 额定</text>
<text x="624" y="294" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">又低于 ±20 V</text>
<text x="624" y="342" font-size="23" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">10 kΩ 下拉</text>
<text x="624" y="370" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">悬空态有直流退路</text>
<text x="624" y="418" font-size="23" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">开尔文源脚</text>
<text x="624" y="446" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">源极电感不进栅回路</text>
<rect x="50" y="530" width="900" height="76" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<rect class="ink-echo" x="50" y="530" width="900" height="76" rx="6" stroke="#37424e" stroke-width="2" fill="none" opacity="0.32" transform="translate(-1.13 -0.69) rotate(0.05 500.0 568.0)"/>
<text x="76" y="578" font-size="24" fill="#a4630f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">12 V 驱动选 13–16 V 钳位，别让栅氧裸奔。</text>
<text x="500" y="650" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">先看窗口，再选钳位器件。</text>
</svg>
