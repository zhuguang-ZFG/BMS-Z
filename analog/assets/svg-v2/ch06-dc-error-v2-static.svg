<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">跟随器误差先定符号再相加</title>
<desc id="figDesc">示意：示意 Vos 为正、偏流流入正端；典型幅值不是误差保证。</desc>
<metadata id="visual-timeline">{&quot;duration&quot;: 12, &quot;beats&quot;: [{&quot;name&quot;: &quot;条件&quot;, &quot;start&quot;: 0, &quot;end&quot;: 3, &quot;caption&quot;: &quot;设 Vos = +3 mV，偏流 20 nA 流入正端。&quot;}, {&quot;name&quot;: &quot;变化&quot;, &quot;start&quot;: 3, &quot;end&quot;: 6, &quot;caption&quot;: &quot;1 kΩ 源阻引起 −20 µV；100 kΩ 为 −2 mV。&quot;}, {&quot;name&quot;: &quot;比较&quot;, &quot;start&quot;: 6, &quot;end&quot;: 9, &quot;caption&quot;: &quot;有限开环增益 100000，1 V 信号约损失 10 µV。&quot;}, {&quot;name&quot;: &quot;结论&quot;, &quot;start&quot;: 9, &quot;end&quot;: 12, &quot;caption&quot;: &quot;本例误差会抵消；最坏预算另加各项绝对值。&quot;}]}</metadata>
