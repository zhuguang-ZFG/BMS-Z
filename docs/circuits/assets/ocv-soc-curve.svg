<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650">
  <title>OCV-SOC 曲线动画：铁锂的平台区有多平</title>
  <rect width="800" height="650" fill="#f8fafc"/>
  <style>
  text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
  /* 深色模式：GitHub 深色主题下对调底色与文字色，只覆盖配色，不动几何与动画。
     stroke="#fff" 保持白色——那是彩色徽标上的勾选，不在覆盖范围内。 */
  @media (prefers-color-scheme: dark){
  rect[fill="#f8fafc"]{fill:#0f172a}
  rect[fill="#fff"]{fill:#1e293b}
  [fill="#f1f5f9"]{fill:#1e293b}
  [stroke="#f1f5f9"]{stroke:#1e293b}
  [fill="#e2e8f0"]{fill:#334155}
  [stroke="#e2e8f0"]{stroke:#334155}
  [fill="#cbd5e1"]{fill:#475569}
  [stroke="#cbd5e1"]{stroke:#475569}
  [fill="#64748b"]{fill:#94a3b8}
  [stroke="#64748b"]{stroke:#94a3b8}
  [fill="#475569"]{fill:#cbd5e1}
  [stroke="#475569"]{stroke:#cbd5e1}
  [fill="#334155"]{fill:#e2e8f0}
  [stroke="#334155"]{stroke:#e2e8f0}
  [fill="#1e293b"]{fill:#f1f5f9}
  [stroke="#1e293b"]{stroke:#f1f5f9}
  [fill="#dbeafe"]{fill:#1e3a8a}
  [stroke="#dbeafe"]{stroke:#1e3a8a}
  [fill="#eff6ff"]{fill:#172554}
  [stroke="#eff6ff"]{stroke:#172554}
  [fill="#bfdbfe"]{fill:#1e40af}
  [stroke="#bfdbfe"]{stroke:#1e40af}
  [fill="#1d4ed8"]{fill:#60a5fa}
  [stroke="#1d4ed8"]{stroke:#60a5fa}
  [fill="#1e40af"]{fill:#93c5fd}
  [stroke="#1e40af"]{stroke:#93c5fd}
  [fill="#2563eb"]{fill:#60a5fa}
  [stroke="#2563eb"]{stroke:#60a5fa}
  [fill="#3b82f6"]{fill:#60a5fa}
  [stroke="#3b82f6"]{stroke:#60a5fa}
  [fill="#ecfdf5"]{fill:#022c22}
  [stroke="#ecfdf5"]{stroke:#022c22}
  [fill="#a7f3d0"]{fill:#065f46}
  [stroke="#a7f3d0"]{stroke:#065f46}
  [fill="#86efac"]{fill:#166534}
  [stroke="#86efac"]{stroke:#166534}
  [fill="#065f46"]{fill:#6ee7b7}
  [stroke="#065f46"]{stroke:#6ee7b7}
  [fill="#059669"]{fill:#34d399}
  [stroke="#059669"]{stroke:#34d399}
  [fill="#fef2f2"]{fill:#450a0a}
  [stroke="#fef2f2"]{stroke:#450a0a}
  [fill="#fecaca"]{fill:#7f1d1d}
  [stroke="#fecaca"]{stroke:#7f1d1d}
  [fill="#fca5a5"]{fill:#b91c1c}
  [stroke="#fca5a5"]{stroke:#b91c1c}
  [fill="#991b1b"]{fill:#fca5a5}
  [stroke="#991b1b"]{stroke:#fca5a5}
  [fill="#dc2626"]{fill:#f87171}
  [stroke="#dc2626"]{stroke:#f87171}
  [fill="#fffbeb"]{fill:#451a03}
  [stroke="#fffbeb"]{stroke:#451a03}
  [fill="#fef3c7"]{fill:#78350f}
  [stroke="#fef3c7"]{stroke:#78350f}
  [fill="#92400e"]{fill:#fcd34d}
  [stroke="#92400e"]{stroke:#fcd34d}
  [fill="#b45309"]{fill:#fbbf24}
  [stroke="#b45309"]{stroke:#fbbf24}
  }
</style>

  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">OCV-SOC 曲线：为什么铁锂的 SOC 不能只靠电压估</text>

  <!-- 坐标轴 -->
  <line x1="60" y1="360" x2="750" y2="360" stroke="#334155" stroke-width="2"/>
  <line x1="60" y1="360" x2="60" y2="60" stroke="#334155" stroke-width="2"/>
  <!-- 轴标题下移到 y=396：原来在 382，与 x 轴末端刻度「100」(x=740, y=376, end 锚点)
       实测重叠 13x9px——两串字都全不透明，是真的叠在一起。 -->
  <text x="700" y="396" font-size="12" fill="#334155">SOC %</text>
  <text x="66" y="72" font-size="12" fill="#334155">OCV</text>
  <g font-size="12" fill="#94a3b8">
    <text x="50" y="364" text-anchor="end">2.5V</text>
    <text x="50" y="250" text-anchor="end">3.3V</text>
    <text x="50" y="114" text-anchor="end">4.2V</text>
    <text x="60" y="376">0</text>
    <text x="740" y="376" text-anchor="end">100</text>
  </g>

  <!-- NCM 曲线（蓝，斜率明显） -->
  <path d="M60,320 C300,290 500,180 740,114" fill="none" stroke="#2563eb" stroke-width="3.5"
        pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000">
    <animate attributeName="stroke-dashoffset" values="1000;0;0" keyTimes="0;0.45;1" dur="9s" repeatCount="indefinite"/>
  </path>
  <text x="560" y="150" font-size="13" font-weight="bold" fill="#2563eb" opacity="0">三元 NCM：斜率明显
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.42;0.46;1" dur="9s" repeatCount="indefinite"/>
  </text>

  <!-- LFP 曲线（绿，中间大平台） -->
  <path d="M60,330 C150,300 185,253 260,249 C400,246 560,245 620,245 C680,243 715,205 740,196" fill="none" stroke="#10b981" stroke-width="3.5"
        pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000">
    <animate attributeName="stroke-dashoffset" values="1000;0;0" keyTimes="0;0.45;1" dur="9s" repeatCount="indefinite"/>
  </path>
  <text x="120" y="290" font-size="13" font-weight="bold" fill="#059669" opacity="0">铁锂 LFP
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.42;0.46;1" dur="9s" repeatCount="indefinite"/>
  </text>

  <!-- 平台区括号与放大框 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.54;1" dur="9s" repeatCount="indefinite"/>
    <line x1="260" y1="249" x2="620" y2="245" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="270" y="50" width="380" height="86" rx="8" fill="#fef2f2" stroke="#ef4444"/>
    <text x="460" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc2626">平台区放大看（SOC 30% → 70%）</text>
    <text x="460" y="96" text-anchor="middle" font-size="13" fill="#991b1b">电压只从 3.28V 爬到 3.31V —— 40% 的 SOC 变化，</text>
    <text x="460" y="116" text-anchor="middle" font-size="13" fill="#991b1b">电压只动 30mV，而采样噪声就有 2–5mV！</text>
  </g>

  <!-- 沿 LFP 平台移动的采样点 -->
  <circle r="7" fill="#ef4444" stroke="#fff" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.52;0.56;1" dur="9s" repeatCount="indefinite"/>
    <animateMotion dur="9s" repeatCount="indefinite" calcMode="linear"
                   keyPoints="0;0;1;1" keyTimes="0;0.56;0.94;1"
                   path="M260,249 C400,246 560,245 620,245"/>
  </circle>

  <text x="400" y="418" text-anchor="middle" font-size="14" fill="#475569">结论：LFP 平台区纯电压法基本失效 → 必须上"积分 + 滤波融合"（见 EKF 动画）</text>
<!-- deepened-formula --><rect x="24" y="448.0" width="752" height="188" rx="6" fill="#fff" stroke="#e2e8f0"/><text x="40" y="468.0" font-size="13" fill="#1e293b">底栏：30%→70% 只爬 30 mV。斜率 0.75 mV / 每个百分点</text><text x="40" y="484.0" font-size="11" fill="#475569">电压 V</text><line x1="70.0" y1="484.0" x2="70.0" y2="598.0" stroke="#64748b" stroke-width="1.5"/><line x1="70.0" y1="598.0" x2="460.0" y2="598.0" stroke="#64748b" stroke-width="1.5"/><line x1="70.0" y1="598.0" x2="70.0" y2="603.0" stroke="#64748b"/><text x="70.0" y="616.0" text-anchor="middle" font-size="11" fill="#475569">30</text><line x1="265.0" y1="598.0" x2="265.0" y2="603.0" stroke="#64748b"/><text x="265.0" y="616.0" text-anchor="middle" font-size="11" fill="#475569">50</text><line x1="460.0" y1="598.0" x2="460.0" y2="603.0" stroke="#64748b"/><text x="460.0" y="616.0" text-anchor="middle" font-size="11" fill="#475569">70</text><line x1="65.0" y1="575.2" x2="70.0" y2="575.2" stroke="#64748b"/><text x="62.0" y="579.2" text-anchor="end" font-size="11" fill="#475569">3.28</text><line x1="65.0" y1="541.0" x2="70.0" y2="541.0" stroke="#64748b"/><text x="62.0" y="545.0" text-anchor="end" font-size="11" fill="#475569">3.295</text><line x1="65.0" y1="506.8" x2="70.0" y2="506.8" stroke="#64748b"/><text x="62.0" y="510.8" text-anchor="end" font-size="11" fill="#475569">3.31</text><polyline points="70.0,575.2 79.8,573.5 89.5,571.8 99.2,570.1 109.0,568.4 118.8,566.7 128.5,564.9 138.2,563.2 148.0,561.5 157.8,559.8 167.5,558.1 177.2,556.4 187.0,554.7 196.8,553.0 206.5,551.3 216.2,549.6 226.0,547.8 235.8,546.1 245.5,544.4 255.2,542.7 265.0,541.0 274.8,539.3 284.5,537.6 294.2,535.9 304.0,534.2 313.8,532.5 323.5,530.7 333.2,529.0 343.0,527.3 352.8,525.6 362.5,523.9 372.2,522.2 382.0,520.5 391.8,518.8 401.5,517.1 411.2,515.3 421.0,513.6 430.8,511.9 440.5,510.2 450.2,508.5 460.0,506.8" fill="none" stroke="#059669" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle r="5" fill="#b45309"><animate attributeName="cx" values="70.0;118.8;167.5;216.2;265.0;313.8;362.5;411.2;460.0" keyTimes="0.0000;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1.0000" dur="8s" repeatCount="indefinite"/><animate attributeName="cy" values="575.2;566.7;558.1;549.6;541.0;532.5;523.9;515.3;506.8" keyTimes="0.0000;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1.0000" dur="8s" repeatCount="indefinite"/></circle><text x="460.0" y="616.0" text-anchor="end" font-size="11" fill="#475569">SOC %</text><text x="480" y="526.0" font-size="12" fill="#334155">50% 时是 3.295 V。噪声 2–5 mV 能盖住好几步。</text>
</svg>
