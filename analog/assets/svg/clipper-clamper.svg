<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="ttl">
<title id="ttl">削波与钳位：同一个 0.7V——一个当闸门，一个当垫脚石</title>
<desc>削波与钳位：同一个 0.7V——一个当闸门，一个当垫脚石；节拍：① 限幅：输出想越过 基准+0.7V，二极管开闸泄流——波形顶部被削平；② 双向版就是 ADC 引脚保护：两只二极管把信号锁进 ±0.7V——第一道墙；③ 钳位：负半周瞬间 D 导通，C 充到 ≈2.3V（峰值 3V − 0.7V）——此后 D 常关，C 变成串联电池；④ 输出整体垫高：±3V 进来，−0.7~5.3V 出去——直流分量被恢复了</desc>
<defs>
