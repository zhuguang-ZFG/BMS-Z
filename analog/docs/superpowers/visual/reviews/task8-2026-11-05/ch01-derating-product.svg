<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
<defs>
<linearGradient id="bgL" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#fdf8ea"/><stop offset="1" stop-color="#f6eedb"/>
</linearGradient>
<linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#141310"/><stop offset="1" stop-color="#1d1a14"/>
</linearGradient>
<radialGradient id="vig" cx="0.5" cy="0.44" r="0.78">
<stop offset="0.55" stop-color="#16202b" stop-opacity="0"/>
<stop offset="1" stop-color="#16202b" stop-opacity="0.055"/>
</radialGradient>
<linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#a4630f" stop-opacity="0.10"/>
<stop offset="0.55" stop-color="#a4630f" stop-opacity="0.028"/>
<stop offset="1" stop-color="#a4630f" stop-opacity="0"/>
</linearGradient>
<linearGradient id="hdrD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#dcab63" stop-opacity="0.13"/>
<stop offset="0.55" stop-color="#dcab63" stop-opacity="0.04"/>
<stop offset="1" stop-color="#dcab63" stop-opacity="0"/>
</linearGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
<circle cx="2.5" cy="3.5" r="0.9" fill="#c9bb9d"/>
<circle cx="19" cy="11" r="0.55" fill="#c9bb9d" opacity="0.7"/>
<circle cx="11.5" cy="22" r="0.6" fill="#c9bb9d" opacity="0.55"/>
</pattern>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
<feDropShadow dx="0" dy="1.4" stdDeviation="2" flood-color="#16202b" flood-opacity="0.13"/>
</filter>
<filter id="pglow" x="-70%" y="-70%" width="240%" height="240%">
<feGaussianBlur stdDeviation="1.7" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect class="page-bg" width="1000" height="700" fill="url(#bgL)"/>
<rect class="page-grain" width="1000" height="700" fill="url(#dots)"/>
<defs>
<pattern id="fiber" width="96" height="96" patternUnits="userSpaceOnUse" patternTransform="rotate(-6)">
<path d="M8 18 q16 -2.2 36 -0.4" stroke="#c9bb9d" stroke-width="0.55" fill="none" stroke-opacity="0.55"/>
<path d="M54 12 q10 1.4 22 0.2" stroke="#c9bb9d" stroke-width="0.45" fill="none" stroke-opacity="0.4"/>
<path d="M20 52 q14 1.8 30 -0.6" stroke="#c9bb9d" stroke-width="0.5" fill="none" stroke-opacity="0.45"/>
<path d="M62 66 q12 -1.6 24 0.4" stroke="#c9bb9d" stroke-width="0.45" fill="none" stroke-opacity="0.38"/>
<path d="M14 84 q18 1.4 34 -0.2" stroke="#c9bb9d" stroke-width="0.5" fill="none" stroke-opacity="0.42"/>
</pattern>
</defs>
<rect class="page-fiber" width="1000" height="700" fill="url(#fiber)" opacity="0.55"/>

<rect class="page-vig" width="1000" height="700" fill="url(#vig)"/>
<rect class="page-hdr" width="1000" height="72" fill="url(#hdr)"/>
<style>
text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Source Han Sans SC","Noto Sans SC",sans-serif;}
line,path,polyline,polygon{stroke-linecap:round;stroke-linejoin:round}
.page-bg{fill:url(#bgL)}
.page-grain{opacity:.5}
.page-vig{opacity:1}
.page-hdr{fill:url(#hdr)}
@media (prefers-color-scheme: dark){
.page-bg{fill:url(#bgD)}
.page-grain{opacity:.34}
.page-vig{opacity:.5}
.page-hdr{fill:url(#hdrD)}
[fill="#fdf8ea"]{fill:#141310}
[stroke="#fdf8ea"]{stroke:#141310}
[fill="#f6eedb"]{fill:#1d1a14}
[stroke="#f6eedb"]{stroke:#1d1a14}
[fill="#e0d3b8"]{fill:#3b3529}
[stroke="#e0d3b8"]{stroke:#3b3529}
[fill="#c9bb9d"]{fill:#4a4436}
[stroke="#c9bb9d"]{stroke:#4a4436}
[fill="#16202b"]{fill:#ece4d3}
[stroke="#16202b"]{stroke:#ece4d3}
[fill="#37424e"]{fill:#cfc6b4}
[stroke="#37424e"]{stroke:#cfc6b4}
[fill="#5b666f"]{fill:#a79e8b}
[stroke="#5b666f"]{stroke:#a79e8b}
[fill="#8b8272"]{fill:#857c6c}
[stroke="#8b8272"]{stroke:#857c6c}
text[fill="#fdf8ea"]{fill:#f9f3e3}
[fill="#e6eff3"]{fill:#17262e}
[fill="#e4f1f3"]{fill:#15262a}
[fill="#e8efe6"]{fill:#182418}
[fill="#f6e7e1"]{fill:#281a16}
[fill="#f7eedb"]{fill:#292114}
[fill="#efe8ee"]{fill:#241c22}
text[fill="#1f5d7a"]{fill:#7fb7cf}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#1f5d7a"]{fill:#2b4d5f}
[stroke="#1f5d7a"]{stroke:#6fa3b9}
text[fill="#2f7f96"]{fill:#8ac9d8}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#2f7f96"]{fill:#2b5660}
[stroke="#2f7f96"]{stroke:#77b2c1}
text[fill="#3d6b4a"]{fill:#98c096}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#3d6b4a"]{fill:#2f4a33}
[stroke="#3d6b4a"]{stroke:#7aa87c}
text[fill="#a8321f"]{fill:#e0907a}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#a8321f"]{fill:#55231b}
[stroke="#a8321f"]{stroke:#c07a63}
text[fill="#a4630f"]{fill:#dcab63}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#a4630f"]{fill:#553a17}
[stroke="#a4630f"]{stroke:#c08a45}
text[fill="#6b3f63"]{fill:#c4a2bf}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#6b3f63"]{fill:#452c40}
[stroke="#6b3f63"]{stroke:#a17c9b}
}
</style>

<polygon class="marker-wash" points="43.4,22.4 215.2,20.5 592.7,22.1 591.7,63.1 258.4,62.5 44.7,64.9" fill="#a4630f" opacity="0.13"/>
<text x="52" y="58" font-size="38" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">最坏情况预算是乘法，不是加法</text><text x="52" y="94" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">标称容量有测试条件；温度、偏压、老化三项各打八折，只剩一半上下。</text>
<rect x="50" y="130" width="430" height="250" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<rect class="ink-echo" x="50" y="130" width="430" height="250" rx="6" stroke="#37424e" stroke-width="2" fill="none" opacity="0.32" transform="translate(1.27 -0.71) rotate(0.12 265.0 255.0)"/>
<text x="74" y="172" font-size="24" fill="#1f5d7a" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">Buck 输出 3.3V / 2A</text>
<text x="74" y="206" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">500kHz，电感纹波 0.6A</text>
<text x="74" y="238" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">22µF X5R 0805</text>
<path d="M80 262 Q265.00 263.36 450 262" fill="none" stroke="#c9bb9d" stroke-width="2"/>
<text x="74" y="294" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">按标称 22µF</text>
<text x="300" y="294" font-size="26" fill="#3d6b4a" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">6.8mV</text>
<text x="74" y="330" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">偏压下只剩约 10µF</text>
<text x="300" y="330" font-size="26" fill="#a8321f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">15mV</text>
<text x="74" y="362" font-size="22" fill="#a4630f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">同样电感纹波，容性纹波翻了一倍多</text>
<rect x="520" y="130" width="430" height="250" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<rect class="ink-echo" x="520" y="130" width="430" height="250" rx="6" stroke="#37424e" stroke-width="2" fill="none" opacity="0.32" transform="translate(1.20 0.61) rotate(0.10 735.0 255.0)"/>
<text x="544" y="172" font-size="24" fill="#a8321f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">三项保持率相乘</text>
<text x="544" y="212" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">温度保持率</text>
<text x="544" y="250" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">偏压保持率</text>
<text x="544" y="288" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">老化保持率</text>
<text x="800" y="212" font-size="22" fill="#a4630f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">× 八折</text>
<text x="800" y="250" font-size="22" fill="#a4630f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">× 八折</text>
<text x="800" y="288" font-size="22" fill="#a4630f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">× 八折</text>
<path d="M544 306 Q735.00 308.49 926 306" fill="none" stroke="#c9bb9d" stroke-width="2"/>
<text x="544" y="344" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">10µF X5R 服役三年</text>
<text x="800" y="344" font-size="26" fill="#a8321f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="middle">剩一半</text>
<text x="544" y="372" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">老化每十倍时程跌约 1%~2%</text>
<rect x="50" y="406" width="900" height="154" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<rect class="ink-echo" x="50" y="406" width="900" height="154" rx="6" stroke="#37424e" stroke-width="2" fill="none" opacity="0.32" transform="translate(1.51 0.90) rotate(0.10 500.0 483.0)"/>
<text x="76" y="446" font-size="24" fill="#3d6b4a" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">所以才有「标称 10µF 按 5µF 设计」这条惯例</text>
<text x="76" y="482" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">不是悲观，是把乘法提前算好。</text>
<text x="76" y="520" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">X7R 的 ±15% 是全温范围的总窗口，高低温两头各占一半；</text>
<text x="76" y="548" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">回流焊的高温会把老化时钟归零重新计时。</text>
</svg>
