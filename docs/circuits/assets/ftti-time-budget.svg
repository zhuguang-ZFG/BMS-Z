<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 544" font-family="ui-monospace, Consolas, monospace">
  <title>故障容忍时间：诊断周期上限 = FTTI − 反应 − 去抖。示意 FTTI 为 100 ms。</title>
  <desc>亮点沿不同去抖取值的斜线走：去抖越长留给诊断的周期上限越短，红点停在超出预算的坏例子上。</desc>

  <style>
    .bg { fill: #fffdf5; }
    .panel { fill: #f7f2e5; stroke: #cfc6b2; }
    .axis { stroke: #626d65; stroke-width: 1.5; fill: none; }
    .grid { stroke: #cfc6b2; stroke-width: 1; fill: none; }
    .txt { fill: #293b3a; font-size: 13px; }
    .small { fill: #626d65; font-size: 12px; }
    .title { fill: #293b3a; font-size: 16px; font-weight: bold; }
    .hi { fill: #176b73; }
    .warn { fill: #b84745; }
    .ok { fill: #377b60; }
    .gold { fill: #926717; }
    .lineb { stroke: #176b73; stroke-width: 2.5; fill: none; }
    .liner { stroke: #b84745; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #377b60; stroke-width: 2.5; fill: none; }
    .liney { stroke: #926717; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .dotb { fill: #176b73; }
    .dotr { fill: #b84745; }
    .doty { fill: #926717; }
    .boxb { fill: #e4f0df; stroke: #176b73; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #192727; }
      .panel { fill: #223333; stroke: #496160; }
      .axis { stroke: #b0beb3; }
      .grid { stroke: #496160; }
      .txt { fill: #edf0e5; }
      .small { fill: #b0beb3; }
      .title { fill: #edf0e5; }
      .hi { fill: #7ec5c5; }
      .warn { fill: #f39b91; }
      .ok { fill: #8fc7a2; }
      .gold { fill: #dfbd78; }
      .lineb { stroke: #7ec5c5; }
      .liner { stroke: #f39b91; }
      .lineg { stroke: #8fc7a2; }
      .liney { stroke: #dfbd78; }
      .dotb { fill: #7ec5c5; }
      .dotr { fill: #f39b91; }
      .doty { fill: #dfbd78; }
      .boxb { fill: #293f35; stroke: #7ec5c5; }
    }
  </style><style id="bms-motion">
    /* bms-motion: 手帐式动效注记（纯装饰，不改技术几何与既有 SMIL 时序） */
    .bms-marker { fill: #fbefc7; opacity: .78; }
    .bms-under { fill: none; stroke: #926717; stroke-width: 2.4; stroke-linecap: round; opacity: .9; }
    .bms-spark-line { fill: none; stroke: #926717; stroke-width: 1.9; stroke-linecap: round; }
    .bms-spark-fill { fill: #926717; }
    .bms-spark-soft { fill: #176b73; opacity: .8; }
    .bms-sticker { fill: none; stroke: #926717; stroke-width: 2; stroke-dasharray: 7 5; stroke-linecap: round; opacity: .85; }
    .bms-halo { fill: none; stroke: #926717; stroke-width: 2; }
    .bms-marker, .bms-under, .bms-sticker, .bms-halo,
    .bms-spark, .bms-success, .bms-doodle { pointer-events: none; }
    circle:has(> animateMotion) { filter: drop-shadow(0 0 2px rgba(146,103,23,.5)) drop-shadow(0 0 5px rgba(196,145,52,.45)); }
    rect:has(> animateMotion) { filter: drop-shadow(0 0 3px rgba(196,145,52,.75)); }
    g:has(> circle):has(> path.stroke-check) { filter: drop-shadow(0 0 5px rgba(55,123,96,.5)); }
    @media (prefers-color-scheme: dark) {
      .bms-marker { fill: #453e2b; opacity: .85; }
      .bms-under { stroke: #dfbd78; }
      .bms-spark-line { stroke: #dfbd78; }
      .bms-spark-fill { fill: #dfbd78; }
      .bms-spark-soft { fill: #7ec5c5; }
      .bms-sticker { stroke: #dfbd78; }
      .bms-halo { stroke: #dfbd78; }
      circle:has(> animateMotion) { filter: drop-shadow(0 0 2px rgba(223,189,120,.8)) drop-shadow(0 0 7px rgba(223,189,120,.9)); }
      rect:has(> animateMotion) { filter: drop-shadow(0 0 6px rgba(223,189,120,.8)); }
      g:has(> circle):has(> path.stroke-check) { filter: drop-shadow(0 0 6px rgba(143,199,162,.7)); }
    }
    @media (prefers-reduced-motion: reduce) { .bms-spark, .bms-success, .bms-doodle { display: none; } }
</style>

  <!-- formula: Tdiag_max=100-10-tdebounce=90-tdebounce -->
  <rect class="bg" width="800" height="544"/>
  <rect class="bms-marker" aria-hidden="true" x="18.0" y="17.1" width="350.0" height="17.3" rx="3.8" transform="rotate(-.5 18.0 25.8)"/><path class="bms-under" aria-hidden="true" d="M24.0 40.0 q 24.0 -2.4 48.0 0 t 48 0 t 48 0 t 48 0 t 48 0 t 48 0 t 48 0"/><text class="title" x="24" y="32">检测加反应，必须装进同一个时间口袋（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="128" rx="6"/><g class="bms-doodle" aria-hidden="true" transform="translate(746.0 72.0)"><animateTransform attributeName="transform" type="rotate" values="-6;7;-6" keyTimes="0;0.5;1" dur="5.4s" repeatCount="indefinite" additive="sum"/><animate attributeName="opacity" values="0.62;1;0.62" keyTimes="0;0.5;1" dur="3.6s" repeatCount="indefinite"/><path class="bms-spark-fill" d="M0 -9 L2.3 -2.3 L9 0 L2.3 2.3 L0 9 L-2.3 2.3 L-9 0 L-2.3 -2.3 Z"/></g><g class="bms-doodle" aria-hidden="true" transform="translate(710.0 62.0)"><animateTransform attributeName="transform" type="rotate" values="5;-4;5" keyTimes="0;0.5;1" dur="6.2s" repeatCount="indefinite" additive="sum"/><animate attributeName="opacity" values="0.5;0.9;0.5" keyTimes="0;0.5;1" dur="4.4s" repeatCount="indefinite"/><path class="bms-spark-soft" d="M0 -5.5 L1.4 -1.4 L5.5 0 L1.4 1.4 L0 5.5 L-1.4 1.4 L-5.5 0 L-1.4 -1.4 Z"/></g><g class="bms-doodle" aria-hidden="true"><circle class="bms-spark-fill" cx="728.0" cy="81.0" r="1.3"/><circle class="bms-spark-soft" cx="696.0" cy="78.0" r="1.1"/></g>
  <text class="txt" x="40" y="72" opacity="0.28">① 去抖为 0<tspan class="small">　反应 10 ms 之后，诊断周期最多 90 ms。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="98" opacity="0.28">② 去抖 20 ms<tspan class="small">　上限 70 ms。斜率是 −1：去抖多 1，周期少 1。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="124" opacity="0.28">③ 红点是坏例子<tspan class="small">　去抖 50、周期也取 50，加反应 10，一共 110，超过 100。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="150" opacity="0.28">④ 线以下才算数<tspan class="small">　周期大于这条线，这项诊断在预算里等于没有。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="188" width="752" height="304" rx="6"/>
  <text class="small" x="40" y="210">诊断周期上限 ms（示意）</text>
  <line class="axis" x1="108.0" y1="228.0" x2="108.0" y2="430.0"/>
  <line class="axis" x1="108.0" y1="430.0" x2="730.0" y2="430.0"/>
  <text class="small" x="730.0" y="468.0" text-anchor="end">去抖 ms（示意）</text>
  <line class="grid" x1="108.0" y1="430.0" x2="108.0" y2="436.0"/>
  <text class="small" x="108.0" y="452.0" text-anchor="middle">0</text>
  <line class="grid" x1="246.2" y1="430.0" x2="246.2" y2="436.0"/>
  <text class="small" x="246.2" y="452.0" text-anchor="middle">20</text>
  <line class="grid" x1="453.6" y1="430.0" x2="453.6" y2="436.0"/>
  <text class="small" x="453.6" y="452.0" text-anchor="middle">50</text>
  <line class="grid" x1="660.9" y1="430.0" x2="660.9" y2="436.0"/>
  <text class="small" x="660.9" y="452.0" text-anchor="middle">80</text>
  <line class="grid" x1="102.0" y1="409.8" x2="108.0" y2="409.8"/>
  <text class="small" x="98.0" y="413.8" text-anchor="end">10</text>
  <line class="grid" x1="102.0" y1="349.2" x2="108.0" y2="349.2"/>
  <text class="small" x="98.0" y="353.2" text-anchor="end">40</text>
  <line class="grid" x1="102.0" y1="288.6" x2="108.0" y2="288.6"/>
  <text class="small" x="98.0" y="292.6" text-anchor="end">70</text>
  <line class="grid" x1="102.0" y1="248.2" x2="108.0" y2="248.2"/>
  <text class="small" x="98.0" y="252.2" text-anchor="end">90</text>
  <polyline class="lineb" points="108.0,248.2 114.9,250.2 121.8,252.2 128.7,254.3 135.6,256.3 142.6,258.3 149.5,260.3 156.4,262.3 163.3,264.4 170.2,266.4 177.1,268.4 184.0,270.4 190.9,272.4 197.8,274.5 204.8,276.5 211.7,278.5 218.6,280.5 225.5,282.5 232.4,284.6 239.3,286.6 246.2,288.6 253.1,290.6 260.0,292.6 267.0,294.7 273.9,296.7 280.8,298.7 287.7,300.7 294.6,302.7 301.5,304.8 308.4,306.8 315.3,308.8 322.2,310.8 329.2,312.8 336.1,314.9 343.0,316.9 349.9,318.9 356.8,320.9 363.7,322.9 370.6,325.0 377.5,327.0 384.4,329.0 391.4,331.0 398.3,333.0 405.2,335.1 412.1,337.1 419.0,339.1 425.9,341.1 432.8,343.1 439.7,345.2 446.6,347.2 453.6,349.2 460.5,351.2 467.4,353.2 474.3,355.3 481.2,357.3 488.1,359.3 495.0,361.3 501.9,363.3 508.8,365.4 515.8,367.4 522.7,369.4 529.6,371.4 536.5,373.4 543.4,375.5 550.3,377.5 557.2,379.5 564.1,381.5 571.0,383.5 578.0,385.6 584.9,387.6 591.8,389.6 598.7,391.6 605.6,393.6 612.5,395.7 619.4,397.7 626.3,399.7 633.2,401.7 640.2,403.7 647.1,405.8 654.0,407.8 660.9,409.8" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="dotr" cx="453.6" cy="329.0" r="6"/>
  <text class="warn" x="463.6" y="329.0">50+50+10=110 &gt; 100</text>
  <circle class="doty" r="6"><animate data-ease="linear" attributeName="cx" values="108.0;156.4;197.8;246.2;294.6;336.1;384.4;432.8;474.3;522.7;571.0;612.5;660.9" keyTimes="0.0000;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1.0000" dur="12s" repeatCount="indefinite"/><animate data-ease="linear" attributeName="cy" values="248.2;262.3;274.5;288.6;302.7;314.9;329.0;343.1;355.3;369.4;383.5;395.7;409.8" keyTimes="0.0000;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1.0000" dur="12s" repeatCount="indefinite"/></circle>
  <text class="small" x="24" y="528">100 ms、10 ms 是教学预算，不是某个 ASIL 项目的 FTTI。红点在线上方，表示这项诊断论证不成立。</text>
</svg>
