  <title>DW01 单节保护板典型应用电路</title>
  <desc>绿点沿放电回路走。底栏左边：检流电压按 0.40 V 到 1.60 V 的直线爬升，越过短路典型阈值 1.2 V（范围 1.0–1.4 V）。底栏右边：过充确认窗口 80–200 ms，游标在这段里走。阻容仍是手册典型应用示例。示意。</desc>
