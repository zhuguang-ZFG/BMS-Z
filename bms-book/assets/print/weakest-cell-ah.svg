  <circle class="dotr" r="6" cx="474.2834167480469" cy="331.7977600097656"/>
  <text class="ok" x="329.2" y="261.1">平均值一直是 2.00</text>
  <text class="warn" x="329.2" y="385.9">可用 = 2.00 − s/2</text>
  <text class="small" x="24" y="528">2.00 Ah 和「左右对称的极差」是教学假设。真实电池不对称时，仍然只用最小值，不用这个 1/2。</text>
