<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">噪声积分不能把截止频率当砖墙</title>
<desc id="figDesc">示意：仅算 40 nV/√Hz 白电压噪声；另计 1/f、电流噪声与电阻。</desc>
<metadata id="visual-timeline">{&quot;duration&quot;: 12, &quot;beats&quot;: [{&quot;name&quot;: &quot;条件&quot;, &quot;start&quot;: 0, &quot;end&quot;: 3, &quot;caption&quot;: &quot;矩形带宽 20 kHz：白噪声为 5.66 µV RMS。&quot;}, {&quot;name&quot;: &quot;变化&quot;, &quot;start&quot;: 3, &quot;end&quot;: 6, &quot;caption&quot;: &quot;一阶低通在 fc 外还有噪声能量通过。&quot;}, {&quot;name&quot;: &quot;比较&quot;, &quot;start&quot;: 6, &quot;end&quot;: 9, &quot;caption&quot;: &quot;积分 |H|²：ENBW = πfc/2，约 31.42 kHz。&quot;}, {&quot;name&quot;: &quot;结论&quot;, &quot;start&quot;: 9, &quot;end&quot;: 12, &quot;caption&quot;: &quot;同为 fc 20 kHz，一阶结果 7.09 µV RMS。&quot;}]}</metadata>
