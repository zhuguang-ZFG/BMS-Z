<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -156 800 900" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>接触器粘连检测：下令断开后测量负载侧电压——正常应掉到零；若仍有接近 pack 的电压，说明触点被电弧熔焊粘住，高压并未真正断开</title>
  <desc>正常断开时负载侧按 400 乘 e 的负 t 除以 1 秒往下掉，0.1 秒仍约 362 V，5 秒约 2.7 V。粘连侧停在 400 V。τ=1 秒是示意，不是示波器。</desc>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .bus { stroke: #0969da; stroke-width: 2.5; }
    .contact { stroke: #57606a; stroke-width: 3; }
    .weld { stroke: #cf222e; stroke-width: 3; }
    .coil { stroke: #8250df; stroke-width: 2; fill: none; }
    .gauge { fill: #ffffff; stroke: #d0d7de; }
    .ok { fill: #1a7f37; }
    .bad { fill: #cf222e; }
    .arc { stroke: #bf8700; stroke-width: 2; fill: none; }
    .badge { fill: #0969da; }
    .badget { fill: #ffffff; font-size: 12px; font-weight: bold; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .doty { fill: #bf8700; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .bus { stroke: #4493f8; }
      .contact { stroke: #8b949e; }
      .weld { stroke: #ff7b72; }
      .coil { stroke: #a371f7; }
      .gauge { fill: #0d1117; stroke: #30363d; }
      .ok { fill: #3fb950; }
      .bad { fill: #ff7b72; }
      .arc { stroke: #d29922; }
      .badge { fill: #4493f8; }
      .badget { fill: #0d1117; }
      .axis { stroke: #8b949e; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .doty { fill: #d29922; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
    }
  </style>
  <rect class="bg" x="0" y="-156" width="800" height="900" /><text class="title" x="24" y="-128">接触器粘连：命令断了，电没断</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 接触器粘连：命令断了，电没断<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 电池侧 400V<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 线圈已断电（命令断开）<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="688" width="752" height="44" rx="6" /><text class="small" x="40" y="716">τ=1 s 示意。不是示波器。公式 V = 400·e^(−t/1s)。</text><rect class="bg" width="800" height="680" />
  <rect class="panel" x="40" y="58" width="350" height="220" rx="6" />
  <text class="txt" x="56" y="84">正常：触点分开</text>
  <line class="bus" x1="70" y1="140" x2="170" y2="140" />
  <line class="bus" x1="230" y1="140" x2="330" y2="140" />
  <text class="small" x="76" y="130">电池侧 400V</text>
  <text class="small" x="256" y="130">负载侧</text>
  
  <line class="contact" x1="170" y1="140" x2="200" y2="118" />
  <line class="contact" x1="200" y1="140" x2="230" y2="140" />
  
  <path class="coil" d="M 186 170 q 6 -10 12 0 q 6 10 12 0 q 6 -10 12 0" />
  <text class="small" x="56" y="212">线圈已断电（命令断开）</text>
  <rect class="gauge" x="230" y="150" width="120" height="44" rx="5" />
  <text class="ok" x="240" y="168" font-size="12" opacity="1">400V
    <animate attributeName="opacity" values="1;1;0;0;0;0" keyTimes="0;0.22;0.28;0.55;0.7;1" dur="8s" repeatCount="indefinite" />
  </text>
  <text class="ok" x="240" y="168" font-size="12" opacity="0">掉到 40V
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.34;0.62;0.7;1" dur="8s" repeatCount="indefinite" />
  </text>
  <text class="ok" x="240" y="186" font-size="13" opacity="0">0V ✓
    <animate attributeName="opacity" values="0;0;0;0;1;1" keyTimes="0;0.55;0.62;0.7;0.76;1" dur="8s" repeatCount="indefinite" />
  </text>
  <text class="small" x="56" y="240">判断：电压真的掉了 → 高压已隔离</text>

  
  <rect class="panel" x="410" y="58" width="350" height="220" rx="6" />
  <text class="txt" x="426" y="84">粘连：触点被电弧焊死</text>
  <line class="bus" x1="440" y1="140" x2="540" y2="140" />
  <line class="bus" x1="600" y1="140" x2="700" y2="140" />
  <text class="small" x="446" y="130">电池侧 400V</text>
  
  <line class="weld" x1="540" y1="140" x2="600" y2="140" />
  <g>
    <path class="arc" d="M 556 152 q 6 -14 12 0 q 6 14 12 0 q 6 -14 12 0"><animate attributeName="opacity" values="1;0.2;1" dur="0.6s" repeatCount="indefinite" /></path>
    <text class="bad" x="530" y="180" font-size="12" font-weight="bold">熔焊点
      <animate attributeName="opacity" values="1;0.4;1" dur="0.6s" repeatCount="indefinite" />
    </text>
  </g>
  <path class="coil" d="M 556 200 q 6 -10 12 0 q 6 10 12 0 q 6 -10 12 0" />
  <text class="small" x="500" y="226">线圈已断电——但触点不分开</text>
  <rect class="gauge" x="630" y="150" width="118" height="44" rx="5" />
  <text class="bad" x="636" y="168" font-size="12">400V
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.22;0.3;1" dur="8s" repeatCount="indefinite" />
  </text>
  <text class="bad" x="636" y="186" font-size="13" opacity="0">仍 398V
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.34;1" dur="8s" repeatCount="indefinite" />
  </text>

  
  <rect class="panel" x="40" y="292" width="720" height="72" rx="6" />
  <circle class="badge" cx="64" cy="318" r="10" /><text class="badget" x="60" y="322">1</text>
  <text class="txt" x="82" y="322">每次下电都自动做：命令断开 → 等触点稳定 → 读负载侧电压</text>
  <circle class="badge" cx="64" cy="346" r="10" /><text class="badget" x="60" y="350">2</text>
  <text class="txt" x="82" y="350">电压掉不下去 = 粘连 → 锁故障、禁上电、亮维修灯（防"以为没电其实带电"的维修触电）</text>

  <rect class="panel" x="40" y="378" width="720" height="280" rx="6" />
  <text class="small" x="56" y="398">负载侧电压（示意）　V = 400·e^(−t/1s)</text>
  <line class="axis" x1="70" y1="430" x2="70" y2="560" />
  <line class="axis" x1="70" y1="560" x2="500" y2="560" />
  <text class="small" x="28" y="434">400 V</text>
  <text class="small" x="70" y="574">0 s</text>
  <text class="small" x="470" y="574">5 s</text>
  <polyline class="liner" points="70.0,430.0 76.7,430.0 83.3,430.0 90.0,430.0 96.7,430.0 103.3,430.0 110.0,430.0 116.7,430.0 123.3,430.0 130.0,430.0 136.7,430.0 143.3,430.0 150.0,430.0 156.7,430.0 163.3,430.0 170.0,430.0 176.7,430.0 183.3,430.0 190.0,430.0 196.7,430.0 203.3,430.0 210.0,430.0 216.7,430.0 223.3,430.0 230.0,430.0 236.7,430.0 243.3,430.0 250.0,430.0 256.7,430.0 263.3,430.0 270.0,430.0 276.7,430.0 283.3,430.0 290.0,430.0 296.7,430.0 303.3,430.0 310.0,430.0 316.7,430.0 323.3,430.0 330.0,430.0 336.7,430.0 343.3,430.0 350.0,430.0 356.7,430.0 363.3,430.0 370.0,430.0 376.7,430.0 383.3,430.0 390.0,430.0 396.7,430.0 403.3,430.0 410.0,430.0 416.7,430.0 423.3,430.0 430.0,430.0 436.7,430.0 443.3,430.0 450.0,430.0 456.7,430.0 463.3,430.0 470.0,430.0" />
  <polyline class="lineb" points="70.0,430.0 76.7,440.4 83.3,450.0 90.0,458.8 96.7,466.9 103.3,474.3 110.0,481.2 116.7,487.5 123.3,493.3 130.0,498.6 136.7,503.5 143.3,508.0 150.0,512.2 156.7,516.0 163.3,519.5 170.0,522.8 176.7,525.7 183.3,528.5 190.0,531.0 196.7,533.3 203.3,535.4 210.0,537.4 216.7,539.2 223.3,540.9 230.0,542.4 236.7,543.8 243.3,545.1 250.0,546.3 256.7,547.4 263.3,548.4 270.0,549.3 276.7,550.2 283.3,551.0 290.0,551.7 296.7,552.4 303.3,553.0 310.0,553.5 316.7,554.0 323.3,554.5 330.0,555.0 336.7,555.4 343.3,555.7 350.0,556.1 356.7,556.4 363.3,556.7 370.0,556.9 376.7,557.2 383.3,557.4 390.0,557.6 396.7,557.8 403.3,558.0 410.0,558.1 416.7,558.3 423.3,558.4 430.0,558.6 436.7,558.7 443.3,558.8 450.0,558.9 456.7,559.0 463.3,559.0 470.0,559.1" />
  <text class="warn" x="520" y="460">粘连停在 400 V</text>
  <circle class="doty" r="6">
    <animate attributeName="cx" values="70.0;103.3;136.7;170.0;203.3;236.7;270.0;303.3;336.7;370.0;403.3;436.7;470.0" keyTimes="0;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1" dur="8s" repeatCount="indefinite" />
    <animate attributeName="cy" values="430.0;474.3;503.5;522.8;535.4;543.8;549.3;553.0;555.4;556.9;558.0;558.7;559.1" keyTimes="0;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1" dur="8s" repeatCount="indefinite" />
  </circle>
  <text class="hi" x="56" y="612">正常：0.1 s 仍约 362 V，5 s 约 2.7 V</text>
  <text class="small" x="56" y="636">τ=1 s 示意。不是示波器。公式 V = 400·e^(−t/1s)。</text>
</svg>