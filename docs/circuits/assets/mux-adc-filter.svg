<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="ui-monospace, Consolas, monospace">
  <title>单体采样：MUX 切换后 RC 滤波尚未建立，驻留只有一个时间常数时读数仍带着上一通道。数字为示意。</title>
  <desc>亮点跟着 MUX 切换走：读数从上一串 3.200 V 的记忆往 3.700 V 爬，只等 1τ 还差着 185 mV。</desc>

  <style>
    .bg { fill: #fffdf5; }
    .panel { fill: #f7f2e5; stroke: #cfc6b2; }
    .axis { stroke: #626d65; stroke-width: 1.5; fill: none; }
    .txt { fill: #293b3a; font-size: 13px; }
    .small { fill: #626d65; font-size: 12px; }
    .title { fill: #293b3a; font-size: 16px; font-weight: bold; }
    .hi { fill: #176b73; }
    .warn { fill: #b84745; }
    .ok { fill: #377b60; }
    .gold { fill: #926717; }
    .lineb { stroke: #176b73; stroke-width: 2.5; fill: none; }
    .liner { stroke: #b84745; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #377b60; stroke-width: 2.5; fill: none; }
    .liney { stroke: #926717; stroke-width: 2.5; fill: none; }
    .dotb { fill: #176b73; }
    .dotr { fill: #b84745; }
    .dotg { fill: #377b60; }
    .doty { fill: #926717; }
    .boxb { fill: #e4f0df; stroke: #176b73; }
    .boxr { fill: #f6e2df; stroke: #b84745; }
    .boxg { fill: #e4f0df; stroke: #377b60; }
    .boxy { fill: #fbefc7; stroke: #926717; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #192727; }
      .panel { fill: #223333; stroke: #496160; }
      .axis { stroke: #b0beb3; }
      .txt { fill: #edf0e5; }
      .small { fill: #b0beb3; }
      .title { fill: #edf0e5; }
      .hi { fill: #7ec5c5; }
      .warn { fill: #f39b91; }
      .ok { fill: #8fc7a2; }
      .gold { fill: #dfbd78; }
      .lineb { stroke: #7ec5c5; }
      .liner { stroke: #f39b91; }
      .lineg { stroke: #8fc7a2; }
      .liney { stroke: #dfbd78; }
      .dotb { fill: #7ec5c5; }
      .dotr { fill: #f39b91; }
      .dotg { fill: #8fc7a2; }
      .doty { fill: #dfbd78; }
      .boxb { fill: #293f35; stroke: #7ec5c5; }
      .boxr { fill: #483336; stroke: #f39b91; }
      .boxg { fill: #293f35; stroke: #8fc7a2; }
      .boxy { fill: #453e2b; stroke: #dfbd78; }
    }
  </style>

  <rect class="bg" width="800" height="460"/>

  <text class="title" x="24" y="32">MUX 切过来之后，RC 还没稳住，ADC 会读到上一串的尾巴（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="122" rx="6"/>
  <text class="txt" x="40" y="68" opacity="0.28">① 上一串<tspan class="small">　ADC 刚读完 3.200 V。滤波电容还记着这个电压。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="94" opacity="0.28">② 切到本串<tspan class="small">　本串真实是 3.700 V。阶跃有 500 mV。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="120" opacity="0.28">③ 只等 1τ<tspan class="small">　示意 R=1 kΩ、C=100 nF，τ=100 µs。驻留 100 µs 只走完 63%。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="146" opacity="0.28">④ 读数<tspan class="small">　3.200 + 0.63×0.500 = 3.515 V，比真值低大约 185 mV。再等到约 5τ 才剩几毫伏。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="180" width="752" height="210" rx="6"/>
  <text class="small" x="40" y="204">本串引脚电压，从上一串的记忆往 3.700 V 爬</text>
  <line class="axis" x1="70" y1="200" x2="70" y2="360"/>
  <line class="axis" x1="70" y1="360" x2="730" y2="360"/>
  <line class="axis" x1="70" y1="230.8" x2="720" y2="230.8" stroke-dasharray="4 3"/>
  <text class="small" x="28" y="235">3.700</text>
  <text class="small" x="28" y="343">3.200</text>
  <path class="lineb" d="M80.0 339.2 L140.0 339.2 L140.0 339.2 L154.0 324.1 L168.0 311.1 L182.0 299.9 L196.0 290.3 L210.0 282.0 L224.0 274.9 L233.3 270.7 L238.0 268.7 L252.0 263.5 L266.0 258.9 L280.0 255.0 L294.0 251.6 L308.0 248.7 L322.0 246.2 L336.0 244.1 L350.0 242.3 L364.0 240.7 L378.0 239.3 L392.0 238.1 L406.0 237.1 L420.0 236.2 L434.0 235.5 L448.0 234.8 L462.0 234.3 L476.0 233.8 L490.0 233.4 L504.0 233.0 L518.0 232.7 L532.0 232.5 L546.0 232.2 L560.0 232.0 L574.0 231.9 L588.0 231.7 L602.0 231.6 L606.7 231.6 L616.0 231.5 L630.0 231.4 L644.0 231.3 L658.0 231.3 L672.0 231.2 L686.0 231.1 L700.0 231.1" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000" stroke-linejoin="round" stroke-linecap="round">
    <animate calcMode="spline" keySplines="0.7 0 0.84 0;0.42 0 0.58 1" attributeName="stroke-dashoffset" values="1000;0;0" keyTimes="0;0.85;1" dur="12s" repeatCount="indefinite"/>
  </path>
  <line class="liney" x1="233.3" y1="200" x2="233.3" y2="360"/>
  <line class="lineg" x1="606.7" y1="210" x2="606.7" y2="360" stroke-dasharray="4 3"/>
  <text class="gold" x="241.3" y="262.7">1τ 约 3.515 V</text>
  <text class="ok" x="430" y="214">5τ 约 3.697 V</text>
  <text class="small" x="78" y="378">切通道</text>
  <text class="small" x="215.3" y="378">100 µs</text>
  <text class="small" x="588.7" y="378">500 µs</text>
  <circle class="doty" r="6">
    <animate data-ease="linear" attributeName="cx" values="90.0;140.0;154.0;177.3;233.3;326.7;466.7;606.7" keyTimes="0.00;0.24;0.30;0.38;0.50;0.68;0.82;1.00" dur="12s" repeatCount="indefinite"/>
    <animate data-ease="linear" attributeName="cy" values="339.2;339.2;324.1;303.5;270.7;245.5;234.1;231.6" keyTimes="0.00;0.24;0.30;0.38;0.50;0.68;0.82;1.00" dur="12s" repeatCount="indefinite"/>
  </circle>
  <text class="small" x="24" y="446">1 kΩ、100 nF、3.200 V、3.700 V 和 185 mV 都是示意。输入 RC 第一版照抄所选 AFE 的手册，不要按这张图改电容。</text>

</svg>
