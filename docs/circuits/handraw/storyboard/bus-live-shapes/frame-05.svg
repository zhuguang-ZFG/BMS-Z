<text x="698.0" y="146.0" font-family="KaiTi" font-size="13" fill="#003153">正常：按本包 τ 衰减</text>
<text x="698.0" y="165.0" font-family="KaiTi" font-size="13" fill="#003153">0.1 s 还有 361.9 V</text>
<text x="698.0" y="184.0" font-family="KaiTi" font-size="13" fill="#003153">5 s 才掉到 2.7 V</text>
<line x1="666.0" y1="211.0" x2="690.0" y2="211.0" stroke="#003153" stroke-width="1.9" stroke-dasharray="14 4 3 4" filter="url(#w)"/>
<text x="698.0" y="215.0" font-family="KaiTi" font-size="13" fill="#003153">贴近包压：粘连、预充未断</text>
<text x="698.0" y="234.0" font-family="KaiTi" font-size="13" fill="#003153">或外部能源回灌</text>
<line x1="666.0" y1="261.0" x2="690.0" y2="261.0" stroke="#003153" stroke-width="1.9" stroke-dasharray="12 6" filter="url(#w)"/>
<text x="698.0" y="265.0" font-family="KaiTi" font-size="13" fill="#003153">慢于预期：电容偏大、泄放</text>
<text x="698.0" y="284.0" font-family="KaiTi" font-size="13" fill="#003153">偏大或冷态阻值错</text>
<line x1="666.0" y1="311.0" x2="690.0" y2="311.0" stroke="#003153" stroke-width="1.9" stroke-dasharray="3 5" filter="url(#w)"/>
<text x="698.0" y="315.0" font-family="KaiTi" font-size="13" fill="#003153">读数一直不动：采样卡值，</text>
<text x="698.0" y="334.0" font-family="KaiTi" font-size="13" fill="#003153">不是母线状态</text>
<line x1="666.0" y1="361.0" x2="690.0" y2="361.0" stroke="#E34234" stroke-width="2.6" filter="url(#w)"/>
<text x="698.0" y="365.0" font-family="KaiTi" font-size="13" fill="#E34234">投放电仍不降：隔离未成立</text>
<text x="698.0" y="384.0" font-family="KaiTi" font-size="13" fill="#E34234">或放电路径开路</text>
<line x1="666.0" y1="411.0" x2="690.0" y2="411.0" stroke="#E34234" stroke-width="1.9" stroke-dasharray="6 4" filter="url(#w)"/>
<text x="698.0" y="415.0" font-family="KaiTi" font-size="13" fill="#E34234">竖虚线＝投入放电时刻</text>
<text x="150.0" y="496" font-family="KaiTi" font-size="14" fill="#003153">区分证据：放电电流、器件诊断、母线斜率与回路核查</text>
<text x="480" y="524" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="middle">投入放电后斜率几乎不变，说明能量没走放电路径。四种形状都对不上时，输出「隔离状态未确认」。</text>
<text x="480" y="546" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="middle" opacity="0.75">原理示意 / 非实拍　曲线为合成 RC 算例</text>
