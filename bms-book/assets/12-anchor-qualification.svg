<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="title desc">
  <title id="title">三个 SOC 锚点的资格门</title>
  <desc id="desc">满充、静置 OCV 和受控初始化各自经过一组资格条件。所有条件通过后，才允许把参考值用于 SOC 校正；任何条件失败都退回继续积分。</desc>
  <style>
    .bg{fill:#fffdf5}.ink{fill:#293b3a}.muted{fill:#626d65}.green{fill:#e4f0df;stroke:#377b60}.teal{fill:#e1eff0;stroke:#176b73}.gold{fill:#fbefc7;stroke:#926717}.purple{fill:#eee5f1;stroke:#7c648e}.green-text{fill:#36775e}.teal-text{fill:#176b73}.gold-text{fill:#8e6518}.purple-text{fill:#736085}.red-text{fill:#ad4644}.title{font:700 19px "Noto Sans SC","Microsoft YaHei",sans-serif}.head{font:700 15px "Noto Sans SC","Microsoft YaHei",sans-serif}.body{font:13px "Noto Sans SC","Microsoft YaHei",sans-serif}.small{font:12px "Noto Sans SC","Microsoft YaHei",sans-serif}.tiny{font:11px "Noto Sans SC","Microsoft YaHei",sans-serif}.card{stroke-width:2}.gate{stroke-width:1.6}.flow{fill:none;stroke:#626d65;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.return{fill:none;stroke:#b84745;stroke-width:2;stroke-dasharray:7 6;stroke-linecap:round}.arrow{fill:#626d65}.return-arrow{fill:#b84745}.sketch{fill:none;stroke-linecap:round}
    @media(prefers-color-scheme:dark){.bg{fill:#192727}.ink{fill:#edf0e5}.muted{fill:#b0beb3}.green{fill:#293f35;stroke:#8fc7a2}.teal{fill:#203e42;stroke:#7dbbc0}.gold{fill:#453e2b;stroke:#dfbd78}.purple{fill:#392f40;stroke:#c3a8cf}.green-text{fill:#8fc7a2}.teal-text{fill:#8bcbd0}.gold-text{fill:#dfbd78}.purple-text{fill:#d4bde0}.red-text{fill:#f39b91}.flow{stroke:#b0beb3}.return{stroke:#f39b91}.arrow{fill:#b0beb3}.return-arrow{fill:#f39b91}}
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="return-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="return-arrow"/></marker></defs>
  <rect class="bg" width="1000" height="600"/><text x="24" y="34" class="title ink">锚点不是读到就用：先过资格门</text><path d="M24 43C142 37 259 49 375 41" class="sketch" stroke="#176b73" stroke-width="3" opacity=".7"/><text x="24" y="66" class="body muted">三条路的条件不同；共同规则只有一条：证据不完整，就继续积分。</text>
  <g transform="translate(28 92)"><rect width="286" height="354" rx="18" class="gold card"/><text x="143" y="34" text-anchor="middle" class="head gold-text">满充锚点</text><text x="143" y="56" text-anchor="middle" class="small muted">同一充电协议下，三项同时成立</text><path d="M143 72V92" class="flow" marker-end="url(#arrow)"/><rect x="48" y="96" width="190" height="42" rx="21" class="bg gate" stroke="#926717"/><text x="143" y="122" text-anchor="middle" class="body ink">电压进入目标窗口</text><path d="M143 139V158" class="flow" marker-end="url(#arrow)"/><rect x="48" y="162" width="190" height="42" rx="21" class="bg gate" stroke="#926717"/><text x="143" y="188" text-anchor="middle" class="body ink">电流降到阈值内</text><path d="M143 205V224" class="flow" marker-end="url(#arrow)"/><rect x="48" y="228" width="190" height="42" rx="21" class="bg gate" stroke="#926717"/><text x="143" y="254" text-anchor="middle" class="body ink">持续时间满足判据</text><path d="M143 271V292" class="flow" marker-end="url(#arrow)"/><rect x="61" y="298" width="164" height="38" rx="10" class="green gate"/><text x="143" y="322" text-anchor="middle" class="head green-text">允许建立满充参考</text><text x="143" y="372" text-anchor="middle" class="tiny red-text">限流或低温降额，不得冒充满充</text></g>
  <g transform="translate(357 92)"><rect width="286" height="354" rx="18" class="teal card"/><text x="143" y="34" text-anchor="middle" class="head teal-text">静置 OCV</text><text x="143" y="56" text-anchor="middle" class="small muted">先证明状态稳定，再证明表能用</text><path d="M143 72V89" class="flow" marker-end="url(#arrow)"/><g class="body ink"><rect x="28" y="94" width="104" height="38" rx="19" class="bg gate" stroke="#176b73"/><text x="80" y="118" text-anchor="middle">电流</text><rect x="154" y="94" width="104" height="38" rx="19" class="bg gate" stroke="#176b73"/><text x="206" y="118" text-anchor="middle">温度</text><rect x="28" y="148" width="104" height="38" rx="19" class="bg gate" stroke="#176b73"/><text x="80" y="172" text-anchor="middle">静置时间</text><rect x="154" y="148" width="104" height="38" rx="19" class="bg gate" stroke="#176b73"/><text x="206" y="172" text-anchor="middle">电压变化率</text></g><path d="M80 188V210M206 188V210M80 210H206M143 210V226" class="flow" marker-end="url(#arrow)"/><rect x="42" y="232" width="202" height="42" rx="21" class="bg gate" stroke="#176b73"/><text x="143" y="258" text-anchor="middle" class="body ink">匹配电芯 · 温度 · 历史的表</text><path d="M143 275V292" class="flow" marker-end="url(#arrow)"/><rect x="61" y="298" width="164" height="38" rx="10" class="green gate"/><text x="143" y="322" text-anchor="middle" class="head green-text">允许按置信度校正</text><text x="143" y="372" text-anchor="middle" class="tiny red-text">低电流，不等于极化已经消失</text></g>
  <g transform="translate(686 92)"><rect width="286" height="354" rx="18" class="purple card"/><text x="143" y="34" text-anchor="middle" class="head purple-text">受控初始化</text><text x="143" y="56" text-anchor="middle" class="small muted">旧记录必须证明仍代表这块电池</text><path d="M143 72V89" class="flow" marker-end="url(#arrow)"/><g class="body ink"><rect x="28" y="94" width="104" height="38" rx="19" class="bg gate" stroke="#7c648e"/><text x="80" y="118" text-anchor="middle">时间戳</text><rect x="154" y="94" width="104" height="38" rx="19" class="bg gate" stroke="#7c648e"/><text x="206" y="118" text-anchor="middle">温度</text><rect x="28" y="148" width="104" height="38" rx="19" class="bg gate" stroke="#7c648e"/><text x="80" y="172" text-anchor="middle">参数版本</text><rect x="154" y="148" width="104" height="38" rx="19" class="bg gate" stroke="#7c648e"/><text x="206" y="172" text-anchor="middle">容量身份</text></g><path d="M80 188V210M206 188V210M80 210H206M143 210V226" class="flow" marker-end="url(#arrow)"/><rect x="42" y="232" width="202" height="42" rx="21" class="bg gate" stroke="#7c648e"/><text x="143" y="251" text-anchor="middle" class="small ink">断电耗电、换芯、参数变化</text><text x="143" y="267" text-anchor="middle" class="tiny muted">均在有效窗口内</text><path d="M143 275V292" class="flow" marker-end="url(#arrow)"/><rect x="61" y="298" width="164" height="38" rx="10" class="green gate"/><text x="143" y="322" text-anchor="middle" class="head green-text">允许作为新起点</text><text x="143" y="372" text-anchor="middle" class="tiny red-text">换芯或记录过期，必须重建起点</text></g>
  <path d="M171 449V476M500 449V476M829 449V476M171 476H829" class="flow"/><path d="M500 476V494" class="flow" marker-end="url(#arrow)"/><rect x="304" y="500" width="392" height="54" rx="14" class="green card"/><text x="500" y="524" text-anchor="middle" class="head green-text">资格通过：这一次参考才有校正权</text><text x="500" y="545" text-anchor="middle" class="small ink">校正幅度仍由置信度、平滑要求与安全边界决定</text><path d="M962 468C952 489 945 518 918 530C894 541 862 537 838 524" class="return" marker-end="url(#return-arrow)"/><text x="958" y="493" text-anchor="end" class="small red-text">任一门失败</text><text x="958" y="511" text-anchor="end" class="tiny red-text">继续库仑计数</text>
</svg>
