<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440">
  <title>钠离子与锂离子电压窗口对照示意图</title>
  <rect width="880" height="440" fill="#f8fafc"/>
  <style>
  text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
  @media (prefers-color-scheme: dark){
  rect[fill="#f8fafc"]{fill:#0f172a}
  rect[fill="#fff"]{fill:#1e293b}
  [fill="#e2e8f0"]{fill:#334155}
  [stroke="#e2e8f0"]{stroke:#334155}
  [fill="#334155"]{fill:#e2e8f0}
  [stroke="#334155"]{stroke:#e2e8f0}
  [fill="#1e293b"]{fill:#f1f5f9}
  [stroke="#1e293b"]{stroke:#f1f5f9}
  [fill="#dbeafe"]{fill:#1e3a8a}
  [stroke="#dbeafe"]{stroke:#1e3a8a}
  [fill="#bfdbfe"]{fill:#1e40af}
  [stroke="#bfdbfe"]{stroke:#1e40af}
  [fill="#1d4ed8"]{fill:#60a5fa}
  [stroke="#1d4ed8"]{stroke:#60a5fa}
  [fill="#ecfdf5"]{fill:#022c22}
  [stroke="#ecfdf5"]{stroke:#022c22}
  [fill="#a7f3d0"]{fill:#065f46}
  [stroke="#a7f3d0"]{stroke:#065f46}
  [fill="#059669"]{fill:#34d399}
  [stroke="#059669"]{stroke:#34d399}
  [fill="#fffbeb"]{fill:#451a03}
  [stroke="#fffbeb"]{stroke:#451a03}
  [fill="#fef3c7"]{fill:#78350f}
  [stroke="#fef3c7"]{stroke:#78350f}
  [fill="#b45309"]{fill:#fbbf24}
  [stroke="#b45309"]{stroke:#fbbf24}
  [fill="#fef2f2"]{fill:#450a0a}
  [stroke="#fef2f2"]{stroke:#450a0a}
  [fill="#fecaca"]{fill:#7f1d1d}
  [stroke="#fecaca"]{stroke:#7f1d1d}
  [fill="#dc2626"]{fill:#f87171}
  [stroke="#dc2626"]{stroke:#f87171}
  }
  </style>
  <text x="440" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">示意图：锂电 4.2 V 示例不能套到这篇钠电实验上</text>
  <rect x="16" y="52" width="410" height="250" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="32" y="78" font-size="15" font-weight="bold" fill="#1e293b">液态锂电示例</text>
  <line x1="48" y1="210" x2="48" y2="110" stroke="#334155"/>
  <line x1="48" y1="210" x2="360" y2="210" stroke="#334155"/>
  <text x="56" y="126" font-size="12" fill="#334155">4.2 V 常见满充示例</text>
  <line x1="48" y1="130" x2="200" y2="130" stroke="#dc2626"/>
  <text x="56" y="168" font-size="12" fill="#334155">3.65 V 只是铁锂示例</text>
  <text x="32" y="246" font-size="13" fill="#334155">保护板默认档跟着这张表走。</text>
  <text x="32" y="270" font-size="13" fill="#334155">它不是钠离子的红线。</text>

  <rect x="444" y="52" width="420" height="250" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="460" y="78" font-size="15" font-weight="bold" fill="#1e293b">一篇软包实验（不是通用规格）</text>
  <line x1="476" y1="210" x2="476" y2="110" stroke="#334155"/>
  <line x1="476" y1="210" x2="820" y2="210" stroke="#334155"/>
  <line x1="476" y1="150" x2="700" y2="150" stroke="#059669"/>
  <text x="486" y="144" font-size="12" fill="#1e293b">3.80 V：该实验里保持更好</text>
  <line x1="476" y1="120" x2="760" y2="120" stroke="#dc2626"/>
  <text x="486" y="114" font-size="12" fill="#dc2626">4.00 V：正极副反应更重</text>
  <circle cy="150" r="6" fill="#b45309">
    <animate attributeName="cy" values="168;120;168" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <text x="460" y="246" font-size="13" fill="#334155">条件写在论文里：C/5，40°C。</text>
  <text x="460" y="270" font-size="13" fill="#334155">黄点在两条线之间移动。</text>

  <text x="16" y="336" font-size="14" fill="#1e293b">Hijazi 等，J. Electrochem. Soc.，2023。层状氧化物 / 硬碳软包。大于 C/2 时该文报告有金属钠析出。</text>
  <text x="16" y="364" font-size="14" fill="#334155">另一篇全电池的 OCV 可以比对照锂电更陡。不要写「钠电平台一律更平」。</text>
  <text x="16" y="398" font-size="14" fill="#b45309">示意图，不是电芯照片。没有这颗电芯的手册，就不要充。</text>
</svg>
