  <text class="txt" x="40" y="72" opacity="1" style="opacity: 1;">① 去抖为 0<tspan class="small">　反应 10 ms 之后，诊断周期最多 90 ms。</tspan></text>
  <text class="txt" x="40" y="98" opacity="1" style="opacity: 1;">② 去抖 20 ms<tspan class="small">　上限 70 ms。斜率是 −1：去抖多 1，周期少 1。</tspan></text>
  <text class="txt" x="40" y="124" opacity="1" style="opacity: 1;">③ 红点是坏例子<tspan class="small">　去抖 50、周期也取 50，加反应 10，一共 110，超过 100。</tspan></text>
  <text class="txt" x="40" y="150" opacity="1" style="opacity: 1;">④ 线以下才算数<tspan class="small">　周期大于这条线，这项诊断在预算里等于没有。</tspan></text>
