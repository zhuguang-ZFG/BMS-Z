<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 544" font-family="ui-monospace, Consolas, monospace">
  <title>窗口看门狗：80 ms 喂一次，100 ms 超时。漏喂之后沿直线撞上限。数字为示意。</title>
  <desc>亮点看锯齿：80 ms 准时踢回 0 一次，漏喂的那齿沿直线爬过 100 ms 红线，停在那里等复位。</desc>

  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.5; fill: none; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
    }
  </style>

  <!-- formula: c=t for t<80; c=t-80 until 180; latch at 100. Missed kick at 160 does not reset -->
  <rect class="bg" width="800" height="544"/>
  <text class="title" x="24" y="32">喂狗是把一条斜线反复折回原点（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="128" rx="6"/>
  <text class="txt" x="40" y="72" opacity="0.28">① 第一齿在爬<tspan class="small">　0 到 60 ms，计数从 0 到 60。斜率是 1。80 ms 那一脚还在前面。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="98" opacity="0.28">② 80 ms 踢回 0<tspan class="small">　第二齿开始。这一拍走到 120 ms，计数是 40。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="124" opacity="0.28">③ 160 ms 没踢上<tspan class="small">　当时计数已是 80，不回 0。180 ms 撞上 100。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="150" opacity="0.28">④ 停在红线<tspan class="small">　上次成功是 80 ms，加超时 100 ms。复位已发出。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="188" width="752" height="304" rx="6"/>
  <text class="small" x="40" y="210">距上次喂狗 ms（示意）</text>
  <line class="axis" x1="108.0" y1="228.0" x2="108.0" y2="430.0"/>
  <line class="axis" x1="108.0" y1="430.0" x2="730.0" y2="430.0"/>
  <text class="small" x="730.0" y="468.0" text-anchor="end">时间 ms</text>
  <line class="grid" x1="108.0" y1="430.0" x2="108.0" y2="436.0"/>
  <text class="small" x="108.0" y="452.0" text-anchor="middle">0</text>
  <line class="grid" x1="315.3" y1="430.0" x2="315.3" y2="436.0"/>
  <text class="small" x="315.3" y="452.0" text-anchor="middle">80</text>
  <line class="grid" x1="522.7" y1="430.0" x2="522.7" y2="436.0"/>
  <text class="small" x="522.7" y="452.0" text-anchor="middle">160</text>
  <line class="grid" x1="574.5" y1="430.0" x2="574.5" y2="436.0"/>
  <text class="small" x="574.5" y="452.0" text-anchor="middle">180</text>
  <line class="grid" x1="730.0" y1="430.0" x2="730.0" y2="436.0"/>
  <text class="small" x="730.0" y="452.0" text-anchor="middle">240</text>
  <line class="grid" x1="102.0" y1="295.3" x2="108.0" y2="295.3"/>
  <text class="small" x="98.0" y="299.3" text-anchor="end">80</text>
  <line class="grid" x1="102.0" y1="261.7" x2="108.0" y2="261.7"/>
  <text class="small" x="98.0" y="265.7" text-anchor="end">100</text>
  <line class="liner" x1="108.0" y1="261.7" x2="730.0" y2="261.7"/>
