<svg xmlns="http://www.w3.org/2000/svg" width="800" height="550" viewBox="0 0 800 550" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>没充电，电量显示怎么还涨了？</title>
  <desc>教学假设：同一块 100 Ah 电池，初始剩余 50 Ah，即 50%；真实电流始终为 0 A，忽略自放电与静态耗电。电流计把 0 A 误读成 +0.1 A，正号表示充电，因此估算不断多记电量。12 小时多记 1.2 Ah，估算为 51.2%；24 小时多记 2.4 Ah，估算为 52.4%。左卡和蓝线表示真实电量，始终为 50%；右卡固定预告 24 小时后的显示结果，不表示动画当前时刻。红线表示估算从 50% 线性升至 52.4%，金点标记沿线推进的时刻。每轮动画共 12 秒，前 8 秒线性展示 0 至 24 小时，最后 4 秒停在终点；无动画时红线完整，金点位于 24 小时终点。电池半满的液面仅为电量示意，不是电芯内的真实液面。增加的是记录，不是电。</desc>
  <style>
    .bg { fill: #fffdf5; }
    .panel { fill: #f7f2e5; stroke: #cfc6b2; }
    .txt { fill: #293b3a; font-size: 20px; }
    .small { fill: #626d65; font-size: 16px; }
    .title { fill: #293b3a; font-size: 28px; font-weight: bold; }
    .label { font-size: 24px; }
    .big { font-size: 64px; font-weight: bold; }
    .caption { font-size: 22px; }
    .conclusion { font-size: 26px; }
    .hi { fill: #176b73; }
    .warn { fill: #b84745; }
    .gold { fill: #926717; }
    .cell { fill: #e4f0df; stroke: #176b73; stroke-width: 2; }
    .charge { fill: #176b73; opacity: 0.24; }
    .axis { fill: none; stroke: #626d65; stroke-width: 1.5; }
    .grid { fill: none; stroke: #cfc6b2; stroke-width: 1; }
    .lineb { fill: none; stroke: #176b73; stroke-width: 3; }
    .liner { fill: none; stroke: #b84745; stroke-width: 3; }
    .dot { fill: #926717; stroke: #fffdf5; stroke-width: 2; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #192727; }
      .panel { fill: #223333; stroke: #496160; }
      .txt, .title { fill: #edf0e5; }
      .small { fill: #b0beb3; }
      .hi { fill: #7ec5c5; }
      .warn { fill: #f39b91; }
      .gold { fill: #dfbd78; }
      .cell { fill: #293f35; stroke: #7ec5c5; }
      .charge { fill: #7ec5c5; }
      .axis { stroke: #b0beb3; }
      .grid { stroke: #496160; }
      .lineb { stroke: #7ec5c5; }
      .liner { stroke: #f39b91; }
      .dot { fill: #dfbd78; stroke: #192727; }
    }
  </style>
  <rect class="bg" width="800" height="550"/>
  <text class="title" x="24" y="40">没充电，电量显示怎么还涨了？</text>
  <text class="small" x="24" y="68">100 Ah · 初始 50% · 教学假设：忽略自放电与静态耗电</text>

  <rect class="panel" x="24" y="92" width="364" height="182" rx="12"/>
  <text class="txt label" x="46" y="126">电池里实际剩余</text>
  <rect class="cell" x="86" y="144" width="24" height="8" rx="2"/>
  <rect class="cell" x="64" y="152" width="68" height="92" rx="7"/>
  <path class="charge" d="M66 198 H130 V237 Q130 242 125 242 H71 Q66 242 66 237 Z"/>
  <path class="lineb" d="M66 198 H130"/>
  <text class="small" x="98" y="263" text-anchor="middle">液面示意</text>
  <text class="txt big hi" x="162" y="219">50%</text>
  <text class="txt" x="166" y="259">始终不变</text>

  <rect class="panel" x="412" y="92" width="364" height="182" rx="12"/>
  <text class="txt label" x="436" y="126">屏幕上的估算</text>
  <text class="txt" x="436" y="165">24h后显示</text>
  <text class="txt big warn" x="436" y="237">52.4%</text>

  <text class="txt caption" x="400" y="312" text-anchor="middle">电流计把 0 A 误读成 <tspan class="warn">+0.1 A</tspan></text>

  <path class="grid" d="M112 354 H664 M112 405 H664 M112 456 H664"/>
  <path class="axis" d="M112 344 V470 H676"/>
  <text class="txt" x="98" y="361" text-anchor="end">52.4%</text>
  <text class="txt" x="98" y="412" text-anchor="end">51.2%</text>
  <text class="txt" x="98" y="463" text-anchor="end">50%</text>
  <path class="lineb" d="M112 456 H664"/>
  <path class="liner" d="M112 456 L664 354" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" calcMode="linear" data-ease="linear" values="1000;0;0" keyTimes="0;0.666666667;1" dur="12s" repeatCount="indefinite"/>
  </path>
  <circle class="dot" r="6" cx="664" cy="354">
    <animate attributeName="cx" calcMode="linear" data-ease="linear" values="112;664;664" keyTimes="0;0.666666667;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" calcMode="linear" data-ease="linear" values="456;354;354" keyTimes="0;0.666666667;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <text class="txt" x="112" y="490" text-anchor="middle">0 h</text>
  <text class="txt" x="388" y="490" text-anchor="middle">12 h</text>
  <text class="txt" x="664" y="490" text-anchor="middle">24 h</text>
  <text class="txt warn" x="684" y="361">估算</text>
  <text class="txt hi" x="684" y="463">真实</text>

  <text class="title conclusion gold" x="400" y="531" text-anchor="middle">增加的是记录，不是电</text>
</svg>
