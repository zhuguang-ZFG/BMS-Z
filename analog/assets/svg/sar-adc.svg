<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">SAR ADC：四位天平，四次称出答案</text>

<text x="240" y="52" text-anchor="middle" font-size="14" font-weight="bold" fill="#37424e">SAR = 二分查找的硬件版（4 位演示：满量程 16，输入 5.3）</text>
<rect x="60" y="100" width="90" height="50" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<text x="105" y="122" text-anchor="middle" font-size="11" fill="#37424e">采样保持</text>
<text x="105" y="140" text-anchor="middle" font-size="10" fill="#1f5d7a">5.3V 抓住</text>
