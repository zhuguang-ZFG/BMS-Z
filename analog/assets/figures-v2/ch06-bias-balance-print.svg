<text x="50" y="583" font-size="23" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">20 nA × 1 kΩ = 20 µV；× 100 kΩ = 2 mV。</text>
<text x="50" y="630" font-size="23" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">阻值匹配与温度跟踪影响残余；Rb 自身也贡献热噪声。</text>
