<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460">
  <title>AFE 寄存器读取与 CRC 校验动画</title>
  <rect width="800" height="460" fill="#f8fafc"/>
  <style>
  text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
  /* 深色模式：GitHub 深色主题下对调底色与文字色，只覆盖配色，不动几何与动画。
     stroke="#fff" 保持白色——那是彩色徽标上的勾选，不在覆盖范围内。 */
  @media (prefers-color-scheme: dark){
  rect[fill="#f8fafc"]{fill:#0f172a}
  rect[fill="#fff"]{fill:#1e293b}
  [fill="#f1f5f9"]{fill:#1e293b}
  [stroke="#f1f5f9"]{stroke:#1e293b}
  [fill="#e2e8f0"]{fill:#334155}
  [stroke="#e2e8f0"]{stroke:#334155}
  [fill="#cbd5e1"]{fill:#475569}
  [stroke="#cbd5e1"]{stroke:#475569}
  [fill="#64748b"]{fill:#94a3b8}
  [stroke="#64748b"]{stroke:#94a3b8}
  [fill="#475569"]{fill:#cbd5e1}
  [stroke="#475569"]{stroke:#cbd5e1}
  [fill="#334155"]{fill:#e2e8f0}
  [stroke="#334155"]{stroke:#e2e8f0}
  [fill="#1e293b"]{fill:#f1f5f9}
  [stroke="#1e293b"]{stroke:#f1f5f9}
  [fill="#dbeafe"]{fill:#1e3a8a}
  [stroke="#dbeafe"]{stroke:#1e3a8a}
  [fill="#eff6ff"]{fill:#172554}
  [stroke="#eff6ff"]{stroke:#172554}
  [fill="#bfdbfe"]{fill:#1e40af}
  [stroke="#bfdbfe"]{stroke:#1e40af}
  [fill="#1d4ed8"]{fill:#60a5fa}
  [stroke="#1d4ed8"]{stroke:#60a5fa}
  [fill="#1e40af"]{fill:#93c5fd}
  [stroke="#1e40af"]{stroke:#93c5fd}
  [fill="#2563eb"]{fill:#60a5fa}
  [stroke="#2563eb"]{stroke:#60a5fa}
  [fill="#3b82f6"]{fill:#60a5fa}
  [stroke="#3b82f6"]{stroke:#60a5fa}
  [fill="#ecfdf5"]{fill:#022c22}
  [stroke="#ecfdf5"]{stroke:#022c22}
  [fill="#a7f3d0"]{fill:#065f46}
  [stroke="#a7f3d0"]{stroke:#065f46}
  [fill="#86efac"]{fill:#166534}
  [stroke="#86efac"]{stroke:#166534}
  [fill="#065f46"]{fill:#6ee7b7}
  [stroke="#065f46"]{stroke:#6ee7b7}
  [fill="#059669"]{fill:#34d399}
  [stroke="#059669"]{stroke:#34d399}
  [fill="#fef2f2"]{fill:#450a0a}
  [stroke="#fef2f2"]{stroke:#450a0a}
  [fill="#fecaca"]{fill:#7f1d1d}
  [stroke="#fecaca"]{stroke:#7f1d1d}
  [fill="#fca5a5"]{fill:#b91c1c}
  [stroke="#fca5a5"]{stroke:#b91c1c}
  [fill="#991b1b"]{fill:#fca5a5}
  [stroke="#991b1b"]{stroke:#fca5a5}
  [fill="#dc2626"]{fill:#f87171}
  [stroke="#dc2626"]{stroke:#f87171}
  [fill="#fffbeb"]{fill:#451a03}
  [stroke="#fffbeb"]{stroke:#451a03}
  [fill="#fef3c7"]{fill:#78350f}
  [stroke="#fef3c7"]{stroke:#78350f}
  [fill="#92400e"]{fill:#fcd34d}
  [stroke="#92400e"]{stroke:#fcd34d}
  [fill="#b45309"]{fill:#fbbf24}
  [stroke="#b45309"]{stroke:#fbbf24}
  }
</style>

  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">读一个 AFE 寄存器：时序、校验、重读</text>

  <!-- I2C 事务分段 -->
  <rect x="90" y="110" width="60" height="40" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <rect x="152" y="110" width="100" height="40" fill="#dbeafe" stroke="#64748b" stroke-width="1.5"/>
  <rect x="254" y="110" width="110" height="40" fill="#fef3c7" stroke="#64748b" stroke-width="1.5"/>
  <rect x="366" y="110" width="80" height="40" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <rect x="448" y="110" width="100" height="40" fill="#dbeafe" stroke="#64748b" stroke-width="1.5"/>
  <rect x="550" y="110" width="100" height="40" fill="#ecfdf5" stroke="#64748b" stroke-width="1.5"/>
  <rect x="652" y="110" width="90" height="40" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <rect x="744" y="110" width="50" height="40" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="120" y="134" text-anchor="middle" font-size="12" fill="#475569">START</text>
  <text x="202" y="134" text-anchor="middle" font-size="12" fill="#475569">从机地址+W</text>
  <text x="309" y="134" text-anchor="middle" font-size="12" fill="#475569">寄存器地址</text>
  <text x="406" y="134" text-anchor="middle" font-size="12" fill="#475569">RESTART</text>
  <text x="498" y="134" text-anchor="middle" font-size="12" fill="#475569">从机地址+R</text>
  <text x="600" y="134" text-anchor="middle" font-size="12" fill="#475569">数据字节</text>
  <text x="697" y="134" text-anchor="middle" font-size="12" fill="#475569">CRC 字节</text>
  <text x="769" y="134" text-anchor="middle" font-size="12" fill="#475569">STOP</text>

  <!-- 高亮光标逐段走过 -->
  <rect y="106" height="48" rx="4" fill="none" stroke="#2563eb" stroke-width="3" x="90" width="60" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.44;0.48;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="x" values="90;152;254;366;448;550;652;744" keyTimes="0;0.055;0.11;0.165;0.22;0.275;0.33;0.385" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="width" values="60;100;110;80;100;100;90;50" keyTimes="0;0.055;0.11;0.165;0.22;0.275;0.33;0.385" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </rect>

  <!-- 数据送达 MCU -->
  <circle r="5" fill="#059669" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.36;0.39;0.44;0.48;1" dur="12s" repeatCount="indefinite"/>
    <animateMotion path="M600,150 L400,225" keyPoints="0;0;1;1" keyTimes="0;0.36;0.44;1" calcMode="linear" dur="12s" repeatCount="indefinite"/>
  </circle>
  <rect x="300" y="225" width="200" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">MCU 本地重算 CRC</text>
  <text x="400" y="268" text-anchor="middle" font-size="11" fill="#475569">与 AFE 用同一多项式</text>

  <!-- 第二幕：校验通过 -->
  <text x="400" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#059669" opacity="0">0x5A = 0x5A ✓ 采纳，写入电压缓存
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.48;0.52;0.6;0.64;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- 第三幕：线束受扰，位翻转，丢弃重读 -->
  <path d="M614,78 L600,104 L616,106 L600,138" fill="none" stroke="#dc2626" stroke-width="3" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.58;0.6;0.66;0.68;1" dur="12s" repeatCount="indefinite"/>
  </path>
  <text x="640" y="84" text-anchor="start" font-size="12" fill="#dc2626" opacity="0">线束受扰
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.58;0.6;0.66;0.68;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <rect x="550" y="110" width="100" height="40" fill="#dc2626" opacity="0">
    <animate attributeName="opacity" values="0;0;0.35;0;0.3;0;0" keyTimes="0;0.6;0.62;0.64;0.66;0.68;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text x="600" y="168" text-anchor="middle" font-size="12" fill="#dc2626" opacity="0">0x5A → 0xC3（位翻转）
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.62;0.65;0.78;0.81;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="400" y="342" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626" opacity="0">0x5A ≠ 0xC3 ✗ 丢弃，重读一次——不拿错数据做保护决策
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.66;0.7;0.8;0.84;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- 第四幕：快照提醒 -->
  <rect x="170" y="360" width="460" height="30" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.87;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text x="400" y="379" text-anchor="middle" font-size="12" fill="#92400e" opacity="0">读到的是寄存器快照：AFE 每 250ms 才刷新一轮（示例），别把旧数据当新鲜
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.87;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <text x="400" y="444" text-anchor="middle" font-size="13" fill="#475569">关键：带 CRC 的读才算读到；读到的是快照，不是此刻。</text>
</svg>
