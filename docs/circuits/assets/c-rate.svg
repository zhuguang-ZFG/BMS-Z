dth="2.5" stroke-linejoin="round" stroke-linecap="round" class="stroke-b" /><circle r="5" class="fill-y"><animate attributeName="cx" values="70.0;118.8;167.5;216.2;265.0;313.8;362.5;411.2;460.0" keyTimes="0.0000;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1.0000" dur="8s" repeatCount="indefinite" /><animate attributeName="cy" values="588.0;575.3;562.7;550.0;537.3;524.7;512.0;499.3;486.7" keyTimes="0.0000;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1.0000" dur="8s" repeatCount="indefinite" /></circle><text x="475.7" y="606.0" text-anchor="start" font-size="12" class="small">倍率 C</text><text x="480" y="516.0" font-size="12" class="txt">0.5C → 10 A；2C → 40 A</text>
