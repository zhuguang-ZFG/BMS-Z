    <text class="head" x="288" y="286">④ 换种问法，答案还稳吗？</text>
    <text class="small" x="288" y="306">重问、重算、重放一遍再看</text>
    <text class="ok" x="724" y="292" text-anchor="end" opacity="1" style="opacity: 1;">稳得住才算数</text>
  </g>

  <path d="M23.54 382Q24 372 34 372L400 371.59L766 372Q776 372 776 382L776.85 394L776 406Q776 416 766 416L400 415.75L34 416Q24 416 24 406L24 381.73" class="bms-sticker" aria-hidden="true"/>
  <text class="txt" x="40" y="390">模型给候选，程序复算，人签字；复问是最后一道——语气最肯定的答案，最值得换问法再问一次。</text>
  <text class="small" x="40" y="408">探针按失败扩散的顺序排：要出处、要原文、要运行结果、要反例，最后换一种问法复核。</text>
