<text x="470" y="180" font-size="10.5" fill="#5b666f">膝点：V_CE=0.2V，I_C≈5.9mA</text>
<path d="M456,214 L460,224 L464,236 L470,250 L476,260 L507,260 L620,260 L700,260 L790,259" fill="none" stroke="#2f7f96" stroke-width="2.4"/>
