<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="sc-t sc-d">
  <title id="sc-t">一串电芯走到寄存器：每一级都掺一点</title>
  <desc id="sc-d">电芯电压先经分压与 RC 低通缩小，再由多路开关轮流接到共用的转换器，最后以数字量存进寄存器；分压电阻的容差形成比例误差，开关漏电和电荷注入抬高零点，基准漂移与量化台阶形成偏置，而寄存器里只是上一拍转换的快照。</desc>
  <defs>
    <marker id="arrow-accent" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path class="head-accent" d="M0 0L9 4.5L0 9Z"/>
    </marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path class="head-red" d="M0 0L9 4.5L0 9Z"/>
    </marker>
    <style>
      text { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #293b3a; }
      .title { font-size: 20px; font-weight: 700; fill: #293b3a; }
      .sub { font-size: 12px; fill: #626d65; }
      .h { font-size: 15px; font-weight: 700; fill: #293b3a; }
      .body { font-size: 13px; fill: #293b3a; }
      .small { font-size: 12px; fill: #626d65; }
      .tiny { font-size: 12px; fill: #626d65; }
      .accent { fill: #176b73; }
      .green { fill: #377b60; }
      .red { fill: #b84745; }
      .gold { fill: #926717; }
      .paper { fill: #fffdf5; }
      .card { fill: #fffdf5; stroke: #968d77; stroke-width: 1.4; }
      .card-green { fill: #e4f0df; stroke: #377b60; stroke-width: 1.4; }
      .card-gold { fill: #fbefc7; stroke: #926717; stroke-width: 1.4; }
      .card-red { fill: #f6e2df; stroke: #b84745; stroke-width: 1.4; }
      .strip { fill: #e4f0df; stroke: #377b60; stroke-width: 1.4; }
      .flow { stroke: #176b73; stroke-width: 2; fill: none; }
      .fault { stroke: #b84745; stroke-width: 1.8; fill: none; }
      .leader { stroke: #626d65; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; }
      .dot { fill: #176b73; }
      .strike { stroke: #176b73; stroke-width: 2; fill: none; }
      .head-accent { fill: #176b73; }
      .head-red { fill: #b84745; }
      @media (prefers-color-scheme: dark) {
        text { fill: #edf0e5; }
        .title { fill: #edf0e5; }
        .sub { fill: #b0beb3; }
        .h { fill: #edf0e5; }
        .body { fill: #edf0e5; }
        .small { fill: #b0beb3; }
        .tiny { fill: #b0beb3; }
        .accent { fill: #7ec5c5; }
        .green { fill: #8fc7a2; }
        .red { fill: #f39b91; }
        .gold { fill: #dfbd78; }
        .paper { fill: #223333; }
        .card { fill: #223333; stroke: #71908c; }
        .card-green { fill: #293f35; stroke: #8fc7a2; }
        .card-gold { fill: #453e2b; stroke: #dfbd78; }
        .card-red { fill: #483336; stroke: #f39b91; }
        .strip { fill: #293f35; stroke: #8fc7a2; }
        .flow { stroke: #7ec5c5; }
        .fault { stroke: #f39b91; }
        .leader { stroke: #b0beb3; }
        .dot { fill: #7ec5c5; }
        .strike { stroke: #7ec5c5; }
        .head-accent { fill: #7ec5c5; }
        .head-red { fill: #f39b91; }
      }
    </style>
  </defs>

  <rect class="paper" x="0" y="0" width="960" height="560"/>

  <text x="480" y="32" text-anchor="middle" class="title">一串电芯走到寄存器：每一级都掺一点</text>
  <path d="M300 42C378 40 466 44 552 41" class="strike" opacity=".5"/>
  <text x="480" y="62" text-anchor="middle" class="sub">同一颗转换器轮流看每一串，误差也从每一级跟着进来</text>

  <rect class="card" x="30" y="96" width="150" height="96" rx="9" transform="rotate(-0.6 105 144)"/>
  <text x="105" y="126" text-anchor="middle" class="h">电芯两端</text>
  <text x="105" y="152" text-anchor="middle" class="small">真实电压</text>
  <text x="105" y="172" text-anchor="middle" class="small">跨在采样线上</text>

  <rect class="card-gold" x="210" y="96" width="150" height="96" rx="9" transform="rotate(0.5 285 144)"/>
  <text x="285" y="126" text-anchor="middle" class="h">分压与 RC</text>
  <text x="285" y="152" text-anchor="middle" class="small">按比例缩小</text>
  <text x="285" y="172" text-anchor="middle" class="small">电阻容差决定</text>

  <rect class="card-green" x="390" y="96" width="150" height="96" rx="9" transform="rotate(-0.5 465 144)"/>
  <text x="465" y="126" text-anchor="middle" class="h">多路开关</text>
  <text x="465" y="152" text-anchor="middle" class="small">轮流把一路</text>
  <text x="465" y="172" text-anchor="middle" class="small">接到后面</text>

  <rect class="card-gold" x="570" y="96" width="150" height="96" rx="9" transform="rotate(0.6 645 144)"/>
  <text x="645" y="126" text-anchor="middle" class="h">转换与基准</text>
  <text x="645" y="152" text-anchor="middle" class="small">整摞共用基准</text>
  <text x="645" y="172" text-anchor="middle" class="small">量化成台阶</text>

  <rect class="card" x="750" y="96" width="150" height="96" rx="9" transform="rotate(-0.6 825 144)"/>
  <text x="825" y="126" text-anchor="middle" class="h">寄存器</text>
  <text x="825" y="152" text-anchor="middle" class="small">存的是上一拍</text>
  <text x="825" y="172" text-anchor="middle" class="small">转换的快照</text>

  <path class="flow" d="M180 144H204" marker-end="url(#arrow-accent)"/>
  <path class="flow" d="M360 144H384" marker-end="url(#arrow-accent)"/>
  <path class="flow" d="M540 144H564" marker-end="url(#arrow-accent)"/>
  <path class="flow" d="M720 144H744" marker-end="url(#arrow-accent)"/>

  <path class="fault" d="M285 214V198" marker-end="url(#arrow-red)"/>
  <path class="fault" d="M465 214V198" marker-end="url(#arrow-red)"/>
  <path class="fault" d="M645 214V198" marker-end="url(#arrow-red)"/>
  <path class="fault" d="M825 214V198" marker-end="url(#arrow-red)"/>

  <text x="285" y="234" text-anchor="middle" class="body red">比例误差</text>
  <text x="285" y="254" text-anchor="middle" class="small">分压电阻的容差</text>
  <text x="465" y="234" text-anchor="middle" class="body red">偏置误差</text>
  <text x="465" y="254" text-anchor="middle" class="small">漏电与电荷注入</text>
  <text x="645" y="234" text-anchor="middle" class="body red">偏置与台阶</text>
  <text x="645" y="254" text-anchor="middle" class="small">基准漂移、量化</text>
  <text x="825" y="234" text-anchor="middle" class="body red">年龄</text>
  <text x="825" y="254" text-anchor="middle" class="small">不是这一刻</text>

  <text x="40" y="288" class="small accent">按性质分三类看：能校准的、修不掉的、只能靠设计的</text>

  <rect class="card-green" x="40" y="300" width="290" height="110" rx="10" transform="rotate(-0.4 185 355)"/>
  <text x="185" y="332" text-anchor="middle" class="h green">校准修得掉</text>
  <text x="185" y="360" text-anchor="middle" class="body">比例：一个系数</text>
  <text x="185" y="384" text-anchor="middle" class="body">零点：一个偏移</text>

  <rect class="card-red" x="345" y="300" width="290" height="110" rx="10" transform="rotate(0.4 490 355)"/>
  <text x="490" y="332" text-anchor="middle" class="h red">校准修不掉</text>
  <text x="490" y="360" text-anchor="middle" class="body">拖尾：没等稳就读</text>
  <text x="490" y="384" text-anchor="middle" class="body">漂移：随温度走</text>

  <rect class="card-gold" x="650" y="300" width="280" height="110" rx="10" transform="rotate(-0.4 790 355)"/>
  <text x="790" y="332" text-anchor="middle" class="h gold">只能靠设计</text>
  <text x="790" y="360" text-anchor="middle" class="body">留足稳定时间</text>
  <text x="790" y="384" text-anchor="middle" class="body">分压臂与基准同温</text>

  <rect class="strip" x="80" y="440" width="800" height="48" rx="12"/>
  <text x="480" y="470" text-anchor="middle" class="h green">能用一个系数修掉的先修掉；修不掉的，留给时间与温度设计</text>

  <text x="480" y="528" text-anchor="middle" class="tiny">误差按性质分类；具体数值与校准方式看所选 AFE 手册</text>
</svg>
