changes:
- id: ch07-threshold-budget
  source: docs/p1-08-ch7.md#7.2
  before: '**阈值精度的误差预算。** 判决点不准，很少是比较器的错。以 5 V 分压得 2.5 V 基准、两只 1% 电阻为例：分压比最坏偏差 ±2%（两只反向取极限），基准偏 ±50 mV；LM393 失调最大 ±5 mV（手册保证值）；偏流失调配平后忽略。**50
    mV 对 5 mV，电阻容差是失调的十倍**。常见误设计是花心思挑低失调器件，却用 5% 分压电阻。误差预算永远先压最大那项，再谈下一项；这个顺序与 [11.6](p2-01-ch11.md#sec-11-6) 的降噪顺序是同一个道理。'
  after: '**分压容差要算输出电压**：5V 精确电源、两只 100kΩ 的 1% 电阻反向到极限，$5\times101/(99+101)=2.525V$，反向为 2.475V。相对 2.5V 的误差是 ±25mV，即 ±1%；电阻比约
    ±2% 不能原样套到半压基准。25mV 与 25°C 最大 5mV 失调相差五倍，另加电源、温漂和偏流的相应界限。'
  caption: 分压容差与偏流误差。数值与图示的条件一起使用。
  removed_prose_chars: 71
  relationship: replaces-text
- id: ch07-pullup-three-accounts
  source: docs/p1-08-ch7.md#7.2
  before: '- **速度账**：上升沿由 $R$ 对总线与负载电容充电决定，10%→90% 约 $t_r \approx 2.2RC$，$R$ 越小沿越快。

    - **低电平账**：输出为低时，灌电流 $I_{OL}=V_{pullup}/R$ 全部进输出管。手册保证的灌电流下限是 6 mA（典型值 16 mA 量级）；灌得越多 $V_{OL}$ 越高。4.7 kΩ 上拉到 5 V：灌 1.06
    mA，$V_{OL}$ 约 0.1~0.2 V，后级低电平余量充足；330 Ω 上拉到 12 V：灌 36 mA，已超出手册保证范围，$V_{OL}$ 可能抬到接近 1 V——沿是快了，低电平却脏了。

    - **噪声账**：$R$ 越小，高电平期间节点阻抗越低，抗串扰越好。高速开漏总线用强上拉，真正的原因在这里。'
  after: '- **速度账**：10%→90% 上升时间约 $\ln9\cdot RC$，总电容包括探头、走线和后级。

    - **电流账**：低电平时 $I_{OL}=(V_{PU}-V_{OL})/R$。必须按后级允许的低电平核对 VOL，而非只看绝对最大输出电流。

    - **功耗与耦合**：R 小则电流和功耗增加；高电平时阻抗较低通常减小电容耦合引起的电压扰动，也会增加反馈网络负载。'
  caption: 上拉电阻的可行区间。数值与图示的条件一起使用。
  removed_prose_chars: 133
  relationship: replaces-text
- id: ch07-hysteresis-window
  source: docs/p1-08-ch7.md#7.3
  before: '> **注意**：迟滞把"判决点"拆成了两个点。上行 6.15 V 才报、下行 5.85 V 才解，对报警语义是特性；但对"精确过零检测""精密电平判别"就是灾难——那类应用要把窗口压到恰好盖过噪声，并在前面加滤波，而不是图省事开大窗口。**迟滞宽度就是判决的盲区宽度**，开多大由噪声决定，不由心理安全感决定。'
  after: '> **注意**：迟滞改变两个方向的动作点。精确过零或电平测量应把它引入的阈值与时间偏差纳入预算；窗口大小由抗扰要求和允许动作误差共同决定。'
  caption: 同相迟滞回环的独立参考。数值与图示的条件一起使用。
  removed_prose_chars: 80
  relationship: replaces-text
- id: ch07-release-timing-v2
  source: docs/p1-08-ch7.md#7.1
  before: '**传播延迟的定义也要先看懂**：手册的 $t_{pd}$ 从输入越过阈值算到输出到达 50%，开集电极输出的上升沿与下降沿是两个世界——下降沿由输出管主动拉，快；上升沿靠上拉电阻充，慢。手册曲线在指定上拉与负载下测得，你的上拉不同，你的延迟就不同。'
  after: '**测量终点必须读脚注**：这份经典 LM393 手册把响应时间定义为输入阶跃到输出越过 **1.4V**，并非通用的 50% 点。该值已包含测试负载对输出跨越门限的影响，不能再加一整个 10%→90% 沿。“1.3µs +
    0.3µs = 1.6µs”缺乏统一起终点，不能当作保证延迟。'
  caption: 响应时间的终点，先看手册怎样定义。独立 RC 示意：5 V、4.7 kΩ、50 pF，1 µs 时输出管释放。
  removed_prose_chars: -11
  relationship: replaces-text
- id: ch07-window-logic-v2
  source: docs/p1-08-ch7.md#7.2
  before: '**窗口比较器：线与的正经用法。** 一颗 LM393 里有两路比较器，正好做电池电压窗口监控。A 路管下阈 3.0 V（欠压），B 路管上阈 3.6 V（过压），两路输出接同一个上拉电阻构成线与。两路都接成"越界输出低"：电池经
    100 kΩ/100 kΩ 减半分压，3.0 V 与 3.6 V 折算到分压点是 1.5 V 与 1.8 V；A 路同相端接 1.5 V 基准、被测电压进反相端，低于阈值输出低；B 路反相端接 1.8 V 基准、被测电压进同相端，高于阈值输出低。任何一路越界都把公共输出拉低：**窗口内高、越界低**，一根线进
    MCU 中断。注意基准若也来自电阻分压，**电源漂移会同时移动基准而电池不动**，窗口跟着电源飘；要窗口稳，基准得用稳压源（[第 9 章](p1-10-ch9.md#ch9) 的 TL431 就是干这个的）。'
  after: '**窗口比较器先接对极性**：电池经 100kΩ/100kΩ 减半。欠压路 A 的**正端接被测分压、负端接 1.5V**，电池低于 3.0V 时拉低；过压路 B 的**正端接 1.8V、负端接被测分压**，高于 3.6V
    时拉低。两路开集电极共用一个上拉，只有都松手时输出高，因此窗口内高、越界低。基准须独立稳定，两个边界都要留误差与迟滞余量。'
  caption: 窗口内放行，要先接对两路比较极性。电池减半分压；理想门限 3.0 / 3.6 V，等于门限时不保证状态。
  removed_prose_chars: 177
  relationship: replaces-text
- id: ch07-oscillator-delay-v2
  source: docs/p1-08-ch7.md#7.3
  before: 2. 比较器传播延迟 $t_p$ 直接加进每个半周期：$T \approx 2RC\ln 3 + 2t_p$。455 Hz 时 2.6 µs 只占周期的 0.12%，可忽略；把 RC 缩到 10 kΩ×1 nF，名义频率 45.5
    kHz，延迟占理想周期的 12%，实测会比公式低约 11%。**高频弛张振荡器的频率永远比公式低**，先把 $2t_p$ 补进周期再对数。
  after: RC=10µs（10kΩ×1nF）、d=1.3µs 时，理想周期 21.972µs，完整模型 25.369µs、约 39.418kHz；只加 2d 得 24.572µs，会漏掉越阈后多走的电压路程。RC=1ms 时延迟影响较小，仍非严格只加
    2d。图中的 1.3µs 是固定延迟假设，不从 LM393 的输出跨 1.4V 典型响应反推。
  caption: 传播等待期间，电容还在继续充放电。理想推挽；阈值为四分之一、四分之三电源，RC=10 µs，双向延迟 1.3 µs。
  removed_prose_chars: 7
  relationship: replaces-text
- id: ch07-glitch-memory-v2
  source: docs/p1-08-ch7.md#7.5
  before: '**把四拍的余量数字化。** 拍③里尖峰顶到 2.6 V，距上阈值 2.727 V 还差 127 mV——这 127 mV 就是这次免疫的具体余量。同位置毛刺换成 300 mV：2.4 V+0.3 V=2.7 V，仍差 27
    mV，勉强免疫；400 mV 就越线。**免疫不是定性的，是定量的**：每次都该把"最坏毛刺幅度"与"阈值距离"摆在一起核一遍。拍④同理：输入从 2.7 V 回落 300 mV 到 2.4 V，距下阈值 2.273 V 还有 127 mV
    余量。'
  after: '**拍③ 真正越阈**：400mV 毛刺到 2.8V，超过上门限，输出翻低，返回门限随之降到 $V_{TH-}=2.273V$。毛刺结束回到 2.4V 仍保持低，因为尚未跌破下门限。'
  caption: 毛刺会不会触发，要看离当前门限多远。反相迟滞理想状态模型；上阈 2.727 V、下阈 2.273 V，初始高。
  removed_prose_chars: 117
  relationship: replaces-text
- id: ch07-hysteresis-timing-v2
  source: docs/p1-08-ch7.md#7.5
  before: '**迟滞引入的时间代价也要算。** 四拍的宏观时间由输入爬升速率决定，而迟滞把翻转点从标称值推迟到 $V_{TH+}$，推迟量 = 窗口 ÷ 输入斜率。电池电压以 1 mV/s 的斜率变化时，0.45 V 的窗口意味着报警比"标称阈值"晚到
    450 s——电量指示晚七分钟无所谓。但同样的窗口放在斜率 1 V/µs 的开关电源过流信号上，延迟只有 0.45 µs，却又嫌窗口太宽、保护动作值不准。**保护类场合的正确解并非开大迟滞：靠前级放大把信号变化率抬高**。[第 6 章](p1-07-ch6.md#ch6)
    的运放先把 100 mV 级检流信号放大 10~50 倍再判决，让"小窗口也盖得住噪声"。'
  after: '**时间代价要说明比较起点**：输入以 1mV/s 从 2.3V 上升，过 2.5V 的时刻为 200s，过 2.727V 为约 427.3s。相对单门限 2.5V 的推迟是 227.3s，对称窗口只跨一半；只有从下门限比到上门限，才是整个
    0.4545V 对应的 454.5s。保护场景也按 $(V_{TH+}-V_{nom})/(dV/dt)$ 计算，再叠加独立传播与滤波延迟。前级放大也会放大输入噪声，并增加自身误差，不能保证靠增益解决所有小信号抗扰问题。'
  caption: 相对中点的延时，只跨半个对称窗口。初态输出高；输入由 2.3 V 以 1 mV/s 上行，忽略传播与 RC 延迟。
  removed_prose_chars: 64
  relationship: replaces-text
