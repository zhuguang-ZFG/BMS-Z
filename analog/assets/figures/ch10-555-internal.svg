<text x="104" y="392" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="10.5" fill="#52606d">3×5kΩ（"555"名字由来）</text>

<circle cx="110" cy="227" r="4" fill="#b45309"/>
<path d="M110 227 H160 V208 H200" fill="none" stroke="#14213d" stroke-width="1.8"/>
<text x="126" y="205" font-family="'Book Mono',monospace" font-size="10.5" fill="#b45309">2/3VCC=6V</text>
<circle cx="110" cy="277" r="4" fill="#b45309"/>
<path d="M110 277 H170 V268 H200" fill="none" stroke="#14213d" stroke-width="1.8"/>
<text x="126" y="265" font-family="'Book Mono',monospace" font-size="10.5" fill="#b45309">1/3VCC=3V</text>

<!-- comparators -->
<polygon points="200,196 200,244 252,220" fill="#e6f6f2" stroke="#14213d" stroke-width="2" stroke-linejoin="round"/>
