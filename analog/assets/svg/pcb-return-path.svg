<rect x="35" y="438" width="730" height="34.0" rx="9" fill="#e8efe6" stroke="#3d6b4a" stroke-width="1.5" filter="url(#soft)"/><rect x="41" y="445" width="3" height="20.0" rx="1.5" fill="#3d6b4a"/><text x="400" y="460.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3d6b4a">军规：任何信号线不许跨分割/开槽！换层时回流地过孔必须贴着信号过孔——「让回流贴着脚下回家」</text>
