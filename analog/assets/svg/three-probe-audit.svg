<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">三触点对账：160mV 去了哪里</text>
<text x="400" y="62" text-anchor="middle" font-size="12.5" fill="#5b666f">「先量电源」不是看一眼 5V 在不在——三处读数只在毫伏级上才允许有差别</text>
<rect x="44" y="92" width="712" height="240" rx="14" fill="#f6eedb" stroke="#8b8272" stroke-width="2"/>
<rect x="84" y="150" width="128" height="96" rx="10" fill="#e6eff3" stroke="#1f5d7a" stroke-width="2.2"/>
<text x="148" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f5d7a">LDO 稳压器</text>
<text x="148" y="214" text-anchor="middle" font-size="11" fill="#37424e">输出脚</text>
<rect x="588" y="150" width="128" height="90" rx="10" fill="#e8efe6" stroke="#3d6b4a" stroke-width="2.2"/>
<text x="652" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#3d6b4a">运放</text>
<text x="652" y="214" text-anchor="middle" font-size="11" fill="#37424e">VCC 脚</text>
<path d="M212,196 C300,196 320,258 400,258 C480,258 500,196 588,196" fill="none" stroke="#a4630f" stroke-width="3.5"/>
<circle cx="330" cy="227" r="6" fill="#fdf8ea" stroke="#a4630f" stroke-width="2.2"/>
<circle cx="470" cy="227" r="6" fill="#fdf8ea" stroke="#a4630f" stroke-width="2.2"/>
<text x="400" y="286" text-anchor="middle" font-size="11" fill="#a4630f">0.2mm 宽 × 200mm 长 ≈ 1000 个方 → 仅走线 ≈0.5Ω，再叠过孔与接插件</text>
<path d="M652 240 Q651.87 263.00 652 286" fill="none" stroke="#37424e" stroke-width="2"/>
<path d="M636 290 Q652.00 290.00 668 290" fill="none" stroke="#37424e" stroke-width="2.6"/>
<path d="M640 300 Q652.00 299.99 664 300" fill="none" stroke="#37424e" stroke-width="2.6"/>
<path d="M652 304 Q652.05 311.00 652 318" fill="none" stroke="#37424e" stroke-width="2"/>
<text x="700" y="300" font-size="11" fill="#37424e">去耦电容</text>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0000;0.0200;1" dur="12s" repeatCount="indefinite"/><circle cx="212" cy="196" r="9" fill="#1f5d7a"/><text x="212" y="200" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#fdf8ea">①</text><text x="86" y="118" font-size="13" font-weight="bold" fill="#1f5d7a">5.02V</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2000;0.2200;1" dur="12s" repeatCount="indefinite"/><circle cx="588" cy="196" r="9" fill="#a8321f"/><text x="588" y="200" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#fdf8ea">②</text><text x="500" y="118" font-size="13" font-weight="bold" fill="#a8321f">4.86V</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4000;0.4200;1" dur="12s" repeatCount="indefinite"/><circle cx="652" cy="322" r="9" fill="#3d6b4a"/><text x="652" y="326" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#fdf8ea">③</text><text x="520" y="322" font-size="13" font-weight="bold" fill="#3d6b4a">4.86V 复核</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6000;0.6200;1" dur="12s" repeatCount="indefinite"/><path d="M212,128 v-10 M588,128 v-10 M212,128 H588" fill="none" stroke="#a8321f" stroke-width="1.8"/><text x="400" y="118" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a8321f">ΔV = 160mV @ 负载 120mA</text></g>
<rect x="84" y="368" width="632" height="96" rx="11" fill="#f6e7e1" stroke="#a8321f" stroke-width="2"/>
<text x="400" y="398" text-anchor="middle" font-size="13" font-weight="bold" fill="#a8321f">160mV ÷ 120mA ≈ 1.3Ω 路径电阻</text>
<text x="400" y="424" text-anchor="middle" font-size="11.5" fill="#37424e">走线 ≈0.5Ω（0.5mΩ/方 × 1000 方）＋ 两个过孔 ＋ 一段接插件，1Ω 出头毫不稀奇</text>
<text x="400" y="450" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5b666f">病灶在走线，不在芯片——换运放是冤枉好人</text>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.02;0.18;0.2;1" dur="12s" repeatCount="indefinite"/><rect x="242.4" y="502.9" width="315.2" height="24.1" rx="12.0" fill="#1f5d7a" fill-opacity="0.09" stroke="#1f5d7a" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.18;0.2;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="516" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1f5d7a" opacity="0">① 触点一：LDO 输出脚，带载量得 5.02V<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.18;0.2;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.2;0.22;0.38;0.4;1" dur="12s" repeatCount="indefinite"/><rect x="183.2" y="502.9" width="433.7" height="24.1" rx="12.0" fill="#a8321f" fill-opacity="0.09" stroke="#a8321f" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.22;0.38;0.4;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="516" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#a8321f" opacity="0">② 触点二：运放 VCC 脚只剩 4.86V——160mV 在路上丢了<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.22;0.38;0.4;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.4;0.42;0.58;0.6;1" dur="12s" repeatCount="indefinite"/><rect x="223.6" y="502.9" width="352.7" height="24.1" rx="12.0" fill="#3d6b4a" fill-opacity="0.09" stroke="#3d6b4a" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4;0.42;0.58;0.6;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="516" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#3d6b4a" opacity="0">③ 触点三：去耦电容两端复核，差值复现才作数<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4;0.42;0.58;0.6;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.6;0.62;0.78;0.8;1" dur="12s" repeatCount="indefinite"/><rect x="188.9" y="502.9" width="422.1" height="24.1" rx="12.0" fill="#a4630f" fill-opacity="0.09" stroke="#a4630f" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.62;0.78;0.8;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="516" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#a4630f" opacity="0">④ 160mV ÷ 120mA ≈ 1.3Ω：走线 0.5Ω＋过孔＋接插件<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.62;0.78;0.8;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 -4.0" keyTimes="0;0.8;0.82;0.98;1" dur="12s" repeatCount="indefinite"/><rect x="193.3" y="502.9" width="413.4" height="24.1" rx="12.0" fill="#5b666f" fill-opacity="0.09" stroke="#5b666f" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.8;0.82;0.98;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="516" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#5b666f" opacity="0">⑤ 三处读数只差毫伏级才算过——病灶在走线，不在芯片<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.8;0.82;0.98;1" dur="12s" repeatCount="indefinite"/></text></g>
