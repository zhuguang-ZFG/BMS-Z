<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1448 1086" role="img" aria-labelledby="title desc" data-print-width-mm="138" data-composition="technical-overlay-v1" data-base-medium="python-svg"><title id="title">Williams 的工作台</title><desc id="desc">纸雕工作台场景：左侧四段标注①先预测、②短地线、③最小电路、④源头放大；右侧桌上摆示波器、万用表、最小电路板、预测笔记和前级放大器，探针从示波器接到板上，地用短弹簧针。</desc><rect width="1448" height="1086" fill="#e2d9cf" /><g id="paper-illustration"><path data-paper-shadow="true" transform="translate(8 12)" d="M68,182 L631.6,180 L1381,183 L1384,590.4 L1381,898 L565.6,900 L64,896 Z" fill="#535453" opacity="0.08" /><path data-paper-shadow="true" transform="translate(4 7)" d="M68,182 L631.6,180 L1381,183 L1384,590.4 L1381,898 L565.6,900 L64,896 Z" fill="#535453" opacity="0.12" /><path data-paper-shadow="true" transform="translate(2 3)" d="M68,182 L631.6,180 L1381,183 L1384,590.4 L1381,898 L565.6,900 L64,896 Z" fill="#535453" opacity="0.15" /><path d="M68,182 L631.6,180 L1381,183 L1384,590.4 L1381,898 L565.6,900 L64,896 Z" fill="#f6f2ed" stroke="#c4b9ab" stroke-width="1.4" /><path d="M70,184L1377,185" fill="none" stroke="#ffffff" stroke-width="2" opacity=".7" />
