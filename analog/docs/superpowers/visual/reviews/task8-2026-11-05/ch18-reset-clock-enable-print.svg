<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1448 1086" role="img" aria-labelledby="title desc" data-print-width-mm="138" data-composition="technical-overlay-v1" data-base-medium="python-svg"><title id="title">不启动的三板斧</title><desc id="desc">四步顺序卡：先查复位脚是否释放，再查时钟是否起振（×10 探头避免 100 pF 压停晶振），再查使能脚电平与上拉，最后才读数据手册；顺序为复位、时钟、使能。</desc><rect width="1448" height="1086" fill="#e2d9cf" /><g id="paper-illustration"><path d="M194,196 L699.98,194 L1373,197 L1376,530.3 L1373,782 L640.6800000000001,784 L190,780 Z" fill="#f6f2ed" stroke="#c4b9ab" stroke-width="1.4" /><path d="M196,198L1369,199" fill="none" stroke="#ffffff" stroke-width="2" opacity=".7" /><path d="M208,208 L1360,210 L1362,768 L210,770 Z" fill="none" stroke="#c4b9ab" stroke-width="2" opacity=".55" />
<circle cx="136" cy="267" r="31" fill="#e2d9cf" stroke="#a4441d" stroke-width="3" />
<circle cx="136" cy="415" r="31" fill="#e2d9cf" stroke="#a4441d" stroke-width="3" />
<line x1="136" y1="328" x2="136" y2="350" stroke="#c4b9ab" stroke-width="3" stroke-dasharray="" /><polygon points="136,350 143.0,337.0 129.0,337.0" fill="#c4b9ab" />
<circle cx="136" cy="563" r="31" fill="#e2d9cf" stroke="#a4441d" stroke-width="3" />
<line x1="136" y1="476" x2="136" y2="498" stroke="#c4b9ab" stroke-width="3" stroke-dasharray="" /><polygon points="136,498 143.0,485.0 129.0,485.0" fill="#c4b9ab" />
<circle cx="136" cy="711" r="31" fill="#e2d9cf" stroke="#a4441d" stroke-width="3" />
<line x1="136" y1="624" x2="136" y2="646" stroke="#c4b9ab" stroke-width="3" stroke-dasharray="" /><polygon points="136,646 143.0,633.0 129.0,633.0" fill="#c4b9ab" /></g><g id="technical-overlay"><text x="72" y="92" fill="#2a2927" font-size="50" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">芯片不工作：复位、时钟、使能</text>
<text x="74" y="146" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">三脚各量一次，比读十页数据手册快；顺序不能乱。</text>
<text x="136" y="279" fill="#a4441d" font-size="34" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#e2d9cf">一</text>
<text x="226" y="252" fill="#2a2927" font-size="36" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">① 复位释放了吗</text>
<text x="226" y="294" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">复位脚仍被拉低，时钟与使能都无意义</text>
<text x="226" y="330" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">先看电平与释放时刻</text>
<text x="136" y="427" fill="#a4441d" font-size="34" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#e2d9cf">二</text>
<text x="226" y="400" fill="#2a2927" font-size="36" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">② 时钟起振了吗</text>
<text x="226" y="442" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">×10 探头先看；×1 的 100 pF 可能压停晶振</text>
<text x="226" y="478" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">不起振就查负载电容与驱动</text>
<text x="136" y="575" fill="#a4441d" font-size="34" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#e2d9cf">三</text>
<text x="226" y="548" fill="#2a2927" font-size="36" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">③ 使能脚对吗</text>
<text x="226" y="590" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">悬空、极性反、上拉缺失都会让芯片沉默</text>
<text x="226" y="626" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">对照 datasheet 的电平定义</text>
<text x="136" y="723" fill="#a4441d" font-size="34" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#e2d9cf">四</text>
<text x="226" y="696" fill="#2a2927" font-size="36" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">④ 三脚都过再读手册</text>
<text x="226" y="738" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">电源已过关的前提下，这三脚覆盖多数不启动</text>
<text x="226" y="774" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">顺序：复位→时钟→使能</text>
<path data-paper-shadow="true" transform="translate(8 12)" d="M68,988 L631.6,986 L1381,989 L1384,1030.46 L1381,1062 L565.6,1064 L64,1060 Z" fill="#535453" opacity="0.08" /><path data-paper-shadow="true" transform="translate(4 7)" d="M68,988 L631.6,986 L1381,989 L1384,1030.46 L1381,1062 L565.6,1064 L64,1060 Z" fill="#535453" opacity="0.12" /><path data-paper-shadow="true" transform="translate(2 3)" d="M68,988 L631.6,986 L1381,989 L1384,1030.46 L1381,1062 L565.6,1064 L64,1060 Z" fill="#535453" opacity="0.15" /><path d="M68,988 L631.6,986 L1381,989 L1384,1030.46 L1381,1062 L565.6,1064 L64,1060 Z" fill="#f6f2ed" stroke="#c4b9ab" stroke-width="1.4" /><path d="M70,990L1377,991" fill="none" stroke="#ffffff" stroke-width="2" opacity=".7" />
<text x="92" y="1036" fill="#2a2927" font-size="33" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">复位没释放，时钟再好也白搭；时钟没起振，使能再对也无济于事。</text></g></svg>
