<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">排故侦探的笔记本：五步留下可复查的记录</title>
<desc id="figDesc">一本摊开的手绘笔记本。左上角症状卡记录“合盖 10 分钟后偶发复位、空载不复现”，旁边的便签提醒“最近改过什么”。页面中部五个节点串成证据链：症状确认、二分定位、假设验证、修复、回归测试，每步附一句要点。页面下方写着结论“是晶振焊点虚焊，不是芯片坏”，并盖有“根因：晶振虚焊”的印章，勾选框记录回归结果。右侧页边竖排写着“记录 = 知识资产”。</desc>
<rect width="960" height="640" fill="#fffdf8"/>

<text x="36" y="46" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="28" font-weight="700" fill="#14213d">排故侦探的笔记本</text>
<text x="36" y="76" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="15" fill="#52606d">症状是线索，假设要能被证伪，记录让经验可复用。</text>
<line x1="36" y1="94" x2="924" y2="94" stroke="#14213d" stroke-width="2"/>

