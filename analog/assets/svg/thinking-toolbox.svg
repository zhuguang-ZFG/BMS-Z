<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">思维工具箱：老手的四个暗器</text>

<text x="400" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#37424e">开工先归因 · 坏板找对比 · 偶发用极限 · 短路靠隔离</text>
<rect x="45" y="100" width="340" height="130" rx="14" fill="#f6eedb" stroke="#1f5d7a" stroke-width="2.5"/><text x="69" y="134" font-size="15" font-weight="bold" fill="#1f5d7a">内外归因</text><text x="69" y="164" font-size="11" fill="#37424e">先换"已知好的"电源/线缆</text><text x="69" y="184" font-size="11" fill="#37424e">传感器，把故障域切成板内/板外</text><text x="69" y="206" font-size="10" fill="#5b666f">何时用：开工第一步——30 秒排除一半嫌疑</text><rect x="415" y="100" width="340" height="130" rx="14" fill="#f6eedb" stroke="#a8321f" stroke-width="2.5"/><text x="439" y="134" font-size="15" font-weight="bold" fill="#a8321f">对比法</text><text x="439" y="164" font-size="11" fill="#37424e">好板并排同点测量——差异即线索，玄学变科学</text><text x="439" y="198" font-size="10" fill="#5b666f">何时用：量产批次不良、玄学故障</text><rect x="45" y="260" width="340" height="130" rx="14" fill="#f6eedb" stroke="#a4630f" stroke-width="2.5"/><text x="69" y="294" font-size="15" font-weight="bold" fill="#a4630f">极限法</text><text x="69" y="324" font-size="11" fill="#37424e">电压拉偏 ±10%、温度吹风/冷冻</text><text x="69" y="344" font-size="11" fill="#37424e">把偶发故障逼成必现</text><text x="69" y="366" font-size="10" fill="#5b666f">何时用：偶发不现形就没法测</text><rect x="415" y="260" width="340" height="130" rx="14" fill="#f6eedb" stroke="#6b3f63" stroke-width="2.5"/><text x="439" y="294" font-size="15" font-weight="bold" fill="#6b3f63">隔离法</text><text x="439" y="324" font-size="11" fill="#37424e">断开疑似负载/后级，看前级是否恢复</text><text x="439" y="358" font-size="10" fill="#5b666f">何时用：短路、过载、闩锁定位</text><g filter="url(#pglow)"><circle r="5" fill="#3d6b4a"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M60,105 H740 V385 H60 V105" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle>
<circle r="5" fill="#3d6b4a"><animateMotion dur="12s" begin="3.50s" repeatCount="indefinite" path="M60,105 H740 V385 H60 V105" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle>
<circle r="5" fill="#3d6b4a"><animateMotion dur="12s" begin="7.50s" repeatCount="indefinite" path="M60,105 H740 V385 H60 V105" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle></g>
<text x="400" y="478" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#37424e">四招组合就是老手的节奏——先内外、再对比、极限逼、隔离切</text>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.00;0.02;0.25;0.27;1" dur="12s" repeatCount="indefinite"/><rect x="149.5" y="431.9" width="500.9" height="24.1" rx="12.0" fill="#1f5d7a" fill-opacity="0.09" stroke="#1f5d7a" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.00;0.02;0.25;0.27;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="445" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1f5d7a" opacity="0">① 内外归因：先换已知好的电源/线缆/传感器——30 秒排除一半嫌疑<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.00;0.02;0.25;0.27;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.25;0.27;0.50;0.52;1" dur="12s" repeatCount="indefinite"/><rect x="193.3" y="431.9" width="413.4" height="24.1" rx="12.0" fill="#a8321f" fill-opacity="0.09" stroke="#a8321f" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.50;0.52;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="445" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#a8321f" opacity="0">② 对比法：好板并排同点测——差异即线索，玄学变科学<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.50;0.52;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.50;0.52;0.75;0.77;1" dur="12s" repeatCount="indefinite"/><rect x="154.3" y="431.9" width="491.4" height="24.1" rx="12.0" fill="#a4630f" fill-opacity="0.09" stroke="#a4630f" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.52;0.75;0.77;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="445" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#a4630f" opacity="0">③ 极限法：电压拉偏 ±10%、温度吹风冷冻——把偶发故障逼成必现<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.52;0.75;0.77;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.75;0.77;1" dur="12s" repeatCount="indefinite"/><rect x="166.2" y="431.9" width="467.6" height="24.1" rx="12.0" fill="#6b3f63" fill-opacity="0.09" stroke="#6b3f63" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.77;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="445" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#6b3f63" opacity="0">④ 隔离法：断开疑似负载/后级，看前级恢复——短路、闩锁现形<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.77;1" dur="12s" repeatCount="indefinite"/></text></g>
</svg>