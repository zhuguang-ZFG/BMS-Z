<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 590" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>AFE 读数示意：两字节的低 8 位和与校验字节不一致时，这一帧丢掉重读，不拿去保护。</title>
  <desc>蓝线是 0x12、0x34 的累加，红线把第二字节改成 0x35。金点沿好帧走。校验多项式不冒充芯片手册。</desc>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; }
    .linek { stroke: #57606a; stroke-width: 2.2; fill: none; stroke-dasharray: 7 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .dotg { fill: #1a7f37; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    .boxy { fill: #fff8c5; stroke: #d4a72c; }
    .boxr { fill: #ffebe9; stroke: #ff8182; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .linek { stroke: #8b949e; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .dotg { fill: #3fb950; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
      .boxy { fill: #3d2e00; stroke: #d29922; }
      .boxr { fill: #3d1418; stroke: #f85149; }
    }
  </style>
  <!-- formula: check=(0x12+0x34)&0xFF=0x46; flipped=(0x12+0x35)&0xFF=0x47; not a vendor CRC -->
  <rect class="bg" width="800" height="590"/>
  <text class="title" x="24" y="32">校验对不上，这一帧丢掉重读（示意）</text>
  <rect class="panel" x="24" y="44" width="752" height="124" rx="6"/>
  <text class="txt" x="40" y="68" opacity="0.28">① 两字节到齐<tspan class="small">　示意校验 = (字节和) 的低 8 位。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="92" opacity="0.28">② 好帧<tspan class="small">　0x12+0x34 = 0x46，和校验字节一样。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="116" opacity="0.28">③ 翻了一位<tspan class="small">　第二字节变成 0x35，和变成 0x47。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="140" opacity="0.28">④ 口诀<tspan class="small">　对不上就重读。不要拿坏帧去做保护决定。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="180" width="752" height="268" rx="6"/>
  <text class="small" x="40" y="202">累加和（示意，不是 AFE 多项式）</text>
  <text class="hi" x="220" y="218">蓝 好帧</text>
  <text class="warn" x="340" y="218">红 翻了一位</text>
  <text class="gold" x="500" y="218">金虚线 校验字节</text>
  <line class="axis" x1="108.0" y1="248.0" x2="108.0" y2="400.0"/>
  <line class="axis" x1="108.0" y1="400.0" x2="720.0" y2="400.0"/>
  <line class="grid" x1="108.0" y1="400.0" x2="108.0" y2="406.0"/>
  <text class="small" x="108.0" y="422.0" text-anchor="middle">第1</text>
  <line class="grid" x1="414.0" y1="400.0" x2="414.0" y2="406.0"/>
  <text class="small" x="414.0" y="422.0" text-anchor="middle">第2</text>
  <line class="grid" x1="720.0" y1="400.0" x2="720.0" y2="406.0"/>
  <text class="small" x="720.0" y="422.0" text-anchor="middle">比对</text>
  <line class="grid" x1="102.0" y1="371.5" x2="108.0" y2="371.5"/>
  <text class="small" x="98.0" y="375.5" text-anchor="end">0x12</text>
  <line class="grid" x1="102.0" y1="289.2" x2="108.0" y2="289.2"/>
  <text class="small" x="98.0" y="293.2" text-anchor="end">0x46</text>
  <line class="grid" x1="102.0" y1="287.6" x2="108.0" y2="287.6"/>
  <text class="small" x="98.0" y="291.6" text-anchor="end">0x47</text>
  <text class="small" x="720" y="444" text-anchor="end">第几个数据字节</text>
  <polyline class="lineb" points="108.0,371.5 414.0,289.2 720.0,289.2" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline class="liner" points="108.0,371.5 414.0,287.6 720.0,287.6" stroke-linejoin="round" stroke-linecap="round"/>
  <line class="liney" x1="108" y1="289.2" x2="720" y2="289.2" stroke-dasharray="6 4"/>
  <circle class="doty" r="6" cx="108.0" cy="371.5"><animate attributeName="cx" values="108.0;414.0;720.0;720.0" keyTimes="0;0.3333;0.6667;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="371.5;289.2;289.2;289.2" keyTimes="0;0.3333;0.6667;1" dur="12s" repeatCount="indefinite"/></circle>
  <circle class="dotr" r="4" cx="108.0" cy="371.5"><animate attributeName="cx" values="108.0;414.0;720.0;720.0" keyTimes="0;0.3333;0.6667;1" dur="12s" repeatCount="indefinite" begin="-6s"/><animate attributeName="cy" values="371.5;289.2;289.2;289.2" keyTimes="0;0.3333;0.6667;1" dur="12s" repeatCount="indefinite" begin="-6s"/></circle>
  <rect class="panel" x="24" y="460" width="752" height="68" rx="6"/>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="1">第 1 字节 · 好帧和 0x12 · 坏帧和 0x12（示意）<animate attributeName="opacity" values="1;0;0;0" keyTimes="0;0.3333;0.6667;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0">第 2 字节 · 好帧和 0x46 · 坏帧和 0x47（示意）<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.3333;0.6667;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0">比对 · 好帧 0x46 对得上 · 坏帧 0x47 丢掉重读（示意）<animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.3333;0.6667;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="24" y="560">这个低 8 位和只说明「对不上就丢」。不是 BQ769x2 或任何一颗 AFE 手册里的 CRC。</text>

</svg>
