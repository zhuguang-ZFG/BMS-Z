<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">真实电阻：高频时它不再是「一个电阻」</text>

<text x="205" y="50" text-anchor="middle" font-size="14" font-weight="bold" fill="#37424e">等效模型：R 并 C（体电容），再串 L（引线电感）</text>
<text x="60" y="96" font-size="11.5" fill="#5b666f">理想 R</text>
<path d="M112 92 Q131.00 91.84 150 92" fill="none" stroke="#37424e" stroke-width="2.5"/>
<circle cx="150" cy="92" r="3" fill="#37424e"/>
<path d="M150 92 Q160.00 92.06 170 92" fill="none" stroke="#37424e" stroke-width="2.5"/>
<rect x="170" y="80" width="60" height="24" fill="#f6eedb" stroke="#37424e" stroke-width="2.5"/>
<text x="200" y="97" text-anchor="middle" font-size="11" fill="#5b666f">1kΩ</text>
<path d="M230 92 Q240.00 92.05 250 92" fill="none" stroke="#37424e" stroke-width="2.5"/>
<circle cx="250" cy="92" r="3" fill="#37424e"/>
<path d="M150 95 Q150.03 108.50 150 122" fill="none" stroke="#37424e" stroke-width="2"/>
<path d="M150 122 Q170.50 122.11 191 122" fill="none" stroke="#37424e" stroke-width="2"/>
<path d="M191 112 Q191.03 122.00 191 132" fill="none" stroke="#6b3f63" stroke-width="3.5"/>
<path d="M205 112 Q204.97 122.00 205 132" fill="none" stroke="#6b3f63" stroke-width="3.5"/>
<path d="M205 122 Q227.50 122.00 250 122" fill="none" stroke="#37424e" stroke-width="2"/>
<path d="M250 122 Q249.93 108.50 250 95" fill="none" stroke="#37424e" stroke-width="2"/>
<text x="216" y="140" font-size="11" font-weight="bold" fill="#6b3f63">C 0.2pF</text>
<path d="M250 92 Q264.00 91.91 278 92" fill="none" stroke="#37424e" stroke-width="2.5"/>
<path d="M278,92 q8,12 16,0 q8,-12 16,0 q8,12 16,0" fill="none" stroke="#a8321f" stroke-width="2.5"/>
<text x="308" y="76" font-size="11" font-weight="bold" fill="#a8321f">L 10nH</text>
<path d="M326 92 Q342.00 92.14 358 92" fill="none" stroke="#37424e" stroke-width="2.5"/>
<text x="60" y="212" font-size="11.5" font-weight="bold" fill="#6b3f63">体电容先分流（f₁）</text>
<text x="60" y="234" font-size="11" fill="#5b666f">f₁ = 1/(2πRC) = 0.8GHz —— 这是</text>
<text x="60" y="252" font-size="11" fill="#5b666f">「1kΩ 电阻拿来做高频负载」的真实上限</text>
<text x="60" y="282" font-size="11.5" font-weight="bold" fill="#a8321f">引线电感接管（f₂）</text>
<text x="60" y="304" font-size="11" fill="#5b666f">f₂ = R/(2πL) = 15.9GHz —— 到那之后</text>
<text x="60" y="322" font-size="11" fill="#5b666f">感抗盖过电阻，元件重新「变回电感」</text>
<text x="60" y="352" font-size="11.5" font-weight="bold" fill="#a4630f">选型结论</text>
<text x="60" y="374" font-size="11" fill="#5b666f">高频用贴片（引线≈0），且元件值本身</text>
<text x="60" y="392" font-size="11" fill="#5b666f">要按频率特性曲线复核</text>
<text x="394" y="233" text-anchor="end" font-size="10.5" fill="#5b666f">1kΩ</text>
<text x="394" y="316" text-anchor="end" font-size="10.5" fill="#5b666f">100Ω</text>
<text x="400" y="418" text-anchor="middle" font-size="10" fill="#5b666f">1kHz</text>
<text x="536" y="418" text-anchor="middle" font-size="10" fill="#5b666f">1MHz</text>
<text x="673" y="418" text-anchor="middle" font-size="10" fill="#5b666f">1GHz</text>
<text x="764" y="418" text-anchor="middle" font-size="10" fill="#5b666f">100GHz</text>
<text x="764" y="436" text-anchor="end" font-size="11" fill="#5b666f">频率 →</text>
<path d="M400 229 Q582.00 228.79 764 229" fill="none" stroke="#8b8272" stroke-width="2" stroke-dasharray="6,4"/>
<text x="406" y="221" font-size="10.5" fill="#8b8272">理想 1kΩ：一条直线</text>
