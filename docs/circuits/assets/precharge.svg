<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 -156 800 650" role="img" aria-labelledby="precharge-title precharge-description" font-family="ui-monospace, Consolas, monospace">
  <title id="precharge-title">预充回路：先限流，后合主闸</title>
  <desc id="precharge-description">动画分段展示直流母线预充。母线电容经 K2 和预充电阻 R 充电，达到设计电压且其他许可满足后，先合 K1，确认 K1 吸合，再断 K2。K1 与 K2 短暂同时闭合是正常交接。图示电压比例不构成合闸许可。</desc>
  <style>
    .bg { fill: #fffdf5; }
    .panel { fill: #f7f2e5; stroke: #cfc6b2; }
    .txt { fill: #293b3a; font-size: 13px; }
    .small { fill: #626d65; font-size: 12px; }
    .title { fill: #293b3a; font-size: 16px; font-weight: bold; }
    .axis { fill: none; stroke: #626d65; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .wire { fill: none; stroke: #425756; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .switch { fill: none; stroke: #176b73; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .contact { fill: #fffdf5; stroke: #626d65; stroke-width: 2; }
    .precharge { fill: none; stroke: #926717; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .meter-track { fill: #eee6d5; stroke: #626d65; stroke-width: 1.5; }
    .meter-fill { fill: #377b60; }
    .target { stroke: #b84745; stroke-width: 2; stroke-dasharray: 4 3; }
    .card { fill: #f7f2e5; stroke: #cfc6b2; stroke-width: 1.5; }
    .card-active { fill: #fbefc7; stroke: #926717; stroke-width: 2; }
    .phase-label { fill: #293b3a; font-size: 12px; font-weight: bold; }
    .phase-state { fill: #626d65; font-size: 12px; }
    .flow { fill: none; stroke: #c18624; stroke-width: 3; stroke-dasharray: 8 7; stroke-linecap: round; }
    .flow-dot { fill: #c18624; stroke: #fffdf5; stroke-width: 1; }
    .node { fill: #425756; }
    .precharge-still { display: inline; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #192727; }
      .panel, .card { fill: #223333; stroke: #496160; }
      .txt, .phase-label, .title { fill: #edf0e5; }
      .small, .phase-state { fill: #b0beb3; }
      .axis, .wire { stroke: #b0beb3; }
      .node { fill: #b0beb3; }
      .switch, .precharge, .flow { stroke: #dfbd78; }
      .contact, .card-active { fill: #453e2b; }
      .meter-track { fill: #2c4040; stroke: #b0beb3; }
      .meter-fill { fill: #8fc7a2; }
      .card-active { stroke: #dfbd78; }
      .target { stroke: #f39b91; }
      .flow-dot { fill: #dfbd78; stroke: #192727; }
    }
    .playback { pointer-events: none; }
    @media (prefers-reduced-motion: reduce) and (scripting: enabled), print {
      .playback { display: none !important; }
    }
  </style>
  <style id="bms-motion">
    /* bms-motion: 手绘批注仅用于静态标题。 */
    .bms-marker { fill: #fbefc7; opacity: .82; }
    .bms-under { fill: none; stroke: #926717; stroke-width: 2.4; stroke-linecap: round; opacity: .9; }
    .bms-sticker { fill: none; stroke: #926717; stroke-width: 2; stroke-dasharray: 7 5; stroke-linecap: round; opacity: .85; }
    .bms-spark, .bms-success, .bms-doodle { pointer-events: none; }
    @media (prefers-reduced-motion: reduce) { .bms-spark, .bms-success, .bms-doodle { display: none; } }
    @media (prefers-color-scheme: dark) {
      .bms-marker { fill: #453e2b; opacity: .88; }
      .bms-under { stroke: #dfbd78; }
      .bms-sticker { stroke: #dfbd78; }
    }
  </style>
  <g id="precharge-still" class="precharge-still">
  <rect class="bg" x="0" y="-156" width="800" height="650"/>
  <rect class="bms-marker" aria-hidden="true" x="18" y="-142.9" width="331" height="17.3" rx="3.8" transform="rotate(-.5 18 -134.2)"/>
  <path class="bms-under" aria-hidden="true" d="M24 -119 q 24 -2.4 48 0 t 48 0 t 48 0 t 48 0 t 48 0 t 48 0"/>
  <text class="title" x="24" y="-128">预充回路：先限流，后合主闸</text>

  <rect class="panel" x="24" y="-108" width="752" height="92" rx="8"/>
  <text class="txt" x="42" y="-82">先合 K2，经预充电阻 R 给逆变器直流母线电容充电。</text>
  <text class="txt" x="42" y="-57">达到设计条件后合 K1；确认 K1 吸合，再断开 K2。</text>
  <text class="small" x="42" y="-32">交接时 K1、K2 短暂同时闭合。电压比例只是示意，不能单独作为合闸许可。</text>

  <text class="small" x="42" y="58">预充支路（K2 串联限流电阻 R）</text>

  <path class="wire" id="precharge-main-path" d="M156 190 H220 M320 190 H628 M156 332 H628"/>
  <rect class="panel" x="98" y="224" width="123" height="74" rx="7"/>
  <text class="small" x="195" y="252" text-anchor="middle">电池组</text>
  <text class="small" x="195" y="280" text-anchor="middle">400 V</text>
  <path class="axis" d="M143 265 h26"/>
  <path class="axis" d="M149 281 h14"/>
  <text class="small" x="137" y="256" text-anchor="end">+</text>
  <text class="small" x="137" y="286" text-anchor="end">−</text>
  <path class="wire" d="M156 190 V265 M156 281 V332"/>

  <g id="precharge-k1-closed">
    <circle class="contact" cx="220" cy="190" r="5"/>
    <circle class="contact" cx="320" cy="190" r="5"/>
    <path class="switch" d="M220 190 H320"/>
  </g>
  <text class="txt" x="270" y="218" text-anchor="middle" font-weight="bold">主继电器 K1</text>

  <path class="wire" d="M180 190 V122 H232 M302 122 H336 M416 122 H472 V190"/>
  <g id="precharge-k2-open">
    <circle class="contact" cx="232" cy="122" r="4.5"/>
    <circle class="contact" cx="302" cy="122" r="4.5"/>
    <path class="axis" d="M232 122 L291 98"/>
  </g>
  <text class="txt" x="267" y="85" text-anchor="middle" font-weight="bold">预充继电器 K2</text>
  <path class="precharge" d="M336 122 l8 -9 10 18 10 -18 10 18 10 -18 10 18 10 -18 12 9"/>
  <text class="small" x="376" y="96" text-anchor="middle">预充电阻 R</text>

  <circle class="node" cx="180" cy="190" r="4"/>
  <circle class="node" cx="472" cy="190" r="4"/>

  <rect class="panel" x="476" y="213" width="111" height="105" rx="7"/>
  <text class="small" x="531" y="231" text-anchor="middle">母线电压 Udc</text>
  <rect class="meter-track" x="492" y="242" width="15" height="62" rx="3"/>
  <rect class="meter-fill" id="precharge-voltage" x="494" y="243" width="11" height="61" rx="2"/>
  <text class="small" x="517" y="253">95% ≈ 380 V</text>
  <text class="small" x="517" y="271">Ubat = 400 V</text>
  <text class="small" x="517" y="294">比例为示意</text>

  <path class="wire" d="M604 190 V248 M604 272 V332 M628 190 V230 H650 M628 332 V300 H650"/>
  <circle class="node" cx="604" cy="190" r="4"/>
  <circle class="node" cx="604" cy="332" r="4"/>
  <line class="axis" x1="592" y1="248" x2="616" y2="248"/>
  <line class="axis" x1="592" y1="272" x2="616" y2="272"/>
  <text class="small" x="619" y="267">Cdc</text>
  <rect class="panel" x="650" y="215" width="120" height="100" rx="8"/>
  <path class="wire" d="M650 230 H675 M650 300 H675"/>
  <circle class="contact" cx="675" cy="230" r="4"/>
  <circle class="contact" cx="675" cy="300" r="4"/>
  <text class="small" x="710" y="264" text-anchor="middle">直流输入</text>
  <text class="txt" x="710" y="285" text-anchor="middle" font-weight="bold">逆变器</text>

  <rect class="card" x="24" y="352" width="177" height="68" rx="7"/>
  <rect class="card" x="215" y="352" width="177" height="68" rx="7"/>
  <rect class="card" x="406" y="352" width="177" height="68" rx="7"/>
  <rect class="card" x="597" y="352" width="179" height="68" rx="7"/>

  <g class="playback">
    <g id="precharge-k1-open" opacity="0">
      <animate attributeName="opacity" calcMode="discrete" values="1;1;0;0;0" keyTimes="0;0.18;0.60;0.78;1" dur="12s" repeatCount="1" fill="freeze" data-ease="linear"/>
      <rect class="bg" x="211" y="161" width="118" height="37"/>
      <path class="wire" d="M211 190 H220 M320 190 H329"/>
      <circle class="contact" cx="220" cy="190" r="5"/>
      <circle class="contact" cx="320" cy="190" r="5"/>
      <path class="switch" d="M220 190 L306 166"/>
    </g>
    <g id="precharge-k2-closed" opacity="0">
      <animate attributeName="opacity" calcMode="discrete" values="0;1;1;0;0" keyTimes="0;0.18;0.60;0.78;1" dur="12s" repeatCount="1" fill="freeze" data-ease="linear"/>
      <rect class="bg" x="222" y="94" width="92" height="34"/>
      <path class="wire" d="M222 122 H232 M302 122 H314"/>
      <circle class="contact" cx="232" cy="122" r="4.5"/>
      <circle class="contact" cx="302" cy="122" r="4.5"/>
      <path class="switch" d="M232 122 H302"/>
    </g>

    <g id="precharge-phase-idle" opacity="0">
      <animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0" keyTimes="0;0.18;0.60;0.78;1" dur="12s" repeatCount="1" fill="freeze" data-ease="linear"/>
      <rect class="card-active" x="24" y="352" width="177" height="68" rx="7"/>
    </g>
    <g id="precharge-phase-limit" opacity="0">
      <animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.18;0.60;0.78;1" dur="12s" repeatCount="1" fill="freeze" data-ease="linear"/>
      <rect class="card-active" x="215" y="352" width="177" height="68" rx="7"/>
    </g>
    <g id="precharge-phase-transfer" opacity="0">
      <animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0" keyTimes="0;0.18;0.60;0.78;1" dur="12s" repeatCount="1" fill="freeze" data-ease="linear"/>
      <rect class="card-active" x="406" y="352" width="177" height="68" rx="7"/>
    </g>
    <g id="precharge-phase-run" opacity="0">
      <animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;1" keyTimes="0;0.18;0.60;0.78;1" dur="12s" repeatCount="1" fill="freeze" data-ease="linear"/>
      <rect class="card-active" x="597" y="352" width="179" height="68" rx="7"/>
    </g>

    <g id="precharge-limit-path" opacity="0">
      <animate attributeName="opacity" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.18;0.20;0.58;0.60;1" dur="12s" repeatCount="1" fill="freeze" data-ease="linear"/>
      <path class="flow" id="precharge-flow-to-cap" d="M156 190 H180 V122 H336 l8 -9 10 18 10 -18 10 18 10 -18 10 18 10 -18 12 9 H472 V190 H604 V248"/>
      <path class="flow" d="M604 272 V332 H156"/>
      <circle class="flow-dot" r="4">
        <animateMotion calcMode="linear" dur="3.6s" repeatCount="indefinite" data-ease="linear"><mpath href="#precharge-flow-to-cap"/></animateMotion>
      </circle>
      <circle class="flow-dot" r="4">
        <animateMotion calcMode="linear" begin="-1.2s" dur="3.6s" repeatCount="indefinite" data-ease="linear"><mpath href="#precharge-flow-to-cap"/></animateMotion>
      </circle>
      <circle class="flow-dot" r="4">
        <animateMotion calcMode="linear" begin="-2.4s" dur="3.6s" repeatCount="indefinite" data-ease="linear"><mpath href="#precharge-flow-to-cap"/></animateMotion>
      </circle>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" calcMode="discrete" values="1;1;1;1;1" keyTimes="0;0.18;0.60;0.78;1" dur="12s" repeatCount="1" fill="freeze" data-ease="linear"/>
      <rect class="meter-track" x="492" y="242" width="15" height="62" rx="3"/>
      <rect class="meter-fill" id="precharge-voltage-playback" x="494" y="304" width="11" height="0" rx="2">
        <animate attributeName="y" calcMode="spline" values="304;304;245;243;243" keyTimes="0;0.18;0.60;0.78;1" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.42 0 0.58 1" dur="12s" repeatCount="1" fill="freeze"/>
        <animate attributeName="height" calcMode="spline" values="0;0;59;61;61" keyTimes="0;0.18;0.60;0.78;1" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.42 0 0.58 1" dur="12s" repeatCount="1" fill="freeze"/>
      </rect>
    </g>
  </g>
  <line class="target" x1="487" y1="245" x2="512" y2="245"/>

  <g>
    <text class="phase-label" x="36" y="373">① 待机检查</text>
    <text class="phase-state" x="36" y="392">K1 断 · K2 断</text>
    <text class="phase-state" x="36" y="408">残压与采样先核对</text>
  </g>
  <g>
    <text class="phase-label" x="227" y="373">② 限流预充</text>
    <text class="phase-state" x="227" y="392">K1 断 · K2 合</text>
    <text class="phase-state" x="227" y="408">电流经过 R，母线升压</text>
  </g>
  <g>
    <text class="phase-label" x="418" y="373">③ 交接确认</text>
    <text class="phase-state" x="418" y="392">K1 合 · K2 合</text>
    <text class="phase-state" x="418" y="408">确认 K1 已吸合</text>
  </g>
  <g>
    <text class="phase-label" x="609" y="373">④ 正常运行</text>
    <text class="phase-state" x="609" y="392">K1 合 · K2 断</text>
    <text class="phase-state" x="609" y="408">主回路承载工作电流</text>
  </g>

  <text class="small" x="400" y="443" text-anchor="middle">预充超时或电压平台异常时保持 K1 断开；支路、负载、参数与测量都可能是原因。</text>
  <text class="small" x="400" y="461" text-anchor="middle">单个母线电压读数不足以诊断故障，也不能单独授权合闸。</text>
  </g>
</svg>
