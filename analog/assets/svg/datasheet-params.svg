<svg xmlns="http://www.w3.org/2000/svg" width="800" height="732" viewBox="0 0 800 732" role="img" aria-labelledby="ttl">
<title id="ttl">Datasheet 五十页，先读这六行</title>
<desc>Datasheet 五十页，先读这六行；节拍：① 第一行永远是 V_OS：它被增益放大，直流电路的头号杀手；② I_B 只在「高源阻抗」时才咬人——>100kΩ 就必须换 FET 输入；③ GBW 与 SR 分工：小信号看 GBW、大信号看 SR（两条不同的路）；④ 读法总结：按「你电路会疼的地方」跳读，别从头翻到尾</desc>
<defs>
