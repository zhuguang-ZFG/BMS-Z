<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="ui-monospace, Consolas, monospace">
  <title>静置到能查开路电压的时间随温度变长：冷侧按示意活化能陡增。数字为示意。</title>
  <desc>亮点扫过温度轴：常温等约半小时，冷侧按示意活化能陡增到几小时，提示静置规程按温度定。</desc>

  <style>
    .bg { fill: #fffdf5; }
    .panel { fill: #f7f2e5; stroke: #cfc6b2; }
    .axis { stroke: #626d65; stroke-width: 1.5; fill: none; }
    .grid { stroke: #cfc6b2; stroke-width: 1; fill: none; }
    .txt { fill: #293b3a; font-size: 13px; }
    .small { fill: #626d65; font-size: 12px; }
    .title { fill: #293b3a; font-size: 16px; font-weight: bold; }
    .hi { fill: #176b73; }
    .warn { fill: #b84745; }
    .ok { fill: #377b60; }
    .gold { fill: #926717; }
    .lineb { stroke: #176b73; stroke-width: 2.5; fill: none; }
    .liner { stroke: #b84745; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #377b60; stroke-width: 2.5; fill: none; }
    .liney { stroke: #926717; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .dotb { fill: #176b73; }
    .dotr { fill: #b84745; }
    .dotg { fill: #377b60; }
    .doty { fill: #926717; }
    .boxb { fill: #e4f0df; stroke: #176b73; }
    .boxr { fill: #f6e2df; stroke: #b84745; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #192727; }
      .panel { fill: #223333; stroke: #496160; }
      .axis { stroke: #b0beb3; }
      .grid { stroke: #496160; }
      .txt { fill: #edf0e5; }
      .small { fill: #b0beb3; }
      .title { fill: #edf0e5; }
      .hi { fill: #7ec5c5; }
      .warn { fill: #f39b91; }
      .ok { fill: #8fc7a2; }
      .gold { fill: #dfbd78; }
      .lineb { stroke: #7ec5c5; }
      .liner { stroke: #f39b91; }
      .lineg { stroke: #8fc7a2; }
      .liney { stroke: #dfbd78; }
      .dotb { fill: #7ec5c5; }
      .dotr { fill: #f39b91; }
      .dotg { fill: #8fc7a2; }
      .doty { fill: #dfbd78; }
      .boxb { fill: #293f35; stroke: #7ec5c5; }
      .boxr { fill: #483336; stroke: #f39b91; }
    }
  </style><style id="bms-motion">
    /* bms-motion: 手帐式动效注记（纯装饰，不改技术几何与既有 SMIL 时序） */
    .bms-marker { fill: #fbefc7; opacity: .78; }
    .bms-under { fill: none; stroke: #926717; stroke-width: 2.4; stroke-linecap: round; opacity: .9; }
    .bms-spark-line { fill: none; stroke: #926717; stroke-width: 1.9; stroke-linecap: round; }
    .bms-spark-fill { fill: #926717; }
    .bms-spark-soft { fill: #176b73; opacity: .8; }
    .bms-sticker { fill: none; stroke: #926717; stroke-width: 2; stroke-dasharray: 7 5; stroke-linecap: round; opacity: .85; }
    .bms-halo { fill: none; stroke: #926717; stroke-width: 2; }
    .bms-marker, .bms-under, .bms-sticker, .bms-halo,
    .bms-spark, .bms-success, .bms-doodle { pointer-events: none; }
    circle:has(> animateMotion) { filter: drop-shadow(0 0 2px rgba(146,103,23,.5)) drop-shadow(0 0 5px rgba(196,145,52,.45)); }
    rect:has(> animateMotion) { filter: drop-shadow(0 0 3px rgba(196,145,52,.75)); }
    g:has(> circle):has(> path.stroke-check) { filter: drop-shadow(0 0 5px rgba(55,123,96,.5)); }
    @media (prefers-color-scheme: dark) {
      .bms-marker { fill: #453e2b; opacity: .85; }
      .bms-under { stroke: #dfbd78; }
      .bms-spark-line { stroke: #dfbd78; }
      .bms-spark-fill { fill: #dfbd78; }
      .bms-spark-soft { fill: #7ec5c5; }
      .bms-sticker { stroke: #dfbd78; }
      .bms-halo { stroke: #dfbd78; }
      circle:has(> animateMotion) { filter: drop-shadow(0 0 2px rgba(223,189,120,.8)) drop-shadow(0 0 7px rgba(223,189,120,.9)); }
      rect:has(> animateMotion) { filter: drop-shadow(0 0 6px rgba(223,189,120,.8)); }
      g:has(> circle):has(> path.stroke-check) { filter: drop-shadow(0 0 6px rgba(143,199,162,.7)); }
    }
    @media (prefers-reduced-motion: reduce) { .bms-spark, .bms-success, .bms-doodle { display: none; } }
</style>

  <!-- formula: tau_min=30*exp(3500*(1/(Tc+273.15)-1/298.15)) -->
  <rect class="bg" width="800" height="500"/>
  <rect class="bms-marker" aria-hidden="true" x="18.0" y="17.1" width="268.7" height="17.3" rx="3.8" transform="rotate(-.5 18.0 25.8)"/><path class="bms-under" aria-hidden="true" d="M24.0 40.0 q 24.0 -2.4 48.0 0 t 48 0 t 48 0 t 48 0 t 48 0"/><text class="title" x="24" y="32">同一个 τ，换到冷天就不够（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="122" rx="6"/><g class="bms-doodle" aria-hidden="true" transform="translate(746.0 72.0)"><animateTransform attributeName="transform" type="rotate" values="-6;7;-6" keyTimes="0;0.5;1" dur="5.4s" repeatCount="indefinite" additive="sum"/><animate attributeName="opacity" values="0.62;1;0.62" keyTimes="0;0.5;1" dur="3.6s" repeatCount="indefinite"/><path class="bms-spark-fill" d="M0 -9 L2.3 -2.3 L9 0 L2.3 2.3 L0 9 L-2.3 2.3 L-9 0 L-2.3 -2.3 Z"/></g><g class="bms-doodle" aria-hidden="true" transform="translate(710.0 62.0)"><animateTransform attributeName="transform" type="rotate" values="5;-4;5" keyTimes="0;0.5;1" dur="6.2s" repeatCount="indefinite" additive="sum"/><animate attributeName="opacity" values="0.5;0.9;0.5" keyTimes="0;0.5;1" dur="4.4s" repeatCount="indefinite"/><path class="bms-spark-soft" d="M0 -5.5 L1.4 -1.4 L5.5 0 L1.4 1.4 L0 5.5 L-1.4 1.4 L-5.5 0 L-1.4 -1.4 Z"/></g><g class="bms-doodle" aria-hidden="true"><circle class="bms-spark-fill" cx="728.0" cy="81.0" r="1.3"/><circle class="bms-spark-soft" cx="696.0" cy="78.0" r="1.1"/></g>
  <text class="txt" x="40" y="68" opacity="0.28">① 公式<tspan class="small">　τ = 30·exp[3500·(1/T − 1/298.15)] 分钟。25 °C 锚在 30 min。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="94" opacity="0.28">② 0 °C<tspan class="small">　示意约 87.8 min。−10 °C 约 143 min。−20 °C 约 241.8 min。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="120" opacity="0.28">③ 45 °C<tspan class="small">　约 14.3 min。热的时候等够更容易，冷的时候同一套计时会太短。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="146" opacity="0.28">④ 设计<tspan class="small">　OCV 校准的等待要跟温度走。没等够就查表，把极化当成了荷电。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="182" width="752" height="250" rx="6"/>
  <text class="small" x="40" y="204">还要再等 min</text>
  <line class="axis" x1="92.0" y1="214.0" x2="92.0" y2="400.0"/>
  <line class="axis" x1="92.0" y1="400.0" x2="720.0" y2="400.0"/>
  <text class="small" x="712.0" y="418" text-anchor="end">温度 °C</text>
  <line class="grid" x1="92.0" y1="400.0" x2="92.0" y2="406.0"/>
  <text class="small" x="92.0" y="432" text-anchor="middle">−20</text>
  <line class="grid" x1="271.4" y1="400.0" x2="271.4" y2="406.0"/>
  <text class="small" x="271.4" y="432" text-anchor="middle">0</text>
  <line class="grid" x1="495.7" y1="400.0" x2="495.7" y2="406.0"/>
  <text class="small" x="495.7" y="432" text-anchor="middle">25</text>
  <line class="grid" x1="675.1" y1="400.0" x2="675.1" y2="406.0"/>
  <text class="small" x="675.1" y="432" text-anchor="middle">45</text>
  <line class="grid" x1="86.0" y1="380.1" x2="92.0" y2="380.1"/>
  <text class="small" x="82.0" y="384.1" text-anchor="end">30</text>
  <line class="grid" x1="86.0" y1="340.2" x2="92.0" y2="340.2"/>
  <text class="small" x="82.0" y="344.2" text-anchor="end">90</text>
  <line class="grid" x1="86.0" y1="240.6" x2="92.0" y2="240.6"/>
  <text class="small" x="82.0" y="244.6" text-anchor="end">240</text>
  <polyline class="lineb" points="92.0,239.4 101.0,247.9 109.9,255.9 118.9,263.4 127.9,270.5 136.9,277.1 145.8,283.4 154.8,289.3 163.8,294.9 172.7,300.1 181.7,305.0 190.7,309.7 199.7,314.1 208.6,318.3 217.6,322.2 226.6,325.9 235.5,329.4 244.5,332.7 253.5,335.9 262.5,338.8 271.4,341.6 280.4,344.3 289.4,346.8 298.3,349.2 307.3,351.5 316.3,353.6 325.3,355.7 334.2,357.6 343.2,359.5 352.2,361.2 361.1,362.9 370.1,364.5 379.1,366.0 388.1,367.4 397.0,368.8 406.0,370.0 415.0,371.3 423.9,372.5 432.9,373.6 441.9,374.6 450.9,375.7 459.8,376.6 468.8,377.5 477.8,378.4 486.7,379.3 495.7,380.1 504.7,380.8 513.7,381.6 522.6,382.3 531.6,382.9 540.6,383.6 549.5,384.2 558.5,384.8 567.5,385.3 576.5,385.9 585.4,386.4 594.4,386.9 603.4,387.3 612.3,387.8 621.3,388.2 630.3,388.6 639.3,389.0 648.2,389.4 657.2,389.8 666.2,390.1 675.1,390.5 684.1,390.8 693.1,391.1 702.1,391.4 711.0,391.7 720.0,392.0" stroke-linejoin="round" stroke-linecap="round"/>
  <text class="hi" x="360" y="340">25 °C 示意 30 min</text>
  <text class="warn" x="130" y="240">越冷等越久</text>
  <circle class="doty" r="6"><animate data-ease="linear" attributeName="cx" values="92.0;144.3;196.7;249.0;301.3;353.7;406.0;458.3;510.7;563.0;615.3;667.7;720.0" keyTimes="0;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1" dur="12s" repeatCount="indefinite"/><animate data-ease="linear" attributeName="cy" values="239.4;282.4;312.6;334.3;350.0;361.5;370.0;376.5;381.3;385.1;387.9;390.2;392.0" keyTimes="0;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1" dur="12s" repeatCount="indefinite"/></circle>
  <text class="small" x="24" y="478">30 min 和 3500 K 是教学锚，不是某一颗电芯的静置规程。多冷才允许查表，以你的辨识为准。</text>
</svg>
