<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 800 460" font-family="ui-monospace, Consolas, monospace" data-snapshot-time="8">
  <title>充电电流随温度降额的示意曲线：冰点以下不充，常温允许更大电流，高温再收到零。</title>
  <desc>折线按温度逐段亮起：冰点以下电流为零，0–10 °C 给 0.2C，常温放开到 1C，45 °C 以上再收到零。</desc>

  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.5; fill: none; }
    .liney { stroke: #bf8700; stroke-width: 2.5; fill: none; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .dotg { fill: #1a7f37; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    .boxr { fill: #ffebe9; stroke: #cf222e; }
    .boxg { fill: #dafbe1; stroke: #1a7f37; }
    .boxy { fill: #fff8c5; stroke: #bf8700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .dotg { fill: #3fb950; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
      .boxr { fill: #3d1214; stroke: #ff7b72; }
      .boxg { fill: #12261e; stroke: #3fb950; }
      .boxy { fill: #3d2e00; stroke: #d29922; }
    }
  </style>

  <rect class="bg" width="800" height="460"/>

  <text class="title" x="24" y="32">充电电流跟着温度走：太冷不充，太热把电流收掉（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="122" rx="6"/>
  <text class="txt" x="40" y="68" opacity="1" style="opacity: 1;">① 低于 0 °C<tspan class="small">　示意充电电流 0。低温硬充容易在负极析锂。</tspan></text>
  <text class="txt" x="40" y="94" opacity="1" style="opacity: 1;">② 0 到 10 °C<tspan class="small">　示意 0.2C。2 Ah 的例子里是 0.4 A。</tspan></text>
  <text class="txt" x="40" y="120" opacity="1" style="opacity: 1;">③ 10 到 45 °C<tspan class="small">　示意允许 1C，也就是 2 A。这不是所有电芯的窗口。</tspan></text>
  <text class="txt" x="40" y="146" opacity="1" style="opacity: 1;">④ 45 到 55 °C 以上<tspan class="small">　电流收到 0。再热就停充。放电窗口常常不一样，另查规格书。</tspan></text>
  <rect class="panel" x="24" y="180" width="752" height="210" rx="6"/>
  <text class="small" x="40" y="202">允许充电电流（2 Ah 电芯的示意，1C = 2 A）</text>
  <line class="axis" x1="60" y1="200" x2="60" y2="360"/>
  <line class="axis" x1="60" y1="360" x2="720" y2="360"/>
  <text class="small" x="28" y="244">2 A</text>
  <text class="small" x="28" y="340">0.4 A</text>
  <text class="small" x="36" y="364">0</text>
  <path class="lineb" d="M70.0 360.0 L154.0 360.0 L154.0 336.0 L238.0 336.0 L238.0 240.0 L532.0 240.0 L616.0 360.0 L700.0 360.0" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="doty" r="6" transform="matrix(1 0 0 1 534.70556640625 243.86505126953125)">

  </circle>
  <text class="warn" x="72" y="300">0 °C 以下：0 A</text>
  <text class="gold" x="160" y="328">0.2C = 0.4 A</text>
  <text class="hi" x="340" y="230">1C = 2 A</text>
  <text class="warn" x="628" y="328">55 °C：0 A</text>
  <text class="small" x="142" y="378">0 °C</text>
  <text class="small" x="224" y="378">10 °C</text>
  <text class="small" x="518" y="378">45 °C</text>
  <text class="small" x="602" y="378">55 °C</text>
  <text class="small" x="24" y="446">折线和 2 Ah、0.2C、1C 都是示意。某一颗电芯允许多大电流，只看它的规格书，不看这张图。</text>

</svg>
