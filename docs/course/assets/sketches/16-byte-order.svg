<title id="title">先到低位，再合成物理量</title><desc id="desc">完整教学记录八字节为da39 1efb ff01 b431。电压字段低位da先放，值218；高位39后放，值57。按57乘256加218得到14810毫伏，再除1000得到14.81伏。未提前展示独立练习的解码答案。</desc>
