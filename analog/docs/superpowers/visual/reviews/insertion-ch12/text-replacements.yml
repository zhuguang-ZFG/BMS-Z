changes:
- id: ch12-riso-feedback-point
  source: docs/p2-02-ch12.md#12.9a
  before: 运放的开环输出阻抗与容性负载 $C_L$ 会在环路中增加相移。先用等效电阻 $R_o$ 理解：$R_o=50\Omega$、$C_L=100nF$ 对应一个约 $31.8kHz$ 的极点。**是否稳定要在环路增益穿越 0dB 处判断，不能在这个极点处直接宣布“必然振荡”。** 实际输出阻抗也可能随频率变化，须使用器件模型和手册条件。
  after: 沿用可下载的教学网表：$A_0=10^5,f_p=10Hz,R_o=50\Omega,C_L=100nF$，输入阶跃 10 mV。原 ngspice 扫频与瞬态算例给出：无隔离电阻 PM≈10.2°、过冲超过 70%；加 $50\Omega$ 并取 A，PM≈88.2°、运放端和负载端过冲均小于 5%；加同一电阻而取 B，PM≈7.2°，振铃更大。
