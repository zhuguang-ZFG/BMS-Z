    .small { font: 12.5px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #626d65; letter-spacing: 0.3px}
    .flow-dot { fill: #b84745; }
    .sketch { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #192727; }
      .ink { fill: #edf0e5; }
      .muted { fill: #b0beb3; }
