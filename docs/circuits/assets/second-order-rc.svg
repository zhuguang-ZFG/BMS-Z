<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>二阶 RC 与一阶对照。真实曲线是 R0 阶跃加两路指数，一阶用合成电阻和 τ=12 s。</title>
  <desc>20 A、2 mΩ、快路 4 mΩ/1 s、慢路 6 mΩ/30 s 都是示意。蓝点沿真实曲线走，底栏读出一阶偏高多少毫伏。不是某一颗电芯的 HPPC。</desc>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; }
    .linek { stroke: #57606a; stroke-width: 2.2; fill: none; stroke-dasharray: 7 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .dotg { fill: #1a7f37; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    .boxy { fill: #fff8c5; stroke: #d4a72c; }
    .boxr { fill: #ffebe9; stroke: #ff8182; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .linek { stroke: #8b949e; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .dotg { fill: #3fb950; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
      .boxy { fill: #3d2e00; stroke: #d29922; }
      .boxr { fill: #3d1418; stroke: #f85149; }
    }
  </style>
  <!-- formula: U=3.700-20*(0.002+0.004*(1-e^{-t/1})+0.006*(1-e^{-t/30})); 1RC tau=12 s, R=0.010 -->
  <rect class="bg" width="800" height="560"/>
  <text class="title" x="24" y="32">一阶贴不住前段，两路才分得开快慢（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="128" rx="6"/>
  <text class="txt" x="40" y="72" opacity="0.28">① 阶跃<tspan class="small">　20 A × 2 mΩ，端电压立刻少 40 mV。两张图这一下是一样的。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="98" opacity="0.28">② 快路<tspan class="small">　4 mΩ、τ=1 s。电荷转移，脉冲开头几秒就坐实。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="124" opacity="0.28">③ 慢路<tspan class="small">　6 mΩ、τ=30 s。浓差还在爬，10 s 里只走完一头。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="150" opacity="0.28">④ 一阶<tspan class="small">　把 10 mΩ 合成一条 τ=12 s。前段偏高，红虚线离开蓝线。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="188" width="752" height="280" rx="6"/>
  <text class="small" x="40" y="210">端电压 V（示意）</text>
  <line class="axis" x1="88.0" y1="228.0" x2="88.0" y2="400.0"/>
  <line class="axis" x1="88.0" y1="400.0" x2="520.0" y2="400.0"/>
  <text class="small" x="520.0" y="444" text-anchor="end">时间 s</text>
  <line class="grid" x1="88.0" y1="400.0" x2="88.0" y2="406.0"/>
  <text class="small" x="88.0" y="422.0" text-anchor="middle">0</text>
  <line class="grid" x1="174.4" y1="400.0" x2="174.4" y2="406.0"/>
  <text class="small" x="174.4" y="422.0" text-anchor="middle">2</text>
  <line class="grid" x1="260.8" y1="400.0" x2="260.8" y2="406.0"/>
  <text class="small" x="260.8" y="422.0" text-anchor="middle">4</text>
  <line class="grid" x1="347.2" y1="400.0" x2="347.2" y2="406.0"/>
  <text class="small" x="347.2" y="422.0" text-anchor="middle">6</text>
  <line class="grid" x1="433.6" y1="400.0" x2="433.6" y2="406.0"/>
  <text class="small" x="433.6" y="422.0" text-anchor="middle">8</text>
  <line class="grid" x1="520.0" y1="400.0" x2="520.0" y2="406.0"/>
  <text class="small" x="520.0" y="422.0" text-anchor="middle">10</text>
  <line class="grid" x1="82.0" y1="400.0" x2="88.0" y2="400.0"/>
  <text class="small" x="78.0" y="404.0" text-anchor="end">3.50</text>
  <line class="grid" x1="82.0" y1="321.8" x2="88.0" y2="321.8"/>
  <text class="small" x="78.0" y="325.8" text-anchor="end">3.60</text>
  <line class="grid" x1="82.0" y1="243.6" x2="88.0" y2="243.6"/>
  <text class="small" x="78.0" y="247.6" text-anchor="end">3.70</text>
