<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="title desc">
  <title id="title">保护反应时间的两种起算时刻</title>
  <desc id="desc">上方从物理故障发生起算，包含最坏一个采样周期等待、连续确认、判决和执行反馈，共七十七毫秒；下方从首个越限样本起算，共五十七毫秒。故障反应窗口一百毫秒，余量二十三毫秒。</desc>
  <defs>
    <marker id="arrow-time" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#293b3a"/></marker>
  </defs>
  <rect width="960" height="420" rx="20" fill="#fffdf5"/>
  <text x="30" y="38" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#293b3a">同一故障，两种起算时刻</text>
  <text x="30" y="64" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" fill="#626d65">默认参数：Ts = 20 ms，N = 3，Td = 2 ms，Ta = 15 ms；输入扫描与滤波已计入 Ts。</text>

  <g font-family="Noto Sans SC, Microsoft YaHei, sans-serif">
    <text x="30" y="120" font-size="15" font-weight="700" fill="#b84745">物理故障最坏起算</text>
    <line x1="120" y1="145" x2="690" y2="145" stroke="#293b3a" stroke-width="2" marker-end="url(#arrow-time)"/>
    <circle cx="120" cy="145" r="7" fill="#b84745"/>
    <text x="120" y="171" text-anchor="middle" font-size="11" fill="#b84745">故障刚错过上一拍</text>
    <rect x="120" y="105" width="100" height="30" rx="8" fill="#f8e8e5" stroke="#b84745"/>
    <text x="170" y="125" text-anchor="middle" font-size="12" fill="#293b3a">等首拍 20 ms</text>
    <rect x="220" y="105" width="200" height="30" rx="8" fill="#fbefc7" stroke="#926717"/>
    <text x="320" y="125" text-anchor="middle" font-size="12" fill="#293b3a">再确认 2 个间隔 = 40 ms</text>
    <rect x="420" y="105" width="55" height="30" rx="8" fill="#e6f0f2" stroke="#176b73"/>
    <text x="447" y="125" text-anchor="middle" font-size="12" fill="#293b3a">2 ms</text>
    <rect x="475" y="105" width="105" height="30" rx="8" fill="#e6f1eb" stroke="#377b60"/>
    <text x="527" y="125" text-anchor="middle" font-size="12" fill="#293b3a">反馈 15 ms</text>
    <text x="600" y="125" font-size="16" font-weight="700" fill="#b84745">77 ms</text>

    <text x="30" y="235" font-size="15" font-weight="700" fill="#176b73">首个越限样本起算</text>
    <line x1="220" y1="260" x2="690" y2="260" stroke="#293b3a" stroke-width="2" marker-end="url(#arrow-time)"/>
    <circle cx="220" cy="260" r="7" fill="#176b73"/>
    <text x="220" y="286" text-anchor="middle" font-size="11" fill="#176b73">首个越限样本</text>
    <rect x="220" y="220" width="200" height="30" rx="8" fill="#fbefc7" stroke="#926717"/>
    <text x="320" y="240" text-anchor="middle" font-size="12" fill="#293b3a">再确认 2 个间隔 = 40 ms</text>
    <rect x="420" y="220" width="55" height="30" rx="8" fill="#e6f0f2" stroke="#176b73"/>
    <text x="447" y="240" text-anchor="middle" font-size="12" fill="#293b3a">2 ms</text>
    <rect x="475" y="220" width="105" height="30" rx="8" fill="#e6f1eb" stroke="#377b60"/>
    <text x="527" y="240" text-anchor="middle" font-size="12" fill="#293b3a">反馈 15 ms</text>
    <text x="600" y="240" font-size="16" font-weight="700" fill="#176b73">57 ms</text>

    <rect x="715" y="92" width="215" height="198" rx="16" fill="#eef0f8" stroke="#66719b" stroke-width="2"/>
    <text x="822" y="125" text-anchor="middle" font-size="16" font-weight="700" fill="#293b3a">故障反应窗口</text>
    <text x="822" y="166" text-anchor="middle" font-size="30" font-weight="800" fill="#66719b">100 ms</text>
    <line x1="752" y1="188" x2="892" y2="188" stroke="#c8ccdc"/>
    <text x="752" y="216" font-size="13" fill="#293b3a">最坏反应　77 ms</text>
    <text x="752" y="246" font-size="13" fill="#293b3a">剩余余量　23 ms</text>
    <text x="752" y="272" font-size="11" fill="#66719b">100 − 77 = 23</text>
  </g>

  <rect x="150" y="330" width="660" height="48" rx="24" fill="#f8e8e5" stroke="#b84745" stroke-width="1.5"/>
  <text x="480" y="350" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#b84745">Ta 必须量到电流、端口电压或接触器反馈已安全，不能只量命令位翻转。</text>
  <text x="480" y="368" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="11" fill="#626d65">横向长度用于说明先后关系，不作为严格比例尺。</text>
</svg>
