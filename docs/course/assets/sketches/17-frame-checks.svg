<path d="M1030 574 Q924.3 597.4 815 624" fill="none" stroke="#003153" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path d="M827.46 612.43 L815 624 L831.28 628.89" fill="none" stroke="#003153" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
