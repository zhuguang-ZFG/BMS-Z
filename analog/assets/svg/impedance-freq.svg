<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="ttl">
<title id="ttl">阻抗随频率：电容降价、电感涨价——寄生在暗处登场</title>
<desc>阻抗随频率：电容降价、电感涨价——寄生在暗处登场；节拍：① 低频区：电容≈断路、电感≈短路——两只元件都「没睡醒」；② 高频区全反过来：电容≈短路、电感≈断路——寄生接管电路；③ 交点 5kHz：Zc=Zl——LC 谐振，阻抗里只剩电阻（DCR/ESR）；④ 一切阻抗都是频率的函数——选元件先问「工作在哪个频段」</desc>
