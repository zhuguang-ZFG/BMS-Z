<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -156 800 840" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>极化的物理图景：放电时表面锂离子被抽走，静置时扩散把浓度拉匀，端电压才回到开路</title>
  <desc>带载示意停在 3.400 V。卸流瞬间按 R0 回到 3.440 V，之后 3.550 − 0.110·e^(−(t−3)/2) 爬向 3.550 V，t 的单位是分钟。开路电压要等这段回弹完再读。数字是示意。</desc>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .grain { fill: #e7f0fb; stroke: #0969da; stroke-width: 2; }
    .ion { fill: #1a7f37; }
    .iondim { fill: #1a7f37; opacity: 0.25; }
    .surf { stroke: #cf222e; stroke-width: 2; stroke-dasharray: 5 3; }
    .volt { stroke: #8250df; stroke-width: 2.5; fill: none; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .mark { stroke: #57606a; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .grain { fill: #12233a; stroke: #4493f8; }
      .ion { fill: #3fb950; }
      .iondim { fill: #3fb950; opacity: 0.25; }
      .surf { stroke: #ff7b72; }
      .volt { stroke: #d2a8ff; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .mark { stroke: #8b949e; }
    }
  </style>
  <rect class="bg" x="0" y="-156" width="800" height="840" /><text class="title" x="24" y="-128">极化：表面先被抽空，静置才把电压还回来</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 极化：表面先被抽空，静置才把电压还回来<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 放电中：表面被抽空<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 内部还密，表面已空<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="628" width="752" height="44" rx="6" /><text class="small" x="40" y="656">OCV 要等回弹完再读。急着读 3.440 V，会把还没散的极化当成开路电压。示意。</text><rect class="bg" width="800" height="620" />
  <rect class="panel" x="40" y="52" width="350" height="208" rx="6" />
  <text class="txt" x="56" y="76">放电中：表面被抽空</text>
  <circle class="grain" cx="215" cy="150" r="62" />
  <circle class="surf" cx="215" cy="150" r="50" fill="none" />
  <text class="small" x="300" y="100">表面层</text>
  <circle class="ion" cx="200" cy="138" r="5" /><circle class="ion" cx="225" cy="146" r="5" />
  <circle class="ion" cx="208" cy="164" r="5" /><circle class="ion" cx="228" cy="128" r="5" />
  <circle class="ion" cx="196" cy="156" r="5" /><circle class="ion" cx="218" cy="172" r="5" />
  <circle class="iondim" cx="258" cy="140" r="5" /><circle class="iondim" cx="172" cy="140" r="5" />
  <circle class="iondim" cx="248" cy="186" r="5" /><circle class="iondim" cx="182" cy="186" r="5" />
  <text class="small" x="56" y="228">内部还密，表面已空</text>
  <text class="small" x="56" y="246">端电压被拉低</text>

  <rect class="panel" x="410" y="52" width="350" height="208" rx="6" />
  <text class="txt" x="426" y="76">静置后：扩散回匀</text>
  <circle class="grain" cx="585" cy="150" r="62" />
  <circle class="ion" cx="570" cy="138" r="5" /><circle class="ion" cx="595" cy="146" r="5" />
  <circle class="ion" cx="578" cy="164" r="5" /><circle class="ion" cx="600" cy="128" r="5" />
  <circle class="ion" cx="560" cy="156" r="5" /><circle class="ion" cx="628" cy="140" r="5" />
  <circle class="ion" cx="548" cy="176" r="5" /><circle class="ion" cx="618" cy="180" r="5" />
  <circle class="ion" r="6">
    <animateMotion dur="8s" repeatCount="indefinite" path="M 585 150 L 640 128 L 585 150" />
  </circle>
  <text class="small" x="426" y="228">扩散把浓度梯度抹平</text>
  <text class="small" x="426" y="246">电压要几分钟才回弹</text>

  
  <rect class="panel" x="40" y="276" width="720" height="248" rx="6" />
  <text class="small" x="56" y="300">紫线：端电压（示意）</text>
  <text class="small" x="300" y="300">竖虚线：第 3 分钟卸流</text>
  <line class="axis" x1="110" y1="332" x2="110" y2="468" />
  <line class="axis" x1="110" y1="468" x2="720" y2="468" />
  <line class="grid" x1="104" y1="454.4" x2="720" y2="454.4" />
  <line class="grid" x1="104" y1="413.6" x2="720" y2="413.6" />
  <line class="grid" x1="104" y1="372.8" x2="720" y2="372.8" />
  <line class="grid" x1="104" y1="332.0" x2="720" y2="332.0" />
  <text class="small" x="100" y="458.4" text-anchor="end">3.40</text>
  <text class="small" x="100" y="417.6" text-anchor="end">3.46</text>
  <text class="small" x="100" y="376.8" text-anchor="end">3.52</text>
  <text class="small" x="100" y="336.0" text-anchor="end">3.58</text>
  <text class="small" x="28" y="400">V</text>
  <line class="mark" x1="293" y1="332" x2="293" y2="468" />
  <line class="grid" x1="110" y1="468" x2="110" y2="474" />
  <text class="small" x="110" y="490" text-anchor="middle">0</text>
  <line class="grid" x1="293" y1="468" x2="293" y2="474" />
  <text class="small" x="293" y="490" text-anchor="middle">3</text>
  <line class="grid" x1="476" y1="468" x2="476" y2="474" />
  <text class="small" x="476" y="490" text-anchor="middle">6</text>
  <line class="grid" x1="720" y1="468" x2="720" y2="474" />
  <text class="small" x="720" y="490" text-anchor="middle">10 min</text>
  <polyline class="volt" points="110.0,454.4 116.1,454.4 122.2,454.4 128.3,454.4 134.4,454.4 140.5,454.4 146.6,454.4 152.7,454.4 158.8,454.4 164.9,454.4 171.0,454.4 177.1,454.4 183.2,454.4 189.3,454.4 195.4,454.4 201.5,454.4 207.6,454.4 213.7,454.4 219.8,454.4 225.9,454.4 232.0,454.4 238.1,454.4 244.2,454.4 250.3,454.4 256.4,454.4 262.5,454.4 268.6,454.4 274.7,454.4 280.8,454.4 286.9,454.4 293.0,454.4 293.0,427.2 299.1,423.6 305.2,420.1 311.3,416.8 317.4,413.6 323.5,410.7 329.6,407.8 335.7,405.1 341.8,402.5 347.9,400.1 354.0,397.8 360.1,395.6 366.2,393.5 372.3,391.4 378.4,389.5 384.5,387.7 390.6,386.0 396.7,384.4 402.8,382.8 408.9,381.3 415.0,379.9 421.1,378.6 427.2,377.3 433.3,376.1 439.4,374.9 445.5,373.8 451.6,372.8 457.7,371.8 463.8,370.8 469.9,369.9 476.0,369.1 482.1,368.3 488.2,367.5 494.3,366.8 500.4,366.1 506.5,365.4 512.6,364.8 518.7,364.2 524.8,363.6 530.9,363.0 537.0,362.5 543.1,362.0 549.2,361.6 555.3,361.1 561.4,360.7 567.5,360.3 573.6,359.9 579.7,359.5 585.8,359.2 591.9,358.9 598.0,358.5 604.1,358.2 610.2,358.0 616.3,357.7 622.4,357.4 628.5,357.2 634.6,356.9 640.7,356.7 646.8,356.5 652.9,356.3 659.0,356.1 665.1,355.9 671.2,355.8 677.3,355.6 683.4,355.4 689.5,355.3 695.6,355.2 701.7,355.0 707.8,354.9 713.9,354.8 720.0,354.7" stroke-linejoin="round" stroke-linecap="round" />
  <circle class="ion" r="6">
    <animate attributeName="cx" values="110.0;201.5;293.0;293.0;384.5;537.0;720.0" keyTimes="0;0.15;0.30;0.32;0.50;0.75;1" dur="12s" repeatCount="indefinite" />
    <animate attributeName="cy" values="454.4;454.4;454.4;427.2;387.7;362.5;354.7" keyTimes="0;0.15;0.30;0.32;0.50;0.75;1" dur="12s" repeatCount="indefinite" />
  </circle>

  <rect class="panel" x="40" y="536" width="720" height="68" rx="6" />
  <text class="small" x="56" y="562">带载 3.400 V，卸流瞬间 3.440 V（示意 R0 回来 40 mV），然后爬向 3.550 V。</text>
  <text class="small" x="56" y="586">OCV 要等回弹完再读。急着读 3.440 V，会把还没散的极化当成开路电压。</text>
</svg>