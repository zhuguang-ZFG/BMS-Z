<svg xmlns="http://www.w3.org/2000/svg" width="800" height="512" viewBox="0 0 800 512" role="img" aria-labelledby="ttl">
<title id="ttl">精密整流：运放「借增益」消灭二极管压降</title>
<desc>精密整流：运放「借增益」消灭二极管压降；节拍：① 正半周：运放开环增益 10 万倍——输出只需多抬 0.7V，折算回输入仅 7µV 误差；② 负半周：二极管截止、运放饱和也无妨——输出被 Rf 锚在 0；③ 对比：普通二极管对 100mV 信号输出为零；精密整流分毫毕现——mV 级信号救星</desc>
