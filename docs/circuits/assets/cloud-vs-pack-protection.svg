<svg xmlns="http://www.w3.org/2000/svg" width="880" height="660" viewBox="0 -156 880 660" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>云端报文与包端切断对照示意图</title>
  <desc>云端报文与包端切断对照示意图</desc><style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .fill-boxb { fill: #ddf4ff; }
    .fill-boxg { fill: #dafbe1; }
    .fill-boxr { fill: #ffebe9; }
    .fill-boxy { fill: #fff8c5; }
    .fill-b { fill: #0969da; }
    .fill-g { fill: #1a7f37; }
    .fill-r { fill: #cf222e; }
    .fill-y { fill: #9a6700; }
    .fill-ink { fill: #57606a; }
    .fill-muted { fill: #e2e8f0; }
    .fill-lockb { fill: #0969da; }
    .stroke-panel { stroke: #d0d7de; }
    .stroke-axis { stroke: #57606a; }
    .stroke-b { stroke: #0969da; }
    .stroke-g { stroke: #1a7f37; }
    .stroke-r { stroke: #cf222e; }
    .stroke-y { stroke: #bf8700; }
    .stroke-check { stroke: #ffffff; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .on { fill: #ffffff; font-size: 13px; font-weight: bold; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .fill-boxb { fill: #12233a; }
      .fill-boxg { fill: #0f2415; }
      .fill-boxr { fill: #3d1214; }
      .fill-boxy { fill: #2d2607; }
      .fill-b { fill: #4493f8; }
      .fill-g { fill: #3fb950; }
      .fill-r { fill: #ff7b72; }
      .fill-y { fill: #d29922; }
      .fill-ink { fill: #8b949e; }
      .fill-muted { fill: #30363d; }
      .fill-lockb { fill: #0969da; }
      .stroke-panel { stroke: #30363d; }
      .stroke-axis { stroke: #8b949e; }
      .stroke-b { stroke: #4493f8; }
      .stroke-g { stroke: #3fb950; }
      .stroke-r { stroke: #ff7b72; }
      .stroke-y { stroke: #d29922; }
      .stroke-check { stroke: #0d1117; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .on { fill: #ffffff; }
      .lineb { stroke: #4493f8; }
    }
</style><rect class="bg" x="0" y="-156" width="880" height="660" /><text class="title" x="24" y="-128">示意图：包上先切断，云端报文可以晚到</text><rect class="panel" x="24" y="-112" width="832" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 示意图：包上先切断，云端报文可以晚到<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 比较器 / 接触器<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 过充过放过流短路过温<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="448" width="832" height="44" rx="6" /><text class="small" x="40" y="476">采集频次不应低于 1 次/s。通信断了先存本地，恢复后再补发。示意。</text><rect width="880" height="440" class="bg" />
  <rect x="16" y="52" width="420" height="250" rx="8" class="panel" />
  <text x="32" y="78" font-size="15" font-weight="bold" class="txt">留在包上</text>
  <rect x="32" y="96" width="180" height="44" rx="6" class="fill-boxr stroke-r" />
  <text x="122" y="123" text-anchor="middle" font-size="14" class="txt">比较器 / 接触器</text>
  <text x="32" y="168" font-size="14" class="txt">过充过放过流短路过温</text>
  <text x="32" y="192" font-size="14" class="txt">开线、绝缘、粘连</text>
  <text x="32" y="224" font-size="14" class="txt">不看蜂窝信号。</text>
  <text x="32" y="256" font-size="14" class="warn">这一拍就切断。</text>
  <rect x="230" y="210" width="180" height="36" rx="4" class="fill-boxr stroke-r" />
  <text x="320" y="233" text-anchor="middle" font-size="13" class="txt">充电 MOS 已关</text>

  <rect x="452" y="52" width="412" height="250" rx="8" class="panel" />
  <text x="468" y="78" font-size="15" font-weight="bold" class="txt">云端看得到的</text>
  <rect x="468" y="96" width="120" height="44" rx="6" class="fill-boxb stroke-b"><animate attributeName="stroke-width" values="5;2;5" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite" /></rect>
  <text x="528" y="123" text-anchor="middle" font-size="14" class="txt">报文</text>
  <rect x="720" y="96" width="120" height="44" rx="6" class="fill-muted stroke-axis"><animate attributeName="stroke-width" values="2;5;2" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite" /></rect>
  <text x="780" y="123" text-anchor="middle" font-size="14" class="txt">平台</text>
  <circle cy="118" r="6" class="fill-b">
    <animate attributeName="cx" values="540;760;540" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite" />
  </circle>
  <text x="468" y="172" font-size="14" class="txt">正常存储间隔最大可到 30 s。</text>
  <text x="468" y="196" font-size="14" class="txt">3 级报警才收到不超过 1 s。</text>
  <text x="468" y="228" font-size="14" class="txt">这是 GB/T 32960.2—2016 的记录，</text>
  <text x="468" y="252" font-size="14" class="txt">不是保护动作时限。</text>
  <text x="468" y="280" font-size="14" class="txt">蓝点晚到，闸已经断开。</text>

  <text x="16" y="340" font-size="14" class="txt">云可以做车队统计，也可以建议新标定。建议值不能直接放宽硬件比较器。</text>
  <text x="16" y="368" font-size="14" class="txt">采集频次不应低于 1 次/s。通信断了先存本地，恢复后再补发。</text>
  <text x="16" y="402" font-size="14" class="gold">示意图，不是监控平台截图。没有可转载的车队屏幕照片。</text>
</svg>