<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 544" font-family="ui-monospace, Consolas, monospace">
  <title>开路电压查表：折线插值在弯的地方会离开真曲线。数字为示意。</title>
  <desc>开路电压查表：折线插值在弯的地方会离开真曲线。数字为示意。</desc>

  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.5; fill: none; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
    }
  </style>

  <!-- formula: V=3.30+0.90*s+0.12*sin(2*pi*s); knots every 0.25 -->
  <rect class="bg" width="800" height="544"/>
  <text class="title" x="24" y="32">表上的点是对的，两点之间的直线会骗人（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="128" rx="6"/>
  <text class="txt" x="40" y="72" opacity="0.28">① 表只有五个点<tspan class="small">　0、0.25、0.50、0.75、1。点上蓝线和黄线重合。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="98" opacity="0.28">② 第一段中间<tspan class="small">　s=0.125，直线比曲线低 25 mV。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="124" opacity="0.28">③ 半满附近<tspan class="small">　正弦过零，这段弦和曲线贴得最近。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="150" opacity="0.28">④ 查表要报误差<tspan class="small">　点越稀，弯得越厉害的地方，SOC 越会偏。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="188" width="752" height="304" rx="6"/>
  <text class="small" x="40" y="210">电压 V（示意）</text>
  <line class="axis" x1="108.0" y1="228.0" x2="108.0" y2="430.0"/>
  <line class="axis" x1="108.0" y1="430.0" x2="730.0" y2="430.0"/>
  <text class="small" x="730.0" y="468.0" text-anchor="end">荷电 s</text>
  <line class="grid" x1="108.0" y1="430.0" x2="108.0" y2="436.0"/>
  <text class="small" x="108.0" y="452.0" text-anchor="middle">0</text>
  <line class="grid" x1="263.5" y1="430.0" x2="263.5" y2="436.0"/>
  <text class="small" x="263.5" y="452.0" text-anchor="middle">0.25</text>
  <line class="grid" x1="419.0" y1="430.0" x2="419.0" y2="436.0"/>
  <text class="small" x="419.0" y="452.0" text-anchor="middle">0.50</text>
  <line class="grid" x1="574.5" y1="430.0" x2="574.5" y2="436.0"/>
  <text class="small" x="574.5" y="452.0" text-anchor="middle">0.75</text>
  <line class="grid" x1="730.0" y1="430.0" x2="730.0" y2="436.0"/>
  <text class="small" x="730.0" y="452.0" text-anchor="middle">1</text>
  <line class="grid" x1="102.0" y1="411.6" x2="108.0" y2="411.6"/>
  <text class="small" x="98.0" y="415.6" text-anchor="end">3.30</text>
  <line class="grid" x1="102.0" y1="338.2" x2="108.0" y2="338.2"/>
  <text class="small" x="98.0" y="342.2" text-anchor="end">3.70</text>
  <line class="grid" x1="102.0" y1="246.4" x2="108.0" y2="246.4"/>
  <text class="small" x="98.0" y="250.4" text-anchor="end">4.20</text>
