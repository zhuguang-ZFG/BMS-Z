  <polyline class="lineg" points="92.0,271.2 98.3,273.4 104.6,275.3 110.8,277.0 117.1,278.5 123.4,279.8 129.7,280.8 136.0,281.7 142.2,282.2 148.5,282.6 154.8,282.7 161.1,282.6 167.4,282.2 173.6,281.6 179.9,280.8 186.2,279.8 192.5,278.5 198.8,277.0 205.0,275.3 211.3,273.4 217.6,271.2 223.9,272.1 230.2,272.9 236.4,273.6 242.7,274.1 249.0,274.6 255.3,274.9 261.6,275.1 267.8,275.3 274.1,275.3 280.4,275.3 286.7,275.2 293.0,275.0 299.2,274.8 305.5,274.6 311.8,274.3 318.1,274.0 324.4,273.7 330.6,273.3 336.9,273.0 343.2,272.6 349.5,272.3 355.8,272.0 362.0,271.7 368.3,271.4 374.6,271.2 380.9,270.0 387.2,268.8 393.4,267.7 399.7,266.7 406.0,265.8 412.3,264.9 418.6,264.2 424.8,263.5 431.1,263.0 437.4,262.5 443.7,262.2 450.0,262.0 456.2,261.9 462.5,262.0 468.8,262.2 475.1,262.5 481.4,262.9 487.6,263.5 493.9,264.2 500.2,265.0 506.5,266.0 512.8,267.1 519.0,268.3 525.3,269.7 531.6,271.2 537.9,268.1 544.2,265.2 550.4,262.5 556.7,260.1 563.0,258.0 569.3,256.0 575.6,254.4 581.8,252.9 588.1,251.7 594.4,250.7 600.7,249.9 607.0,249.3 613.2,249.0 619.5,248.8 625.8,248.9 632.1,249.1 638.4,249.6 644.6,250.2 650.9,251.1 657.2,252.1 663.5,253.3 669.8,254.6 676.0,256.1 682.3,257.8 688.6,259.7 694.9,261.7 701.2,263.9 707.4,266.2 713.7,268.6 720.0,271.2" stroke-linejoin="round" stroke-linecap="round"/>
