<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">一只电阻的两个寄生夺权点：等效模型与阻抗-频率曲线</title>
<desc id="figDesc">左侧手绘等效模型：理想 1kΩ 电阻串联约 10nH 引线电感，并联约 0.2pF 体电容，信号源驱动。右侧对数坐标阻抗曲线：理想 1kΩ 是一条平线；真实电阻在 f₁≈0.8GHz 处被体电容开始分流（1GHz 处约 575Ω），在 f₀≈3.6GHz 处 L、C 谐振探到谷底约 49Ω，此后引线电感接管、阻抗回升。底部结论：每个元件都有两个寄生夺权点 f₁=1/(2πRC) 与 f₀=1/(2π√(LC))，两条夺权点之间才是它当电阻的区间。</desc>
<rect width="960" height="640" fill="#fffdf8"/>
<text x="36" y="46" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="28" font-weight="700" fill="#14213d">一只电阻的两个夺权点</text>
<text x="36" y="76" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="15" fill="#52606d">标称 1kΩ：0.8GHz 起体电容分流，3.6GHz 谐振后引线电感接管</text>
