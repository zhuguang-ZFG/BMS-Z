<text x="118" y="280" font-family="'Book Mono',monospace" font-size="10" fill="#52606d">R1</text>

<text x="206" y="168" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" fill="#14213d">采样：输出电压（并在输出两端）</text>
<text x="206" y="189" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" fill="#14213d">回送：串联比压（Ve 与 Vin 串减）</text>
<text x="206" y="210" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" font-weight="700" fill="#14213d">钉死：电压增益 Av=1+R2/R1</text>
<text x="206" y="231" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" fill="#0f766e">Zin：×(1+Aβ) 推高</text>
<text x="206" y="252" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" fill="#0f766e">Zout：÷(1+Aβ) 压低</text>
<text x="206" y="273" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" fill="#52606d">实例：同相放大 Av=6，±0.5V→±3V</text>
</g>

