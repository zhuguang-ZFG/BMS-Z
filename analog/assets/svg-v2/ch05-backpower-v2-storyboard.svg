<text x="36" y="440" font-size="20" fill="#2a2927" text-anchor="start">1. 外部 3.3 V 经 10 kΩ，输入钳位压降取 0.3 V。</text>
<text x="36" y="482" font-size="20" fill="#2a2927" text-anchor="start">2. 掉电轨上并联 1 µF 和 10 kΩ 等效负载。</text>
<text x="36" y="524" font-size="20" fill="#2a2927" text-anchor="start">3. 终值 1.5 V；等效 RC 为 5 ms。</text>
<text x="36" y="566" font-size="20" fill="#2a2927" text-anchor="start">4. 核对 Ioff / 掉电高阻；名称 fail-safe 不能代替它。</text>
<text x="36" y="660" font-size="18" fill="#2a2927" text-anchor="start">固定二极管压降与被动负载示意，不代表任何具体芯片。</text>
