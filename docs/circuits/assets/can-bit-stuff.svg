<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 544" font-family="ui-monospace, Consolas, monospace">
  <title>CAN 位填充：连续 5 个相同位后插入 1 个反位。500 kbit/s 下每多 1 位就多 2 µs。教学示意，不是标准摘录，也不是厂商 DBC。</title>

  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #bf8700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.5; fill: none; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
    }
  </style>

  <!-- formula: t_us=(64+n_stuff)*2; n_stuff<=floor(64/5)=12 at 500 kbit/s -->
  <rect class="bg" width="800" height="544"/>
  <text class="title" x="24" y="32">看起来一样的数据，帧会被填充位拉长（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="128" rx="6"/>
  <text class="txt" x="40" y="72" opacity="0.28">① 没有连续 5 个相同位<tspan class="small">　64×2 µs = 128 µs。500 kbit/s，一位 2 µs。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="98" opacity="0.28">② 每插入 1 位<tspan class="small">　时长加 2 µs。斜率是常数，直线。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="124" opacity="0.28">③ 全是同一个位<tspan class="small">　floor(64/5)=12 个填充位。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="150" opacity="0.28">④ 最坏 152 µs<tspan class="small">　接收端要删掉填充位再交给上层。这不是 DBC。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="188" width="752" height="304" rx="6"/>
  <text class="small" x="40" y="210">帧时长 µs（示意）</text>
  <line class="axis" x1="108.0" y1="228.0" x2="108.0" y2="430.0"/>
  <line class="axis" x1="108.0" y1="430.0" x2="730.0" y2="430.0"/>
  <text class="small" x="730.0" y="468.0" text-anchor="end">填充位数（64 位数据段里）</text>
  <line class="grid" x1="108.0" y1="430.0" x2="108.0" y2="436.0"/>
  <text class="small" x="108.0" y="452.0" text-anchor="middle">0</text>
  <line class="grid" x1="347.2" y1="430.0" x2="347.2" y2="436.0"/>
  <text class="small" x="347.2" y="452.0" text-anchor="middle">5</text>
  <line class="grid" x1="682.2" y1="430.0" x2="682.2" y2="436.0"/>
  <text class="small" x="682.2" y="452.0" text-anchor="middle">12</text>
  <line class="grid" x1="102.0" y1="389.6" x2="108.0" y2="389.6"/>
  <text class="small" x="98.0" y="393.6" text-anchor="end">128</text>
  <line class="grid" x1="102.0" y1="268.4" x2="108.0" y2="268.4"/>
  <text class="small" x="98.0" y="272.4" text-anchor="end">152</text>
  <polyline class="lineb" points="108.0,389.6 155.8,379.5 203.7,369.4 251.5,359.3 299.4,349.2 347.2,339.1 395.1,329.0 442.9,318.9 490.8,308.8 538.6,298.7 586.5,288.6 634.3,278.5 682.2,268.4" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="doty" r="6"><animate attributeName="cx" values="108.0;155.8;203.7;251.5;299.4;347.2;395.1;442.9;490.8;538.6;586.5;634.3;682.2" keyTimes="0.0000;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1.0000" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="389.6;379.5;369.4;359.3;349.2;339.1;329.0;318.9;308.8;298.7;288.6;278.5;268.4" keyTimes="0.0000;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1.0000" dur="12s" repeatCount="indefinite"/></circle>
  <text class="small" x="24" y="528">只教学数据段 64 位和 500 kbit/s。不是 ISO 11898 条文，也不是任何厂商 DBC。整帧还有仲裁场、CRC 和应答，这里没画进去。</text>
</svg>
