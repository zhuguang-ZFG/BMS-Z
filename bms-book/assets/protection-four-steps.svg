<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="保护闭环四步：检测越限、延时确认、切断正确方向、验证反馈并按恢复条件重开">
  <title>保护的四步闭环</title>
  <desc>四张卡从左到右为检测、确认、切断和验证恢复，绿色反馈箭头从末端返回检测，强调动作必须闭环。</desc>
  <defs>
    <marker id="arrow-protect" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#377b60"/></marker>
    <marker id="arrow-danger" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#b84745"/></marker>
    <filter id="shadow-protect" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#293b3a" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="960" height="340" rx="20" fill="#fffdf5"/>
  <text x="30" y="38" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#293b3a">保护完成，不是“故障位置 1”——而是四步都闭环</text>
  <text x="30" y="64" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" fill="#626d65">每一步都要能回答：输入是什么、等了多久、关了哪条路、动作真的到位了吗？</text>

  <g fill="none" stroke="#b84745" stroke-width="3" marker-end="url(#arrow-danger)">
    <path d="M232 173 H260"/><path d="M462 173 H490"/><path d="M692 173 H720"/>
  </g>

  <g filter="url(#shadow-protect)" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">
    <g transform="translate(28 105)"><rect width="205" height="138" rx="16" fill="#e6f0f2" stroke="#176b73" stroke-width="2"/><circle cx="32" cy="32" r="18" fill="#176b73"/><text x="32" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#fffdf5">1</text><text x="62" y="39" font-size="18" font-weight="700" fill="#293b3a">检测越限</text><text x="18" y="76" font-size="13" fill="#293b3a">电压 · 电流 · 温度</text><text x="18" y="101" font-size="13" fill="#293b3a">同时检查数据是否可信</text><text x="18" y="124" font-size="11" fill="#176b73">值 + 质量 + 时间</text></g>
    <g transform="translate(258 105)"><rect width="205" height="138" rx="16" fill="#fbefc7" stroke="#926717" stroke-width="2"/><circle cx="32" cy="32" r="18" fill="#926717"/><text x="32" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#fffdf5">2</text><text x="62" y="39" font-size="18" font-weight="700" fill="#293b3a">延时确认</text><text x="18" y="76" font-size="13" fill="#293b3a">连续越限才判故障</text><text x="18" y="101" font-size="13" fill="#293b3a">短毛刺不应反复跳闸</text><text x="18" y="124" font-size="11" fill="#926717">阈值 + 延时 + 回差</text></g>
    <g transform="translate(488 105)"><rect width="205" height="138" rx="16" fill="#f8e8e5" stroke="#b84745" stroke-width="2"/><circle cx="32" cy="32" r="18" fill="#b84745"/><text x="32" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#fffdf5">3</text><text x="62" y="39" font-size="18" font-weight="700" fill="#293b3a">切断方向</text><text x="18" y="76" font-size="13" fill="#293b3a">禁充 · 禁放 · 双断</text><text x="18" y="101" font-size="13" fill="#293b3a">按故障选择正确闸门</text><text x="18" y="124" font-size="11" fill="#b84745">命令不等于已经断开</text></g>
    <g transform="translate(718 105)"><rect width="214" height="138" rx="16" fill="#e6f1eb" stroke="#377b60" stroke-width="2"/><circle cx="32" cy="32" r="18" fill="#377b60"/><text x="32" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#fffdf5">4</text><text x="62" y="39" font-size="18" font-weight="700" fill="#293b3a">验证与恢复</text><text x="18" y="76" font-size="13" fill="#293b3a">电流是否下降？开关是否到位？</text><text x="18" y="101" font-size="13" fill="#293b3a">满足恢复线后才重新允许</text><text x="18" y="124" font-size="11" fill="#377b60">反馈 + 恢复条件 + 记录</text></g>
  </g>

  <path d="M824 251 C824 310 132 310 132 251" fill="none" stroke="#377b60" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-protect)"/>
  <text x="480" y="316" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#377b60">反馈回到下一轮检测：保护是循环，不是一次性命令。</text>
</svg>
