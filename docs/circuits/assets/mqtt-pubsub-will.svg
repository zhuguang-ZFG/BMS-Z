<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 590" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>MQTT 示意：网关静默超过教学保活 15 s 后，broker 代发遗嘱。15 s 不是厂商默认值。</title>
  <desc>蓝线是静默秒数，红线在 15 s 升到保活线上，表示遗嘱已经代发。金点沿蓝线走。</desc>
  <style>
    .bg { fill: #fffdf5; }
    .panel { fill: #f7f2e5; stroke: #cfc6b2; }
    .axis { stroke: #626d65; stroke-width: 1.5; fill: none; }
    .grid { stroke: #cfc6b2; stroke-width: 1; fill: none; }
    .txt { fill: #293b3a; font-size: 13px; }
    .small { fill: #5f6a63; font-size: 12px; }
    .title { fill: #293b3a; font-size: 16px; font-weight: bold; }
    .hi { fill: #176b73; }
    .warn { fill: #ad4644; }
    .ok { fill: #36775e; }
    .gold { fill: #8e6518; }
    .lineb { stroke: #176b73; stroke-width: 2.5; fill: none; }
    .liner { stroke: #b84745; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #377b60; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .liney { stroke: #926717; stroke-width: 2.2; fill: none; }
    .linek { stroke: #626d65; stroke-width: 2.2; fill: none; stroke-dasharray: 7 4; }
    .dotb { fill: #176b73; }
    .dotr { fill: #b84745; }
    .dotg { fill: #377b60; }
    .doty { fill: #926717; }
    .boxb { fill: #e4f0df; stroke: #176b73; }
    .boxy { fill: #fbefc7; stroke: #926717; }
    .boxr { fill: #f6e2df; stroke: #b84745; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #192727; }
      .panel { fill: #223333; stroke: #496160; }
      .axis { stroke: #b0beb3; }
      .grid { stroke: #496160; }
      .txt { fill: #edf0e5; }
      .small { fill: #b0beb3; }
      .title { fill: #edf0e5; }
      .hi { fill: #7ec5c5; }
      .warn { fill: #f39b91; }
      .ok { fill: #8fc7a2; }
      .gold { fill: #dfbd78; }
      .lineb { stroke: #7ec5c5; }
      .liner { stroke: #f39b91; }
      .lineg { stroke: #8fc7a2; }
      .liney { stroke: #dfbd78; }
      .linek { stroke: #b0beb3; }
      .dotb { fill: #7ec5c5; }
      .dotr { fill: #f39b91; }
      .dotg { fill: #8fc7a2; }
      .doty { fill: #dfbd78; }
      .boxb { fill: #293f35; stroke: #7ec5c5; }
      .boxy { fill: #453e2b; stroke: #dfbd78; }
      .boxr { fill: #483336; stroke: #f39b91; }
    }
  </style><style id="bms-motion">
    /* bms-motion: 手帐式动效注记（纯装饰，不改技术几何与既有 SMIL 时序） */
    .bms-marker { fill: #fbefc7; opacity: .78; }
    .bms-under { fill: none; stroke: #926717; stroke-width: 2.4; stroke-linecap: round; opacity: .9; }
    .bms-spark-line { fill: none; stroke: #926717; stroke-width: 1.9; stroke-linecap: round; }
    .bms-spark-fill { fill: #926717; }
    .bms-spark-soft { fill: #176b73; opacity: .8; }
    .bms-sticker { fill: none; stroke: #926717; stroke-width: 2; stroke-dasharray: 7 5; stroke-linecap: round; opacity: .85; }
    .bms-halo { fill: none; stroke: #926717; stroke-width: 2; }
    .bms-marker, .bms-under, .bms-sticker, .bms-halo,
    .bms-spark, .bms-success, .bms-doodle { pointer-events: none; }
    circle:has(> animateMotion) { filter: drop-shadow(0 0 2px rgba(146,103,23,.5)) drop-shadow(0 0 5px rgba(196,145,52,.45)); }
    rect:has(> animateMotion) { filter: drop-shadow(0 0 3px rgba(196,145,52,.75)); }
    g:has(> circle):has(> path.stroke-check) { filter: drop-shadow(0 0 5px rgba(55,123,96,.5)); }
    @media (prefers-color-scheme: dark) {
      .bms-marker { fill: #453e2b; opacity: .85; }
      .bms-under { stroke: #dfbd78; }
      .bms-spark-line { stroke: #dfbd78; }
      .bms-spark-fill { fill: #dfbd78; }
      .bms-spark-soft { fill: #7ec5c5; }
      .bms-sticker { stroke: #dfbd78; }
      .bms-halo { stroke: #dfbd78; }
      circle:has(> animateMotion) { filter: drop-shadow(0 0 2px rgba(223,189,120,.8)) drop-shadow(0 0 7px rgba(223,189,120,.9)); }
      rect:has(> animateMotion) { filter: drop-shadow(0 0 6px rgba(223,189,120,.8)); }
      g:has(> circle):has(> path.stroke-check) { filter: drop-shadow(0 0 6px rgba(143,199,162,.7)); }
    }
    @media (prefers-reduced-motion: reduce) { .bms-spark, .bms-success, .bms-doodle { display: none; } }
</style>
  <!-- formula: age=t while silent; will steps at illustrative keepalive 15 s -->
  <rect class="bg" width="800" height="590"/>
  <rect class="bms-marker" aria-hidden="true" x="18.0" y="17.1" width="316.7" height="17.3" rx="3.8" transform="rotate(-.5 18.0 25.8)"/><path class="bms-under" aria-hidden="true" d="M24.0 40.0 q 24.0 -2.4 48.0 0 t 48 0 t 48 0 t 48 0 t 48 0 t 48 0"/><text class="title" x="24" y="32">心跳断了，broker 代发遗嘱（示意保活）</text>
  <rect class="panel" x="24" y="44" width="752" height="124" rx="6"/><g class="bms-doodle" aria-hidden="true" transform="translate(746.0 68.0)"><animateTransform attributeName="transform" type="rotate" values="-6;7;-6" keyTimes="0;0.5;1" dur="5.4s" repeatCount="indefinite" additive="sum"/><animate attributeName="opacity" values="0.62;1;0.62" keyTimes="0;0.5;1" dur="3.6s" repeatCount="indefinite"/><path class="bms-spark-fill" d="M0 -9 L2.3 -2.3 L9 0 L2.3 2.3 L0 9 L-2.3 2.3 L-9 0 L-2.3 -2.3 Z"/></g><g class="bms-doodle" aria-hidden="true" transform="translate(710.0 58.0)"><animateTransform attributeName="transform" type="rotate" values="5;-4;5" keyTimes="0;0.5;1" dur="6.2s" repeatCount="indefinite" additive="sum"/><animate attributeName="opacity" values="0.5;0.9;0.5" keyTimes="0;0.5;1" dur="4.4s" repeatCount="indefinite"/><path class="bms-spark-soft" d="M0 -5.5 L1.4 -1.4 L5.5 0 L1.4 1.4 L0 5.5 L-1.4 1.4 L-5.5 0 L-1.4 -1.4 Z"/></g><g class="bms-doodle" aria-hidden="true"><circle class="bms-spark-fill" cx="728.0" cy="77.0" r="1.3"/><circle class="bms-spark-soft" cx="696.0" cy="74.0" r="1.1"/></g>
  <text class="txt" x="40" y="68" opacity="0.28">① 网关还在<tspan class="small">　年龄从 0 往上走。订阅者听到的是普通遥测。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" calcMode="spline" keySplines="0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="92" opacity="0.28">② 示意保活 15 s<tspan class="small">　不是某一家 broker 的出厂默认。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="116" opacity="0.28">③ 越过 15 s<tspan class="small">　broker 代发离线遗嘱。订阅者不要再把旧遥测当活的。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="140" opacity="0.28">④ 口诀<tspan class="small">　人掉线了，最后一句话由中间人来说。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="180" width="752" height="268" rx="6"/>
  <text class="small" x="40" y="202">距上一包的秒数</text>
  <text class="hi" x="200" y="218">蓝 静默年龄</text>
  <text class="warn" x="380" y="218">红 遗嘱（到点升到 15）</text>
  <line class="axis" x1="108.0" y1="248.0" x2="108.0" y2="400.0"/>
  <line class="axis" x1="108.0" y1="400.0" x2="720.0" y2="400.0"/>
  <line class="grid" x1="108.0" y1="400.0" x2="108.0" y2="406.0"/>
  <text class="small" x="108.0" y="422.0" text-anchor="middle">0</text>
  <line class="grid" x1="414.0" y1="400.0" x2="414.0" y2="406.0"/>
  <text class="small" x="414.0" y="422.0" text-anchor="middle">15</text>
  <line class="grid" x1="720.0" y1="400.0" x2="720.0" y2="406.0"/>
  <text class="small" x="720.0" y="422.0" text-anchor="middle">30</text>
  <line class="grid" x1="102.0" y1="400.0" x2="108.0" y2="400.0"/>
  <text class="small" x="98.0" y="404.0" text-anchor="end">0</text>
  <line class="grid" x1="102.0" y1="328.8" x2="108.0" y2="328.8"/>
  <text class="small" x="98.0" y="332.8" text-anchor="end">15</text>
  <line class="grid" x1="102.0" y1="257.5" x2="108.0" y2="257.5"/>
  <text class="small" x="98.0" y="261.5" text-anchor="end">30</text>
  <text class="small" x="720" y="444" text-anchor="end">静默时间 s</text>
