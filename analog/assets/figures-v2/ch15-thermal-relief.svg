<text x="730" y="470" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">整片铜直接连，热被铜皮瞬间导走</text>
<text x="730" y="512" font-size="22" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="middle">大电流路径、电源入口</text>
<rect x="60" y="596" width="880" height="60" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<rect class="ink-echo" x="60" y="596" width="880" height="60" rx="6" stroke="#37424e" stroke-width="2" fill="none" opacity="0.32" transform="translate(1.02 0.87) rotate(-0.01 500.0 626.0)"/>
<text x="500" y="633" font-size="22" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="middle">同一个封装库，两类焊盘分开命名；别指望铺铜规则替你分清。</text>
