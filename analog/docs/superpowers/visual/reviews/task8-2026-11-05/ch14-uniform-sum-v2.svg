<text x="60" y="560" font-size="22" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">落在 ±2% 内的精确概率 = 23/24 ≈ 95.83%；不是 99.7%。</text>
<text x="60" y="608" font-size="22" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">目标放宽至 ±4%：WC 与 3σ 尺度均小于目标，都通过。</text>
<text x="60" y="656" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">只把一项从 ±1% 降至 ±0.5%，WC 仍为 ±2.5%，不满足 ±2%。</text>
