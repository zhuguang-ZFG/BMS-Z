<text x="412" y="134" font-size="11.5" font-weight="bold" fill="#a4630f">① 寿命公式</text><text x="412" y="159" font-size="14.5" font-weight="bold" fill="#16202b">L = L0 × 2^((T0−T)/10)</text><text x="412" y="176" font-size="10.5" fill="#5b666f">10°C 翻倍法则</text>
<text x="412" y="192" font-size="11.5" font-weight="bold" fill="#a4630f">② 代入</text><text x="412" y="217" font-size="14.5" font-weight="bold" fill="#16202b">2000h @105°C，工作 65°C</text><text x="412" y="234" font-size="10.5" fill="#5b666f">L = 2000 × 2⁴</text><rect x="400" y="168" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.25;0.28;1" dur="14s" repeatCount="indefinite"/></rect>
<text x="412" y="250" font-size="11.5" font-weight="bold" fill="#a4630f">③ 结果</text><text x="412" y="275" font-size="14.5" font-weight="bold" fill="#16202b">32000 h ≈ 3.7 年（连续通电）</text><text x="412" y="292" font-size="10.5" fill="#5b666f">自发热算进 T</text><rect x="400" y="226" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.5;0.53;1" dur="14s" repeatCount="indefinite"/></rect>
<text x="412" y="308" font-size="11.5" font-weight="bold" fill="#a4630f">④ 加速老化</text><text x="412" y="333" font-size="14.5" font-weight="bold" fill="#16202b">纹波电流超 30% → 寿命腰斩</text><text x="412" y="350" font-size="10.5" fill="#5b666f">ESR 发热直接抬 T</text><rect x="400" y="284" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.75;0.78;1" dur="14s" repeatCount="indefinite"/></rect>
