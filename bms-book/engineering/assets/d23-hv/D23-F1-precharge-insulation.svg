  .wire { stroke: #003153; stroke-width: 2; fill: none; stroke-linecap: round; }
  .res { fill: #fbf8f1; stroke: #003153; stroke-width: 2; }
  .warn { stroke: #a3322a; stroke-width: 2.4; fill: none; stroke-linecap: round; }
