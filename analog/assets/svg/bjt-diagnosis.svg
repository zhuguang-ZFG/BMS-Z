<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img" aria-labelledby="ttl">
<title id="ttl">BJT 在线速判：三个电压，指出故障在哪</title>
<desc>BJT 在线速判：三个电压，指出故障在哪；节拍：① 正常态：V_BE=0.7V、V_C 高于 V_B —— 两条判据同时成立才叫「放大态」；② V_BE=0.7V 但 V_C 高挂电源：说明「有基极电流、无集电极电流」→ 查集电极回路；③ 三个电压一量就能定向到回路——先测后拆，是最省时间的排故顺序；④ 电压全对却烫手：那是散热账（P=V_CE·I_C），不是电气故障</desc>
