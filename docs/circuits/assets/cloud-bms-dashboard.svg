<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440">
  <title>电池云仪表盘示意图</title>
  <rect width="880" height="440" fill="#f8fafc"/>
  <style>
  text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
  @media (prefers-color-scheme: dark){
  rect[fill="#f8fafc"]{fill:#0f172a}
  rect[fill="#fff"]{fill:#1e293b}
  [fill="#e2e8f0"]{fill:#334155}
  [stroke="#e2e8f0"]{stroke:#334155}
  [fill="#334155"]{fill:#e2e8f0}
  [stroke="#334155"]{stroke:#e2e8f0}
  [fill="#1e293b"]{fill:#f1f5f9}
  [stroke="#1e293b"]{stroke:#f1f5f9}
  [fill="#dbeafe"]{fill:#1e3a8a}
  [stroke="#dbeafe"]{stroke:#1e3a8a}
  [fill="#1d4ed8"]{fill:#60a5fa}
  [stroke="#1d4ed8"]{stroke:#60a5fa}
  [fill="#ecfdf5"]{fill:#022c22}
  [fill="#059669"]{fill:#34d399}
  [stroke="#059669"]{stroke:#34d399}
  [fill="#fffbeb"]{fill:#451a03}
  [fill="#fef3c7"]{fill:#78350f}
  [fill="#b45309"]{fill:#fbbf24}
  [stroke="#b45309"]{stroke:#fbbf24}
  [fill="#fef2f2"]{fill:#450a0a}
  [fill="#fecaca"]{fill:#7f1d1d}
  [fill="#dc2626"]{fill:#f87171}
  [stroke="#dc2626"]{stroke:#f87171}
  }
  </style>

  <text x="440" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">电池云仪表盘上该有的格子</text>
  <text x="440" y="50" text-anchor="middle" font-size="13" fill="#b45309">示意图·待实拍</text>
  <rect x="24" y="72" width="560" height="230" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="40" y="100" font-size="14" font-weight="bold" fill="#1e293b">车队画面（示意）</text>
  <rect x="40" y="116" width="160" height="70" rx="4" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="120" y="146" text-anchor="middle" font-size="13" fill="#1e293b">各串电压</text>
  <text x="120" y="166" text-anchor="middle" font-size="12" fill="#334155">迟到的一帧</text>
  <rect x="216" y="116" width="160" height="70" rx="4" fill="#fffbeb" stroke="#b45309"/>
  <text x="296" y="146" text-anchor="middle" font-size="13" fill="#1e293b">包内 DTC</text>
  <text x="296" y="166" text-anchor="middle" font-size="12" fill="#334155">时间早于平台</text>
  <rect x="392" y="116" width="168" height="70" rx="4" fill="#e2e8f0" stroke="#334155"/>
  <text x="476" y="146" text-anchor="middle" font-size="13" fill="#1e293b">SOC / 温度</text>
  <text x="476" y="166" text-anchor="middle" font-size="12" fill="#334155">统计用</text>
  <text x="40" y="220" font-size="13" fill="#334155">正常存储可以到 30 s。平台安静不等于包安静。</text>
  <text x="40" y="248" font-size="13" fill="#334155">蓝点还在链路上时，包上的充电 MOS 可以已经断开。</text>
  <circle cy="186" r="6" fill="#1d4ed8">
    <animate attributeName="cx" values="40;520;40" keyTimes="0;0.7;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <rect x="604" y="72" width="252" height="230" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="730" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">留在包上</text>
  <text x="730" y="144" text-anchor="middle" font-size="13" fill="#334155">比较器</text>
  <text x="730" y="168" text-anchor="middle" font-size="13" fill="#334155">接触器 / MOS</text>
  <text x="730" y="200" text-anchor="middle" font-size="13" fill="#dc2626">这一拍就切断</text>
  <text x="730" y="232" text-anchor="middle" font-size="13" fill="#334155">不看云端是否在线</text>
  <text x="24" y="332" font-size="14" fill="#1e293b">公共汽车 GPS 控制室和车队定位界面没有单体电压，也没有包内 DTC，没有收。</text>
  <text x="24" y="360" font-size="14" fill="#334155">这张格子是电池云该有的内容。仪表盘实拍仍然没有。</text>

</svg>
