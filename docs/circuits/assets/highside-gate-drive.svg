<svg xmlns="http://www.w3.org/2000/svg" width="800" height="836" viewBox="0 -156 800 836" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>高边驱动与自举电容动画</title>
  <desc>高边驱动与自举电容动画。示意。</desc><style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
