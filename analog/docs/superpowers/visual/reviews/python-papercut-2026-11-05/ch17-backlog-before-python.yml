  - id: table-runs-vs-visual-density
    question: >-
      两段断层是「表格墙」，不是落点没找着。2257 字段（行 54→94）实测分解：上一张图
      （行 53–56）的 <figure> 标记与图注残留 186 ＋ 表前 154（读图指引 94 ＋ slot 注释 60）
      ＋ 表 17-2 表题 16 ＋ 表体 1523（18 数据行）＋ 表后 378（为什么／结构性原因／验证手法）。
      表体自己就 1523 > 1500：不切开表格，怎么插都过不了闸。程序穷举该段 8 个段末落点的
      1–3 刀组合，无合法解。1969 字段（行 114→150）同理：残留 126 ＋ 118 段 199 ＋ 120 段 142
      ＋ 17.2 标题 14 ＋ 表题 20 ＋ 表 17-3 表体 1293 ＋ 表后 132＋43；把图插到 120 之后
      只是把 1969 变成 1664（仍超闸），把 120 那段删掉缩成导读又与行 114 的图注只剩 199＋
      残留 126 ＝ 325 字 < min_spacing 400，判堆图；表后 145/147 距行 149 的锚点 175 字，
      同样放不下刀。穷举 8 个落点的 1–3 刀组合，无合法解。
    options:
      - A 拆表：把表 17-2 按「输入与输出／LDO 热与压差／开关与 EMI／时序与掉电」拆成 3–4 张小子表，
        表间各插一锚点。内容与行数不减，检索性变差一点，但读者滚动时长表的压迫感确实下降。
        注意拆到的子表必须 <1500 字才有意义（表 17-2 拆两半每半约 760）。
      - B 改口径：审计器把「连续 ≥8 行的 Markdown 表格」计为视觉锚点（速查表本来就是这一章的视觉主体），
        则 2257 被表 17-2 劈成 356 与 378、1969 被表 17-3 劈成 501 与 175，两段当场过闸；
        代价是闸的语义从「无图」变成「无视觉单元」，冻结基线的逐位回归口径也随之改变，
        须同步改测试与规格。
      - C 维持现口径并接受这两段超标，把本章 --gate 失败项如实登记为 2。
    blocking: >-
      本项未决前，ch17 的 2257 与 1969 两段没有可执行点位（ch17-icar-quiescent-budget 因此
      挂 deferred）。口径只影响这两段，其余 10 个点位已按现口径核实合法。
      注：不可把本章结论外推成「别的章也是速查表墙」——ch00 的 8518 字段落表体只占 870
      （约 10%），是散文墙，已实测靠 10 刀「插段末＋删铺陈」劈到 hard 0（见 ch00.yml 的
      plan_verified）；散文墙可解、表墙不可解，两者必须分开登记。ch08 待实测。
