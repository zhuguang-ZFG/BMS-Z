<text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b">相干采样把一千赫兹折成相位相关直流</text>
<text x="360" y="54" text-anchor="middle" font-size="12.5" fill="#5b666f">示意 fs=1 kHz、初相 π/6；实线由样本插值辅助看形状，不是原模拟波。</text>
