<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 625" width="960" height="625" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<title id="title">教学帧的CRC覆盖范围与六参数</title>
<desc id="desc">AA55、地址01、命令03、长度02、载荷0EA0、CRC31，共八字节。CRC覆盖地址到载荷五字节，包括长度，不含帧头和CRC字节。CRC-8/SMBUS参数为8、07、00、不反射、不反射、00；ASCII标准向量结果F4。</desc>
<rect width="960" height="625" fill="#FFFDF5"/>
<text x="40" y="50" font-size="32" fill="#293B3A" text-anchor="start" font-weight="700">这 8 个字节，谁在 CRC 的括号里？</text>
<text x="40" y="88" font-size="22" fill="#293B3A" text-anchor="start" font-weight="400">教学帧 / 非厂商协议　　总长 6 + len = 8 B；len 只数载荷</text>
<rect x="40" y="128" width="216" height="127" rx="8" fill="#FFFFFF" stroke="#CED8CF" stroke-width="2"/>
<text x="148" y="159" font-size="23" fill="#293B3A" text-anchor="middle" font-weight="700">帧头</text>
<text x="148" y="205" font-size="30" fill="#176B73" text-anchor="middle" font-weight="700">AA 55</text>
<text x="148" y="239" font-size="20" fill="#293B3A" text-anchor="middle" font-weight="400">2 B</text>
<rect x="260" y="128" width="106" height="127" rx="8" fill="#E6F0EF" stroke="#CED8CF" stroke-width="2"/>
<text x="313" y="159" font-size="23" fill="#293B3A" text-anchor="middle" font-weight="700">addr</text>
<text x="313" y="205" font-size="30" fill="#176B73" text-anchor="middle" font-weight="700">01</text>
<text x="313" y="239" font-size="20" fill="#293B3A" text-anchor="middle" font-weight="400">1 B</text>
<rect x="370" y="128" width="106" height="127" rx="8" fill="#E6F0EF" stroke="#CED8CF" stroke-width="2"/>
<text x="423" y="159" font-size="23" fill="#293B3A" text-anchor="middle" font-weight="700">cmd</text>
<text x="423" y="205" font-size="30" fill="#176B73" text-anchor="middle" font-weight="700">03</text>
<text x="423" y="239" font-size="20" fill="#293B3A" text-anchor="middle" font-weight="400">1 B</text>
<rect x="480" y="128" width="106" height="127" rx="8" fill="#E6F0EF" stroke="#CED8CF" stroke-width="2"/>
<text x="533" y="159" font-size="23" fill="#293B3A" text-anchor="middle" font-weight="700">len</text>
<text x="533" y="205" font-size="30" fill="#176B73" text-anchor="middle" font-weight="700">02</text>
<text x="533" y="239" font-size="20" fill="#293B3A" text-anchor="middle" font-weight="400">1 B</text>
<rect x="590" y="128" width="216" height="127" rx="8" fill="#E6F0EF" stroke="#CED8CF" stroke-width="2"/>
<text x="698" y="159" font-size="23" fill="#293B3A" text-anchor="middle" font-weight="700">data</text>
<text x="698" y="205" font-size="30" fill="#176B73" text-anchor="middle" font-weight="700">0E A0</text>
<text x="698" y="239" font-size="20" fill="#293B3A" text-anchor="middle" font-weight="400">2 B</text>
<rect x="810" y="128" width="106" height="127" rx="8" fill="#FFFFFF" stroke="#CED8CF" stroke-width="2"/>
<text x="863" y="159" font-size="23" fill="#293B3A" text-anchor="middle" font-weight="700">crc8</text>
<text x="863" y="205" font-size="30" fill="#176B73" text-anchor="middle" font-weight="700">31</text>
<text x="863" y="239" font-size="20" fill="#293B3A" text-anchor="middle" font-weight="400">1 B</text>
<line x1="260" y1="270" x2="260" y2="289" stroke="#176B73" stroke-width="3"/>
<line x1="260" y1="289" x2="806" y2="289" stroke="#176B73" stroke-width="3"/>
<line x1="806" y1="270" x2="806" y2="289" stroke="#176B73" stroke-width="3"/>
<text x="533" y="326" font-size="23" fill="#176B73" text-anchor="middle" font-weight="700">CRC 输入：01 03 02 0E A0（5 B）</text>
<rect x="40" y="357" width="880" height="152" rx="12" fill="#F6F0E1" stroke="#CED8CF" stroke-width="2"/>
<text x="62" y="391" font-size="27" fill="#926717" text-anchor="start" font-weight="700">CRC-8/SMBUS</text>
<text x="62" y="430" font-size="23" fill="#293B3A" text-anchor="start" font-weight="400">width=8     poly=0x07     init=0x00</text>
<text x="62" y="469" font-size="23" fill="#293B3A" text-anchor="start" font-weight="400">refin=false     refout=false     xorout=0x00</text>
<text x="40" y="550" font-size="24" fill="#293B3A" text-anchor="start" font-weight="700">校验向量：ASCII 123456789 → F4；本帧输入 → 31</text>
<text x="40" y="591" font-size="22" fill="#293B3A" text-anchor="start" font-weight="400">改了 len，也改了 CRC 输入；帧头和 crc8 字节都不在括号内。</text>
</svg>
