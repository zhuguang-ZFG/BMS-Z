<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">CMOS 传输门：一只管子总有一段「使不上劲」</text>

<text x="190" y="52" text-anchor="middle" font-size="14" font-weight="bold" fill="#37424e">NMOS + PMOS 并联 = 全程平坦</text>
<text x="40" y="92" font-size="11.5" fill="#5b666f">Vin 靠近 0V：NMOS 的 V_GS 最大 →</text>
<text x="52" y="110" font-size="11.5" font-weight="bold" fill="#1f5d7a">NMOS 挑大梁（Ron 20Ω）</text>
<text x="40" y="140" font-size="11.5" fill="#5b666f">Vin 逼近 VDD：NMOS 的 V_GS→0</text>
<text x="52" y="158" font-size="11.5" font-weight="bold" fill="#a8321f">NMOS 彻底罢工（Ron→∞）</text>
<text x="40" y="188" font-size="11.5" fill="#5b666f">PMOS 恰好相反：Vin 越低压</text>
<text x="52" y="206" font-size="11.5" font-weight="bold" fill="#a8321f">V_SG 越不够，低端罢工</text>
<text x="40" y="236" font-size="11.5" font-weight="bold" fill="#3d6b4a">两只并联：谁行谁上，接力覆盖</text>
<text x="52" y="254" font-size="11.5" fill="#5b666f">Ron 全程锁在 20~27Ω</text>
<text x="40" y="284" font-size="11" fill="#5b666f">代价：多一只管子、多一个</text>
<text x="40" y="302" font-size="11" fill="#5b666f">反相控制信号——CD4066 内部</text>
<text x="40" y="320" font-size="11" fill="#5b666f">就是这么干的</text>
