</style><rect class="bg" x="0" y="-156" width="800" height="558" /><text class="title" x="24" y="-128">主动均衡（电感式）：不当败家子，能量搬过去而不是烧掉</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 主动均衡（电感式）：不当败家子，能量搬过去而不是烧掉<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② A 电池 4.05V<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ B 电池 3.65V<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="346" width="752" height="44" rx="6" /><text class="small" x="40" y="374">效率 80%+、均衡电流可达安培级；代价是电路复杂——大容量储能才划算。示意。</text><rect width="800" height="338" class="bg" />
  <g fill="none" stroke-width="2.5" class="stroke-axis">
    <rect x="100" y="18" width="80" height="200" rx="4" />
    <rect x="620" y="18" width="80" height="200" rx="4" />
  </g>
  <rect x="103" y="38" width="74" height="177" opacity="0.85" class="fill-b">
    <animate attributeName="height" values="177;157;157" keyTimes="0;0.85;1" dur="8s" repeatCount="indefinite" />
    <animate attributeName="y" values="38;58;58" keyTimes="0;0.85;1" dur="8s" repeatCount="indefinite" />
  </rect>
  <rect x="623" y="98" width="74" height="117" opacity="0.85" class="fill-b">
    <animate attributeName="height" values="117;137;137" keyTimes="0;0.85;1" dur="8s" repeatCount="indefinite" />
    <animate attributeName="y" values="98;78;78" keyTimes="0;0.85;1" dur="8s" repeatCount="indefinite" />
  </rect>
  <g font-size="13" text-anchor="middle" font-weight="bold" class="fill-ink">
    <text x="140" y="240" class="small">A 电池 4.05V</text>
    <text x="660" y="240" class="small">B 电池 3.65V</text>
  </g>

  
  <g stroke-width="3" fill="none" class="stroke-b">
    <path d="M180,58 H280 V98 H350">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.48;0.52;1" dur="2s" repeatCount="indefinite" />
    </path>
    <path d="M450,98 H520 V118 H620">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.48;0.52;1" dur="2s" repeatCount="indefinite" />
    </path>
  </g>
  <text x="265" y="48" font-size="12" class="hi">开关位 1：接 A</text>
  <text x="500" y="86" font-size="12" class="hi">开关位 2：接 B</text>

  
  <g fill="none" stroke-width="3" class="stroke-axis">
    <path d="M350,118 a12,12 0 0 1 24,0 a12,12 0 0 1 24,0 a12,12 0 0 1 24,0 a12,12 0 0 1 24,0" />
  </g>
  <rect x="340" y="88" width="120" height="60" rx="10" fill="none" stroke-width="2" opacity="0" class="stroke-y">
    <animate attributeName="opacity" values="0.15;0.9;0.15" dur="2s" repeatCount="indefinite" />
  </rect>
  <text x="400" y="170" text-anchor="middle" font-size="13" font-weight="bold" class="txt">电感（磁场储能）</text>

  
  <g>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.48;0.52;1" dur="2s" repeatCount="indefinite" />
    <circle r="6" class="fill-y"><animateMotion dur="0.9s" begin="0s" repeatCount="indefinite" path="M185,58 H275 V103 H345" /></circle>
    <circle r="6" class="fill-y"><animateMotion dur="0.9s" begin="-0.45s" repeatCount="indefinite" path="M185,58 H275 V103 H345" /></circle>
  </g>
  
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.48;0.52;1" dur="2s" repeatCount="indefinite" />
    <circle r="6" class="fill-g"><animateMotion dur="0.9s" begin="0s" repeatCount="indefinite" path="M455,113 H520 V118 H615" /></circle>
    <circle r="6" class="fill-g"><animateMotion dur="0.9s" begin="-0.45s" repeatCount="indefinite" path="M455,113 H520 V118 H615" /></circle>
  </g>

  
  <g font-size="14" text-anchor="middle">
    <text x="400" y="218" opacity="0" class="gold">第 1 拍：开关接 A，电感"吸气"——A 的能量存进磁场<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.44;0.48;1" dur="2s" repeatCount="indefinite" /></text>
    <text x="400" y="218" opacity="0" class="ok">第 2 拍：开关切到 B，电感"呼气"——磁场能量倒进 B<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.52;0.56;1" dur="2s" repeatCount="indefinite" /></text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.86;0.9;1" dur="8s" repeatCount="indefinite" />
    
    <rect x="140" y="268" width="520" height="36" rx="8" class="fill-boxg stroke-g" />
    <text x="400" y="291" text-anchor="middle" font-size="14" font-weight="bold" class="ok">水位趋于一致——能量被搬走而不是烧成电阻热（开关/电感仍有少量损耗）</text>
  </g>

  
</svg>