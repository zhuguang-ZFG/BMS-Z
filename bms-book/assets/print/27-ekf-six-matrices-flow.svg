  <text x="24" y="32" class="title ink">六个矩阵，都在回答一个朴素问题</text>
  <text x="24" y="58" class="body muted">A、B、C 说明模型怎样走；P、Q、R 说明这一步该有多谨慎。</text>

  <!-- 装饰：两种手帐小星，仅标示「现在轮到哪一段」 -->
  <g class="bms-doodle" aria-hidden="true" transform="matrix(0.9945218953682733 -0.10452846326765347 0.10452846326765347 0.9945218953682733 240 74)" opacity="0.62" style="opacity: 0.62;"><path d="M0 -8L0.38 -4.81L2.1 -2.1L4.82 -0.41L8 0L4.89 0.61L2.1 2.1L0.12 4.72L0 8L-0.13 4.72L-2.1 2.1L-5.27 1.66L-8 0L-5.3 -1.76L-2.1 -2.1Z" class="bms-spark-fill"/></g>
  <g class="bms-doodle" aria-hidden="true" transform="matrix(0.9961946980917455 0.08715574274765817 -0.08715574274765817 0.9961946980917455 530 74)" opacity="0.62" style="opacity: 0.62;"><path d="M0 -7L1.9 -1.9L7 0L1.9 1.9L0 7L-1.9 1.9L-7 0L-1.9 -1.9Z" class="bms-spark-fill"/></g>

  <g transform="translate(24 92)">
    <path d="M-0.49 13Q0 0 13 0L109 -0.9L205 0Q218 0 218 13L218.72 59L218 105Q218 118 205 118L109 118.52L13 118Q0 118 0 105L0 12.71" class="model card"/>
    <text x="14" y="31" class="head green-text">A · 状态自己怎么走</text>
    <text x="14" y="60" class="body ink">SOC 一拍内近似不变</text>
    <text x="14" y="84" class="body ink">极化按 τ 衰减</text>
    <text x="14" y="106" class="small muted">diag(1, e^(−Δt/τ))</text>
  </g>
  <g transform="translate(24 226)">
    <path d="M-0.67 13Q0 0 13 0L109 0.25L205 0Q218 0 218 13L218.44 59L218 105Q218 118 205 118L109 117.21L13 118Q0 118 0 105L0 12.6" class="model card"/>
    <text x="14" y="31" class="head green-text">B · 电流把状态推多少</text>
    <text x="14" y="60" class="body ink">容量决定 SOC 步长</text>
    <text x="14" y="84" class="body ink">R₁、τ 决定极化步长</text>
    <text x="14" y="106" class="small muted">Δt/(3600Qcap)</text>
  </g>
  <g transform="translate(24 360)">
    <path d="M-0.47 13Q0 0 13 0L109 0.32L205 0Q218 0 218 13L218.33 59L218 105Q218 118 205 118L109 118.57L13 118Q0 118 0 105L0 12.72" class="model card"/>
    <text x="14" y="31" class="head green-text">C · 电压能看见什么</text>
    <text x="14" y="60" class="body ink">SOC 靠 dOCV/dSOC 被看见</text>
    <text x="14" y="84" class="body ink">极化电压直接进入端电压</text>
    <text x="14" y="106" class="small muted">[dOCV/dSOC, 1]</text>
  </g>

  <g transform="translate(558 92)">
    <path d="M-0.51 13Q0 0 13 0L109 0.48L205 0Q218 0 218 13L218.83 59L218 105Q218 118 205 118L109 118.7L13 118Q0 118 0 105L0 12.69" class="uncertainty card"/>
    <text x="14" y="31" class="head gold-text">P · 我现在多不确定</text>
    <text x="14" y="60" class="body ink">初始 SOC 标准差 10 个百分点</text>
    <text x="14" y="84" class="body ink">极化标准差 10 mV</text>
    <text x="14" y="106" class="small muted">diag(1e−2, 1e−4)</text>
  </g>
  <g transform="translate(558 226)">
    <path d="M-0.42 13Q0 0 13 0L109 -0.74L205 0Q218 0 218 13L217.69 59L218 105Q218 118 205 118L109 117.23L13 118Q0 118 0 105L0 12.75" class="uncertainty card"/>
    <text x="14" y="31" class="head gold-text">Q · 每拍新增多少不确定</text>
    <text x="14" y="60" class="body ink">模型没写全的部分</text>
    <text x="14" y="84" class="body ink">随预测一起加进 P</text>
    <text x="14" y="106" class="small muted">diag(2e−6, 1e−7)</text>
  </g>
  <g transform="translate(558 360)">
    <path d="M-0.82 13Q0 0 13 0L109 0.53L205 0Q218 0 218 13L218.24 59L218 105Q218 118 205 118L109 118.57L13 118Q0 118 0 105L0 12.51" class="uncertainty card"/>
    <text x="14" y="31" class="head gold-text">R · 电压表有多吵</text>
    <text x="14" y="60" class="body ink">测量标准差约 5 mV</text>
    <text x="14" y="84" class="body ink">填入的是方差，不是标准差</text>
    <text x="14" y="106" class="small muted">2.5e−5 V²</text>
  </g>

  <path d="M17.31 104Q18 86 36 86L133 85.56L230 86Q248 86 248 104L248.71 285L248 466Q248 484 230 484L133 483.28L36 484Q18 484 18 466L18 103.59" class="bms-glow-model" aria-hidden="true" opacity="0" style="opacity: 0;"/>
