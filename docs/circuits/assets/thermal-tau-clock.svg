<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="一阶热模型指数升温动画：曲线按 τ 节拍生长，一个 τ 走完 63.2%，两个 τ 走完 86.5%，三个 τ 走完 95.0%，稳态 31.1 摄氏度">
  <title>τ 节拍：每过一个 τ 走完剩余差距的 63.2%</title>
  <desc>固定净生热下，电芯温度按指数接近稳态 31.1 摄氏度：一个 τ 即 120 秒走完剩余差距的 63.2%，两个 τ 即 240 秒走完 86.5%，三个 τ 即 360 秒走完 95.0%。动画按这三个节拍分段画出升温曲线，游点在曲线上前行；断电降温走同一条指数，只是方向朝下。</desc>
  <style>
    .bg { fill: #fffdf5; }
    .ink { fill: #293b3a; }
    .muted { fill: #626d65; }
    .axis { stroke: #626d65; stroke-width: 1.5; }
    .grid { stroke: #cfc6b2; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .curve { fill: none; stroke: #377b60; stroke-width: 3; stroke-linecap: round; }
    .asym { stroke: #968d77; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .tick { fill: #b84745; }
    .ticktext { font: 700 12px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #b84745; }
    .title { font-size: 17px; font-weight: 700; font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #293b3a; }
    .body { font: 13px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #626d65; }
    .small { font: 12px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #626d65; }
    .flow-dot { fill: #b84745; }
    .sketch { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #192727; }
      .ink { fill: #edf0e5; }
      .muted { fill: #b0beb3; }
      .axis { stroke: #b0beb3; }
      .grid { stroke: #496160; }
      .curve { stroke: #8fc7a2; }
      .asym { stroke: #8a8266; }
      .ticktext { fill: #f39b91; }
      .title { fill: #edf0e5; }
      .flow-dot { fill: #f39b91; }
    }
  </style>
  <style id="bms-motion">
    /* bms-motion: τ 三节拍生长（分段描线 + 节拍游点），叠加装饰，不动坐标与数字 */
    .bms-marker { fill: #fbefc7; opacity: .78; }
    .bms-under { fill: none; stroke: #926717; stroke-width: 2.4; stroke-linecap: round; opacity: .9; }
    .bms-spark-fill { fill: #926717; }
    .bms-sticker { fill: none; stroke: #926717; stroke-width: 2; stroke-dasharray: 7 5; stroke-linecap: round; opacity: .85; }
    .bms-halo { fill: none; stroke: #b84745; stroke-width: 2.4; }
    @media (prefers-color-scheme: dark) {
      .bms-marker { fill: #453e2b; }
      .bms-under { stroke: #dfbd78; }
      .bms-spark-fill { fill: #dfbd78; }
      .bms-sticker { stroke: #dfbd78; }
      .bms-halo { stroke: #f39b91; }
      circle:has(> animateMotion) { filter: drop-shadow(0 0 2px rgba(223,189,120,.8)) drop-shadow(0 0 7px rgba(223,189,120,.9)); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bms-doodle { display: none; }
      .bms-halo { display: none; }
    }
  </style>
  <rect class="bg" width="800" height="420"/>
  <rect class="bms-marker" aria-hidden="true" x="20" y="15.2" width="392" height="18.4" rx="3.8" transform="rotate(-.5 20 24.5)"/>
  <path d="M24 37 C118 31 214 42 306 34" class="sketch" stroke="#176b73" stroke-width="3" opacity=".8"/>
  <text class="title" x="20" y="31">升温走指数：每过一个 τ，走完剩余差距的 63.2%</text>

  <g class="bms-doodle" aria-hidden="true" transform="translate(600.0 26.0)"><animateTransform attributeName="transform" type="rotate" values="5;-4;5" keyTimes="0;0.5;1" dur="6.0s" repeatCount="indefinite" additive="sum"/><animate attributeName="opacity" values="0.62;1;0.62" keyTimes="0;0.5;1" dur="3.8s" repeatCount="indefinite"/><path class="bms-spark-fill" d="M0 -7 L1.9 -1.9 L7 0 L1.9 1.9 L0 7 L-1.9 1.9 L-7 0 L-1.9 -1.9 Z"/></g>

  <!-- 坐标轴 -->
  <line class="axis" x1="66" y1="336" x2="756" y2="336"/>
  <line class="axis" x1="84" y1="250" x2="84" y2="348"/>
  <text class="small" x="46" y="340" text-anchor="end">25 °C</text>
  <text class="small" x="46" y="282" text-anchor="end">31.1</text>

