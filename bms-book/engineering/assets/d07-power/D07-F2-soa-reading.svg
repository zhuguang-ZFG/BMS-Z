<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" aria-label="SOA 分层读图">
<title>SOA 分层读图</title>
<desc>60 V 处按脉冲宽度分层的允许电流与两个读表练习点</desc>
<style>
  .bg { fill: #f6f1e3; }
  .title { fill: #003153; font: 700 20px 'KaiTi','STKaiti','Noto Serif SC',serif; }
  .sub { fill: #5c6d73; font: 13px 'Noto Sans SC','Microsoft YaHei',sans-serif; }
  .lbl { fill: #4d5d63; font: 13px 'Noto Sans SC','Microsoft YaHei',sans-serif; }
  .small { fill: #4d5d63; font: 12px 'Noto Sans SC','Microsoft YaHei',sans-serif; }
  .value { fill: #003153; font: 700 18px 'Noto Sans SC','Microsoft YaHei',sans-serif; }
  .sym { fill: #003153; font: 700 19px 'KaiTi','STKaiti','Noto Serif SC',serif; }
  .wire { stroke: #003153; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .body { stroke: #a3322a; stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-dasharray: 7 5; }
  .channel { stroke: #176b64; stroke-width: 2.6; fill: none; stroke-linecap: round; }
  .box { fill: #fbf8f1; stroke: #003153; stroke-width: 2; rx: 8; }
  .soa-line { stroke: #003153; stroke-width: 2.4; fill: none; }
  .soa-pt { fill: #176b64; }
  .soa-bad { fill: #a3322a; }
  .axis { stroke: #5c6d73; stroke-width: 1.3; }
  .lane { stroke: #d9cfba; stroke-width: 0.9; }
  .bar { stroke: #003153; stroke-width: 2; }
  .hyst { stroke: #8a5019; stroke-width: 2.4; fill: none; }
  .halo { paint-order: stroke; stroke: #f6f1e3; stroke-width: 4; stroke-linejoin: round; }
</style>
<rect class="bg" x="0" y="0" width="800" height="430"/>
<text class="title" x="40.0" y="40.0" text-anchor="start">图 D07-F2　SOA 按脉冲宽度分层读</text>
<text class="sub" x="40.0" y="64.0" text-anchor="start">同一 Vds 下允许电流随脉宽分层：10 ms 行 30 A，100 ms 行 15 A（教学替身表）</text>
<line class="axis" x1="90" y1="340" x2="740" y2="340"/>
<line class="axis" x1="90" y1="100" x2="90" y2="340"/>
<polyline class="soa-line" points="238.6,101.0 275.7,165.5 368.6,209.1 647.1,252.7"/>
<circle class="soa-pt" cx="238.6" cy="101.0" r="5"/>
<text class="small" x="248.6" y="105.0" text-anchor="start">DC：8 A</text>
<circle class="soa-pt" cx="275.7" cy="165.5" r="5"/>
<text class="small" x="285.7" y="169.5" text-anchor="start">1 s：10 A</text>
<circle class="soa-pt" cx="368.6" cy="209.1" r="5"/>
<text class="small" x="378.6" y="213.1" text-anchor="start">100 ms：15 A</text>
<circle class="soa-pt" cx="647.1" cy="252.7" r="5"/>
<text class="small" x="657.1" y="256.7" text-anchor="start">10 ms：30 A</text>
<text class="small" x="461.4" y="238.7" text-anchor="start">● 20 A / 10 ms ✓</text>
<circle class="soa-pt" cx="461.4" cy="252.7" r="6"/>
<circle class="soa-bad" cx="461.4" cy="209.1" r="6"/>
<text class="small" x="471.4" y="225.1" text-anchor="start">● 20 A / 100 ms ✗（超 15 A）</text>
<text class="lbl" x="90.0" y="380.0" text-anchor="start">纪律：先定脉宽，再对电流；把 10 ms 的许可当 100 ms 用是头号误用</text>
</svg>
