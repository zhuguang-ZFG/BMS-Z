changes:
- id: ch11-mirror-three-errors
  source: docs/p2-01-ch11.md#11.3
  before: '**原理**：两管 $V_{BE}$ 相同（物理并联）、工艺匹配 → $I_C$ 相同。**电流被"复印"了**。误差来源：基极电流分走一份（β 越大越准）、Early 效应（输出管 $V_{CE}$ 变化时复制电流略变 → Wilson 镜改进）。'
  after: Wilson镜通过局部反馈改善某些基流误差和输出电阻；cascode镜稳定内部节点电压。两者都要重新预算电压余量、启动、频率响应与失配，不能称之为消除了所有误差。精密镜像常加入发射极退化并使用热耦合，代价是额外压降和噪声。
  caption: 电流镜三项误差账。示意条件见图与正文，器件保证须另查手册。
  removed_prose_chars: 2
  relationship: replaces-text
- id: ch11-phase-margin-table
  source: docs/p2-01-ch11.md#11.5
  before: '**二阶系统的 ζ ↔ PM ↔ 过冲**（运放闭环最常用的一张换算表）：PM = 45° ↔ ζ ≈ 0.42 ↔ 过冲 ≈ 23%；PM = 60° ↔ ζ ≈ 0.59 ↔ 过冲 ≈ 10%；PM = 65° ↔ ζ ≈ 0.71（Butterworth）↔ 过冲 ≈ 4%。**"相位裕度 60°"之所以成为设计目标，就是它把过冲压到 10% 附近、又不牺牲太多带宽。**'
  after: 在上述模型中，PM=45° 对应 ζ≈0.420、过冲≈23.32%；60° 对应 ζ≈0.612、过冲≈8.77%；65° 对应 ζ≈0.697、过冲≈4.72%。Butterworth 的 ζ=1/√2 对应 PM≈65.53°。常以约 60° 为设计起点，是在响应速度与阻尼间折中，不是“所有运放 60° 就有 10% 过冲”的保证。
  caption: 指定二阶环路的阻尼换算。示意条件见图与正文，器件保证须另查手册。
  removed_prose_chars: -1
  relationship: replaces-text
- id: ch11-miller-bandwidth
  source: docs/p2-01-ch11.md#11.5
  before: '**算一笔**：信号源内阻 $R_{sig}=10k\Omega$，$C_{bc}=10pF$，增益 $A=100$ → $C_{eff}\approx 1.01nF$。它与 $R_{sig}$ 形成低通：$f_H = \frac{1}{2\pi R_{sig}C_{eff}} = \frac{1}{2\pi\times10^4\times1.01\times10^{-9}} \approx 15.8kHz$。你以为这级能放到 MHz？16kHz 就开始滚降。**米勒效应是高频增益的第一杀手**。'
  after: 若**有效驱动电阻**为 10 kΩ，且忽略其余电容，输入极点约 $1/(2\pi\times10\,k\Omega\times1.01\,nF)=15.76\,kHz$。有效电阻应包含源阻与输入偏置、$r_\pi$ 等支路的并联；$C_\pi$ 还要加进电容预算。高频时 $A_v(s)$ 已带幅相变化，严格米勒等效为 $C[1-A_v(s)]$ 对应的阻抗关系，不能始终当固定大电容。
  caption: 米勒电荷与频率定义。示意条件见图与正文，器件保证须另查手册。
  removed_prose_chars: 50
  relationship: replaces-text
- id: ch11-noise-identify
  source: docs/p2-01-ch11.md#11.6
  before: '**三类噪声，现场怎么认**：先对症状，再用频谱和工况核账。


    - **宽带"嘶——"**：常见于热噪声等白噪声，不能凭听感把它归给 1/f。先确认所需信号带宽，再看是哪一项在预算里占大头。

    - **低频起伏、慢慢漂**：检查 1/f 段，也排查温漂与干扰。比较实际器件的 $e_n(f)$、$i_n(f)$ 和源阻抗；斩波/自稳零可以减轻低频噪声与失调，但也要核对开关纹波、带宽和输入电流效应。

    - **50 Hz 及其谐波的"合唱"**：优先排查地环路、电源纹波和空间耦合。先查屏蔽、接地与 PSRR（见 [11.9](p2-01-ch11.md#sec-11-9)），别急着换管子。

    - **随偏置电流变**：散粒电流噪声可能是其中一项，但跨导、增益和输入参考电压噪声也会变。降偏置之前，连同带宽、稳定性、失真和驱动能力重算。

    - **随源阻变**：既可能是热噪声 $\propto\sqrt R$，也可能是输入电流噪声经 $Z_s(f)$ 转成电压。并电阻会加载信号源；账本不能只记噪声下降、不记信号损失。


    一句话：白噪看带宽与各项来源，1/f 看实际频谱与工况，工频看接地与电源。**先把信号和噪声放在同一测量条件下，再决定动哪只旋钮。**'
  after: 低频起伏可能包含 1/f、温漂和外部干扰；50 Hz 工频尖峰先查接地、屏蔽和电源耦合。斩波或自稳零可缓解部分低频问题，却要检查开关纹波、输入电流与信号带宽。电阻热噪声随 $\sqrt T$ 变化，制冷同时改变工作点和其他误差，不能只算这一项收益。
  caption: 噪声症状与核验路径。示意条件见图与正文，器件保证须另查手册。
  removed_prose_chars: 381
  relationship: replaces-text
- id: ch11-diffpair-four-beats
  source: docs/p2-01-ch11.md#11.7
  before: '**算一笔**：$I_{tail}=1mA$、$R_C=10k\Omega$、$r_e=26mV/I_C=52\Omega$（$I_C=0.5mA$）。差模增益 $A_{dm}=R_C/(2r_e)=10k/104\approx\mathbf{96}$（约 40dB，单端输出）；共模增益 $A_{cm}\approx R_C/(2R_{tail})$，若 $R_{tail}=1M\Omega$ → $A_{cm}\approx0.005$ → $CMRR=20\log(96/0.005)\approx\mathbf{86dB}$。**把 $R_{tail}$ 提到 10MΩ，CMRR 就再涨 20dB**。运放第一级宁可用电流镜做尾（等效 $R_{tail}$ 达数十 MΩ），也不肯用一只电阻。'
  after: 在零差模附近，单管 gm=0.5 mA/26 mV≈19.23 mS，单端差模增益 $A_{d,se}=-g_mR_C/2\approx-96.15$，差分增益 $A_{d,diff}=+g_mR_C\approx192.31$。对称小信号差模使公共发射极节点近似交流静止，因此尾阻对该一阶差模增益影响很小。有限幅度下，该节点存在二阶变化，并非任何输入下都绝对不动。
  caption: 差分对的守恒与非线性。示意条件见图与正文，器件保证须另查手册。
  removed_prose_chars: 158
  relationship: replaces-text
- id: ch11-noise-three-taxes
  source: docs/p2-01-ch11.md#11.10
  before: 分别从上述基准改变一项，并假定**同一参考点的信号仍为 1 mVrms，所需信号未被滤掉或加载衰减，温度及其余条件不变**：等效噪声带宽压到 10 kHz，噪声按 $\sqrt{1/100}$ 降到 1.29 µV，SNR 提高 20 dB 到 57.8 dB；源阻降到 1 kΩ（$BW_n$ 仍为 1 MHz），噪声降到 4.07 µV，SNR 提高 10 dB 到 47.8 dB。
  after: 算一笔SNR。300K、10kΩ源、高阻读出、只计源热噪声，Bn=1MHz，输入信号保持1mVrms。噪声约12.87µVrms，SNR≈37.81dB。若所需信号均保留，把Bn降到10kHz得约1.287µVrms、57.81dB；另从原基准把源阻降到1kΩ，得约4.070µVrms、47.81dB。这是两种各自只改一项的比较，不是同时修改后的结果。
  caption: 同一信号口径下的噪声预算。示意条件见图与正文，器件保证须另查手册。
  removed_prose_chars: -10
  relationship: replaces-text
- id: ch11-two-stage-margin
  source: docs/p2-01-ch11.md#11.11
  before: '**算一笔**：表里最薄的是那 +0.3 dB——薄到什么程度？拿 β 做个压力测试：批次或低温让 β 从 200 掉到 100（datasheet 里完全合法的漂移），$r_{\pi1}$ 从 13.0 kΩ 缩到 6.5 kΩ，$R_{in}=6.5\text{ k}\parallel110\text{ k}\approx6.1\text{ k}\Omega$——**输入电阻先破**；同时 $r_{\pi2}$ 缩到 2.6 kΩ，把 $R_{L1}$ 拖到约 1.76 kΩ，$A_{v1}$ 只剩约 $-27$，总增益 $27\times26\times0.97\approx681$，即 56.7 dB——**增益也破**。一个 β 漂移，两项指标同时沉没。它不要求你重算整个表，只要求你知道：+0.3 dB 的余量在纸面上叫达标，在批产里叫赌运气。真正的改法早已写在第五步里——cascode，或者重新分配增益。'
  after: β改变时必须重新求DC，而不只是改rπ。本例β=100得输入电阻约8.76kΩ，失败；β=300得约17.16kΩ，而截止降到约110.1kHz。更高β不等于全部指标更好。这里的共同β扫描只揭示敏感性，尚未覆盖各管独立散差、温度、实际结电容、偏置源和容性负载，所以不能凭标称通过就宣布制造验收
  caption: 原候选与修订候选的预算。示意条件见图与正文，器件保证须另查手册。
  removed_prose_chars: 232
  relationship: replaces-text
- id: ch11-topology-ports
  source: docs/p2-01-ch11.md#11.1
  before: '**射随器为什么"射极跟随"**：$V_E = V_B - 0.7V$。基极动多少，发射极跟着动多少，只差一个死板的 0.7V。看起来"没放大"？它放大的是**电流**（β 倍）：信号源只出 $I_B$，负载拿走 $I_E=(1+\beta)I_B$。'
  after: 共集从基极输入、发射极输出。$VE=VB-V{BE}$，但$V{BE}$随电流和温度变化，不能当固定0.7V。电流关系是$IE=(\beta+1)IB$；电压增益略小于一。高输入阻抗、低输出阻抗要在给定源阻、静态电流和负载下核算，尤其不能由低小信号输出电阻直接推断大信号驱动能力。
  caption: 三种组态的端口条件。示意条件见图与正文，器件保证须另查手册。
  removed_prose_chars: -22
  relationship: replaces-text
- id: ch11-diff-steer-v2
  source: docs/p2-01-ch11.md#11.2
  before: '> **精髓**：差分对是"只认差、不认同"的减法器。共模抑制比 CMRR 的全部秘密，就是那只**长尾电流源的内阻**：内阻越大，共模越动弹不得。所以 IC 里用电流镜做"有源尾巴"。温度漂移之所以被抑制：温度让两管的 $V_{BE}$ **同向**漂移，是共模信号，被差分结构天然免疫。'
  after: 理想共模变化只移动共同发射极电位，两个集电流和集电极电压均不变。有限尾阻会使电流同步变化；管子、负载和源阻抗失配又可能把它转换成差分输出。两管共同温漂可部分抵消，但温差、失调漂移、跨导变化和偏置漂移仍在，不能称为“天然免疫”。后文 11.7 用同一组参数检查线性误差，11.9 则固定输出定义计算 CMRR。
  caption: 差分电压重新分配同一份尾电流。示意匹配 BJT，集电流和 1 mA，VT=26 mV；忽略基流与 Early 效应。
  removed_prose_chars: -12
  relationship: replaces-text
- id: ch11-crossover-v2
  source: docs/p2-01-ch11.md#11.4
  before: '**甲乙类解法**：两个基极之间塞两只二极管（或 $V_{BE}$ 倍增器），给两管预加"将开未开"的微偏置 → 死区消失。**几乎所有分立音频功放输出级都是该结构**；热隐患：偏置管要贴着功率管安装做热耦合，否则热失控。'
  after: 甲乙类在两基极之间加入二极管链或$V{BE}$倍增器，使两支路在过零附近保持少量电流。偏置不足会留下交越失真，过大则增加静态功耗，严重时热失控。实际导通是连续的指数关系，不存在适用于全部器件和温度的“±0.7V硬死区”；动画中1.3V恰好填平，仅是所选恒压降模型的结果。
  caption: 预偏置逐渐缩小理想推挽死区。示意固定 VBE=0.65 V、输入峰值 1 V；恒压降模型不计算静态电流。
  removed_prose_chars: -28
  relationship: replaces-text
- id: ch11-pole-split-v2
  source: docs/p2-01-ch11.md#11.5
  before: '**算一笔**：$g_{m1}=100\mu S$、$C_c=10pF$ → $\text{GBW}=g_{m1}/(2\pi C_c)=1.59MHz$。要 PM ≈ 60°，经验要求次极点 $\omega_{p2}''\gtrsim 2.2\times\text{GBW}\approx3.5MHz$；若实际只有 2MHz，次极点太近 → 过冲明显。补救：在 $C_c$ 上串一只**消零电阻** $R_z\approx1/g_{m2}$，把密勒电容引入的**右半平面零点**挪到左半平面。该零点（RHP zero）会额外吃相位，挪过去甚至能反过来抵消极点。几乎所有运放 datasheet 里的"补偿引脚"，背后就是它。'
  after: 此单向跨导模型还引入 $\omega_z=g_{m2}/C_c$ 的右半平面零点，不能只看极点分开就宣布稳定。若 gm1=100 µS、Cc=10 pF，且主极点近似适用，单位增益频率约 $g_{m1}/(2\pi C_c)=1.59\,MHz$；它已高于该例 855 kHz 次极点，需要完整环路检查。若忽略零点、采用积分器加一个次极点，要求 PM=60° 对应 $f_{p2}\approx\sqrt3 f_c$；工程上取更大比例是留余量，不能把 rad/s 与 MHz 相乘比较。
  caption: 补偿电容改变两个极点的位置。示意 R1=R2=100 kΩ、C1=10 pF、C2=100 pF、gm2=1 mS。
  removed_prose_chars: 69
  relationship: replaces-text
- id: ch11-active-load-v2
  source: docs/p2-01-ch11.md#11.8
  before: '**有源负载**：用电流镜替换共射级的 $R_C$，等效阻抗趋近无穷大 → 单级增益从几百飙到上万。**这是运放高增益（>100dB）的第一功臣**。'
  after: 有源负载把大信号工作电压与小信号斜率分开处理。输出上摆受上方负载管的工作区限制，下摆受下方放大管限制；MOS 常用过驱动电压作长沟道近似，BJT 要避免饱和并保留所需线性余量，不能一概写成 0.3–0.5 V。两管同时引入噪声、寄生电容和温漂，增益提高不表示其他预算自动改善。
  caption: 有源负载的高增益仍会被后级分流。示意 gm=40 mS、两管 ro 各 50 kΩ；电阻方案 Rc=2.2 kΩ。
  removed_prose_chars: -62
  relationship: replaces-text
- id: ch11-cascode-resistance-v2
  source: docs/p2-01-ch11.md#11.8
  before: 反过来说，**低电源、大摆幅、低噪声前端**这三件事与 cascode 天生不合。它省不了电压，输出摆幅更小，噪声也比单管高：共基管不放大信号，却照样贡献噪声。选拓扑时先看这三条红线，再谈增益数字。
  after: 折叠cascode把信号电流转到另一支路，方便安排输入共模与输出电平；功耗、噪声、共模范围和电压堆叠取决于具体实现，不能笼统说它一定低压或一定低噪声。若源阻抗或输入rπ已经限制信号，增加cascode不会自动解决该加载问题。
  caption: BJT 的有限 β 会限制叠管增阻。示意两管 ro=100 kΩ、上管 gm=40 mS；基极理想交流接地。
  removed_prose_chars: -15
  relationship: replaces-text
- id: ch11-psrr-ripple-v2
  source: docs/p2-01-ch11.md#11.9
  before: 读这张图先左后右。左边：50 Hz 共模让 $v_{i1}$、$v_{i2}$ 同升同降，长尾电流源 $R_{tail}=1\text{ M}\Omega$ 把总量锁死，只有尾阻有限、负载失配、管子失配三条漏路放出零头——增益账上差模 ×200、共模 ×0.01，比值就是 86 dB；尾巴一旦软到 100 kΩ，共模增益跟着涨到 0.1，墙立刻矮 20 dB 到 66 dB，这正是例 11-2 算过的那笔账。右边：100 kHz 开关纹波 100 mV 砸在 PSRR 墙上，漏进等效输入只剩 0.1 mV，对应 60 dB；可墙的高度随频率缩水，从 DC 附近的 80~100 dB 掉到 40~60 dB。所以查 datasheet 先问一句：这个 dB 是在哪个频率、什么条件下量的。
  after: 图中人为规定 1 kHz 以下 80 dB、之后每十倍频降 20 dB，只展示为何要读随频率变化的曲线。真实器件的正负电源路径、负载和补偿不同，未必具有同样平台或斜率；验收开关电源纹波时必须在纹波基频和谐波处取值。
  caption: 同样的纹波，抑制比随频率变化。示意电源纹波 100 mVrms；PSRR 在 1 kHz 前 80 dB，随后每十倍频降 20 dB。
  removed_prose_chars: 204
  relationship: replaces-text
- id: ch11-cascade-loading-v2
  source: docs/p2-01-ch11.md#11.11
  before: '**第四步：射随输出级**。取 $R_E=1\text{ k}\Omega$，射随器源电阻约 $R_{C2}\parallel r_{o2}=676\ \Omega$：'
  after: 大信号问题更直接：±1V/100Ω需要±10mA，1mA静态射随不能维持整个周期的放大区。小信号Rout≈几十欧并不代表它能提供任意电流。原来两只220kΩ分压给第一级设出的6V开路基极电压，也没有与发射极电阻和目标IC闭合，不能在最后才说“偏置以后补齐”。
  caption: 输出负载会逐级传回增益预算。原候选：β=200、IC1=0.4 mA、IC2=IC3=1 mA，RE3=1 kΩ。
  removed_prose_chars: -50
  relationship: replaces-text
