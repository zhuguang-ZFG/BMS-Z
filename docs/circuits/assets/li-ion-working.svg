<svg xmlns="http://www.w3.org/2000/svg" width="800" height="526" viewBox="0 0 800 526" role="img" aria-label="锂电池充放电：离子与电子分头走" aria-describedby="li-ion-desc" font-family="ui-monospace, Consolas, monospace">
  <title>锂电池充放电：离子与电子分头走</title>
  <desc id="li-ion-desc">充电时两种粒子从正极一侧移向负极一侧，放电时反向。锂离子走电解液并穿过隔膜，电子经充电器或负载走外电路。粒子数量、速度和时间仅为示意。</desc>
  <style>
    .bg { fill: #fffdf5; }
    .panel { fill: #f7f2e5; stroke: #cfc6b2; }
    .pos-note { fill: #fbefc7; }
    .neg-note { fill: #eee6d5; }
    .liquid { fill: #e4f0df; }
    .ink { fill: #293b3a; }
    .muted { fill: #626d65; }
    .title { fill: #293b3a; font-size: 18px; font-weight: bold; }
    .ion-ink { fill: #176b73; }
    .electron-ink { fill: #926717; }
    .ion-line { stroke: #176b73; }
    .electron-line { stroke: #926717; }
    .neutral-line { stroke: #626d65; }
    .note-line { stroke: #cfc6b2; }
    .particle { stroke: #fffdf5; stroke-width: 1.5; }
    #li-ion-diagram .particle { filter: none; }
    .still-view { display: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #192727; }
      .panel { fill: #223333; stroke: #496160; }
      .pos-note { fill: #453e2b; }
      .neg-note { fill: #2c4040; }
      .liquid { fill: #293f35; }
      .ink, .title { fill: #edf0e5; }
      .muted { fill: #b0beb3; }
      .ion-ink { fill: #7ec5c5; }
      .electron-ink { fill: #dfbd78; }
      .ion-line { stroke: #7ec5c5; }
      .electron-line { stroke: #dfbd78; }
      .neutral-line { stroke: #b0beb3; }
      .note-line { stroke: #496160; }
      .particle { stroke: #192727; }
    }
    @media (prefers-reduced-motion: reduce) {
      .motion-view { display: none; }
      .still-view { display: inline; }
    }
  </style><style id="bms-motion">
    /* bms-motion: 手帐式动效注记（纯装饰，不改技术几何与既有 SMIL 时序） */
    .bms-marker { fill: #fbefc7; opacity: .78; }
    .bms-under { fill: none; stroke: #926717; stroke-width: 2.4; stroke-linecap: round; opacity: .9; }
    .bms-spark-line { fill: none; stroke: #926717; stroke-width: 1.9; stroke-linecap: round; }
    .bms-spark-fill { fill: #926717; }
    .bms-spark-soft { fill: #176b73; opacity: .8; }
    .bms-sticker { fill: none; stroke: #926717; stroke-width: 2; stroke-dasharray: 7 5; stroke-linecap: round; opacity: .85; }
    .bms-halo { fill: none; stroke: #926717; stroke-width: 2; }
    .bms-marker, .bms-under, .bms-sticker, .bms-halo,
    .bms-spark, .bms-success, .bms-doodle { pointer-events: none; }
    circle:has(> animateMotion) { filter: drop-shadow(0 0 2px rgba(146,103,23,.5)) drop-shadow(0 0 5px rgba(196,145,52,.45)); }
    rect:has(> animateMotion) { filter: drop-shadow(0 0 3px rgba(196,145,52,.75)); }
    g:has(> circle):has(> path.stroke-check) { filter: drop-shadow(0 0 5px rgba(55,123,96,.5)); }
    @media (prefers-color-scheme: dark) {
      .bms-marker { fill: #453e2b; opacity: .85; }
      .bms-under { stroke: #dfbd78; }
      .bms-spark-line { stroke: #dfbd78; }
      .bms-spark-fill { fill: #dfbd78; }
      .bms-spark-soft { fill: #7ec5c5; }
      .bms-sticker { stroke: #dfbd78; }
      .bms-halo { stroke: #dfbd78; }
      circle:has(> animateMotion) { filter: drop-shadow(0 0 2px rgba(223,189,120,.8)) drop-shadow(0 0 7px rgba(223,189,120,.9)); }
      rect:has(> animateMotion) { filter: drop-shadow(0 0 6px rgba(223,189,120,.8)); }
      g:has(> circle):has(> path.stroke-check) { filter: drop-shadow(0 0 6px rgba(143,199,162,.7)); }
    }
    @media (prefers-reduced-motion: reduce) { .bms-spark, .bms-success, .bms-doodle { display: none; } }
</style>
  <rect class="bg" width="800" height="526"/>
  <rect class="bms-marker" aria-hidden="true" x="18.0" y="19.3" width="176.0" height="19.4" rx="4.3" transform="rotate(-.5 18.0 29.0)"/><path class="bms-under" aria-hidden="true" d="M24.0 44.0 q 24.0 -2.4 48.0 0 t 48 0 t 48 0"/><text class="title" x="24" y="36">同一块电池，两条路</text>
  <text class="muted" x="24" y="64" font-size="14">先找隔膜，再看充电器换成负载时，哪两支箭头一起掉头。</text>

  <rect class="panel" x="24" y="82" width="368" height="76" rx="9"/>
  <rect class="panel" x="408" y="82" width="368" height="76" rx="9"/>
  <g class="ink">
    <text x="42" y="111" font-size="16" font-weight="bold">01 充电</text>
    <text x="42" y="139" font-size="14">正极 → 负极，Li⁺ 嵌进石墨</text>
    <text x="426" y="111" font-size="16" font-weight="bold">02 放电</text>
    <text x="426" y="139" font-size="14">负极 → 正极，外部负载得到能量</text>
  </g>

  <rect class="panel" x="24" y="174" width="752" height="281" rx="12"/>
  <g id="li-ion-diagram">
    <text class="electron-ink" x="40" y="202" font-size="14" font-weight="bold">e⁻ · 外电路 / 实线</text>
    <path class="electron-line" d="M150 300 V241 Q150 231 160 231 H640 Q650 231 650 241 V300" fill="none" stroke-width="2.6"/>
    <rect class="liquid" x="150" y="300" width="500" height="104" rx="8"/>
    <rect class="pos-note electron-line" x="95" y="290" width="110" height="124" rx="8" stroke-width="1.5"/>
    <rect class="neg-note neutral-line" x="595" y="290" width="110" height="124" rx="8" stroke-width="1.5"/>
    <path class="electron-line" d="M114 298 l-13 14 m28 -14 l-28 29 m43 -29 l-43 44 m43 -30 l-43 44 m43 -30 l-43 44"
          fill="none" opacity=".38" stroke-width="1" stroke-linecap="round"/>
    <path class="neutral-line" d="M657 311 h39 m-39 16 h37 m-36 16 h38 m-39 16 h36 m-35 16 h38"
          fill="none" opacity=".52" stroke-width="1.4" stroke-linecap="round"/>
    <text class="ink" x="150" y="399" text-anchor="middle" font-size="15" font-weight="bold">正极</text>
    <text class="ink" x="650" y="399" text-anchor="middle" font-size="15" font-weight="bold">负极</text>
    <path class="neutral-line" d="M400 307 V399" fill="none" stroke-width="1.8" stroke-dasharray="3 5"/>
    <text class="muted" x="400" y="287" text-anchor="middle" font-size="13">隔膜 · 只让离子通过</text>
    <path class="ion-line" d="M170 349 C298 337 502 361 630 349" fill="none" stroke-width="2.6" stroke-dasharray="8 6"/>
    <text class="ion-ink" x="400" y="436" text-anchor="middle" font-size="14" font-weight="bold">Li⁺ · 电解液 / 虚线</text>

    <!-- 标记、器件、方向、粒子和图说共享同一个相位组。 -->
    <g id="charge-phase" class="motion-view" opacity="1">
      <animate attributeName="opacity" calcMode="discrete" values="1;0;0" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite"/>
      <path class="ion-line" d="M42 120 Q74 118 111 120" fill="none" stroke-width="2.3" stroke-linecap="round"/>
      <path class="ion-line" d="M530 345 l9 6 -9 6" fill="none" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="electron-line" d="M540 225 l9 6 -9 6" fill="none" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle class="particle ion-ink" r="7">
        <animateMotion calcMode="linear" data-ease="linear" dur="2.1s" begin="0s" repeatCount="indefinite" path="M170 349 C298 337 502 361 630 349"/>
      </circle>
      <circle class="particle ion-ink" r="7">
        <animateMotion calcMode="linear" data-ease="linear" dur="2.1s" begin="-1.05s" repeatCount="indefinite" path="M170 349 C298 337 502 361 630 349"/>
      </circle>
      <rect class="particle electron-ink" x="-4.5" y="-4.5" width="9" height="9" rx="1.5">
        <animateMotion calcMode="linear" data-ease="linear" dur="2.6s" begin="-0.3s" repeatCount="indefinite" path="M150 300 V241 Q150 231 160 231 H640 Q650 231 650 241 V300"/>
      </rect>
      <rect class="particle electron-ink" x="-4.5" y="-4.5" width="9" height="9" rx="1.5">
        <animateMotion calcMode="linear" data-ease="linear" dur="2.6s" begin="-1.6s" repeatCount="indefinite" path="M150 300 V241 Q150 231 160 231 H640 Q650 231 650 241 V300"/>
      </rect>
      <rect class="bg note-line" x="334" y="211" width="132" height="40" rx="9"/>
      <text class="ink" x="400" y="236" text-anchor="middle" font-size="16" font-weight="bold">充电器</text>
      <text class="ink" x="24" y="485" font-size="15">充电时，Li⁺ 向右进入负极；e⁻ 绕外电路，也到负极。</text>
    </g>
    <g id="discharge-phase" class="motion-view" opacity="0">
      <animate attributeName="opacity" calcMode="discrete" values="0;1;1" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite"/>
      <path class="electron-line" d="M426 120 Q458 118 495 120" fill="none" stroke-width="2.3" stroke-linecap="round"/>
      <path class="ion-line" d="M270 341 l-9 6 9 6" fill="none" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="electron-line" d="M260 225 l-9 6 9 6" fill="none" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle class="particle ion-ink" r="7">
        <animateMotion calcMode="linear" data-ease="linear" dur="2.1s" begin="0s" repeatCount="indefinite" path="M630 349 C502 361 298 337 170 349"/>
      </circle>
      <circle class="particle ion-ink" r="7">
        <animateMotion calcMode="linear" data-ease="linear" dur="2.1s" begin="-1.05s" repeatCount="indefinite" path="M630 349 C502 361 298 337 170 349"/>
      </circle>
      <rect class="particle electron-ink" x="-4.5" y="-4.5" width="9" height="9" rx="1.5">
        <animateMotion calcMode="linear" data-ease="linear" dur="2.6s" begin="-0.3s" repeatCount="indefinite" path="M650 300 V241 Q650 231 640 231 H160 Q150 231 150 241 V300"/>
      </rect>
      <rect class="particle electron-ink" x="-4.5" y="-4.5" width="9" height="9" rx="1.5">
        <animateMotion calcMode="linear" data-ease="linear" dur="2.6s" begin="-1.6s" repeatCount="indefinite" path="M650 300 V241 Q650 231 640 231 H160 Q150 231 150 241 V300"/>
      </rect>
      <rect class="bg note-line" x="334" y="211" width="132" height="40" rx="9"/>
      <text class="ink" x="400" y="236" text-anchor="middle" font-size="16" font-weight="bold">负载</text>
      <text class="ink" x="24" y="485" font-size="15">放电时，两者向左回正极；只有 e⁻ 经过外部负载。</text>
    </g>
    <g class="still-view">
      <rect class="bg note-line" x="334" y="211" width="132" height="40" rx="9"/>
      <text class="ink" x="400" y="236" text-anchor="middle" font-size="15" font-weight="bold">充电器 / 负载</text>
      <text class="ink" x="24" y="485" font-size="15">充电从左到右、放电从右到左；Li⁺ 在电池内，e⁻ 在外电路。</text>
    </g>
  </g>
  <text class="muted" x="24" y="508" font-size="12">箭头表示粒子迁移方向；粒子数量、速度与阶段用时均为示意。</text>
</svg>
