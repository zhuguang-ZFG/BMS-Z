  <polyline class="liner" points="92.0,400.0 99.8,398.0 107.7,396.0 115.5,394.0 123.4,392.0 131.2,390.0 139.1,388.0 146.9,386.1 154.8,384.1 162.7,382.1 170.5,380.1 178.4,378.1 186.2,376.1 194.1,374.1 201.9,372.1 209.8,370.1 217.6,368.1 225.4,366.1 233.3,364.1 241.2,362.1 249.0,360.1 256.9,358.1 264.7,356.2 272.5,354.2 280.4,352.2 288.2,350.2 296.1,348.2 304.0,346.2 311.8,344.2 319.6,342.2 327.5,340.2 335.4,338.2 343.2,336.2 351.1,334.2 358.9,332.2 366.8,330.2 374.6,328.3 382.4,326.3 390.3,324.3 398.1,322.3 406.0,320.3 413.8,318.3 421.7,316.3 429.6,314.3 437.4,312.3 445.2,310.3 453.1,308.3 460.9,306.3 468.8,304.3 476.7,302.4 484.5,300.4 492.3,298.4 500.2,296.4 508.1,294.4 515.9,292.4 523.8,290.4 531.6,288.4 539.5,286.4 547.3,284.4 555.2,282.4 563.0,280.4 570.8,278.4 578.7,276.4 586.5,274.4 594.4,272.5 602.2,270.5 610.1,268.5 618.0,266.5 625.8,264.5 633.6,262.5 641.5,260.5 649.4,258.5 657.2,256.5 665.0,254.5 672.9,252.5 680.8,250.5 688.6,248.5 696.5,246.6 704.3,244.6 712.1,242.6 720.0,240.6" stroke-linejoin="round" stroke-linecap="round"/>
  <text class="hi" x="180" y="250">SEI：5+2√N</text>
  <text class="warn" x="430" y="250">析锂当量：0.15×N</text>
  <circle class="doty" r="6"><animate attributeName="cx" values="92.0;144.3;196.7;249.0;301.3;353.7;406.0;458.3;510.7;563.0;615.3;667.7;720.0" keyTimes="0;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="386.7;356.1;343.3;333.6;325.4;318.1;311.6;305.5;299.9;294.7;289.7;285.0;280.4" keyTimes="0;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1" dur="12s" repeatCount="indefinite"/></circle>
  <text class="small" x="24" y="478">5 nm、2 nm/√圈、0.15 nm/圈都是教学示意，不是某一颗电芯的膜厚。低温大电流充电会析锂，允许电流只看规格书。</text>
</svg>
