<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">压摆斜坡与指数尾部必须连续交接</title>
<desc id="figDesc">示意：1 V 阶跃；一阶闭环极点 1 MHz、SR 0.5 V/µs，不含过冲。</desc>
<metadata id="visual-timeline">{&quot;duration&quot;: 12, &quot;beats&quot;: [{&quot;name&quot;: &quot;条件&quot;, &quot;start&quot;: 0, &quot;end&quot;: 3, &quot;caption&quot;: &quot;只受线性带宽限制：0.1% 建立约 1.099 µs。&quot;}, {&quot;name&quot;: &quot;变化&quot;, &quot;start&quot;: 3, &quot;end&quot;: 6, &quot;caption&quot;: &quot;大阶跃先以 0.5 V/µs 斜率上升。&quot;}, {&quot;name&quot;: &quot;比较&quot;, &quot;start&quot;: 6, &quot;end&quot;: 9, &quot;caption&quot;: &quot;剩余误差达到 SRτ = 0.0796 V，约 1.841 µs 交接。&quot;}, {&quot;name&quot;: &quot;结论&quot;, &quot;start&quot;: 9, &quot;end&quot;: 12, &quot;caption&quot;: &quot;从交接点指数收尾，0.1% 建立约 2.537 µs。&quot;}]}</metadata>
