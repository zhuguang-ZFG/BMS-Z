<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 590" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>HVIL 时序示意：环在 0 断开，约 15 ms 下令开闸，约 30 ms 母线开始掉。去抖若到 500 ms，人可以先碰到端子。</title>
  <desc>三条阶梯在对数时间上先后落下。金点沿「母线仍满」走，红点相位提前半圈。底栏用示例毫秒说明这一拍谁已经动了。</desc>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; }
    .linek { stroke: #57606a; stroke-width: 2.2; fill: none; stroke-dasharray: 7 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .dotg { fill: #1a7f37; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .linek { stroke: #8b949e; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .dotg { fill: #3fb950; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
    }
  </style>
  <!-- formula: steps at 15 ms, 30 ms, 500 ms; log time from 1 ms to 1000 ms; illustrative, not a connector drawing -->
  <rect class="bg" width="800" height="590"/>
  <text class="title" x="24" y="32">环先断，闸再开，母线最后才开始掉（示意）</text>
  <rect class="panel" x="24" y="44" width="752" height="124" rx="6"/>
  <text class="txt" x="40" y="68" opacity="0.28">① 0 ms<tspan class="small">　信号针短，环先断。这是接插件的顺序，不是软件延时。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="92" opacity="0.28">② 约 15 ms<tspan class="small">　BMS 下令打开接触器。母线这一拍还在。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="116" opacity="0.28">③ 约 30 ms<tspan class="small">　母线开始掉。示例，不是某只插头的图纸。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="140" opacity="0.28">④ 500 ms<tspan class="small">　去抖拉到按键那么长，人可以先碰到还带包压的端子。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="180" width="752" height="268" rx="6"/>
  <text class="small" x="40" y="202">还停在原位 = 1（示意）</text>
  <text class="hi" x="200" y="218">蓝 开闸命令</text>
  <text class="ok" x="360" y="218">绿 母线仍满</text>
  <text class="warn" x="520" y="218">红 慢去抖</text>
  <line class="axis" x1="108.0" y1="248.0" x2="108.0" y2="400.0"/>
  <line class="axis" x1="108.0" y1="400.0" x2="720.0" y2="400.0"/>
  <line class="grid" x1="108.0" y1="400.0" x2="108.0" y2="406.0"/>
  <text class="small" x="108.0" y="422.0" text-anchor="middle">1</text>
  <line class="grid" x1="347.9" y1="400.0" x2="347.9" y2="406.0"/>
  <text class="small" x="347.9" y="422.0" text-anchor="middle">15</text>
  <line class="grid" x1="409.3" y1="400.0" x2="409.3" y2="406.0"/>
  <text class="small" x="409.3" y="422.0" text-anchor="middle">30</text>
  <line class="grid" x1="658.6" y1="400.0" x2="658.6" y2="406.0"/>
  <text class="small" x="658.6" y="422.0" text-anchor="middle">500</text>
  <line class="grid" x1="102.0" y1="400.0" x2="108.0" y2="400.0"/>
  <text class="small" x="98.0" y="404.0" text-anchor="end">0 已动</text>
  <line class="grid" x1="102.0" y1="248.0" x2="108.0" y2="248.0"/>
  <text class="small" x="98.0" y="252.0" text-anchor="end">1 未动</text>
  <text class="small" x="720" y="444" text-anchor="end">时间 ms（对数）</text>
