<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="hz-t hz-d">
  <title id="hz-t">看得越远，离墙越近</title>
  <desc id="hz-d">同一个瞬间，端电压在未来还要继续被极化拉低、被荷电下滑压低；时间窗越长，预计的端电压越靠近电压下限，允许的电流只能跟着收紧。闭式除法只看此刻，因此报得偏乐观；逐秒向前推演能看到贴墙，把值收回来。</desc>
  <defs>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path class="head-green" d="M0 0L9 4.5L0 9Z"/>
    </marker>
    <marker id="arrow-gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path class="head-gold" d="M0 0L9 4.5L0 9Z"/>
    </marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path class="head-red" d="M0 0L9 4.5L0 9Z"/>
    </marker>
    <style>
      text { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #293b3a; }
      .title { font-size: 20px; font-weight: 700; fill: #293b3a; }
      .sub { font-size: 12px; fill: #626d65; }
      .h { font-size: 15px; font-weight: 700; fill: #293b3a; }
      .body { font-size: 13px; fill: #293b3a; }
      .small { font-size: 12px; fill: #626d65; }
      .tiny { font-size: 12px; fill: #626d65; }
      .accent { fill: #176b73; }
      .green { fill: #377b60; }
      .red { fill: #b84745; }
      .gold { fill: #926717; }
      .paper { fill: #fffdf5; }
      .card { fill: #fffdf5; stroke: #968d77; stroke-width: 1.4; }
      .wall { stroke: #b84745; stroke-width: 1.8; fill: none; stroke-dasharray: 7 5; }
      .br-green { stroke: #377b60; stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
      .br-gold { stroke: #926717; stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
      .br-red { stroke: #b84745; stroke-width: 2.2; fill: none; stroke-dasharray: 7 5; }
      .dot { fill: #293b3a; }
      .strike { stroke: #176b73; stroke-width: 2; fill: none; }
      .strip { fill: #e4f0df; stroke: #377b60; stroke-width: 1.4; }
      .head-green { fill: #377b60; }
      .head-gold { fill: #926717; }
      .head-red { fill: #b84745; }
      @media (prefers-color-scheme: dark) {
        text { fill: #edf0e5; }
        .title { fill: #edf0e5; }
        .sub { fill: #b0beb3; }
        .h { fill: #edf0e5; }
        .body { fill: #edf0e5; }
        .small { fill: #b0beb3; }
        .tiny { fill: #b0beb3; }
        .accent { fill: #7ec5c5; }
        .green { fill: #8fc7a2; }
        .red { fill: #f39b91; }
        .gold { fill: #dfbd78; }
        .paper { fill: #223333; }
        .card { fill: #223333; stroke: #71908c; }
        .wall { stroke: #f39b91; }
        .br-green { stroke: #8fc7a2; }
        .br-gold { stroke: #dfbd78; }
        .br-red { stroke: #f39b91; }
        .dot { fill: #edf0e5; }
        .strike { stroke: #7ec5c5; }
        .strip { fill: #293f35; stroke: #8fc7a2; }
        .head-green { fill: #8fc7a2; }
        .head-gold { fill: #dfbd78; }
        .head-red { fill: #f39b91; }
      }
    </style>
  </defs>

  <rect class="paper" x="0" y="0" width="960" height="560"/>

  <text x="480" y="32" text-anchor="middle" class="title">看得越远，离墙越近</text>
  <path d="M414 42C446 40 482 44 514 41" class="strike" opacity=".5"/>
  <text x="480" y="62" text-anchor="middle" class="sub">同一瞬间，时间长一点，允许的电流就得收一点</text>

  <text x="480" y="96" text-anchor="middle" class="small">前面这段路有两种消耗：极化还在积，荷电还在掉</text>

  <circle cx="110" cy="180" r="5" class="dot"/>
  <text x="110" y="164" text-anchor="middle" class="small">此刻</text>

  <path class="br-green" d="M118 176C200 176 250 180 296 184" marker-end="url(#arrow-green)"/>
  <path class="br-gold" d="M118 184C260 204 400 216 508 226" marker-end="url(#arrow-gold)"/>
  <path class="br-red" d="M118 192C300 246 560 264 748 270" marker-end="url(#arrow-red)"/>

  <text x="312" y="180" class="small green">短窗口</text>
  <text x="522" y="222" class="small gold">中窗口</text>
  <text x="762" y="262" class="small red">长窗口</text>
  <text x="756" y="306" class="tiny red">贴墙</text>

  <path class="wall" d="M70 286H900"/>
  <text x="896" y="306" text-anchor="end" class="small red">电压下限</text>

  <rect class="card" x="60" y="326" width="400" height="110" rx="10" transform="rotate(-0.3 260 381)"/>
  <text x="260" y="356" text-anchor="middle" class="h">闭式除法</text>
  <text x="260" y="382" text-anchor="middle" class="body">只看此刻的电压与内阻</text>
  <text x="260" y="406" text-anchor="middle" class="small">看不见未来的极化与下滑</text>
  <text x="260" y="430" text-anchor="middle" class="body red">报得偏大</text>

  <rect class="card" x="500" y="326" width="400" height="110" rx="10" transform="rotate(0.3 700 381)"/>
  <text x="700" y="356" text-anchor="middle" class="h">逐秒向前推演</text>
  <text x="700" y="382" text-anchor="middle" class="body">每猜一个电流就往前推一段</text>
  <text x="700" y="406" text-anchor="middle" class="small">推到墙前就停</text>
  <text x="700" y="430" text-anchor="middle" class="body green">收得回来</text>

  <rect class="strip" x="80" y="452" width="800" height="46" rx="12"/>
  <text x="480" y="481" text-anchor="middle" class="h green">看得越远，余量越薄；允许值只能跟着收</text>

  <text x="480" y="530" text-anchor="middle" class="tiny">窗口越短，热与极化还没积累；具体秒数以整车请求为准</text>
</svg>
