<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-label="左：SPM、SPMe、DFN 三档模型阶梯；右：分 SOC 窗口的 RMSE 柱状图，平台区低两端高">
  <rect x="0" y="0" width="960" height="380" fill="#f8fafc"/>
  <text x="24" y="32" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#0f172a">仿真当裁判：平台区像，两端露馅</text>
  <text x="24" y="54" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">合成“SPMe 味”端电压（教学合成值）：四项 OCV + R0 + 一阶扩散；Thevenin 在平台核心标定后分窗口报 RMSE。</text>

  <!-- left: three-tier staircase -->
  <g font-family="Noto Sans SC, Microsoft YaHei, sans-serif">
    <rect x="70" y="270" width="130" height="60" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
    <text x="135" y="296" font-size="14" font-weight="700" fill="#0f766e" text-anchor="middle">SPM</text>
    <text x="135" y="316" font-size="11" fill="#475569" text-anchor="middle">单粒子 · 快速估算</text>

    <rect x="220" y="220" width="130" height="110" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="285" y="248" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">SPMe</text>
    <text x="285" y="268" font-size="11" fill="#475569" text-anchor="middle">加电解液修正</text>
    <text x="285" y="286" font-size="11" fill="#475569" text-anchor="middle">精度速度折中</text>

    <rect x="370" y="170" width="130" height="160" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="435" y="198" font-size="14" font-weight="700" fill="#5b21b6" text-anchor="middle">DFN</text>
    <text x="435" y="218" font-size="11" fill="#475569" text-anchor="middle">固液两相全耦合</text>
    <text x="435" y="236" font-size="11" fill="#475569" text-anchor="middle">研究 · 参数辨识基准</text>

    <path d="M80 260 L200 210 L350 160 L490 128" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
    <path d="M490 128 L478 132 M490 128 L486 140" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <text x="404" y="122" font-size="12" fill="#64748b">计算量与机理细节递增</text>
    <text x="70" y="352" font-size="12" fill="#475569">选型看问题：要快用 SPM，要信一点用 SPMe，要机理用 DFN。</text>
  </g>

  <!-- right: RMSE by SOC window -->
  <g font-family="Noto Sans SC, Microsoft YaHei, sans-serif">
    <line x1="600" y1="300" x2="920" y2="300" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="600" y1="300" x2="600" y2="90" stroke="#cbd5e1" stroke-width="1"/>

    <rect x="640" y="157" width="70" height="143" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <rect x="740" y="269" width="70" height="31" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
    <rect x="840" y="101" width="70" height="199" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>

    <text x="675" y="147" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">14.32 mV</text>
    <text x="775" y="259" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">3.08 mV</text>
    <text x="875" y="91" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">19.87 mV</text>

    <text x="675" y="322" font-size="12" fill="#475569" text-anchor="middle">SOC &lt; 0.20</text>
    <text x="775" y="322" font-size="12" fill="#475569" text-anchor="middle">0.20–0.80</text>
    <text x="875" y="322" font-size="12" fill="#475569" text-anchor="middle">SOC &gt; 0.80</text>
    <text x="760" y="344" font-size="12" fill="#475569" text-anchor="middle">一阶 Thevenin 分窗口 RMSE（demo 输出）</text>

    <line x1="600" y1="208" x2="920" y2="208" stroke="#be123c" stroke-width="1.2" stroke-dasharray="6 4"/>
    <text x="912" y="200" font-size="11" fill="#be123c" text-anchor="end">平台区的 3 倍（断言线）</text>
  </g>

  <text x="24" y="368" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">平台区拟到 3 mV，两端 14–20 mV：同一个标定，换个 SOC 窗口再问，答案完全不同。</text>
</svg>
