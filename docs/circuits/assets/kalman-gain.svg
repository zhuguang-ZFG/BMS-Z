<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>标量卡尔曼增益：K=P/(P+R)。R 更大，平台更低；Q 更大，平台更高。游标读出 K 和 P。</title>
  <desc>40 步递推。蓝线 R=0.001、红线 R=0.020，Q 都是 0.0004。绿线把 Q 提到 0.0016。底栏读出这一步的 K 和 P。示意，不是仓库 EKF 参数。</desc>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; }
    .linek { stroke: #57606a; stroke-width: 2.2; fill: none; stroke-dasharray: 7 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .dotg { fill: #1a7f37; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    .boxy { fill: #fff8c5; stroke: #d4a72c; }
    .boxr { fill: #ffebe9; stroke: #ff8182; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .linek { stroke: #8b949e; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .dotg { fill: #3fb950; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
      .boxy { fill: #3d2e00; stroke: #d29922; }
      .boxr { fill: #3d1418; stroke: #f85149; }
    }
  </style>
  <!-- formula: P=P+Q; K=P/(P+R); P=(1-K)*P; P0=0.04; Q in {0.0004, 0.0016}; R in {0.001, 0.020} -->
  <rect class="bg" width="800" height="560"/>
  <text class="title" x="24" y="32">增益 K = P / (P + R)，吵了自己变小（示意）</text>
  <rect class="panel" x="24" y="44" width="752" height="128" rx="6"/>
  <text class="txt" x="40" y="68" opacity="0.28">① 起步<tspan class="small">　P 从 0.04 加 Q=0.0004。R=0.001 时第一步 K=0.9758。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="92" opacity="0.28">② 每一步<tspan class="small">　先 P←P+Q，再 K=P/(P+R)，然后 P←(1−K)P。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="116" opacity="0.28">③ 测量较静<tspan class="small">　蓝线收到 K=0.4633，P=4.633e-04。还愿意听电压。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="140" opacity="0.28">④ 测量更吵或平台<tspan class="small">　R=0.020 收到 K=0.1318。口诀：平台上少信电压。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="184" width="752" height="250" rx="6"/>
  <text class="small" x="36" y="204">增益 K</text>
  <line class="axis" x1="88.0" y1="214.0" x2="88.0" y2="400.0"/>
  <line class="axis" x1="88.0" y1="400.0" x2="520.0" y2="400.0"/>
  <text class="small" x="520.0" y="436" text-anchor="end">更新步</text>
  <line class="grid" x1="88.0" y1="400.0" x2="88.0" y2="406.0"/>
  <text class="small" x="88.0" y="422.0" text-anchor="middle">1</text>
  <line class="grid" x1="187.7" y1="400.0" x2="187.7" y2="406.0"/>
  <text class="small" x="187.7" y="422.0" text-anchor="middle">10</text>
  <line class="grid" x1="298.5" y1="400.0" x2="298.5" y2="406.0"/>
  <text class="small" x="298.5" y="422.0" text-anchor="middle">20</text>
  <line class="grid" x1="520.0" y1="400.0" x2="520.0" y2="406.0"/>
