<text x="26" y="704" font-size="20" fill="#2a2927" text-anchor="start">1. 矩形带宽 20 kHz：白噪声为 5.66 µV RMS。</text>
<text x="26" y="736" font-size="20" fill="#2a2927" text-anchor="start">2. 一阶低通在 fc 外还有噪声能量通过。</text>
<text x="26" y="768" font-size="20" fill="#2a2927" text-anchor="start">3. 积分 |H|²：ENBW = πfc/2，约 31.42 kHz。</text>
<text x="26" y="800" font-size="20" fill="#2a2927" text-anchor="start">4. 同为 fc 20 kHz，一阶结果 7.09 µV RMS。</text>
<text x="26" y="865" font-size="18" fill="#2a2927" text-anchor="start">示意：仅算 40 nV/√Hz 白电压噪声；另计 1/f、电流噪声与电阻。</text>
