<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 544" font-family="ui-monospace, Consolas, monospace">
  <title>采样周期里的剩余时间：每多一次 CRC 重读就少 2 ms，第三次穿过零。数字为示意。</title>
  <desc>采样周期里的剩余时间：每多一次 CRC 重读就少 2 ms，第三次穿过零。数字为示意。</desc>

  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.5; fill: none; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
    }
  </style>

  <!-- formula: slack=10-(4.9+2*n)=5.1-2*n ms -->
  <rect class="bg" width="800" height="544"/>
  <text class="title" x="24" y="32">重读是对的，重读把周期吃穿就迟了（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="128" rx="6"/>
  <text class="txt" x="40" y="72" opacity="0.28">① 一次读对<tspan class="small">　底账 4.9 ms，10 ms 周期还剩 5.1 ms。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="98" opacity="0.28">② 重读 1 次<tspan class="small">　再花 2.0 ms，还剩 3.1 ms。线往下，斜率 −2。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="124" opacity="0.28">③ 重读 2 次<tspan class="small">　还剩 1.1 ms。零线就在前面不远。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="150" opacity="0.28">④ 重读 3 次<tspan class="small">　剩余 −0.9 ms。这一拍交不出帧，保护软件等于迟到。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="188" width="752" height="304" rx="6"/>
  <text class="small" x="40" y="210">剩余时间 ms（示意）</text>
  <line class="axis" x1="108.0" y1="228.0" x2="108.0" y2="430.0"/>
  <line class="axis" x1="108.0" y1="430.0" x2="730.0" y2="430.0"/>
  <text class="small" x="730.0" y="468.0" text-anchor="end">额外整帧重读次数</text>
  <line class="grid" x1="135.0" y1="430.0" x2="135.0" y2="436.0"/>
  <text class="small" x="135.0" y="452.0" text-anchor="middle">0</text>
  <line class="grid" x1="270.3" y1="430.0" x2="270.3" y2="436.0"/>
  <text class="small" x="270.3" y="452.0" text-anchor="middle">1</text>
  <line class="grid" x1="405.5" y1="430.0" x2="405.5" y2="436.0"/>
  <text class="small" x="405.5" y="452.0" text-anchor="middle">2</text>
  <line class="grid" x1="540.7" y1="430.0" x2="540.7" y2="436.0"/>
  <text class="small" x="540.7" y="452.0" text-anchor="middle">3</text>
  <line class="grid" x1="675.9" y1="430.0" x2="675.9" y2="436.0"/>
  <text class="small" x="675.9" y="452.0" text-anchor="middle">4</text>
  <line class="grid" x1="102.0" y1="356.5" x2="108.0" y2="356.5"/>
  <text class="small" x="98.0" y="360.5" text-anchor="end">0</text>
  <line class="grid" x1="102.0" y1="262.9" x2="108.0" y2="262.9"/>
  <text class="small" x="98.0" y="266.9" text-anchor="end">5.1</text>
  <line class="grid" x1="102.0" y1="409.8" x2="108.0" y2="409.8"/>
  <text class="small" x="98.0" y="413.8" text-anchor="end">−2.9</text>
  <line class="liney" x1="108.0" y1="356.5" x2="730.0" y2="356.5"/>
  <polyline class="lineb" points="135.0,262.9 270.3,299.6 405.5,336.3 540.7,373.1 675.9,409.8" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="doty" r="6"><animate attributeName="cx" values="135.0;270.3;405.5;540.7;675.9" keyTimes="0.0000;0.2500;0.5000;0.7500;1.0000" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="262.9;299.6;336.3;373.1;409.8" keyTimes="0.0000;0.2500;0.5000;0.7500;1.0000" dur="12s" repeatCount="indefinite"/></circle>
  <text class="small" x="24" y="528">10 ms 周期、4.9 ms 底账、每次重读 2.0 ms 都是示意。零线以下表示这一拍已经来不及。</text>
</svg>
