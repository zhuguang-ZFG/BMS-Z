    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.25;0.28;1" dur="12s" repeatCount="indefinite" begin="-2.7s" />
    <animateMotion path="M620,200 L620,278" keyPoints="0;0;1;1" keyTimes="0;0.25;0.55;1" calcMode="linear" dur="12s" repeatCount="indefinite" begin="-2.7s" />
  </circle>

  <text x="180" y="300" text-anchor="middle" font-size="12" class="small">龙头开小</text>
  <text x="400" y="300" text-anchor="middle" font-size="12" class="small">龙头半开</text>
  <text x="620" y="300" text-anchor="middle" font-size="12" class="small">龙头全开</text>

  
  <text x="400" y="338" text-anchor="middle" font-size="14" opacity="0" class="txt">1C = 一小时放空整包的电流：10Ah 的 1C 就是 10A（示例）
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.21;0.25;1" dur="12s" repeatCount="indefinite" />
  </text>

  
  <rect x="80" y="320" width="0" height="14" stroke-width="1.5" class="fill-boxg stroke-g">
    <animate attributeName="width" values="0;0;180;180" keyTimes="0;0.55;0.72;1" dur="12s" repeatCount="indefinite" />
  </rect>
  <rect x="300" y="320" width="0" height="14" stroke-width="1.5" class="fill-boxg stroke-g">
    <animate attributeName="width" values="0;0;90;90" keyTimes="0;0.55;0.72;1" dur="12s" repeatCount="indefinite" />
  </rect>
  <rect x="520" y="320" width="0" height="14" stroke-width="1.5" class="fill-boxg stroke-g">
    <animate attributeName="width" values="0;0;45;45" keyTimes="0;0.55;0.72;1" dur="12s" repeatCount="indefinite" />
  </rect>
  <text x="80" y="366" text-anchor="start" font-size="12" opacity="0" class="ok">约 2 小时才放空
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7;0.75;1" dur="12s" repeatCount="indefinite" />
  </text>
  <text x="300" y="366" text-anchor="start" font-size="12" opacity="0" class="ok">约 1 小时
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7;0.75;1" dur="12s" repeatCount="indefinite" />
  </text>
  <text x="520" y="366" text-anchor="start" font-size="12" opacity="0" class="ok">约半小时
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7;0.75;1" dur="12s" repeatCount="indefinite" />
  </text>

  
  <rect x="220" y="380" width="360" height="26" rx="6" stroke-width="1.5" opacity="0" class="fill-boxy stroke-y">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.8;0.85;1" dur="12s" repeatCount="indefinite" />
  </rect>
  <text x="400" y="398" text-anchor="middle" font-size="13" opacity="0" class="gold">10A 对 10Ah 是 1C，对 20Ah 只是 0.5C——C 永远跟着容量走
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.8;0.85;1" dur="12s" repeatCount="indefinite" />
  </text>

  <text x="400" y="424" text-anchor="middle" font-size="13" class="small">关键：C 是相对于容量的倍率——1C 一小时放空（或充满）；同一电流，包越大 C 越小。</text>
