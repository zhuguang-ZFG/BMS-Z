- id: ch12-tia-three-way
  source: docs/p2-02-ch12.md#12.10a
  before: '- 想提高灵敏度：升 $R_f$（10MΩ 时 1nA → 10mV），但带宽按 $1/R_f$ 掉——**灵敏度与带宽是同一枚硬币的两面**。'
  after: 在该条件下优化补偿，带宽尺度常为 $\sqrt{f_t/(2\pi R_fC_{in})}$；固定 $C_f$ 且其极点主导时，才可能近似按 $1/(R_fC_f)$ 缩放。因此提高 $R_f$ 不总让带宽严格按 $1/R_f$ 下降。图中四个补偿值的阶跃展示了怎样的取舍？
