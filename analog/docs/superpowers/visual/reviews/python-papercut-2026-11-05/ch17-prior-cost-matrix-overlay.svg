<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1448 1086"><text x="78" y="105" fill="#2a2927" font-size="52" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">先查更可能、也更容易验证的故障</text>
<text x="80" y="165" fill="#2a2927" font-size="34" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">定性决策示意：按故障概率与验证成本排序，不表示统计比例。</text>
<line x1="165" y1="920" x2="165" y2="240" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><polygon points="165,240 158.0,253.0 172.0,253.0" fill="#2a2927"/>
<text x="80" y="310" fill="#2a2927" font-size="36" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">高</text>
<text x="80" y="845" fill="#2a2927" font-size="36" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">低</text>
<text x="80" y="225" fill="#2a2927" font-size="34" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">概率</text>
<line x1="210" y1="955" x2="1380" y2="955" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><polygon points="1380,955 1367.0,948.0 1367.0,962.0" fill="#2a2927"/>
<text x="210" y="1020" fill="#2a2927" font-size="36" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">容易验证</text>
<text x="1050" y="1020" fill="#2a2927" font-size="34" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">需要备料 / 拆焊</text>
<text x="390" y="340" fill="#a4441d" font-size="46" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">优先核验</text>
<text x="390" y="415" fill="#2a2927" font-size="38" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">电源与连接</text>
<text x="390" y="480" fill="#2a2927" font-size="34" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">先用万用表</text>
<text x="390" y="535" fill="#2a2927" font-size="34" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">先静后动</text>
<text x="1000" y="340" fill="#2a2927" font-size="40" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">先补证据</text>
<text x="1000" y="420" fill="#2a2927" font-size="34" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">概率较高</text>
<text x="1000" y="480" fill="#2a2927" font-size="34" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">拆焊前先测量</text>
<text x="390" y="700" fill="#2a2927" font-size="40" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">快速排除</text>
<text x="390" y="775" fill="#2a2927" font-size="34" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">记录结果</text>
<text x="390" y="835" fill="#2a2927" font-size="34" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">缩小嫌疑范围</text>
<text x="1000" y="700" fill="#2a2927" font-size="40" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">最后验证</text>
<text x="1000" y="775" fill="#2a2927" font-size="34" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">概率较低</text>
<text x="1000" y="835" fill="#2a2927" font-size="34" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">避免盲目换件</text></svg>
