- id: legacy-figures-ch18-four-gates
  source: docs/p4-03-ch18.md#18.4
  before: '读图指引：沿底部的故障流从左往右看，流带每过一道闸就窄一截。再抬头看阶梯，理解代价梯度：改原理图几分钟、改布局几小时加一次重布、首板回来改是几周加一版打样费、出货后改就是召回，对应
    1-10-100 法则里的 ×1、×10、×100。四张闸下卡片的判据全部带数字。每个电源引脚 100nF 去耦加储能、LDO 压差与结温留 2× 余量、去耦贴脸 &lt;2mm、限流 50mA
    再上电、-20°C 到 70°C 全温、±10% 负载拉偏、老化 ≥24h。没有数字的条目，没有打勾资格。


    清单还是一份活文档。每起现场故障结案后，复盘会只问一个问题：「哪道关口本该拦住它？」答案若对应现有条目，说明执行漏了，追执行；若没有对应条目，说明清单缺了，当场补写一条并注明来源故障单号。于是 Pease
    的故障数据库与这张评审清单闭合成环：排故产出经验，经验回流设计，设计再压缩排故的量。跑通这个循环的团队，故障率一年比一年低；跑不通的团队，在同一种故障上反复交学费。


    > **注意**：评审清单只拦得住已知的故障类型。新故障结案后不回写清单，评审就永远停在昨天的战场上——下一种死法会原样穿透四道关口。


    评审的终极产物是一种设计习惯，打勾表只是它的外形：每个设计决策落笔时都能回答「它坏的时候会怎样」——坏成开路还是短路？会不会连锁烧掉下游？维修的人用什么手段能在十分钟内定位到它？答得上这三问的设计，天然带着可维护性；答不上来的，评审清单替你追问。


    评审项必须带数字才有打勾资格。「去耦电容靠近电源引脚」不可执行，「去耦电容到引脚距离小于 2 mm」才可执行；「纹波不能太大」不可执行，「VCC 引脚处纹波峰峰值小于 50 mV」才可执行。表 18-1
    里的每条都能改写成这种带判据的句式，改写一遍，清单的可执行性就上了一个台阶。


    清单还要有复审触发条件：任何设计变更、换料、换供应商，都触发相关条目重新打勾。同型号不同厂的 MLCC 直流偏压特性可能差出一截，LDO 对输出电容 ESR 的稳定性要求也随厂而异。「换了同源替代料」从来不是免检理由。


    布局关口有一种朴素而有效的评审手法：指读法。评审人用手指或鼠标指针，从电源引脚出发，经过去耦电容、回到地，把每个关键网络的电流路径在图上完整走一遍；指针每绕远一分，就多问一句「这段绕路会吃掉什么」。去耦回路的物理长度、高速信号的回流断点、大电流路径上的过孔数量，都在指读中现形。DRC
    报得出规则违例，报不出「路径不合理」，后者只能靠人眼跟着电流走一遍。'
  after: '图中判据回对表 18-1：每个电源引脚 100nF 去耦加储能，LDO 压差与结温留 2× 余量，去耦距离 <2mm，首次限流 50mA，全温 -20~70°C、负载拉偏 ±10%、老化
    ≥24h。这里是教学清单，实际限流、温区与余量须按产品规格核定。


    现场故障结案后，回查本该拦住它的关口：已有条目就查执行证据，缺少条目就补检查方法并关联故障单。每项指定维护人，设计变更、换料或换供应商时重审；同型号 MLCC 的直流偏压特性、LDO 对输出 ESR
    的要求也可能不同。


    判据要能测量，例如去耦距离 <2mm、VCC 纹波峰峰值 <50mV。设计决策还要回答：坏成开路还是短路，会否连带损坏下游，能否在十分钟内定位？


    布局评审可用「指读法」：从电源脚经去耦电容回到地，完整追踪电流路径，检查去耦回路长度、回流断点和大电流过孔。DRC 能查规则违例，路径是否合理仍需这样逐网复核。'
  caption: 表 18-1 的立体版：潜在故障从左流入，原理图、布局、首板上电、出货回归四道闸依次削窄流带；闸顶阶梯按 1-10-100 法则爬升——几分钟、几小时加重布、几周加打样费、召回。闸下卡片列出各关的打勾判据（100nF、2×
    余量、<2mm、50mA、-20~70°C、±10%、≥24h），以及漏判后落进的 17 章条目。
  removed_prose_chars: 644
  relationship: replaces-text
- id: legacy-figures-ch18-four-gates
  source: docs/p4-03-ch18.md#18.4
  before: 评审记录本身也要归档并可追溯：打勾表随设计版本入库，未过项整改单关联到具体图纸版本号。出货后每起现场故障，能回溯到「当次评审这条过了没有、凭的什么证据」。追溯不是问责游戏，是给清单校准：哪条评审项从没拦到过故障，可能是冗余；哪类故障反复穿透同一关口，说明那条检查的执行方法不对。清单、记录、追溯三件套齐了，设计评审才从一次性会议变成组织级的免疫系统。
