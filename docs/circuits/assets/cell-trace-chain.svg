</style><rect class="bg" x="0" y="-156" width="880" height="640" /><text class="title" x="24" y="-128">示意图：包序列号要能走回电芯档，对不上就不要出厂</text><rect class="panel" x="24" y="-112" width="832" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 示意图：包序列号要能走回电芯档，对不上就不要出厂<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 分容 / K 值<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 错芯 / 贴错标<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="428" width="832" height="44" rx="6" /><text class="small" x="40" y="456">示意图。0.0239 mV/h 只属于那条中试线。</text><rect width="880" height="420" class="bg" />
  <rect x="24" y="70" width="140" height="64" rx="8" class="fill-boxb stroke-b"><animate attributeName="stroke-width" values="5;2;2;2;2;5" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="8s" repeatCount="indefinite" /></rect>
  <text x="94" y="98" text-anchor="middle" font-size="14" class="txt">电芯二维码</text>
  <text x="94" y="118" text-anchor="middle" font-size="12" class="txt">身份</text>
  <rect x="196" y="70" width="140" height="64" rx="8" class="panel"><animate attributeName="stroke-width" values="2;5;2;2;2;2" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="8s" repeatCount="indefinite" /></rect>
  <text x="266" y="98" text-anchor="middle" font-size="14" class="txt">分容 / K 值</text>
  <text x="266" y="118" text-anchor="middle" font-size="12" class="txt">档位</text>
  <rect x="368" y="70" width="140" height="64" rx="8" class="panel"><animate attributeName="stroke-width" values="2;2;5;2;2;2" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="8s" repeatCount="indefinite" /></rect>
  <text x="438" y="98" text-anchor="middle" font-size="14" class="txt">模组</text>
  <text x="438" y="118" text-anchor="middle" font-size="12" class="txt">入箱</text>
  <rect x="540" y="70" width="140" height="64" rx="8" class="panel"><animate attributeName="stroke-width" values="2;2;2;5;2;2" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="8s" repeatCount="indefinite" /></rect>
  <text x="610" y="98" text-anchor="middle" font-size="14" class="txt">包序列号</text>
  <text x="610" y="118" text-anchor="middle" font-size="12" class="txt">整机</text>
  <rect x="712" y="70" width="144" height="64" rx="8" class="fill-boxg stroke-g"><animate attributeName="stroke-width" values="2;2;2;2;5;2" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="8s" repeatCount="indefinite" /></rect>
  <text x="784" y="98" text-anchor="middle" font-size="14" class="txt">BMS 标识</text>
  <text x="784" y="118" text-anchor="middle" font-size="12" class="txt">售后能读</text>
  <circle cy="102" r="7" class="fill-b">
    <animate attributeName="cx" values="94;266;438;610;784;94" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="8s" repeatCount="indefinite" />
  </circle>

  <rect x="24" y="170" width="400" height="170" rx="8" class="fill-boxr stroke-r"><animate attributeName="stroke-width" values="5;5;2;2;2;5" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="8s" repeatCount="indefinite" /></rect>
  <text x="40" y="198" font-size="15" font-weight="bold" class="warn">错芯 / 贴错标</text>
  <text x="40" y="226" font-size="14" class="txt">这一节的码属于另一容量档，</text>
  <text x="40" y="250" font-size="14" class="txt">或同一码出现在两台包上。</text>
  <text x="40" y="282" font-size="14" class="txt">充电末端它先过充，邻居仍低。</text>
  <text x="40" y="310" font-size="14" class="txt">加大均衡搬不来没有的容量。</text>

  <rect x="444" y="170" width="412" height="170" rx="8" class="panel"><animate attributeName="stroke-width" values="2;2;5;5;5;2" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="8s" repeatCount="indefinite" /></rect>
  <text x="460" y="198" font-size="15" font-weight="bold" class="txt">EOL 至少对上什么</text>
  <text x="460" y="226" font-size="14" class="txt">逐串电压对标准源，不只看总电压。</text>
  <text x="460" y="254" font-size="14" class="txt">电芯档和包内清单一致。</text>
  <text x="460" y="282" font-size="14" class="txt">K 值上限是该产线的界，不是通用红线。</text>
  <text x="460" y="310" font-size="14" class="gold">示意图。0.0239 mV/h 只属于那条中试线。</text>
</svg>