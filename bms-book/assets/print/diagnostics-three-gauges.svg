<svg data-sketch="1" xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 800 480" font-family="ui-monospace, Consolas, monospace" aria-label="三把诊断尺子各有前提：单滞后近似界0.087；指定平稳AR1模型的有限窗均值有效样本1.14，渐近式0.20不适用；独立标准正态512点计数参考区间16至36次，原始合成算例21次。" data-snapshot-time="8">
  <title>三把尺子各有前提：时间结构、有限窗方差、NIS 参考分布</title>
  <desc>单滞后筛查不证明独立；有限窗有效样本要指定平稳AR1模型，rho为0.9992时均值1.14、平方1.29；独立标准正态512点越线计数参考区间16至36次，均值区间0.881至1.126。原始抽样21次，同窗归一化后与排序副本都为24次。</desc>

  <style>
    .bg { fill: #fffdf5; }
    .panel { fill: #f7f2e5; stroke: #cfc6b2; }
    .txt { fill: #293b3a; font-size: 13px; }
    .small { fill: #626d65; font-size: 12px; }
    .title { fill: #293b3a; font-size: 17px; font-weight: bold; }
    .head { fill: #293b3a; font-size: 14px; font-weight: bold; }
    .warn { fill: #b84745; }
    .ok { fill: #377b60; }
    .gold { fill: #926717; }
    .gauge { fill: none; stroke: #926717; stroke-width: 2; }
    .needle { fill: #b84745; stroke: #b84745; stroke-width: 2.4; opacity: 0; }
    .fill-dim { fill: #926717; opacity: 0; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #192727; }
      .panel { fill: #223333; stroke: #496160; }
      .txt, .title, .head { fill: #edf0e5; }
      .small { fill: #b0beb3; }
      .warn { fill: #f39b91; }
      .ok { fill: #8fc7a2; }
      .gold { fill: #dfbd78; }
      .gauge { stroke: #dfbd78; }
      .needle { fill: #f39b91; stroke: #f39b91; }
    }
  </style><style id="bms-motion">
    /* bms-motion: 手帐式动效注记（纯装饰，不改技术几何与既有 SMIL 时序） */
    .bms-marker { fill: #fbefc7; opacity: .78; }
    .bms-under { fill: none; stroke: #926717; stroke-width: 2.4; stroke-linecap: round; opacity: .9; }
    .bms-spark-fill { fill: #926717; }
    .bms-sticker { fill: none; stroke: #926717; stroke-width: 2; stroke-dasharray: 7 5; stroke-linecap: round; opacity: .85; }
    .bms-halo { fill: none; stroke: #b84745; stroke-width: 2.4; }
    .bms-marker, .bms-under, .bms-sticker, .bms-halo, .bms-doodle { pointer-events: none; }
    circle:has(&gt; animateMotion) { filter: drop-shadow(0 0 2px rgba(146,103,23,.5)) drop-shadow(0 0 5px rgba(196,145,52,.45)); }
    @media (prefers-color-scheme: dark) {
      .bms-marker { fill: #453e2b; opacity: .85; }
      .bms-under { stroke: #dfbd78; }
      .bms-spark-fill { fill: #dfbd78; }
      .bms-sticker { stroke: #dfbd78; }
      .bms-halo { stroke: #dfbd78; }
      circle:has(&gt; animateMotion) { filter: drop-shadow(0 0 2px rgba(223,189,120,.8)) drop-shadow(0 0 7px rgba(223,189,120,.9)); }
    }
    @media (prefers-reduced-motion: reduce) { .bms-doodle { display: none; } }
</style>

  <!-- gauge rows centered at y=150/252/354; sequential reveal 0.08/0.30/0.52 -->
  <path d="M-0.7 0Q0 0 0 0L400 0.55L800 0Q800 0 800 0L800.43 240L800 480Q800 480 800 480L400 481L0 480Q0 480 0 480L0 -0.42" class="bg"/>
  <path d="M17.48 20Q18 16.2 21.8 16.2L220 17.19L418.2 16.2Q422 16.2 422 20L421.01 25.4L422 30.8Q422 34.6 418.2 34.6L220 35.03L21.8 34.6Q18 34.6 18 30.8L18 19.69" class="bms-marker" aria-hidden="true" transform="rotate(-.5 18 25.4)"/><path d="M24 31Q48.47 28.89 72 31Q96.36 33.67 120 31Q144.65 28.66 168 31Q191.39 33.83 216 31Q239.68 28.78 264 31Q287.69 33.44 312 31Q335.38 29.34 360 31" class="bms-under" aria-hidden="true"/><text class="title" x="24" y="32">三把尺子，各自声明前提</text>
  <path d="M23.31 54Q24 48 30 48L400 47.72L770 48Q776 48 776 54L775.59 224L776 394Q776 400 770 400L400 399.25L30 400Q24 400 24 394L24 53.58" class="panel"/><g class="bms-doodle" aria-hidden="true" transform="matrix(0.9983874752451206 0.05676662112257243 -0.05676662112257243 0.9983874752451206 748 70)" opacity="0.743243" style="opacity: 0.743243;"><path d="M0 -8L0.99 -5.03L2.1 -2.1L5.05 -1.06L8 0L4.79 0.31L2.1 2.1L1.08 5.06L0 8L-1.51 5.21L-2.1 2.1L-4.98 0.84L-8 0L-5.13 -1.27L-2.1 -2.1Z" class="bms-spark-fill"/></g>

  <text class="small" x="40" y="70">先读前提，再读数字。三行使用的统计对象不同，不能交叉套用。</text>

  <!-- gauge 1 -->
  <path d="M60 150A44.22 44.74 0 0 1 148 150" class="gauge"/>
  <path d="M104 150L103.89 135.96L104.94 121.98L106 108" class="needle" opacity="1" style="opacity: 1;"/>
  <text class="head" x="176" y="122">① 时间结构｜单滞后近似筛查</text>
  <text class="txt" x="176" y="146" opacity="1" style="opacity: 1;">0.0324 未被标出；0.9992 有明显连续结构</text>
  <text class="small" x="176" y="168">N = 512：近似界 ±0.087；N = 64：±0.245</text>
  <text class="warn" x="176" y="190" opacity="1" style="opacity: 1;">界内不证明白噪声，仍要检查更高滞后</text>

  <!-- gauge 2 -->
  <path d="M60 252A43.94 44.07 0 0 1 148 252" class="gauge"/>
  <path d="M104 252L92.97 244.49L82.54 236.17L72 228" class="needle" opacity="1" style="opacity: 1;"/>
  <text class="head" x="176" y="224">② 有效样本｜另设平稳 AR(1) 模型</text>
  <text class="txt" x="176" y="248" opacity="1" style="opacity: 1;">ρ = 0.9992，N = 512：均值 1.14 / 平方 1.29</text>
  <text class="small" x="176" y="270">有限窗需保留 (1−h/N)；渐近式 0.20 不适用</text>
  <text class="warn" x="176" y="292" opacity="1" style="opacity: 1;">排序样本不能凭一个相关系数获得模型身份</text>

  <!-- gauge 3 -->
  <path d="M60 354A44.36 43.28 0 0 1 148 354" class="gauge"/>
  <path d="M104 354L111.33 342L119.33 330.4L126 318" class="needle" opacity="1" style="opacity: 1;"/>
  <text class="head" x="176" y="326">③ NIS｜独立标准正态、等权固定窗</text>
  <text class="txt" x="176" y="350" opacity="1" style="opacity: 1;">计数参考区间 [16, 36]；原始合成算例 21 次</text>
  <text class="small" x="176" y="372">含端点覆盖 96.76%；平均 NIS 参考带 [0.881, 1.126]</text>
  <text class="warn" x="176" y="394" opacity="1" style="opacity: 1;">通过区间只与本模型相容，不能直接判故障</text>

  <path d="M23.24 424Q24 414 34 414L400 413.91L766 414Q776 414 776 424L776.62 436L776 448Q776 458 766 458L400 457.81L34 458Q24 458 24 448L24 423.54" class="bms-sticker" aria-hidden="true"/>
  <text class="txt" x="40" y="432">同窗除以 RMS → 平均平方必为 1。归一化与排序副本均越线 24 次。</text>
  <text class="small" x="40" y="450">SciPy 分位数 + 可复算合成实验；真实回放的时间加权统计要另作评估。</text>
<path d="M-0.7 0Q0 0 0 0L400 -0.09L800 0Q800 0 800 0L800.81 240L800 480Q800 480 800 480L400 479.15L0 480Q0 480 0 480L0 -0.42" fill="none" stroke="currentColor" opacity="0.3" stroke-width="1.4"/></svg>
