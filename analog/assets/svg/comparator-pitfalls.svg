<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">比较器的五个坑：忘了上拉排第一</text>

<text x="400" y="46" text-anchor="middle" font-size="14" font-weight="bold" fill="#37424e">LM393 是开集电极输出 —— 一半的「故障」都源于这件事</text>
<rect x="40" y="84" width="720" height="88" rx="9" fill="#f6eedb" stroke="#a8321f" stroke-width="1.6"/><text x="58" y="112" font-size="12.5" font-weight="bold" fill="#a8321f">⚠ 输出一直为低</text><text x="640" y="112" font-size="10.5" font-weight="bold" fill="#a8321f">[最高频]</text><text x="58" y="136" font-size="11" fill="#5b666f">根因：LM393 忘接上拉电阻（开集电极只会拉低）</text><text x="58" y="158" font-size="11" font-weight="bold" fill="#37424e">解法：输出加合适上拉 —— 没上拉，截止电位不受保证</text><rect x="40" y="180" width="720" height="88" rx="9" fill="#f6eedb" stroke="#a4630f" stroke-width="1.6"/><text x="58" y="208" font-size="12.5" font-weight="bold" fill="#a4630f">⚠ 阈值附近连发误触发</text><text x="640" y="208" font-size="10.5" font-weight="bold" fill="#a4630f">[经典]</text><text x="58" y="232" font-size="11" fill="#5b666f">根因：无迟滞 + 输入噪声（信号在阈值上抖动）</text><text x="58" y="254" font-size="11" font-weight="bold" fill="#37424e">解法：加正反馈迟滞（见 7.3）；输入端并小电容</text><rect x="40" y="276" width="720" height="88" rx="9" fill="#f6eedb" stroke="#6b3f63" stroke-width="1.6"/><text x="58" y="304" font-size="12.5" font-weight="bold" fill="#6b3f63">⚠ 高频自激</text><text x="640" y="304" font-size="10.5" font-weight="bold" fill="#6b3f63">[布线问题]</text><text x="58" y="328" font-size="11" fill="#5b666f">根因：输出线耦合回输入（布线寄生）</text><text x="58" y="350" font-size="11" font-weight="bold" fill="#37424e">解法：输入/输出走线远离；地平面隔离；串小电阻</text><rect x="40" y="372" width="720" height="88" rx="9" fill="#f6eedb" stroke="#1f5d7a" stroke-width="1.6"/><text x="58" y="400" font-size="12.5" font-weight="bold" fill="#1f5d7a">⚠ 判决点偏移</text><text x="640" y="400" font-size="10.5" font-weight="bold" fill="#1f5d7a">[精度问题]</text><text x="58" y="424" font-size="11" fill="#5b666f">根因：输入源阻抗过高，I_B 压降改变阈值</text><text x="58" y="446" font-size="11" font-weight="bold" fill="#37424e">解法：降低源阻抗；两输入端加对称补偿电阻</text><rect x="40" y="468" width="720" height="88" rx="9" fill="#f6eedb" stroke="#3d6b4a" stroke-width="1.6"/><text x="58" y="496" font-size="12.5" font-weight="bold" fill="#3d6b4a">⚠ 上电瞬间误输出</text><text x="640" y="496" font-size="10.5" font-weight="bold" fill="#3d6b4a">[启动问题]</text><text x="58" y="520" font-size="11" fill="#5b666f">根因：电源爬升期内部状态未定</text><text x="58" y="542" font-size="11" font-weight="bold" fill="#37424e">解法：加 RC 延时；或选带 POR（上电复位）的型号</text>
<path d="M40 566 Q400.00 565.28 760 566" fill="none" stroke="#c9bb9d" stroke-width="1"/>
<text x="400" y="594" text-anchor="middle" font-size="12" font-weight="bold" fill="#37424e">开集电极这件事，一次说清</text>
<text x="400" y="618" text-anchor="middle" font-size="11.5" fill="#5b666f">开集电极输出 = 一只对地开关。<b>没有上拉就没有高电平</b>，而高电平的值由「上拉接到哪」决定 → 天然电平转换。</text>
<text x="400" y="640" text-anchor="middle" font-size="11.5" fill="#5b666f">多个开集电极输出可并联 = <b>线与</b>：谁拉低谁说了算 —— 窗口检测器就这么搭。</text>
<text x="400" y="662" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a4630f">上拉取值要算：t_r≈0.8473·R·C（见 5.3），I²C 标准模式 R≤11.8kΩ</text>
<circle r="5" fill="#a4630f"><animateMotion dur="11s" repeatCount="indefinite" path="M52,128 L748,128" keyPoints="0;1" keyTimes="0;1"/></circle>
<circle r="5" fill="#3d6b4a"><animateMotion dur="11s" begin="-1.5s" repeatCount="indefinite" path="M52,224 L748,224" keyPoints="0;1" keyTimes="0;1"/></circle>
<circle r="5" fill="#6b3f63"><animateMotion dur="11s" begin="-3.0s" repeatCount="indefinite" path="M52,320 L748,320" keyPoints="0;1" keyTimes="0;1"/></circle>
<circle r="5" fill="#a8321f"><animateMotion dur="11s" begin="-4.5s" repeatCount="indefinite" path="M52,416 L748,416" keyPoints="0;1" keyTimes="0;1"/></circle>
<circle r="5" fill="#a8321f"><animateMotion dur="11s" begin="-6.0s" repeatCount="indefinite" path="M52,512 L748,512" keyPoints="0;1" keyTimes="0;1"/></circle>
<rect x="38" y="84" width="724" height="92" rx="10" fill="none" stroke="#a4630f" stroke-width="2.5" opacity="0" filter="url(#pglow)"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.0s" repeatCount="indefinite"/></rect>
<rect x="38" y="276" width="724" height="92" rx="10" fill="none" stroke="#6b3f63" stroke-width="2.5" opacity="0" filter="url(#pglow)"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.0s" repeatCount="indefinite"/></rect>
<rect x="38" y="82" width="724" height="92" rx="10" fill="none" stroke="#a8321f" stroke-width="2.5" opacity="0" filter="url(#pglow)"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.0s" repeatCount="indefinite"/></rect>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.03;0.2;0.25;1" dur="11s" repeatCount="indefinite"/><rect x="178.2" y="677.0" width="443.7" height="24.1" rx="12.0" fill="#a8321f" fill-opacity="0.09" stroke="#a8321f" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.25;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="690" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#a8321f" opacity="0">① 先查上拉：开集电极只能拉低，截止后的电位需要外部确定<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.25;1" dur="11s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="11s" repeatCount="indefinite"/><rect x="155.4" y="677.0" width="489.1" height="24.1" rx="12.0" fill="#a4630f" fill-opacity="0.09" stroke="#a4630f" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="690" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#a4630f" opacity="0">② 阈值附近误触发：不是比较器坏，是缺迟滞——加正反馈造免疫区<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="11s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="11s" repeatCount="indefinite"/><rect x="200.9" y="677.0" width="398.2" height="24.1" rx="12.0" fill="#6b3f63" fill-opacity="0.09" stroke="#6b3f63" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="690" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#6b3f63" opacity="0">③ 自激多是布线问题：输入输出走线远离、地平面隔离<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="11s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/><rect x="81.5" y="677.0" width="637.0" height="24.1" rx="12.0" fill="#3d6b4a" fill-opacity="0.09" stroke="#3d6b4a" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="690" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#3d6b4a" opacity="0">④ 记住开集电极的三个红利与一个义务：能转换电平/能与线/能当使能 —— 但必须给上拉<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/></text></g></svg>