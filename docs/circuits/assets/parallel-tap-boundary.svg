</style><rect class="bg" x="0" y="-156" width="880" height="660" /><text class="title" x="24" y="-128">采样边界：测的是并联块，不是块里的每一颗</text><rect class="panel" x="24" y="-112" width="832" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 采样边界：测的是并联块，不是块里的每一颗<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 两颗被导线短在一起<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 导线已经把它们拉成同一个电位<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="448" width="832" height="44" rx="6" /><text class="small" x="40" y="476">4S2P 要 4 路采样。路数等于串联数，不乘并联数。示意。</text><rect width="880" height="440" class="bg" />
  <rect x="24" y="60" width="400" height="250" rx="8" stroke-width="2" class="panel stroke-g">
    <animate attributeName="stroke-width" values="5;2;5" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite" />
  </rect>
  <text x="224" y="88" text-anchor="middle" font-size="16" font-weight="bold" class="ok">对：一个抽头</text>
  <rect x="80" y="120" width="70" height="90" rx="6" class="fill-boxg stroke-g" />
  <rect x="170" y="120" width="70" height="90" rx="6" class="fill-boxg stroke-g" />
  <line x1="115" y1="110" x2="205" y2="110" stroke-width="3" class="stroke-g" />
  <line x1="115" y1="120" x2="115" y2="110" stroke-width="3" class="stroke-g" />
  <line x1="205" y1="120" x2="205" y2="110" stroke-width="3" class="stroke-g" />
  <text x="160" y="170" text-anchor="middle" font-size="13" class="txt">两颗被导线短在一起</text>
  <line x1="160" y1="110" x2="300" y2="110" stroke-width="2" class="stroke-b" />
  <rect x="300" y="90" width="90" height="44" rx="6" class="fill-boxb stroke-b" />
  <text x="345" y="116" text-anchor="middle" font-size="13" class="hi">一路电压</text>
  <circle cy="110" r="5" class="fill-b">
    <animate attributeName="cx" values="160;330;160" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite" />
  </circle>

  <rect x="456" y="60" width="400" height="250" rx="8" stroke-width="2" class="panel stroke-r">
    <animate attributeName="stroke-width" values="2;5;2" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite" />
  </rect>
  <text x="656" y="88" text-anchor="middle" font-size="16" font-weight="bold" class="warn">错：当成两路</text>
  <rect x="520" y="120" width="70" height="90" rx="6" class="fill-boxr stroke-r" />
  <rect x="610" y="120" width="70" height="90" rx="6" class="fill-boxr stroke-r" />
  <line x1="555" y1="110" x2="645" y2="110" stroke-width="3" class="stroke-r" />
  <text x="600" y="250" text-anchor="middle" font-size="13" class="warn">导线已经把它们拉成同一个电位</text>
  <text x="720" y="150" font-size="13" class="warn">探头 A</text>
  <text x="720" y="190" font-size="13" class="warn">探头 B</text>
  <text x="720" y="220" font-size="13" class="txt">读数会一样</text>
  <text x="440" y="350" text-anchor="middle" font-size="15" class="txt">4S2P 要 4 路采样。路数等于串联数，不乘并联数。</text>
  <text x="440" y="382" text-anchor="middle" font-size="14" class="txt">块里某一颗先坏，端电压仍可能正常。总电压保护看不出它。</text>
  <text x="440" y="418" text-anchor="middle" font-size="13" class="small">示意图。水路：并联是两桶底连通，水面只能有一个高度。</text>

</svg>