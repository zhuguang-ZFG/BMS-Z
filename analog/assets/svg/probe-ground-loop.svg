<rect x="582" y="118" width="28" height="34" rx="4" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<line x1="596" y1="206" x2="608" y2="206" stroke="#3d6b4a" stroke-width="2.2"/>
<path d="M608 206 Q607.96 213.00 608 220" fill="none" stroke="#3d6b4a" stroke-width="2.2"/>
<path d="M442,282 L448,283 L454,283 L460,284 L466,284 L472,285 L478,286 L484,286 L490,286 L496,287 L502,287 L508,287 L514,287 L520,287 L526,287 L532,287 L538,286 L544,286 L550,286 L556,285 L562,284 L568,284 L574,283 L580,283 L586,282 L592,281 L598,281 L604,280 L610,280 L616,279 L622,278 L628,278 L634,278 L640,277 L646,277 L652,277 L658,277 L664,277 L670,277 L676,277 L682,278 L688,278 L694,278 L700,279 L706,280 L712,280 L718,281 L724,281 L730,282" fill="none" stroke="#3d6b4a" stroke-width="2.5"/>
<text x="586" y="316" text-anchor="middle" font-size="11" fill="#3d6b4a">量到真实纹波</text>
<g opacity="0">
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.86;1" dur="12s" repeatCount="indefinite"/>
<rect x="70" y="336" width="660" height="52.0" rx="9" fill="#e8efe6" stroke="#3d6b4a" stroke-width="1.5" filter="url(#soft)"/><rect x="76" y="343" width="3" height="38.0" rx="1.5" fill="#3d6b4a"/><text x="400" y="358.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3d6b4a">地夹夹在远处的地上就形成大环路，开关电源的磁场在</text><text x="400" y="376.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3d6b4a">里面感应出电压；弹簧地针把环路面积缩十倍以上。</text>
