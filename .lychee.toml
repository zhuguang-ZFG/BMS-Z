# lychee 链接巡检配置。
#
# 背景（2026-10 实测核实）：本仓库外链全部可达，但不少站点对
# 非浏览器 UA 或机房 IP 返回"假死"状态码——裸跑检查器会全是误报：
#   nxp.com      对 bot 一律返回 404（连根域名都是）→ 只能整体排除
#   zhihu.com    403          mdpi.com   403
#   oshwhub.com  418          infineon   403（知识库）
#   bilibili.com 412（2026-10-04 实测补充）
#
# 412 的判据：GitHub runner（Azure 机房 IP）对 6 条 B 站视频链接全部返回
# 412，而同样 URL 从家宽 IP 用浏览器 UA 与 bot UA 都返回 200——即纯按
# 来源 IP 拦截，不是链接失效。B 站从不用 412 表示"视频不存在"（那是 404
# 或 -404 业务码），所以接受 412 不会掩盖真实的死链。
#
# 因此：接受 401/403/412/418/429 这些"反爬特征码"，把真正的 404/410/5xx 留给报告。
accept = ["200..=299", "401", "403", "412", "418", "429"]
exclude = ['nxp\.com']

timeout = 20
retry_wait_time = 4
max_retries = 3
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
max_concurrency = 8
