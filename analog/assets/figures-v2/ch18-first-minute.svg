<polygon class="marker-wash" points="43.4,22.4 228.8,20.9 534.0,23.3 531.6,64.1 250.5,64.2 44.7,64.9" fill="#a4630f" opacity="0.13"/>
<text x="52" y="58" font-size="38" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">60 秒目检：先做最笨的检查</text><text x="52" y="94" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">保险丝是证人，不是耗材；接插件是另一个高发区。</text>
<rect x="48" y="122" width="430" height="492" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<rect class="ink-echo" x="48" y="122" width="430" height="492" rx="6" stroke="#37424e" stroke-width="2" fill="none" opacity="0.32" transform="translate(1.50 -0.82) rotate(-0.05 263.0 368.0)"/>
<text x="74" y="166" font-size="26" fill="#a4630f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">六件事，逐项打勾</text>
<rect x="76" y="202" width="24" height="24" rx="3" fill="none" stroke="#37424e" stroke-width="2"/>
<text x="116" y="224" font-size="23" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">保险丝断没断</text>
<rect x="76" y="262" width="24" height="24" rx="3" fill="none" stroke="#37424e" stroke-width="2"/>
<text x="116" y="284" font-size="23" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">插座有没有电</text>
<rect x="76" y="322" width="24" height="24" rx="3" fill="none" stroke="#37424e" stroke-width="2"/>
<text x="116" y="344" font-size="23" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">开关打在哪个档</text>
<rect x="76" y="382" width="24" height="24" rx="3" fill="none" stroke="#37424e" stroke-width="2"/>
<text x="116" y="404" font-size="23" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">线序对不对</text>
<rect x="76" y="442" width="24" height="24" rx="3" fill="none" stroke="#37424e" stroke-width="2"/>
<text x="116" y="464" font-size="23" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">芯片方向插反没</text>
<rect x="76" y="502" width="24" height="24" rx="3" fill="none" stroke="#37424e" stroke-width="2"/>
<text x="116" y="524" font-size="23" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">跳线帽在该在的位置</text>
<text x="74" y="586" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">目检不高级，但能拦下“根本没通电”。</text>
<rect x="520" y="122" width="432" height="220" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<rect class="ink-echo" x="520" y="122" width="432" height="220" rx="6" stroke="#37424e" stroke-width="2" fill="none" opacity="0.32" transform="translate(1.33 -0.97) rotate(0.06 736.0 232.0)"/>
<text x="546" y="166" font-size="26" fill="#a8321f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">保险丝烧了</text>
<text x="546" y="210" font-size="23" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">先查下游短路</text>
<text x="546" y="246" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">断电测负载对地电阻</text>
<text x="546" y="282" font-size="23" fill="#a8321f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">别急着换新送命</text>
<rect x="520" y="370" width="432" height="244" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<rect class="ink-echo" x="520" y="370" width="432" height="244" rx="6" stroke="#37424e" stroke-width="2" fill="none" opacity="0.32" transform="translate(1.02 0.73) rotate(-0.12 736.0 492.0)"/>
<text x="546" y="414" font-size="26" fill="#a4630f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">触点 1 Ω</text>
<text x="546" y="458" font-size="23" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">1 A 电流吃掉 1 V</text>
<text x="546" y="494" font-size="23" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">5 V 后级只剩 4 V</text>
<text x="546" y="544" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">先拨插复测，再谈芯片</text>
<text x="546" y="584" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">别反复重上电“试试”。</text>
<rect x="140" y="636" width="720" height="40" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<rect class="ink-echo" x="140" y="636" width="720" height="40" rx="6" stroke="#37424e" stroke-width="2" fill="none" opacity="0.32" transform="translate(-1.11 0.91) rotate(-0.09 500.0 656.0)"/>
<text x="500" y="663" font-size="24" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="middle">让证人说话，再动烙铁。</text>
</svg>
