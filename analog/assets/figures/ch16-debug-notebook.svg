<text x="350" y="354" text-anchor="middle" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="17" font-weight="700" fill="#14213d">二分定位</text>
<text x="350" y="430" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12.5" fill="#52606d">中点开刀</text>
<text x="350" y="448" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12.5" fill="#52606d">6 级 → 3 次</text>
</g>
<g>
<circle cx="500" cy="390" r="20" fill="#fffdf8" stroke="#0f766e" stroke-width="2"/>
<text x="500" y="397" text-anchor="middle" font-family="'Book Mono',monospace" font-size="17" font-weight="700" fill="#0f766e">3</text>
<text x="500" y="354" text-anchor="middle" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="17" font-weight="700" fill="#14213d">假设验证</text>
<text x="500" y="430" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12.5" fill="#52606d">一次一变量</text>
<text x="500" y="448" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12.5" fill="#52606d">先想证伪</text>
</g>
<g>
<circle cx="650" cy="390" r="20" fill="#fffdf8" stroke="#14213d" stroke-width="2"/>
<text x="650" y="397" text-anchor="middle" font-family="'Book Mono',monospace" font-size="17" font-weight="700" fill="#14213d">4</text>
<text x="650" y="354" text-anchor="middle" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="17" font-weight="700" fill="#14213d">修复</text>
<text x="650" y="430" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12.5" fill="#52606d">修根因</text>
<text x="650" y="448" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12.5" fill="#52606d">先断电</text>
</g>
<g>
<circle cx="800" cy="390" r="20" fill="#fffdf8" stroke="#b45309" stroke-width="2"/>
<text x="800" y="397" text-anchor="middle" font-family="'Book Mono',monospace" font-size="17" font-weight="700" fill="#b45309">5</text>
<text x="800" y="354" text-anchor="middle" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="17" font-weight="700" fill="#14213d">回归测试</text>
<text x="800" y="430" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12.5" fill="#52606d">全温全程</text>
<text x="800" y="448" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12.5" fill="#52606d">老化 24 h</text>
</g>

