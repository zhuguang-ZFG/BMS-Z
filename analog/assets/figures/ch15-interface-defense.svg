<path d="M558,472 C576,472 588,484 604,488" fill="none" stroke="#b42318" stroke-width="2" marker-end="url(#arrR)"/>
<line x1="598" y1="494" x2="610" y2="494" stroke="#b42318" stroke-width="1.5"/>
<line x1="601" y1="498" x2="607" y2="498" stroke="#b42318" stroke-width="1.5"/>
<text x="624" y="462" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12" fill="#b42318">10 cm 辫子 ≈ 100 nH</text>
<text x="624" y="486" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12" fill="#b42318">100 MHz 时阻抗 63 Ω，形同虚设</text>

<!-- ===== 结论 ===== -->
<rect x="36" y="532" width="888" height="104" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
<rect x="36" y="532" width="6" height="104" fill="#14213d"/>
<text x="60" y="562" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="15" font-weight="700" fill="#14213d">防护器件放最外侧：顺序即先泄放、再阻挡</text>
<text x="60" y="588" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="13" fill="#52606d">TVS 贴接口 5 mm 内泄放，扼流圈对准超标频段阻挡，π 型滤波收差模</text>
<text x="60" y="614" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#b45309">90% 的辐射问题改 layout 时就消失，剩下 10% 才是滤波器的活</text>
</svg>
