<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="ui-monospace, Consolas, monospace">
  <title>NTC 的 Beta 曲线不是直线。两点拉直线会在中间和两端留下温度误差，查表把误差压回各段之内。数字为示意。</title>

  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #bf8700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.5; fill: none; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .dotg { fill: #1a7f37; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    .boxr { fill: #ffebe9; stroke: #cf222e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .dotg { fill: #3fb950; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
      .boxr { fill: #3d1214; stroke: #ff7b72; }
    }
  </style>

  <!-- formula: R=10000*exp(3950*(1/T-1/298.15)); V=3.3*R/(10000+R); linear invert between knots -->
  <rect class="bg" width="800" height="500"/>
  <text class="title" x="24" y="32">阻值是弯的，温度换算不要拉一根直线（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="122" rx="6"/>
  <text class="txt" x="40" y="68" opacity="0.28">① Beta<tspan class="small">　R=10 kΩ·exp[3950·(1/T−1/298.15)]。25 °C 正好 10 kΩ。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="94" opacity="0.28">② 分压<tspan class="small">　上拉 10 kΩ、3.3 V。0 °C 约 33.6 kΩ，50 °C 约 3.6 kΩ。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="120" opacity="0.28">③ 只拉 0 °C 和 50 °C<tspan class="small">　这两点误差为 0。25 °C 偏 1.72 °C，70 °C 偏 −8.71 °C。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="146" opacity="0.28">④ 五点折线<tspan class="small">　结点上误差为 0。70 °C 落在 50 和 80 之间，误差收到大约 2.7 °C。保护不要建在那根红线上。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="182" width="752" height="250" rx="6"/>
  <text class="small" x="40" y="204">换算误差 °C</text>
  <line class="axis" x1="92.0" y1="214.0" x2="92.0" y2="400.0"/>
  <line class="axis" x1="92.0" y1="400.0" x2="720.0" y2="400.0"/>
  <text class="small" x="712.0" y="418" text-anchor="end">真实温度 °C</text>
  <line class="grid" x1="92.0" y1="400.0" x2="92.0" y2="406.0"/>
  <text class="small" x="92.0" y="432" text-anchor="middle">−20</text>
  <line class="grid" x1="217.6" y1="400.0" x2="217.6" y2="406.0"/>
  <text class="small" x="217.6" y="432" text-anchor="middle">0</text>
  <line class="grid" x1="374.6" y1="400.0" x2="374.6" y2="406.0"/>
  <text class="small" x="374.6" y="432" text-anchor="middle">25</text>
  <line class="grid" x1="531.6" y1="400.0" x2="531.6" y2="406.0"/>
  <text class="small" x="531.6" y="432" text-anchor="middle">50</text>
  <line class="grid" x1="720.0" y1="400.0" x2="720.0" y2="406.0"/>
  <text class="small" x="720.0" y="432" text-anchor="middle">80</text>
  <line class="grid" x1="86.0" y1="378.5" x2="92.0" y2="378.5"/>
  <text class="small" x="82.0" y="382.5" text-anchor="end">−15</text>
  <line class="grid" x1="86.0" y1="271.2" x2="92.0" y2="271.2"/>
  <text class="small" x="82.0" y="275.2" text-anchor="end">0</text>
  <line class="grid" x1="86.0" y1="242.6" x2="92.0" y2="242.6"/>
  <text class="small" x="82.0" y="246.6" text-anchor="end">4</text>
  <polyline class="liner" points="92.0,228.8 98.3,232.4 104.6,235.9 110.8,239.3 117.1,242.4 123.4,245.4 129.7,248.3 136.0,251.0 142.2,253.5 148.5,255.9 154.8,258.1 161.1,260.1 167.4,262.0 173.6,263.7 179.9,265.2 186.2,266.6 192.5,267.9 198.8,268.9 205.0,269.8 211.3,270.6 217.6,271.2 223.9,271.7 230.2,272.1 236.4,272.3 242.7,272.4 249.0,272.3 255.3,272.2 261.6,271.9 267.8,271.6 274.1,271.2 280.4,270.7 286.7,270.1 293.0,269.4 299.2,268.7 305.5,267.9 311.8,267.1 318.1,266.3 324.4,265.5 330.6,264.6 336.9,263.7 343.2,262.9 349.5,262.0 355.8,261.2 362.0,260.4 368.3,259.7 374.6,258.9 380.9,258.3 387.2,257.7 393.4,257.1 399.7,256.7 406.0,256.3 412.3,256.0 418.6,255.8 424.8,255.7 431.1,255.7 437.4,255.7 443.7,255.9 450.0,256.3 456.2,256.7 462.5,257.2 468.8,257.9 475.1,258.6 481.4,259.5 487.6,260.6 493.9,261.7 500.2,263.0 506.5,264.4 512.8,265.9 519.0,267.6 525.3,269.3 531.6,271.2 537.9,273.3 544.2,275.4 550.4,277.7 556.7,280.1 563.0,282.6 569.3,285.2 575.6,288.0 581.8,290.8 588.1,293.8 594.4,296.9 600.7,300.1 607.0,303.4 613.2,306.8 619.5,310.4 625.8,314.0 632.1,317.7 638.4,321.5 644.6,325.4 650.9,329.4 657.2,333.5 663.5,337.7 669.8,342.0 676.0,346.3 682.3,350.8 688.6,355.3 694.9,359.9 701.2,364.6 707.4,369.3 713.7,374.1 720.0,379.0" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline class="lineg" points="92.0,271.2 98.3,273.4 104.6,275.3 110.8,277.0 117.1,278.5 123.4,279.8 129.7,280.8 136.0,281.7 142.2,282.2 148.5,282.6 154.8,282.7 161.1,282.6 167.4,282.2 173.6,281.6 179.9,280.8 186.2,279.8 192.5,278.5 198.8,277.0 205.0,275.3 211.3,273.4 217.6,271.2 223.9,272.1 230.2,272.9 236.4,273.6 242.7,274.1 249.0,274.6 255.3,274.9 261.6,275.1 267.8,275.3 274.1,275.3 280.4,275.3 286.7,275.2 293.0,275.0 299.2,274.8 305.5,274.6 311.8,274.3 318.1,274.0 324.4,273.7 330.6,273.3 336.9,273.0 343.2,272.6 349.5,272.3 355.8,272.0 362.0,271.7 368.3,271.4 374.6,271.2 380.9,270.0 387.2,268.8 393.4,267.7 399.7,266.7 406.0,265.8 412.3,264.9 418.6,264.2 424.8,263.5 431.1,263.0 437.4,262.5 443.7,262.2 450.0,262.0 456.2,261.9 462.5,262.0 468.8,262.2 475.1,262.5 481.4,262.9 487.6,263.5 493.9,264.2 500.2,265.0 506.5,266.0 512.8,267.1 519.0,268.3 525.3,269.7 531.6,271.2 537.9,268.1 544.2,265.2 550.4,262.5 556.7,260.1 563.0,258.0 569.3,256.0 575.6,254.4 581.8,252.9 588.1,251.7 594.4,250.7 600.7,249.9 607.0,249.3 613.2,249.0 619.5,248.8 625.8,248.9 632.1,249.1 638.4,249.6 644.6,250.2 650.9,251.1 657.2,252.1 663.5,253.3 669.8,254.6 676.0,256.1 682.3,257.8 688.6,259.7 694.9,261.7 701.2,263.9 707.4,266.2 713.7,268.6 720.0,271.2" stroke-linejoin="round" stroke-linecap="round"/>
  <line class="axis" x1="92.0" y1="271.2" x2="720.0" y2="271.2"/>
  <text class="warn" x="200" y="246">红：只拉 0 °C 和 50 °C</text>
  <text class="ok" x="200" y="268">绿：五点折线查表</text>
  <circle class="dotr" r="6"><animate attributeName="cx" values="92.0;144.3;196.7;249.0;301.3;353.7;406.0;458.3;510.7;563.0;615.3;667.7;720.0" keyTimes="0;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="228.8;254.3;268.6;272.3;268.4;261.5;256.3;256.9;265.4;282.6;308.0;340.6;379.0" keyTimes="0;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1" dur="12s" repeatCount="indefinite"/></circle>
  <text class="small" x="24" y="478">β=3950 K、10 kΩ、3.3 V 都是示意。量产用供应商的 R-T 表，不要用这一张图的误差当校准结果。</text>
</svg>
