<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="s2dir-t s2dir-d">
  <title id="s2dir-t">过充断开之后，放电为什么还有路</title>
  <desc id="s2dir-d">过充保护只关断充电 MOS：它的沟道被掐断，但体二极管的方向与放电电流一致，放电仍从二极管里穿过去；反方向的充电电流被这只二极管挡住。</desc>
  <defs>
    <marker id="a-flow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path class="head-flow" d="M0 0L9 4.5L0 9Z"/>
    </marker>
    <style>
      text { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #293b3a; }
      .title { font-size: 20px; font-weight: 700; }
      .h { font-size: 15px; font-weight: 700; fill: #293b3a; }
      .body { font-size: 13px; fill: #293b3a; }
      .small { font-size: 13px; fill: #626d65; }
      .tiny { font-size: 12px; fill: #626d65; }
      .accent { fill: #176b73; }
      .green { fill: #377b60; }
      .red { fill: #b84745; }
      .gold { fill: #926717; }
      .cell { fill: #e4f0df; stroke: #377b60; stroke-width: 1.6; }
      .card { fill: #fffdf5; stroke: #968d77; stroke-width: 1.4; }
      .strip { fill: #e4f0df; stroke: #377b60; stroke-width: 1.4; }
      .wire { stroke: #293b3a; stroke-width: 2; fill: none; stroke-linejoin: round; }
      .flow { stroke: #377b60; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .branch { stroke: #626d65; stroke-width: 2; fill: none; stroke-linecap: round; }
      .dio { fill: #293b3a; stroke: #293b3a; stroke-width: 1.6; }
      .dot { fill: #176b73; }
      .cut { stroke: #b84745; stroke-width: 2.4; fill: none; stroke-linecap: round; }
      .head-flow { fill: #377b60; }
      @media (prefers-color-scheme: dark) {
        text { fill: #edf0e5; }
        .title { fill: #edf0e5; }
        .h { fill: #edf0e5; }
        .body { fill: #edf0e5; }
        .small { fill: #b0beb3; }
        .tiny { fill: #b0beb3; }
        .accent { fill: #7ec5c5; }
        .green { fill: #8fc7a2; }
        .red { fill: #f39b91; }
        .gold { fill: #dfbd78; }
        .cell { fill: #293f35; stroke: #8fc7a2; }
        .card { fill: #223333; stroke: #71908c; }
        .strip { fill: #293f35; stroke: #8fc7a2; }
        .wire { stroke: #edf0e5; }
        .flow { stroke: #8fc7a2; }
        .branch { stroke: #b0beb3; }
        .dio { fill: #edf0e5; stroke: #edf0e5; }
        .dot { fill: #7ec5c5; }
        .cut { stroke: #f39b91; }
        .head-flow { fill: #8fc7a2; }
      }
    </style>
  </defs>

  <text x="480" y="34" text-anchor="middle" class="title">过充断开之后，放电为什么还有路</text>
  <text x="480" y="62" text-anchor="middle" class="small">断的是充电那只；反方向的路，体二极管替它留着</text>

  <rect class="cell" x="70" y="120" width="150" height="130" rx="12"/>
  <text x="145" y="178" text-anchor="middle" class="h">电芯</text>
  <text x="145" y="206" text-anchor="middle" class="small">B+ 在上 · B− 在下</text>
  <circle cx="145" cy="120" r="4" class="dot"/>
  <circle cx="145" cy="250" r="4" class="dot"/>
  <text x="160" y="112" class="tiny accent">B+</text>
  <text x="160" y="270" class="tiny accent">B−</text>

  <path class="flow" d="M145 120H700" marker-end="url(#a-flow)"/>
  <rect class="card" x="700" y="76" width="180" height="154" rx="10"/>
  <text x="796" y="152" text-anchor="middle" class="h">负载</text>
  <text x="796" y="176" text-anchor="middle" class="small">放电</text>
  <text x="712" y="112" class="tiny accent">P+</text>
  <path class="wire" d="M790 230V370"/>
  <text x="800" y="248" class="tiny accent">P−</text>

  <path class="flow" d="M790 370H740" marker-end="url(#a-flow)"/>
  <path class="flow" d="M540 370H480" marker-end="url(#a-flow)"/>
  <path class="flow" d="M280 370H145V250" marker-end="url(#a-flow)"/>
  <text x="198" y="362" class="tiny green">放电电流</text>

  <rect class="card" x="280" y="300" width="200" height="140" rx="10"/>
  <text x="380" y="332" text-anchor="middle" class="h">放电 MOS</text>
  <text x="380" y="354" text-anchor="middle" class="small green">栅极保持导通</text>
  <path class="flow" d="M480 370H280"/>
  <text x="380" y="408" text-anchor="middle" class="tiny red">体二极管反偏，放电用不上</text>

  <rect class="card" x="540" y="300" width="200" height="140" rx="10"/>
  <text x="640" y="332" text-anchor="middle" class="h">充电 MOS</text>
  <text x="640" y="354" text-anchor="middle" class="small red">栅极被拉低</text>
  <path class="branch" d="M720 370H664"/>
  <path class="branch" d="M616 370H560"/>
  <path class="cut" d="M632 362L648 378M648 362L632 378"/>
  <path class="flow" d="M740 370H720V406H560V370H540"/>
  <path class="dio" d="M648 398L648 414L628 406Z"/>
  <path class="dio" d="M628 398V414"/>
  <text x="640" y="429" text-anchor="middle" class="tiny green">体二极管导通</text>

  <text x="510" y="396" text-anchor="middle" class="tiny">漏极相连</text>

  <rect class="strip" x="80" y="466" width="800" height="44" rx="12"/>
  <text x="480" y="494" text-anchor="middle" class="h green">沟道断了，体二极管还顺着放电方向：只封住一个方向</text>
  <text x="480" y="538" text-anchor="middle" class="tiny">体二极管朝哪边，就关得住哪边；两只管子反着串，才双向都能断</text>
</svg>
