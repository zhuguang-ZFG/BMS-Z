<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">教学帧重同步，第1步</title>
<desc id="desc">三个垃圾字节后是完整八字节教学帧AA550103020E7413。CRC覆盖0103020E74。下方为好流与仅翻转CRC末位的坏流两次独立回放；最后输入索引为10。</desc>
