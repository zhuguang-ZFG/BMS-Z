<path d="M155 276 Q154.97 283.00 155 290" fill="none" stroke="#37424e" stroke-width="2.5"/><path d="M139 290 Q155.00 289.99 171 290" fill="none" stroke="#37424e" stroke-width="3"/><path d="M145 296 Q155.00 295.94 165 296" fill="none" stroke="#37424e" stroke-width="3"/><line x1="151" y1="302" x2="159" y2="302" stroke="#37424e" stroke-width="3"/>
<text x="52" y="130" font-size="11.5" font-weight="bold" fill="#a4630f">+12V</text>
<path d="M120 90 Q119.95 100.00 120 110" fill="none" stroke="#37424e" stroke-width="2"/>
<path d="M70 90 Q95.00 89.79 120 90" fill="none" stroke="#37424e" stroke-width="2"/>
<text x="240" y="150" font-size="11.5" font-weight="bold" fill="#3d6b4a">V_C = 6.0V</text>
<text x="240" y="176" font-size="11.5" font-weight="bold" fill="#3d6b4a">V_B = 0.70V</text>
<text x="240" y="202" font-size="11.5" font-weight="bold" fill="#3d6b4a">V_E = 0.00V</text>
<text x="240" y="232" font-size="11" fill="#5b666f">V_BE = 0.70V ✓</text>
<text x="240" y="252" font-size="11" fill="#5b666f">V_C 高于 V_B ✓</text>
