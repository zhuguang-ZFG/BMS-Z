  <text x="40.0" y="50.0" font-size="32" fill="#293B3A" text-anchor="start">同样 14 → 1，为什么漏帧数不同？</text>
  <text x="40.0" y="88.0" font-size="22" fill="#293B3A" text-anchor="start">先确认循环空间，再沿路径数一遍。</text>
