# lychee 链接巡检配置。
#
# 背景（2026-10 实测核实）：本仓库 87 条外链全部可达，但不少站点对
# 非浏览器 UA 返回"假死"状态码——裸跑检查器会全是误报：
#   nxp.com      对 bot 一律返回 404（连根域名都是）→ 只能整体排除
#   zhihu.com    403          mdpi.com   403
#   oshwhub.com  418          infineon   403（知识库）
# 因此：接受 401/403/418/429 这些"反爬特征码"，把真正的 404/410/5xx 留给报告。
accept = ["200..=299", "401", "403", "418", "429"]
exclude = ['nxp\.com']

timeout = 20
retry_wait_time = 4
max_retries = 3
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
max_concurrency = 8
