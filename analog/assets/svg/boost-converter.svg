<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="ttl">
<title id="ttl">Boost 升压：电感「叠罗汉」把电压顶上去</title>
<desc>Boost 升压：电感「叠罗汉」把电压顶上去；节拍：① 开关闭合：12V 全加在电感上，电流斜坡上升——能量存进磁场（输出靠电容撑）；② 开关断开：电感不许电流突变，极性翻转与 12V 串联叠加——顶开二极管向 24V 灌能；③ 伏秒平衡：Vin·D = (Vout−Vin)·(1−D) → Vout = Vin/(1−D)——D 越近 1 升得越高</desc>
