<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="充电机输出电流分成电芯净充电电流与附件消耗电流，说明截止电流必须绑定测点">
  <rect width="960" height="360" fill="#f8fafc"/>
  <text x="24" y="32" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#0f172a">同样是安培，测点不同，满充结论就不同</text>
  <text x="24" y="55" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">50 Ah 包的 0.05C 截止线为 2.5 A；示例中充电机输出 4.5 A，附件消耗 2.0 A，电芯净充电正好 2.5 A。</text>

  <rect x="55" y="128" width="205" height="92" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="158" y="162" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">充电机输出</text>
  <text x="158" y="194" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#1d4ed8">4.5 A</text>

  <line x1="260" y1="174" x2="417" y2="174" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  <polygon points="433,174 413,162 413,186" fill="#2563eb"/>
  <circle cx="455" cy="174" r="13" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
  <text x="455" y="179" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="800" fill="#475569">Σ</text>

  <line x1="468" y1="165" x2="635" y2="111" stroke="#0f766e" stroke-width="6" stroke-linecap="round"/>
  <polygon points="650,106 629,103 636,122" fill="#0f766e"/>
  <line x1="468" y1="183" x2="635" y2="237" stroke="#d97706" stroke-width="6" stroke-linecap="round"/>
  <polygon points="650,242 636,226 629,245" fill="#d97706"/>

  <rect x="650" y="68" width="245" height="88" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="772" y="99" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#0f766e">流入电芯的净电流</text>
  <text x="772" y="130" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#0f766e">2.5 A</text>

  <rect x="650" y="198" width="245" height="88" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="772" y="229" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#b45309">附件消耗</text>
  <text x="772" y="260" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#b45309">2.0 A</text>

  <rect x="92" y="258" width="380" height="42" rx="21" fill="#fff1f2" stroke="#be123c"/>
  <text x="282" y="284" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#be123c">若只看 4.5 A：误判“还没到截止线”</text>
  <rect x="540" y="305" width="355" height="34" rx="17" fill="#ecfdf5" stroke="#047857"/>
  <text x="718" y="327" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#047857">净电流 2.5 A：此刻才满足 0.05C</text>
</svg>
