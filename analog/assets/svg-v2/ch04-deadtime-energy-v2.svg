<text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b">死区损耗：时间单位不能漏掉一位</text>
<text x="360" y="54" text-anchor="middle" font-size="12.5" fill="#5b666f">示意两次各 50 ns；分清单次换流与整个开关周期</text>
<text x="36" y="117" font-size="20" fill="#2a2927" text-anchor="start">① 完整周期 10 µs；两次死区各 50 ns（示意）</text><line x1="100" y1="145" x2="620" y2="145" stroke="#16202b" stroke-width="3" stroke-dasharray=""/><rect x="100" y="132" width="2.6" height="26" fill="#a8321f"/><rect x="360" y="132" width="2.6" height="26" fill="#a8321f"/><text x="100" y="180" font-size="18" fill="#2a2927" text-anchor="start">0</text><text x="620" y="180" font-size="18" fill="#2a2927" text-anchor="end">10 µs</text>
<g data-beat="换流路径" opacity="0"><text x="36" y="230" font-size="20" fill="#2a2927" text-anchor="start">② 单次换流放大：上管关 → 死区 → 下管开</text><rect x="100" y="255" width="80" height="40" fill="none" stroke="#1f5d7a" stroke-width="2"/><text x="140" y="282" font-size="20" fill="#1f5d7a" text-anchor="middle">上管</text><rect x="180" y="255" width="260" height="40" fill="none" stroke="#a8321f" stroke-width="2"/><text x="310" y="282" font-size="20" fill="#a8321f" text-anchor="middle">体二极管</text><rect x="440" y="255" width="180" height="40" fill="none" stroke="#3d6b4a" stroke-width="2"/><text x="530" y="282" font-size="20" fill="#3d6b4a" text-anchor="middle">下管</text><text x="310" y="324" font-size="18" fill="#2a2927" text-anchor="middle">此处 50 ns；另一沿另有 50 ns</text><line x1="100" x2="100" y1="249" y2="301" stroke="#16202b" stroke-width="3"><animate attributeName="x1" from="100" to="620" begin="3.3s" dur="2s" fill="freeze"/><animate attributeName="x2" from="100" to="620" begin="3.3s" dur="2s" fill="freeze"/></line><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="3s" dur="0.45s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="6s" dur="0.4s" fill="freeze"/></g>
<g data-beat="每次能量" opacity="0"><text x="100" y="253" font-size="24" fill="#a8321f" text-anchor="start">P瞬时 = 0.8 V × 5 A = 4 W</text><text x="100" y="302" font-size="24" fill="#1f5d7a" text-anchor="start">E周期 = 4 W × 100 ns = 0.4 µJ</text><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="6s" dur="0.45s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="9s" dur="0.4s" fill="freeze"/></g>
<g data-beat="平均损耗" opacity="0"><text x="100" y="253" font-size="24" fill="#a8321f" text-anchor="start">P瞬时 = 0.8 V × 5 A = 4 W</text><text x="100" y="302" font-size="24" fill="#1f5d7a" text-anchor="start">E周期 = 4 W × 100 ns = 0.4 µJ</text><text x="100" y="351" font-size="26" fill="#2a2927" text-anchor="start">P平均 = 0.04 W = 40 mW</text><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="9s" dur="0.45s" fill="freeze"/></g>
<rect x="24" y="406" width="672" height="34" rx="9" fill="#f7eedb" stroke="#c9bb9d" stroke-width="1.2"/>
<g data-caption="完整周期" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="0s" dur="0.2s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="2.8s" dur="0.2s" fill="freeze"/><text x="360" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#16202b">一个 10 µs 周期，两段死区合计 100 ns。</text></g>
<g data-caption="换流路径" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="3s" dur="0.2s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="5.8s" dur="0.2s" fill="freeze"/><text x="360" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#a8321f">死区由体二极管续流；开通后沟道接管。</text></g>
<g data-caption="每次能量" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="6s" dur="0.2s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="8.8s" dur="0.2s" fill="freeze"/><text x="360" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f5d7a">0.8 V × 5 A × 100 ns = 0.4 µJ / 周期。</text></g>
<g data-caption="平均损耗" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="9s" dur="0.2s" fill="freeze"/><text x="360" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#16202b">0.4 µJ × 100 kHz = 0.04 W，即 40 mW。</text></g>
</svg>
