name: deploy-pages

# 站点部署：VitePress 构建产物发到 GitHub Pages。
# 与 tests 分开：闸门（tests）挡的是代码与文档质量，这里挡的是"能不能上线"；
# 部署失败不连累 tests 变红，反之 tests 全绿也不代表产物里链接条条可达——
# dist 侧的对账只有部署前跑才有意义（见 check_pages.py 顶部说明）。
on:
  push:
    branches: [main]
    # BMS*.html 是仓库根上由站点托管的那一页（BMS学习路径.html）：它的相对路径引用
    # 会被 copy-site-assets.mjs 改写，改写规则和它自己改了都得重新发布才算数。
    # 用通配而不是中文文件名，避免过滤规则在非 ASCII 路径上匹配不到。
    paths: ["docs/**", "bms-book/**", "BMS*.md", "BMS*.html", "package.json", "package-lock.json", ".github/workflows/deploy-pages.yml", ".github/scripts/check_pages.py", ".github/scripts/check_search.mjs"]
  workflow_dispatch:

# 部署必须串行：两个部署并发会互相踢下线。与 tests/links 的排队组分开，
# 文档站上线不该排在 C 测试后面。
concurrency:
  group: bms-z-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    # runner 镜像钉死 24.04：理由见 tests.yml 顶部注释（ubuntu-latest 正在迁 Ubuntu 26）。
    # checkout / setup-node 取 Node 24 大版本：Node 20 已被 GitHub 弃用，理由同上。
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bms-book/requirements.txt
      - run: pip install -r bms-book/requirements.txt
      - run: npm ci
      - name: VitePress 构建
        run: npm run docs:build
      - name: 构建并校验整书
        run: |
          python bms-book/build_html.py --pdf
          python bms-book/check_pdf.py
      # 下载页与四份工件先原子落进最终 dist；check_pages 随后检查真正要发布的
      # index.html、稳定版与版本化 HTML，任何死链或孤儿页都直接阻止部署。
      - name: 生成完整下载包
        run: python bms-book/publish_downloads.py --out-dir docs/.vitepress/dist/downloads
      - name: 站内链接与锚点对账（dist 侧）
        run: python3 .github/scripts/check_pages.py docs/.vitepress/dist
      - name: 中文检索对账（正文有的词搜索必须翻到）
        run: node .github/scripts/check_search.mjs docs/.vitepress/dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist
      - id: deployment
        uses: actions/deploy-pages@v5
