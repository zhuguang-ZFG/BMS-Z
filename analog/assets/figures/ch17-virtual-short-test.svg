<title id="figTitle">虚短排查：先核前提，再量压差</title>
<desc id="figDesc">先核供电、共模、输出摆幅与负反馈，再将两输入端压差与器件和工况预算对照。符合时继续验证输入与输出传输；偏离时检查反馈、撞轨、供电与共模。示例 8mV 只作读数，小压差不能单独排除故障。虚短近似的前提见 12.1。</desc>
<defs>
<marker id="arrInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16202b"/></marker>
<marker id="arrGrn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3d6b4a"/></marker>
<marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a8321f"/></marker>
</defs>

<path d="M420 38 c 30 3.4 72 -2.6 120 0.4" fill="none" stroke="#a4630f" stroke-width="2.1" stroke-linecap="round" opacity="0.5"/>
<text x="480" y="54" text-anchor="middle" font-size="30" font-weight="bold" fill="#16202b">虚短排查：先核前提，再量压差</text>

<rect x="36" y="84" width="888" height="134" rx="10" fill="#fdf8ea" stroke="#c9bb9d" stroke-width="1.8"/>
<text x="56" y="120" font-size="24" font-weight="bold" fill="#16202b">先核供电、共模、输出摆幅与负反馈，再量 V−、V+</text>
<text x="56" y="162" font-size="22" fill="#37424e">教学读数：两端相差 8mV，不能据此断言环路正常。</text>
<text x="56" y="198" font-size="22" fill="#37424e">先按器件失调、有限开环增益与仪器误差估算压差。</text>

<path d="M480 218 L480 234" fill="none" stroke="#16202b" stroke-width="1.8" marker-end="url(#arrInk)"/>
<polygon points="480,238 720,292 480,346 240,292" fill="#fdf8ea" stroke="#16202b" stroke-width="2"/>
<text x="480" y="286" text-anchor="middle" font-size="26" font-weight="bold" fill="#16202b">符合器件 / 工况预算？</text>
<text x="480" y="322" text-anchor="middle" font-size="22" fill="#5b666f">前提也要核对</text>

<path d="M300 312 Q254 354 254 408" fill="none" stroke="#3d6b4a" stroke-width="2" marker-end="url(#arrGrn)"/>
<text x="166" y="380" font-size="24" font-weight="bold" fill="#3d6b4a">符合</text>
<path d="M660 312 Q706 354 706 408" fill="none" stroke="#a8321f" stroke-width="2" marker-end="url(#arrRed)"/>
<text x="748" y="380" font-size="24" font-weight="bold" fill="#a8321f">偏离</text>

<rect x="36" y="414" width="434" height="380" rx="12" fill="#e8efe6" stroke="#3d6b4a" stroke-width="2"/>
<text x="56" y="458" font-size="26" font-weight="bold" fill="#3d6b4a">符合预算 → 继续查传输</text>
<text x="56" y="500" font-size="22" fill="#37424e">静态压差接近预算，不是合格证</text>
<path d="M56 520 Q253 521 450 520" fill="none" stroke="#3d6b4a" stroke-width="1.6"/>
<text x="56" y="560" font-size="22" fill="#16202b">· 输入源：信号到引脚了吗</text>
<text x="56" y="598" font-size="22" fill="#16202b">· 输出：按反馈规律响应吗</text>
<text x="56" y="636" font-size="22" fill="#16202b">· 负载：摆幅与驱动够用吗</text>
<text x="56" y="700" font-size="22" fill="#5b666f">8mV 只是读数，不排除故障</text>
<text x="56" y="746" font-size="22" fill="#5b666f">增益、噪声、稳定性仍需另测</text>

<rect x="490" y="414" width="434" height="380" rx="12" fill="#f6e7e1" stroke="#a8321f" stroke-width="2"/>
<text x="510" y="458" font-size="26" font-weight="bold" fill="#a8321f">偏离预算 → 核查四项</text>
<text x="510" y="500" font-size="22" fill="#37424e">先核测量条件，再逐项检查</text>
<path d="M510 520 Q707 519 904 520" fill="none" stroke="#a8321f" stroke-width="1.6"/>
<text x="510" y="560" font-size="22" fill="#16202b">· 反馈：Rf 虚焊或断开</text>
<text x="510" y="598" font-size="22" fill="#16202b">· 输出：撞轨、压摆率受限</text>
<text x="510" y="636" font-size="22" fill="#16202b">· 供电：缺轨、引脚虚焊</text>
<text x="510" y="674" font-size="22" fill="#16202b">· 输入：共模超出规格</text>
<text x="510" y="746" font-size="22" fill="#5b666f">按条件排查，不套统一阈值</text>

<rect x="36" y="828" width="888" height="140" rx="12" fill="#fdf8ea" stroke="#c9bb9d" stroke-width="1.8"/>
<text x="480" y="872" text-anchor="middle" font-size="26" font-weight="bold" fill="#16202b">先核条件，再读差分，最后看输出响应</text>
<text x="480" y="920" text-anchor="middle" font-size="22" fill="#5b666f">虚短前提见 12.1；没有统一的「几十 mV 合格线」</text>
</svg>
