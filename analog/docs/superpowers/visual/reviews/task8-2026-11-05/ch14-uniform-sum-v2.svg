<text x="745" y="510" font-size="22" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">2%</text>
<path d="M745 210 Q743.87 340.00 745 470" fill="none" stroke="#a8321f" stroke-dasharray="5 5"/>
