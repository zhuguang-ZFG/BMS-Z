</style><rect class="bg" x="0" y="-156" width="800" height="806" /><text class="title" x="24" y="-128">木桶效应：最弱的那节电池，决定整组的命运</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 串联能放出的安时，等于最弱那一节。<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 别的节还剩电，整包也先被最弱节叫停。<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 底栏：另外三节 50 Ah 时，可用的是最弱节。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 木桶是示意，不是某一包的配组记录。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect width="800" height="650" class="bg" />
  <g fill="none" stroke-width="2.5" class="stroke-axis">
    <rect x="90" y="90" width="80" height="220" rx="4" />
    <rect x="250" y="90" width="80" height="220" rx="4" />
    <rect x="410" y="90" width="80" height="220" rx="4" />
    <rect x="570" y="90" width="80" height="220" rx="4" />
  </g>
  
  <g stroke-width="2" stroke-dasharray="6 4" class="stroke-r">
    <line x1="86" y1="90" x2="174" y2="90" />
    <line x1="246" y1="90" x2="334" y2="90" />
    <line x1="406" y1="156" x2="494" y2="156" />
    <line x1="566" y1="90" x2="654" y2="90" />
  </g>
  <g font-size="12" text-anchor="middle" class="fill-r">
    <text x="130" y="84">满充线</text>
    <text x="290" y="84">满充线</text>
    <text x="450" y="150">满充线（容量小）</text>
    <text x="610" y="84">满充线</text>
  </g>

  
  <rect x="93" y="310" width="74" height="0" opacity="0.85" class="fill-b">
    <animate attributeName="height" values="0;154;154;4;4;216;216" keyTimes="0;0.35;0.5;0.85;0.9;0.97;1" dur="12s" repeatCount="indefinite" />
    <animate attributeName="y" values="310;156;156;306;306;94;94" keyTimes="0;0.35;0.5;0.85;0.9;0.97;1" dur="12s" repeatCount="indefinite" />
  </rect>
  <rect x="253" y="310" width="74" height="0" opacity="0.85" class="fill-b">
    <animate attributeName="height" values="0;154;154;4;4;216;216" keyTimes="0;0.35;0.5;0.85;0.9;0.97;1" dur="12s" repeatCount="indefinite" />
    <animate attributeName="y" values="310;156;156;306;306;94;94" keyTimes="0;0.35;0.5;0.85;0.9;0.97;1" dur="12s" repeatCount="indefinite" />
  </rect>
  <rect x="413" y="310" width="74" height="0" opacity="0.9" class="fill-y">
    <animate attributeName="height" values="0;154;154;4;4;154;154" keyTimes="0;0.35;0.5;0.85;0.9;0.97;1" dur="12s" repeatCount="indefinite" />
    <animate attributeName="y" values="310;156;156;306;306;156;156" keyTimes="0;0.35;0.5;0.85;0.9;0.97;1" dur="12s" repeatCount="indefinite" />
  </rect>
  <rect x="573" y="310" width="74" height="0" opacity="0.85" class="fill-b">
    <animate attributeName="height" values="0;154;154;4;4;216;216" keyTimes="0;0.35;0.5;0.85;0.9;0.97;1" dur="12s" repeatCount="indefinite" />
    <animate attributeName="y" values="310;156;156;306;306;94;94" keyTimes="0;0.35;0.5;0.85;0.9;0.97;1" dur="12s" repeatCount="indefinite" />
  </rect>

  
  <g opacity="0" class="fill-muted">
    <animate attributeName="opacity" values="0;0;0.55;0.55;0;0" keyTimes="0;0.36;0.4;0.88;0.92;1" dur="12s" repeatCount="indefinite" />
    <rect x="93" y="94" width="74" height="58" />
    <rect x="253" y="94" width="74" height="58" />
    <rect x="573" y="94" width="74" height="58" />
  </g>
  <g font-size="12" text-anchor="middle" opacity="0" class="fill-ink">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.36;0.4;0.88;0.92;1" dur="12s" repeatCount="indefinite" />
    <text x="130" y="128">用不上</text>
    <text x="290" y="128">用不上</text>
    <text x="610" y="128">用不上</text>
  </g>

  <g font-size="13" text-anchor="middle" font-weight="bold" class="fill-ink">
    <text x="130" y="332">1 号 50Ah</text>
    <text x="290" y="332">2 号 50Ah</text>
    <text x="450" y="332">3 号 35Ah ⚠</text>
    <text x="610" y="332">4 号 50Ah</text>
  </g>

  
  <g font-size="13" font-weight="bold" text-anchor="middle" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.58;0.83;0.86;1" dur="12s" repeatCount="indefinite" />
    <text x="130" y="350" class="ok">≈3.1V</text>
    <text x="290" y="350" class="ok">≈3.1V</text>
    <text x="450" y="350" class="warn">2.55V ⚠
      <animate attributeName="opacity" values="1;0.3;1" dur="0.7s" repeatCount="indefinite" />
    </text>
    <text x="610" y="350" class="ok">≈3.1V</text>
  </g>

  
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.30;0.34;1" dur="12s" repeatCount="indefinite" />
    <text x="400" y="375" text-anchor="middle" font-size="14" class="txt">充电：串联电流相同，四节以同样速度"进水"……但 3 号先到自己的满充线</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.35;0.38;0.50;0.53;1" dur="12s" repeatCount="indefinite" />
    <rect x="150" y="352" width="500" height="34" rx="8" class="fill-boxr stroke-r" />
    <text x="400" y="375" text-anchor="middle" font-size="14" font-weight="bold" class="warn">3 号先满 → BMS 必须停充！其他三节只能充到七成</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.58;0.83;0.86;1" dur="12s" repeatCount="indefinite" />
    <text x="400" y="375" text-anchor="middle" font-size="14" class="txt">放电：水位一起下降，但 3 号容量小、内阻大——它的端电压先跌破截止线 → 整组停放</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.88;0.92;1" dur="12s" repeatCount="indefinite" />
    <rect x="130" y="348" width="540" height="38" rx="8" class="fill-boxg stroke-g" />
    <text x="400" y="372" text-anchor="middle" font-size="14" font-weight="bold" class="ok">结论：整包可用容量被锁死在最弱单体上 —— 均衡就是要把浪费夺回来</text>
  </g>

  <text x="400" y="418" text-anchor="middle" font-size="13" class="small">而且最弱单体每次都工作在最极限的区间，老化更快 → 差距越拉越大（恶性循环）</text>
<rect x="24" y="448.0" width="752" height="188" rx="6" class="panel" /><text x="40" y="468.0" font-size="13" class="txt">底栏：另外三节是 50 Ah 时，整包可用 = 最弱那节</text><text x="40" y="484.0" font-size="12" class="small">可用 Ah</text><line x1="70.0" y1="484.0" x2="70.0" y2="598.0" stroke-width="1.5" class="stroke-axis" /><line x1="70.0" y1="598.0" x2="460.0" y2="598.0" stroke-width="1.5" class="stroke-axis" /><line x1="91.7" y1="598.0" x2="91.7" y2="603.0" class="stroke-axis" /><text x="91.7" y="616.0" text-anchor="middle" font-size="12" class="small">35</text><line x1="416.7" y1="598.0" x2="416.7" y2="603.0" class="stroke-axis" /><text x="416.7" y="616.0" text-anchor="middle" font-size="12" class="small">50</text><line x1="65.0" y1="574.2" x2="70.0" y2="574.2" class="stroke-axis" /><text x="62.0" y="578.2" text-anchor="end" font-size="12" class="small">35</text><line x1="65.0" y1="503.0" x2="70.0" y2="503.0" class="stroke-axis" /><text x="62.0" y="507.0" text-anchor="end" font-size="12" class="small">50</text><polyline points="91.7,574.2 102.5,571.9 113.3,569.5 124.2,567.1 135.0,564.8 145.8,562.4 156.7,560.0 167.5,557.6 178.3,555.2 189.2,552.9 200.0,550.5 210.8,548.1 221.7,545.8 232.5,543.4 243.3,541.0 254.2,538.6 265.0,536.2 275.8,533.9 286.7,531.5 297.5,529.1 308.3,526.8 319.2,524.4 330.0,522.0 340.8,519.6 351.7,517.2 362.5,514.9 373.3,512.5 384.2,510.1 395.0,507.8 405.8,505.4 416.7,503.0" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" class="stroke-r" /><polyline points="91.7,503.0 416.7,503.0" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" class="stroke-g" /><circle r="5" class="fill-y"><animate attributeName="cx" values="91.7;135.0;178.3;210.8;254.2;297.5;330.0;373.3;416.7" keyTimes="0.0000;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1.0000" dur="8s" repeatCount="indefinite" /><animate attributeName="cy" values="574.2;564.8;555.2;548.1;538.6;529.1;522.0;512.5;503.0" keyTimes="0.0000;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1.0000" dur="8s" repeatCount="indefinite" /></circle><text x="460.0" y="616.0" text-anchor="end" font-size="12" class="small">最弱节 Ah</text><text x="480" y="526.0" font-size="12" class="txt">图上的 35 Ah 把整包锁在 35，不是 50。</text>
</svg>