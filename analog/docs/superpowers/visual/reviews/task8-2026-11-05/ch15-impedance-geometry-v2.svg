<text x="52" y="58" font-size="38" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">同一阻抗，线宽随叠层改变</text><text x="52" y="94" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">示意 50 Ω 微带：εr = 4.2、铜厚 0.035 mm；使用同一近似式。</text>
<rect x="50" y="150" width="430" height="360" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<text x="74" y="192" font-size="24" fill="#1f5d7a" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">参考面距离 h = 1.6 mm</text>
<text x="265" y="260" font-size="28" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="middle">w ≈ 3.022 mm</text>
<rect x="180" y="300" width="170" height="14" fill="#1f5d7a"/>
<rect x="110" y="320" width="310" height="70" fill="#f6eedb" stroke="#c9bb9d"/>
<path d="M110 398 Q265.00 398.97 420 398" fill="none" stroke="#37424e" stroke-width="6"/>
<text x="265" y="448" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">信号铜 → 介质 → 参考面</text>
<text x="265" y="486" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">剖面示意，不按尺寸比例</text>
<rect x="520" y="150" width="430" height="360" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<text x="544" y="192" font-size="24" fill="#3d6b4a" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">参考面距离 h = 0.2 mm</text>
<text x="735" y="260" font-size="28" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="middle">w ≈ 0.339 mm</text>
<rect x="650" y="300" width="170" height="14" fill="#3d6b4a"/>
<rect x="580" y="320" width="310" height="70" fill="#f6eedb" stroke="#c9bb9d"/>
<path d="M580 398 Q735.00 397.65 890 398" fill="none" stroke="#37424e" stroke-width="6"/>
<text x="735" y="448" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">信号铜 → 介质 → 参考面</text>
<text x="735" y="486" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">剖面示意，不按尺寸比例</text>
<text x="60" y="562" font-size="24" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">Z₀ ≈ 87/√(εr+1.41) × ln[5.98h/(0.8w+t)]</text>
<text x="60" y="610" font-size="22" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">双层板也能控阻抗；粗线占空间，须与板厂确认实际叠层与公差。</text>
<text x="60" y="658" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">差分阻抗还取决于线间耦合，不能由这条单端公式直接推出。</text>
</svg>
