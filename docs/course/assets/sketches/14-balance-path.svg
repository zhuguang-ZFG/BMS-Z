<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
<title id="title">旁路泄放，电量变成热</title><desc id="desc">单节两端并接受控开关和泄放电阻，常规电流沿电芯正端进入闭合开关及电阻，再回负端。单节4伏、泄放0.05安培，电阻发热0.20瓦；去掉0.10安时需连续导通2小时。本图仅为单节旁路，没有把电量转入另一节。</desc>
