<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440">
  <title>温度对电池影响动画</title>
  <rect width="800" height="440" fill="#f8fafc"/>
  <style>
  text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
  /* 深色模式：GitHub 深色主题下对调底色与文字色，只覆盖配色，不动几何与动画。
     stroke="#fff" 保持白色——那是彩色徽标上的勾选，不在覆盖范围内。 */
  @media (prefers-color-scheme: dark){
  rect[fill="#f8fafc"]{fill:#0f172a}
  rect[fill="#fff"]{fill:#1e293b}
  [fill="#f1f5f9"]{fill:#1e293b}
  [stroke="#f1f5f9"]{stroke:#1e293b}
  [fill="#e2e8f0"]{fill:#334155}
  [stroke="#e2e8f0"]{stroke:#334155}
  [fill="#cbd5e1"]{fill:#475569}
  [stroke="#cbd5e1"]{stroke:#475569}
  [fill="#64748b"]{fill:#94a3b8}
  [stroke="#64748b"]{stroke:#94a3b8}
  [fill="#475569"]{fill:#cbd5e1}
  [stroke="#475569"]{stroke:#cbd5e1}
  [fill="#334155"]{fill:#e2e8f0}
  [stroke="#334155"]{stroke:#e2e8f0}
  [fill="#1e293b"]{fill:#f1f5f9}
  [stroke="#1e293b"]{stroke:#f1f5f9}
  [fill="#dbeafe"]{fill:#1e3a8a}
  [stroke="#dbeafe"]{stroke:#1e3a8a}
  [fill="#eff6ff"]{fill:#172554}
  [stroke="#eff6ff"]{stroke:#172554}
  [fill="#bfdbfe"]{fill:#1e40af}
  [stroke="#bfdbfe"]{stroke:#1e40af}
  [fill="#1d4ed8"]{fill:#60a5fa}
  [stroke="#1d4ed8"]{stroke:#60a5fa}
  [fill="#1e40af"]{fill:#93c5fd}
  [stroke="#1e40af"]{stroke:#93c5fd}
  [fill="#2563eb"]{fill:#60a5fa}
  [stroke="#2563eb"]{stroke:#60a5fa}
  [fill="#3b82f6"]{fill:#60a5fa}
  [stroke="#3b82f6"]{stroke:#60a5fa}
  [fill="#ecfdf5"]{fill:#022c22}
  [stroke="#ecfdf5"]{stroke:#022c22}
  [fill="#a7f3d0"]{fill:#065f46}
  [stroke="#a7f3d0"]{stroke:#065f46}
  [fill="#86efac"]{fill:#166534}
  [stroke="#86efac"]{stroke:#166534}
  [fill="#065f46"]{fill:#6ee7b7}
  [stroke="#065f46"]{stroke:#6ee7b7}
  [fill="#059669"]{fill:#34d399}
  [stroke="#059669"]{stroke:#34d399}
  [fill="#fef2f2"]{fill:#450a0a}
  [stroke="#fef2f2"]{stroke:#450a0a}
  [fill="#fecaca"]{fill:#7f1d1d}
  [stroke="#fecaca"]{stroke:#7f1d1d}
  [fill="#fca5a5"]{fill:#b91c1c}
  [stroke="#fca5a5"]{stroke:#b91c1c}
  [fill="#991b1b"]{fill:#fca5a5}
  [stroke="#991b1b"]{stroke:#fca5a5}
  [fill="#dc2626"]{fill:#f87171}
  [stroke="#dc2626"]{stroke:#f87171}
  [fill="#fffbeb"]{fill:#451a03}
  [stroke="#fffbeb"]{stroke:#451a03}
  [fill="#fef3c7"]{fill:#78350f}
  [stroke="#fef3c7"]{stroke:#78350f}
  [fill="#92400e"]{fill:#fcd34d}
  [stroke="#92400e"]{stroke:#fcd34d}
  [fill="#b45309"]{fill:#fbbf24}
  [stroke="#b45309"]{stroke:#fbbf24}
  }
</style>

  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">温度：电池的两副面孔</text>

  <!-- 顶部温度计：-20℃ ~ 60℃，绿区 15~35℃ -->
  <rect x="200" y="58" width="400" height="12" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <rect x="375" y="58" width="100" height="12" fill="#a7f3d0"/>
  <text x="200" y="86" text-anchor="middle" font-size="11" fill="#475569">-20℃</text>
  <text x="300" y="86" text-anchor="middle" font-size="11" fill="#475569">0℃</text>
  <text x="425" y="86" text-anchor="middle" font-size="11" fill="#065f46">舒适区</text>
  <text x="600" y="86" text-anchor="middle" font-size="11" fill="#475569">60℃</text>
  <circle cy="64" r="9" fill="#10b981" cx="400">
    <!-- 指针颜色：绿->蓝->红 表达 舒适->低温析锂->高温风险。
         绿色段用 #10b981 而非调色板绿，因为它在深色模式下调回同色（无重映射规则），
         保持绿色符号语义且不会产生压掉 CSS 覆盖的 SMIL 阴影值。 -->
    <animate attributeName="cx" values="400;400;275;275;525;525" keyTimes="0;0.2;0.28;0.48;0.56;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#34d399;#34d399;#60a5fa;#60a5fa;#f87171;#f87171" keyTimes="0;0.2;0.28;0.48;0.56;1" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- 左面板：低温充电析锂 -->
  <text x="220" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">低温充电：析锂</text>
  <rect x="100" y="140" width="240" height="150" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <rect x="100" y="140" width="60" height="150" fill="#fecaca"/>
  <rect x="280" y="140" width="60" height="150" fill="#bfdbfe"/>
  <text x="130" y="305" text-anchor="middle" font-size="12" fill="#475569">正极</text>
  <text x="220" y="305" text-anchor="middle" font-size="12" fill="#475569">电解液</text>
  <text x="310" y="305" text-anchor="middle" font-size="12" fill="#475569">负极</text>
  <text x="160" y="136" text-anchor="start" font-size="12" font-weight="bold" fill="#2563eb" opacity="0">充电电流 →
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.33;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- Li⁺ 向负极迁移，却被挡在表面 -->
  <circle r="5" fill="#10b981" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.31;1" dur="12s" repeatCount="indefinite"/>
    <animateMotion path="M150,180 L272,180" keyPoints="0;0;1;1" keyTimes="0;0.28;0.5;1" calcMode="linear" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#10b981" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.31;1" dur="12s" repeatCount="indefinite"/>
    <animateMotion path="M140,215 L272,215" keyPoints="0;0;1;1" keyTimes="0;0.28;0.5;1" calcMode="linear" dur="12s" repeatCount="indefinite" begin="-1s"/>
  </circle>
  <circle r="5" fill="#10b981" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.31;1" dur="12s" repeatCount="indefinite"/>
    <animateMotion path="M155,250 L272,250" keyPoints="0;0;1;1" keyTimes="0;0.28;0.5;1" calcMode="linear" dur="12s" repeatCount="indefinite" begin="-2s"/>
  </circle>

  <!-- 金属锂枝晶在负极表面长出 -->
  <path d="M282,180 L314,190" fill="none" stroke="#64748b" stroke-width="3" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.36;0.52;1" dur="12s" repeatCount="indefinite"/>
  </path>
  <path d="M282,215 L318,215" fill="none" stroke="#64748b" stroke-width="3" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.38;0.54;1" dur="12s" repeatCount="indefinite"/>
  </path>
  <path d="M282,250 L312,242" fill="none" stroke="#64748b" stroke-width="3" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.4;0.56;1" dur="12s" repeatCount="indefinite"/>
  </path>
  <text x="220" y="330" text-anchor="middle" font-size="12" fill="#dc2626" opacity="0">Li⁺ 挤不进负极，在表面镀成金属锂
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.36;0.42;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="220" y="352" text-anchor="middle" font-size="12" fill="#991b1b" opacity="0">枝晶可能刺穿隔膜 → 内短路
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.44;0.5;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- 右面板：高温老化加速 -->
  <text x="580" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">高温：老化加速</text>
  <rect x="460" y="140" width="240" height="150" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <rect x="460" y="140" width="60" height="150" fill="#fecaca"/>
  <rect x="640" y="140" width="60" height="150" fill="#bfdbfe"/>
  <rect x="636" y="140" width="2" height="150" fill="#f59e0b" opacity="0.7">
    <animate attributeName="width" values="2;2;2;14;14" keyTimes="0;0.56;0.62;0.8;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="x" values="636;636;636;624;624" keyTimes="0;0.56;0.62;0.8;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text x="618" y="130" text-anchor="end" font-size="11" fill="#b45309" opacity="0">SEI 变厚
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7;0.75;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <circle r="4" fill="#fca5a5" opacity="0">
    <animate attributeName="opacity" values="0;0;0.8;0.8;0" keyTimes="0;0.62;0.66;0.95;1" dur="12s" repeatCount="indefinite"/>
    <animateMotion path="M560,265 L560,150" keyPoints="0;0;1;1" keyTimes="0;0.62;0.95;1" calcMode="linear" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#fca5a5" opacity="0">
    <animate attributeName="opacity" values="0;0;0.8;0.8;0" keyTimes="0;0.66;0.7;0.97;1" dur="12s" repeatCount="indefinite"/>
    <animateMotion path="M590,270 L590,155" keyPoints="0;0;1;1" keyTimes="0;0.66;0.97;1" calcMode="linear" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#fca5a5" opacity="0">
    <animate attributeName="opacity" values="0;0;0.8;0.8;0" keyTimes="0;0.7;0.74;0.99;1" dur="12s" repeatCount="indefinite"/>
    <animateMotion path="M535,268 L535,152" keyPoints="0;0;1;1" keyTimes="0;0.7;0.99;1" calcMode="linear" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- 容量永久缩水 -->
  <rect x="470" y="322" width="200" height="14" fill="#a7f3d0" stroke="#059669" stroke-width="1.5"/>
  <rect x="670" y="322" width="0" height="14" fill="#dc2626" opacity="0.75">
    <animate attributeName="width" values="0;0;70;70" keyTimes="0;0.62;0.85;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="x" values="670;670;600;600" keyTimes="0;0.62;0.85;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text x="570" y="354" text-anchor="middle" font-size="12" fill="#991b1b" opacity="0">副反应加速，容量永久缩水
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.72;0.78;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- 第四幕：BMS 对策卡 -->
  <rect x="150" y="372" width="500" height="30" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.72;0.78;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text x="400" y="391" text-anchor="middle" font-size="13" fill="#1e40af" opacity="0">BMS 对策：看温度限功率——低温先砍充电，高温充放都限
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.72;0.78;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <text x="400" y="424" text-anchor="middle" font-size="13" fill="#475569">关键：低温怕充电（析锂），高温怕一切（老化）；功率限制先看温度计。</text>
</svg>
