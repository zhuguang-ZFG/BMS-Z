<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">
  <title id="title">教学帧布局：AA 55 帧头、addr、cmd、len、data、crc8，总长 6+len 字节</title>
  <desc id="desc">上行按字段给出字节数：帧头 2 字节，addr/cmd/len 各 1 字节，data 为 len 字节（0 到 64），crc8 1 字节。下行给出正文实例好帧 aa 55 01 03 02 0e a0 31，共 8 字节，CRC 覆盖 addr 到 data 共 5 字节，不含帧头。接收端检查顺序：一找帧头、二查长度、三收齐、四验 CRC、五核对身份与新鲜度。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="420" fill="#f8fafc"/>
  <text x="24" y="36" font-size="18" font-weight="700" fill="#0f172a">教学帧：总长 6 + len 字节，CRC 覆盖 addr..data</text>

  <!-- 接收端检查顺序 -->
  <g>
    <rect x="66" y="54" width="150" height="36" rx="18" fill="#ffffff" stroke="#d8dee9" stroke-width="2"/>
    <circle cx="84" cy="72" r="11" fill="#1d4ed8"/>
    <text x="84" y="76" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="102" y="76" font-size="13" fill="#0f172a">找帧头 AA 55</text>
    <line x1="220" y1="72" x2="238" y2="72" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="242" y="54" width="165" height="36" rx="18" fill="#ffffff" stroke="#d8dee9" stroke-width="2"/>
    <circle cx="260" cy="72" r="11" fill="#1d4ed8"/>
    <text x="260" y="76" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="278" y="76" font-size="13" fill="#0f172a">查长度 len ≤ 64</text>
    <line x1="411" y1="72" x2="427" y2="72" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="431" y="54" width="165" height="36" rx="18" fill="#ffffff" stroke="#d8dee9" stroke-width="2"/>
    <circle cx="449" cy="72" r="11" fill="#1d4ed8"/>
    <text x="449" y="76" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="467" y="76" font-size="13" fill="#0f172a">收齐 6+len 字节</text>
    <line x1="600" y1="72" x2="616" y2="72" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="620" y="54" width="120" height="36" rx="18" fill="#ffffff" stroke="#d8dee9" stroke-width="2"/>
    <circle cx="638" cy="72" r="11" fill="#1d4ed8"/>
    <text x="638" y="76" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="656" y="76" font-size="13" fill="#0f172a">验 CRC-8</text>
    <line x1="744" y1="72" x2="760" y2="72" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="764" y="54" width="140" height="36" rx="18" fill="#ffffff" stroke="#d8dee9" stroke-width="2"/>
    <circle cx="782" cy="72" r="11" fill="#1d4ed8"/>
    <text x="782" y="76" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <text x="800" y="76" font-size="13" fill="#0f172a">身份/新鲜度</text>
    <text x="936" y="110" font-size="12" fill="#475569" text-anchor="end">⑤ 身份、序号、新鲜度：结构合法后由第 18 章继续核对</text>
  </g>

  <!-- 上行：字段与字节数（1 格 = 1 字节，data 随 len 伸缩） -->
  <text x="148" y="156" font-size="13" fill="#475569" text-anchor="end">字段</text>
  <g text-anchor="middle">
    <rect x="160" y="128" width="128" height="48" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="224" y="150" font-size="14" font-weight="700" fill="#1d4ed8">帧头 AA 55</text>
    <text x="224" y="168" font-size="12" fill="#475569">2 B</text>
    <rect x="288" y="128" width="64" height="48" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="320" y="150" font-size="13" font-weight="700" fill="#0f766e">addr</text>
    <text x="320" y="168" font-size="12" fill="#475569">1 B</text>
    <rect x="352" y="128" width="64" height="48" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="384" y="150" font-size="13" font-weight="700" fill="#0f766e">cmd</text>
    <text x="384" y="168" font-size="12" fill="#475569">1 B</text>
    <rect x="416" y="128" width="64" height="48" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
    <text x="448" y="150" font-size="13" font-weight="700" fill="#b45309">len</text>
    <text x="448" y="168" font-size="12" fill="#475569">1 B</text>
    <rect x="480" y="128" width="256" height="48" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="608" y="150" font-size="13" font-weight="700" fill="#6d28d9">data 载荷</text>
    <text x="608" y="168" font-size="12" fill="#475569">len B · 0–64，随 len 伸缩</text>
    <rect x="736" y="128" width="64" height="48" fill="#fff1f2" stroke="#be123c" stroke-width="2"/>
    <text x="768" y="150" font-size="13" font-weight="700" fill="#be123c">crc8</text>
    <text x="768" y="168" font-size="12" fill="#475569">1 B</text>
  </g>

  <!-- 下行：正文实例好帧（1 格 = 1 字节） -->
  <text x="148" y="222" font-size="13" fill="#475569" text-anchor="end">正文实例</text>
  <text x="148" y="240" font-size="12" fill="#475569" text-anchor="end">好帧 8 B</text>
  <g text-anchor="middle" font-size="14" font-weight="700">
    <rect x="160" y="204" width="64" height="44" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="192" y="232" fill="#1d4ed8">aa</text>
    <rect x="224" y="204" width="64" height="44" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="256" y="232" fill="#1d4ed8">55</text>
    <rect x="288" y="204" width="64" height="44" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="320" y="232" fill="#0f766e">01</text>
    <rect x="352" y="204" width="64" height="44" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="384" y="232" fill="#0f766e">03</text>
    <rect x="416" y="204" width="64" height="44" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
    <text x="448" y="232" fill="#b45309">02</text>
    <rect x="480" y="204" width="64" height="44" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
    <text x="512" y="232" fill="#6d28d9">0e</text>
    <rect x="544" y="204" width="64" height="44" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
    <text x="576" y="232" fill="#6d28d9">a0</text>
    <rect x="608" y="204" width="64" height="44" fill="#fff1f2" stroke="#be123c" stroke-width="2"/>
    <text x="640" y="232" fill="#be123c">31</text>
  </g>
  <text x="688" y="222" font-size="12" fill="#475569">len = 2 → 总长 6 + 2 = 8 B</text>
  <text x="688" y="242" font-size="12" fill="#475569">addr=1 · cmd=3 · data=0e a0</text>

  <!-- CRC 覆盖范围：字节 2–6（addr..data） -->
  <path d="M288 256 L288 264 L608 264 L608 256" fill="none" stroke="#be123c" stroke-width="2"/>
  <text x="448" y="288" font-size="13" fill="#be123c" text-anchor="middle">CRC-8/ATM 覆盖 addr..data（本例 5 字节：01 03 02 0e a0），不含帧头</text>

  <text x="24" y="320" font-size="13" fill="#475569">载荷里可以出现 AA 55：合法帧内不抢帧头；坏帧只排除当前帧头，余下字节重新扫描；孤立 AA 留给下一字节。</text>
  <text x="24" y="342" font-size="13" fill="#475569">len &gt; MAX_LEN = 64 → bad_len +1；CRC 错 → 丢弃并 bad_crc +1，不能静默；len = 0 也合法（总长 6 B），最大帧 70 B。</text>

  <rect x="24" y="362" width="912" height="40" rx="10" fill="#0f172a"/>
  <text x="480" y="388" font-size="14" fill="#e2e8f0" text-anchor="middle">分块是操作系统交货的形状，长度、CRC 与明确超时才是协议边界。</text>
</svg>
