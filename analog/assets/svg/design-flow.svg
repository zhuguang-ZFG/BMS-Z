<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">从需求到打样：六步流程</text>

<text x="400" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#37424e">六步一链，粒子从头走到尾——仿真不过，沿橙色回环回炉</text>
<rect x="19" y="105" width="116" height="120" rx="12" fill="#f6eedb" stroke="#1f5d7a" stroke-width="2.5"/><circle cx="37" cy="127" r="11" fill="#1f5d7a"/><text x="37" y="131" text-anchor="middle" font-size="11" font-weight="bold" fill="#fdf8ea">1</text><text x="77" y="155" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#16202b">需求指标</text><text x="77" y="179" text-anchor="middle" font-size="9.5" fill="#5b666f">精度/带宽/功耗/温度</text><line x1="135" y1="165" x2="148" y2="165" stroke="#37424e" stroke-width="2"/><polygon points="151,165 144,160 144,170" fill="#37424e"/><rect x="148" y="105" width="116" height="120" rx="12" fill="#f6eedb" stroke="#1f5d7a" stroke-width="2.5"/><circle cx="166" cy="127" r="11" fill="#1f5d7a"/><text x="166" y="131" text-anchor="middle" font-size="11" font-weight="bold" fill="#fdf8ea">2</text><text x="206" y="155" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#16202b">拓扑选择</text><text x="206" y="179" text-anchor="middle" font-size="9.5" fill="#5b666f">差分/单端、LDO/DCDC</text><line x1="264" y1="165" x2="277" y2="165" stroke="#37424e" stroke-width="2"/><polygon points="280,165 273,160 273,170" fill="#37424e"/><rect x="277" y="105" width="116" height="120" rx="12" fill="#f6eedb" stroke="#6b3f63" stroke-width="2.5"/><circle cx="295" cy="127" r="11" fill="#6b3f63"/><text x="295" y="131" text-anchor="middle" font-size="11" font-weight="bold" fill="#fdf8ea">3</text><text x="335" y="155" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#16202b">器件选型</text><text x="335" y="179" text-anchor="middle" font-size="9.5" fill="#5b666f">绝对最大额定→电特性</text><line x1="393" y1="165" x2="406" y2="165" stroke="#37424e" stroke-width="2"/><polygon points="409,165 402,160 402,170" fill="#37424e"/><rect x="406" y="105" width="116" height="120" rx="12" fill="#f6eedb" stroke="#6b3f63" stroke-width="2.5"/><circle cx="424" cy="127" r="11" fill="#6b3f63"/><text x="424" y="131" text-anchor="middle" font-size="11" font-weight="bold" fill="#fdf8ea">4</text><text x="464" y="155" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#16202b">仿真验证</text><text x="464" y="179" text-anchor="middle" font-size="9.5" fill="#5b666f">DC/瞬态/AC/温度</text><line x1="522" y1="165" x2="535" y2="165" stroke="#37424e" stroke-width="2"/><polygon points="538,165 531,160 531,170" fill="#37424e"/><rect x="535" y="105" width="116" height="120" rx="12" fill="#f6eedb" stroke="#a4630f" stroke-width="2.5"/><circle cx="553" cy="127" r="11" fill="#a4630f"/><text x="553" y="131" text-anchor="middle" font-size="11" font-weight="bold" fill="#fdf8ea">5</text><text x="593" y="155" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#16202b">降额与保护</text><text x="593" y="179" text-anchor="middle" font-size="9.5" fill="#5b666f">电容50-80%、电阻50%</text><line x1="651" y1="165" x2="664" y2="165" stroke="#37424e" stroke-width="2"/><polygon points="667,165 660,160 660,170" fill="#37424e"/><rect x="664" y="105" width="116" height="120" rx="12" fill="#f6eedb" stroke="#3d6b4a" stroke-width="2.5"/><circle cx="682" cy="127" r="11" fill="#3d6b4a"/><text x="682" y="131" text-anchor="middle" font-size="11" font-weight="bold" fill="#fdf8ea">6</text><text x="722" y="155" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#16202b">打样测试</text><text x="722" y="179" text-anchor="middle" font-size="9.5" fill="#5b666f">指标对照、不过回炉</text><g filter="url(#pglow)"><circle r="5" fill="#3d6b4a"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M29,165 H770" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle>
<circle r="5" fill="#3d6b4a"><animateMotion dur="12s" begin="3.50s" repeatCount="indefinite" path="M29,165 H770" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle>
<circle r="5" fill="#3d6b4a"><animateMotion dur="12s" begin="7.50s" repeatCount="indefinite" path="M29,165 H770" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle></g><path d="M464,105 Q399.5,80 335,105" fill="none" stroke="#a4630f" stroke-width="2" stroke-dasharray="4,3"/><g filter="url(#pglow)"><circle r="4.5" fill="#a4630f"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M464,105 Q399.5,80 335,105" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle></g>
<text x="400" y="400" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#37424e">流程是螺旋不是直线：仿真验证不过 → 回炉改选型/降额——指标逐条对照再进下一步</text>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.00;0.02;0.25;0.27;1" dur="12s" repeatCount="indefinite"/><rect x="134.4" y="316.9" width="531.2" height="24.1" rx="12.0" fill="#1f5d7a" fill-opacity="0.09" stroke="#1f5d7a" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.00;0.02;0.25;0.27;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="330" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1f5d7a" opacity="0">① 需求指标先行：把"好用"翻译成数字——精度 mV？带宽 Hz？功耗 mA？<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.00;0.02;0.25;0.27;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.25;0.27;0.50;0.52;1" dur="12s" repeatCount="indefinite"/><rect x="138.6" y="316.9" width="522.8" height="24.1" rx="12.0" fill="#1f5d7a" fill-opacity="0.09" stroke="#1f5d7a" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.50;0.52;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="330" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1f5d7a" opacity="0">② 先选架构再选器件：差分还是单端？LDO 还是 DCDC？反馈还是开环？<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.50;0.52;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.50;0.52;0.75;0.77;1" dur="12s" repeatCount="indefinite"/><rect x="165.9" y="316.9" width="468.2" height="24.1" rx="12.0" fill="#6b3f63" fill-opacity="0.09" stroke="#6b3f63" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.52;0.75;0.77;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="330" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#6b3f63" opacity="0">③ 读 datasheet：绝对最大额定值 → 电特性表 → 典型特性曲线<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.52;0.75;0.77;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.75;0.77;1" dur="12s" repeatCount="indefinite"/><rect x="114.1" y="316.9" width="571.9" height="24.1" rx="12.0" fill="#a4630f" fill-opacity="0.09" stroke="#a4630f" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.77;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="330" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#a4630f" opacity="0">④ 降额设计：额定值是"会死的边界"，不是工作点——电容 50~80%、电阻 50%<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.77;1" dur="12s" repeatCount="indefinite"/></text></g>
