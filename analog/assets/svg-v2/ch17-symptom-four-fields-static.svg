<text x="80" y="332" font-size="12" fill="#16202b">症状先记录——动手之后，</text>
<text x="80" y="354" font-size="12" fill="#16202b">这些空格再也没法补。</text></g>
<rect x="24" y="556" width="912" height="34" rx="9" fill="#f7eedb" stroke="#c9bb9d" stroke-width="1.2"/>
