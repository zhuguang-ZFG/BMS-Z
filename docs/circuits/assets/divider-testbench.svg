<svg xmlns="http://www.w3.org/2000/svg" width="800" height="700" viewBox="0 -156 800 700" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>保护板实测台示意图：一台电源、一串分压电阻、保护板和万用表。不要用真电池做过充，共地多路电源会把串短路。</title>
