changes:
- id: ch05-capacitive-energy-v2
  source: docs/p1-06-ch5.md#5.1
  before: '**动态功耗的账**：CMOS 推挽静态几乎不耗电，动态功耗 $P=C_LV_{DD}^2f$。每翻转一次，负载电容被充放一次，能量 $CV^2$ 的一半耗在上管、一半耗在下管。


    一根 20pF 信号线在 5V、10MHz 下只有 5mW，看似无事。64 根数据总线一起翻转就是 320mW，再叠加直通电流项——SoC 的功耗预算里输出级一直占大头。


    直通损耗与边沿时间正相关：栅驱动越慢，上下管共同导通的窗口越宽。所以给逻辑输入加 RC 滤波拖慢边沿，代价是驱动它的那颗芯片直通损耗上升。滤波是全局决策，不是免费的。


    **算一笔**（同一根线，只降电压）：20pF、10MHz 不变，$V_{DD}$ 从 5V 降到 3.3V——$P=CV^2f$ 从 5mW 掉到 $3.3^2\times20\text{pF}\times10\text{MHz}=2.2\text{mW}$。功耗按
    $V^2$ 缩、省 56%，这就是低压 SoC 省电的第一性原因；代价是噪声容限与 $V_{IH}/V_{OL}$ 预算同步收紧（5.2 的合围要重跑）。'
  after: '**电容负载的能量**：一次完整充放电周期，电源提供 $C_LV_{DD}^2$。充电后电容存有一半能量，另一半耗在充电路径；放电时储能再耗在放电路径。这里 $f$ 指完整充放电周期频率，若用总边沿率，须另计活动率。


    **算一笔**（20 pF 负载 10 MHz 翻转的能量账）：20 pF、5 V、10 MHz 对应每周期 0.5 nJ、平均 5 mW；64 根线都按此频率翻转约 320 mW。电压改为 3.3 V 得 2.178 mW（约 2.2 mW），下降约 56%，但仍需另外算直通、漏电及负载直流功率。


    输入 RC 会拖慢接收端输入沿，可能增大**接收芯片**的直通电流。必须满足接收端允许的输入转换时间，或选合适的施密特输入。'
  caption: 同一条能量轴上追踪供能、储能和耗散；频率按完整充放电周期计。
  removed_prose_chars: 147
  relationship: replaces-text
- id: ch05-ground-bounce-v2
  source: docs/p1-06-ch5.md#5.1
  before: '地弹值得一提。8 个输出同时翻转、每个 20mA 时，公共地引脚上流过 160mA 的瞬时电流，走线电感上产生 $L\,\mathrm{d}i/\mathrm{d}t$ 的压降，把"地"本身弹起来，其他安静输出的电平跟着抖。


    这就是为什么大电流翻转要分散、地引脚要够多、高档驱动要省着用。'
  after: '**地弹看变化率**：示意 8 路各 20 mA，总回流从零升到 160 mA；若用时 2 ns，共用电感 5 nH，则 $L\,di/dt=0.4$ V。只有一路时为 0.05 V。电流停止变化后，理想电感压降回到零；真实回路还会因寄生电容而振铃。分散翻转、缩短回流与合理降低沿速都能减轻它。'
  caption: 地弹由电流斜率产生，电流恒定时理想电感压降归零。
  removed_prose_chars: 3
  relationship: replaces-text
- id: ch05-pullup-window-v2
  source: docs/p1-06-ch5.md#5.2
  before: '**上拉电阻计算**（速度 vs 功耗的权衡）：


    - 下限（驱动能力）：$R_{p(min)} = \frac{V_{DD}-V_{OL(max)}}{I_{OL}}$，I2C 标准模式典型 3mA → 5V 系统约 1.5kΩ 起

    - 上限（上升时间）：总线电容 $C_b$ 充电，$t_r ≈ 0.8473 \times R_p \times C_b$，I2C 快速模式要求 $t_r<300ns$、$C_b<400pF$ →
    $R_p \lesssim \dfrac{300ns}{0.8473\times400pF}\approx890\Omega$（工程上取 820Ω；总线电容只有 100pF 时才放宽到 3.5kΩ）

    - 经验值：**I2C 常用 2.2kΩ~4.7kΩ**；低速/长线偏大，高速/短距离偏小


    **0.8473 从哪来**：I²C 规范把上升时间定义为从 30% 爬到 70% $V_{DD}$ 的时间。RC 充电 $V(t)=V_{DD}(1-e^{-t/\tau})$，对 30% 与
    70% 分别解出 $t_1=0.357\tau$、$t_2=1.204\tau$，相减得 $t_r=0.847\tau$。它是纯几何结果，与电压无关，3.3V 与 5V 总线同值。


    下降沿是另一回事：开漏管主动灌电流，时间由导通电阻决定，几十 ns，与 Rp 无关。所以 I²C 波形总是"缓升陡降"，示波器上一眼认出。


    这也解释了为什么重载总线上减小 Rp 改善的只有上升沿，下降沿纹丝不动。


    **Rp 的四个约束一起看**：除了上文的速度上限与驱动下限，还有两条常被漏掉。


    **其三是总线漏电流**：全部挂网器件在高温下的漏电叠加（每个 1~10µA），漏电在 Rp 上的压降不能把高电平拉出 $V_{IH}$，即 $R_p\le\dfrac{V_{DD}-V_{IH}}{I_{leak}}$。长总线、宽温、多器件时这条常先卡住。


    **其四是 sink 能力复核**：Rp 取小后，拉低器件要灌 $V_{DD}/R_p$；多主仲裁时两主同时拉低，电流叠加，仍须留在 $I_{OL}$ 额定内。3.3V 配 1kΩ、两主冲突即 6.6mA，已超标准模式
    3mA 规格。先确认你的总线跑的是哪种模式等级，再决定放多小。'
  after: '**上拉先求可行区间**：


    - 驱动下限：$R_{p,min}=(V_{DD}-V_{OL,max})/I_{OL}$。3.3 V、0.4 V、3 mA 得 967 Ω；5 V 同条件得约 1.53 kΩ。

    - 速度上限：$R_{p,max}=t_{r,max}/(0.8473C_b)$。快速模式 300 ns、100 pF 得约 3.54 kΩ（3541 Ω）；400 pF 只剩约 885 Ω，低于前述
    967 Ω，区间为空，不能直接选 820 Ω。

    - 漏电上限：$R_p\le(V_{DD}-V_{IH})/I_{leak}$。3.3 V、$V_{IH}=2.31$ V、总漏电 10 µA 得 99 kΩ；本例由速度先限制。器件漏电常为 1–10
    µA 量级，须按高温保证值累计。


    区间为空时降低电容、改变速率或选择满足所需灌电流的器件，再重新求交集。2.2–4.7 kΩ 不是通用答案，长线增加电容，也未必容许更大电阻。'
  caption: 下限大于上限时没有可用电阻；须改变电容、速率或灌电流能力。
  removed_prose_chars: 512
  relationship: replaces-text
