<path d="M230 180 L245 180" fill="none" stroke="#16202b" stroke-width="3"/><rect x="245" y="168" width="65" height="24" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/><path d="M310 180 L325 180" fill="none" stroke="#16202b" stroke-width="3"/><text x="277" y="152" font-size="23" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">Ro</text>
