<text x="480" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b">次谐波振荡：50% 占空比边界</text>
<text x="480" y="54" text-anchor="middle" font-size="12.5" fill="#5b666f">占空比一过 50% 就振、降到 50% 以下就好——这是它的指纹</text>
<rect x="56" y="92" width="380" height="120" rx="12" fill="#f6eedb" stroke="#c9bb9d" stroke-width="1.4"/>
<text x="80" y="122" font-size="12.5" font-weight="bold" fill="#37424e">占空比旋钮</text>
<line x1="90" y1="176" x2="402" y2="176" stroke="#c9bb9d" stroke-width="2.4"/>
<line x1="266" y1="150" x2="266" y2="200" stroke="#a8321f" stroke-width="1.6" stroke-dasharray="4,3"/>
<text x="266" y="214" text-anchor="middle" font-size="11" fill="#a8321f">50% 临界</text>
<rect x="460" y="92" width="440" height="220" rx="12" fill="#f6eedb" stroke="#c9bb9d" stroke-width="1.4"/>
<text x="484" y="120" font-size="11.5" fill="#5b666f">SW 节点波形</text>
<line x1="484" y1="290" x2="876" y2="290" stroke="#c9bb9d" stroke-width="1.2"/>
<g transform="translate(0 -4)"><circle cx="182" cy="176" r="13" fill="#e6eff3" stroke="#1f5d7a" stroke-width="2.4"/>
<text x="182" y="144" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f5d7a">40%</text>
<path d="M484,290 l30,-44 l30,44 l30,-44 l30,44 l30,-44 l30,44 l30,-44 l30,44 l30,-44 l30,44 l30,-44 l30,44 l30,-44" fill="none" stroke="#1f5d7a" stroke-width="2.2"/>
<text x="600" y="132" font-size="12.5" font-weight="bold" fill="#3d6b4a">降到 50% 以下：波形恢复规整</text>
<rect x="56" y="452" width="840" height="120" rx="12" fill="#e8efe6" stroke="#3d6b4a" stroke-width="2"/>
<text x="84" y="488" font-size="14" font-weight="bold" fill="#3d6b4a">边界指纹：占空比一过 50% 就振，降到 50% 以下就好</text>
<text x="84" y="516" font-size="12.5" fill="#16202b">一分钟验证：调高输入电压（减小占空比），看振荡是否消失。</text>
<text x="84" y="540" font-size="12.5" fill="#16202b">消失即次谐波振荡——加斜坡补偿或降低环路增益。</text></g>
<rect x="24" y="556" width="912" height="34" rx="9" fill="#f7eedb" stroke="#c9bb9d" stroke-width="1.2"/>
<text x="480" y="580" text-anchor="middle" font-size="13" font-weight="bold" fill="#3d6b4a">一过 50% 就振、降到 50% 以下就好——调高输入电压一分钟判明</text>
</svg>
