  <text class="hi" x="360" y="250">平台上电流几乎不动</text>
  <text class="warn" x="120" y="340">快放空时掉向 0</text>
  <circle class="doty" r="6"><animate data-ease="linear" attributeName="cx" values="720.0;657.2;594.4;406.0;217.6;154.8;142.2;123.4;104.6" keyTimes="0;0.1200;0.2500;0.5000;0.6200;0.7500;0.8500;0.9200;1" dur="12s" repeatCount="indefinite"/><animate data-ease="linear" attributeName="cy" values="242.2;293.3;321.3;329.7;337.4;373.0;388.3;400.0;400.0" keyTimes="0;0.1200;0.2500;0.5000;0.6200;0.7500;0.8500;0.9200;1" dur="12s" repeatCount="indefinite"/></circle>
  <text class="small" x="24" y="478">3.00 V、15 mΩ 和铁锂示意 OCV 是一套教学数。截止电压以规格书为准。这里还没把极化尾巴算进去。</text>
</svg>
