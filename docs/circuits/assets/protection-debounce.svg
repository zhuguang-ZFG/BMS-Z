  <text x="740" y="134" text-anchor="end" font-size="12" class="warn">阈值 4.25V（示例）</text>
  <text x="740" y="174" text-anchor="end" font-size="12" class="ok">恢复 4.15V</text>

  
  <path d="M80,210 L120,205 L160,215 L200,208 L240,212 L250,130 L262,122 L275,135 L288,200 L320,206 L360,212 L400,208 L430,180 L445,150 L460,128 L500,124 L540,130 L580,126 L620,132 L650,150 L680,165 L700,175 L730,195 L760,205" fill="none" stroke-width="2.5" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" opacity="0" class="stroke-b">
