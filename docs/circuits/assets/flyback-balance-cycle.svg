<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="ui-monospace, Consolas, monospace">
  <title>电感式主动均衡一个开关周期：电流爬到峰值，能量 ½LI² 再倒给低节。数字为示意，不写效率。</title>
  <desc>亮点跟着一个开关周期走：电感电流爬到峰值，能量存进磁件，再切到低节倒出来。</desc>

  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.5; fill: none; }
    .liney { stroke: #bf8700; stroke-width: 2.5; fill: none; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .dotg { fill: #1a7f37; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    .boxr { fill: #ffebe9; stroke: #cf222e; }
    .boxg { fill: #dafbe1; stroke: #1a7f37; }
    .boxy { fill: #fff8c5; stroke: #bf8700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .dotg { fill: #3fb950; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
      .boxr { fill: #3d1214; stroke: #ff7b72; }
      .boxg { fill: #12261e; stroke: #3fb950; }
      .boxy { fill: #3d2e00; stroke: #d29922; }
    }
  </style>

  <rect class="bg" width="800" height="460"/>

  <text class="title" x="24" y="32">电感均衡的一个开关周期：吸气、存能量、呼气（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="122" rx="6"/>
  <text class="txt" x="40" y="68" opacity="0.28">① 开关接到高节<tspan class="small">　示意 4.0 V 加在 10 µH 上，电流从 0 往上爬。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="94" opacity="0.28">② 电流到 2 A<tspan class="small">　时间大约 V/L 的斜率：4 V / 10 µH = 0.4 A/µs，爬到 2 A 约 5 µs。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="120" opacity="0.28">③ 能量在磁件里<tspan class="small">　½LI² = ½×10 µH×(2 A)² = 20 µJ。这一拍先存在电感里。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="146" opacity="0.28">④ 切到低节<tspan class="small">　电流改道倒进低节。开关和磁芯有损耗，这里不写效率百分数。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="180" width="752" height="210" rx="6"/>
  <text class="small" x="40" y="202">电感电流（一个周期，示意，不是示波器）</text>
  <line class="axis" x1="70" y1="210" x2="70" y2="360"/>
  <line class="axis" x1="70" y1="360" x2="720" y2="360"/>
  <text class="small" x="36" y="234">2 A</text>
  <text class="small" x="40" y="364">0</text>
  <path class="lineb" d="M80.0 360.0 L142.0 230.0 L204.0 360.0 L700.0 360.0" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000" stroke-linejoin="round" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="1000;0;0" keyTimes="0;0.8;1" dur="12s" repeatCount="indefinite"/>
  </path>
  <line class="liney" x1="142.0" y1="220" x2="142.0" y2="360" stroke-dasharray="3 3"/>
  <text class="gold" x="150.0" y="224">峰值 2 A，20 µJ</text>
  <text class="hi" x="88" y="300">接通约 5 µs</text>
  <text class="ok" x="212.0" y="300">再约 5 µs 倒给低节，之后到 50 µs 电流为 0</text>
  <text class="small" x="74" y="378">0</text>
  <text class="small" x="126.0" y="378">5 µs</text>
  <text class="small" x="196.0" y="378">10 µs</text>
  <text class="small" x="640" y="378">50 µs</text>
  <circle class="doty" r="6">
    <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0.1837;0.1837;0.3674;1" keyTimes="0;0.25;0.5;0.75;1" path="M80.0 360.0 L142.0 230.0 L204.0 360.0 L700.0 360.0"/>
  </circle>
  <text class="small" x="24" y="446">10 µH、2 A、20 µJ、约 5 µs 是和均衡功耗那张图同一套示意。20 kHz 时一拍 20 µJ 大约是 0.4 W 的搬运量级，不是实测效率。</text>

</svg>
