<svg xmlns="http://www.w3.org/2000/svg" width="800" height="806" viewBox="0 -156 800 806" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>木桶效应动画：整包容量被最弱单体锁死</title>
  <desc>木桶效应动画：整包容量被最弱单体锁死。示意。</desc><style>
    .bg { fill: #ffffff; }
