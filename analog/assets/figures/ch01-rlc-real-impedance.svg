<line x1="238" y1="324" x2="250" y2="302" stroke="#b45309" stroke-width="1.4" marker-end="url(#arrA)"/>
<text x="300" y="452" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12" font-weight="700" fill="#0f766e">谷底＝ESR（mΩ 级）@ f0≈16MHz（ESL≈1nH）</text>
<line x1="430" y1="444" x2="438" y2="420" stroke="#0f766e" stroke-width="1.4" marker-end="url(#arrT)"/>

<line x1="528" y1="222" x2="528" y2="314" stroke="#52606d" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="540" y="222" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" font-weight="700" fill="#b45309">100MHz：电解≈13Ω</text>
<text x="540" y="318" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" font-weight="700" fill="#0f766e">100nF≈0.6Ω</text>

<text x="548" y="200" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#b45309">10µF 铝电解</text>
<text x="548" y="282" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#0f766e">100nF MLCC</text>
<text x="96" y="430" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" fill="#52606d">理想电容（虚线）：一路 −20dB/dec 滑到底——现实中不存在</text>
<text x="230" y="240" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" fill="#52606d">钽（定性）：谷底居中；失效是短路 → 降额 50%</text>

<path d="M330 296 Q358 268 386 296" fill="none" stroke="#b42318" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/>
<text x="100" y="262" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="12" fill="#b42318">并联谐振峰（几 MHz）：大电容 ESL × 小电容 C 挤出的坑</text>
<line x1="318" y1="266" x2="344" y2="278" stroke="#b42318" stroke-width="1.4" marker-end="url(#arrR)"/>
