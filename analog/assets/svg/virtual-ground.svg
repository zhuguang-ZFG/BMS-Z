<svg xmlns="http://www.w3.org/2000/svg" width="800" height="506" viewBox="0 0 800 506" role="img" aria-labelledby="ttl">
<title id="ttl">单电源运放：两只电阻造出「半个电源」的假地</title>
<desc>单电源运放：两只电阻造出「半个电源」的假地；节拍：① 单电源 0~12V：运放眼里没有负压——信号贴着 0V，负半周直接撞地被削没；② 两只相等电阻分压：中点 = 6V——给信号造一个「假地」（虚地）；③ 交流经 C 骑上 6V：负半周落在 0V 之上，整条波形都能走；④ 虚地不是真地：带载会被拖偏——讲究的场合上专用分压芯片</desc>
