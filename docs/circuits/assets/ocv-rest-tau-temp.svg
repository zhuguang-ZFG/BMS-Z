<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="ui-monospace, Consolas, monospace">
  <title>静置到能查开路电压的时间随温度变长：冷侧按示意活化能陡增。数字为示意。</title>

  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #bf8700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.5; fill: none; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .dotg { fill: #1a7f37; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    .boxr { fill: #ffebe9; stroke: #cf222e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .dotg { fill: #3fb950; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
      .boxr { fill: #3d1214; stroke: #ff7b72; }
    }
  </style>

  <!-- formula: tau_min=30*exp(3500*(1/(Tc+273.15)-1/298.15)) -->
  <rect class="bg" width="800" height="500"/>
  <text class="title" x="24" y="32">同一个 τ，换到冷天就不够（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="122" rx="6"/>
  <text class="txt" x="40" y="68" opacity="0.28">① 公式<tspan class="small">　τ = 30·exp[3500·(1/T − 1/298.15)] 分钟。25 °C 锚在 30 min。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="94" opacity="0.28">② 0 °C<tspan class="small">　示意约 87.8 min。−10 °C 约 143 min。−20 °C 约 241.8 min。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="120" opacity="0.28">③ 45 °C<tspan class="small">　约 14.3 min。热的时候等够更容易，冷的时候同一套计时会太短。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="146" opacity="0.28">④ 设计<tspan class="small">　OCV 校准的等待要跟温度走。没等够就查表，把极化当成了荷电。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="182" width="752" height="250" rx="6"/>
  <text class="small" x="40" y="204">还要再等 min</text>
  <line class="axis" x1="92.0" y1="214.0" x2="92.0" y2="400.0"/>
  <line class="axis" x1="92.0" y1="400.0" x2="720.0" y2="400.0"/>
  <text class="small" x="712.0" y="418" text-anchor="end">温度 °C</text>
  <line class="grid" x1="92.0" y1="400.0" x2="92.0" y2="406.0"/>
  <text class="small" x="92.0" y="432" text-anchor="middle">−20</text>
  <line class="grid" x1="271.4" y1="400.0" x2="271.4" y2="406.0"/>
  <text class="small" x="271.4" y="432" text-anchor="middle">0</text>
  <line class="grid" x1="495.7" y1="400.0" x2="495.7" y2="406.0"/>
  <text class="small" x="495.7" y="432" text-anchor="middle">25</text>
  <line class="grid" x1="675.1" y1="400.0" x2="675.1" y2="406.0"/>
  <text class="small" x="675.1" y="432" text-anchor="middle">45</text>
  <line class="grid" x1="86.0" y1="380.1" x2="92.0" y2="380.1"/>
  <text class="small" x="82.0" y="384.1" text-anchor="end">30</text>
  <line class="grid" x1="86.0" y1="340.2" x2="92.0" y2="340.2"/>
  <text class="small" x="82.0" y="344.2" text-anchor="end">90</text>
  <line class="grid" x1="86.0" y1="240.6" x2="92.0" y2="240.6"/>
  <text class="small" x="82.0" y="244.6" text-anchor="end">240</text>
  <polyline class="lineb" points="92.0,239.4 101.0,247.9 109.9,255.9 118.9,263.4 127.9,270.5 136.9,277.1 145.8,283.4 154.8,289.3 163.8,294.9 172.7,300.1 181.7,305.0 190.7,309.7 199.7,314.1 208.6,318.3 217.6,322.2 226.6,325.9 235.5,329.4 244.5,332.7 253.5,335.9 262.5,338.8 271.4,341.6 280.4,344.3 289.4,346.8 298.3,349.2 307.3,351.5 316.3,353.6 325.3,355.7 334.2,357.6 343.2,359.5 352.2,361.2 361.1,362.9 370.1,364.5 379.1,366.0 388.1,367.4 397.0,368.8 406.0,370.0 415.0,371.3 423.9,372.5 432.9,373.6 441.9,374.6 450.9,375.7 459.8,376.6 468.8,377.5 477.8,378.4 486.7,379.3 495.7,380.1 504.7,380.8 513.7,381.6 522.6,382.3 531.6,382.9 540.6,383.6 549.5,384.2 558.5,384.8 567.5,385.3 576.5,385.9 585.4,386.4 594.4,386.9 603.4,387.3 612.3,387.8 621.3,388.2 630.3,388.6 639.3,389.0 648.2,389.4 657.2,389.8 666.2,390.1 675.1,390.5 684.1,390.8 693.1,391.1 702.1,391.4 711.0,391.7 720.0,392.0" stroke-linejoin="round" stroke-linecap="round"/>
  <text class="hi" x="360" y="340">25 °C 示意 30 min</text>
  <text class="warn" x="130" y="240">越冷等越久</text>
  <circle class="doty" r="6"><animate attributeName="cx" values="92.0;144.3;196.7;249.0;301.3;353.7;406.0;458.3;510.7;563.0;615.3;667.7;720.0" keyTimes="0;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="239.4;282.4;312.6;334.3;350.0;361.5;370.0;376.5;381.3;385.1;387.9;390.2;392.0" keyTimes="0;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1" dur="12s" repeatCount="indefinite"/></circle>
  <text class="small" x="24" y="478">30 min 和 3500 K 是教学锚，不是某一颗电芯的静置规程。多冷才允许查表，以你的辨识为准。</text>
</svg>
