[stroke="#1f5d7a"]{stroke:#6fa3b9}
text[fill="#2f7f96"]{fill:#8ac9d8}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#2f7f96"]{fill:#2b5660}
[stroke="#2f7f96"]{stroke:#77b2c1}
text[fill="#3d6b4a"]{fill:#98c096}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#3d6b4a"]{fill:#2f4a33}
[stroke="#3d6b4a"]{stroke:#7aa87c}
text[fill="#a8321f"]{fill:#e0907a}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#a8321f"]{fill:#55231b}
[stroke="#a8321f"]{stroke:#c07a63}
text[fill="#a4630f"]{fill:#dcab63}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#a4630f"]{fill:#553a17}
[stroke="#a4630f"]{stroke:#c08a45}
text[fill="#6b3f63"]{fill:#c4a2bf}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#6b3f63"]{fill:#452c40}
[stroke="#6b3f63"]{stroke:#a17c9b}
}
</style>

<text x="36" y="36" font-size="24" fill="#2a2927" text-anchor="start">桥堆：轮换导通，分开算平均再求和</text>
<text x="36" y="70" font-size="18" fill="#2a2927" text-anchor="start">对称连续电流示意；1 A 负载，管压降 0.9 V</text>
<line x1="190" y1="115" x2="580" y2="115" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><line x1="190" y1="375" x2="580" y2="375" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><line x1="190" y1="115" x2="190" y2="375" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><line x1="400" y1="115" x2="400" y2="375" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><line x1="190" y1="245" x2="265" y2="245" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><line x1="325" y1="245" x2="400" y2="245" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><circle cx="295" cy="245" r="30" fill="#fdf8ea" stroke="#16202b" stroke-width="2"/><text x="295" y="253" font-size="18" fill="#2a2927" text-anchor="middle">AC</text><line x1="580" y1="115" x2="580" y2="213" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><line x1="580" y1="277" x2="580" y2="375" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><rect x="566" y="213" width="28" height="64" fill="#fdf8ea" stroke="#16202b" stroke-width="2"/><text x="608" y="249" font-size="18" fill="#2a2927" text-anchor="start">负载</text><text x="603" y="143" font-size="20" fill="#2a2927" text-anchor="start">+</text><text x="603" y="364" font-size="20" fill="#2a2927" text-anchor="start">−</text><line x1="190" y1="142" x2="190" y2="214" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><polygon points="176,193 204,193 190,165" fill="#fdf8ea" stroke="#16202b" stroke-width="2"/><line x1="174" y1="162" x2="206" y2="162" stroke="#16202b" stroke-width="2.5" stroke-dasharray=""/><text x="146" y="183" font-size="18" fill="#2a2927" text-anchor="start">D1</text><line x1="400" y1="142" x2="400" y2="214" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><polygon points="386,193 414,193 400,165" fill="#fdf8ea" stroke="#16202b" stroke-width="2"/><line x1="384" y1="162" x2="416" y2="162" stroke="#16202b" stroke-width="2.5" stroke-dasharray=""/><text x="356" y="183" font-size="18" fill="#2a2927" text-anchor="start">D2</text><line x1="190" y1="274" x2="190" y2="346" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><polygon points="176,325 204,325 190,297" fill="#fdf8ea" stroke="#16202b" stroke-width="2"/><line x1="174" y1="294" x2="206" y2="294" stroke="#16202b" stroke-width="2.5" stroke-dasharray=""/><text x="146" y="315" font-size="18" fill="#2a2927" text-anchor="start">D3</text><line x1="400" y1="274" x2="400" y2="346" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><polygon points="386,325 414,325 400,297" fill="#fdf8ea" stroke="#16202b" stroke-width="2"/><line x1="384" y1="294" x2="416" y2="294" stroke="#16202b" stroke-width="2.5" stroke-dasharray=""/><text x="356" y="315" font-size="18" fill="#2a2927" text-anchor="start">D4</text>
<path data-current-path="positive" d="M190,245 L190,115 L580,115 L580,375 L400,375 L400,245" transform="translate(9 0)" fill="none" stroke="#1f5d7a" stroke-width="3" stroke-dasharray="7 4"/><polygon points="594,295 604,295 599,307" fill="#1f5d7a"/>
<path data-current-path="negative" d="M400,245 L400,115 L580,115 L580,375 L190,375 L190,245" transform="translate(-9 0)" fill="none" stroke="#a8321f" stroke-width="3" stroke-dasharray="2 5"/><polygon points="594,295 604,295 599,307" fill="#a8321f"/>
<text x="36" y="415" font-size="20" fill="#1f5d7a" text-anchor="start">① 长虚线：正半周 D1 → 负载 → D4</text>
<text x="36" y="451" font-size="20" fill="#a8321f" text-anchor="start">② 点线：负半周 D2 → 负载 → D3</text>
<text x="36" y="496" font-size="22" fill="#2a2927" text-anchor="start">③ 每管：平均 0.5 A × 0.9 V = 0.45 W</text>
<text x="36" y="537" font-size="22" fill="#2a2927" text-anchor="start">④ 四管相加；不能再乘一次半周系数</text>
<rect x="42" y="565" width="135" height="85" fill="#1f5d7a" fill-opacity=".12" stroke="#1f5d7a"/>
<text x="109" y="596" font-size="20" fill="#2a2927" text-anchor="middle">D1</text>
<text x="109" y="631" font-size="22" fill="#2a2927" text-anchor="middle">0.45 W</text>
<rect x="210" y="565" width="135" height="85" fill="#1f5d7a" fill-opacity=".12" stroke="#1f5d7a"/>
<text x="277" y="596" font-size="20" fill="#2a2927" text-anchor="middle">D2</text>
<text x="277" y="631" font-size="22" fill="#2a2927" text-anchor="middle">0.45 W</text>
<rect x="378" y="565" width="135" height="85" fill="#1f5d7a" fill-opacity=".12" stroke="#1f5d7a"/>
<text x="445" y="596" font-size="20" fill="#2a2927" text-anchor="middle">D3</text>
<text x="445" y="631" font-size="22" fill="#2a2927" text-anchor="middle">0.45 W</text>
<rect x="546" y="565" width="135" height="85" fill="#1f5d7a" fill-opacity=".12" stroke="#1f5d7a"/>
<text x="613" y="596" font-size="20" fill="#2a2927" text-anchor="middle">D4</text>
<text x="613" y="631" font-size="22" fill="#2a2927" text-anchor="middle">0.45 W</text>
<text x="360" y="696" font-size="24" fill="#a8321f" text-anchor="middle">总计 1.8 W = 2 × 0.9 V × 1 A</text>
<text x="36" y="739" font-size="18" fill="#2a2927" text-anchor="start">窄脉冲整流须积分 vF(t)i(t)，再查封装降额。</text>
<text x="36" y="775" font-size="18" fill="#2a2927" text-anchor="start">每管平均电流成立的前提是对称换向。</text>
</svg>