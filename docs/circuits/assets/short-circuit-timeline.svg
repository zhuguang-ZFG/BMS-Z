  <line x1="60" y1="330" x2="60" y2="60" stroke-width="2" class="stroke-axis" />
  
  <text x="750" y="352" text-anchor="end" font-size="12" class="txt">时间（μs，示意值）</text>
  <text x="66" y="72" font-size="12" class="txt">电流 I</text>
  <text x="80" y="296" font-size="12" class="small">10A 正常</text>
  <text x="80" y="96" font-size="12" class="warn">≈1000A</text>

  
  <polygon points="350,300 378,88 418,84 430,300" opacity="0" class="fill-boxr">
    <animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="0;0;0.7;0.7" keyTimes="0;0.35;0.42;1" dur="8s" repeatCount="indefinite" />
  </polygon>
  <text x="392" y="200" text-anchor="middle" font-size="12" opacity="0" class="warn">
    I²t<animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="0;0;1;1" keyTimes="0;0.42;0.46;1" dur="8s" repeatCount="indefinite" />
  </text>

  
  <path d="M60,300 H350 L378,88 L385,84 H418 L430,300 H740" fill="none" stroke-width="3.5" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000" class="stroke-r">
    <animate calcMode="spline" keySplines="0.7 0 0.84 0;0.42 0 0.58 1" attributeName="stroke-dashoffset" values="1000;0;0" keyTimes="0;0.62;1" dur="8s" repeatCount="indefinite" />
  </path>

  
  <g opacity="0">
    <animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="0;0;1;1" keyTimes="0;0.32;0.35;1" dur="8s" repeatCount="indefinite" />
    <line x1="350" y1="300" x2="350" y2="330" stroke-width="2" class="stroke-axis" />
    <text x="350" y="372" text-anchor="middle" font-size="12" class="txt">t=0 扳手搭上端子</text>
  </g>
  <g opacity="0">
    <animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="0;0;1;1" keyTimes="0;0.44;0.47;1" dur="8s" repeatCount="indefinite" />
    <line x1="385" y1="84" x2="385" y2="330" stroke-width="1.5" stroke-dasharray="5 4" class="stroke-y" />
    <text x="385" y="396" text-anchor="middle" font-size="12" class="gold">≈2μs 比较器翻转</text>
  </g>
  <g opacity="0">
    <animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="0;0;1;1" keyTimes="0;0.56;0.59;1" dur="8s" repeatCount="indefinite" />
    <line x1="430" y1="84" x2="430" y2="330" stroke-width="1.5" stroke-dasharray="5 4" class="stroke-g" />
    <text x="440" y="372" text-anchor="start" font-size="12" class="ok">≈10μs MOS 关断</text>
  </g>

  
  <g opacity="0">
    <animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="0;0;1;1" keyTimes="0;0.55;0.58;1" dur="8s" repeatCount="indefinite" />
    <rect x="560" y="90" width="180" height="90" rx="10" class="fill-boxg stroke-g" />
    <text x="650" y="120" text-anchor="middle" font-size="13" font-weight="bold" class="ok">MOS 闸门关断</text>
    <text x="650" y="142" text-anchor="middle" font-size="12" class="ok">电流被"一刀切断"</text>
    <path d="M600,162 l14,14 l30,-32" stroke-width="4" fill="none" stroke-linecap="round" class="stroke-g" />
  </g>

  <line y1="70" y2="330" stroke-width="2" x1="60" x2="60" class="stroke-y">
    <animate data-ease="linear" attributeName="x1" values="60;350;378;385;418;430;740;60" keyTimes="0;0.22;0.34;0.42;0.50;0.58;0.78;1" dur="8s" repeatCount="indefinite" />
    <animate data-ease="linear" attributeName="x2" values="60;350;378;385;418;430;740;60" keyTimes="0;0.22;0.34;0.42;0.50;0.58;0.78;1" dur="8s" repeatCount="indefinite" />
  </line>
  <circle r="6" cx="60" cy="300" class="fill-y">
    <animate data-ease="linear" attributeName="cx" values="60;350;378;385;418;430;740;60" keyTimes="0;0.22;0.34;0.42;0.50;0.58;0.78;1" dur="8s" repeatCount="indefinite" />
    <animate data-ease="linear" attributeName="cy" values="300;300;88;84;84;300;300;300" keyTimes="0;0.22;0.34;0.42;0.50;0.58;0.78;1" dur="8s" repeatCount="indefinite" />
  </circle>
  <text x="150" y="120" font-size="13" font-weight="bold" opacity="1" class="gold">读数示意：约 10 A<animate attributeName="opacity" values="1;0;0;0;0;0;0;0" keyTimes="0;0.22;0.34;0.42;0.50;0.58;0.78;1" calcMode="spline" keySplines="0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" dur="8s" repeatCount="indefinite" /></text>
  <text x="150" y="120" font-size="13" font-weight="bold" opacity="0" class="gold">t=0 电流开始冲<animate attributeName="opacity" values="0;1;0;0;0;0;0;0" keyTimes="0;0.22;0.34;0.42;0.50;0.58;0.78;1" calcMode="spline" keySplines="0.16 1 0.3 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" dur="8s" repeatCount="indefinite" /></text>
  <text x="150" y="120" font-size="13" font-weight="bold" opacity="0" class="gold">≈2 μs 比较器翻转<animate attributeName="opacity" values="0;0;0;1;1;0;0;0" keyTimes="0;0.22;0.34;0.42;0.50;0.58;0.78;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1" dur="8s" repeatCount="indefinite" /></text>
  <text x="150" y="120" font-size="13" font-weight="bold" opacity="0" class="gold">≈10 μs MOS 关断<animate attributeName="opacity" values="0;0;0;0;0;1;1;0" keyTimes="0;0.22;0.34;0.42;0.50;0.58;0.78;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0" dur="8s" repeatCount="indefinite" /></text>
  
  <g opacity="0">
    <animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="0;0;1;1" keyTimes="0;0.72;0.76;1" dur="8s" repeatCount="indefinite" />
    
    <rect x="130" y="210" width="540" height="70" rx="8" class="fill-boxy stroke-y" />
    <text x="400" y="232" text-anchor="middle" font-size="14" font-weight="bold" class="gold">为什么是微秒级？I²t 能量按毫秒计就能烧穿 MOS 的硅片</text>
    <text x="400" y="251" text-anchor="middle" font-size="13" class="gold">软件保护（毫秒级）通常赶不上第一道关断——须由硬件比较器直接关闸</text>
    <text x="400" y="270" text-anchor="middle" font-size="13" class="gold">（2/10μs 为示意值，以保护 IC datasheet 与系统验证为准）</text>
