<text x="52" y="58" font-size="38" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">热失效：先把热阻链的账算清</text><text x="52" y="94" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">导通 0.75 W 加开关 3.5 W 共 4.25 W。靠 PCB 敷铜散热，温升算出来 255 °C。</text>
<rect x="50" y="126" width="900" height="132" rx="6" fill="#f6eedb" stroke="#a8321f" stroke-width="2"/>
<rect class="ink-echo" x="50" y="126" width="900" height="132" rx="6" stroke="#a8321f" stroke-width="2" fill="none" opacity="0.32" transform="translate(1.07 -0.98) rotate(-0.07 500.0 192.0)"/>
