<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">老化有两只钟</title>
  <desc id="desc">左边日历座钟的空白圆面旁，纸页不断从顶部吐出、飘落，脚下撕下的页越堆越厚；右边循环钟的摆锤反复折弯砧上同一片金属，折痕处裂纹发红；中间一株小苗从两片绿叶退到一片黄叶再到一片落叶。无文字无数字。</desc>
