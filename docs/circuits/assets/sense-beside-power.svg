</style><rect class="bg" x="0" y="-156" width="800" height="680" /><text class="title" x="24" y="-128">采样线：远离功率回路，还是贴着走</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 采样线：远离功率回路，还是贴着走<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 示意图。噪声幅度是数量级，不是某块板的实测频谱。<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 对：采样贴紧成对，远离粗铜<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="468" width="752" height="44" rx="6" /><text class="small" x="40" y="496">3.712 V 稳住。示意。</text><rect width="800" height="460" class="bg" />
  <text x="400" y="54" text-anchor="middle" font-size="13" class="small">示意图。噪声幅度是数量级，不是某块板的实测频谱。</text>
  <rect x="36" y="78" width="350" height="240" rx="8" class="fill-boxg stroke-g" />
  <text x="211" y="108" text-anchor="middle" font-size="15" font-weight="bold" class="ok">对：采样贴紧成对，远离粗铜</text>
  <line x1="70" y1="160" x2="330" y2="160" stroke-width="6" class="stroke-y" />
  <text x="200" y="150" text-anchor="middle" font-size="12" class="gold">功率回路</text>
  <line x1="70" y1="230" x2="330" y2="230" stroke-width="2" class="stroke-b" />
  <line x1="70" y1="242" x2="330" y2="242" stroke-width="2" class="stroke-b" />
  <text x="200" y="270" text-anchor="middle" font-size="13" class="hi">采样成对紧贴</text>
  <text x="211" y="300" text-anchor="middle" font-size="16" class="ok">3.712 V 稳住</text>
  <rect x="414" y="78" width="350" height="240" rx="8" class="fill-boxr stroke-r">
    <animate attributeName="stroke-width" values="2;5;2" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite" />
  </rect>
  <text x="589" y="108" text-anchor="middle" font-size="15" font-weight="bold" class="warn">错：采样贴着功率走</text>
  <line x1="448" y1="180" x2="730" y2="180" stroke-width="6" class="stroke-y" />
  <line x1="448" y1="192" x2="730" y2="192" stroke-width="2" class="stroke-b" />
  <text x="589" y="230" text-anchor="middle" font-size="16" opacity="1" class="warn">3.65 V
    <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite" />
  </text>
  <text x="589" y="258" text-anchor="middle" font-size="16" opacity="0" class="warn">3.78 V
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite" />
  </text>
  <circle r="5" cx="70" cy="160" class="fill-y">
    <animate attributeName="cx" values="70;330;70" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle r="5" cx="448" cy="180" class="fill-y">
    <animate attributeName="cx" values="448;730;448" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite" />
  </circle>
  <text x="400" y="360" text-anchor="middle" font-size="14" class="txt">跳变进了毫伏到几十毫伏，均衡和保护会对着噪声动作。</text>
  <text x="400" y="400" text-anchor="middle" font-size="13" class="small">分压电阻放在接插件附近。长线只走已经分完的低阻抗侧。</text>

</svg>