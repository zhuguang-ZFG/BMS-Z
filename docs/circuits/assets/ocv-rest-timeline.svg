<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="ui-monospace, Consolas, monospace">
  <title>卸载后的电压回弹时间轴：欧姆部分立刻回来，极化慢慢回来，充放电开路电压的滞回缝仍然在。数字为示意。</title>
  <desc>卸载后的电压回弹时间轴：欧姆部分立刻回来，极化慢慢回来，充放电开路电压的滞回缝仍然在。数字为示意。</desc>

  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.5; fill: none; }
    .liney { stroke: #bf8700; stroke-width: 2.5; fill: none; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .dotg { fill: #1a7f37; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    .boxr { fill: #ffebe9; stroke: #cf222e; }
    .boxg { fill: #dafbe1; stroke: #1a7f37; }
    .boxy { fill: #fff8c5; stroke: #bf8700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .dotg { fill: #3fb950; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
      .boxr { fill: #3d1214; stroke: #ff7b72; }
      .boxg { fill: #12261e; stroke: #3fb950; }
      .boxy { fill: #3d2e00; stroke: #d29922; }
    }
  </style>

  <rect class="bg" width="800" height="460"/>

  <text class="title" x="24" y="32">卸流之后电压会回来，滞回那条缝不会回来（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="122" rx="6"/>
  <text class="txt" x="40" y="68" opacity="0.28">① 还在放电<tspan class="small">　端电压 3.450 V。里面有欧姆压降，也有极化。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="94" opacity="0.28">② 电流变为 0<tspan class="small">　R0 那 40 mV 立刻回来，电压到 3.490 V。这还不是开路电压。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="120" opacity="0.28">③ 再等几分钟<tspan class="small">　示意 τ=3 min 的尾巴往 3.620 V 靠。这是放电方向的开路电压。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="146" opacity="0.28">④ 同一 SOC 的充电支<tspan class="small">　静置再久，充电支仍在 3.660 V 附近。40 mV 的缝是滞回，不是没等够。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="180" width="752" height="210" rx="6"/>
  <line class="axis" x1="70" y1="190" x2="70" y2="360"/>
  <line class="axis" x1="70" y1="360" x2="730" y2="360"/>
  <path class="lineb" d="M80.0 338.0 L160.0 338.0 L160.0 314.0 L160.0 314.0 L175.0 305.8 L190.0 298.5 L205.0 291.9 L220.0 286.0 L235.0 280.8 L250.0 276.0 L265.0 271.8 L280.0 268.1 L295.0 264.7 L310.0 261.7 L325.0 259.0 L340.0 256.6 L355.0 254.4 L370.0 252.5 L385.0 250.7 L400.0 249.2 L415.0 247.8 L430.0 246.6 L445.0 245.4 L460.0 244.5 L475.0 243.6 L490.0 242.8 L505.0 242.1 L520.0 241.4 L535.0 240.8 L550.0 240.3 L565.0 239.9 L580.0 239.5 L595.0 239.1 L610.0 238.8 L625.0 238.5 L640.0 238.2 L655.0 238.0 L670.0 237.8 L685.0 237.6 L700.0 237.4" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000" stroke-linejoin="round" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="1000;0;0" keyTimes="0;0.8;1" dur="12s" repeatCount="indefinite"/>
  </path>
  <line class="axis" x1="70" y1="236.0" x2="720" y2="236.0" stroke-dasharray="4 3"/>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.749;0.75;1" dur="12s" repeatCount="indefinite"/>
    <line class="liner" x1="200" y1="212.0" x2="720" y2="212.0" stroke-dasharray="6 4"/>
    <line class="liner" x1="610.0" y1="238.8" x2="610.0" y2="212.0"/>
    <text class="warn" x="430" y="204.0">充电 OCV 3.660 V，缝还在</text>
  </g>
  <text class="hi" x="84" y="330.0">3.450 V 带载</text>
  <text class="gold" x="168" y="306.0">立刻 +40 mV</text>
  <text class="ok" x="303.0" y="254.7">3 min ≈ 3.572 V</text>
  <text class="small" x="520" y="230.0">放电 OCV 3.620 V</text>
  <text class="small" x="150" y="378">卸流</text>
  <text class="small" x="279.0" y="378">3 min</text>
  <text class="small" x="592.0" y="378">10 min ≈ 3.615 V</text>
  <circle class="doty" r="6">
    <animate attributeName="cx" values="100.0;160.0;160.0;205.0;250.0;295.0;430.0;610.0;700.0" keyTimes="0.00;0.24;0.27;0.36;0.44;0.50;0.64;0.75;1.00" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="338.0;338.0;314.0;291.9;276.0;264.7;246.6;238.8;237.4" keyTimes="0.00;0.24;0.27;0.36;0.44;0.50;0.64;0.75;1.00" dur="12s" repeatCount="indefinite"/>
  </circle>
  <text class="small" x="24" y="446">3.450 / 3.490 / 3.620 / 3.660 V 和 3 min 都是示意。静置抹平极化，抹不平充放电两条开路电压的缝。</text>

</svg>
