<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440">
  <title>平台区同一小段电压可以对应很不同的荷电</title>
  <rect width="880" height="440" fill="#f8fafc"/>
  <style>
  text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
  /* 深色模式：GitHub 深色主题下对调底色与文字色，只覆盖配色，不动几何与动画。
     stroke="#fff" 保持白色——那是彩色徽标上的勾选，不在覆盖范围内。 */
  @media (prefers-color-scheme: dark){
  rect[fill="#f8fafc"]{fill:#0f172a}
  rect[fill="#fff"]{fill:#1e293b}
  [fill="#f1f5f9"]{fill:#1e293b}
  [stroke="#f1f5f9"]{stroke:#1e293b}
  [fill="#e2e8f0"]{fill:#334155}
  [stroke="#e2e8f0"]{stroke:#334155}
  [fill="#cbd5e1"]{fill:#475569}
  [stroke="#cbd5e1"]{stroke:#475569}
  [fill="#64748b"]{fill:#94a3b8}
  [stroke="#64748b"]{stroke:#94a3b8}
  [fill="#475569"]{fill:#cbd5e1}
  [stroke="#475569"]{stroke:#cbd5e1}
  [fill="#334155"]{fill:#e2e8f0}
  [stroke="#334155"]{stroke:#e2e8f0}
  [fill="#1e293b"]{fill:#f1f5f9}
  [stroke="#1e293b"]{stroke:#f1f5f9}
  [fill="#dbeafe"]{fill:#1e3a8a}
  [stroke="#dbeafe"]{stroke:#1e3a8a}
  [fill="#eff6ff"]{fill:#172554}
  [stroke="#eff6ff"]{stroke:#172554}
  [fill="#bfdbfe"]{fill:#1e40af}
  [stroke="#bfdbfe"]{stroke:#1e40af}
  [fill="#1d4ed8"]{fill:#60a5fa}
  [stroke="#1d4ed8"]{stroke:#60a5fa}
  [fill="#1e40af"]{fill:#93c5fd}
  [stroke="#1e40af"]{stroke:#93c5fd}
  [fill="#2563eb"]{fill:#60a5fa}
  [stroke="#2563eb"]{stroke:#60a5fa}
  [fill="#3b82f6"]{fill:#60a5fa}
  [stroke="#3b82f6"]{stroke:#60a5fa}
  [fill="#ecfdf5"]{fill:#022c22}
  [stroke="#ecfdf5"]{stroke:#022c22}
  [fill="#a7f3d0"]{fill:#065f46}
  [stroke="#a7f3d0"]{stroke:#065f46}
  [fill="#86efac"]{fill:#166534}
  [stroke="#86efac"]{stroke:#166534}
  [fill="#065f46"]{fill:#6ee7b7}
  [stroke="#065f46"]{stroke:#6ee7b7}
  [fill="#059669"]{fill:#34d399}
  [stroke="#059669"]{stroke:#34d399}
  [fill="#fef2f2"]{fill:#450a0a}
  [stroke="#fef2f2"]{stroke:#450a0a}
  [fill="#fecaca"]{fill:#7f1d1d}
  [stroke="#fecaca"]{stroke:#7f1d1d}
  [fill="#fca5a5"]{fill:#b91c1c}
  [stroke="#fca5a5"]{stroke:#b91c1c}
  [fill="#991b1b"]{fill:#fca5a5}
  [stroke="#991b1b"]{stroke:#fca5a5}
  [fill="#dc2626"]{fill:#f87171}
  [stroke="#dc2626"]{stroke:#f87171}
  [fill="#fffbeb"]{fill:#451a03}
  [stroke="#fffbeb"]{stroke:#451a03}
  [fill="#fef3c7"]{fill:#78350f}
  [stroke="#fef3c7"]{stroke:#78350f}
  [fill="#92400e"]{fill:#fcd34d}
  [stroke="#92400e"]{stroke:#fcd34d}
  [fill="#b45309"]{fill:#fbbf24}
  [stroke="#b45309"]{stroke:#fbbf24}
  }
</style>

  <text x="440" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">为什么平台上不信电压</text>
  <line x1="80" y1="250" x2="520" y2="250" stroke="#334155" stroke-width="2"/>
  <line x1="80" y1="250" x2="80" y2="70" stroke="#334155" stroke-width="2"/>
  <text x="70" y="64" text-anchor="end" font-size="12" fill="#334155">电压</text>
  <text x="500" y="272" font-size="12" fill="#334155">SOC</text>
  <path d="M100,230 C180,188 200,168 240,166 C360,164 400,164 430,150" fill="none" stroke="#059669" stroke-width="4"/>
  <line x1="240" y1="166" x2="400" y2="164" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 4"/>
  <circle cx="250" cy="166" r="7" fill="#dc2626">
    <animate attributeName="cx" values="250;390;250" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <text x="250" y="200" text-anchor="middle" font-size="13" fill="#991b1b">约 30%</text>
  <text x="390" y="200" text-anchor="middle" font-size="13" fill="#991b1b">约 70%</text>
  <text x="320" y="140" text-anchor="middle" font-size="13" fill="#334155">电压几乎不动</text>
  <rect x="540" y="70" width="310" height="180" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="695" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">错</text>
  <text x="695" y="132" text-anchor="middle" font-size="14" fill="#1e293b">电压一样，SOC 就一样</text>
  <text x="695" y="160" text-anchor="middle" font-size="13" fill="#334155">噪声 2–5 mV</text>
  <text x="695" y="184" text-anchor="middle" font-size="13" fill="#334155">已经盖过这一小步</text>
  <text x="695" y="220" text-anchor="middle" font-size="14" fill="#065f46">对：这段靠安时积分</text>
  <text x="440" y="320" text-anchor="middle" font-size="14" fill="#1e293b">铁锂平台是示例：40 个百分点的荷电，电压只动约 30 mV。</text>
  <text x="440" y="348" text-anchor="middle" font-size="14" fill="#334155">三元斜率更陡，电压还能用。换化学体系就换曲线，不要把铁锂的平搬到钠电上。</text>
  <text x="440" y="400" text-anchor="middle" font-size="13" fill="#475569">示意图。数字来自阶段 4 对这条曲线的读法，不是某一颗电芯的规格。</text>

</svg>
