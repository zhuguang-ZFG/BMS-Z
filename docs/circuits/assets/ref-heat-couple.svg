<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460">
  <title>均衡电阻热路径对照：电阻放在板边时基准仍凉；贴着基准时热把基准烤偏，整串读数一起偏。示意图。</title>
  <desc>红点从贴着基准的均衡电阻走到基准。温升用均衡热示例里的示意：热阻 200 °C/W，ΔT 约 35 °C。不是这次新测的。</desc>
  <rect width="800" height="460" fill="#f8fafc"/>
  <style>
  text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
  /* 深色模式：GitHub 深色主题下对调底色与文字色，只覆盖配色，不动几何与动画。
     stroke="#fff" 保持白色——那是彩色徽标上的勾选，不在覆盖范围内。 */
  @media (prefers-color-scheme: dark){
  rect[fill="#f8fafc"]{fill:#0f172a}
  rect[fill="#fff"]{fill:#1e293b}
  [fill="#f1f5f9"]{fill:#1e293b}
  [stroke="#f1f5f9"]{stroke:#1e293b}
  [fill="#e2e8f0"]{fill:#334155}
  [stroke="#e2e8f0"]{stroke:#334155}
  [fill="#cbd5e1"]{fill:#475569}
  [stroke="#cbd5e1"]{stroke:#475569}
  [fill="#64748b"]{fill:#94a3b8}
  [stroke="#64748b"]{stroke:#94a3b8}
  [fill="#475569"]{fill:#cbd5e1}
  [stroke="#475569"]{stroke:#cbd5e1}
  [fill="#334155"]{fill:#e2e8f0}
  [stroke="#334155"]{stroke:#e2e8f0}
  [fill="#1e293b"]{fill:#f1f5f9}
  [stroke="#1e293b"]{stroke:#f1f5f9}
  [fill="#dbeafe"]{fill:#1e3a8a}
  [stroke="#dbeafe"]{stroke:#1e3a8a}
  [fill="#eff6ff"]{fill:#172554}
  [stroke="#eff6ff"]{stroke:#172554}
  [fill="#bfdbfe"]{fill:#1e40af}
  [stroke="#bfdbfe"]{stroke:#1e40af}
  [fill="#1d4ed8"]{fill:#60a5fa}
  [stroke="#1d4ed8"]{stroke:#60a5fa}
  [fill="#1e40af"]{fill:#93c5fd}
  [stroke="#1e40af"]{stroke:#93c5fd}
  [fill="#2563eb"]{fill:#60a5fa}
  [stroke="#2563eb"]{stroke:#60a5fa}
  [fill="#3b82f6"]{fill:#60a5fa}
  [stroke="#3b82f6"]{stroke:#60a5fa}
  [fill="#ecfdf5"]{fill:#022c22}
  [stroke="#ecfdf5"]{stroke:#022c22}
  [fill="#a7f3d0"]{fill:#065f46}
  [stroke="#a7f3d0"]{stroke:#065f46}
  [fill="#86efac"]{fill:#166534}
  [stroke="#86efac"]{stroke:#166534}
  [fill="#065f46"]{fill:#6ee7b7}
  [stroke="#065f46"]{stroke:#6ee7b7}
  [fill="#059669"]{fill:#34d399}
  [stroke="#059669"]{stroke:#34d399}
  [fill="#fef2f2"]{fill:#450a0a}
  [stroke="#fef2f2"]{stroke:#450a0a}
  [fill="#fecaca"]{fill:#7f1d1d}
  [stroke="#fecaca"]{stroke:#7f1d1d}
  [fill="#fca5a5"]{fill:#b91c1c}
  [stroke="#fca5a5"]{stroke:#b91c1c}
  [fill="#991b1b"]{fill:#fca5a5}
  [stroke="#991b1b"]{stroke:#fca5a5}
  [fill="#dc2626"]{fill:#f87171}
  [stroke="#dc2626"]{stroke:#f87171}
  [fill="#fffbeb"]{fill:#451a03}
  [stroke="#fffbeb"]{stroke:#451a03}
  [fill="#fef3c7"]{fill:#78350f}
  [stroke="#fef3c7"]{stroke:#78350f}
  [fill="#92400e"]{fill:#fcd34d}
  [stroke="#92400e"]{stroke:#fcd34d}
  [fill="#b45309"]{fill:#fbbf24}
  [stroke="#b45309"]{stroke:#fbbf24}
  }
</style>

  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">均衡电阻的热：放板边，还是贴着基准</text>
  <text x="400" y="54" text-anchor="middle" font-size="13" fill="#475569">示意图。温升数量级见均衡示例波形，这里只看热往哪走。</text>
  <rect x="36" y="78" width="350" height="250" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="211" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#065f46">对：电阻在板边</text>
  <rect x="60" y="150" width="70" height="28" fill="#fffbeb" stroke="#b45309"/>
  <text x="95" y="169" text-anchor="middle" font-size="12" fill="#92400e">均衡 R</text>
  <rect x="240" y="200" width="80" height="40" fill="#eff6ff" stroke="#1d4ed8"/>
  <text x="280" y="225" text-anchor="middle" font-size="12" fill="#1e40af">基准</text>
  <text x="211" y="280" text-anchor="middle" font-size="13" fill="#065f46">热从板边散走，基准仍凉</text>
  <rect x="414" y="78" width="350" height="250" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="589" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">错：电阻贴着基准</text>
  <rect x="500" y="180" width="70" height="28" fill="#fecaca" stroke="#dc2626">
    <animate attributeName="opacity" values="0.45;1;0.45" keyTimes="0;0.5;1" dur="1.6s" repeatCount="indefinite"/>
  </rect>
  <text x="535" y="199" text-anchor="middle" font-size="12" fill="#991b1b">均衡 R</text>
  <rect x="590" y="170" width="80" height="48" fill="#fffbeb" stroke="#b45309"/>
  <text x="630" y="198" text-anchor="middle" font-size="12" fill="#92400e">基准被烤</text>
  <text x="589" y="250" text-anchor="middle" font-size="13" fill="#991b1b" opacity="0">读数整串一起偏
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.4;1" dur="4s" repeatCount="indefinite"/>
  </text>
  <circle r="6" fill="#059669" cx="95" cy="164">
    <animate attributeName="cx" values="95;48;95" keyTimes="0;0.5;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle r="6" fill="#dc2626" cx="535" cy="194">
    <animate attributeName="cx" values="535;630;630;535" keyTimes="0;0.45;0.7;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <text x="589" y="300" text-anchor="middle" font-size="12" fill="#991b1b">示意 ΔT ≈ 35 °C（200 °C/W）</text>
  <text x="400" y="360" text-anchor="middle" font-size="14" fill="#1e293b">出厂标定修不掉随温度走的那一项。</text>
  <text x="400" y="400" text-anchor="middle" font-size="13" fill="#475569">功率按最高单体电压算，再留余量。多串同时开时热量会叠加。</text>

</svg>
