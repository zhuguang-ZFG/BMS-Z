<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">运放的六个经典坑：每一个都能复现、都能预防</text>

<text x="400" y="46" text-anchor="middle" font-size="14" font-weight="bold" fill="#37424e">症状 → 根因 → 解法，按现场出现频率排序</text>
<rect x="40" y="82" width="720" height="80" rx="9" fill="#f6eedb" stroke="#a8321f" stroke-width="1.6"/><text x="58" y="110" font-size="12.5" font-weight="bold" fill="#a8321f">⚠ 输出锁定在电源轨</text><text x="58" y="134" font-size="11" fill="#5b666f">根因：输入超共模范围 / 反相端反馈开路</text><text x="58" y="152" font-size="11" font-weight="bold" fill="#37424e">解法：查共模范围（LM358 是 0~Vcc−1.5V）；查反馈电阻焊接</text><circle cx="742" cy="122" r="5" fill="#a8321f" opacity="0.8"/><rect x="40" y="170" width="720" height="80" rx="9" fill="#f6eedb" stroke="#a4630f" stroke-width="1.6"/><text x="58" y="198" font-size="12.5" font-weight="bold" fill="#a4630f">⚠ 相位反转（跳到相反轨）</text><text x="58" y="222" font-size="11" fill="#5b666f">根因：老式运放输入超共模时内部结正偏</text><text x="58" y="240" font-size="11" font-weight="bold" fill="#37424e">解法：选带相位反转保护的型号；输入端限幅/钳位</text><circle cx="742" cy="210" r="5" fill="#a4630f" opacity="0.8"/><rect x="40" y="258" width="720" height="80" rx="9" fill="#f6eedb" stroke="#6b3f63" stroke-width="1.6"/><text x="58" y="286" font-size="12.5" font-weight="bold" fill="#6b3f63">⚠ 高频自激振荡</text><text x="58" y="310" font-size="11" fill="#5b666f">根因：驱动容性负载（长电缆）破坏相位裕度</text><text x="58" y="328" font-size="11" font-weight="bold" fill="#37424e">解法：输出串 10~100Ω 隔离电阻 —— 最常用的急救措施</text><circle cx="742" cy="298" r="5" fill="#6b3f63" opacity="0.8"/><rect x="40" y="346" width="720" height="80" rx="9" fill="#f6eedb" stroke="#1f5d7a" stroke-width="1.6"/><text x="58" y="374" font-size="12.5" font-weight="bold" fill="#1f5d7a">⚠ 输出三角波化</text><text x="58" y="398" font-size="11" fill="#5b666f">根因：SR 不足（大信号被限速）</text><text x="58" y="416" font-size="11" font-weight="bold" fill="#37424e">解法：降幅度或换高速运放；算 f_max = SR/(2πVp)</text><circle cx="742" cy="386" r="5" fill="#1f5d7a" opacity="0.8"/><rect x="40" y="434" width="720" height="80" rx="9" fill="#f6eedb" stroke="#3d6b4a" stroke-width="1.6"/><text x="58" y="462" font-size="12.5" font-weight="bold" fill="#3d6b4a">⚠ 直流误差超标</text><text x="58" y="486" font-size="11" fill="#5b666f">根因：V_OS×增益；I_B×源阻抗</text><text x="58" y="504" font-size="11" font-weight="bold" fill="#37424e">解法：换精密运放（OP07/斩波）；降低源阻抗</text><circle cx="742" cy="474" r="5" fill="#3d6b4a" opacity="0.8"/><rect x="40" y="522" width="720" height="80" rx="9" fill="#f6eedb" stroke="#2f7f96" stroke-width="1.6"/><text x="58" y="550" font-size="12.5" font-weight="bold" fill="#2f7f96">⚠ 微音效应/杂音</text><text x="58" y="574" font-size="11" fill="#5b666f">根因：高增益受振动（陶瓷电容压电效应）</text><text x="58" y="592" font-size="11" font-weight="bold" fill="#37424e">解法：换 C0G 电容；减振布局；避免机械应力</text><circle cx="742" cy="562" r="5" fill="#2f7f96" opacity="0.8"/>
<path d="M40 612 Q400.00 612.20 760 612" fill="none" stroke="#c9bb9d" stroke-width="1"/>
<text x="400" y="640" text-anchor="middle" font-size="12" font-weight="bold" fill="#37424e">三条「先量后换」的诊断动作</text>
<text x="400" y="664" text-anchor="middle" font-size="11.5" fill="#5b666f">① 先看<b>输出直流电平</b>：贴轨 → 查共模范围与反馈回路；居中但抖 → 查自激与去耦</text>
<text x="400" y="686" text-anchor="middle" font-size="11.5" fill="#5b666f">② 再看<b>输入端电压差</b>：虚短失效（差几百 mV）→ 反馈断了；差几 µV → 正常工作</text>
<text x="400" y="708" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a4630f">③ 最后才怀疑运放本身——绝大多数「运放坏了」其实是外围（反馈、去耦、负载）</text>
