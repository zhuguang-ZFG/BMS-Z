<text x="60" y="500" font-family="KaiTi" font-size="13" fill="#003153">6.2 s 落到 4.12 V、低于恢复线，才允许重新合上。</text>
<text x="60" y="518" font-family="KaiTi" font-size="12" fill="#003153">阈值、回差、确认时间，三件事叠在同一条电压上；4.28 / 4.18 V 与 1.0 s 均为示意，铁锂的阈值完全不同。</text>
<text x="480" y="546" font-family="KaiTi" font-size="14" fill="#003153" opacity="0.75" text-anchor="middle">原理示意 / 非实拍</text>
