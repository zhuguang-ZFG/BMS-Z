<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430">
  <title>预充回路上电时序动画</title>
  <rect width="800" height="430" fill="#f8fafc"/>
  <style>
  text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
  /* 深色模式：GitHub 深色主题下对调底色与文字色，只覆盖配色，不动几何与动画。
     stroke="#fff" 保持白色——那是彩色徽标上的勾选，不在覆盖范围内。 */
  @media (prefers-color-scheme: dark){
  rect[fill="#f8fafc"]{fill:#0f172a}
  rect[fill="#fff"]{fill:#1e293b}
  [fill="#f1f5f9"]{fill:#1e293b}
  [stroke="#f1f5f9"]{stroke:#1e293b}
  [fill="#e2e8f0"]{fill:#334155}
  [stroke="#e2e8f0"]{stroke:#334155}
  [fill="#cbd5e1"]{fill:#475569}
  [stroke="#cbd5e1"]{stroke:#475569}
  [fill="#64748b"]{fill:#94a3b8}
  [stroke="#64748b"]{stroke:#94a3b8}
  [fill="#475569"]{fill:#cbd5e1}
  [stroke="#475569"]{stroke:#cbd5e1}
  [fill="#334155"]{fill:#e2e8f0}
  [stroke="#334155"]{stroke:#e2e8f0}
  [fill="#1e293b"]{fill:#f1f5f9}
  [stroke="#1e293b"]{stroke:#f1f5f9}
  [fill="#dbeafe"]{fill:#1e3a8a}
  [stroke="#dbeafe"]{stroke:#1e3a8a}
  [fill="#eff6ff"]{fill:#172554}
  [stroke="#eff6ff"]{stroke:#172554}
  [fill="#bfdbfe"]{fill:#1e40af}
  [stroke="#bfdbfe"]{stroke:#1e40af}
  [fill="#1d4ed8"]{fill:#60a5fa}
  [stroke="#1d4ed8"]{stroke:#60a5fa}
  [fill="#1e40af"]{fill:#93c5fd}
  [stroke="#1e40af"]{stroke:#93c5fd}
  [fill="#2563eb"]{fill:#60a5fa}
  [stroke="#2563eb"]{stroke:#60a5fa}
  [fill="#3b82f6"]{fill:#60a5fa}
  [stroke="#3b82f6"]{stroke:#60a5fa}
  [fill="#ecfdf5"]{fill:#022c22}
  [stroke="#ecfdf5"]{stroke:#022c22}
  [fill="#a7f3d0"]{fill:#065f46}
  [stroke="#a7f3d0"]{stroke:#065f46}
  [fill="#86efac"]{fill:#166534}
  [stroke="#86efac"]{stroke:#166534}
  [fill="#065f46"]{fill:#6ee7b7}
  [stroke="#065f46"]{stroke:#6ee7b7}
  [fill="#059669"]{fill:#34d399}
  [stroke="#059669"]{stroke:#34d399}
  [fill="#fef2f2"]{fill:#450a0a}
  [stroke="#fef2f2"]{stroke:#450a0a}
  [fill="#fecaca"]{fill:#7f1d1d}
  [stroke="#fecaca"]{stroke:#7f1d1d}
  [fill="#fca5a5"]{fill:#b91c1c}
  [stroke="#fca5a5"]{stroke:#b91c1c}
  [fill="#991b1b"]{fill:#fca5a5}
  [stroke="#991b1b"]{stroke:#fca5a5}
  [fill="#dc2626"]{fill:#f87171}
  [stroke="#dc2626"]{stroke:#f87171}
  [fill="#fffbeb"]{fill:#451a03}
  [stroke="#fffbeb"]{stroke:#451a03}
  [fill="#fef3c7"]{fill:#78350f}
  [stroke="#fef3c7"]{stroke:#78350f}
  [fill="#92400e"]{fill:#fcd34d}
  [stroke="#92400e"]{stroke:#fcd34d}
  [fill="#b45309"]{fill:#fbbf24}
  [stroke="#b45309"]{stroke:#fbbf24}
  }
</style>

  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">预充回路：先小电流"灌满管道"，再开主闸</text>

  <!-- 电池 -->
  <rect x="50" y="160" width="100" height="100" rx="10" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
  <text x="100" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">400V</text>
  <text x="100" y="223" text-anchor="middle" font-size="12" fill="#1e40af">电池组</text>

  <!-- 主回路 -->
  <line x1="150" y1="210" x2="240" y2="210" stroke="#334155" stroke-width="3"/>
  <line x1="330" y1="210" x2="505" y2="210" stroke="#334155" stroke-width="3"/>
  <line x1="535" y1="210" x2="640" y2="210" stroke="#334155" stroke-width="3"/>

  <!-- 主继电器 K1 -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.62;0.65;1" dur="10s" repeatCount="indefinite"/>
    <line x1="240" y1="210" x2="330" y2="210" stroke="#2563eb" stroke-width="4"/>
  </g>
  <g>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.62;0.65;1" dur="10s" repeatCount="indefinite"/>
    <line x1="240" y1="210" x2="322" y2="178" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  </g>
  <circle cx="240" cy="210" r="5" fill="#334155"/>
  <circle cx="330" cy="210" r="5" fill="#334155"/>
  <text x="285" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">主继电器 K1</text>

  <!-- 预充支路 -->
  <path d="M200,210 V110 H240" fill="none" stroke="#334155" stroke-width="2"/>
  <path d="M480,110 H500 V210" fill="none" stroke="#334155" stroke-width="2"/>
  <!-- 预充继电器 K2 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.30;0.32;0.62;0.65;1" dur="10s" repeatCount="indefinite"/>
    <line x1="240" y1="110" x2="330" y2="110" stroke="#2563eb" stroke-width="3"/>
  </g>
  <g>
    <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.30;0.32;0.62;0.65;1" dur="10s" repeatCount="indefinite"/>
    <line x1="240" y1="110" x2="322" y2="82" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
  </g>
  <circle cx="240" cy="110" r="4" fill="#334155"/>
  <circle cx="330" cy="110" r="4" fill="#334155"/>
  <text x="285" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">预充继电器 K2</text>
  <!-- 预充电阻 -->
  <polyline points="330,110 345,96 360,124 375,96 390,124 405,96 420,124 435,96 450,124 465,96 480,110" fill="none" stroke="#64748b" stroke-width="2.5">
    <animate attributeName="stroke" values="#64748b;#f59e0b;#f59e0b;#64748b" keyTimes="0;0.32;0.60;1" dur="10s" repeatCount="indefinite"/>
  </polyline>
  <text x="405" y="70" text-anchor="middle" font-size="12" fill="#64748b">预充电阻 R</text>

  <!-- 母线电容 -->
  <line x1="505" y1="198" x2="535" y2="198" stroke="#334155" stroke-width="3"/>
  <line x1="505" y1="222" x2="535" y2="222" stroke="#334155" stroke-width="3"/>
  <text x="520" y="245" text-anchor="middle" font-size="11" fill="#334155">母线电容</text>

  <!-- 逆变器 -->
  <rect x="640" y="160" width="110" height="100" rx="10" fill="#fff" stroke="#334155" stroke-width="2"/>
  <text x="695" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">逆变器</text>
  <text x="695" y="223" text-anchor="middle" font-size="11" fill="#64748b">(内含大电容)</text>

  <!-- 母线电压表 -->
  <rect x="560" y="140" width="20" height="120" fill="none" stroke="#334155" stroke-width="2"/>
  <rect x="562" y="258" width="16" height="2" fill="#10b981">
    <animate attributeName="height" values="2;2;114;114" keyTimes="0;0.32;0.62;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="y" values="258;258;146;146" keyTimes="0;0.32;0.62;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <text x="570" y="132" text-anchor="middle" font-size="11" fill="#334155">母线电压</text>

  <!-- 预充电流（小、慢、橙） -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.34;0.60;0.62;1" dur="10s" repeatCount="indefinite"/>
    <circle r="5" fill="#f59e0b"><animateMotion dur="2.4s" begin="0s" repeatCount="indefinite" path="M160,210 H200 V110 H490 V210 H505"/></circle>
    <circle r="5" fill="#f59e0b"><animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite" path="M160,210 H200 V110 H490 V210 H505"/></circle>
    <circle r="5" fill="#f59e0b"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite" path="M160,210 H200 V110 H490 V210 H505"/></circle>
  </g>

  <!-- 主回路电流（大、绿） -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.65;0.67;1" dur="10s" repeatCount="indefinite"/>
    <circle r="7" fill="#10b981"><animateMotion dur="1.2s" begin="0s" repeatCount="indefinite" path="M160,210 H640"/></circle>
    <circle r="7" fill="#10b981"><animateMotion dur="1.2s" begin="0.4s" repeatCount="indefinite" path="M160,210 H640"/></circle>
    <circle r="7" fill="#10b981"><animateMotion dur="1.2s" begin="0.8s" repeatCount="indefinite" path="M160,210 H640"/></circle>
  </g>

  <!-- 阶段字幕 -->
  <g opacity="0">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.28;0.30;1" dur="10s" repeatCount="indefinite"/>
    <text x="400" y="320" text-anchor="middle" font-size="14" fill="#334155">上电前：继电器全断开，母线电容电压 = 0（直接合闸 = 短路冲击！）</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.34;0.60;0.62;1" dur="10s" repeatCount="indefinite"/>
    <text x="400" y="320" text-anchor="middle" font-size="14" fill="#b45309">第 1 步：合 K2，电流经电阻被"限流"，母线电压平缓爬升</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.65;0.68;1" dur="10s" repeatCount="indefinite"/>
    <text x="400" y="320" text-anchor="middle" font-size="14" fill="#059669">第 2 步：母线≈电池电压 → 合主继电器 K1、断 K2，无冲击全功率输出</text>
  </g>

  <!-- 时间轴 -->
  <g font-size="12" text-anchor="middle">
    <rect x="60" y="352" width="230" height="26" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="175" y="369" fill="#475569">① 全断开</text>
    <rect x="290" y="352" width="250" height="26" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="415" y="369" fill="#b45309">② 预充（约几百 ms）</text>
    <rect x="540" y="352" width="200" height="26" fill="#ecfdf5" stroke="#10b981"/>
    <text x="640" y="369" fill="#059669">③ 主继电器闭合</text>
  </g>
  <text x="400" y="410" text-anchor="middle" font-size="13" fill="#475569">预充失败判据：超时母线电压上不来 → 外部短路，禁止合主继电器</text>
</svg>
