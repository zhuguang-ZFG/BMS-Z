<svg data-sketch="1" xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 800 430" font-family="ui-monospace, Consolas, monospace" aria-label="同一份字节流换四种问法：正查哈希、反查来源、断言挑错、复核重问。裁判是 data_audit.py 与抄录的原字节；断言被逐条挑错，只有复问答案还稳得住。换问法复核是最难的一步。数字为教学示意" data-snapshot-time="9">
  <title>同一份字节流，四种问法（教学示意）</title>
  <desc>左：字节流进场；右侧四问一评：哈希对得上吗、来源改过吗、断言经得起挑错吗、换种问法答案还稳吗。程序复算在前，复问收尾。</desc>

