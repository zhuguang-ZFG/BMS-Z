<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="ui-monospace, Consolas, monospace">
  <title>标量卡尔曼增益随协方差演化：同样的 Q，测量越吵，稳态增益越小。数字为示意。</title>

  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #bf8700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.5; fill: none; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .dotg { fill: #1a7f37; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    .boxr { fill: #ffebe9; stroke: #cf222e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .dotg { fill: #3fb950; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
      .boxr { fill: #3d1214; stroke: #ff7b72; }
    }
  </style>

  <!-- formula: Ppred=P+Q; K=Ppred/(Ppred+R); P=(1-K)*Ppred -->
  <rect class="bg" width="800" height="500"/>
  <text class="title" x="24" y="32">增益会自己走到一个平台（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="122" rx="6"/>
  <text class="txt" x="40" y="68" opacity="0.28">① 起步<tspan class="small">　P=0.04，Q=0.0004。R=0.001 时第一步 K≈0.98。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="94" opacity="0.28">② 每步<tspan class="small">　P 先加 Q，再按 K=P/(P+R) 更新，更新后 P 变小。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="120" opacity="0.28">③ 测量较静<tspan class="small">　蓝线收到大约 0.46。还愿意听电压。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="146" opacity="0.28">④ 测量更吵<tspan class="small">　红线 R=0.02，稳态大约 0.13。平台区就该更接近这一头。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="182" width="752" height="250" rx="6"/>
  <text class="small" x="40" y="204">增益 K</text>
  <line class="axis" x1="92.0" y1="214.0" x2="92.0" y2="400.0"/>
  <line class="axis" x1="92.0" y1="400.0" x2="720.0" y2="400.0"/>
  <text class="small" x="712.0" y="418" text-anchor="end">更新步</text>
  <line class="grid" x1="92.0" y1="400.0" x2="92.0" y2="406.0"/>
  <text class="small" x="92.0" y="432" text-anchor="middle">0</text>
  <line class="grid" x1="253.0" y1="400.0" x2="253.0" y2="406.0"/>
  <text class="small" x="253.0" y="432" text-anchor="middle">10</text>
  <line class="grid" x1="720.0" y1="400.0" x2="720.0" y2="406.0"/>
  <text class="small" x="720.0" y="432" text-anchor="middle">39</text>
  <line class="grid" x1="86.0" y1="400.0" x2="92.0" y2="400.0"/>
  <text class="small" x="82.0" y="404.0" text-anchor="end">0</text>
  <line class="grid" x1="86.0" y1="307.0" x2="92.0" y2="307.0"/>
  <text class="small" x="82.0" y="311.0" text-anchor="end">0.5</text>
  <line class="grid" x1="86.0" y1="251.2" x2="92.0" y2="251.2"/>
  <text class="small" x="82.0" y="255.2" text-anchor="end">0.8</text>
  <line class="grid" x1="86.0" y1="214.0" x2="92.0" y2="214.0"/>
  <text class="small" x="82.0" y="218.0" text-anchor="end">1</text>
  <polyline class="lineb" points="92.0,218.5 108.1,292.3 124.2,308.0 140.3,312.2 156.4,313.3 172.5,313.7 188.6,313.8 204.7,313.8 220.8,313.8 236.9,313.8 253.0,313.8 269.1,313.8 285.2,313.8 301.3,313.8 317.4,313.8 333.5,313.8 349.6,313.8 365.7,313.8 381.8,313.8 397.9,313.8 414.1,313.8 430.2,313.8 446.3,313.8 462.4,313.8 478.5,313.8 494.6,313.8 510.7,313.8 526.8,313.8 542.9,313.8 559.0,313.8 575.1,313.8 591.2,313.8 607.3,313.8 623.4,313.8 639.5,313.8 655.6,313.8 671.7,313.8 687.8,313.8 703.9,313.8 720.0,313.8" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline class="liner" points="92.0,275.6 108.1,324.1 124.2,344.3 140.3,354.9 156.4,361.4 172.5,365.5 188.6,368.3 204.7,370.2 220.8,371.6 236.9,372.6 253.0,373.4 269.1,373.9 285.2,374.3 301.3,374.6 317.4,374.8 333.5,375.0 349.6,375.1 365.7,375.2 381.8,375.3 397.9,375.3 414.1,375.4 430.2,375.4 446.3,375.4 462.4,375.4 478.5,375.5 494.6,375.5 510.7,375.5 526.8,375.5 542.9,375.5 559.0,375.5 575.1,375.5 591.2,375.5 607.3,375.5 623.4,375.5 639.5,375.5 655.6,375.5 671.7,375.5 687.8,375.5 703.9,375.5 720.0,375.5" stroke-linejoin="round" stroke-linecap="round"/>
  <text class="hi" x="250" y="246">R=0.001，K 落到约 0.46</text>
  <text class="warn" x="250" y="268">R=0.020，K 落到约 0.13</text>
  <circle class="doty" r="6"><animate attributeName="cx" values="92.0;144.3;196.7;249.0;301.3;353.7;406.0;458.3;510.7;563.0;615.3;667.7;720.0" keyTimes="0;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="218.5;312.5;313.8;313.8;313.8;313.8;313.8;313.8;313.8;313.8;313.8;313.8;313.8" keyTimes="0;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1" dur="12s" repeatCount="indefinite"/></circle>
  <text class="small" x="24" y="478">这是一维随机游走配直接观测的示意，不是仓库 EKF 的调参，也不是某一块板的 Q、R。</text>
</svg>
