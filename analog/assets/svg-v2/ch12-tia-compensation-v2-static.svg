<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">反馈电容改变闭环阻尼与速度</title>
<desc id="figDesc">示意 Rf=1 MΩ、Cin=10 pF、A0=10⁵、fp=100 Hz；电流阶跃归一化。</desc>
<metadata id="visual-timeline">{&quot;duration&quot;: 12, &quot;beats&quot;: [{&quot;name&quot;: &quot;条件&quot;, &quot;start&quot;: 0, &quot;end&quot;: 3, &quot;caption&quot;: &quot;未补偿的二阶模型强烈振铃，不能仅凭它宣布持续振荡。&quot;}, {&quot;name&quot;: &quot;变化&quot;, &quot;start&quot;: 3, &quot;end&quot;: 6, &quot;caption&quot;: &quot;平方根初估给出一个起点，仍有可见过冲。&quot;}, {&quot;name&quot;: &quot;比较&quot;, &quot;start&quot;: 6, &quot;end&quot;: 9, &quot;caption&quot;: &quot;增大到零点六皮法，本模型的阻尼进一步增加。&quot;}, {&quot;name&quot;: &quot;结论&quot;, &quot;start&quot;: 9, &quot;end&quot;: 12, &quot;caption&quot;: &quot;一皮法响应更慢；最终值按噪声、速度与裕度选择。&quot;}]}</metadata>
