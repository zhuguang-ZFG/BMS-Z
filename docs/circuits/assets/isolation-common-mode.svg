<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 -156 800 620" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>共模电压与隔离动画</title>
  <desc>共模电压与隔离动画。示意。</desc><style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .fill-boxb { fill: #ddf4ff; }
    .fill-boxg { fill: #dafbe1; }
    .fill-boxr { fill: #ffebe9; }
    .fill-boxy { fill: #fff8c5; }
    .fill-b { fill: #0969da; }
    .fill-g { fill: #1a7f37; }
    .fill-r { fill: #cf222e; }
    .fill-y { fill: #9a6700; }
    .fill-ink { fill: #57606a; }
    .fill-muted { fill: #e2e8f0; }
    .fill-lockb { fill: #0969da; }
    .stroke-panel { stroke: #d0d7de; }
    .stroke-axis { stroke: #57606a; }
    .stroke-b { stroke: #0969da; }
    .stroke-g { stroke: #1a7f37; }
    .stroke-r { stroke: #cf222e; }
    .stroke-y { stroke: #bf8700; }
    .stroke-check { stroke: #ffffff; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .on { fill: #ffffff; font-size: 13px; font-weight: bold; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .fill-boxb { fill: #12233a; }
      .fill-boxg { fill: #0f2415; }
      .fill-boxr { fill: #3d1214; }
      .fill-boxy { fill: #2d2607; }
      .fill-b { fill: #4493f8; }
      .fill-g { fill: #3fb950; }
      .fill-r { fill: #ff7b72; }
      .fill-y { fill: #d29922; }
      .fill-ink { fill: #8b949e; }
      .fill-muted { fill: #30363d; }
      .fill-lockb { fill: #0969da; }
      .stroke-panel { stroke: #30363d; }
      .stroke-axis { stroke: #8b949e; }
      .stroke-b { stroke: #4493f8; }
      .stroke-g { stroke: #3fb950; }
      .stroke-r { stroke: #ff7b72; }
      .stroke-y { stroke: #d29922; }
      .stroke-check { stroke: #0d1117; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .on { fill: #ffffff; }
      .lineb { stroke: #4493f8; }
    }
</style><rect class="bg" x="0" y="-156" width="800" height="620" /><text class="title" x="24" y="-128">为什么板间通信必须隔离：300V 的"地"不一样</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 为什么板间通信必须隔离：300V 的"地"不一样<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 地 = +300V<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 直连 = 300V 电位差瞬间打进芯片 ⚡ 冒烟<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="408" width="752" height="44" rx="6" /><text class="small" x="40" y="436">300V 被挡在缝外，信号照常跳过。示意。</text><rect width="800" height="400" class="bg" />
  <g stroke-width="2" class="fill-boxb stroke-axis">
    <rect x="60" y="260" width="60" height="46" rx="4" />
    <rect x="60" y="210" width="60" height="46" rx="4" />
    <rect x="60" y="160" width="60" height="46" rx="4" />
    <rect x="60" y="110" width="60" height="46" rx="4" />
  </g>
  <g font-size="12" class="fill-ink">
    <text x="135" y="312">0V</text>
    <text x="135" y="262">+75V</text>
    <text x="135" y="212">+150V</text>
    <text x="135" y="162">+225V</text>
    <text x="135" y="112">+300V</text>
  </g>
  <text x="90" y="340" text-anchor="middle" font-size="12" class="txt">电池串（局部）</text>

  
  <rect x="220" y="250" width="150" height="70" rx="10" stroke-width="2" class="panel stroke-axis" />
  <text x="295" y="280" text-anchor="middle" font-size="13" font-weight="bold" class="txt">CMU1</text>
  <text x="295" y="300" text-anchor="middle" font-size="12" class="small">地 = 0V</text>
  <rect x="220" y="80" width="150" height="70" rx="10" stroke-width="2" class="panel stroke-axis" />
  <text x="295" y="110" text-anchor="middle" font-size="13" font-weight="bold" class="txt">CMU2</text>
  <text x="295" y="130" text-anchor="middle" font-size="12" class="warn">地 = +300V</text>
  <line x1="120" y1="283" x2="220" y2="283" stroke-width="1.5" stroke-dasharray="4 3" class="stroke-axis" />
  <line x1="120" y1="133" x2="220" y2="133" stroke-width="1.5" stroke-dasharray="4 3" class="stroke-axis" />

  
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.42;0.46;1" dur="8s" repeatCount="indefinite" />
    <line x1="370" y1="285" x2="480" y2="285" stroke-width="3" class="stroke-r" />
    <line x1="480" y1="285" x2="480" y2="115" stroke-width="3" class="stroke-r" />
    <line x1="480" y1="115" x2="370" y2="115" stroke-width="3" class="stroke-r" />
    <rect x="480" y="150" width="150" height="70" rx="10" stroke-width="2" class="fill-boxr stroke-r" />
    <text x="555" y="178" text-anchor="middle" font-size="13" font-weight="bold" class="warn">MCU/上位机</text>
    <text x="555" y="198" text-anchor="middle" font-size="12" class="warn">地 = 0V</text>
    
    <g stroke-width="3" stroke-linecap="round" class="stroke-y">
      <animate attributeName="opacity" values="1;0.2;1" dur="0.4s" repeatCount="indefinite" />
      <line x1="480" y1="190" x2="470" y2="172" />
      <line x1="480" y1="190" x2="492" y2="172" />
      <line x1="480" y1="190" x2="480" y2="168" />
    </g>
    <text x="555" y="255" text-anchor="middle" font-size="14" font-weight="bold" class="warn">直连 = 300V 电位差瞬间打进芯片 ⚡ 冒烟</text>
  </g>

  
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.46;0.5;1" dur="8s" repeatCount="indefinite" />
    <line x1="370" y1="200" x2="440" y2="200" stroke-width="3" class="stroke-axis" />
    <line x1="520" y1="200" x2="630" y2="200" stroke-width="3" class="stroke-axis" />
    
    <rect x="440" y="170" width="80" height="60" rx="8" stroke-width="2" class="fill-boxg stroke-g" />
    <line x1="480" y1="175" x2="480" y2="225" stroke-width="2" stroke-dasharray="5 4" class="stroke-g" />
    <text x="480" y="252" text-anchor="middle" font-size="12" font-weight="bold" class="ok">隔离器</text>
    
    <circle r="6" class="fill-b">
      <animateMotion dur="1.4s" repeatCount="indefinite" path="M380,200 H580" />
    </circle>
    <rect x="630" y="165" width="130" height="70" rx="10" stroke-width="2" class="panel stroke-axis" />
    <text x="695" y="193" text-anchor="middle" font-size="13" font-weight="bold" class="txt">MCU/上位机</text>
    <text x="695" y="213" text-anchor="middle" font-size="12" class="small">地 = 0V，安全</text>
    <text x="480" y="130" text-anchor="middle" font-size="13" class="ok">300V 被挡在缝外，信号照常跳过</text>
  </g>

  <text x="400" y="380" text-anchor="middle" font-size="14" class="small">隔离器不传直流电位、只传信号——磁耦 / 容耦 / 光耦 / 变压器（isoSPI）都是同一思想</text>
</svg>