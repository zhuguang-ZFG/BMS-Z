changes:
- id: ch18-two-way-validation
  source: docs/p4-03-ch18.md#18.3
  before: '系统级的「找差异」可以做成一张对照表：好板与坏板逐节点对量，把电压、纹波、波形的差值列成清单，按差异从大到小排序。差异最大的节点优先查，线索不用满地找。


    同一块板也可以自己做对照：常温与加温各量一遍，随温度变化最剧烈的参数就是热敏线索。


    循环节奏也有讲究。每一轮「观察—假设—实验」最好在十五到三十分钟内产出一个可证伪的结论。超过这个时间还没有结论，多半是实验设计太粗、一次想验证的东西太多，退回去把实验切小。


    「严验证」也要给结论定置信度。修完跑一次正常，那只是轶事。


    按故障原始条件重现多次不发，再把边界往外拉偏：供电上下拉偏 ±10%、温度走到规格两端、负载拉到额定点。全数通过，结论才从轶事升级为结论。


    这条标准写进故障单的关闭条件里：「原条件多次复现不发 + 边界拉偏通过 + 反向装回可复现」，三条缺一条，故障单不许关。看着苛刻，实则便宜：现场复发一次的代价，远超实验室里多做这几组拉偏。


    这套循环与第 16 章五步法是同一件事的两个尺度：五步法是工程流程的外壳，慢观察、快假设、严验证是每一步内部的思考引擎。


    观察阶段用慢观察兜底，定位阶段用假设树收网，验证阶段用双向验证收口。


    每循环一轮，顺手把「模型哪里错了、改成了什么」记成一行模型升级日志。故障档案记的是板子的病史，升级日志记的是你自己模型的成长史。


    如果今天只想带走三件事，就带这三件：一本摊开的记录本，一支写预测在先的笔，一份从今天起归档的故障档案。


    仪器可以慢慢升级，这三件零成本动作当晚就能开始。它们正是两位大师所有方法的公共地基：慢观察落在纸上，快假设写在测量前，严验证靠档案回放。方法不怕小，怕的是从明天开始。'
  after: '把好板与坏板的同一节点并排记录，比较电压、纹波、波形，优先查差异最大的节点；同一块板也可比较常温与加温，寻找热敏参数。每轮「观察—假设—实验」争取在十五到三十分钟内得到一个可证伪的结论，超时就缩小实验。


    下图的双向验证完成后，还须在原条件下多次复测，并把供电拉偏 ±10%、温度推到规格两端、负载拉到额定点。关闭条件是「原条件多次不发＋边界拉偏通过＋故障件装回可复现」，单次正常不能代替回归。


    这与第 16 章五步法相接：观察时记现象，定位时列假设，验证时做对照。每轮再记一行「模型错在哪里、怎样修正」，与故障档案一起归档。'
  caption: 修复要双向验证。正向证明好件能好，反向证明坏件仍坏；缺一条，故障单不许关
  removed_prose_chars: 423
  relationship: replaces-text
- id: legacy-figures-ch18-review-checklist
  source: docs/p4-03-ch18.md#18.4
  before: '读图指引：六组卡片共用同一个句式——“判据＋数字”，没有数字的条目没有打勾资格；便签不是装饰，是每组卡片的立法理由。用的时候倒着走一遍 18.4 的三问：这条防住 17 章哪一行？防不住时哪道检测能拦住？归哪道关口负责？答不上来的条目，要么补数字，要么删掉。


    倒推法本身也有操作格式。从 [第 17 章](p4-02-ch17.md#ch17) 每取一行故障，连问三句——画板前能立哪条约束防住它？万一防不住，哪道检测能在出厂前拦住它？这条约束归哪道关口负责？三个答案写全，一行故障就变成一条评审项。'
  after: 读图时对每张卡追问：它防住第 17 章哪种故障？失效后由哪道检测拦截？归哪个关口负责？把约束、检测方法和责任关口写全，故障记录就变成了可执行的评审项。
  caption: 把表 18-1 的四道关口按领域重排成六组勾选卡，每条判据都带可判定的数字：去耦贴脸、LDO 温升 84°C、热插拔浪涌 25A、负载拉偏 ±10%、老化 24h。三张便签给出判据背后的理由：Pease
    的“先量电源”解释电源组为何排第一顺位，Williams 的“先预测波形”解释信号链组为何先写预测，1-10-100 法则是整张表存在的理由。
  removed_prose_chars: 168
  relationship: replaces-text
- id: legacy-figures-ch18-four-gates
  source: docs/p4-03-ch18.md#18.4
  before: 四道关口为什么必须按这个顺序走、而且"不通过不往下走"？因为同一处错误，在原理图上是改一行连线的几分钟，到了客户手里就是一次召回。把表 18-1 画成四道闸，每道闸拦什么、漏了落进 17
    章哪一行、闸顶的代价爬多快，就都在一张图上了。
  after: 沿四拍回查：哪道评审能把修复前移？
  caption: 表 18-1 的立体版：潜在故障从左流入，原理图、布局、首板上电、出货回归四道闸依次削窄流带；闸顶阶梯按 1-10-100 法则爬升——几分钟、几小时加重布、几周加打样费、召回。闸下卡片列出各关的打勾判据（100nF、2×
    余量、<2mm、50mA、-20~70°C、±10%、≥24h），以及漏判后落进的 17 章条目。
