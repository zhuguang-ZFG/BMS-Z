<text class="small" x="24.0" y="372.0" text-anchor="start">种子 7 的结果：长窗最优 τ = 43 s，K 偏差 0.035 mV；短窗最优落在网格右端 120 s，K 偏差 16.6 mV（约 2.08 pp）。</text>
<text class="small" x="24.0" y="396.0" text-anchor="start">这不是「短窗必然更差」的普遍定律：无噪声时短窗也能命中 45 s，只有测量噪声把 K 与 A 的互换放大后才出现边界解。</text>
