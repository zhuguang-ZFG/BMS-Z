<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="ttl">
<title id="ttl">LC 谐振：电场与磁场的「荡秋千」</title>
<desc>LC 谐振：电场与磁场的「荡秋千」；节拍：① f₀=1/(2π√LC)：感抗与容抗恰好相等、正负抵消——回路只剩 R，电流冲到最大；② 能量的秋千：电场能（C）与磁场能（L）每周期来回倒两次——R 只是倒腾途中的摩擦；③ Q=ω₀L/R：R 越小 Q 越高、峰越尖——收音机选台、晶振稳频靠的都是高 Q</desc>
