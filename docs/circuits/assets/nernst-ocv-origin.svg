<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 544" font-family="ui-monospace, Consolas, monospace">
  <title>能斯特形状的开路电压：半满最平，两端变陡。0 和 1 是竖直渐近线。数字为示意。</title>

  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #bf8700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.5; fill: none; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
    }
  </style>

  <!-- formula: V=3.70+0.080*ln(s/(1-s)); 0.080 V is about 3*(RT/F) at 25 C -->
  <rect class="bg" width="800" height="544"/>
  <text class="title" x="24" y="32">开路电压的弯，来自格子还空不空（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="128" rx="6"/>
  <text class="txt" x="40" y="72" opacity="0.28">① 很空<tspan class="small">　s=0.08，电压示意 3.505 V。坡已经比中间陡。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="98" opacity="0.28">② 往半满走<tspan class="small">　空位还多，ln 项往 0 收，坡变缓。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="124" opacity="0.28">③ 半满<tspan class="small">　ln(1)=0，电压正好 3.70 V。这里最平。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="150" opacity="0.28">④ 快满<tspan class="small">　s=0.92，电压示意 3.895 V。另一头又变陡。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="188" width="752" height="304" rx="6"/>
  <text class="small" x="40" y="210">电压 V（示意）</text>
  <line class="axis" x1="108.0" y1="228.0" x2="108.0" y2="430.0"/>
  <line class="axis" x1="108.0" y1="430.0" x2="730.0" y2="430.0"/>
  <text class="small" x="730.0" y="468.0" text-anchor="end">荷电 s（0 和 1 是竖直渐近线，图停在 0.08–0.92）</text>
  <line class="grid" x1="232.4" y1="430.0" x2="232.4" y2="436.0"/>
  <text class="small" x="232.4" y="452.0" text-anchor="middle">0.2</text>
  <line class="grid" x1="419.0" y1="430.0" x2="419.0" y2="436.0"/>
  <text class="small" x="419.0" y="452.0" text-anchor="middle">0.5</text>
  <line class="grid" x1="605.6" y1="430.0" x2="605.6" y2="436.0"/>
  <text class="small" x="605.6" y="452.0" text-anchor="middle">0.8</text>
  <line class="grid" x1="102.0" y1="398.9" x2="108.0" y2="398.9"/>
  <text class="small" x="98.0" y="402.9" text-anchor="end">3.50</text>
  <line class="grid" x1="102.0" y1="336.8" x2="108.0" y2="336.8"/>
  <text class="small" x="98.0" y="340.8" text-anchor="end">3.70</text>
  <line class="grid" x1="102.0" y1="274.6" x2="108.0" y2="274.6"/>
  <text class="small" x="98.0" y="278.6" text-anchor="end">3.90</text>
  <polyline class="lineb" points="157.8,397.5 164.3,394.1 170.8,391.1 177.4,388.4 183.9,385.8 190.4,383.5 196.9,381.3 203.5,379.2 210.0,377.3 216.5,375.4 223.1,373.6 229.6,371.9 236.1,370.3 242.7,368.7 249.2,367.2 255.7,365.8 262.3,364.3 268.8,363.0 275.3,361.6 281.8,360.3 288.4,359.0 294.9,357.8 301.4,356.5 308.0,355.3 314.5,354.2 321.0,353.0 327.6,351.8 334.1,350.7 340.6,349.6 347.2,348.5 353.7,347.4 360.2,346.3 366.8,345.2 373.3,344.1 379.8,343.1 386.3,342.0 392.9,341.0 399.4,339.9 405.9,338.9 412.5,337.8 419.0,336.8 425.5,335.7 432.1,334.7 438.6,333.6 445.1,332.6 451.7,331.5 458.2,330.5 464.7,329.4 471.2,328.3 477.8,327.3 484.3,326.2 490.8,325.1 497.4,324.0 503.9,322.8 510.4,321.7 517.0,320.6 523.5,319.4 530.0,318.2 536.6,317.0 543.1,315.8 549.6,314.5 556.2,313.2 562.7,311.9 569.2,310.6 575.7,309.2 582.3,307.8 588.8,306.3 595.3,304.8 601.9,303.2 608.4,301.6 614.9,299.9 621.5,298.1 628.0,296.3 634.5,294.3 641.1,292.3 647.6,290.1 654.1,287.7 660.6,285.2 667.2,282.4 673.7,279.4 680.2,276.0" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="doty" r="6"><animate attributeName="cx" values="157.8;203.5;242.7;288.4;334.1;373.3;419.0;464.7;503.9;549.6;595.3;634.5;680.2" keyTimes="0.0000;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1.0000" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="397.5;379.2;368.7;359.0;350.7;344.1;336.8;329.4;322.8;314.5;304.8;294.3;276.0" keyTimes="0.0000;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1.0000" dur="12s" repeatCount="indefinite"/></circle>
  <text class="hi" x="450.1" y="311.9">3.70+0.080·ln(s/(1−s))</text>
  <text class="small" x="24" y="528">0.080 V 大约是 25 °C 下 RT/F（约 26 mV）的三倍，把活度收成一个教学系数。不是某一颗电芯的 OCV 表。</text>
</svg>
