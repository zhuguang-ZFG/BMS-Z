</style><rect class="bg" x="0" y="-156" width="880" height="660" /><text class="title" x="24" y="-128">电池云仪表盘上该有的格子</text><rect class="panel" x="24" y="-112" width="832" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 电池云仪表盘上该有的格子<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 车队画面（示意）<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ SOC / 温度<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="448" width="832" height="44" rx="6" /><text class="small" x="40" y="476">正常存储可以到 30 s。平台安静不等于包安静。示意。</text><rect width="880" height="440" class="bg" />
  <text x="440" y="50" text-anchor="middle" font-size="13" class="gold">示意图·待实拍</text>
  <rect x="24" y="72" width="560" height="230" rx="8" class="panel" />
  <text x="40" y="100" font-size="14" font-weight="bold" class="txt">车队画面（示意）</text>
  <rect x="40" y="116" width="160" height="70" rx="4" class="fill-boxb stroke-b"><animate attributeName="stroke-width" values="5;2;5" keyTimes="0;0.7;1" dur="8s" repeatCount="indefinite" /></rect>
  <text x="120" y="146" text-anchor="middle" font-size="13" class="txt">各串电压</text>
  <text x="120" y="166" text-anchor="middle" font-size="12" class="txt">迟到的一帧</text>
  <rect x="216" y="116" width="160" height="70" rx="4" class="fill-boxy stroke-y" />
  <text x="296" y="146" text-anchor="middle" font-size="13" class="txt">包内 DTC</text>
  <text x="296" y="166" text-anchor="middle" font-size="12" class="txt">时间早于平台</text>
  <rect x="392" y="116" width="168" height="70" rx="4" class="fill-muted stroke-axis"><animate attributeName="stroke-width" values="2;5;2" keyTimes="0;0.7;1" dur="8s" repeatCount="indefinite" /></rect>
  <text x="476" y="146" text-anchor="middle" font-size="13" class="txt">SOC / 温度</text>
  <text x="476" y="166" text-anchor="middle" font-size="12" class="txt">统计用</text>
  <text x="40" y="220" font-size="13" class="txt">正常存储可以到 30 s。平台安静不等于包安静。</text>
  <text x="40" y="248" font-size="13" class="txt">蓝点还在链路上时，包上的充电 MOS 可以已经断开。</text>
  <circle cy="186" r="6" class="fill-b">
    <animate attributeName="cx" values="40;520;40" keyTimes="0;0.7;1" dur="8s" repeatCount="indefinite" />
  </circle>
  <rect x="604" y="72" width="252" height="230" rx="8" class="fill-boxr stroke-r" />
  <text x="730" y="108" text-anchor="middle" font-size="15" font-weight="bold" class="txt">留在包上</text>
  <text x="730" y="144" text-anchor="middle" font-size="13" class="txt">比较器</text>
  <text x="730" y="168" text-anchor="middle" font-size="13" class="txt">接触器 / MOS</text>
  <text x="730" y="200" text-anchor="middle" font-size="13" class="warn">这一拍就切断</text>
  <text x="730" y="232" text-anchor="middle" font-size="13" class="txt">不看云端是否在线</text>
  <text x="24" y="332" font-size="14" class="txt">公共汽车 GPS 控制室和车队定位界面没有单体电压，也没有包内 DTC，没有收。</text>
  <text x="24" y="360" font-size="14" class="txt">这张格子是电池云该有的内容。仪表盘实拍仍然没有。</text>

</svg>