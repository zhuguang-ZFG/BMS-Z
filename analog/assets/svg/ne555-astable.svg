<title id="ttl">555 无稳态振荡：内部三块拼图，外面三只元件（R1=R2=10k, C=10µF）</title>
<desc>555 无稳态振荡：内部三块拼图，外面三只元件（R1=R2=10k, C=10µF）；节拍：① 充电（绿）：电流经 R1+R2 给电容充值 → 到 6V 时 THRES 比较器翻转；② 放电（红）：放电管导通，电容经 R2 从 7 脚泄放 → 到 3V 时 TRIG 翻转</desc>
