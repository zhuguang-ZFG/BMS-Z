</style><rect class="bg" x="0" y="-156" width="800" height="796"/><text class="title" x="24" y="-128" opacity="1" style="opacity: 1;">内阻：带载「腿软」，卸载回弹</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6"/><text class="txt" x="40" y="-88" opacity="1" style="opacity: 1;">① 带载时端电压腿软，卸掉负载会回弹。</text><text class="txt" x="40" y="-66" opacity="1" style="opacity: 1;">② 底栏 ΔV=I×R。20 A、20 mΩ 掉 0.40 V。</text><text class="txt" x="40" y="-44" opacity="1" style="opacity: 1;">③ 同一电流，60 mΩ 掉 1.20 V。</text><text class="txt" x="40" y="-22" opacity="1" style="opacity: 1;">④ 黄点沿 20 mΩ 那条走。数字是示意。</text><rect width="800" height="640" class="bg"/>
