</g>
<text x="774" y="242" text-anchor="middle" font-family="'Book Mono',monospace" font-size="13" fill="#b45309">H1?</text>

<text x="168" y="320" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="16" fill="#52606d">五步走一遍，每一步都留下可复查的记录。</text>

<g>
<circle cx="200" cy="390" r="20" fill="#fffdf8" stroke="#b42318" stroke-width="2"/>
<text x="200" y="397" text-anchor="middle" font-family="'Book Mono',monospace" font-size="17" font-weight="700" fill="#b42318">1</text>
<text x="200" y="354" text-anchor="middle" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="17" font-weight="700" fill="#14213d">症状确认</text>
<text x="200" y="430" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12.5" fill="#52606d">先问再拆</text>
<text x="200" y="448" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12.5" fill="#52606d">带载？温度？</text>
</g>
<g>
<circle cx="350" cy="390" r="20" fill="#fffdf8" stroke="#b45309" stroke-width="2"/>
