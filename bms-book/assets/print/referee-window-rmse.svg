  <rect class="win" x="424" y="132" width="52" height="162" opacity="0.0576921" style="opacity: 0.0576921;"><rect class="winb" x="424" y="132" width="52" height="162"/></rect>

  <!-- bars -->
  <text class="small" x="520" y="132">RMSE / mV</text>
  <line class="axis" x1="520" y1="140" x2="520" y2="290"/>
