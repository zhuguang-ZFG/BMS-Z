<text x="252" y="296" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f5d7a">−A</text>
<text x="252" y="318" text-anchor="middle" font-size="10" fill="#5b666f">反相放大</text>
<path d="M168 300 Q180.00 300.11 192 300" fill="none" stroke="#37424e" stroke-width="2.5"/>
