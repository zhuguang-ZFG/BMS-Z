</style><rect class="bg" x="0" y="-156" width="880" height="640" /><text class="title" x="24" y="-128">电池 HIL 台：电芯模拟器、注入、被测包</text><rect class="panel" x="24" y="-112" width="832" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 电池 HIL 台：电芯模拟器、注入、被测包<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 每串一个浮地电压<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 断采样线、短 NTC<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="428" width="832" height="44" rx="6" /><text class="small" x="40" y="456">1985 年的模拟计算机局部不是这张台子，所以没有收那张照片。示意。</text><rect width="880" height="420" class="bg" />
  <text x="440" y="50" text-anchor="middle" font-size="13" class="gold">示意图·待实拍</text>
  <rect x="24" y="78" width="190" height="130" rx="8" class="fill-boxb stroke-b"><animate attributeName="stroke-width" values="5;2;2;2;5" keyTimes="0;0.3;0.6;0.85;1" dur="8s" repeatCount="indefinite" /></rect>
  <text x="119" y="112" text-anchor="middle" font-size="14" font-weight="bold" class="txt">可编程电源</text>
  <text x="119" y="136" text-anchor="middle" font-size="12" class="txt">每串一个浮地电压</text>
  <text x="119" y="158" text-anchor="middle" font-size="12" class="txt">代替真电芯</text>
  <rect x="238" y="78" width="190" height="130" rx="8" class="fill-boxy stroke-y"><animate attributeName="stroke-width" values="2;5;2;2;2" keyTimes="0;0.3;0.6;0.85;1" dur="8s" repeatCount="indefinite" /></rect>
  <text x="333" y="112" text-anchor="middle" font-size="14" font-weight="bold" class="txt">故障注入</text>
  <text x="333" y="136" text-anchor="middle" font-size="12" class="txt">断采样线、短 NTC</text>
  <text x="333" y="158" text-anchor="middle" font-size="12" class="txt">停掉一路电压</text>
  <rect x="452" y="78" width="190" height="130" rx="8" class="panel"><animate attributeName="stroke-width" values="2;2;5;2;2" keyTimes="0;0.3;0.6;0.85;1" dur="8s" repeatCount="indefinite" /></rect>
  <text x="547" y="112" text-anchor="middle" font-size="14" font-weight="bold" class="txt">被测 BMS</text>
  <text x="547" y="136" text-anchor="middle" font-size="12" class="txt">跑真实固件</text>
  <text x="547" y="158" text-anchor="middle" font-size="12" class="txt">看去抖和快照</text>
  <rect x="666" y="78" width="190" height="130" rx="8" class="fill-boxg stroke-g"><animate attributeName="stroke-width" values="2;2;2;5;2" keyTimes="0;0.3;0.6;0.85;1" dur="8s" repeatCount="indefinite" /></rect>
  <text x="761" y="112" text-anchor="middle" font-size="14" font-weight="bold" class="txt">上位机</text>
  <text x="761" y="136" text-anchor="middle" font-size="12" class="txt">对清单逐项判定</text>
  <text x="761" y="158" text-anchor="middle" font-size="12" class="txt">记下第一现场</text>
  <circle cy="143" r="6" class="fill-b">
    <animate attributeName="cx" values="119;333;547;761;119" keyTimes="0;0.3;0.6;0.85;1" dur="8s" repeatCount="indefinite" />
  </circle>
  <text x="24" y="246" font-size="14" class="txt">1985 年的模拟计算机局部不是这张台子，所以没有收那张照片。</text>
  <text x="24" y="274" font-size="14" class="txt">PC 上的 hil_replay 只喂脚本电压，没有机架，也没有开线检测。</text>
  <text x="24" y="302" font-size="14" class="warn">不要对真电池做短路或过充注入。蓝点沿模拟器、注入、被测板、上位机走。</text>

</svg>