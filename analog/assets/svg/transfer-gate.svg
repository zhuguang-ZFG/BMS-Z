<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640" role="img" aria-labelledby="ttl">
<title id="ttl">CMOS 传输门：一只管子总有一段「使不上劲」</title>
<desc>CMOS 传输门：一只管子总有一段「使不上劲」；节拍：① 低端：NMOS 的 V_GS 最足 → 20Ω；此时 PMOS 的 V_SG 反而最弱；② 高端：NMOS 的 V_GS→0，Ron→∞ 彻底罢工——这就是「N 管传高电平会掉一个 V_T」；③ 两只并联：低端 N 扛、高端 P 扛、中间一起扛 → Ron 全程 20~27Ω；④ 代价只是多一只管子和一个反相控制——所以模拟开关内部永远是「传输门」</desc>
