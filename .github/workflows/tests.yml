name: tests

# 和 links 共用一个排队组：两个工作流同时要 runner 时，后一个先等着，
# 不要四个 job 一起在 15 分钟后被取消。
concurrency:
  group: bms-z-ci-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    # BMS*.html 指仓库根的 BMS学习路径.html——它由站点托管，产物侧门禁要查它的图片。
    # 用通配而不是中文文件名，避免过滤规则在非 ASCII 路径上匹配不到。
    paths: ["code/**", "docs/**", "README.md", "BMS*.html", "ruff.toml", "package.json", "package-lock.json", "challenges/**", ".github/workflows/tests.yml", ".github/scripts/**"]
  pull_request:
    paths: ["code/**", "docs/**", "README.md", "BMS*.html", "ruff.toml", "package.json", "package-lock.json", "challenges/**", ".github/workflows/tests.yml", ".github/scripts/**"]

jobs:
  # 四个 job 同时排队时，托管 runner 往往只接走一两个，其余在约 15 分钟后
  # 以 “not acquired by Runner” 被取消（步骤是空的，不是测试失败）。
  # 所以排成一列：前一个成功再排队下一个，每个 job 单独计算那 15 分钟。
  #
  # runner 镜像钉死 24.04：ubuntu-latest 从 2026-10-19 起迁移到 Ubuntu 26
  # （run 日志里的 Notice），届时整条工具链版本一起跳变。钉死之后升级是一次
  # 有意的提交——本地复跑确认全绿再改，而不是某天早上 CI 自己变红。
  #
  # checkout / setup-python 取 Node 24 大版本：GitHub 已弃用 Node 20，v4/v5
  # 声明的 node20 会被运行器强制跑在 Node 24 上并打弃用警告（见 run
  # 37176012433 日志），迟早彻底停跑。
  docs-consistency:
    needs: python-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: SVG count + relative links + code paths
        run: python .github/scripts/check_docs.py

  python-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # 只抓 bug，不查格式：规则集与理由见 ruff.toml 顶部注释。
      # 版本钉死——否则 ruff 发新版加了规则，CI 会毫无征兆变红。
      # 升级：本地装同版本跑 `ruff check` 确认全绿，再改这里的 version。
      # 注意 action 自身也要精确 tag：这个仓库没有浮动的 v4 别名，写 @v4
      # 会在解析阶段就失败（ruff 根本没跑）。
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.15.21"
          args: check

  python:
    needs: c-firmware
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/requirements.txt
      - run: pip install -r code/requirements.txt
      - name: soc tests
        working-directory: code/soc
        run: python -m pytest tests/ -q
      - name: protocol tests
        working-directory: code/protocol
        run: python -m pytest tests/ -q
      - name: arena baselines
        run: python -m pytest challenges/01-soc/test_arena.py challenges/02-frames/test_rescue.py -q
      - name: soc comparison smoke run
        working-directory: code/soc
        run: python compare.py

  c-firmware:
    needs: docs-consistency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: build and run state machine tests
        working-directory: code/firmware
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -o test_bms bms.c test_bms.c
          ./test_bms
          gcc -std=c99 -Wall -Wextra -Werror -o hil_replay bms.c hil_replay.c
          ./hil_replay

  # 站点构建闸门。deploy-pages.yml 只在 push 到 main 时跑，PR 上没人构建过站点——
  # 一个改坏的链接或一处 VitePress 报错要等合并之后才在部署里变红，那时已经上线了。
  # 所以闸门在这边（PR 与 push 都跑：装依赖、构建、对产物跑 check_pages.py），
  # 部署在那边（只有 main 能发）。check_pages.py 的用法与部署里那条一模一样。
  site-build:
    needs: python
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: VitePress 构建
        run: npm run docs:build
      - name: 站内链接、锚点与每页入口对账（dist 侧）
        run: python3 .github/scripts/check_pages.py docs/.vitepress/dist
      - name: 中文检索对账（正文有的词搜索必须翻到）
        run: node .github/scripts/check_search.mjs docs/.vitepress/dist
