<text x="244" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f7f96">Cbc 10pF</text>
<rect x="86" y="387" width="219" height="23" rx="6" fill="#f6eedb" stroke="#2f7f96" stroke-width="1"/><text x="196" y="402" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f7f96">两端压差 = ΔVb − ΔVc = (1+A)·ΔVb</text>
<rect x="76" y="423" width="241" height="23" rx="6" fill="#f6eedb" stroke="#a4630f" stroke-width="1"/><text x="196" y="438" text-anchor="middle" font-size="11" font-weight="bold" fill="#a4630f">同一份电荷 Q = C·ΔU，输入源要多搬 A 倍</text>
<g filter="url(#pglow)"><circle r="3.4" fill="#2f7f96"><animateMotion dur="16s" begin="-0.50s" repeatCount="indefinite" path="M168,196 L236,196" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle></g><g filter="url(#pglow)"><circle r="3.4" fill="#2f7f96"><animateMotion dur="16s" begin="-0.50s" repeatCount="indefinite" path="M252,196 L368,196 L368,300" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle></g><rect x="400" y="110" width="352" height="58" rx="7" fill="none" stroke="#a4630f" stroke-width="1.8" opacity="0.9"><animate attributeName="y" values="134;192;250;308;366;424;424" keyTimes="0;0.166667;0.333333;0.5;0.666667;0.833333;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/></rect>
<text x="412" y="134" font-size="11.5" font-weight="bold" fill="#a4630f">① 敌人是谁</text><text x="412" y="159" font-size="14.5" font-weight="bold" fill="#16202b">Cbc 跨在输入与输出之间</text><text x="412" y="176" font-size="10.5" fill="#5b666f">共射的集电结电容、共源的 Cgd</text>
<text x="412" y="192" font-size="11.5" font-weight="bold" fill="#a4630f">② 输出反着摆</text><text x="412" y="217" font-size="14.5" font-weight="bold" fill="#16202b">ΔVc = −A · ΔVb</text><text x="412" y="234" font-size="10.5" fill="#5b666f">共射反相：输入升，输出降</text><rect x="400" y="168" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.166667;0.196667;1" dur="16s" repeatCount="indefinite"/></rect>
<text x="412" y="250" font-size="11.5" font-weight="bold" fill="#a4630f">③ 电容承受的压差</text><text x="412" y="275" font-size="14.5" font-weight="bold" fill="#16202b">(1+A)·ΔVb</text><text x="412" y="292" font-size="10.5" fill="#5b666f">两端往相反方向跑，摆幅被撬大</text><rect x="400" y="226" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.333333;0.363333;1" dur="16s" repeatCount="indefinite"/></rect>
<text x="412" y="308" font-size="11.5" font-weight="bold" fill="#a4630f">④ 折回输入端</text><text x="412" y="333" font-size="14.5" font-weight="bold" fill="#16202b">C_in = Cbc · (1+A)</text><text x="412" y="350" font-size="10.5" fill="#5b666f">同一份电荷，输入源要多供 (1+A) 倍</text><rect x="400" y="284" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.5;0.53;1" dur="16s" repeatCount="indefinite"/></rect>
<text x="412" y="366" font-size="11.5" font-weight="bold" fill="#a4630f">⑤ 代入数字</text><text x="412" y="391" font-size="14.5" font-weight="bold" fill="#16202b">10pF × (1+100) ≈ 1.01nF</text><text x="412" y="408" font-size="10.5" fill="#5b666f">10pF 的小电容，看起来像 1nF</text><rect x="400" y="342" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.666667;0.696667;1" dur="16s" repeatCount="indefinite"/></rect>
<text x="412" y="424" font-size="11.5" font-weight="bold" fill="#a4630f">⑥ 带宽被谁定</text><text x="412" y="449" font-size="14.5" font-weight="bold" fill="#16202b">f_H = 1/(2π·Rs·C_in) ≈ 15.8kHz</text><text x="412" y="466" font-size="10.5" fill="#5b666f">Rs=10kΩ：想放到 MHz？早滚降了</text><rect x="400" y="400" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.833333;0.863333;1" dur="16s" repeatCount="indefinite"/></rect>
<g><rect x="30" y="612" width="740" height="34.0" rx="9" fill="#e8efe6" stroke="#3d6b4a" stroke-width="1.5" filter="url(#soft)"/><rect x="36" y="619" width="3" height="20.0" rx="1.5" fill="#3d6b4a"/><text x="400" y="634.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3d6b4a">增益越高，这只寄生电容越「重」——带宽与增益，从管子出生那天就在互相挤压</text></g></svg>