<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="ui-monospace, Consolas, monospace">
  <title>热失控沿电芯传播：先失控的那节、被烤到的邻居、还凉着的下一节。切断外部电流带不走已有的热。数字为示意。</title>
  <desc>柱子逐节升起：第 1 节冲到 120 °C 不回落，接触器打开也带不走已有的热，邻居跟着热，下一节还凉着。</desc>

  <style>
    .bg { fill: #fffdf5; }
    .panel { fill: #f7f2e5; stroke: #cfc6b2; }
    .axis { stroke: #626d65; stroke-width: 1.5; fill: none; }
    .txt { fill: #293b3a; font-size: 13px; }
    .small { fill: #626d65; font-size: 12px; }
    .title { fill: #293b3a; font-size: 16px; font-weight: bold; }
    .hi { fill: #176b73; }
    .warn { fill: #b84745; }
    .ok { fill: #377b60; }
    .gold { fill: #926717; }
    .lineb { stroke: #176b73; stroke-width: 2.5; fill: none; }
    .liner { stroke: #b84745; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #377b60; stroke-width: 2.5; fill: none; }
    .liney { stroke: #926717; stroke-width: 2.5; fill: none; }
    .dotb { fill: #176b73; }
    .dotr { fill: #b84745; }
    .dotg { fill: #377b60; }
    .doty { fill: #926717; }
    .boxb { fill: #e4f0df; stroke: #176b73; }
    .boxr { fill: #f6e2df; stroke: #b84745; }
    .boxg { fill: #e4f0df; stroke: #377b60; }
    .boxy { fill: #fbefc7; stroke: #926717; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #192727; }
      .panel { fill: #223333; stroke: #496160; }
      .axis { stroke: #b0beb3; }
      .txt { fill: #edf0e5; }
      .small { fill: #b0beb3; }
      .title { fill: #edf0e5; }
      .hi { fill: #7ec5c5; }
      .warn { fill: #f39b91; }
      .ok { fill: #8fc7a2; }
      .gold { fill: #dfbd78; }
      .lineb { stroke: #7ec5c5; }
      .liner { stroke: #f39b91; }
      .lineg { stroke: #8fc7a2; }
      .liney { stroke: #dfbd78; }
      .dotb { fill: #7ec5c5; }
      .dotr { fill: #f39b91; }
      .dotg { fill: #8fc7a2; }
      .doty { fill: #dfbd78; }
      .boxb { fill: #293f35; stroke: #7ec5c5; }
      .boxr { fill: #483336; stroke: #f39b91; }
      .boxg { fill: #293f35; stroke: #8fc7a2; }
      .boxy { fill: #453e2b; stroke: #dfbd78; }
    }
  </style>

  <rect class="bg" width="800" height="460"/>

  <text class="title" x="24" y="32">热失控传到隔壁：切断外部电流，带不走已经在芯里的热（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="122" rx="6"/>
  <text class="txt" x="40" y="68" opacity="0.28">① 第 1 节越线<tspan class="small">　示意从 45 °C 冲到 120 °C 以上，开始排气。dT/dt 比绝对温度更早。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="94" opacity="0.28">② 接触器打开<tspan class="small">　外部充放电电流被切断。这一拍止住的是外面的能量，不是芯里的反应。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="120" opacity="0.28">③ 第 2 节跟着热<tspan class="small">　示意隔一段时间升到 80 °C。隔壁的温升速率是传播的早信号。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="146" opacity="0.28">④ 第 3 节仍凉<tspan class="small">　示意还在 35 °C。传播有先后，不是整包同时着。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="180" width="752" height="210" rx="6"/>
<text class="small" x="40" y="198">柱高 30–120 °C，满高仍在框内。接触器打开后第 1 节不落回去。</text>
  <rect class="boxr" x="80" y="220" width="140" height="120" rx="8"/>
  <rect class="dotr" x="120" y="316.5" width="60" height="13.5">
    <animate calcMode="spline" keySplines="0.16 1 0.3 1;0.42 0 0.58 1" attributeName="height" values="13.5;81.0;81.0" keyTimes="0;0.25;1" dur="12s" repeatCount="indefinite"/>
    <animate calcMode="spline" keySplines="0.7 0 0.84 0;0.42 0 0.58 1" attributeName="y" values="316.5;249.0;249.0" keyTimes="0;0.25;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text class="txt" x="150" y="236" text-anchor="middle">第 1 节</text>
  <text class="small" x="150" y="358" text-anchor="middle">冲到 120 °C 后保持</text>
  <rect class="boxy" x="300" y="220" width="140" height="120" rx="8"/>
  <rect class="doty" x="340" y="325.5" width="60" height="4.5">
    <animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="height" values="4.5;4.5;45.0;45.0" keyTimes="0;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <animate calcMode="spline" keySplines="0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="y" values="325.5;325.5;285.0;285.0" keyTimes="0;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text class="txt" x="370" y="236" text-anchor="middle">第 2 节</text>
  <text class="small" x="370" y="358" text-anchor="middle">稍后到 80 °C</text>
  <rect class="boxg" x="520" y="220" width="140" height="120" rx="8"/>
  <rect class="dotg" x="560" y="325.5" width="60" height="4.5"/>
  <text class="txt" x="590" y="236" text-anchor="middle">第 3 节</text>
  <text class="small" x="590" y="358" text-anchor="middle">仍约 35 °C</text>
  <text class="small" x="24" y="446">温度和时间都是示意，不是热失控实验记录。打开接触器不能当成「火已经停下」。传播取决于包的隔热，不取决于这一张图。</text>

</svg>
