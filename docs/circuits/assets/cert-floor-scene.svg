</style><rect class="bg" x="0" y="-156" width="880" height="640" /><text class="title" x="24" y="-128">认证现场要看见的三件事</text><rect class="panel" x="24" y="-112" width="832" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 认证现场要看见的三件事<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 或抬高一串模拟电压<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 不经过这颗 MCU<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="428" width="832" height="44" rx="6" /><text class="small" x="40" y="456">本节不编 ISO 条款号。绿点沿注入、硬件切断、记录走。现场实拍仍然没有。</text><rect width="880" height="420" class="bg" />
  <text x="440" y="50" text-anchor="middle" font-size="13" class="gold">示意图·待实拍</text>
  <rect x="24" y="78" width="260" height="170" rx="8" class="panel"><animate attributeName="stroke-width" values="5;2;2;5" keyTimes="0;0.4;0.75;1" dur="8s" repeatCount="indefinite" /></rect>
  <text x="154" y="110" text-anchor="middle" font-size="15" font-weight="bold" class="txt">失效注入台</text>
  <text x="154" y="140" text-anchor="middle" font-size="13" class="txt">拔一根采样线</text>
  <text x="154" y="164" text-anchor="middle" font-size="13" class="txt">或抬高一串模拟电压</text>
  <text x="154" y="196" text-anchor="middle" font-size="13" class="txt">停掉喂狗</text>
  <rect x="308" y="78" width="260" height="170" rx="8" class="fill-boxy stroke-y"><animate attributeName="stroke-width" values="2;5;2;2" keyTimes="0;0.4;0.75;1" dur="8s" repeatCount="indefinite" /></rect>
  <text x="438" y="110" text-anchor="middle" font-size="15" font-weight="bold" class="txt">硬件比较器</text>
  <text x="438" y="140" text-anchor="middle" font-size="13" class="txt">不经过这颗 MCU</text>
  <text x="438" y="164" text-anchor="middle" font-size="13" class="txt">软件停了它还在</text>
  <text x="438" y="196" text-anchor="middle" font-size="13" class="warn">不能被标定旁路</text>
  <rect x="592" y="78" width="264" height="170" rx="8" class="fill-boxg stroke-g"><animate attributeName="stroke-width" values="2;2;5;2" keyTimes="0;0.4;0.75;1" dur="8s" repeatCount="indefinite" /></rect>
  <text x="724" y="110" text-anchor="middle" font-size="15" font-weight="bold" class="txt">见证记录</text>
  <text x="724" y="140" text-anchor="middle" font-size="13" class="txt">开线先于「这是过充」</text>
  <text x="724" y="164" text-anchor="middle" font-size="13" class="txt">切断时间写在记录里</text>
  <text x="724" y="196" text-anchor="middle" font-size="13" class="txt">不是一张证书扫描件</text>
  <circle cy="163" r="6" class="fill-g">
    <animate attributeName="cx" values="154;438;724;154" keyTimes="0;0.4;0.75;1" dur="8s" repeatCount="indefinite" />
  </circle>
  <text x="24" y="286" font-size="14" class="txt">ASIL 严重度、暴露率、可控性的计算图不是认证场地的照片，没有收。</text>
  

</svg>