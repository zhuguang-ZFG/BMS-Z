  <text x="450" y="250" font-size="12" fill="#475569">到 60 V 约 0.38 s</text>
  <text x="400" y="300" text-anchor="middle" font-size="14" fill="#1e293b">落到 60 V 后电容里还剩约 1.8 J，约 78 J 进了电阻。</text>
  <text x="400" y="330" text-anchor="middle" font-size="14" fill="#991b1b">闸还合着就投 200 Ω：U²/R = 800 W，而且母线没隔离。</text>
  <text x="400" y="390" text-anchor="middle" font-size="13" fill="#475569">产品的安全电压和秒数以适用标准为准。这里只演示 RC 怎么算。</text>

</svg>
