<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#16202b">电荷注入：一包电荷的两个出口·分镜</text>
<text x="480" y="56" text-anchor="middle" font-size="12" fill="#5b666f">源侧阻抗决定分账；高阻直采按全额记账</text>
<rect x="20" y="70" width="450" height="300" rx="10" fill="#fdf8ea" stroke="#c9bb9d" stroke-width="1.2"/>
<g data-storyboard-beat="导通蓄水" transform="translate(47 84) scale(0.4129)"><rect x="48" y="96" width="864" height="330" rx="14" fill="#f6eedb" stroke="#c9bb9d" stroke-width="1.4"/>
<text x="76" y="128" font-size="12" fill="#5b666f">传输门与保持电容</text>
<line x1="110" y1="250" x2="360" y2="250" stroke="#16202b" stroke-width="2.4"/>
<rect x="360" y="210" width="120" height="80" rx="10" fill="#e6eff3" stroke="#1f5d7a" stroke-width="2"/>
<text x="420" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f5d7a">开关</text>
<text x="420" y="272" text-anchor="middle" font-size="11" fill="#5b666f">EN 控制</text>
<line x1="480" y1="250" x2="720" y2="250" stroke="#16202b" stroke-width="2.4"/>
<line x1="720" y1="250" x2="720" y2="330" stroke="#16202b" stroke-width="2"/>
<line x1="680" y1="330" x2="760" y2="330" stroke="#16202b" stroke-width="3"/>
<line x1="680" y1="350" x2="760" y2="350" stroke="#16202b" stroke-width="3"/>
<text x="770" y="346" font-size="12" fill="#5b666f">Chold=10pF</text>
<text x="110" y="230" font-size="12" fill="#5b666f">源侧</text>
<g transform="translate(0 -4)"><ellipse cx="420" cy="250" rx="34" ry="22" fill="#f7eedb" stroke="#a4630f" stroke-width="2"/>
<text x="420" y="254" text-anchor="middle" font-size="11" font-weight="bold" fill="#a4630f">Qch</text>
<text x="470" y="196" font-size="12.5" fill="#16202b">0.2pC 存在沟道里</text></g></g>
<text x="32" y="348" font-size="12" font-weight="bold" fill="#1f5d7a">1. 导通蓄水</text>
<rect x="490" y="70" width="450" height="300" rx="10" fill="#fdf8ea" stroke="#c9bb9d" stroke-width="1.2"/>
<g data-storyboard-beat="关断分账" transform="translate(517 84) scale(0.4129)"><rect x="48" y="96" width="864" height="330" rx="14" fill="#f6eedb" stroke="#c9bb9d" stroke-width="1.4"/>
<text x="76" y="128" font-size="12" fill="#5b666f">传输门与保持电容</text>
<line x1="110" y1="250" x2="360" y2="250" stroke="#16202b" stroke-width="2.4"/>
<rect x="360" y="210" width="120" height="80" rx="10" fill="#e6eff3" stroke="#1f5d7a" stroke-width="2"/>
<text x="420" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f5d7a">开关</text>
<text x="420" y="272" text-anchor="middle" font-size="11" fill="#5b666f">EN 控制</text>
<line x1="480" y1="250" x2="720" y2="250" stroke="#16202b" stroke-width="2.4"/>
<line x1="720" y1="250" x2="720" y2="330" stroke="#16202b" stroke-width="2"/>
<line x1="680" y1="330" x2="760" y2="330" stroke="#16202b" stroke-width="3"/>
<line x1="680" y1="350" x2="760" y2="350" stroke="#16202b" stroke-width="3"/>
<text x="770" y="346" font-size="12" fill="#5b666f">Chold=10pF</text>
<text x="110" y="230" font-size="12" fill="#5b666f">源侧</text>
<g transform="translate(0 -4)"><path d="M420,250 C380,300 300,320 180,320" fill="none" stroke="#1f5d7a" stroke-width="7" opacity=".75"/>
<path d="M420,250 C500,300 600,320 700,320" fill="none" stroke="#a4630f" stroke-width="4" opacity=".85"/>
<text x="180" y="344" font-size="12" fill="#1f5d7a">泄回源侧（低阻越多）</text>
<text x="560" y="344" font-size="12" fill="#a4630f">挤进 Chold</text></g></g>
<text x="502" y="348" font-size="12" font-weight="bold" fill="#a4630f">2. 关断分账</text>
<rect x="20" y="388" width="450" height="300" rx="10" fill="#fdf8ea" stroke="#c9bb9d" stroke-width="1.2"/>
<g data-storyboard-beat="台阶10mV" transform="translate(47 402) scale(0.4129)"><rect x="48" y="96" width="864" height="330" rx="14" fill="#f6eedb" stroke="#c9bb9d" stroke-width="1.4"/>
<text x="76" y="128" font-size="12" fill="#5b666f">传输门与保持电容</text>
<line x1="110" y1="250" x2="360" y2="250" stroke="#16202b" stroke-width="2.4"/>
<rect x="360" y="210" width="120" height="80" rx="10" fill="#e6eff3" stroke="#1f5d7a" stroke-width="2"/>
<text x="420" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f5d7a">开关</text>
<text x="420" y="272" text-anchor="middle" font-size="11" fill="#5b666f">EN 控制</text>
<line x1="480" y1="250" x2="720" y2="250" stroke="#16202b" stroke-width="2.4"/>
<line x1="720" y1="250" x2="720" y2="330" stroke="#16202b" stroke-width="2"/>
<line x1="680" y1="330" x2="760" y2="330" stroke="#16202b" stroke-width="3"/>
<line x1="680" y1="350" x2="760" y2="350" stroke="#16202b" stroke-width="3"/>
<text x="770" y="346" font-size="12" fill="#5b666f">Chold=10pF</text>
<text x="110" y="230" font-size="12" fill="#5b666f">源侧</text>
<g transform="translate(0 -4)"><rect x="96" y="446" width="400" height="120" rx="10" fill="#f6e7e1" stroke="#a8321f" stroke-width="1.6"/>
<text x="120" y="478" font-size="13" font-weight="bold" fill="#a8321f">ΔV = Q / (2·Chold)</text>
<text x="120" y="508" font-size="12.5" fill="#16202b">0.2pC 的一半 ÷ 10pF</text>
<text x="120" y="540" font-size="16" font-weight="bold" fill="#a8321f">= 10mV</text></g></g>
<text x="32" y="666" font-size="12" font-weight="bold" fill="#a8321f">3. 台阶10mV</text>
<rect x="490" y="388" width="450" height="300" rx="10" fill="#fdf8ea" stroke="#c9bb9d" stroke-width="1.2"/>
<g data-storyboard-beat="20个LSB" transform="translate(517 402) scale(0.4129)"><rect x="48" y="96" width="864" height="330" rx="14" fill="#f6eedb" stroke="#c9bb9d" stroke-width="1.4"/>
<text x="76" y="128" font-size="12" fill="#5b666f">传输门与保持电容</text>
<line x1="110" y1="250" x2="360" y2="250" stroke="#16202b" stroke-width="2.4"/>
<rect x="360" y="210" width="120" height="80" rx="10" fill="#e6eff3" stroke="#1f5d7a" stroke-width="2"/>
<text x="420" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f5d7a">开关</text>
<text x="420" y="272" text-anchor="middle" font-size="11" fill="#5b666f">EN 控制</text>
<line x1="480" y1="250" x2="720" y2="250" stroke="#16202b" stroke-width="2.4"/>
<line x1="720" y1="250" x2="720" y2="330" stroke="#16202b" stroke-width="2"/>
<line x1="680" y1="330" x2="760" y2="330" stroke="#16202b" stroke-width="3"/>
<line x1="680" y1="350" x2="760" y2="350" stroke="#16202b" stroke-width="3"/>
<text x="770" y="346" font-size="12" fill="#5b666f">Chold=10pF</text>
<text x="110" y="230" font-size="12" fill="#5b666f">源侧</text>
<g transform="translate(0 -4)"><rect x="520" y="446" width="392" height="120" rx="10" fill="#e8efe6" stroke="#3d6b4a" stroke-width="1.8"/>
<text x="544" y="478" font-size="13" font-weight="bold" fill="#3d6b4a">2.048V / 12 位</text>
<text x="544" y="506" font-size="12.5" fill="#16202b">1LSB = 500µV</text>
<text x="544" y="540" font-size="16" font-weight="bold" fill="#3d6b4a">10mV = 20 个 LSB</text></g></g>
<text x="502" y="666" font-size="12" font-weight="bold" fill="#3d6b4a">4. 20个LSB</text>
<text x="24" y="718" font-size="22" fill="#16202b">1. EN 高：沟道里存下 Qch=0.2pC</text>
<text x="24" y="748" font-size="22" fill="#16202b">2. EN 拉低：一半电荷挤进 Chold，一半泄回源侧</text>
<text x="24" y="778" font-size="22" fill="#16202b">3. 0.2pC 的一半落到 10pF：ΔV=10mV</text>
<text x="24" y="808" font-size="22" fill="#16202b">4. 2.048V/12 位、1LSB=500µV，10mV 就是 20 个 LSB</text>
</svg>
