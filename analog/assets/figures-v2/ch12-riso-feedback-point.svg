<text x="420" y="145" font-size="27" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">A</text>
<path d="M420 180 L500 180" fill="none" stroke="#16202b" stroke-width="3"/>
<path d="M500 180 L515 180" fill="none" stroke="#16202b" stroke-width="3"/><rect x="515" y="168" width="65" height="24" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/><path d="M580 180 L595 180" fill="none" stroke="#16202b" stroke-width="3"/><text x="547" y="152" font-size="23" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">Riso</text>
