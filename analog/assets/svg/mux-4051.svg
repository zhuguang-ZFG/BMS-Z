<text x="450" y="526" font-size="11" fill="#5b666f">0 0 0</text><text x="600" y="526" font-size="11" font-weight="bold" fill="#5b666f">Y0</text><text x="450" y="546" font-size="11" fill="#5b666f">0 0 1</text><text x="600" y="546" font-size="11" font-weight="bold" fill="#5b666f">Y1</text><text x="450" y="566" font-size="11" fill="#5b666f">0 1 0</text><text x="600" y="566" font-size="11" font-weight="bold" fill="#5b666f">Y2</text><text x="450" y="586" font-size="11" fill="#5b666f">0 1 1</text><text x="600" y="586" font-size="11" font-weight="bold" fill="#5b666f">Y3</text><text x="450" y="606" font-size="11" fill="#5b666f">1 0 0</text><text x="600" y="606" font-size="11" font-weight="bold" fill="#5b666f">Y4</text><text x="450" y="626" font-size="11" fill="#3d6b4a">1 0 1</text><text x="600" y="626" font-size="11" font-weight="bold" fill="#3d6b4a">Y5</text><text x="640" y="626" font-size="10.5" fill="#3d6b4a">← 本例选中（接热敏电阻）</text><text x="450" y="646" font-size="11" fill="#5b666f">1 1 0</text><text x="600" y="646" font-size="11" font-weight="bold" fill="#5b666f">Y6</text><text x="450" y="666" font-size="11" fill="#5b666f">1 1 1</text><text x="600" y="666" font-size="11" font-weight="bold" fill="#5b666f">Y7</text>
