chapter: 9
source: docs/p1-10-ch9.md
planned_on: 2026-11-08
workflow: article-illustration-planner; equations and datasheet conditions before drawing
style: FA-029 paper/ink analytical figures; readable redrawn print snapshots
sources:
- url: https://www.ti.com/lit/ds/symlink/tl431.pdf
  revision: SLVS543S, May 2024
  sections:
  - '6.1'
  - '6.4'
  - '6.5'
  - 6.16/6.18 stability figures
  - '9.2'
  findings: Vref typical 2.495 V; Iref flows into REF, hence +Iref R1 output error. 1–100 mA recommended
    cathode current; 37 V absolute vs 36 V recommended. Stability depends on load capacitance, cathode
    voltage/current and device variant.
- url: https://www.ti.com/lit/ds/symlink/lm1117.pdf
  revision: SNOS412Q, January 2023
  sections:
  - '7.5'
  - 9.2.2.1.3
  findings: Specific TI LM1117 requires 10 uF tantalum and 0.3–22 ohm ESR; with CADJ use 22 uF. This is
    not a universal AMS1117 or all-LDO window.
- url: https://www.vishay.com/docs/85816/1n4728a.pdf
  revision: 85816 rev 2.7, 2024-11-07
  findings: 1N4733A 5.1 V at 49 mA; 7 ohm maximum differential impedance at test current, not a constant
    from 5 to 15 mA.
