  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">预充示例波形：母线电压按 RC 爬升</text>
  <text x="400" y="54" text-anchor="middle" font-size="13" fill="#475569">示例值，不是示波器截图。400 V、1 mF、170 Ω。</text>
  <line x1="80" y1="250" x2="520" y2="250" stroke="#334155" stroke-width="1.5"/>
  <line x1="80" y1="250" x2="80" y2="60" stroke="#334155" stroke-width="1.5"/>
