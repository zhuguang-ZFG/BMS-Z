<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 544" font-family="ui-monospace, Consolas, monospace">
  <title>菊花链故障：发现沉默的时间几乎等于超时，跳数只加一点点。教学示意，不是某颗 AFE 的手册时序。</title>
  <desc>亮点扫过不同断点位置：断得越靠后只多几跳的转发时间，发现沉默几乎都在等超时。</desc>

  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.5; fill: none; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
    }
  </style>

  <!-- formula: t=2.0+0.05*k ms -->
  <rect class="bg" width="800" height="544"/>
  <text class="title" x="24" y="32">链断了，你等的是超时，不是那一点飞行时间（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="128" rx="6"/>
  <text class="txt" x="40" y="72" opacity="0.28">① 第一跳就沉默<tspan class="small">　2.00 ms 几乎全是超时，不是线延迟。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="98" opacity="0.28">② 每多一跳<tspan class="small">　只加 0.05 ms。斜率很浅。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="124" opacity="0.28">③ 断在第 3 跳之后<tspan class="small">　2.15 ms。最后应答的节点，就是断点的上游。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="150" opacity="0.28">④ 六跳都活过才断<tspan class="small">　2.30 ms。恢复的是「停用下游」，不是把超时改短。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="188" width="752" height="304" rx="6"/>
  <text class="small" x="40" y="210">发现沉默 ms（示意）</text>
  <line class="axis" x1="108.0" y1="228.0" x2="108.0" y2="430.0"/>
  <line class="axis" x1="108.0" y1="430.0" x2="730.0" y2="430.0"/>
  <text class="small" x="730.0" y="468.0" text-anchor="end">断点前还活着的跳数</text>
  <line class="grid" x1="126.8" y1="430.0" x2="126.8" y2="436.0"/>
  <text class="small" x="126.8" y="452.0" text-anchor="middle">0</text>
  <line class="grid" x1="409.6" y1="430.0" x2="409.6" y2="436.0"/>
  <text class="small" x="409.6" y="452.0" text-anchor="middle">3</text>
  <line class="grid" x1="692.3" y1="430.0" x2="692.3" y2="436.0"/>
  <text class="small" x="692.3" y="452.0" text-anchor="middle">6</text>
  <line class="grid" x1="102.0" y1="393.3" x2="108.0" y2="393.3"/>
  <text class="small" x="98.0" y="397.3" text-anchor="end">2.00</text>
  <line class="grid" x1="102.0" y1="338.2" x2="108.0" y2="338.2"/>
  <text class="small" x="98.0" y="342.2" text-anchor="end">2.15</text>
  <line class="grid" x1="102.0" y1="283.1" x2="108.0" y2="283.1"/>
  <text class="small" x="98.0" y="287.1" text-anchor="end">2.30</text>
  <polyline class="lineb" points="126.8,393.3 221.1,374.9 315.3,356.5 409.6,338.2 503.8,319.8 598.1,301.5 692.3,283.1" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="doty" r="6"><animate attributeName="cx" values="126.8;221.1;315.3;409.6;503.8;598.1;692.3" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333;1.0000" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="393.3;374.9;356.5;338.2;319.8;301.5;283.1" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333;1.0000" dur="12s" repeatCount="indefinite"/></circle>
  <text class="small" x="24" y="528">2.0 ms 超时、每跳 50 µs 是示意。不是 LTC6811 或 BQ 的时序图，也不是标准摘录。</text>
</svg>
