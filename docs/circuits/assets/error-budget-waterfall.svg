<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>采样链误差瀑布。每一截从前一截的终点往上垒，五截合计 5.5 mV，探出 ±5 mV 预算。</title>
  <desc>增量依次是基准温漂 2.0、ADC 1.5、RC 漏电 0.8、电荷注入 0.3、布局拾取 0.9，单位 mV。标定后剩余约 1.8 mV。示意累加，不是实测。</desc>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; }
    .linek { stroke: #57606a; stroke-width: 2.2; fill: none; stroke-dasharray: 7 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .dotg { fill: #1a7f37; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    .boxy { fill: #fff8c5; stroke: #d4a72c; }
    .boxr { fill: #ffebe9; stroke: #ff8182; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .linek { stroke: #8b949e; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .dotg { fill: #3fb950; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
      .boxy { fill: #3d2e00; stroke: #d29922; }
      .boxr { fill: #3d1418; stroke: #f85149; }
    }
  </style>
  <!-- formula: cumulative sum of 2.0+1.5+0.8+0.3+0.9 = 5.5 mV; budget line at 5 mV -->
  <rect class="bg" width="800" height="520"/>
  <text class="title" x="24" y="32">误差是一截一截垒上去的（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="104" rx="6"/>
  <text class="txt" x="40" y="70" opacity="0.28">① 每一截只记自己的增量<tspan class="small">　柱子从前一截的终点接着画，不从零重来。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="92" opacity="0.28">② 五截加完是 5.5 mV<tspan class="small">　预算线画在 ±5 mV。未标定就探出线外。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="114" opacity="0.28">③ 标定能消掉系统性的那几项<tspan class="small">　剩下大约 1.8 mV，回到线下面。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="136" opacity="0.28">④ 口诀<tspan class="small">　先加总，再看哪一截探出预算。数字是教学累加。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="164" width="500" height="268" rx="6"/>
  <text class="small" x="40" y="186">累计 mV（示意）</text>
  <line class="axis" x1="64" y1="210" x2="64" y2="392"/>
  <line class="axis" x1="64" y1="392" x2="500" y2="392"/>
  <line class="liney" x1="64" y1="265.8" x2="490" y2="265.8" stroke-dasharray="6 4"/>
  <text class="gold" x="72" y="257.8">预算 ±5</text>
  <rect class="boxb" x="72.0" y="341.5" width="70.0" height="50.5"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.13;0.17;1" dur="12s" repeatCount="indefinite"/></rect>
  <text class="txt" x="107.0" y="333.5" text-anchor="middle" opacity="0">+2.0<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.13;0.17;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="107.0" y="412" text-anchor="middle">基准温漂</text>
  <line class="axis" x1="142.0" y1="341.5" x2="160.0" y2="341.5" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.13;0.17;1" dur="12s" repeatCount="indefinite"/></line>
  <rect class="boxb" x="160.0" y="303.7" width="70.0" height="37.8"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.29;0.33;1" dur="12s" repeatCount="indefinite"/></rect>
  <text class="txt" x="195.0" y="295.7" text-anchor="middle" opacity="0">+1.5<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.29;0.33;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="195.0" y="412" text-anchor="middle">ADC 失调</text>
  <line class="axis" x1="230.0" y1="303.7" x2="248.0" y2="303.7" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.29;0.33;1" dur="12s" repeatCount="indefinite"/></line>
  <rect class="boxb" x="248.0" y="283.5" width="70.0" height="20.2"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.46;0.50;1" dur="12s" repeatCount="indefinite"/></rect>
  <text class="txt" x="283.0" y="275.5" text-anchor="middle" opacity="0">+0.8<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.46;0.50;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="283.0" y="412" text-anchor="middle">RC 漏电</text>
  <line class="axis" x1="318.0" y1="283.5" x2="336.0" y2="283.5" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.46;0.50;1" dur="12s" repeatCount="indefinite"/></line>
  <rect class="boxb" x="336.0" y="275.9" width="70.0" height="7.6"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.63;0.67;1" dur="12s" repeatCount="indefinite"/></rect>
  <text class="txt" x="371.0" y="267.9" text-anchor="middle" opacity="0">+0.3<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.63;0.67;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="371.0" y="412" text-anchor="middle">电荷注入</text>
  <line class="axis" x1="406.0" y1="275.9" x2="424.0" y2="275.9" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.63;0.67;1" dur="12s" repeatCount="indefinite"/></line>
  <rect class="boxb" x="424.0" y="253.2" width="70.0" height="22.7"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.79;0.83;1" dur="12s" repeatCount="indefinite"/></rect>
  <text class="txt" x="459.0" y="245.2" text-anchor="middle" opacity="0">+0.9<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.79;0.83;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="459.0" y="412" text-anchor="middle">布局拾取</text>
  <rect class="panel" x="536" y="164" width="240" height="268" rx="6"/>
  <text class="txt" x="552" y="196">未标定累加</text>
  <text class="warn" x="552" y="228">5.5 mV</text>
  <text class="small" x="552" y="256">预算线是 ±5 mV</text>
  <text class="small" x="552" y="280">探出 0.5 mV</text>
  <text class="txt" x="552" y="320">标定之后</text>
  <text class="ok" x="552" y="352">约 1.8 mV</text>
  <text class="small" x="552" y="380">系统性的项被系数修掉</text>
  <text class="small" x="24" y="468">2.0、1.5、0.8、0.3、0.9 和标定后的 1.8，都是这张图的示意账，不是某一块采样板的校准记录。</text>
  <text class="small" x="24" y="496">柱内不再放白字。增量写在柱顶，结论写在右边的卡片里。</text>

</svg>
