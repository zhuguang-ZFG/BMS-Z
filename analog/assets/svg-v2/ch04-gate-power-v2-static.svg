<text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b">栅极驱动：平均电流小，瞬态电流大</text>
<text x="360" y="54" text-anchor="middle" font-size="12.5" fill="#5b666f">7 nC、10 V、100 kHz 为同组示意条件；实际 Qg 要对齐测试条件</text>
<text x="100" y="127" font-size="22" fill="#1f5d7a" text-anchor="start">本地去耦</text><text x="470" y="127" font-size="22" fill="#3d6b4a" text-anchor="start">栅极电荷</text><line x1="150" y1="150" x2="150" y2="190" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><line x1="110" y1="190" x2="190" y2="190" stroke="#16202b" stroke-width="3" stroke-dasharray=""/><line x1="110" y1="203" x2="190" y2="203" stroke="#16202b" stroke-width="3" stroke-dasharray=""/><line x1="150" y1="203" x2="150" y2="240" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><line x1="150" y1="150" x2="280" y2="150" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><line x1="410" y1="150" x2="530" y2="150" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><rect x="280" y="132" width="130" height="36" fill="none" stroke="#16202b" stroke-width="2"/><text x="345" y="158" font-size="22" fill="#2a2927" text-anchor="middle">驱动器</text><line x1="530" y1="150" x2="530" y2="190" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><line x1="490" y1="190" x2="570" y2="190" stroke="#16202b" stroke-width="3" stroke-dasharray=""/><line x1="490" y1="203" x2="570" y2="203" stroke="#16202b" stroke-width="3" stroke-dasharray=""/><line x1="530" y1="203" x2="530" y2="240" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><line x1="150" y1="240" x2="530" y2="240" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><text x="340" y="215" font-size="18" fill="#2a2927" text-anchor="middle">示意电荷转移路径</text>
<text x="36" y="304" font-size="24" fill="#1f5d7a" text-anchor="start">Q = 7 nC / 周期</text>
<text x="375" y="304" font-size="24" fill="#3d6b4a" text-anchor="start">I平均 = 0.7 mA</text>
<text x="36" y="362" font-size="24" fill="#a8321f" text-anchor="start">I初始 ≈ 1 A</text>
<text x="375" y="362" font-size="24" fill="#16202b" text-anchor="start">P驱动 = 7 mW</text>
<rect x="24" y="406" width="672" height="34" rx="9" fill="#f7eedb" stroke="#c9bb9d" stroke-width="1.2"/>
<text x="360" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#16202b">Qg × Vdrv × f = 7 mW，分散耗在驱动回路。</text>
</svg>
