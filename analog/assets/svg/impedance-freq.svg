"/></rect><text x="400" y="418" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#a4630f" opacity="0">③ 交点 5kHz：Zc=Zl——LC 谐振，阻抗里只剩电阻（DCR/ESR）<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.53;0.72;0.75;1" dur="6s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.75;0.78;1" dur="6s" repeatCount="indefinite"/><rect x="170.6" y="404.9" width="458.8" height="24.1" rx="12.0" fill="#3d6b4a" fill-opacity="0.09" stroke="#3d6b4a" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.78;1" dur="6s" repeatCount="indefinite"/></rect><text x="400" y="418" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#3d6b4a" opacity="0">④ 一切阻抗都是频率的函数——选元件先问「工作在哪个频段」<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.78;1" dur="6s" repeatCount="indefinite"/></text></g><g opacity="0">
