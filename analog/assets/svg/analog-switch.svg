<title id="ttl">模拟开关的暗伤：关断瞬间，沟道电荷被「挤」进电容（CD4066）</title>
<desc>模拟开关的暗伤：关断瞬间，沟道电荷被「挤」进电容（CD4066）；节拍：① 导通：NMOS+PMOS 互补——低走高走全摆幅无损通过（R_ON≈125Ω）；② 跟随期：电容贴着输入走——采样就是把波形「复印」到电容上；③ 关断瞬间：沟道电子 Q≈1pC 涌入 100pF 电容 → 电压下陷 ΔV=Q/C≈10mV！</desc>
