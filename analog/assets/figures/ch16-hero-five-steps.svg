<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">排故五步法：五张防自欺卡片与证据天平</title>
<desc id="figDesc">上排五张手绘卡片是五步各自的防自欺规则：① 症状确认——先问后拆（温度、带载、最近改过什么）；② 二分定位——对数收敛，6 个节点最多 3 刀；③ 假设验证——一次只改一处；④ 修复——修根因，查症状背后的物理；⑤ 回归测试——修好不算完。左下是 6 节点链的二分演示，三道刀口把嫌疑砍半；右下是证据与动作的天平，证据盘压着动作盘，提醒证据不足时烙铁先收起来。底部结论：五步各挡一种自欺。</desc>
<rect width="960" height="640" fill="#fffdf8"/>
<text x="36" y="46" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="28" font-weight="700" fill="#14213d">五步法：让证据走在动作前面</text>
<text x="36" y="76" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="15" fill="#52606d">症状确认 → 二分定位 → 假设验证 → 修复 → 回归测试，每步挡一种自欺</text>
<line x1="36" y1="94" x2="924" y2="94" stroke="#14213d" stroke-width="2"/>

<g stroke="#e4d8c3" stroke-width="1.4" fill="#ffffff">
<rect x="36" y="112" width="164" height="184" rx="8"/>
