<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 544" font-family="ui-monospace, Consolas, monospace">
  <title>过流分档延时：OC1、OC2、短路是三级台阶，不是一条光滑反时限曲线。数字为示意。纵轴是对数。</title>
  <desc>亮点走上三级台阶：OC1、OC2、短路各停一档，延时一档比一档短，纵轴是对数刻度。</desc>

  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.5; fill: none; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
    }
  </style>

  <!-- formula: I<30 none; 30-60: 4000 ms; 60-120: 200 ms; >=120: 0.2 ms -->
  <rect class="bg" width="800" height="544"/>
  <text class="title" x="24" y="32">电流越大，保护等得越短，而且是跳着变短（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="128" rx="6"/>
  <text class="txt" x="40" y="72" opacity="0.28">① 30 A 以下<tspan class="small">　延时当成无穷。这条竖线左边，保护睡觉。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="98" opacity="0.28">② OC1：30–60 A<tspan class="small">　示意 4000 ms。小过载，给负载一个喘口气的窗口。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="124" opacity="0.28">③ OC2：60–120 A<tspan class="small">　掉到 200 ms。注意是跳下去，中间没有平滑的斜坡。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="150" opacity="0.28">④ 短路档：≥120 A<tspan class="small">　0.20 ms。对数轴上它贴着地板。软件轮询接不住。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="188" width="752" height="304" rx="6"/>
  <text class="small" x="40" y="210">延时 ms（对数刻度，示意）</text>
  <line class="axis" x1="108.0" y1="228.0" x2="108.0" y2="430.0"/>
  <line class="axis" x1="108.0" y1="430.0" x2="730.0" y2="430.0"/>
  <text class="small" x="730.0" y="468.0" text-anchor="end">电流 A（示意）</text>
  <line class="grid" x1="149.5" y1="430.0" x2="149.5" y2="436.0"/>
  <text class="small" x="149.5" y="452.0" text-anchor="middle">30</text>
  <line class="grid" x1="273.9" y1="430.0" x2="273.9" y2="436.0"/>
  <text class="small" x="273.9" y="452.0" text-anchor="middle">60</text>
  <line class="grid" x1="522.7" y1="430.0" x2="522.7" y2="436.0"/>
  <text class="small" x="522.7" y="452.0" text-anchor="middle">120</text>
  <line class="grid" x1="688.5" y1="430.0" x2="688.5" y2="436.0"/>
  <text class="small" x="688.5" y="452.0" text-anchor="middle">160</text>
  <line class="grid" x1="102.0" y1="417.8" x2="108.0" y2="417.8"/>
  <text class="small" x="98.0" y="421.8" text-anchor="end">0.2</text>
  <line class="grid" x1="102.0" y1="296.6" x2="108.0" y2="296.6"/>
  <text class="small" x="98.0" y="300.6" text-anchor="end">200</text>
  <line class="grid" x1="102.0" y1="244.1" x2="108.0" y2="244.1"/>
  <text class="small" x="98.0" y="248.1" text-anchor="end">4000</text>
  <line class="liney" x1="149.5" y1="228.0" x2="149.5" y2="430.0"/>
  <polyline class="liner" points="149.5,244.1 156.0,244.1 162.6,244.1 169.1,244.1 175.7,244.1 182.2,244.1 188.8,244.1 195.3,244.1 201.8,244.1 208.4,244.1 214.9,244.1 221.5,244.1 228.0,244.1 234.6,244.1 241.1,244.1 247.7,244.1 254.2,244.1 260.8,244.1 267.3,244.1 273.9,244.1" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline class="liner" points="273.9,296.6 287.0,296.6 300.1,296.6 313.2,296.6 326.2,296.6 339.3,296.6 352.4,296.6 365.5,296.6 378.6,296.6 391.7,296.6 404.8,296.6 417.9,296.6 431.0,296.6 444.1,296.6 457.2,296.6 470.3,296.6 483.4,296.6 496.5,296.6 509.6,296.6 522.7,296.6" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline class="liner" points="522.7,417.8 531.4,417.8 540.1,417.8 548.9,417.8 557.6,417.8 566.3,417.8 575.0,417.8 583.8,417.8 592.5,417.8 601.2,417.8 610.0,417.8 618.7,417.8 627.4,417.8 636.2,417.8 644.9,417.8 653.6,417.8 662.3,417.8 671.1,417.8 679.8,417.8 688.5,417.8" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="dotr" r="6"><animate attributeName="cx" values="149.5;182.2;214.9;241.1;273.9;273.9;273.9;339.3;404.8;457.2;522.7;522.7;522.7;566.3;610.0;644.9;688.5" keyTimes="0.0000;0.0625;0.1250;0.1875;0.2500;0.3125;0.3750;0.4375;0.5000;0.5625;0.6250;0.6875;0.7500;0.8125;0.8750;0.9375;1.0000" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="244.1;244.1;244.1;244.1;244.1;296.6;296.6;296.6;296.6;296.6;296.6;417.8;417.8;417.8;417.8;417.8;417.8" keyTimes="0.0000;0.0625;0.1250;0.1875;0.2500;0.3125;0.3750;0.4375;0.5000;0.5625;0.6250;0.6875;0.7500;0.8125;0.8750;0.9375;1.0000" dur="12s" repeatCount="indefinite"/></circle>
  <text class="gold" x="157.8" y="337.0">30 A 以下不动作</text>
  <text class="small" x="24" y="528">三级阈值和延时都是示意，不是某颗保护 IC 的电气表。保险丝才是连续的反时限，别和这三级台阶混成一条。</text>
</svg>
