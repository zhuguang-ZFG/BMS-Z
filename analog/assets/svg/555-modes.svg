<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img" aria-labelledby="ttl">
<title id="ttl">555 的三种人格：无稳态、单稳态、双稳态</title>
<desc>555 的三种人格：无稳态、单稳态、双稳态；节拍：① 无稳态：电容自己充放，输出永远在翻——不需要外部触发（时钟最爱）；② 单稳态：平时静默，TRIG 来一脚就输出一个 t≈1.1RC 的脉冲；③ 双稳态：TRIG/THRES 当置位/复位用，两个稳态之间来回锁；④ 三种模式的差异只在「电容接哪只脚」——同一颗芯，三副面孔</desc>
