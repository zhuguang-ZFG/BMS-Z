<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="ui-monospace, Consolas, monospace">
  <title>液冷沿流向把冷却液捂热，下游电芯更高。温差和流量成反比。进口接口温降相同。数字为示意。</title>
  <desc>亮点对比小流量和大流量：小流量下游电芯逐节抬高，流量乘 4 之后沿程温差明显收窄。</desc>

  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.5; fill: none; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .dotg { fill: #1a7f37; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    .boxr { fill: #ffebe9; stroke: #cf222e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .dotg { fill: #3fb950; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
      .boxr { fill: #3d1214; stroke: #ff7b72; }
    }
  </style>

  <!-- formula: T=25+4+dT*i; dT_high=dT_low/4 -->
  <rect class="bg" width="800" height="500"/>
  <text class="title" x="24" y="32">同一块冷板，越靠出口越热（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="122" rx="6"/>
  <text class="txt" x="40" y="68" opacity="0.28">① 进口冷却液 25 °C<tspan class="small">　电芯比冷却液再高 4 °C 的接口温降，第一节都是 29 °C。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="94" opacity="0.28">② 每节热量相同<tspan class="small">　冷却液温升沿流向是直线。斜率 = 单节热 /（流量×比热）。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="120" opacity="0.28">③ 小流量<tspan class="small">　每节 +1.5 °C，出口 39.5 °C，首尾差 10.5 °C。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="146" opacity="0.28">④ 流量乘 4<tspan class="small">　斜率变成四分之一，首尾差 2.62 °C。BMS 仍要看最热那一节。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="182" width="752" height="250" rx="6"/>
  <text class="small" x="40" y="204">电芯温度 °C</text>
  <line class="axis" x1="92.0" y1="214.0" x2="92.0" y2="400.0"/>
  <line class="axis" x1="92.0" y1="400.0" x2="720.0" y2="400.0"/>
  <text class="small" x="712.0" y="418" text-anchor="end">沿流向的电芯序号</text>
  <line class="grid" x1="92.0" y1="400.0" x2="92.0" y2="406.0"/>
  <text class="small" x="92.0" y="432" text-anchor="middle">进口</text>
  <line class="grid" x1="720.0" y1="400.0" x2="720.0" y2="406.0"/>
  <text class="small" x="720.0" y="432" text-anchor="middle">出口</text>
  <line class="grid" x1="86.0" y1="356.2" x2="92.0" y2="356.2"/>
  <text class="small" x="82.0" y="360.2" text-anchor="end">29</text>
  <line class="grid" x1="86.0" y1="312.5" x2="92.0" y2="312.5"/>
  <text class="small" x="82.0" y="316.5" text-anchor="end">33</text>
  <line class="grid" x1="86.0" y1="241.4" x2="92.0" y2="241.4"/>
  <text class="small" x="82.0" y="245.4" text-anchor="end">39.5</text>
  <polyline class="liner" points="92.0,356.2 181.7,339.8 271.4,323.4 361.1,307.0 450.9,290.6 540.6,274.2 630.3,257.8 720.0,241.4" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline class="lineb" points="92.0,356.2 181.7,352.1 271.4,348.0 361.1,343.9 450.9,339.8 540.6,335.7 630.3,331.6 720.0,327.5" stroke-linejoin="round" stroke-linecap="round"/>
  <text class="warn" x="180" y="250">小流量：每节 +1.5 °C</text>
  <text class="hi" x="180" y="272">四倍流量：每节 +0.375 °C</text>
  <circle class="dotr" r="6"><animate attributeName="cx" values="92.0;181.7;271.4;361.1;450.9;540.6;630.3;720.0" keyTimes="0;0.1429;0.2857;0.4286;0.5714;0.7143;0.8571;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="356.2;339.8;323.4;307.0;290.6;274.2;257.8;241.4" keyTimes="0;0.1429;0.2857;0.4286;0.5714;0.7143;0.8571;1" dur="12s" repeatCount="indefinite"/></circle>
  <text class="small" x="24" y="478">1.5 °C/节、4 °C 接口温降、25 °C 进口都是示意。水泵和阀由热管理执行，BMS 负责报出最热和温差。</text>
</svg>
