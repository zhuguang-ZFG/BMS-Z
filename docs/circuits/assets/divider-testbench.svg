</style><rect class="bg" x="0" y="-156" width="800" height="700" /><text class="title" x="24" y="-128">示意图：电源 + 分压链 + 保护板 + 万用表</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 示意图：电源 + 分压链 + 保护板 + 万用表<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 不是同框实拍。用一台隔离电源模拟电芯，不要把真电池推向过充。<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ B4 B3 B2 B1 B0<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="488" width="752" height="44" rx="6" /><text class="small" x="40" y="516">共地的多路电源直接叠到 B1–Bn，会经地线把串短路。示意。</text><rect class="bg" width="800" height="480" />
  <text class="small" x="400" y="56" text-anchor="middle">不是同框实拍。用一台隔离电源模拟电芯，不要把真电池推向过充。</text>
