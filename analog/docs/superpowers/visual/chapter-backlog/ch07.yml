corrections:
- For a 5 V equal divider with two 1 percent resistors, threshold tolerance is plus or minus 25 mV, not
  50 mV.
- An undervoltage sink uses sensed voltage at the plus input and low reference at minus; overvoltage sink
  uses high reference at plus and sense at minus.
- A signal at minus with reference/feedback network at plus is inverting hysteresis; noninverting formulas
  are not interchangeable approximations.
- A ratio of 10 to 1 gives the 0.50 versus 0.4545 V comparison; 100 to 1 differs by about one percent.
- Independent battery absolute-voltage detection needs an independent reference, not a fraction of that
  same battery.
- Idle comparator inputs should have a defined differential within common-mode limits, not both tied to
  the same voltage.
- Software calibration cannot move a fixed hardware comparator threshold without a controllable reference
  or equivalent actuator.
- Hysteresis does not guarantee rejection of every pulse narrower than the window in voltage, nor fix
  an open-collector RC rise-time limit.
