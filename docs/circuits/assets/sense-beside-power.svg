<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460">
  <title>采样线对照：成对紧贴并远离功率回路时读数稳住；贴着粗铜走时读数在示例的 3.65 V 与 3.78 V 之间跳。示意图，不是实测频谱。</title>
  <desc>黄点沿功率铜皮走动。远离采样时读数停在 3.712 V；贴着走时在 3.65 V 和 3.78 V 之间跳。示意图，不是实测频谱。</desc>
  <rect width="800" height="460" fill="#f8fafc"/>
  <style>
  text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
  /* 深色模式：GitHub 深色主题下对调底色与文字色，只覆盖配色，不动几何与动画。
     stroke="#fff" 保持白色——那是彩色徽标上的勾选，不在覆盖范围内。 */
  @media (prefers-color-scheme: dark){
  rect[fill="#f8fafc"]{fill:#0f172a}
  rect[fill="#fff"]{fill:#1e293b}
  [fill="#f1f5f9"]{fill:#1e293b}
  [stroke="#f1f5f9"]{stroke:#1e293b}
  [fill="#e2e8f0"]{fill:#334155}
  [stroke="#e2e8f0"]{stroke:#334155}
  [fill="#cbd5e1"]{fill:#475569}
  [stroke="#cbd5e1"]{stroke:#475569}
  [fill="#64748b"]{fill:#94a3b8}
  [stroke="#64748b"]{stroke:#94a3b8}
  [fill="#475569"]{fill:#cbd5e1}
  [stroke="#475569"]{stroke:#cbd5e1}
  [fill="#334155"]{fill:#e2e8f0}
  [stroke="#334155"]{stroke:#e2e8f0}
  [fill="#1e293b"]{fill:#f1f5f9}
  [stroke="#1e293b"]{stroke:#f1f5f9}
  [fill="#dbeafe"]{fill:#1e3a8a}
  [stroke="#dbeafe"]{stroke:#1e3a8a}
  [fill="#eff6ff"]{fill:#172554}
  [stroke="#eff6ff"]{stroke:#172554}
  [fill="#bfdbfe"]{fill:#1e40af}
  [stroke="#bfdbfe"]{stroke:#1e40af}
  [fill="#1d4ed8"]{fill:#60a5fa}
  [stroke="#1d4ed8"]{stroke:#60a5fa}
  [fill="#1e40af"]{fill:#93c5fd}
  [stroke="#1e40af"]{stroke:#93c5fd}
  [fill="#2563eb"]{fill:#60a5fa}
  [stroke="#2563eb"]{stroke:#60a5fa}
  [fill="#3b82f6"]{fill:#60a5fa}
  [stroke="#3b82f6"]{stroke:#60a5fa}
  [fill="#ecfdf5"]{fill:#022c22}
  [stroke="#ecfdf5"]{stroke:#022c22}
  [fill="#a7f3d0"]{fill:#065f46}
  [stroke="#a7f3d0"]{stroke:#065f46}
  [fill="#86efac"]{fill:#166534}
  [stroke="#86efac"]{stroke:#166534}
  [fill="#065f46"]{fill:#6ee7b7}
  [stroke="#065f46"]{stroke:#6ee7b7}
  [fill="#059669"]{fill:#34d399}
  [stroke="#059669"]{stroke:#34d399}
  [fill="#fef2f2"]{fill:#450a0a}
  [stroke="#fef2f2"]{stroke:#450a0a}
  [fill="#fecaca"]{fill:#7f1d1d}
  [stroke="#fecaca"]{stroke:#7f1d1d}
  [fill="#fca5a5"]{fill:#b91c1c}
  [stroke="#fca5a5"]{stroke:#b91c1c}
  [fill="#991b1b"]{fill:#fca5a5}
  [stroke="#991b1b"]{stroke:#fca5a5}
  [fill="#dc2626"]{fill:#f87171}
  [stroke="#dc2626"]{stroke:#f87171}
  [fill="#fffbeb"]{fill:#451a03}
  [stroke="#fffbeb"]{stroke:#451a03}
  [fill="#fef3c7"]{fill:#78350f}
  [stroke="#fef3c7"]{stroke:#78350f}
  [fill="#92400e"]{fill:#fcd34d}
  [stroke="#92400e"]{stroke:#fcd34d}
  [fill="#b45309"]{fill:#fbbf24}
  [stroke="#b45309"]{stroke:#fbbf24}
  }
</style>

  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">采样线：远离功率回路，还是贴着走</text>
  <text x="400" y="54" text-anchor="middle" font-size="13" fill="#475569">示意图。噪声幅度是数量级，不是某块板的实测频谱。</text>
  <rect x="36" y="78" width="350" height="240" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="211" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#065f46">对：采样贴紧成对，远离粗铜</text>
  <line x1="70" y1="160" x2="330" y2="160" stroke="#b45309" stroke-width="6"/>
  <text x="200" y="150" text-anchor="middle" font-size="12" fill="#92400e">功率回路</text>
  <line x1="70" y1="230" x2="330" y2="230" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="70" y1="242" x2="330" y2="242" stroke="#1d4ed8" stroke-width="2"/>
  <text x="200" y="270" text-anchor="middle" font-size="13" fill="#1e40af">采样成对紧贴</text>
  <text x="211" y="300" text-anchor="middle" font-size="16" fill="#065f46">3.712 V 稳住</text>
  <rect x="414" y="78" width="350" height="240" rx="8" fill="#fef2f2" stroke="#dc2626">
    <animate attributeName="stroke-width" values="2;5;2" keyTimes="0;0.5;1" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="589" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">错：采样贴着功率走</text>
  <line x1="448" y1="180" x2="730" y2="180" stroke="#b45309" stroke-width="6"/>
  <line x1="448" y1="192" x2="730" y2="192" stroke="#1d4ed8" stroke-width="2"/>
  <text x="589" y="230" text-anchor="middle" font-size="16" fill="#991b1b" opacity="1">3.65 V
    <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="0.6s" repeatCount="indefinite"/>
  </text>
  <text x="589" y="258" text-anchor="middle" font-size="16" fill="#991b1b" opacity="0">3.78 V
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="0.6s" repeatCount="indefinite"/>
  </text>
  <circle r="5" fill="#b45309" cx="70" cy="160">
    <animate attributeName="cx" values="70;330;70" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#b45309" cx="448" cy="180">
    <animate attributeName="cx" values="448;730;448" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="400" y="360" text-anchor="middle" font-size="14" fill="#1e293b">跳变进了毫伏到几十毫伏，均衡和保护会对着噪声动作。</text>
  <text x="400" y="400" text-anchor="middle" font-size="13" fill="#475569">分压电阻放在接插件附近。长线只走已经分完的低阻抗侧。</text>

</svg>
