<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470">
  <title>卡尔曼增益信任分配动画</title>
  <rect width="800" height="470" fill="#f8fafc"/>
  <style>
  text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
  /* 深色模式：GitHub 深色主题下对调底色与文字色，只覆盖配色，不动几何与动画。
     stroke="#fff" 保持白色——那是彩色徽标上的勾选，不在覆盖范围内。 */
  @media (prefers-color-scheme: dark){
  rect[fill="#f8fafc"]{fill:#0f172a}
  rect[fill="#fff"]{fill:#1e293b}
  [fill="#f1f5f9"]{fill:#1e293b}
  [stroke="#f1f5f9"]{stroke:#1e293b}
  [fill="#e2e8f0"]{fill:#334155}
  [stroke="#e2e8f0"]{stroke:#334155}
  [fill="#cbd5e1"]{fill:#475569}
  [stroke="#cbd5e1"]{stroke:#475569}
  [fill="#64748b"]{fill:#94a3b8}
  [stroke="#64748b"]{stroke:#94a3b8}
  [fill="#475569"]{fill:#cbd5e1}
  [stroke="#475569"]{stroke:#cbd5e1}
  [fill="#334155"]{fill:#e2e8f0}
  [stroke="#334155"]{stroke:#e2e8f0}
  [fill="#1e293b"]{fill:#f1f5f9}
  [stroke="#1e293b"]{stroke:#f1f5f9}
  [fill="#dbeafe"]{fill:#1e3a8a}
  [stroke="#dbeafe"]{stroke:#1e3a8a}
  [fill="#eff6ff"]{fill:#172554}
  [stroke="#eff6ff"]{stroke:#172554}
  [fill="#bfdbfe"]{fill:#1e40af}
  [stroke="#bfdbfe"]{stroke:#1e40af}
  [fill="#1d4ed8"]{fill:#60a5fa}
  [stroke="#1d4ed8"]{stroke:#60a5fa}
  [fill="#1e40af"]{fill:#93c5fd}
  [stroke="#1e40af"]{stroke:#93c5fd}
  [fill="#2563eb"]{fill:#60a5fa}
  [stroke="#2563eb"]{stroke:#60a5fa}
  [fill="#3b82f6"]{fill:#60a5fa}
  [stroke="#3b82f6"]{stroke:#60a5fa}
  [fill="#ecfdf5"]{fill:#022c22}
  [stroke="#ecfdf5"]{stroke:#022c22}
  [fill="#a7f3d0"]{fill:#065f46}
  [stroke="#a7f3d0"]{stroke:#065f46}
  [fill="#86efac"]{fill:#166534}
  [stroke="#86efac"]{stroke:#166534}
  [fill="#065f46"]{fill:#6ee7b7}
  [stroke="#065f46"]{stroke:#6ee7b7}
  [fill="#059669"]{fill:#34d399}
  [stroke="#059669"]{stroke:#34d399}
  [fill="#fef2f2"]{fill:#450a0a}
  [stroke="#fef2f2"]{stroke:#450a0a}
  [fill="#fecaca"]{fill:#7f1d1d}
  [stroke="#fecaca"]{stroke:#7f1d1d}
  [fill="#fca5a5"]{fill:#b91c1c}
  [stroke="#fca5a5"]{stroke:#b91c1c}
  [fill="#991b1b"]{fill:#fca5a5}
  [stroke="#991b1b"]{stroke:#fca5a5}
  [fill="#dc2626"]{fill:#f87171}
  [stroke="#dc2626"]{stroke:#f87171}
  [fill="#fffbeb"]{fill:#451a03}
  [stroke="#fffbeb"]{stroke:#451a03}
  [fill="#fef3c7"]{fill:#78350f}
  [stroke="#fef3c7"]{stroke:#78350f}
  [fill="#92400e"]{fill:#fcd34d}
  [stroke="#92400e"]{stroke:#fcd34d}
  [fill="#b45309"]{fill:#fbbf24}
  [stroke="#b45309"]{stroke:#fbbf24}
  }
</style>

  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">卡尔曼增益：该信模型，还是该信电压？</text>

  <!-- 信任滑块：左=模型预测，右=电压测量 -->
  <line x1="200" y1="100" x2="600" y2="100" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
  <circle cx="200" cy="100" r="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="600" cy="100" r="10" fill="#a7f3d0" stroke="#059669" stroke-width="2"/>
  <text x="200" y="132" text-anchor="middle" font-size="12" fill="#1e40af">模型（安时积分）</text>
  <text x="600" y="132" text-anchor="middle" font-size="12" fill="#065f46">测量（电压）</text>
  <circle cy="100" r="14" fill="#2563eb" stroke="#fff" stroke-width="2" cx="260">
    <animate attributeName="cx" values="260;260;540;540;300;300" keyTimes="0;0.22;0.3;0.7;0.78;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <text x="400" y="152" text-anchor="middle" font-size="12" fill="#2563eb" opacity="0">测量噪声大 → K 小：信模型，噪声被挡在外面
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.24;0.28;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="400" y="170" text-anchor="middle" font-size="12" fill="#065f46" opacity="0">模型不确定度随时间累积 → K 大：信测量，被拉回真值
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.34;0.48;0.52;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- 左下：协方差条带，预测变宽、更新压窄 -->
  <text x="265" y="352" text-anchor="middle" font-size="11" fill="#64748b">SOC 估计的不确定度</text>
  <line x1="80" y1="330" x2="450" y2="330" stroke="#64748b" stroke-width="1.5"/>
  <line x1="80" y1="330" x2="80" y2="180" stroke="#64748b" stroke-width="1.5"/>
  <line x1="90" y1="260" x2="440" y2="260" stroke="#2563eb" stroke-width="2"/>
  <rect x="90" y="248" width="350" height="24" fill="#bfdbfe" opacity="0">
    <animate attributeName="opacity" values="0;0;0.6;0.6" keyTimes="0;0.48;0.52;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="height" values="24;24;96;24;96;24;24" keyTimes="0;0.5;0.58;0.62;0.68;0.72;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="y" values="248;248;212;248;212;248;248" keyTimes="0;0.5;0.58;0.62;0.68;0.72;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <circle cx="230" cy="260" r="5" fill="#059669" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.58;0.62;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="360" cy="260" r="5" fill="#059669" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.68;0.72;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <text x="140" y="186" text-anchor="middle" font-size="11" fill="#475569" opacity="0">预测：变宽
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.53;0.58;0.62;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="300" y="186" text-anchor="middle" font-size="11" fill="#065f46" opacity="0">更新：压窄
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.58;0.61;0.68;0.72;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- 右下：LFP 平台区陷阱 -->
  <text x="620" y="352" text-anchor="middle" font-size="11" fill="#64748b">LFP 平台区（示例）</text>
  <line x1="500" y1="330" x2="740" y2="330" stroke="#64748b" stroke-width="1.5"/>
  <line x1="500" y1="330" x2="500" y2="180" stroke="#64748b" stroke-width="1.5"/>
  <path d="M510,240 C570,238 650,236 730,235" fill="none" stroke="#2563eb" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.72;0.75;1" dur="12s" repeatCount="indefinite"/>
  </path>
  <rect x="510" y="230" width="220" height="16" fill="#fca5a5" opacity="0">
    <animate attributeName="opacity" values="0;0;0.45;0.45" keyTimes="0;0.76;0.8;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <line x1="748" y1="205" x2="748" y2="295" stroke="#dc2626" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.78;0.82;1" dur="12s" repeatCount="indefinite"/>
  </line>
  <text x="620" y="186" text-anchor="middle" font-size="12" fill="#991b1b" opacity="0">平台区电压几乎不随 SOC 变 → 噪声被放大成误差
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.74;0.78;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- 分幕解说 -->
  <text x="400" y="380" text-anchor="middle" font-size="13" fill="#334155" opacity="0">协方差（不确定度）才是算法真正在跟踪的东西：预测变宽、更新压窄
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.56;0.68;0.72;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="400" y="404" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309" opacity="0">平台区里电压的 SOC 信息量极低——增益必须自动变小，否则噪声灌进 SOC
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.78;0.83;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <text x="400" y="452" text-anchor="middle" font-size="13" fill="#475569">关键：增益是信任分配——电压不敏感的时候，就该少信电压。</text>
</svg>
