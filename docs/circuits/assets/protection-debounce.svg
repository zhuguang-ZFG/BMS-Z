<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460">
  <title>保护去抖与回差动画</title>
  <rect width="800" height="460" fill="#f8fafc"/>
  <style>
  text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
  /* 深色模式：GitHub 深色主题下对调底色与文字色，只覆盖配色，不动几何与动画。
     stroke="#fff" 保持白色——那是彩色徽标上的勾选，不在覆盖范围内。 */
  @media (prefers-color-scheme: dark){
  rect[fill="#f8fafc"]{fill:#0f172a}
  rect[fill="#fff"]{fill:#1e293b}
  [fill="#f1f5f9"]{fill:#1e293b}
  [stroke="#f1f5f9"]{stroke:#1e293b}
  [fill="#e2e8f0"]{fill:#334155}
  [stroke="#e2e8f0"]{stroke:#334155}
  [fill="#cbd5e1"]{fill:#475569}
  [stroke="#cbd5e1"]{stroke:#475569}
  [fill="#64748b"]{fill:#94a3b8}
  [stroke="#64748b"]{stroke:#94a3b8}
  [fill="#475569"]{fill:#cbd5e1}
  [stroke="#475569"]{stroke:#cbd5e1}
  [fill="#334155"]{fill:#e2e8f0}
  [stroke="#334155"]{stroke:#e2e8f0}
  [fill="#1e293b"]{fill:#f1f5f9}
  [stroke="#1e293b"]{stroke:#f1f5f9}
  [fill="#dbeafe"]{fill:#1e3a8a}
  [stroke="#dbeafe"]{stroke:#1e3a8a}
  [fill="#eff6ff"]{fill:#172554}
  [stroke="#eff6ff"]{stroke:#172554}
  [fill="#bfdbfe"]{fill:#1e40af}
  [stroke="#bfdbfe"]{stroke:#1e40af}
  [fill="#1d4ed8"]{fill:#60a5fa}
  [stroke="#1d4ed8"]{stroke:#60a5fa}
  [fill="#1e40af"]{fill:#93c5fd}
  [stroke="#1e40af"]{stroke:#93c5fd}
  [fill="#2563eb"]{fill:#60a5fa}
  [stroke="#2563eb"]{stroke:#60a5fa}
  [fill="#3b82f6"]{fill:#60a5fa}
  [stroke="#3b82f6"]{stroke:#60a5fa}
  [fill="#ecfdf5"]{fill:#022c22}
  [stroke="#ecfdf5"]{stroke:#022c22}
  [fill="#a7f3d0"]{fill:#065f46}
  [stroke="#a7f3d0"]{stroke:#065f46}
  [fill="#86efac"]{fill:#166534}
  [stroke="#86efac"]{stroke:#166534}
  [fill="#065f46"]{fill:#6ee7b7}
  [stroke="#065f46"]{stroke:#6ee7b7}
  [fill="#059669"]{fill:#34d399}
  [stroke="#059669"]{stroke:#34d399}
  [fill="#fef2f2"]{fill:#450a0a}
  [stroke="#fef2f2"]{stroke:#450a0a}
  [fill="#fecaca"]{fill:#7f1d1d}
  [stroke="#fecaca"]{stroke:#7f1d1d}
  [fill="#fca5a5"]{fill:#b91c1c}
  [stroke="#fca5a5"]{stroke:#b91c1c}
  [fill="#991b1b"]{fill:#fca5a5}
  [stroke="#991b1b"]{stroke:#fca5a5}
  [fill="#dc2626"]{fill:#f87171}
  [stroke="#dc2626"]{stroke:#f87171}
  [fill="#fffbeb"]{fill:#451a03}
  [stroke="#fffbeb"]{stroke:#451a03}
  [fill="#fef3c7"]{fill:#78350f}
  [stroke="#fef3c7"]{stroke:#78350f}
  [fill="#92400e"]{fill:#fcd34d}
  [stroke="#92400e"]{stroke:#fcd34d}
  [fill="#b45309"]{fill:#fbbf24}
  [stroke="#b45309"]{stroke:#fbbf24}
  }
</style>

  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">超限 ≠ 立即断：阈值 → 去抖 → 动作 → 回差</text>

  <!-- 坐标与两条基准线 -->
  <line x1="80" y1="260" x2="760" y2="260" stroke="#64748b" stroke-width="1.5"/>
  <line x1="80" y1="140" x2="760" y2="140" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="80" y1="180" x2="760" y2="180" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="740" y="134" text-anchor="end" font-size="11" fill="#dc2626">阈值 4.25V（示例）</text>
  <text x="740" y="174" text-anchor="end" font-size="11" fill="#059669">恢复 4.15V</text>

  <!-- 信号：毛刺 → 持续超限 → 回落进回差带 → 恢复 -->
  <path d="M80,210 L120,205 L160,215 L200,208 L240,212 L250,130 L262,122 L275,135 L288,200 L320,206 L360,212 L400,208 L430,180 L445,150 L460,128 L500,124 L540,130 L580,126 L620,132 L650,150 L680,165 L700,175 L730,195 L760,205"
        fill="none" stroke="#2563eb" stroke-width="2.5" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" opacity="0">
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.02;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dashoffset" values="100;0;0" keyTimes="0;0.75;1" dur="12s" repeatCount="indefinite"/>
  </path>

  <!-- 去抖计时器 -->
  <!-- 两串字原来同在 x=80，基线只差 10px（282 / 272），实测重叠 61×5px，糊成一团。
       改成同一基线左右排开：y=282 这一行本来就是"行标题"行（右边 MOS 开关也在 282）。 -->
  <text x="80" y="282" text-anchor="start" font-size="12" fill="#475569">去抖计时器</text>
  <text x="152" y="282" text-anchor="start" font-size="11" fill="#64748b">窗口 20ms（示例）</text>
  <rect x="80" y="290" width="300" height="18" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="80" y="290" width="0" height="18" rx="4" fill="#f59e0b">
    <animate attributeName="width" values="0;0;90;0;0;300;300;0;0" keyTimes="0;0.206;0.25;0.27;0.45;0.58;0.68;0.7;1" dur="12s" repeatCount="indefinite"/>
  </rect>

  <!-- MOS 开关状态 -->
  <text x="480" y="282" text-anchor="start" font-size="12" fill="#475569">MOS 开关</text>
  <line x1="500" y1="299" x2="530" y2="299" stroke="#cbd5e1" stroke-width="3"/>
  <line x1="556" y1="299" x2="586" y2="299" stroke="#cbd5e1" stroke-width="3"/>
  <line x1="530" y1="299" x2="556" y2="299" stroke="#059669" stroke-width="3.5">
    <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.56;0.58;0.68;0.7;1" dur="12s" repeatCount="indefinite"/>
  </line>
  <line x1="530" y1="299" x2="552" y2="283" stroke="#dc2626" stroke-width="3.5" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.56;0.58;0.68;0.7;1" dur="12s" repeatCount="indefinite"/>
  </line>
  <text x="610" y="294" text-anchor="start" font-size="13" font-weight="bold" fill="#059669">导通
    <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.56;0.58;0.68;0.7;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="610" y="316" text-anchor="start" font-size="13" font-weight="bold" fill="#dc2626" opacity="0">断开
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.56;0.58;0.68;0.7;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- 分幕解说 -->
  <text x="400" y="380" text-anchor="middle" font-size="13" fill="#334155" opacity="0">毛刺短于去抖时间 → 计时清零，不动作
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.16;0.2;0.3;0.34;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="400" y="402" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626" opacity="0">持续超限 → 计时走满 → 保护断开
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.42;0.46;0.58;0.62;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="400" y="424" text-anchor="middle" font-size="13" fill="#334155" opacity="0">回落到阈值与恢复线之间：仍保持断开——回差防反复跳闸
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.62;0.66;0.82;0.86;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="150" y="56" text-anchor="start" font-size="12" fill="#991b1b" opacity="0">短路/过温等严重故障用锁存型：需人工或上位机清除
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <text x="400" y="444" text-anchor="middle" font-size="13" fill="#475569">关键：去抖躲毛刺，回差防颤振，锁存留证据——保护不是一根线，是一套决策。</text>
</svg>
