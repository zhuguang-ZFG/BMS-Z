<text x="500" y="522" font-size="26" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="middle">跨分割的补救与纪律</text>
<path d="M90 540 Q500.00 538.89 910 540" fill="none" stroke="#c9bb9d" stroke-width="1.5"/>
<text x="90" y="574" font-size="22" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">信号不许跨缝：必须跨就差分或光耦/磁隔离；半吊子分割比不割更糟（绕路＋缝隙天线）</text>
<text x="90" y="616" font-size="22" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">隔离两侧通信：缝下并 1000pF–10nF 小桥；Y 安规件容值受漏电流限制</text>
<text x="90" y="658" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">双层板只剩一面地：尽量完整、不开槽，就是它的生存策略</text>
