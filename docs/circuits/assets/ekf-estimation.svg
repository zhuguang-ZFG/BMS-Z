<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440">
  <title>EKF 融合估 SOC 动画</title>
  <rect width="800" height="440" fill="#f8fafc"/>
  <style>text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}</style>

  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">EKF 卡尔曼滤波：让两个"都不靠谱"的信息源互相纠错</text>

  <!-- 坐标轴 -->
  <line x1="60" y1="330" x2="750" y2="330" stroke="#334155" stroke-width="2"/>
  <line x1="60" y1="330" x2="60" y2="70" stroke="#334155" stroke-width="2"/>
  <text x="720" y="352" font-size="12" fill="#334155">时间</text>
  <text x="66" y="82" font-size="12" fill="#334155">SOC</text>

  <!-- 真实 SOC（灰虚线） -->
  <path d="M60,100 L740,250" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="8 6"/>

  <!-- 纯安时积分（橙，越漂越低） -->
  <path d="M60,100 C300,140 500,235 740,300" fill="none" stroke="#f59e0b" stroke-width="3"
        pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000">
    <animate attributeName="stroke-dashoffset" values="1000;0;0" keyTimes="0;0.6;1" dur="10s" repeatCount="indefinite"/>
  </path>

  <!-- EKF 估计（蓝，锯齿状贴住真值） -->
  <path d="M60,100 L222,120 L234,106 L392,142 L404,126 L562,198 L574,182 L740,242" fill="none" stroke="#2563eb" stroke-width="3.5"
        pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000">
    <animate attributeName="stroke-dashoffset" values="1000;0;0" keyTimes="0;0.6;1" dur="10s" repeatCount="indefinite"/>
  </path>

  <!-- 三次观测修正箭头 -->
  <g stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round">
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.14;0.17;0.24;0.27;1" dur="10s" repeatCount="indefinite"/>
      <path d="M228,124 L234,106 M229,111 l5,-5 l5,5"/>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.29;0.32;0.39;0.42;1" dur="10s" repeatCount="indefinite"/>
      <path d="M398,146 L404,126 M399,131 l5,-5 l5,5"/>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.44;0.47;0.54;0.57;1" dur="10s" repeatCount="indefinite"/>
      <path d="M568,202 L574,182 M569,187 l5,-5 l5,5"/>
    </g>
  </g>
  <g font-size="11" fill="#059669" font-weight="bold">
    <text x="160" y="96" opacity="0">电压观测修正<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.14;0.17;0.24;0.27;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="330" y="114" opacity="0">电压观测修正<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.29;0.32;0.39;0.42;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="500" y="170" opacity="0">电压观测修正<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.44;0.47;0.54;0.57;1" dur="10s" repeatCount="indefinite"/></text>
  </g>

  <!-- 图例 -->
  <rect x="480" y="330" width="300" height="86" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <line x1="495" y1="350" x2="535" y2="350" stroke="#64748b" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="545" y="354" font-size="12" fill="#334155">真实 SOC</text>
  <line x1="495" y1="372" x2="535" y2="372" stroke="#f59e0b" stroke-width="3"/>
  <text x="545" y="376" font-size="12" fill="#334155">纯安时积分（漂移不收敛）</text>
  <line x1="495" y1="394" x2="535" y2="394" stroke="#2563eb" stroke-width="3.5"/>
  <text x="545" y="398" font-size="12" fill="#334155">EKF 估计（被观测不断拉回）</text>

  <text x="400" y="428" text-anchor="middle" font-size="14" fill="#475569">积分负责"预测"（平滑但会漂），电压负责"修正"（准但有噪）——滤波把两者的长处焊在一起</text>
</svg>
