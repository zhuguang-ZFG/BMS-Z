<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
<defs>
 <filter id="w" filterUnits="userSpaceOnUse" x="0" y="0" width="960" height="560">
  <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="11" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="4.5" xChannelSelector="R" yChannelSelector="G"/>
 </filter>
 <filter id="grain" filterUnits="userSpaceOnUse" x="0" y="0" width="960" height="560">
  <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="5"/>
  <feColorMatrix type="saturate" values="0"/></filter>
</defs>
<rect width="960" height="560" fill="#f6f1e3"/>
<rect width="960" height="560" filter="url(#grain)" opacity="0.22"/>
<text x="480" y="62" font-family="KaiTi" font-size="20" fill="#003153" text-anchor="middle">10C：t_d/τ_e ≈ 3.6 → 至少 SPMe</text>
<g class="motion" data-x="1">
<line x1="90.0" y1="430.0" x2="900.0" y2="430.0" stroke="#003153" stroke-width="1.7" filter="url(#w)"/>
<line x1="90" y1="430.0" x2="90" y2="416.0" stroke="#003153" stroke-width="1.4" filter="url(#w)"/>
<line x1="90" y1="438.0" x2="90" y2="436.0" stroke="#003153" stroke-width="1.4" filter="url(#w)"/>
<text x="90" y="456.0" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="middle">10² s</text>
<line x1="495" y1="430.0" x2="495" y2="416.0" stroke="#003153" stroke-width="1.4" filter="url(#w)"/>
<line x1="495" y1="438.0" x2="495" y2="436.0" stroke="#003153" stroke-width="1.4" filter="url(#w)"/>
<text x="495" y="456.0" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="middle">10³ s</text>
<line x1="900" y1="430.0" x2="900" y2="416.0" stroke="#003153" stroke-width="1.4" filter="url(#w)"/>
<line x1="900" y1="438.0" x2="900" y2="436.0" stroke="#003153" stroke-width="1.4" filter="url(#w)"/>
<text x="900" y="456.0" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="middle">10⁴ s</text>
</g>
<g class="motion" data-x="1">
<line x1="90" y1="430.0" x2="90" y2="372" stroke="#003153" stroke-width="1.6" filter="url(#w)"/>
<circle cx="90" cy="372" r="3.2" fill="#003153"/>
<text x="100" y="350.0" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="middle">τ_e ≈ 100 s</text>
<line x1="720" y1="430.0" x2="720" y2="372" stroke="#003153" stroke-width="1.6" filter="url(#w)"/>
<circle cx="720" cy="372" r="3.2" fill="#003153"/>
<text x="720" y="350.0" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="middle">t_d 1C = 3600 s</text>
<line x1="315" y1="430.0" x2="315" y2="396" stroke="#003153" stroke-width="1.6" filter="url(#w)"/>
<circle cx="315" cy="396" r="3.2" fill="#003153"/>
<text x="315" y="374.0" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="middle">t_d 10C = 360 s</text>
</g>
<g class="motion" data-x="1">
<text x="90" y="296" font-family="KaiTi" font-size="14" font-weight="bold" fill="#003153">1C 判据</text>
<text x="90" y="314" font-family="KaiTi" font-size="13" fill="#003153">τ_e/t_d ≈ 0.03</text>
<text x="90" y="332" font-family="KaiTi" font-size="13" fill="#003153">电解液近似瞬时平衡 → SPM 敢省</text>
<text x="870" y="296" font-family="KaiTi" font-size="14" font-weight="bold" fill="#003153" text-anchor="end">10C 判据</text>
<text x="870" y="314" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="end">360/100 ≈ 3.6</text>
<text x="870" y="332" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="end">t_d 与 τ_e 同量级 → 至少 SPMe</text>
</g>
<text x="60" y="512" font-family="KaiTi" font-size="13" fill="#003153">④ 10C：t_d=360 s，与 τ_e 同量级（360/100≈3.6）——梯度跟不上，SPM 假设破了，至少 SPMe。</text>
<text x="480" y="546" font-family="KaiTi" font-size="14" opacity="0.8" text-anchor="middle" fill="#003153">原理示意 / 非实拍</text>
</svg>
