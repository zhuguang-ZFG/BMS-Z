<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 590" font-family="ui-monospace, Consolas, monospace">
  <title>采样线断线检测：采样线断开后 AFE 引脚失去电芯电压来源，内部检测电流把引脚拉向异常电平——两次读数对比即可识别断线并上报故障</title>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .cell { fill: #e7f0fb; stroke: #0969da; stroke-width: 1.5; }
    .wire { stroke: #0969da; stroke-width: 2; fill: none; }
    .broken { stroke: #cf222e; stroke-width: 2; stroke-dasharray: 4 4; fill: none; }
    .chip { fill: #f4f6f8; stroke: #57606a; stroke-width: 2; }
    .ok { fill: #1a7f37; }
    .bad { fill: #cf222e; }
    .spark { stroke: #bf8700; stroke-width: 2.5; }
    .gauge { fill: #ffffff; stroke: #d0d7de; }
    .badge { fill: #0969da; }
    .badget { fill: #ffffff; font-size: 12px; font-weight: bold; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .doty { fill: #bf8700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .cell { fill: #12233a; stroke: #4493f8; }
      .wire { stroke: #4493f8; }
      .broken { stroke: #ff7b72; }
      .chip { fill: #161b22; stroke: #8b949e; }
      .ok { fill: #3fb950; }
      .bad { fill: #ff7b72; }
      .spark { stroke: #d29922; }
      .gauge { fill: #0d1117; stroke: #30363d; }
      .badge { fill: #4493f8; }
      .badget { fill: #0d1117; }
      .axis { stroke: #8b949e; }
      .lineb { stroke: #4493f8; }
      .doty { fill: #d29922; }
    }
  </style>
  <rect class="bg" width="800" height="590"/>
  <text class="title" x="30" y="34">采样线断了，AFE 会看到什么？</text>

  <!-- 电芯组 -->
  <g>
    <rect class="cell" x="70" y="90" width="90" height="46" rx="4"/><text class="txt" x="88" y="118">Cell 2</text>
    <rect class="cell" x="70" y="146" width="90" height="46" rx="4"/><text class="txt" x="88" y="174">Cell 1</text>
    <text class="small" x="70" y="216">两节串联，三根采样线</text>
  </g>

  <!-- 采样线：上/中(断)/下 -->
  <path class="wire" d="M 160 100 H 300 V 130 H 340"/>
  <path class="broken" d="M 160 169 H 218 M 252 169 H 300 V 165 H 340"/>
  <path class="wire" d="M 160 186 H 280 V 200 H 340"/>
  <!-- 断点火花 -->
  <g>
    <line class="spark" x1="228" y1="158" x2="240" y2="180"><animate attributeName="opacity" values="1;0.1;1" dur="0.7s" repeatCount="indefinite"/></line>
    <line class="spark" x1="240" y1="158" x2="228" y2="180"><animate attributeName="opacity" values="0.1;1;0.1" dur="0.7s" repeatCount="indefinite"/></line>
    <text class="bad" x="200" y="150" font-size="12" font-weight="bold">断线！</text>
  </g>

  <!-- AFE -->
  <rect class="chip" x="340" y="110" width="150" height="110" rx="8"/>
  <text class="txt" x="392" y="136">AFE</text>
  <text class="small" x="356" y="160">引脚内部有弱</text>
  <text class="small" x="356" y="178">检测电流源</text>

  <!-- 步骤说明 -->
  <g>
    <circle class="badge" cx="530" cy="86" r="10"/><text class="badget" x="526" y="90">1</text>
    <text class="txt" x="548" y="91">中间线断开 → 引脚悬空</text>
    <circle class="badge" cx="530" cy="122" r="10"/><text class="badget" x="526" y="126">2</text>
    <text class="txt" x="548" y="127">AFE 灌/拉检测电流，悬空</text>
    <text class="txt" x="548" y="145">引脚被推向异常电平</text>
    <circle class="badge" cx="530" cy="182" r="10"/><text class="badget" x="526" y="186">3</text>
    <text class="txt" x="548" y="187">两次读数对比异常 →</text>
    <text class="txt" x="548" y="205">判断线，置故障位</text>
  </g>

  <!-- 读数对照屏 -->
  <rect class="gauge" x="60" y="252" width="330" height="100" rx="6"/>
  <text class="small" x="76" y="274">主控看到的电压读数</text>
  <text class="ok" x="76" y="300" font-size="14">Cell1：3.65 V ✓ 正常</text>
  <text class="bad" x="76" y="328" font-size="14">Cell2：0.02 V ← 假象！
    <animate attributeName="opacity" values="1;0.55;1" dur="1.2s" repeatCount="indefinite"/>
  </text>
  <rect class="gauge" x="410" y="252" width="350" height="100" rx="6"/>
  <text class="small" x="426" y="274">为什么不能直接当过放保护触发？</text>
  <text class="small" x="426" y="300">断线的 0V 与真过放的 0V 长得一样——</text>
  <text class="small" x="426" y="320">所以断线检测是独立诊断：先确认线没断，</text>
  <text class="small" x="426" y="340">电压读数才可信（先信线，再信数）。</text>

  <rect class="panel" x="40" y="368" width="720" height="200" rx="6"/>
  <text class="small" x="56" y="388">悬空脚电压（示意）　V=0.02+3.63·e^(−t/0.2s)</text>
  <line class="axis" x1="80" y1="410" x2="80" y2="560"/>
  <line class="axis" x1="80" y1="560" x2="660" y2="560"/>
  <text class="small" x="36" y="424">3.65</text>
  <text class="small" x="44" y="564">0</text>
  <text class="small" x="80" y="578">0</text>
  <text class="small" x="160" y="578">0.2s</text>
  <text class="small" x="620" y="578">1.2s</text>
  <polyline class="lineb" points="80.0,420.0 91.7,436.4 103.3,450.8 115.0,463.5 126.7,474.8 138.3,484.7 150.0,493.5 161.7,501.2 173.3,508.0 185.0,514.0 196.7,519.3 208.3,524.0 220.0,528.2 231.7,531.8 243.3,535.0 255.0,537.9 266.7,540.4 278.3,542.6 290.0,544.6 301.7,546.3 313.3,547.8 325.0,549.1 336.7,550.3 348.3,551.4 360.0,552.3 371.7,553.1 383.3,553.8 395.0,554.5 406.7,555.0 418.3,555.5 430.0,556.0 441.7,556.3 453.3,556.7 465.0,557.0 476.7,557.2 488.3,557.5 500.0,557.7 511.7,557.9 523.3,558.0 535.0,558.2 546.7,558.3 558.3,558.4 570.0,558.5 581.7,558.6 593.3,558.7 605.0,558.7 616.7,558.8 628.3,558.8 640.0,558.9"/>
  <text class="hi" x="200" y="450">0.2 s 约 1.36 V，1.0 s 约 0.04 V</text>
  <circle class="doty" r="6">
    <animate attributeName="cx" values="80.0;126.7;173.3;220.0;266.7;313.3;360.0;406.7;453.3;500.0;546.7;593.3;640.0" keyTimes="0;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="420.0;474.8;508.0;528.2;540.4;547.8;552.3;555.0;556.7;557.7;558.3;558.7;558.9" keyTimes="0;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <text class="small" x="200" y="540">读数贴向 0.02 V 是检测电流把脚拉走，不是电芯真的到了 0.02 V。τ=0.2 s 示意。</text>
</svg>
