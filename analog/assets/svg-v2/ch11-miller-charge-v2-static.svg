<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">电荷随两端压差变化，电容本身没变</title>
<desc id="figDesc">示意 Cbc=10 pF；输入 ±1 mV，输出增益为 −A；低频电压增益近似。</desc>
<metadata id="visual-timeline">{&quot;duration&quot;: 12, &quot;beats&quot;: [{&quot;name&quot;: &quot;条件&quot;, &quot;start&quot;: 0, &quot;end&quot;: 3, &quot;caption&quot;: &quot;A=0，电容输出端固定，电荷只随输入变化。&quot;}, {&quot;name&quot;: &quot;变化&quot;, &quot;start&quot;: 3, &quot;end&quot;: 6, &quot;caption&quot;: &quot;A=10，输出反相，电容两端摆幅增加。&quot;}, {&quot;name&quot;: &quot;比较&quot;, &quot;start&quot;: 6, &quot;end&quot;: 9, &quot;caption&quot;: &quot;A=50，同一输入需搬运更多电荷。&quot;}, {&quot;name&quot;: &quot;结论&quot;, &quot;start&quot;: 9, &quot;end&quot;: 12, &quot;caption&quot;: &quot;A=100，等效输入电容为 1.01 nF。&quot;}]}</metadata>
