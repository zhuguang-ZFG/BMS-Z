<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1448 1086" role="img" aria-labelledby="title desc" data-print-width-mm="138" data-composition="technical-overlay-v1" data-base-medium="python-svg"><title id="title">万用表的平均滤镜</title><desc id="desc">上半幅左边是万用表，显示一条不动的 2.5 V 直线；右边是示波器，把同一节点摊成 ±2 V 的正弦波。下半幅左栏解释 DC 与 AC 档为何都看不见 1 MHz 振荡，右栏给出示波器 AC 耦合与毫伏档的复核判据。</desc><rect width="1448" height="1086" fill="#e2d9cf" /><g id="paper-illustration"><path data-paper-shadow="true" transform="translate(8 12)" d="M68,182 L631.6,180 L1381,183 L1384,328.2 L1381,438 L565.6,440 L64,436 Z" fill="#535453" opacity="0.08" /><path data-paper-shadow="true" transform="translate(4 7)" d="M68,182 L631.6,180 L1381,183 L1384,328.2 L1381,438 L565.6,440 L64,436 Z" fill="#535453" opacity="0.12" /><path data-paper-shadow="true" transform="translate(2 3)" d="M68,182 L631.6,180 L1381,183 L1384,328.2 L1381,438 L565.6,440 L64,436 Z" fill="#535453" opacity="0.15" /><path d="M68,182 L631.6,180 L1381,183 L1384,328.2 L1381,438 L565.6,440 L64,436 Z" fill="#f6f2ed" stroke="#c4b9ab" stroke-width="1.4" /><path d="M70,184L1377,185" fill="none" stroke="#ffffff" stroke-width="2" opacity=".7" />
<g transform="translate(140 235) scale(0.95)"><path data-paper-shadow="true" transform="translate(8 12)" d="M4,2 L48.16,0 L109,3 L112,90.05999999999999 L109,156 L42.56,158 L0,154 Z" fill="#535453" opacity="0.08" /><path data-paper-shadow="true" transform="translate(4 7)" d="M4,2 L48.16,0 L109,3 L112,90.05999999999999 L109,156 L42.56,158 L0,154 Z" fill="#535453" opacity="0.12" /><path data-paper-shadow="true" transform="translate(2 3)" d="M4,2 L48.16,0 L109,3 L112,90.05999999999999 L109,156 L42.56,158 L0,154 Z" fill="#535453" opacity="0.15" /><path d="M4,2 L48.16,0 L109,3 L112,90.05999999999999 L109,156 L42.56,158 L0,154 Z" fill="#c4b9ab" stroke="#c4b9ab" stroke-width="1.4" /><path d="M6,4L105,5" fill="none" stroke="#ffffff" stroke-width="2" opacity=".7" /><rect x="14" y="18" width="84" height="44" rx="4" fill="#f6f2ed" stroke="#2a2927" stroke-width="2" /><line x1="24" y1="40" x2="88" y2="40" stroke="#a4441d" stroke-width="4" stroke-dasharray="" /><circle cx="56" cy="101" r="27" fill="#2a2927" /><line x1="56" y1="101" x2="70" y2="82" stroke="#f6f2ed" stroke-width="5" stroke-dasharray="" /><path d="M26,158v24H4v-16" fill="none" stroke="#2a2927" stroke-width="4" /><path d="M86,158v24h22v-16" fill="none" stroke="#a4441d" stroke-width="4" /></g>
