<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-label="一阶热模型的指数升温曲线">
  <rect x="0" y="0" width="960" height="380" fill="#fffdf5"/>
  <text x="24" y="30" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#293b3a">升温走指数：每过一个 τ，走完剩余差距的 63.2%</text>

  <!-- 坐标轴 -->
  <line x1="80" y1="316.0" x2="900" y2="316.0" stroke="#626d65" stroke-width="1.5"/>
  <line x1="100" y1="230" x2="100" y2="330" stroke="#626d65" stroke-width="1.5"/>
  <text x="60" y="320.0" text-anchor="end" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#626d65">25 °C</text>
  <text x="60" y="258.8" text-anchor="end" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#626d65">31.1</text>

  <!-- 渐近线（稳态） -->
  <line x1="80" y1="254.8" x2="900" y2="254.8" stroke="#968d77" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="700" y="246.8" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#626d65">T_ss = T_amb + P·R_th = 31.1 °C</text>

  <!-- 升温曲线 -->
  <polyline points="100.0,316.0 116.2,311.1 132.5,306.6 148.8,302.5 165.0,298.7 181.2,295.2 197.5,291.9 213.8,289.0 230.0,286.2 246.2,283.7 262.5,281.4 278.8,279.3 295.0,277.3 311.2,275.5 327.5,273.9 343.8,272.4 360.0,271.0 376.2,269.7 392.5,268.5 408.8,267.4 425.0,266.4 441.2,265.5 457.5,264.6 473.8,263.8 490.0,263.1 506.2,262.4 522.5,261.8 538.8,261.3 555.0,260.8 571.2,260.3 587.5,259.9 603.8,259.4 620.0,259.1 636.2,258.7 652.5,258.4 668.8,258.1 685.0,257.9 701.2,257.6 717.5,257.4 733.8,257.2 750.0,257.0 766.2,256.8 782.5,256.7 798.8,256.5 815.0,256.4 831.2,256.3 847.5,256.2 863.8,256.0 880.0,256.0" fill="none" stroke="#377b60" stroke-width="3"/>

  <line x1="295.0" y1="316.0" x2="295.0" y2="277.3" stroke="#cfc6b2" stroke-width="1.2" stroke-dasharray="4 4"/>
  <circle cx="295.0" cy="277.3" r="4" fill="#b84745"/>
  <text x="289.0" y="265.3" text-anchor="end" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#b84745">63.2%</text>
  <text x="295.0" y="340.0" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="11" fill="#626d65">τ = 120 s</text>
  <line x1="490.0" y1="316.0" x2="490.0" y2="263.1" stroke="#cfc6b2" stroke-width="1.2" stroke-dasharray="4 4"/>
  <circle cx="490.0" cy="263.1" r="4" fill="#b84745"/>
  <text x="484.0" y="251.1" text-anchor="end" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#b84745">86.5%</text>
  <text x="490.0" y="340.0" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="11" fill="#626d65">2τ = 240 s</text>
  <line x1="685.0" y1="316.0" x2="685.0" y2="257.9" stroke="#cfc6b2" stroke-width="1.2" stroke-dasharray="4 4"/>
  <circle cx="685.0" cy="257.9" r="4" fill="#b84745"/>
  <text x="679.0" y="245.9" text-anchor="end" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#b84745">95.0%</text>
  <text x="685.0" y="340.0" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="11" fill="#626d65">3τ = 360 s</text>

  <text x="24" y="360" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" fill="#626d65">τ = R_th·C_th = 120 s；断电降温走同一条指数，只是方向朝下。三个 τ 到 95%。</text>
</svg>
