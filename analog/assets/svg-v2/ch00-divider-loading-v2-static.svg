<text x="480" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b">分压器一挂负载就塌</text>
<text x="480" y="54" text-anchor="middle" font-size="12.5" fill="#5b666f">空载公式只描述开路；带载后下臂被并联，输出由输出电阻决定</text>
<rect x="48" y="96" width="864" height="420" rx="14" fill="#f6eedb" stroke="#c9bb9d" stroke-width="1.4"/>
<circle cx="96" cy="300" r="28" fill="#e6eff3" stroke="#1f5d7a" stroke-width="2"/>
