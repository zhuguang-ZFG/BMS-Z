  <path d="M19.25 20.8Q20 17 23.8 17L191 16.21L358.2 17Q362 17 362 20.8L362.81 25.75L362 30.7Q362 34.5 358.2 34.5L191 34.01L23.8 34.5Q20 34.5 20 30.7L20 20.35" class="bms-marker" aria-hidden="true" transform="rotate(-.5 20.0 25.8)"/>
