[stroke="#6b3f63"]{stroke:#a17c9b}
}
</style>

<text x="52" y="58" font-size="38" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">分流位置：沿真实电流路径判断能否测到</text><text x="52" y="94" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">高侧与低侧都只看流经自身分流的电流；不能按“对地短路”四字一概判断。</text>
<text x="250" y="160" font-size="28" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">低侧分流</text>
<text x="250" y="205" font-size="24" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">电源</text>
<path d="M250 215 L250 240" fill="none" stroke="#16202b" stroke-width="3"/>
<rect x="140" y="240" width="220" height="50" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/><text x="250.0" y="273" font-size="23" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">负载</text>
<path d="M250 290 L250 360" fill="none" stroke="#16202b" stroke-width="3"/>
<path d="M250 360 L250 385" fill="none" stroke="#16202b" stroke-width="3"/>
<rect x="140" y="385" width="220" height="50" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/><text x="250.0" y="418" font-size="23" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">分流 Rs</text>
<path d="M250 435 L250 505" fill="none" stroke="#16202b" stroke-width="3"/>
<text x="250" y="555" font-size="24" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">系统地</text>
<text x="60" y="610" font-size="23" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">负载地抬高 IRs，检查接口地预算。</text>
<text x="740" y="160" font-size="28" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">高侧分流</text>
<text x="740" y="205" font-size="24" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">电源</text>
<path d="M740 215 L740 240" fill="none" stroke="#16202b" stroke-width="3"/>
<rect x="630" y="240" width="220" height="50" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/><text x="740.0" y="273" font-size="23" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">分流 Rs</text>
<path d="M740 290 L740 360" fill="none" stroke="#16202b" stroke-width="3"/>
<path d="M740 360 L740 385" fill="none" stroke="#16202b" stroke-width="3"/>
<rect x="630" y="385" width="220" height="50" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/><text x="740.0" y="418" font-size="23" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">负载</text>
<path d="M740 435 L740 505" fill="none" stroke="#16202b" stroke-width="3"/>
<text x="740" y="555" font-size="24" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">系统地</text>
<text x="550" y="610" font-size="23" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">保留负载地，放大器需承受高共模。</text>
<text x="45" y="665" font-size="23" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">低侧还须查近地输入范围与负瞬态；高侧还须查共模边沿与恢复时间。</text>
</svg>
