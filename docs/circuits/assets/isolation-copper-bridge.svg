<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 590" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>隔离槽示意：空槽按高通挡住直流，一条铜桥让 400 V 的包电位出现在通信侧。报文还能发，不代表人手是安全的。</title>
  <desc>蓝线随频率升起，红线贴着 400 V。金点沿蓝线走。人手摸到被铜桥接上的通信口，摸到的是电池电位。</desc>
  <style>
    .bg { fill: #fffdf5; }
    .panel { fill: #f7f2e5; stroke: #cfc6b2; }
    .axis { stroke: #626d65; stroke-width: 1.5; fill: none; }
    .grid { stroke: #cfc6b2; stroke-width: 1; fill: none; }
    .txt { fill: #293b3a; font-size: 13px; }
    .small { fill: #5f6a63; font-size: 12px; }
    .title { fill: #293b3a; font-size: 16px; font-weight: bold; }
    .hi { fill: #176b73; }
    .warn { fill: #ad4644; }
    .ok { fill: #36775e; }
    .gold { fill: #8e6518; }
    .lineb { stroke: #176b73; stroke-width: 2.5; fill: none; }
    .liner { stroke: #b84745; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #377b60; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .liney { stroke: #926717; stroke-width: 2.2; fill: none; }
    .linek { stroke: #626d65; stroke-width: 2.2; fill: none; stroke-dasharray: 7 4; }
    .dotb { fill: #176b73; }
    .dotr { fill: #b84745; }
    .dotg { fill: #377b60; }
    .doty { fill: #926717; }
    .boxb { fill: #e4f0df; stroke: #176b73; }
    .boxy { fill: #fbefc7; stroke: #926717; }
    .boxr { fill: #f6e2df; stroke: #b84745; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #192727; }
      .panel { fill: #223333; stroke: #496160; }
      .axis { stroke: #b0beb3; }
      .grid { stroke: #496160; }
      .txt { fill: #edf0e5; }
      .small { fill: #b0beb3; }
      .title { fill: #edf0e5; }
      .hi { fill: #7ec5c5; }
      .warn { fill: #f39b91; }
      .ok { fill: #8fc7a2; }
      .gold { fill: #dfbd78; }
      .lineb { stroke: #7ec5c5; }
      .liner { stroke: #f39b91; }
      .lineg { stroke: #8fc7a2; }
      .liney { stroke: #dfbd78; }
      .linek { stroke: #b0beb3; }
      .dotb { fill: #7ec5c5; }
      .dotr { fill: #f39b91; }
      .dotg { fill: #8fc7a2; }
      .doty { fill: #dfbd78; }
      .boxb { fill: #293f35; stroke: #7ec5c5; }
      .boxy { fill: #453e2b; stroke: #dfbd78; }
      .boxr { fill: #483336; stroke: #f39b91; }
    }
  </style><style id="bms-motion">
    /* bms-motion: 手帐式动效注记（纯装饰，不改技术几何与既有 SMIL 时序） */
    .bms-marker { fill: #fbefc7; opacity: .78; }
    .bms-under { fill: none; stroke: #926717; stroke-width: 2.4; stroke-linecap: round; opacity: .9; }
    .bms-spark-line { fill: none; stroke: #926717; stroke-width: 1.9; stroke-linecap: round; }
    .bms-spark-fill { fill: #926717; }
    .bms-spark-soft { fill: #176b73; opacity: .8; }
    .bms-sticker { fill: none; stroke: #926717; stroke-width: 2; stroke-dasharray: 7 5; stroke-linecap: round; opacity: .85; }
    .bms-halo { fill: none; stroke: #926717; stroke-width: 2; }
    .bms-marker, .bms-under, .bms-sticker, .bms-halo,
    .bms-spark, .bms-success, .bms-doodle { pointer-events: none; }
    circle:has(> animateMotion) { filter: drop-shadow(0 0 2px rgba(146,103,23,.5)) drop-shadow(0 0 5px rgba(196,145,52,.45)); }
    rect:has(> animateMotion) { filter: drop-shadow(0 0 3px rgba(196,145,52,.75)); }
    g:has(> circle):has(> path.stroke-check) { filter: drop-shadow(0 0 5px rgba(55,123,96,.5)); }
    @media (prefers-color-scheme: dark) {
      .bms-marker { fill: #453e2b; opacity: .85; }
      .bms-under { stroke: #dfbd78; }
      .bms-spark-line { stroke: #dfbd78; }
      .bms-spark-fill { fill: #dfbd78; }
      .bms-spark-soft { fill: #7ec5c5; }
      .bms-sticker { stroke: #dfbd78; }
      .bms-halo { stroke: #dfbd78; }
      circle:has(> animateMotion) { filter: drop-shadow(0 0 2px rgba(223,189,120,.8)) drop-shadow(0 0 7px rgba(223,189,120,.9)); }
      rect:has(> animateMotion) { filter: drop-shadow(0 0 6px rgba(223,189,120,.8)); }
      g:has(> circle):has(> path.stroke-check) { filter: drop-shadow(0 0 6px rgba(143,199,162,.7)); }
    }
    @media (prefers-reduced-motion: reduce) { .bms-spark, .bms-success, .bms-doodle { display: none; } }
</style>
  <!-- formula: H=f/f0/sqrt(1+(f/f0)^2); f0=10 kHz illustrative; copper gain=1; V=400*H -->
  <rect class="bg" width="800" height="590"/>
  <rect class="bms-marker" aria-hidden="true" x="18.0" y="17.1" width="366.0" height="17.3" rx="3.8" transform="rotate(-.5 18.0 25.8)"/><path class="bms-under" aria-hidden="true" d="M24.0 40.0 q 24.0 -2.4 48.0 0 t 48 0 t 48 0 t 48 0 t 48 0 t 48 0 t 48 0"/><text class="title" x="24" y="32">铜桥让直流过去，空槽让直流留在墙这边（示意）</text>
  <rect class="panel" x="24" y="44" width="752" height="124" rx="6"/><g class="bms-doodle" aria-hidden="true" transform="translate(746.0 68.0)"><animateTransform attributeName="transform" type="rotate" values="-6;7;-6" keyTimes="0;0.5;1" dur="5.4s" repeatCount="indefinite" additive="sum"/><animate attributeName="opacity" values="0.62;1;0.62" keyTimes="0;0.5;1" dur="3.6s" repeatCount="indefinite"/><path class="bms-spark-fill" d="M0 -9 L2.3 -2.3 L9 0 L2.3 2.3 L0 9 L-2.3 2.3 L-9 0 L-2.3 -2.3 Z"/></g><g class="bms-doodle" aria-hidden="true" transform="translate(710.0 58.0)"><animateTransform attributeName="transform" type="rotate" values="5;-4;5" keyTimes="0;0.5;1" dur="6.2s" repeatCount="indefinite" additive="sum"/><animate attributeName="opacity" values="0.5;0.9;0.5" keyTimes="0;0.5;1" dur="4.4s" repeatCount="indefinite"/><path class="bms-spark-soft" d="M0 -5.5 L1.4 -1.4 L5.5 0 L1.4 1.4 L0 5.5 L-1.4 1.4 L-5.5 0 L-1.4 -1.4 Z"/></g><g class="bms-doodle" aria-hidden="true"><circle class="bms-spark-fill" cx="728.0" cy="77.0" r="1.3"/><circle class="bms-spark-soft" cx="696.0" cy="74.0" r="1.1"/></g>
  <text class="txt" x="40" y="68" opacity="0.28">① 空槽<tspan class="small">　示意高通，拐角 10 kHz。直流增益走向 0。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" calcMode="spline" keySplines="0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="92" opacity="0.28">② 铜桥<tspan class="small">　从直流到高频增益都是 1。通信地被拉到包电位。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="116" opacity="0.28">③ 10 Hz<tspan class="small">　空槽这边几乎没有 400 V，铜桥这边就是 400 V。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="140" opacity="0.28">④ 口诀<tspan class="small">　隔离槽是开口。铜皮不能当桥。报文还在也不代表隔离还在。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="180" width="752" height="268" rx="6"/>
  <text class="small" x="40" y="202">通信侧看到的电压 V（示意包压 400）</text>
  <text class="hi" x="200" y="218">蓝 空槽</text>
  <text class="warn" x="320" y="218">红 铜桥</text>
  <line class="axis" x1="108.0" y1="248.0" x2="108.0" y2="400.0"/>
  <line class="axis" x1="108.0" y1="400.0" x2="720.0" y2="400.0"/>
  <line class="grid" x1="108.0" y1="400.0" x2="108.0" y2="406.0"/>
  <text class="small" x="108.0" y="422.0" text-anchor="middle">10</text>
  <line class="grid" x1="475.2" y1="400.0" x2="475.2" y2="406.0"/>
  <text class="small" x="475.2" y="422.0" text-anchor="middle">10k</text>
  <line class="grid" x1="720.0" y1="400.0" x2="720.0" y2="406.0"/>
  <text class="small" x="720.0" y="422.0" text-anchor="middle">1M</text>
  <line class="grid" x1="102.0" y1="400.0" x2="108.0" y2="400.0"/>
  <text class="small" x="98.0" y="404.0" text-anchor="end">0</text>
  <line class="grid" x1="102.0" y1="255.2" x2="108.0" y2="255.2"/>
  <text class="small" x="98.0" y="259.2" text-anchor="end">400</text>
  <text class="small" x="720" y="444" text-anchor="end">频率 Hz（对数）</text>
  <polyline class="lineb" points="108.0,399.9 118.2,399.8 128.4,399.8 138.6,399.7 148.8,399.7 159.0,399.6 169.2,399.5 179.4,399.4 189.6,399.3 199.8,399.2 210.0,399.0 220.2,398.8 230.4,398.6 240.6,398.2 250.8,397.9 261.0,397.4 271.2,396.9 281.4,396.2 291.6,395.4 301.8,394.5 312.0,393.3 322.2,391.9 332.4,390.2 342.6,388.1 352.8,385.6 363.0,382.6 373.2,379.0 383.4,374.7 393.6,369.5 403.8,363.4 414.0,356.4 424.2,348.2 434.4,339.1 444.6,329.0 454.8,318.5 465.0,307.8 475.2,297.6 485.4,288.4 495.6,280.4 505.8,273.8 516.0,268.7 526.2,264.8 536.4,262.0 546.6,259.9 556.8,258.5 567.0,257.5 577.2,256.8 587.4,256.3 597.6,256.0 607.8,255.7 618.0,255.6 628.2,255.5 638.4,255.4 648.6,255.3 658.8,255.3 669.0,255.3 679.2,255.3 689.4,255.3 699.6,255.3 709.8,255.2 720.0,255.2" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline class="liner" points="108.0,255.2 118.2,255.2 128.4,255.2 138.6,255.2 148.8,255.2 159.0,255.2 169.2,255.2 179.4,255.2 189.6,255.2 199.8,255.2 210.0,255.2 220.2,255.2 230.4,255.2 240.6,255.2 250.8,255.2 261.0,255.2 271.2,255.2 281.4,255.2 291.6,255.2 301.8,255.2 312.0,255.2 322.2,255.2 332.4,255.2 342.6,255.2 352.8,255.2 363.0,255.2 373.2,255.2 383.4,255.2 393.6,255.2 403.8,255.2 414.0,255.2 424.2,255.2 434.4,255.2 444.6,255.2 454.8,255.2 465.0,255.2 475.2,255.2 485.4,255.2 495.6,255.2 505.8,255.2 516.0,255.2 526.2,255.2 536.4,255.2 546.6,255.2 556.8,255.2 567.0,255.2 577.2,255.2 587.4,255.2 597.6,255.2 607.8,255.2 618.0,255.2 628.2,255.2 638.4,255.2 648.6,255.2 658.8,255.2 669.0,255.2 679.2,255.2 689.4,255.2 699.6,255.2 709.8,255.2 720.0,255.2" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="doty" r="6" cx="108.0" cy="399.9"><animate data-ease="linear" attributeName="cx" values="108.0;475.2;597.6;720.0;720.0" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite"/><animate data-ease="linear" attributeName="cy" values="399.9;297.6;256.0;255.2;255.2" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite"/></circle>
  <circle class="dotr" r="4" cx="108.0" cy="399.9"><animate data-ease="linear" attributeName="cx" values="108.0;475.2;597.6;720.0;720.0" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite" begin="-6s"/><animate data-ease="linear" attributeName="cy" values="399.9;297.6;256.0;255.2;255.2" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite" begin="-6s"/></circle>
  <rect class="panel" x="24" y="460" width="752" height="68" rx="6"/>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="1">f = 10 Hz · 空槽 0.40 V · 铜桥 400 V（示意）<animate attributeName="opacity" values="1;0;0;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0">f = 10 kHz · 空槽 282.8 V · 铜桥 400 V（示意）<animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0">f = 100 kHz · 空槽 398.0 V · 铜桥 400 V（示意）<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0">f = 1 MHz · 空槽 400.0 V · 铜桥 400 V（示意）<animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="24" y="560">10 kHz 是为了把高通画出来，不是变压器手册。爬电距离查所选标准，这篇不写毫米数。</text>

</svg>
