<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 -156 800 650" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>预充回路上电时序动画</title>
  <desc>预充回路上电时序动画。示意。</desc><style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .fill-boxb { fill: #ddf4ff; }
    .fill-boxg { fill: #dafbe1; }
    .fill-boxr { fill: #ffebe9; }
    .fill-boxy { fill: #fff8c5; }
    .fill-b { fill: #0969da; }
    .fill-g { fill: #1a7f37; }
    .fill-r { fill: #cf222e; }
    .fill-y { fill: #9a6700; }
    .fill-ink { fill: #57606a; }
    .fill-muted { fill: #e2e8f0; }
    .fill-lockb { fill: #0969da; }
    .stroke-panel { stroke: #d0d7de; }
    .stroke-axis { stroke: #57606a; }
    .stroke-b { stroke: #0969da; }
    .stroke-g { stroke: #1a7f37; }
    .stroke-r { stroke: #cf222e; }
    .stroke-y { stroke: #bf8700; }
    .stroke-check { stroke: #ffffff; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .on { fill: #ffffff; font-size: 13px; font-weight: bold; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .fill-boxb { fill: #12233a; }
      .fill-boxg { fill: #0f2415; }
      .fill-boxr { fill: #3d1214; }
      .fill-boxy { fill: #2d2607; }
      .fill-b { fill: #4493f8; }
      .fill-g { fill: #3fb950; }
      .fill-r { fill: #ff7b72; }
      .fill-y { fill: #d29922; }
      .fill-ink { fill: #8b949e; }
      .fill-muted { fill: #30363d; }
      .fill-lockb { fill: #0969da; }
      .stroke-panel { stroke: #30363d; }
      .stroke-axis { stroke: #8b949e; }
      .stroke-b { stroke: #4493f8; }
      .stroke-g { stroke: #3fb950; }
      .stroke-r { stroke: #ff7b72; }
      .stroke-y { stroke: #d29922; }
      .stroke-check { stroke: #0d1117; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .on { fill: #ffffff; }
      .lineb { stroke: #4493f8; }
    }
</style><rect class="bg" x="0" y="-156" width="800" height="650" /><text class="title" x="24" y="-128">预充回路：先小电流"灌满蓄水池"，再开主闸</text><rect class="panel" x="24" y="438" width="752" height="44" rx="6" /><text class="txt" x="40" y="466" font-size="13" opacity="1">上电前：继电器全断开，母线电容还是 0<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.28;0.30;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="466" font-size="13" opacity="0">预充：合 K2，电流经电阻把母线抬上去<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.34;0.60;0.62;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="466" font-size="13" opacity="0">主回路：母线到位后合 K1，再断开 K2<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.65;0.68;1" dur="12s" repeatCount="indefinite" /></text><rect width="800" height="430" class="bg" />
  <rect x="50" y="160" width="100" height="100" rx="10" stroke-width="2" class="fill-boxb stroke-axis" />
  <text x="100" y="205" text-anchor="middle" font-size="14" font-weight="bold" class="hi">400V</text>
  <text x="100" y="223" text-anchor="middle" font-size="12" class="hi">电池组</text>

  
  <line x1="150" y1="210" x2="240" y2="210" stroke-width="3" class="stroke-axis" />
  <line x1="330" y1="210" x2="505" y2="210" stroke-width="3" class="stroke-axis" />
  <line x1="535" y1="210" x2="640" y2="210" stroke-width="3" class="stroke-axis" />

  
  <g>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.62;0.65;1" dur="12s" repeatCount="indefinite" />
    <line x1="240" y1="210" x2="330" y2="210" stroke-width="4" class="stroke-b" />
  </g>
  <g>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.62;0.65;1" dur="12s" repeatCount="indefinite" />
    <line x1="240" y1="210" x2="322" y2="178" stroke-width="4" stroke-linecap="round" class="stroke-b" />
  </g>
  <circle cx="240" cy="210" r="5" class="fill-ink" />
  <circle cx="330" cy="210" r="5" class="fill-ink" />
  <text x="285" y="245" text-anchor="middle" font-size="13" font-weight="bold" class="txt">主继电器 K1</text>

  
  <path d="M200,210 V110 H240" fill="none" stroke-width="2" class="stroke-axis" />
  <path d="M480,110 H500 V210" fill="none" stroke-width="2" class="stroke-axis" />
  
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.30;0.32;0.62;0.65;1" dur="12s" repeatCount="indefinite" />
    <line x1="240" y1="110" x2="330" y2="110" stroke-width="3" class="stroke-b" />
  </g>
  <g>
    <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.30;0.32;0.62;0.65;1" dur="12s" repeatCount="indefinite" />
    <line x1="240" y1="110" x2="322" y2="82" stroke-width="3" stroke-linecap="round" class="stroke-b" />
  </g>
  <circle cx="240" cy="110" r="4" class="fill-ink" />
  <circle cx="330" cy="110" r="4" class="fill-ink" />
  <text x="285" y="70" text-anchor="middle" font-size="12" font-weight="bold" class="txt">预充继电器 K2</text>
  
  <polyline points="330,110 345,96 360,124 375,96 390,124 405,96 420,124 435,96 450,124 465,96 480,110" fill="none" stroke="#64748b" stroke-width="2.5" class="stroke-axis">
    <animate attributeName="stroke" values="#94a3b8;#fbbf24;#fbbf24;#94a3b8" keyTimes="0;0.32;0.60;1" dur="12s" repeatCount="indefinite" />
  </polyline>
  <text x="405" y="70" text-anchor="middle" font-size="12" class="small">预充电阻 R</text>

  
  <line x1="505" y1="198" x2="535" y2="198" stroke-width="3" class="stroke-axis" />
  <line x1="505" y1="222" x2="535" y2="222" stroke-width="3" class="stroke-axis" />
  <text x="520" y="245" text-anchor="middle" font-size="12" class="txt">母线电容</text>

  
  <rect x="640" y="160" width="110" height="100" rx="10" stroke-width="2" class="panel stroke-axis" />
  <text x="695" y="205" text-anchor="middle" font-size="13" font-weight="bold" class="txt">逆变器</text>
  <text x="695" y="223" text-anchor="middle" font-size="12" class="small">(内含大电容)</text>

  
  <rect x="560" y="140" width="20" height="120" fill="none" stroke-width="2" class="stroke-axis" />
  <rect x="562" y="258" width="16" height="2" class="fill-g">
    <animate attributeName="height" values="2;2;114;114" keyTimes="0;0.32;0.62;1" dur="12s" repeatCount="indefinite" />
    <animate attributeName="y" values="258;258;146;146" keyTimes="0;0.32;0.62;1" dur="12s" repeatCount="indefinite" />
  </rect>
  <text x="570" y="132" text-anchor="middle" font-size="12" class="txt">母线电压</text>

  
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.34;0.60;0.62;1" dur="12s" repeatCount="indefinite" />
    <circle r="5" class="fill-y"><animateMotion dur="2.4s" begin="0s" repeatCount="indefinite" path="M160,210 H200 V110 H490 V210 H505" /></circle>
    <circle r="5" class="fill-y"><animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite" path="M160,210 H200 V110 H490 V210 H505" /></circle>
    <circle r="5" class="fill-y"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite" path="M160,210 H200 V110 H490 V210 H505" /></circle>
  </g>

  
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.65;0.67;1" dur="12s" repeatCount="indefinite" />
    <circle r="7" class="fill-g"><animateMotion dur="1.2s" begin="0s" repeatCount="indefinite" path="M160,210 H640" /></circle>
    <circle r="7" class="fill-g"><animateMotion dur="1.2s" begin="0.4s" repeatCount="indefinite" path="M160,210 H640" /></circle>
    <circle r="7" class="fill-g"><animateMotion dur="1.2s" begin="0.8s" repeatCount="indefinite" path="M160,210 H640" /></circle>
  </g>

  
  <g opacity="0">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.28;0.30;1" dur="12s" repeatCount="indefinite" />
    <text x="400" y="320" text-anchor="middle" font-size="14" class="txt">上电前：继电器全断开，母线电容电压 = 0（直接合闸 = 短路冲击！）</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.34;0.60;0.62;1" dur="12s" repeatCount="indefinite" />
    <text x="400" y="320" text-anchor="middle" font-size="14" class="gold">第 1 步：合 K2，电流经电阻被"限流"，母线电压平缓爬升</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.65;0.68;1" dur="12s" repeatCount="indefinite" />
    <text x="400" y="320" text-anchor="middle" font-size="14" class="ok">第 2 步：母线≈电池电压 → 合主继电器 K1、断 K2，无冲击全功率输出</text>
  </g>

  
  <g font-size="12" text-anchor="middle">
    <rect x="60" y="352" width="230" height="26" class="panel stroke-panel" />
    <text x="175" y="369" class="small">① 全断开</text>
    <rect x="290" y="352" width="250" height="26" class="fill-boxy stroke-y" />
    <text x="415" y="369" class="gold">② 预充（约几百 ms）</text>
    <rect x="540" y="352" width="200" height="26" class="fill-boxg stroke-g" />
    <text x="640" y="369" class="ok">③ 主继电器闭合</text>
  </g>
  <text x="400" y="410" text-anchor="middle" font-size="13" class="small">预充失败判据：超时母线电压上不来 → 外部短路，禁止合主继电器</text>
</svg>