<path d="M392 86 Q390.86 361.00 392 636" fill="none" stroke="#c9bb9d" stroke-width="1" stroke-dasharray="6,5"/>
<rect x="70" y="106" width="220" height="40" rx="6" fill="#f6eedb" stroke="#a8321f" stroke-width="1.6"/>
<text x="180" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#a8321f">8kV 浪涌 · IEC 脉冲</text>
