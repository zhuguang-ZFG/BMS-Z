</style><rect class="bg" x="0" y="-156" width="800" height="690" /><text class="title" x="24" y="-128">绝缘检测：电桥两次投切，解出 R_iso 两侧</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 绝缘检测：电桥两次投切，解出 R_iso 两侧<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 400V（示例）<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 正常：两侧都是兆欧级，漏电流 ≈ 0<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="478" width="752" height="44" rx="6" /><text class="small" x="40" y="506">示例：400 V / 100 kΩ = 4 mA。示意。</text><rect width="800" height="470" class="bg" />
  <rect x="100" y="140" width="160" height="160" rx="8" stroke-width="2" class="fill-boxg stroke-g" />
  <text x="180" y="215" text-anchor="middle" font-size="13" font-weight="bold" class="ok">电池包</text>
  <text x="180" y="237" text-anchor="middle" font-size="12" class="ok">400V（示例）</text>
  <line x1="260" y1="160" x2="330" y2="160" stroke-width="4" class="stroke-r" />
  <line x1="260" y1="280" x2="330" y2="280" stroke-width="4" class="stroke-b" />
  <text x="252" y="150" text-anchor="middle" font-size="12" class="warn">B+</text>
  <text x="252" y="296" text-anchor="middle" font-size="12" class="hi">B-</text>

  
  <line x1="540" y1="120" x2="540" y2="340" stroke-width="2.5" class="stroke-axis" />
  <line x1="525" y1="340" x2="555" y2="340" stroke-width="2.5" class="stroke-axis" />
  <line x1="530" y1="347" x2="550" y2="347" stroke-width="2.5" class="stroke-axis" />
  <line x1="535" y1="354" x2="545" y2="354" stroke-width="2.5" class="stroke-axis" />
  <text x="570" y="345" text-anchor="start" font-size="12" class="small">机壳</text>

  
  <line x1="330" y1="160" x2="430" y2="160" stroke-width="1.5" stroke-dasharray="4 3" class="stroke-axis" />
  <rect x="430" y="148" width="70" height="24" fill="none" stroke-width="1.5" stroke-dasharray="4 3" class="stroke-g" />
  <line x1="500" y1="160" x2="540" y2="160" stroke-width="1.5" stroke-dasharray="4 3" class="stroke-axis" />
  <text x="465" y="142" text-anchor="middle" font-size="12" class="ok">R_iso+</text>
  <line x1="330" y1="280" x2="430" y2="280" stroke-width="1.5" stroke-dasharray="4 3" class="stroke-axis" />
  <rect x="430" y="268" width="70" height="24" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 3" class="stroke-g">
    <animate attributeName="stroke" values="#34d399;#34d399;#f87171;#f87171" keyTimes="0;0.2;0.24;1" dur="12s" repeatCount="indefinite" />
  </rect>
  <line x1="500" y1="280" x2="540" y2="280" stroke-width="1.5" stroke-dasharray="4 3" class="stroke-axis" />
  <g class="lt">
    <text x="465" y="262" text-anchor="middle" font-size="12" fill="#1a7f37">R_iso−
      <animate attributeName="fill" values="#1a7f37;#1a7f37;#cf222e;#cf222e" keyTimes="0;0.2;0.24;1" dur="12s" repeatCount="indefinite" />
    </text>
  </g>
  <g class="dk">
    <text x="465" y="262" text-anchor="middle" font-size="12" fill="#3fb950">R_iso−
      <animate attributeName="fill" values="#3fb950;#3fb950;#ff7b72;#ff7b72" keyTimes="0;0.2;0.24;1" dur="12s" repeatCount="indefinite" />
    </text>
  </g>

  
  <text x="400" y="110" text-anchor="middle" font-size="12" opacity="0" class="ok">正常：两侧都是兆欧级，漏电流 ≈ 0
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.17;0.21;1" dur="12s" repeatCount="indefinite" />
  </text>
  <text x="410" y="320" text-anchor="end" font-size="12" opacity="0" class="warn">受潮/破皮：R_iso− 掉到 100kΩ（示例）
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.22;0.26;0.62;0.66;1" dur="12s" repeatCount="indefinite" />
  </text>
  <text x="410" y="338" text-anchor="end" font-size="12" opacity="0" class="warn">单侧下降 → 整包对地电位偏移，只测一侧会漏判
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.26;0.3;0.62;0.66;1" dur="12s" repeatCount="indefinite" />
  </text>

  
  <line x1="330" y1="160" x2="330" y2="196" stroke-width="2" class="stroke-axis" />
  <rect x="400" y="186" width="60" height="20" stroke-width="1.5" class="fill-boxy stroke-y" />
  <text x="430" y="201" text-anchor="middle" font-size="12" class="gold">R0 已知</text>
  <line x1="460" y1="196" x2="540" y2="196" stroke-width="2" class="stroke-axis" />
  <line x1="330" y1="196" x2="352" y2="196" stroke-width="2" class="stroke-axis" />
  <line x1="378" y1="196" x2="400" y2="196" stroke-width="2" class="stroke-axis" />
  <line x1="352" y1="196" x2="378" y2="196" stroke-width="2.5" opacity="0" class="stroke-g">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.44;0.47;0.62;0.65;1" dur="12s" repeatCount="indefinite" />
  </line>
  <line x1="352" y1="196" x2="376" y2="186" stroke-width="2.5" opacity="0" class="stroke-r">
    <animate attributeName="opacity" values="0;0;1;1;0;0;1;1" keyTimes="0;0.4;0.42;0.44;0.47;0.62;0.65;1" dur="12s" repeatCount="indefinite" />
  </line>
  <text x="352" y="178" text-anchor="middle" font-size="12" opacity="0" class="small">S1
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4;0.43;0.62;0.66;1" dur="12s" repeatCount="indefinite" />
  </text>

  <line x1="330" y1="280" x2="330" y2="244" stroke-width="2" class="stroke-axis" />
  <rect x="400" y="234" width="60" height="20" stroke-width="1.5" class="fill-boxy stroke-y" />
  <text x="430" y="249" text-anchor="middle" font-size="12" class="gold">R0 已知</text>
  <line x1="460" y1="244" x2="540" y2="244" stroke-width="2" class="stroke-axis" />
  <line x1="330" y1="244" x2="352" y2="244" stroke-width="2" class="stroke-axis" />
  <line x1="378" y1="244" x2="400" y2="244" stroke-width="2" class="stroke-axis" />
  <line x1="352" y1="244" x2="378" y2="244" stroke-width="2.5" opacity="0" class="stroke-g">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.67;0.7;0.82;0.85;1" dur="12s" repeatCount="indefinite" />
  </line>
  <line x1="352" y1="244" x2="376" y2="234" stroke-width="2.5" opacity="0" class="stroke-r">
    <animate attributeName="opacity" values="0;0;1;1;0;0;1;1" keyTimes="0;0.63;0.65;0.67;0.7;0.82;0.85;1" dur="12s" repeatCount="indefinite" />
  </line>
  <text x="352" y="228" text-anchor="middle" font-size="12" opacity="0" class="small">S2
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.63;0.66;0.82;0.86;1" dur="12s" repeatCount="indefinite" />
  </text>

  
  <line x1="330" y1="160" x2="330" y2="120" stroke-width="1.5" stroke-dasharray="4 3" class="stroke-panel" />
  <line x1="330" y1="120" x2="600" y2="120" stroke-width="1.5" stroke-dasharray="4 3" class="stroke-panel" />
  <rect x="600" y="98" width="150" height="66" rx="8" stroke-width="1.5" class="panel stroke-axis" />
  <text x="675" y="116" text-anchor="middle" font-size="12" class="small">电压读数</text>
  <text x="675" y="136" text-anchor="middle" font-size="12" font-weight="bold" opacity="0" class="hi">U1 = 218V（示例）
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.46;0.5;0.66;0.7;1" dur="12s" repeatCount="indefinite" />
  </text>
  <text x="675" y="154" text-anchor="middle" font-size="12" font-weight="bold" opacity="0" class="hi">U2 = 174V（示例）
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7;0.74;1" dur="12s" repeatCount="indefinite" />
  </text>

  
  <rect x="200" y="362" width="400" height="30" rx="6" stroke-width="1.5" opacity="0" class="fill-boxb stroke-b">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.72;0.76;0.84;0.87;1" dur="12s" repeatCount="indefinite" />
  </rect>
  <text x="400" y="381" text-anchor="middle" font-size="12" opacity="0" class="hi">U1、U2 两组方程联立 → 解出 R_iso+ 与 R_iso−
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.72;0.76;0.84;0.87;1" dur="12s" repeatCount="indefinite" />
  </text>
  <rect x="200" y="400" width="400" height="30" rx="6" stroke-width="1.5" opacity="0" class="fill-boxy stroke-y">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.86;0.9;1" dur="12s" repeatCount="indefinite" />
  </rect>
  <text x="400" y="419" text-anchor="middle" font-size="12" opacity="0" class="gold">低于标准门限（Ω/V 量级，示例）→ 报警并限制上高压
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.86;0.9;1" dur="12s" repeatCount="indefinite" />
  </text>

  <circle r="6" cx="330" cy="160" class="fill-y">
    <animate attributeName="cx" values="330;465;540;330;330" keyTimes="0;0.2;0.4;0.7;1" dur="12s" repeatCount="indefinite" />
    <animate attributeName="cy" values="160;160;160;280;280" keyTimes="0;0.2;0.4;0.7;1" dur="12s" repeatCount="indefinite" />
  </circle>
  <text x="100" y="96" font-size="12" class="gold">示例：400 V / 100 kΩ = 4 mA</text>
  <text x="400" y="452" text-anchor="middle" font-size="13" class="small">关键：只测一侧会漏判；两次投切换来两个方程，解出两侧绝缘。</text>
</svg>