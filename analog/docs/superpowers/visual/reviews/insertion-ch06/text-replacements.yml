changes:
- id: ch06-741-four-blocks
  source: docs/p1-07-ch6.md#6.1
  before: '**② 中间增益级**：共射放大提供主要电压增益，741 约 200,000 倍开环。**密勒补偿电容**（741 内部 30pF）把主极点压到低频，保证稳定。代价是压摆率被限制，741
    仅 0.5V/µs。'
  after: '**② 中间增益级**：提供主要电压增益。补偿电容降低高频环路增益，以带宽和大信号速度换取稳定余量。'
  caption: 三个信号级共同完成放大，偏置网络从旁供给工作电流；方框用于理解主要约束。
  removed_prose_chars: 47
  relationship: replaces-text
- id: ch06-bias-balance
  source: docs/p1-07-ch6.md#6.3
  before: '**平衡电阻法：把偏流误差对消掉**：反相/同相放大里，两输入端的外接直流电阻若相等，$I_B$ 在两端产生等量压降、在差分输入上互相抵消。只剩 $I_{OS}$（两路偏流之差，小一个量级）起作用。做法：同相端串
    $R_3=R_1\parallel R_2$。适用边界：偏流随温度漂，对消只在窄温区有效；$R_3$ 自身贡献热噪声与失调，通常只在 BJT 输入、源阻抗几十 kΩ 以上才值得装。FET 输入运放偏流
    pA 级，直接选型比凑电阻干净。'
  after: '**平衡电阻法**：直流源置零后，使两输入端看见的等效电阻相同。相关偏流造成的压降可抵消；残余由失调电流、阻值误差和温度跟踪决定。$R_3=R_1\parallel R_2$ 只是无额外源阻的常见情况，新增电阻还会带来热噪声。'
  caption: 偏置电流的账，先看源阻抗。20nA 流过 1kΩ 只有 20µV；流过 100kΩ 就是 2mV
  removed_prose_chars: 101
  relationship: replaces-text
- id: ch06-slew-vs-gbw
  source: docs/p1-07-ch6.md#6.7
  before: '**算一笔**：741 爬 1V 要 $1V ÷ 0.5V/µs = 2µs$。更狠的推论——**全功率带宽** $f_{max}=\dfrac{SR}{2\pi V_p}$：输出
    10Vpp 正弦（$V_p$=5V）只有 $\frac{0.5}{2\pi\times 5}≈16kHz$！GBW=1MHz 的小信号带宽看着宽，大信号 16kHz 就三角波化。**音频功率级选运放先看
    SR，算的就是这笔账**；对比：NE5532 SR=9V/µs，全功率带宽 ≈286kHz。'
  after: '**正弦另有斜率限制**：全功率带宽 $f_{max}=SR/(2\pi V_p)$。以 10Vpp（$V_p=5V$）比较典型 SR，0.5V/µs 对应约 16kHz，9V/µs
    对应约 286kHz；前者常用于 741 教学，后者是 NE5532 的常见典型例子。它们不代表实际可用闭环带宽，仍要核对噪声增益、供电、负载和失真要求。'
  caption: 限速一阶响应的连续交接。图中数值与工作条件一起使用。
  removed_prose_chars: 62
  relationship: replaces-text
- id: ch06-compensation-v2
  source: docs/p1-07-ch6.md#6.1
  before: '**密勒补偿的三笔账一口气算。** 补偿电容 $C_c$ 跨在中间级两端，密勒效应把它放大 $A_2$ 倍出现在主极点处，$f_{p}\approx\dfrac{1}{2\pi R
    A_2 C_c}$。'
  after: '**补偿的三项约束。** 简化两级模型中，跨接中间级的 $C_c$ 通过密勒效应降低主极点，近似 $f_p\approx1/(2\pi R A_2 C_c)$。以 $A_0=200000$、GBW=1MHz
    的单主极点教学模型算，$f_p\approx5Hz$，不是把 10Hz、20 万倍和 1MHz 同时当作精确值。主极点后约 −20dB/十倍频滚降，但其他极点、零点和负载仍会改变相位裕度。'
  caption: 补偿电容同时约束带宽与斜率。固定跨导与可用充电电流；简化两级模型，不代表任意运放。
  removed_prose_chars: -91
  relationship: replaces-text
- id: ch06-dc-error-v2
  source: docs/p1-07-ch6.md#6.2
  before: '**误差预算先算再测**：跟随器的直流误差三笔账：$V_{OS}$ 典型 3mV 原样出现在输出；$I_B$（20nA 典型）流过信号源内阻，1kΩ 源内阻只贡献 20µV，可忽略，100kΩ
    就要 2mV；加上温漂与电阻失配。合计输出误差 5mV 量级，对 1V 信号是 0.5%——这不是"没调好"，是这颗料的物理，升级型号才是出路。'
  after: '**误差预算先定符号**：示意 $V_{OS}=+3mV$，20nA 偏流流入正端。1kΩ 源阻产生 −20µV，100kΩ 产生 −2mV。跟随器若 $A_{OL}=100000$，1V
    信号还有约 −10µV 有限增益误差；本例会部分抵消，不能说每颗 LM358 必有 5mV 误差。最坏预算则用失调、偏流和温漂的保证界限相加，正负号未知时不依赖抵消。经典 LM358 的 PNP
    输入偏流方向须查其手册；此图方向只是便于演算的约定。'
  caption: 跟随器误差先定符号再相加。示意 Vos 为正、偏流流入正端；典型幅值不是误差保证。
  removed_prose_chars: -45
  relationship: replaces-text
- id: ch06-bias-balance-v2
  source: docs/p1-07-ch6.md#6.3
  before: '**平衡电阻法：把偏流误差对消掉**：两输入端外接直流电阻取相等（$R_3=R_1\parallel R_2$），$I_B$ 压降对消、只剩小一个量级的 $I_{OS}$（下图）。边界：对消只在窄温区有效；$R_3$
    自身贡献热噪声与失调，通常只在 BJT 输入、源阻抗几十 kΩ 以上才值得装，FET 输入高阻源直接选型更干净。'
  after: 反相结构令 Rin=10kΩ、Rf=90kΩ，噪声增益为 10。正端直接接地时，负端 20nA 造成 +1.8mV；正端串 9kΩ 且偏流相等时相抵。若正端变为 22nA、负端仍为 20nA，输出残余
    −0.18mV。电流符号反过来，误差也随之反向。
  caption: 平衡电阻抵消的是相关偏流。电流流入输入端为正；Rin 10 kΩ、Rf 90 kΩ、噪声增益 10。
  removed_prose_chars: 41
  relationship: replaces-text
- id: ch06-speed-envelope-v2
  source: docs/p1-07-ch6.md#6.3
  before: '**算一笔**（默认参数：增益 100、信号 10kHz、输出 10Vpp、GBW 0.7MHz、SR 0.5V/µs）：闭环带宽 $0.7\text{MHz}/100=7\text{kHz}$，10kHz
    处实际闭环增益只剩 $100/\sqrt{1+(10/7)^2}\approx57$（比标称少约 4.9dB）。按选型公式要 $100\times10\text{kHz}\times10=10\text{MHz}$，LM358
    差 14 倍。大信号另算满功率带宽 $f_{max}=SR/(2\pi V_p)=0.5\text{V/µs}/(2\pi\times5\text{V})\approx15.9\text{kHz}$——10kHz
    正弦还没被压摆率削平，20kHz 就开始变三角。**小信号先输、大信号险过，两个判据必须分开判。**'
  after: '**算一笔独立教学参数**：GBW=0.7MHz、噪声增益 100、SR=0.5V/µs，不是经典 LM358 的整组规格。单极点闭环带宽 7kHz，10kHz 增益 $100/\sqrt{1+(10/7)^2}\approx57.35$，低了约
    4.83dB。若要求输出 10Vpp（5V 峰值），斜率界为 $SR/(2\pi V_p)\approx15.9kHz$；这是另一个约束，不表示幅频衰减自动消失。按十倍带宽裕量选需 10MHz，约为
    0.7MHz 的 14.3 倍。实际还要有足够供电与带载摆幅。'
  caption: 小信号幅频与大信号斜率分别核算。独立教学参数 GBW 0.7 MHz、NG 100、SR 0.5 V/µs、Vp 5 V。
  removed_prose_chars: 119
  relationship: replaces-text
- id: ch06-rejection-v2
  source: docs/p1-07-ch6.md#6.3
  before: '**CMRR 是随频率掉价的资产**：直流下 80~100dB，从几百 Hz 起每十倍频掉 20dB。10kHz 时 LM358 只剩约 40dB，共模摆 1V 就漏出 10mV 到输出。更隐蔽的是跟随器最伤：它的共模摆幅等于信号摆幅本身，有限
    CMRR 引入的是二阶失真，信号越干净、越先听见这个失真。这也是仪用放大器把共模处理放在前级的理由：前级以高增益把差模拉开，共模误差只在后级按低增益折算。'
  after: '**按扰动频率核算**：示意在 10kHz 处 CMRR=40dB，1V 共模扰动先折算为 10mV 输入误差。另设 PSRR=40dB，50mV 电源纹波折算为 0.5mV。再乘该频率的噪声增益；NG=1
    时输出才分别为 10mV、0.5mV，NG=10 时是 100mV、5mV。不能遗漏这一步，也不能把线性 CMRR 有限直接判作某一阶谐波失真。'
  caption: 抑制比先折算输入误差，再乘噪声增益。扰动频率处 CMRR、PSRR 均示意为 40 dB；先核对手册定义。
  removed_prose_chars: 24
  relationship: replaces-text
- id: ch06-noise-bandwidth-v2
  source: docs/p1-07-ch6.md#6.3
  before: '**噪声算一笔：电阻常常比运放吵**：LM358 的 40nV/√Hz 在 20kHz 带宽内积分：$40n\times\sqrt{20000}\approx5.7\mu V$（RMS）。但
    1MΩ 反馈电阻自己的热噪声是 $\sqrt{4kTR}=$128nV/√Hz，同带宽积分约 18µV——电阻贡献是运放的三倍多。这给出增益电阻取值区间的第三个理由（前两个是偏流误差与功耗）。反馈网络等效阻值宜在
    1k~100kΩ，太大噪声接管，太小驱动吃力。低频测量还要躲开 1/f 区。手册噪声曲线在转折频率以下上翘，窄带直流测量的总噪声要按曲线分段积分，不能拿宽带密度直接乘 √BW。'
  after: '**积分用实际传递函数**：只算 40nV/√Hz 白电压噪声，矩形带宽 20kHz 得 $40n\sqrt{20000}=5.66\mu V_{RMS}$。一阶低通的等效噪声带宽为
    $\mathrm{ENBW}=\pi f_c/2$；同为 −3dB 截止 20kHz，ENBW 约 31.42kHz，结果是 7.09µV。图中累积功率来自 $\int_0^F |H(f)|^2df=f_c\arctan(F/f_c)$，高频尾部仍贡献噪声。'
  caption: 噪声积分不能把截止频率当砖墙。仅算 40 nV/√Hz 白电压噪声；另计 1/f、电流噪声与电阻。
  removed_prose_chars: 72
  relationship: replaces-text
- id: ch06-settling-v2
  source: docs/p1-07-ch6.md#6.7
  before: '上图把大信号实线和"只受 GBW 限制"的灰色虚线画在一起。**2µs 的直线爬坡**把总建立时间

    从约 1.1µs 拖到 **2.6µs**。所以 ADC 多路切换前端要挑**大信号压摆率**够快的运放，

    光看 GBW=1MHz 会严重乐观。'
  after: '**两段怎样交接**：用 $dy/dt=\min[SR,(1-y)/\tau]$，其中 $\tau=1/(2\pi f_{cl})=0.159\mu s$。斜坡与指数的导数相等时，剩余误差
    $e_1=SR\tau=0.0796V$，输出约 0.9204V，交接时刻 $t_1=(1-e_1)/SR=1.841\mu s$。之后 $e(t)=e_1\exp[-(t-t_1)/\tau]$，不能先爬完整
    2µs 再重新加一段完整指数响应。'
  caption: 压摆斜坡与指数尾部必须连续交接。1 V 阶跃；一阶闭环极点 1 MHz、SR 0.5 V/µs，不含过冲。
  removed_prose_chars: -97
  relationship: replaces-text
