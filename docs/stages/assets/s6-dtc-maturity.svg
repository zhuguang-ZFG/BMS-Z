<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="s6-dtc-t s6-dtc-d">
  <title id="s6-dtc-t">一个毛刺，怎么变成一条确诊</title>
  <desc id="s6-dtc-d">触发条件成立后，去抖计数器一格一格走，走满才进入确诊并上报；条件消失后恢复计数器还要倒数完才回到正常。只走一格就掉回来的毛刺会被清回，什么也不报。锁存的那条分支不跟着条件消失自动好，只能手动清。</desc>
  <defs>
    <marker id="ar-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path class="head-teal" d="M0 0L9 4.5L0 9Z"/>
    </marker>
    <style>
      text { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #293b3a; }
      .title { font-size: 20px; font-weight: 700; }
      .h { font-size: 15px; font-weight: 700; fill: #293b3a; }
      .body { font-size: 13px; fill: #293b3a; }
      .small { font-size: 12px; fill: #626d65; }
      .accent { fill: #176b73; }
      .green { fill: #377b60; }
      .red { fill: #b84745; }
      .gold { fill: #926717; }
      .card { fill: #fffdf5; stroke: #968d77; stroke-width: 1.4; }
      .note { fill: #e4f0df; stroke: #377b60; stroke-width: 1.2; }
      .strip { fill: #e4f0df; stroke: #377b60; stroke-width: 1.4; }
      .warn { fill: #fbefc7; stroke: #926717; stroke-width: 1.4; }
      .danger { fill: #f6e2df; stroke: #b84745; stroke-width: 1.4; }
      .panel { fill: none; stroke: #968d77; stroke-width: 1.4; stroke-dasharray: 7 5; }
      .leader { stroke: #626d65; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
      .wire { stroke: #293b3a; stroke-width: 2; fill: none; }
      .flow { stroke: #176b73; stroke-width: 2; fill: none; }
      .load { stroke: #926717; stroke-width: 2; fill: none; }
      .leak { stroke: #b84745; stroke-width: 2; fill: none; }
      .ok { stroke: #377b60; stroke-width: 2.4; fill: none; }
      .dot { fill: #176b73; }
      .bolt { fill: #b84745; }
      .strike { stroke: #176b73; stroke-width: 2; fill: none; }
      .head-teal { fill: #176b73; }
      .head-gold { fill: #926717; }
      .head-red { fill: #b84745; }
      @media (prefers-color-scheme: dark) {
        text { fill: #edf0e5; }
        .title { fill: #edf0e5; }
        .h { fill: #edf0e5; }
        .body { fill: #edf0e5; }
        .small { fill: #b0beb3; }
        .accent { fill: #7ec5c5; }
        .green { fill: #8fc7a2; }
        .red { fill: #f39b91; }
        .gold { fill: #dfbd78; }
        .card { fill: #223333; stroke: #71908c; }
        .note { fill: #293f35; stroke: #8fc7a2; }
        .strip { fill: #293f35; stroke: #8fc7a2; }
        .warn { fill: #453e2b; stroke: #dfbd78; }
        .danger { fill: #483336; stroke: #f39b91; }
        .panel { stroke: #71908c; }
        .leader { stroke: #b0beb3; }
        .wire { stroke: #edf0e5; }
        .flow { stroke: #7ec5c5; }
        .load { stroke: #dfbd78; }
        .leak { stroke: #f39b91; }
        .ok { stroke: #8fc7a2; }
        .dot { fill: #7ec5c5; }
        .bolt { fill: #f39b91; }
        .strike { stroke: #7ec5c5; }
        .head-teal { fill: #7ec5c5; }
        .head-gold { fill: #dfbd78; }
        .head-red { fill: #f39b91; }
      }
    </style>
  </defs>

  <text x="480" y="38" text-anchor="middle" class="title">一个毛刺，怎么变成一条确诊</text>
  <text x="480" y="64" text-anchor="middle" class="small">计数器走满才算数，条件消失还要倒数回来</text>

  <rect class="warn" x="376" y="92" width="240" height="48" rx="9"/>
  <text x="390" y="122" class="h gold">锁存：只能手动清</text>
  <path d="M496 168V144" class="leader" marker-end="url(#ar-teal)"/>

  <rect class="card" x="40" y="170" width="160" height="100" rx="9"/>
  <text x="54" y="200" class="h">触发条件</text>
  <text x="54" y="226" class="small">越线、超时</text>
  <text x="54" y="250" class="small">或一次短路</text>

  <text x="216" y="192" class="small">去抖计数</text>
  <text x="216" y="258" class="small">走满才算</text>
  <rect class="bolt" x="216" y="206" width="24" height="32" rx="3"/>
  <rect class="bolt" x="248" y="206" width="24" height="32" rx="3"/>
  <rect class="card" x="280" y="206" width="24" height="32" rx="3"/>
  <rect class="card" x="312" y="206" width="24" height="32" rx="3"/>

  <path d="M344 222H368" class="flow" marker-end="url(#ar-teal)"/>

  <rect class="card" x="376" y="170" width="240" height="100" rx="9"/>
  <text x="390" y="200" class="h red">确诊</text>
  <text x="390" y="226" class="small">带上等级</text>
  <text x="390" y="250" class="small">DTC 上报</text>

  <text x="620" y="248" class="small">条件消失</text>
  <path d="M616 222H656" class="flow" marker-end="url(#ar-teal)"/>

  <text x="660" y="192" class="small">恢复计数</text>
  <text x="660" y="258" class="small">倒数完才回</text>
  <rect class="bolt" x="660" y="206" width="24" height="32" rx="3"/>
  <rect class="card" x="692" y="206" width="24" height="32" rx="3"/>
  <rect class="card" x="724" y="206" width="24" height="32" rx="3"/>
  <rect class="card" x="756" y="206" width="24" height="32" rx="3"/>

  <path d="M784 222H808" class="flow" marker-end="url(#ar-teal)"/>
  <rect class="card" x="816" y="170" width="108" height="100" rx="9"/>
  <text x="830" y="200" class="h green">正常</text>
  <text x="830" y="226" class="small">重新可报</text>

  <rect class="card" x="40" y="336" width="300" height="56" rx="9"/>
  <text x="54" y="362" class="h red">毛刺走一格就退回</text>
  <text x="54" y="384" class="small">计数器清回，什么也不报</text>

  <rect class="note" x="360" y="336" width="560" height="56" rx="9"/>
  <text x="376" y="362" class="h green">五要素：触发条件、去抖、等级、恢复条件、是否锁存</text>
  <text x="376" y="384" class="small">缺一条，报出来的故障就说不清</text>

  <rect class="strip" x="40" y="424" width="880" height="44" rx="12"/>
  <text x="480" y="452" text-anchor="middle" class="h green">毛刺不进确诊，条件消失还要倒数回来</text>

  <text x="480" y="500" text-anchor="middle" class="small">计数长度与确认时间按产品定，这张图只画三段的先后</text>
</svg>
