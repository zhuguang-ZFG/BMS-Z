<path d="M80 38 c 160 3.4 384 -2.6 640 0.4" fill="none" stroke="#a4630f" stroke-width="2.1" stroke-linecap="round" opacity="0.5"/>
<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">负反馈增益六步推导：从 Vout = A·Vd 到 Af ≈ 1/β</text>
<path d="M392 86 Q390.86 361.00 392 636" fill="none" stroke="#c9bb9d" stroke-width="1" stroke-dasharray="6,5"/>
<text x="196" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#37424e">反馈环：把输出的样本「还」回输入端</text>
<text x="40" y="222" font-size="11.5" font-weight="bold" fill="#a4630f">Vs</text>
<path d="M56 230 Q75.00 230.04 94 230" fill="none" stroke="#37424e" stroke-width="2.5"/>
<polygon points="88,224 98,230 88,236" fill="#37424e"/>
<circle cx="112" cy="230" r="14" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<text x="112" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#37424e">Σ</text>
<text x="98" y="222" font-size="11" fill="#3d6b4a">+</text>
<text x="98" y="248" font-size="11" fill="#a8321f">−</text>
<rect x="176" y="196" width="112" height="68" rx="9" fill="#e6eff3" stroke="#1f5d7a" stroke-width="1.8"/>
<text x="232" y="226" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f5d7a">A</text>
<text x="232" y="246" text-anchor="middle" font-size="10" fill="#5b666f">开环增益</text>
<path d="M126 230 Q148.00 229.85 170 230" fill="none" stroke="#37424e" stroke-width="2.5"/>
<polygon points="164,224 174,230 164,236" fill="#37424e"/>
<path d="M288 230 Q320.00 229.75 352 230" fill="none" stroke="#37424e" stroke-width="2.5"/>
<polygon points="346,224 356,230 346,236" fill="#37424e"/>
<text x="362" y="234" font-size="11.5" font-weight="bold" fill="#a8321f">Vout</text>
<rect x="204" y="312" width="56" height="34" rx="7" fill="#f7eedb" stroke="#a4630f" stroke-width="1.6"/>
<text x="232" y="335" text-anchor="middle" font-size="13" font-weight="bold" fill="#a4630f">β</text>
<rect x="69" y="374" width="254" height="24" rx="6" fill="#f6eedb" stroke="#3d6b4a" stroke-width="1"/><text x="196" y="390" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3d6b4a">Aβ 越深，输出越听 β 的话、越不听 A 的话</text>
<path d="M352 230 Q366.00 229.97 380 230" fill="none" stroke="#a8321f" stroke-width="2.2" stroke-dasharray="5,3"/><path d="M352 230 Q351.59 280.00 352 330" fill="none" stroke="#a4630f" stroke-width="2"/>
<path d="M352 330 Q320.00 329.86 288 330" fill="none" stroke="#a4630f" stroke-width="2"/>
<path d="M176 330 Q144.00 329.77 112 330" fill="none" stroke="#a4630f" stroke-width="2"/>
<path d="M112 330 Q111.88 288.00 112 246" fill="none" stroke="#a4630f" stroke-width="2"/>
<polygon points="106,252 112,242 118,252" fill="#a4630f"/><text x="264" y="404" text-anchor="middle" font-size="10.5" fill="#5b666f">β 越小 → 反馈越浅 → 增益留得越多</text><rect x="72" y="418" width="79" height="24" rx="6" fill="#f6eedb" stroke="#1f5d7a" stroke-width="1"/><text x="112" y="434" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1f5d7a">Af ≈ 1/β</text>
<rect x="74" y="442" width="77" height="22" rx="6" fill="#f6eedb" stroke="#5b666f" stroke-width="1"/><text x="112" y="456" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#5b666f">教科书答案</text><rect x="400" y="110" width="352" height="58" rx="7" fill="none" stroke="#a4630f" stroke-width="1.8" opacity="0.9"><animate attributeName="y" values="134;192;250;308;366;424;424" keyTimes="0;0.166667;0.333333;0.5;0.666667;0.833333;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/></rect>
<text x="412" y="134" font-size="11.5" font-weight="bold" fill="#a4630f">① 开环：先不带反馈</text><text x="412" y="159" font-size="14.5" font-weight="bold" fill="#16202b">Vout = A · Vd</text><text x="412" y="176" font-size="10.5" fill="#5b666f">Vd 是放大器的净输入</text>
<text x="412" y="192" font-size="11.5" font-weight="bold" fill="#a4630f">② 输出被采样回来</text><text x="412" y="217" font-size="14.5" font-weight="bold" fill="#16202b">Vfb = β · Vout</text><text x="412" y="234" font-size="10.5" fill="#5b666f">β 就是电阻分压比</text><rect x="400" y="168" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.166667;0.196667;1" dur="16s" repeatCount="indefinite"/></rect>
<text x="412" y="250" font-size="11.5" font-weight="bold" fill="#a4630f">③ 净输入被减掉一截</text><text x="412" y="275" font-size="14.5" font-weight="bold" fill="#16202b">Vd = Vs − Vfb</text><text x="412" y="292" font-size="10.5" fill="#5b666f">负反馈与输入「对着干」</text><rect x="400" y="226" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.333333;0.363333;1" dur="16s" repeatCount="indefinite"/></rect>
<text x="412" y="308" font-size="11.5" font-weight="bold" fill="#a4630f">④ 联立</text><text x="412" y="333" font-size="14.5" font-weight="bold" fill="#16202b">Vout = A · (Vs − β·Vout)</text><text x="412" y="350" font-size="10.5" fill="#5b666f">把②③代进①</text><rect x="400" y="284" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.5;0.53;1" dur="16s" repeatCount="indefinite"/></rect>
<text x="412" y="366" font-size="11.5" font-weight="bold" fill="#a4630f">⑤ 移项求商</text><text x="412" y="391" font-size="14.5" font-weight="bold" fill="#16202b">Af = A / (1 + Aβ)</text><text x="412" y="408" font-size="10.5" fill="#5b666f">闭环增益：分母帮了一个忙</text><rect x="400" y="342" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.666667;0.696667;1" dur="16s" repeatCount="indefinite"/></rect>
<text x="412" y="424" font-size="11.5" font-weight="bold" fill="#a4630f">⑥ 深反馈极限</text><text x="412" y="449" font-size="14.5" font-weight="bold" fill="#16202b">Aβ ≫ 1 → Af ≈ 1 / β</text><text x="412" y="466" font-size="10.5" fill="#5b666f">增益只由电阻比决定，与 A 无关</text><rect x="400" y="400" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.833333;0.863333;1" dur="16s" repeatCount="indefinite"/></rect>
<g><rect x="30" y="612" width="740" height="34.0" rx="9" fill="#e8efe6" stroke="#3d6b4a" stroke-width="1.5" filter="url(#soft)"/><rect x="36" y="619" width="3" height="20.0" rx="1.5" fill="#3d6b4a"/><text x="400" y="634.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3d6b4a">闭环增益不靠管子精度，靠电阻比——这就是负反馈能让电路「不挑元件」的原因</text></g></svg>