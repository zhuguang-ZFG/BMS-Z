<text x="600" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b">同一股电流，分配两份电压</text>
<text x="600" y="54" text-anchor="middle" font-size="12.5" fill="#5b666f">约定电流方向示意；运动速度为教学慢放，不表示电子漂移速度</text>
<line x1="180" y1="280" x2="300" y2="280" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="300" y1="280" x2="330" y2="280" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="480" y1="280" x2="510" y2="280" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><rect x="330" y="253" width="150" height="54" fill="#e2d9cf" stroke="#2a2927" stroke-width="4"/><text x="405" y="235" font-size="32" fill="#2a2927" text-anchor="middle">1kΩ</text><line x1="510" y1="280" x2="690" y2="280" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="690" y1="280" x2="720" y2="280" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="870" y1="280" x2="900" y2="280" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><rect x="720" y="253" width="150" height="54" fill="#e2d9cf" stroke="#2a2927" stroke-width="4"/><text x="795" y="235" font-size="32" fill="#2a2927" text-anchor="middle">4kΩ</text><line x1="900" y1="280" x2="1020" y2="280" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="1020" y1="280" x2="1020" y2="600" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="1020" y1="600" x2="180" y2="600" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="180" y1="600" x2="180" y2="460" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="180" y1="280" x2="180" y2="360" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="145" y1="360" x2="215" y2="360" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="160" y1="390" x2="200" y2="390" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="180" y1="390" x2="180" y2="460" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><text x="90" y="425" font-size="32" fill="#2a2927" text-anchor="start">5V</text><text x="220" y="380" font-size="32" fill="#2a2927" text-anchor="start">+</text>
<g data-beat="闭合回路" opacity="0"><path d="M180 600 L180 280 L1020 280 L1020 600 L180 600" pathLength="1" fill="none" stroke="#a4441d" stroke-width="7" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" from="1" to="0" begin="0s" dur="1.6s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/></path><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="0s" dur="0.45s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="2s" dur="0.4s" fill="freeze"/></g>
<g data-beat="同一股电流" opacity="0"><circle r="10" fill="#a4441d"><animateMotion path="M180 600 L180 280 L1020 280 L1020 600 L180 600" begin="2.4s" dur="1.2s" fill="freeze" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.4 0 0.2 1"/></circle><text x="380" y="470" font-size="46" fill="#2a2927" text-anchor="start">I = 1mA</text><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="2s" dur="0.45s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="4s" dur="0.4s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 0" to="0 -4" begin="2s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" keyTimes="0;1"/></g>
<g data-beat="分配电压" opacity="0"><text x="350" y="370" font-size="32" fill="#2a2927" text-anchor="start">1V</text><text x="750" y="370" font-size="32" fill="#2a2927" text-anchor="start">4V</text><rect x="300" y="200" width="600" height="190" rx="8" fill="none" stroke="#a4441d" stroke-width="5" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.3s" dur="0.5s" fill="freeze"/></rect><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="4s" dur="0.45s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="6s" dur="0.4s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 0" to="0 -4" begin="4s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" keyTimes="0;1"/></g>
<g data-beat="回路守恒" opacity="0"><text x="310" y="720" font-size="44" fill="#2a2927" text-anchor="start">1V + 4V = 5V</text><text x="310" y="785" font-size="36" fill="#2a2927" text-anchor="start">每一处电流都是 1mA</text><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="6s" dur="0.45s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 0" to="0 -4" begin="6s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" keyTimes="0;1"/></g>
<rect x="24" y="836" width="1152" height="34" rx="9" fill="#f7eedb" stroke="#c9bb9d" stroke-width="1.2"/>
<g data-caption="闭合回路" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="0s" dur="0.2s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="1.8s" dur="0.2s" fill="freeze"/><text x="600" y="860" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f5d7a">先找闭合路径：电源、两只电阻、回到电源。</text></g>
<g data-caption="同一股电流" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="2s" dur="0.2s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="3.8s" dur="0.2s" fill="freeze"/><text x="600" y="860" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f5d7a">I = 5V / (1kΩ + 4kΩ) = 1mA。</text></g>
<g data-caption="分配电压" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="4s" dur="0.2s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="5.8s" dur="0.2s" fill="freeze"/><text x="600" y="860" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f5d7a">同一股 1mA 电流：1kΩ 留下 1V，4kΩ 留下 4V。</text></g>
<g data-caption="回路守恒" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="6s" dur="0.2s" fill="freeze"/><text x="600" y="860" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f5d7a">回路闭合，电流相同；两段压降相加等于 5V。</text></g>
</svg>
