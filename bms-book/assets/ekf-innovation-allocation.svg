  <path d="M 423.2,222.0 L 324.4,295.0" stroke="#176B73" stroke-width="2" fill="none" marker-end="url(#arrow-default)"/>
  <path d="M 536.8,222.0 L 635.6,295.0" stroke="#176B73" stroke-width="2" fill="none" marker-end="url(#arrow-default)"/>
  <path d="M 331.6,405.0 L 409.5,457.5" stroke="#176B73" stroke-width="2" fill="none" marker-end="url(#arrow-default)"/>
  <path d="M 628.4,405.0 L 550.5,457.5" stroke="#176B73" stroke-width="2" fill="none" marker-end="url(#arrow-default)"/>
  <rect x="290.0" y="138.0" width="380.0" height="84.0" fill="#E6F0EF" stroke="#176B73" stroke-width="2" rx="8"/>
  <text x="480.0" y="175.6" font-size="23" fill="#293B3A" text-anchor="middle" font-weight="bold">第 1 拍新息</text>
  <text x="480.0" y="200.6" font-size="23" fill="#293B3A" text-anchor="middle" font-weight="bold">-0.527 mV</text>
  <rect x="65.0" y="295.0" width="370.0" height="110.0" fill="#E6F0EF" stroke="#176B73" stroke-width="2" rx="8"/>
  <text x="250.0" y="345.6" font-size="23" fill="#293B3A" text-anchor="middle" font-weight="bold">SOC 电压分项</text>
  <text x="250.0" y="370.6" font-size="23" fill="#293B3A" text-anchor="middle" font-weight="bold">C₀K₀ = 88.26%</text>
  <rect x="525.0" y="295.0" width="370.0" height="110.0" fill="#F6F0E1" stroke="#926717" stroke-width="2" rx="8"/>
  <text x="710.0" y="345.6" font-size="23" fill="#293B3A" text-anchor="middle" font-weight="bold">极化电压分项</text>
  <text x="710.0" y="370.6" font-size="23" fill="#293B3A" text-anchor="middle" font-weight="bold">K₁ = -27.04%</text>
  <rect x="220.0" y="457.5" width="520.0" height="95.0" fill="#E6F0EF" stroke="#176B73" stroke-width="2" rx="8"/>
  <text x="480.0" y="500.6" font-size="23" fill="#293B3A" text-anchor="middle" font-weight="bold">线性化总贡献 C·K</text>
  <text x="480.0" y="525.5" font-size="23" fill="#293B3A" text-anchor="middle" font-weight="bold">61.22%</text>
  <text x="36.0" y="49.0" font-size="31" fill="#293B3A" text-anchor="start">88% 和 61%，为什么都算对了？</text>
  <text x="36.0" y="92.0" font-size="23" fill="#293B3A" text-anchor="start">一条电压证据，两个相关状态；先说清你在算哪个分项。</text>
  <text x="36.0" y="607.0" font-size="23" fill="#293B3A" text-anchor="start">正负分项可以抵消。它们不是两个独立概率，也不是精度。</text>
  <text x="36.0" y="647.0" font-size="22" fill="#293B3A" text-anchor="start">只在当前 C 的线性化模型内解释；实际 OCV 曲线仍是非线性的。</text>
</svg>
