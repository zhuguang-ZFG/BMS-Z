<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="an-t an-d">
  <title id="an-t">账本只有走到这三处，才重新对上真值</title>
  <desc id="an-d">安时积分在两次锚点之间只会单向漂走，不会自己回头；满充判据、静置开路电压和下电保存这三处各自把读数拉回真值，但每一处都要先满足自己的条件，条件不够就不许锚。</desc>
  <defs>
    <marker id="arrow-accent" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path class="head-accent" d="M0 0L9 4.5L0 9Z"/>
    </marker>
    <style>
      text { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #293b3a; }
      .title { font-size: 20px; font-weight: 700; fill: #293b3a; }
      .sub { font-size: 12px; fill: #626d65; }
      .h { font-size: 15px; font-weight: 700; fill: #293b3a; }
      .body { font-size: 13px; fill: #293b3a; }
      .small { font-size: 12px; fill: #626d65; }
      .tiny { font-size: 12px; fill: #626d65; }
      .accent { fill: #176b73; }
      .green { fill: #377b60; }
      .red { fill: #b84745; }
      .gold { fill: #926717; }
      .paper { fill: #fffdf5; }
      .card { fill: #fffdf5; stroke: #968d77; stroke-width: 1.4; }
      .card-green { fill: #e4f0df; stroke: #377b60; stroke-width: 1.4; }
      .truth { stroke: #377b60; stroke-width: 1.8; fill: none; stroke-dasharray: 8 5; }
      .est { stroke: #b84745; stroke-width: 2.2; fill: none; }
      .axis { stroke: #968d77; stroke-width: 1.4; fill: none; }
      .guide { stroke: #968d77; stroke-width: 1.2; fill: none; stroke-dasharray: 4 5; }
      .leader { stroke: #968d77; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
      .dot-anchor { fill: #377b60; stroke: #fffdf5; stroke-width: 1.4; }
      .strike { stroke: #176b73; stroke-width: 2; fill: none; }
      .strip { fill: #e4f0df; stroke: #377b60; stroke-width: 1.4; }
      .head-accent { fill: #176b73; }
      @media (prefers-color-scheme: dark) {
        text { fill: #edf0e5; }
        .title { fill: #edf0e5; }
        .sub { fill: #b0beb3; }
        .h { fill: #edf0e5; }
        .body { fill: #edf0e5; }
        .small { fill: #b0beb3; }
        .tiny { fill: #b0beb3; }
        .accent { fill: #7ec5c5; }
        .green { fill: #8fc7a2; }
        .red { fill: #f39b91; }
        .gold { fill: #dfbd78; }
        .paper { fill: #223333; }
        .card { fill: #223333; stroke: #71908c; }
        .card-green { fill: #293f35; stroke: #8fc7a2; }
        .truth { stroke: #8fc7a2; }
        .est { stroke: #f39b91; }
        .axis { stroke: #71908c; }
        .guide { stroke: #71908c; }
        .leader { stroke: #b0beb3; }
        .dot-anchor { fill: #8fc7a2; stroke: #223333; }
        .strike { stroke: #7ec5c5; }
        .strip { fill: #293f35; stroke: #8fc7a2; }
        .head-accent { fill: #7ec5c5; }
      }
    </style>
  </defs>

  <rect class="paper" x="0" y="0" width="960" height="560"/>

  <text x="480" y="32" text-anchor="middle" class="title">账本只有走到这三处，才重新对上真值</text>
  <path d="M330 42C402 40 464 44 536 41" class="strike" opacity=".5"/>
  <text x="480" y="62" text-anchor="middle" class="sub">在锚点之间，它只会越走越偏</text>

  <path class="truth" d="M64 170H900"/>
  <text x="72" y="156" class="tiny green">真值</text>

  <path class="guide" d="M236 132V300"/>
  <path class="guide" d="M518 132V300"/>
  <path class="guide" d="M780 132V300"/>

  <text x="236" y="120" text-anchor="middle" class="h green">满充校准</text>
  <text x="518" y="120" text-anchor="middle" class="h green">静置校准</text>
  <text x="780" y="120" text-anchor="middle" class="h green">下电保存</text>

  <path class="est" d="M76 182L228 250L236 186L510 252L518 186L772 256L780 186L890 232"/>
  <circle cx="236" cy="186" r="5" class="dot-anchor"/>
  <circle cx="518" cy="186" r="5" class="dot-anchor"/>
  <circle cx="780" cy="186" r="5" class="dot-anchor"/>

  <path class="axis" d="M64 268H900"/>
  <text x="896" y="288" text-anchor="end" class="tiny">时间</text>
  <text x="96" y="300" class="small red">估算</text>

  <path class="leader" d="M236 302V324"/>
  <path class="leader" d="M518 302V324"/>
  <path class="leader" d="M780 302V324"/>

  <rect class="card" x="60" y="330" width="280" height="110" rx="9" transform="rotate(-0.4 200 385)"/>
  <text x="200" y="362" text-anchor="middle" class="h">满充判据</text>
  <text x="200" y="390" text-anchor="middle" class="body">电压、电流、时长都到位</text>
  <text x="200" y="414" text-anchor="middle" class="small">才算标满</text>

  <rect class="card" x="345" y="330" width="270" height="110" rx="9" transform="rotate(0.4 480 385)"/>
  <text x="480" y="362" text-anchor="middle" class="h">静置条件</text>
  <text x="480" y="390" text-anchor="middle" class="body">等够，还要挑方向</text>
  <text x="480" y="414" text-anchor="middle" class="small">平台区少信</text>

  <rect class="card" x="630" y="330" width="270" height="110" rx="9" transform="rotate(-0.4 765 385)"/>
  <text x="765" y="362" text-anchor="middle" class="h">保存校验</text>
  <text x="765" y="390" text-anchor="middle" class="body">带校验存住</text>
  <text x="765" y="414" text-anchor="middle" class="small">上电再交叉验证</text>

  <rect class="strip" x="80" y="456" width="800" height="46" rx="12"/>
  <text x="480" y="485" text-anchor="middle" class="h green">条件不满足就不许锚，账本只能继续往下走</text>

  <text x="480" y="532" text-anchor="middle" class="tiny">锚点把读数拉回真值，但不会替你消掉电流零偏</text>
</svg>
