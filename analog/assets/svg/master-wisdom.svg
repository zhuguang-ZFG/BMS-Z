<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="ttl">
<title id="ttl">大师的排故智慧：三份心法，一条军规</title>
<desc>大师的排故智慧：三份心法，一条军规；节拍：① Pease：先量电源——他的维修记录里近一半故障藏在这里；② Williams：测量前预测波形，预测与实测不符处就是理解缺口；③ 共通：慢观察、快假设、严验证——观察→假设→实验→结论；④ 军规：先量电源、预测波形、最小化复现、示波器复核——现场最冷静的人</desc>
