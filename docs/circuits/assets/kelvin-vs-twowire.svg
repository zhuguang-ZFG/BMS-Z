<svg xmlns="http://www.w3.org/2000/svg" width="800" height="680" viewBox="0 -156 800 680" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>开尔文对照示例：100 A、0.5 mΩ 分流器。从本体取电压读到 50 mV；把两侧 0.4 mΩ 引线算进去会读成 90 mV、180 A。示意图。</title>
  <desc>亮点先走对的开尔文接法读到 50 mV，再走从引线取电压的错接法，多出的 40 mV 把电流读成 180 A。</desc><style>
