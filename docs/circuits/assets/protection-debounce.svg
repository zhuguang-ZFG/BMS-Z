<svg xmlns="http://www.w3.org/2000/svg" width="800" height="680" viewBox="0 -156 800 680" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>保护去抖与回差动画</title>
  <desc>保护去抖与回差动画。示意。</desc><style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .fill-boxb { fill: #ddf4ff; }
    .fill-boxg { fill: #dafbe1; }
    .fill-boxr { fill: #ffebe9; }
    .fill-boxy { fill: #fff8c5; }
    .fill-b { fill: #0969da; }
    .fill-g { fill: #1a7f37; }
    .fill-r { fill: #cf222e; }
    .fill-y { fill: #9a6700; }
    .fill-ink { fill: #57606a; }
    .fill-muted { fill: #e2e8f0; }
    .fill-lockb { fill: #0969da; }
    .stroke-panel { stroke: #d0d7de; }
    .stroke-axis { stroke: #57606a; }
    .stroke-b { stroke: #0969da; }
    .stroke-g { stroke: #1a7f37; }
    .stroke-r { stroke: #cf222e; }
    .stroke-y { stroke: #bf8700; }
    .stroke-check { stroke: #ffffff; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .on { fill: #ffffff; font-size: 13px; font-weight: bold; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .fill-boxb { fill: #12233a; }
      .fill-boxg { fill: #0f2415; }
      .fill-boxr { fill: #3d1214; }
      .fill-boxy { fill: #2d2607; }
      .fill-b { fill: #4493f8; }
      .fill-g { fill: #3fb950; }
      .fill-r { fill: #ff7b72; }
      .fill-y { fill: #d29922; }
      .fill-ink { fill: #8b949e; }
      .fill-muted { fill: #30363d; }
      .fill-lockb { fill: #0969da; }
      .stroke-panel { stroke: #30363d; }
      .stroke-axis { stroke: #8b949e; }
      .stroke-b { stroke: #4493f8; }
      .stroke-g { stroke: #3fb950; }
      .stroke-r { stroke: #ff7b72; }
      .stroke-y { stroke: #d29922; }
      .stroke-check { stroke: #0d1117; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .on { fill: #ffffff; }
      .lineb { stroke: #4493f8; }
    }
</style><rect class="bg" x="0" y="-156" width="800" height="680" /><text class="title" x="24" y="-128">超限 ≠ 立即断：阈值 → 去抖 → 动作 → 回差</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 超限 ≠ 立即断：阈值 → 去抖 → 动作 → 回差<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 阈值 4.25V（示例）<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 恢复 4.15V<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="468" width="752" height="44" rx="6" /><text class="small" x="40" y="496">窗口 20ms（示例）。示意。</text><rect width="800" height="460" class="bg" />
  <line x1="80" y1="260" x2="760" y2="260" stroke-width="1.5" class="stroke-axis" />
  <line x1="80" y1="140" x2="760" y2="140" stroke-width="1.5" stroke-dasharray="6 4" class="stroke-r" />
  <line x1="80" y1="180" x2="760" y2="180" stroke-width="1.5" stroke-dasharray="6 4" class="stroke-g" />
  <text x="740" y="134" text-anchor="end" font-size="12" class="warn">阈值 4.25V（示例）</text>
  <text x="740" y="174" text-anchor="end" font-size="12" class="ok">恢复 4.15V</text>

  
  <path d="M80,210 L120,205 L160,215 L200,208 L240,212 L250,130 L262,122 L275,135 L288,200 L320,206 L360,212 L400,208 L430,180 L445,150 L460,128 L500,124 L540,130 L580,126 L620,132 L650,150 L680,165 L700,175 L730,195 L760,205" fill="none" stroke-width="2.5" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" opacity="0" class="stroke-b">
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.02;1" dur="12s" repeatCount="indefinite" />
    <animate attributeName="stroke-dashoffset" values="100;0;0" keyTimes="0;0.75;1" dur="12s" repeatCount="indefinite" />
  </path>

  
  
  <text x="80" y="282" text-anchor="start" font-size="12" class="small">去抖计时器</text>
  <text x="152" y="282" text-anchor="start" font-size="12" class="small">窗口 20ms（示例）</text>
  <rect x="80" y="290" width="300" height="18" rx="4" stroke-width="1.5" class="fill-muted stroke-axis" />
  <rect x="80" y="290" width="0" height="18" rx="4" class="fill-y">
    <animate attributeName="width" values="0;0;90;0;0;300;300;0;0" keyTimes="0;0.206;0.25;0.27;0.45;0.58;0.68;0.7;1" dur="12s" repeatCount="indefinite" />
  </rect>

  
  <text x="480" y="282" text-anchor="start" font-size="12" class="small">MOS 开关</text>
  <line x1="500" y1="299" x2="530" y2="299" stroke-width="3" class="stroke-panel" />
  <line x1="556" y1="299" x2="586" y2="299" stroke-width="3" class="stroke-panel" />
  <line x1="530" y1="299" x2="556" y2="299" stroke-width="3.5" class="stroke-g">
    <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.56;0.58;0.68;0.7;1" dur="12s" repeatCount="indefinite" />
  </line>
  <line x1="530" y1="299" x2="552" y2="283" stroke-width="3.5" opacity="0" class="stroke-r">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.56;0.58;0.68;0.7;1" dur="12s" repeatCount="indefinite" />
  </line>
  <text x="610" y="294" text-anchor="start" font-size="13" font-weight="bold" class="ok">导通
    <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.56;0.58;0.68;0.7;1" dur="12s" repeatCount="indefinite" />
  </text>
  <text x="610" y="316" text-anchor="start" font-size="13" font-weight="bold" opacity="0" class="warn">断开
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.56;0.58;0.68;0.7;1" dur="12s" repeatCount="indefinite" />
  </text>

  
  <text x="400" y="380" text-anchor="middle" font-size="13" opacity="0" class="txt">毛刺短于去抖时间 → 计时清零，不动作
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.16;0.2;0.3;0.34;1" dur="12s" repeatCount="indefinite" />
  </text>
  <text x="400" y="402" text-anchor="middle" font-size="13" font-weight="bold" opacity="0" class="warn">持续超限 → 计时走满 → 保护断开
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.42;0.46;0.58;0.62;1" dur="12s" repeatCount="indefinite" />
  </text>
  <text x="400" y="424" text-anchor="middle" font-size="13" opacity="0" class="txt">回落到阈值与恢复线之间：仍保持断开——回差防反复跳闸
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.62;0.66;0.82;0.86;1" dur="12s" repeatCount="indefinite" />
  </text>
  <text x="150" y="56" text-anchor="start" font-size="12" opacity="0" class="warn">短路/过温等严重故障用锁存型：需人工或上位机清除
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="12s" repeatCount="indefinite" />
  </text>

  <text x="400" y="444" text-anchor="middle" font-size="13" class="small">关键：去抖躲毛刺，回差防颤振，锁存留证据——保护不是一根线，是一套决策。</text>
<text class="small" x="74.0" y="144.0" text-anchor="end">4.25</text><text class="small" x="74.0" y="184.0" text-anchor="end">4.15</text><line class="grid" x1="80" y1="140" x2="86" y2="140" /><line class="grid" x1="80" y1="180" x2="86" y2="180" /></svg>