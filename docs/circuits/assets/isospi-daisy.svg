  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.44;0.47;1" dur="8s" repeatCount="indefinite" />
    <rect x="-13" y="-8" width="26" height="16" rx="3" class="fill-b">
      <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.45;1" path="M193,200 H747" />
    </rect>
    <text x="400" y="70" text-anchor="middle" font-size="14" class="hi">命令下发（蓝）：每级芯片接收 → 再生 → 转发，像接力棒</text>
  </g>

  
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.50;0.53;0.97;1" dur="8s" repeatCount="indefinite" />
    <rect x="-13" y="-8" width="26" height="16" rx="3" class="fill-g">
      <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1" keyTimes="0;0.55;1" path="M747,282 H193" />
    </rect>
    <text x="400" y="70" text-anchor="middle" font-size="14" class="ok">数据返回（绿）：各串电压沿链送回主控</text>
  </g>
  
  <line x1="747" y1="282" x2="193" y2="282" stroke-width="2" stroke-dasharray="8 6" class="stroke-g" />

  <text x="400" y="330" text-anchor="middle" font-size="14" class="small">变压器"隔电不隔信号"：隔离墙两侧共模电压可相差几百伏，数据照样穿墙而过</text>
  <text x="400" y="358" text-anchor="middle" font-size="13" class="small">这就是车用/储能高压电池包 BMS 的板间通信方式（isoSPI）</text>
