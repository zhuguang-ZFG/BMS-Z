<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">无直流通路仍会有跨屏障位移电流</title>
<desc id="figDesc">示意隔离寄生电容 1 pF；恒定边沿斜率期间 i=Ciso·dv/dt。</desc>
<metadata id="visual-timeline">{&quot;duration&quot;: 12, &quot;beats&quot;: [{&quot;name&quot;: &quot;条件&quot;, &quot;start&quot;: 0, &quot;end&quot;: 3, &quot;caption&quot;: &quot;寄生电容让快速电压变化产生短暂电流。&quot;}, {&quot;name&quot;: &quot;变化&quot;, &quot;start&quot;: 3, &quot;end&quot;: 6, &quot;caption&quot;: &quot;斜率十倍增加，位移电流也十倍增加。&quot;}, {&quot;name&quot;: &quot;比较&quot;, &quot;start&quot;: 6, &quot;end&quot;: 9, &quot;caption&quot;: &quot;回流路径与接口承受能力会影响误触发。&quot;}, {&quot;name&quot;: &quot;结论&quot;, &quot;start&quot;: 9, &quot;end&quot;: 12, &quot;caption&quot;: &quot;耐压、工作电压与 CMTI 是不同指标，必须分别核对。&quot;}]}</metadata>
