      .lineb { stroke: #4493f8; }
    }
</style><rect class="bg" x="0" y="-156" width="800" height="690" /><text class="title" x="24" y="-128">并簇环流：压差直接落在毫欧级回路上</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 并簇环流：压差直接落在毫欧级回路上<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 51.8V（已拉平）<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ ΔV = 1.5V（示例）<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="478" width="752" height="44" rx="6" /><text class="small" x="40" y="506">簇A 出力 60%（示例）。示意。</text><rect width="800" height="470" class="bg" />
  <rect x="150" y="120" width="160" height="100" rx="8" stroke-width="2" class="fill-boxg stroke-g" />
  <text x="230" y="158" text-anchor="middle" font-size="13" font-weight="bold" class="ok">簇A</text>
  <text x="230" y="182" text-anchor="middle" font-size="13" font-weight="bold" class="ok">52.0V</text>
  <rect x="490" y="120" width="160" height="100" rx="8" stroke-width="2" class="fill-boxg stroke-g" />
  <text x="570" y="158" text-anchor="middle" font-size="13" font-weight="bold" class="ok">簇B</text>
  <text x="570" y="182" text-anchor="middle" font-size="13" font-weight="bold" class="gold">50.5V
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.55;0.58;1" dur="12s" repeatCount="indefinite" />
  </text>
  <text x="570" y="200" text-anchor="middle" font-size="13" font-weight="bold" opacity="0" class="ok">51.8V（已拉平）
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6;0.64;1" dur="12s" repeatCount="indefinite" />
  </text>
  <text x="400" y="105" text-anchor="middle" font-size="13" font-weight="bold" opacity="0" class="warn">ΔV = 1.5V（示例）
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.08;0.12;0.44;0.48;1" dur="12s" repeatCount="indefinite" />
  </text>

  
  <line x1="310" y1="160" x2="385" y2="160" stroke-width="4" class="stroke-axis" />
  <line x1="415" y1="160" x2="700" y2="160" stroke-width="4" class="stroke-axis" />
  <rect x="680" y="140" width="60" height="40" stroke-width="1.5" class="fill-muted stroke-axis" />
  <text x="710" y="165" text-anchor="middle" font-size="12" class="txt">负载</text>
  <line x1="385" y1="160" x2="415" y2="160" stroke-width="3.5" opacity="0" class="stroke-g">
    <animate attributeName="opacity" values="0;0;1;1;0;0;1;1" keyTimes="0;0.2;0.24;0.46;0.5;0.62;0.66;1" dur="12s" repeatCount="indefinite" />
  </line>
  <line x1="385" y1="160" x2="411" y2="146" stroke-width="3.5" class="stroke-axis">
    <animate attributeName="opacity" values="1;1;0;0;1;1;0;0" keyTimes="0;0.2;0.24;0.46;0.5;0.62;0.66;1" dur="12s" repeatCount="indefinite" />
  </line>
  
  <text x="400" y="188" text-anchor="middle" font-size="12" class="small">并联接触器</text>

  
  <line x1="230" y1="220" x2="230" y2="260" stroke-width="3" class="stroke-axis" />
  <line x1="570" y1="220" x2="570" y2="260" stroke-width="3" class="stroke-axis" />
  <line x1="230" y1="260" x2="710" y2="260" stroke-width="3" class="stroke-axis" />
  <line x1="710" y1="180" x2="710" y2="260" stroke-width="3" class="stroke-axis" />

  
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.22;0.26;0.44;0.48;1" dur="12s" repeatCount="indefinite" />
    <path d="M310,160 L570,160 L570,180 L570,260 L230,260 L230,180" fill="none" stroke-width="2.5" stroke-dasharray="7 5" class="stroke-r" />
    <circle r="5" class="fill-r">
      <animateMotion path="M310,160 L570,160 L570,260 L230,260 L230,180 L230,160 L310,160" keyPoints="0;0;1;1" keyTimes="0;0.22;0.46;1" calcMode="linear" dur="12s" repeatCount="indefinite" />
    </circle>
    <circle r="5" class="fill-r">
      <animateMotion path="M310,160 L570,160 L570,260 L230,260 L230,180 L230,160 L310,160" keyPoints="0;0;1;1" keyTimes="0;0.22;0.46;1" calcMode="linear" dur="12s" repeatCount="indefinite" begin="-1.2s" />
    </circle>
    <circle r="5" class="fill-r">
      <animateMotion path="M310,160 L570,160 L570,260 L230,260 L230,180 L230,160 L310,160" keyPoints="0;0;1;1" keyTimes="0;0.22;0.46;1" calcMode="linear" dur="12s" repeatCount="indefinite" begin="-2.4s" />
    </circle>
    <rect x="383" y="146" width="34" height="28" opacity="0.3" class="fill-r">
      <animate attributeName="opacity" values="0.15;0.45;0.15;0.45;0.15" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite" />
    </rect>
    <text x="400" y="300" text-anchor="middle" font-size="14" font-weight="bold" class="warn">环流 ≈ 300A（示例）：不过负载，只在两包之间对冲</text>
    <text x="400" y="322" text-anchor="middle" font-size="12" class="warn">ΔV 1.5V ÷ 回路 5mΩ（内阻+线束，示例）</text>
  </g>

  
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.48;0.52;1" dur="12s" repeatCount="indefinite" />
    <path d="M340,160 L340,125 L460,125 L460,160" fill="none" stroke-width="2.5" class="stroke-y" />
    <rect x="370" y="113" width="60" height="24" stroke-width="1.5" class="fill-boxy stroke-y" />
    <text x="400" y="130" text-anchor="middle" font-size="12" class="gold">限流电阻</text>
    <circle r="4" class="fill-y">
      <animateMotion path="M340,160 L340,125 L460,125 L460,160" keyPoints="0;0;1;1" keyTimes="0;0.52;0.62;1" calcMode="linear" dur="12s" repeatCount="indefinite" />
    </circle>
    <text x="400" y="84" text-anchor="middle" font-size="12" class="gold">先比压：压差超限禁止并机；用限流电阻/DC/DC 拉平再合闸</text>
  </g>

  
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.72;0.76;1" dur="12s" repeatCount="indefinite" />
    <text x="400" y="340" text-anchor="middle" font-size="12" class="txt">运行中：电流分配不均，弱簇先到保护边界 → 按簇降额，不按总包</text>
    <rect x="150" y="360" width="96" height="16" class="fill-y" />
    <rect x="490" y="360" width="64" height="16" opacity="0.7" class="fill-y" />
    <text x="254" y="373" text-anchor="start" font-size="12" class="gold">簇A 出力 60%（示例）</text>
    <text x="562" y="373" text-anchor="start" font-size="12" class="gold">簇B 40%</text>
  </g>

  <text x="400" y="452" text-anchor="middle" font-size="13" class="small">关键：并机先比压，压差先拉平；运行按簇降额——环流不过负载，却烧接触器和线束。</text>
</svg>