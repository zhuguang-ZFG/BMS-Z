<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="ui-monospace, Consolas, monospace">
  <title>被动均衡与主动均衡的能量账：电阻上的热量可以口算，主动搬运的效率百分数留空。数字为示意。</title>
  <desc>亮点先算被动均衡烧在电阻上的热量，再看同一拍里低节能从主动搬运收到多少，两种账分开读。</desc>

  <style>
    .bg { fill: #fffdf5; }
    .panel { fill: #f7f2e5; stroke: #cfc6b2; }
    .axis { stroke: #626d65; stroke-width: 1.5; fill: none; }
    .txt { fill: #293b3a; font-size: 13px; }
    .small { fill: #626d65; font-size: 12px; }
    .title { fill: #293b3a; font-size: 16px; font-weight: bold; }
    .hi { fill: #176b73; }
    .warn { fill: #ad4644; }
    .ok { fill: #36775e; }
    .gold { fill: #926717; }
    .lineb { stroke: #176b73; stroke-width: 2.5; fill: none; }
    .liner { stroke: #b84745; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #377b60; stroke-width: 2.5; fill: none; }
    .liney { stroke: #926717; stroke-width: 2.5; fill: none; }
    .dotb { fill: #176b73; }
    .dotr { fill: #b84745; }
    .dotg { fill: #377b60; }
    .doty { fill: #926717; }
    .boxb { fill: #e4f0df; stroke: #176b73; }
    .boxr { fill: #f6e2df; stroke: #b84745; }
    .boxg { fill: #e4f0df; stroke: #377b60; }
    .boxy { fill: #fbefc7; stroke: #926717; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #192727; }
      .panel { fill: #223333; stroke: #496160; }
      .axis { stroke: #b0beb3; }
      .txt { fill: #edf0e5; }
      .small { fill: #b0beb3; }
      .title { fill: #edf0e5; }
      .hi { fill: #7ec5c5; }
      .warn { fill: #f39b91; }
      .ok { fill: #8fc7a2; }
      .gold { fill: #dfbd78; }
      .lineb { stroke: #7ec5c5; }
      .liner { stroke: #f39b91; }
      .lineg { stroke: #8fc7a2; }
      .liney { stroke: #dfbd78; }
      .dotb { fill: #7ec5c5; }
      .dotr { fill: #f39b91; }
      .dotg { fill: #8fc7a2; }
      .doty { fill: #dfbd78; }
      .boxb { fill: #293f35; stroke: #7ec5c5; }
      .boxr { fill: #483336; stroke: #f39b91; }
      .boxg { fill: #293f35; stroke: #8fc7a2; }
      .boxy { fill: #453e2b; stroke: #dfbd78; }
    }
  </style>

  <rect class="bg" width="800" height="460"/>

  <text class="title" x="24" y="32">同一小时的两本账：被动变成热，主动先存进磁件（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="122" rx="6"/>
  <text class="txt" x="40" y="68" opacity="0.28">① 被动电流<tspan class="small">　4.2 V / 100 Ω = 42 mA。这一节在往外放。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="94" opacity="0.28">② 被动能量<tspan class="small">　42 mA × 1 h = 42 mAh。4.2 V × 0.042 A × 1 h ≈ 0.18 Wh，进了电阻。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="120" opacity="0.28">③ 低节收到<tspan class="small">　被动这一笔是 0。电荷没有换节。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="146" opacity="0.28">④ 主动一拍<tspan class="small">　10 µH、峰值 2 A，½LI²=20 µJ。2 万拍每秒大约 0.4 W 的搬运量级。低节实收要扣损耗，百分数留空。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="boxr" x="40" y="200" width="340" height="180" rx="8"/>
  <text class="warn" x="210" y="230" text-anchor="middle">被动，1 小时</text>
  <text class="txt" x="60" y="270">交出 42 mAh</text>
  <text class="txt" x="60" y="298">变成热 ≈ 0.18 Wh</text>
  <text class="txt" x="60" y="326">邻居收到 0</text>
  <rect class="boxg" x="420" y="200" width="340" height="180" rx="8"/>
  <text class="ok" x="590" y="230" text-anchor="middle">主动，只算搬运量级</text>
  <text class="txt" x="440" y="270">一拍 20 µJ</text>
  <text class="txt" x="440" y="298">20 kHz → 约 0.4 W</text>
  <text class="txt" x="440" y="326">效率百分数：空</text>
  <circle class="dotr" cy="348" r="6">
    <animate calcMode="spline" keySplines="0.16 1 0.3 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="cx" values="70;300;300;300" keyTimes="0;0.5;0.749;1" dur="12s" repeatCount="indefinite"/>
    <animate calcMode="spline" keySplines="0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="opacity" values="1;1;0;0" keyTimes="0;0.749;0.75;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle class="dotg" cy="348" r="6">
    <animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1" attributeName="cx" values="450;450;720" keyTimes="0;0.75;1" dur="12s" repeatCount="indefinite"/>
    <animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="0;0;1;1" keyTimes="0;0.749;0.75;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <text class="small" x="24" y="446">0.18 Wh 和 20 µJ、0.4 W 是示意口算，和均衡功耗那张图同一套假设。没有同一工况的实测之前，不写效率百分数。</text>

</svg>
