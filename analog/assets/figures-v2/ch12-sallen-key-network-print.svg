<text x="45" y="510" font-size="24" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">C1 从 X 接输出；C2 从 Y 接地。两只电容不可对调后仍照抄公式。</text>
<text x="45" y="565" font-size="25" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">R1=R2，C1=2C2 → Q=1/√2；等值电容只给 Q=0.5。</text>
<text x="45" y="620" font-size="25" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">10 kHz、C1=10 nF、C2=5 nF → R≈2250.79 Ω。</text>
<text x="45" y="670" font-size="23" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">改用 2.2 kΩ 时 f0≈10.23 kHz；真实运放带宽与容差须另验。</text>
</svg>
