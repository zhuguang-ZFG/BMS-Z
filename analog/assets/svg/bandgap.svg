<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">带隙基准：一正一负，凑出与温度无关的 1.25V</text>

<text x="400" y="46" text-anchor="middle" font-size="14" font-weight="bold" fill="#37424e">V_REF = V_BE + K·ΔV_BE ≈ 1.25V（硅带隙电压）</text>
<rect x="60" y="80" width="320" height="220" rx="8" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<text x="220" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#37424e">Brokaw 单元（简化）</text>
<text x="220" y="122" text-anchor="middle" font-size="10.5" fill="#6b3f63">两管电流密度不同 → ΔV_BE=V_T·ln(8)≈54mV 落在 R 上</text>
