<svg xmlns="http://www.w3.org/2000/svg" width="800" height="680" viewBox="0 -156 800 680" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>隔离槽对照：槽上不铺铜、不走线，变压器只传交流；一条铜桥把电池侧和通信侧接上。示意图，不替代标准里的爬电表。</title>
  <desc>绿点走到槽边就停住。红点顺着铜桥从电池侧走到通信侧。示意图，不替代标准里的爬电表。</desc>
