<text x="480" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b">两种源，两条 V-I 曲线</text>
<text x="480" y="54" text-anchor="middle" font-size="12.5" fill="#5b666f">横轴电流 I、纵轴电压 V；斜率的绝对值反映输出阻抗</text>
<rect x="48" y="96" width="864" height="420" rx="14" fill="#f6eedb" stroke="#c9bb9d" stroke-width="1.4"/><line x1="120" y1="420" x2="492" y2="420" stroke="#16202b" stroke-width="2"/><line x1="120" y1="420" x2="120" y2="140" stroke="#16202b" stroke-width="2"/><text x="500" y="425" font-size="13" fill="#5b666f">I</text><text x="108" y="132" font-size="13" fill="#5b666f">V</text><text x="300" y="448" text-anchor="middle" font-size="11" fill="#5b666f">源电流</text><text x="92" y="290" text-anchor="middle" font-size="11" fill="#5b666f" transform="rotate(-90 92 290)">端电压</text>
<g transform="translate(0 -4)"><line x1="120" y1="190" x2="480" y2="190" stroke="#1f5d7a" stroke-width="4"/>
<line x1="300" y1="150" x2="300" y2="410" stroke="#3d6b4a" stroke-width="4"/>
<line x1="120" y1="190" x2="470" y2="198" stroke="#a4630f" stroke-width="3.4"/>
<line x1="120" y1="190" x2="480" y2="222" stroke="#a8321f" stroke-width="3.4"/>
<text x="120" y="488" font-size="11.5" fill="#5b666f">恒压：水平；恒流：竖直；斜率放大示意</text>
<rect x="512" y="150" width="304" height="100" rx="10" fill="#e6eff3" stroke="#1f5d7a" stroke-width="1.5"/>
<text x="532" y="178" font-size="13" font-weight="bold" fill="#1f5d7a">恒压源 → 负载并联</text>
<text x="532" y="202" font-size="11.5" fill="#16202b">各自独立取电流</text>
<text x="532" y="226" font-size="11.5" fill="#5b666f">例：多路 LED 各串限流电阻</text>
<rect x="512" y="268" width="304" height="100" rx="10" fill="#e8efe6" stroke="#3d6b4a" stroke-width="1.5"/>
<text x="532" y="296" font-size="13" font-weight="bold" fill="#3d6b4a">恒流源 → 负载串联</text>
<text x="532" y="320" font-size="11.5" fill="#16202b">同一股电流穿过所有负载</text>
<text x="532" y="344" font-size="11.5" fill="#5b666f">Ro=10MΩ：0→10V 只掉 1µA</text></g>
<rect x="24" y="556" width="912" height="34" rx="9" fill="#f7eedb" stroke="#c9bb9d" stroke-width="1.2"/>
<text x="480" y="580" text-anchor="middle" font-size="13" font-weight="bold" fill="#a8321f">恒压源并联负载，恒流源串联负载；性格决定接法。</text>
</svg>
