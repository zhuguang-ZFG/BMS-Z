</style><rect class="bg" x="0" y="-156" width="880" height="700" /><text class="title" x="24" y="-128">包级手册要画出采样，并写下这颗电芯的阈值</text><rect class="panel" x="24" y="-112" width="832" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 包级手册要画出采样，并写下这颗电芯的阈值<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 示意图·待公开手册<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 阈值格：跟装进去的那颗电芯<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="488" width="832" height="44" rx="6" /><text class="small" x="40" y="516">电芯规格书写单体该在哪停。包级原理图写抽头、均衡和接触器怎么接。</text><rect width="880" height="480" class="bg" />
  <text x="440" y="50" text-anchor="middle" font-size="13" class="gold">示意图·待公开手册</text>
  <rect x="20" y="68" width="410" height="280" rx="8" class="panel" />
  <text x="36" y="94" font-size="15" font-weight="bold" class="txt">钠离子包</text>
  <rect x="36" y="108" width="70" height="36" rx="4" class="fill-boxb stroke-b"><animate attributeName="stroke-width" values="5;2;5" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite" /></rect>
  <text x="71" y="131" text-anchor="middle" font-size="12" class="txt">电芯</text>
  <rect x="122" y="108" width="70" height="36" rx="4" class="fill-boxb stroke-b" />
  <text x="157" y="131" text-anchor="middle" font-size="12" class="txt">电芯</text>
  <rect x="208" y="108" width="70" height="36" rx="4" class="fill-boxb stroke-b" />
  <text x="243" y="131" text-anchor="middle" font-size="12" class="txt">电芯</text>
  <rect x="300" y="100" width="110" height="52" rx="4" class="fill-boxy stroke-y"><animate attributeName="stroke-width" values="2;5;2" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite" /></rect>
  <text x="355" y="122" text-anchor="middle" font-size="12" class="txt">模块监控</text>
  <text x="355" y="140" text-anchor="middle" font-size="12" class="txt">逐串抽头</text>
  <circle cy="126" r="5" class="fill-b">
    <animate attributeName="cx" values="71;355;71" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite" />
  </circle>
  <text x="36" y="180" font-size="13" class="txt">阈值格：跟装进去的那颗电芯</text>
  <text x="36" y="202" font-size="13" class="txt">超钠和海四达不要写成同一行</text>
  <rect x="36" y="220" width="370" height="100" rx="4" class="bg stroke-panel" />
  <text x="48" y="248" font-size="13" class="txt">寄存器地址：空</text>
  <text x="48" y="272" font-size="13" class="txt">接触器时序：空</text>
  <text x="48" y="296" font-size="13" class="gold">待公开手册</text>
  <rect x="450" y="68" width="410" height="280" rx="8" class="panel" />
  <text x="466" y="94" font-size="15" font-weight="bold" class="txt">固态 / 结构电池包</text>
  <rect x="466" y="108" width="160" height="44" rx="4" class="fill-boxg stroke-g" />
  <text x="546" y="135" text-anchor="middle" font-size="12" class="txt">电芯或整块电极</text>
  <rect x="646" y="108" width="190" height="44" rx="4" class="fill-boxy stroke-y" />
  <text x="741" y="128" text-anchor="middle" font-size="12" class="txt">采样是端电压</text>
  <text x="741" y="144" text-anchor="middle" font-size="12" class="txt">另加压力或温度</text>
  <circle cy="130" r="5" class="fill-g">
    <animate attributeName="cx" values="546;741;546" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite" />
  </circle>
  <text x="466" y="180" font-size="13" class="txt">固态：液体正极电解液仍可能在</text>
  <text x="466" y="202" font-size="13" class="txt">结构：量到的是整块板，不是一节圆柱</text>
  <rect x="466" y="220" width="370" height="100" rx="4" class="bg stroke-panel" />
  <text x="478" y="248" font-size="13" class="txt">保护阈值表：空</text>
  <text x="478" y="272" font-size="13" class="txt">压力测点：空</text>
  <text x="478" y="296" font-size="13" class="gold">待公开手册</text>
  <text x="20" y="376" font-size="14" class="txt">蓝点和绿点沿采样线走。空格是手册里还没有公开的那几页。</text>
  <text x="20" y="404" font-size="14" class="txt">团体标准可以定义「要采集单体电压」，那仍然不是某一家的寄存器地图。</text>
  

</svg>