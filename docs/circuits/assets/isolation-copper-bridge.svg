</style><rect class="bg" x="0" y="-156" width="800" height="680" /><text class="title" x="24" y="-128">隔离槽：留空，还是用铜桥接上</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 隔离槽：留空，还是用铜桥接上<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 示意图。爬电和间隙以产品适用标准的表为准，图上不写某个认证距离。<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 对：槽上不铺铜、不走线<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="468" width="752" height="44" rx="6" /><text class="small" x="40" y="496">隔离器件正下方同样不铺铜。槽要连续，不要被过孔环焊盘打断。</text><rect width="800" height="460" class="bg" />
  <text x="400" y="54" text-anchor="middle" font-size="13" class="small">示意图。爬电和间隙以产品适用标准的表为准，图上不写某个认证距离。</text>
  <rect x="36" y="78" width="350" height="250" rx="8" class="fill-boxg stroke-g" />
  <text x="211" y="108" text-anchor="middle" font-size="15" font-weight="bold" class="ok">对：槽上不铺铜、不走线</text>
  <rect x="70" y="150" width="100" height="70" class="fill-boxb stroke-b" />
  <text x="120" y="190" text-anchor="middle" font-size="12" class="hi">电池侧</text>
  <rect x="250" y="150" width="100" height="70" class="panel stroke-axis" />
  <text x="300" y="190" text-anchor="middle" font-size="12" class="txt">通信侧</text>
  <rect x="180" y="140" width="60" height="90" stroke-dasharray="4 3" class="bg stroke-g" />
  <text x="211" y="268" text-anchor="middle" font-size="13" class="ok">变压器跨槽，直流过不去</text>
  <rect x="414" y="78" width="350" height="250" rx="8" class="fill-boxr stroke-r" />
  <text x="589" y="108" text-anchor="middle" font-size="15" font-weight="bold" class="warn">错：铺铜把槽桥上</text>
  <rect x="448" y="150" width="100" height="70" class="fill-boxb stroke-b" />
  <text x="498" y="190" text-anchor="middle" font-size="12" class="hi">电池侧</text>
  <rect x="628" y="150" width="100" height="70" class="panel stroke-axis" />
  <text x="678" y="190" text-anchor="middle" font-size="12" class="txt">通信侧</text>
  <rect x="548" y="170" width="80" height="16" class="fill-y">
    <animate attributeName="opacity" values="0.3;1;0.3" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite" />
  </rect>
  <text x="589" y="268" text-anchor="middle" font-size="13" class="warn">铜桥把两侧电位接上</text>
  <circle r="6" cx="120" cy="185" class="fill-g">
    <animate attributeName="cx" values="120;175;175;120" keyTimes="0;0.3;0.7;1" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle r="6" cx="498" cy="178" class="fill-r">
    <animate attributeName="cx" values="498;588;678;498" keyTimes="0;0.4;0.7;1" dur="8s" repeatCount="indefinite" />
  </circle>
  <text x="400" y="360" text-anchor="middle" font-size="14" class="txt">通信也许还在。人手摸到接口，摸到的是电池电位。</text>
  

</svg>