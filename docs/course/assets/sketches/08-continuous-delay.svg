<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
<title id="title">延时只认连续，不凑低读数</title><desc id="desc">图中高度表示采样后的正常或欠压判断，不是按比例绘制的电压曲线。连续分支从0.30 s读到2.95 V起计，到0.50 s满0.20 s才下令。对照分支0.40 s恢复3.68 V使未触发计时清零，0.50 s再次欠压时重新起计。</desc>
