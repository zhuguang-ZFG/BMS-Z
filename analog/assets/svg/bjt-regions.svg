<text x="300" y="88" font-size="12.5" font-weight="bold" fill="#37424e">三个工作区</text>
<text x="306" y="122" font-size="12" fill="#5b666f">发射结</text>
<text x="394" y="122" font-size="12" fill="#5b666f">集电结</text>
