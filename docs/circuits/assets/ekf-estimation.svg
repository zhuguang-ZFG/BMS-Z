  <text class="title" x="24" y="32">积分会漂，EKF 被电压拉回来</text>
  <text class="small" x="24" y="54">数据：code/soc/compare.py 仿真输出　种子 42　17000 步 × 1 s　折线等距抽 80 点，RMSE 用全部步</text>
  <rect class="panel" x="24" y="66" width="752" height="100" rx="6"/>
  <text class="txt" x="40" y="88" opacity="0.28">① 纯安时<tspan class="small">　整段 RMSE 10.6183%。零漂和容量估错会积着走，没有人拉它。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
