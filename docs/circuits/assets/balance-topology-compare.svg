<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 590" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>均衡拓扑示意：被动按 4.2 V、100 Ω 把能量变成热；主动一拍输入 20 μJ。搬到低节的效率不在这张图上填。</title>
  <desc>对数轴上红线是热量，蓝线是主动侧已经花掉的输入。金点沿红线走。输出那一截留空。</desc>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; }
    .linek { stroke: #57606a; stroke-width: 2.2; fill: none; stroke-dasharray: 7 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .dotg { fill: #1a7f37; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    .boxy { fill: #fff8c5; stroke: #d4a72c; }
    .boxr { fill: #ffebe9; stroke: #ff8182; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .linek { stroke: #8b949e; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .dotg { fill: #3fb950; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
      .boxy { fill: #3d2e00; stroke: #d29922; }
      .boxr { fill: #3d1418; stroke: #f85149; }
    }
  </style>
  <!-- formula: P=4.2^2/100; Epass=P*t; Eact=20e-6*t; 20 uJ = 0.5*10e-6*2^2 -->
  <rect class="bg" width="800" height="590"/>
  <text class="title" x="24" y="32">被动的热是焦耳，主动搬到低节的那一截留空（示意）</text>
  <rect class="panel" x="24" y="44" width="752" height="124" rx="6"/>
  <text class="txt" x="40" y="68" opacity="0.28">① 被动<tspan class="small">　4.2²/100 = 0.176 W。热按这个功率乘时间。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="92" opacity="0.28">② 主动一拍<tspan class="small">　½×10 μH×(2 A)² = 20 μJ。每秒一拍是示意节拍。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="116" opacity="0.28">③ 纵轴是对数<tspan class="small">　否则 20 μJ 会贴在 0 上看不见。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="140" opacity="0.28">④ 口诀<tspan class="small">　热可以口算。效率百分数留空，任务板还没收这份数。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="180" width="752" height="268" rx="6"/>
  <text class="small" x="40" y="202">能量 J（对数，示意）</text>
  <text class="warn" x="200" y="218">红 被动变成热</text>
  <text class="hi" x="400" y="218">蓝 主动每拍输入</text>
  <line class="axis" x1="108.0" y1="248.0" x2="108.0" y2="400.0"/>
  <line class="axis" x1="108.0" y1="400.0" x2="720.0" y2="400.0"/>
  <line class="grid" x1="140.2" y1="400.0" x2="140.2" y2="406.0"/>
  <text class="small" x="140.2" y="422.0" text-anchor="middle">1</text>
  <line class="grid" x1="397.9" y1="400.0" x2="397.9" y2="406.0"/>
  <text class="small" x="397.9" y="422.0" text-anchor="middle">5</text>
  <line class="grid" x1="720.0" y1="400.0" x2="720.0" y2="406.0"/>
  <text class="small" x="720.0" y="422.0" text-anchor="middle">10</text>
  <line class="grid" x1="102.0" y1="378.3" x2="108.0" y2="378.3"/>
  <text class="small" x="98.0" y="382.3" text-anchor="end">10μJ</text>
  <line class="grid" x1="102.0" y1="334.9" x2="108.0" y2="334.9"/>
  <text class="small" x="98.0" y="338.9" text-anchor="end">1mJ</text>
  <line class="grid" x1="102.0" y1="269.7" x2="108.0" y2="269.7"/>
  <text class="small" x="98.0" y="273.7" text-anchor="end">1J</text>
  <text class="small" x="720" y="444" text-anchor="end">时间 s</text>
  <polyline class="liner" points="108.0,292.6 123.7,288.9 139.4,286.2 155.1,284.1 170.8,282.4 186.5,281.0 202.2,279.7 217.8,278.6 233.5,277.6 249.2,276.7 264.9,275.9 280.6,275.2 296.3,274.5 312.0,273.8 327.7,273.2 343.4,272.6 359.1,272.1 374.8,271.6 390.5,271.1 406.2,270.7 421.8,270.2 437.5,269.8 453.2,269.4 468.9,269.0 484.6,268.7 500.3,268.3 516.0,268.0 531.7,267.6 547.4,267.3 563.1,267.0 578.8,266.7 594.5,266.4 610.2,266.1 625.8,265.9 641.5,265.6 657.2,265.3 672.9,265.1 688.6,264.8 704.3,264.6 720.0,264.4" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline class="lineb" points="108.0,378.3 123.7,374.5 139.4,371.9 155.1,369.8 170.8,368.1 186.5,366.6 202.2,365.4 217.8,364.3 233.5,363.3 249.2,362.4 264.9,361.6 280.6,360.8 296.3,360.1 312.0,359.5 327.7,358.9 343.4,358.3 359.1,357.8 374.8,357.3 390.5,356.8 406.2,356.3 421.8,355.9 437.5,355.5 453.2,355.1 468.9,354.7 484.6,354.3 500.3,354.0 516.0,353.6 531.7,353.3 547.4,353.0 563.1,352.7 578.8,352.4 594.5,352.1 610.2,351.8 625.8,351.5 641.5,351.3 657.2,351.0 672.9,350.8 688.6,350.5 704.3,350.3 720.0,350.0" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="doty" r="6" cx="140.2" cy="286.1"><animate attributeName="cx" values="140.2;204.6;397.9;720.0;720.0" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="286.1;279.5;270.9;264.4;264.4" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite"/></circle>
  <circle class="dotr" r="4" cx="140.2" cy="286.1"><animate attributeName="cx" values="140.2;204.6;397.9;720.0;720.0" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite" begin="-6s"/><animate attributeName="cy" values="286.1;279.5;270.9;264.4;264.4" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite" begin="-6s"/></circle>
  <rect class="panel" x="24" y="460" width="752" height="68" rx="6"/>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="1">t = 1 s · 被动热 0.176 J · 主动输入 20 μJ · 效率不写（示意）<animate attributeName="opacity" values="1;0;0;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0">t = 2 s · 被动热 0.353 J · 主动输入 40 μJ · 效率不写（示意）<animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0">t = 5 s · 被动热 0.882 J · 主动输入 100 μJ · 效率不写（示意）<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0">t = 10 s · 被动热 1.764 J · 主动输入 200 μJ · 效率不写（示意）<animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="24" y="560">4.2 V、100 Ω、10 μH、2 A 是详解里的示例。不写效率百分数。</text>

</svg>
