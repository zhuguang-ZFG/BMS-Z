    <animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.48;0.55;0.85;0.92;1" dur="8s" repeatCount="indefinite" />
    <animate calcMode="spline" keySplines="0.16 1 0.3 1;0.7 0 0.84 0" attributeName="cx" values="544;684;544" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite" />
  </circle>

  <text x="400" y="340" text-anchor="middle" font-size="15" font-weight="bold" opacity="0" class="warn">错：主动均衡也是把电烧掉
    <animate calcMode="spline" keySplines="0.16 1 0.3 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="opacity" values="0;1;0;0" keyTimes="0;0.15;0.35;1" dur="8s" repeatCount="indefinite" />
  </text>
  <text x="400" y="372" text-anchor="middle" font-size="15" opacity="0" class="ok">对：被动进电阻变热；主动交给低的那一节。开关和磁件仍有损耗。
    <animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="0;0;1;1" keyTimes="0;0.45;0.55;1" dur="8s" repeatCount="indefinite" />
  </text>
  <text x="400" y="414" text-anchor="middle" font-size="13" class="small">示意图。没有同一电流、同一串数的实测效率，不在这张图上写百分数。</text>


  <rect x="24" y="430" width="752" height="86" rx="8" class="panel" />
  <text x="40" y="458" font-size="14" class="txt">示意账：被动 4.2 V、42 mA、1 小时 ≈ 0.18 Wh 变成热，邻居收到 0。</text>
  
