<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">真实电容的阻抗-频率地图：陶瓷与铝电解的三段身份与频段分工</title>
<desc id="figDesc">主区是对数坐标阻抗图：横轴频率从 10kHz 到 1GHz，纵轴阻抗从 1mΩ 到 1kΩ。琥珀色实线是 10µF 铝电解：从容性下坡进入约 1Ω 的 ESR 谷底（谷底位于 f0≈356kHz），再被 ESL 拉起上翘，100MHz 处约 13Ω。青色实线是 100nF 陶瓷 0805：谷底 mΩ 级，位于 f0≈16MHz（ESL≈1nH），100MHz 处约 0.6Ω。两条灰色虚线是理想电容的一路下坡，一条灰蓝虚线是钽电容的定性曲线。底部左侧浅琥珀带标注「电解值班：储能、10µs~毫秒级」，中间浅青带标注「MLCC 值班：几十 ns 级边沿」，两曲线之间红色虚线鼓包标注「并联谐振峰（几 MHz）」。右侧三张卡片：① 三段各管一摊（低频看 C、中频看 ESR、高频看 ESL，谷底位置 f0=1/(2π√(ESL·C))）；② 频段分工翻译成时间（100kHz↔周期 10µs，16MHz↔周期 63ns，100MHz 处 13Ω 对 0.6Ω）；③ 军规便签（选谷底低而宽的那条，贴脸放，走线 5nH/cm 会废掉好意）。底部结论条：谷底深度=ESR，谷底位置=f0，低频储能交给电解、高频去耦交给小封装 MLCC，两者是分工。</desc>
<rect width="960" height="640" fill="#fffdf8"/>

<text x="36" y="48" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="28" font-weight="700" fill="#14213d">一只电容，三个频段三种身份</text>
<text x="36" y="76" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="15" fill="#52606d">100nF 陶瓷（0805）与 10µF 铝电解的 |Z|–f 对照：谷底深浅看 ESR，谷底位置看 ESL。</text>
<line x1="36" y1="94" x2="924" y2="94" stroke="#14213d" stroke-width="2"/>

