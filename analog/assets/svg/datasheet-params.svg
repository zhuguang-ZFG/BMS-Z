<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">Datasheet 五十页，先读这六行</text>

<text x="400" y="46" text-anchor="middle" font-size="14" font-weight="bold" fill="#37424e">按「会咬人」的先后排序 —— 每一项都给出它咬在哪</text>
<rect x="40" y="82" width="720" height="72" rx="8" fill="#f6eedb" stroke="#6b3f63" stroke-width="1.6"/><text x="56" y="108" font-size="12.5" font-weight="bold" fill="#6b3f63">① V_OS 输入失调</text><text x="300" y="108" font-size="11" fill="#5b666f">2mV (LM358) / 75µV (OP07)</text><text x="56" y="132" font-size="11.5" font-weight="bold" fill="#16202b">咬在这里：被增益放大：×100 → 输出 200mV 误差</text><text x="56" y="148" font-size="10.5" fill="#5b666f">直流第一杀手，看 max 不看 typ</text><rect x="40" y="164" width="720" height="72" rx="8" fill="#f6eedb" stroke="#1f5d7a" stroke-width="1.6"/><text x="56" y="190" font-size="12.5" font-weight="bold" fill="#1f5d7a">② I_B 输入偏置电流</text><text x="300" y="190" font-size="11" fill="#5b666f">45nA (BJT) / 30pA (JFET)</text><text x="56" y="214" font-size="11.5" font-weight="bold" fill="#16202b">咬在这里：流过高源阻抗 → 变成额外失调</text><text x="56" y="230" font-size="10.5" fill="#5b666f">源阻抗 >100kΩ 必须 FET 输入</text><rect x="40" y="246" width="720" height="72" rx="8" fill="#f6eedb" stroke="#3d6b4a" stroke-width="1.6"/><text x="56" y="272" font-size="12.5" font-weight="bold" fill="#3d6b4a">③ GBW 增益带宽积</text><text x="300" y="272" font-size="11" fill="#5b666f">1MHz (LM358) / 10MHz (NE5532)</text><text x="56" y="296" font-size="11.5" font-weight="bold" fill="#16202b">咬在这里：闭环增益 × 带宽 = GBW</text><text x="56" y="312" font-size="10.5" fill="#5b666f">选型：≥ 增益×最高频率×10</text><rect x="40" y="328" width="720" height="72" rx="8" fill="#f6eedb" stroke="#a8321f" stroke-width="1.6"/><text x="56" y="354" font-size="12.5" font-weight="bold" fill="#a8321f">④ SR 压摆率</text><text x="300" y="354" font-size="11" fill="#5b666f">0.5V/µs (LM358) / 9V/µs (NE5532)</text><text x="56" y="378" font-size="11.5" font-weight="bold" fill="#16202b">咬在这里：大信号被限速 → 三角波化</text><text x="56" y="394" font-size="10.5" fill="#5b666f">全功率带宽 = SR/(2πVp)</text><rect x="40" y="410" width="720" height="72" rx="8" fill="#f6eedb" stroke="#a4630f" stroke-width="1.6"/><text x="56" y="436" font-size="12.5" font-weight="bold" fill="#a4630f">⑤ A_OL 开环增益</text><text x="300" y="436" font-size="11" fill="#5b666f">≥100dB 常见</text><text x="56" y="460" font-size="11.5" font-weight="bold" fill="#16202b">咬在这里：太浅则闭环精度不足</text><text x="56" y="476" font-size="10.5" fill="#5b666f">看它随频率滚降的曲线</text><rect x="40" y="492" width="720" height="72" rx="8" fill="#f6eedb" stroke="#2f7f96" stroke-width="1.6"/><text x="56" y="518" font-size="12.5" font-weight="bold" fill="#2f7f96">⑥ 输出摆幅 / 轨到轨</text><text x="300" y="518" font-size="11" fill="#5b666f">Vcc−1.5V (LM358)</text><text x="56" y="542" font-size="11.5" font-weight="bold" fill="#16202b">咬在这里：够不到轨 → 摆幅不够</text><text x="56" y="558" font-size="10.5" fill="#5b666f">接近电源轨就选 RRIO</text>
<path d="M40 580 Q400.00 578.54 760 580" fill="none" stroke="#c9bb9d" stroke-width="1"/>
<text x="400" y="608" text-anchor="middle" font-size="12" font-weight="bold" fill="#37424e">读法：先按自己的电路「会疼的地方」跳读</text>
<text x="400" y="632" text-anchor="middle" font-size="11.5" fill="#5b666f">直流精密 → 先看 V_OS/I_B　·　高速 → 先看 GBW/SR　·　单电源低压 → 先看共模范围与输出摆幅</text>
<text x="400" y="654" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a4630f">别从头读到尾：五十页里，就这六行在决定你的电路能不能工作</text>
