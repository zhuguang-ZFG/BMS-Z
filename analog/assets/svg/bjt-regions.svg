<text x="306" y="178" font-size="11.5" fill="#a8321f">反偏</text>
<text x="394" y="178" font-size="11.5" fill="#a8321f">反偏</text>
<text x="300" y="208" font-size="12.5" font-weight="bold" fill="#1f5d7a">放大</text>
<text x="306" y="234" font-size="11.5" fill="#3d6b4a">正偏</text>
<text x="394" y="234" font-size="11.5" fill="#a8321f">反偏</text>
<text x="300" y="264" font-size="12.5" font-weight="bold" fill="#a8321f">饱和</text>
<text x="306" y="290" font-size="11.5" fill="#3d6b4a">正偏</text>
<text x="394" y="290" font-size="11.5" fill="#3d6b4a">正偏</text>
<text x="300" y="332" font-size="12" font-weight="bold" fill="#5b666f">≈ 断路（开关打开）</text>
<text x="300" y="356" font-size="12" font-weight="bold" fill="#1f5d7a">I_C = β·I_B</text>
<text x="300" y="380" font-size="12" font-weight="bold" fill="#a8321f">≈ 闭合开关（β 失效）</text>
<text x="470" y="60" font-size="12.5" font-weight="bold" fill="#37424e">输出特性：负载线切过哪里，就是哪个区</text>
