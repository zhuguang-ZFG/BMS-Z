<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 860" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">虚短探针：沿反馈回路核对读数</title>
<desc id="figDesc">两输入相差 8mV，还要核前提、算误差、看输出</desc>
<metadata id="visual-timeline">{&quot;duration&quot;: 7.5, &quot;beats&quot;: [{&quot;name&quot;: &quot;认脚&quot;, &quot;start&quot;: 0.0, &quot;end&quot;: 1.5, &quot;caption&quot;: &quot;先沿原理图核对负反馈，再量输入端与输出工况&quot;}, {&quot;name&quot;: &quot;量V-&quot;, &quot;start&quot;: 1.5, &quot;end&quot;: 3.0, &quot;caption&quot;: &quot;同一静态工况：表笔落 V-，读数 2.500V&quot;}, {&quot;name&quot;: &quot;量V+&quot;, &quot;start&quot;: 3.0, &quot;end&quot;: 4.5, &quot;caption&quot;: &quot;保持工况不变：表笔落 V+，读数 2.508V&quot;}, {&quot;name&quot;: &quot;算压差&quot;, &quot;start&quot;: 4.5, &quot;end&quot;: 6.0, &quot;caption&quot;: &quot;2.508 − 2.500 = 8mV：先记读数，不急着判合格&quot;}, {&quot;name&quot;: &quot;判读&quot;, &quot;start&quot;: 6.0, &quot;end&quot;: 7.5, &quot;caption&quot;: &quot;小压差只是线索；核前提、算误差、再看输出响应&quot;}]}</metadata>
<!-- 节拍：认脚、量V-、量V+、算压差、判读；总时长 7.5s；单次播放 -->

<defs>
