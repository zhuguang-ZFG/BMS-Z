<text x="412" y="192" font-size="11.5" font-weight="bold" fill="#a4630f">② 增益放大它</text><text x="412" y="217" font-size="14.5" font-weight="bold" fill="#16202b">Cin = (1+A)·Cgd</text><text x="412" y="234" font-size="10.5" fill="#5b666f">A=100 → 1010pF</text><rect x="400" y="168" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.25;0.28;1" dur="14s" repeatCount="indefinite"/></rect>
<text x="412" y="250" font-size="11.5" font-weight="bold" fill="#a4630f">③ 后果</text><text x="412" y="275" font-size="14.5" font-weight="bold" fill="#16202b">输入极点被拖低</text><text x="412" y="292" font-size="10.5" fill="#5b666f">带宽先死在输入端</text><rect x="400" y="226" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.5;0.53;1" dur="14s" repeatCount="indefinite"/></rect>
