    <animate calcMode="spline" keySplines="0.42 0 0.58 1;0.7 0 0.84 0;0.16 1 0.3 1" attributeName="y" values="190;190;158;190" keyTimes="0;0.5;0.85;1" dur="8s" repeatCount="indefinite" />
  </rect>
  <text x="519" y="268" text-anchor="middle" font-size="12" class="txt">高节</text>
