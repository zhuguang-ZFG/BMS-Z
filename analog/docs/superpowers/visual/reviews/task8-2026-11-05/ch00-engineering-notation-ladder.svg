<line x1="110" y1="872" x2="110" y2="388" stroke="#c4b9ab" stroke-width="3" stroke-dasharray="" /><polygon points="110,388 103.0,401.0 117.0,401.0" fill="#c4b9ab" /></g><g id="technical-overlay"><text x="72" y="92" fill="#2a2927" font-size="50" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">词头是一条十进阶梯</text>
<text x="74" y="146" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">把数字挪到 1–999 再挂词头；大小写读错一个字母，数量级就错。</text>
<text x="232" y="832" fill="#2a2927" font-size="34" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">皮 p</text>
<text x="1226" y="832" fill="#2a2927" font-size="34" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="end" data-background="#f6f2ed">10^-12</text>
<text x="232" y="868" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">1 pF 寄生电容</text>
<text x="226" y="736" fill="#2a2927" font-size="34" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#efe7dc">纳 n</text>
<text x="1232" y="736" fill="#2a2927" font-size="34" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="end" data-background="#efe7dc">10^-9</text>
<text x="226" y="772" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#efe7dc">100 nF 去耦电容</text>
<text x="220" y="640" fill="#2a2927" font-size="34" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">微 µ</text>
<text x="1238" y="640" fill="#2a2927" font-size="34" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="end" data-background="#f6f2ed">10^-6</text>
<text x="220" y="676" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">2.2 µF；mF 看成 µF 差三个数量级</text>
<text x="214" y="544" fill="#2a2927" font-size="34" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#efe7dc">毫 m</text>
<text x="1244" y="544" fill="#2a2927" font-size="34" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="end" data-background="#efe7dc">10^-3</text>
<text x="214" y="580" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#efe7dc">10 mA；m 与 M 差十亿倍</text>
<text x="208" y="448" fill="#2a2927" font-size="34" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">千 k</text>
<text x="1250" y="448" fill="#2a2927" font-size="34" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="end" data-background="#f6f2ed">10^3</text>
<text x="208" y="484" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">4.7 kΩ；先换 10^n 再算</text>
<text x="202" y="352" fill="#2a2927" font-size="34" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#efe7dc">兆 M</text>
<text x="1256" y="352" fill="#2a2927" font-size="34" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="end" data-background="#efe7dc">10^6</text>
<text x="202" y="388" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#efe7dc">1 MΩ；写成 mΩ 行为相反</text>
<text x="196" y="256" fill="#2a2927" font-size="34" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">吉 G</text>
<text x="1262" y="256" fill="#a4441d" font-size="34" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="end" data-background="#f6f2ed">10^9</text>
<text x="196" y="292" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">1 GΩ 绝缘电阻</text>
