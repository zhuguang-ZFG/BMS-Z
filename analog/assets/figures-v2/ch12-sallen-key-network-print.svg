<path d="M300 270 L360 270" fill="none" stroke="#16202b" stroke-width="3"/>
<path d="M360 270 L375 270" fill="none" stroke="#16202b" stroke-width="3"/><rect x="375" y="258" width="65" height="24" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/><path d="M440 270 L455 270" fill="none" stroke="#16202b" stroke-width="3"/><text x="407" y="242" font-size="23" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">R2</text>
<path d="M455 270 L540 270" fill="none" stroke="#16202b" stroke-width="3"/>
