<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 570" width="800" height="570" role="img" aria-label="EKF 六个矩阵围绕第 0 拍算例的分工：A B C 先决定预测怎样走，P Q R 再决定这一次更新敢改多少">
  <title>第 0 拍里的六个矩阵</title>
  <desc>同一拍分两段：第一段 A、B、C 把 SOC 从 0.700000 按电流推到 0.699861；第二段 P、Q、R 决定 +84.404 毫伏的新息该把估计改到多少，更新后为 0.802520，这一拍真值 0.799854。六个矩阵各自回答的问题与本章默认值写在左右卡片上。</desc>
  <style>
    .bg { fill: #fffdf5; }
    .ink { fill: #293b3a; }
    .muted { fill: #626d65; }
    .model { fill: #e4f0df; stroke: #377b60; }
    .uncertainty { fill: #fbefc7; stroke: #926717; }
    .center { fill: #eee5f1; stroke: #7c648e; }
    .card { stroke-width: 2.2; }
    .title { font: 700 18px "Noto Sans SC", "Microsoft YaHei", sans-serif; }
    .head { font: 700 15px "Noto Sans SC", "Microsoft YaHei", sans-serif; }
    .body { font: 13px "Noto Sans SC", "Microsoft YaHei", sans-serif; }
    .small { font: 12px "Noto Sans SC", "Microsoft YaHei", sans-serif; }
    .mono { font: 13px ui-monospace, Consolas, monospace; }
    .green-text { fill: #36775e; }
    .gold-text { fill: #8e6518; }
    .purple-text { fill: #736085; }
    .red-text { fill: #ad4644; }
    .flow-dot { fill: #926717; }
    .sketch { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #192727; }
      .ink { fill: #edf0e5; }
      .muted { fill: #b0beb3; }
      .model { fill: #293f35; stroke: #8fc7a2; }
      .uncertainty { fill: #453e2b; stroke: #dfbd78; }
      .center { fill: #392f40; stroke: #c3a8cf; }
      .green-text { fill: #8fc7a2; }
      .gold-text { fill: #dfbd78; }
      .purple-text { fill: #d4bde0; }
      .red-text { fill: #f39b91; }
      .flow-dot { fill: #dfbd78; }
    }
  </style>
  <style id="bms-motion">
    /* bms-motion: 两段式强调（预测段 / 更新段），全部为叠加装饰，不动既有几何与数字 */
    .bms-marker { fill: #fbefc7; opacity: .78; }
    .bms-under { fill: none; stroke: #926717; stroke-width: 2.4; stroke-linecap: round; opacity: .9; }
    .bms-spark-line { fill: none; stroke: #926717; stroke-width: 1.9; stroke-linecap: round; }
    .bms-spark-fill { fill: #926717; }
    .bms-spark-soft { fill: #176b73; opacity: .8; }
    .bms-sticker { fill: none; stroke: #926717; stroke-width: 2; stroke-dasharray: 7 5; stroke-linecap: round; opacity: .85; }
    .bms-halo { fill: none; stroke: #926717; stroke-width: 2; }
    .bms-glow-model { fill: none; stroke: #377b60; stroke-width: 3; }
    .bms-glow-unc { fill: none; stroke: #926717; stroke-width: 3; }
    .bms-row { fill: #7c648e; fill-opacity: .22; }
    .bms-marker, .bms-under, .bms-sticker, .bms-halo,
    .bms-glow-model, .bms-glow-unc, .bms-row,
    .bms-spark, .bms-doodle { pointer-events: none; }
    circle:has(> animateMotion) { filter: drop-shadow(0 0 2px rgba(146,103,23,.5)) drop-shadow(0 0 5px rgba(196,145,52,.45)); }
    @media (prefers-color-scheme: dark) {
      .bms-marker { fill: #453e2b; opacity: .85; }
      .bms-under { stroke: #dfbd78; }
      .bms-spark-line { stroke: #dfbd78; }
      .bms-spark-fill { fill: #dfbd78; }
      .bms-spark-soft { fill: #7ec5c5; }
      .bms-sticker { stroke: #dfbd78; }
      .bms-halo { stroke: #dfbd78; }
      .bms-glow-model { stroke: #8fc7a2; }
      .bms-glow-unc { stroke: #dfbd78; }
      .bms-row { fill: #d4bde0; }
      circle:has(> animateMotion) { filter: drop-shadow(0 0 2px rgba(223,189,120,.8)) drop-shadow(0 0 7px rgba(223,189,120,.9)); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bms-doodle { display: none; }
      .bms-row, .bms-glow-model, .bms-glow-unc { display: none; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#626d65"/>
    </marker>
  </defs>

  <rect class="bg" width="800" height="570"/>
  <rect class="bms-marker" aria-hidden="true" x="20.0" y="17.0" width="342.0" height="17.5" rx="3.8" transform="rotate(-.5 20.0 25.8)"/>
  <path d="M24 39 C122 33 219 44 318 36" class="sketch" stroke="#176b73" stroke-width="3" opacity=".8"/>
  <text x="24" y="32" class="title ink">六个矩阵，都在回答一个朴素问题</text>
  <text x="24" y="58" class="body muted">A、B、C 说明模型怎样走；P、Q、R 说明这一步该有多谨慎。</text>

  <!-- 装饰：两种手帐小星，仅标示「现在轮到哪一段」 -->
  <g class="bms-doodle" aria-hidden="true" transform="translate(240.0 74.0)"><animateTransform attributeName="transform" type="rotate" values="-6;7;-6" keyTimes="0;0.5;1" dur="5.4s" repeatCount="indefinite" additive="sum"/><animate attributeName="opacity" values="0.62;1;0.62" keyTimes="0;0.5;1" dur="3.6s" repeatCount="indefinite"/><path class="bms-spark-fill" d="M0 -8 L2.1 -2.1 L8 0 L2.1 2.1 L0 8 L-2.1 2.1 L-8 0 L-2.1 -2.1 Z"/></g>
  <g class="bms-doodle" aria-hidden="true" transform="translate(530.0 74.0)"><animateTransform attributeName="transform" type="rotate" values="5;-4;5" keyTimes="0;0.5;1" dur="6.2s" repeatCount="indefinite" additive="sum"/><animate attributeName="opacity" values="0.62;1;0.62" keyTimes="0;0.5;1" dur="4.1s" repeatCount="indefinite"/><path class="bms-spark-fill" d="M0 -7 L1.9 -1.9 L7 0 L1.9 1.9 L0 7 L-1.9 1.9 L-7 0 L-1.9 -1.9 Z"/></g>

  <g transform="translate(24 92)">
    <rect width="218" height="118" rx="13" class="model card"/>
    <text x="14" y="31" class="head green-text">A · 状态自己怎么走</text>
    <text x="14" y="60" class="body ink">SOC 一拍内近似不变</text>
    <text x="14" y="84" class="body ink">极化按 τ 衰减</text>
    <text x="14" y="106" class="small muted">diag(1, e^(−Δt/τ))</text>
  </g>
  <g transform="translate(24 226)">
    <rect width="218" height="118" rx="13" class="model card"/>
    <text x="14" y="31" class="head green-text">B · 电流把状态推多少</text>
    <text x="14" y="60" class="body ink">容量决定 SOC 步长</text>
    <text x="14" y="84" class="body ink">R₁、τ 决定极化步长</text>
    <text x="14" y="106" class="small muted">Δt/(3600Qcap)</text>
  </g>
  <g transform="translate(24 360)">
    <rect width="218" height="118" rx="13" class="model card"/>
    <text x="14" y="31" class="head green-text">C · 电压能看见什么</text>
    <text x="14" y="60" class="body ink">SOC 靠 dOCV/dSOC 被看见</text>
    <text x="14" y="84" class="body ink">极化电压直接进入端电压</text>
    <text x="14" y="106" class="small muted">[dOCV/dSOC, 1]</text>
  </g>

  <g transform="translate(558 92)">
    <rect width="218" height="118" rx="13" class="uncertainty card"/>
    <text x="14" y="31" class="head gold-text">P · 我现在多不确定</text>
    <text x="14" y="60" class="body ink">初始 SOC 标准差 10 个百分点</text>
    <text x="14" y="84" class="body ink">极化标准差 10 mV</text>
    <text x="14" y="106" class="small muted">diag(1e−2, 1e−4)</text>
  </g>
  <g transform="translate(558 226)">
    <rect width="218" height="118" rx="13" class="uncertainty card"/>
    <text x="14" y="31" class="head gold-text">Q · 每拍新增多少不确定</text>
    <text x="14" y="60" class="body ink">模型没写全的部分</text>
    <text x="14" y="84" class="body ink">随预测一起加进 P</text>
    <text x="14" y="106" class="small muted">diag(2e−6, 1e−7)</text>
  </g>
  <g transform="translate(558 360)">
    <rect width="218" height="118" rx="13" class="uncertainty card"/>
    <text x="14" y="31" class="head gold-text">R · 电压表有多吵</text>
    <text x="14" y="60" class="body ink">测量标准差约 5 mV</text>
    <text x="14" y="84" class="body ink">填入的是方差，不是标准差</text>
    <text x="14" y="106" class="small muted">2.5e−5 V²</text>
  </g>

  <rect class="bms-glow-model" aria-hidden="true" x="18" y="86" width="230" height="398" rx="18" opacity="0">
    <animate attributeName="opacity" values="0;0.85;0.85;0;0" keyTimes="0;0.04;0.22;0.28;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <rect class="bms-glow-unc" aria-hidden="true" x="552" y="86" width="230" height="398" rx="18" opacity="0">
    <animate attributeName="opacity" values="0;0;0.85;0.85;0;0" keyTimes="0;0.28;0.32;0.52;0.58;1" dur="12s" repeatCount="indefinite"/>
  </rect>

  <g stroke="#626d65" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M242 151 C252 151 258 176 268 190"/>
    <path d="M242 285 L268 285"/>
    <path d="M242 419 C252 419 258 394 268 380"/>
    <path d="M558 151 C548 151 542 176 532 190"/>
    <path d="M558 285 L532 285"/>
    <path d="M558 419 C548 419 542 394 532 380"/>
  </g>

  <!-- 预测段：A、B、C 一侧的点流向中央算例 -->
  <circle class="flow-dot" r="5" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.20;0.25;1" dur="12s" repeatCount="indefinite"/>
    <animateMotion dur="1.5s" begin="0.5s;12.5s" fill="remove" path="M242 151 C252 151 258 176 268 190"/>
  </circle>
  <circle class="flow-dot" r="5" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.09;0.21;0.26;1" dur="12s" repeatCount="indefinite"/>
    <animateMotion dur="1.5s" begin="0.9s;12.9s" fill="remove" path="M242 285 L268 285"/>
  </circle>
  <circle class="flow-dot" r="5" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.13;0.22;0.27;1" dur="12s" repeatCount="indefinite"/>
    <animateMotion dur="1.5s" begin="1.3s;13.3s" fill="remove" path="M242 419 C252 419 258 394 268 380"/>
  </circle>
  <!-- 更新段：P、Q、R 一侧的点流向中央算例 -->
  <circle class="flow-dot" r="5" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.37;0.46;0.50;1" dur="12s" repeatCount="indefinite"/>
    <animateMotion dur="1.5s" begin="4.0s;16.0s" fill="remove" path="M558 151 C548 151 542 176 532 190"/>
  </circle>
  <circle class="flow-dot" r="5" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.37;0.40;0.48;0.52;1" dur="12s" repeatCount="indefinite"/>
    <animateMotion dur="1.5s" begin="4.4s;16.4s" fill="remove" path="M558 285 L532 285"/>
  </circle>
  <circle class="flow-dot" r="5" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.41;0.44;0.50;0.54;1" dur="12s" repeatCount="indefinite"/>
    <animateMotion dur="1.5s" begin="4.8s;16.8s" fill="remove" path="M558 419 C548 419 542 394 532 380"/>
  </circle>

  <rect x="268" y="144" width="264" height="286" rx="20" class="center card"/>

  <rect class="bms-row" aria-hidden="true" x="284" y="197" width="232" height="24" rx="6" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0.9;0;0" keyTimes="0;0.04;0.22;0.28;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <rect class="bms-row" aria-hidden="true" x="284" y="244" width="232" height="24" rx="6" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0.9;0;0" keyTimes="0;0.04;0.22;0.28;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <rect class="bms-row" aria-hidden="true" x="284" y="278" width="232" height="24" rx="6" opacity="0">
    <animate attributeName="opacity" values="0;0;0.9;0.9;0;0" keyTimes="0;0.30;0.33;0.44;0.48;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <rect class="bms-row" aria-hidden="true" x="284" y="312" width="232" height="24" rx="6" opacity="0">
    <animate attributeName="opacity" values="0;0;0.9;0.9;0;0" keyTimes="0;0.44;0.47;0.56;0.60;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <rect class="bms-row" aria-hidden="true" x="284" y="346" width="232" height="24" rx="6" opacity="0">
    <animate attributeName="opacity" values="0;0;0.9;0.9;0;0" keyTimes="0;0.60;0.64;0.72;0.78;1" dur="12s" repeatCount="indefinite"/>
  </rect>

  <text x="400" y="178" text-anchor="middle" class="head purple-text">贯穿算例 · 第 0 拍</text>
  <text x="284" y="215" class="small muted">开始估计</text>
  <text x="512" y="215" text-anchor="end" class="mono ink">SOC = 0.700000</text>
  <path d="M298 229 C380 224 450 233 506 227" class="sketch" stroke="#7c648e" stroke-width="2" opacity=".65"/>

  <text x="284" y="262" class="small muted">电流预测后</text>
  <text x="512" y="262" text-anchor="end" class="mono ink">0.699861</text>
  <text x="284" y="296" class="small muted">电压新息</text>
  <text x="512" y="296" text-anchor="end" class="mono red-text">+84.404 mV</text>
  <text x="284" y="330" class="small muted">更新后</text>
  <text x="512" y="330" text-anchor="end" class="mono purple-text">0.802520</text>
  <text x="284" y="364" class="small muted">这一拍真值</text>
  <text x="512" y="364" text-anchor="end" class="mono ink">0.799854</text>

  <rect x="284" y="386" width="232" height="28" rx="7" fill="#f6e2df" stroke="#b84745" stroke-width="1.5"/>
  <text x="400" y="405" text-anchor="middle" class="small red-text">10 个百分点初值误差，一拍基本拉回</text>

  <path d="M52 525 C216 532 374 517 537 527 S686 530 748 523" class="sketch" stroke="#926717" stroke-width="2.3" stroke-dasharray="8 6" opacity=".75"/>
  <text x="400" y="552" text-anchor="middle" class="body muted">先记住这张图，再读公式：矩阵只是把六个问题写成可计算的形式。</text>
</svg>
