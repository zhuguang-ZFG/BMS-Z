<text x="709" y="134" text-anchor="middle" font-size="9.5" fill="#5b666f">+100nF 就近去耦</text>
<g filter="url(#pglow)"><circle r="4.5" fill="#e4f1f3"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M534,118 H650" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle>
