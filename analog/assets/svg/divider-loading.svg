<text x="452" y="342" font-size="11" font-weight="bold" fill="#a8321f">接上负载：突然变矮</text>
<path d="M112,180 L112,308" stroke="#a8321f" stroke-width="3" fill="none" stroke-dasharray="6,5" opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.19;0.23;0.4;0.45;1" dur="8s" repeatCount="indefinite"/></path>
<polygon points="106,302 112,310 118,302" fill="#a8321f" opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.19;0.23;0.4;0.45;1" dur="8s" repeatCount="indefinite"/></polygon>
<rect x="270" y="320" width="60" height="16" fill="#a8321f" rx="3" opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.19;0.23;0.4;0.45;1" dur="8s" repeatCount="indefinite"/></rect>
<text x="300" y="332" text-anchor="middle" font-size="11" font-weight="bold" fill="#fdf8ea" opacity="0">33%
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.19;0.23;0.4;0.45;1" dur="8s" repeatCount="indefinite"/></text>
<text x="245" y="470" text-anchor="middle" font-size="12" font-weight="bold" fill="#a4630f" opacity="0">Vout = 12 × 5k / (10k + 5k) = 4V
<animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;0.21;0.24;0.28;0.4;0.45;1" dur="8s" repeatCount="indefinite"/></text>
<circle r="5.5" fill="#a4630f">
<animateMotion dur="8s" repeatCount="indefinite" path="M175,150 L135,150 L135,248" keyPoints="0;1" keyTimes="0;1"/></circle>
<circle r="5.5" fill="#a4630f">
<animateMotion dur="8s" repeatCount="indefinite" path="M135,308 L135,348" keyPoints="0;1" keyTimes="0;1"/></circle>
<circle r="5.5" fill="#a4630f">
<animateMotion dur="8s" repeatCount="indefinite" path="M135,408 L135,430" keyPoints="0;1" keyTimes="0;1"/></circle>
<path d="M410 70 Q410.48 283.00 410 496" fill="none" stroke="#c9bb9d" stroke-width="1" stroke-dasharray="6,5"/>
<text x="600" y="52" text-anchor="middle" font-size="14" font-weight="bold" fill="#37424e">算式：Vout = 12 × R2/(R1+R2)</text>
<text x="440" y="100" font-size="13" font-weight="bold" fill="#1f5d7a">第一步 先算「下面那坨」的总电阻</text>
<text x="456" y="126" font-size="12" fill="#5b666f">R下 = R2 ∥ RL = 10k ∥ 10k = 5k</text>
<text x="440" y="164" font-size="13" font-weight="bold" fill="#1f5d7a">第二步 再用分压公式</text>
<text x="456" y="190" font-size="12" fill="#5b666f">Vout = 12V × 5k / (10k + 5k) = 4V</text>
<path d="M440 212 Q610.00 212.83 780 212" fill="none" stroke="#c9bb9d" stroke-width="1"/>
<rect x="452" y="230" width="96" height="26" fill="#1f5d7a" rx="4"/>
<text x="500" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#fdf8ea">蓝色 6V</text>
<text x="566" y="249" font-size="12" fill="#5b666f">按 50% 白算的那份（错）</text>
<path d="M440 282 Q610.00 281.85 780 282" fill="none" stroke="#c9bb9d" stroke-width="1"/>
<rect x="452" y="298" width="55" height="26" fill="#a8321f" rx="4"/>
<text x="479" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#fdf8ea">红色 4V</text>
<text x="520" y="317" font-size="12" fill="#5b666f">带载后的真实值（少了 33%）</text>
<text x="440" y="358" font-size="12.5" font-weight="bold" fill="#a4630f">结论：分压器输出的不是「电压」，是「比值」——</text>
<text x="440" y="380" font-size="12.5" fill="#5b666f">背后接什么，它就跟着变。要稳，就得把源阻抗压下去。</text>
<text x="440" y="424" font-size="12.5" font-weight="bold" fill="#3d6b4a">三条活路：</text>
<text x="456" y="446" font-size="12" fill="#5b666f">① 后级输入阻抗 ≫ R2（如 1MΩ 的 ADC 输入）</text>
<text x="456" y="468" font-size="12" fill="#5b666f">② R1/R2 取小（10k→1k）：但静态电流和功耗上去了</text>
<text x="456" y="490" font-size="12" fill="#5b666f">③ 后面跟一级运放缓冲（第 12 章）——教科书答案</text>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.04;0.2;0.25;1" dur="8s" repeatCount="indefinite"/><rect x="171.8" y="498.9" width="456.4" height="24.1" rx="12.0" fill="#1f5d7a" fill-opacity="0.09" stroke="#1f5d7a" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.2;0.25;1" dur="8s" repeatCount="indefinite"/></rect><text x="400" y="512" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1f5d7a" opacity="0">① 空载：R1、R2 各分一半——Vout = 6V，指针稳稳停在正中<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.2;0.25;1" dur="8s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.42;0.47;0.7;0.76;1" dur="8s" repeatCount="indefinite"/><rect x="136.7" y="498.9" width="526.7" height="24.1" rx="12.0" fill="#a8321f" fill-opacity="0.09" stroke="#a8321f" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.42;0.47;0.7;0.76;1" dur="8s" repeatCount="indefinite"/></rect><text x="400" y="512" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#a8321f" opacity="0">② 挂上 RL=10k：R2∥RL 只剩 5k——Vout 塌到 4V，指针矮了三分之一<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.42;0.47;0.7;0.76;1" dur="8s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.78;0.84;1" dur="8s" repeatCount="indefinite"/><rect x="170.6" y="498.9" width="458.8" height="24.1" rx="12.0" fill="#3d6b4a" fill-opacity="0.09" stroke="#3d6b4a" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.78;0.84;1" dur="8s" repeatCount="indefinite"/></rect><text x="400" y="512" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#3d6b4a" opacity="0">③ 分压比会跟着负载变：要稳，就把源阻抗压到远小于负载阻抗<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.78;0.84;1" dur="8s" repeatCount="indefinite"/></text></g><g opacity="0">
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.88;0.92;1" dur="8s" repeatCount="indefinite"/>
<rect x="15" y="534" width="770" height="34.0" rx="9" fill="#e8efe6" stroke="#3d6b4a" stroke-width="1.5" filter="url(#soft)"/><rect x="21" y="541" width="3" height="20.0" rx="1.5" fill="#3d6b4a"/><text x="400" y="556.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3d6b4a">分压器是阻抗问题：算之前先问一句「它后面接什么」——Vout = Vin × R下 / (R上 + R下)</text>
</g></svg>