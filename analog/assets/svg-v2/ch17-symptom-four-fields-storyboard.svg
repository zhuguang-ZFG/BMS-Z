<text x="32" y="984" font-size="12" font-weight="bold" fill="#3d6b4a">6. 四空全满</text>
<text x="24" y="1036" font-size="22" fill="#16202b">1. 症状卡：5V 输出只有 3.1V，纹波 400mV——先别动烙铁</text>
<text x="24" y="1066" font-size="22" fill="#16202b">2. 偏离多少：5V→3.1V，差 1.9V（38%）</text>
<text x="24" y="1096" font-size="22" fill="#16202b">3. 从何时开始：一上电就低，还是带载才低</text>
<text x="24" y="1126" font-size="22" fill="#16202b">4. 发生多常：偶发还是稳定复现——复现才有对照</text>
<text x="24" y="1156" font-size="22" fill="#16202b">5. 最后改了什么：换线/换负载/换器件，逐项改回试</text>
<text x="24" y="1186" font-size="22" fill="#16202b">6. 四空填满才许动烙铁——症状先记录，动手后没法补</text>
</svg>
