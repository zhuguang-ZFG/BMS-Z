  after: 图中两候选假设为 A：$e_n=5nV/\sqrt{Hz},i_n=1pA/\sqrt{Hz}$；B：$e_n=20nV/\sqrt{Hz},i_n=1fA/\sqrt{Hz}$。这些是说明权重变化的参数，不是输入器件家族规格。**源阻升高时，哪一项先使实线超过虚线？**
