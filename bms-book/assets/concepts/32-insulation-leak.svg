<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">绝缘检测在等一滴漏电流</title>
  <desc id="desc">高压电池包架在两只陶瓷裙边绝缘支架上，外壳裂缝渗出一滴蓝绿色漏电流，沿虚线流向底盘；蓝色感应环守在路径旁，引线连到一只无刻度表头。无文字无数字。</desc>
  <defs>
