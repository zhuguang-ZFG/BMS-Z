text[fill="#6b3f63"]{fill:#c4a2bf}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#6b3f63"]{fill:#452c40}
[stroke="#6b3f63"]{stroke:#a17c9b}
}
</style>

<text x="36" y="36" font-size="24" fill="#2a2927" text-anchor="start">① 固定偏置 / ② 分压反馈：同轴比较</text>
<line x1="100" y1="330" x2="620" y2="330" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><text x="645" y="360" font-size="20" fill="#2a2927" text-anchor="start">β</text><line x1="100" y1="330" x2="600" y2="330" stroke="#5b666f" stroke-width="1" stroke-dasharray="3 5"/><text x="88" y="336" font-size="18" fill="#2a2927" text-anchor="end">0</text><line x1="100" y1="228" x2="600" y2="228" stroke="#5b666f" stroke-width="1" stroke-dasharray="3 5"/><text x="88" y="234" font-size="18" fill="#2a2927" text-anchor="end">3</text><line x1="100" y1="126" x2="600" y2="126" stroke="#5b666f" stroke-width="1" stroke-dasharray="3 5"/><text x="88" y="132" font-size="18" fill="#2a2927" text-anchor="end">6</text><text x="100" y="358" font-size="18" fill="#2a2927" text-anchor="middle">100</text><text x="300" y="358" font-size="18" fill="#2a2927" text-anchor="middle">300</text><text x="600" y="358" font-size="18" fill="#2a2927" text-anchor="middle">600</text><text x="36" y="110" font-size="18" fill="#2a2927" text-anchor="start">IC / mA</text>
