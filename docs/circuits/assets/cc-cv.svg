    <animate attributeName="stroke-dashoffset" values="1000;0;0" keyTimes="0;0.82;1" dur="8s" repeatCount="indefinite" />
  </path>

  
  <path d="M60.0 180.0 L380.0 180.0 L390.0 193.2 L400.0 205.2 L410.0 216.1 L420.0 226.0 L430.0 235.1 L440.0 243.3 L450.0 250.8 L460.0 257.7 L470.0 263.9 L480.0 269.6 L490.0 274.7 L500.0 279.4 L510.0 283.7 L520.0 287.6 L530.0 291.2 L540.0 294.4 L550.0 297.4 L560.0 300.0 L570.0 302.5 L580.0 304.7 L590.0 306.7 L600.0 308.6 L610.0 310.3 L620.0 311.8 L630.0 313.2 L640.0 314.4 L650.0 315.6 L660.0 316.7 L670.0 317.6 L680.0 318.5 L690.0 319.3 L700.0 320.0 L740.0 320.0" fill="none" stroke-width="4" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000" class="stroke-y">
    <animate attributeName="stroke-dashoffset" values="1000;0;0" keyTimes="0;0.82;1" dur="8s" repeatCount="indefinite" />
  </path>

  
  <circle r="8" stroke-width="2" class="fill-b stroke-check">
    <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0.5166;1;1" keyTimes="0;0.40;0.88;1" path="M60.0 312.8 L70.0 311.1 L80.0 309.2 L90.0 307.3 L100.0 305.2 L110.0 303.0 L120.0 300.6 L130.0 298.1 L140.0 295.3 L150.0 292.4 L160.0 289.2 L170.0 285.9 L180.0 282.3 L190.0 278.4 L200.0 274.3 L210.0 269.9 L220.0 265.1 L230.0 260.0 L240.0 254.6 L250.0 248.8 L260.0 242.5 L270.0 235.8 L280.0 228.7 L290.0 221.0 L300.0 212.8 L310.0 203.9 L320.0 194.5 L330.0 184.4 L340.0 173.6 L350.0 162.0 L360.0 149.6 L370.0 136.3 L380.0 122.0 L740.0 122.0" />
  </circle>
  <circle r="7" stroke-width="2" class="fill-y stroke-check">
    <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0.4427;1;1" keyTimes="0;0.40;0.82;1" path="M60.0 180.0 L380.0 180.0 L390.0 193.2 L400.0 205.2 L410.0 216.1 L420.0 226.0 L430.0 235.1 L440.0 243.3 L450.0 250.8 L460.0 257.7 L470.0 263.9 L480.0 269.6 L490.0 274.7 L500.0 279.4 L510.0 283.7 L520.0 287.6 L530.0 291.2 L540.0 294.4 L550.0 297.4 L560.0 300.0 L570.0 302.5 L580.0 304.7 L590.0 306.7 L600.0 308.6 L610.0 310.3 L620.0 311.8 L630.0 313.2 L640.0 314.4 L650.0 315.6 L660.0 316.7 L670.0 317.6 L680.0 318.5 L690.0 319.3 L700.0 320.0 L740.0 320.0" />
  </circle>

  
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.40;0.46;1" dur="8s" repeatCount="indefinite" />
    <rect x="150" y="230" width="260" height="56" rx="8" class="fill-boxb stroke-b" />
    <text x="280" y="254" text-anchor="middle" font-size="15" font-weight="bold" class="hi">恒流 CC 段</text>
    <text x="280" y="274" text-anchor="middle" font-size="13" class="hi">大电流恒定输入，电压快速上升</text>
  </g>

  
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.42;0.48;0.82;0.88;1" dur="8s" repeatCount="indefinite" />
    <rect x="440" y="130.0" width="280" height="56" rx="8" class="fill-boxy stroke-y" />
    <text x="580" y="154.0" text-anchor="middle" font-size="15" font-weight="bold" class="gold">恒压 CV 段</text>
    <text x="580" y="174.0" text-anchor="middle" font-size="13" class="gold">电压顶住 4.2V，电流自然衰减</text>
  </g>

  
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.80;0.86;0.96;1" dur="8s" repeatCount="indefinite" />
    <circle cx="700" cy="290" r="18" class="fill-g" />
    <path d="M691,290 l6,7 l12,-13" stroke-width="3" fill="none" stroke-linecap="round" class="stroke-check" />
    <text x="700" y="262" text-anchor="middle" font-size="14" font-weight="bold" class="ok">电流≤0.05C → 判充满</text>
  </g>

  
  <text x="400" y="416" text-anchor="middle" font-size="14" class="small">关键：电压到 4.2V ≠ 充满，必须等 CV 段电流衰减到截止值</text>

  <rect x="40" y="430" width="720" height="78" rx="8" class="panel" />
  <text x="56" y="456" font-size="14" class="txt">示意 2 Ah：1C=2 A 恒流大约灌进 1.6 Ah；恒压段从 2 A 收到 0.1 A（0.05C），再灌进约 0.3 Ah。</text>
  

</svg>