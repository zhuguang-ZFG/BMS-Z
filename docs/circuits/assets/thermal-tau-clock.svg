  <polyline class="curve" points="84,336.0 91.4,333.5 98.9,331.3 106.3,329.2 113.8,327.3 121.2,325.5 128.7,323.8 136.1,322.2 143.6,320.7 151.0,319.3 158.5,318.0 165.9,316.8 173.4,315.6 180.8,314.5 188.3,313.5 195.7,312.6 203.2,311.7 210.6,310.9 218.1,310.1 225.5,309.4 233.0,308.7 240.4,308.0 247.9,307.4 255.3,306.8 262.8,306.2 270.2,305.7 277.7,305.2 285.1,304.7 292.6,304.3 300.0,303.9" stroke-dasharray="230" stroke-dashoffset="230">
    <animate attributeName="stroke-dashoffset" values="230;230;0;0" keyTimes="0;0.14;0.44;1" dur="12s" repeatCount="indefinite"/>
  </polyline>
  <polyline class="curve" points="300.0,303.9 307.5,303.5 314.9,303.1 322.4,302.7 329.8,302.3 337.3,302.0 344.7,301.6 352.2,301.3 359.6,301.0 367.1,300.7 374.5,300.4 382.0,300.1 389.4,299.9 396.9,299.6 404.3,299.4 411.8,299.1 419.2,298.9 426.7,298.7 434.1,298.5 441.6,298.3 449.0,298.1 456.5,297.9 463.9,297.7 471.4,297.6 478.8,297.4 486.3,297.2 493.7,297.1 501.2,296.9 508.6,296.8 516.1,296.6" stroke-dasharray="230" stroke-dashoffset="230">
    <animate attributeName="stroke-dashoffset" values="230;230;0;0" keyTimes="0;0.44;0.66;1" dur="12s" repeatCount="indefinite"/>
  </polyline>
  <polyline class="curve" points="516.1,296.6 523.5,296.5 531.0,296.4 538.4,296.3 545.9,296.2 553.3,296.1 560.8,296.0 568.2,295.9 575.7,295.8 583.1,295.7 590.6,295.7 598.0,295.6 605.5,295.5 612.9,295.4 620.4,295.4 627.8,295.3 635.3,295.3 642.7,295.2 650.2,295.1 657.6,295.1 665.1,295.0 672.5,295.0 680.0,294.9 687.4,294.9 694.9,294.8 702.3,294.8 709.8,294.8 717.2,294.7 724.7,294.7 732.1,294.6 739.6,294.6 747.0,294.6" stroke-dasharray="240" stroke-dashoffset="240">
    <animate attributeName="stroke-dashoffset" values="240;240;0;0" keyTimes="0;0.66;0.92;1" dur="12s" repeatCount="indefinite"/>
  </polyline>

  <!-- τ 节拍点与标注（数字与静态图逐字一致） -->
  <line class="grid" x1="300" y1="336" x2="300" y2="303.9"/>
  <circle class="tick" cx="300" cy="303.9" r="4"/>
  <text class="ticktext" x="294" y="291.9" text-anchor="end">63.2%</text>
  <text class="small" x="300" y="360" text-anchor="middle">τ = 120 s</text>
  <line class="grid" x1="516" y1="336" x2="516" y2="296.6"/>
  <circle class="tick" cx="516" cy="296.6" r="4"/>
  <text class="ticktext" x="510" y="284.6" text-anchor="end">86.5%</text>
  <text class="small" x="516" y="360" text-anchor="middle">2τ = 240 s</text>
  <circle class="bms-halo" aria-hidden="true" cx="516" cy="296.6" r="9"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.62;0.70;0.80;1" dur="12s" repeatCount="indefinite"/></circle>
  <line class="grid" x1="732" y1="336" x2="732" y2="294.7"/>
  <circle class="tick" cx="732" cy="294.7" r="4"/>
  <text class="ticktext" x="726" y="282.7" text-anchor="end">95.0%</text>
  <text class="small" x="732" y="360" text-anchor="middle">3τ = 360 s</text>

  <!-- 节拍游点：沿完整曲线走一遍 -->
  <circle class="flow-dot" r="5" aria-hidden="true">
    <animateMotion dur="11s" begin="0.8s" fill="remove" path="M84 336 L91.4 333.5 L98.9 331.3 L106.3 329.2 L113.8 327.3 L121.2 325.5 L128.7 323.8 L136.1 322.2 L143.6 320.7 L151 319.3 L158.5 318 L165.9 316.8 L173.4 315.6 L180.8 314.5 L188.3 313.5 L195.7 312.6 L203.2 311.7 L210.6 310.9 L218.1 310.1 L225.5 309.4 L233 308.7 L240.4 308 L247.9 307.4 L255.3 306.8 L262.8 306.2 L270.2 305.7 L277.7 305.2 L285.1 304.7 L292.6 304.3 L300 303.9 L307.5 303.5 L314.9 303.1 L322.4 302.7 L329.8 302.3 L337.3 302 L344.7 301.6 L352.2 301.3 L359.6 301 L367.1 300.7 L374.5 300.4 L382 300.1 L389.4 299.9 L396.9 299.6 L404.3 299.4 L411.8 299.1 L419.2 298.9 L426.7 298.7 L434.1 298.5 L441.6 298.3 L449 298.1 L456.5 297.9 L463.9 297.7 L471.4 297.6 L478.8 297.4 L486.3 297.2 L493.7 297.1 L501.2 296.9 L508.6 296.8 L516.1 296.6 L523.5 296.5 L531 296.4 L538.4 296.3 L545.9 296.2 L553.3 296.1 L560.8 296 L568.2 295.9 L575.7 295.8 L583.1 295.7 L590.6 295.7 L598 295.6 L605.5 295.5 L612.9 295.4 L620.4 295.4 L627.8 295.3 L635.3 295.3 L642.7 295.2 L650.2 295.1 L657.6 295.1 L665.1 295 L672.5 295 L680 294.9 L687.4 294.9 L694.9 294.8 L702.3 294.8 L709.8 294.8 L717.2 294.7 L724.7 294.7 L732.1 294.6 L739.6 294.6 L747 294.6" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.92;1" dur="12s" repeatCount="indefinite"/>
  </circle>

  <rect class="bms-sticker" aria-hidden="true" x="14" y="380" width="560" height="28" rx="10"><animate attributeName="opacity" values="0;0;.85;.85;0" keyTimes="0;0.90;0.94;1;1" dur="12s" repeatCount="indefinite"/></rect>
  <text class="body" x="20" y="399">τ = R_th·C_th = 120 s；断电降温走同一条指数，只是方向朝下。三个 τ 到 95%。</text>
</svg>
