      circle:has(&gt; animateMotion) { filter: drop-shadow(0 0 2px rgba(223,189,120,.8)) drop-shadow(0 0 7px rgba(223,189,120,.9)); }
      rect:has(&gt; animateMotion) { filter: drop-shadow(0 0 6px rgba(223,189,120,.8)); }
      g:has(&gt; circle):has(&gt; path.stroke-check) { filter: drop-shadow(0 0 6px rgba(143,199,162,.7)); }
    }
    @media (prefers-reduced-motion: reduce) { .bms-spark, .bms-success, .bms-doodle { display: none; } }
</style>
  <!-- formula: Frame(0x01,0x03,bytes([0x0E,0x74])) via code/protocol; garbage 00 11 22; CRC-8/ATM; one bit flip -->
  <rect class="bg" width="800" height="590"/>
  <rect class="bms-marker" aria-hidden="true" x="18.0" y="17.1" width="302.0" height="17.3" rx="3.8" transform="rotate(-.5 18.0 25.8)"/><path class="bms-under" aria-hidden="true" d="M24.0 40.0 q 24.0 -2.4 48.0 0 t 48 0 t 48 0 t 48 0 t 48 0 t 48 0"/><text class="title" x="24" y="32">垃圾前缀后面，好帧还找得回来（示意）</text>
  <rect class="panel" x="24" y="44" width="752" height="124" rx="6"/><g class="bms-doodle" aria-hidden="true" transform="matrix(0.9989171118547928 0.046525301113258394 -0.046525301113258394 0.9989171118547928 746 68)" opacity="1" style="opacity: 1;"><path class="bms-spark-fill" d="M0 -9 L2.3 -2.3 L9 0 L2.3 2.3 L0 9 L-2.3 2.3 L-9 0 L-2.3 -2.3 Z"/></g><g class="bms-doodle" aria-hidden="true" transform="matrix(0.9985091400619244 -0.05458477088709462 0.05458477088709462 0.9985091400619244 710 58)" opacity="0.536364" style="opacity: 0.536364;"><path class="bms-spark-soft" d="M0 -5.5 L1.4 -1.4 L5.5 0 L1.4 1.4 L0 5.5 L-1.4 1.4 L-5.5 0 L-1.4 -1.4 Z"/></g><g class="bms-doodle" aria-hidden="true"><circle class="bms-spark-fill" cx="728.0" cy="77.0" r="1.3"/><circle class="bms-spark-soft" cx="696.0" cy="74.0" r="1.1"/></g>
  <text class="txt" x="40" y="68" opacity="1" style="opacity: 1;">① 帧头<tspan class="small">　教学帧是 AA 55。前面三个垃圾字节先被让开。</tspan></text>
  <text class="txt" x="40" y="92" opacity="1" style="opacity: 1;">② 数据<tspan class="small">　命令 0x03，大端毫伏。这里是 0x0E74 = 3700 mV。</tspan></text>
  <text class="txt" x="40" y="116" opacity="1" style="opacity: 1;">③ CRC-8/ATM<tspan class="small">　盖住地址到数据。对得上，解析器交还一帧。</tspan></text>
  <text class="txt" x="40" y="140" opacity="1" style="opacity: 1;">④ 口诀<tspan class="small">　坏帧要计数。翻一位就对不上，不许静默吞掉。</tspan></text>
  <rect class="panel" x="24" y="180" width="752" height="268" rx="6"/>
  <text class="small" x="40" y="202">完成的好帧数</text>
  <text class="ok" x="180" y="218">绿 好流</text>
  <text class="warn" x="300" y="218">红 翻位后的坏 CRC 计数</text>
  <line class="axis" x1="108.0" y1="248.0" x2="108.0" y2="400.0"/>
  <line class="axis" x1="108.0" y1="400.0" x2="720.0" y2="400.0"/>
  <line class="grid" x1="108.0" y1="400.0" x2="108.0" y2="406.0"/>
  <text class="small" x="108.0" y="422.0" text-anchor="middle">0</text>
  <line class="grid" x1="291.6" y1="400.0" x2="291.6" y2="406.0"/>
  <text class="small" x="291.6" y="422.0" text-anchor="middle">帧头</text>
  <line class="grid" x1="720.0" y1="400.0" x2="720.0" y2="406.0"/>
  <text class="small" x="720.0" y="422.0" text-anchor="middle">末字节</text>
  <line class="grid" x1="102.0" y1="400.0" x2="108.0" y2="400.0"/>
  <text class="small" x="98.0" y="404.0" text-anchor="end">0</text>
  <line class="grid" x1="102.0" y1="273.3" x2="108.0" y2="273.3"/>
  <text class="small" x="98.0" y="277.3" text-anchor="end">1</text>
  <text class="small" x="720" y="444" text-anchor="end">字节序号</text>
  <polyline class="lineg" points="108.0,400.0 169.2,400.0 230.4,400.0 291.6,400.0 352.8,400.0 414.0,400.0 475.2,400.0 536.4,400.0 597.6,400.0 658.8,400.0 720.0,273.3" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline class="liner" points="108.0,400.0 169.2,400.0 230.4,400.0 291.6,400.0 352.8,400.0 414.0,400.0 475.2,400.0 536.4,400.0 597.6,400.0 658.8,400.0 720.0,273.3" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="dotg" r="6" cx="720" cy="273.29998779296875"/>
  <circle class="dotr" r="4" cx="291.6000061035156" cy="400"/>
  <rect class="panel" x="24" y="460" width="752" height="68" rx="6"/>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0" style="opacity: 0;">字节 2 · 值 0x22 · 好帧 0 · 坏 CRC 0（示意）</text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0" style="opacity: 0;">字节 3 · 值 0xAA · 好帧 0 · 坏 CRC 0（示意）</text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0" style="opacity: 0;">字节 9 · 值 0x74 · 好帧 0 · 坏 CRC 0（示意）</text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="1" style="opacity: 1;">字节 10 · 值 0x13 · 好帧 1 · 坏 CRC 1（示意）</text>
  <text class="small" x="24" y="560">帧格式是仓库教学帧，不是某家 BMS。3700 mV 按 code/protocol 的大端约定换算，不是抓包。</text>

</svg>
