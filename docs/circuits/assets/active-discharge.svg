<svg xmlns="http://www.w3.org/2000/svg" width="800" height="660" viewBox="0 -156 800 660" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>接触器断开后母线电容仍有能量。被动泄放很慢，主动放电在数秒内把电压拉到安全值以下。放电完成前不要碰母线。</title>
  <desc>接触器断开后母线电容仍有能量。被动泄放很慢，主动放电在数秒内把电压拉到安全值以下。放电完成前不要碰母线。示意。</desc><style>
    text { font-family: ui-monospace, Consolas, monospace; }
    .bg { fill: #ffffff; }
    .panel { fill: #ffffff; stroke: #d0d7de; }
    .title { fill: #1f2328; font-size: 18px; font-weight: bold; }
    .txt { fill: #1f2328; font-size: 15px; }
    .small { fill: #1f2328; font-size: 13px; }
    .danger { fill: #cf222e; }
    .safe { fill: #1a7f37; }
    .sw { stroke: #1f2328; stroke-width: 3; fill: none; }
    .warn { fill: #cf222e; font-size: 15px; font-weight: bold; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
