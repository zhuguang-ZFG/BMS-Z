<line x1="244" y1="155" x2="250" y2="155" stroke="#37424e" stroke-width="2"/>
<text x="60" y="270" font-size="11" fill="#3d6b4a" opacity="0">采样：C 充电跟上输入
<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.22;0.27;1" dur="7s" repeatCount="indefinite"/></text>
<text x="60" y="294" font-size="11" fill="#a8321f" opacity="0">保持：开关断开，C 记住最后一刻——但漏电让它慢慢下垂
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.34;0.88;0.93;1" dur="7s" repeatCount="indefinite"/></text>
<g><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.2;0.26;0.9;0.94;1" dur="7s" repeatCount="indefinite"/><g filter="url(#pglow)"><circle r="5" fill="#3d6b4a"><animateMotion dur="1.75s" begin="-0.50s" repeatCount="indefinite" path="M74,136 H126 M170,136 H216" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle>
<circle r="5" fill="#3d6b4a"><animateMotion dur="1.75s" begin="-0.06s" repeatCount="indefinite" path="M74,136 H126 M170,136 H216" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle>
<circle r="5" fill="#3d6b4a"><animateMotion dur="1.75s" begin="0.38s" repeatCount="indefinite" path="M74,136 H126 M170,136 H216" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle>
