 <text x="396" y="420" text-anchor="middle">3</text>
 <text x="552" y="420" text-anchor="middle">6</text>
 <text x="760" y="420" text-anchor="middle">10</text>
 <text x="600" y="442" text-anchor="middle" font-size="13">静置时间 t（min，示意）</text>
 <text x="130" y="290" text-anchor="middle" font-size="13" transform="rotate(-90 130 290)">端电压（V，示意）</text>
</g>
<g filter="url(#w)" fill="none" stroke="#003153" stroke-linecap="round" stroke-linejoin="round">
 <line x1="120" y1="390.8" x2="240" y2="390.8" stroke-width="2.2"/>
