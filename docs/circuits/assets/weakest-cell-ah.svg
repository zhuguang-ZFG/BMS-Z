<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 544" font-family="ui-monospace, Consolas, monospace">
  <title>串联可用容量等于最弱节。极差变大时，可用安时沿直线下降。数字为示意。</title>

  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #bf8700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.5; fill: none; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
    }
  </style>

  <!-- formula: Qmin=2.00-s/2; Qavg=2.00 fixed; symmetric spread -->
  <rect class="bg" width="800" height="544"/>
  <text class="title" x="24" y="32">报平均容量，就是在替最弱的那节说谎（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="128" rx="6"/>
  <text class="txt" x="40" y="72" opacity="0.28">① 极差是 0<tspan class="small">　最弱的也是 2.00 Ah。平均没有撒谎。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="98" opacity="0.28">② 极差 0.20 Ah<tspan class="small">　最弱 1.90 Ah。你若报 2.00，多报了 0.10。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="124" opacity="0.28">③ 斜率是 −1/2<tspan class="small">　极差每大 0.10 Ah，可用少 0.05 Ah。直线，不弯。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="150" opacity="0.28">④ 极差 0.40 Ah<tspan class="small">　可用 1.80 Ah。串联认最弱，不认平均。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="188" width="752" height="304" rx="6"/>
  <text class="small" x="40" y="210">串联可用 Ah（示意）</text>
  <line class="axis" x1="108.0" y1="228.0" x2="108.0" y2="430.0"/>
  <line class="axis" x1="108.0" y1="430.0" x2="730.0" y2="430.0"/>
  <text class="small" x="730.0" y="468.0" text-anchor="end">极差 s = 最大减最小（Ah）</text>
  <line class="grid" x1="108.0" y1="430.0" x2="108.0" y2="436.0"/>
  <text class="small" x="108.0" y="452.0" text-anchor="middle">0</text>
  <line class="grid" x1="384.4" y1="430.0" x2="384.4" y2="436.0"/>
  <text class="small" x="384.4" y="452.0" text-anchor="middle">0.20</text>
  <line class="grid" x1="660.9" y1="430.0" x2="660.9" y2="436.0"/>
  <text class="small" x="660.9" y="452.0" text-anchor="middle">0.40</text>
  <line class="grid" x1="102.0" y1="356.5" x2="108.0" y2="356.5"/>
  <text class="small" x="98.0" y="360.5" text-anchor="end">1.80</text>
  <line class="grid" x1="102.0" y1="283.1" x2="108.0" y2="283.1"/>
  <text class="small" x="98.0" y="287.1" text-anchor="end">2.00</text>
  <polyline class="lineg" points="108.0,283.1 660.9,283.1" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline class="liner" points="108.0,283.1 114.9,284.0 121.8,284.9 128.7,285.8 135.6,286.8 142.6,287.7 149.5,288.6 156.4,289.5 163.3,290.4 170.2,291.4 177.1,292.3 184.0,293.2 190.9,294.1 197.8,295.0 204.8,295.9 211.7,296.9 218.6,297.8 225.5,298.7 232.4,299.6 239.3,300.5 246.2,301.5 253.1,302.4 260.0,303.3 267.0,304.2 273.9,305.1 280.8,306.0 287.7,307.0 294.6,307.9 301.5,308.8 308.4,309.7 315.3,310.6 322.2,311.6 329.2,312.5 336.1,313.4 343.0,314.3 349.9,315.2 356.8,316.1 363.7,317.1 370.6,318.0 377.5,318.9 384.4,319.8 391.4,320.7 398.3,321.7 405.2,322.6 412.1,323.5 419.0,324.4 425.9,325.3 432.8,326.2 439.7,327.2 446.6,328.1 453.6,329.0 460.5,329.9 467.4,330.8 474.3,331.8 481.2,332.7 488.1,333.6 495.0,334.5 501.9,335.4 508.8,336.3 515.8,337.3 522.7,338.2 529.6,339.1 536.5,340.0 543.4,340.9 550.3,341.9 557.2,342.8 564.1,343.7 571.0,344.6 578.0,345.5 584.9,346.4 591.8,347.4 598.7,348.3 605.6,349.2 612.5,350.1 619.4,351.0 626.3,352.0 633.2,352.9 640.2,353.8 647.1,354.7 654.0,355.6 660.9,356.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="dotr" r="6"><animate attributeName="cx" values="108.0;156.4;197.8;246.2;294.6;336.1;384.4;432.8;474.3;522.7;571.0;612.5;660.9" keyTimes="0.0000;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1.0000" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="283.1;289.5;295.0;301.5;307.9;313.4;319.8;326.2;331.8;338.2;344.6;350.1;356.5" keyTimes="0.0000;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1.0000" dur="12s" repeatCount="indefinite"/></circle>
  <text class="ok" x="329.2" y="261.1">平均值一直是 2.00</text>
  <text class="warn" x="329.2" y="385.9">可用 = 2.00 − s/2</text>
  <text class="small" x="24" y="528">2.00 Ah 和「左右对称的极差」是教学假设。真实电池不对称时，仍然只用最小值，不用这个 1/2。</text>
</svg>
