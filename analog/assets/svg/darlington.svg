<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">达林顿管：β 相乘，代价是三笔</text>

<text x="400" y="46" text-anchor="middle" font-size="14" font-weight="bold" fill="#37424e">Q2 的基极电流，就是 Q1 的发射极电流</text>
<path d="M120 92 Q120.13 107.00 120 122" fill="none" stroke="#37424e" stroke-width="2.5"/>
<text x="106" y="88" font-size="11.5" font-weight="bold" fill="#a4630f">Vin</text>
<path d="M120 122 Q140.00 121.86 160 122" fill="none" stroke="#37424e" stroke-width="2.5"/>
<circle cx="160" cy="122" r="4.5" fill="#37424e"/>
<path d="M160 122 Q159.91 137.00 160 152" fill="none" stroke="#37424e" stroke-width="2.5"/>
<polygon points="160,152 160,200 208,176" fill="#f6eedb" stroke="#1f5d7a" stroke-width="2.4"/>
<text x="172" y="170" font-size="10.5" font-weight="bold" fill="#1f5d7a">Q1</text>
<text x="172" y="188" font-size="9.5" fill="#5b666f">β₁</text>
<path d="M160 200 Q160.07 224.00 160 248" fill="none" stroke="#1f5d7a" stroke-width="2.5"/>
<circle cx="160" cy="248" r="4.5" fill="#37424e"/>
<path d="M160 248 Q160.04 263.00 160 278" fill="none" stroke="#37424e" stroke-width="2.5"/>
<polygon points="160,278 160,326 208,302" fill="#f6eedb" stroke="#3d6b4a" stroke-width="2.4"/>
<text x="172" y="296" font-size="10.5" font-weight="bold" fill="#3d6b4a">Q2</text>
<text x="172" y="314" font-size="9.5" fill="#5b666f">β₂</text>
<path d="M160 326 Q160.05 346.00 160 366" fill="none" stroke="#3d6b4a" stroke-width="2.5"/>
<path d="M160 366 Q140.00 365.86 120 366" fill="none" stroke="#37424e" stroke-width="2.5"/>
<path d="M160 366 Q180.00 365.99 200 366" fill="none" stroke="#37424e" stroke-width="2.5"/>
<path d="M120 366 Q120.00 379.00 120 392" fill="none" stroke="#37424e" stroke-width="2.5"/>
<path d="M120 392 Q120.01 399.00 120 406" fill="none" stroke="#37424e" stroke-width="2.5"/><path d="M104 406 Q120.00 406.06 136 406" fill="none" stroke="#37424e" stroke-width="3"/><path d="M110 412 Q120.00 411.92 130 412" fill="none" stroke="#37424e" stroke-width="3"/><line x1="116" y1="418" x2="124" y2="418" stroke="#37424e" stroke-width="3"/>
<path d="M200 366 Q220.00 365.88 240 366" fill="none" stroke="#37424e" stroke-width="2.5"/>
<circle cx="240" cy="366" r="4.5" fill="#37424e"/>
<path d="M240 366 Q240.24 283.00 240 200" fill="none" stroke="#37424e" stroke-width="2.5"/>
<path d="M240 200 Q224.01 187.99 208 176" fill="none" stroke="#37424e" stroke-width="2.5"/>
<path d="M240 200 Q270.00 199.77 300 200" fill="none" stroke="#37424e" stroke-width="2.5"/>
<text x="306" y="196" font-size="11.5" font-weight="bold" fill="#a8321f">I_C 总</text>
<path d="M208 302 Q254.00 301.64 300 302" fill="none" stroke="#37424e" stroke-width="2.5"/>
<circle cx="240" cy="302" r="4" fill="#37424e"/>
<path d="M240 302 Q240.21 334.00 240 366" fill="none" stroke="#37424e" stroke-width="1" stroke-dasharray="4,3"/>
<text x="248" y="330" font-size="11" font-weight="bold" fill="#3d6b4a">I_E1=I_B2</text>
<circle r="5" fill="#1f5d7a"><animateMotion dur="11s" begin="-0.3s" repeatCount="indefinite" path="M122,124 L158,124"/></circle>
<circle r="5" fill="#1f5d7a"><animateMotion dur="11s" begin="-1.0s" repeatCount="indefinite" path="M162,154 L162,198 L206,176"/></circle>
<circle r="5" fill="#3d6b4a"><animateMotion dur="11s" begin="-1.7s" repeatCount="indefinite" path="M162,250 L162,276 L206,302"/></circle>
<circle r="5" fill="#a8321f"><animateMotion dur="11s" begin="-2.4s" repeatCount="indefinite" path="M210,302 L298,300"/></circle>
<circle r="5" fill="#6b3f63"><animateMotion dur="11s" begin="-3.0s" repeatCount="indefinite" path="M162,328 L162,364 L118,366"/></circle>
<path d="M360 80 Q358.78 320.00 360 560" fill="none" stroke="#c9bb9d" stroke-width="1" stroke-dasharray="6,5"/>
<text x="580" y="80" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#37424e">收益 vs 三笔代价</text>
<rect x="382" y="98" width="356" height="90" rx="8" fill="#e6eff3" stroke="#1f5d7a" stroke-width="1.8"/>
<text x="398" y="124" font-size="12" font-weight="bold" fill="#1f5d7a">收益：β 相乘</text>
<text x="398" y="148" font-size="11.5" fill="#5b666f">I_C2 = β₂·I_B2 = β₂·I_E1 = β₂·(1+β₁)·I_B1</text>
<text x="398" y="172" font-size="11.5" font-weight="bold" fill="#3d6b4a">β_total ≈ β₁×β₂（可达 10000+）</text>
<rect x="382" y="202" width="356" height="72" rx="8" fill="#f7eedb" stroke="#a4630f" stroke-width="1.8"/>
<text x="398" y="228" font-size="12" font-weight="bold" fill="#a4630f">代价①：V_BE 翻倍</text>
<text x="398" y="252" font-size="11.5" fill="#5b666f">两级各 0.7V 串联 → 约 1.4V（输入信号被抬高）</text>
<text x="398" y="268" font-size="11" fill="#5b666f">低压 3.3V 系统里，1.4V 的损失不可忽略</text>
<rect x="382" y="288" width="356" height="72" rx="8" fill="#f6e7e1" stroke="#a8321f" stroke-width="1.8"/>
<text x="398" y="314" font-size="12" font-weight="bold" fill="#a8321f">代价②：V_CE(sat) 升高</text>
<text x="398" y="338" font-size="11.5" fill="#5b666f">Q2 无法深度饱和 → 约 0.9V（普通管 0.2V）</text>
<text x="398" y="354" font-size="11" fill="#5b666f">所以 1A 时白白多烧 0.9W 热</text>
<rect x="382" y="374" width="356" height="72" rx="8" fill="#f6eedb" stroke="#5b666f" stroke-width="1.8"/>
<text x="398" y="400" font-size="12" font-weight="bold" fill="#5b666f">代价③：速度慢</text>
<text x="398" y="424" font-size="11.5" fill="#5b666f">Q1 关断时 Q2 基区电荷要多绕一圈才泄放</text>
<text x="398" y="440" font-size="11" fill="#5b666f">（若不想慢，可在 Rbe 上并电阻加速泄放）</text>
<text x="580" y="474" text-anchor="middle" font-size="12" font-weight="bold" fill="#37424e">什么时候值得</text>
<text x="580" y="498" text-anchor="middle" font-size="11.5" fill="#5b666f">需要「极小基极电流驱动大负载」时：MCU 引脚直接驱动继电器/步进电机</text>
<text x="580" y="520" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3d6b4a">经典集成件 ULN2003：7 路达林顿 + 每路自带续流二极管</text>
<text x="580" y="542" text-anchor="middle" font-size="11" fill="#5b666f">（它把「续流」这件事也一起做进芯片了 —— 见 3.5 的教训）</text>
