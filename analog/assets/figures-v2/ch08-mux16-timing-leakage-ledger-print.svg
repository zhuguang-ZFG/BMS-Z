<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1448 1086" role="img" aria-labelledby="title desc" data-print-width-mm="138" data-composition="technical-overlay-v1" data-base-medium="python-svg"><title id="title">16 选 1 的时间与漏流账</title><desc id="desc">五行账：软件 1µs、τ=410ns、12 位建立 3.4µs、一帧 80µs、85°C 漏流约 1µA 在 10kΩ 上得 10mV；条带只表示相对量级。</desc><rect width="1448" height="1086" fill="#e2d9cf" /><g id="paper-illustration"><path d="M68,206 L631.6,204 L1381,207 L1384,605.28 L1381,906 L565.6,908 L64,904 Z" fill="#f6f2ed" stroke="#c4b9ab" stroke-width="1.4" /><path d="M70,208L1377,209" fill="none" stroke="#ffffff" stroke-width="2" opacity=".7" /><path d="M82,218 L1368,220 L1370,892 L84,894 Z" fill="none" stroke="#c4b9ab" stroke-width="2" opacity=".55" />
