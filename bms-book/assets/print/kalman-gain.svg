  <text class="txt" x="40" y="68" opacity="1" style="opacity: 1;">① 起步<tspan class="small">　P 从 0.04 加 Q=0.0004。R=0.001 时第一步 K=0.9758。</tspan></text>
  <text class="txt" x="40" y="92" opacity="1" style="opacity: 1;">② 每一步<tspan class="small">　先 P←P+Q，再 K=P/(P+R)，然后 P←(1−K)P。</tspan></text>
  <text class="txt" x="40" y="116" opacity="1" style="opacity: 1;">③ 测量较静<tspan class="small">　蓝线收到 K=0.4633，P=4.633e-04。还愿意听电压。</tspan></text>
  <text class="txt" x="40" y="140" opacity="1" style="opacity: 1;">④ 测量更吵或平台<tspan class="small">　R=0.020 收到 K=0.1318。口诀：平台上少信电压。</tspan></text>
