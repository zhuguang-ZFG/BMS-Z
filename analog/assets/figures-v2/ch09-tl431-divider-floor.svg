<polygon class="marker-wash" points="42.9,22.2 322.0,21.9 710.6,21.9 709.3,61.9 384.8,65.5 44.8,64.6" fill="#a4630f" opacity="0.13"/>
<text x="52" y="58" font-size="38" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">TL431 的参考偏流，要加在输出电压上</text><text x="52" y="94" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">示意 Vref=2.5 V、Iref=2 µA；R1=R2，其他误差另计。</text>
<g transform="translate(10 130) scale(1.5)"><text x="105" y="65" font-size="18" fill="#2a2927" text-anchor="middle">Vout</text><path d="M105 75 Q104.98 85.00 105 95" fill="none" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><path d="M95,95 H115 V130 H95 Z M95,190 H115 V225 H95 Z" fill="none" stroke="#16202b" stroke-width="2"/><path d="M105 130 Q104.94 160.00 105 190" fill="none" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><path d="M105 225 Q104.94 235.00 105 245" fill="none" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><path d="M90 245 Q105.00 244.97 120 245" fill="none" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><path d="M105 160 Q187.50 159.50 270 160" fill="none" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><text x="135" y="118" font-size="18" fill="#2a2927" text-anchor="start">R1</text><text x="135" y="215" font-size="18" fill="#2a2927" text-anchor="start">R2</text><text x="262" y="145" font-size="18" fill="#2a2927" text-anchor="end">REF</text><text x="235" y="188" font-size="18" fill="#2a2927" text-anchor="middle">2.5 V</text><path d="M180,160 L170,155 M180,160 L170,165" fill="none" stroke="#a8321f" stroke-width="2"/><text x="203" y="220" font-size="18" fill="#a8321f" text-anchor="start">Iref →</text><circle cx="105" cy="160" r="3" fill="#16202b"/></g>
<text x="495" y="225" font-size="26" fill="#1f5d7a" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">上支路 = 下支路 + Iref</text>
<text x="495" y="290" font-size="24" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">10 kΩ：250 + 2 = 252 µA</text>
<text x="495" y="345" font-size="28" fill="#3d6b4a" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">Vout = 5.020 V</text>
<text x="495" y="415" font-size="25" fill="#a8321f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">100 kΩ：Vout = 5.200 V</text>
<text x="50" y="585" font-size="27" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">Vout = Vref(1 + R1/R2) + Iref·R1</text>
<text x="50" y="635" font-size="23" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">实际典型 Vref 为 2.495 V；保证预算另查型号、温度与最大值。</text>
</svg>
