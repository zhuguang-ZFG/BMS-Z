<polygon class="marker-wash" points="44.6,24.0 479.2,21.4 721.4,21.7 720.0,64.4 385.0,65.5 44.8,62.3" fill="#a4630f" opacity="0.13"/>
<text x="52" y="58" font-size="38" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">10°C 翻倍法则：2000 小时能变 3.7 年</text><text x="52" y="94" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">厂商给的是 L0 小时 @ T0；降温一档翻一倍，纹波发热反着吃回去。</text>
<rect x="50" y="130" width="430" height="300" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<rect class="ink-echo" x="50" y="130" width="430" height="300" rx="6" stroke="#37424e" stroke-width="2" fill="none" opacity="0.32" transform="translate(1.53 0.61) rotate(-0.07 265.0 280.0)"/>
<text x="74" y="170" font-size="24" fill="#3d6b4a" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">温度每降 10°C，寿命翻一倍</text>
<rect x="86" y="190" width="372" height="80" rx="6" fill="#f6eedb" stroke="#a8321f" stroke-width="2"/>
<rect class="ink-echo" x="86" y="190" width="372" height="80" rx="6" stroke="#a8321f" stroke-width="2" fill="none" opacity="0.32" transform="translate(1.43 -0.72) rotate(-0.05 272.0 230.0)"/>
<text x="106" y="224" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">手册条件　105°C</text>
<text x="106" y="256" font-size="28" fill="#a8321f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">2000h</text>
<path d="M152 276 Q152.10 292.00 152 308" fill="none" stroke="#a4630f" stroke-width="2.5" stroke-linecap="round"/><polygon points="152,308 142,303 142,313" fill="#a4630f"/>
<text x="176" y="300" font-size="22" fill="#a4630f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">每 10°C 翻一倍，共 4 次</text>
<rect x="86" y="316" width="372" height="80" rx="6" fill="#f6eedb" stroke="#3d6b4a" stroke-width="2"/>
<rect class="ink-echo" x="86" y="316" width="372" height="80" rx="6" stroke="#3d6b4a" stroke-width="2" fill="none" opacity="0.32" transform="translate(-1.31 0.93) rotate(0.03 272.0 356.0)"/>
<text x="106" y="350" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">实际工况　65°C</text>
<text x="106" y="382" font-size="28" fill="#3d6b4a" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">32000h</text>
<text x="74" y="418" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">约 3.7 年连续通电</text>
<rect x="520" y="130" width="430" height="300" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<rect class="ink-echo" x="520" y="130" width="430" height="300" rx="6" stroke="#37424e" stroke-width="2" fill="none" opacity="0.32" transform="translate(1.11 0.80) rotate(0.00 735.0 280.0)"/>
<text x="544" y="172" font-size="24" fill="#a8321f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">纹波电流从另一头吃回来</text>
<text x="544" y="216" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">纹波在 ESR 上发热</text>
<text x="544" y="254" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">这份热直接进寿命公式的 T</text>
<path d="M560 282 Q630.00 282.65 700 282" fill="none" stroke="#a8321f" stroke-width="2.5" stroke-linecap="round"/><polygon points="700,282 690,277 690,287" fill="#a8321f"/>
<text x="716" y="290" font-size="22" fill="#a8321f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">超额 30%</text>
<text x="544" y="330" font-size="24" fill="#a8321f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">芯温升高 5~10°C</text>
<text x="544" y="368" font-size="24" fill="#a8321f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">寿命当场腰斩</text>
<text x="544" y="412" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">先按纹波电流与温升选系列，再选容量</text>
<rect x="50" y="456" width="900" height="104" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<rect class="ink-echo" x="50" y="456" width="900" height="104" rx="6" stroke="#37424e" stroke-width="2" fill="none" opacity="0.32" transform="translate(1.44 -0.90) rotate(-0.02 500.0 508.0)"/>
<text x="76" y="496" font-size="24" fill="#3d6b4a" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">想长寿：把 L0 提到 5000~10000h，或换固态 / 聚合物。</text>
<text x="76" y="532" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">顺序反了，电容会先被自己的 ESR 煮熟。</text>
<text x="500" y="622" font-size="22" fill="#a4630f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="middle">开关电源里第一个坏的总是电解电容：环境温度与自发热，它两样都吃。</text>
</svg>
