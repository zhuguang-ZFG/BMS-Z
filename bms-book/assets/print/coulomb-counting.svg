    .gold { fill: #926717; }
    .cell { fill: #e4f0df; stroke: #176b73; stroke-width: 2; }
    .charge { fill: #176b73; opacity: 0.24; }
    .axis { fill: none; stroke: #626d65; stroke-width: 1.5; }
    .grid { fill: none; stroke: #cfc6b2; stroke-width: 1; }
    .lineb { fill: none; stroke: #176b73; stroke-width: 3; }
    .liner { fill: none; stroke: #b84745; stroke-width: 3; }
    .dot { fill: #926717; stroke: #fffdf5; stroke-width: 2; }
