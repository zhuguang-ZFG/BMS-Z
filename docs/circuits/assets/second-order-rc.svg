  <polyline class="lineb" points="88.0,274.9 93.4,282.6 98.8,289.5 104.2,295.6 109.6,301.1 115.0,305.9 120.4,310.2 125.8,314.1 131.2,317.5 136.6,320.6 142.0,323.4 147.4,325.8 152.8,328.1 158.2,330.1 163.6,331.9 169.0,333.5 174.4,335.0 179.8,336.4 185.2,337.6 190.6,338.8 196.0,339.8 201.4,340.8 206.8,341.7 212.2,342.5 217.6,343.3 223.0,344.0 228.4,344.7 233.8,345.3 239.2,345.9 244.6,346.5 250.0,347.0 255.4,347.5 260.8,348.0 266.2,348.5 271.6,349.0 277.0,349.4 282.4,349.8 287.8,350.2 293.2,350.7 298.6,351.0 304.0,351.4 309.4,351.8 314.8,352.2 320.2,352.6 325.6,352.9 331.0,353.3 336.4,353.6 341.8,354.0 347.2,354.3 352.6,354.6 358.0,355.0 363.4,355.3 368.8,355.6 374.2,356.0 379.6,356.3 385.0,356.6 390.4,356.9 395.8,357.2 401.2,357.6 406.6,357.9 412.0,358.2 417.4,358.5 422.8,358.8 428.2,359.1 433.6,359.4 439.0,359.7 444.4,360.0 449.8,360.3 455.2,360.6 460.6,360.9 466.0,361.2 471.4,361.5 476.8,361.8 482.2,362.1 487.6,362.3 493.0,362.6 498.4,362.9 503.8,363.2 509.2,363.5 514.6,363.8 520.0,364.0" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="dotb" r="6" cx="88.0" cy="274.9"><animate attributeName="cx" values="88.0;131.2;174.4;260.8;433.6;520.0;520.0" keyTimes="0;0.1667;0.3333;0.5000;0.6667;0.8333;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="274.9;317.5;335.0;348.0;359.4;364.0;364.0" keyTimes="0;0.1667;0.3333;0.5000;0.6667;0.8333;1" dur="12s" repeatCount="indefinite"/></circle>
  <text class="hi" x="540" y="260">蓝 真实（两路）</text>
  <text class="warn" x="540" y="286">红虚线 一阶</text>
  <text class="small" x="540" y="312">前段对不上</text>
  <rect class="panel" x="24" y="480" width="752" height="64" rx="6"/>
  <text class="small" x="40.0" y="518.0" text-anchor="start" opacity="1">t=0 s　真实 3.660 V　一阶 3.660 V　一阶偏高 0 mV<animate attributeName="opacity" values="1;0;0;0;0;0;0" keyTimes="0;0.1667;0.3333;0.5000;0.6667;0.8333;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="518.0" text-anchor="start" opacity="0">t=1 s　真实 3.605 V　一阶 3.644 V　一阶偏高 39 mV<animate attributeName="opacity" values="0;1;0;0;0;0;0" keyTimes="0;0.1667;0.3333;0.5000;0.6667;0.8333;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="518.0" text-anchor="start" opacity="0">t=2 s　真实 3.583 V　一阶 3.629 V　一阶偏高 46 mV<animate attributeName="opacity" values="0;0;1;0;0;0;0" keyTimes="0;0.1667;0.3333;0.5000;0.6667;0.8333;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="518.0" text-anchor="start" opacity="0">t=4 s　真实 3.566 V　一阶 3.603 V　一阶偏高 37 mV<animate attributeName="opacity" values="0;0;0;1;0;0;0" keyTimes="0;0.1667;0.3333;0.5000;0.6667;0.8333;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="518.0" text-anchor="start" opacity="0">t=8 s　真实 3.552 V　一阶 3.563 V　一阶偏高 11 mV<animate attributeName="opacity" values="0;0;0;0;1;0;0" keyTimes="0;0.1667;0.3333;0.5000;0.6667;0.8333;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="518.0" text-anchor="start" opacity="0">t=10 s　真实 3.546 V　一阶 3.547 V　一阶偏高 1 mV<animate attributeName="opacity" values="0;0;0;0;0;1;0" keyTimes="0;0.1667;0.3333;0.5000;0.6667;0.8333;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>

