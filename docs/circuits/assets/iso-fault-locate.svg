<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="ui-monospace, Consolas, monospace">
  <title>绝缘故障靠近哪一端，机壳相对负极的电压就靠近那一端的电位。漏电阻远小于采样电阻时，位置分数约等于电压比。数字为示意。</title>
  <desc>绝缘故障靠近哪一端，机壳相对负极的电压就靠近那一端的电位。漏电阻远小于采样电阻时，位置分数约等于电压比。数字为示意。</desc>

  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.5; fill: none; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .dotg { fill: #1a7f37; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    .boxr { fill: #ffebe9; stroke: #cf222e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .dotg { fill: #3fb950; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
      .boxr { fill: #3d1214; stroke: #ff7b72; }
    }
  </style>

  <!-- formula: V_neg_to_chassis = alpha * 400 when R_fault << R_sense -->
  <rect class="bg" width="800" height="500"/>
  <text class="title" x="24" y="32">电压比告诉你漏在哪一截（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="122" rx="6"/>
  <text class="txt" x="40" y="68" opacity="0.28">① 包压示意 400 V<tspan class="small">　α=0 在负极，α=1 在正极。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="94" opacity="0.28">② 漏在 1/4 处<tspan class="small">　负极到机壳约 100 V。点走到这里。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="120" opacity="0.28">③ 漏在中点<tspan class="small">　约 200 V。只有 Y 电容、两侧都很好时，也会停在中间，那时还没有位置。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="146" opacity="0.28">④ 前提<tspan class="small">　漏电阻要远小于采样电阻，读数才贴着这根直线。否则会被采样电阻和电容往中间拉。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="182" width="752" height="250" rx="6"/>
  <text class="small" x="40" y="204">负极到机壳 V</text>
  <line class="axis" x1="92.0" y1="214.0" x2="92.0" y2="400.0"/>
  <line class="axis" x1="92.0" y1="400.0" x2="720.0" y2="400.0"/>
  <text class="small" x="712.0" y="418" text-anchor="end">故障离负极的分数 α</text>
  <line class="grid" x1="92.0" y1="400.0" x2="92.0" y2="406.0"/>
  <text class="small" x="92.0" y="432" text-anchor="middle">B−</text>
  <line class="grid" x1="249.0" y1="400.0" x2="249.0" y2="406.0"/>
  <text class="small" x="249.0" y="432" text-anchor="middle">0.25</text>
  <line class="grid" x1="406.0" y1="400.0" x2="406.0" y2="406.0"/>
  <text class="small" x="406.0" y="432" text-anchor="middle">0.5</text>
  <line class="grid" x1="720.0" y1="400.0" x2="720.0" y2="406.0"/>
  <text class="small" x="720.0" y="432" text-anchor="middle">B+</text>
  <line class="grid" x1="86.0" y1="400.0" x2="92.0" y2="400.0"/>
  <text class="small" x="82.0" y="404.0" text-anchor="end">0</text>
  <line class="grid" x1="86.0" y1="353.5" x2="92.0" y2="353.5"/>
  <text class="small" x="82.0" y="357.5" text-anchor="end">100</text>
  <line class="grid" x1="86.0" y1="307.0" x2="92.0" y2="307.0"/>
  <text class="small" x="82.0" y="311.0" text-anchor="end">200</text>
  <line class="grid" x1="86.0" y1="214.0" x2="92.0" y2="214.0"/>
  <text class="small" x="82.0" y="218.0" text-anchor="end">400</text>
  <polyline class="lineb" points="92.0,400.0 123.4,390.7 154.8,381.4 186.2,372.1 217.6,362.8 249.0,353.5 280.4,344.2 311.8,334.9 343.2,325.6 374.6,316.3 406.0,307.0 437.4,297.7 468.8,288.4 500.2,279.1 531.6,269.8 563.0,260.5 594.4,251.2 625.8,241.9 657.2,232.6 688.6,223.3 720.0,214.0" stroke-linejoin="round" stroke-linecap="round"/>
  <text class="hi" x="180" y="250">V ≈ α × 400 V</text>
  <circle class="doty" r="6"><animate attributeName="cx" values="92.0;170.5;249.0;327.5;406.0;484.5;563.0;641.5;720.0" keyTimes="0;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="400.0;376.8;353.5;330.2;307.0;283.8;260.5;237.2;214.0" keyTimes="0;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1" dur="12s" repeatCount="indefinite"/></circle>
  <text class="small" x="24" y="478">400 V 和这根直线是教学极限，不是绝缘监测仪的定位精度。报警门槛仍按适用标准算 Ω/V，不按这张图。</text>
</svg>
