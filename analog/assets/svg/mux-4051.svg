tCount="indefinite"/></rect><text x="400" y="700" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#a8321f" opacity="0">③ 切换瞬间有电荷注入与 Ron 变化——别在转换中途切通道（见 8.6）<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="11s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/><rect x="141.0" y="687.0" width="517.9" height="24.1" rx="12.0" fill="#a4630f" fill-opacity="0.09" stroke="#a4630f" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="700" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#a4630f" opacity="0">④ 同族选型：4052 双 4 选 1、4053 三路 2 选 1、74HC4051 高速版<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/></text></g></svg>