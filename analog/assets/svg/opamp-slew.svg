unt="indefinite"/></rect><text x="400" y="572" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1f5d7a" opacity="0">③ 退出饱和后按 GBW 走指数收尾：τ≈0.16µs，可能带过冲振铃<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="9s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.85;0.9;1" dur="9s" repeatCount="indefinite"/><rect x="163.8" y="559.0" width="472.5" height="24.1" rx="12.0" fill="#a4630f" fill-opacity="0.09" stroke="#a4630f" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="9s" repeatCount="indefinite"/></rect><text x="400" y="572" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#a4630f" opacity="0">④ 大信号看 SR、小信号看 GBW：两条曲线谁慢，就决定建立时间<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="9s" repeatCount="indefinite"/></text></g></svg>