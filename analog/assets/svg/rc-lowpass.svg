<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="ttl">
<title id="ttl">一阶 RC 低通：一颗极点的人生观</title>
<desc>一阶 RC 低通：一颗极点的人生观；节拍：① fc=1/(2πRC)：此处容抗=电阻，输出恰好 −3dB（半功率点）、相位 −45°；② 每过十倍频，容抗小十倍、输出小十倍：−20dB/dec 直线——一颗极点的身份证；③ 相位最多拖到 −90°——一颗极点永远掀不翻反馈（见 12.7 稳定性），两颗就危险</desc>
