<text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b">三态交接，比较真正开始与停止驱动的时刻</text>
<text x="360" y="54" text-anchor="middle" font-size="12.5" fill="#5b666f">示意不含控制器偏差；实际须加时序裕量，空档不采样数据。</text>
<g data-beat="条件" opacity="0"><text x="40" y="95" font-size="18" fill="#2a2927" text-anchor="start">粗线为实际驱动；指令与输出之间有延迟</text><text x="40" y="170" font-size="20" fill="#2a2927" text-anchor="start">A 驱动</text><line x1="170" y1="165" x2="410" y2="165" stroke="#1f5d7a" stroke-width="10" stroke-dasharray=""/><text x="40" y="245" font-size="20" fill="#2a2927" text-anchor="start">B 驱动</text><line x1="410" y1="125" x2="410" y2="285" stroke="#1f5d7a" stroke-width="2" stroke-dasharray="7 5"/><line x1="290" y1="200" x2="290" y2="285" stroke="#a8321f" stroke-width="2" stroke-dasharray="7 5"/><text x="170" y="310" font-size="18" fill="#2a2927" text-anchor="middle">0</text><text x="290" y="310" font-size="18" fill="#2a2927" text-anchor="middle">15</text><text x="410" y="310" font-size="18" fill="#2a2927" text-anchor="middle">30</text><text x="490" y="310" font-size="18" fill="#2a2927" text-anchor="middle">40</text><text x="650" y="310" font-size="18" fill="#2a2927" text-anchor="middle">60</text><text x="690" y="310" font-size="18" fill="#2a2927" text-anchor="start">ns</text><text x="360" y="370" font-size="22" fill="#a8321f" text-anchor="middle">重叠 15 ns：两路可能冲突</text><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="0s" dur="0.45s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="3s" dur="0.4s" fill="freeze"/></g>
<g data-beat="变化" opacity="0"><text x="40" y="95" font-size="18" fill="#2a2927" text-anchor="start">粗线为实际驱动；指令与输出之间有延迟</text><text x="40" y="170" font-size="20" fill="#2a2927" text-anchor="start">A 驱动</text><line x1="170" y1="165" x2="410" y2="165" stroke="#1f5d7a" stroke-width="10" stroke-dasharray=""/><text x="40" y="245" font-size="20" fill="#2a2927" text-anchor="start">B 驱动</text><line x1="410" y1="125" x2="410" y2="285" stroke="#1f5d7a" stroke-width="2" stroke-dasharray="7 5"/><line x1="290" y1="200" x2="290" y2="285" stroke="#a8321f" stroke-width="2" stroke-dasharray="7 5"/><text x="170" y="310" font-size="18" fill="#2a2927" text-anchor="middle">0</text><text x="290" y="310" font-size="18" fill="#2a2927" text-anchor="middle">15</text><text x="410" y="310" font-size="18" fill="#2a2927" text-anchor="middle">30</text><text x="490" y="310" font-size="18" fill="#2a2927" text-anchor="middle">40</text><text x="650" y="310" font-size="18" fill="#2a2927" text-anchor="middle">60</text><text x="690" y="310" font-size="18" fill="#2a2927" text-anchor="start">ns</text><text x="360" y="370" font-size="22" fill="#a8321f" text-anchor="middle">重叠 15 ns：两路可能冲突</text><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="3s" dur="0.45s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="6s" dur="0.4s" fill="freeze"/></g>
<g data-beat="比较" opacity="0"><text x="40" y="95" font-size="18" fill="#2a2927" text-anchor="start">粗线为实际驱动；指令与输出之间有延迟</text><text x="40" y="170" font-size="20" fill="#2a2927" text-anchor="start">A 驱动</text><line x1="170" y1="165" x2="410" y2="165" stroke="#1f5d7a" stroke-width="10" stroke-dasharray=""/><text x="40" y="245" font-size="20" fill="#2a2927" text-anchor="start">B 驱动</text><line x1="410" y1="125" x2="410" y2="285" stroke="#1f5d7a" stroke-width="2" stroke-dasharray="7 5"/><line x1="290" y1="200" x2="290" y2="285" stroke="#a8321f" stroke-width="2" stroke-dasharray="7 5"/><text x="170" y="310" font-size="18" fill="#2a2927" text-anchor="middle">0</text><text x="290" y="310" font-size="18" fill="#2a2927" text-anchor="middle">15</text><text x="410" y="310" font-size="18" fill="#2a2927" text-anchor="middle">30</text><text x="490" y="310" font-size="18" fill="#2a2927" text-anchor="middle">40</text><text x="650" y="310" font-size="18" fill="#2a2927" text-anchor="middle">60</text><text x="690" y="310" font-size="18" fill="#2a2927" text-anchor="start">ns</text><text x="360" y="370" font-size="22" fill="#a8321f" text-anchor="middle">重叠 15 ns：两路可能冲突</text><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="6s" dur="0.45s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="9s" dur="0.4s" fill="freeze"/></g>
<g data-beat="结论" opacity="0"><text x="40" y="95" font-size="18" fill="#2a2927" text-anchor="start">粗线为实际驱动；指令与输出之间有延迟</text><text x="40" y="170" font-size="20" fill="#2a2927" text-anchor="start">A 驱动</text><line x1="170" y1="165" x2="410" y2="165" stroke="#1f5d7a" stroke-width="10" stroke-dasharray=""/><text x="40" y="245" font-size="20" fill="#2a2927" text-anchor="start">B 驱动</text><line x1="410" y1="125" x2="410" y2="285" stroke="#1f5d7a" stroke-width="2" stroke-dasharray="7 5"/><line x1="490" y1="200" x2="490" y2="285" stroke="#a8321f" stroke-width="2" stroke-dasharray="7 5"/><text x="170" y="310" font-size="18" fill="#2a2927" text-anchor="middle">0</text><text x="290" y="310" font-size="18" fill="#2a2927" text-anchor="middle">15</text><text x="410" y="310" font-size="18" fill="#2a2927" text-anchor="middle">30</text><text x="490" y="310" font-size="18" fill="#2a2927" text-anchor="middle">40</text><text x="650" y="310" font-size="18" fill="#2a2927" text-anchor="middle">60</text><text x="690" y="310" font-size="18" fill="#2a2927" text-anchor="start">ns</text><text x="360" y="370" font-size="22" fill="#42654d" text-anchor="middle">空档 10 ns：允许，禁止采样</text><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="9s" dur="0.45s" fill="freeze"/></g>
<g data-beat="条件" opacity="0"><path d="M290,240 L650,240" pathLength="1" fill="none" stroke="#a8321f" stroke-width="10" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" from="1" to="0" begin="0.2s" dur="2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/></path><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="0s" dur="0.45s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="3s" dur="0.4s" fill="freeze"/></g>
<g data-beat="变化" opacity="0"><path d="M290,240 L650,240" pathLength="1" fill="none" stroke="#a8321f" stroke-width="10" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" from="1" to="0" begin="3.2s" dur="2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/></path><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="3s" dur="0.45s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="6s" dur="0.4s" fill="freeze"/></g>
<g data-beat="比较" opacity="0"><path d="M290,240 L650,240" pathLength="1" fill="none" stroke="#a8321f" stroke-width="10" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" from="1" to="0" begin="6.2s" dur="2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/></path><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="6s" dur="0.45s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="9s" dur="0.4s" fill="freeze"/></g>
<g data-beat="结论" opacity="0"><path d="M490,240 L650,240" pathLength="1" fill="none" stroke="#a8321f" stroke-width="10" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" from="1" to="0" begin="9.2s" dur="2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/></path><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="9s" dur="0.45s" fill="freeze"/></g>
<rect x="24" y="406" width="672" height="34" rx="9" fill="#f7eedb" stroke="#c9bb9d" stroke-width="1.2"/>
<g data-caption="条件" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="0s" dur="0.2s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="2.8s" dur="0.2s" fill="freeze"/><text x="360" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#16202b">A 在零时刻收到禁用，最晚 30 ns 才高阻。</text></g>
<g data-caption="变化" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="3s" dur="0.2s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="5.8s" dur="0.2s" fill="freeze"/><text x="360" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#16202b">B 的使能延迟最小 10 ns，不是命令到即驱动。</text></g>
<g data-caption="比较" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="6s" dur="0.2s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="8.8s" dur="0.2s" fill="freeze"/><text x="360" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#16202b">命令只晚 5 ns → B 在 15 ns 驱动，重叠 15 ns。</text></g>
<g data-caption="结论" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="9s" dur="0.2s" fill="freeze"/><text x="360" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#16202b">命令晚 30 ns → B 最早 40 ns 驱动，空档 10 ns。</text></g>
