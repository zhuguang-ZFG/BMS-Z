</style><rect class="bg" x="0" y="-156" width="800" height="620" /><text class="title" x="24" y="-128">菊花链 + isoSPI：数据接力，隔墙传输</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 菊花链 + isoSPI：数据接力，隔墙传输<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② ↑ 接 12–18 串电芯<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 命令下发（蓝）：每级芯片接收 → 再生 → 转发，像接力棒<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="408" width="752" height="44" rx="6" /><text class="small" x="40" y="436">↑ 接 12–18 串电芯。示意。</text><rect width="800" height="400" class="bg" />
  <rect x="60" y="150" width="120" height="100" rx="10" stroke-width="2" class="fill-boxb stroke-axis" />
  <text x="120" y="195" text-anchor="middle" font-size="15" font-weight="bold" class="hi">BMU</text>
