 <text x="660.0" y="240.0" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="middle">到达时刻</text>
 <text x="480.0" y="290.0" font-family="KaiTi" font-size="14" fill="#003153" text-anchor="middle">同一串字节：刚采的和 3 秒前采的，结构上无法区分</text>
</g>
</g>
<g class="motion" data-x="1">
<text x="48.0" y="314.0" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="start">结构成立之后，语义还要继续核对：</text>
<g filter="url(#w)">
 <rect x="245.0" y="330.0" width="54.0" height="32.0" fill="none" stroke="#003153" stroke-width="1.5" rx="3"/>
 <text x="272.0" y="352.0" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="middle">缩放</text>
 <rect x="323.0" y="330.0" width="54.0" height="32.0" fill="none" stroke="#003153" stroke-width="1.5" rx="3"/>
 <text x="350.0" y="352.0" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="middle">端序</text>
 <rect x="401.0" y="330.0" width="80.0" height="32.0" fill="none" stroke="#003153" stroke-width="1.5" rx="3"/>
 <text x="441.0" y="352.0" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="middle">固件版本</text>
 <rect x="505.0" y="330.0" width="93.0" height="32.0" fill="none" stroke="#003153" stroke-width="1.5" rx="3"/>
 <text x="551.5" y="352.0" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="middle">滚动计数器</text>
 <rect x="622.0" y="330.0" width="93.0" height="32.0" fill="none" stroke="#003153" stroke-width="1.5" rx="3"/>
 <text x="668.5" y="352.0" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="middle">信号新鲜度</text>
</g>
</g>
<text x="48" y="512" font-family="KaiTi" font-size="12" fill="#003153">④ 解析器只证明字节结构成立，不证明语义可信。真实协议还要继续核对缩放、端序、固件版本、滚动计数器和信号新鲜度。</text>
<text x="480" y="546" font-family="KaiTi" font-size="14" opacity="0.8" text-anchor="middle" fill="#003153">原理示意 / 非实拍</text>
</svg>
