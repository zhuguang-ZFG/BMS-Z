<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="ttl">
<title id="ttl">排故五步法：把「玄学」拆成实验</title>
<desc>排故五步法：把「玄学」拆成实验；节拍：① 症状确认：先问五个问题——一直坏还是偶发？温度相关？最近改过什么？；② 二分定位：中线一测去一半——64 个节点最多 6 次测量锁定；③ 单变量实验：一次只改一个变量——「再换一颗试试」是排故头号时间杀手；④ 修根因不修症状：保险丝烧了，先问「为什么烧」再换；⑤ 回归验证：全温、全程、全工况跑过才算修好；写日志给团队攒资产</desc>
