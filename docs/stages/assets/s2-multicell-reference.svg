<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="s2ref-t s2ref-d">
  <title id="s2ref-t">单节芯片为什么叠不出多串</title>
  <desc id="s2ref-d">三节电芯串联后，每节负极对电池包负极的电位都不同；单节芯片的参考点只能跟着某一节走，输出电平也挂在那一点上，没法叠成一条共用的驱动。多通道芯片把三个悬空通道做进同一颗芯片，每条采样线各跨一节。</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #293b3a; }
      .title { font-size: 20px; font-weight: 700; }
      .h { font-size: 15px; font-weight: 700; fill: #293b3a; }
      .body { font-size: 13px; fill: #293b3a; }
      .small { font-size: 13px; fill: #626d65; }
      .tiny { font-size: 12px; fill: #626d65; }
      .accent { fill: #176b73; }
      .green { fill: #377b60; }
      .red { fill: #b84745; }
      .gold { fill: #926717; }
      .cell { fill: #e4f0df; stroke: #377b60; stroke-width: 1.6; }
      .card { fill: #fffdf5; stroke: #968d77; stroke-width: 1.4; }
      .die { fill: none; stroke: #176b73; stroke-width: 1.8; stroke-dasharray: 8 6; }
      .chan { fill: #fffdf5; stroke: #176b73; stroke-width: 1.3; }
      .note { fill: #fbefc7; stroke: #926717; stroke-width: 1.3; }
      .strip { fill: #e4f0df; stroke: #377b60; stroke-width: 1.4; }
      .sense { stroke: #176b73; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
      .wire { stroke: #293b3a; stroke-width: 1.8; fill: none; }
      .dot { fill: #176b73; }
      @media (prefers-color-scheme: dark) {
        text { fill: #edf0e5; }
        .title { fill: #edf0e5; }
        .h { fill: #edf0e5; }
        .body { fill: #edf0e5; }
        .small { fill: #b0beb3; }
        .tiny { fill: #b0beb3; }
        .accent { fill: #7ec5c5; }
        .green { fill: #8fc7a2; }
        .red { fill: #f39b91; }
        .gold { fill: #dfbd78; }
        .cell { fill: #293f35; stroke: #8fc7a2; }
        .card { fill: #223333; stroke: #71908c; }
        .die { stroke: #7ec5c5; }
        .chan { fill: #223333; stroke: #7ec5c5; }
        .note { fill: #453e2b; stroke: #dfbd78; }
        .strip { fill: #293f35; stroke: #8fc7a2; }
        .sense { stroke: #7ec5c5; }
        .wire { stroke: #edf0e5; }
        .dot { fill: #7ec5c5; }
      }
    </style>
  </defs>

  <text x="480" y="34" text-anchor="middle" class="title">单节芯片为什么叠不出多串</text>
  <text x="480" y="62" text-anchor="middle" class="small">每节负极对包负极的电位都不同，芯片的参考点没法共用</text>

  <rect class="cell" x="110" y="100" width="140" height="80" rx="9"/>
  <text x="180" y="145" text-anchor="middle" class="h">第一节</text>
  <rect class="cell" x="110" y="180" width="140" height="80" rx="9"/>
  <text x="180" y="225" text-anchor="middle" class="h">第二节</text>
  <rect class="cell" x="110" y="260" width="140" height="80" rx="9"/>
  <text x="180" y="305" text-anchor="middle" class="h">第三节</text>
  <circle cx="180" cy="100" r="4" class="dot"/>
  <circle cx="180" cy="180" r="4" class="dot"/>
  <circle cx="180" cy="260" r="4" class="dot"/>
  <circle cx="180" cy="340" r="4" class="dot"/>
  <path class="wire" d="M180 340V356"/>
  <text x="180" y="374" text-anchor="middle" class="tiny">电池包负极</text>

  <rect class="die" x="500" y="80" width="400" height="280" rx="14"/>
  <text x="700" y="74" text-anchor="middle" class="tiny accent">一颗芯片，三个通道</text>

  <rect class="chan" x="540" y="100" width="330" height="60" rx="8"/>
  <text x="566" y="128" class="h">通道一</text>
  <text x="566" y="150" class="small">跨一节，悬空比较</text>
  <rect class="chan" x="540" y="180" width="330" height="60" rx="8"/>
  <text x="566" y="208" class="h">通道二</text>
  <text x="566" y="230" class="small">跨一节，悬空比较</text>
  <rect class="chan" x="540" y="260" width="330" height="60" rx="8"/>
  <text x="566" y="288" class="h">通道三</text>
  <text x="566" y="310" class="small">跨一节，悬空比较</text>

  <path class="sense" d="M250 100L540 120"/>
  <path class="sense" d="M250 180L540 142"/>
  <path class="sense" d="M250 180L540 200"/>
  <path class="sense" d="M250 260L540 222"/>
  <path class="sense" d="M250 260L540 280"/>
  <path class="sense" d="M250 340L540 302"/>
  <circle cx="540" cy="120" r="3.5" class="dot"/>
  <circle cx="540" cy="142" r="3.5" class="dot"/>
  <circle cx="540" cy="200" r="3.5" class="dot"/>
  <circle cx="540" cy="222" r="3.5" class="dot"/>
  <circle cx="540" cy="280" r="3.5" class="dot"/>
  <circle cx="540" cy="302" r="3.5" class="dot"/>

  <rect class="note" x="262" y="392" width="300" height="44" rx="10"/>
  <text x="412" y="420" text-anchor="middle" class="small accent">相邻两节共用一根线，负极电位不同</text>

  <rect class="strip" x="80" y="470" width="800" height="44" rx="12"/>
  <text x="480" y="498" text-anchor="middle" class="h green">不是把芯片叠起来，是把三个通道做进一颗芯片，各自跨一节</text>
  <text x="480" y="542" text-anchor="middle" class="tiny">每个通道的参考点，跟着自己那一节的负极走</text>
</svg>
