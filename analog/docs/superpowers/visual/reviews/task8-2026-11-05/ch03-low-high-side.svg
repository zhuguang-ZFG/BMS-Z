<text x="536" y="470" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">3.3V GPIO 够不着。</text>
<rect x="50" y="510" width="900" height="80" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
