<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#16202b">次谐波振荡：50% 占空比边界·分镜</text>
<text x="480" y="56" text-anchor="middle" font-size="12" fill="#5b666f">占空比一过 50% 就振、降到 50% 以下就好——这是它的指纹</text>
<rect x="20" y="70" width="450" height="300" rx="10" fill="#fdf8ea" stroke="#c9bb9d" stroke-width="1.2"/>
<g data-storyboard-beat="旋钮在40%" transform="translate(47 84) scale(0.4129)"><rect x="56" y="92" width="380" height="120" rx="12" fill="#f6eedb" stroke="#c9bb9d" stroke-width="1.4"/>
