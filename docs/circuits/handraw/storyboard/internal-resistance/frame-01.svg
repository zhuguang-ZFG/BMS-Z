<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
<defs>
 <filter id="w" filterUnits="userSpaceOnUse" x="0" y="0" width="960" height="560">
  <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="11" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="4.5" xChannelSelector="R" yChannelSelector="G"/>
 </filter>
 <filter id="grain" filterUnits="userSpaceOnUse" x="0" y="0" width="960" height="560">
  <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="5"/>
  <feColorMatrix type="saturate" values="0"/></filter>
</defs>
<rect width="960" height="560" fill="#f6f1e3"/>
<rect width="960" height="560" filter="url(#grain)" opacity="0.22"/>
<text x="480" y="84" font-family="KaiTi" font-size="20" fill="#003153" text-anchor="middle">内阻压降：端电压掉的那一截是谁吃掉的</text>

<!-- 电压标尺 4.0 V（上）→ 2.5 V（下） -->
<g filter="url(#w)" fill="none" stroke="#003153" stroke-linecap="round" stroke-width="1.6">
 <line x1="90" y1="180" x2="90" y2="430"/>
 <line x1="82" y1="180" x2="98" y2="180" stroke-width="1.8"/>
 <line x1="82" y1="263.3" x2="98" y2="263.3" stroke-width="1.8"/>
 <line x1="82" y1="346.7" x2="98" y2="346.7" stroke-width="1.8"/>
 <line x1="82" y1="430" x2="98" y2="430" stroke-width="1.8"/>
 <line x1="62" y1="396.7" x2="112" y2="396.7" stroke-dasharray="6 5" stroke-width="1.2"/>
</g>
<g font-family="KaiTi" font-size="13" fill="#003153">
 <text x="76" y="184" text-anchor="end">4.0 V</text>
 <text x="76" y="267" text-anchor="end">3.5 V</text>
 <text x="76" y="351" text-anchor="end">3.0 V</text>
 <text x="76" y="434" text-anchor="end">2.5 V</text>
 <text x="84" y="383" text-anchor="end" font-size="12">截止线 2.70 V</text>
</g>

<!-- 同一颗电芯 -->
<g filter="url(#w)" fill="none" stroke="#003153" stroke-linecap="round" stroke-linejoin="round">
 <rect x="180" y="205" width="85" height="160" rx="12" stroke-width="2.2"/>
 <line x1="222" y1="205" x2="222" y2="190" stroke-width="2"/>
 <line x1="222" y1="365" x2="222" y2="380" stroke-width="2"/>
 <path d="M222,215 L222,258 L214,272 L214,300 L222,314 L222,355" stroke-width="1.8"/>
 <line x1="214" y1="278" x2="222" y2="278" stroke-width="1.2"/>
 <line x1="214" y1="286" x2="222" y2="286" stroke-width="1.2"/>
 <line x1="214" y1="294" x2="222" y2="294" stroke-width="1.2"/>
 <line x1="214" y1="286" x2="300" y2="286" stroke-width="1.1"/>
 <path d="M222,190 L222,160 L800,160 L800,240" stroke-width="1.8"/>
 <path d="M800,335 L800,380 L222,380" stroke-width="1.8"/>
 <rect x="765" y="240" width="70" height="95" rx="8" stroke-width="1.8"/>
 <!-- 开关断开 -->
 <circle cx="560" cy="160" r="3.2" stroke-width="1.4"/>
 <circle cx="610" cy="160" r="3.2" stroke-width="1.4"/>
 <line x1="560" y1="160" x2="607" y2="131" stroke-width="1.8"/>
</g>
<g font-family="KaiTi" font-size="15" fill="#003153">
 <text x="200" y="232">+</text>
 <text x="200" y="352">−</text>
 <text x="306" y="282">R = 20 mΩ</text>
 <text x="800" y="293" text-anchor="middle">负载</text>
 <text x="585" y="122" text-anchor="middle" font-size="14">开关 S</text>
 <text x="420" y="136" text-anchor="middle" font-size="14">I = 0（无电流）</text>
</g>

<!-- 端电压读数 -->
<g filter="url(#w)" fill="none" stroke="#003153" stroke-linecap="round">
 <circle cx="90" cy="196.7" r="4.5" fill="#003153" stroke="none"/>
 <line x1="90" y1="196.7" x2="104" y2="196.7" stroke-width="1.2"/>
</g>
<g font-family="KaiTi" fill="#003153">
 <text x="60" y="474" font-size="22">端电压 3.90 V（示意）</text>
 <text x="60" y="506" font-size="14">静置：电流为零，端电压 = 开路电压</text>
</g>
<text x="480" y="546" font-family="KaiTi" font-size="14" fill="#003153" opacity="0.75" text-anchor="middle">原理示意 / 非实拍</text>
</svg>
