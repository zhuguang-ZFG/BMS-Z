<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 710" width="960" height="710" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" fill="#003153">
  <title id="title">16 串扫描：整轮 1.60 ms，首尾采样中心相差 1.50 ms</title>
  <desc id="desc">原理示意，非实拍。16 个通道每槽等稳 80 微秒、转换 20 微秒，整轮为 1.60 毫秒。各转换中心隔 100 微秒，首尾隔 15 个间隔，即 1.50 毫秒。下方两幅图使用相同的时间轴，以第一串采样中心为零点。各串 OCV 都是 3.700 V，瞬时电阻都是 1 毫欧，只考虑欧姆压降；电流在首尾采样之间从 0 A 线性升到 50 A，于是先后读到 3.700 V 和 3.650 V，形成 50 mV 表观差。相同电芯在同一时刻的电压仍相同。</desc>
  <rect width="960" height="710" fill="#fffdf5"/>
  <text x="36" y="44" font-size="27" font-weight="700">16 个读数排在一起，未必来自同一时刻</text>
  <text x="36" y="76" font-size="18">教学算例：各串 OCV = 3.700 V，R₀ = 1 mΩ；只考虑瞬时欧姆压降。</text>
  <text x="36" y="113" font-size="19" font-weight="700">一轮扫描</text>
  <text x="252" y="113" font-size="18">每槽 100 µs = 80 µs 等稳 + 20 µs 转换</text>
  <!-- Exact slot widths: 44 px = 100 us; conversion centers at slot +90 us. -->
  <g fill="#edf2f4" stroke="#003153" stroke-width="1">
    <rect x="108" y="131" width="44" height="26"/>
    <rect x="152" y="131" width="44" height="26"/>
    <rect x="196" y="131" width="44" height="26"/>
    <rect x="240" y="131" width="44" height="26"/>
    <rect x="284" y="131" width="44" height="26"/>
    <rect x="328" y="131" width="44" height="26"/>
    <rect x="372" y="131" width="44" height="26"/>
    <rect x="416" y="131" width="44" height="26"/>
    <rect x="460" y="131" width="44" height="26"/>
    <rect x="504" y="131" width="44" height="26"/>
    <rect x="548" y="131" width="44" height="26"/>
    <rect x="592" y="131" width="44" height="26"/>
    <rect x="636" y="131" width="44" height="26"/>
    <rect x="680" y="131" width="44" height="26"/>
    <rect x="724" y="131" width="44" height="26"/>
    <rect x="768" y="131" width="44" height="26"/>
  </g>
  <path d="M147.6 131v26 M191.6 131v26 M235.6 131v26 M279.6 131v26 M323.6 131v26 M367.6 131v26 M411.6 131v26 M455.6 131v26 M499.6 131v26 M543.6 131v26 M587.6 131v26 M631.6 131v26 M675.6 131v26 M719.6 131v26 M763.6 131v26 M807.6 131v26" stroke="#003153" stroke-width="8.8"/>
  <text x="108" y="182" font-size="17">第 1 串</text>
  <text x="812" y="182" text-anchor="end" font-size="17">第 16 串</text>
  <text x="840" y="150" font-size="16">深色：转换</text>
  <path d="M147.6 190 L147.6 203 Q480 205 807.6 203 L807.6 190" stroke="#003153" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <text x="480" y="229" text-anchor="middle" font-size="20" font-weight="700">首尾中心：15 个间隔 × 100 µs = 1.50 ms</text>
  <path d="M108 237 L108 250 Q470 252 812 250 L812 237" stroke="#003153" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <text x="480" y="276" text-anchor="middle" font-size="18">整轮占用：16 个时间槽 × 100 µs = 1.60 ms</text>
  <text x="36" y="316" font-size="19" font-weight="700">电流在变</text>
  <g fill="none" stroke="#003153">
    <path d="M147.6 329 V566 M807.6 329 V566" stroke-width="1" stroke-dasharray="5 6" opacity="0.35"/>
    <path d="M147.6 380 H807.6" stroke-width="1" opacity="0.5"/>
    <path d="M147.6 380 L807.6 330" stroke-width="3"/>
  </g>
  <circle cx="147.6" cy="380" r="4.5"/><circle cx="807.6" cy="330" r="4.5"/>
  <text x="120" y="386" text-anchor="end" font-size="19">0 A</text>
  <text x="830" y="336" font-size="19">50 A</text>
  <text x="480" y="401" text-anchor="middle" font-size="17">首尾采样之间：放电电流线性增加</text>
  <text x="36" y="426" font-size="19" font-weight="700">先后读数</text>
  <path d="M147.6 457 H807.6" stroke="#003153" stroke-width="1.3" stroke-dasharray="7 6" fill="none"/>
  <text x="650" y="446" font-size="17">相同 OCV 参考线</text>
  <path d="M147.6 457 L807.6 527" stroke="#003153" stroke-width="3" fill="none"/>
  <g>
    <circle cx="147.6" cy="457.000" r="4.5"/>
    <circle cx="191.6" cy="461.667" r="3"/>
    <circle cx="235.6" cy="466.333" r="3"/>
    <circle cx="279.6" cy="471.000" r="3"/>
    <circle cx="323.6" cy="475.667" r="3"/>
    <circle cx="367.6" cy="480.333" r="3"/>
    <circle cx="411.6" cy="485.000" r="3"/>
    <circle cx="455.6" cy="489.667" r="3"/>
    <circle cx="499.6" cy="494.333" r="3"/>
    <circle cx="543.6" cy="499.000" r="3"/>
    <circle cx="587.6" cy="503.667" r="3"/>
    <circle cx="631.6" cy="508.333" r="3"/>
    <circle cx="675.6" cy="513.000" r="3"/>
    <circle cx="719.6" cy="517.667" r="3"/>
    <circle cx="763.6" cy="522.333" r="3"/>
    <circle cx="807.6" cy="527.000" r="4.5"/>
  </g>
  <text x="124" y="463" text-anchor="end" font-size="18">3.700 V</text>
  <text x="742" y="550" font-size="18">3.650 V</text>
  <path d="M844 457 H854 M849 457 V527 M844 527 H854" fill="none" stroke="#003153" stroke-width="2"/>
  <text x="863" y="496" font-size="19" font-weight="700">50 mV</text>
  <path d="M147.6 566 H807.6" stroke="#003153" stroke-width="1.4"/>
  <g font-size="17" text-anchor="middle">
    <text x="147.6" y="591">t = 0 · 第 1 串</text>
    <text x="807.6" y="591">t = 1.50 ms · 第 16 串</text>
  </g>
  <text x="480" y="591" text-anchor="middle" font-size="16">以第一串采样中心为零点</text>
  <path d="M33 615 Q465 613 927 617 L926 697 Q470 700 34 695 Z" fill="#edf2f4" stroke="#003153" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="54" y="649" font-size="22" font-weight="700">50 A × 1 mΩ = 50 mV：时间差被误当成了电芯差。</text>
  <text x="54" y="682" font-size="17">本例中，同一时刻各串电压相同；先核对采样时刻，再判断串差。原理示意 / 非实拍。</text>
</svg>
