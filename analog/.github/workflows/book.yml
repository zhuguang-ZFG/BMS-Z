name: book

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  book:
    runs-on: ubuntu-latest
    # 整书已长到 60 页 / 393 张内嵌图，装配与审计在共享 runner 上 25–35 分钟
    # 属正常波动；30 分钟会把慢 runner 的正常构建掐成 cancelled。
    # 2026-11-10 两次实测：与 book-print 同刻开跑时整条 book 作业到 60 分钟
    # 被 cancelled（pages 的 build/deploy 因此 skipped）；单独重跑 36.5 分钟
    # 通过。上限留到 90 分钟，覆盖并发慢 runner，不改变任何产物契约。
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            analog-book/requirements.txt
      - run: pip install -r requirements.txt -r analog-book/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('analog-book/requirements.txt') }}
      - run: python -m playwright install --with-deps chromium
      - name: 站点构建
        run: python scripts/build_site.py --build
      - name: 整书单元与审计
        run: python -B -m unittest discover -s analog-book/tests -p "test_build.py" -v
      - name: 整书 HTML
        run: python analog-book/build_book.py --no-build
      - name: 产物审计
        run: python analog-book/build_book.py --check --no-build
      - name: PDF
        run: python analog-book/build_book.py --no-build --pdf
      - name: PDF 结构测试
        run: python -B -m unittest discover -s analog-book/tests -p "test_pdf.py" -v
      - name: 浏览器离线回归（公式、计算器、目录与全文搜索）
        run: python -B -m unittest discover -s analog-book/tests -p "test_browser_book.py" -v
      - uses: actions/upload-artifact@v4
        with:
          name: analog-circuit-book
          path: analog-book/dist/
          retention-days: 14
