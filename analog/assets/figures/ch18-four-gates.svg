<text x="67" y="450" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" font-weight="700" fill="#14213d">拦下：去耦失效·浪涌烧管</text>
<text x="67" y="472" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" fill="#52606d">打勾：100nF 去耦＋储能</text>
<text x="67" y="492" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" fill="#52606d">LDO 留 2× 余量·软启动</text>
<line x1="67" y1="502" x2="233" y2="502" stroke="#d0d5dd" stroke-width="1"/>
