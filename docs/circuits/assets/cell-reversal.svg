<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="ui-monospace, Consolas, monospace">
  <title>最弱单体被反极：串联放电末端，容量最小的单体先放空，pack 总电压还没到下限而放电继续——该单体被同伴电流反向充电，电压变负，析铜产气造成永久损伤</title>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .cell { fill: #e7f0fb; stroke: #0969da; stroke-width: 1.5; }
    .weak { fill: #fdf0e5; stroke: #bf8700; stroke-width: 1.5; }
    .bar { fill: #1a7f37; }
    .barlow { fill: #cf222e; }
    .volt { fill: #1f2328; font-size: 12px; }
    .neg { fill: #cf222e; font-size: 14px; font-weight: bold; }
    .cur { stroke: #0969da; stroke-width: 2.5; fill: none; stroke-dasharray: 7 5; }
    .badge { fill: #cf222e; }
    .badget { fill: #ffffff; font-size: 12px; font-weight: bold; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .cell { fill: #12233a; stroke: #4493f8; }
      .weak { fill: #2a2012; stroke: #d29922; }
      .bar { fill: #3fb950; }
      .barlow { fill: #ff7b72; }
      .volt { fill: #e6edf3; }
      .neg { fill: #ff7b72; }
      .cur { stroke: #4493f8; }
      .badge { fill: #ff7b72; }
      .badget { fill: #0d1117; }
    }
  </style>
  <rect class="bg" width="800" height="380"/>
  <text class="title" x="30" y="34">反极：最弱的那节电芯是怎么死掉的</text>

  <rect class="panel" x="40" y="56" width="450" height="250" rx="6"/>
  <!-- 放电电流环 -->
  <path class="cur" d="M 90 268 H 440"><animate attributeName="stroke-dashoffset" values="24;0" dur="0.8s" repeatCount="indefinite"/></path>
  <text class="small" x="330" y="288">放电电流继续流过每一节 →</text>

  <!-- 四节电芯 + 电量条 -->
  <g>
    <rect class="cell" x="80" y="100" width="70" height="150" rx="5"/>
    <rect class="bar" x="88" y="160" width="54" height="82">
      <animate attributeName="height" values="90;62;90" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="152;180;152" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text class="volt" x="92" y="90">3.2V</text><text class="small" x="88" y="264">正常</text>
  </g>
  <g>
    <rect class="cell" x="170" y="100" width="70" height="150" rx="5"/>
    <rect class="bar" x="178" y="150" width="54" height="92">
      <animate attributeName="height" values="100;72;100" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="142;170;142" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text class="volt" x="182" y="90">3.3V</text><text class="small" x="178" y="264">正常</text>
  </g>
  <g>
    <rect class="weak" x="260" y="100" width="70" height="150" rx="5"/>
    <rect class="barlow" x="268" y="230" width="54" height="12">
      <animate attributeName="height" values="16;2;16" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="226;240;226" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text class="neg" x="258" y="90">−0.8V ⚠
      <animate attributeName="opacity" values="1;0.3;1" dur="0.9s" repeatCount="indefinite"/>
    </text>
    <text class="small" x="262" y="264">最弱·已反极</text>
  </g>
  <g>
    <rect class="cell" x="350" y="100" width="70" height="150" rx="5"/>
    <rect class="bar" x="358" y="155" width="54" height="87">
      <animate attributeName="height" values="95;67;95" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="147;175;147" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text class="volt" x="362" y="90">3.2V</text><text class="small" x="358" y="264">正常</text>
  </g>

  <!-- 右侧三步讲清楚 -->
  <rect class="panel" x="510" y="56" width="250" height="250" rx="6"/>
  <circle class="badge" cx="534" cy="84" r="10"/><text class="badget" x="530" y="88">1</text>
  <text class="txt" x="552" y="89">弱节先放空到 0V</text>
  <circle class="badge" cx="534" cy="126" r="10"/><text class="badget" x="530" y="130">2</text>
  <text class="txt" x="552" y="131">总电压还没到下限，</text>
  <text class="txt" x="552" y="149">放电继续 → 电流硬推</text>
  <circle class="badge" cx="534" cy="186" r="10"/><text class="badget" x="530" y="190">3</text>
  <text class="txt" x="552" y="191">弱节被反向充电：</text>
  <text class="txt" x="552" y="209">负极析铜、产气，</text>
  <text class="txt" x="552" y="227">永久损伤甚至内短路</text>
  <text class="small" x="524" y="262">教训：pack 总电压看似正常</text>
  <text class="small" x="524" y="282">≠ 每节都安全——欠压保护</text>
  <text class="small" x="524" y="300">必须逐节看（§2.2 保护逻辑）</text>

  <text class="small" x="60" y="340">图中电量条随放电缓慢下降：最弱一节先归零后被电流顶成负压——串联组里"木桶效应"的极端版</text>
</svg>
