<line x1="44" y1="462" x2="916" y2="462" stroke="#003153" stroke-width="1" opacity="0.18" stroke-dasharray="" stroke-linecap="round"/>
<text x="44" y="488" font-family="Microsoft YaHei" font-size="16" text-anchor="start" fill="#003153" opacity="1" font-weight="normal">计满才切断：时间条件与开关动作必须对在同一帧。</text>
<text x="44" y="513" font-family="Microsoft YaHei" font-size="13" text-anchor="start" fill="#003153" opacity="0.75" font-weight="normal">阈值 4.25 V / 恢复 4.15 V / 去抖 20 ms 均为示意，不是产品设定值。</text>
<text x="916" y="542" font-family="Microsoft YaHei" font-size="12" text-anchor="end" fill="#003153" opacity="0.7" font-weight="normal">原理示意 / 非实拍</text>
