<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">偏置漂移：两条曲线共用一把尺</title>
<desc id="figDesc">示意模型：VBE 固定为 0.7 V；固定偏置限流 5.9 mA；温漂另算</desc>
<metadata id="visual-timeline">{&quot;duration&quot;: 12, &quot;beats&quot;: [{&quot;name&quot;: &quot;固定偏置&quot;, &quot;start&quot;: 0, &quot;end&quot;: 3, &quot;caption&quot;: &quot;固定偏置：β 增加，IC 上升，最终受负载限流。&quot;}, {&quot;name&quot;: &quot;分压反馈&quot;, &quot;start&quot;: 3, &quot;end&quot;: 6, &quot;caption&quot;: &quot;分压偏置：基流加载与 RE 反馈一起进入计算。&quot;}, {&quot;name&quot;: &quot;同轴比较&quot;, &quot;start&quot;: 6, &quot;end&quot;: 9, &quot;caption&quot;: &quot;同一组 β，同一根电流刻度；不能各自放大纵轴。&quot;}, {&quot;name&quot;: &quot;保留边界&quot;, &quot;start&quot;: 9, &quot;end&quot;: 12, &quot;caption&quot;: &quot;β 从 100 到 300：0.866 → 0.908 mA，约增 4.8%。&quot;}]}</metadata>
