<text x="622" y="149" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="18" font-weight="700" fill="#14213d">修 复</text>
<text x="592" y="184" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="13" fill="#52606d">修根因</text>
<text x="592" y="206" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="13" fill="#52606d">查症状背后的物理</text>
<text x="592" y="272" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="13" fill="#0f766e">防治标</text>

<circle cx="780" cy="142" r="13" fill="#fdf3e3" stroke="#b45309" stroke-width="1.6"/>
<text x="780" y="147" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="14" fill="#b45309">⑤</text>
<text x="802" y="149" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="18" font-weight="700" fill="#14213d">回归测试</text>
<text x="772" y="184" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="13" fill="#52606d">修好不算完</text>
<text x="772" y="206" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="13" fill="#52606d">跑过全温全工况才算</text>
<text x="772" y="272" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="13" fill="#0f766e">防假好</text>

<text x="56" y="344" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="16" font-weight="700" fill="#b45309">二分：6 节点最多 3 刀</text>
