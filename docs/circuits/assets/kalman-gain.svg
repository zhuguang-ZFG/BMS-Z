  <line class="grid" x1="82.0" y1="400.0" x2="88.0" y2="400.0"/>
  <text class="small" x="78.0" y="404.0" text-anchor="end">0</text>
  <line class="grid" x1="82.0" y1="307.0" x2="88.0" y2="307.0"/>
  <text class="small" x="78.0" y="311.0" text-anchor="end">0.5</text>
  <line class="grid" x1="82.0" y1="214.0" x2="88.0" y2="214.0"/>
  <text class="small" x="78.0" y="218.0" text-anchor="end">1</text>
