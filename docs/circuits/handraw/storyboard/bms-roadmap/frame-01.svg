<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
<defs>
 <filter id="w" filterUnits="userSpaceOnUse" x="0" y="0" width="960" height="560">
  <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="11" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="4.5" xChannelSelector="R" yChannelSelector="G"/>
 </filter>
 <filter id="grain" filterUnits="userSpaceOnUse" x="0" y="0" width="960" height="560">
  <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="5"/>
  <feColorMatrix type="saturate" values="0"/></filter>
</defs>
<rect width="960" height="560" fill="#f6f1e3"/>
<rect width="960" height="560" filter="url(#grain)" opacity="0.22"/>
<text x="480" y="84" font-family="KaiTi" font-size="20" fill="#003153" opacity="1" text-anchor="middle" font-weight="normal">BMS 学习路线：从一颗电芯到产品级系统</text>
<g filter="url(#w)" fill="none" stroke="#003153" stroke-linecap="round" stroke-linejoin="round"><line x1="75" y1="300" x2="885" y2="300" stroke-width="1.6"/></g>
<g filter="url(#w)" fill="none" stroke="#003153" stroke-linecap="round" stroke-linejoin="round"><line x1="75" y1="288" x2="75" y2="312" stroke-width="1.8"/><line x1="145" y1="288" x2="145" y2="312" stroke-width="1.8"/><line x1="205" y1="288" x2="205" y2="312" stroke-width="1.8"/><line x1="300" y1="288" x2="300" y2="312" stroke-width="1.8"/><line x1="475" y1="288" x2="475" y2="312" stroke-width="1.8"/><line x1="685" y1="288" x2="685" y2="312" stroke-width="1.8"/><line x1="790" y1="288" x2="790" y2="312" stroke-width="1.8"/></g>

<g filter="url(#w)" fill="none" stroke="#003153" stroke-linecap="round" stroke-linejoin="round"><circle cx="51" cy="300" r="7" fill="#003153" stroke="none"/></g>
<text x="480" y="546" font-family="KaiTi" font-size="14" fill="#003153" opacity="0.75" text-anchor="middle">原理示意 / 非实拍</text>
