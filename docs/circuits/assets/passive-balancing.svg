<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="passive-title passive-desc" font-family="'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title id="passive-title">被动均衡：多余能量去了电阻</title>
  <desc id="passive-desc">示意一节 4.20 V 电芯并联受开关控制的 100 Ω 均衡电阻。开关闭合时支路电流约 42 mA，电阻发热约 0.18 W；达到停止条件后关断。其他电芯不会收到这部分能量。</desc>
  <style>
    .bg { fill: #fffdf5; }
    .panel { fill: #f7f2e5; stroke: #cfc6b2; }
    .title, .ink { fill: #293b3a; }
    .title { font-size: 27px; font-weight: 750; }
    .muted { fill: #526158; }
    .rule { stroke: #65766c; }
    .guide { stroke: #c0b9a6; }
    .warm { fill: #faedcf; }
    .cool { fill: #e3efec; }
    .plain { fill: #f1ecdf; }
    .amber { fill: #8b5b13; }
    .teal { fill: #176b73; }
    .wire-amber { stroke: #8b5b13; }
    .wire-teal { stroke: #176b73; }
    .hot { fill: #a84036; }
    .wire-hot { stroke: #a84036; }
    .pulse { stroke: #fffdf5; }
    .outline { fill: none; stroke-width: 2.5; }
    .wire { fill: none; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
    .current { fill: none; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #192727; }
      .panel { fill: #223333; stroke: #496160; }
      .title, .ink { fill: #edf0e5; }
      .muted { fill: #b0beb3; }
      .rule { stroke: #a7b9aa; }
      .guide { stroke: #596e66; }
      .warm { fill: #453e2b; }
      .cool { fill: #29423f; }
      .plain { fill: #2e3936; }
      .amber { fill: #e7c586; }
      .teal { fill: #8bd0d0; }
      .wire-amber { stroke: #e7c586; }
      .wire-teal { stroke: #8bd0d0; }
      .hot { fill: #f39b91; }
      .wire-hot { stroke: #f39b91; }
      .pulse { stroke: #192727; }
    }
    /* Embedded images use the still picture source. Standalone SVGs use this media query. */
    @media (prefers-reduced-motion: reduce) and (scripting: enabled), print {
      .playback, .bms-doodle { display: none; }
      #passive-open { display: initial; opacity: 1 !important; }
    }
  </style><style id="bms-motion">
    /* bms-motion: 手帐式动效注记（纯装饰，不改技术几何与既有 SMIL 时序） */
    .bms-marker { fill: #fbefc7; opacity: .78; }
    .bms-under { fill: none; stroke: #926717; stroke-width: 2.4; stroke-linecap: round; opacity: .9; }
    .bms-spark-line { fill: none; stroke: #926717; stroke-width: 1.9; stroke-linecap: round; }
    .bms-spark-fill { fill: #926717; }
    .bms-spark-soft { fill: #176b73; opacity: .8; }
    .bms-sticker { fill: none; stroke: #926717; stroke-width: 2; stroke-dasharray: 7 5; stroke-linecap: round; opacity: .85; }
    .bms-halo { fill: none; stroke: #926717; stroke-width: 2; }
    .bms-marker, .bms-under, .bms-sticker, .bms-halo,
    .bms-spark, .bms-success, .bms-doodle { pointer-events: none; }
    circle:has(> animateMotion) { filter: drop-shadow(0 0 2px rgba(146,103,23,.5)) drop-shadow(0 0 5px rgba(196,145,52,.45)); }
    rect:has(> animateMotion) { filter: drop-shadow(0 0 3px rgba(196,145,52,.75)); }
    g:has(> circle):has(> path.stroke-check) { filter: drop-shadow(0 0 5px rgba(55,123,96,.5)); }
    @media (prefers-color-scheme: dark) {
      .bms-marker { fill: #453e2b; opacity: .85; }
      .bms-under { stroke: #dfbd78; }
      .bms-spark-line { stroke: #dfbd78; }
      .bms-spark-fill { fill: #dfbd78; }
      .bms-spark-soft { fill: #7ec5c5; }
      .bms-sticker { stroke: #dfbd78; }
      .bms-halo { stroke: #dfbd78; }
      circle:has(> animateMotion) { filter: drop-shadow(0 0 2px rgba(223,189,120,.8)) drop-shadow(0 0 7px rgba(223,189,120,.9)); }
      rect:has(> animateMotion) { filter: drop-shadow(0 0 6px rgba(223,189,120,.8)); }
      g:has(> circle):has(> path.stroke-check) { filter: drop-shadow(0 0 6px rgba(143,199,162,.7)); }
    }
    @media (prefers-reduced-motion: reduce) { .bms-spark, .bms-success, .bms-doodle { display: none; } }
</style>
  <rect class="bg" width="800" height="520"/>
  <rect class="bms-marker" aria-hidden="true" x="22.0" y="10.9" width="365.0" height="29.2" rx="6.5" transform="rotate(-.5 22.0 25.5)"/><path class="bms-under" aria-hidden="true" d="M28.0 44.0 q 24.0 -2.4 48.0 0 t 48 0 t 48 0 t 48 0 t 48 0 t 48 0 t 48 0"/><text class="title" x="28" y="36">被动均衡：多余能量去了电阻</text>
  <text x="28" y="69" class="muted" font-size="17">只看最高的一节：开关合上后，电流沿并联支路绕一圈。</text>

  <g aria-label="被动均衡的三个阶段">
    <rect x="28" y="92" width="234" height="68" rx="10" class="plain"/>
    <rect x="283" y="92" width="234" height="68" rx="10" class="warm"/>
    <rect x="538" y="92" width="234" height="68" rx="10" class="cool"/>
    <g class="ink" font-size="18" font-weight="700">
      <text x="45" y="119">① 等待均衡</text>
      <text x="300" y="119">② 闭合放热</text>
      <text x="555" y="119">③ 停止泄放</text>
    </g>
    <g class="muted" font-size="15">
      <text x="45" y="143">开关断开，支路无电流</text>
      <text x="300" y="143">高压电芯经电阻放电</text>
      <text x="555" y="143">满足停止条件，断开开关</text>
    </g>
  </g>

  <rect x="28" y="176" width="744" height="238" rx="14" class="panel"/><g class="bms-doodle" aria-hidden="true" transform="translate(742.0 200.0)"><animateTransform attributeName="transform" type="rotate" values="-6;7;-6" keyTimes="0;0.5;1" dur="5.4s" repeatCount="indefinite" additive="sum"/><animate attributeName="opacity" values="0.62;1;0.62" keyTimes="0;0.5;1" dur="3.6s" repeatCount="indefinite"/><path class="bms-spark-fill" d="M0 -9 L2.3 -2.3 L9 0 L2.3 2.3 L0 9 L-2.3 2.3 L-9 0 L-2.3 -2.3 Z"/></g><g class="bms-doodle" aria-hidden="true" transform="translate(706.0 190.0)"><animateTransform attributeName="transform" type="rotate" values="5;-4;5" keyTimes="0;0.5;1" dur="6.2s" repeatCount="indefinite" additive="sum"/><animate attributeName="opacity" values="0.5;0.9;0.5" keyTimes="0;0.5;1" dur="4.4s" repeatCount="indefinite"/><path class="bms-spark-soft" d="M0 -5.5 L1.4 -1.4 L5.5 0 L1.4 1.4 L0 5.5 L-1.4 1.4 L-5.5 0 L-1.4 -1.4 Z"/></g><g class="bms-doodle" aria-hidden="true"><circle class="bms-spark-fill" cx="724.0" cy="209.0" r="1.3"/><circle class="bms-spark-soft" cx="692.0" cy="206.0" r="1.1"/></g>
  <text x="52" y="207" class="ink" font-size="17" font-weight="700">高压电芯与并联均衡支路</text>
  <path class="wire rule" d="M176 279 V244 H296 M332 244 H456 V278 M456 330 V359 H176 V302"/>
  <path class="wire rule" d="M154 279 H198 M164 302 H188"/>
  <text x="202" y="281" class="muted" font-size="14">+</text>
  <text x="201" y="307" class="muted" font-size="14">−</text>
  <circle cx="296" cy="244" r="4" class="ink"/>
  <circle cx="332" cy="244" r="4" class="ink"/>
  <path class="wire rule" d="M456 278 l-8 6 16 8 -16 8 16 8 -16 8 8 6 v8"/>
  <text x="53" y="280" class="muted" font-size="14">高压电芯</text>
  <text x="53" y="305" class="ink" font-size="21" font-weight="700">4.20 V</text>
  <text x="316" y="220" class="muted" font-size="14" text-anchor="middle">均衡开关</text>
  <text x="612" y="276" class="muted" font-size="14">均衡电阻</text>
  <text x="612" y="301" class="ink" font-size="21" font-weight="700">100 Ω</text>
  <text x="612" y="328" class="hot" font-size="15">闭合时约 0.18 W</text>
  <text x="52" y="389" class="muted" font-size="15">图中只画出一节电芯。其余电芯没有收到这条支路消耗的能量。</text>
  <path class="wire rule" id="passive-open" d="M296 244 l34 -17">
    <animate attributeName="opacity" calcMode="discrete" keyTimes="0;0.22;0.74;1" values="1;0;1;1" dur="10s" repeatCount="indefinite"/>
  </path>

  <g class="playback" opacity="0" aria-hidden="true">
    <animate attributeName="opacity" to="1" dur="0.01s" fill="freeze"/>
    <rect x="28" y="92" width="234" height="68" rx="10" class="outline rule" id="passive-wait">
      <animate attributeName="opacity" calcMode="discrete" keyTimes="0;0.22;0.74;1" values="1;0;0;0" dur="10s" repeatCount="indefinite"/>
    </rect>
    <g id="passive-bleed" opacity="0">
      <animate attributeName="opacity" calcMode="discrete" keyTimes="0;0.22;0.74;1" values="0;1;0;0" dur="10s" repeatCount="indefinite"/>
      <rect x="283" y="92" width="234" height="68" rx="10" class="outline wire-amber"/>
      <path class="current wire-amber" d="M176 279 V244 H456 V277 M456 331 V359 H176 V302"/>
      <path class="current wire-amber" d="m357 238 8 6 -8 6 m36 103 -8 6 8 6"/>
      <path class="current wire-hot" d="M456 278 l-8 6 16 8 -16 8 16 8 -16 8 8 6 v8"/>
      <path class="wire wire-hot" d="M489 291 q9 -6 0 -12 t0 -12 m16 25 q9 -6 0 -12 t0 -12 m16 25 q9 -6 0 -12 t0 -12"/>
      <path class="wire pulse" d="M200 244 H296 M332 244 H456 V276 M456 335 V359 H200"
        stroke-dasharray="5 17" opacity=".85">
        <animate attributeName="stroke-dashoffset" from="22" to="0" dur="0.8s" repeatCount="indefinite"/>
      </path>
    </g>
    <rect x="538" y="92" width="234" height="68" rx="10" class="outline wire-teal" opacity="0" id="passive-stop">
      <animate attributeName="opacity" calcMode="discrete" keyTimes="0;0.22;0.74;1" values="0;0;1;1" dur="10s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="28" y="431" width="744" height="62" rx="10" class="warm"/>
  <text x="50" y="457" class="ink" font-size="17" font-weight="700">能量账　42 mA 流经电阻，电阻把电能变成热</text>
  <text x="50" y="480" class="muted" font-size="14">以 4.20 V 和 100 Ω 估算，忽略开关压降。动画按讲解节奏播放。</text>
</svg>
