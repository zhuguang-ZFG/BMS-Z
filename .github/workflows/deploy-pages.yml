name: deploy-pages

# 站点部署：统一成书链（设计 §7.4）产物发到 GitHub Pages。
# book/build.py all 一次产出站点（VitePress）、两卷单文件 HTML、A4/16K PDF、EPUB、
# 两卷下载目录（HTML/PDF/EPUB + SHA-256）与总审计；对账脚本在真正要发布的
# book/dist/site 上跑，任何死链、孤儿页或检索缺失都直接阻止部署。
# 与 tests 分开：闸门（tests）挡的是代码与文档质量，这里挡的是"能不能上线"；
# 部署失败不连累 tests 变红，反之 tests 全绿也不代表产物里链接条条可达。
on:
  push:
    branches: [main]
    # BMS*.html 是仓库根上由站点托管的那一页（BMS学习路径.html）：它的相对路径引用
    # 会被 copy-site-assets.mjs 改写，改写规则和它自己改了都得重新发布才算数。
    # 用通配而不是中文文件名，避免过滤规则在非 ASCII 路径上匹配不到。
    paths: ["docs/**", "analog/**", "bms-book/**", "book/**", "BMS*.md", "BMS*.html",
            "package.json", "package-lock.json", ".github/workflows/deploy-pages.yml",
            ".github/scripts/check_pages.py", ".github/scripts/check_search.mjs"]
  workflow_dispatch:
    inputs:
      collection_base_run:
        description: "可选：成功的全量发布 run ID，仅重排合集；正文变化时拒绝复用"
        required: false
        type: string

# 部署必须串行：两个部署并发会互相踢下线。与 tests/links 的排队组分开，
# 文档站上线不该排在 C 测试后面。
concurrency:
  group: bms-z-pages
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    # runner 镜像钉死 24.04：理由见 tests.yml 顶部注释（ubuntu-latest 正在迁 Ubuntu 26）。
    # checkout / setup-node 取 Node 24 大版本：Node 20 已被 GitHub 弃用，理由同上。
    runs-on: ubuntu-24.04
    # 与 book.yml 同量级：两卷全链路在共享 runner 上 60–90 分钟属正常波动。
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            analog/requirements.txt
            analog/analog-book/requirements.txt
            bms-book/requirements.txt
      - run: pip install -r analog/requirements.txt -r analog/analog-book/requirements.txt -r bms-book/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('analog/analog-book/requirements.txt') }}
      - run: python -m playwright install --with-deps chromium
      # runner 无中文字体时 PDF 是豆腐块（v0.6.2 线上件即如此）：字体是构建输入。
      - name: 安装中文字体
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: 手绘图 PDF 文字保真预检
        run: python -m unittest discover -s book/tests -p test_reading_sketch_output.py -v
      - name: 安装固定版本 EPUBCheck
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip -o "$RUNNER_TEMP/epubcheck.zip"
          echo "33350c61038e71dfb3d45a76aed04bf5481e6d5500cb780f6e98db8bbd15a28c  $RUNNER_TEMP/epubcheck.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/epubcheck.zip" -d "$RUNNER_TEMP/epubcheck"
          echo "EPUBCHECK_JAR=$RUNNER_TEMP/epubcheck/epubcheck-5.4.0/epubcheck.jar" >> "$GITHUB_ENV"
      - name: 共享术语表同步预检
        run: python book/build_glossary.py --check
      # 全链路一次到位：站点 + 四类介质 + 下载目录 + 总审计。
      # npm run docs:build（在 all 内部）末尾的 check_site_bundle.mjs 守 bundle 预算。
      - name: 两卷全链路构建（站点 + 介质 + 下载包 + 审计）
        if: ${{ inputs.collection_base_run == '' }}
        run: python book/build.py all
      - name: 从已验证发布中重排合集
        if: ${{ inputs.collection_base_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECTION_BASE_RUN: ${{ inputs.collection_base_run }}
        run: python book/refresh_collection.py
      - name: 合集自动阅读兼容性（小屏、大字、深色与交互）
        run: |
          python book/check_compatibility.py
          python book/check_reading_sketches.py
      - name: 站内链接与锚点对账（产物侧）
        run: python3 .github/scripts/check_pages.py book/dist/site
      - name: 中文检索对账（正文有的词搜索必须翻到）
        run: node .github/scripts/check_search.mjs book/dist/site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: book/dist/site

  # 上传完成后另起部署 job，避开同 job 立即查询产物偶发返回空列表的问题。
  # actions/deploy-pages#451；部署失败可只重跑此 job，避免重复上传同名产物。
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
