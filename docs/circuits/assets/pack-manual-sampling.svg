<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480">
  <title>包级手册里的采样与保护示意图</title>
  <rect width="880" height="480" fill="#f8fafc"/>
  <style>
  text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
  @media (prefers-color-scheme: dark){
  rect[fill="#f8fafc"]{fill:#0f172a}
  rect[fill="#fff"]{fill:#1e293b}
  [fill="#e2e8f0"]{fill:#334155}
  [stroke="#e2e8f0"]{stroke:#334155}
  [fill="#334155"]{fill:#e2e8f0}
  [stroke="#334155"]{stroke:#e2e8f0}
  [fill="#1e293b"]{fill:#f1f5f9}
  [stroke="#1e293b"]{stroke:#f1f5f9}
  [fill="#dbeafe"]{fill:#1e3a8a}
  [stroke="#dbeafe"]{stroke:#1e3a8a}
  [fill="#1d4ed8"]{fill:#60a5fa}
  [stroke="#1d4ed8"]{stroke:#60a5fa}
  [fill="#ecfdf5"]{fill:#022c22}
  [fill="#059669"]{fill:#34d399}
  [stroke="#059669"]{stroke:#34d399}
  [fill="#fffbeb"]{fill:#451a03}
  [fill="#fef3c7"]{fill:#78350f}
  [fill="#b45309"]{fill:#fbbf24}
  [stroke="#b45309"]{stroke:#fbbf24}
  [fill="#fef2f2"]{fill:#450a0a}
  [fill="#fecaca"]{fill:#7f1d1d}
  [fill="#dc2626"]{fill:#f87171}
  [stroke="#dc2626"]{stroke:#f87171}
  }
  </style>

  <text x="440" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">包级手册要画出采样，并写下这颗电芯的阈值</text>
  <text x="440" y="50" text-anchor="middle" font-size="13" fill="#b45309">示意图·待公开手册</text>
  <rect x="20" y="68" width="410" height="280" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="36" y="94" font-size="15" font-weight="bold" fill="#1e293b">钠离子包</text>
  <rect x="36" y="108" width="70" height="36" rx="4" fill="#dbeafe" stroke="#1d4ed8"><animate attributeName="stroke-width" values="5;2;5" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/></rect>
  <text x="71" y="131" text-anchor="middle" font-size="12" fill="#1e293b">电芯</text>
  <rect x="122" y="108" width="70" height="36" rx="4" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="157" y="131" text-anchor="middle" font-size="12" fill="#1e293b">电芯</text>
  <rect x="208" y="108" width="70" height="36" rx="4" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="243" y="131" text-anchor="middle" font-size="12" fill="#1e293b">电芯</text>
  <rect x="300" y="100" width="110" height="52" rx="4" fill="#fffbeb" stroke="#b45309"><animate attributeName="stroke-width" values="2;5;2" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/></rect>
  <text x="355" y="122" text-anchor="middle" font-size="12" fill="#1e293b">模块监控</text>
  <text x="355" y="140" text-anchor="middle" font-size="11" fill="#334155">逐串抽头</text>
  <circle cy="126" r="5" fill="#1d4ed8">
    <animate attributeName="cx" values="71;355;71" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <text x="36" y="180" font-size="13" fill="#334155">阈值格：跟装进去的那颗电芯</text>
  <text x="36" y="202" font-size="13" fill="#334155">超钠和海四达不要写成同一行</text>
  <rect x="36" y="220" width="370" height="100" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="48" y="248" font-size="13" fill="#1e293b">寄存器地址：空</text>
  <text x="48" y="272" font-size="13" fill="#1e293b">接触器时序：空</text>
  <text x="48" y="296" font-size="13" fill="#b45309">待公开手册</text>
  <rect x="450" y="68" width="410" height="280" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="466" y="94" font-size="15" font-weight="bold" fill="#1e293b">固态 / 结构电池包</text>
  <rect x="466" y="108" width="160" height="44" rx="4" fill="#ecfdf5" stroke="#059669"/>
  <text x="546" y="135" text-anchor="middle" font-size="12" fill="#1e293b">电芯或整块电极</text>
  <rect x="646" y="108" width="190" height="44" rx="4" fill="#fffbeb" stroke="#b45309"/>
  <text x="741" y="128" text-anchor="middle" font-size="12" fill="#1e293b">采样是端电压</text>
  <text x="741" y="144" text-anchor="middle" font-size="11" fill="#334155">另加压力或温度</text>
  <circle cy="130" r="5" fill="#059669">
    <animate attributeName="cx" values="546;741;546" keyTimes="0;0.5;1" dur="7s" repeatCount="indefinite"/>
  </circle>
  <text x="466" y="180" font-size="13" fill="#334155">固态：液体正极电解液仍可能在</text>
  <text x="466" y="202" font-size="13" fill="#334155">结构：量到的是整块板，不是一节圆柱</text>
  <rect x="466" y="220" width="370" height="100" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="478" y="248" font-size="13" fill="#1e293b">保护阈值表：空</text>
  <text x="478" y="272" font-size="13" fill="#1e293b">压力测点：空</text>
  <text x="478" y="296" font-size="13" fill="#b45309">待公开手册</text>
  <text x="20" y="376" font-size="14" fill="#1e293b">蓝点和绿点沿采样线走。空格是手册里还没有公开的那几页。</text>
  <text x="20" y="404" font-size="14" fill="#334155">团体标准可以定义「要采集单体电压」，那仍然不是某一家的寄存器地图。</text>
  <text x="20" y="432" font-size="14" fill="#334155">电芯规格书写单体该在哪停。包级原理图写抽头、均衡和接触器怎么接。</text>

</svg>
