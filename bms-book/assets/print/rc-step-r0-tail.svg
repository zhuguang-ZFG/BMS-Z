<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 800 460" font-family="ui-monospace, Consolas, monospace" data-snapshot-time="9">
  <title>阶跃放电的端电压：欧姆压降立刻出现，RC 极化尾巴随后跟上。数字为示意。</title>
  <desc>亮点走一次阶跃放电：t=0 立刻掉下欧姆压降，随后约 8 s 的 RC 尾巴慢慢跟上，卸流瞬间反向弹回。</desc>

  <style>
    .bg { fill: #fffdf5; }
    .panel { fill: #f7f2e5; stroke: #cfc6b2; }
    .axis { stroke: #626d65; stroke-width: 1.5; fill: none; }
    .txt { fill: #293b3a; font-size: 13px; }
    .small { fill: #626d65; font-size: 12px; }
    .title { fill: #293b3a; font-size: 16px; font-weight: bold; }
    .hi { fill: #176b73; }
    .warn { fill: #b84745; }
    .ok { fill: #377b60; }
    .gold { fill: #926717; }
    .lineb { stroke: #176b73; stroke-width: 2.5; fill: none; }
    .liner { stroke: #b84745; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #377b60; stroke-width: 2.5; fill: none; }
    .liney { stroke: #926717; stroke-width: 2.5; fill: none; }
    .dotb { fill: #176b73; }
    .dotr { fill: #b84745; }
    .dotg { fill: #377b60; }
    .doty { fill: #926717; }
    .boxb { fill: #e4f0df; stroke: #176b73; }
    .boxr { fill: #f6e2df; stroke: #b84745; }
    .boxg { fill: #e4f0df; stroke: #377b60; }
    .boxy { fill: #fbefc7; stroke: #926717; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #192727; }
      .panel { fill: #223333; stroke: #496160; }
      .axis { stroke: #b0beb3; }
      .txt { fill: #edf0e5; }
      .small { fill: #b0beb3; }
      .title { fill: #edf0e5; }
      .hi { fill: #7ec5c5; }
      .warn { fill: #f39b91; }
      .ok { fill: #8fc7a2; }
      .gold { fill: #dfbd78; }
      .lineb { stroke: #7ec5c5; }
      .liner { stroke: #f39b91; }
      .lineg { stroke: #8fc7a2; }
      .liney { stroke: #dfbd78; }
      .dotb { fill: #7ec5c5; }
      .dotr { fill: #f39b91; }
      .dotg { fill: #8fc7a2; }
      .doty { fill: #dfbd78; }
      .boxb { fill: #293f35; stroke: #7ec5c5; }
      .boxr { fill: #483336; stroke: #f39b91; }
      .boxg { fill: #293f35; stroke: #8fc7a2; }
      .boxy { fill: #453e2b; stroke: #dfbd78; }
    }
  </style>

  <rect class="bg" width="800" height="460"/>

  <text class="title" x="24" y="32">阶跃电流之后：先掉 R0，再拖 RC 尾巴（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="122" rx="6"/>
  <text class="txt" x="40" y="68" opacity="1" style="opacity: 1;">① 放电前<tspan class="small">　端电压停在 3.700 V，电流 0。</tspan></text>
  <text class="txt" x="40" y="94" opacity="1" style="opacity: 1;">② t=0 接通 20 A<tspan class="small">　R0=2 mΩ，立刻掉 20×2 mΩ=40 mV，落到 3.660 V。</tspan></text>
  <text class="txt" x="40" y="120" opacity="1" style="opacity: 1;">③ 随后 8 s<tspan class="small">　极化尾巴再走大约 38 mV（示意 τ=8 s，稳态尾巴 60 mV 的 63%）。</tspan></text>
  <text class="txt" x="40" y="146" opacity="1" style="opacity: 1;">④ 卸流瞬间<tspan class="small">　40 mV 立刻回来；剩下的尾巴要几十秒才回到开路。</tspan></text>
  <rect class="panel" x="24" y="180" width="752" height="210" rx="6"/>
  <text class="small" x="40" y="202">端电压（示意，不是示波器截图）</text>
  <line class="axis" x1="70" y1="200" x2="70" y2="370"/>
  <line class="axis" x1="70" y1="370" x2="720" y2="370"/>
  <text class="small" x="28" y="235">3.700</text>
  <text class="small" x="28" y="278">3.660</text>
  <path class="lineb" d="M80.0 231.4 L113.3 231.4 L146.7 231.4 L146.7 274.3 L163.3 281.8 L180.0 288.5 L196.7 294.4 L213.3 299.6 L230.0 304.2 L246.7 308.2 L263.3 311.8 L280.0 314.9 L296.7 317.7 L313.3 320.2 L330.0 322.3 L346.7 324.2 L363.3 325.9 L380.0 327.4 L396.7 328.7 L413.3 329.9 L430.0 330.9 L446.7 331.8 L463.3 332.6 L480.0 333.3 L496.7 333.9 L513.3 334.5 L530.0 334.9 L546.7 335.4 L546.7 292.5 L580.0 279.0 L613.3 268.5 L646.7 260.3 L680.0 253.9" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="686.027px" stroke-linejoin="round" stroke-linecap="round" style="stroke-dashoffset: 686.027px;">

  </path>
  <path class="liner" d="M146.7 231.4 L146.7 274.3" stroke-dasharray="80" stroke-dashoffset="0px" style="stroke-dashoffset: 0px;">

  </path>
  <path class="lineg" d="M546.7 335.4 L546.7 292.5" stroke-dasharray="80" stroke-dashoffset="77.7423px" style="stroke-dashoffset: 77.7423px;">

  </path>
  <text class="warn" x="168" y="236">R0 立刻 −40 mV</text>
  <text class="hi" x="288.0" y="306.9">τ=8 s，再约 38 mV</text>
  <text class="ok" x="554.7" y="284.5">卸流 +40 mV</text>
  <text class="small" x="138.7" y="384">t=0</text>
  <text class="small" x="270.0" y="384">8 s</text>
  <text class="small" x="530.7" y="384">24 s = 3τ</text>
  <circle class="doty" r="6" cx="546.7000122070312" cy="306.79998779296875">


  </circle>
  <text class="small" x="24" y="446">数字是教学示意：20 A、2 mΩ、τ=8 s。先减掉立刻的 40 mV，再谈极化。不是某一颗电芯的脉冲记录。</text>

</svg>
