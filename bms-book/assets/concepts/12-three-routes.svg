<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">三条路的分工：连续记账、静置对账、每拍校正</title>
  <desc id="desc">上方是 2 h 放电、8 h 静置、1 h 充电、8 h 静置、2 h 放电、168 h 静置、1 h 充电、48 h 静置的 238 h 工况时间轴，四次静置下方标出四个 OCV 锚点；下方三张卡片分别说明纯库仑、库仑加锚点与 EKF 的记账方式，并给出前两者的终值与偏差，EKF 只做机制示意。</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #293b3a; }
      .title { font-size: 20px; font-weight: 700; }
      .h { font-size: 15px; font-weight: 700; fill: #293b3a; }
      .body { font-size: 13px; fill: #293b3a; }
      .small { font-size: 12px; fill: #626d65; }
      .tiny { font-size: 11px; fill: #626d65; }
      .muted { fill: #626d65; }
      .accent { fill: #176b73; }
      .green { fill: #377b60; }
      .red { fill: #b84745; }
      .panel { fill: #f7f2e5; stroke: #cfc6b2; stroke-width: 1.5; }
      .card { fill: #fffdf5; stroke: #968d77; stroke-width: 1.4; }
      .chip-mint { fill: #e4f0df; stroke: #377b60; stroke-width: 1.2; }
      .chip-rose { fill: #f6e2df; stroke: #b84745; stroke-width: 1.2; }
      .act { fill: #eae4d3; stroke: #968d77; stroke-width: 1.3; }
      .restbar { fill: #e4f0df; stroke: #377b60; stroke-width: 1.3; }
      .pin { fill: #fffdf5; stroke: #377b60; stroke-width: 1.2; }
      .axis { stroke: #968d77; stroke-width: 1.4; fill: none; }
      .grid { stroke: #cfc6b2; stroke-width: 1; stroke-dasharray: 3 4; fill: none; }
      .jag { stroke: #176b73; stroke-width: 2; fill: none; stroke-linejoin: round; }
      .smooth { stroke: #b84745; stroke-width: 2.2; fill: none; }
      .saw { stroke: #377b60; stroke-width: 2.2; fill: none; stroke-linejoin: round; }
      .leader { stroke: #626d65; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
      .dot { fill: #176b73; }
      .dot-red { fill: #b84745; }
      .dot-green { fill: #377b60; }
      .tape { fill: #fbefc7; stroke: #cfc6b2; stroke-width: 1.2; }
      .strike { stroke: #176b73; stroke-width: 2; fill: none; }
      @media (prefers-color-scheme: dark) {
        text { fill: #edf0e5; }
        .h { fill: #edf0e5; }
        .body { fill: #edf0e5; }
        .small { fill: #b0beb3; }
        .tiny { fill: #b0beb3; }
        .muted { fill: #b0beb3; }
        .accent { fill: #7ec5c5; }
        .green { fill: #8fc7a2; }
        .red { fill: #f39b91; }
        .panel { fill: #223333; stroke: #496160; }
        .card { fill: #223333; stroke: #71908c; }
        .chip-mint { fill: #293f35; stroke: #8fc7a2; }
        .chip-rose { fill: #483336; stroke: #f39b91; }
        .act { fill: #31403d; stroke: #71908c; }
        .restbar { fill: #293f35; stroke: #8fc7a2; }
        .pin { fill: #192727; stroke: #8fc7a2; }
        .axis { stroke: #71908c; }
        .grid { stroke: #496160; }
        .jag { stroke: #7ec5c5; }
        .smooth { stroke: #f39b91; }
        .saw { stroke: #8fc7a2; }
        .leader { stroke: #b0beb3; }
        .dot { fill: #7ec5c5; }
        .dot-red { fill: #f39b91; }
        .dot-green { fill: #8fc7a2; }
        .tape { fill: #453e2b; stroke: #496160; }
        .strike { stroke: #7ec5c5; }
      }
    </style>
  </defs>

  <text x="480" y="32" text-anchor="middle" class="title">三条路的分工：连续记账、静置对账、每拍校正</text>
  <path d="M312 41C392 39 472 43 552 40" class="strike" opacity=".55"/>
  <path d="M316 46C396 44 474 47 548 45" class="strike" opacity=".35"/>

  <g transform="rotate(-2 136 54)">
    <rect class="tape" x="64" y="42" width="144" height="22" rx="3"/>
    <text x="136" y="57" text-anchor="middle" class="tiny">BMS-Z 回放 · 238 h</text>
  </g>

  <text x="480" y="64" text-anchor="middle" class="small">同一段 238 h 工况，偏差怎么攒、怎么收。</text>

  <rect class="panel" x="40" y="76" width="880" height="160" rx="14"/>
  <text x="60" y="102" class="small">238 h 工况：100 Ah · LFP 式平坦 OCV 表</text>
  <rect class="chip-mint" x="738" y="86" width="162" height="24" rx="12"/>
  <text x="819" y="102" text-anchor="middle" class="body green">真值终点 40.00%</text>

  <text x="80" y="118" class="tiny">0 h</text>
  <text x="880" y="118" text-anchor="end" class="tiny">238 h</text>

  <rect class="act" x="80" y="124" width="60" height="36"/>
  <rect class="restbar" x="140" y="124" width="96" height="36"/>
  <rect class="act" x="236" y="124" width="44" height="36"/>
  <rect class="restbar" x="280" y="124" width="96" height="36"/>
  <rect class="act" x="376" y="124" width="60" height="36"/>
  <rect class="restbar" x="436" y="124" width="240" height="36"/>
  <rect class="act" x="676" y="124" width="44" height="36"/>
  <rect class="restbar" x="720" y="124" width="160" height="36"/>

  <text x="110" y="146" text-anchor="middle" class="tiny">放 2 h</text>
  <text x="188" y="146" text-anchor="middle" class="small green">静置 8 h</text>
  <text x="258" y="146" text-anchor="middle" class="tiny">充 1 h</text>
  <text x="328" y="146" text-anchor="middle" class="small green">静置 8 h</text>
  <text x="406" y="146" text-anchor="middle" class="tiny">放 2 h</text>
  <text x="556" y="146" text-anchor="middle" class="small green">静置 168 h</text>
  <text x="698" y="146" text-anchor="middle" class="tiny">充 1 h</text>
  <text x="800" y="146" text-anchor="middle" class="small green">静置 48 h</text>

  <line class="leader" x1="188" y1="160" x2="188" y2="172"/>
  <line class="leader" x1="328" y1="160" x2="328" y2="172"/>
  <line class="leader" x1="556" y1="160" x2="556" y2="172"/>
  <line class="leader" x1="800" y1="160" x2="800" y2="172"/>
  <circle class="pin" cx="188" cy="181" r="9"/>
  <circle class="pin" cx="328" cy="181" r="9"/>
  <circle class="pin" cx="556" cy="181" r="9"/>
  <circle class="pin" cx="800" cy="181" r="9"/>
  <text x="188" y="185" text-anchor="middle" class="tiny accent">1</text>
  <text x="328" y="185" text-anchor="middle" class="tiny accent">2</text>
  <text x="556" y="185" text-anchor="middle" class="tiny accent">3</text>
  <text x="800" y="185" text-anchor="middle" class="tiny accent">4</text>

  <text x="60" y="218" class="tiny">绿段＝静置，也是四次 OCV 锚点机会；浅色段＝电流工况（20 A 放 / 10 A 充）。段长不按比例。</text>

  <text x="920" y="266" text-anchor="end" class="tiny">右侧小图：行为示意，不按数值比例</text>

  <rect class="card" x="40" y="280" width="880" height="76" rx="10"/>
  <circle cx="68" cy="304" r="12" class="chip-rose"/>
  <text x="68" y="309" text-anchor="middle" class="body red">1</text>
  <text x="90" y="309" class="h">纯库仑：只记账，不回头</text>
  <text x="90" y="332" class="body">电流表偏 +0.05 A → 终值 <tspan font-weight="700" class="red">51.90%</tspan>，偏真值 <tspan font-weight="700" class="red">+11.90 pp</tspan>。</text>
  <text x="90" y="352" class="tiny">0.05 A × 238 h ÷ 100 Ah = 11.90 pp，错得完全可算。</text>
  <line class="grid" x1="700" y1="338" x2="892" y2="338"/>
  <polyline class="smooth" points="706,332 866,300"/>
  <circle cx="866" cy="300" r="4" class="dot-red"/>
  <text x="872" y="303" class="tiny red">继续漂</text>

  <rect class="card" x="40" y="366" width="880" height="76" rx="10"/>
  <circle cx="68" cy="390" r="12" class="chip-mint"/>
  <text x="68" y="395" text-anchor="middle" class="body green">2</text>
  <text x="90" y="395" class="h">库仑 + 锚点：合格静置时对账</text>
  <text x="90" y="418" class="body">同样偏置 → 终值 <tspan font-weight="700" class="green">46.15%</tspan>，偏真值 <tspan font-weight="700" class="green">+6.15 pp</tspan>（只砍一半）。</text>
  <text x="90" y="438" class="tiny">最大一次：9.06 pp 只收回 2.72 pp（权重 0.3）。</text>
  <line class="grid" x1="700" y1="424" x2="892" y2="424"/>
  <polyline class="saw" points="706,418 748,406 748,412 790,402 790,408 832,397 832,403 866,394"/>
  <circle cx="748" cy="412" r="3" class="dot-green"/>
  <circle cx="790" cy="408" r="3" class="dot-green"/>
  <circle cx="832" cy="403" r="3" class="dot-green"/>
  <circle cx="866" cy="394" r="3" class="dot-green"/>
  <text x="872" y="398" class="tiny green">对账</text>

  <rect class="card" x="40" y="452" width="880" height="76" rx="10"/>
  <circle cx="68" cy="476" r="12" class="chip-mint"/>
  <text x="68" y="481" text-anchor="middle" class="body accent">3</text>
  <text x="90" y="481" class="h">EKF：每拍都用电压残差拉一把</text>
  <text x="90" y="504" class="body">不需要静置窗口；修正量取决于模型、噪声与增益。</text>
  <text x="90" y="524" class="tiny">§12.3 一维增益推导；第 27 章展开六矩阵。</text>
  <line class="grid" x1="700" y1="490" x2="892" y2="490"/>
  <polyline class="jag" points="706,492 716,486 726,494 736,488 746,491 756,485 766,493 776,488 786,491 796,486 806,493 816,489 826,486 836,492 846,488 856,490 866,487"/>
  <text x="872" y="494" class="tiny accent">每拍</text>

  <text x="480" y="548" text-anchor="middle" class="tiny">数值取自 code/soc_coulomb_ocv.py 的五次回放，真值终点 40.00%；EKF 一行为机制示意，未列入该表。</text>
</svg>
