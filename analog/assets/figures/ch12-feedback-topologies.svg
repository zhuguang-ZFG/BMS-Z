<text x="658" y="189" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" fill="#14213d">回送：并联比流（虚地汇流）</text>
<text x="658" y="210" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" font-weight="700" fill="#14213d">钉死：跨阻 Vout/Iin = −Rf</text>
