<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-labelledby="title desc">
  <title id="title">LibreSolar 的五状态机与两张许可</title>
  <desc id="desc">LibreSolar 把测量、许可与开关动作收进一个上下文：bms_chg_allowed 与 bms_dis_allowed 把故障位、满空标志和人工使能合成两个方向的许可。OFF 按许可进入 CHG 或 DIS；两向都允许进 NORMAL；某一向失去许可只关那一路并退回单向；两向都不允许回 OFF；两路都关之后才进 SHUTDOWN 等待关机。</desc>
  <style>
    .bg { fill: #fffdf5; }
    .ink { fill: #293b3a; }
    .muted { fill: #626d65; }
    .green { fill: #e4f0df; stroke: #377b60; }
    .gold { fill: #fbefc7; stroke: #926717; }
    .purple { fill: #eee5f1; stroke: #7c648e; }
    .state { fill: #ffffff; stroke: #176b73; stroke-width: 2; }
    .state-dim { fill: #ffffff; stroke: #71908c; stroke-width: 1.8; }
    .panel { fill: #edf0e5; stroke: #b0beb3; stroke-width: 1.4; }
    .green-text { fill: #36775e; }
    .gold-text { fill: #8e6518; }
    .purple-text { fill: #736085; }
    .red-text { fill: #ad4644; }
    .teal-text { fill: #176b73; }
    .line { fill: none; stroke: #626d65; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .back { fill: none; stroke: #926717; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 7 6; }
    .marker-arrow { fill: #626d65; }
    .marker-back { fill: #926717; }
    .sketch { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .title { font: 700 18px "Noto Sans SC", "Microsoft YaHei", sans-serif; }
    .head { font: 700 14px "Noto Sans SC", "Microsoft YaHei", sans-serif; }
    .body { font: 12px "Noto Sans SC", "Microsoft YaHei", sans-serif; }
    .small { font: 11px "Noto Sans SC", "Microsoft YaHei", sans-serif; }
    .state-name { font: 700 14px ui-monospace, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #192727; }
      .ink { fill: #edf0e5; }
      .muted { fill: #b0beb3; }
      .green { fill: #293f35; stroke: #8fc7a2; }
      .gold { fill: #453e2b; stroke: #dfbd78; }
      .purple { fill: #392f40; stroke: #c3a8cf; }
      .state { fill: #223333; stroke: #7ec5c5; }
      .state-dim { fill: #223333; stroke: #71908c; }
      .panel { fill: #293f35; stroke: #71908c; }
      .green-text { fill: #8fc7a2; }
      .gold-text { fill: #dfbd78; }
      .purple-text { fill: #d4bde0; }
      .red-text { fill: #f39b91; }
      .teal-text { fill: #7ec5c5; }
      .line { stroke: #b0beb3; }
      .back { stroke: #dfbd78; }
      .marker-arrow { fill: #b0beb3; }
      .marker-back { fill: #dfbd78; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" class="marker-arrow"/>
    </marker>
    <marker id="back-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" class="marker-back"/>
    </marker>
  </defs>

  <rect class="bg" width="1000" height="620"/>
  <path d="M24 40 C122 34 222 45 322 37" class="sketch" stroke="#926717" stroke-width="3" opacity=".82"/>
  <text x="24" y="33" class="title ink">许可先合成，状态再动作</text>
  <text x="24" y="62" class="body muted">测量、许可、开关收进一个上下文；一次迁移只回答一个问题。</text>

  <rect x="24" y="88" width="226" height="340" rx="8" class="panel"/>
  <text x="42" y="114" class="head ink">许可怎么来</text>
  <rect x="42" y="128" width="190" height="58" rx="6" class="state-dim"/>
  <text x="137" y="152" text-anchor="middle" class="small ink">bms.ic_data</text>
  <text x="137" y="172" text-anchor="middle" class="small muted">电压 · 温度 · 故障位</text>
  <path d="M137 186 L137 204" class="line" marker-end="url(#arrow)"/>
  <rect x="42" y="206" width="190" height="92" rx="6" class="state"/>
  <text x="137" y="230" text-anchor="middle" class="small ink">bms_chg_allowed()</text>
  <text x="137" y="250" text-anchor="middle" class="small ink">bms_dis_allowed()</text>
  <text x="137" y="272" text-anchor="middle" class="small muted">故障 + 满／空 + 人工使能</text>
  <text x="137" y="290" text-anchor="middle" class="small muted">各合成一个方向</text>
  <text x="137" y="326" text-anchor="middle" class="small green-text">两张许可，不是一个总开关</text>
  <text x="137" y="348" text-anchor="middle" class="small muted">可以只许充、不许放</text>
  <text x="137" y="374" text-anchor="middle" class="small muted">许可变了，才轮到状态机</text>
  <text x="137" y="400" text-anchor="middle" class="small muted">动作落在开关，不落在寄存器</text>

  <rect x="420" y="88" width="140" height="56" rx="8" class="state"/>
  <text x="490" y="122" text-anchor="middle" class="state-name ink">OFF</text>

  <rect x="262" y="240" width="140" height="56" rx="8" class="state"/>
  <text x="332" y="274" text-anchor="middle" class="state-name ink">CHG</text>

  <rect x="420" y="240" width="140" height="56" rx="8" class="state"/>
  <text x="490" y="274" text-anchor="middle" class="state-name ink">NORMAL</text>

  <rect x="578" y="240" width="140" height="56" rx="8" class="state"/>
  <text x="648" y="274" text-anchor="middle" class="state-name ink">DIS</text>

  <rect x="405" y="372" width="170" height="56" rx="8" class="state-dim"/>
  <text x="490" y="406" text-anchor="middle" class="state-name ink">SHUTDOWN</text>

  <path d="M452 146 C404 168 348 200 340 234" class="line" marker-end="url(#arrow)"/>
  <text x="330" y="204" text-anchor="end" class="small muted">只许充电</text>
  <path d="M528 146 C576 168 632 200 640 234" class="line" marker-end="url(#arrow)"/>
  <text x="650" y="204" class="small muted">只许放电</text>

  <path d="M402 268 L414 268" class="line" marker-end="url(#arrow)"/>
  <path d="M578 268 L566 268" class="line" marker-end="url(#arrow)"/>

  <path d="M420 282 L408 282" class="back" marker-end="url(#back-arrow)"/>
  <text x="332" y="322" text-anchor="middle" class="small gold-text">失去放电 → 退回 CHG</text>
  <path d="M560 282 L572 282" class="back" marker-end="url(#back-arrow)"/>
  <text x="648" y="322" text-anchor="middle" class="small gold-text">失去充电 → 退回 DIS</text>

  <path d="M490 240 L490 152" class="back" marker-end="url(#back-arrow)"/>
  <text x="504" y="200" class="small gold-text">都没了 → OFF</text>

  <path d="M560 114 C700 124 744 210 744 300 C744 356 660 396 580 400" class="back" marker-end="url(#back-arrow)"/>

  <rect x="772" y="88" width="204" height="164" rx="8" class="purple" stroke-width="1.6"/>
  <text x="790" y="114" class="head purple-text">覆盖点</text>
  <text x="790" y="138" class="small ink">默认状态机是 __weak</text>
  <text x="790" y="160" class="small ink">板级应用可整台换掉</text>
  <text x="790" y="186" class="small muted">换掉之后，测试边界</text>
  <text x="790" y="206" class="small muted">跟着一起移动</text>
  <text x="790" y="232" class="small muted">默认实现过了，不等于</text>
  <text x="790" y="250" class="small muted">你的 override 过了</text>

  <rect x="772" y="268" width="204" height="160" rx="8" class="green" stroke-width="1.6"/>
  <text x="790" y="294" class="head green-text">测试证据</text>
  <text x="790" y="318" class="small ink">ztest 十例启用</text>
  <text x="790" y="340" class="small ink">覆盖许可与故障转移</text>
  <text x="790" y="366" class="small muted">只证明默认实现</text>
  <text x="790" y="392" class="small red-text">均衡场景仍在注释里</text>
  <text x="790" y="412" class="small red-text">不算已执行用例</text>

  <rect x="24" y="446" width="952" height="86" rx="8" class="panel"/>
  <rect x="44" y="466" width="46" height="3" rx="1.5" fill="#626d65"/>
  <text x="100" y="474" class="small ink">实线：许可增加——OFF 按许可进单向；另一边也允许时，单向进 NORMAL</text>
  <rect x="44" y="496" width="46" height="3" rx="1.5" fill="#926717"/>
  <text x="100" y="504" class="small ink">虚线：许可减少——失去一侧只关那一路退回单向；两向都没了回 OFF；两路都关才进 SHUTDOWN 等关机</text>
  <text x="24" y="566" class="body ink">一次只动一个方向：失去一侧许可时，另一方向继续服务。</text>
  <text x="24" y="592" class="small muted">两路都关之后才谈关机；默认状态机可被覆盖，覆盖之后原测试不再代表它。</text>
</svg>
