<text x="732" y="372" font-size="22" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">每个信号层都配相邻参考平面：高速设</text>
<text x="732" y="404" font-size="22" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">计的甜点</text>
<rect x="56" y="488" width="888" height="182" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
