<text x="400" y="449" font-size="21" text-anchor="start" fill="#003153">右侧插座，把板外的被测信号带进来。</text>
<text x="38" y="494" font-size="23" text-anchor="start" fill="#003153" font-weight="700">② 输入网络在哪里？</text>
<text x="400" y="494" font-size="21" text-anchor="start" fill="#003153">中部器件区；实际拓扑要查原理图。</text>
