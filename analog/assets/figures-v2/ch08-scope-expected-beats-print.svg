<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1448 1086" role="img" aria-labelledby="title desc" data-print-width-mm="138" data-composition="technical-overlay-v1" data-base-medium="python-svg"><title id="title">示波器上的四拍预期波形</title><desc id="desc">示波器预期波形：拍①指数爬升、拍③沿上窄台阶、随后 droop 缓降、再采样；右上标控制摆幅 5V 与 3.3V 下馈通 0.5mV 与 0.33mV，屏角注明非实测。</desc><rect width="1448" height="1086" fill="#e2d9cf" /><g id="paper-illustration"><path d="M68,206 L631.6,204 L1381,207 L1384,605.28 L1381,906 L565.6,908 L64,904 Z" fill="#f6f2ed" stroke="#c4b9ab" stroke-width="1.4" /><path d="M70,208L1377,209" fill="none" stroke="#ffffff" stroke-width="2" opacity=".7" /><path d="M82,218 L1368,220 L1370,892 L84,894 Z" fill="none" stroke="#c4b9ab" stroke-width="2" opacity=".55" />
<line x1="190" y1="830" x2="1340" y2="830" stroke="#c4b9ab" stroke-width="3" stroke-dasharray="" /><polygon points="1340,830 1327.0,823.0 1327.0,837.0" fill="#c4b9ab" />
<line x1="190" y1="830" x2="190" y2="238" stroke="#c4b9ab" stroke-width="3" stroke-dasharray="" /><polygon points="190,238 183.0,251.0 197.0,251.0" fill="#c4b9ab" />
<polyline points="190,760 300,520 390,470 520,450 650,446 760,440 880,500 1000,560 1110,610 1220,660 1320,700" fill="none" stroke="#1f5d7a" stroke-width="5" stroke-dasharray="" /></g><g id="technical-overlay"><text x="72" y="92" fill="#2a2927" font-size="50" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">示波器上该看到的四拍</text>
<text x="74" y="146" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">预期描述，非本书实测；时基 100ms/div，四段各能指认。</text>
<text x="760" y="884" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#f6f2ed">时间（100ms/div）</text>
<text x="132" y="520" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#f6f2ed">电压</text>
<text x="1020" y="250" fill="#1f5d7a" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">保持节点电压</text>
<text x="250" y="400" fill="#a4441d" font-size="32" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">拍① 指数爬升</text>
<text x="740" y="400" fill="#a4441d" font-size="32" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">拍③ 沿上窄台阶</text>
<text x="1010" y="520" fill="#a4441d" font-size="32" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">droop 缓降</text>
<text x="1210" y="740" fill="#a4441d" font-size="32" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">再采样</text>
<text x="330" y="795" fill="#a4441d" font-size="32" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">馈通 0.5mV@5V → 0.33mV@3.3V</text>
<path data-paper-shadow="true" transform="translate(8 12)" d="M68,988 L631.6,986 L1381,989 L1384,1030.46 L1381,1062 L565.6,1064 L64,1060 Z" fill="#535453" opacity="0.08" /><path data-paper-shadow="true" transform="translate(4 7)" d="M68,988 L631.6,986 L1381,989 L1384,1030.46 L1381,1062 L565.6,1064 L64,1060 Z" fill="#535453" opacity="0.12" /><path data-paper-shadow="true" transform="translate(2 3)" d="M68,988 L631.6,986 L1381,989 L1384,1030.46 L1381,1062 L565.6,1064 L64,1060 Z" fill="#535453" opacity="0.15" /><path d="M68,988 L631.6,986 L1381,989 L1384,1030.46 L1381,1062 L565.6,1064 L64,1060 Z" fill="#f6f2ed" stroke="#c4b9ab" stroke-width="1.4" /><path d="M70,990L1377,991" fill="none" stroke="#ffffff" stroke-width="2" opacity=".7" />
<text x="92" y="1036" fill="#2a2927" font-size="33" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">四拍不是抽象模型，是屏面上四个可指认的区段；τ 与斜率差一倍，先查漏流路径。</text></g></svg>
