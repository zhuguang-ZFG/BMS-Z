 <text x="551.5" y="352.0" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="middle">滚动计数器</text>
 <rect x="622.0" y="330.0" width="93.0" height="32.0" fill="none" stroke="#003153" stroke-width="1.5" rx="3"/>
 <text x="668.5" y="352.0" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="middle">信号新鲜度</text>
</g>
</g>
<g class="motion" data-x="1">
<text x="480.0" y="386.0" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="middle">两章分工</text>
<g filter="url(#w)">
 <rect x="100.0" y="400.0" width="370.0" height="48.0" fill="none" stroke="#003153" stroke-width="1.6" rx="3"/>
 <text x="285.0" y="428.0" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="middle">第 29 章：把原始字节安全地交上去</text>
 <rect x="490.0" y="400.0" width="370.0" height="48.0" fill="none" stroke="#003153" stroke-width="1.6" rx="3"/>
 <text x="675.0" y="428.0" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="middle">第 18 章：端到端数据身份</text>
</g>
<text x="480.0" y="486.0" font-family="KaiTi" font-size="14" fill="#E34234" text-anchor="middle" font-weight="bold">结构检查管不到时间：CRC 正确的一帧，内容可能已经过期</text>
</g>
<text x="48" y="512" font-family="KaiTi" font-size="12" fill="#003153">⑤ §29.4 的例子：一帧 CRC 正确的「3 秒前 SOC」，结构上完全合法，控制上仍然过期。本章把原始字节安全地交上去，第 18 章负责端到端数据身份。</text>
<text x="480" y="546" font-family="KaiTi" font-size="14" opacity="0.8" text-anchor="middle" fill="#003153">原理示意 / 非实拍</text>
</svg>
