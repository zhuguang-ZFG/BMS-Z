<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-labelledby="cv-t" aria-describedby="cv-d">
  <title id="cv-t">书封插画：电芯里在干活，桌上留下证据</title>
  <desc id="cv-d">右侧一颗立着的电芯，顶上有正极凸台，正面剖开露出两块极板与在其中移动的离子；左壁靠着一架梯子，一个小人站在梯上向极板伸手；一个小人双手抱着记录纸从电芯向左走，桌边的小人低头把记录纸盖章归档；一盏吊灯在小桌上方投下暖光。</desc>
  <defs>
    <filter id="cv-ink" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="3" seed="9" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="640" height="480" fill="#fffdf5"/>
  <g filter="url(#cv-ink)" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- 吊灯：柠檬色光晕 -->
    <circle cx="150" cy="216" r="66" fill="#fbefc7"/>
    <path d="M150 62 L150 108" stroke="#293b3a" stroke-width="1.6"/>
    <path d="M116 108 L164 108 L153 132 Q140 138 127 132 Z" fill="#fffdf5" stroke="#293b3a" stroke-width="2.4"/>

    <!-- 地面 -->
    <path d="M32 433 Q160 429 320 432 Q470 435 604 431" stroke="#626d65" stroke-width="1.4"/>

    <!-- 小桌 -->
    <path d="M44 352 Q92 349 132 351 Q176 353 214 350 L213 366 Q142 370 74 367 Q56 366 44 366 Z" fill="#fffdf5" stroke="#293b3a" stroke-width="2.2"/>
    <path d="M62 366 L64 432" stroke="#293b3a" stroke-width="2.4"/>
    <path d="M196 366 L198 432" stroke="#293b3a" stroke-width="2.4"/>
    <path d="M64 402 L197 400" stroke="#293b3a" stroke-width="1.6"/>

    <!-- 记录纸与印章 -->
    <path d="M76 324 Q106 321 138 323 Q141 333 139 348 Q108 352 78 349 Q74 336 76 324 Z" fill="#f6e2df" stroke="#293b3a" stroke-width="2.2"/>
    <path d="M86 331 L128 329" stroke="#293b3a" stroke-width="1.6"/>
    <path d="M86 338 L120 336" stroke="#293b3a" stroke-width="1.6"/>
    <path d="M90 343 L98 347 L110 334" stroke="#377b60" stroke-width="1.8"/>
    <path d="M156 324 L176 323 L177 338 L157 339 Z" fill="#fffdf5" stroke="#293b3a" stroke-width="2.2"/>
    <path d="M166 323 L166 306" stroke="#293b3a" stroke-width="2.4"/>
    <path d="M159 306 Q166 300 173 306" stroke="#293b3a" stroke-width="1.6"/>

    <!-- 桌边的人 -->
    <circle cx="232" cy="324" r="10" fill="#fffdf5" stroke="#293b3a" stroke-width="2.2"/>
    <path d="M232 334 L230 382" stroke="#293b3a" stroke-width="2.4"/>
    <path d="M231 346 L208 358" stroke="#293b3a" stroke-width="2.4"/>
    <path d="M231 352 L214 372" stroke="#293b3a" stroke-width="1.6"/>
    <path d="M230 382 L222 432 M230 382 L241 430" stroke="#293b3a" stroke-width="1.6"/>
    <circle cx="226" cy="321" r="1.6" fill="#926717"/>
    <circle cx="239" cy="321" r="1.6" fill="#926717"/>

    <!-- 抱着记录纸走向桌面的人 -->
    <circle cx="330" cy="324" r="10" fill="#fffdf5" stroke="#293b3a" stroke-width="2.2"/>
    <path d="M330 334 L326 382" stroke="#293b3a" stroke-width="2.4"/>
    <path d="M329 344 L306 348" stroke="#293b3a" stroke-width="2.4"/>
    <path d="M329 352 L308 360" stroke="#293b3a" stroke-width="1.6"/>
    <path d="M326 382 L316 422 L308 432" stroke="#293b3a" stroke-width="1.6"/>
    <path d="M326 382 L338 422 L352 430" stroke="#293b3a" stroke-width="1.6"/>
    <circle cx="324" cy="321" r="1.6" fill="#926717"/>
    <circle cx="337" cy="321" r="1.6" fill="#926717"/>
    <path d="M282 336 Q300 333 318 335 Q321 343 319 356 Q301 360 284 357 Q280 346 282 336 Z" fill="#f6e2df" stroke="#293b3a" stroke-width="2.2"/>
    <path d="M289 343 L310 341" stroke="#293b3a" stroke-width="1.6"/>

    <!-- 电芯：正极凸台 + 顶盖 + 壳身（正面剖开，内腔为薄荷色） -->
    <path d="M462 84 L462 66 Q482 60 502 66 L502 84" stroke="#293b3a" stroke-width="2.4"/>
    <ellipse cx="482" cy="86" rx="78" ry="15" fill="#fffdf5" stroke="#293b3a" stroke-width="2.2"/>
    <path d="M404 101 L560 101 L560 416 Q560 434 536 434 L428 434 Q404 434 404 416 Z" fill="#e4f0df"/>
    <path d="M404 86 L404 416 Q404 434 428 434 L536 434 Q560 434 560 416 L560 86" stroke="#293b3a" stroke-width="2.4"/>
    <path d="M404 416 Q482 440 560 416" stroke="#626d65" stroke-width="1.4"/>

    <!-- 两块极板（灰色斜纹） -->
    <path d="M440 116 L438 404" stroke="#293b3a" stroke-width="2.4"/>
    <path d="M524 114 L526 402" stroke="#293b3a" stroke-width="2.4"/>
    <path d="M446 130 L446 150 M452 168 L452 188 M446 206 L446 226 M452 244 L452 264 M446 282 L446 302 M452 320 L452 340 M446 358 L446 378" stroke="#626d65" stroke-width="1.2"/>
    <path d="M532 132 L532 152 M538 170 L538 190 M532 208 L532 228 M538 246 L538 266 M532 284 L532 304 M538 322 L538 342" stroke="#626d65" stroke-width="1.2"/>

    <!-- 电解液中的小点与离子 -->
    <path d="M462 168 L462.6 168 M496 190 L496.6 190 M470 232 L470.6 232 M502 258 L502.6 258 M458 300 L458.6 300 M498 330 L498.6 330 M472 372 L472.6 372" stroke="#626d65" stroke-width="1.1"/>
    <circle cx="482" cy="146" r="7" fill="#926717"/>
    <circle cx="508" cy="214" r="7" fill="#926717"/>
    <circle cx="466" cy="268" r="7" fill="#926717"/>
    <circle cx="506" cy="352" r="7" fill="#926717"/>
    <circle cx="508" cy="212" r="1.4" fill="#fffdf5"/>
    <circle cx="513" cy="212" r="1.4" fill="#fffdf5"/>

    <!-- 靠在电芯左壁的梯子 -->
    <path d="M356 432 L394 214" stroke="#293b3a" stroke-width="2.4"/>
    <path d="M380 434 L416 216" stroke="#293b3a" stroke-width="2.4"/>
    <path d="M361 410 L385 412 M366 378 L390 380 M371 346 L395 348 M376 314 L400 316 M381 282 L405 284 M386 250 L410 252" stroke="#293b3a" stroke-width="1.6"/>

    <!-- 梯上的人 -->
    <circle cx="384" cy="292" r="10" fill="#fffdf5" stroke="#293b3a" stroke-width="2.2"/>
    <path d="M384 302 L382 334" stroke="#293b3a" stroke-width="2.4"/>
    <path d="M383 312 L402 302" stroke="#293b3a" stroke-width="2.4"/>
    <path d="M383 314 L366 304" stroke="#293b3a" stroke-width="1.6"/>
    <path d="M382 334 L374 352 M382 334 L392 350" stroke="#293b3a" stroke-width="1.6"/>
    <circle cx="378" cy="289" r="1.6" fill="#926717"/>
    <circle cx="391" cy="289" r="1.6" fill="#926717"/>
  </g>
</svg>
