  <title id="title">模型是与真身对过表的替身</title>
  <desc id="desc">一颗卷绕电芯立在试镜大镜旁，镜内自上而下站着四位替身：带极耳的恒压块、一根短棒、一对之字弹簧、一只储能罐；蓝色虚线把真身、镜面与工程师手里的图纸卷连成一份约定。无文字无数字。</desc>
