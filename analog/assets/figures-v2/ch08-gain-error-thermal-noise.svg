<text x="92" y="1036" fill="#2a2927" font-size="33" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">校准管固定项，全温核算管漂移项；非线性只能抬负载阻抗或换器件。</text></g></svg>
