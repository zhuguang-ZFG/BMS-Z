<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">一点接地：让大电流别踩小信号的路</text>

<text x="400" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#37424e">共用地线 = 压降共享；星形一点接地 = 压降隔离——模拟工程师的终极命题</text>

<rect x="30" y="100" width="350" height="270" rx="14" fill="#f6eedb" stroke="#a8321f" stroke-width="2.5"/>
<text x="54" y="132" font-size="15" font-weight="bold" fill="#a8321f">✗ 共用地线：压降踩进信号地</text>
<rect x="60" y="150" width="120" height="26" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="1.5"/>
<text x="120" y="158" text-anchor="middle" font-size="11" fill="#16202b">负载 R_L</text>
<rect x="60" y="230" width="120" height="26" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="1.5"/>
<text x="120" y="247" text-anchor="middle" font-size="11" fill="#16202b">放大器</text>
<path d="M120 176 Q120.04 184.00 120 192" fill="none" stroke="#a8321f" stroke-width="3"/>
<path d="M120 256 Q120.10 224.00 120 192" fill="none" stroke="#1f5d7a" stroke-width="1.5"/>
<path d="M120 192 Q210.00 191.57 300 192" fill="none" stroke="#a8321f" stroke-width="3"/>
<text x="210" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#a8321f">共用段：R_地 · I×R = 100mV</text>
<text x="108" y="208" font-size="9.5" fill="#5b666f">A</text>
<text x="296" y="208" font-size="9.5" fill="#5b666f">B</text>
<line x1="300" y1="192" x2="300" y2="204" stroke="#37424e" stroke-width="2"/>
<path d="M290 204 Q300.00 203.92 310 204" fill="none" stroke="#37424e" stroke-width="2"/>
<path d="M293 208 Q300.00 207.97 307 208" fill="none" stroke="#37424e" stroke-width="2"/>
<line x1="296" y1="212" x2="304" y2="212" stroke="#37424e" stroke-width="2"/>
<text x="205" y="352" text-anchor="middle" font-size="10" fill="#5b666f">10A × 0.01Ω = 100mV——比 5µV 信号大 4 个数量级</text>
<g filter="url(#pglow)"><circle r="5" fill="#a8321f"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M120,180 V192 H300" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle>
<circle r="5" fill="#a8321f"><animateMotion dur="12s" begin="5.50s" repeatCount="indefinite" path="M120,180 V192 H300" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle></g>
<circle cx="120" cy="192" r="5" fill="none" stroke="#a8321f" stroke-width="2">
<animate attributeName="r" values="5;11;5" dur="1.6s" begin="0s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="1;0;1" dur="1.6s" begin="0s" repeatCount="indefinite"/>
</circle>

<rect x="420" y="100" width="350" height="270" rx="14" fill="#f6eedb" stroke="#3d6b4a" stroke-width="2.5"/>
<text x="444" y="132" font-size="15" font-weight="bold" fill="#3d6b4a">✓ 星形一点接地：各自到汇点</text>
<rect x="450" y="150" width="120" height="26" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="1.5"/>
<text x="510" y="167" text-anchor="middle" font-size="11" fill="#16202b">负载 R_L</text>
