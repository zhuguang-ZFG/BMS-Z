    <text x="130" y="70" opacity="0" class="hi">3.60V<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.2;0.24;1" dur="8s" repeatCount="indefinite" /></text>
    <text x="130" y="70" opacity="0" class="hi">4.25V<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.26;0.40;0.42;1" dur="8s" repeatCount="indefinite" /></text>
    <text x="130" y="70" opacity="0" class="warn">4.35V ⚠<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.42;0.44;0.63;0.65;1" dur="8s" repeatCount="indefinite" /></text>
    <text x="130" y="70" opacity="0" class="hi">3.90V<animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.70;0.72;0.98;1" dur="8s" repeatCount="indefinite" /></text>
  </g>

  
  <line x1="170" y1="160" x2="300" y2="160" stroke-width="2" class="stroke-axis" />
  <text x="235" y="150" text-anchor="middle" font-size="12" class="small">VDD 监测</text>
