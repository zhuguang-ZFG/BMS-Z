<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">特殊二极管家族：一族五口，各管一段活</text>

<text x="400" y="46" text-anchor="middle" font-size="14" font-weight="bold" fill="#37424e">横轴：特征电压（V_F 或反向工作电压）　纵轴：速度　—— 每颗管子占的位置就说明了它的岗位</text>
<path d="M90 400 Q410.00 400.15 730 400" fill="none" stroke="#5b666f" stroke-width="1.6"/><path d="M90 100 Q89.77 250.00 90 400" fill="none" stroke="#5b666f" stroke-width="1.6"/><text x="730" y="446" text-anchor="end" font-size="11" fill="#5b666f">特征电压 →</text><text x="82" y="114" text-anchor="end" font-size="11" fill="#5b666f">快</text><text x="82" y="400" text-anchor="end" font-size="11" fill="#5b666f">慢</text><line x1="181" y1="400" x2="181" y2="405" stroke="#5b666f" stroke-width="1.2"/><text x="181" y="416" text-anchor="middle" font-size="10" fill="#5b666f">1V</text><line x1="364" y1="400" x2="364" y2="405" stroke="#5b666f" stroke-width="1.2"/><text x="364" y="416" text-anchor="middle" font-size="10" fill="#5b666f">3V</text><line x1="547" y1="400" x2="547" y2="405" stroke="#5b666f" stroke-width="1.2"/><text x="547" y="416" text-anchor="middle" font-size="10" fill="#5b666f">5V</text><line x1="730" y1="400" x2="730" y2="405" stroke="#5b666f" stroke-width="1.2"/><text x="730" y="416" text-anchor="middle" font-size="10" fill="#5b666f">7V</text><circle cx="154" cy="370" r="9" fill="#5b666f" opacity="0.85"/><text x="230" y="356" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5b666f">普通硅管（基准）</text><text x="230" y="398" text-anchor="middle" font-size="10" fill="#5b666f">整流/钳位（慢）</text><circle cx="117" cy="130" r="9" fill="#1f5d7a" opacity="0.85"/><text x="193" y="116" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1f5d7a">肖特基</text><text x="193" y="158" text-anchor="middle" font-size="10" fill="#5b666f">高频整流 / 防反接</text><circle cx="309" cy="379" r="9" fill="#a8321f" opacity="0.85"/><text x="309" y="365" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a8321f">LED</text><text x="309" y="407" text-anchor="middle" font-size="10" fill="#5b666f">发光（必须限流）</text><circle cx="639" cy="145" r="9" fill="#6b3f63" opacity="0.85"/><text x="639" y="131" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6b3f63">TVS</text><text x="639" y="173" text-anchor="middle" font-size="10" fill="#5b666f">ESD/浪涌 ns 级钳位</text><circle cx="602" cy="352" r="9" fill="#a4630f" opacity="0.85"/><text x="602" y="338" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a4630f">稳压管</text><text x="602" y="380" text-anchor="middle" font-size="10" fill="#5b666f">简易基准 / 过压钳位</text><circle cx="456" cy="310" r="9" fill="#3d6b4a" opacity="0.85"/><text x="456" y="296" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3d6b4a">变容管</text><text x="456" y="338" text-anchor="middle" font-size="10" fill="#5b666f">VCO 调谐（结电容可变）</text>
<text x="400" y="456" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#37424e">五个成员 + 一个基准（普通硅管），五条「不能忘」的规矩</text>
<text x="70" y="468" font-size="11.5" fill="#5b666f">① <tspan font-weight="bold" fill="#dc2626">LED 必须限流</tspan>：它是二极管，正向压降一旦建立，电流就指数暴涨——串电阻或上恒流</text>
<text x="70" y="492" font-size="11.5" fill="#5b666f">② <tspan font-weight="bold" fill="#2563eb">肖特基快是因为「没有少子存储」</tspan>：金属-半导体结，反向恢复时间几乎为零</text>
<text x="70" y="516" font-size="11.5" fill="#5b666f">③ <tspan font-weight="bold" fill="#7c3aed">TVS 拼的是「面积」</tspan>：大面积结承受浪涌能量，ns 级把电压钳住，接在接口最前线</text>
<text x="70" y="540" font-size="11.5" fill="#5b666f">④ <tspan font-weight="bold" fill="#b45309">稳压管工作在击穿区</tspan>：这是唯一「故意让它击穿」的用法，5.6V 附近温漂最小</text>
<text x="70" y="564" font-size="11.5" fill="#5b666f">⑤ <tspan font-weight="bold" fill="#059669">变容管是「电压控电容」</tspan>：反压越大耗尽层越宽、结电容越小——VCO 靠它调频</text>
