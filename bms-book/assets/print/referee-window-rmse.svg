  <rect class="bms-marker" aria-hidden="true" x="18" y="16.2" width="424" height="18.4" rx="3.8" transform="rotate(-.5 18 25.4)"/><path class="bms-under" aria-hidden="true" d="M24 31 q 24 -2.4 48 0 t 48 0 t 48 0 t 48 0 t 48 0 t 48 0 t 48 0"/><text class="title" x="24" y="32">分窗口 RMSE：参数拟对≠模型对（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="330" rx="6"/><g class="bms-doodle" aria-hidden="true" transform="matrix(0.993058778306207 0.11761914312297864 -0.11761914312297864 0.993058778306207 748 70)" opacity="0.7" style="opacity: 0.7;"><path class="bms-spark-fill" d="M0 -8 L2.1 -2.1 L8 0 L2.1 2.1 L0 8 L-2.1 2.1 L-8 0 L-2.1 -2.1 Z"/></g>

