<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420">
  <title>电芯追溯链示意图</title>
  <rect width="880" height="420" fill="#f8fafc"/>
  <style>
  text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
  @media (prefers-color-scheme: dark){
  rect[fill="#f8fafc"]{fill:#0f172a}
  rect[fill="#fff"]{fill:#1e293b}
  [fill="#e2e8f0"]{fill:#334155}
  [stroke="#e2e8f0"]{stroke:#334155}
  [fill="#334155"]{fill:#e2e8f0}
  [stroke="#334155"]{stroke:#e2e8f0}
  [fill="#1e293b"]{fill:#f1f5f9}
  [stroke="#1e293b"]{stroke:#f1f5f9}
  [fill="#dbeafe"]{fill:#1e3a8a}
  [stroke="#dbeafe"]{stroke:#1e3a8a}
  [fill="#bfdbfe"]{fill:#1e40af}
  [stroke="#bfdbfe"]{stroke:#1e40af}
  [fill="#1d4ed8"]{fill:#60a5fa}
  [stroke="#1d4ed8"]{stroke:#60a5fa}
  [fill="#ecfdf5"]{fill:#022c22}
  [stroke="#ecfdf5"]{stroke:#022c22}
  [fill="#a7f3d0"]{fill:#065f46}
  [stroke="#a7f3d0"]{stroke:#065f46}
  [fill="#059669"]{fill:#34d399}
  [stroke="#059669"]{stroke:#34d399}
  [fill="#fffbeb"]{fill:#451a03}
  [stroke="#fffbeb"]{stroke:#451a03}
  [fill="#fef3c7"]{fill:#78350f}
  [stroke="#fef3c7"]{stroke:#78350f}
  [fill="#b45309"]{fill:#fbbf24}
  [stroke="#b45309"]{stroke:#fbbf24}
  [fill="#fef2f2"]{fill:#450a0a}
  [stroke="#fef2f2"]{stroke:#450a0a}
  [fill="#fecaca"]{fill:#7f1d1d}
  [stroke="#fecaca"]{stroke:#7f1d1d}
  [fill="#dc2626"]{fill:#f87171}
  [stroke="#dc2626"]{stroke:#f87171}
  }
  </style>
  <text x="440" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">示意图：包序列号要能走回电芯档，对不上就不要出厂</text>
  <rect x="24" y="70" width="140" height="64" rx="8" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="94" y="98" text-anchor="middle" font-size="14" fill="#1e293b">电芯二维码</text>
  <text x="94" y="118" text-anchor="middle" font-size="12" fill="#334155">身份</text>
  <rect x="196" y="70" width="140" height="64" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="266" y="98" text-anchor="middle" font-size="14" fill="#1e293b">分容 / K 值</text>
  <text x="266" y="118" text-anchor="middle" font-size="12" fill="#334155">档位</text>
  <rect x="368" y="70" width="140" height="64" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="438" y="98" text-anchor="middle" font-size="14" fill="#1e293b">模组</text>
  <text x="438" y="118" text-anchor="middle" font-size="12" fill="#334155">入箱</text>
  <rect x="540" y="70" width="140" height="64" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="610" y="98" text-anchor="middle" font-size="14" fill="#1e293b">包序列号</text>
  <text x="610" y="118" text-anchor="middle" font-size="12" fill="#334155">整机</text>
  <rect x="712" y="70" width="144" height="64" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="784" y="98" text-anchor="middle" font-size="14" fill="#1e293b">BMS 标识</text>
  <text x="784" y="118" text-anchor="middle" font-size="12" fill="#334155">售后能读</text>
  <circle cy="102" r="7" fill="#1d4ed8">
    <animate attributeName="cx" values="94;266;438;610;784;94" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="8s" repeatCount="indefinite"/>
  </circle>

  <rect x="24" y="170" width="400" height="170" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="40" y="198" font-size="15" font-weight="bold" fill="#dc2626">错芯 / 贴错标</text>
  <text x="40" y="226" font-size="14" fill="#1e293b">这一节的码属于另一容量档，</text>
  <text x="40" y="250" font-size="14" fill="#1e293b">或同一码出现在两台包上。</text>
  <text x="40" y="282" font-size="14" fill="#334155">充电末端它先过充，邻居仍低。</text>
  <text x="40" y="310" font-size="14" fill="#334155">加大均衡搬不来没有的容量。</text>

  <rect x="444" y="170" width="412" height="170" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="460" y="198" font-size="15" font-weight="bold" fill="#1e293b">EOL 至少对上什么</text>
  <text x="460" y="226" font-size="14" fill="#334155">逐串电压对标准源，不只看总电压。</text>
  <text x="460" y="254" font-size="14" fill="#334155">电芯档和包内清单一致。</text>
  <text x="460" y="282" font-size="14" fill="#334155">K 值上限是该产线的界，不是通用红线。</text>
  <text x="460" y="310" font-size="14" fill="#b45309">示意图。0.0239 mV/h 只属于那条中试线。</text>
</svg>
