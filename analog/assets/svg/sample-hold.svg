<animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.2;0.26;0.9;0.94;1" dur="7s" repeatCount="indefinite"/></line>
<circle cx="166" cy="140" r="3.5" fill="#37424e"/>
<text x="108" y="106" font-size="11" font-weight="bold" fill="#37424e">开关（第 8 章传输门）</text>
