<circle r="4.5" fill="#a8321f"><animateMotion dur="11s" begin="-1.1s" repeatCount="indefinite" path="M318,168 L318,200"/></circle>
<circle r="4.5" fill="#3d6b4a"><animateMotion dur="11s" begin="-1.6s" repeatCount="indefinite" path="M270,246 L270,262"/></circle>
