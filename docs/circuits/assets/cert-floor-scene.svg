<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 590" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>功能安全示意：硬件通道在教学反应时间 10 ms 切断，停掉的软件一直不断。100 ms 是同一笔示意 FTTI，不是认证结论。</title>
  <desc>绿线在 10 ms 跳到已切断，红线停在 0。金点沿绿线走。记录里要能看出切断时间，不能只改软件阈值。</desc>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; }
    .linek { stroke: #57606a; stroke-width: 2.2; fill: none; stroke-dasharray: 7 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .dotg { fill: #1a7f37; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    .boxy { fill: #fff8c5; stroke: #d4a72c; }
    .boxr { fill: #ffebe9; stroke: #ff8182; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .linek { stroke: #8b949e; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .dotg { fill: #3fb950; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
      .boxy { fill: #3d2e00; stroke: #d29922; }
      .boxr { fill: #3d1418; stroke: #f85149; }
    }
  </style>
  <!-- formula: hardware steps to 1 at 10 ms; dead MCU stays 0; FTTI teaching budget 100 ms -->
  <rect class="bg" width="800" height="590"/>
  <text class="title" x="24" y="32">注入之后，硬件通道自己切断（示意预算）</text>
  <rect class="panel" x="24" y="44" width="752" height="124" rx="6"/>
  <text class="txt" x="40" y="68" opacity="0.28">① 注入<tspan class="small">　拔采样线或抬高模拟电压。不要对真电池做。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="92" opacity="0.28">② 10 ms<tspan class="small">　和 FTTI 那张一样，反应示意 10 ms。硬件落到已切断。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="116" opacity="0.28">③ 软件停了<tspan class="small">　红线一直是 0。比较器不经过这颗 MCU。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="140" opacity="0.28">④ 口诀<tspan class="small">　注入一次，独立切断一次，把时间写下来。这不是认证结论。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="180" width="752" height="268" rx="6"/>
  <text class="small" x="40" y="202">1 = 已切断，0 = 未切断</text>
  <text class="ok" x="200" y="218">绿 硬件</text>
  <text class="warn" x="320" y="218">红 MCU 已停</text>
  <line class="axis" x1="108.0" y1="248.0" x2="108.0" y2="400.0"/>
  <line class="axis" x1="108.0" y1="400.0" x2="720.0" y2="400.0"/>
  <line class="grid" x1="108.0" y1="400.0" x2="108.0" y2="406.0"/>
  <text class="small" x="108.0" y="422.0" text-anchor="middle">0</text>
  <line class="grid" x1="169.2" y1="400.0" x2="169.2" y2="406.0"/>
  <text class="small" x="169.2" y="422.0" text-anchor="middle">10</text>
  <line class="grid" x1="720.0" y1="400.0" x2="720.0" y2="406.0"/>
  <text class="small" x="720.0" y="422.0" text-anchor="middle">100</text>
  <line class="grid" x1="102.0" y1="400.0" x2="108.0" y2="400.0"/>
  <text class="small" x="98.0" y="404.0" text-anchor="end">0</text>
  <line class="grid" x1="102.0" y1="267.8" x2="108.0" y2="267.8"/>
  <text class="small" x="98.0" y="271.8" text-anchor="end">1</text>
  <text class="small" x="720" y="444" text-anchor="end">时间 ms</text>
  <polyline class="lineg" points="108.0,400.0 115.7,400.0 123.3,400.0 130.9,400.0 138.6,400.0 146.2,400.0 153.9,400.0 161.6,400.0 169.2,267.8 176.9,267.8 184.5,267.8 192.2,267.8 199.8,267.8 207.4,267.8 215.1,267.8 222.8,267.8 230.4,267.8 238.0,267.8 245.7,267.8 253.3,267.8 261.0,267.8 268.6,267.8 276.3,267.8 283.9,267.8 291.6,267.8 299.2,267.8 306.9,267.8 314.6,267.8 322.2,267.8 329.9,267.8 337.5,267.8 345.1,267.8 352.8,267.8 360.4,267.8 368.1,267.8 375.8,267.8 383.4,267.8 391.1,267.8 398.7,267.8 406.3,267.8 414.0,267.8 421.6,267.8 429.3,267.8 436.9,267.8 444.6,267.8 452.2,267.8 459.9,267.8 467.6,267.8 475.2,267.8 482.9,267.8 490.5,267.8 498.1,267.8 505.8,267.8 513.5,267.8 521.1,267.8 528.8,267.8 536.4,267.8 544.0,267.8 551.7,267.8 559.4,267.8 567.0,267.8 574.6,267.8 582.3,267.8 590.0,267.8 597.6,267.8 605.2,267.8 612.9,267.8 620.6,267.8 628.2,267.8 635.9,267.8 643.5,267.8 651.1,267.8 658.8,267.8 666.4,267.8 674.1,267.8 681.8,267.8 689.4,267.8 697.1,267.8 704.7,267.8 712.4,267.8 720.0,267.8" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline class="liner" points="108.0,400.0 115.7,400.0 123.3,400.0 130.9,400.0 138.6,400.0 146.2,400.0 153.9,400.0 161.6,400.0 169.2,400.0 176.9,400.0 184.5,400.0 192.2,400.0 199.8,400.0 207.4,400.0 215.1,400.0 222.8,400.0 230.4,400.0 238.0,400.0 245.7,400.0 253.3,400.0 261.0,400.0 268.6,400.0 276.3,400.0 283.9,400.0 291.6,400.0 299.2,400.0 306.9,400.0 314.6,400.0 322.2,400.0 329.9,400.0 337.5,400.0 345.1,400.0 352.8,400.0 360.4,400.0 368.1,400.0 375.8,400.0 383.4,400.0 391.1,400.0 398.7,400.0 406.3,400.0 414.0,400.0 421.6,400.0 429.3,400.0 436.9,400.0 444.6,400.0 452.2,400.0 459.9,400.0 467.6,400.0 475.2,400.0 482.9,400.0 490.5,400.0 498.1,400.0 505.8,400.0 513.5,400.0 521.1,400.0 528.8,400.0 536.4,400.0 544.0,400.0 551.7,400.0 559.4,400.0 567.0,400.0 574.6,400.0 582.3,400.0 590.0,400.0 597.6,400.0 605.2,400.0 612.9,400.0 620.6,400.0 628.2,400.0 635.9,400.0 643.5,400.0 651.1,400.0 658.8,400.0 666.4,400.0 674.1,400.0 681.8,400.0 689.4,400.0 697.1,400.0 704.7,400.0 712.4,400.0 720.0,400.0" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="dotg" r="6" cx="108.0" cy="400.0"><animate attributeName="cx" values="108.0;169.2;414.0;720.0;720.0" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="400.0;267.8;267.8;267.8;267.8" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite"/></circle>
  <circle class="dotr" r="4" cx="108.0" cy="400.0"><animate attributeName="cx" values="108.0;169.2;414.0;720.0;720.0" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite" begin="-6s"/><animate attributeName="cy" values="400.0;267.8;267.8;267.8;267.8" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite" begin="-6s"/></circle>
  <rect class="panel" x="24" y="460" width="752" height="68" rx="6"/>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="1">t = 0 ms · 硬件 未切断 · 软件 未切断 · FTTI 100 ms（示意）<animate attributeName="opacity" values="1;0;0;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0">t = 10 ms · 硬件 已切断 · 软件 未切断 · FTTI 100 ms（示意）<animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0">t = 50 ms · 硬件 已切断 · 软件 未切断 · FTTI 100 ms（示意）<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0">t = 100 ms · 硬件 已切断 · 软件 未切断 · FTTI 100 ms（示意）<animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="24" y="560">100 ms 和 10 ms 是教学预算，不是某个 ASIL 项目的 FTTI。现场实拍仍然没有。</text>

</svg>
