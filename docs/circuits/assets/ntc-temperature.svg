    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .fill-boxb { fill: #12233a; }
      .fill-boxg { fill: #0f2415; }
      .fill-boxr { fill: #3d1214; }
      .fill-boxy { fill: #2d2607; }
      .fill-b { fill: #4493f8; }
      .fill-g { fill: #3fb950; }
      .fill-r { fill: #ff7b72; }
      .fill-y { fill: #d29922; }
      .fill-ink { fill: #8b949e; }
      .fill-muted { fill: #30363d; }
      .fill-lockb { fill: #0969da; }
      .stroke-panel { stroke: #30363d; }
      .stroke-axis { stroke: #8b949e; }
      .stroke-b { stroke: #4493f8; }
      .stroke-g { stroke: #3fb950; }
      .stroke-r { stroke: #ff7b72; }
      .stroke-y { stroke: #d29922; }
      .stroke-check { stroke: #0d1117; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .on { fill: #ffffff; }
      .lineb { stroke: #4493f8; }
    }
</style><rect class="bg" x="0" y="-156" width="800" height="620" /><text class="title" x="24" y="-128">NTC 测温：一颗电阻怎么变成温度计</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① NTC 测温：一颗电阻怎么变成温度计<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② NTC = 10kΩ（25°C）<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ NTC = 6.5kΩ（42°C）<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="408" width="752" height="44" rx="6" /><text class="small" x="40" y="436">NTC = 4.2kΩ（60°C）。示意。</text><rect width="800" height="400" class="bg" />
  <rect x="60" y="120" width="110" height="150" rx="8" stroke-width="2" class="fill-boxb stroke-axis" />
  <text x="115" y="200" text-anchor="middle" font-size="13" font-weight="bold" class="hi">电池</text>
  <rect x="150" y="130" width="14" height="90" rx="7" stroke-width="1.5" class="panel stroke-axis" />
  <rect x="153" y="200" width="8" height="17" class="fill-r">
    <animate attributeName="height" values="17;60;60;17" keyTimes="0;0.45;0.6;1" dur="8s" repeatCount="indefinite" />
    <animate attributeName="y" values="200;157;157;200" keyTimes="0;0.45;0.6;1" dur="8s" repeatCount="indefinite" />
  </rect>
  <text x="157" y="240" text-anchor="middle" font-size="12" class="small">NTC</text>

  
  <line x1="300" y1="90" x2="460" y2="90" stroke-width="2.5" class="stroke-axis" />
  <text x="300" y="82" font-size="12" class="txt">VCC</text>
  <polyline points="300,90 300,110 312,120 288,140 312,160 288,180 300,190" fill="none" stroke-width="2.5" class="stroke-axis" />
  <text x="330" y="145" font-size="12" class="txt">固定电阻 R</text>
  <line x1="300" y1="190" x2="300" y2="210" stroke-width="2.5" class="stroke-axis" />
  
  <circle cx="300" cy="210" r="5" class="fill-ink" />
  <line x1="300" y1="210" x2="420" y2="210" stroke-width="2.5" class="stroke-b" />
  
  <polyline points="300,210 300,230 312,240 288,260 312,280 288,300 300,310" fill="none" stroke-width="2.5" class="stroke-y" />
  <line x1="300" y1="310" x2="300" y2="330" stroke-width="2.5" class="stroke-axis" />
  <line x1="270" y1="330" x2="330" y2="330" stroke-width="2.5" class="stroke-axis" />
  <g font-size="12" font-weight="bold" class="fill-y">
    <text x="335" y="245" opacity="0">NTC = 10kΩ（25°C）<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.25;0.3;1" dur="8s" repeatCount="indefinite" /></text>
    <text x="335" y="245" opacity="0">NTC = 6.5kΩ（42°C）<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.33;0.55;0.6;1" dur="8s" repeatCount="indefinite" /></text>
    <text x="335" y="245" opacity="0">NTC = 4.2kΩ（60°C）<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.63;0.9;0.95;1" dur="8s" repeatCount="indefinite" /></text>
  </g>

  
  <rect x="360" y="230" width="16" height="100" fill="none" stroke-width="1.5" class="stroke-axis" />
  <rect x="362" y="266" width="12" height="62" class="fill-b">
    <animate attributeName="height" values="62;30;30;62" keyTimes="0;0.45;0.6;1" dur="8s" repeatCount="indefinite" />
    <animate attributeName="y" values="266;298;298;266" keyTimes="0;0.45;0.6;1" dur="8s" repeatCount="indefinite" />
  </rect>
  <text x="368" y="348" text-anchor="middle" font-size="12" class="hi">中点电压</text>

  
  <line x1="420" y1="210" x2="500" y2="210" stroke-width="2.5" class="stroke-axis" />
  <rect x="500" y="170" width="110" height="80" rx="10" stroke-width="2" class="panel stroke-axis" />
  <text x="555" y="205" text-anchor="middle" font-size="14" font-weight="bold" class="txt">ADC</text>
  <text x="555" y="225" text-anchor="middle" font-size="12" class="small">+ 查表</text>
  <g font-size="16" font-weight="bold" class="fill-r">
    <text x="650" y="215" opacity="0">25°C<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.25;0.3;1" dur="8s" repeatCount="indefinite" /></text>
    <text x="650" y="215" opacity="0">42°C<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.33;0.55;0.6;1" dur="8s" repeatCount="indefinite" /></text>
    <text x="650" y="215" opacity="0">60°C ⚠<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.63;0.9;0.95;1" dur="8s" repeatCount="indefinite" /></text>
  </g>

  <text x="400" y="380" text-anchor="middle" font-size="14" class="small">负温度系数：越热阻值越小 → 分压点电压越低（NTC 在下臂）→ ADC 读数查表即得温度</text>
</svg>