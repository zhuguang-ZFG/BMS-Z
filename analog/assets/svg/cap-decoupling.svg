<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="ttl">
<title id="ttl">去耦电容为什么要「贴脸」放？——走线电感 vs 本地水库</title>
<desc>去耦电容为什么要「贴脸」放？——走线电感 vs 本地水库；节拍：① IC 翻转瞬间要 100mA 尖峰电流，但只持续几 ns；② 走线电感：直流随便过，ns 尖峰面前=断路（V=L·di/dt）；③ 100nF 贴脸=本地水库：它距离近、电感小，尖峰由它顶上；④ 所以记住：距离&lt;3mm、先过电容再到 IC、电容回路越短越好</desc>
