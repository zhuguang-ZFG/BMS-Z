<text x="182" y="144" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f5d7a">40%</text>
<path d="M484,290 l30,-44 l30,44 l30,-44 l30,44 l30,-44 l30,44 l30,-44 l30,44 l30,-44 l30,44 l30,-44 l30,44 l30,-44" fill="none" stroke="#1f5d7a" stroke-width="2.2"/>
<text x="600" y="132" font-size="12.5" font-weight="bold" fill="#3d6b4a">降到 50% 以下：波形恢复规整</text>
<rect x="56" y="452" width="840" height="120" rx="12" fill="#e8efe6" stroke="#3d6b4a" stroke-width="2"/>
<text x="84" y="488" font-size="14" font-weight="bold" fill="#3d6b4a">边界指纹：占空比一过 50% 就振，降到 50% 以下就好</text>
<text x="84" y="516" font-size="12.5" fill="#16202b">一分钟验证：调高输入电压（减小占空比），看振荡是否消失。</text>
<text x="84" y="540" font-size="12.5" fill="#16202b">消失即次谐波振荡——加斜坡补偿或降低环路增益。</text></g></g>
<text x="32" y="984" font-size="12" font-weight="bold" fill="#3d6b4a">6. 边界指纹</text>
<text x="24" y="1036" font-size="22" fill="#16202b">1. 起点：占空比 40%，电流环工作正常，SW 波形规整</text>
<text x="24" y="1066" font-size="22" fill="#16202b">2. 负载加重，占空比推到 55%——越过临界点</text>
<text x="24" y="1096" font-size="22" fill="#16202b">3. 电感电流扰动被逐周期放大：SW 波形一宽一窄交替，周期翻倍</text>
<text x="24" y="1126" font-size="22" fill="#16202b">4. 输出纹波出现开关频率一半的分量——次谐波振荡的指纹</text>
<text x="24" y="1156" font-size="22" fill="#16202b">5. 对策：给电流环叠一个下斜坡，把放大系数压回 1 以下</text>
<text x="24" y="1186" font-size="22" fill="#16202b">6. 一过 50% 就振、降到 50% 以下就好——调高输入电压一分钟判明</text>
</svg>
