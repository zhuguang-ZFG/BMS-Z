<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">原型跨过一道上锁的门槛才成为产品</title>
  <desc id="desc">左侧工作台上面包板插着孔阵，红蓝绿三根飞线垂到桌沿，示波器亮着波形；中间高门槛的门柱间横着门楣，门槛上斜放一卷图纸；一名工程师正抬腿跨过，右侧传送带托着成品盒，上方悬挂一枚质检圆章。无文字无数字。</desc>
