<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="ui-monospace, Consolas, monospace">
  <title>isoSPI 教学帧按唤醒、命令、数据、PEC 四拍穿过变压器。不是某一颗 AFE 的手册时序。</title>
  <desc>教学帧按唤醒、命令、数据、PEC 四拍从左往右点亮，黄点标当前字段；回程沿菊花链原路回来。</desc>

  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.5; fill: none; }
    .liney { stroke: #bf8700; stroke-width: 2.5; fill: none; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .dotg { fill: #1a7f37; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    .boxr { fill: #ffebe9; stroke: #cf222e; }
    .boxg { fill: #dafbe1; stroke: #1a7f37; }
    .boxy { fill: #fff8c5; stroke: #bf8700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .dotg { fill: #3fb950; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
      .boxr { fill: #3d1214; stroke: #ff7b72; }
      .boxg { fill: #12261e; stroke: #3fb950; }
      .boxy { fill: #3d2e00; stroke: #d29922; }
    }
  </style>

  <rect class="bg" width="800" height="460"/>

  <text class="title" x="24" y="32">isoSPI 教学帧：唤醒、命令、数据、PEC（示意，不是某颗芯片手册）</text>
  <rect class="panel" x="24" y="48" width="752" height="122" rx="6"/>
  <text class="txt" x="40" y="68" opacity="0.28">① 唤醒<tspan class="small">　链上先送几只脉冲，睡着的从板醒来。示意 4 只。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="94" opacity="0.28">② 命令<tspan class="small">　1 字节命令加地址，告诉从板读哪一组寄存器。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="120" opacity="0.28">③ 数据<tspan class="small">　示意 6 字节电压。变压器只让跳变过去，直流电位差过不去。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="146" opacity="0.28">④ PEC<tspan class="small">　2 字节校验。对不上就丢弃，不要把坏电压写进保护。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="180" width="752" height="210" rx="6"/>
  <text class="small" x="40" y="204">帧从左往右点亮。回程沿菊花链原路回来。</text>

  <g opacity="0.28"><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/><rect class="boxb" x="40" y="230" width="120" height="70" rx="6"/><text class="txt" x="100" y="258" text-anchor="middle">唤醒</text><text class="small" x="100" y="280" text-anchor="middle">4 脉冲</text></g>
  <g opacity="0.28"><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/><rect class="boxb" x="180" y="230" width="120" height="70" rx="6"/><text class="txt" x="240" y="258" text-anchor="middle">命令</text><text class="small" x="240" y="280" text-anchor="middle">1 字节</text></g>
  <g opacity="0.28"><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/><rect class="boxb" x="320" y="230" width="120" height="70" rx="6"/><text class="txt" x="380" y="258" text-anchor="middle">数据</text><text class="small" x="380" y="280" text-anchor="middle">6 字节</text></g>
  <g opacity="0.28"><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/><rect class="boxb" x="500" y="230" width="120" height="70" rx="6"/><text class="txt" x="560" y="258" text-anchor="middle">PEC</text><text class="small" x="560" y="280" text-anchor="middle">2 字节</text></g>
  <g opacity="0.28"><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/><rect class="boxb" x="640" y="230" width="120" height="70" rx="6"/><text class="txt" x="700" y="258" text-anchor="middle">回程</text><text class="small" x="700" y="280" text-anchor="middle">原路</text></g>
  <circle class="doty" cy="310" r="7">
    <animate attributeName="cx" values="100;240;380;560;700;100" keyTimes="0;0.25;0.5;0.75;0.96;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <text class="small" x="40" y="360">黄点是这一拍正在走的字段。墙两边可以差几百伏，帧里只有交流脉冲。</text>
  <text class="small" x="24" y="446">字节数是教学示意，用来记住「先醒、再命令、再数据、最后校验」。某一颗 AFE 的脉冲宽度以它的手册为准。</text>

</svg>
