<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" aria-label="确认窗双面性与迟滞回环">
<title>确认窗双面性与迟滞回环</title>
<desc>确认窗抑制毛刺同时造成盲区的对照与 50/45 A 迟滞回环示意</desc>
<style>
  .bg { fill: #f6f1e3; }
  .title { fill: #003153; font: 700 20px 'KaiTi','STKaiti','Noto Serif SC',serif; }
  .sub { fill: #5c6d73; font: 13px 'Noto Sans SC','Microsoft YaHei',sans-serif; }
  .lbl { fill: #4d5d63; font: 13px 'Noto Sans SC','Microsoft YaHei',sans-serif; }
  .small { fill: #4d5d63; font: 12px 'Noto Sans SC','Microsoft YaHei',sans-serif; }
  .value { fill: #003153; font: 700 18px 'Noto Sans SC','Microsoft YaHei',sans-serif; }
  .sym { fill: #003153; font: 700 19px 'KaiTi','STKaiti','Noto Serif SC',serif; }
  .wire { stroke: #003153; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .body { stroke: #a3322a; stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-dasharray: 7 5; }
  .channel { stroke: #176b64; stroke-width: 2.6; fill: none; stroke-linecap: round; }
  .box { fill: #fbf8f1; stroke: #003153; stroke-width: 2; rx: 8; }
  .soa-line { stroke: #003153; stroke-width: 2.4; fill: none; }
  .soa-pt { fill: #176b64; }
  .soa-bad { fill: #a3322a; }
  .axis { stroke: #5c6d73; stroke-width: 1.3; }
  .lane { stroke: #d9cfba; stroke-width: 0.9; }
  .bar { stroke: #003153; stroke-width: 2; }
  .hyst { stroke: #8a5019; stroke-width: 2.4; fill: none; }
  .halo { paint-order: stroke; stroke: #f6f1e3; stroke-width: 4; stroke-linejoin: round; }
</style>
<rect class="bg" x="0" y="0" width="800" height="430"/>
<text class="title" x="40.0" y="40.0" text-anchor="start">图 D08-F2　确认窗的双面性与迟滞回环</text>
<text class="sub" x="40.0" y="64.0" text-anchor="start">40 ms 确认窗：8 ms 毛刺被抑制，25 ms 真实故障漏检（盲区 ~60 ms）；迟滞 50/45 A 把 12 次抖动折成 1 次</text>
<text class="lbl" x="70.0" y="122.0" text-anchor="start">8 ms 毛刺</text>
<rect x="70" y="130" width="48.0" height="22" rx="4" fill="#176b64" opacity="0.5"/>
<text class="small" x="126.0" y="146.0" text-anchor="start">抑制 ✓</text>
<text class="lbl" x="70.0" y="174.0" text-anchor="start">25 ms 真实故障</text>
<rect x="70" y="182" width="150.0" height="22" rx="4" fill="#a3322a" opacity="0.5"/>
<text class="small" x="228.0" y="198.0" text-anchor="start">漏检 ✗</text>
<line class="lane" x1="70" y1="240" x2="430" y2="240"/>
<text class="small" x="70.0" y="262.0" text-anchor="start">确认窗 40 ms（+一拍采样 = 盲区 ~60 ms）</text>
<path class="hyst" d="M 470 300 H 613.0 V 140 H 730"/>
<path class="hyst" d="M 730 140 V 184.8 H 561.0 V 300 H 470"/>
<text class="small" x="613.0" y="128.0" text-anchor="middle">触发 50 A</text>
<text class="small" x="561.0" y="324.0" text-anchor="middle">释放 45 A</text>
<text class="small" x="462.0" y="146.0" text-anchor="end">动作</text>
<text class="small" x="462.0" y="300.0" text-anchor="end">释放</text>
<text class="value" x="744.0" y="220.0" text-anchor="start">12 次 → 1 次</text>
<text class="lbl" x="60.0" y="400.0" text-anchor="start">读法：确认窗与迟滞都是双刃剑——把收益写进文档时，把代价写同一行</text>
</svg>
