<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">变压器：电压换电流，能量原样过</text>

<text x="400" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#37424e">变比 N₁:N₂ 决定电压电流的「汇率」——初次级之间没有导线相连</text>
<rect x="150" y="142" width="500" height="36" rx="8" fill="#c9bb9d" stroke="#5b666f" stroke-width="1.5"/><rect x="130" y="100" width="26" height="140" rx="4" fill="#f6eedb" stroke="#1f5d7a" stroke-width="2.5"/><path d="M134 112 Q143.00 111.94 152 112" fill="none" stroke="#8b8272" stroke-width="1.2"/><path d="M134 131 Q143.00 131.03 152 131" fill="none" stroke="#8b8272" stroke-width="1.2"/><path d="M134 150 Q143.00 149.92 152 150" fill="none" stroke="#8b8272" stroke-width="1.2"/><path d="M134 169 Q143.00 169.04 152 169" fill="none" stroke="#8b8272" stroke-width="1.2"/><path d="M134 188 Q143.00 187.93 152 188" fill="none" stroke="#8b8272" stroke-width="1.2"/><path d="M134 207 Q143.00 206.92 152 207" fill="none" stroke="#8b8272" stroke-width="1.2"/><path d="M134 226 Q143.00 225.94 152 226" fill="none" stroke="#8b8272" stroke-width="1.2"/><text x="100" y="90" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f5d7a">V₁ · I₁</text><text x="143" y="262" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f5d7a">N₁ = 10T</text><rect x="644" y="100" width="26" height="140" rx="4" fill="#f6eedb" stroke="#3d6b4a" stroke-width="2.5"/><path d="M648 112 Q657.00 112.04 666 112" fill="none" stroke="#8b8272" stroke-width="1.2"/><path d="M648 131 Q657.00 130.98 666 131" fill="none" stroke="#8b8272" stroke-width="1.2"/><path d="M648 150 Q657.00 149.94 666 150" fill="none" stroke="#8b8272" stroke-width="1.2"/><path d="M648 169 Q657.00 168.95 666 169" fill="none" stroke="#8b8272" stroke-width="1.2"/><path d="M648 188 Q657.00 187.97 666 188" fill="none" stroke="#8b8272" stroke-width="1.2"/><path d="M648 207 Q657.00 206.98 666 207" fill="none" stroke="#8b8272" stroke-width="1.2"/><path d="M648 226 Q657.00 226.04 666 226" fill="none" stroke="#8b8272" stroke-width="1.2"/><text x="700" y="90" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3d6b4a">V₂ = 2×V₁</text><text x="657" y="262" text-anchor="middle" font-size="11" font-weight="bold" fill="#3d6b4a">N₂ = 20T</text><path d="M70 170 Q100.00 170.07 130 170" fill="none" stroke="#37424e" stroke-width="2.5"/><path d="M670 170 Q700.00 169.81 730 170" fill="none" stroke="#37424e" stroke-width="2.5"/><text x="40" y="186" font-size="11" fill="#5b666f">交流输入</text><text x="740" y="186" font-size="11" fill="#5b666f">负载</text><path d="M160,160 L640,160" fill="none" stroke="#6b3f63" stroke-width="2" stroke-dasharray="5,3"/><text x="400" y="130" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6b3f63">磁通 Φ —— 连接两边的「无形轴」</text><rect x="60" y="300" width="680" height="46" rx="9" fill="#f7eedb" stroke="#a4630f" stroke-width="1.8"/><text x="400" y="328" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a4630f">V₁·I₁ = V₂·I₂ —— 电压翻倍的地方电流减半，功率原样过（理想）</text><g filter="url(#pglow)"><circle r="4.5" fill="#6b3f63"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M166,160 H634" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle>
<circle r="4.5" fill="#6b3f63"><animateMotion dur="12s" begin="5.50s" repeatCount="indefinite" path="M166,160 H634" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle></g><g filter="url(#pglow)"><circle r="5" fill="#a8321f"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M75,170 H128" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle>
<circle r="5" fill="#a8321f"><animateMotion dur="12s" begin="5.50s" repeatCount="indefinite" path="M75,170 H128" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle></g><g filter="url(#pglow)"><circle r="5" fill="#3d6b4a"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M672,170 H728" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle>
<circle r="5" fill="#3d6b4a"><animateMotion dur="12s" begin="5.50s" repeatCount="indefinite" path="M672,170 H728" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle></g>
<text x="400" y="490" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#37424e">磁通这根「无形的轴」把能量从初级搬到次级——这是隔离的物理根源</text>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.00;0.02;0.25;0.27;1" dur="12s" repeatCount="indefinite"/><rect x="99.1" y="416.9" width="601.9" height="24.1" rx="12.0" fill="#1f5d7a" fill-opacity="0.09" stroke="#1f5d7a" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.00;0.02;0.25;0.27;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="430" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1f5d7a" opacity="0">① 变比是「汇率」：V₂/V₁ = N₂/N₁ —— 匝数翻倍，电压就翻倍（这里 1:2 升压）<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.00;0.02;0.25;0.27;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.25;0.27;0.50;0.52;1" dur="12s" repeatCount="indefinite"/><rect x="166.8" y="416.9" width="466.4" height="24.1" rx="12.0" fill="#3d6b4a" fill-opacity="0.09" stroke="#3d6b4a" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.50;0.52;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="430" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#3d6b4a" opacity="0">② 电流反着来：I₂/I₁ = N₁/N₂ —— 电压升高的地方，电流减半<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.50;0.52;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.50;0.52;0.75;0.77;1" dur="12s" repeatCount="indefinite"/><rect x="148.8" y="416.9" width="502.3" height="24.1" rx="12.0" fill="#a4630f" fill-opacity="0.09" stroke="#a4630f" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.52;0.75;0.77;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="430" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#a4630f" opacity="0">③ 能量守恒：V₁·I₁ ≈ V₂·I₂ —— 变压器不产生能量，只换「形态」<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.52;0.75;0.77;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.75;0.77;1" dur="12s" repeatCount="indefinite"/><rect x="147.9" y="416.9" width="504.3" height="24.1" rx="12.0" fill="#6b3f63" fill-opacity="0.09" stroke="#6b3f63" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.77;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="430" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#6b3f63" opacity="0">④ 隔离：初次级只有磁通耦合、没有导线相连——隔离电源与信号的地<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.77;1" dur="12s" repeatCount="indefinite"/></text></g>
