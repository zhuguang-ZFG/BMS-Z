<svg data-sketch="1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" font-family="ui-monospace, Consolas, monospace" data-snapshot-time="9">
  <title>二阶 RC 与一阶对照。真实曲线是 R0 阶跃加两路指数，一阶用合成电阻和 τ=12 s。</title>
  <desc>20 A、2 mΩ、快路 4 mΩ/1 s、慢路 6 mΩ/30 s 都是示意。蓝点沿真实曲线走，底栏读出一阶偏高多少毫伏。不是某一颗电芯的 HPPC。</desc>
