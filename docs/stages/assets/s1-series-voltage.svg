<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="s1-stack-t s1-stack-d">
  <title id="s1-stack-t">一串电池：电流只有一个，电压层层相加</title>
  <desc id="s1-stack-d">串联时电流处处相等，电压沿链相加。16 串标称 3.7 V 的电芯抬到 59.2 V；最弱的那一节先触线，整包被迫同停。</desc>
  <defs>
    <marker id="ar-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path class="head-teal" d="M0 0L9 4.5L0 9Z"/>
    </marker>
    <marker id="ar-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path class="head-red" d="M0 0L9 4.5L0 9Z"/>
    </marker>
    <style>
      text { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #293b3a; }
      .title { font-size: 20px; font-weight: 700; }
      .h { font-size: 15px; font-weight: 700; fill: #293b3a; }
      .body { font-size: 13px; fill: #293b3a; }
      .small { font-size: 12px; fill: #626d65; }
      .accent { fill: #176b73; }
      .green { fill: #377b60; }
      .red { fill: #b84745; }
      .gold { fill: #926717; }
      .card { fill: #fffdf5; stroke: #968d77; stroke-width: 1.4; }
      .soft { fill: #e4f0df; stroke: #377b60; stroke-width: 1.4; }
      .warn { fill: #fbefc7; stroke: #926717; stroke-width: 1.4; }
      .danger { fill: #f6e2df; stroke: #b84745; stroke-width: 1.4; }
      .wire { stroke: #293b3a; stroke-width: 2; fill: none; }
      .flow { stroke: #176b73; stroke-width: 2.4; fill: none; }
      .dot { fill: #176b73; }
      .bar { stroke: #293b3a; stroke-width: 3; stroke-linecap: round; }
      .bad { stroke: #b84745; stroke-width: 3; stroke-linecap: round; }
      .cell { fill: #fffdf5; stroke: #968d77; stroke-width: 2; }
      .head-teal { fill: #176b73; }
      .head-red { fill: #b84745; }
      @media (prefers-color-scheme: dark) {
        text { fill: #edf0e5; }
        .title { fill: #edf0e5; }
        .h { fill: #edf0e5; }
        .body { fill: #edf0e5; }
        .small { fill: #b0beb3; }
        .accent { fill: #7ec5c5; }
        .green { fill: #8fc7a2; }
        .red { fill: #f39b91; }
        .gold { fill: #dfbd78; }
        .card { fill: #223333; stroke: #71908c; }
        .soft { fill: #293f35; stroke: #8fc7a2; }
        .warn { fill: #453e2b; stroke: #dfbd78; }
        .danger { fill: #483336; stroke: #f39b91; }
        .wire { stroke: #edf0e5; }
        .flow { stroke: #7ec5c5; }
        .dot { fill: #7ec5c5; }
        .bar { stroke: #edf0e5; }
        .bad { stroke: #f39b91; }
        .cell { fill: #223333; stroke: #71908c; }
        .head-teal { fill: #7ec5c5; }
        .head-red { fill: #f39b91; }
      }
    </style>
  </defs>

  <text x="480" y="34" text-anchor="middle" class="title">一串电池：电流只有一个，电压层层相加</text>
  <text x="480" y="56" text-anchor="middle" class="small">16 串：电流是同一条河，电压沿链相加</text>

  <!-- 左：电流只有一条 -->
  <rect class="card" x="28" y="78" width="300" height="330" rx="12"/>
  <text x="178" y="108" text-anchor="middle" class="h">电流只有一条</text>

  <path class="flow" d="M70 196V336" marker-end="url(#ar-teal)"/>
  <text x="58" y="186" text-anchor="middle" class="small accent">I</text>

  <g>
    <rect class="cell" x="100" y="180" width="180" height="40" rx="8"/>
    <text x="190" y="205" text-anchor="middle" class="body">电芯 1</text>
    <rect class="cell" x="100" y="236" width="180" height="40" rx="8"/>
    <text x="190" y="261" text-anchor="middle" class="body">电芯 2</text>
    <rect class="cell" x="100" y="292" width="180" height="40" rx="8"/>
    <text x="190" y="317" text-anchor="middle" class="body">电芯 16</text>
  </g>

  <path class="wire" d="M100 200H82M100 256H82M100 312H82"/>
  <text x="178" y="360" text-anchor="middle" class="small">同一个电流穿过每一节</text>
  <text x="178" y="378" text-anchor="middle" class="small accent">谁先触线，全包同停</text>

  <!-- 中：电压相加 -->
  <rect class="card" x="350" y="78" width="280" height="330" rx="12"/>
  <text x="490" y="108" text-anchor="middle" class="h">电压沿链相加</text>

  <path class="flow" d="M380 150H560" marker-end="url(#ar-teal)"/>
  <text x="470" y="172" text-anchor="middle" class="small">3.7 V + 3.7 V …</text>

  <rect class="soft" x="380" y="196" width="180" height="40" rx="8"/>
  <text x="470" y="221" text-anchor="middle" class="body">单节 3.7 V</text>

  <rect class="warn" x="380" y="266" width="180" height="44" rx="8"/>
  <text x="470" y="294" text-anchor="middle" class="body">× 16 串</text>

  <rect class="danger" x="380" y="332" width="180" height="44" rx="8"/>
  <text x="470" y="360" text-anchor="middle" class="body">≈ 59.2 V</text>
  <text x="470" y="388" text-anchor="middle" class="small">满充同口径可算</text>

  <!-- 右：最弱的一节 -->
  <rect class="card" x="650" y="78" width="282" height="330" rx="12"/>
  <text x="791" y="108" text-anchor="middle" class="h">最弱的一节先触线</text>

  <g>
    <rect class="cell" x="672" y="150" width="200" height="34" rx="8"/>
    <text x="772" y="172" text-anchor="middle" class="small">能力强的电芯</text>
    <rect class="cell" x="672" y="214" width="200" height="34" rx="8"/>
    <text x="772" y="236" text-anchor="middle" class="small">能力强的电芯</text>
    <rect class="danger" x="672" y="278" width="200" height="46" rx="8"/>
    <text x="772" y="312" text-anchor="middle" class="body">最弱的一节</text>
  </g>

  <text x="791" y="344" text-anchor="middle" class="small">先到电压边界</text>
  <text x="791" y="362" text-anchor="middle" class="small red">整包被迫同停</text>

  <!-- 底部结论 -->
  <rect class="card" x="28" y="432" width="904" height="64" rx="12"/>
  <text x="480" y="476" text-anchor="middle" class="body">串联抬电压，并联加容量。Ah 不相加，电压和能量才按串数累加。</text>

</svg>
