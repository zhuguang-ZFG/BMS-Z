<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="960" height="220" role="img" aria-label="证据链：现象、测量、模型、判定、动作、签字">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="220" fill="#f8fafc"/>
  <text x="24" y="34" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#0f172a">BMS 的证据链</text>
  <g font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="15" text-anchor="middle">
    <rect x="24" y="70" width="130" height="70" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="89" y="102" fill="#075985" font-weight="700">现象</text>
    <text x="89" y="124" fill="#0c4a6e" font-size="12">电压跳变 / 温升</text>

    <rect x="182" y="70" width="130" height="70" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
    <text x="247" y="102" fill="#115e59" font-weight="700">测量</text>
    <text x="247" y="124" fill="#134e4a" font-size="12">谁量的 / 几次</text>

    <rect x="340" y="70" width="130" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="405" y="102" fill="#1e3a8a" font-weight="700">模型</text>
    <text x="405" y="124" fill="#1e40af" font-size="12">预测 / 参数</text>

    <rect x="498" y="70" width="130" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="563" y="102" fill="#92400e" font-weight="700">判定</text>
    <text x="563" y="124" fill="#78350f" font-size="12">阈值 / 延时</text>

    <rect x="656" y="70" width="130" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="721" y="102" fill="#991b1b" font-weight="700">动作</text>
    <text x="721" y="124" fill="#7f1d1d" font-size="12">断口 / 限流</text>

    <rect x="814" y="70" width="122" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="875" y="102" fill="#5b21b6" font-weight="700">记录 + 签字</text>
    <text x="875" y="124" fill="#4c1d95" font-size="12">谁签的</text>
  </g>
  <g stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
    <line x1="154" y1="105" x2="176" y2="105"/>
    <line x1="312" y1="105" x2="334" y2="105"/>
    <line x1="470" y1="105" x2="492" y2="105"/>
    <line x1="628" y1="105" x2="650" y2="105"/>
    <line x1="786" y1="105" x2="808" y2="105"/>
  </g>
  <text x="24" y="190" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">每一格都要能回答：输入是什么、错了会怎样、谁能复算。</text>
</svg>
