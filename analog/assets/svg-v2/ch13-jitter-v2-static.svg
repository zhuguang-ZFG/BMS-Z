<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">同样的时间抖动，高频信号付出更多噪声</title>
<desc id="figDesc">示意正弦输入、独立小孔径抖动 σt=10 ps RMS；只计算抖动这一项。</desc>
<metadata id="visual-timeline">{&quot;duration&quot;: 12, &quot;beats&quot;: [{&quot;name&quot;: &quot;条件&quot;, &quot;start&quot;: 0, &quot;end&quot;: 3, &quot;caption&quot;: &quot;低频正弦斜率较小，时间误差造成的电压误差小。&quot;}, {&quot;name&quot;: &quot;变化&quot;, &quot;start&quot;: 3, &quot;end&quot;: 6, &quot;caption&quot;: &quot;一兆赫兹时，抖动上限约八十四分贝。&quot;}, {&quot;name&quot;: &quot;比较&quot;, &quot;start&quot;: 6, &quot;end&quot;: 9, &quot;caption&quot;: &quot;输入频率提高，噪声上限持续下降。&quot;}, {&quot;name&quot;: &quot;结论&quot;, &quot;start&quot;: 9, &quot;end&quot;: 12, &quot;caption&quot;: &quot;十兆赫兹只剩约六十四分贝；总 SINAD 还含其他误差。&quot;}]}</metadata>
<!-- 节拍：条件、变化、比较、结论；总时长 12s；单次播放 -->

