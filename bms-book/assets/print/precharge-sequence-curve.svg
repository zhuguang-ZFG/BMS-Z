  <text class="txt" x="40" y="68" opacity="1" style="opacity: 1;">① t=0<tspan class="small">　只合预充闸。I0=400/170=2.35 A。</tspan></text>
  <text class="txt" x="40" y="92" opacity="1" style="opacity: 1;">② 一个 τ<tspan class="small">　0.17 s，约 63%，253 V 上下。主闸仍开。</tspan></text>
  <text class="txt" x="40" y="116" opacity="1" style="opacity: 1;">③ 约 3τ<tspan class="small">　0.51 s，约 95%，380 V。这时才合 K1，再打开预充闸。</tspan></text>
  <text class="txt" x="40" y="140" opacity="1" style="opacity: 1;">④ 口诀<tspan class="small">　爬不到就不合主闸。充到 400 V 的储能是 80 J。</tspan></text>
