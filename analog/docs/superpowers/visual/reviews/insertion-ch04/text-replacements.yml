changes:
- id: ch04-channel-formation
  source: docs/p1-05-ch4.md#4.1
  before: '**栅氧那 ±20 V 是哪来的**：SiO₂ 的击穿场强约 10 MV/cm，换算下来约 1 V/nm。几十纳米厚的栅氧层，理论耐压也就几十伏；再考虑缺陷、过冲与寿命降额，行业常见的栅源额定就是
    ±20 V（常见做法，以具体手册为准）。这意味着驱动回路上几伏的振铃尖峰都不是小事——它直接啃食栅氧的寿命余量。


    **阈值电压会随温度漂移**：硅 MOSFET 的 $V_{TH}$ 随结温升高而下降，典型斜率在 −2 mV/°C 至 −5 mV/°C 量级（经验范围，以手册转移曲线为准）。两个直接后果：热起来的管子更容易被
    $dv/dt$ 误导通，4.3 与 4.5 的余量核对都要按最高结温做；靠 $V_{TH}$ 做电流检测或定时基准的想法，要先核对整个温度范围。


    **逻辑电平管与"刚好能开"**：普通功率管的 $R_{DS(on)}$ 在 $V_{GS}=10$ V 下标定，逻辑电平管才给出 $V_{GS}=4.5$ V 甚至 2.5 V 档的数据。$V_{TH}$
    规格（常标注为 $I_D=250$ µA 或 1 mA 下的栅压）只表示"刚开一条缝"，不是"全开"。用 3.3 V GPIO 直驱时，正确做法是查输出特性曲线：$V_{GS}=3.3$ V 那条曲线在你的负载电流下是否已压进低阻区。只看
    $V_{TH(max)}$ 小于 3.3 V 就下结论，等于把"门开了条缝"当成"门全开了"——管子会停在半导通状态，按线性区发热。'
  after: '**图底三条账的来历**：SiO₂ 的击穿场强约 10 MV/cm，折算下来约 1 V/nm，几十纳米厚的栅氧只值几十伏；扣掉缺陷、过冲与寿命降额，栅源额定常见 ±20 V，于是驱动回路上几伏的振铃尖峰直接啃食这份余量。$V_{TH}$
    随结温升高而下降，典型 −2~−5 mV/°C，热起来的管子更容易被 $dv/dt$ 误导通，4.3 与 4.5 的余量核对都要按最高结温做。$R_{DS(on)}$ 在 $V_{GS}=10$
    V 标定，逻辑电平管才给 4.5 V 甚至 2.5 V 档；$V_{TH}$ 规格只是 $I_D=250$ µA 下的栅压，3.3 V GPIO 直驱要查输出曲线在你的负载电流下是否压进低阻区，否则管子可能高耗散。选型优先采用对应栅压下有保证的
    $R_{DS(on)}$，典型曲线只能辅助估计。'
  caption: 沟道形成三步：电场把 P 型表面改成 N 型。栅极隔着氧化层不碰沟道：它靠电场把电子拉到表面，铺出一条 N 型走廊
  removed_prose_chars: 237
  relationship: replaces-text
- id: ch04-output-regions
  source: docs/p1-05-ch4.md#4.2
  before: '**读图指引**：竖着看边界、横着看高度、贴着轴看截止。一看红色虚线 $V_{DS}=V_{GS}-V_{TH}$：教学曲线按过驱动 3 V 画，边界正好落在 3 V。左侧那段斜坡的倒数就是
    0.17 Ω：导通电阻不是另查的参数，是同一条曲线的斜率。二看曲线间距：相邻曲线的纵向距离 ∝ $g_m$，右卡的算例 $I_D=5$ A、过驱动 1 V 给出 $g_m=10$ S，也就是栅压每抬
    100 mV、漏极电流多 1 A。4.3 估米勒平台高度直接用它。三看横轴：$V_{GS} \lt V_{TH}=2$ V 时曲线就是横轴本身，所谓关断只剩 60–100 mV/十倍频的亚阈值漏电，125
    °C 下还会高出几个数量级。'
  after: '**读图指引**：过驱动 3 V 的夹断点在漏压 3 V；对应饱和电流 9 A。小漏压端的斜率给电阻；沿栅压方向的局部导数才给跨导。图中三条曲线均已超过阈值，截止须另取低于阈值的栅压，不能把横轴上的零电流点当成截止区。'
  caption: 过驱动 1/2/3 V 的曲线使用同一模型，饱和电流分别为 1/4/9 A。原点斜率的倒数才是小漏压导通电阻。
  removed_prose_chars: 181
  relationship: replaces-text
- id: ch04-gate-power-v2
  source: docs/p1-05-ch4.md#4.6
  before: '**驱动损耗这笔小账**：每次开关要把 $Q_g$ 从驱动电源搬进栅极再泄放掉，能量最终耗在栅极回路电阻上，即 $P_{drv}=Q_g\times V_{DRV}\times f_{sw}$。代入本例量级
    $Q_g=7$ nC、10 V、100 kHz，得 7 mW，相对 3.5 W 的开关损耗确实可忽略。


    它真正的意义在驱动器选型。驱动器要在几十纳秒内搬完这些电荷，峰值电流 $I_{peak}\approx V_{DRV}/(R_{drv}+R_g)$：10 V 驱动、回路总阻 10 Ω 就要 1
    A 级峰值输出。


    这就是独立栅极驱动器动辄标 2 A、4 A 的原因：不是稳态要这么多，是平台期要这么猛。


    **平均值与峰值各管一件事**：驱动电源只需供平均电流 $Q_g\times f_{sw}=7$ nC$\times100$ kHz$=0.7$ mA，一只小 LDO 就够。但峰值路径上的驱动器、栅阻、去耦电容要按
    1 A 级瞬态设计。


    平台期的电荷其实主要由紧贴驱动器电源脚的去耦电容现场供给，电源只在两次开关之间补电。去耦电容离远了，平台立刻变长给你看。'
  after: '**驱动账**：固定教学值 $Q_g=7$ nC、$V_{DRV}=10$ V、100 kHz，平均供电 $Q_gf=0.7$ mA、驱动功率 $Q_gV_{DRV}f=7$ mW。初始栅压为零、总回路
    10 Ω 时，电流初始估计为 1 A，之后随栅压改变。驱动器常标 2 A/4 A 是峰值能力；供电还要算静态消耗，不能只凭 0.7 mA 选电源。电荷由紧贴驱动器的去耦电容提供，供电在开关间隙补回。'
  caption: 同一组教学参数分别算电荷、平均电流、初始峰值和驱动功率；热量按实际回路分配。
  removed_prose_chars: 264
  relationship: replaces-text
