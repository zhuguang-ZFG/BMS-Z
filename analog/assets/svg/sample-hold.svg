<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">采样保持：给 SAR 四拍问答按下「暂停键」</text>

<text x="220" y="52" text-anchor="middle" font-size="14" font-weight="bold" fill="#37424e">开关 + 保持电容 + 缓冲器</text>
