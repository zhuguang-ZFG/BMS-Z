<text x="40" y="271" font-size="22" text-anchor="start">字节索引 0…10；CRC 输入：01 03 02 0E 74 → 13</text>
<text x="40" y="311" font-size="21" text-anchor="start">好流：完成帧数</text>
<text x="40" y="385" font-size="21" text-anchor="start">翻位流：坏 CRC 数</text>
<path d="M93,350 L93,350 L93,350 L171,350 L171,350 L249,350 L249,350 L912,350" fill="none" stroke="#003153" stroke-width="2.2" filter="url(#w)"/>
