    <text x="400" y="138" text-anchor="middle" font-size="14" font-weight="bold" class="hi">3.7V / 20Ah</text>
    <text x="400" y="290" text-anchor="middle" font-size="12" class="txt">并联：水压不变，两股水流汇成一股——容量翻倍</text>
