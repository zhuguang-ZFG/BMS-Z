[stroke="#a4630f"]{stroke:#c08a45}
text[fill="#6b3f63"]{fill:#c4a2bf}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#6b3f63"]{fill:#452c40}
[stroke="#6b3f63"]{stroke:#a17c9b}
}
</style>
<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">预测对实测：对不上的地方才是线索</text>
<text x="400" y="62" text-anchor="middle" font-size="12.5" fill="#5b666f">100kΩ × 1µF 上电复位：先把 69ms 写在纸上，再去抓波形</text>
<rect x="36" y="82" width="356" height="260" rx="10" fill="#e6eff3" stroke="#1f5d7a" stroke-width="1.6"/>
<text x="214" y="108" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f5d7a">① 纸上预测</text>
<path d="M66,300 L74,287 L81,275 L89,264 L97,253 L104,244 L112,235 L120,227 L127,220 L135,213 L142,206 L150,201 L158,195 L165,190 L173,185 L181,181 L188,177 L196,174 L204,170 L211,167 L219,164 L227,162 L234,159 L242,157 L250,155 L257,153 L265,151 L273,150 L280,148 L288,147 L296,145 L303,144 L311,143 L318,142 L326,141 L334,140 L341,140 L349,139 L357,138 L364,138 L372,137" fill="none" stroke="#1f5d7a" stroke-width="2.5"/>
<path d="M66 215 Q219.00 213.75 372 215" fill="none" stroke="#a4630f" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="368" y="210" text-anchor="end" font-size="10.5" fill="#a4630f">阈值 2.5V</text>
<circle cx="132" cy="215" r="4.5" fill="#1f5d7a"/>
<text x="132" y="233" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1f5d7a">69ms</text>
<circle cx="162" cy="193" r="4.5" fill="#1f5d7a"/>
<text x="170" y="185" font-size="10.5" fill="#1f5d7a">1τ → 3.15V</text>
<text x="214" y="330" text-anchor="middle" font-size="11" fill="#1f5d7a">t = RC·ln2 ≈ 69ms　写下来再测</text>
<rect x="408" y="82" width="356" height="260" rx="10" fill="#f6e7e1" stroke="#a8321f" stroke-width="1.6"/>
<text x="586" y="108" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a8321f">② 示波器实测</text>
<path d="M438,300 L446,287 L453,277 L461,268 L469,260 L476,253 L484,248 L492,243 L499,239 L507,235 L514,232 L522,230 L530,227 L537,226 L545,224 L553,223 L560,222 L568,221 L576,220 L583,219 L591,218 L599,218 L606,218 L614,217 L622,217 L629,217 L637,216 L645,216 L652,216 L660,216 L668,216 L675,216 L683,216 L690,215 L698,215 L706,215 L713,215 L721,215 L729,215 L736,215 L744,215" fill="none" stroke="#a8321f" stroke-width="2.5"/>
<path d="M438,300 L446,287 L453,275 L461,264 L469,253 L476,244 L484,235 L492,227 L499,220 L507,213 L514,206 L522,201 L530,195 L537,190 L545,185 L553,181 L560,177 L568,174 L576,170 L583,167 L591,164 L599,162 L606,159 L614,157 L622,155 L629,153 L637,151 L645,150 L652,148 L660,147 L668,145 L675,144 L683,143 L690,142 L698,141 L706,140 L713,140 L721,139 L729,138 L736,138 L744,137" fill="none" stroke="#1f5d7a" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.55"/>
<circle cx="534" cy="227" r="4.5" fill="#a8321f"/>
<text x="542" y="243" font-size="10.5" font-weight="bold" fill="#a8321f">1τ 实测 2.2V</text>
<text x="586" y="126" text-anchor="middle" font-size="10.5" fill="#5b666f">（虚线=预测）</text>
<text x="586" y="330" text-anchor="middle" font-size="11" fill="#a8321f">终值腰斩＋缓段更平 → 并着 ~100kΩ 漏电</text>
<g filter="url(#pglow)"><circle r="5" fill="#a4630f"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M66,300 H744" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle>
<circle r="5" fill="#a4630f"><animateMotion dur="12s" begin="3.50s" repeatCount="indefinite" path="M66,300 H744" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle>
<circle r="5" fill="#a4630f"><animateMotion dur="12s" begin="7.50s" repeatCount="indefinite" path="M66,300 H744" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle></g><g opacity="0">
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.86;1" dur="12s" repeatCount="indefinite"/>
<rect x="70" y="352" width="660" height="52.0" rx="9" fill="#e8efe6" stroke="#3d6b4a" stroke-width="1.5" filter="url(#soft)"/><rect x="76" y="359" width="3" height="38.0" rx="1.5" fill="#3d6b4a"/><text x="400" y="374.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3d6b4a">对账阈值 20%：偏差在阈值内继续往下测；超线就停手</text><text x="400" y="392.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3d6b4a">改模型——继续测只是在给错误的模型收集更多噪声。</text>
</g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.02;0.23;0.25;1" dur="12s" repeatCount="indefinite"/><rect x="123.3" y="464.9" width="553.4" height="24.1" rx="12.0" fill="#1f5d7a" fill-opacity="0.09" stroke="#1f5d7a" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.23;0.25;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="478" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1f5d7a" opacity="0">① 下探头之前，先把预期电平、幅度、时间尺度写在纸上：2.5V 阈值 @ 69ms<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.23;0.25;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.25;0.27;0.48;0.5;1" dur="12s" repeatCount="indefinite"/><rect x="187.3" y="464.9" width="425.5" height="24.1" rx="12.0" fill="#a4630f" fill-opacity="0.09" stroke="#a4630f" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.48;0.5;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="478" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#a4630f" opacity="0">② 实测 140ms——偏差超 100%，撞破 20% 对账线，停手<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.48;0.5;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.5;0.52;0.73;0.75;1" dur="12s" repeatCount="indefinite"/><rect x="174.2" y="464.9" width="451.7" height="24.1" rx="12.0" fill="#a8321f" fill-opacity="0.09" stroke="#a8321f" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.73;0.75;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="478" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#a8321f" opacity="0">③ 另一个现场：1τ 应读 3.15V，实测只有 2.2V，缓段还更平<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.73;0.75;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 -4.0" keyTimes="0;0.75;0.77;0.98;1" dur="12s" repeatCount="indefinite"/><rect x="143.8" y="464.9" width="512.5" height="24.1" rx="12.0" fill="#3d6b4a" fill-opacity="0.09" stroke="#3d6b4a" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.77;0.98;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="478" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#3d6b4a" opacity="0">④ 终值减半＋τ 减半，两条线索同指：节点上并着一只 ~100kΩ 漏电阻<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.77;0.98;1" dur="12s" repeatCount="indefinite"/></text></g>
