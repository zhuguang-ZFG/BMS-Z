<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="ui-monospace, Consolas, monospace">
  <title>库仑计零漂按天累积；EKF 用电压残差在斜率陡的时候把 SOC 拉回。数字为示意。</title>
  <desc>红线只靠积分按天漂走，蓝折线每拍先预测、再被电压残差拉回；两条线的差距在十天里拉开。</desc>

  <style>
    .bg { fill: #fffdf5; }
    .panel { fill: #f7f2e5; stroke: #cfc6b2; }
    .axis { stroke: #626d65; stroke-width: 1.5; fill: none; }
    .txt { fill: #293b3a; font-size: 13px; }
    .small { fill: #626d65; font-size: 12px; }
    .title { fill: #293b3a; font-size: 16px; font-weight: bold; }
    .hi { fill: #176b73; }
    .warn { fill: #b84745; }
    .ok { fill: #377b60; }
    .gold { fill: #926717; }
    .lineb { stroke: #176b73; stroke-width: 2.5; fill: none; }
    .liner { stroke: #b84745; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #377b60; stroke-width: 2.5; fill: none; }
    .liney { stroke: #926717; stroke-width: 2.5; fill: none; }
    .dotb { fill: #176b73; }
    .dotr { fill: #b84745; }
    .dotg { fill: #377b60; }
    .doty { fill: #926717; }
    .boxb { fill: #e4f0df; stroke: #176b73; }
    .boxr { fill: #f6e2df; stroke: #b84745; }
    .boxg { fill: #e4f0df; stroke: #377b60; }
    .boxy { fill: #fbefc7; stroke: #926717; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #192727; }
      .panel { fill: #223333; stroke: #496160; }
      .axis { stroke: #b0beb3; }
      .txt { fill: #edf0e5; }
      .small { fill: #b0beb3; }
      .title { fill: #edf0e5; }
      .hi { fill: #7ec5c5; }
      .warn { fill: #f39b91; }
      .ok { fill: #8fc7a2; }
      .gold { fill: #dfbd78; }
      .lineb { stroke: #7ec5c5; }
      .liner { stroke: #f39b91; }
      .lineg { stroke: #8fc7a2; }
      .liney { stroke: #dfbd78; }
      .dotb { fill: #7ec5c5; }
      .dotr { fill: #f39b91; }
      .dotg { fill: #8fc7a2; }
      .doty { fill: #dfbd78; }
      .boxb { fill: #293f35; stroke: #7ec5c5; }
      .boxr { fill: #483336; stroke: #f39b91; }
      .boxg { fill: #293f35; stroke: #8fc7a2; }
      .boxy { fill: #453e2b; stroke: #dfbd78; }
    }
  </style><style id="bms-motion">
    /* bms-motion: 手帐式动效注记（纯装饰，不改技术几何与既有 SMIL 时序） */
    .bms-marker { fill: #fbefc7; opacity: .78; }
    .bms-under { fill: none; stroke: #926717; stroke-width: 2.4; stroke-linecap: round; opacity: .9; }
    .bms-spark-line { fill: none; stroke: #926717; stroke-width: 1.9; stroke-linecap: round; }
    .bms-spark-fill { fill: #926717; }
    .bms-spark-soft { fill: #176b73; opacity: .8; }
    .bms-sticker { fill: none; stroke: #926717; stroke-width: 2; stroke-dasharray: 7 5; stroke-linecap: round; opacity: .85; }
    .bms-halo { fill: none; stroke: #926717; stroke-width: 2; }
    .bms-marker, .bms-under, .bms-sticker, .bms-halo,
    .bms-spark, .bms-success, .bms-doodle { pointer-events: none; }
    circle:has(> animateMotion) { filter: drop-shadow(0 0 2px rgba(146,103,23,.5)) drop-shadow(0 0 5px rgba(196,145,52,.45)); }
    rect:has(> animateMotion) { filter: drop-shadow(0 0 3px rgba(196,145,52,.75)); }
    g:has(> circle):has(> path.stroke-check) { filter: drop-shadow(0 0 5px rgba(55,123,96,.5)); }
    @media (prefers-color-scheme: dark) {
      .bms-marker { fill: #453e2b; opacity: .85; }
      .bms-under { stroke: #dfbd78; }
      .bms-spark-line { stroke: #dfbd78; }
      .bms-spark-fill { fill: #dfbd78; }
      .bms-spark-soft { fill: #7ec5c5; }
      .bms-sticker { stroke: #dfbd78; }
      .bms-halo { stroke: #dfbd78; }
      circle:has(> animateMotion) { filter: drop-shadow(0 0 2px rgba(223,189,120,.8)) drop-shadow(0 0 7px rgba(223,189,120,.9)); }
      rect:has(> animateMotion) { filter: drop-shadow(0 0 6px rgba(223,189,120,.8)); }
      g:has(> circle):has(> path.stroke-check) { filter: drop-shadow(0 0 6px rgba(143,199,162,.7)); }
    }
    @media (prefers-reduced-motion: reduce) { .bms-spark, .bms-success, .bms-doodle { display: none; } }
</style>

  <rect class="bg" width="800" height="460"/>

  <rect class="bms-marker" aria-hidden="true" x="18.0" y="17.1" width="431.9" height="17.3" rx="3.8" transform="rotate(-.5 18.0 25.8)"/><path class="bms-under" aria-hidden="true" d="M24.0 40.0 q 24.0 -2.4 48.0 0 t 48 0 t 48 0 t 48 0 t 48 0 t 48 0 t 48 0 t 48 0"/><text class="title" x="24" y="32">库仑计往一边漂，EKF 在斜率陡的时候把它拉回来（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="122" rx="6"/><g class="bms-doodle" aria-hidden="true" transform="translate(746.0 72.0)"><animateTransform attributeName="transform" type="rotate" values="-6;7;-6" keyTimes="0;0.5;1" dur="5.4s" repeatCount="indefinite" additive="sum"/><animate attributeName="opacity" values="0.62;1;0.62" keyTimes="0;0.5;1" dur="3.6s" repeatCount="indefinite"/><path class="bms-spark-fill" d="M0 -9 L2.3 -2.3 L9 0 L2.3 2.3 L0 9 L-2.3 2.3 L-9 0 L-2.3 -2.3 Z"/></g><g class="bms-doodle" aria-hidden="true" transform="translate(710.0 62.0)"><animateTransform attributeName="transform" type="rotate" values="5;-4;5" keyTimes="0;0.5;1" dur="6.2s" repeatCount="indefinite" additive="sum"/><animate attributeName="opacity" values="0.5;0.9;0.5" keyTimes="0;0.5;1" dur="4.4s" repeatCount="indefinite"/><path class="bms-spark-soft" d="M0 -5.5 L1.4 -1.4 L5.5 0 L1.4 1.4 L0 5.5 L-1.4 1.4 L-5.5 0 L-1.4 -1.4 Z"/></g><g class="bms-doodle" aria-hidden="true"><circle class="bms-spark-fill" cx="728.0" cy="81.0" r="1.3"/><circle class="bms-spark-soft" cx="696.0" cy="78.0" r="1.1"/></g>
  <text class="txt" x="40" y="68" opacity="0.28">① 预测<tspan class="small">　SOC 加上 I·Δt/Q。5 Ah 的包，积分本身很稳。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="94" opacity="0.28">② 零漂<tspan class="small">　电流零点偏 1 mA，一天积出 24 mAh，大约 0.48 个百分点。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="120" opacity="0.28">③ 十天后<tspan class="small">　纯积分大约偏出 4.8 个百分点，自己不会拐回来。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="146" opacity="0.28">④ 修正<tspan class="small">　实测电压减去模型预测，得到残差；修正量还取决于噪声与模型可信度。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="180" width="360" height="220" rx="6"/>
  <text class="txt" x="40" y="206">纯库仑计</text>
  <rect class="boxr" x="60" y="230" width="40" height="140"/>
  <rect class="dotr" x="60" y="300" width="40" height="70">
    <animate calcMode="spline" keySplines="0.7 0 0.84 0;0.42 0 0.58 1" attributeName="y" values="300;230;230" keyTimes="0;0.7;1" dur="12s" repeatCount="indefinite"/>
    <animate calcMode="spline" keySplines="0.16 1 0.3 1;0.42 0 0.58 1" attributeName="height" values="70;140;140" keyTimes="0;0.7;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text class="warn" x="120" y="280">示意 +4.8 %</text>
  <text class="small" x="120" y="304">十天 × 0.48 %/天</text>
  <text class="small" x="40" y="380">1 mA × 24 h = 24 mAh</text>
  <rect class="panel" x="404" y="180" width="372" height="220" rx="6"/>
  <text class="txt" x="420" y="206">同一段，加上电压修正</text>
  <path class="axis" d="M440 260 L730 260" stroke-dasharray="4 3"/>
  <text class="small" x="640" y="254">示意真值</text>
  <path class="liner" d="M440 260 L730 340"/>
  <path class="lineb" d="M440 260 L495 295 L510 268 L580 310 L596 302 L680 335 L696 318 L730 328" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000" stroke-linejoin="round">
    <animate calcMode="spline" keySplines="0.7 0 0.84 0;0.42 0 0.58 1" attributeName="stroke-dashoffset" values="1000;0;0" keyTimes="0;0.85;1" dur="12s" repeatCount="indefinite"/>
  </path>
  <circle class="dotg" r="6">
    <animateMotion calcMode="spline" keySplines="0.42 0 0.58 1" dur="12s" repeatCount="indefinite" path="M440 260 L495 295 L510 268 L580 310 L596 302 L680 335 L696 318 L730 328"/>
  </circle>
  <text class="ok" x="430" y="228">绿点：修正示意；坡陡不等于修正量大</text>
  <text class="small" x="430" y="360">红线：只积分。蓝折线：预测后被拉回。</text>
  <text class="small" x="430" y="380">平台区这一拍增益要小。</text>
  <text class="small" x="24" y="446">1 mA 一天 24 mAh 是零漂口算，不是你的电流传感器标定值。容量 5 Ah、十天 4.8 个百分点都是示意。</text>

</svg>
