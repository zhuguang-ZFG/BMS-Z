<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="ttl">
<title id="ttl">分压器：最容易上手，也最容易翻车的一招</title>
<desc>分压器：最容易上手，也最容易翻车的一招；节拍：① 空载：R1、R2 各分一半——Vout = 6V，指针稳稳停在正中；② 挂上 RL=10k：R2∥RL 只剩 5k——Vout 塌到 4V，指针矮了三分之一；③ 分压比会跟着负载变：要稳，就把源阻抗压到远小于负载阻抗</desc>
