corrections:
- 0.8 × 5 × 100 ns × 100 kHz = 0.04 W, not 0.4 W.
- 'Square law: VGS = VTH + 2ID/gm. Use the measured transfer curve for a real device plateau.'
- Steady thermal resistance overestimates an isolated short-pulse rise at the same boundary; it does not
  become intrinsically unsafe for a long pulse. Repetition must include accumulated heat.
- Static gate pull-down does not replace a low-impedance transient sink. Single MOSFET reverse blocking
  depends on diode orientation and controller; back-to-back is for bidirectional off-state isolation.
- Total gate charge time is not switching overlap time; calculate Eon and Eoff separately. Gate driver
  loss is not all dissipated inside the MOSFET.
