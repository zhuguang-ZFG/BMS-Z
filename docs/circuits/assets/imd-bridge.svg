<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470">
  <title>绝缘检测电桥法动画</title>
  <rect width="800" height="470" fill="#f8fafc"/>
  <style>
  text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
  /* 深色模式：GitHub 深色主题下对调底色与文字色，只覆盖配色，不动几何与动画。
     stroke="#fff" 保持白色——那是彩色徽标上的勾选，不在覆盖范围内。 */
  @media (prefers-color-scheme: dark){
  rect[fill="#f8fafc"]{fill:#0f172a}
  rect[fill="#fff"]{fill:#1e293b}
  [fill="#f1f5f9"]{fill:#1e293b}
  [stroke="#f1f5f9"]{stroke:#1e293b}
  [fill="#e2e8f0"]{fill:#334155}
  [stroke="#e2e8f0"]{stroke:#334155}
  [fill="#cbd5e1"]{fill:#475569}
  [stroke="#cbd5e1"]{stroke:#475569}
  [fill="#64748b"]{fill:#94a3b8}
  [stroke="#64748b"]{stroke:#94a3b8}
  [fill="#475569"]{fill:#cbd5e1}
  [stroke="#475569"]{stroke:#cbd5e1}
  [fill="#334155"]{fill:#e2e8f0}
  [stroke="#334155"]{stroke:#e2e8f0}
  [fill="#1e293b"]{fill:#f1f5f9}
  [stroke="#1e293b"]{stroke:#f1f5f9}
  [fill="#dbeafe"]{fill:#1e3a8a}
  [stroke="#dbeafe"]{stroke:#1e3a8a}
  [fill="#eff6ff"]{fill:#172554}
  [stroke="#eff6ff"]{stroke:#172554}
  [fill="#bfdbfe"]{fill:#1e40af}
  [stroke="#bfdbfe"]{stroke:#1e40af}
  [fill="#1d4ed8"]{fill:#60a5fa}
  [stroke="#1d4ed8"]{stroke:#60a5fa}
  [fill="#1e40af"]{fill:#93c5fd}
  [stroke="#1e40af"]{stroke:#93c5fd}
  [fill="#2563eb"]{fill:#60a5fa}
  [stroke="#2563eb"]{stroke:#60a5fa}
  [fill="#3b82f6"]{fill:#60a5fa}
  [stroke="#3b82f6"]{stroke:#60a5fa}
  [fill="#ecfdf5"]{fill:#022c22}
  [stroke="#ecfdf5"]{stroke:#022c22}
  [fill="#a7f3d0"]{fill:#065f46}
  [stroke="#a7f3d0"]{stroke:#065f46}
  [fill="#86efac"]{fill:#166534}
  [stroke="#86efac"]{stroke:#166534}
  [fill="#065f46"]{fill:#6ee7b7}
  [stroke="#065f46"]{stroke:#6ee7b7}
  [fill="#059669"]{fill:#34d399}
  [stroke="#059669"]{stroke:#34d399}
  [fill="#fef2f2"]{fill:#450a0a}
  [stroke="#fef2f2"]{stroke:#450a0a}
  [fill="#fecaca"]{fill:#7f1d1d}
  [stroke="#fecaca"]{stroke:#7f1d1d}
  [fill="#fca5a5"]{fill:#b91c1c}
  [stroke="#fca5a5"]{stroke:#b91c1c}
  [fill="#991b1b"]{fill:#fca5a5}
  [stroke="#991b1b"]{stroke:#fca5a5}
  [fill="#dc2626"]{fill:#f87171}
  [stroke="#dc2626"]{stroke:#f87171}
  [fill="#fffbeb"]{fill:#451a03}
  [stroke="#fffbeb"]{stroke:#451a03}
  [fill="#fef3c7"]{fill:#78350f}
  [stroke="#fef3c7"]{stroke:#78350f}
  [fill="#92400e"]{fill:#fcd34d}
  [stroke="#92400e"]{stroke:#fcd34d}
  [fill="#b45309"]{fill:#fbbf24}
  [stroke="#b45309"]{stroke:#fbbf24}
  }
</style>

  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">绝缘检测：电桥两次投切，解出 R_iso 两侧</text>

  <!-- 电池包与 B+/B- 母线 -->
  <rect x="100" y="140" width="160" height="160" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="180" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46">电池包</text>
  <text x="180" y="237" text-anchor="middle" font-size="11" fill="#065f46">400V（示例）</text>
  <line x1="260" y1="160" x2="330" y2="160" stroke="#dc2626" stroke-width="4"/>
  <line x1="260" y1="280" x2="330" y2="280" stroke="#2563eb" stroke-width="4"/>
  <text x="252" y="150" text-anchor="middle" font-size="10" fill="#991b1b">B+</text>
  <text x="252" y="296" text-anchor="middle" font-size="10" fill="#1e40af">B-</text>

  <!-- 机壳（地） -->
  <line x1="540" y1="120" x2="540" y2="340" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="525" y1="340" x2="555" y2="340" stroke="#475569" stroke-width="2.5"/>
  <line x1="530" y1="347" x2="550" y2="347" stroke="#475569" stroke-width="2.5"/>
  <line x1="535" y1="354" x2="545" y2="354" stroke="#475569" stroke-width="2.5"/>
  <text x="570" y="345" text-anchor="start" font-size="10" fill="#64748b">机壳</text>

  <!-- 绝缘电阻（正常为虚线兆欧级） -->
  <line x1="330" y1="160" x2="430" y2="160" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="430" y="148" width="70" height="24" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="500" y1="160" x2="540" y2="160" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="465" y="142" text-anchor="middle" font-size="11" fill="#065f46">R_iso+</text>
  <line x1="330" y1="280" x2="430" y2="280" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="430" y="268" width="70" height="24" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 3">
    <animate attributeName="stroke" values="#059669;#059669;#dc2626;#dc2626" keyTimes="0;0.2;0.24;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <line x1="500" y1="280" x2="540" y2="280" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="465" y="262" text-anchor="middle" font-size="11" fill="#065f46">R_iso−
    <animate attributeName="fill" values="#065f46;#065f46;#dc2626;#dc2626" keyTimes="0;0.2;0.24;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- 正常态 / 劣化标注 -->
  <text x="400" y="110" text-anchor="middle" font-size="12" fill="#065f46" opacity="0">正常：两侧都是兆欧级，漏电流 ≈ 0
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.17;0.21;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="410" y="320" text-anchor="end" font-size="11" fill="#dc2626" opacity="0">受潮/破皮：R_iso− 掉到 100kΩ（示例）
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.22;0.26;0.62;0.66;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="410" y="338" text-anchor="end" font-size="11" fill="#991b1b" opacity="0">单侧下降 → 整包对地电位偏移，只测一侧会漏判
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.26;0.3;0.62;0.66;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- 电桥：已知电阻 + 投切开关 -->
  <line x1="330" y1="160" x2="330" y2="196" stroke="#64748b" stroke-width="2"/>
  <rect x="400" y="186" width="60" height="20" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
  <text x="430" y="201" text-anchor="middle" font-size="10" fill="#92400e">R0 已知</text>
  <line x1="460" y1="196" x2="540" y2="196" stroke="#64748b" stroke-width="2"/>
  <line x1="330" y1="196" x2="352" y2="196" stroke="#64748b" stroke-width="2"/>
  <line x1="378" y1="196" x2="400" y2="196" stroke="#64748b" stroke-width="2"/>
  <line x1="352" y1="196" x2="378" y2="196" stroke="#059669" stroke-width="2.5" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.44;0.47;0.62;0.65;1" dur="12s" repeatCount="indefinite"/>
  </line>
  <line x1="352" y1="196" x2="376" y2="186" stroke="#dc2626" stroke-width="2.5" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0;1;1" keyTimes="0;0.4;0.42;0.44;0.62;0.65;1" dur="12s" repeatCount="indefinite"/>
  </line>
  <text x="352" y="178" text-anchor="middle" font-size="10" fill="#475569" opacity="0">S1
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4;0.43;0.62;0.66;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <line x1="330" y1="280" x2="330" y2="244" stroke="#64748b" stroke-width="2"/>
  <rect x="400" y="234" width="60" height="20" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
  <text x="430" y="249" text-anchor="middle" font-size="10" fill="#92400e">R0 已知</text>
  <line x1="460" y1="244" x2="540" y2="244" stroke="#64748b" stroke-width="2"/>
  <line x1="330" y1="244" x2="352" y2="244" stroke="#64748b" stroke-width="2"/>
  <line x1="378" y1="244" x2="400" y2="244" stroke="#64748b" stroke-width="2"/>
  <line x1="352" y1="244" x2="378" y2="244" stroke="#059669" stroke-width="2.5" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.67;0.7;0.82;0.85;1" dur="12s" repeatCount="indefinite"/>
  </line>
  <line x1="352" y1="244" x2="376" y2="234" stroke="#dc2626" stroke-width="2.5" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0;1;1" keyTimes="0;0.63;0.65;0.67;0.82;0.85;1" dur="12s" repeatCount="indefinite"/>
  </line>
  <text x="352" y="228" text-anchor="middle" font-size="10" fill="#475569" opacity="0">S2
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.63;0.66;0.82;0.86;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- 读数表 -->
  <line x1="330" y1="160" x2="330" y2="120" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="330" y1="120" x2="600" y2="120" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="600" y="98" width="150" height="66" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="675" y="116" text-anchor="middle" font-size="11" fill="#475569">电压读数</text>
  <text x="675" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563eb" opacity="0">U1 = 218V（示例）
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.46;0.5;0.66;0.7;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="675" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8" opacity="0">U2 = 174V（示例）
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7;0.74;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- 联立求解与判据 -->
  <rect x="200" y="362" width="400" height="30" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.72;0.76;0.84;0.87;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text x="400" y="381" text-anchor="middle" font-size="12" fill="#1e40af" opacity="0">U1、U2 两组方程联立 → 解出 R_iso+ 与 R_iso−
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.72;0.76;0.84;0.87;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <rect x="200" y="400" width="400" height="30" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.86;0.9;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text x="400" y="419" text-anchor="middle" font-size="11" fill="#92400e" opacity="0">低于标准门限（Ω/V 量级，示例）→ 报警并限制上高压
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.86;0.9;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <text x="400" y="452" text-anchor="middle" font-size="13" fill="#475569">关键：只测一侧会漏判；两次投切换来两个方程，解出两侧绝缘。</text>
</svg>
