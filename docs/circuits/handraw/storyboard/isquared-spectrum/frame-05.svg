<text x="710" y="104" font-family="KaiTi" font-size="14" fill="#003153" text-anchor="middle">I² 的频率成分</text>
<line x1="80" y1="200" x2="430" y2="200" stroke="#003153" stroke-width="1.5" filter="url(#w)"/>
