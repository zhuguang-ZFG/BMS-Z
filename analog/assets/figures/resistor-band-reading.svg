<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">
<title id="title">四环、五环与六环电阻怎样读</title>
<desc id="desc">四环与实拍同向，从右向左橙橙棕金，330欧姆正负5%。五环另绘例为橙橙黑黑棕，330欧姆正负1%；六环增加棕色TCR环，示例100 ppm每摄氏度，需按型号核对。</desc>
<rect width="960" height="700" fill="#fffdf5"/>
<text x="34" y="43" font-size="28" text-anchor="start" fill="#003153" font-weight="700">数清色环，再分清每一环的工作</text>
<text x="34" y="76" font-size="19" text-anchor="start" fill="#003153">第一行对应照片；五环、六环是另绘的 330 Ω 教学例。</text>
<rect x="25" y="102" width="910" height="174" rx="12" fill="#e4edf0" stroke="#003153" stroke-width="1.6"/>
<text x="43" y="131" font-size="21" text-anchor="start" fill="#003153" font-weight="700">四环 · 与照片同向</text>
<text x="680" y="131" font-size="18" text-anchor="start" fill="#003153">从右向左读  ←</text>
<path d="M55 181 H717" fill="none" stroke="#003153" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="74" y="154" width="628" height="53" rx="20" fill="#eee2cc" stroke="#003153" stroke-width="1.6"/>
<rect x="163" y="155" width="24" height="51" rx="1" fill="#b88a26" stroke="#b88a26" stroke-width="1.6"/>
<text x="175" y="232" font-size="18" text-anchor="middle" fill="#003153" font-weight="700">金 · ±5%</text>
<text x="175" y="257" font-size="16" text-anchor="middle" fill="#003153">容差</text>
<rect x="318" y="155" width="24" height="51" rx="1" fill="#70452c" stroke="#70452c" stroke-width="1.6"/>
<text x="330" y="232" font-size="18" text-anchor="middle" fill="#003153" font-weight="700">棕 · ×10</text>
<text x="330" y="257" font-size="16" text-anchor="middle" fill="#003153">倍率</text>
<rect x="473" y="155" width="24" height="51" rx="1" fill="#d87723" stroke="#d87723" stroke-width="1.6"/>
<text x="485" y="232" font-size="18" text-anchor="middle" fill="#003153" font-weight="700">橙 · 3</text>
<text x="485" y="257" font-size="16" text-anchor="middle" fill="#003153">第2位</text>
<rect x="628" y="155" width="24" height="51" rx="1" fill="#d87723" stroke="#d87723" stroke-width="1.6"/>
<text x="640" y="232" font-size="18" text-anchor="middle" fill="#003153" font-weight="700">橙 · 3</text>
<text x="640" y="257" font-size="16" text-anchor="middle" fill="#003153">第1位</text>
<text x="815" y="186" font-size="21" text-anchor="middle" fill="#003153" font-weight="700">33 × 10</text>
<text x="815" y="220" font-size="20" text-anchor="middle" fill="#003153" font-weight="700">330 Ω ±5%</text>
<rect x="25" y="292" width="910" height="174" rx="12" fill="#fffdf5" stroke="#003153" stroke-width="1.6"/>
<text x="43" y="321" font-size="21" text-anchor="start" fill="#003153" font-weight="700">五环 · 教学例</text>
<text x="680" y="321" font-size="18" text-anchor="start" fill="#003153">从左向右读  →</text>
<path d="M55 371 H717" fill="none" stroke="#003153" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="74" y="344" width="628" height="53" rx="20" fill="#eee2cc" stroke="#003153" stroke-width="1.6"/>
<rect x="108" y="345" width="24" height="51" rx="1" fill="#d87723" stroke="#d87723" stroke-width="1.6"/>
<text x="120" y="422" font-size="18" text-anchor="middle" fill="#003153" font-weight="700">橙 · 3</text>
<text x="120" y="447" font-size="16" text-anchor="middle" fill="#003153">第1位</text>
<rect x="230" y="345" width="24" height="51" rx="1" fill="#d87723" stroke="#d87723" stroke-width="1.6"/>
<text x="242" y="422" font-size="18" text-anchor="middle" fill="#003153" font-weight="700">橙 · 3</text>
<text x="242" y="447" font-size="16" text-anchor="middle" fill="#003153">第2位</text>
<rect x="352" y="345" width="24" height="51" rx="1" fill="#26303a" stroke="#26303a" stroke-width="1.6"/>
<text x="364" y="422" font-size="18" text-anchor="middle" fill="#003153" font-weight="700">黑 · 0</text>
<text x="364" y="447" font-size="16" text-anchor="middle" fill="#003153">第3位</text>
<rect x="474" y="345" width="24" height="51" rx="1" fill="#26303a" stroke="#26303a" stroke-width="1.6"/>
<text x="486" y="422" font-size="18" text-anchor="middle" fill="#003153" font-weight="700">黑 · ×1</text>
<text x="486" y="447" font-size="16" text-anchor="middle" fill="#003153">倍率</text>
<rect x="596" y="345" width="24" height="51" rx="1" fill="#70452c" stroke="#70452c" stroke-width="1.6"/>
<text x="608" y="422" font-size="18" text-anchor="middle" fill="#003153" font-weight="700">棕 · ±1%</text>
<text x="608" y="447" font-size="16" text-anchor="middle" fill="#003153">容差</text>
<text x="815" y="376" font-size="21" text-anchor="middle" fill="#003153" font-weight="700">330 × 1</text>
<text x="815" y="410" font-size="20" text-anchor="middle" fill="#003153" font-weight="700">330 Ω ±1%</text>
<rect x="25" y="482" width="910" height="174" rx="12" fill="#fffdf5" stroke="#003153" stroke-width="1.6"/>
<text x="43" y="511" font-size="21" text-anchor="start" fill="#003153" font-weight="700">六环 · 教学例</text>
<text x="680" y="511" font-size="18" text-anchor="start" fill="#003153">从左向右读  →</text>
<path d="M55 561 H717" fill="none" stroke="#003153" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="74" y="534" width="628" height="53" rx="20" fill="#eee2cc" stroke="#003153" stroke-width="1.6"/>
<rect x="88" y="535" width="24" height="51" rx="1" fill="#d87723" stroke="#d87723" stroke-width="1.6"/>
<text x="100" y="612" font-size="18" text-anchor="middle" fill="#003153" font-weight="700">橙 · 3</text>
<text x="100" y="637" font-size="16" text-anchor="middle" fill="#003153">第1位</text>
<rect x="198" y="535" width="24" height="51" rx="1" fill="#d87723" stroke="#d87723" stroke-width="1.6"/>
<text x="210" y="612" font-size="18" text-anchor="middle" fill="#003153" font-weight="700">橙 · 3</text>
<text x="210" y="637" font-size="16" text-anchor="middle" fill="#003153">第2位</text>
<rect x="308" y="535" width="24" height="51" rx="1" fill="#26303a" stroke="#26303a" stroke-width="1.6"/>
<text x="320" y="612" font-size="18" text-anchor="middle" fill="#003153" font-weight="700">黑 · 0</text>
<text x="320" y="637" font-size="16" text-anchor="middle" fill="#003153">第3位</text>
<rect x="418" y="535" width="24" height="51" rx="1" fill="#26303a" stroke="#26303a" stroke-width="1.6"/>
<text x="430" y="612" font-size="18" text-anchor="middle" fill="#003153" font-weight="700">黑 · ×1</text>
<text x="430" y="637" font-size="16" text-anchor="middle" fill="#003153">倍率</text>
<rect x="528" y="535" width="24" height="51" rx="1" fill="#70452c" stroke="#70452c" stroke-width="1.6"/>
<text x="540" y="612" font-size="18" text-anchor="middle" fill="#003153" font-weight="700">棕 · ±1%</text>
<text x="540" y="637" font-size="16" text-anchor="middle" fill="#003153">容差</text>
<rect x="638" y="535" width="24" height="51" rx="1" fill="#70452c" stroke="#70452c" stroke-width="1.6"/>
<text x="650" y="612" font-size="18" text-anchor="middle" fill="#003153" font-weight="700">棕 · 100</text>
<text x="650" y="637" font-size="16" text-anchor="middle" fill="#003153">TCR</text>
<text x="815" y="566" font-size="21" text-anchor="middle" fill="#003153" font-weight="700">330 Ω ±1%</text>
<text x="815" y="600" font-size="20" text-anchor="middle" fill="#003153" font-weight="700">100 ppm/°C</text>
<text x="34" y="687" font-size="18" text-anchor="start" fill="#003153">第五环是容差；第六环的温度系数标记须按具体型号核对。功率不能仅凭色环判断。</text>
</svg>
