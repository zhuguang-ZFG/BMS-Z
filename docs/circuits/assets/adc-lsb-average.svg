<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="ui-monospace, Consolas, monospace">
  <title>平均把随机噪声按平方根压下去，压不掉固定偏移。12 bit、5 V 参考的 LSB 为示意。</title>
  <desc>平均把随机噪声按平方根压下去，压不掉固定偏移。12 bit、5 V 参考的 LSB 为示意。</desc>

  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.5; fill: none; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .dotg { fill: #1a7f37; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    .boxr { fill: #ffebe9; stroke: #cf222e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .dotg { fill: #3fb950; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
      .boxr { fill: #3d1214; stroke: #ff7b72; }
    }
  </style>

  <!-- formula: sigma_LSB=4/sqrt(N); LSB=5/4096 V -->
  <rect class="bg" width="800" height="500"/>
  <text class="title" x="24" y="32">平均有用，但只对来回跳的那部分（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="122" rx="6"/>
  <text class="txt" x="40" y="68" opacity="0.28">① 一次采样<tspan class="small">　示意 σ=4 LSB。12 bit、5 V 参考时 1 LSB=5/4096≈1.22 mV。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="94" opacity="0.28">② 平均 16 次<tspan class="small">　σ 变成 1 LSB。开头降得快。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="120" opacity="0.28">③ 再加到 64 次<tspan class="small">　只再到 0.5 LSB。收益变缓，时间却在变长。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="146" opacity="0.28">④ 固定偏移<tspan class="small">　整尺偏 24 mV 时，平均仍偏 24 mV。那一笔靠标定，不靠多采几次。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="182" width="752" height="250" rx="6"/>
  <text class="small" x="40" y="204">噪声 σ / LSB</text>
  <line class="axis" x1="92.0" y1="214.0" x2="92.0" y2="400.0"/>
  <line class="axis" x1="92.0" y1="400.0" x2="720.0" y2="400.0"/>
  <text class="small" x="712.0" y="418" text-anchor="end">平均次数 N</text>
  <line class="grid" x1="92.0" y1="400.0" x2="92.0" y2="406.0"/>
  <text class="small" x="92.0" y="432" text-anchor="middle">1</text>
  <line class="grid" x1="241.5" y1="400.0" x2="241.5" y2="406.0"/>
  <text class="small" x="241.5" y="432" text-anchor="middle">16</text>
  <line class="grid" x1="720.0" y1="400.0" x2="720.0" y2="406.0"/>
  <text class="small" x="720.0" y="432" text-anchor="middle">64</text>
  <line class="grid" x1="86.0" y1="379.3" x2="92.0" y2="379.3"/>
  <text class="small" x="82.0" y="383.3" text-anchor="end">0.5</text>
  <line class="grid" x1="86.0" y1="358.7" x2="92.0" y2="358.7"/>
  <text class="small" x="82.0" y="362.7" text-anchor="end">1</text>
  <line class="grid" x1="86.0" y1="234.7" x2="92.0" y2="234.7"/>
  <text class="small" x="82.0" y="238.7" text-anchor="end">4</text>
  <polyline class="lineb" points="92.0,234.7 102.0,283.1 111.9,304.5 121.9,317.3 131.9,326.1 141.8,332.5 151.8,337.5 161.8,341.5 171.7,344.9 181.7,347.7 191.7,350.2 201.7,352.3 211.6,354.1 221.6,355.8 231.6,357.3 241.5,358.7 251.5,359.9 261.5,361.0 271.4,362.1 281.4,363.0 291.4,363.9 301.3,364.8 311.3,365.5 321.3,366.3 331.2,366.9 341.2,367.6 351.2,368.2 361.1,368.8 371.1,369.3 381.1,369.8 391.0,370.3 401.0,370.8 411.0,371.2 421.0,371.6 430.9,372.1 440.9,372.4 450.9,372.8 460.8,373.2 470.8,373.5 480.8,373.9 490.7,374.2 500.7,374.5 510.7,374.8 520.6,375.1 530.6,375.4 540.6,375.6 550.5,375.9 560.5,376.1 570.5,376.4 580.4,376.6 590.4,376.8 600.4,377.1 610.3,377.3 620.3,377.5 630.3,377.7 640.3,377.9 650.2,378.1 660.2,378.3 670.2,378.5 680.1,378.7 690.1,378.8 700.1,379.0 710.0,379.2 720.0,379.3" stroke-linejoin="round" stroke-linecap="round"/>
  <text class="hi" x="280" y="250">σ = 4/√N</text>
  <circle class="doty" r="6"><animate attributeName="cx" values="92.0;144.3;196.7;249.0;301.3;353.7;406.0;458.3;510.7;563.0;615.3;667.7;720.0" keyTimes="0;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="234.7;333.8;351.2;359.6;364.8;368.3;371.0;373.1;374.8;376.2;377.4;378.4;379.3" keyTimes="0;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1" dur="12s" repeatCount="indefinite"/></circle>
  <text class="small" x="24" y="478">4 LSB 是示意的噪声，不是 ADC 手册的有效位数。台阶多细见量化那张图；这里只看平均之后还剩多少来回跳。</text>
</svg>
