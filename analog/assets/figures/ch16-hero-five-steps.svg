<text x="82" y="149" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="18" font-weight="700" fill="#14213d">症状确认</text>
<text x="52" y="184" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="13" fill="#52606d">先问后拆</text>
<text x="52" y="206" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="13" fill="#52606d">温度？带载？最近改过啥</text>
<text x="52" y="272" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="13" fill="#0f766e">防臆断</text>

