<text x="589" y="359" fill="#2a2927" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#efe7dc">示波器</text>
<text x="800" y="248" fill="#2a2927" font-size="40" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">×10 · 10 pF</text>
<text x="1124" y="248" fill="#2a2927" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">拐点 ≈ 160 kHz</text>
<text x="847" y="322" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#f6f2ed">输入</text>
<text x="973" y="322" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#f6f2ed">100 kΩ</text>
<text x="1121" y="322" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#f6f2ed">测量节点</text>
<text x="1166" y="423" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">探头电容</text>
<text x="1289" y="359" fill="#2a2927" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#f6f2ed">示波器</text>
<text x="94" y="524" fill="#2a2927" font-size="38" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">同刻度计算波形（归一化）</text>
<text x="170.0" y="915" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#f6f2ed">0</text>
