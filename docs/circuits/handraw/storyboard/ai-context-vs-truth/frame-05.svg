 <line x1="510.0" y1="301" x2="560.0" y2="301" stroke-dasharray="5 4"/>
 <line x1="400.0" y1="373" x2="560.0" y2="373"/>
</g>
<path d="M550.0,301 L486.0,301 L486.0,285" fill="none" stroke="#003153" stroke-width="1.3" stroke-dasharray="6 4" filter="url(#w)"/>
<path d="M486.0,110 L190.0,110" fill="none" stroke="#003153" stroke-width="1.3" stroke-dasharray="6 4" filter="url(#w)"/>
<path d="M198.0,105 L190.0,110 L198.0,115" fill="none" stroke="{INK}" stroke-width="1.3" filter="url(#w)"/>
<circle cx="486.0" cy="110" r="5.5" fill="none" stroke="#E34234" stroke-width="2.6" filter="url(#w)"/>
<g font-family="KaiTi" font-size="12" fill="#003153">
 <text x="275" y="106" text-anchor="middle">你贴进去的（证据）</text>
 <text x="685" y="106" text-anchor="middle">它凭记忆答的（印象）</text>
 <text x="150" y="418">凡是阈值 / 位宽 / 单位，只认这一边</text>
 <text x="560" y="418">它给的每一个数都要重新取证</text>
 <text x="486" y="124" font-size="9">越界就打回</text>
</g>
<text x="60" y="500" font-family="KaiTi" font-size="13" fill="#003153">⑤ 越界被打回：右栏一个数越过中线，被推回左上。</text>
<text x="480" y="546" font-family="KaiTi" font-size="14" fill="#003153" opacity="0.75" text-anchor="middle">原理示意 / 非实拍</text>
</svg>
