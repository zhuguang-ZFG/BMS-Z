</style><rect class="bg" x="0" y="-156" width="800" height="836" /><text class="title" x="24" y="-128">高边开关：栅压必须顶到母线之上</text><rect width="800" height="680" class="bg" />
  <text x="200" y="62" text-anchor="middle" font-size="14" font-weight="bold" class="ok">低边：驱动最简单</text>
  <line x1="60" y1="90" x2="340" y2="90" stroke-width="3" class="stroke-axis" />
  <text x="52" y="94" text-anchor="end" font-size="12" class="small">B+</text>
  <line x1="200" y1="90" x2="200" y2="110" stroke-width="2.5" class="stroke-axis" />
  <rect x="170" y="110" width="60" height="36" stroke-width="1.5" class="fill-muted stroke-axis" />
  <text x="200" y="133" text-anchor="middle" font-size="12" class="txt">负载</text>
  <line x1="200" y1="146" x2="200" y2="160" stroke-width="2.5" class="stroke-axis" />
  <rect x="170" y="160" width="60" height="60" fill="#bfdbfe" stroke-width="2" class="stroke-axis">
    <animate attributeName="fill" values="#172554;#166534;#166534" keyTimes="0;0.08;1" dur="12s" repeatCount="indefinite" />
  </rect>
  <line x1="200" y1="220" x2="200" y2="250" stroke-width="2.5" class="stroke-axis" />
  <line x1="60" y1="250" x2="340" y2="250" stroke-width="3" class="stroke-axis" />
  <text x="52" y="254" text-anchor="end" font-size="12" class="small">GND</text>
  <rect x="80" y="165" width="60" height="34" rx="4" stroke-width="1.5" class="fill-boxg stroke-g" />
  <text x="110" y="187" text-anchor="middle" font-size="12" font-weight="bold" class="ok">10V</text>
  <line x1="140" y1="182" x2="170" y2="190" stroke-width="2" class="stroke-g" />
  <circle r="4" opacity="0" class="fill-b">
    <animate attributeName="opacity" values="0;0;1;1;0.9;0.9" keyTimes="0;0.08;0.11;0.25;0.27;1" dur="12s" repeatCount="indefinite" />
    <animateMotion path="M200,90 L200,250" keyPoints="0;0;1;1" keyTimes="0;0.08;0.25;1" calcMode="linear" dur="12s" repeatCount="indefinite" />
  </circle>
  <text x="200" y="290" text-anchor="middle" font-size="12" opacity="0" class="ok">源极接地：10V 驱动直接开
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.05;0.08;0.25;0.28;1" dur="12s" repeatCount="indefinite" />
  </text>

  
  <text x="600" y="62" text-anchor="middle" font-size="14" font-weight="bold" class="warn">高边：源极浮在母线上</text>
  <line x1="460" y1="90" x2="740" y2="90" stroke-width="3" class="stroke-axis" />
  <text x="452" y="94" text-anchor="end" font-size="12" class="small">B+ 48V（示例）</text>
  <line x1="600" y1="90" x2="600" y2="110" stroke-width="2.5" class="stroke-axis" />
  <rect x="570" y="110" width="60" height="60" stroke-width="2" class="fill-boxb stroke-axis" />
  <line x1="600" y1="170" x2="600" y2="200" stroke-width="2.5" class="stroke-axis" />
  <rect x="570" y="200" width="60" height="36" stroke-width="1.5" class="fill-muted stroke-axis" />
  <text x="600" y="223" text-anchor="middle" font-size="12" class="txt">负载</text>
  <line x1="600" y1="236" x2="600" y2="280" stroke-width="2.5" class="stroke-axis" />
  <line x1="460" y1="280" x2="740" y2="280" stroke-width="3" class="stroke-axis" />
  <text x="452" y="284" text-anchor="end" font-size="12" class="small">GND</text>
  <text x="648" y="150" text-anchor="start" font-size="12" opacity="0" class="txt">开通后 源极 ≈ 48V
    <animate attributeName="opacity" values="0;0;1;1;0.9;0.9" keyTimes="0;0.27;0.3;0.5;0.52;1" dur="12s" repeatCount="indefinite" />
  </text>

  
  <line x1="460" y1="48" x2="590" y2="48" stroke-width="1.5" stroke-dasharray="5 4" opacity="0" class="stroke-r">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.32;1" dur="12s" repeatCount="indefinite" />
  </line>
  <text x="452" y="52" text-anchor="end" font-size="12" opacity="0" class="warn">58V
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.32;1" dur="12s" repeatCount="indefinite" />
  </text>
  
  <text x="600" y="330" text-anchor="middle" font-size="13" font-weight="bold" opacity="0" class="warn">V_G = V_S + 10V = 58V，比 B+ 还高
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.34;0.46;0.49;1" dur="12s" repeatCount="indefinite" />
  </text>
  <text x="600" y="352" text-anchor="middle" font-size="12" opacity="0" class="small">好处：断开时负载端彻底脱离 B+
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.34;0.46;0.49;1" dur="12s" repeatCount="indefinite" />
  </text>

  
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.54;1" dur="12s" repeatCount="indefinite" />
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -190;0 -190" keyTimes="0;0.55;0.68;1" dur="12s" repeatCount="indefinite" />
      <line x1="490" y1="240" x2="530" y2="240" stroke="#475569" stroke-width="3" class="stroke-axis">
        <animate attributeName="stroke" values="#94a3b8;#94a3b8;#60a5fa;#60a5fa" keyTimes="0;0.52;0.58;1" dur="12s" repeatCount="indefinite" />
      </line>
      <line x1="490" y1="252" x2="530" y2="252" stroke-width="3" class="stroke-axis" />
      <line x1="510" y1="228" x2="510" y2="240" stroke-width="2" class="stroke-axis" />
      <line x1="510" y1="252" x2="510" y2="264" stroke-width="2" class="stroke-axis" />
    </g>
    <text x="460" y="302" text-anchor="start" font-size="12" opacity="0" class="hi">① 先充电到 10V
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.1;0.14;1" dur="12s" repeatCount="indefinite" begin="6s" />
    </text>
    <text x="460" y="322" text-anchor="start" font-size="12" opacity="0" class="hi">② 源极抬起，电容跟着上 48V
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.16;0.2;1" dur="12s" repeatCount="indefinite" begin="6s" />
    </text>
    <path d="M510,50 L556,50 L556,140 L568,140" fill="none" stroke-width="2" stroke-dasharray="120" stroke-dashoffset="120" class="stroke-b">
      <animate attributeName="stroke-dashoffset" values="120;120;0;0" keyTimes="0;0.68;0.75;1" dur="12s" repeatCount="indefinite" />
    </path>
    <text x="596" y="44" text-anchor="start" font-size="12" font-weight="bold" opacity="0" class="ok">栅压被顶到 58V ✓
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7;0.74;0.78;0.8;1" dur="12s" repeatCount="indefinite" />
    </text>
  </g>

  
  <rect x="180" y="384" width="440" height="32" rx="6" stroke-width="1.5" opacity="0" class="fill-boxy stroke-y">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.78;0.83;1" dur="12s" repeatCount="indefinite" />
  </rect>
  <text x="400" y="404" text-anchor="middle" font-size="12" opacity="0" class="gold">自举靠循环充电：不能 100% 常开——常开主开关用电荷泵或隔离驱动
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.78;0.83;1" dur="12s" repeatCount="indefinite" />
  </text>

  <text x="400" y="452" text-anchor="middle" font-size="13" class="small">关键：高边 N 沟道要 V_G 高过 B+；自举能省钱但不能常开，常开用电荷泵。</text>
<rect x="24" y="478.0" width="752" height="188" rx="6" class="panel" /><text x="40" y="498.0" font-size="13" class="txt">底栏：100 nF、漏电 10 µA，每毫秒掉 0.1 V</text><text x="40" y="514.0" font-size="12" class="small">Vgs 余量 V</text><line x1="70.0" y1="514.0" x2="70.0" y2="628.0" stroke-width="1.5" class="stroke-axis" /><line x1="70.0" y1="628.0" x2="460.0" y2="628.0" stroke-width="1.5" class="stroke-axis" /><line x1="70.0" y1="628.0" x2="70.0" y2="633.0" class="stroke-axis" /><text x="70.0" y="646.0" text-anchor="middle" font-size="12" class="small">0</text><line x1="330.0" y1="628.0" x2="330.0" y2="633.0" class="stroke-axis" /><text x="330.0" y="646.0" text-anchor="middle" font-size="12" class="small">20</text><line x1="460.0" y1="628.0" x2="460.0" y2="633.0" class="stroke-axis" /><text x="460.0" y="646.0" text-anchor="middle" font-size="12" class="small">30</text><line x1="65.0" y1="536.8" x2="70.0" y2="536.8" class="stroke-axis" /><text x="62.0" y="540.8" text-anchor="end" font-size="12" class="small">10</text><line x1="65.0" y1="582.4" x2="70.0" y2="582.4" class="stroke-axis" /><text x="62.0" y="586.4" text-anchor="end" font-size="12" class="small">8</text><line x1="65.0" y1="605.2" x2="70.0" y2="605.2" class="stroke-axis" /><text x="62.0" y="609.2" text-anchor="end" font-size="12" class="small">7</text><polyline points="70.0,536.8 79.8,538.5 89.5,540.2 99.2,541.9 109.0,543.6 118.8,545.4 128.5,547.1 138.2,548.8 148.0,550.5 157.8,552.2 167.5,553.9 177.2,555.6 187.0,557.3 196.8,559.0 206.5,560.7 216.2,562.5 226.0,564.2 235.8,565.9 245.5,567.6 255.2,569.3 265.0,571.0 274.8,572.7 284.5,574.4 294.2,576.1 304.0,577.8 313.8,579.5 323.5,581.3 333.2,583.0 343.0,584.7 352.8,586.4 362.5,588.1 372.2,589.8 382.0,591.5 391.8,593.2 401.5,594.9 411.2,596.6 421.0,598.4 430.8,600.1 440.5,601.8 450.2,603.5 460.0,605.2" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" class="stroke-b" /><circle r="5" class="fill-y"><animate attributeName="cx" values="70.0;118.8;167.5;216.2;265.0;313.8;362.5;411.2;460.0" keyTimes="0.0000;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1.0000" dur="8s" repeatCount="indefinite" /><animate attributeName="cy" values="536.8;545.4;553.9;562.5;571.0;579.5;588.1;596.6;605.2" keyTimes="0.0000;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1.0000" dur="8s" repeatCount="indefinite" /></circle><text x="479.4" y="646.0" text-anchor="start" font-size="12" class="small">开通后 ms</text><text x="480" y="556.0" font-size="12" class="txt">20 ms：栅压余量从 10 V 到 8 V。</text>
</svg>