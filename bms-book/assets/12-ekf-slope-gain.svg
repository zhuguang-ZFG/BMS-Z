<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="title desc">
  <title id="title">OCV 斜率对朴素反演与 EKF 修正的不同影响</title><desc id="desc">横轴是对数尺度的 OCV 斜率 H。固定 P 为 6.25 乘十的负四次方、R 为 2.25 乘十的负四次方平方伏、残差为 15 毫伏。朴素反演 e 除 H 单调下降；EKF 修正 K 乘 e 在 H 等于 0.6 伏每 SOC 附近达到 1.25 个百分点，再逐渐下降。</desc>
  <style>.bg{fill:#fffdf5}.ink{fill:#293b3a}.muted{fill:#626d65}.green{fill:#377b60}.teal{fill:#176b73}.gold{fill:#926717}.red{fill:#b84745}.green-bg{fill:#e4f0df;stroke:#377b60}.teal-bg{fill:#e1eff0;stroke:#176b73}.gold-bg{fill:#fbefc7;stroke:#926717}.red-bg{fill:#f6e2df;stroke:#b84745}.title{font:700 19px "Noto Sans SC","Microsoft YaHei",sans-serif}.head{font:700 14px "Noto Sans SC","Microsoft YaHei",sans-serif}.body{font:13px "Noto Sans SC","Microsoft YaHei",sans-serif}.small{font:12px "Noto Sans SC","Microsoft YaHei",sans-serif}.tiny{font:11px "Noto Sans SC","Microsoft YaHei",sans-serif}.axis{fill:none;stroke:#626d65;stroke-width:1.7}.grid{fill:none;stroke:#cfc6b2;stroke-width:1;stroke-dasharray:4 5}.inverse{fill:none;stroke:#926717;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.gain{fill:none;stroke:#176b73;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}.guide{fill:none;stroke:#b84745;stroke-width:1.6;stroke-dasharray:6 5}.point-gold{fill:#fffdf5;stroke:#926717;stroke-width:2.4}.point-teal{fill:#fffdf5;stroke:#176b73;stroke-width:2.4}.sketch{fill:none;stroke-linecap:round}@media(prefers-color-scheme:dark){.bg{fill:#192727}.ink{fill:#edf0e5}.muted{fill:#b0beb3}.green{fill:#8fc7a2}.teal{fill:#8bcbd0}.gold{fill:#dfbd78}.red{fill:#f39b91}.green-bg{fill:#293f35;stroke:#8fc7a2}.teal-bg{fill:#203e42;stroke:#7dbbc0}.gold-bg{fill:#453e2b;stroke:#dfbd78}.red-bg{fill:#483336;stroke:#f39b91}.axis{stroke:#b0beb3}.grid{stroke:#496160}.inverse{stroke:#dfbd78}.gain{stroke:#8bcbd0}.guide{stroke:#f39b91}.point-gold{fill:#192727;stroke:#dfbd78}.point-teal{fill:#192727;stroke:#8bcbd0}}</style>
  <rect class="bg" width="1000" height="600"/><text x="24" y="34" class="title ink">同一条斜率，回答两个不同问题</text><path d="M24 43C149 37 272 49 397 41" class="sketch" stroke="#926717" stroke-width="3" opacity=".72"/><text x="24" y="66" class="body muted">固定 P = 6.25×10⁻⁴、R = 2.25×10⁻⁴ V²、e = 15 mV；横轴 H 为对数尺度。</text>
  <rect x="642" y="20" width="150" height="34" rx="17" class="gold-bg"/><line x1="658" y1="37" x2="686" y2="37" class="inverse"/><text x="700" y="42" class="small gold">朴素反演 e/H</text><rect x="804" y="20" width="172" height="34" rx="17" class="teal-bg"/><line x1="820" y1="37" x2="848" y2="37" class="gain"/><text x="862" y="42" class="small teal">EKF 修正 K·e</text>
  <rect x="86" y="96" width="840" height="388" rx="14" fill="none" stroke="#cfc6b2" stroke-width="1.4"/><g class="grid"><path d="M108 150H902M108 228H902M108 305H902M108 383H902M108 460H902"/><path d="M108 150V460M210 150V460M283 150V460M340 150V460M508 150V460M677 150V460M808 150V460M846 150V460"/></g><path d="M108 150V460H902" class="axis"/>
  <g class="small muted"><text x="96" y="464" text-anchor="end">0</text><text x="96" y="387" text-anchor="end">1</text><text x="96" y="309" text-anchor="end">2</text><text x="96" y="232" text-anchor="end">3</text><text x="96" y="154" text-anchor="end">4 pp</text><text x="108" y="480" text-anchor="middle">0.4</text><text x="210" y="480" text-anchor="middle">0.6</text><text x="283" y="480" text-anchor="middle">0.8</text><text x="340" y="480" text-anchor="middle">1</text><text x="508" y="480" text-anchor="middle">2</text><text x="677" y="480" text-anchor="middle">4</text><text x="808" y="480" text-anchor="middle">6.8</text><text x="846" y="480" text-anchor="middle">8</text></g><text x="505" y="510" text-anchor="middle" class="body ink">OCV 斜率 H（V/SOC，对数尺度）</text><text x="30" y="305" transform="rotate(-90 30 305)" text-anchor="middle" class="body ink">15 mV 对应的 SOC 改变量</text>
  <path d="M108 169C147 207 181 245 210 266C236 285 260 302 283 315C304 327 322 338 340 344C400 370 455 393 508 402C567 414 622 425 677 431C727 437 772 441 808 443C823 444 835 445 846 445" class="inverse"/><path d="M108 371C145 366 179 362 210 363C236 363 260 365 283 367C304 369 323 372 340 374C399 387 456 399 508 407C566 418 622 427 677 432C727 437 772 441 808 443C823 444 835 445 846 445" class="gain"/><path d="M210 150V460" class="guide"/><text x="219" y="133" class="small red">峰值 H = √(R/P) = 0.6</text>
  <g><circle cx="210" cy="266" r="5" class="point-gold"/><circle cx="210" cy="363" r="5" class="point-teal"/><circle cx="283" cy="315" r="5" class="point-gold"/><circle cx="283" cy="367" r="5" class="point-teal"/><circle cx="808" cy="443" r="5" class="point-gold"/><circle cx="808" cy="443" r="4" class="point-teal"/></g>
  <g class="tiny ink"><rect x="126" y="277" width="126" height="61" rx="10" class="red-bg"/><text x="189" y="297" text-anchor="middle">H = 0.6</text><text x="189" y="315" text-anchor="middle" class="gold">e/H = 2.50 pp</text><text x="189" y="332" text-anchor="middle" class="teal">K·e = 1.25 pp</text><rect x="298" y="282" width="126" height="61" rx="10" class="teal-bg"/><text x="361" y="302" text-anchor="middle">H = 0.8</text><text x="361" y="320" text-anchor="middle" class="gold">e/H = 1.875 pp</text><text x="361" y="337" text-anchor="middle" class="teal">K·e = 1.20 pp</text><rect x="738" y="337" width="150" height="61" rx="10" class="green-bg"/><text x="813" y="357" text-anchor="middle">H = 6.8 · 陡区</text><text x="813" y="375" text-anchor="middle" class="gold">e/H = 0.22 pp</text><text x="813" y="392" text-anchor="middle" class="teal">K·e = 0.22 pp</text></g>
  <rect x="86" y="532" width="404" height="44" rx="12" class="gold-bg"/><text x="288" y="550" text-anchor="middle" class="head gold">看得清：1 pp SOC 会拉开多少电压</text><text x="288" y="568" text-anchor="middle" class="tiny ink">H 越大，SOC 差异在电压上越显眼</text><rect x="510" y="532" width="416" height="44" rx="12" class="teal-bg"/><text x="718" y="550" text-anchor="middle" class="head teal">改多少：15 mV 残差应分给多少 SOC</text><text x="718" y="568" text-anchor="middle" class="tiny ink">还要同时看 P、R；不是把 e/H 全吃掉</text>
</svg>
