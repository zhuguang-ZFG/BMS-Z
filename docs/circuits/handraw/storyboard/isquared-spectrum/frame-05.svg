</g>
<g class="motion" data-x="1">
<line x1="600" y1="258" x2="600" y2="212" stroke="#003153" stroke-width="3.0" filter="url(#w)"/>
<text x="600" y="202" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="middle">直流</text>
<line x1="680" y1="258" x2="680" y2="222" stroke="#003153" stroke-width="3.0" filter="url(#w)"/>
<text x="680" y="212" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="middle">ω</text>
<line x1="760" y1="258" x2="760" y2="236" stroke="#003153" stroke-width="3.0" filter="url(#w)"/>
<text x="760" y="226" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="middle">2ω</text>
</g>
<g class="motion" data-x="1">
<text x="70" y="308" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="start" font-weight="bold">电流波形</text>
<text x="330" y="308" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="start" font-weight="bold">I² 的主要结构</text>
<text x="640" y="308" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="start" font-weight="bold">温度应对照什么</text>
<line x1="70" y1="318" x2="900" y2="318" stroke="#003153" stroke-width="1.3" filter="url(#w)"/>
<text x="70" y="336" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="start">I=A sinωt</text>
<text x="330" y="336" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="start">A²/2 − A²cos2ωt/2</text>
<text x="640" y="336" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="start">直流温升和 2ω 纹波</text>
<text x="70" y="372" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="start">I=±A 的对称双极方波</text>
<text x="330" y="372" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="start">恒定 A²</text>
<text x="640" y="372" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="start">忽略切换与熵热时，只向恒温升收敛</text>
<text x="70" y="408" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="start">I 在 0 与 A 间切换</text>
<text x="330" y="408" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="start">原周期的开关功率</text>
<text x="640" y="408" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="start">原频率及高次谐波经热低通</text>
<text x="70" y="444" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="start">I=I0+A sinωt</text>
<text x="330" y="444" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="start">直流、ω 和 2ω</text>
<text x="640" y="444" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="start">偏置导致的 ω 分量不能漏算</text>
<text x="480" y="478" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="middle">平方是非线性：可能翻倍（正弦）、可能抹平（对称方波）、也可能保留原频率（开关）</text>
</g>
<text x="60" y="512" font-family="KaiTi" font-size="13" fill="#003153">⑤ I=I0+A sinωt 时直流、ω 和 2ω 三根同时存在：偏置导致的 ω 分量不能漏算。</text>
<text x="480" y="546" font-family="KaiTi" font-size="14" opacity="0.8" text-anchor="middle" fill="#003153">原理示意 / 非实拍</text>
</svg>
