datasheet:
  url: https://www.ti.com/lit/ds/symlink/lm393.pdf
  revision: SLCS005AH, April 2025
  checked_sections:
  - '5.1'
  - '5.2'
  - '5.8'
  - '5.11'
  findings:
  - Classic non-B operating supply is 2 to 30 V; 36 V is an absolute maximum.
  - Classic response time is measured from the input step to output crossing 1.4 V, not invariably 50
    percent.
  - The 1.3 us value is typical at 5 V, 25 C, 5.1 kohm, 15 pF, 100 mV step and 5 mV overdrive.
  - The 6 mA sink-current lower bound is tested at VOL 1.5 V; use the VOL table for logic-low compatibility.
  - Classic VOL maximum is 0.4 V at 25 C and 0.7 V over temperature at 4 mA under the listed test conditions.
