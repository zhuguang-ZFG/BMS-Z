<text x="155" y="372.0" font-size="12.5" font-weight="bold" fill="#a4630f">R2 10k</text>
<path d="M135 416 Q135.00 423.00 135 430" fill="none" stroke="#37424e" stroke-width="2.5"/><path d="M119 430 Q135.00 429.94 151 430" fill="none" stroke="#37424e" stroke-width="3"/><path d="M125 436 Q135.00 435.97 145 436" fill="none" stroke="#37424e" stroke-width="3"/><line x1="131" y1="442" x2="139" y2="442" stroke="#37424e" stroke-width="3"/>
<path d="M135 328 Q217.50 328.14 300 328" fill="none" stroke="#37424e" stroke-width="2.5"/>
<circle cx="300" cy="328" r="3.5" fill="#37424e"/>
<text x="306" y="350" font-size="12.5" font-weight="bold" fill="#1f5d7a">Vout</text>
<path d="M300 328 Q299.72 364.00 300 400" fill="none" stroke="#37424e" stroke-width="2.5" stroke-dasharray="5,4"/>
<rect x="270" y="320" width="60" height="16" fill="#2f7f96" rx="3"/>
<text x="300" y="332" text-anchor="middle" font-size="11" font-weight="bold" fill="#fdf8ea">50%</text>
<path d="M60 180 Q60.14 276.00 60 372" fill="none" stroke="#37424e" stroke-width="2"/>
<path d="M54,180 L60,170 L66,180 Z" fill="#37424e"/>
<path d="M54,372 L60,382 L66,372 Z" fill="#37424e"/>
<text x="50" y="265" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#37424e" transform="rotate(-90 50 265)">12V</text>
<path d="M64 276 Q74.00 276.06 84 276" fill="none" stroke="#a4630f" stroke-width="2"/>
<path d="M64 308 Q74.00 307.98 84 308" fill="none" stroke="#a8321f" stroke-width="2"/>
<text x="56" y="280" text-anchor="end" font-size="10.5" font-weight="bold" fill="#a4630f">6V</text>
<text x="56" y="312" text-anchor="end" font-size="10.5" font-weight="bold" fill="#a8321f">4V</text>
<text x="210" y="280" font-size="11" font-weight="bold" fill="#a4630f">空载指针：到中点 = 6V</text>
<text x="210" y="312" font-size="11" font-weight="bold" fill="#a8321f">带载指针：矮一截 = 4V</text>
<path fill="none" d="M88,180 L88,372" stroke="#a4630f" stroke-width="2.5" stroke-dasharray="6,4"/>
<path d="M82,186 L88,174 L94,186 Z" fill="#a4630f"/>
