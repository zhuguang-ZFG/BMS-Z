</style><rect class="bg" x="0" y="-156" width="800" height="550" /><text class="title" x="24" y="-128">BMS 学习路线：从一颗电芯到产品级系统</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 从阶段 0 的电芯走到阶段 6 的产品级系统。<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 绿点沿时间轴巡游，每个阶段停一下。<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 节点下是建议用时。业余每天 1–2 小时。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 底下三枚仍是 147 张动画、配套和书单。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="338" width="752" height="44" rx="6" /><text class="txt" x="40" y="366" font-size="13" opacity="1">阶段 0 · 前置知识 · 建议 1–2 周<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.110;0.111;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="366" font-size="13" opacity="0">阶段 1 · 认识 BMS · 建议 1 周<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.110;0.111;0.277;0.278;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="366" font-size="13" opacity="0">阶段 2 · 保护板实践 · 建议 2–4 周<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.277;0.278;0.443;0.444;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="366" font-size="13" opacity="0">阶段 3 · AFE + MCU · 建议 1–2 月<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.443;0.444;0.610;0.611;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="366" font-size="13" opacity="0">阶段 4 · SOC·SOH 算法 · 建议 1–3 月<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.610;0.611;0.777;0.778;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="366" font-size="13" opacity="0">阶段 5 · 通信与集成 · 建议 2–4 周<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.777;0.778;0.943;0.944;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="366" font-size="13" opacity="0">阶段 6 · 精通与毕业 · 建议持续<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.943;0.944;1" dur="12s" repeatCount="indefinite" /></text><rect x="0" y="0" width="800" height="330" rx="12" class="bg" />
<text x="30" y="66" font-size="12" class="small">七个阶段 · 业余每天 1–2 小时约 4–8 个月 · 节点下方为建议用时（光点巡游一圈 ≈ 全程缩影）</text>
