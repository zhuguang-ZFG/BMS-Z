<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 590" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>GB/T 27930 的四段骨架示意：BMS 发需求，充电机跟随；超时必须停充。秒和安培都不是国标摘录。</title>
  <desc>蓝线是需求，绿线在示意超时点落到 0，红线停在最后一档继续灌。金点沿需求走。细则以现行国标文本为准。</desc>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; }
    .linek { stroke: #57606a; stroke-width: 2.2; fill: none; stroke-dasharray: 7 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .dotg { fill: #1a7f37; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .linek { stroke: #8b949e; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .dotg { fill: #3fb950; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
    }
  </style>
  <!-- formula: illustrative stages; Ibms 40 A then 10 A; charger lags 0.25 s; timeout at 3.2 s forces 0 -->
  <rect class="bg" width="800" height="590"/>
  <text class="title" x="24" y="32">车先说要多少，超时就停（示意，不是国标摘录）</text>
  <rect class="panel" x="24" y="44" width="752" height="124" rx="6"/>
  <text class="txt" x="40" y="68" opacity="0.28">① 辨识和参数<tspan class="small">　前两秒需求还是 0。先对暗号，再谈能力。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="92" opacity="0.28">② 充电循环<tspan class="small">　需求从 BMS 发出。这里示意 40 A，稍后改成 10 A。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="116" opacity="0.28">③ 充电机跟随<tspan class="small">　晚 0.25 s。桩不想冲多快就多快。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="140" opacity="0.28">④ 超时<tspan class="small">　示意 3.2 s 起必须停。红线是错的：还在灌。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="180" width="752" height="268" rx="6"/>
  <text class="small" x="40" y="202">电流 A（示意）</text>
  <text class="hi" x="180" y="218">蓝 BMS 需求</text>
  <text class="ok" x="340" y="218">绿 超时就停</text>
  <text class="warn" x="500" y="218">红 超时仍灌</text>
  <line class="axis" x1="108.0" y1="248.0" x2="108.0" y2="400.0"/>
  <line class="axis" x1="108.0" y1="400.0" x2="720.0" y2="400.0"/>
  <line class="grid" x1="244.0" y1="400.0" x2="244.0" y2="406.0"/>
  <text class="small" x="244.0" y="422.0" text-anchor="middle">辨识</text>
  <line class="grid" x1="380.0" y1="400.0" x2="380.0" y2="406.0"/>
  <text class="small" x="380.0" y="422.0" text-anchor="middle">充电</text>
  <line class="grid" x1="543.2" y1="400.0" x2="543.2" y2="406.0"/>
  <text class="small" x="543.2" y="422.0" text-anchor="middle">超时</text>
  <line class="grid" x1="652.0" y1="400.0" x2="652.0" y2="406.0"/>
  <text class="small" x="652.0" y="422.0" text-anchor="middle">结束</text>
  <line class="grid" x1="102.0" y1="400.0" x2="108.0" y2="400.0"/>
  <text class="small" x="98.0" y="404.0" text-anchor="end">0</text>
  <line class="grid" x1="102.0" y1="369.6" x2="108.0" y2="369.6"/>
  <text class="small" x="98.0" y="373.6" text-anchor="end">10</text>
  <line class="grid" x1="102.0" y1="278.4" x2="108.0" y2="278.4"/>
  <text class="small" x="98.0" y="282.4" text-anchor="end">40</text>
  <text class="small" x="720" y="444" text-anchor="end">示意阶段秒，不是报文周期</text>
