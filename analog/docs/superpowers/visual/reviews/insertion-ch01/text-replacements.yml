- id: ch01-thevenin-two-load
  source: docs/p1-02-ch1.md#1.4
  before: |-
    **算一笔**（12V 经 R1=R2=10k 分压）：

    - 开路电压 $V_{th}=12V\times\dfrac{10k}{10k+10k}=\mathbf{6V}$
    - 短路电流 $I_N=12V/10k=\mathbf{1.2mA}$（此时 R2 被短路）
    - 内阻 $R_{th}=6V/1.2mA=\mathbf{5k\Omega}$（= R1∥R2 两条路算得一致）

    **等效之后，带载误差一眼看出**：$V_{out}=V_{th}\cdot\dfrac{R_L}{R_{th}+R_L}$。
    $R_L=R_{th}$ 时**只剩一半**（3V）；$R_L=1M\Omega$ 时才 5.97V（差 0.5%）。
    **「带不带得动」永远只需比 $R_{th}$ 与 $R_L$ 两个数**。这就是 [0.3 分压器](p1-01-ch0.md#ch0)「带载就塌」
    与 [0.6 恒压源](p1-01-ch0.md#ch0)「内阻决定性格」的共同答案。
  after: |-
    **算一笔**（12V 经 R1=R2=10k 分压，结果见下图蓝框）：$V_{th}=12V\times\dfrac{10k}{10k+10k}=6V$，$I_N=12V/10k=1.2mA$（此时 R2 被短路），$R_{th}=6V/1.2mA=5k\Omega$——与 R1∥R2 两条路算得一致。

    **等效之后，带载误差只剩一次分压**：$V_{out}=V_{th}\cdot\dfrac{R_L}{R_{th}+R_L}$（下图绿框）。
    **「带不带得动」永远只需比 $R_{th}$ 与 $R_L$ 两个数**。这就是 [0.3 分压器](p1-01-ch0.md#ch0)「带载就塌」
    与 [0.6 恒压源](p1-01-ch0.md#ch0)「内阻决定性格」的共同答案。
  caption: 戴维南：把任何线性网络压成两个数。带不带得动，永远只需比内阻与负载两个数。但等效之前，先确认网络真的线性
  removed_prose_chars: 76
  relationship: replaces-text
- id: ch01-thevenin-two-load
  source: docs/p1-02-ch1.md#1.4
  before: |-
    戴维南等效还能"测"出来，不必算：量开路电压得 $V_{th}$，量短路电流得 $I_N$，$R_{th}=V_{th}/I_N$；短路电流不好直接测时，改用 [0.6](p1-01-ch0.md#ch0) 的两次带载法，接已知负载量电压跌落反推内阻。**等效的适用边界也要记牢**：它只对线性网络成立——含二极管、饱和运放的端口，$V_{th}$ 与 $R_{th}$ 随工作点漂移，"两个参数"装不下它；它也只描述端口外特性，网络内部的功耗分布与热设计，等效之后一概看不见。还有一个常被误会的点：$R_L=R_{th}$ 时负载拿到的是**最大功率**（6V/5kΩ 的源最多送出 $6^2/(4\times5\text{k})=1.8\,\text{mW}$），此时效率只有 50%——射频匹配追求这一条，电源设计反而要躲着它。

    用它解题的固定动作是三步：断开负载，把复杂网络压成 $V_{th}$ 与 $R_{th}$ 两个数，再把负载接回这个"两人电路"里算。它的价值不在炫技，在于**把"换一个负载"从重算整张网变成一次分压**。诺顿形式在并联支路多、电流源多的场合更顺手；两种形式随时互换（$V_{th}=I_NR_N$），用哪个取决于下一步运算是串还是并。
  after: |-
    戴维南等效还能"测"出来：短路电流不好直接测时，改用 [0.6](p1-01-ch0.md#ch0) 的两次带载法。**适用边界也要记牢**：它只描述端口外特性，网络内部的功耗分布与热设计，等效之后一概看不见。还有一个常被误会的点：$R_L=R_{th}$ 时负载拿到的是**最大功率**（6V/5kΩ 的源最多送出 $6^2/(4\times5\text{k})=1.8\,\text{mW}$），此时效率只有 50%——射频匹配追求这一条，电源设计反而要躲着它。

    它的价值不在炫技，在于**把"换一个负载"从重算整张网变成一次分压**。诺顿形式在并联支路多、电流源多的场合更顺手；两种形式随时互换（$V_{th}=I_NR_N$），用哪个取决于下一步运算是串还是并。
  caption: 戴维南：把任何线性网络压成两个数。带不带得动，永远只需比内阻与负载两个数。但等效之前，先确认网络真的线性
  removed_prose_chars: 192
  relationship: replaces-text
