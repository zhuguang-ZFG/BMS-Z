<text x="60" y="290" font-size="11.5" font-weight="bold" fill="#a4630f">补偿电容只能靠</text>
<text x="60" y="310" font-size="11.5" font-weight="bold" fill="#a4630f">恒定电流充电</text>
<text x="60" y="338" font-size="11" fill="#5b666f">→ 电流恒定 ⇒ 斜率恒定</text>
<text x="60" y="358" font-size="11" fill="#5b666f">→ 爬坡段是直线</text>
<text x="60" y="386" font-size="11.5" font-weight="bold" fill="#a8321f">不是指数曲线！</text>
