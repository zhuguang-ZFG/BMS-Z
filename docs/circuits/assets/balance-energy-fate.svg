    <animate calcMode="spline" keySplines="0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.16 1 0.3 1" attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.48;0.9;1" dur="8s" repeatCount="indefinite" />
  </circle>

