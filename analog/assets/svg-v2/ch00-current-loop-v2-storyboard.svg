[stroke="#a8321f"]{stroke:#c07a63}
text[fill="#a4630f"]{fill:#dcab63}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#a4630f"]{fill:#553a17}
[stroke="#a4630f"]{stroke:#c08a45}
text[fill="#6b3f63"]{fill:#c4a2bf}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#6b3f63"]{fill:#452c40}
[stroke="#6b3f63"]{stroke:#a17c9b}
}
</style>

<text x="600" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#16202b">同一股电流，分配两份电压·分镜</text>
<text x="600" y="56" text-anchor="middle" font-size="12" fill="#5b666f">约定电流方向示意；运动速度为教学慢放，不表示电子漂移速度</text>
<rect x="20" y="70" width="570" height="300" rx="10" fill="#fdf8ea" stroke="#c9bb9d" stroke-width="1.2"/>
<g data-storyboard-beat="闭合回路" transform="translate(134 84) scale(0.2844)"><line x1="180" y1="280" x2="300" y2="280" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="300" y1="280" x2="330" y2="280" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="480" y1="280" x2="510" y2="280" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><rect x="330" y="253" width="150" height="54" fill="#e2d9cf" stroke="#2a2927" stroke-width="4"/><text x="405" y="235" font-size="32" fill="#2a2927" text-anchor="middle">1kΩ</text><line x1="510" y1="280" x2="690" y2="280" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="690" y1="280" x2="720" y2="280" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="870" y1="280" x2="900" y2="280" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><rect x="720" y="253" width="150" height="54" fill="#e2d9cf" stroke="#2a2927" stroke-width="4"/><text x="795" y="235" font-size="32" fill="#2a2927" text-anchor="middle">4kΩ</text><line x1="900" y1="280" x2="1020" y2="280" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="1020" y1="280" x2="1020" y2="600" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="1020" y1="600" x2="180" y2="600" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="180" y1="600" x2="180" y2="460" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="180" y1="280" x2="180" y2="360" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="145" y1="360" x2="215" y2="360" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="160" y1="390" x2="200" y2="390" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="180" y1="390" x2="180" y2="460" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><text x="90" y="425" font-size="32" fill="#2a2927" text-anchor="start">5V</text><text x="220" y="380" font-size="32" fill="#2a2927" text-anchor="start">+</text>
<path d="M180 600 L180 280 L1020 280 L1020 600 L180 600" pathLength="1" fill="none" stroke="#a4441d" stroke-width="7"/></g>
<text x="32" y="348" font-size="12" font-weight="bold" fill="#1f5d7a">1. 闭合回路</text>
<rect x="610" y="70" width="570" height="300" rx="10" fill="#fdf8ea" stroke="#c9bb9d" stroke-width="1.2"/>
<g data-storyboard-beat="同一股电流" transform="translate(724 84) scale(0.2844)"><line x1="180" y1="280" x2="300" y2="280" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="300" y1="280" x2="330" y2="280" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="480" y1="280" x2="510" y2="280" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><rect x="330" y="253" width="150" height="54" fill="#e2d9cf" stroke="#2a2927" stroke-width="4"/><text x="405" y="235" font-size="32" fill="#2a2927" text-anchor="middle">1kΩ</text><line x1="510" y1="280" x2="690" y2="280" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="690" y1="280" x2="720" y2="280" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="870" y1="280" x2="900" y2="280" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><rect x="720" y="253" width="150" height="54" fill="#e2d9cf" stroke="#2a2927" stroke-width="4"/><text x="795" y="235" font-size="32" fill="#2a2927" text-anchor="middle">4kΩ</text><line x1="900" y1="280" x2="1020" y2="280" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="1020" y1="280" x2="1020" y2="600" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="1020" y1="600" x2="180" y2="600" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="180" y1="600" x2="180" y2="460" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="180" y1="280" x2="180" y2="360" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="145" y1="360" x2="215" y2="360" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="160" y1="390" x2="200" y2="390" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="180" y1="390" x2="180" y2="460" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><text x="90" y="425" font-size="32" fill="#2a2927" text-anchor="start">5V</text><text x="220" y="380" font-size="32" fill="#2a2927" text-anchor="start">+</text>
<g transform="translate(0 -4)"><text x="380" y="470" font-size="46" fill="#2a2927" text-anchor="start">I = 1mA</text></g></g>
<text x="622" y="348" font-size="12" font-weight="bold" fill="#1f5d7a">2. 同一股电流</text>
<rect x="20" y="388" width="570" height="300" rx="10" fill="#fdf8ea" stroke="#c9bb9d" stroke-width="1.2"/>
<g data-storyboard-beat="分配电压" transform="translate(134 402) scale(0.2844)"><line x1="180" y1="280" x2="300" y2="280" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="300" y1="280" x2="330" y2="280" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="480" y1="280" x2="510" y2="280" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><rect x="330" y="253" width="150" height="54" fill="#e2d9cf" stroke="#2a2927" stroke-width="4"/><text x="405" y="235" font-size="32" fill="#2a2927" text-anchor="middle">1kΩ</text><line x1="510" y1="280" x2="690" y2="280" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="690" y1="280" x2="720" y2="280" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="870" y1="280" x2="900" y2="280" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><rect x="720" y="253" width="150" height="54" fill="#e2d9cf" stroke="#2a2927" stroke-width="4"/><text x="795" y="235" font-size="32" fill="#2a2927" text-anchor="middle">4kΩ</text><line x1="900" y1="280" x2="1020" y2="280" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="1020" y1="280" x2="1020" y2="600" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="1020" y1="600" x2="180" y2="600" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="180" y1="600" x2="180" y2="460" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="180" y1="280" x2="180" y2="360" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="145" y1="360" x2="215" y2="360" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="160" y1="390" x2="200" y2="390" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="180" y1="390" x2="180" y2="460" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><text x="90" y="425" font-size="32" fill="#2a2927" text-anchor="start">5V</text><text x="220" y="380" font-size="32" fill="#2a2927" text-anchor="start">+</text>
<g transform="translate(0 -4)"><text x="350" y="370" font-size="32" fill="#2a2927" text-anchor="start">1V</text><text x="750" y="370" font-size="32" fill="#2a2927" text-anchor="start">4V</text><rect x="300" y="200" width="600" height="190" rx="8" fill="none" stroke="#a4441d" stroke-width="5"/></g></g>
<text x="32" y="666" font-size="12" font-weight="bold" fill="#1f5d7a">3. 分配电压</text>
<rect x="610" y="388" width="570" height="300" rx="10" fill="#fdf8ea" stroke="#c9bb9d" stroke-width="1.2"/>
<g data-storyboard-beat="回路守恒" transform="translate(724 402) scale(0.2844)"><line x1="180" y1="280" x2="300" y2="280" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="300" y1="280" x2="330" y2="280" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="480" y1="280" x2="510" y2="280" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><rect x="330" y="253" width="150" height="54" fill="#e2d9cf" stroke="#2a2927" stroke-width="4"/><text x="405" y="235" font-size="32" fill="#2a2927" text-anchor="middle">1kΩ</text><line x1="510" y1="280" x2="690" y2="280" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="690" y1="280" x2="720" y2="280" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="870" y1="280" x2="900" y2="280" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><rect x="720" y="253" width="150" height="54" fill="#e2d9cf" stroke="#2a2927" stroke-width="4"/><text x="795" y="235" font-size="32" fill="#2a2927" text-anchor="middle">4kΩ</text><line x1="900" y1="280" x2="1020" y2="280" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="1020" y1="280" x2="1020" y2="600" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="1020" y1="600" x2="180" y2="600" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="180" y1="600" x2="180" y2="460" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="180" y1="280" x2="180" y2="360" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="145" y1="360" x2="215" y2="360" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="160" y1="390" x2="200" y2="390" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="180" y1="390" x2="180" y2="460" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><text x="90" y="425" font-size="32" fill="#2a2927" text-anchor="start">5V</text><text x="220" y="380" font-size="32" fill="#2a2927" text-anchor="start">+</text>
<g transform="translate(0 -4)"><text x="310" y="720" font-size="44" fill="#2a2927" text-anchor="start">1V + 4V = 5V</text><text x="310" y="785" font-size="36" fill="#2a2927" text-anchor="start">每一处电流都是 1mA</text></g></g>
<text x="622" y="666" font-size="12" font-weight="bold" fill="#1f5d7a">4. 回路守恒</text>
<text x="24" y="718" font-size="22" fill="#16202b">1. 先找闭合路径：电源、两只电阻、回到电源。</text>
<text x="24" y="748" font-size="22" fill="#16202b">2. I = 5V / (1kΩ + 4kΩ) = 1mA。</text>
<text x="24" y="778" font-size="22" fill="#16202b">3. 同一股 1mA 电流：1kΩ 留下 1V，4kΩ 留下 4V。</text>
<text x="24" y="808" font-size="22" fill="#16202b">4. 回路闭合，电流相同；两段压降相加等于 5V。</text>
</svg>
