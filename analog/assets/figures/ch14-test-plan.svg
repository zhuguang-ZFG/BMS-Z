<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">测试计划的四层筛子与五要素</title>
<desc id="figDesc">左侧四层测试从便宜到贵：电源与静态、功能、精度、环境与 EMC，并给出每层的仪器与要排除的问题。右侧说明一条测试要写清目的、条件、仪器、判据、失败动作，并串联首件、小批、量产三个阶段。结论是测试顺序应等于风险顺序，判据要留保护带。</desc>
<rect width="960" height="640" fill="#fffdf8"/>
<text x="36" y="46" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="28" font-weight="700" fill="#14213d">测试计划：四层筛子，从“能亮”到“能活”</text>
<text x="36" y="76" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="16" fill="#52606d">从便宜到贵排，上一层不过，下一层不必跑；每条测试都要有判据和失败动作。</text>
<line x1="36" y1="94" x2="924" y2="94" stroke="#14213d" stroke-width="2"/>

<text x="54" y="140" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="15" font-weight="700" fill="#14213d">① 四层筛子：越往下越贵，也越接近现场</text>

<g id="layer-power">
  <rect x="36" y="156" width="540" height="78" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
  <circle cx="80" cy="195" r="22" fill="#14213d"/>
  <text x="80" y="202" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
  <text x="118" y="188" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="17" font-weight="700" fill="#14213d">电源与静态</text>
  <text x="556" y="188" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12" text-anchor="end" fill="#14213d">DMM · 电子负载 · 热像仪</text>
  <text x="118" y="214" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="13" fill="#52606d">先排除短路、错件、虚焊，再谈功能</text>
</g>

<g id="layer-function">
  <rect x="36" y="246" width="540" height="78" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
  <circle cx="80" cy="285" r="22" fill="#0f766e"/>
  <text x="80" y="292" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
  <text x="118" y="278" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="17" font-weight="700" fill="#14213d">功能</text>
  <text x="556" y="278" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12" text-anchor="end" fill="#0f766e">源表 · 标准电阻箱</text>
  <text x="118" y="304" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="13" fill="#52606d">激励、增益、ADC 码、通信、复位都要动</text>
</g>

<g id="layer-accuracy">
  <rect x="36" y="336" width="540" height="78" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
  <circle cx="80" cy="375" r="22" fill="#b45309"/>
  <text x="80" y="382" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
  <text x="118" y="368" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="17" font-weight="700" fill="#14213d">精度</text>
  <text x="556" y="368" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12" text-anchor="end" fill="#b45309">6½ 位 DMM · 干体炉 · 温箱</text>
  <text x="118" y="394" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="13" fill="#52606d">零点、满量程、线性、噪声、温漂</text>
</g>

<g id="layer-env">
  <rect x="36" y="426" width="540" height="78" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
  <circle cx="80" cy="465" r="22" fill="#b42318"/>
  <text x="80" y="472" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
  <text x="118" y="458" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="17" font-weight="700" fill="#14213d">环境 / EMC</text>
  <text x="556" y="458" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12" text-anchor="end" fill="#b42318">ESD 枪 · 浪涌发生器</text>
  <text x="118" y="484" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="13" fill="#52606d">ESD、浪涌、EFT、温循、湿度</text>
</g>

<g id="panel-five">
  <rect x="596" y="116" width="328" height="388" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
  <text x="614" y="144" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="16" font-weight="700" fill="#14213d">② 一条测试写清五件事</text>

  <circle cx="620" cy="174" r="9" fill="#fdf3e3"/>
  <text x="620" y="178" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#b45309">1</text>
  <text x="638" y="179" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="13.5" fill="#14213d">目的：回答哪条指标</text>

  <circle cx="620" cy="212" r="9" fill="#fdf3e3"/>
  <text x="620" y="216" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#b45309">2</text>
  <text x="638" y="217" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="13.5" fill="#14213d">条件：温度、负载、输入</text>

  <circle cx="620" cy="250" r="9" fill="#fdf3e3"/>
  <text x="620" y="254" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#b45309">3</text>
  <text x="638" y="255" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="13.5" fill="#14213d">仪器：量程、精度、带宽</text>

  <circle cx="620" cy="288" r="9" fill="#fdf3e3"/>
  <text x="620" y="292" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#b45309">4</text>
  <text x="638" y="293" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="13.5" fill="#14213d">判据：数字 + 容差 + 时间</text>

  <circle cx="620" cy="326" r="9" fill="#fdf3e3"/>
  <text x="620" y="330" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#b45309">5</text>
  <text x="638" y="331" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="13.5" fill="#14213d">失败动作：先查哪、换什么</text>

  <line x1="614" y1="352" x2="906" y2="352" stroke="#d0d5dd" stroke-width="1.2"/>
  <text x="614" y="378" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="15" font-weight="700" fill="#14213d">③ 首件 → 小批 → 量产</text>

  <text x="614" y="404" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12.5" fill="#14213d">首件：全测，暴露设计问题</text>
  <text x="614" y="432" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12.5" fill="#14213d">小批 50~100 块：统计均值与 σ</text>
  <text x="614" y="460" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12.5" fill="#14213d">量产：抽检 + 校准，守住分布</text>
  <text x="614" y="488" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12" fill="#b45309">允许首件失败，不允许量产靠猜。</text>
</g>

<g id="takeaway">
  <rect x="36" y="520" width="888" height="96" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
  <rect x="36" y="520" width="6" height="96" fill="#14213d"/>
  <text x="60" y="550" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="16" font-weight="700" fill="#14213d">测试顺序 = 风险顺序。</text>
  <text x="60" y="575" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="15" fill="#b45309">哪条指标最可能先坏，就先测它、先留余量、先写失败动作。</text>
  <text x="60" y="599" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="15" fill="#0f766e">判据留保护带：测试限比设计规格紧一档，别在悬崖边宣布通过。</text>
</g>
</svg>
