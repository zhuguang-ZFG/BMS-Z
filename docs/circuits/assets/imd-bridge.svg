<svg xmlns="http://www.w3.org/2000/svg" width="800" height="690" viewBox="0 -156 800 690" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>绝缘检测电桥法动画</title>
  <desc>黄点沿正极到机壳的绝缘支路移动。示例包电压 400 V，单侧掉到 100 kΩ 时，400/100000 = 4 mA。电压和电阻都是画面上的示例。示意。</desc>
  <style>
