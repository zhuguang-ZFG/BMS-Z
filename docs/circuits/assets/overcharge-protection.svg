  <line x1="660" y1="190" x2="740" y2="190" stroke-width="3" class="stroke-axis" />
  <text x="745" y="185" font-size="13" font-weight="bold" class="txt">充电器</text>
  
  <g>
    <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.42;0.44;0.70;0.72;1" dur="8s" repeatCount="indefinite" />
    <line x1="580" y1="190" x2="660" y2="190" stroke-width="4" class="stroke-b" />
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.42;0.44;0.70;0.72;1" dur="8s" repeatCount="indefinite" />
    <line x1="580" y1="190" x2="652" y2="162" stroke-width="4" stroke-linecap="round" class="stroke-b" />
