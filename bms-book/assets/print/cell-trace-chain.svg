</style><rect class="bg" x="0" y="-156" width="800" height="640"/><text class="title" x="24" y="-128" opacity="1" style="opacity: 1;">示意图：包序列号要能走回电芯档，对不上就不要出厂</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6"/><text class="txt" x="40" y="-88" opacity="1" style="opacity: 1;">① 示意图：包序列号要能走回电芯档，对不上就不要出厂</text><text class="txt" x="40" y="-66" opacity="1" style="opacity: 1;">② 分容 / K 值</text><text class="txt" x="40" y="-44" opacity="1" style="opacity: 1;">③ 错芯 / 贴错标</text><text class="txt" x="40" y="-22" opacity="1" style="opacity: 1;">④ 循环里亮着的那一步对应当前画面。数字标示意。</text><rect class="panel" x="24" y="428" width="752" height="44" rx="6"/><text class="small" x="40" y="456">示意图。0.0239 mV/h 只属于那条中试线。</text><rect width="800" height="420" class="bg"/>
