<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">焊点接触电阻的慢爬：热循环把 mΩ 拉成 Ω，通断档在漂移窗口里全程照响</title>
<desc id="figDesc">横轴为热循环次数，纵轴为接触电阻（对数示意，自下而上：mΩ 级健康带、几十 mΩ、Ω 级，顶端红色虚线为开路）。深青曲线从新焊的 mΩ 级几乎平躺，经裂纹萌生、裂纹扩展缓慢抬头，进入时好时坏段后加速爬向 Ω 级，最终以红色虚线跳成开路。琥珀色阴影窗口从阻值开始漂移延伸到开路：窗口内阻值已漂但通断蜂鸣档仍响，是"只量通断会漏掉它"的盲区，要在晃动与变温中量阻值。箭头标注裂纹从角落长向中心。右侧两张便签卡：指针表连续摆动让慢漂一眼可见，数字表每秒刷新三四次把慢变化淹在跳字里；统计卡给出 200 焊点、单点不良率 0.5% 时整板至少一个坏点的概率 1 − 0.995^200 ≈ 63%，对策是减少焊点总数并把单点不良率再压一个量级。读法：先找曲线离开健康带的拐点，再看阴影窗口里两种表的表现差，最后用统计卡理解"焊工很好"与"批量返修"为何同时成立。</desc>
<rect width="960" height="600" fill="#fffdf8"/>

<defs>
<marker id="arrD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14213d"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b42318"/></marker>
</defs>

<text x="36" y="44" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="26" font-weight="700" fill="#14213d">焊点接触电阻的慢爬：mΩ 如何变成 Ω</text>
<text x="36" y="72" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="14" fill="#52606d">17.6：温度每变一次，膨胀系数拉扯焊点一次；裂纹从角落长向中心，阻值漂移先于开路。</text>
<line x1="36" y1="88" x2="924" y2="88" stroke="#14213d" stroke-width="2"/>

<rect x="90" y="120" width="550" height="320" fill="#ffffff"/>
<rect x="90" y="384" width="550" height="56" fill="#e6f6f2"/>
<line x1="90" y1="384" x2="640" y2="384" stroke="#52606d" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="90" y1="300" x2="640" y2="300" stroke="#52606d" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="90" y1="160" x2="640" y2="160" stroke="#b42318" stroke-width="1.5" stroke-dasharray="7 5"/>

<rect x="400" y="160" width="202" height="280" fill="#fdf3e3" opacity="0.65"/>
<line x1="400" y1="160" x2="400" y2="440" stroke="#b45309" stroke-width="1.4" stroke-dasharray="5 4"/>
<line x1="602" y1="160" x2="602" y2="440" stroke="#b45309" stroke-width="1.4" stroke-dasharray="5 4"/>

<line x1="90" y1="120" x2="90" y2="440" stroke="#14213d" stroke-width="2"/>
<line x1="90" y1="440" x2="640" y2="440" stroke="#14213d" stroke-width="2" marker-end="url(#arrD)"/>
<text transform="rotate(-90 40 280)" x="40" y="280" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="13" fill="#52606d">接触电阻（对数示意）</text>

<text x="98" y="150" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12" font-weight="700" fill="#b42318">开路：蜂鸣器沉默</text>
<text x="98" y="240" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12" fill="#52606d">Ω 级：时好时坏</text>
<text x="98" y="330" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12" fill="#52606d">几十 mΩ（面包板插孔起步）</text>
<text x="98" y="406" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12" font-weight="700" fill="#0f766e">mΩ 级·健康带</text>
<text x="98" y="426" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="10.5" fill="#0f766e">新焊：10 倍放大看润湿裙边</text>

<text x="412" y="184" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#b45309">只量通断会漏掉它</text>
<text x="412" y="204" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" fill="#52606d">阻值已漂，蜂鸣档仍响</text>
<text x="412" y="224" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" fill="#52606d">要在晃动与变温中量</text>

<text x="250" y="290" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12" font-weight="700" fill="#b45309">裂纹从角落长向中心</text>
<line x1="358" y1="296" x2="492" y2="344" stroke="#b45309" stroke-width="1.2" marker-end="url(#arrB)"/>

<path d="M100,416 C140,414 160,417 200,415 C240,413 270,412 300,410 C330,408 355,402 380,396 C405,390 430,384 450,378 C470,372 487,362 500,348 C518,329 536,310 550,292 C561,277 571,261 578,246 C583,236 587,230 590,226" fill="none" stroke="#14213d" stroke-width="3" stroke-linecap="round"/>
<path d="M590,226 C596,210 600,192 602,166" fill="none" stroke="#b42318" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrR)"/>
<text x="608" y="170" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12" font-weight="700" fill="#b42318">开路</text>

<line x1="140" y1="440" x2="140" y2="448" stroke="#52606d" stroke-width="1.4"/>
<line x1="280" y1="440" x2="280" y2="448" stroke="#52606d" stroke-width="1.4"/>
<line x1="430" y1="440" x2="430" y2="448" stroke="#52606d" stroke-width="1.4"/>
<line x1="545" y1="440" x2="545" y2="448" stroke="#52606d" stroke-width="1.4"/>
<line x1="602" y1="440" x2="602" y2="448" stroke="#52606d" stroke-width="1.4"/>
<text x="140" y="464" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" fill="#52606d">新焊</text>
<text x="280" y="464" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" fill="#52606d">裂纹萌生</text>
<text x="430" y="464" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" fill="#52606d">裂纹扩展</text>
<text x="545" y="464" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" fill="#52606d">时好时坏</text>
<text x="602" y="464" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" font-weight="700" fill="#b42318">开路</text>
<text x="365" y="492" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12" fill="#52606d">热循环次数（温度每变一次，膨胀系数拉扯一次）</text>

<g transform="rotate(-0.8 798 183)">
<rect x="672" y="120" width="252" height="126" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
<text x="688" y="144" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="14" font-weight="700" fill="#0f766e">指针表为什么还没淘汰</text>
<text x="688" y="168" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" fill="#14213d">指针：连续摆动，慢漂一眼可见</text>
<text x="688" y="190" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" fill="#52606d">数字表：每秒刷新三四次</text>
<text x="688" y="210" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" fill="#52606d">慢变化全淹在跳字里</text>
<text x="688" y="231" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" font-weight="700" fill="#0f766e">晃动试验：蜂鸣断续胜过盯屏</text>
</g>

<g transform="rotate(0.7 798 370)">
<rect x="672" y="272" width="252" height="196" rx="6" fill="#fdf3e3" stroke="#b45309" stroke-width="1.5"/>
<text x="688" y="296" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="14" font-weight="700" fill="#b45309">整板的乘法账</text>
<text x="688" y="320" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" fill="#52606d">200 焊点，单点不良率 0.5%</text>
<text x="688" y="342" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" fill="#52606d">整板至少一个坏点：</text>
<text x="688" y="372" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="18" font-weight="700" fill="#b42318">1 − 0.995^200 ≈ 63%</text>
<text x="688" y="398" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" fill="#52606d">"焊工很好"与"批量返修"</text>
<text x="688" y="418" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" fill="#52606d">可以同时成立</text>
<text x="688" y="442" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" font-weight="700" fill="#0f766e">对策：减少焊点总数；</text>
<text x="688" y="461" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" font-weight="700" fill="#0f766e">单点不良率再压一个量级</text>
</g>

<text x="36" y="566" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12.5" fill="#52606d">测量纪律：通断档只回答"断没断"，回答不了"漂没漂"——阻值漂移要在晃动与变温中量（17.6）。</text>
</svg>
