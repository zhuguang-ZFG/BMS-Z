<g filter="url(#pglow)"><circle r="3.6" fill="#a8321f"><animateMotion dur="16s" begin="-0.50s" repeatCount="indefinite" path="M36,130 L92,130" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle>
