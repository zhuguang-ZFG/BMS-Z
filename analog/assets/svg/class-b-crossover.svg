<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="ttl">
<title id="ttl">乙类推挽：两个人抬轿子，交接处摔了一跤（交越失真）</title>
<desc>乙类推挽：两个人抬轿子，交接处摔了一跤（交越失真）；节拍：① 正半周：NPN 导通往下「推」电流（绿粒子）；② 负半周：PNP 导通往上「拉」电流（红粒子）；③ 交接区 |输入|&lt;0.7V：两管全关→输出豁口——这就是交越失真；④ 甲乙类解法：基极间塞两只二极管预加微偏置——死区消失，功放标配</desc>
