<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 660" font-family="ui-monospace, Consolas, monospace">
  <title>EKF 与纯安时对照。曲线来自 code/soc/compare.py 的仿真输出，不是手绘折线。</title>
  <desc>真值、Thevenin+EKF 和纯安时积分来自 compare.run(seed=42)。图上标了全程 RMSE，黄点沿 EKF 移动并读出该时刻误差。仿真结果，不是电芯实测。</desc>
