  - id: ch08-threshold-loss-gap
    action: new
    priority: 2
    status: generated
    anchor: '8.1'
    insert_after_line: 77
    delete_lines: [[62, 65], [67, 67], [69, 69], [77, 77]]
    kind: figure
    type: V3
    layout_id: IG-015
    target_run: 7302
    split: {left: 941, right: 645}   # 实测替代 4 段 / 1146 字
    replace_text: >-
      替「单管传输的盲区有多大」（62–65）、「并联之后仍不是理想平线」（67）、「双向性的物理根源」（69）与「什么时候单管开关反而够用」（77）合计 1146 字（4 段），缩为 1–2 句导读：缺口深度恰等于 $V_{TH}$，体效应再加深一截；谁行谁上才是并联的理由。体效应公式与 3.5 V 那个数留在正文（可核对），图负责把 4 V／3.5 V／2.5 V 三道水位线画在同一根 $V_{IN}$ 轴上。
    keep_facts:
      - N 管传高电平最高只到 $V_{DD}-V_{TH}$：5 V 供电传 5 V 信号实际只到 4 V，缺口 1 V
      - 下游 CMOS 判决门限 $V_{DD}/2=2.5$ V：4 V 看着够用，轨到轨 ADC 不够用
      - 体效应把单管上限从 4 V 再退到 3.5 V 量级（$\gamma\approx0.4$、$2\phi_F\approx0.6$ V、4 V 信号时 $V_{SB}=4$ V 抬约 0.55 V）
      - 迁移率不等：电子约是空穴的 2~3 倍，不配比则中段鼓起一个包
      - $R_{ON}$ 温度系数 +0.3~0.5 %/°C，全温核算乘 1.3~1.5
      - 源漏结构对称 → 传输门天生双向（4051 可复用为 1 分 8 分配器）
      - 单管够用的岗位：I²C 电平转换那只分立 NMOS、音频静音用的分流开关
      - 「器件选型里没有必须，只有够不够」
    design: >-
      一根 0~5 V 的 $V_{IN}$ 横轴上画三道水位线：4 V（$V_{DD}-V_{TH}$，N 管顶到这里就停）、3.5 V（体效应再退的一截）、2.5 V（下游判决门限），右侧用阴影带标出 1 V 缺口并写明"下游是谁决定它要不要命"；下方两条小曲线（单 N 管 $R_{on}\to\infty$ 对互补并联包络 20→26.7→20 Ω）；右下角两张单管上岗卡（I²C 单向 NMOS、分流静音），共用一句判据「先问下游要多少」。
