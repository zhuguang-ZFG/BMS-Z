<svg data-sketch="1" xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 800 500" font-family="ui-monospace, Consolas, monospace" data-snapshot-time="9">
  <title>SEI 按平方根变厚，反复低温大电流充电的析锂当量则按圈往上堆。数字为示意。</title>
  <desc>亮点看两条线：SEI 膜按平方根慢慢变厚，反复低温大电流充电的析锂当量按圈往上堆，约 240 圈越过界线。</desc>

