<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="dn-t dn-d">
  <title id="dn-t">账本除以一个也在动的分母</title>
  <desc id="dn-d">安时积分只累加电流与时间，得到分子；满充容量是分母，由上一次标定给出，老化时它自己在缩。同一笔安时除以更小的分母，读出的荷电就更高，而积分既看不见分母在缩，也不会自己把读数降回来。</desc>
  <defs>
    <marker id="arrow-accent" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path class="head-accent" d="M0 0L9 4.5L0 9Z"/>
    </marker>
    <marker id="arrow-gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path class="head-gold" d="M0 0L9 4.5L0 9Z"/>
    </marker>
    <style>
      text { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #293b3a; }
      .title { font-size: 20px; font-weight: 700; fill: #293b3a; }
      .sub { font-size: 12px; fill: #626d65; }
      .h { font-size: 15px; font-weight: 700; fill: #293b3a; }
      .body { font-size: 13px; fill: #293b3a; }
      .small { font-size: 12px; fill: #626d65; }
      .tiny { font-size: 12px; fill: #626d65; }
      .accent { fill: #176b73; }
      .green { fill: #377b60; }
      .red { fill: #b84745; }
      .gold { fill: #926717; }
      .paper { fill: #fffdf5; }
      .card { fill: #fffdf5; stroke: #968d77; stroke-width: 1.4; }
      .gate { fill: #fffdf5; stroke: #968d77; stroke-width: 1.6; }
      .gate-sign { font-size: 26px; font-weight: 700; fill: #626d65; }
      .bucket { fill: none; stroke: #293b3a; stroke-width: 2; }
      .water { fill: #e4f0df; stroke: none; }
      .level { stroke: #176b73; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; }
      .flow { stroke: #176b73; stroke-width: 2; fill: none; }
      .leader { stroke: #968d77; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
      .strike { stroke: #176b73; stroke-width: 2; fill: none; }
      .strip { fill: #e4f0df; stroke: #377b60; stroke-width: 1.4; }
      .head-accent { fill: #176b73; }
      .head-gold { fill: #926717; }
      @media (prefers-color-scheme: dark) {
        text { fill: #edf0e5; }
        .title { fill: #edf0e5; }
        .sub { fill: #b0beb3; }
        .h { fill: #edf0e5; }
        .body { fill: #edf0e5; }
        .small { fill: #b0beb3; }
        .tiny { fill: #b0beb3; }
        .accent { fill: #7ec5c5; }
        .green { fill: #8fc7a2; }
        .red { fill: #f39b91; }
        .gold { fill: #dfbd78; }
        .paper { fill: #223333; }
        .card { fill: #223333; stroke: #71908c; }
        .gate { fill: #223333; stroke: #71908c; }
        .gate-sign { fill: #b0beb3; }
        .bucket { stroke: #edf0e5; }
        .water { fill: #293f35; }
        .level { stroke: #7ec5c5; }
        .flow { stroke: #7ec5c5; }
        .leader { stroke: #b0beb3; }
        .strike { stroke: #7ec5c5; }
        .strip { fill: #293f35; stroke: #8fc7a2; }
        .head-accent { fill: #7ec5c5; }
        .head-gold { fill: #dfbd78; }
      }
    </style>
  </defs>

  <rect class="paper" x="0" y="0" width="960" height="560"/>

  <text x="480" y="32" text-anchor="middle" class="title">账本除以一个也在动的分母</text>
  <path d="M354 42C420 40 470 44 540 41" class="strike" opacity=".5"/>
  <text x="480" y="62" text-anchor="middle" class="sub">积分只记分子；分母缩了，它不会知道</text>

  <rect class="card" x="40" y="96" width="210" height="140" rx="9" transform="rotate(-0.5 145 166)"/>
  <text x="145" y="126" text-anchor="middle" class="h">安时账本</text>
  <text x="145" y="152" text-anchor="middle" class="body">只累加电流与时间</text>
  <text x="145" y="176" text-anchor="middle" class="small">对错全看电流</text>
  <text x="145" y="210" text-anchor="middle" class="body accent">这就是分子</text>

  <path class="flow" d="M254 166H296" marker-end="url(#arrow-accent)"/>

  <circle cx="330" cy="166" r="28" class="gate"/>
  <text x="330" y="177" text-anchor="middle" class="gate-sign">÷</text>

  <rect class="card" x="246" y="286" width="180" height="100" rx="9" transform="rotate(0.5 336 336)"/>
  <text x="336" y="316" text-anchor="middle" class="h">满充容量</text>
  <text x="336" y="342" text-anchor="middle" class="small">这就是分母</text>
  <text x="336" y="366" text-anchor="middle" class="small">老化让它缩</text>

  <path class="leader" d="M330 282V202" marker-end="url(#arrow-gold)"/>
  <text x="344" y="252" class="tiny gold">分母在动</text>

  <path class="flow" d="M360 166H508" marker-end="url(#arrow-accent)"/>

  <path class="bucket" d="M520 132L690 132L676 272L534 272Z"/>
  <path class="water" d="M524 206L687 206L676 269L535 269Z"/>
  <path class="level" d="M524 206H687"/>

  <path class="bucket" d="M760 132L890 132L880 272L770 272Z"/>
  <path class="water" d="M764 178L887 178L880 269L771 269Z"/>
  <path class="level" d="M764 178H887"/>

  <text x="605" y="120" text-anchor="middle" class="small">新电池的桶</text>
  <text x="825" y="120" text-anchor="middle" class="small">老化后的桶</text>
  <text x="605" y="294" text-anchor="middle" class="small accent">水面＝读数</text>
  <text x="825" y="294" text-anchor="middle" class="small accent">水面更高</text>

  <path class="leader" d="M698 148C716 132 738 132 756 148" marker-end="url(#arrow-accent)"/>
  <text x="727" y="120" text-anchor="middle" class="tiny gold">老化</text>

  <text x="480" y="320" text-anchor="middle" class="small accent">两个独立的账，谁也纠不了谁</text>

  <rect class="card" x="60" y="330" width="270" height="82" rx="9"/>
  <text x="195" y="360" text-anchor="middle" class="h green">分子</text>
  <text x="195" y="388" text-anchor="middle" class="body">积分一直在加</text>

  <rect class="card" x="345" y="330" width="270" height="82" rx="9"/>
  <text x="480" y="360" text-anchor="middle" class="h gold">分母</text>
  <text x="480" y="388" text-anchor="middle" class="body">只在标定时才改</text>

  <rect class="card" x="630" y="330" width="270" height="82" rx="9"/>
  <text x="765" y="360" text-anchor="middle" class="h red">除出来的读数</text>
  <text x="765" y="388" text-anchor="middle" class="body">两边各错各的</text>

  <rect class="strip" x="80" y="432" width="800" height="46" rx="12"/>
  <text x="480" y="461" text-anchor="middle" class="h green">分子在走，分母在缩；除错了不会自己回来</text>

  <text x="480" y="514" text-anchor="middle" class="tiny">示意：满充容量来自上一次标定，不是积分自己测出来的</text>
</svg>
