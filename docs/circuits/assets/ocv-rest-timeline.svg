<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" font-family="ui-monospace, Consolas, monospace" font-size="13">
  <title>卸流后的电压回弹：立刻回弹、慢慢松弛，充放电方向的滞回仍在</title>
  <desc>教学示意：带载放电时为 3.450 V，撤流瞬间回弹 40 mV 到 3.490 V。卸流后 t 以分钟计，V(t) = 3.620 − 0.130 × exp(−t/3) V；3 min 约为 3.572 V，10 min 约为 3.615 V，逐渐趋近放电支极限 3.620 V。τ = 3 min 不代表已经完全平衡。同一 SOC 的充电支 3.660 V 仅供对照，与放电支极限相差 40 mV，不是本次静置会充电到达的终点。全曲线始终可见，金点沿时间轴运动，金色底线指示当前阶段；12 秒循环，最后 3 秒停留。数字和时间为教学示意，实际静置判据须按电芯、温度与测量精度测定。</desc>

  <style>
    .bg { fill: #fffdf5; }
    .panel { fill: #f7f2e5; stroke: #cfc6b2; }
    .axis { stroke: #626d65; stroke-width: 1.5; fill: none; }
    .grid { stroke: #cfc6b2; stroke-width: 1; fill: none; }
    .txt { fill: #293b3a; font-size: 13px; }
    .small { fill: #626d65; font-size: 13px; }
    .title { fill: #293b3a; font-size: 18px; font-weight: bold; }
    .heading { font-size: 20px; }
    .metric { font-size: 24px; font-weight: bold; }
    .value { font-size: 22px; font-weight: bold; }
    .hi { fill: #176b73; }
    .warn { fill: #ad4644; }
    .ok { fill: #36775e; }
    .gold { fill: #926717; }
    .lineb { stroke: #176b73; stroke-width: 2.5; fill: none; }
    .liner { stroke: #b84745; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #377b60; stroke-width: 2.5; fill: none; }
    .liney { stroke: #926717; stroke-width: 2.5; fill: none; }
    .dotb { fill: #176b73; }
    .dotr { fill: #b84745; }
    .dotg { fill: #377b60; }
    .doty { fill: #926717; }
    .boxb { fill: #e4f0df; stroke: #176b73; }
    .boxr { fill: #f6e2df; stroke: #b84745; }
    .boxg { fill: #e4f0df; stroke: #377b60; }
    .boxy { fill: #fbefc7; stroke: #926717; }
    .reference { stroke-width: 1.5; stroke-dasharray: 6 5; }
    .cursor { stroke: #fffdf5; stroke-width: 2; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #192727; }
      .panel { fill: #223333; stroke: #496160; }
      .axis { stroke: #b0beb3; }
      .grid { stroke: #496160; }
      .txt { fill: #edf0e5; }
      .small { fill: #b0beb3; }
      .title { fill: #edf0e5; }
      .hi { fill: #7ec5c5; }
      .warn { fill: #f39b91; }
      .ok { fill: #8fc7a2; }
      .gold { fill: #dfbd78; }
      .lineb { stroke: #7ec5c5; }
      .liner { stroke: #f39b91; }
      .lineg { stroke: #8fc7a2; }
      .liney { stroke: #dfbd78; }
      .dotb { fill: #7ec5c5; }
      .dotr { fill: #f39b91; }
      .dotg { fill: #8fc7a2; }
      .doty { fill: #dfbd78; }
      .boxb { fill: #293f35; stroke: #7ec5c5; }
      .boxr { fill: #483336; stroke: #f39b91; }
      .boxg { fill: #293f35; stroke: #8fc7a2; }
      .boxy { fill: #453e2b; stroke: #dfbd78; }
      .cursor { stroke: #192727; }
    }
  </style>

  <rect class="bg" width="800" height="540"/>
  <text class="title heading" x="24" y="32">撤掉电流，电压为什么还在变？</text>
  <text class="small" x="776" y="31" text-anchor="end">放电后静置 · 教学示意</text>

  <!-- Only the stage underlines animate; every explanation remains legible. -->
  <g id="stage-rebound">
    <rect class="boxb" x="24" y="52" width="240" height="98" rx="8"/>
    <text class="title hi" x="40" y="79">01 立刻回弹</text>
    <text class="metric hi" x="40" y="109">+40 mV</text>
    <text class="txt" x="40" y="132">电流归零 → 欧姆压降消失</text>
    <rect id="active-rebound" class="doty" x="40" y="143" width="208" height="3" rx="1.5" opacity="0">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.125;0.145;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" dur="12s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g id="stage-relaxation">
    <rect class="boxg" x="276" y="52" width="240" height="98" rx="8"/>
    <text class="title ok" x="292" y="79">02 慢慢松弛</text>
    <text class="metric ok" x="292" y="109">τ = 3 min</text>
    <text class="txt" x="292" y="132">极化渐退 ≠ 已经完全平衡</text>
    <rect id="active-relaxation" class="doty" x="292" y="143" width="208" height="3" rx="1.5" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.125;0.145;0.73;0.75;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" dur="12s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g id="stage-hysteresis">
    <rect class="boxr" x="528" y="52" width="248" height="98" rx="8"/>
    <text class="title warn" x="544" y="79">03 滞回仍在</text>
    <text class="metric warn" x="544" y="109">40 mV</text>
    <text class="txt" x="544" y="132">同一 SOC，充放电支仍有差</text>
    <rect id="active-hysteresis" class="doty" x="544" y="143" width="216" height="3" rx="1.5" opacity="1">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.73;0.75;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" dur="12s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect class="panel" x="24" y="166" width="752" height="312" rx="8"/>
  <text class="small" x="40" y="188">电压 / V</text>
  <text class="gold" x="758" y="188" text-anchor="end">金点 / 底线 = 当前进度</text>
  <path class="axis" d="M86 212 V430 H718 M712 426 L718 430 L712 434"/>
  <path class="axis" d="M81 229 H86 M81 274 H86 M81 319 H86 M81 364 H86 M81 409 H86 M214 430 V435 M349 430 V435 M484 430 V435 M664 430 V435"/>
  <g class="small" text-anchor="end">
    <text x="77" y="234">3.65</text>
    <text x="77" y="279">3.60</text>
    <text x="77" y="324">3.55</text>
    <text x="77" y="369">3.50</text>
    <text x="77" y="414">3.45</text>
  </g>
  <g class="small" text-anchor="middle">
    <text x="132" y="450">带载</text>
    <text x="214" y="450">0 · 卸流</text>
    <text x="349" y="450">3</text>
    <text x="484" y="450">6</text>
    <text x="664" y="450">10</text>
  </g>
  <text class="small" x="758" y="468" text-anchor="end">静置时间 / min</text>

  <!-- The red branch is a comparison at the same SOC, not a destination. -->
  <path id="charge-reference" class="liner reference" d="M214 220 H706"/>
  <text class="warn" x="214" y="210">同 SOC 充电支</text>
  <text class="value warn" x="328" y="210">3.660 V</text>
  <text class="warn" x="450" y="210">仅对照，非本次静置终点</text>
  <path id="discharge-limit" class="lineg reference" d="M214 256 H706"/>
  <text class="ok" x="356" y="247">放电支极限</text>
  <text class="value ok" x="442" y="247">3.620 V</text>
  <path id="hysteresis-gap" class="liner" d="M706 220 H718 M712 220 V256 M706 256 H718"/>
  <text class="warn" x="724" y="243">40 mV</text>

  <!-- Data coordinates: x = 214 + 45*t; y = 256 + 117*exp(-t/3).
       t is minutes after unloading; 900 px/V. Samples every 0.25 min.
       The complete trace is static: no dash reveal or hidden final segment. -->
  <path id="load-and-rebound" class="lineb" d="M100 409 H214 V373" stroke-linejoin="round" stroke-linecap="round"/>
  <path id="relaxation-curve" class="lineg" d="M214.000 373.000 L225.250 363.645 L236.500 355.038 L247.750 347.120 L259.000 339.834 L270.250 333.131 L281.500 326.964 L292.750 321.290 L304.000 316.070 L315.250 311.267 L326.500 306.848 L337.750 302.782 L349.000 299.042 L360.250 295.600 L371.500 292.434 L382.750 289.521 L394.000 286.841 L405.250 284.375 L416.500 282.106 L427.750 280.019 L439.000 278.098 L450.250 276.332 L461.500 274.706 L472.750 273.210 L484.000 271.834 L495.250 270.568 L506.500 269.403 L517.750 268.332 L529.000 267.346 L540.250 266.439 L551.500 265.604 L562.750 264.836 L574.000 264.130 L585.250 263.480 L596.500 262.882 L607.750 262.331 L619.000 261.825 L630.250 261.359 L641.500 260.931 L652.750 260.537 L664.000 260.174" stroke-linejoin="round" stroke-linecap="round"/>

  <path class="grid" d="M214 412 V430 M349 307 V430 M664 346 V430" stroke-dasharray="3 4"/>
  <path class="axis" d="M664 272 V292"/>
  <circle class="dotb" cx="100" cy="409" r="3.5"/>
  <circle class="dotb" cx="214" cy="373" r="4"/>
  <circle class="dotg" cx="349" cy="299.042" r="4"/>
  <circle class="dotg" cx="664" cy="260.174" r="4"/>

  <text class="small" x="100" y="371">带载放电</text>
  <text class="value hi" x="100" y="399">3.450 V</text>
  <text class="value hi" x="238" y="386">3.490 V</text>
  <text class="small" x="238" y="407">刚撤流 t = 0⁺</text>
  <text class="value ok" x="365" y="343">3.572 V</text>
  <text class="txt" x="365" y="366">3 min = 1τ</text>
  <text class="small" x="365" y="386">仍差约 48 mV</text>
  <text class="value ok" x="571" y="315">3.615 V</text>
  <text class="txt" x="571" y="336">10 min · 仍差约 5 mV</text>
  <text class="small" x="406" y="411">V(t) = 3.620 − 0.130·exp(−t/3)</text>

  <!-- 0–1.2 s: loaded. 12 ms jump: instantaneous rebound in the illustration.
       1.5–9 s: data time advances linearly from 0 to 10 min; 9–12 s: hold.
       The cursor uses the same vertices as the trace, never a spatial easing.
       Static fallback already shows the final cursor and all explanations. -->
  <circle id="time-cursor" class="doty cursor" cx="664" cy="260.174" r="6.5">
    <animate data-ease="linear" calcMode="linear" attributeName="cx" values="100;214;214;214.000;225.250;236.500;247.750;259.000;270.250;281.500;292.750;304.000;315.250;326.500;337.750;349.000;360.250;371.500;382.750;394.000;405.250;416.500;427.750;439.000;450.250;461.500;472.750;484.000;495.250;506.500;517.750;529.000;540.250;551.500;562.750;574.000;585.250;596.500;607.750;619.000;630.250;641.500;652.750;664.000;664" keyTimes="0;0.1;0.101;0.125;0.140625;0.15625;0.171875;0.1875;0.203125;0.21875;0.234375;0.25;0.265625;0.28125;0.296875;0.3125;0.328125;0.34375;0.359375;0.375;0.390625;0.40625;0.421875;0.4375;0.453125;0.46875;0.484375;0.5;0.515625;0.53125;0.546875;0.5625;0.578125;0.59375;0.609375;0.625;0.640625;0.65625;0.671875;0.6875;0.703125;0.71875;0.734375;0.75;1" dur="12s" repeatCount="indefinite"/>
    <animate data-ease="linear" calcMode="linear" attributeName="cy" values="409;409;373;373.000;363.645;355.038;347.120;339.834;333.131;326.964;321.290;316.070;311.267;306.848;302.782;299.042;295.600;292.434;289.521;286.841;284.375;282.106;280.019;278.098;276.332;274.706;273.210;271.834;270.568;269.403;268.332;267.346;266.439;265.604;264.836;264.130;263.480;262.882;262.331;261.825;261.359;260.931;260.537;260.174;260.174" keyTimes="0;0.1;0.101;0.125;0.140625;0.15625;0.171875;0.1875;0.203125;0.21875;0.234375;0.25;0.265625;0.28125;0.296875;0.3125;0.328125;0.34375;0.359375;0.375;0.390625;0.40625;0.421875;0.4375;0.453125;0.46875;0.484375;0.5;0.515625;0.53125;0.546875;0.5625;0.578125;0.59375;0.609375;0.625;0.640625;0.65625;0.671875;0.6875;0.703125;0.71875;0.734375;0.75;1" dur="12s" repeatCount="indefinite"/>
  </circle>

  <text class="small" x="24" y="503">数值与时间仅作教学示意；τ = 3 min 不代表 3 min 已完全平衡。</text>
  <text class="small" x="24" y="525">实际静置判据须测定（电芯 / 温度 / 测量精度）；静置不是充电。</text>
</svg>
