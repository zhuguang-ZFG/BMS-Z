<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
  <title>Modbus RTU 帧解析与 RS485 差分波形动画</title>
  <desc>8 个字节从地址扫到 CRC。A 线为高的那段，B 线为低，A−B 为正。电平是示意，不是示波器。</desc>
  <rect width="800" height="520" fill="#f8fafc"/>
  <style>
  text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
  /* 深色模式：GitHub 深色主题下对调底色与文字色，只覆盖配色，不动几何与动画。
     stroke="#fff" 保持白色——那是彩色徽标上的勾选，不在覆盖范围内。 */
  @media (prefers-color-scheme: dark){
  rect[fill="#f8fafc"]{fill:#0f172a}
  rect[fill="#fff"]{fill:#1e293b}
  [fill="#f1f5f9"]{fill:#1e293b}
  [stroke="#f1f5f9"]{stroke:#1e293b}
  [fill="#e2e8f0"]{fill:#334155}
  [stroke="#e2e8f0"]{stroke:#334155}
  [fill="#cbd5e1"]{fill:#475569}
  [stroke="#cbd5e1"]{stroke:#475569}
  [fill="#64748b"]{fill:#94a3b8}
  [stroke="#64748b"]{stroke:#94a3b8}
  [fill="#475569"]{fill:#cbd5e1}
  [stroke="#475569"]{stroke:#cbd5e1}
  [fill="#334155"]{fill:#e2e8f0}
  [stroke="#334155"]{stroke:#e2e8f0}
  [fill="#1e293b"]{fill:#f1f5f9}
  [stroke="#1e293b"]{stroke:#f1f5f9}
  [fill="#dbeafe"]{fill:#1e3a8a}
  [stroke="#dbeafe"]{stroke:#1e3a8a}
  [fill="#eff6ff"]{fill:#172554}
  [stroke="#eff6ff"]{stroke:#172554}
  [fill="#bfdbfe"]{fill:#1e40af}
  [stroke="#bfdbfe"]{stroke:#1e40af}
  [fill="#1d4ed8"]{fill:#60a5fa}
  [stroke="#1d4ed8"]{stroke:#60a5fa}
  [fill="#1e40af"]{fill:#93c5fd}
  [stroke="#1e40af"]{stroke:#93c5fd}
  [fill="#2563eb"]{fill:#60a5fa}
  [stroke="#2563eb"]{stroke:#60a5fa}
  [fill="#3b82f6"]{fill:#60a5fa}
  [stroke="#3b82f6"]{stroke:#60a5fa}
  [fill="#ecfdf5"]{fill:#022c22}
  [stroke="#ecfdf5"]{stroke:#022c22}
  [fill="#a7f3d0"]{fill:#065f46}
  [stroke="#a7f3d0"]{stroke:#065f46}
  [fill="#86efac"]{fill:#166534}
  [stroke="#86efac"]{stroke:#166534}
  [fill="#065f46"]{fill:#6ee7b7}
  [stroke="#065f46"]{stroke:#6ee7b7}
  [fill="#059669"]{fill:#34d399}
  [stroke="#059669"]{stroke:#34d399}
  [fill="#fef2f2"]{fill:#450a0a}
  [stroke="#fef2f2"]{stroke:#450a0a}
  [fill="#fecaca"]{fill:#7f1d1d}
  [stroke="#fecaca"]{stroke:#7f1d1d}
  [fill="#fca5a5"]{fill:#b91c1c}
  [stroke="#fca5a5"]{stroke:#b91c1c}
  [fill="#991b1b"]{fill:#fca5a5}
  [stroke="#991b1b"]{stroke:#fca5a5}
  [fill="#dc2626"]{fill:#f87171}
  [stroke="#dc2626"]{stroke:#f87171}
  [fill="#fffbeb"]{fill:#451a03}
  [stroke="#fffbeb"]{stroke:#451a03}
  [fill="#fef3c7"]{fill:#78350f}
  [stroke="#fef3c7"]{stroke:#78350f}
  [fill="#92400e"]{fill:#fcd34d}
  [stroke="#92400e"]{stroke:#fcd34d}
  [fill="#b45309"]{fill:#fbbf24}
  [stroke="#b45309"]{stroke:#fbbf24}
  [fill="#5b21b6"]{fill:#d2a8ff}
  [stroke="#5b21b6"]{stroke:#d2a8ff}
  }
</style>

  <text x="400" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">一帧 Modbus RTU：8 个字节各司其职</text>

  <!-- 帧字节行 -->
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <rect x="60" y="60" width="80" height="46" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="1.5"/>
    <text x="100" y="89" fill="#1e40af">01</text>
    <rect x="145" y="60" width="80" height="46" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="1.5"/>
    <text x="185" y="89" fill="#1e40af">03</text>
    <rect x="230" y="60" width="80" height="46" rx="6" fill="#eff6ff" stroke="#334155" stroke-width="1.5"/>
    <text x="270" y="89" fill="#1d4ed8">00</text>
    <rect x="315" y="60" width="80" height="46" rx="6" fill="#eff6ff" stroke="#334155" stroke-width="1.5"/>
    <text x="355" y="89" fill="#1d4ed8">6B</text>
    <rect x="400" y="60" width="80" height="46" rx="6" fill="#eff6ff" stroke="#334155" stroke-width="1.5"/>
    <text x="440" y="89" fill="#1d4ed8">00</text>
    <rect x="485" y="60" width="80" height="46" rx="6" fill="#eff6ff" stroke="#334155" stroke-width="1.5"/>
    <text x="525" y="89" fill="#1d4ed8">03</text>
    <rect x="570" y="60" width="80" height="46" rx="6" fill="#fef3c7" stroke="#334155" stroke-width="1.5"/>
    <text x="610" y="89" fill="#92400e">76</text>
    <rect x="655" y="60" width="80" height="46" rx="6" fill="#fef3c7" stroke="#334155" stroke-width="1.5"/>
    <text x="695" y="89" fill="#92400e">87</text>
  </g>

  <!-- 扫描高亮框 -->
  <rect x="56" y="54" width="88" height="58" rx="8" fill="none" stroke="#f59e0b" stroke-width="3">
    <animate attributeName="x" values="56;56;141;226;311;396;481;566;651;651" keyTimes="0;0.08;0.18;0.28;0.38;0.48;0.58;0.68;0.78;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </rect>

  <!-- 字段解读轮播 -->
  <g font-size="14">
    <text x="100" y="140" fill="#1e40af" opacity="0">从机地址 = 1：叫的是 1 号 BMS<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.15;0.18;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="100" y="140" fill="#1e40af" opacity="0">功能码 03：读保持寄存器<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.18;0.21;0.25;0.28;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="100" y="140" fill="#1d4ed8" opacity="0">起始地址高字节 0x00<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.31;0.35;0.38;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="100" y="140" fill="#1d4ed8" opacity="0">起始地址低字节 0x6B → 从寄存器 0x006B 开始<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.38;0.41;0.45;0.48;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="100" y="140" fill="#1d4ed8" opacity="0">数量高字节 0x00<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.48;0.51;0.55;0.58;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="100" y="140" fill="#1d4ed8" opacity="0">数量 = 3 个寄存器（比如：SOC、总压、电流）<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.58;0.61;0.65;0.68;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="100" y="140" fill="#92400e" opacity="0">CRC16 低字节：算出来的校验必须对上，否则整帧作废<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.68;0.71;0.75;0.78;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="100" y="140" fill="#92400e" opacity="0">CRC16 高字节——帧完整，交给从机执行！<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.78;0.81;0.9;0.93;1" dur="12s" repeatCount="indefinite"/></text>
  </g>

  <!-- RS485 差分波形 -->
  <text x="60" y="200" font-size="15" font-weight="bold" fill="#334155">物理层：RS485 差分波形</text>
  <line x1="60" y1="270" x2="740" y2="270" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="60" y1="330" x2="740" y2="330" stroke="#e2e8f0" stroke-width="1"/>
  <text x="16" y="246" font-size="12" fill="#2563eb">A 线</text>
  <text x="16" y="300" font-size="12" fill="#b45309">B 线</text>
  <!-- A 线波形 -->
  <path d="M90,250 H180 V270 H270 V250 H360 V270 H450 V250 H540 V250 H630 V270 H720" fill="none" stroke="#2563eb" stroke-width="2.5"
        pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000">
    <animate attributeName="stroke-dashoffset" values="1000;0;0" keyTimes="0;0.5;1" dur="12s" repeatCount="indefinite"/>
  </path>
  <!-- B 与 A 反相：A 在 250 时 B 在 330，A 在 270 时 B 在 310 -->
  <path d="M90,330 H180 V310 H270 V330 H360 V310 H450 V330 H540 V330 H630 V310 H720" fill="none" stroke="#b45309" stroke-width="2.5"
        pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000">
    <animate attributeName="stroke-dashoffset" values="1000;0;0" keyTimes="0;0.5;1" dur="12s" repeatCount="indefinite"/>
  </path>
  <text x="84" y="396" text-anchor="end" font-size="12" fill="#5b21b6">A−B</text>
  <line x1="90" y1="392" x2="740" y2="392" stroke="#e2e8f0" stroke-width="1"/>
  <path d="M90,374 H180 V410 H270 V374 H360 V410 H450 V374 H630 V410 H720" fill="none" stroke="#5b21b6" stroke-width="2.5"
        pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000">
    <animate attributeName="stroke-dashoffset" values="1000;0;0" keyTimes="0;0.5;1" dur="12s" repeatCount="indefinite"/>
  </path>
  <g font-size="12" fill="#475569" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.55;0.6;1" dur="12s" repeatCount="indefinite"/>
    <text x="90" y="444">A 高时 B 低，A−B 为正（示意）。接收端看差值，不看单线对地电压。</text>
    <text x="90" y="466">长总线两端各并一颗 120Ω。少了终端电阻，回波会把帧咬坏。</text>
  </g>

  <text x="400" y="500" text-anchor="middle" font-size="13" fill="#475569">记忆钩子：地址叫谁、功能码干什么、数据在哪、CRC 防讹传——四件事说全就是一帧</text>
</svg>
