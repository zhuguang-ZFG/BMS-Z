<svg xmlns="http://www.w3.org/2000/svg" width="800" height="660" viewBox="0 -156 800 660" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>ADC 量化与误差动画</title>
  <desc>黄点沿放大的量化台阶走：连续电压被压到台阶上读出，基准一偏所有台阶一起挪。</desc><style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .fill-boxb { fill: #ddf4ff; }
    .fill-boxg { fill: #dafbe1; }
    .fill-boxr { fill: #ffebe9; }
    .fill-boxy { fill: #fff8c5; }
    .fill-b { fill: #0969da; }
    .fill-g { fill: #1a7f37; }
    .fill-r { fill: #cf222e; }
    .fill-y { fill: #9a6700; }
    .fill-ink { fill: #57606a; }
    .fill-muted { fill: #e2e8f0; }
    .fill-lockb { fill: #0969da; }
    .stroke-panel { stroke: #d0d7de; }
    .stroke-axis { stroke: #57606a; }
    .stroke-b { stroke: #0969da; }
    .stroke-g { stroke: #1a7f37; }
    .stroke-r { stroke: #cf222e; }
    .stroke-y { stroke: #bf8700; }
    .stroke-check { stroke: #ffffff; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .on { fill: #ffffff; font-size: 13px; font-weight: bold; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .fill-boxb { fill: #12233a; }
      .fill-boxg { fill: #0f2415; }
      .fill-boxr { fill: #3d1214; }
      .fill-boxy { fill: #2d2607; }
      .fill-b { fill: #4493f8; }
      .fill-g { fill: #3fb950; }
      .fill-r { fill: #ff7b72; }
      .fill-y { fill: #d29922; }
      .fill-ink { fill: #8b949e; }
      .fill-muted { fill: #30363d; }
      .fill-lockb { fill: #0969da; }
      .stroke-panel { stroke: #30363d; }
      .stroke-axis { stroke: #8b949e; }
      .stroke-b { stroke: #4493f8; }
      .stroke-g { stroke: #3fb950; }
      .stroke-r { stroke: #ff7b72; }
      .stroke-y { stroke: #d29922; }
      .stroke-check { stroke: #0d1117; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .on { fill: #ffffff; }
      .lineb { stroke: #4493f8; }
    }
</style><rect class="bg" x="0" y="-156" width="800" height="660" /><text class="title" x="24" y="-128">ADC：刻度细 ≠ 尺子准</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① ADC：刻度细 ≠ 尺子准<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 真实电压（连续）<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 12bit ADC：读数落在台阶上（台阶已放大示意，<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="448" width="752" height="44" rx="6" /><text class="small" x="40" y="476">示意：12 bit、5 V 参考，1 LSB=5/4096≈1.22 mV。黄点沿放大的台阶走。</text><rect width="800" height="440" class="bg" />
  <line x1="80" y1="330" x2="540" y2="330" stroke-width="1.5" class="stroke-axis" />
  <line x1="80" y1="330" x2="80" y2="90" stroke-width="1.5" class="stroke-axis" />
  <text x="72" y="94" text-anchor="end" font-size="12" class="small">3.84V</text>
  <text x="72" y="174" text-anchor="end" font-size="12" class="small">3.72V</text>
  <text x="72" y="254" text-anchor="end" font-size="12" class="small">3.60V</text>
  <text x="72" y="334" text-anchor="end" font-size="12" class="small">3.48V</text>
  <text x="536" y="350" text-anchor="end" font-size="12" class="small">时间</text>

  
  <path d="M80,300 C200,280 260,220 340,200 C420,180 480,160 540,140" fill="none" stroke-width="2" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" opacity="0" class="stroke-axis">
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.02;1" dur="12s" repeatCount="indefinite" />
    <animate attributeName="stroke-dashoffset" values="100;0;0" keyTimes="0;0.28;1" dur="12s" repeatCount="indefinite" />
  </path>
  <text x="300" y="105" text-anchor="middle" font-size="12" opacity="0" class="txt">真实电压（连续）
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.24;0.3;1" dur="12s" repeatCount="indefinite" />
  </text>

  
  <path d="M80,300 L140,300 L140,270 L200,270 L200,240 L260,240 L260,220 L320,220 L320,200 L380,200 L380,180 L440,180 L440,160 L540,160" fill="none" stroke-width="2.5" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" opacity="0" class="stroke-b">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3;0.33;1" dur="12s" repeatCount="indefinite" />
    <animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.3;0.55;1" dur="12s" repeatCount="indefinite" />
  </path>
  <text x="170" y="258" text-anchor="middle" font-size="12" opacity="0" class="hi">1 LSB
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.34;0.38;0.6;0.64;1" dur="12s" repeatCount="indefinite" />
  </text>
  <text x="310" y="360" text-anchor="middle" font-size="12" opacity="0" class="small">12bit ADC：读数落在台阶上（台阶已放大示意，实际 1 LSB ≈ 1.2mV）
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.36;0.6;0.64;1" dur="12s" repeatCount="indefinite" />
  </text>

  
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.62;0.66;1" dur="12s" repeatCount="indefinite" />
    <path d="M80,300 L140,300 L140,270 L200,270 L200,240 L260,240 L260,220 L320,220 L320,200 L380,200 L380,180 L440,180 L440,160 L540,160" fill="none" stroke-width="2.5" stroke-dasharray="6 4" class="stroke-r">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -24;0 -24" keyTimes="0;0.62;0.72;1" dur="12s" repeatCount="indefinite" />
    </path>
  </g>
  <text x="310" y="388" text-anchor="middle" font-size="12" opacity="0" class="warn">参考源一偏，所有读数同方向偏（示意 +24mV）
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.72;0.78;1" dur="12s" repeatCount="indefinite" />
  </text>

  
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.55;0.59;1" dur="12s" repeatCount="indefinite" />
    <rect x="580" y="90" width="180" height="44" rx="6" stroke-width="1.5" class="panel stroke-axis" />
    <text x="592" y="109" text-anchor="start" font-size="12" font-weight="bold" class="txt">分辨率 = 刻度多细</text>
    <text x="592" y="126" text-anchor="start" font-size="12" class="small">12bit → 4096 格（示例）</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.63;0.67;1" dur="12s" repeatCount="indefinite" />
    <rect x="580" y="146" width="180" height="44" rx="6" stroke-width="1.5" class="panel stroke-axis" />
    <text x="592" y="165" text-anchor="start" font-size="12" font-weight="bold" class="txt">偏移误差 = 整体平移</text>
    <text x="592" y="182" text-anchor="start" font-size="12" class="small">零点不准，处处同偏</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.71;0.75;1" dur="12s" repeatCount="indefinite" />
    <rect x="580" y="202" width="180" height="44" rx="6" stroke-width="1.5" class="panel stroke-axis" />
    <text x="592" y="221" text-anchor="start" font-size="12" font-weight="bold" class="txt">增益误差 = 比例不对</text>
    <text x="592" y="238" text-anchor="start" font-size="12" class="small">读数随幅度按比例偏</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.79;0.83;1" dur="12s" repeatCount="indefinite" />
    <rect x="580" y="258" width="180" height="44" rx="6" stroke-width="1.5" class="panel stroke-axis" />
    <text x="592" y="277" text-anchor="start" font-size="12" font-weight="bold" class="txt">温漂 = 随温度变</text>
    <text x="592" y="294" text-anchor="start" font-size="12" class="small">参考源自己也随温度晃</text>
  </g>

  <text x="400" y="422" text-anchor="middle" font-size="13" class="small">示意：12 bit、5 V 参考，1 LSB=5/4096≈1.22 mV。黄点沿放大的台阶走。整尺上移 24 mV 是基准偏移，平均消不掉。</text>

  <circle r="5" class="fill-y">
    <animateMotion dur="12s" repeatCount="indefinite" path="M80,300 L140,300 L140,270 L200,270 L200,240 L260,240 L260,220 L320,220 L320,200 L380,200 L380,180 L440,180 L440,160 L540,160" keyPoints="0;0;1;1" keyTimes="0;0.3300;0.5500;1" calcMode="linear" />
  </circle>
</svg>