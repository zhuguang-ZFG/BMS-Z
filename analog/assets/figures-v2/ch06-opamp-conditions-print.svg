<text x="50" y="303" font-size="24" fill="#3d6b4a" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">0～70°C 输入范围</text>
<path d="M300 295 Q480.00 293.01 660 295" fill="none" stroke="#3d6b4a" stroke-width="9"/>
