  <text class="warn" x="300" y="300">红 LFP 中段几乎平</text>
  <text class="hi" x="300" y="246">蓝 NMC 有坡</text>
  <text class="ok" x="300" y="268">绿钠离子示意更陡，不是更平</text>
  <circle class="dotr" r="6"><animate attributeName="cx" values="92.0;144.3;196.7;249.0;301.3;353.7;406.0;458.3;510.7;563.0;615.3;667.7;720.0" keyTimes="0;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="325.5;309.2;294.2;291.5;290.8;290.3;289.8;289.3;288.8;288.0;285.3;274.0;259.5" keyTimes="0;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1" dur="12s" repeatCount="indefinite"/></circle>
  <text class="small" x="24" y="478">三条都是教学形状，不是某一型号的 OCV 表。保护电压和充放电窗口以电芯规格书为准。</text>
</svg>
