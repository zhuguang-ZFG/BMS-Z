<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="ui-monospace, Consolas, monospace">
  <title>静置时开路电压近似按 K 值直线下降。陡的那根要单独挑出来。两条斜率都是示意，不是产线红线。</title>

  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #bf8700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.5; fill: none; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .dotg { fill: #1a7f37; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    .boxr { fill: #ffebe9; stroke: #cf222e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .dotg { fill: #3fb950; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
      .boxr { fill: #3d1214; stroke: #ff7b72; }
    }
  </style>

  <!-- formula: V=3.300 - K*t/1000; K=0.010 or 0.080 mV/h -->
  <rect class="bg" width="800" height="500"/>
  <text class="title" x="24" y="32">静置越久，陡的那根掉得越多（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="122" rx="6"/>
  <text class="txt" x="40" y="68" opacity="0.28">① 定义<tspan class="small">　K = ΔV/Δt。这里从 3.300 V 起算，单位 mV/h。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="94" opacity="0.28">② 缓的一根<tspan class="small">　0.010 mV/h。72 小时只掉 0.72 mV。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="120" opacity="0.28">③ 陡的一根<tspan class="small">　0.080 mV/h。72 小时掉 5.76 mV。点沿着它走。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="146" opacity="0.28">④ 别抄门槛<tspan class="small">　某条中试线的 0.0239 mV/h 只属于那条线。这里两个数是为了看斜率，不能写进分选规格。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="182" width="752" height="250" rx="6"/>
  <text class="small" x="40" y="204">开路电压 V</text>
  <line class="axis" x1="92.0" y1="214.0" x2="92.0" y2="400.0"/>
  <line class="axis" x1="92.0" y1="400.0" x2="720.0" y2="400.0"/>
  <text class="small" x="712.0" y="418" text-anchor="end">静置小时</text>
  <line class="grid" x1="92.0" y1="400.0" x2="92.0" y2="406.0"/>
  <text class="small" x="92.0" y="432" text-anchor="middle">0</text>
  <line class="grid" x1="301.3" y1="400.0" x2="301.3" y2="406.0"/>
  <text class="small" x="301.3" y="432" text-anchor="middle">24</text>
  <line class="grid" x1="720.0" y1="400.0" x2="720.0" y2="406.0"/>
  <text class="small" x="720.0" y="432" text-anchor="middle">72</text>
  <line class="grid" x1="86.0" y1="338.0" x2="92.0" y2="338.0"/>
  <text class="small" x="82.0" y="342.0" text-anchor="end">3.294</text>
  <line class="grid" x1="86.0" y1="245.0" x2="92.0" y2="245.0"/>
  <text class="small" x="82.0" y="249.0" text-anchor="end">3.300</text>
  <polyline class="lineg" points="92.0,245.0 100.7,245.2 109.4,245.3 118.2,245.5 126.9,245.6 135.6,245.8 144.3,245.9 153.1,246.1 161.8,246.2 170.5,246.4 179.2,246.6 187.9,246.7 196.7,246.9 205.4,247.0 214.1,247.2 222.8,247.3 231.6,247.5 240.3,247.6 249.0,247.8 257.7,247.9 266.4,248.1 275.2,248.3 283.9,248.4 292.6,248.6 301.3,248.7 310.1,248.9 318.8,249.0 327.5,249.2 336.2,249.3 344.9,249.5 353.7,249.7 362.4,249.8 371.1,250.0 379.8,250.1 388.6,250.3 397.3,250.4 406.0,250.6 414.7,250.7 423.4,250.9 432.2,251.0 440.9,251.2 449.6,251.4 458.3,251.5 467.1,251.7 475.8,251.8 484.5,252.0 493.2,252.1 501.9,252.3 510.7,252.4 519.4,252.6 528.1,252.8 536.8,252.9 545.6,253.1 554.3,253.2 563.0,253.4 571.7,253.5 580.4,253.7 589.2,253.8 597.9,254.0 606.6,254.1 615.3,254.3 624.1,254.5 632.8,254.6 641.5,254.8 650.2,254.9 658.9,255.1 667.7,255.2 676.4,255.4 685.1,255.5 693.8,255.7 702.6,255.9 711.3,256.0 720.0,256.2" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline class="liner" points="92.0,245.0 100.7,246.2 109.4,247.5 118.2,248.7 126.9,250.0 135.6,251.2 144.3,252.4 153.1,253.7 161.8,254.9 170.5,256.2 179.2,257.4 187.9,258.6 196.7,259.9 205.4,261.1 214.1,262.4 222.8,263.6 231.6,264.8 240.3,266.1 249.0,267.3 257.7,268.6 266.4,269.8 275.2,271.0 283.9,272.3 292.6,273.5 301.3,274.8 310.1,276.0 318.8,277.2 327.5,278.5 336.2,279.7 344.9,281.0 353.7,282.2 362.4,283.4 371.1,284.7 379.8,285.9 388.6,287.2 397.3,288.4 406.0,289.6 414.7,290.9 423.4,292.1 432.2,293.4 440.9,294.6 449.6,295.8 458.3,297.1 467.1,298.3 475.8,299.6 484.5,300.8 493.2,302.0 501.9,303.3 510.7,304.5 519.4,305.8 528.1,307.0 536.8,308.2 545.6,309.5 554.3,310.7 563.0,312.0 571.7,313.2 580.4,314.4 589.2,315.7 597.9,316.9 606.6,318.2 615.3,319.4 624.1,320.6 632.8,321.9 641.5,323.1 650.2,324.4 658.9,325.6 667.7,326.8 676.4,328.1 685.1,329.3 693.8,330.6 702.6,331.8 711.3,333.0 720.0,334.3" stroke-linejoin="round" stroke-linecap="round"/>
  <text class="ok" x="160" y="250">0.010 mV/h</text>
  <text class="warn" x="160" y="360">0.080 mV/h</text>
  <circle class="dotr" r="6"><animate attributeName="cx" values="92.0;144.3;196.7;249.0;301.3;353.7;406.0;458.3;510.7;563.0;615.3;667.7;720.0" keyTimes="0;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="245.0;252.4;259.9;267.3;274.8;282.2;289.6;297.1;304.5;312.0;319.4;326.8;334.3" keyTimes="0;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1" dur="12s" repeatCount="indefinite"/></circle>
  <text class="small" x="24" y="478">直线是教学近似：短时间、温度稳定、已经过了极化回弹。3.300 V、0.010 和 0.080 mV/h 都是示意。</text>
</svg>
