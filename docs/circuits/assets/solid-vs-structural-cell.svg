<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540">
  <title>液态锂电、固态电池与结构电池对照示意图</title>
  <rect width="880" height="540" fill="#f8fafc"/>
  <style>
  text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
  @media (prefers-color-scheme: dark){
  rect[fill="#f8fafc"]{fill:#0f172a}
  rect[fill="#fff"]{fill:#1e293b}
  [fill="#e2e8f0"]{fill:#334155}
  [stroke="#e2e8f0"]{stroke:#334155}
  [fill="#334155"]{fill:#e2e8f0}
  [stroke="#334155"]{stroke:#e2e8f0}
  [fill="#1e293b"]{fill:#f1f5f9}
  [stroke="#1e293b"]{stroke:#f1f5f9}
  [fill="#dbeafe"]{fill:#1e3a8a}
  [stroke="#dbeafe"]{stroke:#1e3a8a}
  [fill="#bfdbfe"]{fill:#1e40af}
  [stroke="#bfdbfe"]{stroke:#1e40af}
  [fill="#1d4ed8"]{fill:#60a5fa}
  [stroke="#1d4ed8"]{stroke:#60a5fa}
  [fill="#ecfdf5"]{fill:#022c22}
  [stroke="#ecfdf5"]{stroke:#022c22}
  [fill="#a7f3d0"]{fill:#065f46}
  [stroke="#a7f3d0"]{stroke:#065f46}
  [fill="#059669"]{fill:#34d399}
  [stroke="#059669"]{stroke:#34d399}
  [fill="#fffbeb"]{fill:#451a03}
  [stroke="#fffbeb"]{stroke:#451a03}
  [fill="#fef3c7"]{fill:#78350f}
  [stroke="#fef3c7"]{stroke:#78350f}
  [fill="#b45309"]{fill:#fbbf24}
  [stroke="#b45309"]{stroke:#fbbf24}
  [fill="#fef2f2"]{fill:#450a0a}
  [stroke="#fef2f2"]{stroke:#450a0a}
  [fill="#fecaca"]{fill:#7f1d1d}
  [stroke="#fecaca"]{stroke:#7f1d1d}
  [fill="#dc2626"]{fill:#f87171}
  [stroke="#dc2626"]{stroke:#f87171}
  }
  </style>
  <text x="440" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">四种说法对照：离子走哪一层，碳纤维是电极还是外壳</text>

  <rect x="16" y="48" width="420" height="220" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="32" y="72" font-size="15" font-weight="bold" fill="#1e293b">液态锂电</text>
  <rect x="32" y="84" width="168" height="36" rx="4" fill="#fecaca" stroke="#334155"/>
  <text x="116" y="107" text-anchor="middle" font-size="13" fill="#1e293b">正极</text>
  <rect x="32" y="124" width="168" height="52" rx="4" fill="#dbeafe" stroke="#334155"/>
  <text x="116" y="146" text-anchor="middle" font-size="13" fill="#1e293b">隔膜 + 液态电解液</text>
  <text x="116" y="164" text-anchor="middle" font-size="11" fill="#334155">锂离子走这里</text>
  <circle cy="150" r="5" fill="#1d4ed8">
    <animate attributeName="cx" values="48;184;48" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <rect x="32" y="180" width="168" height="36" rx="4" fill="#e2e8f0" stroke="#334155"/>
  <text x="116" y="203" text-anchor="middle" font-size="13" fill="#1e293b">石墨负极</text>
  <text x="216" y="120" font-size="13" fill="#334155">电子仍走外电路。</text>
  <text x="216" y="142" font-size="13" fill="#334155">4.2 V / 3.65 V</text>
  <text x="216" y="162" font-size="13" fill="#334155">只是常见液态体系</text>
  <text x="216" y="182" font-size="13" fill="#334155">的示例红线。</text>

  <rect x="448" y="48" width="416" height="220" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="464" y="72" font-size="15" font-weight="bold" fill="#1e293b">固态电池（示意）</text>
  <rect x="464" y="84" width="168" height="36" rx="4" fill="#fecaca" stroke="#334155"/>
  <text x="548" y="107" text-anchor="middle" font-size="13" fill="#1e293b">正极</text>
  <rect x="464" y="124" width="168" height="52" rx="4" fill="#ecfdf5" stroke="#334155"/>
  <text x="548" y="146" text-anchor="middle" font-size="13" fill="#1e293b">固体电解质</text>
  <text x="548" y="164" text-anchor="middle" font-size="11" fill="#334155">锂离子改走固体</text>
  <circle cy="150" r="5" fill="#059669">
    <animate attributeName="cx" values="480;616;480" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <rect x="464" y="180" width="168" height="36" rx="4" fill="#fef3c7" stroke="#334155"/>
  <text x="548" y="203" text-anchor="middle" font-size="13" fill="#1e293b">金属锂或其他负极</text>
  <text x="648" y="116" font-size="13" fill="#334155">界面有时仍有</text>
  <text x="648" y="136" font-size="13" fill="#334155">少量液体。</text>
  <text x="648" y="164" font-size="13" fill="#dc2626">短路仍会放热。</text>
  <text x="648" y="184" font-size="13" fill="#334155">阈值看这颗电芯。</text>

  <rect x="16" y="280" width="420" height="200" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="32" y="304" font-size="15" font-weight="bold" fill="#1e293b">结构电池</text>
  <rect x="32" y="316" width="220" height="36" rx="4" fill="#fffbeb" stroke="#b45309"/>
  <text x="142" y="339" text-anchor="middle" font-size="13" fill="#1e293b">碳纤维负极，同时承力</text>
  <rect x="32" y="356" width="220" height="36" rx="4" fill="#dbeafe" stroke="#334155"/>
  <text x="142" y="379" text-anchor="middle" font-size="13" fill="#1e293b">结构电解质 + 隔膜</text>
  <rect x="32" y="396" width="220" height="36" rx="4" fill="#fecaca" stroke="#334155"/>
  <text x="142" y="419" text-anchor="middle" font-size="13" fill="#1e293b">正极（如磷酸铁锂）</text>
  <text x="268" y="348" font-size="13" fill="#334155">碳纤维是电极。</text>
  <text x="268" y="372" font-size="13" fill="#334155">论文样件约</text>
  <text x="268" y="396" font-size="13" fill="#334155">几十 Wh/kg。</text>
  <text x="268" y="420" font-size="13" fill="#334155">不是装车规格。</text>

  <rect x="448" y="280" width="416" height="200" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="464" y="304" font-size="15" font-weight="bold" fill="#1e293b">碳纤维外壳</text>
  <rect x="464" y="320" width="250" height="120" rx="8" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="7 4"/>
  <text x="589" y="340" text-anchor="middle" font-size="12" fill="#334155">碳纤维壳体</text>
  <rect x="488" y="356" width="90" height="64" rx="4" fill="#fef2f2" stroke="#dc2626"/>
  <text x="533" y="392" text-anchor="middle" font-size="12" fill="#1e293b">普通电芯</text>
  <rect x="592" y="356" width="90" height="64" rx="4" fill="#fef2f2" stroke="#dc2626"/>
  <text x="637" y="392" text-anchor="middle" font-size="12" fill="#1e293b">普通电芯</text>
  <text x="728" y="360" font-size="13" fill="#334155">碳纤维</text>
  <text x="728" y="380" font-size="13" fill="#334155">只是箱子。</text>
  <text x="728" y="408" font-size="13" fill="#334155">BMS 看</text>
  <text x="728" y="428" font-size="13" fill="#334155">里面的电芯。</text>

  <text x="440" y="512" text-anchor="middle" font-size="13" fill="#334155">示意图，不是实拍。层厚不成比例。蓝点只表示离子在电解质里移动。</text>
  <text x="440" y="530" text-anchor="middle" font-size="13" fill="#dc2626">不要拆电芯，不要用液态锂电的默认保护档去充固态或结构电池试样。</text>
</svg>
