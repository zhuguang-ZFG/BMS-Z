<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <title>共模电压与隔离动画</title>
  <rect width="800" height="400" fill="#f8fafc"/>
  <style>text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}</style>

  <text x="400" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">为什么板间通信必须隔离：300V 的"地"不一样</text>

  <!-- 电池串电位阶梯 -->
  <g stroke="#334155" stroke-width="2" fill="#dbeafe">
    <rect x="60" y="260" width="60" height="46" rx="4"/>
    <rect x="60" y="210" width="60" height="46" rx="4"/>
    <rect x="60" y="160" width="60" height="46" rx="4"/>
    <rect x="60" y="110" width="60" height="46" rx="4"/>
  </g>
  <g font-size="11" fill="#64748b">
    <text x="135" y="312">0V</text>
    <text x="135" y="262">+75V</text>
    <text x="135" y="212">+150V</text>
    <text x="135" y="162">+225V</text>
    <text x="135" y="112">+300V</text>
  </g>
  <text x="90" y="340" text-anchor="middle" font-size="12" fill="#334155">电池串（局部）</text>

  <!-- 两块 CMU 板 -->
  <rect x="220" y="250" width="150" height="70" rx="10" fill="#fff" stroke="#334155" stroke-width="2"/>
  <text x="295" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">CMU1</text>
  <text x="295" y="300" text-anchor="middle" font-size="11" fill="#64748b">地 = 0V</text>
  <rect x="220" y="80" width="150" height="70" rx="10" fill="#fff" stroke="#334155" stroke-width="2"/>
  <text x="295" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">CMU2</text>
  <text x="295" y="130" text-anchor="middle" font-size="11" fill="#dc2626">地 = +300V</text>
  <line x1="120" y1="283" x2="220" y2="283" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="120" y1="133" x2="220" y2="133" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- ===== 相位 1：直连灾难 ===== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.42;0.46;1" dur="8s" repeatCount="indefinite"/>
    <line x1="370" y1="285" x2="480" y2="285" stroke="#ef4444" stroke-width="3"/>
    <line x1="480" y1="285" x2="480" y2="115" stroke="#ef4444" stroke-width="3"/>
    <line x1="480" y1="115" x2="370" y2="115" stroke="#ef4444" stroke-width="3"/>
    <rect x="480" y="150" width="150" height="70" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="555" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">MCU/上位机</text>
    <text x="555" y="198" text-anchor="middle" font-size="11" fill="#dc2626">地 = 0V</text>
    <!-- 电火花 -->
    <g stroke="#f59e0b" stroke-width="3" stroke-linecap="round">
      <animate attributeName="opacity" values="1;0.2;1" dur="0.4s" repeatCount="indefinite"/>
      <line x1="480" y1="190" x2="470" y2="172"/>
      <line x1="480" y1="190" x2="492" y2="172"/>
      <line x1="480" y1="190" x2="480" y2="168"/>
    </g>
    <text x="555" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc2626">直连 = 300V 电位差瞬间打进芯片 ⚡ 冒烟</text>
  </g>

  <!-- ===== 相位 2：隔离器救场 ===== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.46;0.5;1" dur="8s" repeatCount="indefinite"/>
    <line x1="370" y1="200" x2="440" y2="200" stroke="#334155" stroke-width="3"/>
    <line x1="520" y1="200" x2="630" y2="200" stroke="#334155" stroke-width="3"/>
    <!-- 隔离器 -->
    <rect x="440" y="170" width="80" height="60" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <line x1="480" y1="175" x2="480" y2="225" stroke="#10b981" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="480" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#059669">隔离器</text>
    <!-- 跨缝跳动的信号包 -->
    <circle r="6" fill="#2563eb">
      <animateMotion dur="1.4s" repeatCount="indefinite" path="M380,200 H580"/>
    </circle>
    <rect x="630" y="165" width="130" height="70" rx="10" fill="#fff" stroke="#334155" stroke-width="2"/>
    <text x="695" y="193" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">MCU/上位机</text>
    <text x="695" y="213" text-anchor="middle" font-size="11" fill="#64748b">地 = 0V，安全</text>
    <text x="480" y="130" text-anchor="middle" font-size="13" fill="#059669">300V 被挡在缝外，信号照常跳过</text>
  </g>

  <text x="400" y="380" text-anchor="middle" font-size="14" fill="#475569">隔离器不传直流电位、只传信号——磁耦 / 容耦 / 光耦 / 变压器（isoSPI）都是同一思想</text>
</svg>
