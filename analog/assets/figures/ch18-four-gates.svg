<text x="487" y="472" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" fill="#52606d">打勾：限流 50mA 再上电</text>
<text x="487" y="492" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" fill="#52606d">通断查电源对地短路</text>
<line x1="487" y1="502" x2="653" y2="502" stroke="#d0d5dd" stroke-width="1"/>
