<text x="645" y="355" font-size="25" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">−</text>
<path d="M775 305 L900 305" fill="none" stroke="#16202b" stroke-width="3"/>
