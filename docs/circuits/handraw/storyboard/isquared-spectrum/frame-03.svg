<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
<defs>
 <filter id="w" filterUnits="userSpaceOnUse" x="0" y="0" width="960" height="560">
  <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="11" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="4.5" xChannelSelector="R" yChannelSelector="G"/>
 </filter>
 <filter id="grain" filterUnits="userSpaceOnUse" x="0" y="0" width="960" height="560">
  <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="5"/>
  <feColorMatrix type="saturate" values="0"/></filter>
</defs>
<rect width="960" height="560" fill="#f6f1e3"/>
<rect width="960" height="560" filter="url(#grain)" opacity="0.22"/>
<text x="480" y="62" font-family="KaiTi" font-size="20" fill="#003153" text-anchor="middle">对称双极方波：I² 恒定，没有纹波</text>
<g class="motion" data-x="1">
<text x="255" y="104" font-family="KaiTi" font-size="14" fill="#003153" text-anchor="middle">时域：电流 I(t)</text>
<text x="710" y="104" font-family="KaiTi" font-size="14" fill="#003153" text-anchor="middle">I² 的频率成分</text>
<line x1="80" y1="200" x2="430" y2="200" stroke="#003153" stroke-width="1.5" filter="url(#w)"/>
<line x1="80" y1="140" x2="80" y2="262" stroke="#003153" stroke-width="1.5" filter="url(#w)"/>
<text x="68" y="205" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="end">0</text>
<text x="438" y="205" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="start">t</text>
<line x1="530" y1="258" x2="890" y2="258" stroke="#003153" stroke-width="1.5" filter="url(#w)"/>
<line x1="530" y1="146" x2="530" y2="258" stroke="#003153" stroke-width="1.5" filter="url(#w)"/>
<text x="518" y="152" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="end">幅</text>
<text x="898" y="276" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="end">频率</text>
<line x1="600" y1="258" x2="600" y2="264" stroke="#003153" stroke-width="1.3"/>
<text x="600" y="276" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="middle">DC</text>
<line x1="680" y1="258" x2="680" y2="264" stroke="#003153" stroke-width="1.3"/>
<text x="680" y="276" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="middle">ω</text>
<line x1="760" y1="258" x2="760" y2="264" stroke="#003153" stroke-width="1.3"/>
<text x="760" y="276" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="middle">2ω</text>
<line x1="830" y1="258" x2="830" y2="264" stroke="#003153" stroke-width="1.3"/>
<text x="830" y="276" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="middle">3ω</text>
</g>
<g class="motion" data-x="1">
<path d="M80.0,154.0 L150.0,154.0 L150.0,246.0 L150.0,246.0 L220.0,246.0 L220.0,154.0 L220.0,154.0 L290.0,154.0 L290.0,246.0 L290.0,246.0 L360.0,246.0 L360.0,154.0 L360.0,154.0 L430.0,154.0" fill="none" stroke="#003153" stroke-width="2.0" filter="url(#w)"/>
</g>
<g class="motion" data-x="1">
<line x1="600" y1="258" x2="600" y2="202" stroke="#003153" stroke-width="3.0" filter="url(#w)"/>
<text x="600" y="192" font-family="KaiTi" font-size="12" fill="#003153" text-anchor="middle">直流 A²</text>
</g>
<g class="motion" data-x="1">
<text x="70" y="308" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="start" font-weight="bold">电流波形</text>
<text x="330" y="308" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="start" font-weight="bold">I² 的主要结构</text>
<text x="640" y="308" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="start" font-weight="bold">温度应对照什么</text>
<line x1="70" y1="318" x2="900" y2="318" stroke="#003153" stroke-width="1.3" filter="url(#w)"/>
<text x="70" y="336" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="start">I=A sinωt</text>
<text x="330" y="336" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="start">A²/2 − A²cos2ωt/2</text>
<text x="640" y="336" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="start">直流温升和 2ω 纹波</text>
<text x="70" y="372" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="start">I=±A 的对称双极方波</text>
<text x="330" y="372" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="start">恒定 A²</text>
<text x="640" y="372" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="start">忽略切换与熵热时，只向恒温升收敛</text>
</g>
<text x="60" y="512" font-family="KaiTi" font-size="13" fill="#003153">③ I=±A 的对称双极方波，I² 恒为 A²：忽略切换与熵热时只向恒温升收敛，纹波这一项整条消失。</text>
<text x="480" y="546" font-family="KaiTi" font-size="14" opacity="0.8" text-anchor="middle" fill="#003153">原理示意 / 非实拍</text>
</svg>
