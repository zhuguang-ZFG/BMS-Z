<text x="480" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b">采样保持：四拍与一个电容</text>
<text x="480" y="54" text-anchor="middle" font-size="12.5" fill="#5b666f">采样相看建立，保持相看 droop；加大电容压误差也拉长时间</text>
<rect x="48" y="96" width="864" height="360" rx="14" fill="#f6eedb" stroke="#c9bb9d" stroke-width="1.4"/>
<text x="76" y="128" font-size="12" fill="#5b666f">保持节点电压</text>
<line x1="110" y1="400" x2="864" y2="400" stroke="#c9bb9d" stroke-width="2"/>
<line x1="110" y1="400" x2="110" y2="150" stroke="#c9bb9d" stroke-width="2"/>
<text x="110" y="430" font-size="11" fill="#5b666f">0</text>
<text x="470" y="430" text-anchor="middle" font-size="11" fill="#5b666f">一个采样周期</text>
<text x="864" y="430" text-anchor="end" font-size="11" fill="#5b666f">t</text>
<text x="80" y="180" font-size="11" fill="#5b666f">2.000V</text>
<line x1="110" y1="180" x2="864" y2="180" stroke="#3d6b4a" stroke-width="1.2" stroke-dasharray="5,5"/>
<g transform="translate(0 -4)"><path d="M110,400 C180,400 220,300 300,240 C360,200 430,184 520,180" fill="none" stroke="#1f5d7a" stroke-width="3.4"/>
<path d="M520,180 L700,180" fill="none" stroke="#3d6b4a" stroke-width="3.4"/>
<path d="M700,180 L864,220" fill="none" stroke="#a4630f" stroke-width="3.4"/>
<line x1="864" y1="150" x2="864" y2="400" stroke="#a8321f" stroke-width="1.6" stroke-dasharray="4,4"/>
<rect x="96" y="474" width="816" height="94" rx="10" fill="#f6e7e1" stroke="#a8321f" stroke-width="1.6"/>
<text x="120" y="506" font-size="13" font-weight="bold" fill="#a8321f">一个电容，三笔账</text>
<text x="120" y="534" font-size="12.5" fill="#16202b">加大 Chold：摊注入、压 kT/C、缓 droop；代价是采集时间线性变长。</text>
<text x="120" y="556" font-size="12" fill="#5b666f">16 位预算里，三笔判据同时收紧 16 倍。</text></g>
<rect x="24" y="556" width="912" height="34" rx="9" fill="#f7eedb" stroke="#c9bb9d" stroke-width="1.2"/>
<text x="480" y="580" text-anchor="middle" font-size="13" font-weight="bold" fill="#a8321f">下一周期重新闭合；droop、注入、kT/C 都记在同一个电容上</text>
</svg>
