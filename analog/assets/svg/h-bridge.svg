<rect x="50" y="428" width="700" height="52.0" rx="9" fill="#e8efe6" stroke="#3d6b4a" stroke-width="1.5" filter="url(#soft)"/><rect x="56" y="435" width="3" height="38.0" rx="1.5" fill="#3d6b4a"/><text x="400" y="450.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3d6b4a">四个开关两个状态位——这就是 H 桥。驱动芯片（DRV8833/L298）把死区、自举、</text><text x="400" y="468.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3d6b4a">过流保护全打包；高侧管源极悬在电机电压上，要靠自举电容「举」着栅极才开得动。</text>
