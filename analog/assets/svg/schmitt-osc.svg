<svg xmlns="http://www.w3.org/2000/svg" width="800" height="506" viewBox="0 0 800 506" role="img" aria-labelledby="ttl">
<title id="ttl">迟滞振荡器：方波从两只门槛之间自己「弹」出来</title>
<desc>迟滞振荡器：方波从两只门槛之间自己「弹」出来；节拍：① 上电即 +6V：vout 经 R 给 C 充电，Vc 从 −3V 指数爬向 +6V；② 爬到上门槛 +3V：比较器翻转，vout 跳到 −6V——门槛被当场搬走；③ Vc 掉头冲向下门槛 −3V：vout 又跳回 +6V——来回弹，停不下来；④ T = 2RC·ln3 ≈ 2.2ms（f≈455Hz）：门槛越宽弹得越慢——555 无稳态的祖师爷</desc>
