<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="系统边界与量的流向">
<title>系统边界与量的流向</title>
<desc>任务到量化需求再到测量/估计/保护三职责的分工与接口流向</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b64"/></marker></defs>
<style>
  .bg { fill: #f6f1e3; }
  .title { fill: #003153; font: 700 20px 'KaiTi','STKaiti','Noto Serif SC',serif; }
  .sub { fill: #5c6d73; font: 13px 'Noto Sans SC','Microsoft YaHei',sans-serif; }
  .lbl { fill: #4d5a5f; font: 13px 'Noto Sans SC','Microsoft YaHei',sans-serif; }
  .small { fill: #4d5a5f; font: 12px 'Noto Sans SC','Microsoft YaHei',sans-serif; }
  .sym { fill: #003153; font: 700 19px 'KaiTi','STKaiti','Noto Serif SC',serif; }
  .wire { stroke: #003153; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .flow { stroke: #176b64; stroke-width: 2.6; fill: none; stroke-linecap: round; marker-end: url(#arrow); }
  .box { fill: #fbf8f1; stroke: #003153; stroke-width: 2; rx: 8; }
  .owner { fill: #fbf8f1; stroke: #8a5019; stroke-width: 2; rx: 8; }
  .range { height: 26; rx: 6; opacity: 0.28; }
  .mark { stroke: #a3322a; stroke-width: 2.4; stroke-dasharray: 6 4; }
  .axis { stroke: #5c6d73; stroke-width: 1.3; }
</style>
<rect class="bg" x="0" y="0" width="800" height="420"/>
<text class="title" x="40.0" y="40.0" text-anchor="start">图 D03-F1　系统边界与量的流向</text>
<text class="sub" x="40.0" y="64.0" text-anchor="start">任务进来，量化需求落地；测量/估计/保护各归一个所有者，跨界走显式接口</text>
<rect class="box" x="40" y="110" width="170" height="90"/>
<text class="sym" x="125.0" y="140.0" text-anchor="middle">负载任务</text>
<text class="small" x="125.0" y="164.0" text-anchor="middle">电流/功率谱</text>
<text class="small" x="125.0" y="184.0" text-anchor="middle">温度·SOC·寿命</text>
<rect class="box" x="300" y="100" width="200" height="110"/>
<text class="sym" x="400.0" y="130.0" text-anchor="middle">量化需求（12 字段）</text>
<text class="small" x="400.0" y="154.0" text-anchor="middle">化学体系·串并·窗口</text>
<text class="small" x="400.0" y="174.0" text-anchor="middle">一致性·职责归属</text>
<text class="small" x="400.0" y="194.0" text-anchor="middle">缺一格即规格缺项</text>
<rect class="owner" x="580" y="80" width="180" height="80"/>
<text class="sym" x="670.0" y="110.0" text-anchor="middle">测量</text>
<text class="small" x="670.0" y="134.0" text-anchor="middle">值·时刻·有效位</text>
<rect class="owner" x="580" y="200" width="180" height="80"/>
<text class="sym" x="670.0" y="230.0" text-anchor="middle">估计</text>
<text class="small" x="670.0" y="254.0" text-anchor="middle">状态·不确定度</text>
<rect class="owner" x="580" y="320" width="180" height="80"/>
<text class="sym" x="670.0" y="350.0" text-anchor="middle">保护</text>
<text class="small" x="670.0" y="374.0" text-anchor="middle">动作·时限·锁存</text>
<path class="flow" d="M 210 155 H 292"/>
<path class="flow" d="M 500 130 C 540 130 540 120 572 120"/>
<path class="flow" d="M 500 155 H 572"/>
<path class="flow" d="M 500 180 C 540 180 540 360 572 360"/>
<text class="small" x="246.0" y="140.0" text-anchor="middle">变成可核对的数</text>
<text class="small" x="536.0" y="240.0" text-anchor="middle">跨界走显式接口与证据</text>
<text class="lbl" x="40.0" y="300.0" text-anchor="start">示例：持续 40 A × 单节 8 mΩ → 12.8 W/串（热账喂 D16）</text>
<text class="lbl" x="40.0" y="326.0" text-anchor="start">示例：过压 100 ms 动作 → 测量链误差与延迟预算有上界（喂 D04/D08，C1 初稿）</text>
</svg>
