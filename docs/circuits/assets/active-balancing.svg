<svg xmlns="http://www.w3.org/2000/svg" width="800" height="558" viewBox="0 -156 800 558" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>主动均衡动画：电感搬运能量</title>
  <desc>高节 4.05 V 的电荷经电感搬给低节 3.65 V：先存进磁件再倒出，能量搬运而不是烧掉，效率八成上下、电流能到安培级。</desc><style>
