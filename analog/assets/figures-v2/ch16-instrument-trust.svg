<rect class="ink-echo" x="140" y="632" width="720" height="42" rx="6" stroke="#37424e" stroke-width="2" fill="none" opacity="0.32" transform="translate(1.54 -0.81) rotate(0.03 500.0 653.0)"/>
<text x="500" y="661" font-size="23" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="middle">先证明仪器可信，再相信读数。</text>
