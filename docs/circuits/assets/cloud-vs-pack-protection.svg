  <line class="axis" x1="108.0" y1="400.0" x2="720.0" y2="400.0"/>
  <line class="grid" x1="184.5" y1="400.0" x2="184.5" y2="406.0"/>
  <text class="small" x="184.5" y="422.0" text-anchor="middle">10μs</text>
  <line class="grid" x1="483.1" y1="400.0" x2="483.1" y2="406.0"/>
  <text class="small" x="483.1" y="422.0" text-anchor="middle">80ms</text>
  <line class="grid" x1="567.0" y1="400.0" x2="567.0" y2="406.0"/>
  <text class="small" x="567.0" y="422.0" text-anchor="middle">1s</text>
  <line class="grid" x1="680.0" y1="400.0" x2="680.0" y2="406.0"/>
  <text class="small" x="680.0" y="422.0" text-anchor="middle">30s</text>
  <line class="grid" x1="102.0" y1="400.0" x2="108.0" y2="400.0"/>
  <text class="small" x="98.0" y="404.0" text-anchor="end">0 已动</text>
