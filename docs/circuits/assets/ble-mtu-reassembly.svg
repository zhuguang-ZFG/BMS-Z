<svg xmlns="http://www.w3.org/2000/svg" width="800" height="680" viewBox="0 -156 800 680" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>BLE 长帧要先协商 MTU，再把通知分片按长度重组。默认 ATT MTU 只有 23 字节。</title>
  <desc>黄点按片 1、片 2、片 3 走。读数按每片约 20 字节累加到约 60 字节，和画面上的帧长一致。示意，不是抓包。</desc>
  <style>
    text { font-family: ui-monospace, Consolas, monospace; }
    .bg { fill: #fffdf5; }
    .title { fill: #293b3a; font-size: 18px; font-weight: bold; }
    .txt { fill: #293b3a; font-size: 15px; }
    .small { fill: #626d65; font-size: 14px; }
    .frame { fill: #f7f2e5; stroke: #968d77; }
    .piece { fill: #e4f0df; stroke: #176b73; }
    .ok { fill: #377b60; font-size: 15px; font-weight: bold; }
    .no { fill: #b84745; font-size: 15px; font-weight: bold; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #192727; }
      .title { fill: #edf0e5; }
      .txt { fill: #edf0e5; }
      .small { fill: #b0beb3; }
      .frame { fill: #223333; stroke: #71908c; }
      .piece { fill: #293f35; stroke: #7ec5c5; }
      .ok { fill: #8fc7a2; }
      .no { fill: #f39b91; }
    
  </style>
  <style>
    .bg { fill: #fffdf5; }
    .panel { fill: #f7f2e5; stroke: #cfc6b2; }
    .fill-boxb { fill: #e4f0df; }
    .fill-boxg { fill: #e4f0df; }
    .fill-boxr { fill: #f6e2df; }
    .fill-boxy { fill: #fbefc7; }
    .fill-b { fill: #176b73; }
    .fill-g { fill: #377b60; }
    .fill-r { fill: #b84745; }
    .fill-y { fill: #926717; }
    .fill-ink { fill: #626d65; }
    .fill-muted { fill: #eee6d5; }
    .fill-lockb { fill: #176b73; }
    .stroke-panel { stroke: #cfc6b2; }
    .stroke-axis { stroke: #626d65; }
    .stroke-b { stroke: #176b73; }
    .stroke-g { stroke: #377b60; }
    .stroke-r { stroke: #b84745; }
    .stroke-y { stroke: #926717; }
    .stroke-check { stroke: #fffdf5; }
    .axis { stroke: #626d65; stroke-width: 1.5; fill: none; }
    .grid { stroke: #cfc6b2; stroke-width: 1; fill: none; }
    .txt { fill: #293b3a; font-size: 13px; }
    .small { fill: #626d65; font-size: 12px; }
    .title { fill: #293b3a; font-size: 16px; font-weight: bold; }
    .hi { fill: #176b73; }
    .warn { fill: #b84745; }
    .ok { fill: #377b60; }
    .gold { fill: #926717; }
    .on { fill: #fffdf5; font-size: 13px; font-weight: bold; }
    .lineb { stroke: #176b73; stroke-width: 2.5; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #192727; }
      .panel { fill: #223333; stroke: #496160; }
      .fill-boxb { fill: #293f35; }
      .fill-boxg { fill: #293f35; }
      .fill-boxr { fill: #483336; }
      .fill-boxy { fill: #453e2b; }
      .fill-b { fill: #7ec5c5; }
      .fill-g { fill: #8fc7a2; }
      .fill-r { fill: #f39b91; }
      .fill-y { fill: #dfbd78; }
      .fill-ink { fill: #b0beb3; }
      .fill-muted { fill: #2c4040; }
      .fill-lockb { fill: #176b73; }
      .stroke-panel { stroke: #496160; }
      .stroke-axis { stroke: #b0beb3; }
      .stroke-b { stroke: #7ec5c5; }
      .stroke-g { stroke: #8fc7a2; }
      .stroke-r { stroke: #f39b91; }
      .stroke-y { stroke: #dfbd78; }
      .stroke-check { stroke: #192727; }
      .axis { stroke: #b0beb3; }
      .grid { stroke: #496160; }
      .txt { fill: #edf0e5; }
      .small { fill: #b0beb3; }
      .title { fill: #edf0e5; }
      .hi { fill: #7ec5c5; }
      .warn { fill: #f39b91; }
      .ok { fill: #8fc7a2; }
      .gold { fill: #dfbd78; }
      .on { fill: #fffdf5; }
      .lineb { stroke: #7ec5c5; }
    }
</style><rect class="bg" x="0" y="-156" width="800" height="680" /><text class="title" x="24" y="-128">BLE：MTU 谈不拢，帧就拼不齐</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① BLE：MTU 谈不拢，帧就拼不齐<animate calcMode="spline" keySplines="0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 一帧示意载荷，大约 60 字节<animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 帧头 + 长度 + 电压电流 SOC + CRC<animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="468" width="752" height="44" rx="6" /><text class="small" x="40" y="496">三片按顺序拼回 60 字节，再验 CRC。示意。</text><rect class="bg" width="800" height="460" />
  <text class="txt" x="40" y="72">一帧示意载荷，大约 60 字节</text>
  <rect class="frame" x="40" y="86" width="600" height="36" rx="4" />
  <text class="small" x="340" y="110" text-anchor="middle">帧头 + 长度 + 电压电流 SOC + CRC</text>
  <text class="txt" x="40" y="160">默认 ATT MTU = 23，有效载荷约 20 字节，切成三片通知</text>
  <rect class="piece" x="40" y="176" width="180" height="36" rx="4" />
  <rect class="piece" x="232" y="176" width="180" height="36" rx="4" />
  <rect class="piece" x="424" y="176" width="180" height="36" rx="4" />
  <text class="small" x="130" y="200" text-anchor="middle">片 1</text>
  <text class="small" x="322" y="200" text-anchor="middle">片 2</text>
  <text class="small" x="514" y="200" text-anchor="middle">片 3</text>
  <text class="no small" x="40" y="248">只收了片 1：长度对不上，先缓存，不要当完整帧
    <animate calcMode="spline" keySplines="0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="opacity" values="1;1;0;0" keyTimes="0;0.35;0.45;1" dur="8s" repeatCount="indefinite" />
  </text>
  <text class="ok" x="40" y="280" opacity="0">三片按顺序拼回 60 字节，再验 CRC
    <animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0" attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.55;0.75;1" dur="8s" repeatCount="indefinite" />
  </text>
  <text class="txt" x="40" y="328">协商到更大的 MTU 之后，片数变少，重组状态机还在</text>
  <rect class="piece" x="40" y="344" width="280" height="36" rx="4" opacity="0.3">
    <animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="0.3;0.3;1;1" keyTimes="0;0.55;0.7;1" dur="8s" repeatCount="indefinite" />
  </rect>
  <rect class="piece" x="332" y="344" width="280" height="36" rx="4" opacity="0.3">
    <animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="0.3;0.3;1;1" keyTimes="0;0.55;0.7;1" dur="8s" repeatCount="indefinite" />
  </rect>
  <text class="small" x="180" y="368" text-anchor="middle">片 1</text>
  <text class="small" x="472" y="368" text-anchor="middle">片 2</text>
  <circle r="7" cx="130" cy="194" class="fill-y">
    <animate data-ease="linear" attributeName="cx" values="130;322;514;180;472;472" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="8s" repeatCount="indefinite" />
    <animate data-ease="linear" attributeName="cy" values="194;194;194;362;362;362" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="8s" repeatCount="indefinite" />
  </circle>
  <text class="ok" x="620" y="200" opacity="1">约 20 字节<animate attributeName="opacity" values="1;0;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="spline" keySplines="0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" dur="8s" repeatCount="indefinite" /></text>
  <text class="ok" x="620" y="200" opacity="0">约 40 字节<animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="spline" keySplines="0.16 1 0.3 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" dur="8s" repeatCount="indefinite" /></text>
  <text class="ok" x="620" y="200" opacity="0">约 60 字节<animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1" dur="8s" repeatCount="indefinite" /></text>
  <text class="small" x="400" y="416" text-anchor="middle">连得上却看不到完整电压表，先查 MTU，再查分片超时有没有把半帧丢掉。</text>
  <text class="small" x="400" y="442" text-anchor="middle">厂商私有服务里往往是透传。GATT 找到特征值，只是拿到了字节管道。</text>
</svg>