</style><rect class="bg" x="0" y="-156" width="880" height="640" /><text class="title" x="24" y="-128">评估板和菊花链线束长什么样</text><rect class="panel" x="24" y="-112" width="832" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 评估板和菊花链线束长什么样<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② BQ769 评估板<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 电芯抽头从这里进<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="428" width="832" height="44" rx="6" /><text class="small" x="40" y="456">共享资源没有可转载的 BQ769 评估板或 isoSPI 线束静帧。黄点只沿这根线束走。示意。</text><rect width="880" height="420" class="bg" />
  <text x="440" y="50" text-anchor="middle" font-size="13" class="gold">示意图·待实拍</text>
  <rect x="36" y="78" width="250" height="160" rx="8" class="panel" />
  <text x="161" y="108" text-anchor="middle" font-size="15" font-weight="bold" class="txt">BQ769 评估板</text>
  <rect x="56" y="124" width="90" height="48" rx="4" class="fill-boxb stroke-b" />
  <text x="101" y="153" text-anchor="middle" font-size="12" class="txt">AFE</text>
  <rect x="166" y="124" width="96" height="48" rx="4" class="fill-muted stroke-axis" />
  <text x="214" y="153" text-anchor="middle" font-size="12" class="txt">采样座</text>
  <text x="161" y="204" text-anchor="middle" font-size="12" class="txt">电芯抽头从这里进</text>
  <rect x="594" y="78" width="250" height="160" rx="8" class="panel" />
  <text x="719" y="108" text-anchor="middle" font-size="15" font-weight="bold" class="txt">下一块从板</text>
  <rect x="614" y="124" width="90" height="48" rx="4" class="fill-boxb stroke-b" />
  <text x="659" y="153" text-anchor="middle" font-size="12" class="txt">AFE</text>
  <rect x="724" y="124" width="96" height="48" rx="4" class="fill-muted stroke-axis" />
  <text x="772" y="153" text-anchor="middle" font-size="12" class="txt">采样座</text>
  <text x="719" y="204" text-anchor="middle" font-size="12" class="txt">下一段电芯</text>
  <rect x="310" y="128" width="260" height="36" rx="6" class="fill-boxy stroke-y" />
  <text x="440" y="151" text-anchor="middle" font-size="13" class="txt">isoSPI 线束 · 变压器隔离</text>
  <circle cy="146" r="6" class="fill-y">
    <animate attributeName="cx" values="320;560;320" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite" />
  </circle>
  <text x="36" y="276" font-size="14" class="txt">左边是贴着电芯的评估板，右边是下一块从板。中间那根是菊花链，不是普通排线。</text>
  <text x="36" y="304" font-size="14" class="txt">笔记本上的 BQ20Z45 照片不是这块板。TI 演示视频里板子出镜，视频文件不进仓库。</text>
  <text x="36" y="332" font-size="14" class="txt">共享资源没有可转载的 BQ769 评估板或 isoSPI 线束静帧。黄点只沿这根线束走。</text>

</svg>