</style><rect class="bg" x="0" y="-156" width="800" height="660" /><text class="title" x="24" y="-128">示意图：锂电 4.2 V 示例不能套到这篇钠电实验上</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 示意图：锂电 4.2 V 示例不能套到这篇钠电实验上<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 4.2 V 常见满充示例<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 3.65 V 只是铁锂示例<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="448" width="752" height="44" rx="6" /><text class="small" x="40" y="476">Hijazi 等，J. Electrochem. Soc.，2023。层状氧化物 / 硬碳软包。示意。</text><rect width="800" height="440" class="bg" />
  <rect x="16" y="52" width="410" height="250" rx="8" class="panel" />
  <text x="32" y="78" font-size="15" font-weight="bold" class="txt">液态锂电示例</text>
  <line x1="48" y1="210" x2="48" y2="110" class="stroke-axis" />
  <line x1="48" y1="210" x2="360" y2="210" class="stroke-axis" />
  <text x="56" y="126" font-size="12" class="txt">4.2 V 常见满充示例</text>
  <line x1="48" y1="130" x2="200" y2="130" class="stroke-r" />
  <text x="56" y="168" font-size="12" class="txt">3.65 V 只是铁锂示例</text>
  <text x="32" y="246" font-size="13" class="txt">保护板默认档跟着这张表走。</text>
  <text x="32" y="270" font-size="13" class="txt">它不是钠离子的红线。</text>

  <rect x="444" y="52" width="340" height="250" rx="8" class="panel" />
  <text x="460" y="78" font-size="15" font-weight="bold" class="txt">一篇软包实验（不是通用规格）</text>
  <line x1="476" y1="210" x2="476" y2="110" class="stroke-axis" />
  <line x1="476" y1="210" x2="768" y2="210" class="stroke-axis" />
  <line x1="476" y1="150" x2="700" y2="150" class="stroke-g" />
  <text x="486" y="144" font-size="12" class="txt">3.80 V：该实验里保持更好</text>
  <line x1="476" y1="120" x2="760" y2="120" class="stroke-r" />
  <text x="486" y="114" font-size="12" class="warn">4.00 V：正极副反应更重</text>
  <circle cx="500" cy="150" r="6" class="fill-y">
    <animate attributeName="cy" values="168;120;168" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite" />
  </circle>
  <text x="460" y="246" font-size="13" class="txt">条件写在论文里：C/5，40°C。</text>
  <text x="460" y="270" font-size="13" class="txt">黄点在两条线之间移动。</text>

  <text x="16" y="336" font-size="14" class="txt">Hijazi 等，J. Electrochem. Soc.，2023。层状氧化物 / 硬碳软包。大于 C/2 时该文报告有金属钠析出。</text>
  <text x="16" y="364" font-size="14" class="txt">另一篇全电池的 OCV 可以比对照锂电更陡。不要写「钠电平台一律更平」。</text>
  <text x="16" y="398" font-size="14" class="gold">示意图，不是电芯照片。没有这颗电芯的手册，就不要充。</text>
</svg>