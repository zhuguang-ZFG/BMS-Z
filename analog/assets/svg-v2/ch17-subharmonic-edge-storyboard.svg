<rect x="20" y="388" width="450" height="300" rx="10" fill="#fdf8ea" stroke="#c9bb9d" stroke-width="1.2"/>
<g data-storyboard-beat="一宽一窄" transform="translate(47 402) scale(0.4129)"><rect x="56" y="92" width="380" height="120" rx="12" fill="#f6eedb" stroke="#c9bb9d" stroke-width="1.4"/>
