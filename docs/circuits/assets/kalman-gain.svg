  <text class="hi" x="120" y="204">蓝 R=0.001</text>
  <text class="warn" x="250" y="204">红 R=0.020</text>
  <text class="ok" x="390" y="204">绿 Q×4</text>
  <line class="axis" x1="560.0" y1="250.0" x2="560.0" y2="390.0"/>
  <line class="axis" x1="560.0" y1="390.0" x2="760.0" y2="390.0"/>
  <polyline class="lineg" points="560.0,369.1 565.1,366.6 570.3,364.3 575.4,362.2 580.5,360.1 585.6,358.1 590.8,356.0 595.9,354.0 601.0,352.0 606.2,350.0 611.3,347.9 616.4,345.9 621.5,343.9 626.7,341.9 631.8,339.9 636.9,337.8 642.1,335.8 647.2,333.8 652.3,331.8 657.4,329.8 662.6,327.7 667.7,325.7 672.8,323.7 677.9,321.7 683.1,319.7 688.2,317.6 693.3,315.6 698.5,313.6 703.6,311.6 708.7,309.6 713.8,307.5 719.0,305.5 724.1,303.5 729.2,301.5 734.4,299.4 739.5,297.3 744.6,295.2 749.7,293.0 754.9,290.7 760.0,288.0" stroke-linejoin="round" stroke-linecap="round"/>
  <text class="small" x="560" y="246">平台 OCV 示意</text>
  <text class="small" x="560" y="414">0.50 处 0.75 mV/1%</text>
  <rect class="panel" x="24" y="468" width="752" height="72" rx="6"/>
  <text class="small" x="40.0" y="498.0" text-anchor="start" opacity="1">步 1/40 · K(R=0.001) 0.9758 · P 9.76e-04 · K(R=0.020) 0.6689（示意）<animate attributeName="opacity" values="1;0;0;0;0;0;0" keyTimes="0;0.1667;0.3333;0.5000;0.6667;0.8333;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="498.0" text-anchor="start" opacity="0">步 2/40 · K(R=0.001) 0.5791 · P 5.79e-04 · K(R=0.020) 0.4079（示意）<animate attributeName="opacity" values="0;1;0;0;0;0;0" keyTimes="0;0.1667;0.3333;0.5000;0.6667;0.8333;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="498.0" text-anchor="start" opacity="0">步 3/40 · K(R=0.001) 0.4947 · P 4.95e-04 · K(R=0.020) 0.2997（示意）<animate attributeName="opacity" values="0;0;1;0;0;0;0" keyTimes="0;0.1667;0.3333;0.5000;0.6667;0.8333;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="498.0" text-anchor="start" opacity="0">步 6/40 · K(R=0.001) 0.4641 · P 4.64e-04 · K(R=0.020) 0.1855（示意）<animate attributeName="opacity" values="0;0;0;1;0;0;0" keyTimes="0;0.1667;0.3333;0.5000;0.6667;0.8333;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="498.0" text-anchor="start" opacity="0">步 11/40 · K(R=0.001) 0.4633 · P 4.63e-04 · K(R=0.020) 0.1432（示意）<animate attributeName="opacity" values="0;0;0;0;1;0;0" keyTimes="0;0.1667;0.3333;0.5000;0.6667;0.8333;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="498.0" text-anchor="start" opacity="0">步 40/40 · K(R=0.001) 0.4633 · P 4.63e-04 · K(R=0.020) 0.1318（示意）<animate attributeName="opacity" values="0;0;0;0;0;1;0" keyTimes="0;0.1667;0.3333;0.5000;0.6667;0.8333;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40" y="530">Q=0.0004、两档 R 是一维示意。绿线把 Q 提到 0.0016，末步 K=0.697。不是 code/soc 里 EKF 的调参。</text>

</svg>
