    - 纸雕层高不得编码数值；量值只由 SVG overlay 的坐标轴与标签编码
    - 标注引线不得跨过主体，改走画幅边距
    - 重点色（柿子橙）只落在纸白区，不得压在石板灰阴影层上
    - 多条曲线靠线宽/虚实/形状区分，不得只靠颜色（墨↔重点仅 2.37:1）
  blocked_until: >-
    V3 定量图 6 张与 V5 流程／决策图 7 张共 13/24 = 54%（分母为套用后的 24 个视觉；
    若只算本轮 10 个可套用新增点位则是 V3 3 ＋ V5 3 = 6/10 = 60%），正是 FF-015 本轮失分处
    （事实精度 3/5、印刷可读性 2/5、构图层级 3/5）。灰度夹具已完成（上列 gray_gate 实测），
    剩余一项：用 FF-015 重出 ch17-i2c-rise-time-budget / ch17-thermal-chain-audit /
    ch17-prior-cost-matrix 三张定量底图并逐张附灰度对照，静态 5 项复评每项 ≥4。
    原第①项已完成（2026-11-05）：四条规矩落成 check_visual_manifest.py 的
    quant_rules 五字段（layer_encodes_value / value_channel / leader_route /
    accent_on / series_distinguisher，只对 style_id=FF-015 且 type∈{V3,V5} 的
    非 legacy 条目强制），并写进 visual/quality-rubric.md；夹具 22 项见
    scripts/test_visual_manifest.py。
