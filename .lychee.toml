# lychee 链接巡检配置。
#
# 背景（2026-10 实测核实）：本仓库外链全部可达，但不少站点对
# 非浏览器 UA、机房 IP 或 HTTP/2 握手返回"假死"——裸跑检查器全是误报。
# 每个被排除/放行的站点都先核实过"链接本身活着"，只放行假死，不洗白真死链：
#
#   nxp.com      对 bot 一律返回 404（连根域名都是）→ 只能整体排除
#   zhihu.com    403          mdpi.com   403
#   oshwhub.com  418          infineon   403（知识库）
#   bilibili.com 412          → 接受该状态码（见下）
#   analog.com   HTTP/2 传输层报错（含 ez.analog.com）→ 整体排除（见下）
#   eet-china.com HTTP/2 传输层报错                    → 整体排除（见下）
#
# 412 的判据：GitHub runner（Azure 机房 IP）对 6 条 B 站视频链接全部返回
# 412，而同样 URL 从家宽 IP 用浏览器 UA 与 bot UA 都返回 200——即纯按
# 来源 IP 拦截，不是链接失效。B 站从不用 412 表示"视频不存在"（那是 404
# 或 -404 业务码），所以接受 412 不会掩盖真实的死链。
#
# HTTP/2 传输错误的判据：lychee（hyper 客户端）对这些站点握手 HTTP/2 时报
# "Server may not support HTTP/2 properly"。这是传输层错误，上面的 accept
# 状态码管不到；lychee 又没有强制 HTTP/1.1 的配置项，只能整体排除。存活
# 证据（2026-10-04）：
#   analog.com / ez.analog.com：curl 走 HTTP/1.1 实测 200/302（官网产品页）。
#   eet-china.com：经第三方 reader（r.jina.ai）服务端取回 a179929 全文
#     200（约 40KB，标题/正文与引用一致），确认是在版文章；本机与本地代理
#     出口被其 Akamai 边缘拒连（TCP 超时），runner 可完成 TLS 握手；仅其
#     HTTP/2 与 hyper 不合。analog\.com 同时覆盖 ez 子域。
#
#
# catarc.org.cn 全站 502 宕机（2026-10-04 三次探测：首页与文件 URL、HTTP/HTTPS
# 均 502，Server: CTW 网关）——注意这与上面的"假死"不同，是源站临时不可用，
# 属临时豁免而非放行假死：书单里 GB/T 征求意见稿链接保留待恢复；站点恢复后
# 应移除本排除并重新巡检（对应注记在 BMS书籍清单.md"六、免费资源"节）。
#
# 当当/深圳图书馆 OPAC（2026-10-04 核实）：runner 侧分别报 405/TIMEOUT，
# 本机家宽浏览器 UA 实测均 200（当当 126KB 商品页、深图 OPAC 3s 返回）——
# 按来源 IP/方法拦截的假死，不是死链（谭晓军书目来源，BMS书籍清单.md 条目 14）。
# 深图判据补充：OPAC 正常响应就要 3s+，属慢站；runner 跨境链路在其 WAF 下
# 更易触达 timeout=20——不是偶发抖动，勿因"看着像超时"而移除本排除。
#
# 注意：排除的站点不再被巡检，若日后其中某个真的关停，这里发现不了——
# 复查时人工点一下这几条即可（README"维护"节）。

# st.com（2026-10-04 实测）：runner 侧报 "HTTP/2 protocol error. Server may not
# support HTTP/2 properly"——与 analog/eet-china 同类的 hyper 客户端不合（上游
# #2264）；本机 curl 实测 200，页面标题为 "L9963E | Product - STMicroelectronics"
# （所引芯片的官方产品页）——假死，链接真实在版。
# e2e.ti.com（2026-10-04 实测）：runner 间歇超时（run 37207172863 三处引用全
# TIMEOUT、run 37208927588 全部通过），本机跨境出口 TCP 被重置——Akamai 对
# 机房 IP 不稳定的假死，非死链；只豁免 e2e 子域，ti.com 产品页继续受检。
# ptacts.uspto.gov（2026-10-05 实测）：runner 侧 TIMEOUT（run 后链接巡检唯一失败
# 项），本机裸 curl 403、浏览器 UA 200（artifact 下载页真实在版）——按 UA/来源
# 拦截的假死，与 zhihu/mdpi 同类；只豁免 ptacts 子域（Dhameja 书目来源，
# BMS书籍清单.md 条目 22）。
# batterydesign.net（2026-10-05 实测）：runner 侧 TLS handshake failed（传输层，
# accept 状态码管不到），本机浏览器 UA curl 403——按 UA/来源拦截的假死，非死链
# （bms-resources.md 三条引用：通信架构综述/功能安全/§7 速查表）。与 st.com 同类。
# doc.embedfire.com（2026-10-05 实测）：runner 侧 TIMEOUT（run 37342319536，
# docs/bms-resources.md 与 stage-5 共三处同一 URL），页面标题仍可公开解析
# （「40. CAN—通讯实验 — [野火]STM32 HAL库开发实战指南——基于H750_Pro_V 文档」）
# ——假死/慢站，不是死链；正文 markdown 链接保留。只豁免 doc 子域。
# README 维护节 / T2 月度人工复查覆盖被排除域名。
accept = ["200..=299", "401", "403", "412", "418", "429"]
exclude = ['nxp\.com', 'analog\.com', 'eet-china\.com', 'catarc\.org\.cn', 'dangdang\.com', 'szlib\.org\.cn', 'st\.com', 'e2e\.ti\.com', 'ptacts\.uspto\.gov', 'batterydesign\.net', 'doc\.embedfire\.com']

timeout = 20
retry_wait_time = 4
max_retries = 3
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
max_concurrency = 8
