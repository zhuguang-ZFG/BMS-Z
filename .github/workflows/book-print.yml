name: book-print

# 卷 I 16K 印刷版流水线（迁自 analog/.github/workflows/book-print.yml）。
# 触发路径限定 analog/**；Pages 不发布 16K，产物只进 artifact。
on:
  push:
    branches-ignore: [main]
    paths: ["analog/**", ".github/workflows/book-print.yml"]
  pull_request:
    paths: ["analog/**", ".github/workflows/book-print.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bms-z-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  print16k:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            analog/requirements.txt
            analog/analog-book/requirements.txt
      - run: pip install -r analog/requirements.txt -r analog/analog-book/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('analog/analog-book/requirements.txt') }}
      - run: python -m playwright install --with-deps chromium
      - name: 站点构建（卷 I）
        working-directory: analog
        run: python scripts/build_site.py --build
      - name: 16K 单元、装配与真实内容
        working-directory: analog
        run: python -B -m unittest discover -s analog-book/tests -p "test_book_*.py" -v
      - name: 16K 发布器测试
        working-directory: analog
        run: python -B -m unittest discover -s scripts -p "test_publish_book.py" -v
      - name: 安装 ngspice 与中文字体
        if: github.event_name != 'pull_request'
        run: sudo apt-get update && sudo apt-get install -y ngspice fonts-noto-cjk
      - name: SPICE 回归
        if: github.event_name != 'pull_request'
        working-directory: analog
        env:
          BOOK_REQUIRE_NGSPICE: "1"
        run: python -B -m unittest discover -s analog-book/tests -p "test_spice.py" -v
      - name: 16K HTML
        working-directory: analog
        run: python analog-book/build_print_book.py --no-build
      - name: 16K 产物审计
        working-directory: analog
        run: python analog-book/build_print_book.py --check --no-build
      - name: 16K 样张
        if: github.event_name != 'pull_request'
        working-directory: analog
        run: python analog-book/build_print_book.py --sample
      - name: 16K 内文上下卷
        if: github.event_name != 'pull_request'
        working-directory: analog
        run: python analog-book/build_print_book.py --volumes --pdf --no-build
      # --volumes 暂不支持 --cover/--report；封面前提是单卷页数，
      # 整书超过 700 页硬上限后必须按上下卷分别出 PDF。
      - name: 16K 浏览器离线回归
        working-directory: analog
        run: python -B -m unittest discover -s analog-book/tests -p "test_browser_print_book.py" -v
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: analog-circuit-book-16k-draft
          path: analog/analog-book/dist/print/
          retention-days: 14
