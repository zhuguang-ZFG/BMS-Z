<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" role="img" aria-labelledby="ttl">
<title id="ttl">比较器迟滞：正反馈造出 1V「免疫区」（LM393，R1=R2=10k）</title>
<desc>比较器迟滞：正反馈造出 1V「免疫区」（LM393，R1=R2=10k）；节拍：① 基准 2.5V；R3 把输出状态「拽」回 IN+——阈值随输出而变；② 输出低时阈值被抬到 3V：输入必须升过 3V 才翻转；③ 输出高时阈值被压到 2V：输入必须跌破 2V 才翻回；④ 噪声在 1V 窗口里随便闹——输出纹丝不动</desc>
