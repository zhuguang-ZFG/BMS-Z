  <text x="540" y="120" font-size="13" fill="#1e293b">3RC ≈ 0.51 s</text>
  <text x="540" y="144" font-size="13" fill="#1e293b">I0 ≈ 2.4 A</text>
  <text x="540" y="168" font-size="13" fill="#1e293b">E = 80 J</text>
  <text x="400" y="310" text-anchor="middle" font-size="14" fill="#b45309" opacity="1">空电容直接合主闸：冲击只受毫欧限制
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.25;0.4;1" dur="8s" repeatCount="indefinite"/>
  </text>
  <text x="400" y="340" text-anchor="middle" font-size="14" fill="#065f46" opacity="0">爬到接近包压再合主闸。超时上不来就停住。
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.35;0.5;1" dur="8s" repeatCount="indefinite"/>
  </text>
  <text x="400" y="400" text-anchor="middle" font-size="13" fill="#475569">电阻上的热是这一次 ½CU²，不是连续功率。</text>

