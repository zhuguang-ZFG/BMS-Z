</style><rect class="bg" x="0" y="-156" width="800" height="796" /><text class="title" x="24" y="-128">过充保护现场：电压越线 → DW01 拉低 OC → 充电 MOS 断开</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 过充保护现场：电压越线 → DW01 拉低 OC → 充电 MOS 断开<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 过充阈值 4.30V<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 比较器 + 内部延时<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect width="800" height="640" class="bg" />
  <rect x="90" y="80" width="80" height="240" fill="none" stroke-width="2.5" class="stroke-axis" />
  <rect x="93" y="176" width="74" height="141" fill="#3b82f6" opacity="0.85">
    <animate attributeName="height" values="141;206;206;153" keyTimes="0;0.5;0.65;1" dur="8s" repeatCount="indefinite" />
    <animate attributeName="y" values="176;111;111;164" keyTimes="0;0.5;0.65;1" dur="8s" repeatCount="indefinite" />
    <animate attributeName="fill" values="#60a5fa;#f87171;#f87171;#60a5fa" keyTimes="0;0.42;0.65;1" dur="8s" repeatCount="indefinite" />
  </rect>
  
  <line x1="80" y1="118" x2="180" y2="118" stroke-width="2" stroke-dasharray="6 4" class="stroke-r" />
  <text x="185" y="122" font-size="12" class="warn">过充阈值 4.30V</text>
  <text x="130" y="345" text-anchor="middle" font-size="13" class="txt">电池电压</text>

  
