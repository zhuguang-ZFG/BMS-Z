<text x="52" y="58" font-size="38" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">桥式整流：峰值到手里还剩多少</text><text x="52" y="94" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">12 Vrms 不是 12 V 直流。峰值先扣两只管压降，再扣半个纹波，剩下的才归负载。</text>
<rect x="50" y="130" width="900" height="150" rx="6" fill="#f6eedb" stroke="#1f5d7a" stroke-width="2"/>
<rect class="ink-echo" x="50" y="130" width="900" height="150" rx="6" stroke="#1f5d7a" stroke-width="2" fill="none" opacity="0.32" transform="translate(1.49 -0.90) rotate(-0.02 500.0 205.0)"/>
<text x="76" y="170" font-size="24" fill="#1f5d7a" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">空载：电流很小，管压降也小</text>
<text x="76" y="212" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">副边峰值 12 × √2</text>
<text x="926" y="214" font-size="26" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="end">17.0 V</text>
<text x="76" y="252" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">两只管子各约 0.6~0.7 V，串联扣 1.3 V，剩</text>
<text x="926" y="254" font-size="26" fill="#1f5d7a" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="end">15.7 V</text>
<rect x="50" y="300" width="900" height="186" rx="6" fill="#f6eedb" stroke="#3d6b4a" stroke-width="2"/>
<rect class="ink-echo" x="50" y="300" width="900" height="186" rx="6" stroke="#3d6b4a" stroke-width="2" fill="none" opacity="0.32" transform="translate(1.04 0.97) rotate(0.07 500.0 393.0)"/>
<text x="76" y="340" font-size="24" fill="#3d6b4a" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">带载 1 A：管压降升高，还要再扣半个纹波</text>
<text x="76" y="382" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">管压降升到 0.9 V，两只串联扣</text>
<text x="926" y="384" font-size="26" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="end">1.8 V</text>
<text x="76" y="420" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">现有 4700 µF、50 Hz，纹波 1 ÷ (2 × 50 × 4700 µF)</text>
<text x="926" y="422" font-size="26" fill="#a4630f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="end">2.13 V</text>
<path d="M82 444 Q501.00 441.54 920 444" fill="none" stroke="#c9bb9d" stroke-width="2"/>
<text x="76" y="474" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">17.0 − 1.8 − 半个纹波，平均输出</text>
<text x="926" y="476" font-size="26" fill="#3d6b4a" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="end">14.1 V</text>
<rect x="50" y="506" width="430" height="118" rx="6" fill="#f6eedb" stroke="#a4630f" stroke-width="2"/>
