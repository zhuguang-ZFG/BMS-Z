</style><rect class="bg" x="0" y="-156" width="800" height="732" /><text class="title" x="24" y="-128">P = I²·R：电流翻倍，发热四倍</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① P = I²·R：电流翻倍，发热四倍<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② R_DS(on) = 5mΩ（示例）<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ I ×2 → P ×4（平方关系）<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect width="800" height="576" class="bg" />
  <rect x="110" y="56" width="80" height="70" fill="#bfdbfe" stroke-width="2" class="stroke-axis">
    <animate attributeName="fill" values="#172554;#172554;#b91c1c;#b91c1c;#b91c1c" keyTimes="0;0.25;0.35;0.5;1" dur="12s" repeatCount="indefinite" />
  </rect>
  <line x1="95" y1="91" x2="110" y2="91" stroke-width="2.5" class="stroke-axis" />
  <line x1="150" y1="26" x2="150" y2="56" stroke-width="2.5" class="stroke-axis" />
  <line x1="150" y1="126" x2="150" y2="156" stroke-width="2.5" class="stroke-axis" />
  <text x="86" y="95" text-anchor="middle" font-size="12" class="small">G</text>
  <text x="164" y="34" text-anchor="start" font-size="12" class="small">D</text>
  <text x="164" y="152" text-anchor="start" font-size="12" class="small">S</text>
  <text x="150" y="168" text-anchor="middle" font-size="13" font-weight="bold" class="hi">I = 10A
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.23;0.26;1" dur="12s" repeatCount="indefinite" />
  </text>
  <text x="150" y="188" text-anchor="middle" font-size="13" font-weight="bold" opacity="0" class="warn">I = 20A
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.27;0.3;1" dur="12s" repeatCount="indefinite" />
  </text>
  <text x="150" y="210" text-anchor="middle" font-size="12" class="small">R_DS(on) = 5mΩ（示例）</text>

  
  <text x="340" y="18" text-anchor="middle" font-size="14" font-weight="bold" opacity="0" class="txt">I ×2 → P ×4（平方关系）
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3;0.34;1" dur="12s" repeatCount="indefinite" />
  </text>
  <line x1="270" y1="206" x2="450" y2="206" stroke-width="1.5" class="stroke-axis" />
  <rect x="295" y="176" width="50" height="0" class="fill-y">
    <animate attributeName="height" values="0;0;30;30" keyTimes="0;0.05;0.2;1" dur="12s" repeatCount="indefinite" />
    <animate attributeName="y" values="206;206;176;176" keyTimes="0;0.05;0.2;1" dur="12s" repeatCount="indefinite" />
  </rect>
  <rect x="385" y="86" width="50" height="0" class="fill-r">
    <animate attributeName="height" values="0;0;120;120" keyTimes="0;0.28;0.45;1" dur="12s" repeatCount="indefinite" />
    <animate attributeName="y" values="206;206;86;86" keyTimes="0;0.28;0.45;1" dur="12s" repeatCount="indefinite" />
  </rect>
  <text x="320" y="168" text-anchor="middle" font-size="12" font-weight="bold" opacity="0" class="gold">0.5W
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.18;0.22;1" dur="12s" repeatCount="indefinite" />
  </text>
  <text x="410" y="78" text-anchor="middle" font-size="13" font-weight="bold" opacity="0" class="warn">2W
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.43;0.47;1" dur="12s" repeatCount="indefinite" />
  </text>
  <text x="320" y="224" text-anchor="middle" font-size="12" class="small">10A</text>
  <text x="410" y="224" text-anchor="middle" font-size="12" class="small">20A</text>

  
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.55;1" dur="12s" repeatCount="indefinite" />
    <circle cx="640" cy="56" r="34" stroke-width="2" class="fill-boxr stroke-r" />
    <text x="640" y="61" text-anchor="middle" font-size="12" font-weight="bold" class="warn">温度↑</text>
    <circle cx="720" cy="146" r="34" stroke-width="2" class="fill-boxr stroke-r" />
    <text x="720" y="151" text-anchor="middle" font-size="12" font-weight="bold" class="warn">电阻↑</text>
    <circle cx="560" cy="146" r="34" stroke-width="2" class="fill-boxr stroke-r" />
    <text x="560" y="151" text-anchor="middle" font-size="12" font-weight="bold" class="warn">发热↑</text>
    <path d="M662,84 L694,118" fill="none" stroke-width="2" class="stroke-r" />
    <path d="M686,146 L594,146" fill="none" stroke-width="2" class="stroke-r" />
    <path d="M586,118 L618,84" fill="none" stroke-width="2" class="stroke-r" />
    <circle r="5" class="fill-r">
      <animateMotion path="M640,56 L720,146 L560,146 L640,56" calcMode="linear" dur="12s" repeatCount="indefinite" />
    </circle>
    <text x="640" y="214" text-anchor="middle" font-size="12" class="warn">正温系数：越热阻越大，发热更多</text>
  </g>

  
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.72;0.76;1" dur="12s" repeatCount="indefinite" />
    <rect x="60" y="256" width="165" height="46" rx="6" stroke-width="1.5" class="fill-boxb stroke-b" />
    <text x="142" y="275" text-anchor="middle" font-size="12" font-weight="bold" class="hi">多颗并联分流</text>
    <text x="142" y="292" text-anchor="middle" font-size="12" class="small">热的那颗阻大自动让流</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.77;0.81;1" dur="12s" repeatCount="indefinite" />
    <rect x="240" y="256" width="165" height="46" rx="6" stroke-width="1.5" class="fill-boxb stroke-b" />
    <text x="322" y="275" text-anchor="middle" font-size="12" font-weight="bold" class="hi">加铜皮 / 散热</text>
    <text x="322" y="292" text-anchor="middle" font-size="12" class="small">把热导出去</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.86;1" dur="12s" repeatCount="indefinite" />
    <rect x="420" y="256" width="165" height="46" rx="6" stroke-width="1.5" class="fill-boxb stroke-b" />
    <text x="502" y="275" text-anchor="middle" font-size="12" font-weight="bold" class="hi">按高温阻值选型</text>
    <text x="502" y="292" text-anchor="middle" font-size="12" class="small">别看手册首页 25℃ 的数</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.87;0.91;1" dur="12s" repeatCount="indefinite" />
    <rect x="600" y="256" width="165" height="46" rx="6" stroke-width="1.5" class="fill-boxb stroke-b" />
    <text x="682" y="275" text-anchor="middle" font-size="12" font-weight="bold" class="hi">限持续电流</text>
    <text x="682" y="292" text-anchor="middle" font-size="12" class="small">靠降额避开长时间大电流</text>
  </g>

  <text x="400" y="350" text-anchor="middle" font-size="13" class="small">关键：发热随电流平方涨，温度又反过来抬高电阻——会自我放大，选型按最坏工况。</text>
<rect x="24" y="374.0" width="752" height="188" rx="6" class="panel" /><text x="40" y="394.0" font-size="13" class="txt">底栏：P = I² × 5 mΩ。20 A → 2.00 W，40 A → 8.00 W</text><text x="40" y="410.0" font-size="12" class="small">发热 W</text><line x1="70.0" y1="410.0" x2="70.0" y2="524.0" stroke-width="1.5" class="stroke-axis" /><line x1="70.0" y1="524.0" x2="460.0" y2="524.0" stroke-width="1.5" class="stroke-axis" /><line x1="70.0" y1="524.0" x2="70.0" y2="529.0" class="stroke-axis" /><text x="70.0" y="542.0" text-anchor="middle" font-size="12" class="small">0</text><line x1="265.0" y1="524.0" x2="265.0" y2="529.0" class="stroke-axis" /><text x="265.0" y="542.0" text-anchor="middle" font-size="12" class="small">20</text><line x1="460.0" y1="524.0" x2="460.0" y2="529.0" class="stroke-axis" /><text x="460.0" y="542.0" text-anchor="middle" font-size="12" class="small">40</text><line x1="65.0" y1="517.7" x2="70.0" y2="517.7" class="stroke-axis" /><text x="62.0" y="521.7" text-anchor="end" font-size="12" class="small">0.5</text><line x1="65.0" y1="498.7" x2="70.0" y2="498.7" class="stroke-axis" /><text x="62.0" y="502.7" text-anchor="end" font-size="12" class="small">2</text><line x1="65.0" y1="422.7" x2="70.0" y2="422.7" class="stroke-axis" /><text x="62.0" y="426.7" text-anchor="end" font-size="12" class="small">8</text><polyline points="70.0,524.0 79.8,523.9 89.5,523.7 99.2,523.4 109.0,523.0 118.8,522.4 128.5,521.7 138.2,520.9 148.0,519.9 157.8,518.9 167.5,517.7 177.2,516.3 187.0,514.9 196.8,513.3 206.5,511.6 216.2,509.8 226.0,507.8 235.8,505.7 245.5,503.5 255.2,501.1 265.0,498.7 274.8,496.1 284.5,493.3 294.2,490.5 304.0,487.5 313.8,484.4 323.5,481.2 333.2,477.8 343.0,474.3 352.8,470.7 362.5,467.0 372.2,463.1 382.0,459.1 391.8,455.0 401.5,450.8 411.2,446.4 421.0,441.9 430.8,437.3 440.5,432.5 450.2,427.7 460.0,422.7" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" class="stroke-r" /><circle r="5" class="fill-y"><animate attributeName="cx" values="70.0;118.8;167.5;216.2;265.0;313.8;362.5;411.2;460.0" keyTimes="0.0000;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1.0000" dur="8s" repeatCount="indefinite" /><animate attributeName="cy" values="524.0;522.4;517.7;509.8;498.7;484.4;467.0;446.4;422.7" keyTimes="0.0000;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1.0000" dur="8s" repeatCount="indefinite" /></circle><text x="479.4" y="542.0" text-anchor="start" font-size="12" class="small">电流 A</text><text x="480" y="452.0" font-size="12" class="txt">电流翻倍，功率变四倍。开口向上。</text>
</svg>