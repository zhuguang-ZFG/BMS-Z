<text x="92" y="1036" fill="#2a2927" font-size="33" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">RSS 约 0.5LSB：几毛钱的 4066 加 10nF 与一级缓冲就够 12 位。</text></svg>
