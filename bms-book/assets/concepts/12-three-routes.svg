<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">SOC 的三条路</title>
  <desc id="desc">浅灰虚线夹出的窄通道代表真实轨迹，横轴是 238 小时工况。普鲁士蓝直线从通道内持续上飘、末端出带被打叉；赭黄折线随之上飘、到四面小旗处垂直折回带内；青绿锯齿始终缠绕通道。四条路线不含任何数字与文字。</desc>
