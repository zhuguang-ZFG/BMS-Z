<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">达林顿管：β 相乘的机理与三笔代价——1.4V 门槛、0.9V 饱和地板、µs 级关断</title>
<desc id="figDesc">左面板画两级 NPN 级联的电流链：IB1 经第一级放大为 IE1=(1+β1)·IB1，直接灌进第二级基极，IC2=β2·(1+β1)·IB1，所以 β_total≈β1×β2，可达 10000+。右面板是三笔代价卡片：①VBE 翻倍到 1.4V，3.3V 系统里不可忽略；②VCE(sat) 升到约 0.9V，因为第二级集电结被钳在 VBE2−VCE1(sat)≈0.7−0.2=0.5V 的正偏边缘，饱和地板等于 VCE1(sat)+VBE2≈0.9V，换型号也没用；③速度慢，ULN2003 传播延迟在 µs 级，开关频率上 10kHz、边沿延迟占周期超过 5% 就该换 MOSFET。底部对比条：TIP120 驱动 2A 负载仅导通压降就耗 0.9×2=1.8W（必须上散热器），同场景换 RDS(on)=50mΩ 的 MOSFET 只耗 0.2W；旁注 ULN2003 单路 500mA 是峰值定额，7 路全开按每路 150~200mA 估算，5 路各带 200mA 的压降功耗 5×0.9V×0.2A=0.9W。</desc>
<rect width="960" height="640" fill="#fffdf8"/>

<text x="36" y="48" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="28" font-weight="700" fill="#14213d">达林顿：β 相乘的免费午餐，三张账单</text>
<text x="36" y="76" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="15" fill="#52606d">两级 NPN 级联换来 β_total=β1×β2（可达 10000+），代价全写在右边三张卡片上。</text>
<line x1="36" y1="94" x2="924" y2="94" stroke="#14213d" stroke-width="2"/>

<defs>
<marker id="arrD" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="#0f766e"/></marker>
<marker id="arrR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="#b42318"/></marker>
</defs>

<!-- 左面板：β 相乘链 -->
<g transform="rotate(-0.4 232 300)">
<rect x="36" y="112" width="392" height="360" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/>
<rect x="43" y="119" width="378" height="346" rx="4" fill="none" stroke="#d0d5dd" stroke-width="1"/>
<text x="56" y="146" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="16" font-weight="700" fill="#0f766e">β 怎么乘起来：一股基流的两次放大</text>

<!-- Q1 -->
<rect x="76" y="172" width="120" height="96" rx="8" fill="#e6f6f2" stroke="#0f766e" stroke-width="1.6"/>
<text x="136" y="200" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="15" font-weight="700" fill="#14213d">Q1</text>
<text x="136" y="222" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12" fill="#52606d">第一级 NPN</text>
<text x="136" y="242" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12" fill="#52606d">β1</text>
<!-- Q2 -->
<rect x="268" y="172" width="120" height="96" rx="8" fill="#e6f6f2" stroke="#0f766e" stroke-width="1.6"/>
<text x="328" y="200" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="15" font-weight="700" fill="#14213d">Q2</text>
<text x="328" y="222" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12" fill="#52606d">第二级 NPN</text>
<text x="328" y="242" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12" fill="#52606d">β2</text>

<!-- 电流链箭头 -->
<line x1="48" y1="220" x2="72" y2="220" stroke="#0f766e" stroke-width="2" marker-end="url(#arrD)"/>
<text x="48" y="208" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" font-weight="700" fill="#0f766e">IB1</text>
<line x1="200" y1="220" x2="264" y2="220" stroke="#0f766e" stroke-width="2" marker-end="url(#arrD)"/>
<text x="232" y="208" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" font-weight="700" fill="#0f766e">IE1=(1+β1)·IB1</text>
<text x="232" y="240" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="10.5" fill="#52606d">Q1 射流直灌 Q2 基极</text>

<!-- 结论框 -->
<rect x="56" y="292" width="352" height="76" rx="6" fill="#fdf3e3" stroke="#b45309" stroke-width="1.6"/>
<text x="232" y="322" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="14" font-weight="700" fill="#b45309">IC2 = β2·(1+β1)·IB1</text>
<text x="232" y="348" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="14" font-weight="700" fill="#b45309">β_total ≈ β1×β2，可达 10000+</text>

<text x="56" y="400" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" fill="#52606d">集成件还内置泄放电阻（TIP120 的 B-E 间</text>
<text x="56" y="420" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" fill="#52606d">约 8kΩ/12kΩ 两只）：给 Q2 基区电荷留泄放</text>
<text x="56" y="440" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" fill="#52606d">回路——副作用是驱动电压低于约 1V 时</text>
<text x="56" y="460" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" fill="#52606d">可能开不起来。</text>
</g>

<!-- 右面板：三笔代价 -->
<g transform="rotate(0.4 682 300)">
<rect x="452" y="112" width="472" height="360" rx="6" fill="#ffffff" stroke="#b42318" stroke-width="1.8"/>
<rect x="459" y="119" width="458" height="346" rx="4" fill="none" stroke="#d0d5dd" stroke-width="1"/>
<text x="472" y="146" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="16" font-weight="700" fill="#b42318">三笔代价：结构决定，换型号也没用</text>

<!-- 卡片 1 -->
<rect x="472" y="164" width="432" height="84" rx="6" fill="#fdf3e3" stroke="#b45309" stroke-width="1.4"/>
<text x="488" y="192" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="14" font-weight="700" fill="#b45309">① VBE 翻倍到 1.4V</text>
<text x="488" y="216" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" fill="#52606d">两个发射结串联，3.3V 系统里这一口就吃掉</text>
<text x="488" y="234" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" fill="#52606d">四成多的驱动电压，不可忽略。</text>

<!-- 卡片 2 -->
<rect x="472" y="260" width="432" height="104" rx="6" fill="#fdf3e3" stroke="#b45309" stroke-width="1.4"/>
<text x="488" y="288" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="14" font-weight="700" fill="#b45309">② VCE(sat)≈0.9V 的饱和地板</text>
<text x="488" y="312" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" fill="#52606d">Q2 集电结被钳在 VBE2−VCE1(sat)≈0.7−0.2=0.5V</text>
<text x="488" y="330" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" fill="#52606d">的正偏边缘，永远进不了深饱和；地板就是</text>
<text x="488" y="348" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" fill="#52606d">VCE1(sat)+VBE2≈0.9V——1A 时白烧 0.9W。</text>

<!-- 卡片 3 -->
<rect x="472" y="376" width="432" height="84" rx="6" fill="#fdf3e3" stroke="#b45309" stroke-width="1.4"/>
<text x="488" y="404" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="14" font-weight="700" fill="#b45309">③ 慢：µs 级关断延迟</text>
<text x="488" y="428" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" fill="#52606d">Q2 基区电荷要绕 Q1 射流回路泄放，比单管慢</text>
<text x="488" y="446" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" fill="#52606d">一个量级；开关频率上 10kHz、边沿占周期 &gt;5% 就换 MOSFET。</text>
</g>

<!-- 底部对比条 -->
<rect x="36" y="496" width="888" height="120" rx="6" fill="#ffffff" stroke="#14213d" stroke-width="1.6"/>
<text x="56" y="526" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="15" font-weight="700" fill="#14213d">同一负载 2A：导通损耗一条见高下</text>

<rect x="220" y="544" width="540" height="22" rx="3" fill="#b42318"/>
<text x="60" y="560" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12" font-weight="700" fill="#b42318">TIP120</text>
<text x="220" y="538" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" font-weight="700" fill="#b42318">0.9V×2A = 1.8W，必须上散热器</text>

<rect x="220" y="580" width="60" height="22" rx="3" fill="#0f766e"/>
<text x="60" y="596" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12" font-weight="700" fill="#0f766e">MOSFET</text>
<text x="290" y="596" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" font-weight="700" fill="#0f766e">RDS(on)=50mΩ → 只耗 0.2W</text>

<text x="56" y="632" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="10.5" fill="#52606d">ULN2003 军规：单路 500mA 是峰值定额，7 路全开按每路 150~200mA 估算；5 路各 200mA 的压降功耗 5×0.9V×0.2A=0.9W。</text>
</svg>
