<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">PT100 信号六站：误差沿途怎么攒</title>
<desc id="figDesc">一条手绘路线串起 PT100 采集链的六个环节：传感 0.03 摄氏度、激励 0.04、放大 0.05、滤波 0.005、转换 0.01、基准 0.04。上方箭头表示设计从 ADC 满量程往回推，下方箭头表示调试从激励往前走。右侧印章给出 RSS 0.082 摄氏度与最坏情况 0.175 摄氏度，对照 0.1 摄氏度预算。</desc>
<rect width="960" height="640" fill="#fffdf8"/>
<text x="36" y="46" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="28" font-weight="700" fill="#14213d">PT100 信号六站：误差沿途怎么攒</text>
<text x="36" y="76" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="15" fill="#52606d">每一站都往信号上添一点误差；预算表就是各站过路费的清单。</text>
<line x1="36" y1="94" x2="924" y2="94" stroke="#14213d" stroke-width="2"/>

<path d="M70 340 Q130 332 190 340 Q250 348 310 340 Q370 332 430 340 Q490 348 550 340 Q610 332 670 340 Q730 348 790 340 Q850 332 898 338" fill="none" stroke="#efe4d0" stroke-width="18" stroke-linecap="round"/>
<path d="M70 340 Q130 332 190 340 Q250 348 310 340 Q370 332 430 340 Q490 348 550 340 Q610 332 670 340 Q730 348 790 340 Q850 332 898 338" fill="none" stroke="#b8a988" stroke-width="1.2" stroke-dasharray="6 8" stroke-linecap="round"/>

<path d="M848 152 L140 152" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="7 5" stroke-linecap="round"/>
<path d="M152 146 L136 152 L152 158" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="480" y="140" text-anchor="middle" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="18" fill="#b45309">设计：从 ADC 满量程往回推</text>
<text x="480" y="174" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12.5" fill="#52606d">先定增益分配，再分噪声预算</text>

<path d="M112 474 L848 474" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="7 5" stroke-linecap="round"/>
<path d="M836 468 L852 474 L836 480" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="480" y="502" text-anchor="middle" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="18" fill="#0f766e">调试：从激励往前走</text>

<g>
<circle cx="110" cy="340" r="30" fill="#fffdf8" stroke="#b42318" stroke-width="2.2"/>
<line x1="110" y1="322" x2="110" y2="350" stroke="#b42318" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="110" cy="357" r="7" fill="#b42318"/>
<line x1="118" y1="326" x2="124" y2="326" stroke="#b42318" stroke-width="1.6" stroke-linecap="round"/>
<line x1="118" y1="334" x2="122" y2="334" stroke="#b42318" stroke-width="1.4" stroke-linecap="round"/>
<text x="110" y="270" text-anchor="middle" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="19" font-weight="700" fill="#14213d">① 传感</text>
<text x="110" y="292" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12" fill="#52606d">PT100 · 0.385 Ω/°C</text>
