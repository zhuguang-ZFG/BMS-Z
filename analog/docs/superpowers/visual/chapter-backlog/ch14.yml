open_decisions:
- 多张既有热设计、测试点和比率图仍含绝对化结论；逐张复审前不能签核全章。
- PT100线性模型用于算例，真实0.1°C设计需CVD模型、校准、自热与引线误差；演示BOM不是可直接投产设计。
