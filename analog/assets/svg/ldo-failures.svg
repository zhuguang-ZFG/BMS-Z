<svg xmlns="http://www.w3.org/2000/svg" width="800" height="742" viewBox="0 0 800 742" role="img" aria-labelledby="ttl">
<title id="ttl">7805/AMS1117 四种翻车：每一种都能事先算出来</title>
<desc>7805/AMS1117 四种翻车：每一种都能事先算出来；节拍：① 热账：P=(Vin−Vout)×I —— 12V→5V@300mA 就是 2.1W，没有散热片必然关机；② 纹波账：输入谷值必须 ≥ Vout + 压差，否则 100Hz 纹波直接透到输出；③ 稳定性账：LDO 环路靠输出电容的 ESR 零点补偿，ESR 出窗口就振荡；④ 上电账：快上电 + 大压差会过冲；软启动或换型号。大压差大电流请直接上 DCDC</desc>
<defs>
