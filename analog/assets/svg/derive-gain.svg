<path d="M141 38 c 130 3.4 311 -2.6 518 0.4" fill="none" stroke="#a4630f" stroke-width="2.1" stroke-linecap="round" opacity="0.5"/>
<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">共射增益五步推导：gm 把电压变电流，Rc 再变回电压</text>
<path d="M392 86 Q390.86 361.00 392 636" fill="none" stroke="#c9bb9d" stroke-width="1" stroke-dasharray="6,5"/>
<text x="196" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#37424e">跨导把电压变成电流，Rc 再把电流变回电压</text>
<text x="330" y="118" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a4630f">12V</text>
<path d="M262 130 Q311.00 129.99 360 130" fill="none" stroke="#37424e" stroke-width="2.5"/>
<rect x="140" y="190" width="120" height="72" rx="9" fill="#f6eedb" stroke="#1f5d7a" stroke-width="1.8"/>
<text x="200" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f5d7a">gm</text>
<text x="200" y="244" text-anchor="middle" font-size="10.5" fill="#5b666f">ΔIc / ΔVbe</text>
<polyline points="40,226 52,208 64,244 76,208 88,244 100,226" fill="none" stroke="#a4630f" stroke-width="2.2"/>
<text x="70" y="272" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a4630f">ΔVbe</text>
<text x="330" y="284" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a8321f">输出反相</text>
<polyline points="300,332 312,314 324,350 336,314 348,350 360,332" fill="none" stroke="#a8321f" stroke-width="2.2"/>
<rect x="62" y="380" width="267" height="24" rx="6" fill="#f6eedb" stroke="#3d6b4a" stroke-width="1"/><text x="196" y="396" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3d6b4a">电流信号 → 电压信号：全靠 Rc 这件「外套」</text>
<polygon points="132,226 140,220 140,232" fill="#1f5d7a"/>
<path d="M100 226 Q120.00 225.89 140 226" fill="none" stroke="#1f5d7a" stroke-width="2.2"/><path d="M330 130 Q329.92 139.00 330 148" fill="none" stroke="#37424e" stroke-width="2.5"/><path d="M330 128 Q329.97 138.00 330 148" fill="none" stroke="#37424e" stroke-width="2.5"/>
<rect x="319" y="148" width="22" height="40" fill="#f6eedb" stroke="#37424e" stroke-width="2.5"/>
<path d="M330 188 Q330.06 198.00 330 208" fill="none" stroke="#37424e" stroke-width="2.5"/>
<text x="350" y="172.0" font-size="12.5" font-weight="bold" fill="#a4630f">Rc 2k</text>
<path d="M330 208 Q329.96 217.00 330 226" fill="none" stroke="#37424e" stroke-width="2.5"/>
<circle cx="330" cy="226" r="3.5" fill="#37424e"/><path d="M260 226 Q293.00 225.80 326 226" fill="none" stroke="#a8321f" stroke-width="2.2"/>
<polygon points="320,220 330,226 320,232" fill="#a8321f"/>
<text x="292" y="212" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a8321f">ΔIc</text>
<path d="M330 226 Q330.13 248.00 330 270" fill="none" stroke="#c9bb9d" stroke-width="1.2" stroke-dasharray="4,3"/><text x="200" y="340" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a4630f">同样的形状，倒过来、放大 76 倍</text><rect x="400" y="110" width="352" height="58" rx="7" fill="none" stroke="#a4630f" stroke-width="1.8" opacity="0.9"><animate attributeName="y" values="134;192;250;308;366;366" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/></rect>
<text x="412" y="134" font-size="11.5" font-weight="bold" fill="#a4630f">① 跨导的定义</text><text x="412" y="159" font-size="14.5" font-weight="bold" fill="#16202b">gm = ΔIc / ΔVbe</text><text x="412" y="176" font-size="10.5" fill="#5b666f">输入电压抖一下，集电极电流跟着抖多少</text>
<text x="412" y="192" font-size="11.5" font-weight="bold" fill="#a4630f">② 室温下的数值</text><text x="412" y="217" font-size="14.5" font-weight="bold" fill="#16202b">gm ≈ 38 · Ic</text><text x="412" y="234" font-size="10.5" fill="#5b666f">VT ≈ 26mV：Ic=1mA → 38mS</text><rect x="400" y="168" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.2;0.23;1" dur="16s" repeatCount="indefinite"/></rect>
<text x="412" y="250" font-size="11.5" font-weight="bold" fill="#a4630f">③ 电流转电压</text><text x="412" y="275" font-size="14.5" font-weight="bold" fill="#16202b">ΔVout = −ΔIc · Rc</text><text x="412" y="292" font-size="10.5" fill="#5b666f">电流涨 → Rc 压降涨 → 输出跌（反相）</text><rect x="400" y="226" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.4;0.43;1" dur="16s" repeatCount="indefinite"/></rect>
<text x="412" y="308" font-size="11.5" font-weight="bold" fill="#a4630f">④ 串成增益</text><text x="412" y="333" font-size="14.5" font-weight="bold" fill="#16202b">Av = ΔVout/ΔVin = −gm · Rc</text><text x="412" y="350" font-size="10.5" fill="#5b666f">把②③代进比值的定义</text><rect x="400" y="284" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.6;0.63;1" dur="16s" repeatCount="indefinite"/></rect>
<text x="412" y="366" font-size="11.5" font-weight="bold" fill="#a4630f">⑤ 代入数字</text><text x="412" y="391" font-size="14.5" font-weight="bold" fill="#16202b">−38mS × 2kΩ ≈ −76</text><text x="412" y="408" font-size="10.5" fill="#5b666f">≈ 37.6dB 的电压增益</text><rect x="400" y="342" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.8;0.83;1" dur="16s" repeatCount="indefinite"/></rect>
<g><rect x="30" y="612" width="740" height="34.0" rx="9" fill="#e8efe6" stroke="#3d6b4a" stroke-width="1.5" filter="url(#soft)"/><rect x="36" y="619" width="3" height="20.0" rx="1.5" fill="#3d6b4a"/><text x="400" y="634.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3d6b4a">Av = −gm·Rc：提升增益要么加大 Ic（更费电），要么加大 Rc（压降预算不够就撞轨）</text></g></svg>