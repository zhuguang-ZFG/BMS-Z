<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="ui-monospace, Consolas, monospace">
  <title>过压故障锁存：电压回到恢复阈值以下仍保持关断，直到清除锁存。电压数字为示意。</title>
  <desc>亮点走过越限断开、电压掉回恢复线以下仍保持关断，直到最后一步清除锁存才重新闭合。</desc>

  <style>
    .bg { fill: #fffdf5; }
    .panel { fill: #f7f2e5; stroke: #cfc6b2; }
    .axis { stroke: #626d65; stroke-width: 1.5; fill: none; }
    .txt { fill: #293b3a; font-size: 13px; }
    .small { fill: #5f6a63; font-size: 12px; }
    .title { fill: #293b3a; font-size: 16px; font-weight: bold; }
    .hi { fill: #176b73; }
    .warn { fill: #ad4644; }
    .ok { fill: #36775e; }
    .gold { fill: #8e6518; }
    .lineb { stroke: #176b73; stroke-width: 2.5; fill: none; }
    .liner { stroke: #b84745; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #377b60; stroke-width: 2.5; fill: none; }
    .liney { stroke: #926717; stroke-width: 2.5; fill: none; }
    .dotb { fill: #176b73; }
    .dotr { fill: #b84745; }
    .dotg { fill: #377b60; }
    .doty { fill: #926717; }
    .boxb { fill: #e4f0df; stroke: #176b73; }
    .boxr { fill: #f6e2df; stroke: #b84745; }
    .boxg { fill: #e4f0df; stroke: #377b60; }
    .boxy { fill: #fbefc7; stroke: #926717; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #192727; }
      .panel { fill: #223333; stroke: #496160; }
      .axis { stroke: #b0beb3; }
      .txt { fill: #edf0e5; }
      .small { fill: #b0beb3; }
      .title { fill: #edf0e5; }
      .hi { fill: #7ec5c5; }
      .warn { fill: #f39b91; }
      .ok { fill: #8fc7a2; }
      .gold { fill: #dfbd78; }
      .lineb { stroke: #7ec5c5; }
      .liner { stroke: #f39b91; }
      .lineg { stroke: #8fc7a2; }
      .liney { stroke: #dfbd78; }
      .dotb { fill: #7ec5c5; }
      .dotr { fill: #f39b91; }
      .dotg { fill: #8fc7a2; }
      .doty { fill: #dfbd78; }
      .boxb { fill: #293f35; stroke: #7ec5c5; }
      .boxr { fill: #483336; stroke: #f39b91; }
      .boxg { fill: #293f35; stroke: #8fc7a2; }
      .boxy { fill: #453e2b; stroke: #dfbd78; }
    }
  </style>

  <rect class="bg" width="800" height="460"/>

  <text class="title" x="24" y="32">故障锁存：电压回到恢复线以下，也不会自己走开（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="122" rx="6"/>
  <text class="txt" x="40" y="68" opacity="0.28">① 正常放电<tspan class="small">　最高节 4.18 V，低于示意门槛 4.25 V，MOS 导通。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="94" opacity="0.28">② 越过 4.25 V<tspan class="small">　比较器确认后进入故障，充电 MOS 关掉，锁存位置位。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="120" opacity="0.28">③ 电压掉回 4.10 V<tspan class="small">　4.10 V 已经低于示意恢复线 4.15 V。锁存还在，MOS 仍关。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="146" opacity="0.28">④ 清除之后<tspan class="small">　人把锁存清掉，并且电压仍在安全侧，才允许离开故障。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="180" width="752" height="210" rx="6"/>
  <rect class="boxg" x="50" y="230" width="150" height="70" rx="8"/>
  <text class="ok" x="125" y="270" text-anchor="middle">运行 4.18 V</text>
  <rect class="boxr" x="250" y="230" width="160" height="70" rx="8">
    <animate calcMode="spline" keySplines="0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0" attributeName="stroke-width" values="1;4;4;1" keyTimes="0;0.3;0.75;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text class="warn" x="330" y="258" text-anchor="middle">故障锁存</text>
  <text class="small" x="330" y="280" text-anchor="middle">4.25 V 触发</text>
  <rect class="boxy" x="460" y="230" width="170" height="70" rx="8"/>
  <text class="gold" x="545" y="258" text-anchor="middle">电压已 4.10 V</text>
  <text class="txt" x="545" y="280" text-anchor="middle">锁存仍为 1</text>
  <rect class="boxb" x="250" y="320" width="280" height="48" rx="8"/>
  <text class="hi" x="390" y="350" text-anchor="middle">清除锁存 + 仍低于 4.15 V → 才离开</text>
  <circle class="doty" r="8">
    <animate data-ease="linear" attributeName="cx" values="125;330;545;545;390;390" keyTimes="0;0.25;0.5;0.749;0.92;1" dur="12s" repeatCount="indefinite"/>
    <animate data-ease="linear" attributeName="cy" values="242;242;242;242;336;336" keyTimes="0;0.25;0.5;0.749;0.92;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <text class="small" x="24" y="446">4.25 V / 4.15 V 沿用本仓库保护去抖的教学门槛，不是产品阈值。锁存是为了避免在门槛附近来回抖。</text>

</svg>
