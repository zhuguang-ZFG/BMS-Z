<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="短窗与长窗的静置拟合以及时间常数目标函数剖面">
<title>短窗与长窗的静置拟合以及时间常数目标函数剖面</title>
<desc>左侧端电压在撤流后从 3.6724 伏回升到 3.6778 伏，前 5 秒只走了很小一段。右侧目标函数剖面显示长窗在 43 秒有清晰极小值，短窗的极小值被噪声推到 120 秒网格边界。</desc>
