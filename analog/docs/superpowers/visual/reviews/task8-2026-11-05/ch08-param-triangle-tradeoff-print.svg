<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1448 1086" role="img" aria-labelledby="title desc" data-print-width-mm="138" data-composition="technical-overlay-v1" data-base-medium="python-svg"><title id="title">R_ON、注入、带宽的三角矛盾</title><desc id="desc">中心是 R_ON、注入与寄生、带宽与串扰的三角矛盾，三支分别写大沟道与小沟道的代价；中心框先问负载、温度、信号幅度三个测试条件。</desc><rect width="1448" height="1086" fill="#e2d9cf" /><g id="paper-illustration"><path d="M68,394 L250.62,392 L495,395 L498,555.02 L495,676 L228.92000000000002,678 L64,674 Z" fill="#efe7dc" stroke="#c4b9ab" stroke-width="1.4" /><path d="M70,396L491,397" fill="none" stroke="#ffffff" stroke-width="2" opacity=".7" /><path d="M82,406 L482,408 L484,662 L84,664 Z" fill="none" stroke="#c4b9ab" stroke-width="2" opacity=".55" />
