<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="c1-t c1-d">
  <title id="c1-t">章首插画：电芯里在搬离子，端子上看到压降</title>
  <desc id="c1-d">左侧一只不标刻度的指针表，用一条虚线接到中间剖开的电芯；电芯里面有两条极板和搬运圆点的小人。右上方一条导线绕出去接一只亮着的灯泡，再回到电芯底部。表针偏向低处，旁边两道短弧表示指针刚刚往下沉。</desc>
  <defs>
    <filter id="c1-ink" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <style>
      .ink { fill: none; stroke: #293b3a; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .ink-thin { fill: none; stroke: #293b3a; stroke-width: 1.7; stroke-linecap: round; }
      .ink-mute { fill: none; stroke: #626d65; stroke-width: 1.4; stroke-linecap: round; }
      .paper { fill: #fffdf5; stroke: #293b3a; stroke-width: 2.3; stroke-linejoin: round; }
      .amber { fill: #926717; }
      .amber-line { fill: none; stroke: #926717; stroke-width: 2; stroke-linecap: round; }
      .green-line { fill: none; stroke: #377b60; stroke-width: 2.2; stroke-linecap: round; }
      .glow { fill: #926717; opacity: 0.12; }
      .hatch { fill: none; stroke: #626d65; stroke-width: 1.2; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="960" height="560" fill="#fffdf5"/>

  <g filter="url(#c1-ink)">
    <!-- 地面 -->
    <path class="ink-mute" d="M60 486 Q300 481 520 485 Q740 489 900 483"/>

    <!-- 指针表（不标刻度） -->
    <circle class="paper" cx="168" cy="300" r="62"/>
    <circle class="ink-thin" cx="168" cy="300" r="50"/>
    <path class="ink" d="M168 300 L142 344"/>
    <circle class="amber" cx="168" cy="300" r="5"/>
    <path class="amber-line" d="M104 330 L92 356 M92 356 L86 344 M92 356 L104 352"/>
    <path class="ink-thin" d="M138 248 L152 262 M186 246 L176 260"/>
    <path class="ink-mute" d="M140 486 L144 372"/>
    <path class="ink-mute" d="M196 486 L192 372"/>
    <path class="ink-thin" d="M144 372 Q168 364 192 372"/>

    <!-- 表到电芯的一条虚线 -->
    <path class="amber-line" d="M228 312 Q266 302 312 320" stroke-dasharray="6 6"/>

    <!-- 电芯：正极凸台 + 顶盖 + 壳身（正面剖开） -->
    <path class="ink" d="M368 150 L368 132 Q386 126 404 132 L404 150"/>
    <ellipse class="paper" cx="386" cy="152" rx="72" ry="14"/>
    <path class="ink" d="M314 152 L314 452 Q314 470 336 470 L436 470 Q458 470 458 452 L458 152"/>
    <path class="ink-mute" d="M314 452 Q386 476 458 452"/>

    <!-- 剖口：两条极板与电解液小点 -->
    <path class="ink" d="M346 184 L344 442"/>
    <path class="ink" d="M424 182 L426 440"/>
    <g class="hatch">
      <path d="M352 196 L352 216 M358 234 L358 254 M352 272 L352 292 M358 310 L358 330
               M352 348 L352 368 M358 386 L358 406"/>
      <path d="M432 198 L432 218 M438 236 L438 256 M432 274 L432 294 M438 312 L438 332
               M432 350 L432 370"/>
    </g>
    <g class="ink-mute" stroke-width="1.2">
      <path d="M368 214 L368.6 214 M398 232 L398.6 232 M374 282 L374.6 282 M404 300 L404.6 300
               M366 344 L366.6 344 M400 372 L400.6 372 M380 408 L380.6 408"/>
    </g>
    <circle class="amber" cx="386" cy="196" r="8"/>
    <circle class="amber" cx="408" cy="262" r="8"/>
    <circle class="amber" cx="366" cy="316" r="8"/>
    <circle class="amber" cx="404" cy="394" r="8"/>
    <circle class="amber" cx="408" cy="262" r="1.6" fill="#fffdf5"/>
    <circle class="amber" cx="414" cy="262" r="1.6" fill="#fffdf5"/>

    <!-- 极板之间干活的小人（站在下隔板上） -->
    <path class="ink-thin" d="M352 386 L436 384"/>
    <circle class="paper" cx="392" cy="344" r="10"/>
    <path class="ink" d="M392 354 L390 384"/>
    <path class="ink" d="M391 362 L410 356"/>
    <path class="ink-thin" d="M391 364 L372 358"/>
    <path class="ink-thin" d="M390 384 L384 392 M390 384 L399 392"/>
    <circle class="amber" cx="386" cy="341" r="1.5"/>
    <circle class="amber" cx="399" cy="341" r="1.5"/>

    <!-- 外部回路：正极 → 上 → 右 → 灯泡 → 下 → 底部回到壳体 -->
    <path class="ink" d="M386 132 L386 78 Q386 70 394 70 L846 70 Q854 70 854 78 L854 424 Q854 436 842 436 L470 436 Q462 436 462 428 L462 424"/>
    <path class="ink" d="M854 70 L854 78"/>
    <!-- 灯泡：挂在右竖直导线上 -->
    <path class="ink" d="M854 206 L854 218"/>
    <path class="paper" d="M838 218 L870 218 L866 232 L842 232 Z"/>
    <circle class="paper" cx="854" cy="262" r="28"/>
    <circle class="glow" cx="854" cy="262" r="52"/>
    <path class="amber-line" d="M854 234 L854 240"/>
    <path class="ink" d="M854 290 L854 302"/>
    <!-- 灯泡的光 -->
    <path class="amber-line" d="M800 226 L812 238 M908 226 L896 238 M792 266 L806 266 M916 266 L902 266"/>
    <!-- 电流方向的小箭头 -->
    <path class="green-line" d="M470 70 L494 70 M486 62 L496 70 L486 78"/>
    <path class="green-line" d="M854 330 L854 352 M846 344 L854 354 L862 344"/>
  </g>
</svg>
