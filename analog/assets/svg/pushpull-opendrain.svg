<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="ttl">
<title id="ttl">推挽 vs 开漏：为什么 I2C 偏偏选「慢」的那个？</title>
<desc>推挽 vs 开漏：为什么 I2C 偏偏选「慢」的那个？；节拍：① 推挽输出高：上管合上，VDD 直推——又快又有劲（粒子密集）；② 开漏输出高：只能靠上拉电阻慢慢充电——沿是 RC 曲线（粒子稀疏）；③ 那为什么 I2C 还选开漏？——多设备共享总线时，两个推挽互怼=短路烧IO！</desc>
