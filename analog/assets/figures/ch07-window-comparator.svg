<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">窗口比较器：两只比较器守住一个电压窗口</title>
<desc id="figDesc">左图是电池电压窗口监控电路：电池经 100 kΩ 对 100 kΩ 减半分压，分压点同时送进 LM393 的两路比较器；A 路同相端接 1.5 V 基准、分压点进反相端，电池低于 3.0 V 时输出低；B 路反相端接 1.8 V 基准、分压点进同相端，电池高于 3.6 V 时输出低；两路开集电极输出接同一个上拉电阻构成线与。右图是传输曲线：电池电压低于 3.0 V 为欠压报警、3.0 到 3.6 V 之间输出高表示正常、高于 3.6 V 为过压报警。读法：窗口内输出高、越界输出低，一根线进 MCU 中断。</desc>
<rect width="960" height="620" fill="#fffdf8"/>
<text x="30" y="38" font-size="22" font-weight="bold" fill="#14213d">窗口比较器：只有落在窗口内才算正常</text>
<text x="30" y="62" font-size="14" fill="#52606d">一颗 LM393 的两路各管一道门：A 管下阈 3.0 V（欠压）、B 管上阈 3.6 V（过压），输出线与</text>

<!-- 左：电路 -->
<rect x="30" y="84" width="430" height="290" rx="10" fill="#fdf3e3" stroke="#b45309" stroke-width="2"/>
<text x="48" y="110" font-size="15" font-weight="bold" fill="#b45309">① 电路：两路比较器 + 一个共用上拉</text>
<text x="52" y="138" font-size="13" fill="#14213d">电池 Vbat</text>
<line x1="110" y1="130" x2="110" y2="146" stroke="#14213d" stroke-width="2"/>
<polyline points="110,146 118,152 102,158 118,164 102,170 110,176" fill="none" stroke="#14213d" stroke-width="2"/>
<text x="98" y="166" font-size="12" fill="#52606d" text-anchor="end">100 kΩ</text>
<line x1="110" y1="176" x2="110" y2="192" stroke="#14213d" stroke-width="2"/>
<circle cx="110" cy="196" r="4" fill="#14213d"/>
<text x="76" y="200" font-size="12" fill="#0f766e">Vx</text>
<polyline points="110,192 118,198 102,204 118,210 102,216 110,222" fill="none" stroke="#14213d" stroke-width="2"/>
<text x="122" y="212" font-size="12" fill="#52606d">100 kΩ</text>
<line x1="110" y1="222" x2="110" y2="236" stroke="#14213d" stroke-width="2"/>
<line x1="96" y1="236" x2="124" y2="236" stroke="#14213d" stroke-width="2"/>
<line x1="101" y1="241" x2="119" y2="241" stroke="#14213d" stroke-width="2"/>
<line x1="106" y1="246" x2="114" y2="246" stroke="#14213d" stroke-width="2"/>
<!-- Vx branches -->
<line x1="110" y1="196" x2="170" y2="196" stroke="#14213d" stroke-width="2"/>
<line x1="170" y1="196" x2="170" y2="180" stroke="#14213d" stroke-width="2"/>
<line x1="170" y1="180" x2="196" y2="180" stroke="#14213d" stroke-width="2"/>
<line x1="170" y1="196" x2="170" y2="292" stroke="#14213d" stroke-width="2"/>
<line x1="170" y1="292" x2="196" y2="292" stroke="#14213d" stroke-width="2"/>
<!-- comparator A -->
<polygon points="212,158 212,212 272,185" fill="#ffffff" stroke="#14213d" stroke-width="2"/>
<text x="204" y="168" font-size="11" fill="#14213d" text-anchor="end">1.5 V 基准 → +</text>
<line x1="196" y1="168" x2="212" y2="168" stroke="#14213d" stroke-width="2"/>
<text x="204" y="184" font-size="12" fill="#0f766e" text-anchor="end">−</text>
<text x="226" y="182" font-size="12" font-weight="bold" fill="#14213d">A</text>
<line x1="272" y1="185" x2="320" y2="185" stroke="#14213d" stroke-width="2"/>
<!-- comparator B -->
<polygon points="212,270 212,324 272,297" fill="#ffffff" stroke="#14213d" stroke-width="2"/>
<text x="204" y="280" font-size="11" fill="#14213d" text-anchor="end">1.8 V 基准 → −</text>
<line x1="196" y1="280" x2="212" y2="280" stroke="#14213d" stroke-width="2"/>
<text x="204" y="296" font-size="12" fill="#0f766e" text-anchor="end">+</text>
<text x="226" y="294" font-size="12" font-weight="bold" fill="#14213d">B</text>
<line x1="272" y1="297" x2="320" y2="297" stroke="#14213d" stroke-width="2"/>
<!-- wired-AND output -->
<line x1="320" y1="185" x2="320" y2="297" stroke="#14213d" stroke-width="2"/>
<line x1="320" y1="241" x2="356" y2="241" stroke="#14213d" stroke-width="2"/>
<circle cx="356" cy="241" r="4" fill="#14213d"/>
<line x1="356" y1="241" x2="356" y2="160" stroke="#14213d" stroke-width="2"/>
<polyline points="356,160 364,154 348,148 364,142 348,136 356,130" fill="none" stroke="#14213d" stroke-width="2"/>
<text x="366" y="150" font-size="12" fill="#52606d">共用上拉</text>
<text x="342" y="122" font-size="12" fill="#14213d">VDD</text>
<line x1="356" y1="241" x2="410" y2="241" stroke="#14213d" stroke-width="2"/>
<polygon points="418,241 406,236 406,246" fill="#14213d"/>
<text x="330" y="266" font-size="12" font-weight="bold" fill="#0f766e">线与 → MCU 中断</text>
<text x="212" y="356" font-size="11" fill="#b42318">Vx&lt;1.5 V（Vbat&lt;3.0 V）→ 输出低</text>
<text x="212" y="368" font-size="11" fill="#b42318">Vx&gt;1.8 V（Vbat&gt;3.6 V）→ 输出低</text>

<!-- 右：传输曲线 -->
<rect x="496" y="84" width="434" height="290" rx="10" fill="#ffffff" stroke="#52606d" stroke-width="1.5"/>
<text x="514" y="110" font-size="15" font-weight="bold" fill="#14213d">② 传输曲线：三段输出状态</text>
<rect x="520" y="126" width="128" height="174" fill="#fdf3e3"/>
<rect x="648" y="126" width="129" height="174" fill="#e6f6f2"/>
<rect x="777" y="126" width="128" height="174" fill="#fdf3e3"/>
<line x1="520" y1="300" x2="905" y2="300" stroke="#14213d" stroke-width="1.5"/>
<line x1="520" y1="300" x2="520" y2="126" stroke="#14213d" stroke-width="1.5"/>
<text x="905" y="340" font-size="12" fill="#52606d" text-anchor="end">Vbat</text>
<text x="528" y="140" font-size="12" fill="#52606d">输出</text>
<polyline points="520,280 648,280 648,185 777,185 777,280 905,280" fill="none" stroke="#14213d" stroke-width="3"/>
<line x1="648" y1="126" x2="648" y2="300" stroke="#b45309" stroke-width="1.5" stroke-dasharray="7,4"/>
<line x1="777" y1="126" x2="777" y2="300" stroke="#b45309" stroke-width="1.5" stroke-dasharray="7,4"/>
<text x="648" y="318" font-size="12" fill="#b45309" text-anchor="middle">3.0 V</text>
<text x="777" y="318" font-size="12" fill="#b45309" text-anchor="middle">3.6 V</text>
<text x="524" y="318" font-size="12" fill="#52606d">2.4</text>
<text x="901" y="318" font-size="12" fill="#52606d" text-anchor="end">4.2</text>
<text x="584" y="205" font-size="12" fill="#b42318" text-anchor="middle">欠压报警</text>
<text x="584" y="224" font-size="12" fill="#b42318" text-anchor="middle">输出低</text>
<text x="712" y="165" font-size="12" font-weight="bold" fill="#0f766e" text-anchor="middle">窗口内：输出高</text>
<text x="712" y="250" font-size="11" fill="#0f766e" text-anchor="middle">3.0 ~ 3.6 V 正常</text>
<text x="841" y="205" font-size="12" fill="#b42318" text-anchor="middle">过压报警</text>
<text x="841" y="224" font-size="12" fill="#b42318" text-anchor="middle">输出低</text>
<text x="648" y="342" font-size="11" fill="#52606d" text-anchor="middle">（分压点 1.5 V）</text>
<text x="777" y="342" font-size="11" fill="#52606d" text-anchor="middle">（分压点 1.8 V）</text>

<!-- 底：算一笔 -->
<rect x="30" y="404" width="900" height="150" rx="10" fill="#e6f6f2" stroke="#0f766e" stroke-width="2"/>
<text x="50" y="432" font-size="15" font-weight="bold" fill="#0f766e">③ 算数：阈值从电池折算到分压点（÷2）</text>
<text x="50" y="458" font-size="14" fill="#14213d">100 kΩ / 100 kΩ 减半分压：3.0 V ↔ 1.5 V（A 下阈）、3.6 V ↔ 1.8 V（B 上阈）</text>
<text x="50" y="482" font-size="14" fill="#14213d">两路都接成「越界输出低」，开集电极共用一个上拉 → 线与</text>
<text x="50" y="506" font-size="14" fill="#14213d">结果：Vbat 落在 3.0 ~ 3.6 V 内输出高；任一越界，公共输出被拉低 → MCU 中断</text>
<text x="50" y="532" font-size="13" fill="#b45309">坑：基准若也分压自电源，电源飘窗口跟着飘 → 要稳窗口，基准换稳压源（TL431）</text>
<text x="30" y="596" font-size="15" fill="#14213d">口诀：两只比较器各管一道门，线与只认一件事——窗内放行，越界报警。</text>
</svg>
