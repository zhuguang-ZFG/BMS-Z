<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440">
  <title>预充在合主闸之前，主动放电在主闸打开之后</title>
  <rect width="880" height="440" fill="#f8fafc"/>
  <style>
  text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
  /* 深色模式：GitHub 深色主题下对调底色与文字色，只覆盖配色，不动几何与动画。
     stroke="#fff" 保持白色——那是彩色徽标上的勾选，不在覆盖范围内。 */
  @media (prefers-color-scheme: dark){
  rect[fill="#f8fafc"]{fill:#0f172a}
  rect[fill="#fff"]{fill:#1e293b}
  [fill="#f1f5f9"]{fill:#1e293b}
  [stroke="#f1f5f9"]{stroke:#1e293b}
  [fill="#e2e8f0"]{fill:#334155}
  [stroke="#e2e8f0"]{stroke:#334155}
  [fill="#cbd5e1"]{fill:#475569}
  [stroke="#cbd5e1"]{stroke:#475569}
  [fill="#64748b"]{fill:#94a3b8}
  [stroke="#64748b"]{stroke:#94a3b8}
  [fill="#475569"]{fill:#cbd5e1}
  [stroke="#475569"]{stroke:#cbd5e1}
  [fill="#334155"]{fill:#e2e8f0}
  [stroke="#334155"]{stroke:#e2e8f0}
  [fill="#1e293b"]{fill:#f1f5f9}
  [stroke="#1e293b"]{stroke:#f1f5f9}
  [fill="#dbeafe"]{fill:#1e3a8a}
  [stroke="#dbeafe"]{stroke:#1e3a8a}
  [fill="#eff6ff"]{fill:#172554}
  [stroke="#eff6ff"]{stroke:#172554}
  [fill="#bfdbfe"]{fill:#1e40af}
  [stroke="#bfdbfe"]{stroke:#1e40af}
  [fill="#1d4ed8"]{fill:#60a5fa}
  [stroke="#1d4ed8"]{stroke:#60a5fa}
  [fill="#1e40af"]{fill:#93c5fd}
  [stroke="#1e40af"]{stroke:#93c5fd}
  [fill="#2563eb"]{fill:#60a5fa}
  [stroke="#2563eb"]{stroke:#60a5fa}
  [fill="#3b82f6"]{fill:#60a5fa}
  [stroke="#3b82f6"]{stroke:#60a5fa}
  [fill="#ecfdf5"]{fill:#022c22}
  [stroke="#ecfdf5"]{stroke:#022c22}
  [fill="#a7f3d0"]{fill:#065f46}
  [stroke="#a7f3d0"]{stroke:#065f46}
  [fill="#86efac"]{fill:#166534}
  [stroke="#86efac"]{stroke:#166534}
  [fill="#065f46"]{fill:#6ee7b7}
  [stroke="#065f46"]{stroke:#6ee7b7}
  [fill="#059669"]{fill:#34d399}
  [stroke="#059669"]{stroke:#34d399}
  [fill="#fef2f2"]{fill:#450a0a}
  [stroke="#fef2f2"]{stroke:#450a0a}
  [fill="#fecaca"]{fill:#7f1d1d}
  [stroke="#fecaca"]{stroke:#7f1d1d}
  [fill="#fca5a5"]{fill:#b91c1c}
  [stroke="#fca5a5"]{stroke:#b91c1c}
  [fill="#991b1b"]{fill:#fca5a5}
  [stroke="#991b1b"]{stroke:#fca5a5}
  [fill="#dc2626"]{fill:#f87171}
  [stroke="#dc2626"]{stroke:#f87171}
  [fill="#fffbeb"]{fill:#451a03}
  [stroke="#fffbeb"]{stroke:#451a03}
  [fill="#fef3c7"]{fill:#78350f}
  [stroke="#fef3c7"]{stroke:#78350f}
  [fill="#92400e"]{fill:#fcd34d}
  [stroke="#92400e"]{stroke:#fcd34d}
  [fill="#b45309"]{fill:#fbbf24}
  [stroke="#b45309"]{stroke:#fbbf24}
  }
</style>

  <text x="440" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">两只电阻，两段时间，不能换序</text>
  <rect x="24" y="56" width="832" height="150" rx="8" fill="#fff" stroke="#1d4ed8" stroke-width="2">
    <animate attributeName="stroke-width" values="5;2;2;5" keyTimes="0;0.33;0.7;1" dur="9s" repeatCount="indefinite"/>
  </rect>
  <text x="40" y="82" font-size="15" font-weight="bold" fill="#1e40af">预充：合主闸之前</text>
  <rect x="40" y="100" width="150" height="70" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="115" y="140" text-anchor="middle" font-size="13" fill="#1e293b">预充电阻通</text>
  <rect x="230" y="100" width="150" height="70" rx="6" fill="#ecfdf5" stroke="#059669"/>
  <text x="305" y="140" text-anchor="middle" font-size="13" fill="#1e293b">母线爬到接近包压</text>
  <rect x="420" y="100" width="150" height="70" rx="6" fill="#fffbeb" stroke="#b45309"/>
  <text x="495" y="140" text-anchor="middle" font-size="13" fill="#1e293b">再合主接触器</text>
  <circle cy="135" r="6" fill="#1d4ed8">
    <animate attributeName="cx" values="115;305;495;115" keyTimes="0;0.2;0.4;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.42;0.48;0.9;1" dur="9s" repeatCount="indefinite"/>
  </circle>

  <rect x="24" y="220" width="832" height="150" rx="8" fill="#fff" stroke="#059669" stroke-width="2">
    <animate attributeName="stroke-width" values="2;5;2" keyTimes="0;0.55;1" dur="9s" repeatCount="indefinite"/>
  </rect>
  <text x="40" y="246" font-size="15" font-weight="bold" fill="#065f46">主动放电：主闸打开之后</text>
  <rect x="40" y="264" width="150" height="70" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="115" y="304" text-anchor="middle" font-size="13" fill="#1e293b">确认触点已分开</text>
  <rect x="230" y="264" width="150" height="70" rx="6" fill="#fffbeb" stroke="#b45309"/>
  <text x="305" y="304" text-anchor="middle" font-size="13" fill="#1e293b">再投放电电阻</text>
  <rect x="420" y="264" width="180" height="70" rx="6" fill="#ecfdf5" stroke="#059669"/>
  <text x="510" y="304" text-anchor="middle" font-size="13" fill="#1e293b">母线掉到安全电压</text>
  <circle cy="299" r="6" fill="#059669" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.45;0.5;0.85;0.92;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="115;305;510;115" keyTimes="0;0.33;0.66;1" dur="9s" repeatCount="indefinite"/>
  </circle>
  <text x="680" y="300" font-size="13" fill="#dc2626" opacity="0">错：闸还合着就放电
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.2;0.35;1" dur="9s" repeatCount="indefinite"/>
  </text>
  <text x="440" y="408" text-anchor="middle" font-size="14" fill="#334155">预充限制的是合闸冲击。主动放电泄的是已经断开的母线电容。示意图，不是实拍。</text>

</svg>
