changes:
- id: legacy-figures-ch08-charge-injection
  source: docs/p1-09-ch8.md#8.3
  before: |-
    **② 电荷注入怎么测、怎么留余量。** 保持电容加高阻缓冲，控制脚给干净方波，量关断瞬间保持电压的跳变。

    手册的注入值都在指定测试电路下给出。"一半注入"只是对称理想，实际分配比例取决于两侧阻抗与沿速率：你的电路里 0.2 pC 可能变成 0.1 或 0.4 pC，**设计按全部注入（×2）兜底**。

    降低源阻也是对策：注入电荷流向阻抗低的一侧，源阻够低时大部分被信号源吸收。

    时钟馈通是同族亲戚：栅压跳变经栅源/栅漏电容直接串进信号路径，幅度正比于控制沿摆幅。控制逻辑摆幅越低，馈通越小。

    这包电荷在关断那一瞬间到底怎么分、分到保持电容上又折成多少个 LSB，值得把账摊开看一次——下面这张图把"去向"和"数目"画在同一张纸上：
  after: |-
    **② 电荷注入怎么测、怎么留余量。** 保持电容加高阻缓冲，控制脚给干净方波，量关断瞬间保持电压的跳变。手册的注入值都在指定测试电路下给出，实际分配取决于两侧阻抗与沿速率：你的电路里 0.2 pC 可能变成 0.1 或 0.4 pC，兜底判据与源阻分流见下图。

    时钟馈通是同族亲戚：栅压跳变经栅源/栅漏电容直接串进信号路径，幅度正比于控制沿摆幅。控制逻辑摆幅越低，馈通越小。

    这包电荷关断瞬间怎么分、折成多少个 LSB，下图把"去向"和"数目"画在同一张纸上：
  caption: '电荷注入的分账：Q_ch 在关断瞬间有两个出口，源侧阻抗越低，挤进 $C_{hold}$ 的份额越少。"一半注入"只是对称理想，设计按 ×2 兜底；右侧误差账全部取自本节正文。'
