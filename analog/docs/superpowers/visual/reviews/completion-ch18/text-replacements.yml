- id: ch18-dmm-averaging
  source: docs/p4-03-ch18.md#18.1
  before: |-
    数字万用表的「平均滤镜」要理解到带宽层面。手持表的 DC 档积分窗口是百毫秒量级，AC 档带宽通常只有几十到几百赫兹，廉价表更窄。

    于是一个骑在 2.5 V 直流上、幅度 ±2 V、频率 1 MHz 的振荡，在 DC 档被积分成纹丝不动的 2.5 V，在 AC 档又因远超带宽而读出接近零。两个档位都在一本正经地撒谎。

    可执行的对策只有一条：凡是稳定得可疑的模拟节点，示波器先用 AC 耦合、毫伏级灵敏度扫一遍，确认没有振荡，再谈直流精度。第 17 章那些「量着都对、就是不工作」的运放与 LDO，一半以上能在这一步现形。
  after: |-
    平均滤镜的根子在带宽：手持表 DC 档积分窗口是百毫秒量级，AC 档通常只有几十到几百赫兹，廉价表更窄，1 MHz 振荡因此两档都看不见。对策只有一条：凡是稳定得可疑的模拟节点，示波器先用 AC 耦合、毫伏级灵敏度扫一遍，确认没有振荡，再谈直流精度。第 17 章那些「量着都对、就是不工作」的运放与 LDO，一半以上能在这一步现形。
  caption: 万用表把振荡平均成 2.5 V。DC 档积分窗口百毫秒，AC 档带宽几十到几百 Hz；1 MHz 振荡两档都看不见
  removed_prose_chars: 81
  relationship: replaces-text
