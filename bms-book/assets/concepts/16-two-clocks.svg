    <pattern id="hatch-blue" width="7.0" height="7.0" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7.0" stroke="#496e96" stroke-width="1.1"/></pattern>
    <pattern id="hatch-red" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#b84745" stroke-width="1.1"/></pattern>
