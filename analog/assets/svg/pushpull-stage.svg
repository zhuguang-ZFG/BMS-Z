<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">推挽输出：两个方向都能驱动，但绝不能同时开</text>

<text x="200" y="50" text-anchor="middle" font-size="14" font-weight="bold" fill="#37424e">图腾柱：上管推高、下管拉低</text>
<text x="88" y="86" text-anchor="end" font-size="11.5" font-weight="bold" fill="#a4630f">VDD 5V</text>
<path d="M150 92 Q150.05 106.00 150 120" fill="none" stroke="#37424e" stroke-width="2.5"/>
<path d="M96 92 Q123.00 92.01 150 92" fill="none" stroke="#37424e" stroke-width="2.5"/>
<rect x="112" y="120" width="76" height="46" rx="6" fill="#e6eff3" stroke="#1f5d7a" stroke-width="2.5"/>
<text x="150" y="140" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1f5d7a">上管 PMOS</text>
<text x="150" y="158" text-anchor="middle" font-size="10.5" fill="#5b666f">ON = 推高</text>
<path d="M150 166 Q149.96 181.00 150 196" fill="none" stroke="#37424e" stroke-width="2.5"/>
<circle cx="150" cy="196" r="4.5" fill="#37424e"/>
<path d="M150 196 Q220.00 195.96 290 196" fill="none" stroke="#37424e" stroke-width="2.5"/>
<text x="296" y="192" font-size="12" font-weight="bold" fill="#3d6b4a">OUT</text>
<path d="M150 196 Q149.91 211.00 150 226" fill="none" stroke="#37424e" stroke-width="2.5"/>
<rect x="112" y="226" width="76" height="46" rx="6" fill="#f6e7e1" stroke="#a8321f" stroke-width="2.5"/>
<text x="150" y="246" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a8321f">下管 NMOS</text>
<text x="150" y="264" text-anchor="middle" font-size="10.5" fill="#5b666f">ON = 拉低</text>
<path d="M150 272 Q149.92 286.00 150 300" fill="none" stroke="#37424e" stroke-width="2.5"/>
<path d="M150 300 Q150.03 307.00 150 314" fill="none" stroke="#37424e" stroke-width="2.5"/><path d="M134 314 Q150.00 314.08 166 314" fill="none" stroke="#37424e" stroke-width="3"/><path d="M140 320 Q150.00 319.92 160 320" fill="none" stroke="#37424e" stroke-width="3"/><line x1="146" y1="326" x2="154" y2="326" stroke="#37424e" stroke-width="3"/>
<circle r="5" fill="#1f5d7a"><animateMotion dur="11s" begin="-0.3s" repeatCount="indefinite" path="M150,92 L150,118"/></circle>
<circle r="5" fill="#1f5d7a"><animateMotion dur="11s" begin="-0.3s" repeatCount="indefinite" path="M152,168 L152,194 L288,196"/></circle>
<circle r="5" fill="#a8321f"><animateMotion dur="11s" begin="-1.2s" repeatCount="indefinite" path="M288,200 L152,200 L152,274 L150,298"/></circle>
<circle r="4" fill="#a4630f"><animateMotion dur="11s" begin="-2.0s" repeatCount="indefinite" path="M150,116 L150,270 L150,116"/></circle>
<text x="330" y="120" font-size="11.5" font-weight="bold" fill="#1f5d7a">输出高：上管供流</text>
<text x="330" y="138" font-size="11" fill="#5b666f">（source current）</text>
<text x="330" y="170" font-size="11.5" font-weight="bold" fill="#a8321f">输出低：下管吸流</text>
<text x="330" y="188" font-size="11" fill="#5b666f">（sink current）</text>
<text x="330" y="220" font-size="11.5" font-weight="bold" fill="#3d6b4a">两个方向都主动驱动</text>
<text x="330" y="238" font-size="11" fill="#5b666f">——比开漏快得多</text>
<rect x="40" y="340" width="330" height="130" rx="8" fill="#f6e7e1" stroke="#a8321f" stroke-width="2"/>
<text x="56" y="366" font-size="12" font-weight="bold" fill="#a8321f">⚠ 两个推挽直连 = 短路</text>
<text x="56" y="390" font-size="11" fill="#5b666f">一只推高、一只推低，电流只受管阻限制：</text>
<text x="56" y="410" font-size="11" font-weight="bold" fill="#a8321f">I = 5V / (25Ω+25Ω) = 100mA</text>
<text x="56" y="432" font-size="11" fill="#5b666f">够烧 IO；所以共享总线绝不能用推挽</text>
<text x="56" y="454" font-size="11" fill="#5b666f">（要用开漏 / 三态，见 5.2、5.4）</text>
<text x="420" y="340" font-size="12" font-weight="bold" fill="#a4630f">切换瞬间：直通电流（shoot-through）</text>
<text x="420" y="362" font-size="11" fill="#5b666f">上下管换班的几 ns 里两个都半开，</text>
<text x="420" y="382" font-size="11" fill="#5b666f">VDD 到 GND 被短暂打通 → 电源毛刺 +</text>
<text x="420" y="402" font-size="11" fill="#5b666f">动态功耗的元凶。芯片靠「死区时间」</text>
<text x="420" y="422" font-size="11" fill="#5b666f">（先关后开）把它压掉。</text>
<text x="420" y="452" font-size="11.5" font-weight="bold" fill="#6b3f63">音频乙类推挽还要防交越失真（见 11.4）</text>
<path d="M40 490 Q400.00 490.45 760 490" fill="none" stroke="#c9bb9d" stroke-width="1"/>
<text x="400" y="516" text-anchor="middle" font-size="12" font-weight="bold" fill="#37424e">三兄弟对比：推挽 vs 开漏 vs 三态</text>
<text x="400" y="542" text-anchor="middle" font-size="11.5" fill="#5b666f">推挽：两个方向都主动驱动，但**不能共享总线**　·　开漏：只能拉低，靠上拉出高，**可以线与**　·　三态：加了「隐身」态，**可以共享总线**</text>
<text x="400" y="566" text-anchor="middle" font-size="11" fill="#5b666f">选哪种，先问一句：这根线上会不会有第二个驱动器？</text>
<circle r="5" fill="#a4630f"><animateMotion dur="11s" begin="-0.6s" repeatCount="indefinite" path="M98,92 L148,92"/></circle>
<circle r="5" fill="#6b3f63"><animateMotion dur="11s" begin="-1.6s" repeatCount="indefinite" path="M150,304 L150,312"/></circle>
<circle r="4.5" fill="#1f5d7a"><animateMotion dur="11s" begin="-2.4s" repeatCount="indefinite" path="M154,196 L286,196"/></circle>
<rect x="290" y="176" width="70" height="24" rx="6" fill="none" stroke="#3d6b4a" stroke-width="2.5" opacity="0" filter="url(#pglow)"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="1.7s" repeatCount="indefinite"/></rect>
<rect x="40" y="338" width="330" height="134" rx="10" fill="none" stroke="#a8321f" stroke-width="2.5" opacity="0" filter="url(#pglow)"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="1.9s" repeatCount="indefinite"/></rect>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.03;0.2;0.25;1" dur="11s" repeatCount="indefinite"/><rect x="137.6" y="587.0" width="524.9" height="24.1" rx="12.0" fill="#1f5d7a" fill-opacity="0.09" stroke="#1f5d7a" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.25;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="600" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1f5d7a" opacity="0">① 上管导通 = 主动推高；下管导通 = 主动拉低——两个方向都有低阻通路<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.25;1" dur="11s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="11s" repeatCount="indefinite"/><rect x="152.1" y="587.0" width="495.8" height="24.1" rx="12.0" fill="#3d6b4a" fill-opacity="0.09" stroke="#3d6b4a" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="600" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#3d6b4a" opacity="0">② 所以推挽输出上升/下降沿都快、驱动强——MCU GPIO 默认就是它<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="11s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="11s" repeatCount="indefinite"/><rect x="151.5" y="587.0" width="497.0" height="24.1" rx="12.0" fill="#a8321f" fill-opacity="0.09" stroke="#a8321f" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="600" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#a8321f" opacity="0">③ 代价一：两个推挽直连就是短路，电流只受管阻限制（100mA 级）<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="11s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/><rect x="166.4" y="587.0" width="467.1" height="24.1" rx="12.0" fill="#a4630f" fill-opacity="0.09" stroke="#a4630f" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="600" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#a4630f" opacity="0">④ 代价二：换班瞬间有直通电流 → 电源毛刺；要靠死区时间压掉<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/></text></g></svg>