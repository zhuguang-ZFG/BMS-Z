<rect x="270" y="190" width="90" height="44" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<text x="315" y="210" text-anchor="middle" font-size="11" fill="#37424e">SAR 逻辑</text>
<text x="315" y="226" text-anchor="middle" font-size="10" fill="#5b666f">留/退裁决</text>
<path d="M240 125 Q260.00 125.16 280 125" fill="none" stroke="#37424e" stroke-width="2"/>
<path d="M280 125 Q279.80 157.50 280 190" fill="none" stroke="#37424e" stroke-width="2"/>
<rect x="250" y="80" width="70" height="36" rx="6" fill="#f6eedb" stroke="#6b3f63" stroke-width="2"/>
<text x="285" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b3f63">DAC</text>
<line x1="250" y1="98" x2="240" y2="98" stroke="#37424e" stroke-width="2"/>
<path d="M240 98 Q239.95 105.00 240 112" fill="none" stroke="#37424e" stroke-width="2"/>
<path d="M320 80 Q320.07 70.00 320 60" fill="none" stroke="#37424e" stroke-width="2"/>
<line x1="320" y1="60" x2="315" y2="60" stroke="#37424e" stroke-width="2"/>
<path d="M315 60 Q314.58 125.00 315 190" fill="none" stroke="#37424e" stroke-width="2" stroke-dasharray="4,3"/>
<text x="330" y="64" font-size="10" fill="#5b666f">试位码→</text>
<text x="380" y="222" font-size="11" font-weight="bold" fill="#1f5d7a">结果 0101</text>
<path d="M360 212 Q370.00 211.98 380 212" fill="none" stroke="#37424e" stroke-width="2"/>

<text x="590" y="142" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5b666f">DAC 输出（紫阶）四拍逼近输入线（蓝）</text>
<path d="M430 236 Q590.00 235.42 750 236" fill="none" stroke="#1f5d7a" stroke-width="2.2"/>
<text x="700" y="228" font-size="10.5" fill="#1f5d7a">输入 5.3</text>
<path d="M430,300 V204 H510 V252 H590 V228 H670 V240 H750 " fill="none" stroke="#6b3f63" stroke-width="2.8"/>
<path d="M430 300 Q590.00 298.80 750 300" fill="none" stroke="#5b666f" stroke-width="1.4"/>
<text x="448" y="330" font-size="10.5" fill="#5b666f">① 8→退</text>
<text x="528" y="330" font-size="10.5" fill="#5b666f">② 4→留</text>
<text x="608" y="330" font-size="10.5" fill="#5b666f">③ 6→退</text>
<text x="688" y="330" font-size="10.5" fill="#5b666f">④ 5→留</text>
<rect x="430" y="150" width="80" height="150" fill="#6b3f63" opacity="0">
<animate attributeName="opacity" values="0;0.12;0.12;0;0" keyTimes="0;0.03;0.22;0.26;1" dur="8s" repeatCount="indefinite"/></rect>
<rect x="510" y="150" width="80" height="150" fill="#6b3f63" opacity="0">
<animate attributeName="opacity" values="0;0;0.12;0.12;0;0" keyTimes="0;0.27;0.3;0.47;0.51;1" dur="8s" repeatCount="indefinite"/></rect>
<rect x="590" y="150" width="80" height="150" fill="#6b3f63" opacity="0">
<animate attributeName="opacity" values="0;0;0.12;0.12;0;0" keyTimes="0;0.52;0.55;0.72;0.76;1" dur="8s" repeatCount="indefinite"/></rect>
<rect x="670" y="150" width="80" height="150" fill="#6b3f63" opacity="0">
<animate attributeName="opacity" values="0;0;0.12;0.12;0;0" keyTimes="0;0.77;0.8;0.95;0.98;1" dur="8s" repeatCount="indefinite"/></rect>
