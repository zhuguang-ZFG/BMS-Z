<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 -156 800 620" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>共模电压与隔离动画</title>
  <desc>板间 300 V 电位差的对照：直连把压差打进芯片当场冒烟，隔开后压差挡在缝外、信号照常跳过去。</desc><style>
    .bg { fill: #fffdf5; }
    .panel { fill: #f7f2e5; stroke: #cfc6b2; }
    .fill-boxb { fill: #e4f0df; }
    .fill-boxg { fill: #e4f0df; }
    .fill-boxr { fill: #f6e2df; }
    .fill-boxy { fill: #fbefc7; }
    .fill-b { fill: #176b73; }
    .fill-g { fill: #377b60; }
    .fill-r { fill: #b84745; }
    .fill-y { fill: #926717; }
    .fill-ink { fill: #626d65; }
    .fill-muted { fill: #eee6d5; }
    .fill-lockb { fill: #176b73; }
    .stroke-panel { stroke: #cfc6b2; }
    .stroke-axis { stroke: #626d65; }
    .stroke-b { stroke: #176b73; }
    .stroke-g { stroke: #377b60; }
    .stroke-r { stroke: #b84745; }
    .stroke-y { stroke: #926717; }
    .stroke-check { stroke: #fffdf5; }
    .axis { stroke: #626d65; stroke-width: 1.5; fill: none; }
    .grid { stroke: #cfc6b2; stroke-width: 1; fill: none; }
    .txt { fill: #293b3a; font-size: 13px; }
    .small { fill: #626d65; font-size: 12px; }
    .title { fill: #293b3a; font-size: 16px; font-weight: bold; }
    .hi { fill: #176b73; }
    .warn { fill: #ad4644; }
    .ok { fill: #377b60; }
    .gold { fill: #926717; }
    .on { fill: #fffdf5; font-size: 13px; font-weight: bold; }
    .lineb { stroke: #176b73; stroke-width: 2.5; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #192727; }
      .panel { fill: #223333; stroke: #496160; }
      .fill-boxb { fill: #293f35; }
      .fill-boxg { fill: #293f35; }
      .fill-boxr { fill: #483336; }
      .fill-boxy { fill: #453e2b; }
      .fill-b { fill: #7ec5c5; }
      .fill-g { fill: #8fc7a2; }
      .fill-r { fill: #f39b91; }
      .fill-y { fill: #dfbd78; }
      .fill-ink { fill: #b0beb3; }
      .fill-muted { fill: #2c4040; }
      .fill-lockb { fill: #176b73; }
      .stroke-panel { stroke: #496160; }
      .stroke-axis { stroke: #b0beb3; }
      .stroke-b { stroke: #7ec5c5; }
      .stroke-g { stroke: #8fc7a2; }
      .stroke-r { stroke: #f39b91; }
      .stroke-y { stroke: #dfbd78; }
      .stroke-check { stroke: #192727; }
      .axis { stroke: #b0beb3; }
      .grid { stroke: #496160; }
      .txt { fill: #edf0e5; }
      .small { fill: #b0beb3; }
      .title { fill: #edf0e5; }
      .hi { fill: #7ec5c5; }
      .warn { fill: #f39b91; }
      .ok { fill: #8fc7a2; }
      .gold { fill: #dfbd78; }
      .on { fill: #fffdf5; }
      .lineb { stroke: #7ec5c5; }
    }
</style><rect class="bg" x="0" y="-156" width="800" height="620" /><text class="title" x="24" y="-128">为什么板间通信必须隔离：300V 的"地"不一样</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 为什么板间通信必须隔离：300V 的"地"不一样<animate calcMode="spline" keySplines="0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 地 = +300V<animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 直连 = 300V 电位差瞬间打进芯片 ⚡ 冒烟<animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="408" width="752" height="44" rx="6" /><text class="small" x="40" y="436">300V 被挡在缝外，信号照常跳过。示意。</text><rect width="800" height="400" class="bg" />
  <g stroke-width="2" class="fill-boxb stroke-axis">
    <rect x="60" y="260" width="60" height="46" rx="4" />
    <rect x="60" y="210" width="60" height="46" rx="4" />
    <rect x="60" y="160" width="60" height="46" rx="4" />
    <rect x="60" y="110" width="60" height="46" rx="4" />
  </g>
  <g font-size="12" class="fill-ink">
    <text x="135" y="312" class="small">0V</text>
    <text x="135" y="262" class="small">+75V</text>
    <text x="135" y="212" class="small">+150V</text>
    <text x="135" y="162" class="small">+225V</text>
    <text x="135" y="112" class="small">+300V</text>
  </g>
  <text x="90" y="340" text-anchor="middle" font-size="12" class="txt">电池串（局部）</text>

  
  <rect x="220" y="250" width="150" height="70" rx="10" stroke-width="2" class="panel stroke-axis" />
  <text x="295" y="280" text-anchor="middle" font-size="13" font-weight="bold" class="txt">CMU1</text>
  <text x="295" y="300" text-anchor="middle" font-size="12" class="small">地 = 0V</text>
  <rect x="220" y="80" width="150" height="70" rx="10" stroke-width="2" class="panel stroke-axis" />
  <text x="295" y="110" text-anchor="middle" font-size="13" font-weight="bold" class="txt">CMU2</text>
  <text x="295" y="130" text-anchor="middle" font-size="12" class="warn">地 = +300V</text>
  <line x1="120" y1="283" x2="220" y2="283" stroke-width="1.5" stroke-dasharray="4 3" class="stroke-axis" />
  <line x1="120" y1="133" x2="220" y2="133" stroke-width="1.5" stroke-dasharray="4 3" class="stroke-axis" />

  
  <g opacity="0">
    <animate calcMode="spline" keySplines="0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.42;0.46;1" dur="8s" repeatCount="indefinite" />
    <line x1="370" y1="285" x2="480" y2="285" stroke-width="3" class="stroke-r" />
    <line x1="480" y1="285" x2="480" y2="115" stroke-width="3" class="stroke-r" />
    <line x1="480" y1="115" x2="370" y2="115" stroke-width="3" class="stroke-r" />
    <rect x="480" y="150" width="150" height="70" rx="10" stroke-width="2" class="fill-boxr stroke-r" />
    <text x="555" y="178" text-anchor="middle" font-size="13" font-weight="bold" class="warn">MCU/上位机</text>
    <text x="555" y="198" text-anchor="middle" font-size="12" class="warn">地 = 0V</text>
    
    <g stroke-width="3" stroke-linecap="round" class="stroke-y">
      <animate calcMode="spline" keySplines="0.7 0 0.84 0;0.16 1 0.3 1" attributeName="opacity" values="1;0.2;1" dur="0.4s" repeatCount="indefinite" />
      <line x1="480" y1="190" x2="470" y2="172" />
      <line x1="480" y1="190" x2="492" y2="172" />
      <line x1="480" y1="190" x2="480" y2="168" />
    </g>
    <text x="555" y="255" text-anchor="middle" font-size="14" font-weight="bold" class="warn">直连 = 300V 电位差瞬间打进芯片 ⚡ 冒烟</text>
  </g>

  
  <g opacity="0">
    <animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="0;0;1;1" keyTimes="0;0.46;0.5;1" dur="8s" repeatCount="indefinite" />
    <line x1="370" y1="200" x2="440" y2="200" stroke-width="3" class="stroke-axis" />
    <line x1="520" y1="200" x2="630" y2="200" stroke-width="3" class="stroke-axis" />
    
    <rect x="440" y="170" width="80" height="60" rx="8" stroke-width="2" class="fill-boxg stroke-g" />
    <line x1="480" y1="175" x2="480" y2="225" stroke-width="2" stroke-dasharray="5 4" class="stroke-g" />
    <text x="480" y="252" text-anchor="middle" font-size="12" font-weight="bold" class="ok">隔离器</text>
    
    <circle r="6" class="fill-b">
      <animateMotion calcMode="spline" keySplines="0.42 0 0.58 1" dur="1.4s" repeatCount="indefinite" path="M380,200 H580" />
    </circle>
    <rect x="630" y="165" width="130" height="70" rx="10" stroke-width="2" class="panel stroke-axis" />
    <text x="695" y="193" text-anchor="middle" font-size="13" font-weight="bold" class="txt">MCU/上位机</text>
    <text x="695" y="213" text-anchor="middle" font-size="12" class="small">地 = 0V，安全</text>
    <text x="480" y="130" text-anchor="middle" font-size="13" class="ok">300V 被挡在缝外，信号照常跳过</text>
  </g>

  <text x="400" y="380" text-anchor="middle" font-size="14" class="small">隔离器不传直流电位、只传信号——磁耦 / 容耦 / 光耦 / 变压器（isoSPI）都是同一思想</text>
</svg>