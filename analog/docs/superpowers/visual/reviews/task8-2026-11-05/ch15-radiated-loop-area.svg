[stroke="#1f5d7a"]{stroke:#6fa3b9}
text[fill="#2f7f96"]{fill:#8ac9d8}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#2f7f96"]{fill:#2b5660}
[stroke="#2f7f96"]{stroke:#77b2c1}
text[fill="#3d6b4a"]{fill:#98c096}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#3d6b4a"]{fill:#2f4a33}
[stroke="#3d6b4a"]{stroke:#7aa87c}
text[fill="#a8321f"]{fill:#e0907a}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#a8321f"]{fill:#55231b}
[stroke="#a8321f"]{stroke:#c07a63}
text[fill="#a4630f"]{fill:#dcab63}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#a4630f"]{fill:#553a17}
[stroke="#a4630f"]{stroke:#c08a45}
text[fill="#6b3f63"]{fill:#c4a2bf}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#6b3f63"]{fill:#452c40}
[stroke="#6b3f63"]{stroke:#a17c9b}
}
</style>

<polygon class="marker-wash" points="43.2,23.3 390.3,23.6 705.1,24.7 706.2,63.6 458.8,64.5 43.9,64.6" fill="#a4630f" opacity="0.13"/>
<text x="52" y="58" font-size="38" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">固定频率和电流，缩小回路能降低辐射</text><text x="52" y="94" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">示意自由空间小环：100 MHz、10 mA、3 m；比较最大方向远场。</text>
<rect x="50" y="126" width="900" height="84" rx="6" fill="#f6eedb" stroke="#1f5d7a" stroke-width="2"/>
<rect class="ink-echo" x="50" y="126" width="900" height="84" rx="6" stroke="#1f5d7a" stroke-width="2" fill="none" opacity="0.32" transform="translate(-1.25 -0.97) rotate(-0.11 500.0 168.0)"/>
<text x="76" y="164" font-size="24" fill="#1f5d7a" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">EMC 三要素：干扰源 → 耦合路径 → 敏感设备（或天线）</text>
<text x="76" y="196" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">源、路径与天线都可整改；此图只比较面积项</text>
<rect x="50" y="224" width="430" height="218" rx="6" fill="#f6eedb" stroke="#a8321f" stroke-width="2"/>
<rect class="ink-echo" x="50" y="224" width="430" height="218" rx="6" stroke="#a8321f" stroke-width="2" fill="none" opacity="0.32" transform="translate(1.42 -0.94) rotate(-0.12 265.0 333.0)"/>
<text x="74" y="264" font-size="24" fill="#a8321f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">回路面积 15 cm²</text>
<text x="74" y="304" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">开槽让回流绕路，环变成天线</text>
<text x="74" y="344" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">远场估算</text>
<text x="456" y="346" font-size="22" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="end">658 µV/m</text>
<text x="74" y="386" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">换成对数</text>
<text x="456" y="388" font-size="24" fill="#a8321f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="end">56.36 dBµV/m</text>
<path d="M82 406 Q265.00 404.72 448 406" fill="none" stroke="#c9bb9d" stroke-width="2"/>
<text x="74" y="428" font-size="22" fill="#a8321f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">若比较线为 40，高出 16.36 dB</text>
<rect x="520" y="224" width="430" height="218" rx="6" fill="#f6eedb" stroke="#3d6b4a" stroke-width="2"/>
<rect class="ink-echo" x="520" y="224" width="430" height="218" rx="6" stroke="#3d6b4a" stroke-width="2" fill="none" opacity="0.32" transform="translate(-1.37 0.90) rotate(0.10 735.0 333.0)"/>
<text x="544" y="264" font-size="24" fill="#3d6b4a" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">回路面积 0.5 cm²</text>
<text x="544" y="304" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">回流贴着地平面正下方走</text>
<text x="544" y="344" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">面积掉 30 倍</text>
<text x="926" y="346" font-size="22" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="end">−29.54 dB</text>
<text x="544" y="386" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">换算成场强</text>
<text x="926" y="388" font-size="24" fill="#3d6b4a" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="end">26.82 dBµV/m</text>
<path d="M550 406 Q735.00 405.08 920 406" fill="none" stroke="#c9bb9d" stroke-width="2"/>
<text x="544" y="428" font-size="22" fill="#3d6b4a" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">模型值不等于认证测量值</text>
<rect x="50" y="450" width="900" height="104" rx="6" fill="#f6eedb" stroke="#a4630f" stroke-width="2"/>
<rect class="ink-echo" x="50" y="450" width="900" height="104" rx="6" stroke="#a4630f" stroke-width="2" fill="none" opacity="0.32" transform="translate(-1.17 0.97) rotate(-0.06 500.0 502.0)"/>
<text x="76" y="488" font-size="24" fill="#a4630f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">为什么先动布局</text>
<text x="76" y="526" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">面积是线性项，布局阶段免费；滤波器、屏蔽罩是整改阶段的钱</text>
<rect x="50" y="570" width="900" height="104" rx="6" fill="#f6eedb" stroke="#a8321f" stroke-width="2"/>
<rect class="ink-echo" x="50" y="570" width="900" height="104" rx="6" stroke="#a8321f" stroke-width="2" fill="none" opacity="0.32" transform="translate(-1.05 0.67) rotate(-0.01 500.0 622.0)"/>
<text x="76" y="608" font-size="24" fill="#a8321f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">模型有边界，认证要按适用标准测量</text>
<text x="76" y="646" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">忽略地面反射、机壳与电缆；电流幅值约定、距离和检波方式须一致</text>
</svg>
