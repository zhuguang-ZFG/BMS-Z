<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440">
  <title>云端报文与包端切断对照示意图</title>
  <rect width="880" height="440" fill="#f8fafc"/>
  <style>
  text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
  @media (prefers-color-scheme: dark){
  rect[fill="#f8fafc"]{fill:#0f172a}
  rect[fill="#fff"]{fill:#1e293b}
  [fill="#e2e8f0"]{fill:#334155}
  [stroke="#e2e8f0"]{stroke:#334155}
  [fill="#334155"]{fill:#e2e8f0}
  [stroke="#334155"]{stroke:#e2e8f0}
  [fill="#1e293b"]{fill:#f1f5f9}
  [stroke="#1e293b"]{stroke:#f1f5f9}
  [fill="#dbeafe"]{fill:#1e3a8a}
  [stroke="#dbeafe"]{stroke:#1e3a8a}
  [fill="#bfdbfe"]{fill:#1e40af}
  [stroke="#bfdbfe"]{stroke:#1e40af}
  [fill="#1d4ed8"]{fill:#60a5fa}
  [stroke="#1d4ed8"]{stroke:#60a5fa}
  [fill="#ecfdf5"]{fill:#022c22}
  [stroke="#ecfdf5"]{stroke:#022c22}
  [fill="#a7f3d0"]{fill:#065f46}
  [stroke="#a7f3d0"]{stroke:#065f46}
  [fill="#059669"]{fill:#34d399}
  [stroke="#059669"]{stroke:#34d399}
  [fill="#fffbeb"]{fill:#451a03}
  [stroke="#fffbeb"]{stroke:#451a03}
  [fill="#fef3c7"]{fill:#78350f}
  [stroke="#fef3c7"]{stroke:#78350f}
  [fill="#b45309"]{fill:#fbbf24}
  [stroke="#b45309"]{stroke:#fbbf24}
  [fill="#fef2f2"]{fill:#450a0a}
  [stroke="#fef2f2"]{stroke:#450a0a}
  [fill="#fecaca"]{fill:#7f1d1d}
  [stroke="#fecaca"]{stroke:#7f1d1d}
  [fill="#dc2626"]{fill:#f87171}
  [stroke="#dc2626"]{stroke:#f87171}
  }
  </style>
  <text x="440" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">示意图：包上先切断，云端报文可以晚到</text>
  <rect x="16" y="52" width="420" height="250" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="32" y="78" font-size="15" font-weight="bold" fill="#1e293b">留在包上</text>
  <rect x="32" y="96" width="180" height="44" rx="6" fill="#fecaca" stroke="#dc2626"/>
  <text x="122" y="123" text-anchor="middle" font-size="14" fill="#1e293b">比较器 / 接触器</text>
  <text x="32" y="168" font-size="14" fill="#1e293b">过充过放过流短路过温</text>
  <text x="32" y="192" font-size="14" fill="#334155">开线、绝缘、粘连</text>
  <text x="32" y="224" font-size="14" fill="#334155">不看蜂窝信号。</text>
  <text x="32" y="256" font-size="14" fill="#dc2626">这一拍就切断。</text>
  <rect x="230" y="210" width="180" height="36" rx="4" fill="#fef2f2" stroke="#dc2626"/>
  <text x="320" y="233" text-anchor="middle" font-size="13" fill="#1e293b">充电 MOS 已关</text>

  <rect x="452" y="52" width="412" height="250" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="468" y="78" font-size="15" font-weight="bold" fill="#1e293b">云端看得到的</text>
  <rect x="468" y="96" width="120" height="44" rx="6" fill="#dbeafe" stroke="#1d4ed8"><animate attributeName="stroke-width" values="5;2;5" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite"/></rect>
  <text x="528" y="123" text-anchor="middle" font-size="14" fill="#1e293b">报文</text>
  <rect x="720" y="96" width="120" height="44" rx="6" fill="#e2e8f0" stroke="#334155"><animate attributeName="stroke-width" values="2;5;2" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite"/></rect>
  <text x="780" y="123" text-anchor="middle" font-size="14" fill="#1e293b">平台</text>
  <circle cy="118" r="6" fill="#1d4ed8">
    <animate attributeName="cx" values="540;760;540" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <text x="468" y="172" font-size="14" fill="#334155">正常存储间隔最大可到 30 s。</text>
  <text x="468" y="196" font-size="14" fill="#334155">3 级报警才收到不超过 1 s。</text>
  <text x="468" y="228" font-size="14" fill="#334155">这是 GB/T 32960.2—2016 的记录，</text>
  <text x="468" y="252" font-size="14" fill="#334155">不是保护动作时限。</text>
  <text x="468" y="280" font-size="14" fill="#1e293b">蓝点晚到，闸已经断开。</text>

  <text x="16" y="340" font-size="14" fill="#1e293b">云可以做车队统计，也可以建议新标定。建议值不能直接放宽硬件比较器。</text>
  <text x="16" y="368" font-size="14" fill="#334155">采集频次不应低于 1 次/s。通信断了先存本地，恢复后再补发。</text>
  <text x="16" y="402" font-size="14" fill="#b45309">示意图，不是监控平台截图。没有可转载的车队屏幕照片。</text>
</svg>
