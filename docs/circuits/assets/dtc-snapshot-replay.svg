<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420">
  <title>故障注入与快照回放示意图</title>
  <rect width="880" height="420" fill="#f8fafc"/>
  <style>
  text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
  @media (prefers-color-scheme: dark){
  rect[fill="#f8fafc"]{fill:#0f172a}
  rect[fill="#fff"]{fill:#1e293b}
  [fill="#e2e8f0"]{fill:#334155}
  [stroke="#e2e8f0"]{stroke:#334155}
  [fill="#334155"]{fill:#e2e8f0}
  [stroke="#334155"]{stroke:#e2e8f0}
  [fill="#1e293b"]{fill:#f1f5f9}
  [stroke="#1e293b"]{stroke:#f1f5f9}
  [fill="#dbeafe"]{fill:#1e3a8a}
  [stroke="#dbeafe"]{stroke:#1e3a8a}
  [fill="#bfdbfe"]{fill:#1e40af}
  [stroke="#bfdbfe"]{stroke:#1e40af}
  [fill="#1d4ed8"]{fill:#60a5fa}
  [stroke="#1d4ed8"]{stroke:#60a5fa}
  [fill="#ecfdf5"]{fill:#022c22}
  [stroke="#ecfdf5"]{stroke:#022c22}
  [fill="#a7f3d0"]{fill:#065f46}
  [stroke="#a7f3d0"]{stroke:#065f46}
  [fill="#059669"]{fill:#34d399}
  [stroke="#059669"]{stroke:#34d399}
  [fill="#fffbeb"]{fill:#451a03}
  [stroke="#fffbeb"]{stroke:#451a03}
  [fill="#fef3c7"]{fill:#78350f}
  [stroke="#fef3c7"]{stroke:#78350f}
  [fill="#b45309"]{fill:#fbbf24}
  [stroke="#b45309"]{stroke:#fbbf24}
  [fill="#fef2f2"]{fill:#450a0a}
  [stroke="#fef2f2"]{stroke:#450a0a}
  [fill="#fecaca"]{fill:#7f1d1d}
  [stroke="#fecaca"]{stroke:#7f1d1d}
  [fill="#dc2626"]{fill:#f87171}
  [stroke="#dc2626"]{stroke:#f87171}
  }
  </style>
  <text x="440" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">示意图：先冻结过充那一帧，后面的短路不许覆盖</text>
  <rect x="16" y="52" width="270" height="250" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="32" y="78" font-size="15" font-weight="bold" fill="#1e293b">注入脚本</text>
  <text x="32" y="108" font-size="13" fill="#334155">第 1–2 拍：4300 mV，未满去抖</text>
  <text x="32" y="132" font-size="13" fill="#334155">第 3 拍：记过充，断充电</text>
  <text x="32" y="156" font-size="13" fill="#334155">再注入短路电流</text>
  <text x="32" y="190" font-size="13" fill="#1e293b">显示主故障可以升级。</text>
  <text x="32" y="214" font-size="13" fill="#1e293b">第一现场停在过充。</text>
  <line x1="40" y1="250" x2="250" y2="250" stroke="#334155"/>
  <circle cy="250" r="7" fill="#1d4ed8">
    <animate attributeName="cx" values="48;250;48" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <text x="32" y="278" font-size="12" fill="#334155">蓝点沿时间轴走，不看动画也能读上面三行</text>

  <rect x="304" y="52" width="270" height="250" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="320" y="78" font-size="15" font-weight="bold" fill="#1e293b">冻结的快照</text>
  <rect x="320" y="96" width="238" height="150" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="336" y="124" font-size="14" fill="#1e293b">故障：过充</text>
  <text x="336" y="150" font-size="14" fill="#1e293b">第 3 串：4300 mV</text>
  <text x="336" y="176" font-size="14" fill="#1e293b">电流：+2000 mA</text>
  <text x="336" y="202" font-size="14" fill="#1e293b">教学阈值，不是产品规格</text>
  <text x="336" y="228" font-size="13" fill="#334155">上电后的第一次故障</text>

  <rect x="592" y="52" width="272" height="250" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="608" y="78" font-size="15" font-weight="bold" fill="#1e293b">稍后的现场</text>
  <rect x="608" y="96" width="240" height="72" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="624" y="126" font-size="14" fill="#1e293b">当前显示：短路</text>
  <text x="624" y="150" font-size="13" fill="#334155">两路都已断开</text>
  <text x="608" y="196" font-size="13" fill="#1e293b">回放仍读出过充那一帧。</text>
  <text x="608" y="220" font-size="13" fill="#334155">0 mV 在本骨架里会变成欠压，</text>
  <text x="608" y="242" font-size="13" fill="#334155">那不是开线检测。</text>
  <text x="16" y="340" font-size="14" fill="#334155">这张是示意图，不是实验台照片。PC 命令见阶段 6 §6.2.5。</text>
  <text x="16" y="368" font-size="14" fill="#b45309">不要用真电池做短路或过充注入。</text>
</svg>
