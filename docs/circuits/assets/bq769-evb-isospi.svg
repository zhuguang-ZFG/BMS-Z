<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 590" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>菊花链示意：共模按节数乘大约 3.7 V 升高，穿过变压器的差分不跟着这根斜线走。</title>
  <desc>红线是 n×3.7 V，蓝线停在示意 2 V。金点沿红线走。评估板照片仍然没有，这张不代替实拍。</desc>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; }
    .linek { stroke: #57606a; stroke-width: 2.2; fill: none; stroke-dasharray: 7 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .dotg { fill: #1a7f37; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    .boxy { fill: #fff8c5; stroke: #d4a72c; }
    .boxr { fill: #ffebe9; stroke: #ff8182; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .linek { stroke: #8b949e; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .dotg { fill: #3fb950; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
      .boxy { fill: #3d2e00; stroke: #d29922; }
      .boxr { fill: #3d1418; stroke: #f85149; }
    }
  </style>
  <!-- formula: Vcm=n*3.7 V; Vdiff=2 V flat; 3.7 V is the lecture approximation, not an EVB measurement -->
  <rect class="bg" width="800" height="590"/>
  <text class="title" x="24" y="32">数据包过去，几十伏的共模留在墙这边（示意）</text>
  <rect class="panel" x="24" y="44" width="752" height="124" rx="6"/>
  <text class="txt" x="40" y="68" opacity="0.28">① 每多一节<tspan class="small">　共模大约再抬 3.7 V。这是讲义里的大约值。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="92" opacity="0.28">② 十二到十六节<tspan class="small">　相邻从板之间就是几十伏，不是一根普通排线。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="116" opacity="0.28">③ 差分不过这条斜线<tspan class="small">　示意 2 V。变压器让它过去，共模留下。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="140" opacity="0.28">④ 口诀<tspan class="small">　数据穿过变压器，高压电位差留在墙那边。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="180" width="752" height="268" rx="6"/>
  <text class="small" x="40" y="202">电压 V（示意）</text>
  <text class="warn" x="200" y="218">红 共模</text>
  <text class="hi" x="320" y="218">蓝 差分示意</text>
  <line class="axis" x1="108.0" y1="248.0" x2="108.0" y2="400.0"/>
  <line class="axis" x1="108.0" y1="400.0" x2="720.0" y2="400.0"/>
  <line class="grid" x1="108.0" y1="400.0" x2="108.0" y2="406.0"/>
  <text class="small" x="108.0" y="422.0" text-anchor="middle">0</text>
  <line class="grid" x1="567.0" y1="400.0" x2="567.0" y2="406.0"/>
  <text class="small" x="567.0" y="422.0" text-anchor="middle">12</text>
  <line class="grid" x1="720.0" y1="400.0" x2="720.0" y2="406.0"/>
  <text class="small" x="720.0" y="422.0" text-anchor="middle">16</text>
  <line class="grid" x1="102.0" y1="395.7" x2="108.0" y2="395.7"/>
  <text class="small" x="98.0" y="399.7" text-anchor="end">2</text>
  <line class="grid" x1="102.0" y1="303.6" x2="108.0" y2="303.6"/>
  <text class="small" x="98.0" y="307.6" text-anchor="end">44</text>
  <line class="grid" x1="102.0" y1="271.5" x2="108.0" y2="271.5"/>
  <text class="small" x="98.0" y="275.5" text-anchor="end">59</text>
  <text class="small" x="720" y="444" text-anchor="end">隔开的节数</text>
  <polyline class="liner" points="108.0,400.0 127.1,396.0 146.2,392.0 165.4,387.9 184.5,383.9 203.6,379.9 222.8,375.9 241.9,371.9 261.0,367.9 280.1,363.8 299.2,359.8 318.4,355.8 337.5,351.8 356.6,347.8 375.8,343.8 394.9,339.7 414.0,335.7 433.1,331.7 452.2,327.7 471.4,323.7 490.5,319.7 509.6,315.6 528.8,311.6 547.9,307.6 567.0,303.6 586.1,299.6 605.2,295.6 624.4,291.5 643.5,287.5 662.6,283.5 681.8,279.5 700.9,275.5 720.0,271.5" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline class="lineb" points="108.0,395.7 127.1,395.7 146.2,395.7 165.4,395.7 184.5,395.7 203.6,395.7 222.8,395.7 241.9,395.7 261.0,395.7 280.1,395.7 299.2,395.7 318.4,395.7 337.5,395.7 356.6,395.7 375.8,395.7 394.9,395.7 414.0,395.7 433.1,395.7 452.2,395.7 471.4,395.7 490.5,395.7 509.6,395.7 528.8,395.7 547.9,395.7 567.0,395.7 586.1,395.7 605.2,395.7 624.4,395.7 643.5,395.7 662.6,395.7 681.8,395.7 700.9,395.7 720.0,395.7" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="doty" r="6" cx="108.0" cy="400.0"><animate attributeName="cx" values="108.0;337.5;567.0;720.0;720.0" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="400.0;351.8;303.6;271.5;271.5" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite"/></circle>
  <circle class="dotr" r="4" cx="108.0" cy="400.0"><animate attributeName="cx" values="108.0;337.5;567.0;720.0;720.0" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite" begin="-6s"/><animate attributeName="cy" values="400.0;351.8;303.6;271.5;271.5" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite" begin="-6s"/></circle>
  <rect class="panel" x="24" y="460" width="752" height="68" rx="6"/>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="1">n = 0 · 共模 0.0 V · 差分 2 V（示意）<animate attributeName="opacity" values="1;0;0;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0">n = 6 · 共模 22.2 V · 差分 2 V（示意）<animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0">n = 12 · 共模 44.4 V · 差分 2 V（示意）<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0">n = 16 · 共模 59.2 V · 差分 2 V（示意）<animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="24" y="560">3.7 V 是锂离子大约的工作电压，不是 BQ769 评估板测到的共模，也不是 isoSPI 的时序。</text>

</svg>
