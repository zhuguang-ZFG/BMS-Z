<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">一只晶体管的三种人生：共射、共集、共基</text>

<text x="400" y="56" text-anchor="middle" font-size="11" fill="#5b666f">信号从哪进、从哪出、哪个极做交流公共端 —— 决定它的性格</text>
<rect x="30" y="66" width="240" height="290" rx="10" fill="#f6eedb" stroke="#1f5d7a" stroke-width="1.8"/><text x="150" y="94" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1f5d7a">共射 CE</text><polygon points="108,116 108,184 168,150" fill="#f6eedb" stroke="#1f5d7a" stroke-width="2.2"/><text x="176" y="146" font-size="11" font-weight="bold" fill="#1f5d7a">B 进 → C 出</text><path d="M44 196 Q150.00 196.00 256 196" fill="none" stroke="#c9bb9d" stroke-width="1"/><text x="46" y="218" font-size="11" fill="#5b666f">电压增益</text><text x="254" y="218" text-anchor="end" font-size="11" font-weight="bold" fill="#1f5d7a">高（几十~几百）</text><text x="46" y="240" font-size="11" fill="#5b666f">输入阻抗</text><text x="254" y="240" text-anchor="end" font-size="11" font-weight="bold" fill="#1f5d7a">中 ~kΩ</text><text x="46" y="262" font-size="11" fill="#5b666f">输出阻抗</text><text x="254" y="262" text-anchor="end" font-size="11" font-weight="bold" fill="#1f5d7a">中 ~kΩ</text><text x="46" y="284" font-size="11" fill="#5b666f">相位</text><text x="254" y="284" text-anchor="end" font-size="11" font-weight="bold" fill="#1f5d7a">反相 180°</text><path d="M44 298 Q150.00 298.84 256 298" fill="none" stroke="#e0d3b8" stroke-width="1"/><text x="46" y="320" font-size="11" fill="#5b666f">用途</text><text x="254" y="320" text-anchor="end" font-size="11" font-weight="bold" fill="#1f5d7a">放大主力</text><rect x="283" y="66" width="240" height="290" rx="10" fill="#f6eedb" stroke="#3d6b4a" stroke-width="1.8"/><text x="403" y="94" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3d6b4a">共集 CC</text><polygon points="361,116 361,184 421,150" fill="#f6eedb" stroke="#3d6b4a" stroke-width="2.2"/><text x="429" y="146" font-size="11" font-weight="bold" fill="#3d6b4a">B 进 → E 出</text><path d="M297 196 Q403.00 196.04 509 196" fill="none" stroke="#c9bb9d" stroke-width="1"/><text x="299" y="218" font-size="11" fill="#5b666f">电压增益</text><text x="507" y="218" text-anchor="end" font-size="11" font-weight="bold" fill="#3d6b4a">≈1（略小于 1）</text><text x="299" y="240" font-size="11" fill="#5b666f">输入阻抗</text><text x="507" y="240" text-anchor="end" font-size="11" font-weight="bold" fill="#3d6b4a">高</text><text x="299" y="262" font-size="11" fill="#5b666f">输出阻抗</text><text x="507" y="262" text-anchor="end" font-size="11" font-weight="bold" fill="#3d6b4a">低（Ω 级）</text><text x="299" y="284" font-size="11" fill="#5b666f">相位</text><text x="507" y="284" text-anchor="end" font-size="11" font-weight="bold" fill="#3d6b4a">同相</text><path d="M297 298 Q403.00 298.26 509 298" fill="none" stroke="#e0d3b8" stroke-width="1"/><text x="299" y="320" font-size="11" fill="#5b666f">用途</text><text x="507" y="320" text-anchor="end" font-size="11" font-weight="bold" fill="#3d6b4a">缓冲/阻抗变换</text><rect x="536" y="66" width="240" height="290" rx="10" fill="#f6eedb" stroke="#a4630f" stroke-width="1.8"/><text x="656" y="94" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a4630f">共基 CB</text><polygon points="614,116 614,184 674,150" fill="#f6eedb" stroke="#a4630f" stroke-width="2.2"/><text x="682" y="146" font-size="11" font-weight="bold" fill="#a4630f">E 进 → C 出</text><path d="M550 196 Q656.00 195.98 762 196" fill="none" stroke="#c9bb9d" stroke-width="1"/><text x="552" y="218" font-size="11" fill="#5b666f">电压增益</text><text x="760" y="218" text-anchor="end" font-size="11" font-weight="bold" fill="#a4630f">高</text><text x="552" y="240" font-size="11" fill="#5b666f">输入阻抗</text><text x="760" y="240" text-anchor="end" font-size="11" font-weight="bold" fill="#a4630f">极低（几十Ω）</text><text x="552" y="262" font-size="11" fill="#5b666f">输出阻抗</text><text x="760" y="262" text-anchor="end" font-size="11" font-weight="bold" fill="#a4630f">中</text><text x="552" y="284" font-size="11" fill="#5b666f">相位</text><text x="760" y="284" text-anchor="end" font-size="11" font-weight="bold" fill="#a4630f">同相</text><path d="M550 298 Q656.00 298.32 762 298" fill="none" stroke="#e0d3b8" stroke-width="1"/><text x="552" y="320" font-size="11" fill="#5b666f">用途</text><text x="760" y="320" text-anchor="end" font-size="11" font-weight="bold" fill="#a4630f">高频放大</text>
<path d="M30 378 Q400.00 379.38 770 378" fill="none" stroke="#c9bb9d" stroke-width="1"/>
<text x="400" y="406" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#37424e">三句话记住它们</text>
<text x="60" y="436" font-size="11.5" fill="#5b666f">① <tspan font-weight="bold" fill="#2563eb">共射</tspan>：电压放大最强、但输入输出阻抗都平庸——「主力但不好带」</text>
<text x="60" y="460" font-size="11.5" fill="#5b666f">② <tspan font-weight="bold" fill="#059669">共集（射随器）</tspan>：放弃电压增益，换来「高进低出」——前级带不动？中间插一级它</text>
<text x="60" y="484" font-size="11.5" fill="#5b666f">③ <tspan font-weight="bold" fill="#b45309">共基</tspan>：牺牲输入阻抗换高频性能——Miller 电容不再接地，高频放大器的最爱</text>
<rect x="60" y="506" width="680" height="76" rx="8" fill="#f7eedb" stroke="#a4630f" stroke-width="1.6"/>
<text x="76" y="532" font-size="12" font-weight="bold" fill="#a4630f">射随器为什么叫「跟随」</text>
<text x="76" y="554" font-size="11.5" fill="#5b666f">V_E = V_B − 0.7V：基极动多少、发射极跟着动多少（差一个死板的 0.7V）。它放大的不是电压而是<tspan font-weight="bold">电流</tspan>：</text>
<text x="76" y="574" font-size="11.5" fill="#5b666f">信号源只出 I_B，负载拿走 I_E = (1+β)·I_B —— 这就是「阻抗变换」的全部秘密</text>
