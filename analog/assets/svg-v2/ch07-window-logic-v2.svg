<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">窗口内放行，要先接对两路比较极性</title>
<desc id="figDesc">示意：电池减半分压；理想门限 3.0 / 3.6 V，等于门限时不保证状态。</desc>
<metadata id="visual-timeline">{&quot;duration&quot;: 12, &quot;beats&quot;: [{&quot;name&quot;: &quot;条件&quot;, &quot;start&quot;: 0, &quot;end&quot;: 3, &quot;caption&quot;: &quot;欠压路：被测电压进正端，1.5 V 基准进负端。&quot;}, {&quot;name&quot;: &quot;变化&quot;, &quot;start&quot;: 3, &quot;end&quot;: 6, &quot;caption&quot;: &quot;过压路：1.8 V 基准进正端，被测电压进负端。&quot;}, {&quot;name&quot;: &quot;比较&quot;, &quot;start&quot;: 6, &quot;end&quot;: 9, &quot;caption&quot;: &quot;欠压或过压时，任一路输出管都能拉低公共节点。&quot;}, {&quot;name&quot;: &quot;结论&quot;, &quot;start&quot;: 9, &quot;end&quot;: 12, &quot;caption&quot;: &quot;只有两路都松手，上拉才能给出窗口内的高电平。&quot;}]}</metadata>
