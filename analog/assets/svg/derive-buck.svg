<text x="412" y="134" font-size="11.5" font-weight="bold" fill="#a4630f">① 电感电流是三角波</text><text x="412" y="159" font-size="14.5" font-weight="bold" fill="#16202b">ΔIL = (Vin−Vout)·D / (L·fsw)</text><text x="412" y="176" font-size="10.5" fill="#5b666f">伏秒平衡：开关期间爬升、关断期间下降</text>
<text x="412" y="192" font-size="11.5" font-weight="bold" fill="#a4630f">② 电容只收「净电荷」</text><text x="412" y="217" font-size="14.5" font-weight="bold" fill="#16202b">ΔQ = ½ · (ΔIL/2) · (T/2)</text><text x="412" y="234" font-size="10.5" fill="#5b666f">三角波围出的面积 = ½×底×高</text><rect x="400" y="168" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.166667;0.196667;1" dur="16s" repeatCount="indefinite"/></rect>
<text x="412" y="250" font-size="11.5" font-weight="bold" fill="#a4630f">③ 化简成频率</text><text x="412" y="275" font-size="14.5" font-weight="bold" fill="#16202b">ΔQ = ΔIL / (8·fsw)</text><text x="412" y="292" font-size="10.5" fill="#5b666f">T/2 换成 1/(2fsw)，三角形摊成常数 1/8</text><rect x="400" y="226" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.333333;0.363333;1" dur="16s" repeatCount="indefinite"/></rect>
<text x="412" y="308" font-size="11.5" font-weight="bold" fill="#a4630f">④ 电容定义</text><text x="412" y="333" font-size="14.5" font-weight="bold" fill="#16202b">ΔV = ΔQ / C</text><text x="412" y="350" font-size="10.5" fill="#5b666f">C = Q/U 反解</text><rect x="400" y="284" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.5;0.53;1" dur="16s" repeatCount="indefinite"/></rect>
<text x="412" y="366" font-size="11.5" font-weight="bold" fill="#a4630f">⑤ 合并</text><text x="412" y="391" font-size="14.5" font-weight="bold" fill="#16202b">ΔV = ΔIL / (8·fsw·C)</text><text x="412" y="408" font-size="10.5" fill="#5b666f">公式里的 8 是三角波的几何，不是怪数</text><rect x="400" y="342" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.666667;0.696667;1" dur="16s" repeatCount="indefinite"/></rect>
<text x="412" y="424" font-size="11.5" font-weight="bold" fill="#a4630f">⑥ 代入数字</text><text x="412" y="449" font-size="14.5" font-weight="bold" fill="#16202b">0.884A / (8×150k×100µF) ≈ 7.4mV</text><text x="412" y="466" font-size="10.5" fill="#5b666f">L、C、fsw 三家一起决定纹波</text><rect x="400" y="400" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.833333;0.863333;1" dur="16s" repeatCount="indefinite"/></rect>
<g><rect x="30" y="612" width="740" height="34.0" rx="9" fill="#e8efe6" stroke="#3d6b4a" stroke-width="1.5" filter="url(#soft)"/><rect x="36" y="619" width="3" height="20.0" rx="1.5" fill="#3d6b4a"/><text x="400" y="634.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3d6b4a">要更小的纹波？加大 C（线性）、提高 fsw（线性）、或加粗 L（线性）——三条路都写在同一行式子里</text></g></svg>