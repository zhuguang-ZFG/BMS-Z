  <polyline class="lineg" points="108.0,400.0 114.8,400.0 121.6,400.0 128.4,400.0 135.2,400.0 142.0,400.0 148.8,400.0 155.6,400.0 162.4,400.0 169.2,400.0 176.0,400.0 182.8,400.0 189.6,400.0 196.4,400.0 203.2,400.0 210.0,400.0 216.8,400.0 223.6,400.0 230.4,400.0 237.2,400.0 244.0,400.0 250.8,400.0 257.6,400.0 264.4,400.0 271.2,400.0 278.0,400.0 284.8,400.0 291.6,400.0 298.4,400.0 305.2,400.0 312.0,400.0 318.8,400.0 325.6,400.0 332.4,400.0 339.2,400.0 346.0,400.0 352.8,400.0 359.6,400.0 366.4,400.0 373.2,400.0 380.0,400.0 386.8,400.0 393.6,400.0 400.4,400.0 407.2,400.0 414.0,278.4 420.8,278.4 427.6,278.4 434.4,278.4 441.2,278.4 448.0,278.4 454.8,278.4 461.6,278.4 468.4,278.4 475.2,278.4 482.0,278.4 488.8,278.4 495.6,278.4 502.4,278.4 509.2,278.4 516.0,278.4 522.8,278.4 529.6,278.4 536.4,278.4 543.2,400.0 550.0,400.0 556.8,400.0 563.6,400.0 570.4,400.0 577.2,400.0 584.0,400.0 590.8,400.0 597.6,400.0 604.4,400.0 611.2,400.0 618.0,400.0 624.8,400.0 631.6,400.0 638.4,400.0 645.2,400.0 652.0,400.0 658.8,400.0 665.6,400.0 672.4,400.0 679.2,400.0 686.0,400.0 692.8,400.0 699.6,400.0 706.4,400.0 713.2,400.0 720.0,400.0" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline class="liner" points="108.0,400.0 114.8,400.0 121.6,400.0 128.4,400.0 135.2,400.0 142.0,400.0 148.8,400.0 155.6,400.0 162.4,400.0 169.2,400.0 176.0,400.0 182.8,400.0 189.6,400.0 196.4,400.0 203.2,400.0 210.0,400.0 216.8,400.0 223.6,400.0 230.4,400.0 237.2,400.0 244.0,400.0 250.8,400.0 257.6,400.0 264.4,400.0 271.2,400.0 278.0,400.0 284.8,400.0 291.6,400.0 298.4,400.0 305.2,400.0 312.0,400.0 318.8,400.0 325.6,400.0 332.4,400.0 339.2,400.0 346.0,400.0 352.8,400.0 359.6,400.0 366.4,400.0 373.2,400.0 380.0,400.0 386.8,400.0 393.6,400.0 400.4,400.0 407.2,400.0 414.0,278.4 420.8,278.4 427.6,278.4 434.4,278.4 441.2,278.4 448.0,278.4 454.8,278.4 461.6,278.4 468.4,278.4 475.2,278.4 482.0,278.4 488.8,278.4 495.6,278.4 502.4,278.4 509.2,278.4 516.0,278.4 522.8,278.4 529.6,278.4 536.4,278.4 543.2,278.4 550.0,278.4 556.8,278.4 563.6,278.4 570.4,278.4 577.2,278.4 584.0,278.4 590.8,278.4 597.6,278.4 604.4,278.4 611.2,278.4 618.0,278.4 624.8,278.4 631.6,278.4 638.4,278.4 645.2,278.4 652.0,278.4 658.8,278.4 665.6,278.4 672.4,278.4 679.2,278.4 686.0,278.4 692.8,278.4 699.6,278.4 706.4,278.4 713.2,278.4 720.0,278.4" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="doty" r="6" cx="244.0" cy="400.0"><animate attributeName="cx" values="244.0;434.4;529.6;584.0;584.0" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="400.0;278.4;369.6;369.6;369.6" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite"/></circle>
  <circle class="dotr" r="4" cx="244.0" cy="400.0"><animate attributeName="cx" values="244.0;434.4;529.6;584.0;584.0" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite" begin="-6s"/><animate attributeName="cy" values="400.0;278.4;369.6;369.6;369.6" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite" begin="-6s"/></circle>
  <rect class="panel" x="24" y="460" width="752" height="68" rx="6"/>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="1">示意 t=1.0 s  BMS 0 A  跟随且超时则停 0 A  超时仍灌 0 A<animate attributeName="opacity" values="1;0;0;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0">示意 t=2.4 s  BMS 40 A  跟随且超时则停 40 A  超时仍灌 40 A<animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0">示意 t=3.1 s  BMS 10 A  跟随且超时则停 40 A  超时仍灌 40 A<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0">示意 t=3.5 s  BMS 10 A  跟随且超时则停 0 A  超时仍灌 40 A<animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="24" y="560">不写帧 ID。通信正常也不等于可以合接触器，预充仍要单独走。</text>

</svg>
