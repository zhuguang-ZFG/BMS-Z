<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">二极管选型路标：先问它要去哪上班</title>
<desc id="figDesc">一条手绘岔路从选型起点出发，分向四个岗位：整流岗位工频用普通整流管、高频用肖特基或快恢复；稳压岗位用反向击穿区工作的稳压管并串限流电阻；防护岗位用纳秒级钳位的 TVS 并核对钳位电压与峰值功率；发光岗位用必须限流的 LED。旁边贴着三问便签：方向、压降、坏了会怎样。</desc>
<rect width="960" height="640" fill="#fffdf8"/>
<text x="36" y="46" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="28" font-weight="700" fill="#14213d">二极管选型路标：先问它要去哪上班</text>
<text x="36" y="76" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="15" fill="#52606d">先定岗位，再看速度、压降和失效方式；型号是最后一步。</text>
<line x1="36" y1="94" x2="924" y2="94" stroke="#14213d" stroke-width="2"/>

