<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="ttl">
<title id="ttl">H 桥：四只开关让电流「听指挥」掉头</title>
<desc>H 桥：四只开关让电流「听指挥」掉头；节拍：① 正转：A=1 → Q1+Q4 导通，电流 +12V→Q1→电机→Q4→GND——M 右转；② 反转：B=1 → Q2+Q3 导通，电流整体掉头——换电机两根线就这么干；③ 致命错误：同臂齐开 = +12V 直通 GND，毫秒级烧管——换向必须死区 1~2µs；④ 全关滑行：电感电流没处去，体二极管搭桥流回电源——动能回收，这就是刹车</desc>
