<path d="M218 38 c 91 3.4 219 -2.6 365 0.4" fill="none" stroke="#a4630f" stroke-width="2.1" stroke-linecap="round" opacity="0.5"/>
<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">纹波的两本账：容性与 ESR 谁说了算</text>
<path d="M392 86 Q390.86 361.00 392 636" fill="none" stroke="#c9bb9d" stroke-width="1" stroke-dasharray="6,5"/>
<text x="56" y="110" font-size="13" font-weight="bold" fill="#37424e">两种输出电容的纹波构成（示意）</text>
<rect x="70" y="280" width="34" height="60" fill="#e6eff3" stroke="#1f5d7a" stroke-width="1.4"/>
<rect x="112" y="322" width="34" height="18" fill="#f6e7e1" stroke="#a8321f" stroke-width="1.4"/>
<text x="110" y="360" text-anchor="middle" font-size="12" fill="#37424e">22µF 陶瓷</text>
<rect x="220" y="326" width="34" height="14" fill="#e6eff3" stroke="#1f5d7a" stroke-width="1.4"/>
<rect x="262" y="220" width="34" height="120" fill="#f6e7e1" stroke="#a8321f" stroke-width="1.4"/>
<text x="260" y="360" text-anchor="middle" font-size="12" fill="#37424e">100µF 电解</text>
<text x="70" y="180" font-size="11" fill="#1f5d7a">容性</text>
<text x="70" y="200" font-size="11" fill="#a8321f">ESR</text>
<path d="M62 340 Q196.00 339.28 330 340" fill="none" stroke="#8b8272" stroke-width="1.4"/>
<rect x="116" y="408" width="160" height="24" rx="6" fill="#f6eedb" stroke="#3d6b4a" stroke-width="1"/><text x="196" y="424" text-anchor="middle" font-size="12" font-weight="bold" fill="#3d6b4a">谷底低而宽才叫去耦好手</text><rect x="400" y="110" width="352" height="58" rx="7" fill="none" stroke="#a4630f" stroke-width="1.8" opacity="0.9"><animate attributeName="y" values="134;192;250;308;308" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/></rect>
<text x="412" y="134" font-size="11.5" font-weight="bold" fill="#a4630f">① 容性纹波</text><text x="412" y="159" font-size="14.5" font-weight="bold" fill="#16202b">ΔVc = ΔIL / (8 f C)</text><text x="412" y="176" font-size="10.5" fill="#5b666f">22µF、0.6A、500kHz → 6.8mV</text>
<text x="412" y="192" font-size="11.5" font-weight="bold" fill="#a4630f">② ESR 纹波</text><text x="412" y="217" font-size="14.5" font-weight="bold" fill="#16202b">ΔVesr = ΔIL × ESR</text><text x="412" y="234" font-size="10.5" fill="#5b666f">3mΩ → 1.8mV</text><rect x="400" y="168" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.25;0.28;1" dur="14s" repeatCount="indefinite"/></rect>
<text x="412" y="250" font-size="11.5" font-weight="bold" fill="#a4630f">③ 换电解再看</text><text x="412" y="275" font-size="14.5" font-weight="bold" fill="#16202b">200mΩ → 120mV</text><text x="412" y="292" font-size="10.5" fill="#5b666f">容量降到 1.5mV，ESR 说了算</text><rect x="400" y="226" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.5;0.53;1" dur="14s" repeatCount="indefinite"/></rect>
<text x="412" y="308" font-size="11.5" font-weight="bold" fill="#a4630f">④ 药方</text><text x="412" y="333" font-size="14.5" font-weight="bold" fill="#16202b">低 ESR 加容量；高 ESR 先降 ESR</text><text x="412" y="350" font-size="10.5" fill="#5b666f">同一句「纹波大」，两本账</text><rect x="400" y="284" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.75;0.78;1" dur="14s" repeatCount="indefinite"/></rect>
<g><rect x="30" y="612" width="740" height="34.0" rx="9" fill="#e8efe6" stroke="#3d6b4a" stroke-width="1.5" filter="url(#soft)"/><rect x="36" y="619" width="3" height="20.0" rx="1.5" fill="#3d6b4a"/><text x="400" y="634.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3d6b4a">22µF 陶瓷：容性 6.8mV 主导；100µF 电解：ESR 120mV 主导——药方各开各的（1.2 节算一笔）</text></g></svg>