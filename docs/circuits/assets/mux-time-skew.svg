</style>

  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">MUX 示例：一圈 1.6 ms，首尾不是同一瞬间</text>
  <text x="400" y="54" text-anchor="middle" font-size="13" fill="#475569">每串 100 μs 是示例，不是某一颗 AFE 手册里的转换时间。</text>
  <rect x="40" y="100" width="28" height="36" fill="#dbeafe" stroke="#1d4ed8">
    <animate attributeName="x" values="48;92;136;180;224;268;312;356;400;444;488;532;576;620;664;708" keyTimes="0;0.067;0.133;0.200;0.267;0.333;0.400;0.467;0.533;0.600;0.667;0.733;0.800;0.867;0.933;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
  </rect>
<text x="62" y="156" text-anchor="middle" font-size="11" fill="#475569">1</text>
<text x="106" y="156" text-anchor="middle" font-size="11" fill="#475569">2</text>
<text x="150" y="156" text-anchor="middle" font-size="11" fill="#475569">3</text>
<text x="194" y="156" text-anchor="middle" font-size="11" fill="#475569">4</text>
<text x="238" y="156" text-anchor="middle" font-size="11" fill="#475569">5</text>
<text x="282" y="156" text-anchor="middle" font-size="11" fill="#475569">6</text>
<text x="326" y="156" text-anchor="middle" font-size="11" fill="#475569">7</text>
<text x="370" y="156" text-anchor="middle" font-size="11" fill="#475569">8</text>
<text x="414" y="156" text-anchor="middle" font-size="11" fill="#475569">9</text>
<text x="458" y="156" text-anchor="middle" font-size="11" fill="#475569">10</text>
<text x="502" y="156" text-anchor="middle" font-size="11" fill="#475569">11</text>
<text x="546" y="156" text-anchor="middle" font-size="11" fill="#475569">12</text>
<text x="590" y="156" text-anchor="middle" font-size="11" fill="#475569">13</text>
<text x="634" y="156" text-anchor="middle" font-size="11" fill="#475569">14</text>
<text x="678" y="156" text-anchor="middle" font-size="11" fill="#475569">15</text>
<text x="722" y="156" text-anchor="middle" font-size="11" fill="#475569">16</text>
  <text x="80" y="210" font-size="14" fill="#1e293b">第 1 串读数 3.700 V</text>
  <text x="420" y="210" font-size="14" fill="#1e293b">第 16 串读数 3.650 V</text>
  <text x="80" y="250" font-size="13" fill="#475569">扫描期间电流涨了 50 A</text>
  <text x="420" y="250" font-size="13" fill="#475569">1 mΩ × 50 A = 50 mV</text>
  <rect x="80" y="280" width="20" height="40" fill="#1d4ed8">
    <animate attributeName="height" values="8;40;8" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="y" values="312;280;312" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="120" y="308" font-size="13" fill="#1e293b">电流在这一圈里变化（示例）</text>
  <text x="400" y="370" text-anchor="middle" font-size="14" fill="#991b1b">把 16 个数当成同一瞬间，就会对着这 50 mV 去均衡。</text>
  <text x="400" y="410" text-anchor="middle" font-size="13" fill="#475569">50 A、1 mΩ、100 μs 都是数量级示例。</text>

</svg>
