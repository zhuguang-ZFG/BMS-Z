<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">树状供电：输入 → 储能 → 稳压 → 去耦，逐级净化</text>

<text x="400" y="46" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#37424e">电源不是「一根线拉到底」：每一级都在替下一级挡脏</text>
<rect x="34" y="192" width="104" height="56" rx="10" fill="#e6eff3" stroke="#1f5d7a" stroke-width="2"/>
<text x="86" y="216" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#16202b">输入 12V</text>
<text x="86" y="234" text-anchor="middle" font-size="9.5" fill="#5b666f">适配器 / 电池</text>
<rect x="196" y="184" width="128" height="72" rx="10" fill="#f7eedb" stroke="#a4630f" stroke-width="2"/>
<text x="260" y="210" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#16202b">板级储能</text>
<text x="260" y="228" text-anchor="middle" font-size="10" fill="#a4630f">10~100µF 大电解</text>
<text x="260" y="244" text-anchor="middle" font-size="9.5" fill="#5b666f">扛大电流脉冲</text>
