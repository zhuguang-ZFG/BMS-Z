<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 544" font-family="ui-monospace, Consolas, monospace">
  <title>BMS 信号链的时间账：采样、估算、判决、执行累加。数字为示意。</title>

  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #bf8700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.5; fill: none; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
    }
  </style>

  <!-- formula: t = 8+3+1+0.2 ms; cumulative 8, 11, 12, 12.2 -->
  <rect class="bg" width="800" height="544"/>
  <text class="title" x="24" y="32">一拍数据从电芯走到开关，时间花在哪（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="128" rx="6"/>
  <text class="txt" x="40" y="72" opacity="0.28">① 采样 8 ms<tspan class="small">　这一拍最肥。电压电流还在滤波器里。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="98" opacity="0.28">② 估算再加 3 ms<tspan class="small">　累计 11 ms。SOC 算完才知道该不该限功率。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="124" opacity="0.28">③ 判决 1 ms<tspan class="small">　累计 12 ms。比较器那条硬件路不在这 1 ms 里。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="150" opacity="0.28">④ 执行 0.2 ms<tspan class="small">　累计 12.2 ms。软件环的大头不在 MOS，在采样。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="188" width="752" height="304" rx="6"/>
  <text class="small" x="40" y="210">累计时间 ms（示意）</text>
  <line class="axis" x1="108.0" y1="228.0" x2="108.0" y2="430.0"/>
  <line class="axis" x1="108.0" y1="430.0" x2="730.0" y2="430.0"/>
  <text class="small" x="730.0" y="468.0" text-anchor="end">信号走到哪一站</text>
  <line class="grid" x1="263.5" y1="430.0" x2="263.5" y2="436.0"/>
  <text class="small" x="263.5" y="452.0" text-anchor="middle">采样完</text>
  <line class="grid" x1="419.0" y1="430.0" x2="419.0" y2="436.0"/>
  <text class="small" x="419.0" y="452.0" text-anchor="middle">估算完</text>
  <line class="grid" x1="574.5" y1="430.0" x2="574.5" y2="436.0"/>
  <text class="small" x="574.5" y="452.0" text-anchor="middle">判决完</text>
  <line class="grid" x1="730.0" y1="430.0" x2="730.0" y2="436.0"/>
  <text class="small" x="730.0" y="452.0" text-anchor="middle">执行完</text>
  <line class="grid" x1="102.0" y1="430.0" x2="108.0" y2="430.0"/>
  <text class="small" x="98.0" y="434.0" text-anchor="end">0</text>
  <line class="grid" x1="102.0" y1="314.6" x2="108.0" y2="314.6"/>
  <text class="small" x="98.0" y="318.6" text-anchor="end">8</text>
  <line class="grid" x1="102.0" y1="256.9" x2="108.0" y2="256.9"/>
  <text class="small" x="98.0" y="260.9" text-anchor="end">12</text>
  <polyline class="lineb" points="108.0,314.6 263.5,314.6 263.5,271.3 419.0,271.3 419.0,256.9 574.5,256.9 574.5,254.0 730.0,254.0" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="doty" r="6"><animate attributeName="cx" values="139.1;263.5;263.5;419.0;419.0;574.5;574.5;730.0" keyTimes="0.0000;0.1429;0.2857;0.4286;0.5714;0.7143;0.8571;1.0000" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="314.6;314.6;271.3;271.3;256.9;256.9;254.0;254.0" keyTimes="0.0000;0.1429;0.2857;0.4286;0.5714;0.7143;0.8571;1.0000" dur="12s" repeatCount="indefinite"/></circle>
  <text class="small" x="24" y="528">8 ms、3 ms、1 ms、0.2 ms 是教学预算，不是某一颗 MCU 的手册。硬件比较器不走这条软件累加。</text>
</svg>
