[stroke="#1f5d7a"]{stroke:#6fa3b9}
text[fill="#2f7f96"]{fill:#8ac9d8}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#2f7f96"]{fill:#2b5660}
[stroke="#2f7f96"]{stroke:#77b2c1}
text[fill="#3d6b4a"]{fill:#98c096}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#3d6b4a"]{fill:#2f4a33}
[stroke="#3d6b4a"]{stroke:#7aa87c}
text[fill="#a8321f"]{fill:#e0907a}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#a8321f"]{fill:#55231b}
[stroke="#a8321f"]{stroke:#c07a63}
text[fill="#a4630f"]{fill:#dcab63}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#a4630f"]{fill:#553a17}
[stroke="#a4630f"]{stroke:#c08a45}
text[fill="#6b3f63"]{fill:#c4a2bf}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#6b3f63"]{fill:#452c40}
[stroke="#6b3f63"]{stroke:#a17c9b}
}
</style>
<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">误差预算：最坏情况 vs 统计叠加</text>
<text x="400" y="53" text-anchor="middle" font-size="12" fill="#5b666f">Buck 反馈分压：WC ±2.7%，1σ ±0.45% → 3σ ±1.35%</text>
<rect x="36" y="76" width="372" height="252" rx="10" fill="#f6eedb" stroke="#5b666f" stroke-width="1.6"/>
<text x="222" y="102" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#37424e">误差源与贡献</text>
<text x="56" y="130" font-size="11" fill="#5b666f">误差源</text>
<text x="272" y="130" text-anchor="end" font-size="11" fill="#5b666f">WC 贡献</text>
<text x="392" y="130" text-anchor="end" font-size="11" fill="#5b666f">1σ 贡献</text>
<path d="M52 140 Q222.00 140.58 392 140" fill="none" stroke="#c9bb9d" stroke-width="1.5"/>
<text x="56" y="166" font-size="11.5" fill="#37424e">反馈电阻容差 ±1%</text>
<text x="272" y="166" text-anchor="end" font-size="11.5" fill="#16202b">±1.0%</text>
<text x="392" y="166" text-anchor="end" font-size="11.5" fill="#16202b">±0.24%</text>
<text x="56" y="192" font-size="11.5" fill="#37424e">V_ref 初始精度 ±1%</text>
<text x="272" y="192" text-anchor="end" font-size="11.5" fill="#16202b">±1.0%</text>
<text x="392" y="192" text-anchor="end" font-size="11.5" fill="#16202b">±0.33%</text>
<text x="56" y="218" font-size="11.5" fill="#37424e">V_ref 温漂 50ppm/℃ × 40℃</text>
<text x="272" y="218" text-anchor="end" font-size="11.5" fill="#16202b">±0.2%</text>
<text x="392" y="218" text-anchor="end" font-size="11.5" fill="#16202b">±0.07%</text>
<text x="56" y="244" font-size="11.5" fill="#37424e">负载调整率</text>
<text x="272" y="244" text-anchor="end" font-size="11.5" fill="#16202b">±0.5%</text>
<text x="392" y="244" text-anchor="end" font-size="11.5" fill="#16202b">±0.17%</text>
<path d="M52 260 Q222.00 260.87 392 260" fill="none" stroke="#c9bb9d" stroke-width="1.5"/>
<text x="56" y="286" font-size="12" font-weight="bold" fill="#a8321f">合计</text>
<text x="272" y="286" text-anchor="end" font-size="12" font-weight="bold" fill="#a8321f">±2.7%</text>
<text x="392" y="286" text-anchor="end" font-size="12" font-weight="bold" fill="#1f5d7a">±0.45%</text>
<rect x="428" y="76" width="336" height="252" rx="10" fill="#e6eff3" stroke="#1f5d7a" stroke-opacity="0.45" stroke-width="1.5"/>
<text x="596" y="102" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f5d7a">同一规格，两种结论</text>
<rect x="504" y="170" width="184" height="22" rx="5" fill="#f6e7e1" stroke="#a8321f" stroke-width="2"/>
<rect x="550" y="202" width="92" height="22" rx="5" fill="#e6eff3" stroke="#1f5d7a" stroke-width="2"/>
<path d="M596 162 Q595.92 197.00 596 232" fill="none" stroke="#37424e" stroke-width="1.6" stroke-dasharray="4,4"/>
<text x="492" y="186" text-anchor="end" font-size="11.5" fill="#a8321f">WC</text>
<text x="492" y="218" text-anchor="end" font-size="11.5" fill="#1f5d7a">3σ</text>
<text x="694" y="186" font-size="11" fill="#a8321f">±2.7%</text>
<text x="648" y="218" font-size="11" fill="#1f5d7a">±1.35%</text>
<text x="596" y="252" text-anchor="middle" font-size="11" fill="#37424e">规格 ±1% → 良率 ≈ 97.5%（每千块 25 块超规）</text>
<text x="596" y="278" text-anchor="middle" font-size="11" fill="#5b666f">规格 ±2% → 良率 &gt; 99.7%</text>
<text x="596" y="304" text-anchor="middle" font-size="11" fill="#5b666f">3σ 大约只有 WC 的一半</text>
<g opacity="0">
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.86;1" dur="12s" repeatCount="indefinite"/>
<rect x="70" y="336" width="660" height="52.0" rx="9" fill="#e8efe6" stroke="#3d6b4a" stroke-width="1.5" filter="url(#soft)"/><rect x="76" y="343" width="3" height="38.0" rx="1.5" fill="#3d6b4a"/><text x="400" y="358.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3d6b4a">车规 / 医疗按 WC 定规格，消费类按 RSS 的 3σ 估</text><text x="400" y="376.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3d6b4a">良率——"留 20% 裕量"不是拍脑袋，是算出来的。</text>
</g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.02;0.23;0.25;1" dur="12s" repeatCount="indefinite"/><rect x="163.6" y="436.9" width="472.8" height="24.1" rx="12.0" fill="#a8321f" fill-opacity="0.09" stroke="#a8321f" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.23;0.25;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="450" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#a8321f" opacity="0">① WC：所有元件同时往同一方向偏到极限 —— 悲观，但概率极低<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.23;0.25;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.25;0.27;0.48;0.5;1" dur="12s" repeatCount="indefinite"/><rect x="193.9" y="436.9" width="412.3" height="24.1" rx="12.0" fill="#1f5d7a" fill-opacity="0.09" stroke="#1f5d7a" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.48;0.5;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="450" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1f5d7a" opacity="0">② RSS：各项独立随机，按 σ 平方和开根 —— 接近真实<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.48;0.5;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.5;0.52;0.73;0.75;1" dur="12s" repeatCount="indefinite"/><rect x="145.7" y="436.9" width="508.5" height="24.1" rx="12.0" fill="#a4630f" fill-opacity="0.09" stroke="#a4630f" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.73;0.75;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="450" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#a4630f" opacity="0">③ 本例：WC ±2.7%，1σ ±0.45% → 3σ ±1.35%，约只有 WC 的一半<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.73;0.75;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 -4.0" keyTimes="0;0.75;0.77;0.98;1" dur="12s" repeatCount="indefinite"/><rect x="159.5" y="436.9" width="480.9" height="24.1" rx="12.0" fill="#6b3f63" fill-opacity="0.09" stroke="#6b3f63" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.77;0.98;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="450" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#6b3f63" opacity="0">④ 良率：规格 ±1% → 2Φ(2.24)−1 ≈ 97.5%，每千块 25 块超规<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.77;0.98;1" dur="12s" repeatCount="indefinite"/></text></g>
