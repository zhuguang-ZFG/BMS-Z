  <text x="560" y="120" font-size="13" fill="#991b1b">粘连：停在包压附近</text>
  <text x="560" y="200" font-size="13" fill="#065f46">断开：按 RC 往下掉</text>
  <text x="150" y="300" font-size="13" fill="#92400e">100 ms 时断开侧仍约 360 V</text>
  <text x="150" y="328" font-size="13" fill="#065f46">5 s 时断开侧约 3 V；仍约 400 V 才锁粘连</text>
  <text x="400" y="380" text-anchor="middle" font-size="14" fill="#1e293b">线圈一断电就采样，正常断开也会被判成粘连。</text>
  <text x="400" y="420" text-anchor="middle" font-size="13" fill="#475569">真实窗口用本包的 Y 电容和泄放电阻重算。400 V 是示例。</text>

</svg>
