  <text class="txt" x="40" y="68" opacity="1" style="opacity: 1;">① 近环<tspan class="small">　示意 10 μs 线性落到 0。关断还在硬件窗口里。</tspan></text>
  <text class="txt" x="40" y="92" opacity="1" style="opacity: 1;">② 远环<tspan class="small">　示意 200 μs 才落完。10 μs 时电流几乎还在。</tspan></text>
  <text class="txt" x="40" y="116" opacity="1" style="opacity: 1;">③ 累计<tspan class="small">　I²t 按电流平方对时间积分。落得慢，积得多。</tspan></text>
  <text class="txt" x="40" y="140" opacity="1" style="opacity: 1;">④ 口诀<tspan class="small">　栅极电流从哪出去，就从源极旁边回来。</tspan></text>
