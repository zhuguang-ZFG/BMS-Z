<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img" aria-labelledby="ttl">
<title id="ttl">MOSFET 的两条命门：体二极管与栅氧层</title>
<desc>MOSFET 的两条命门：体二极管与栅氧层；节拍：① 体二极管是结构自带的：MOS 天然反向并联一只二极管，拆不掉；② 好处是 H 桥/同步 Buck 的死区续流有它顶班；坏处是想反向阻断就不行；③ 栅氧层几十 nm、耐压 ±20V：栅极当电容看，防静电防悬空；④ 驱动串 10~100Ω 抑制振铃；未用管子栅极必须下拉或接地</desc>
