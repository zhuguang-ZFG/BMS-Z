  <text x="56" y="268" font-size="15" font-weight="bold" opacity="0.971779" class="warn" style="opacity: 0.971779;">错序：高压还在，人已经摸到端子

  </text>
  <text x="56" y="300" font-size="15" opacity="0.94668" class="ok" style="opacity: 0.94668;">对序：信号针短，先断；高压针长，后断。环没了就不要再合闸。

  </text>
  <text x="56" y="332" font-size="13" class="small">示意图。针脚长短差是接插件的机械保证，不是软件延时。</text>


