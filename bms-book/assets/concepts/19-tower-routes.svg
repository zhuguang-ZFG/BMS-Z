<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">总线是一座塔台指挥的航线网</title>
  <desc id="desc">梯形塔台升起天线与红旗，三条航线从指挥室出发：粗实线、细实线与虚线，末端各有一架不同机型的小飞机；地面三个停机位以虚线引导入位，一名指挥员在塔台前抬手指引。无文字无数字。</desc>
