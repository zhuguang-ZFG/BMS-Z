<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">cascode 为什么增益高：看输出电阻，不看管子数量</title>
<desc id="figDesc">左右对比两种共射负载。左边电阻负载 R_C 提供增益，但直流压降锁住输出摆幅；右边用 PNP 电流源加共基 cascode 做负载，输出电阻抬到 g_m r_o² 量级，增益接近 g_m(r_o,n 并 r_o,p)，代价是少一个 V_CE 电压余量。</desc>
<rect width="960" height="640" fill="#fffdf8"/>
<text x="36" y="46" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="28" font-weight="700" fill="#14213d">cascode 为什么增益高：看输出电阻，不看管子数量</text>
<text x="36" y="76" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="16" fill="#52606d">同样的 g_m，谁把输出节点的 R_out 做大，谁就赢；代价写在电压余量上。</text>
<line x1="36" y1="94" x2="924" y2="94" stroke="#14213d" stroke-width="2"/>

<g id="panel-resistor">
  <rect x="36" y="116" width="430" height="386" rx="6" fill="#ffffff" stroke="#f0d9b5" stroke-width="1.5"/>
  <rect x="36" y="116" width="430" height="34" rx="6" fill="#fdf3e3"/>
  <rect x="36" y="136" width="430" height="14" fill="#fdf3e3"/>
  <text x="54" y="140" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="17" font-weight="700" fill="#b45309">① 电阻负载：增益被 R_C 卡住</text>

  <text x="82" y="178" font-family="'Book Mono',monospace" font-size="14" fill="#14213d">VCC</text>
  <line x1="82" y1="188" x2="396" y2="188" stroke="#14213d" stroke-width="2.2"/>
  <line x1="228" y1="188" x2="228" y2="198" stroke="#14213d" stroke-width="2.2"/>
  <polyline points="228,198 216,204 240,214 216,224 240,234 216,244 240,254 228,260 228,278"
            fill="none" stroke="#14213d" stroke-width="2.4" stroke-linejoin="round"/>
  <text x="248" y="232" font-family="'Book Mono',monospace" font-size="16" fill="#14213d">R<tspan baseline-shift="sub" font-size="11">C</tspan></text>

  <line x1="228" y1="278" x2="228" y2="306" stroke="#14213d" stroke-width="2.2"/>
  <circle cx="228" cy="332" r="24" fill="#fffdf8" stroke="#14213d" stroke-width="2.2"/>
  <line x1="207" y1="320" x2="207" y2="344" stroke="#14213d" stroke-width="3"/>
  <line x1="170" y1="332" x2="207" y2="332" stroke="#14213d" stroke-width="2.2"/>
  <line x1="207" y1="325" x2="228" y2="312" stroke="#14213d" stroke-width="2.2"/>
  <line x1="228" y1="312" x2="228" y2="306" stroke="#14213d" stroke-width="2.2"/>
  <line x1="207" y1="339" x2="228" y2="352" stroke="#14213d" stroke-width="2.2"/>
  <path d="M220 344 L232 350 L224 356 Z" fill="#14213d"/>
  <line x1="228" y1="352" x2="228" y2="420" stroke="#14213d" stroke-width="2.2"/>
  <line x1="206" y1="420" x2="250" y2="420" stroke="#14213d" stroke-width="2.4"/>
  <line x1="214" y1="427" x2="242" y2="427" stroke="#14213d" stroke-width="2.2"/>
  <line x1="221" y1="434" x2="235" y2="434" stroke="#14213d" stroke-width="2"/>
  <text x="136" y="337" font-family="'Book Mono',monospace" font-size="15" fill="#14213d">v<tspan baseline-shift="sub" font-size="10">in</tspan></text>
  <text x="207" y="376" font-family="'Book Mono',monospace" font-size="15" fill="#52606d">Q1</text>

  <circle cx="228" cy="292" r="4" fill="#b45309"/>
  <line x1="228" y1="292" x2="330" y2="292" stroke="#b45309" stroke-width="1.6"/>
  <text x="336" y="297" font-family="'Book Mono',monospace" font-size="15" fill="#b45309">v_out</text>

  <line x1="282" y1="214" x2="304" y2="214" stroke="#b45309" stroke-width="1.4"/>
  <text x="310" y="209" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="14" fill="#52606d">R_C 直流压降</text>
  <text x="310" y="228" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="14" fill="#52606d">锁住摆幅上限</text>

  <line x1="372" y1="292" x2="372" y2="420" stroke="#b45309" stroke-width="1.6"/>
  <path d="M372 292 L367 302 L377 302 Z" fill="#b45309"/>
  <path d="M372 420 L367 410 L377 410 Z" fill="#b45309"/>
  <text x="384" y="356" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="14" fill="#b45309">摆幅</text>
  <text x="384" y="375" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="14" fill="#b45309">被锁</text>

  <text x="70" y="468" font-family="'Book Mono',monospace" font-size="17" fill="#14213d">A<tspan baseline-shift="sub" font-size="11">v</tspan><tspan baseline-shift="baseline"> = −g</tspan><tspan baseline-shift="sub" font-size="11">m</tspan><tspan baseline-shift="baseline">(R</tspan><tspan baseline-shift="sub" font-size="11">C</tspan><tspan baseline-shift="baseline"> ∥ r</tspan><tspan baseline-shift="sub" font-size="11">o</tspan><tspan baseline-shift="baseline">)</tspan></text>
  <text x="70" y="490" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="13" fill="#52606d">R_C 一大，直流压降和摆幅先翻脸。</text>
</g>

<g id="panel-cascode">
  <rect x="494" y="116" width="430" height="386" rx="6" fill="#ffffff" stroke="#b7e4dc" stroke-width="1.5"/>
  <rect x="494" y="116" width="430" height="34" rx="6" fill="#e6f6f2"/>
  <rect x="494" y="136" width="430" height="14" fill="#e6f6f2"/>
  <text x="512" y="140" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="17" font-weight="700" fill="#0f766e">② 电流源 + cascode：抬输出电阻</text>

  <text x="540" y="178" font-family="'Book Mono',monospace" font-size="14" fill="#14213d">VCC</text>
  <line x1="540" y1="188" x2="854" y2="188" stroke="#14213d" stroke-width="2.2"/>
  <line x1="664" y1="188" x2="664" y2="208" stroke="#14213d" stroke-width="2.2"/>

  <circle cx="650" cy="232" r="22" fill="#fffdf8" stroke="#14213d" stroke-width="2.2"/>
  <line x1="653" y1="222" x2="653" y2="242" stroke="#14213d" stroke-width="2.6"/>
  <line x1="653" y1="226" x2="664" y2="210" stroke="#14213d" stroke-width="2.2"/>
  <path d="M654 220 L660 211 L665 219 Z" fill="#14213d"/>
  <line x1="653" y1="238" x2="664" y2="252" stroke="#14213d" stroke-width="2.2"/>
  <line x1="618" y1="232" x2="653" y2="232" stroke="#14213d" stroke-width="2.2"/>
  <text x="566" y="237" font-family="'Book Mono',monospace" font-size="13" fill="#52606d">V_B1</text>
  <text x="682" y="226" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="14" font-weight="700" fill="#0f766e">I_BIAS</text>
  <text x="682" y="245" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="13" fill="#52606d">直流压降小</text>

  <line x1="664" y1="252" x2="664" y2="274" stroke="#14213d" stroke-width="2.2"/>
  <circle cx="650" cy="298" r="22" fill="#fffdf8" stroke="#14213d" stroke-width="2.2"/>
  <line x1="653" y1="288" x2="653" y2="308" stroke="#14213d" stroke-width="2.6"/>
  <line x1="653" y1="292" x2="664" y2="276" stroke="#14213d" stroke-width="2.2"/>
  <path d="M654 286 L660 277 L665 285 Z" fill="#14213d"/>
  <line x1="653" y1="304" x2="664" y2="318" stroke="#14213d" stroke-width="2.2"/>
  <line x1="618" y1="298" x2="653" y2="298" stroke="#14213d" stroke-width="2.2"/>
  <text x="566" y="303" font-family="'Book Mono',monospace" font-size="13" fill="#52606d">V_B2</text>
  <text x="682" y="294" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="14" font-weight="700" fill="#0f766e">共基 cascode</text>
  <text x="682" y="313" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="13" fill="#52606d">把 r_o 再乘一级</text>

  <line x1="664" y1="318" x2="664" y2="340" stroke="#14213d" stroke-width="2.2"/>
  <circle cx="650" cy="364" r="22" fill="#fffdf8" stroke="#14213d" stroke-width="2.2"/>
  <line x1="633" y1="354" x2="633" y2="374" stroke="#14213d" stroke-width="2.6"/>
  <line x1="598" y1="364" x2="633" y2="364" stroke="#14213d" stroke-width="2.2"/>
  <line x1="633" y1="357" x2="664" y2="344" stroke="#14213d" stroke-width="2.2"/>
  <line x1="633" y1="371" x2="664" y2="384" stroke="#14213d" stroke-width="2.2"/>
  <path d="M655 377 L667 383 L659 390 Z" fill="#14213d"/>
  <line x1="664" y1="384" x2="664" y2="420" stroke="#14213d" stroke-width="2.2"/>
  <line x1="642" y1="420" x2="686" y2="420" stroke="#14213d" stroke-width="2.4"/>
  <line x1="650" y1="427" x2="678" y2="427" stroke="#14213d" stroke-width="2.2"/>
  <line x1="657" y1="434" x2="671" y2="434" stroke="#14213d" stroke-width="2"/>
  <text x="566" y="369" font-family="'Book Mono',monospace" font-size="15" fill="#14213d">v<tspan baseline-shift="sub" font-size="10">in</tspan></text>
  <text x="633" y="401" font-family="'Book Mono',monospace" font-size="15" fill="#52606d">Q1</text>

  <circle cx="664" cy="340" r="4" fill="#0f766e"/>
  <line x1="664" y1="340" x2="742" y2="340" stroke="#0f766e" stroke-width="1.6"/>
  <text x="748" y="345" font-family="'Book Mono',monospace" font-size="15" fill="#0f766e">v_out</text>

  <line x1="792" y1="260" x2="792" y2="340" stroke="#0f766e" stroke-width="1.8"/>
  <path d="M792 260 L787 270 L797 270 Z" fill="#0f766e"/>
  <path d="M792 340 L787 330 L797 330 Z" fill="#0f766e"/>
  <text x="803" y="296" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="14" font-weight="700" fill="#0f766e">R_out ↑</text>
  <text x="803" y="315" font-family="'Book Mono',monospace" font-size="13" fill="#0f766e">g_m r_o²</text>

  <text x="528" y="214" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12" font-weight="700" fill="#b42318">V_CE 余量 ↓</text>

  <text x="512" y="468" font-family="'Book Mono',monospace" font-size="17" fill="#14213d">A<tspan baseline-shift="sub" font-size="11">v</tspan><tspan baseline-shift="baseline"> ≈ −g</tspan><tspan baseline-shift="sub" font-size="11">m</tspan><tspan baseline-shift="baseline">(r</tspan><tspan baseline-shift="sub" font-size="11">o,n</tspan><tspan baseline-shift="baseline"> ∥ r</tspan><tspan baseline-shift="sub" font-size="11">o,p</tspan><tspan baseline-shift="baseline">)</tspan></text>
  <text x="512" y="490" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="13" fill="#52606d">多叠一只管子，换一级输出电阻，也换走一点余量。</text>
</g>

<g id="takeaway">
  <rect x="36" y="520" width="888" height="96" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
  <rect x="36" y="520" width="6" height="96" fill="#14213d"/>
  <text x="60" y="550" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="16" font-weight="700" fill="#14213d">看输出电阻，不看管子数量。</text>
  <text x="60" y="575" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="15" fill="#b45309">电阻负载：用直流压降换增益，摆幅先投降。</text>
  <text x="60" y="599" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="15" fill="#0f766e">cascode：R_out 从 r_o 抬到 g_m r_o²，代价是一个 V_CE 余量。</text>
</g>
</svg>
