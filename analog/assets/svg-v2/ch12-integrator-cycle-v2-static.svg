<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">恒流改变斜率，初值决定直流中心</title>
<desc id="figDesc">示意 Rin=10 kΩ、C=10 nF，输入 ±1 V、周期 1 ms；初始输出 0 V。</desc>
<metadata id="visual-timeline">{&quot;duration&quot;: 12, &quot;beats&quot;: [{&quot;name&quot;: &quot;条件&quot;, &quot;start&quot;: 0, &quot;end&quot;: 3, &quot;caption&quot;: &quot;正输入产生负的输出斜率。&quot;}, {&quot;name&quot;: &quot;变化&quot;, &quot;start&quot;: 3, &quot;end&quot;: 6, &quot;caption&quot;: &quot;五百微秒后下降五伏，这是峰峰值。&quot;}, {&quot;name&quot;: &quot;比较&quot;, &quot;start&quot;: 6, &quot;end&quot;: 9, &quot;caption&quot;: &quot;输入反号，斜率反向，输出沿直线回升。&quot;}, {&quot;name&quot;: &quot;结论&quot;, &quot;start&quot;: 9, &quot;end&quot;: 12, &quot;caption&quot;: &quot;初值零给出零到负五伏；零均值时应为正负二点五伏。&quot;}]}</metadata>
