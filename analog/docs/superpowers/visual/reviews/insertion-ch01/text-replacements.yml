- id: legacy-figures-ch01-rlc-real-impedance
  source: docs/p1-02-ch1.md#1.2
  before: |-
    从阻抗-频率曲线看，三段各有人管：低频段电容扛（容抗 $1/2\pi fC$ 下降）；ESR 在中频段兜底（阻抗曲线谷底）；ESL 在高频段接管（感抗上升）。**选去耦电容，本质是选谷底够低、谷底够宽的那条曲线**。

    > **为什么**：芯片瞬时抽电流，远处的电源电压先塌一下。长水管里的水有惯性，越急着改流量顶回来越狠，供电上就被压出凹坑。本地水库配短管，管里存的水越少顶得越轻。但水的惯性在质量，走线的在磁场，摸不着却专咬变化快的。

    把 ESR、ESL 写进阻抗公式，曲线的三段形状就全解释了：$|Z|=\sqrt{ESR^2+(2\pi f\cdot ESL-\frac{1}{2\pi fC})^2}$。

    低频段容抗主导、随频率下降。自谐振点 $f_0=\frac{1}{2\pi\sqrt{ESL\cdot C}}$ 处两项抵消，阻抗只剩 ESR，这就是谷底。再往上感抗接管，曲线回升。

    **谷底深度 = ESR，谷底位置 = 自谐振频率，谷底宽度 ≈ 容值与 ESL 的比值。**

    按典型值（经验量级）估：100nF 0805 的 ESL 约 1nH，自谐振约 16MHz；换 0603，ESL 降到约 0.6nH，自谐振推到 20MHz 以上。小封装赢的不是容值，是电感。

    公式给出的三段形状，值得画到同一张对数坐标上读一遍——它一次性回答"100nF 与大电解到底谁管哪一段"：

    <figure>
    <img src="assets/figures/ch01-rlc-real-impedance.svg" width="720" alt="手绘阻抗-频率对照图：100nF 陶瓷与 10µF 铝电解各自的三段曲线、谷底位置与频段分工带">
    <figcaption>同一张对数坐标上的两条真实曲线：10µF 铝电解谷底约 1Ω @ 356kHz，100nF 0805（ESL≈1nH）谷底 mΩ 级 @ 约 16MHz；100MHz 处两者是 13Ω 对约 0.6Ω。"频段分工"不是口号，是两条谷底各管一段频率、各守一个时间尺度。</figcaption>
    </figure>

    **读图三步。** 先看斜率：两端 ±20dB/dec 的下坡与上翘分别由 C 和 ESL 签名，中间被托住的那截平地（或尖底）就是 ESR。

    再看谷底位置：$f_0=1/(2\pi\sqrt{ESL\cdot C})$，小封装赢的正是这一项。

    最后把频率翻译成时间。100kHz 的周期是 10µs，毫秒级负载阶跃的能量由电解缓冲；16MHz 的周期约 63ns，纳秒级瞬态只有就近的小电容接得住。

    **"100nF 管纳秒、大电解管毫秒"说的就是这两条谷底各守一段时间尺度。** 图上 100MHz 处的 0.6Ω 与动画里那对样品的 0.42Ω 是不同 ESL 下的同一量级结论：都比电解的 13Ω 低二十倍上下。

    大电容与小电容并联，不是"容量相加"这么简单，是**频段分工**：10µF 电解管 100kHz 以下的储能与负载阶跃，100nF MLCC 管 MHz 级的高频瞬态，各自在自己的谷底值班。
  after: |-
