"2.5" stroke-linejoin="round" stroke-linecap="round" class="stroke-r" /><circle r="5" class="fill-y"><animate attributeName="cx" values="70.0;118.8;167.5;216.2;265.0;313.8;362.5;411.2;460.0" keyTimes="0.0000;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1.0000" dur="8s" repeatCount="indefinite" /><animate attributeName="cy" values="569.0;559.5;550.0;540.5;531.0;521.5;512.0;502.5;493.0" keyTimes="0.0000;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1.0000" dur="8s" repeatCount="indefinite" /></circle><text x="475.7" y="606.0" text-anchor="start" font-size="12" class="small">时间 s</text><text x="480" y="516.0" font-size="12" class="txt">红线就是卡通上的过充阈值。</text>
