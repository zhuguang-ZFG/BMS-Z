<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 544" font-family="ui-monospace, Consolas, monospace">
  <title>集中式扫描时间随节数变陡，分布式几乎只加转发。数字为示意。</title>
  <desc>亮点对比两条线：集中式按 0.10 ms/节随节数变陡，96 节明显拉长；分布式几乎只加转发，接近平的。</desc>

  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.5; fill: none; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
    }
  </style>

  <!-- formula: Tcen=0.10*N ms; Tdist=1.20+0.0125*N ms; cross at N=1.20/0.0875 -->
  <rect class="bg" width="800" height="544"/>
  <text class="title" x="24" y="32">节数一多，谁在排队测电压（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="128" rx="6"/>
  <text class="txt" x="40" y="72" opacity="0.28">① 节数很少<tspan class="small">　大约 14 节附近，两条线差不多。集中式并不吃亏。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="98" opacity="0.28">② 集中式斜率 0.10 ms/节<tspan class="small">　每多一节，整圈就多 100 µs。线更陡。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="124" opacity="0.28">③ 96 节<tspan class="small">　集中式 9.6 ms，分布式 2.4 ms。差距拉开了。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="150" opacity="0.28">④ 分布式几乎是平的<tspan class="small">　本模块 1.2 ms，再加每节 0.0125 ms 的转发。转发不是大头。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="188" width="752" height="304" rx="6"/>
  <text class="small" x="40" y="210">扫完一圈 ms（示意）</text>
  <line class="axis" x1="108.0" y1="228.0" x2="108.0" y2="430.0"/>
  <line class="axis" x1="108.0" y1="430.0" x2="730.0" y2="430.0"/>
  <text class="small" x="730.0" y="468.0" text-anchor="end">串联节数 N</text>
  <line class="grid" x1="165.4" y1="430.0" x2="165.4" y2="436.0"/>
  <text class="small" x="165.4" y="452.0" text-anchor="middle">12</text>
  <line class="grid" x1="337.7" y1="430.0" x2="337.7" y2="436.0"/>
  <text class="small" x="337.7" y="452.0" text-anchor="middle">48</text>
  <line class="grid" x1="567.3" y1="430.0" x2="567.3" y2="436.0"/>
  <text class="small" x="567.3" y="452.0" text-anchor="middle">96</text>
  <line class="grid" x1="682.2" y1="430.0" x2="682.2" y2="436.0"/>
  <text class="small" x="682.2" y="452.0" text-anchor="middle">120</text>
  <line class="grid" x1="102.0" y1="412.7" x2="108.0" y2="412.7"/>
  <text class="small" x="98.0" y="416.7" text-anchor="end">1.2</text>
  <line class="grid" x1="102.0" y1="357.9" x2="108.0" y2="357.9"/>
  <text class="small" x="98.0" y="361.9" text-anchor="end">5</text>
  <line class="grid" x1="102.0" y1="285.7" x2="108.0" y2="285.7"/>
  <text class="small" x="98.0" y="289.7" text-anchor="end">10</text>
