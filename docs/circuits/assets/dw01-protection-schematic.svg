<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430">
  <title>DW01 单节保护板典型应用电路</title>
  <rect width="800" height="430" fill="#f8fafc"/>
  <style>
  text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
  /* 深色模式：GitHub 深色主题下对调底色与文字色，只覆盖配色，不动几何与动画。
     stroke="#fff" 保持白色——那是彩色徽标上的勾选，不在覆盖范围内。 */
  @media (prefers-color-scheme: dark){
  rect[fill="#f8fafc"]{fill:#0f172a}
  rect[fill="#fff"]{fill:#1e293b}
  [fill="#f1f5f9"]{fill:#1e293b}
  [stroke="#f1f5f9"]{stroke:#1e293b}
  [fill="#e2e8f0"]{fill:#334155}
  [stroke="#e2e8f0"]{stroke:#334155}
  [fill="#cbd5e1"]{fill:#475569}
  [stroke="#cbd5e1"]{stroke:#475569}
  [fill="#64748b"]{fill:#94a3b8}
  [stroke="#64748b"]{stroke:#94a3b8}
  [fill="#475569"]{fill:#cbd5e1}
  [stroke="#475569"]{stroke:#cbd5e1}
  [fill="#334155"]{fill:#e2e8f0}
  [stroke="#334155"]{stroke:#e2e8f0}
  [fill="#1e293b"]{fill:#f1f5f9}
  [stroke="#1e293b"]{stroke:#f1f5f9}
  [fill="#dbeafe"]{fill:#1e3a8a}
  [stroke="#dbeafe"]{stroke:#1e3a8a}
  [fill="#eff6ff"]{fill:#172554}
  [stroke="#eff6ff"]{stroke:#172554}
  [fill="#bfdbfe"]{fill:#1e40af}
  [stroke="#bfdbfe"]{stroke:#1e40af}
  [fill="#1d4ed8"]{fill:#60a5fa}
  [stroke="#1d4ed8"]{stroke:#60a5fa}
  [fill="#1e40af"]{fill:#93c5fd}
  [stroke="#1e40af"]{stroke:#93c5fd}
  [fill="#2563eb"]{fill:#60a5fa}
  [stroke="#2563eb"]{stroke:#60a5fa}
  [fill="#3b82f6"]{fill:#60a5fa}
  [stroke="#3b82f6"]{stroke:#60a5fa}
  [fill="#ecfdf5"]{fill:#022c22}
  [stroke="#ecfdf5"]{stroke:#022c22}
  [fill="#a7f3d0"]{fill:#065f46}
  [stroke="#a7f3d0"]{stroke:#065f46}
  [fill="#86efac"]{fill:#166534}
  [stroke="#86efac"]{stroke:#166534}
  [fill="#065f46"]{fill:#6ee7b7}
  [stroke="#065f46"]{stroke:#6ee7b7}
  [fill="#059669"]{fill:#34d399}
  [stroke="#059669"]{stroke:#34d399}
  [fill="#fef2f2"]{fill:#450a0a}
  [stroke="#fef2f2"]{stroke:#450a0a}
  [fill="#fecaca"]{fill:#7f1d1d}
  [stroke="#fecaca"]{stroke:#7f1d1d}
  [fill="#fca5a5"]{fill:#b91c1c}
  [stroke="#fca5a5"]{stroke:#b91c1c}
  [fill="#991b1b"]{fill:#fca5a5}
  [stroke="#991b1b"]{stroke:#fca5a5}
  [fill="#dc2626"]{fill:#f87171}
  [stroke="#dc2626"]{stroke:#f87171}
  [fill="#fffbeb"]{fill:#451a03}
  [stroke="#fffbeb"]{stroke:#451a03}
  [fill="#fef3c7"]{fill:#78350f}
  [stroke="#fef3c7"]{stroke:#78350f}
  [fill="#92400e"]{fill:#fcd34d}
  [stroke="#92400e"]{stroke:#fcd34d}
  [fill="#b45309"]{fill:#fbbf24}
  [stroke="#b45309"]{stroke:#fbbf24}
  }
</style>
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">DW01 单节保护板典型应用电路</text>
  <text x="400" y="50" text-anchor="middle" font-size="12" fill="#475569">三道判断题的接法：采样 VDD、判流 CS、执行 OD/OC；保护延时由芯片内部产生（TD 测试脚未画出）</text>

  <!-- 电芯 -->
  <rect x="35" y="180" width="50" height="140" rx="8" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
  <text x="60" y="255" text-anchor="middle" font-size="12" fill="#1e40af">电芯</text>
  <text x="72" y="200" font-size="12" fill="#475569">+</text>
  <text x="72" y="306" font-size="12" fill="#475569">−</text>
  <text x="50" y="184" text-anchor="end" font-size="12" font-weight="bold" fill="#334155">B+</text>
  <text x="50" y="324" text-anchor="end" font-size="12" font-weight="bold" fill="#334155">B−</text>

  <!-- B+ → R1 → 节点A → P+ -->
  <line x1="60" y1="180" x2="60" y2="100" stroke="#334155" stroke-width="2"/>
  <line x1="60" y1="100" x2="110" y2="100" stroke="#334155" stroke-width="2"/>
  <polyline points="110,100 120,92 130,108 140,92 150,108 160,92 170,108 180,92 190,100" fill="none" stroke="#334155" stroke-width="2"/>
  <text x="150" y="86" text-anchor="middle" font-size="11" fill="#475569">R1 100Ω</text>
  <line x1="190" y1="100" x2="740" y2="100" stroke="#334155" stroke-width="2"/>

  <!-- C1：VDD 滤波到 B- -->
  <line x1="210" y1="100" x2="210" y2="205" stroke="#334155" stroke-width="2"/>
  <line x1="195" y1="205" x2="225" y2="205" stroke="#334155" stroke-width="2.5"/>
  <line x1="195" y1="215" x2="225" y2="215" stroke="#334155" stroke-width="2.5"/>
  <line x1="210" y1="215" x2="210" y2="320" stroke="#334155" stroke-width="2"/>
  <text x="210" y="193" text-anchor="middle" font-size="11" fill="#475569">C1 0.1µF</text>

  <!-- VDD 支路 -->
  <line x1="240" y1="100" x2="240" y2="170" stroke="#334155" stroke-width="2"/>
  <line x1="240" y1="170" x2="286" y2="170" stroke="#334155" stroke-width="2"/>

  <!-- DW01 本体 -->
  <rect x="300" y="150" width="140" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="370" y="167" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">DW01</text>
  <line x1="286" y1="170" x2="300" y2="170" stroke="#334155" stroke-width="2"/>
  <text x="306" y="174" font-size="12" fill="#334155">VDD</text>
  <line x1="286" y1="220" x2="300" y2="220" stroke="#334155" stroke-width="2"/>
  <text x="306" y="224" font-size="12" fill="#334155">CS</text>
  <line x1="286" y1="250" x2="300" y2="250" stroke="#334155" stroke-width="2"/>
  <text x="306" y="254" font-size="12" fill="#334155">VSS</text>
  <line x1="440" y1="180" x2="454" y2="180" stroke="#334155" stroke-width="2"/>
  <text x="434" y="184" text-anchor="end" font-size="12" fill="#334155">OD</text>
  <line x1="440" y1="215" x2="454" y2="215" stroke="#334155" stroke-width="2"/>
  <text x="434" y="219" text-anchor="end" font-size="12" fill="#334155">OC</text>
  <line x1="440" y1="250" x2="454" y2="250" stroke="#334155" stroke-width="2"/>
  <text x="434" y="254" text-anchor="end" font-size="12" fill="#334155">VM</text>

  <!-- R2：CS 检流到 B- -->
  <polyline points="230,220 238,212 246,228 254,212 262,228 270,212 278,228 286,220" fill="none" stroke="#334155" stroke-width="2"/>
  <line x1="230" y1="220" x2="230" y2="320" stroke="#334155" stroke-width="2"/>
  <text x="262" y="206" text-anchor="middle" font-size="11" fill="#475569">R2 1kΩ</text>

  <!-- VSS 到 B- -->
  <line x1="286" y1="250" x2="265" y2="250" stroke="#334155" stroke-width="2"/>
  <line x1="265" y1="250" x2="265" y2="320" stroke="#334155" stroke-width="2"/>

  <!-- VM 经 R3 到 P- -->
  <line x1="454" y1="250" x2="490" y2="250" stroke="#334155" stroke-width="2"/>
  <line x1="490" y1="250" x2="490" y2="290" stroke="#334155" stroke-width="2"/>
  <polyline points="490,290 482,298 498,306 482,314 498,322 490,330" fill="none" stroke="#334155" stroke-width="2"/>
  <line x1="490" y1="330" x2="490" y2="350" stroke="#334155" stroke-width="2"/>
  <text x="478" y="312" text-anchor="end" font-size="11" fill="#475569">R3 5.1kΩ</text>

  <!-- OD → M1 栅 -->
  <line x1="454" y1="180" x2="505" y2="180" stroke="#334155" stroke-width="2"/>
  <line x1="505" y1="180" x2="505" y2="230" stroke="#334155" stroke-width="2"/>
  <line x1="505" y1="230" x2="520" y2="230" stroke="#334155" stroke-width="2"/>
  <text x="479" y="173" text-anchor="middle" font-size="12" fill="#475569">OD→M1 栅</text>

  <!-- OC → M2 栅（绕下方） -->
  <line x1="454" y1="215" x2="500" y2="215" stroke="#334155" stroke-width="2"/>
  <line x1="500" y1="215" x2="500" y2="290" stroke="#334155" stroke-width="2"/>
  <line x1="500" y1="290" x2="680" y2="290" stroke="#334155" stroke-width="2"/>
  <line x1="680" y1="290" x2="680" y2="230" stroke="#334155" stroke-width="2"/>
  <line x1="680" y1="230" x2="628" y2="230" stroke="#334155" stroke-width="2"/>
  <text x="477" y="208" text-anchor="middle" font-size="12" fill="#475569">OC→M2 栅</text>

  <!-- 8205A 双 N-MOS 共漏 -->
  <rect x="520" y="150" width="140" height="120" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="590" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46">8205A</text>
  <!-- 共漏节点 -->
  <line x1="560" y1="195" x2="620" y2="195" stroke="#334155" stroke-width="2"/>
  <circle cx="590" cy="195" r="3" fill="#334155"/>
  <!-- M1：沟道、栅、体二极管 -->
  <line x1="560" y1="195" x2="560" y2="212" stroke="#334155" stroke-width="2"/>
  <line x1="554" y1="214" x2="554" y2="246" stroke="#334155" stroke-width="2.5"/>
  <line x1="566" y1="214" x2="566" y2="246" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="520" y1="230" x2="554" y2="230" stroke="#334155" stroke-width="2"/>
  <line x1="560" y1="246" x2="560" y2="270" stroke="#334155" stroke-width="2"/>
  <line x1="578" y1="214" x2="578" y2="246" stroke="#334155" stroke-width="1.5"/>
  <polygon points="578,218 573,228 583,228" fill="#334155"/>
  <line x1="573" y1="216" x2="583" y2="216" stroke="#334155" stroke-width="2"/>
  <text x="560" y="180" text-anchor="middle" font-size="12" fill="#065f46">M1 防放电</text>
  <!-- M2：沟道、栅、体二极管 -->
  <line x1="620" y1="195" x2="620" y2="212" stroke="#334155" stroke-width="2"/>
  <line x1="614" y1="214" x2="614" y2="246" stroke="#334155" stroke-width="2.5"/>
  <line x1="626" y1="214" x2="626" y2="246" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="628" y1="230" x2="614" y2="230" stroke="#334155" stroke-width="2"/>
  <line x1="620" y1="246" x2="620" y2="270" stroke="#334155" stroke-width="2"/>
  <line x1="638" y1="214" x2="638" y2="246" stroke="#334155" stroke-width="1.5"/>
  <polygon points="638,218 633,228 643,228" fill="#334155"/>
  <line x1="633" y1="216" x2="643" y2="216" stroke="#334155" stroke-width="2"/>
  <text x="620" y="180" text-anchor="middle" font-size="12" fill="#065f46">M2 防充电</text>

  <!-- M1 源极 → B- 母线 -->
  <line x1="560" y1="270" x2="560" y2="320" stroke="#334155" stroke-width="2"/>
  <line x1="60" y1="320" x2="560" y2="320" stroke="#334155" stroke-width="2"/>
  <!-- M2 源极 → P- -->
  <line x1="620" y1="270" x2="620" y2="350" stroke="#334155" stroke-width="2"/>
  <line x1="620" y1="350" x2="740" y2="350" stroke="#334155" stroke-width="2"/>

  <!-- 对外端口与负载 -->
  <line x1="740" y1="100" x2="740" y2="130" stroke="#334155" stroke-width="2"/>
  <polyline points="740,130 732,138 748,146 732,154 748,162 740,170" fill="none" stroke="#334155" stroke-width="2"/>
  <line x1="740" y1="170" x2="740" y2="350" stroke="#334155" stroke-width="2"/>
  <circle cx="740" cy="100" r="4" fill="#334155"/>
  <text x="752" y="104" font-size="13" font-weight="bold" fill="#334155">P+</text>
  <circle cx="740" cy="350" r="4" fill="#334155"/>
  <text x="752" y="354" font-size="13" font-weight="bold" fill="#334155">P−</text>
  <text x="735" y="148" text-anchor="end" font-size="12" fill="#475569">负载 / 充电机</text>

  <!-- 放电回路（绿，0–45% 时间窗） -->
  <path d="M60,180 L60,100 L740,100 L740,130 M740,170 L740,350 L620,350 L620,250 L620,195 L560,195 L560,250 L560,320 L60,320"
        fill="none" stroke="#059669" stroke-width="2.5" stroke-dasharray="12 10" opacity="1">
    <animate attributeName="stroke-dashoffset" from="44" to="0" dur="1.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.5;1" dur="8s" repeatCount="indefinite"/>
  </path>
  <!-- 充电回路（橙，55–100% 时间窗） -->
  <path d="M60,320 L560,320 L560,195 L620,195 L620,350 L740,350 L740,170 M740,130 L740,100 L60,100 L60,180"
        fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="12 10" opacity="0">
    <animate attributeName="stroke-dashoffset" from="44" to="0" dur="1.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.55;1" dur="8s" repeatCount="indefinite"/>
  </path>

  <text x="400" y="392" text-anchor="middle" font-size="12" fill="#475569">绿 = 放电回路、橙 = 充电回路（交替演示）；M1 体二极管顺充电、M2 体二极管顺放电——与详解 ① §1.2 口诀同向</text>
  <text x="400" y="412" text-anchor="middle" font-size="11" fill="#475569">R1/C1 电源滤波、R2 检流、R3 充电器检测：阻容为 datasheet 典型应用示例值，兼容料号以各自手册为准</text>
</svg>
