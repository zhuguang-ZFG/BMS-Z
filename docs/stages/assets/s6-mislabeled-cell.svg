<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="s6-mismatch-t s6-mismatch-d">
  <title id="s6-mismatch-t">总电压及格，替不了逐串对标准源</title>
  <desc id="s6-mismatch-d">电芯二维码指向另一个容量档，出厂只量总电压和通信，这一节在充电末端先越限。保护切断是对的，解释不了为什么只有它高。</desc>
  <defs>
    <marker id="ar-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path class="head-teal" d="M0 0L9 4.5L0 9Z"/>
    </marker>
    <marker id="ar-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path class="head-red" d="M0 0L9 4.5L0 9Z"/>
    </marker>
    <style>
      text { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #293b3a; }
      .title { font-size: 20px; font-weight: 700; }
      .h { font-size: 15px; font-weight: 700; fill: #293b3a; }
      .body { font-size: 13px; fill: #293b3a; }
      .small { font-size: 12px; fill: #626d65; }
      .accent { fill: #176b73; }
      .green { fill: #377b60; }
      .red { fill: #b84745; }
      .gold { fill: #926717; }
      .card { fill: #fffdf5; stroke: #968d77; stroke-width: 1.4; }
      .soft { fill: #e4f0df; stroke: #377b60; stroke-width: 1.4; }
      .warn { fill: #fbefc7; stroke: #926717; stroke-width: 1.4; }
      .danger { fill: #f6e2df; stroke: #b84745; stroke-width: 1.4; }
      .wire { stroke: #293b3a; stroke-width: 2; fill: none; }
      .flow { stroke: #176b73; stroke-width: 2.4; fill: none; }
      .dot { fill: #176b73; }
      .cell { fill: #fffdf5; stroke: #968d77; stroke-width: 2; }
      .badcell { fill: #f6e2df; stroke: #b84745; stroke-width: 2; }
      .head-teal { fill: #176b73; }
      .head-red { fill: #b84745; }
      @media (prefers-color-scheme: dark) {
        text { fill: #edf0e5; }
        .title { fill: #edf0e5; }
        .h { fill: #edf0e5; }
        .body { fill: #edf0e5; }
        .small { fill: #b0beb3; }
        .accent { fill: #7ec5c5; }
        .green { fill: #8fc7a2; }
        .red { fill: #f39b91; }
        .gold { fill: #dfbd78; }
        .card { fill: #223333; stroke: #71908c; }
        .soft { fill: #293f35; stroke: #8fc7a2; }
        .warn { fill: #453e2b; stroke: #dfbd78; }
        .danger { fill: #483336; stroke: #f39b91; }
        .wire { stroke: #edf0e5; }
        .flow { stroke: #7ec5c5; }
        .dot { fill: #7ec5c5; }
        .cell { fill: #223333; stroke: #71908c; }
        .badcell { fill: #483336; stroke: #f39b91; }
        .head-teal { fill: #7ec5c5; }
        .head-red { fill: #f39b91; }
      }
    </style>
  </defs>

  <text x="480" y="34" text-anchor="middle" class="title">总电压及格，替不了逐串对标准源</text>
  <text x="480" y="56" text-anchor="middle" class="small">EOL 只量总电压与通信，错芯可以在这张单子上过</text>

  <!-- 左：EOL 的检查项 -->
  <rect class="card" x="28" y="78" width="420" height="330" rx="12"/>
  <text x="238" y="108" text-anchor="middle" class="h">EOL 只查这两项</text>

  <rect class="soft" x="52" y="136" width="368" height="56" rx="8"/>
  <text x="238" y="158" text-anchor="middle" class="body">总电压及格</text>
  <text x="238" y="176" text-anchor="middle" class="small">四节加起来正好在窗口内</text>

  <rect class="soft" x="52" y="208" width="368" height="56" rx="8"/>
  <text x="238" y="230" text-anchor="middle" class="body">通信能通</text>
  <text x="238" y="248" text-anchor="middle" class="small">能读出包序列号与保护状态</text>

  <rect class="warn" x="52" y="280" width="368" height="62" rx="8"/>
  <text x="238" y="304" text-anchor="middle" class="body">没有逐串对标准源</text>
  <text x="238" y="324" text-anchor="middle" class="small">没有把电芯身份与本包的分容档对上</text>

  <rect class="danger" x="52" y="356" width="368" height="36" rx="8"/>
  <text x="238" y="382" text-anchor="middle" class="body">结果：错芯出厂</text>

  <!-- 右：错芯在充电末端先越限 -->
  <rect class="card" x="470" y="78" width="462" height="330" rx="12"/>
  <text x="701" y="98" text-anchor="middle" class="h">错芯在充电末端先越限</text>

  <g>
    <rect class="cell" x="500" y="150" width="90" height="70" rx="10"/>
    <text x="545" y="188" text-anchor="middle" class="small">本包档</text>
    <rect class="cell" x="602" y="150" width="90" height="70" rx="10"/>
    <text x="647" y="188" text-anchor="middle" class="small">本包档</text>
    <rect class="badcell" x="704" y="150" width="90" height="70" rx="10"/>
    <text x="749" y="180" text-anchor="middle" class="body">错档</text>
    <text x="749" y="202" text-anchor="middle" class="small">先到过充点</text>
    <rect class="cell" x="806" y="150" width="90" height="70" rx="10"/>
    <text x="851" y="188" text-anchor="middle" class="small">本包档</text>
  </g>

  <path class="flow" d="M500 128H880" marker-end="url(#ar-teal)"/>
  <path class="wire" d="M545 128V150M647 128V150M749 128V150M851 128V150"/>
  <text x="700" y="116" text-anchor="middle" class="small">充电电流一路灌进来</text>

  <path class="wire" d="M749 220V266"/>
  <rect class="danger" x="700" y="266" width="100" height="40" rx="8"/>
  <text x="750" y="292" text-anchor="middle" class="small">保护切断</text>

  <text x="701" y="322" text-anchor="middle" class="body">保护动作是对的</text>
  <text x="701" y="344" text-anchor="middle" class="small">切断解释不了为什么只有它高</text>
  <text x="701" y="362" text-anchor="middle" class="small red">加大均衡搬不来另一档的容量</text>

  <!-- 底部结论 -->
  <rect class="card" x="28" y="432" width="904" height="64" rx="12"/>
  <text x="480" y="456" text-anchor="middle" class="body">对不上就停用这一台。均衡和总电压 EOL 都看不出身份错了。</text>
  <text x="480" y="476" text-anchor="middle" class="small">教学案例，不是某条产线的事故报告</text>

</svg>
