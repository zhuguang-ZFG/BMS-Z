<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">E-Gas 三层：最后一道不经过软件</title>
  <desc id="desc">虚线大框是软件域，包住上方两条横带：功能层画着正弦波形，监控层画着放大镜与对勾；第三条薄荷绿横带在软件域外，画着比较器三角与接触器。左侧红色火星拉出红虚线，连穿上两层的破口，被第三层前的粗闸门拦下，门后一枚绿对勾。右侧工程师抱板记录。无文字无数字。</desc>
