<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">电容直流偏压：标称容量 ≠ 工作容量</text>
<desc>教学示意曲线，不代表任何具体料号。假设 10µF 电容在 5V 下保持率为 26%，有效容量为 2.6µF。</desc>
<text x="400" y="53" text-anchor="middle" font-size="12" fill="#5b666f">教学示例，非实测曲线；实际降容请查具体料号与测试条件</text>
<rect x="60" y="76" width="680" height="330" rx="10" fill="#f6eedb" stroke="#5b666f" stroke-width="1.6"/>
<text x="400" y="100" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#37424e">纵轴：有效容量 / 零偏压容量（各自归一化）</text>
<path d="M150 340 Q420.00 339.81 690 340" fill="none" stroke="#5b666f" stroke-width="1.6"/>
<path d="M150 340 Q150.34 240.00 150 140" fill="none" stroke="#5b666f" stroke-width="1.6"/>
<path d="M150 240 Q420.00 239.30 690 240" fill="none" stroke="#c9bb9d" stroke-dasharray="4,5"/>
<text x="138" y="144" text-anchor="end" font-size="11" fill="#5b666f">100%</text>
<text x="138" y="244" text-anchor="end" font-size="11" fill="#5b666f">50%</text>
<text x="138" y="344" text-anchor="end" font-size="11" fill="#5b666f">0</text>
<text x="150" y="362" text-anchor="middle" font-size="11" fill="#5b666f">0V</text>
<text x="578.5714" y="362" text-anchor="middle" font-size="11" fill="#a8321f">5V</text>
<text x="690" y="362" text-anchor="middle" font-size="11" fill="#5b666f">6.3V</text>
<text x="420" y="387" text-anchor="middle" font-size="11.5" fill="#5b666f">横轴：施加的直流偏压 →（圆点匀速扫压）</text>
<path d="M150,140 L690,140" fill="none" stroke="#3d6b4a" stroke-width="3"/>
<text x="684" y="130" text-anchor="end" font-size="11" fill="#3d6b4a">C0G 参考：基本不受直流偏压影响</text>
<path id="cap-bias-curve" d="M150.0000,140.0000 L235.7143,154.0000 L321.4286,180.0000 L407.1429,216.0000 L492.8571,254.0000 L578.5714,288.0000 L690.0000,310.0000" fill="none" stroke="#a8321f" stroke-width="3"/>
<text x="340" y="185" font-size="11" fill="#a8321f">II 类陶瓷：一条假设的降容曲线</text>
<path d="M578.571 288 Q578.34 314.00 578.571 340" fill="none" stroke="#a8321f" stroke-dasharray="4,4"/>
<path d="M150 288 Q364.29 287.76 578.571 288" fill="none" stroke="#a8321f" stroke-dasharray="4,4"/>
<text x="138" y="292.0000" text-anchor="end" font-size="11" fill="#a8321f">26%</text>
<circle id="cap-bias-point" cx="578.5714" cy="288.0000" r="6" fill="#a8321f"/>
<text x="370" y="321" font-size="12" font-weight="bold" fill="#a8321f">5V 示例：10µF × 26% = 2.6µF</text>
<circle id="cap-bias-sweep" cx="150" cy="140" r="5" fill="#a4630f" filter="url(#pglow)">
<animate attributeName="cx" values="150.0000;235.7143;321.4286;407.1429;492.8571;578.5714;690.0000" keyTimes="0.00000000;0.15873016;0.31746032;0.47619048;0.63492063;0.79365079;1.00000000" calcMode="linear" dur="12s" repeatCount="indefinite"/>
<animate attributeName="cy" values="140.0000;154.0000;180.0000;216.0000;254.0000;288.0000;310.0000" keyTimes="0.00000000;0.15873016;0.31746032;0.47619048;0.63492063;0.79365079;1.00000000" calcMode="linear" dur="12s" repeatCount="indefinite"/>
</circle>
<g opacity="0">
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.86;1" dur="12s" repeatCount="indefinite"/>
<rect x="75" y="415" width="650" height="52.0" rx="9" fill="#e8efe6" stroke="#3d6b4a" stroke-width="1.5" filter="url(#soft)"/><rect x="81" y="422" width="3" height="38.0" rx="1.5" fill="#3d6b4a"/><text x="400" y="437.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3d6b4a">X5R / X7R 是温度特性代码，不是降容等级。实际容量取决于料号、偏压、温度与测试条件；</text><text x="400" y="455.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3d6b4a">选型要查曲线。本例忽略 ESR 且纹波电流相同，容量降至 26% 时容性纹波约增至 3.85 倍。</text>
</g><g id="cap-bias-captions"><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.02;0.23;0.25;1" dur="12s" repeatCount="indefinite"/><rect x="178.2" y="535.0" width="443.7" height="24.1" rx="12.0" fill="#1f5d7a" fill-opacity="0.09" stroke="#1f5d7a" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.23;0.25;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="548" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1f5d7a" opacity="0">① 标称容量有测试条件；加上直流偏压后，有效容量可能下降<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.23;0.25;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.25;0.27;0.48;0.5;1" dur="12s" repeatCount="indefinite"/><rect x="192.0" y="535.0" width="416.1" height="24.1" rx="12.0" fill="#a4630f" fill-opacity="0.09" stroke="#a4630f" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.48;0.5;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="548" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#a4630f" opacity="0">② 匀速扫过偏压轴：II 类陶瓷降容，C0G 参考线基本平坦<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.48;0.5;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.5;0.52;0.73;0.75;1" dur="12s" repeatCount="indefinite"/><rect x="184.7" y="535.0" width="430.6" height="24.1" rx="12.0" fill="#a8321f" fill-opacity="0.09" stroke="#a8321f" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.73;0.75;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="548" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#a8321f" opacity="0">③ 本例 5V 时保持率 26%：10µF 变为 2.6µF，并非实测值<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.73;0.75;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 -4.0" keyTimes="0;0.75;0.77;0.98;1" dur="12s" repeatCount="indefinite"/><rect x="171.7" y="535.0" width="456.7" height="24.1" rx="12.0" fill="#6b3f63" fill-opacity="0.09" stroke="#6b3f63" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.77;0.98;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="548" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#6b3f63" opacity="0">④ 同纹波电流、忽略 ESR：容性纹波约增至 1/0.26 = 3.85 倍<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.77;0.98;1" dur="12s" repeatCount="indefinite"/></text></g>
</g></svg>