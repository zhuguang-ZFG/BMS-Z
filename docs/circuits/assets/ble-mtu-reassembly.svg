</style><rect class="bg" x="0" y="-156" width="800" height="680" /><rect class="bms-marker" aria-hidden="true" x="18.0" y="-142.9" width="236.7" height="17.3" rx="3.8" transform="rotate(-.5 18.0 -134.2)"/><path class="bms-under" aria-hidden="true" d="M24.0 -119.0 q 24.0 -2.4 48.0 0 t 48 0 t 48 0 t 48 0"/><text class="title" x="24" y="-128">BLE：MTU 谈不拢，帧就拼不齐</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><g class="bms-doodle" aria-hidden="true" transform="translate(746.0 -88.0)"><animateTransform attributeName="transform" type="rotate" values="-6;7;-6" keyTimes="0;0.5;1" dur="5.4s" repeatCount="indefinite" additive="sum"/><animate attributeName="opacity" values="0.62;1;0.62" keyTimes="0;0.5;1" dur="3.6s" repeatCount="indefinite"/><path class="bms-spark-fill" d="M0 -9 L2.3 -2.3 L9 0 L2.3 2.3 L0 9 L-2.3 2.3 L-9 0 L-2.3 -2.3 Z"/></g><g class="bms-doodle" aria-hidden="true" transform="translate(710.0 -98.0)"><animateTransform attributeName="transform" type="rotate" values="5;-4;5" keyTimes="0;0.5;1" dur="6.2s" repeatCount="indefinite" additive="sum"/><animate attributeName="opacity" values="0.5;0.9;0.5" keyTimes="0;0.5;1" dur="4.4s" repeatCount="indefinite"/><path class="bms-spark-soft" d="M0 -5.5 L1.4 -1.4 L5.5 0 L1.4 1.4 L0 5.5 L-1.4 1.4 L-5.5 0 L-1.4 -1.4 Z"/></g><g class="bms-doodle" aria-hidden="true"><circle class="bms-spark-fill" cx="728.0" cy="-79.0" r="1.3"/><circle class="bms-spark-soft" cx="696.0" cy="-82.0" r="1.1"/></g><text class="txt" x="40" y="-88" opacity="1">① BLE：MTU 谈不拢，帧就拼不齐<animate calcMode="spline" keySplines="0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 一帧示意载荷，大约 60 字节<animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 帧头 + 长度 + 电压电流 SOC + CRC<animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="468" width="752" height="44" rx="6" /><text class="small" x="40" y="496">三片按顺序拼回 60 字节，再验 CRC。示意。</text><rect class="bg" width="800" height="460" />
  <text class="txt" x="40" y="72">一帧示意载荷，大约 60 字节</text>
  <rect class="frame" x="40" y="86" width="600" height="36" rx="4" />
  <text class="small" x="340" y="110" text-anchor="middle">帧头 + 长度 + 电压电流 SOC + CRC</text>
  <text class="txt" x="40" y="160">默认 ATT MTU = 23，有效载荷约 20 字节，切成三片通知</text>
  <rect class="piece" x="40" y="176" width="180" height="36" rx="4" />
  <rect class="piece" x="232" y="176" width="180" height="36" rx="4" />
  <rect class="piece" x="424" y="176" width="180" height="36" rx="4" />
  <text class="small" x="130" y="200" text-anchor="middle">片 1</text>
  <text class="small" x="322" y="200" text-anchor="middle">片 2</text>
  <text class="small" x="514" y="200" text-anchor="middle">片 3</text>
  <text class="no small" x="40" y="248">只收了片 1：长度对不上，先缓存，不要当完整帧
    <animate calcMode="spline" keySplines="0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="opacity" values="1;1;0;0" keyTimes="0;0.35;0.45;1" dur="8s" repeatCount="indefinite" />
  </text>
  <text class="ok" x="40" y="280" opacity="0">三片按顺序拼回 60 字节，再验 CRC
    <animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0" attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.55;0.75;1" dur="8s" repeatCount="indefinite" />
  </text>
  <text class="txt" x="40" y="328">协商到更大的 MTU 之后，片数变少，重组状态机还在</text>
  <rect class="piece" x="40" y="344" width="280" height="36" rx="4" opacity="0.3">
    <animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="0.3;0.3;1;1" keyTimes="0;0.55;0.7;1" dur="8s" repeatCount="indefinite" />
  </rect>
  <rect class="piece" x="332" y="344" width="280" height="36" rx="4" opacity="0.3">
    <animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="0.3;0.3;1;1" keyTimes="0;0.55;0.7;1" dur="8s" repeatCount="indefinite" />
  </rect>
  <text class="small" x="180" y="368" text-anchor="middle">片 1</text>
  <text class="small" x="472" y="368" text-anchor="middle">片 2</text>
  <circle r="7" cx="130" cy="194" class="fill-y">
    <animate data-ease="linear" attributeName="cx" values="130;322;514;180;472;472" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="8s" repeatCount="indefinite" />
    <animate data-ease="linear" attributeName="cy" values="194;194;194;362;362;362" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="8s" repeatCount="indefinite" />
  </circle>
  <text class="ok" x="620" y="200" opacity="1">约 20 字节<animate attributeName="opacity" values="1;0;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="spline" keySplines="0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" dur="8s" repeatCount="indefinite" /></text>
  <text class="ok" x="620" y="200" opacity="0">约 40 字节<animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="spline" keySplines="0.16 1 0.3 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" dur="8s" repeatCount="indefinite" /></text>
  <text class="ok" x="620" y="200" opacity="0">约 60 字节<animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1" dur="8s" repeatCount="indefinite" /></text>
  <text class="small" x="400" y="416" text-anchor="middle">连得上却看不到完整电压表，先查 MTU，再查分片超时有没有把半帧丢掉。</text>
  <text class="small" x="400" y="442" text-anchor="middle">厂商私有服务里往往是透传。GATT 找到特征值，只是拿到了字节管道。</text>
</svg>