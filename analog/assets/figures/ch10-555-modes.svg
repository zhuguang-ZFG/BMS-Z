<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">555 三种模式对照：无稳态、单稳态、双稳态</title>
<desc id="figDesc">一张三栏对照卡：无稳态自己踩自己，R1+R2+C 自由振荡，f=1.44/((R1+2R2)·C)，输出连续方波、占空比恒大于 50%，用于时钟、PWM、蜂鸣器、闪光灯；单稳态别人踩一脚，TRIG 负脉冲触发，t=1.1·R·C，输出单个定宽脉冲、非再触发，用于按键消抖、定时、看门狗；双稳态不要 RC，TRIG 与 THRES 当置位与复位，本质是一颗带功率输出的 RS 触发器，用于触摸与乒乓开关；底部用「谁发起、时间窗、精度」三问完成选型。</desc>
<rect width="960" height="640" fill="#fffdf8"/>

<defs>
<marker id="arrowInk" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 z" fill="#14213d"/></marker>
<marker id="arrowTeal" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 z" fill="#0f766e"/></marker>
<marker id="arrowAmber" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 z" fill="#b45309"/></marker>
<marker id="arrowGray" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0 L9 4 L0 8 z" fill="#52606d"/></marker>
</defs>

<text x="480" y="42" text-anchor="middle" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="23" font-weight="700" fill="#14213d">三种模式对照：一颗 555，三张面孔</text>
<path d="M 350 54 Q 480 60 610 54" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
<text x="480" y="80" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="13" fill="#52606d">同一只芯片：3 只电阻 + 2 只比较器 + RS 触发器 + 放电管——人格差别只在电容接哪只脚、阈值脚接不接 RC</text>

