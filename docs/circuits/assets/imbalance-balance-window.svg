  <rect class="bms-marker" aria-hidden="true" x="18.0" y="17.1" width="334.0" height="17.3" rx="3.8" transform="rotate(-.5 18.0 25.8)"/><path class="bms-under" aria-hidden="true" d="M24.0 40.0 q 24.0 -2.4 48.0 0 t 48 0 t 48 0 t 48 0 t 48 0 t 48 0"/><text class="title" x="24" y="32">差距会自己长大，窗负责把它拉回来（示意）</text>
