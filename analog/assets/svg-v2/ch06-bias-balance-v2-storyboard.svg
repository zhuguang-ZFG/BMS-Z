<text x="26" y="704" font-size="20" fill="#2a2927" text-anchor="start">1. 反相放大器输入置零，先把正端直接接地。</text>
<text x="26" y="736" font-size="20" fill="#2a2927" text-anchor="start">2. 负端偏流 20 nA 经 90 kΩ 产生 +1.8 mV。</text>
<text x="26" y="768" font-size="20" fill="#2a2927" text-anchor="start">3. 正端串 9 kΩ 且两偏流相等：两项相抵。</text>
<text x="26" y="800" font-size="20" fill="#2a2927" text-anchor="start">4. 正端 22 nA、负端 20 nA，残余为 −0.18 mV。</text>
<text x="26" y="865" font-size="18" fill="#2a2927" text-anchor="start">示意：电流流入输入端为正；Rin 10 kΩ、Rf 90 kΩ、噪声增益 10。</text>
