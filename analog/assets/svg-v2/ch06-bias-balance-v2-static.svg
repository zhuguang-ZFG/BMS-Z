<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">平衡电阻抵消的是相关偏流</title>
<desc id="figDesc">示意：电流流入输入端为正；Rin 10 kΩ、Rf 90 kΩ、噪声增益 10。</desc>
<metadata id="visual-timeline">{&quot;duration&quot;: 12, &quot;beats&quot;: [{&quot;name&quot;: &quot;条件&quot;, &quot;start&quot;: 0, &quot;end&quot;: 3, &quot;caption&quot;: &quot;反相放大器输入置零，先把正端直接接地。&quot;}, {&quot;name&quot;: &quot;变化&quot;, &quot;start&quot;: 3, &quot;end&quot;: 6, &quot;caption&quot;: &quot;负端偏流 20 nA 经 90 kΩ 产生 +1.8 mV。&quot;}, {&quot;name&quot;: &quot;比较&quot;, &quot;start&quot;: 6, &quot;end&quot;: 9, &quot;caption&quot;: &quot;正端串 9 kΩ 且两偏流相等：两项相抵。&quot;}, {&quot;name&quot;: &quot;结论&quot;, &quot;start&quot;: 9, &quot;end&quot;: 12, &quot;caption&quot;: &quot;正端 22 nA、负端 20 nA，残余为 −0.18 mV。&quot;}]}</metadata>
