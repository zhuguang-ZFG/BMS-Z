name: links

# 外链巡检：PR 改文档时检查 + 每月定时巡检（链接会腐烂，见 README"维护"节）。
# 注意 .lychee.toml 里对反爬站点的 accept/exclude 配置——
# 新增站点若报假死，先去核实再改配置，别顺手把真 404 也洗白。
on:
  push:
    branches: [main]
    paths: ["**/*.md", "**/*.html", ".lychee.toml", ".github/workflows/links.yml"]
  pull_request:
    paths: ["**/*.md", "**/*.html", ".lychee.toml", ".github/workflows/links.yml"]
  schedule:
    - cron: "23 3 5 * *"   # 每月 5 日凌晨（错峰）
  workflow_dispatch:

jobs:
  lychee:
    # 镜像与 action 大版本策略同 tests.yml 顶部注释（Ubuntu 26 迁移 / Node 20 弃用）。
    # lychee-action 是 composite action，不受 Node 版本影响，留在 v2。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # 两轮制：GitHub 的 blob HTML 路由会分钟级抖 503/504（判据正确、无抗性）。
      # 第 1 轮红就等 3 分钟再跑一轮，只有两轮都红才判红——不放宽 accept 表，
      # 5xx 依然算失败，只是不给一次瞬时抖动投票权。第 1 轮绿则第 2 轮整个跳过。
      - name: 链接巡检（第 1 轮）
        id: round1
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml --no-progress './**/*.md' './**/*.html'
          output: lychee-report-1.md
          fail: true
      - name: 等上游恢复（仅第 1 轮红时）
        if: steps.round1.outcome == 'failure'
        run: |
          echo "::notice::第 1 轮报红，等 180 s 后复跑一轮再定成败"
          sleep 180
      - name: 链接巡检（第 2 轮，红才跑）
        if: steps.round1.outcome == 'failure'
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml --no-progress './**/*.md' './**/*.html'
          output: lychee-report-2.md
          fail: true
