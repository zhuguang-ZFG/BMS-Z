<rect x="144" y="210" width="22" height="40" fill="#f6eedb" stroke="#37424e" stroke-width="2.5"/>
<path d="M155 250 Q154.96 260.00 155 270" fill="none" stroke="#37424e" stroke-width="2.5"/>
