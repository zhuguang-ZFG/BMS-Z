<text x="26" y="724" font-size="18" fill="#2a2927" text-anchor="start">1. 五十赫兹在本例中可还原，但须先限制带外输入。</text>
<text x="26" y="756" font-size="18" fill="#2a2927" text-anchor="start">2. 九百五十赫兹折回五十赫兹，样本无法分辨来源。</text>
<text x="26" y="788" font-size="18" fill="#2a2927" text-anchor="start">3. 恰好同频采样，每次都是同一相位，得到固定半幅值。</text>
<text x="26" y="820" font-size="18" fill="#2a2927" text-anchor="start">4. 仅偏离一赫兹便出现慢拍；不能把精确同频也称作慢漂。</text>
<text x="26" y="880" font-size="18" fill="#2a2927" text-anchor="start">示意 fs=1 kHz、初相 π/6；</text>
<text x="26" y="908" font-size="18" fill="#2a2927" text-anchor="start">实线由样本插值辅助看形状，不是原模拟波。</text>
</svg>