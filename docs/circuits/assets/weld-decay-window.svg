  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">粘连检测示例：残压要等衰减窗口</text>
  <text x="400" y="54" text-anchor="middle" font-size="13" fill="#475569">示例值，不是示波器截图。负载侧 10 μF、泄放 100 kΩ，τ = 1 s。</text>
  <line x1="80" y1="240" x2="540" y2="240" stroke="#334155"/>
  <line x1="80" y1="240" x2="80" y2="70" stroke="#334155"/>
  <text x="70" y="258" font-size="12" fill="#475569">0</text>
