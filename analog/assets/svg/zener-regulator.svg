<path d="M180 200 Q180.01 207.00 180 214" fill="none" stroke="#37424e" stroke-width="2.5"/><path d="M164 214 Q180.00 214.13 196 214" fill="none" stroke="#37424e" stroke-width="3"/><path d="M170 220 Q180.00 219.92 190 220" fill="none" stroke="#37424e" stroke-width="3"/><line x1="176" y1="226" x2="184" y2="226" stroke="#37424e" stroke-width="3"/>
<text x="200" y="168" font-size="10.5" fill="#6b3f63">齐纳（反接）</text>
<text x="60" y="270" font-size="11" fill="#a8321f" opacity="0">Vin 升高 → 齐纳多吸流，余压落在 Rs
<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.4;0.46;1" dur="6s" repeatCount="indefinite"/></text>
<text x="60" y="294" font-size="11" fill="#3d6b4a" opacity="0">负载加重 → 齐纳少吸流让位——Vout 纹丝不动
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.56;0.9;0.96;1" dur="6s" repeatCount="indefinite"/></text>
