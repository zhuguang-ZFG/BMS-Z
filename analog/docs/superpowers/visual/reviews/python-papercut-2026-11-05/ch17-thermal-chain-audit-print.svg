<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1448 1086" role="img" aria-labelledby="title desc" data-print-width-mm="138" data-composition="technical-overlay-v1" data-base-medium="python-svg"><title id="title">热阻链与结温估算</title><desc id="desc">纸层芯片、外壳和散热器依次连接为热阻链；同样 3.5W 损耗与 25°C 环境，正文两种热阻示例给出 235°C 与约 57°C 的结温估算。</desc><rect width="1448" height="1086" fill="#e2d9cf" /><g id="paper-illustration"><path d="M64,212 L629.3199999999999,210 L1381,213 L1384,415.2 L1381,568 L563.12,570 L60,566 Z" fill="#f6f2ed" stroke="#c4b9ab" stroke-width="1.4" /><path d="M66,214L1377,215" fill="none" stroke="#ffffff" stroke-width="2" opacity=".7" />
