<text x="60" y="614" font-size="22" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">这是启动传输线分析的经验筛查，不是安全或协议合规分界。</text>
<text x="60" y="660" font-size="22" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">串联端接：驱动器输出电阻 + 串阻 ≈ Z₀；同时核负载与分支。</text>
