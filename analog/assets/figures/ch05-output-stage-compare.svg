<g font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5">
<text x="130" y="268" fill="#14213d">拉高：上管硬顶，输出阻抗 20~50Ω</text>
<text x="130" y="288" fill="#14213d">拉低：下管强灌，两个方向都主动</text>
<text x="406" y="268" fill="#14213d">拉高：没有上管，靠 Rp 对 Cb 慢充</text>
<text x="406" y="288" fill="#14213d">拉低：下管灌流（I2C 标准模式 3mA）</text>
<text x="682" y="268" fill="#14213d">拉高/拉低：使能时同推挽</text>
<text x="682" y="288" fill="#14213d">关闭＝高阻，漏流 ±10µA×N 叠加</text>

<text x="130" y="332" fill="#14213d">上管直接驱动：1~2ns 级陡沿</text>
<text x="130" y="352" fill="#52606d">太快也是 EMI 源 → 串 22~33Ω 阻尼</text>
<text x="406" y="332" fill="#14213d">Rp·Cb 充电：tr≈0.847·Rp·Cb</text>
<text x="406" y="352" fill="#52606d">4.7kΩ×100pF→400ns；下降沿几十 ns → 缓升陡降</text>
<text x="682" y="332" fill="#14213d">使能时同推挽；空档无人驱动：</text>
<text x="682" y="352" fill="#52606d">20pF×10kΩ → 0.2µs 电平就开漂</text>

<text x="130" y="396" font-weight="700" fill="#b42318">✗ 禁止！一推一拉＝短路</text>
<text x="130" y="416" fill="#b42318">5V÷(25+25)Ω＝100mA 白烧在两管间</text>
<text x="406" y="396" font-weight="700" fill="#0f766e">✓ 天然线与：任一拉低全线低</text>
<text x="406" y="416" fill="#0f766e">→ I2C 仲裁与时钟延展的地基</text>
<text x="682" y="396" font-weight="700" fill="#b45309">△ 有条件：同时只许一个说话</text>
<text x="682" y="416" fill="#b45309">先关后开，交接 tDIS 10~30ns</text>

<text x="130" y="468" fill="#14213d">两推挽直连烧 IO（对撞 100mA）</text>
<text x="130" y="488" fill="#52606d">换班瞬间直通 → 电源毛刺、动态功耗</text>
<text x="406" y="468" fill="#14213d">忘焊上拉 → 总线全高、无应答</text>
<text x="406" y="488" fill="#52606d">Rp 太大 → 爬坡；被拉低时上拉持续耗电</text>
<text x="682" y="468" fill="#14213d">使能重叠 10ns ＝ 一次微型对撞</text>
<text x="682" y="488" fill="#52606d">上电随机使能 → 使能脚须配默认禁用</text>
</g>

<g>
<rect x="36" y="528" width="888" height="84" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
<rect x="36" y="528" width="6" height="84" fill="#14213d"/>
<text x="60" y="556" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="15" font-weight="700" fill="#14213d">选型口诀：独占线求快选推挽；共享线求不冲突选开漏；分时复用大总线选三态＋时序。</text>
<text x="60" y="580" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12.5" fill="#0f766e">开漏的上拉有窗口：3.3V/100pF 快速模式算出 967Ω~3.5kΩ，取中间 2.2kΩ——开发板上的 2.2k 就是这么来的。</text>
<text x="60" y="600" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12.5" fill="#52606d">三态本质是推挽加一只「闭嘴开关」：继承推挽全部冲突风险，只是把冲突时机交给时序去管。</text>
</g>
</svg>
