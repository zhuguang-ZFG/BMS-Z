- id: ch12-switched-cap-equivalent
  source: docs/p2-02-ch12.md#12.12
  before: '更妙的是时间常数 $RC=\dfrac{C_2}{f_{clk}C_1}$ 里**没有"绝对电阻"了**，只剩两样东西：


    - 两个电容的**比值**，IC 里匹配到 0.1%；

    - 一个时钟，晶振，准到 ppm。


    **精度来源从"造准元件"变成"造准时钟"。** 这是模拟 IC 史上最漂亮的一次偷换。'
  after: 示意$C1=1pF,f{clk}=100kHz$，平均等效电阻为10MΩ；固定1V电压差时，每周期搬运1pC、平均电流为100nA。与第二只电容$C2$组成时间常数后，才有$\tau=C2/(f{clk}C1)$，精度取决于电容比值与时钟精度。绝对$R{eq}$仍取决于绝对$C1$，不能将比值匹配说成绝对电阻精度。
  caption: 电荷搬运与平均电阻。接线与模型条件见图，数值不作器件保证。
  removed_prose_chars: -20
  relationship: replaces-text
- id: ch12-switch-cap
  source: docs/p2-02-ch12.md#12.12c
  before: '**代价一：它是个采样系统，会混叠。** 开关电容滤波器对输入是"采样"的，$f_{clk}$ 就是采样率，所以**前面必须加抗混叠滤波器**（[13.6](p2-03-ch13.md#sec136) 那套账照搬）。


    这也是为什么开关电容滤波器芯片（如 MF10）的时钟通常取信号带宽的 50~100 倍。'
  after: 开关断开时的电荷注入可形成 $\Delta V\approx\Delta Q/C$，时钟馈通还与寄生耦合有关；全差分与 dummy 开关有助于抵消，匹配与时序误差仍会留下残差。简单采样电容的热噪声均方值常用 $kT/C$ 模型估算，具体输出噪声还需按网络传递与噪声折叠计算。
  caption: 开关电容的误差与建立。接线与模型条件见图，数值不作器件保证。
  removed_prose_chars: 16
  relationship: replaces-text
- id: ch12-input-stage-source-z
  source: docs/p2-02-ch12.md#12.13a
  before: '> **一句话记法**：低源阻抗（< 10kΩ）挑 $e_n$ 小的 **BJT**；高源阻抗（> 100kΩ）挑 $I_b$ 小的 **CMOS / JFET**；中间地带比一比 $e_n$ 与 $i_n R_s$ 谁大。'
  after: 在 1 MΩ 时电阻热噪声约 128.7 nV/√Hz，仍不能忽略 A 候选的 $i_nR_s=1000nV/\sqrt{Hz}$。独立泊松电流模型给 $i_n=\sqrt{2qI}$；20 nA 与 20 pA 分别约为 80.05 与 2.532 fA/√Hz。实际净偏置电流可能由多个电流相抵，不能据测得的净 $I_b$ 直接预测整个器件的电流噪声。最后按信号带宽与滤波响应积分得到 RMS。
  caption: 电阻源的偏置与噪声。接线与模型条件见图，数值不作器件保证。
  removed_prose_chars: -82
  relationship: replaces-text
- id: ch12-input-types
  source: docs/p2-02-ch12.md#12.13c
  before: '**算一笔**：$R_s = 1\text{M}\Omega$ 的光电二极管 / 高阻传感器（25°C）。


    - **BJT 输入**（$I_b = 20\text{nA}$）：$20\text{nA} \times 1\text{M}\Omega = \mathbf{20\text{mV}}$。而且 $I_b$ **每升 10°C 大约翻一倍**，到 40°C 就是 80mV，彻底不可用。

    - **CMOS 输入**（$I_b = 1\text{pA}$）：$1\text{pA} \times 1\text{M}\Omega = \mathbf{1\mu V}$。好了**四个数量级**。'
  after: 一些轨到轨输入运放以互补输入对覆盖共模范围。两组交接可能引起 $g_m$、失调与失真的变化，但交接不必发生在供电中点，变化也不一定是固定的“凹陷”。不能给所有器件统一指定 THD 从 0.001% 升到 0.01% 或固定的失调台阶。
  caption: 输入结构的条件与代价。接线与模型条件见图，数值不作器件保证。
  removed_prose_chars: 156
  relationship: replaces-text
- id: ch12-loop-error-v2
  source: docs/p2-02-ch12.md#12.1
  before: 虚短虚断成立有三个前提，缺一不可：
  after: 运放在线性区内满足 $v_o=A(s)(v_+-v_-)$。稳定负反馈且环路增益足够大时，有限输出对应很小的输入压差，这才是**虚短**。**虚断**则指输入电流相对外部支路电流可忽略，来自输入级特性；它本身不以负反馈为前提。实际输入仍有偏置电流、漏电和电容电流。
  caption: 虚短的精度由环路增益决定。四拍按图示模型计算，参数与线型见图。
  removed_prose_chars: -114
  relationship: replaces-text
- id: ch12-source-loading-v2
  source: docs/p2-02-ch12.md#12.2
  before: '> **为什么**：反相放大器增益开到 100 倍，前级高阻传感器就被拖垮了。虚地把输入电阻的下端钉死在地电位，源看到的不是"放大器输入端"，是一只裸电阻。增益要大，这只电阻就得选小，负载天然越挂越重。

    >

    > 「高阻源用同相或仪放」管的正是绕开这面镜子：信号顶在几乎不取电流的输入端上，反馈藏在身后。但直流不取流不等于高频也不取，同相端的输入电容到了高频照样把路收窄。'
  after: 反相源若带串联源阻 $R_s$，源到输出的增益变为 $-R_f/(R_s+R_{in})$。提高增益既可减小 $R_{in}$，也可增大 $R_f$，不能断言高增益必然对应小输入电阻。示意两套电阻分别为 $R_{in}/R_f=10k/100k\Omega$ 与 $100k/1M\Omega$，电阻比都是 10；当 $R_s=10k\Omega$，源到输出幅值增益却分别为 5 与约 9.091。
  caption: 增益相同，信号源负担可以不同。四拍按图示模型计算，参数与线型见图。
  removed_prose_chars: -8
  relationship: replaces-text
- id: ch12-resistor-mismatch-v2
  source: docs/p2-02-ch12.md#12.3
  before: 每只电阻带容差 $t$ 时，两条分压比的最坏失配在 $2t$ 量级，共模信号 $V_{cm}$ 就有约 $2t\cdot V_{cm}$ 折算成差模漏进输出。$t=1\%$ 时漏入约 $1/50$，即 −34~−40dB 量级（具体值与增益设置有关）；$t=0.1\%$ 再改善约 20dB。
  after: 示意名义单位增益，四只独立电阻各为 $R(1\pm t)$。取 $R_2,R_3$ 同向偏高、$R_1,R_4$ 同向偏低的相反比值角点，$CMRR=1/(2t)$（线性比值），$t=1\%/0.1\%$ 分别约为 $33.98/53.98\,dB$。这解释了为什么“0.1% 电阻保证 80 dB”不能成立。集成匹配网络要看**比值**规格；实际电路还加上运放自身 CMRR 与源阻失配。
  caption: 电阻绝对容差不等于比值匹配。四拍按图示模型计算，参数与线型见图。
  removed_prose_chars: -52
  relationship: replaces-text
- id: ch12-leaky-integrator-v2
  source: docs/p2-02-ch12.md#12.4
  before: '- 应用：三角波发生器、ADC 前端抗混叠、PID 的 I 环节。

    - **实战坑**：运放 $V_{OS}$ 会被当成直流一直积分，输出慢慢爬向电源轨（"漂移饱和"）。**必须并在电容上一个超大电阻**（如 10MΩ）泄放直流。'
  after: 恒定输入产生恒定斜率，输入直流分量、失调或偏置误差也会累积，直到真实输出越界。常见连续工作方案是在 $C$ 两端并 $R_f$，但复位开关、DC servo 等也可处理积分漂移，不能规定所有积分器必须用某个 1 MΩ 或 10 MΩ 电阻。
  caption: 泄放把无限 DC 增益变成有限平台。四拍按图示模型计算，参数与线型见图。
  removed_prose_chars: -4
  relationship: replaces-text
- id: ch12-filter-q-v2
  source: docs/p2-02-ch12.md#12.5a
  before: '**阶数怎么定**：$n$ 阶滤波器 = $n/2$ 个二阶节级联（奇数阶再加一个一阶节），滚降 $=-20n$ dB/dec。**要 −60dB 抑制**：一阶需 3 个十倍频程，二阶只需 1.5 个。所以"滚降不够"的答案从来都一样：加阶数，不用换更好的运放。级联时**Q 小的节放前面**（避免前级峰化被后级放大）。'
  after: 标准二阶低通阻尼比 $\zeta=1/(2Q)$。欠阻尼时过冲为 $\exp[-\pi\zeta/\sqrt{1-\zeta^2}]$；代入 Butterworth 得约 4.32%。这不是任意带零点滤波器的通用换算。
  caption: 同一自然频率，阶跃形状随 Q 变化。四拍按图示模型计算，参数与线型见图。
  removed_prose_chars: 44
  relationship: replaces-text
- id: ch12-filter-tolerance-v2
  source: docs/p2-02-ch12.md#12.5b
  before: '2. **Q 只由"比值"决定，$f_c$ 只由"绝对值"决定**：$R$、$C$ 同时偏 5% 只挪 $f_c$，不动 Q。所以调 Q 调比值、调频率调绝对值，两件事解耦（IC 里靠匹配、分立里靠 1% 电阻 + 5% 电容就够）。

    3. **增益会污染 Q**：非单位增益（$K>1$）时 $Q=\dfrac{\sqrt{R_1R_2C_1C_2}}{C_2(R_1+R_2)+R_1C_1(1-K)}$，**增益越大 Q 越大**，大到分母归零就自激。所以 Sallen-Key 一般用单位增益跟随器，把"增益"和"Q"两件事彻底分开。'
  after: 若两只电阻同乘一个比例，或两只电容同乘一个比例，$Q$ 不变、$f_0$ 改变。独立元件误差通常同时改变两者。“1% 电阻配 5% 电容就够”必须由允许的截止、峰化和幅相误差支持。
  caption: 电容比改变 Q，同向缩放才保持形状。四拍按图示模型计算，参数与线型见图。
  removed_prose_chars: 162
  relationship: replaces-text
- id: ch12-peak-droop-v2
  source: docs/p2-02-ch12.md#12.6
  before: 精密整流还有一笔隐蔽的速度账：输入换向瞬间，运放输出必须一口气跨过约两个二极管压降（约 1.4V）才能重新接管，这段时间输出是"放飞"的；压摆率有限的运放，整流高频小信号时会在过零附近拖出一截小尾巴。**信号频率一高，先怀疑压摆率，再怀疑二极管。**常见对策：选更快的运放、用肖特基二极管把要跨的台阶从 0.7V 降到 0.3V、或改用全波拓扑让两只二极管轮流上岗。峰值检测的保持电容同样有讲究：它的漏电拉开"遗忘速度"的下限，薄膜和 C0G 是常客；二极管反向漏电流与缓冲级输入偏置电流，也都在同一只电容上放电，选型时要一并计入。
  after: 关键是每个半周期都有哪条反馈路径。最简单的超级二极管在关断半周可能让运放饱和；换向后的饱和恢复、压摆、二极管电荷与负载共同造成误差。“必跨1.4V”至多描述特定双二极管路径，“全波”也不自动保证不饱和。设计时逐状态画导通路径，再按实际器件检查过零和小信号失真。
  caption: 保持电容的电压仍在随时间下降。四拍按图示模型计算，参数与线型见图。
  removed_prose_chars: 130
  relationship: replaces-text
- id: ch12-phase-cross-v2
  source: docs/p2-02-ch12.md#12.7b
  before: 右上的阶跃小图是同一件事的时域长相：60° 基本一次落定，45° 能数出两三下振铃。所以手册上 "unity-gain stable" 的分量，全在这几十度的夹角里。
  after: 动画显示环路幅值越过 0 dB 的位置。这个单主极点模型没有第二极点、传输延迟或负载影响，不能将其 90° 裕度外推给真实器件。也不能仅凭示波器上“振了几次”精确倒推 PM，零点与高阶极点会改变阶跃。
  caption: 相位裕度必须在环路交越处读取。四拍按图示模型计算，参数与线型见图。
  removed_prose_chars: -16
  relationship: replaces-text
- id: ch12-midpoint-v2
  source: docs/p2-02-ch12.md#12.8
  before: 中点偏置网络自己也是电路，有三笔账要算。其一，分压电阻太大，偏置点会被运放偏置电流和 PCB 漏电流拖偏；太小则白白耗电，常见折中是两路电阻的并联阻抗比信号源阻抗低一个量级（经验规则）。其二，**中点必须滤波**：电源噪声经分压电阻以约一半的比例直接灌进"假地"，所以中点对地总要并一只电容（常见 1~10µF），把噪声对交流短路掉；多级共用一个未滤波中点时，前一级的信号电流也会经它串进后一级。其三，多路共用的虚地要么用跟随器缓冲成低阻抗，要么各处单独偏置——"虚地不虚"在多级音频链路里表现为路间互串，一台设备的音量电位器动一动，另一路跟着哼。
  after: 分压比会把电源纹波耦合到参考点，去耦、缓冲或独立参考的选择由允许噪声、共享回流、耗电和启动决定，没有通用的“比源阻小十倍”或“必加 1–10 µF”。缓冲器要能吸拉负载电流并在去耦电容下稳定；多级耦合需分别保证偏置回路，避免上电冲击和串扰。
  caption: 中点偏置要按阻抗与启动一起算。四拍按图示模型计算，参数与线型见图。
  removed_prose_chars: 153
  relationship: replaces-text
- id: ch12-riso-step-v2
  source: docs/p2-02-ch12.md#12.9a
  before: 布局对稳定性的影响常常比元件值更大：反馈走线绕远会拾取输出端的高 dV/dt，补偿电容离引脚远了会被走线电感架空，长电缆本身既是电容又是天线。所以补偿参数在台架上调好之后，**换一批电缆、换一种摆放，阶跃响应必须重测**——稳定性结论只对"被测的那块板、那套接法"成立。
  after: 负载端的 RC 延迟可以掩盖内部振铃，大信号压摆也能改变观察结果。因此先做小信号环路和阶跃，再查满幅建立、温度、器件差异、电缆与布局。反馈线长度、补偿电容位置和回流改变后需要重测。依据：[TI TIDU032C §2、图 2](https://www.ti.com/lit/ug/tidu032/tidu032.pdf)、[TI《The Signal》§14–15](https://www.ti.com/lit/an/slyt701/slyt701.pdf)。
  caption: 隔离电阻前后取反馈，阶跃不同。四拍按图示模型计算，参数与线型见图。
  removed_prose_chars: -91
  relationship: replaces-text
- id: ch12-tia-noise-gain-v2
  source: docs/p2-02-ch12.md#12.10
  before: 虚地把光电二极管的电压钉在 0V，结电容不充放电，**线性度与速度都最好**。这正是"为什么不用反相放大电压"的答案。
  after: 光电二极管可按光电流源、结电容、并联电阻和暗电流建模。TIA以反馈阻抗把电流转成输出电压，DC高环路增益下$Vo\approx-I{ph}Rf$；例如1nA经1MΩ得−1mV，经10MΩ得−10mV。求和节点只近似保持参考电位，有限环路增益时结电容仍有电压变化。反偏可能降低结电容并改善速度，也可能增加暗电流；零偏压并不普遍代表最快。
  caption: 结电容抬高噪声增益，不直接给信号带宽。四拍按图示模型计算，参数与线型见图。
  removed_prose_chars: -109
  relationship: replaces-text
- id: ch12-tia-compensation-v2
  source: docs/p2-02-ch12.md#12.10a
  before: '- 最小补偿电容：$C_f \ge \sqrt{10^{-11}/(2\pi\times10^6\times10^7)} = \sqrt{1.59\times10^{-25}} \approx 0.4\text{pF}$。**0.4pF 比焊盘寄生电容还小**，说明这一组合的相位裕度本来就紧。实际必须留 1~2pF 并**实测方波过冲**（[12.9 稳定性](p2-02-ch12.md#sec129)）确认。

    - 想提高带宽：降 $R_f$（牺牲增益→后续再加一级）、选更小 $C_j$ 的管子（**PIN 管比普通管快得多**）、选 $GBW$ 更大的运放（$f_{-3dB}\approx\sqrt{GBW/(2\pi R_f C_j)}$）。

    - 想提高灵敏度：升 $R_f$（下图增益顶点），但带宽按 $1/R_f$ 掉——**灵敏度与带宽是同一枚硬币的两面**。'
  after: 在单主极点、$C_f\ll C_{in}$ 等近似下，$C_f\approx\sqrt{C_{in}/(2\pi R_ff_t)}$ 可作补偿**初估**。以上参数给约 0.399 pF；它不是通用下限，也不能据此规定实装必须 1–2 pF。布局、电阻与焊盘寄生可能与目标同量级，但数值随几何、封装和材料改变，不统一指定为 0.1–0.2 pF。
  caption: 反馈电容改变闭环阻尼与速度。四拍按图示模型计算，参数与线型见图。
