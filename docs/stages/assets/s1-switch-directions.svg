<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="s1-switch-t s1-switch-d">
  <title id="s1-switch-t">一个断口，两个方向</title>
  <desc id="s1-switch-d">一只 MOS 的沟道只让放电方向的电流通过，反过来的充电电流则从体二极管穿过；所以断口要背靠背串两只，各堵一个方向。</desc>
  <defs>
    <marker id="ar-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path class="head-teal" d="M0 0L9 4.5L0 9Z"/>
    </marker>
    <style>
      text { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #293b3a; }
      .title { font-size: 20px; font-weight: 700; }
      .h { font-size: 15px; font-weight: 700; fill: #293b3a; }
      .body { font-size: 13px; fill: #293b3a; }
      .small { font-size: 12px; fill: #626d65; }
      .mid { font-size: 12px; fill: #293b3a; }
      .accent { fill: #176b73; }
      .green { fill: #377b60; }
      .red { fill: #b84745; }
      .gold { fill: #926717; }
      .frame { fill: none; stroke: #176b73; stroke-width: 1.6; stroke-dasharray: 8 6; }
      .card { fill: #fffdf5; stroke: #968d77; stroke-width: 1.4; }
      .soft { fill: #e4f0df; stroke: #377b60; stroke-width: 1.4; }
      .warn { fill: #fbefc7; stroke: #926717; stroke-width: 1.4; }
      .danger { fill: #f6e2df; stroke: #b84745; stroke-width: 1.4; }
      .strip { fill: #e4f0df; stroke: #377b60; stroke-width: 1.4; }
      .wire { stroke: #293b3a; stroke-width: 2; fill: none; }
      .switch { stroke: #293b3a; stroke-width: 3; fill: none; stroke-linecap: round; }
      .bar { stroke: #293b3a; stroke-width: 3; stroke-linecap: round; }
      .diode { fill: #293b3a; }
      .flow { stroke: #176b73; stroke-width: 2.4; fill: none; }
      .dot { fill: #176b73; }
      .strike { stroke: #176b73; stroke-width: 2; fill: none; }
      .head-teal { fill: #176b73; }
      @media (prefers-color-scheme: dark) {
        text { fill: #edf0e5; }
        .title { fill: #edf0e5; }
        .h { fill: #edf0e5; }
        .body { fill: #edf0e5; }
        .mid { fill: #edf0e5; }
        .small { fill: #b0beb3; }
        .accent { fill: #7ec5c5; }
        .green { fill: #8fc7a2; }
        .red { fill: #f39b91; }
        .gold { fill: #dfbd78; }
        .frame { stroke: #7ec5c5; }
        .card { fill: #223333; stroke: #71908c; }
        .soft { fill: #293f35; stroke: #8fc7a2; }
        .warn { fill: #453e2b; stroke: #dfbd78; }
        .danger { fill: #483336; stroke: #f39b91; }
        .strip { fill: #293f35; stroke: #8fc7a2; }
        .wire { stroke: #edf0e5; }
        .switch { stroke: #edf0e5; }
        .bar { stroke: #edf0e5; }
        .diode { fill: #edf0e5; }
        .flow { stroke: #7ec5c5; }
        .dot { fill: #7ec5c5; }
        .strike { stroke: #7ec5c5; }
        .head-teal { fill: #7ec5c5; }
      }
    </style>
  </defs>

  <text x="480" y="34" text-anchor="middle" class="title">一个断口，两个方向</text>
  <path d="M392 44C420 42 520 46 578 43" class="strike" opacity=".5"/>
  <text x="480" y="66" text-anchor="middle" class="small">一只 MOS 只堵一边，另一边由体二极管放行</text>

  <text x="44" y="88" class="small accent">一只 MOS 里同时住着两条路</text>
  <rect class="frame" x="32" y="96" width="470" height="330" rx="12"/>

  <text x="140" y="140" text-anchor="middle" class="h">沟道</text>
  <text x="340" y="140" text-anchor="middle" class="h">体二极管</text>

  <path class="wire" d="M120 160H360"/>
  <path class="wire" d="M120 390H360"/>
  <text x="44" y="166" class="small">接电池</text>
  <text x="44" y="396" class="small">接端子</text>

  <path class="wire" d="M140 160V236"/>
  <circle cx="140" cy="240" r="4" class="dot"/>
  <path class="switch" d="M140 240L170 212"/>
  <circle cx="140" cy="264" r="4" class="dot"/>
  <path class="flow" d="M140 264V388" marker-end="url(#ar-teal)"/>
  <text x="140" y="414" text-anchor="middle" class="small">放电：走沟道</text>

  <path class="wire" d="M340 160V248"/>
  <line x1="314" y1="248" x2="366" y2="248" class="bar"/>
  <path class="diode" d="M340 248L314 284H366Z"/>
  <path class="flow" d="M340 390V290" marker-end="url(#ar-teal)"/>
  <text x="340" y="414" text-anchor="middle" class="small">充电：走体二极管</text>

  <text x="532" y="88" class="small accent">断口里为什么是两只</text>
  <rect class="frame" x="520" y="96" width="408" height="344" rx="12"/>

  <text x="536" y="124" class="h">所以背靠背放两只</text>

  <rect class="danger" x="536" y="140" width="360" height="100" rx="10"/>
  <text x="552" y="172" class="h red">充电 MOS</text>
  <text x="552" y="196" class="small">只挡充电方向</text>
  <text x="552" y="220" class="small">它关断：充电停，放电照走</text>

  <text x="536" y="262" class="small">背靠背串在同一根线上</text>

  <rect class="soft" x="536" y="272" width="360" height="100" rx="10"/>
  <text x="552" y="304" class="h green">放电 MOS</text>
  <text x="552" y="328" class="small">只挡放电方向</text>
  <text x="552" y="352" class="small">它关断：放电停，充电照走</text>

  <rect class="warn" x="536" y="392" width="360" height="44" rx="10"/>
  <text x="552" y="419" class="small">只装一只：总有一个方向关不掉</text>

  <rect class="strip" x="64" y="470" width="832" height="46" rx="12"/>
  <text x="480" y="499" text-anchor="middle" class="h green">一只开关只挡一个方向；反向靠体二极管，所以断口要两只</text>
  <text x="480" y="542" text-anchor="middle" class="small">体二极管是 MOS 的内部结构，不是外加器件；栅极驱动与保护 IC 从略</text>
</svg>
