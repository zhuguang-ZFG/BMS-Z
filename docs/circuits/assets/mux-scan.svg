  <text x="400" y="412" text-anchor="middle" font-size="14" class="small">像哨兵巡逻：同一颗 ADC 轮流接到每一串——串间一致性极好（共用一个基准）</text>
<rect x="24" y="438.0" width="752" height="188" rx="6" class="panel" /><text x="40" y="458.0" font-size="13" class="txt">底栏：每串示意 100 µs。5 串 = 0.50 ms，16 串 = 1.60 ms</text><text x="40" y="474.0" font-size="12" class="small">一圈 ms</text><line x1="70.0" y1="474.0" x2="70.0" y2="588.0" stroke-width="1.5" class="stroke-axis" /><line x1="70.0" y1="588.0" x2="460.0" y2="588.0" stroke-width="1.5" class="stroke-axis" /><line x1="184.7" y1="588.0" x2="184.7" y2="593.0" class="stroke-axis" /><text x="184.7" y="606.0" text-anchor="middle" font-size="12" class="small">5</text><line x1="437.1" y1="588.0" x2="437.1" y2="593.0" class="stroke-axis" /><text x="437.1" y="606.0" text-anchor="middle" font-size="12" class="small">16</text><line x1="65.0" y1="556.3" x2="70.0" y2="556.3" class="stroke-axis" /><text x="62.0" y="560.3" text-anchor="end" font-size="12" class="small">0.50</text><line x1="65.0" y1="486.7" x2="70.0" y2="486.7" class="stroke-axis" /><text x="62.0" y="490.7" text-anchor="end" font-size="12" class="small">1.60</text><polyline points="92.9,581.7 115.9,575.3 138.8,569.0 161.8,562.7 184.7,556.3 207.6,550.0 230.6,543.7 253.5,537.3 276.5,531.0 299.4,524.7 322.4,518.3 345.3,512.0 368.2,505.7 391.2,499.3 414.1,493.0 437.1,486.7" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" class="stroke-b" /><circle r="5" class="fill-y"><animate attributeName="cx" values="92.9;138.8;184.7;230.6;276.5;299.4;345.3;391.2;437.1" keyTimes="0.0000;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1.0000" dur="8s" repeatCount="indefinite" /><animate attributeName="cy" values="581.7;569.0;556.3;543.7;531.0;524.7;512.0;499.3;486.7" keyTimes="0.0000;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1.0000" dur="8s" repeatCount="indefinite" /></circle><text x="460.0" y="606.0" text-anchor="end" font-size="12" class="small">节数</text><text x="480" y="516.0" font-size="12" class="txt">直线过原点。图上画的是 5 串。</text>
