<text x="412" y="308" font-size="11.5" font-weight="bold" fill="#a4630f">④ 结论</text><text x="412" y="333" font-size="14.5" font-weight="bold" fill="#16202b">同一注入曲线，C 定台阶还是谐波</text><text x="412" y="350" font-size="10.5" fill="#5b666f">加大电容的第三个好处</text><rect x="400" y="284" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.75;0.78;1" dur="14s" repeatCount="indefinite"/></rect>
