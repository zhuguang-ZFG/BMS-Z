</style><rect class="bg" x="0" y="-156" width="800" height="660" /><text class="title" x="24" y="-128">温度：电池的两副面孔</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 温度：电池的两副面孔<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② Li⁺ 挤不进负极，在表面镀成金属锂<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 枝晶可能刺穿隔膜 → 内短路<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="448" width="752" height="44" rx="6" /><text class="small" x="40" y="476">关键：低温怕充电（析锂），高温怕一切（老化）；功率限制先看温度计。</text><rect width="800" height="440" class="bg" />
  <rect x="200" y="58" width="400" height="12" rx="6" stroke-width="1.5" class="fill-muted stroke-axis" />
  <rect x="375" y="58" width="100" height="12" class="fill-boxg"><animate attributeName="stroke-width" values="5;5;2;2;2;2" keyTimes="0;0.2;0.28;0.48;0.56;1" dur="12s" repeatCount="indefinite" /></rect>
  <text x="200" y="86" text-anchor="middle" font-size="12" class="small">-20℃</text>
  <text x="300" y="86" text-anchor="middle" font-size="12" class="small">0℃</text>
  <text x="425" y="86" text-anchor="middle" font-size="12" class="ok">舒适区</text>
  <text x="600" y="86" text-anchor="middle" font-size="12" class="small">60℃</text>
  <circle cy="64" r="9" fill="#10b981" cx="400">
    
    <animate attributeName="cx" values="400;400;275;275;525;525" keyTimes="0;0.2;0.28;0.48;0.56;1" dur="12s" repeatCount="indefinite" />
    <animate attributeName="fill" values="#34d399;#34d399;#60a5fa;#60a5fa;#f87171;#f87171" keyTimes="0;0.2;0.28;0.48;0.56;1" dur="12s" repeatCount="indefinite" />
  </circle>

  
  <text x="220" y="116" text-anchor="middle" font-size="15" font-weight="bold" class="hi">低温充电：析锂</text>
  <rect x="100" y="140" width="240" height="150" stroke-width="2" class="panel stroke-axis"><animate attributeName="stroke-width" values="2;2;5;5;2;2" keyTimes="0;0.2;0.28;0.48;0.56;1" dur="12s" repeatCount="indefinite" /></rect>
  <rect x="100" y="140" width="60" height="150" class="fill-boxr" />
  <rect x="280" y="140" width="60" height="150" class="fill-boxb"><animate attributeName="stroke-width" values="2;2;5;5;2;2" keyTimes="0;0.2;0.28;0.48;0.56;1" dur="12s" repeatCount="indefinite" /></rect>
  <text x="130" y="305" text-anchor="middle" font-size="12" class="small">正极</text>
  <text x="220" y="305" text-anchor="middle" font-size="12" class="small">电解液</text>
  <text x="310" y="305" text-anchor="middle" font-size="12" class="small">负极</text>
  <text x="160" y="136" text-anchor="start" font-size="12" font-weight="bold" opacity="0" class="hi">充电电流 →
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.33;1" dur="12s" repeatCount="indefinite" />
  </text>

  
  <circle r="5" opacity="0" class="fill-g">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.31;1" dur="12s" repeatCount="indefinite" />
    <animateMotion path="M150,180 L272,180" keyPoints="0;0;1;1" keyTimes="0;0.28;0.5;1" calcMode="linear" dur="12s" repeatCount="indefinite" />
  </circle>
  <circle r="5" opacity="0" class="fill-g">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.31;1" dur="12s" repeatCount="indefinite" />
    <animateMotion path="M140,215 L272,215" keyPoints="0;0;1;1" keyTimes="0;0.28;0.5;1" calcMode="linear" dur="12s" repeatCount="indefinite" begin="-1s" />
  </circle>
  <circle r="5" opacity="0" class="fill-g">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.31;1" dur="12s" repeatCount="indefinite" />
    <animateMotion path="M155,250 L272,250" keyPoints="0;0;1;1" keyTimes="0;0.28;0.5;1" calcMode="linear" dur="12s" repeatCount="indefinite" begin="-2s" />
  </circle>

  
  <path d="M282,180 L314,190" fill="none" stroke-width="3" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" class="stroke-axis">
    <animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.36;0.52;1" dur="12s" repeatCount="indefinite" />
  </path>
  <path d="M282,215 L318,215" fill="none" stroke-width="3" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" class="stroke-axis">
    <animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.38;0.54;1" dur="12s" repeatCount="indefinite" />
  </path>
  <path d="M282,250 L312,242" fill="none" stroke-width="3" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" class="stroke-axis">
    <animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.4;0.56;1" dur="12s" repeatCount="indefinite" />
  </path>
  <text x="220" y="330" text-anchor="middle" font-size="12" opacity="0" class="warn">Li⁺ 挤不进负极，在表面镀成金属锂
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.36;0.42;1" dur="12s" repeatCount="indefinite" />
  </text>
  <text x="220" y="352" text-anchor="middle" font-size="12" opacity="0" class="warn">枝晶可能刺穿隔膜 → 内短路
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.44;0.5;1" dur="12s" repeatCount="indefinite" />
  </text>

  
  <text x="580" y="116" text-anchor="middle" font-size="15" font-weight="bold" class="warn">高温：老化加速</text>
  <rect x="460" y="140" width="240" height="150" stroke-width="2" class="panel stroke-axis"><animate attributeName="stroke-width" values="2;2;2;2;5;5" keyTimes="0;0.2;0.28;0.48;0.56;1" dur="12s" repeatCount="indefinite" /></rect>
  <rect x="460" y="140" width="60" height="150" class="fill-boxr"><animate attributeName="stroke-width" values="2;2;2;2;5;5" keyTimes="0;0.2;0.28;0.48;0.56;1" dur="12s" repeatCount="indefinite" /></rect>
  <rect x="640" y="140" width="60" height="150" class="fill-boxb" />
  <rect x="636" y="140" width="2" height="150" opacity="0.7" class="fill-y">
    <animate attributeName="width" values="2;2;2;14;14" keyTimes="0;0.56;0.62;0.8;1" dur="12s" repeatCount="indefinite" />
    <animate attributeName="x" values="636;636;636;624;624" keyTimes="0;0.56;0.62;0.8;1" dur="12s" repeatCount="indefinite" />
  </rect>
  <text x="618" y="130" text-anchor="end" font-size="12" opacity="0" class="gold">SEI 变厚
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7;0.75;1" dur="12s" repeatCount="indefinite" />
  </text>
  <circle r="4" opacity="0" class="fill-boxr">
    <animate attributeName="opacity" values="0;0;0.8;0.8;0" keyTimes="0;0.62;0.66;0.95;1" dur="12s" repeatCount="indefinite" />
    <animateMotion path="M560,265 L560,150" keyPoints="0;0;1;1" keyTimes="0;0.62;0.95;1" calcMode="linear" dur="12s" repeatCount="indefinite" />
  </circle>
  <circle r="3" opacity="0" class="fill-boxr">
    <animate attributeName="opacity" values="0;0;0.8;0.8;0" keyTimes="0;0.66;0.7;0.97;1" dur="12s" repeatCount="indefinite" />
    <animateMotion path="M590,270 L590,155" keyPoints="0;0;1;1" keyTimes="0;0.66;0.97;1" calcMode="linear" dur="12s" repeatCount="indefinite" />
  </circle>
  <circle r="3" opacity="0" class="fill-boxr">
    <animate attributeName="opacity" values="0;0;0.8;0.8;0" keyTimes="0;0.7;0.74;0.99;1" dur="12s" repeatCount="indefinite" />
    <animateMotion path="M535,268 L535,152" keyPoints="0;0;1;1" keyTimes="0;0.7;0.99;1" calcMode="linear" dur="12s" repeatCount="indefinite" />
  </circle>

  
  <rect x="470" y="322" width="200" height="14" stroke-width="1.5" class="fill-boxg stroke-g"><animate attributeName="stroke-width" values="2;2;2;2;5;5" keyTimes="0;0.2;0.28;0.48;0.56;1" dur="12s" repeatCount="indefinite" /></rect>
  <rect x="670" y="322" width="0" height="14" opacity="0.75" class="fill-r">
    <animate attributeName="width" values="0;0;70;70" keyTimes="0;0.62;0.85;1" dur="12s" repeatCount="indefinite" />
    <animate attributeName="x" values="670;670;600;600" keyTimes="0;0.62;0.85;1" dur="12s" repeatCount="indefinite" />
  </rect>
  <text x="570" y="354" text-anchor="middle" font-size="12" opacity="0" class="warn">副反应加速，容量永久缩水
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.72;0.78;1" dur="12s" repeatCount="indefinite" />
  </text>

  
  <rect x="150" y="372" width="500" height="30" rx="6" stroke-width="1.5" opacity="0" class="fill-boxb stroke-b">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.72;0.78;1" dur="12s" repeatCount="indefinite" />
  </rect>
  <text x="400" y="391" text-anchor="middle" font-size="13" opacity="0" class="hi">BMS 对策：看温度限功率——低温先砍充电，高温充放都限
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.72;0.78;1" dur="12s" repeatCount="indefinite" />
  </text>

  
</svg>