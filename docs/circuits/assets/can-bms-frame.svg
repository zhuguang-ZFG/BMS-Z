      .small { fill: #b0beb3; }
      .title { fill: #edf0e5; }
      .hi { fill: #7ec5c5; }
      .warn { fill: #f39b91; }
      .ok { fill: #8fc7a2; }
      .gold { fill: #dfbd78; }
      .lineb { stroke: #7ec5c5; }
      .liner { stroke: #f39b91; }
      .lineg { stroke: #8fc7a2; }
      .liney { stroke: #dfbd78; }
      .dotb { fill: #7ec5c5; }
      .dotr { fill: #f39b91; }
      .dotg { fill: #8fc7a2; }
      .doty { fill: #dfbd78; }
