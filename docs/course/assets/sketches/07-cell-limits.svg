<title id="title">总压一样，单节未必一样</title><desc id="desc">两组四节串联电芯都由高阻电压表读得14.81 V。上组3.70、3.72、3.68、3.71 V；下组4.25、3.52、3.52、3.52 V，第一节达到4.20 V教学过压阈值。串联导线真实连接，电压表跨接包端；不把总压等同于单节合格。</desc>
