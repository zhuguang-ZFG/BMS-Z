<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420">
  <title>功能安全认证现场示意图</title>
  <rect width="880" height="420" fill="#f8fafc"/>
  <style>
  text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
  @media (prefers-color-scheme: dark){
  rect[fill="#f8fafc"]{fill:#0f172a}
  rect[fill="#fff"]{fill:#1e293b}
  [fill="#e2e8f0"]{fill:#334155}
  [stroke="#e2e8f0"]{stroke:#334155}
  [fill="#334155"]{fill:#e2e8f0}
  [stroke="#334155"]{stroke:#e2e8f0}
  [fill="#1e293b"]{fill:#f1f5f9}
  [stroke="#1e293b"]{stroke:#f1f5f9}
  [fill="#dbeafe"]{fill:#1e3a8a}
  [stroke="#dbeafe"]{stroke:#1e3a8a}
  [fill="#1d4ed8"]{fill:#60a5fa}
  [stroke="#1d4ed8"]{stroke:#60a5fa}
  [fill="#ecfdf5"]{fill:#022c22}
  [fill="#059669"]{fill:#34d399}
  [stroke="#059669"]{stroke:#34d399}
  [fill="#fffbeb"]{fill:#451a03}
  [fill="#fef3c7"]{fill:#78350f}
  [fill="#b45309"]{fill:#fbbf24}
  [stroke="#b45309"]{stroke:#fbbf24}
  [fill="#fef2f2"]{fill:#450a0a}
  [fill="#fecaca"]{fill:#7f1d1d}
  [fill="#dc2626"]{fill:#f87171}
  [stroke="#dc2626"]{stroke:#f87171}
  }
  </style>

  <text x="440" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">认证现场要看见的三件事</text>
  <text x="440" y="50" text-anchor="middle" font-size="13" fill="#b45309">示意图·待实拍</text>
  <rect x="24" y="78" width="260" height="170" rx="8" fill="#fff" stroke="#e2e8f0"><animate attributeName="stroke-width" values="5;2;2;5" keyTimes="0;0.4;0.75;1" dur="7s" repeatCount="indefinite"/></rect>
  <text x="154" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">失效注入台</text>
  <text x="154" y="140" text-anchor="middle" font-size="13" fill="#334155">拔一根采样线</text>
  <text x="154" y="164" text-anchor="middle" font-size="13" fill="#334155">或抬高一串模拟电压</text>
  <text x="154" y="196" text-anchor="middle" font-size="13" fill="#334155">停掉喂狗</text>
  <rect x="308" y="78" width="260" height="170" rx="8" fill="#fffbeb" stroke="#b45309"><animate attributeName="stroke-width" values="2;5;2;2" keyTimes="0;0.4;0.75;1" dur="7s" repeatCount="indefinite"/></rect>
  <text x="438" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">硬件比较器</text>
  <text x="438" y="140" text-anchor="middle" font-size="13" fill="#334155">不经过这颗 MCU</text>
  <text x="438" y="164" text-anchor="middle" font-size="13" fill="#334155">软件停了它还在</text>
  <text x="438" y="196" text-anchor="middle" font-size="13" fill="#dc2626">不能被标定旁路</text>
  <rect x="592" y="78" width="264" height="170" rx="8" fill="#ecfdf5" stroke="#059669"><animate attributeName="stroke-width" values="2;2;5;2" keyTimes="0;0.4;0.75;1" dur="7s" repeatCount="indefinite"/></rect>
  <text x="724" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">见证记录</text>
  <text x="724" y="140" text-anchor="middle" font-size="13" fill="#334155">开线先于「这是过充」</text>
  <text x="724" y="164" text-anchor="middle" font-size="13" fill="#334155">切断时间写在记录里</text>
  <text x="724" y="196" text-anchor="middle" font-size="13" fill="#334155">不是一张证书扫描件</text>
  <circle cy="163" r="6" fill="#059669">
    <animate attributeName="cx" values="154;438;724;154" keyTimes="0;0.4;0.75;1" dur="7s" repeatCount="indefinite"/>
  </circle>
  <text x="24" y="286" font-size="14" fill="#1e293b">ASIL 严重度、暴露率、可控性的计算图不是认证场地的照片，没有收。</text>
  <text x="24" y="314" font-size="14" fill="#334155">本节不编 ISO 条款号。绿点沿注入、硬件切断、记录走。现场实拍仍然没有。</text>

</svg>
