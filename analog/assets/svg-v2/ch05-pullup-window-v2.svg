<g data-caption="变化" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="3s" dur="0.2s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="5.8s" dur="0.2s" fill="freeze"/><text x="360" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#16202b">100 pF、300 ns：上限约 3541 Ω。</text></g>
