corrections:
- Sharing one pull-up does not double sink current; multiple pull-ups in parallel do increase it.
- Thirty-to-seventy-percent rise time is not time from zero to seventy percent.
- Active-low output-enable needs a pull-up for default disable; a keeper does not guarantee its initial
  state.
- Controlled class-AB overlap is intentional. Bias for two single VBE junctions is about 1.2 V plus emitter-resistor
  drops, not automatically 2.4 V.
- Class-B maximum per-transistor heat is Vcc squared divided by pi squared RL, or 0.2026 times the ideal
  maximum load power.
- Powered-off isolation requires explicit Ioff or equivalent specification; receiver fail-safe and overvoltage
  tolerance are distinct features.
