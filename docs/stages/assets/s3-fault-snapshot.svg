<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="fs-t fs-d">
  <title id="fs-t">故障那一拍：把现场钉在存储里</title>
  <desc id="fs-d">固件每一拍把采样写进滚动缓冲的一格，写满就回头覆盖最早的一格；保护判定触发的那一拍立刻停写，把整段缓冲连同触发原因一起抄进非易失区，所以复位或掉电之后，当时那一刻的电压、电流和温度仍然导得出来。</desc>
  <defs>
    <marker id="arrow-accent" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path class="head-accent" d="M0 0L9 4.5L0 9Z"/>
    </marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path class="head-red" d="M0 0L9 4.5L0 9Z"/>
    </marker>
    <style>
      text { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #293b3a; }
      .title { font-size: 20px; font-weight: 700; fill: #293b3a; }
      .sub { font-size: 12px; fill: #626d65; }
      .h { font-size: 15px; font-weight: 700; fill: #293b3a; }
      .body { font-size: 13px; fill: #293b3a; }
      .small { font-size: 12px; fill: #626d65; }
      .tiny { font-size: 12px; fill: #626d65; }
      .accent { fill: #176b73; }
      .green { fill: #377b60; }
      .red { fill: #b84745; }
      .gold { fill: #926717; }
      .paper { fill: #fffdf5; }
      .card { fill: #fffdf5; stroke: #968d77; stroke-width: 1.4; }
      .card-green { fill: #e4f0df; stroke: #377b60; stroke-width: 1.6; }
      .card-gold { fill: #fbefc7; stroke: #926717; stroke-width: 1.4; }
      .card-red { fill: #f6e2df; stroke: #b84745; stroke-width: 1.4; }
      .strip { fill: #e4f0df; stroke: #377b60; stroke-width: 1.4; }
      .flow { stroke: #176b73; stroke-width: 2; fill: none; }
      .flow-dash { stroke: #176b73; stroke-width: 1.6; fill: none; stroke-dasharray: 7 5; }
      .fault { stroke: #b84745; stroke-width: 2.2; fill: none; }
      .fault-dash { stroke: #b84745; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; }
      .leader { stroke: #626d65; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; }
      .dot { fill: #176b73; }
      .dot-red { fill: #b84745; }
      .strike { stroke: #176b73; stroke-width: 2; fill: none; }
      .head-accent { fill: #176b73; }
      .head-red { fill: #b84745; }
      @media (prefers-color-scheme: dark) {
        text { fill: #edf0e5; }
        .title { fill: #edf0e5; }
        .sub { fill: #b0beb3; }
        .h { fill: #edf0e5; }
        .body { fill: #edf0e5; }
        .small { fill: #b0beb3; }
        .tiny { fill: #b0beb3; }
        .accent { fill: #7ec5c5; }
        .green { fill: #8fc7a2; }
        .red { fill: #f39b91; }
        .gold { fill: #dfbd78; }
        .paper { fill: #223333; }
        .card { fill: #223333; stroke: #71908c; }
        .card-green { fill: #293f35; stroke: #8fc7a2; }
        .card-gold { fill: #453e2b; stroke: #dfbd78; }
        .card-red { fill: #483336; stroke: #f39b91; }
        .strip { fill: #293f35; stroke: #8fc7a2; }
        .flow { stroke: #7ec5c5; }
        .flow-dash { stroke: #7ec5c5; }
        .fault { stroke: #f39b91; }
        .fault-dash { stroke: #f39b91; }
        .leader { stroke: #b0beb3; }
        .dot { fill: #7ec5c5; }
        .dot-red { fill: #f39b91; }
        .strike { stroke: #7ec5c5; }
        .head-accent { fill: #7ec5c5; }
        .head-red { fill: #f39b91; }
      }
    </style>
  </defs>

  <rect class="paper" x="0" y="0" width="960" height="560"/>

  <text x="480" y="32" text-anchor="middle" class="title">故障那一拍：把现场钉在存储里</text>
  <path d="M340 42C410 40 480 44 556 41" class="strike" opacity=".5"/>
  <text x="480" y="62" text-anchor="middle" class="sub">平时只是滚动覆盖，触发的那一瞬才被留下</text>

  <text x="60" y="100" class="small accent">每拍写一格，写满回头覆盖最早的一格</text>

  <rect class="card-red" x="60" y="120" width="46" height="46" rx="6"/>
  <rect class="card" x="112" y="120" width="46" height="46" rx="6"/>
  <rect class="card" x="164" y="120" width="46" height="46" rx="6"/>
  <rect class="card" x="216" y="120" width="46" height="46" rx="6"/>
  <rect class="card" x="268" y="120" width="46" height="46" rx="6"/>
  <rect class="card" x="320" y="120" width="46" height="46" rx="6"/>
  <rect class="card" x="372" y="120" width="46" height="46" rx="6"/>
  <rect class="card-green" x="424" y="120" width="46" height="46" rx="6"/>
  <circle cx="447" cy="143" r="5" class="dot"/>

  <path class="flow-dash" d="M447 168V200H83V174" marker-end="url(#arrow-accent)"/>
  <text x="300" y="220" text-anchor="middle" class="small">写满就回头，最早的一格被新的盖掉</text>
  <text x="447" y="220" text-anchor="middle" class="small green">这一格正在写</text>

  <path class="fault" d="M474 143H492" marker-end="url(#arrow-red)"/>
  <rect class="card-red" x="496" y="112" width="206" height="98" rx="10" transform="rotate(-0.5 599 161)"/>
  <text x="599" y="144" text-anchor="middle" class="h red">触发：停写</text>
  <text x="599" y="170" text-anchor="middle" class="small">越限的那一拍</text>
  <text x="599" y="192" text-anchor="middle" class="small">指针就地停住</text>

  <path class="flow" d="M702 161H734" marker-end="url(#arrow-accent)"/>
  <rect class="card-green" x="738" y="106" width="184" height="116" rx="10" transform="rotate(0.5 830 164)"/>
  <text x="830" y="138" text-anchor="middle" class="h green">非易失区</text>
  <text x="830" y="164" text-anchor="middle" class="small">冻住的那一段</text>
  <text x="830" y="186" text-anchor="middle" class="small">加触发原因与状态</text>
  <text x="830" y="208" text-anchor="middle" class="small">复位也不丢</text>

  <path class="fault-dash" d="M738 252H922"/>
  <text x="830" y="246" text-anchor="middle" class="small red">复位 / 掉电</text>
  <path class="fault-dash" d="M830 224V296" marker-end="url(#arrow-red)"/>

  <rect class="card" x="700" y="300" width="220" height="72" rx="10"/>
  <text x="810" y="332" text-anchor="middle" class="h">下次上电</text>
  <text x="810" y="358" text-anchor="middle" class="small">整段原样导出，现场还在</text>

  <rect class="card-gold" x="60" y="280" width="470" height="122" rx="10" transform="rotate(-0.4 295 341)"/>
  <text x="295" y="312" text-anchor="middle" class="h gold">快照里钉住什么</text>
  <text x="295" y="342" text-anchor="middle" class="body">那一刻的电压、电流、温度</text>
  <text x="295" y="368" text-anchor="middle" class="body">还有当时的状态与触发原因</text>

  <rect class="strip" x="80" y="440" width="800" height="48" rx="12"/>
  <text x="480" y="470" text-anchor="middle" class="h green">平时滚动覆盖，触发才冻结；抄进非易失区，掉电也带不走</text>

  <text x="480" y="528" text-anchor="middle" class="tiny">快照的内容与容量按芯片和固件约定；图上只画先后顺序</text>
</svg>
