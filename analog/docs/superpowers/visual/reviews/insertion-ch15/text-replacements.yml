- id: ch15-decap-resonance-v2
  source: docs/p3-02-ch15.md#15.1
  before: '**算一笔：去耦回路电感怎么吃掉电容**。一颗 0402 的 100 nF 电容自身 ESL 约 0.5 nH，但电容焊盘 → 过孔 → 地平面 → 芯片地脚这一圈的回路电感才是大头：一对过孔加 3 mm
    走线约 1 nH–2 nH。若把电容挪到 20 mm 外，回路电感涨到 8 nH–10 nH。取 $L=5\ \mathrm{nH}$、$C=100\ \mathrm{nF}$，自谐振频率


    $$f_0=\frac{1}{2\pi\sqrt{LC}}=\frac{1}{2\pi\sqrt{5\times10^{-9}\times10^{-7}}}\approx 7.1\ \mathrm{MHz}$$


    7 MHz 以上这个"去耦电容"表现为电感，阻抗随频率上升，恰恰在数字噪声最密集的几十 MHz 区间失去作用。贴脸放到 3 mm 内，$L$ 压到 1 nH 上下，$f_0$ 升到 16 MHz 以上，并且配合地平面的低阻抗，可用频段大幅拓宽。这就是"<3
    mm"这个数字的由来——不是工艺好看，是谐振点搬家。


    **为什么电容"放了但没用"，原理图上永远看不出来？** 因为失效的不在电气连接，在电流回路围出来的那块面积——把它从俯视画出来，两种摆法的差别一眼见底：


    <!-- slot:intuition -->

    > **图问**：同一颗 100nF，贴 3mm 与放 20mm，回路电感差十倍——自谐振为什么从 16MHz 以上掉到约 7MHz？




    **读图指引**：左右两图用的是同一颗 0402（自身 ESL 仅 0.5 nH），差别全在焊盘→过孔→地平面→芯片地脚这一圈。左图箭头贴着芯片与电容之间走直线，环面积最小，对一根过孔加 3 mm 走线的 1~2 nH
    量级，把自谐振推到 16 MHz 以上；右图电容在 20 mm 外，电流被迫绕大环，电感涨到 8~10 nH，代入 $f_0=1/(2\pi\sqrt{LC})$ 只剩约 7.1 MHz。对照条记住一句：L 翻几倍，f₀
    按平方根掉——所以补救顺序永远是先挪电容、再考虑过孔，最后才轮到换料。'
  after: '**去耦支路先算阻抗。** 理想串联 LC 的谐振频率为 $f_0=1/(2\pi\sqrt{LC})$。固定 $C=100\,nF$，示意 $L=1/5/8/10\,nH$ 时，$f_0$ 分别约为 **15.92/7.12/5.63/5.03
    MHz**。8–10nH 不能沿用 5nH 的 7.1MHz 结果。这里 L 表示整条支路的串联电感，包含安装路径；不能仅按距离或封装断言具体值。


    0402 电容自身 ESL 可在 0.5nH 量级，安装路径还会增加寄生；3mm 与 20mm 只是布局比较的尺度，不是通用保证。高于自谐振时支路呈感性，但阻抗仍可能低于供电路径；是否有效要比较目标阻抗、ESR、其他电容与平面的共同响应。'
  caption: 相同电容、不同串联电感：频率按平方根变化。所有长度和频率都是图示模型量，不作为器件或布局保证。
  relationship: replaces-text
  removed_prose_chars: 505
- id: ch15-via-parallel
  source: docs/p3-02-ch15.md#15.3
  before: '**算一笔：过孔电感**。经验公式（教材推导，近似式）：


    $$L_{\text{via}}\approx 5.08\,h\left[\ln\!\left(\frac{4h}{d}\right)+1\right]\ \mathrm{nH}$$


    其中 $h$ 为过孔长度（近似板厚）、$d$ 为钻孔直径，**单位都用英寸**（此式出自 Howard Johnson《High-Speed Digital Design》，是厘米级经验拟合式）。取 1.6 mm 板厚（0.063
    in）、0.3 mm 钻孔（0.012 in）：$L_{\text{via}}\approx5.08\times0.063\times[\ln(21)+1]\approx1.3\ \mathrm{nH}$。这个数字不用记精确值，记住量级：**一个过孔
    ≈ 1 nH ≈ 一条 3 mm 走线**。所以电源和地的过孔"能并则并"：4 只并联把电感降到约 0.25 nH，而高速信号路径上每多一个过孔就多一分反射和延迟。换层的差分对，过孔要成对打、就近放地过孔陪跑，给回流留一条同样短的路。'
  after: '**过孔电感要带几何和回流条件。** 常用近似式为


    $$L_{via}\approx5.08h[\ln(4h/d)+1]\;nH$$


    式中 $h,d$ 均用英寸。$h=1.6mm,d=0.3mm$ 换算后得到约 **1.299nH**，即常说的 1.3nH 量级。该局部经验值不是包含完整回流路径的宽带电磁模型。


    若 N 个相同支路均匀分流、每对互感相同，则 $L_{eq}=[L+(N-1)M]/N$。四孔且忽略互感时约 **0.325nH**；示意 $M=L/2$ 时约 **0.812nH**。所以不能把“四个并联必得 0.25nH”当成保证。孔铜厚度、温升和分流决定载流能力，3A
    换层也不能只凭孔数验收。'
  caption: 并联收益受互感与回流几何限制。四支路仅示意均匀分流，不代表实际孔阵列的提取结果。
  relationship: replaces-text
  removed_prose_chars: 162
- id: ch15-line-flight-v2
  source: docs/p3-02-ch15.md#15.3
  before: '**传输线思维什么时候启用**。走线要不要当传输线，看**走线长度与信号边沿的飞行时间**之比。


    FR4 中信号传播约 15 cm/ns（$\varepsilon_r\approx4.2$ 的微带外层约 17 cm/ns，带状内层约 15 cm/ns）。边沿时间 $t_r$ 内信号能走 $l_{\text{crit}}\approx
    t_r\times15\ \mathrm{cm/ns}$。


    经验判据：走线长 $>l_{\text{crit}}/6$ 时，反射、振铃开始不可忽略，必须考虑端接或控制阻抗；$<l_{\text{crit}}/6$ 时可按集总电路处理。


    举两个例子。1 ns 边沿（现代 MCU 的 GPIO 轻松达到）对应 $l_{\text{crit}}=15\ \mathrm{cm}$，临界长度 2.5 cm——**一块普通开发板上的一半走线都该用传输线思维想一遍**。20
    ns 边沿（老式 74HC、慢速模拟开关）临界长度 50 cm，整个板子随便走。


    这就是"我没用高速芯片为什么也有信号完整性问题"的答案：边沿速度由芯片工艺决定，不由你的时钟频率决定。10 MHz 的时钟照样有 1 ns 的边沿。'
  after: '**传输线筛查先看边沿。** 示意 FR4 传播速度约 15cm/ns；外层微带也常见约 17cm/ns，均应按实际叠层计算。定义 $l_{crit}=v t_r$，当飞行时间 $l/v$ 接近或超过 $t_r/6$，开始用传输线模型检查反射和端接。图中
    1ns 与 20ns 边沿对应筛查长度 2.5cm 与 50cm。这是经验筛查，不是其下所有走线都可任意布置；10MHz 时钟同样可能有 1ns 边沿。'
  caption: 同样的飞行时间比例，对快边沿意味着更短的走线；端接需求还取决于允许误差和源负载阻抗。
  relationship: replaces-text
  removed_prose_chars: 292
- id: ch15-filter-modes-v2
  source: docs/p3-02-ch15.md#15.6
  before: '**共模与差模：滤波器选型先分敌我**。传导超标先判断噪声模态：差模噪声在两条线间环流（$I$ 出 $I$ 回），共模噪声两条线同向、经寄生电容入地再回来。


    判别方法：电流探头同时夹两根线，测到的是共模分量；单夹一根减去另一根，是差模。


    对策完全不同。差模靠 LC 低通（X 电容 + 差模电感，X 电容跨线接）；共模靠共模扼流圈 + Y 电容（Y 电容接保护地，容量受漏电流限制，Ⅱ 类设备通常 ≤4.7 nF）。


    把差模噪声当共模治（只加扼流圈）几乎无效：扼流圈对差模电流的磁通相互抵消，电感量趋近于零。这是整改现场最常见的白花钱。'
  after: '**共模与差模先统一参考方向。** 两线电流 $I_1,I_2$ 的正方向都定义为源到负载，则 $I_{cm}=(I_1+I_2)/2$、$I_{dm}=(I_1-I_2)/2$。两线同向穿过同一电流钳，测得代数和
    $2I_{cm}$，差模理想抵消。分别测量时需保留相位与时间关系，不能把两次幅值读数直接相减。


    差模噪声在线对内闭合，常用跨线电容与串联阻抗处理；共模同向流动，经机壳或寄生电容返回，常用共模扼流圈并设计受控回流路径。实际扼流圈的漏感也可影响差模，不能说差模电感恒为零。市电侧 X/Y 电容、绝缘与漏电流须按适用安规和设备类别核对，Ⅱ类设备不因此自动允许某个固定
    Y 电容值。'
  caption: 电流钳测的是穿过窗口的代数和。箭头先确定模态，再核对滤波器的阻抗和回流路径。
  relationship: replaces-text
  removed_prose_chars: -36
- id: ch15-impedance-geometry-v2
  source: docs/p3-02-ch15.md#15.3
  before: '**阻抗控制的算例**。50 Ω 微带线近似式（IPC-2141，误差 <10%，$0.1<w/h<3$）：


    $$Z_0\approx\frac{87}{\sqrt{\varepsilon_r+1.41}}\ln\!\left(\frac{5.98\,h}{0.8\,w+t}\right)\ \Omega$$


    其中 $h$ 介质厚度、$w$ 线宽、$t$ 铜厚（同单位），FR4 取 $\varepsilon_r\approx4.2$。双层 1.6 mm 板上要凑 50 Ω，代入 $h=1.6\ \mathrm{mm}$、$t=0.035\
    \mathrm{mm}$，解得 $w\approx3\ \mathrm{mm}$——线宽比信号还粗，根本走不开。**这就是双层板不做阻抗控制的原因**：不是不讲究，是几何上做不到。要 50 Ω/90 Ω，上四层板：信号层到地平面介质约
    0.2 mm，50 Ω 只需 $w\approx0.35\ \mathrm{mm}$，正常线宽即可。USB 差分 90 Ω 在双层板上的妥协做法：按板厂给的双层板叠层参数算一次（线宽约 0.8 mm、间距 0.3 mm，典型值），并尽量短（<30
    mm 时阻抗失配的影响被边沿时间掩盖）；USB 全速 12 Mbps 边沿约 20 ns，对应临界长度 $\lambda_{\text{eff}}/6\approx0.5\ \mathrm{m}$，短走线确实可以"不守规矩"——但前提是知道自己在不守哪条规矩。


    同样要凑 50 Ω，为什么双层板上从来没人提阻抗控制、四层板却是标配？把微带近似式按两种叠层各解一次，差别不在工艺，在几何：




    读图指引：左图把双层板剖开看——信号线坐在 1.6 mm 厚的 FR4（εr≈4.2）上，h 大则 w 必须跟着大才能凑出同一个 50 Ω，解出来 w≈3 mm 直接判死刑；右图同一式子换「信号—地—电源—信号」叠层，h
    收到 0.2 mm，w 跟着收到 0.35 mm。下方判据卡管另一件事——要不要管阻抗看边沿、不看时钟频率：FR4 传播约 15 cm/ns，1 ns 边沿的临界长度只有 2.5 cm，一块普通开发板上一半走线都够格；20
    ns 边沿放宽到 50 cm，整块板随便走。先算边沿，再定规矩。'
  after: '**阻抗控制先拿到叠层。** 以下微带近似式用于初估，不给固定误差保证：


    $$Z_0\approx\frac{87}{\sqrt{\varepsilon_r+1.41}}\ln\!\left(\frac{5.98h}{0.8w+t}\right)\;\Omega$$


    $h,w,t$ 使用相同单位。取 $\varepsilon_r=4.2,t=0.035mm$、目标 50Ω，$h=1.6mm$ 得 $w\approx3.022mm$，$h=0.2mm$ 得 $w\approx0.339mm$。双层板也能控制阻抗，只是厚介质需要较宽走线；较薄板、共面结构或不同叠层可改变尺寸，须另求解。USB
    差分 90Ω 还取决于线间距、耦合和参考面，不能从这条单端公式直接推出，也不能把“短于 30mm”作为自动合规条件。'
  caption: 几何决定所需线宽，不决定某种层数能否做阻抗控制。投产按实际板材、阻焊和制造公差求解并验收。
  relationship: replaces-text
  removed_prose_chars: 540
- id: ch15-input-filter-v2
  source: docs/p3-02-ch15.md#15.6
  before: '**π 型滤波的设计算例**。Buck 输入侧差模噪声回灌电源线，开关频率 500 kHz。目标：500 kHz 处衰减 ≥40 dB。


    π 型 C-L-C 两级，每级在转折频率以上 20 dB/十倍频，取转折频率 $f_c=50\ \mathrm{kHz}$（开关频率的 1/10），两级共 40 dB。由 $f_c=1/(2\pi\sqrt{LC})$，选
    $C=10\ \mathrm{µF}$，解得 $L=1/((2\pi f_c)^2 C)\approx1/((3.14\times10^5)^2\times10^{-5})\approx1\ \mathrm{µH}$。


    两个细节：


    1. **电感选磁珠还是绕线电感？** 磁珠在目标频段表现为电阻性（耗散噪声而非反射），30 MHz 以上是首选。500 kHz–5 MHz 段绕线电感或专用差模电感更实在，注意额定电流留 50% 余量——铁氧体饱和后电感量骤降、滤波器当场失效。

    2. **后级电容的 ESR 与前级 Buck 的稳定性有关**。钽/聚合物电容的 ESR 还能提供阻尼，全陶瓷方案可能在 LC 谐振点放大噪声，仿真或实测输入阻抗峰再定案。'
  after: '**π 型输入滤波先定目标，再验证。** 示例 Buck 开关频率 500kHz，目标在该频点衰减 ≥40dB；候选 C-L-C 取两端电容各 10µF、电感 1µH。理想低源阻时，L 与负载侧电容的 $f_0=1/(2\pi\sqrt{LC})\approx50.33kHz$；若按
    50kHz 反求，L 约 1.01µH。


    这不是“两级各降 20dB/dec，所以必得 40dB”的保证。插入损耗取决于源与负载阻抗、ESR/ESL、有效容值及电感偏置；谐振可能产生增益峰。闭环 Buck 在调节带宽内可呈负增量输入阻抗，应核对滤波器输出阻抗、转换器输入阻抗与阻尼，必要时加阻尼支路并做启动、扫频及负载跃变测试。


    500kHz–5MHz 候选绕线电感，30MHz 以上也可评估磁珠，但以带 DC 偏置的阻抗曲线为准；额定电流留 50% 只是项目余量例，仍要核温升与饱和。'
  caption: C-L-C 的谐振频率只是一项初估；带实际端接检查衰减、峰化与转换器交互，才能判断设计是否达标。
  relationship: replaces-text
  removed_prose_chars: 103
- id: ch15-esd-path-v2
  source: docs/p3-02-ch15.md#15.6
  before: '8 kV 静电、电缆共模、Buck 回灌的差模噪声，全都从同一个接口进板——三道防线按什么顺序排、各自贴在什么位置？把本节的三笔定量账串成一条链：




    读图指引：沿箭头把放电与噪声的入场路线走一遍。


    **第一关 TVS** 的核心数字是距离：8 cm≈50 nH 对 5 mm 内的 3~5 nH，每多 1 nH 钳位电压多 30 V。所以"贴接口、地焊盘直接下机壳"是铁律。


    **第二关扼流圈**管电缆共模。记住 1 m 电缆在 30~300 MHz 是高效天线，100 MHz 附近阻抗要 ≥100 Ω，Y 电容只接机壳/屏蔽地、不接电路 0 V。


    **第三关 π 型滤波**管 Buck 回灌的差模。两级各 20 dB/十倍频、合 40 dB，电感额定电流留 50% 余量防饱和。


    三关全都放在最外侧。90% 的辐射问题在布局阶段免费解决，剩下的才轮到花钱买滤波器。


    > **精髓**：EMC 不是"加器件"的玄学，是**管住环路面积与回流路径**的工程。90% 的辐射问题在改 layout 时就消失了，剩下 10% 才是滤波器的活。'
  after: '**接口防护分别核对三条路径。** 放电路径先减少连接寄生，数字接口共模滤波需核信号完整性，Buck 电源差模滤波则按源负载和阻尼验证；不能把同一条 TVS—扼流圈—π 型滤波链套在所有接口。


    图中保持 $di/dt=30A/ns$，只比较串联电感压降；它不等于芯片引脚实际残压。TVS 动态钳位、分流与回路耦合仍需按器件和板级测试核对。'
  caption: 同一电流变化率下，缩小串联电感可降低附加压降。每条柱从零起，长度与电感成比例。
  relationship: replaces-text
  removed_prose_chars: 252
- id: ch15-return-area-v2
  source: docs/p3-02-ch15.md#15.7
  before: '**再算一笔：面积怎么换算成电感**。回路电感与面积直接相关：平面上方高度 $h$、长度 $l$ 的走线回路电感近似 $L\approx\mu_0\,h\,l/w_{\text{eff}}$（$w_{\text{eff}}$
    为回流展宽的等效宽度）。面积放大 30 倍，回路电感大致同比例放大——原来约 15 nH 的回路变成数百 nH。这意味着开槽不只是 EMC 问题：信号质量同步恶化，边沿变缓、过冲加大、地参考晃动加剧。所以"回流审查"一条同时管三件事：辐射、信号完整性、地弹。一刀三效，这就是它在所有
    PCB 检查清单里排第一的原因。


    把拍②和拍④画到同一张对照图上，数字就不只是倍数关系，而是一眼可见的几何差异：




