  <text class="small" x="404.2" y="452.0" text-anchor="middle">0.5</text>
  <line class="grid" x1="641.1" y1="430.0" x2="641.1" y2="436.0"/>
  <text class="small" x="641.1" y="452.0" text-anchor="middle">0.9</text>
  <line class="grid" x1="694.5" y1="430.0" x2="694.5" y2="436.0"/>
  <text class="small" x="694.5" y="452.0" text-anchor="middle">0.99</text>
  <line class="grid" x1="102.0" y1="428.2" x2="108.0" y2="428.2"/>
  <text class="small" x="98.0" y="432.2" text-anchor="end">1</text>
  <line class="grid" x1="102.0" y1="411.6" x2="108.0" y2="411.6"/>
  <text class="small" x="98.0" y="415.6" text-anchor="end">10</text>
