  <text class="txt" x="40" y="132" opacity="0.28">③ 黄点沿蓝线走<tspan class="small">　底栏读这一时刻的真值和误差。下面红线是全程误差。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
