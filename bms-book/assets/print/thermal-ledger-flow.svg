<svg data-sketch="1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="一阶热账三笔逐项结算：欧姆热恒为 4.90 瓦，熵热随方向取负 1.2 或正 1.2 瓦，散热按温差带走热量，净热流决定升温或降温" data-snapshot-time="0">
  <title>热账三笔：先结功率，再看温度</title>
  <desc>第一笔欧姆热：十安电流下恒为四点九瓦，与方向无关。第二笔可逆熵热：充电约为负一点二瓦吸热，放电约为正一点二瓦补火。第三笔散热支出：温差除以热阻，把热量送往二十五摄氏度环境。三笔相加的净功率决定储热节点升温还是降温；稳态时进账等于支出。</desc>
  <style>
    .bg { fill: #fffdf5; }
    .panel { fill: #f7f2e5; stroke: #cfc6b2; stroke-width: 1.5; }
    .store { fill: #e4f0df; stroke: #176b73; stroke-width: 2.5; }
    .out { fill: #fbefc7; stroke: #926717; stroke-width: 2; }
    .title { font-size: 18px; font-weight: 700; font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #293b3a; }
    .head { font: 700 15px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #293b3a; }
    .txt { font: 13px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #293b3a; }
    .small { font: 12px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #626d65; }
    .metric { font: 700 20px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #176b73; }
    .warn { fill: #b84745; }
    .gold { fill: #926717; }
    .blue-line { fill: none; stroke: #176b73; stroke-width: 3; marker-end: url(#arrow-blue); }
    .gold-line { fill: none; stroke: #926717; stroke-width: 3; marker-end: url(#arrow-gold); }
    .flow-dot { fill: #926717; }
    .sketch { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #192727; }
      .panel { fill: #223333; stroke: #496160; }
      .store { fill: #293f35; stroke: #7ec5c5; }
      .out { fill: #3c3525; stroke: #dfbd78; }
      .title, .head, .txt { fill: #edf0e5; }
      .small { fill: #b0beb3; }
      .metric { fill: #7ec5c5; }
      .warn { fill: #f39b91; }
      .gold { fill: #dfbd78; }
      .blue-line { stroke: #7ec5c5; }
      .gold-line { stroke: #dfbd78; }
      .flow-dot { fill: #dfbd78; }
    }
  </style>
  <style id="bms-motion">
    /* bms-motion: 三笔热逐项结算的叠加装饰（手帐标记 + 净流游点），不改几何与数字 */
    .bms-marker { fill: #fbefc7; opacity: .78; }
    .bms-under { fill: none; stroke: #926717; stroke-width: 2.4; stroke-linecap: round; opacity: .9; }
    .bms-spark-fill { fill: #926717; }
    .bms-sticker { fill: none; stroke: #926717; stroke-width: 2; stroke-dasharray: 7 5; stroke-linecap: round; opacity: .85; }
    .bms-halo { fill: none; stroke: #176b73; stroke-width: 3; }
    .bms-row { fill: #fbefc7; opacity: 0; }
    @media (prefers-color-scheme: dark) {
      .bms-marker { fill: #453e2b; }
      .bms-under { stroke: #dfbd78; }
      .bms-spark-fill { fill: #dfbd78; }
      .bms-sticker { stroke: #dfbd78; }
      .bms-halo { stroke: #7ec5c5; }
      .bms-row { fill: #453e2b; }
      circle:has(&gt; animateMotion) { filter: drop-shadow(0 0 2px rgba(223,189,120,.8)) drop-shadow(0 0 7px rgba(223,189,120,.9)); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bms-doodle { display: none; }
      .bms-row, .bms-halo { display: none; }
    }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L0.04 3L0 6L4.56 4.69L9 3Z" fill="#176b73"/></marker>
    <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L-0.29 3L0 6L4.4 4.19L9 3Z" fill="#926717"/></marker>
  </defs>
  <path d="M-0.89 0Q0 0 0 0L400 -0.5L800 0Q800 0 800 0L799.32 250L800 500Q800 500 800 500L400 499.68L0 500Q0 500 0 500L0 -0.53" class="bg"/>
  <path d="M23.18 20.1Q24 16.3 27.8 16.3L202 15.98L376.2 16.3Q380 16.3 380 20.1L379.6 26L380 31.9Q380 35.7 376.2 35.7L202 35.73L27.8 35.7Q24 35.7 24 31.9L24 19.61" class="bms-marker" aria-hidden="true" transform="rotate(-.6 24 26)"/>
  <path d="M28 40C120.18 33.6 209.64 45.35 300 37" class="sketch" stroke="#176b73" stroke-width="3" opacity=".8"/>
  <text class="title" x="24" y="33">温度变化只看净热流：进来多少，出去多少</text>
  <text class="small" x="24" y="58">合成参数：|I| = 10 A，R_heat = 49 mΩ，∂U/∂T = −0.4 mV/K，T_amb = 25 °C</text>

  <g class="bms-doodle" aria-hidden="true" transform="matrix(0.9945218953682733 -0.10452846326765347 0.10452846326765347 0.9945218953682733 560 28)" opacity="0.62" style="opacity: 0.62;"><path d="M0 -8L1.55 -5.23L2.1 -2.1L5.03 -1.01L8 0L4.89 0.6L2.1 2.1L0.32 4.79L0 8L-0.62 4.9L-2.1 2.1L-5.05 1.05L-8 0L-4.85 -0.49L-2.1 -2.1Z" class="bms-spark-fill"/></g>

  <path d="M29.24 116Q30 98 48 98L140 98.14L232 98Q250 98 250 116L249.7 162L250 208Q250 226 232 226L140 225.6L48 226Q30 226 30 208L30 115.54" class="bms-row" aria-hidden="true" opacity="0" style="opacity: 0;"/>
  <path d="M29.15 116Q30 98 48 98L140 97.92L232 98Q250 98 250 116L249.61 163L250 210Q250 228 232 228L140 228.48L48 228Q30 228 30 210L30 115.49" class="panel"/>
  <text class="head" x="46" y="128">① 欧姆热：只进账</text>
  <text class="metric" x="46" y="170">I²R = 4.90 W</text>
  <text class="small" x="46" y="200">+10 A 与 −10 A 完全相同</text>

  <path d="M29.23 276Q30 258 48 258L140 257.77L232 258Q250 258 250 276L249.06 333L250 390Q250 408 232 408L140 408.91L48 408Q30 408 30 390L30 275.54" class="panel"/>
  <path d="M29.41 276Q30 258 48 258L140 258.92L232 258Q250 258 250 276L249.78 333L250 390Q250 408 232 408L140 407.28L48 408Q30 408 30 390L30 275.65" class="bms-row" aria-hidden="true" opacity="0" style="opacity: 0;"/>
  <text class="head" x="46" y="289">② 可逆熵热：可正可负</text>
  <text class="txt warn" x="46" y="326">充电 +10 A　≈ −1.2 W</text>
  <text class="txt" x="46" y="356">放电 −10 A　≈ +1.2 W</text>
  <text class="small" x="46" y="386">符号由 I 与熵斜率共同决定</text>

  <path d="M250 162C295.76 162.2 306.74 196.24 348 210" class="blue-line"/>
  <path d="M250 332C296.73 332.23 305.63 294.21 348 274" class="blue-line"/>
  <circle class="flow-dot" r="4.5" aria-hidden="true" transform="matrix(1 0 0 1 0 0)" opacity="0" style="opacity: 0;"/>
  <circle class="flow-dot" r="4.5" aria-hidden="true" transform="matrix(1 0 0 1 0 0)" opacity="0" style="opacity: 0;"/>

  <path d="M341.45 190Q342 162 370 162L466 161.3L562 162Q590 162 590 190L589.62 252L590 314Q590 342 562 342L466 342.82L370 342Q342 342 342 314L342 189.67" class="bms-halo" aria-hidden="true" opacity="0" style="opacity: 0;"/>
  <path d="M345.36 194Q346 166 374 166L466 166.68L558 166Q586 166 586 194L585.47 252L586 310Q586 338 558 338L466 338.81L374 338Q346 338 346 310L346 193.61" class="store"/>
  <text class="head" x="466" y="203" text-anchor="middle">结算结果：储热变化</text>
  <text class="metric" x="466" y="248" text-anchor="middle">Cₜₕ · dT/dt</text>
  <path d="M390 266L440.67 266.39L491.33 266.53L542 266" stroke="#cfc6b2"/>
  <text class="txt" x="466" y="294" text-anchor="middle">净功率 &gt; 0：升温</text>
  <text class="small" x="466" y="317" text-anchor="middle">净功率 &lt; 0：降温</text>

  <path d="M586 250C591.67 249.77 594.54 250.68 598 250" class="gold-line"/>
  <circle class="flow-dot" r="4.5" aria-hidden="true" transform="matrix(1 0 0 1 0 0)" opacity="0" style="opacity: 0;"/>
  <path d="M599.34 192Q600 170 622 170L688 169.62L754 170Q776 170 776 192L776.58 250L776 308Q776 330 754 330L688 330.83L622 330Q600 330 600 308L600 191.6" class="out"/>
  <text class="head" x="688" y="206" text-anchor="middle">③ 散热支出</text>
  <text class="txt gold" x="688" y="244" text-anchor="middle">(T − Tₐₘᵦ) / Rₜₕ</text>
  <text class="small" x="688" y="276" text-anchor="middle">温差越大</text>
  <text class="small" x="688" y="298" text-anchor="middle">带走的热越多</text>

  <path d="M299.2 400Q300 384 316 384L460 383.89L604 384Q620 384 620 400L620.78 417L620 434Q620 450 604 450L460 450.16L316 450Q300 450 300 434L300 399.52" class="panel"/>
  <path d="M293.38 397Q294 378 313 378L460 379L607 378Q626 378 626 397L626.27 417L626 437Q626 456 607 456L460 456.17L313 456Q294 456 294 437L294 396.63" class="bms-sticker" aria-hidden="true" opacity="0" style="opacity: 0;"/>
  <text class="txt" x="460" y="412" text-anchor="middle">稳态时：进账 = 支出，dT/dt = 0</text>
  <text class="small" x="460" y="436" text-anchor="middle">Cₜₕ 决定快慢，不决定最终温升</text>
<path d="M-0.89 0Q0 0 0 0L400 -0.18L800 0Q800 0 800 0L799.75 250L800 500Q800 500 800 500L400 499.02L0 500Q0 500 0 500L0 -0.53" fill="none" stroke="currentColor" opacity="0.3" stroke-width="1.4"/></svg>
