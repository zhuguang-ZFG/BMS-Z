name: book

# 两卷成书流水线（设计 §7.4）：站点 + 四类介质 + 总审计，产物进 artifact。
# 卷 I 印刷分册与印前测试仍由 book-print.yml 承担；Pages 由 deploy-pages.yml 承担（P5 统一）。
on:
  push:
    branches-ignore: [main]
    paths:
      - "analog/**"
      - "bms-book/**"
      - "book/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/book.yml"
  pull_request:
    paths:
      - "analog/**"
      - "bms-book/**"
      - "book/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/book.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# 与 tests/links 共用排队组：runner 紧张时按序排队，不做并发取消。
concurrency:
  group: bms-z-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  book:
    runs-on: ubuntu-24.04
    # 两卷全链路：VitePress 站点、卷 I MkDocs 站点 + A4/16K/EPUB、卷 II HTML/A4/16K/EPUB。
    # 共享 runner 上 60–90 分钟属正常波动，上限留到 150 分钟，不改变任何产物契约。
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            analog/requirements.txt
            analog/analog-book/requirements.txt
            bms-book/requirements.txt
      - run: pip install -r analog/requirements.txt -r analog/analog-book/requirements.txt -r bms-book/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('analog/analog-book/requirements.txt') }}
      - run: python -m playwright install --with-deps chromium
      - name: 安装中文字体
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: 两卷站点 + 四类介质 + 总审计
        run: python book/build.py all
      - name: 卷 I PDF 结构测试
        working-directory: analog
        run: python -B -m unittest discover -s analog-book/tests -p "test_pdf.py" -v
      - name: 卷 I 浏览器离线回归（公式、计算器、目录与全文搜索）
        working-directory: analog
        run: python -B -m unittest discover -s analog-book/tests -p "test_browser_book.py" -v
      - uses: actions/upload-artifact@v7
        with:
          name: book-dist
          path: |
            book/dist/volume-1/
            book/dist/volume-2/
            book/dist/build-report.json
          retention-days: 14
