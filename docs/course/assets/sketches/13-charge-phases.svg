<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
<title id="title">充电后段，改为稳住电压</title><desc id="desc">充电器先恒流CC，此例记录的电流为负1安培；随后恒压CV。两只旋钮分别表示调节电流与电压。下方为非实测曲线：电压先升后保持，电流幅度先恒定后减小。未将保护阈值作为正常控制目标。</desc>
