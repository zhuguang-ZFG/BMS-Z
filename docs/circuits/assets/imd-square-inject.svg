<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="ui-monospace, Consolas, monospace">
  <title>低频方波注入测绝缘：翻转瞬间的电容电流不能拿来除，稳态电流变大才说明绝缘变差。数字为示意。</title>

  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #bf8700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.5; fill: none; }
    .liney { stroke: #bf8700; stroke-width: 2.5; fill: none; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .dotg { fill: #1a7f37; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    .boxr { fill: #ffebe9; stroke: #cf222e; }
    .boxg { fill: #dafbe1; stroke: #1a7f37; }
    .boxy { fill: #fff8c5; stroke: #bf8700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .dotg { fill: #3fb950; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
      .boxr { fill: #3d1214; stroke: #ff7b72; }
      .boxg { fill: #12261e; stroke: #3fb950; }
      .boxy { fill: #3d2e00; stroke: #d29922; }
    }
  </style>

  <rect class="bg" width="800" height="460"/>

  <text class="title" x="24" y="32">方波注入看绝缘：先等电容尖峰过去，再拿稳态电流算电阻（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="122" rx="6"/>
  <text class="txt" x="40" y="68" opacity="0.28">① 注入<tspan class="small">　示意 ±20 V，经 500 kΩ 已知电阻接到母线。这不是某一条标准的试验电压。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="94" opacity="0.28">② 边缘尖峰<tspan class="small">　Y 电容在翻转时吸走一截电荷，电流先冲高。这一拍不能拿来除。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="120" opacity="0.28">③ 绝缘好<tspan class="small">　示意 Riso=10 MΩ。稳态电流约 20 V / (0.5 MΩ+10 MΩ) ≈ 1.9 µA。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="146" opacity="0.28">④ 绝缘差<tspan class="small">　示意 Riso=100 kΩ。稳态电流约 20 V / 0.6 MΩ ≈ 33 µA。电流变大，才是漏电。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="180" width="752" height="210" rx="6"/>
  <path class="lineb" d="M70 300 L200 300 L200 250 L400 250 L400 340 L600 340 L600 250 L740 250" stroke-dasharray="1200" stroke-dashoffset="1200">
    <animate attributeName="stroke-dashoffset" values="1200;0;0" keyTimes="0;0.8;1" dur="12s" repeatCount="indefinite"/>
  </path>
  <circle class="dotr" cx="210" cy="230" r="5">
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.2;0.35;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <text class="warn" x="220" y="226">尖峰，先别采样</text>
  <text class="ok" x="430" y="240">稳态再除</text>
  <text class="small" x="40" y="370">好绝缘大约 1.9 µA；差到 100 kΩ 大约 33 µA。两个数都是这笔示意电路算出来的。</text>
  <text class="small" x="24" y="446">±20 V 与本页文字里的「±20 V 级」同一口径。1.9 µA、33 µA 是 500 kΩ 串联后的口算，不是绝缘监测仪的读数。</text>

</svg>
