<svg data-sketch="1" xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 800 460" font-family="ui-monospace, Consolas, monospace" aria-label="负控三连：改 CSV 一个字节，哈希门拦下；只改 metadata 行数，计数门拦下；两边一起改并重算哈希，两道门都放行。门没有失职——信任根是人写的 metadata，哈希不负责选对行。数字为教学示意" data-snapshot-time="9">
  <title>负控三连：哈希门与计数门各管各的（教学示意）</title>
  <desc>三次实验：改字节哈希门拦下；改行数声明计数门拦下；两边一起改并重算哈希后两道门都放行。信任根是人写的 metadata，哈希不负责选对行。</desc>

