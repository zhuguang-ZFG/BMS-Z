 <line x1="310" y1="400.0" x2="310" y2="406.0" stroke-width="1.2"/>
 <line x1="394" y1="400.0" x2="394" y2="406.0" stroke-width="1.2"/>
 <line x1="520" y1="400.0" x2="520" y2="406.0" stroke-width="1.2"/>
</g>
<path d="M226.0,250.9 L268.0,244.2 L310.0,238.4 L352.0,232.6 L394.0,226.0" fill="none" stroke="#003153" stroke-width="3.2" stroke-linejoin="round" filter="url(#w)"/>
<path d="M100.0,400.0 L121.0,366.9 L133.6,339.5 L163.0,300.6 L205.0,267.4 L226.0,250.9 L268.0,244.2 L310.0,238.4 L352.0,232.6 L394.0,226.0 L436.0,201.1 L486.4,165.5 L507.4,143.1 L520.0,118.3" fill="none" stroke="#003153" stroke-width="2.0" stroke-linejoin="round" filter="url(#w)"/>
<line x1="295.9" y1="238.4" x2="324.1" y2="238.4" stroke="#E34234" stroke-width="3.0" stroke-linecap="round" filter="url(#w)"/>
<line x1="310.0" y1="400.0" x2="310.0" y2="238.4" stroke="#003153" stroke-width="1.0" stroke-dasharray="4 5" opacity="0.7" filter="url(#w)"/>
<circle cx="310.0" cy="238.4" r="5" fill="#003153" filter="url(#w)"/>
<g font-family="KaiTi" font-size="11" fill="#003153">
 <text x="92" y="92" text-anchor="end">V</text>
 <text x="100" y="420" text-anchor="middle">0.00</text>
 <text x="310" y="420" text-anchor="middle">0.50</text>
 <text x="520" y="420" text-anchor="middle">1.00</text>
 <text x="520" y="438" text-anchor="end">SOC</text>
 <text x="310" y="200" text-anchor="middle">平台 0.30–0.70：只动 30.0 mV</text>
 <text x="310" y="224" text-anchor="middle">6.7 个百分点</text>
</g>
<text x="60" y="500" font-family="KaiTi" font-size="13" fill="#003153">③ 正中间：s=0.50、斜率 0.75 mV/1%；5 mV 横标落下 6.7 个百分点的影子。</text>
<text x="480" y="546" font-family="KaiTi" font-size="14" fill="#003153" opacity="0.75" text-anchor="middle">原理示意 / 非实拍</text>
