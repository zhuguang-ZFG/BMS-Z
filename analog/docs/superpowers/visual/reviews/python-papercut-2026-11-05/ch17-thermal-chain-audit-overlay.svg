<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1448 1086"><text x="78" y="105" fill="#2a2927" font-size="52" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">热要走完三段路，才到空气里</text>
<text x="80" y="165" fill="#2a2927" font-size="34" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">同样耗散 3.5W，热阻链不同，结温估算相差很大。</text>
<text x="100" y="278" fill="#2a2927" font-size="41" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">TJ = TA + P × (θJC + θCS + θSA)</text>
<text x="205" y="350" fill="#2a2927" font-size="34" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#f6f2ed">结</text>
<text x="550" y="350" fill="#2a2927" font-size="34" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#f6f2ed">壳</text>
<text x="935" y="350" fill="#2a2927" font-size="34" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#f6f2ed">散热器</text>
<text x="1250" y="350" fill="#2a2927" font-size="34" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#f6f2ed">空气</text>
<line x1="280" y1="440" x2="460" y2="440" stroke="#a4441d" stroke-width="4" stroke-dasharray=""/><polygon points="460,440 447.0,433.0 447.0,447.0" fill="#a4441d"/>
<line x1="650" y1="440" x2="800" y2="440" stroke="#a4441d" stroke-width="4" stroke-dasharray=""/><polygon points="800,440 787.0,433.0 787.0,447.0" fill="#a4441d"/>
<line x1="1050" y1="440" x2="1315" y2="440" stroke="#a4441d" stroke-width="4" stroke-dasharray=""/><polygon points="1315,440 1302.0,433.0 1302.0,447.0" fill="#a4441d"/>
<text x="365" y="535" fill="#2a2927" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#f6f2ed">θJC ≈ 3°C/W</text>
<text x="725" y="535" fill="#2a2927" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#f6f2ed">θCS ≈ 1°C/W</text>
<text x="1185" y="535" fill="#2a2927" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#f6f2ed">θSA ≈ 5°C/W</text>
<text x="100" y="680" fill="#2a2927" font-size="35" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">SOT-223 · θJA ≈ 60°C/W</text>
<text x="100" y="770" fill="#a4441d" font-size="72" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">235°C</text>
<text x="100" y="830" fill="#2a2927" font-size="37" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">25 + 3.5 × 60 = 235°C</text>
<text x="790" y="680" fill="#2a2927" font-size="35" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">TO-220 + 大散热器</text>
<text x="790" y="770" fill="#2a2927" font-size="72" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">约 57°C</text>
<text x="790" y="830" fill="#2a2927" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">25 + 3.5 × (3 + 1 + 5) ≈ 57°C</text>
<text x="95" y="986" fill="#2a2927" font-size="32" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">结温目标 ≤125°C，另留 20°C 裕量；先核算实际封装与安装。</text>
<text x="80" y="1064" fill="#2a2927" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">教学算例：TA = 25°C；热阻取正文示例值，不能代替具体器件数据。</text></svg>
