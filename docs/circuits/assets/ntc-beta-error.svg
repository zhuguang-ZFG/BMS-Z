  <line class="axis" x1="92.0" y1="214.0" x2="92.0" y2="400.0"/>
  <line class="axis" x1="92.0" y1="400.0" x2="720.0" y2="400.0"/>
  <text class="small" x="712.0" y="418" text-anchor="end">真实温度 °C</text>
  <line class="grid" x1="92.0" y1="400.0" x2="92.0" y2="406.0"/>
  <text class="small" x="92.0" y="432" text-anchor="middle">−20</text>
  <line class="grid" x1="217.6" y1="400.0" x2="217.6" y2="406.0"/>
  <text class="small" x="217.6" y="432" text-anchor="middle">0</text>
  <line class="grid" x1="374.6" y1="400.0" x2="374.6" y2="406.0"/>
  <text class="small" x="374.6" y="432" text-anchor="middle">25</text>
  <line class="grid" x1="531.6" y1="400.0" x2="531.6" y2="406.0"/>
  <text class="small" x="531.6" y="432" text-anchor="middle">50</text>
  <line class="grid" x1="720.0" y1="400.0" x2="720.0" y2="406.0"/>
  <text class="small" x="720.0" y="432" text-anchor="middle">80</text>
  <line class="grid" x1="86.0" y1="378.5" x2="92.0" y2="378.5"/>
  <text class="small" x="82.0" y="382.5" text-anchor="end">−15</text>
  <line class="grid" x1="86.0" y1="271.2" x2="92.0" y2="271.2"/>
  <text class="small" x="82.0" y="275.2" text-anchor="end">0</text>
  <line class="grid" x1="86.0" y1="242.6" x2="92.0" y2="242.6"/>
  <text class="small" x="82.0" y="246.6" text-anchor="end">4</text>
