<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">症状四空格：动手之前先记满</title>
<desc id="figDesc">100Hz 纹波 400mV 的 5V 轨只有 3.1V——四个空格填满才许动烙铁</desc>
<metadata id="visual-timeline">{&quot;duration&quot;: 9.5, &quot;beats&quot;: [{&quot;name&quot;: &quot;症状&quot;, &quot;start&quot;: 0.0, &quot;end&quot;: 1.6, &quot;caption&quot;: &quot;症状卡：5V 输出只有 3.1V，纹波 400mV——先别动烙铁&quot;}, {&quot;name&quot;: &quot;空格一&quot;, &quot;start&quot;: 1.6, &quot;end&quot;: 3.1, &quot;caption&quot;: &quot;偏离多少：5V→3.1V，差 1.9V（38%）&quot;}, {&quot;name&quot;: &quot;空格二&quot;, &quot;start&quot;: 3.1, &quot;end&quot;: 4.6, &quot;caption&quot;: &quot;从何时开始：一上电就低，还是带载才低&quot;}, {&quot;name&quot;: &quot;空格三&quot;, &quot;start&quot;: 4.6, &quot;end&quot;: 6.1, &quot;caption&quot;: &quot;发生多常：偶发还是稳定复现——复现才有对照&quot;}, {&quot;name&quot;: &quot;空格四&quot;, &quot;start&quot;: 6.1, &quot;end&quot;: 7.6, &quot;caption&quot;: &quot;最后改了什么：换线/换负载/换器件，逐项改回试&quot;}, {&quot;name&quot;: &quot;四空全满&quot;, &quot;start&quot;: 7.6, &quot;end&quot;: 9.5, &quot;caption&quot;: &quot;四空填满才许动烙铁——症状先记录，动手后没法补&quot;}]}</metadata>
<!-- 节拍：症状、空格一、空格二、空格三、空格四、四空全满；总时长 9.5s；单次播放 -->

<defs>
