</style><rect class="bg" x="0" y="-156" width="800" height="796" /><text class="title" x="24" y="-128">库仑计为什么会"越算越歪"？—— 零漂与满充校准</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 库仑计为什么会"越算越歪"？—— 零漂与满充校准<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 库仑计：SOC += I·Δt/Q（约定：充电 I&gt;0，放电 I&lt;0）<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 真实电量（水位）<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect width="800" height="640" class="bg" />
  <text x="400" y="54" text-anchor="middle" font-size="13" class="small">库仑计：SOC += I·Δt/Q（约定：充电 I&gt;0，放电 I&lt;0）</text>

  
  <rect x="60" y="170" width="100" height="80" rx="10" stroke-width="2" class="panel stroke-axis" />
  <text x="110" y="215" text-anchor="middle" font-size="14" font-weight="bold" class="txt">负载</text>
  <rect x="640" y="170" width="100" height="80" rx="10" stroke-width="2" class="panel stroke-axis" />
  <text x="690" y="215" text-anchor="middle" font-size="14" font-weight="bold" class="txt">充电器</text>

  
  <rect x="330" y="90" width="140" height="240" fill="none" stroke-width="3" class="stroke-axis" />
  <rect x="333" y="90" width="134" height="234" opacity="0.85" class="fill-b">
    <animate attributeName="height" values="234;156;132;234;234" keyTimes="0;0.35;0.55;0.8;1" dur="12s" repeatCount="indefinite" />
    <animate attributeName="y" values="90;174;198;90;90" keyTimes="0;0.35;0.55;0.8;1" dur="12s" repeatCount="indefinite" />
  </rect>
  <text x="400" y="355" text-anchor="middle" font-size="13" class="txt">真实电量（水位）</text>

  
  <line x1="325" y1="174" x2="475" y2="174" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="7 5" opacity="0" class="stroke-axis">
    
    <animate attributeName="y1" values="174;174;191;97;90;90" keyTimes="0;0.35;0.55;0.8;0.85;1" dur="12s" repeatCount="indefinite" />
    <animate attributeName="y2" values="174;174;191;97;90;90" keyTimes="0;0.35;0.55;0.8;0.85;1" dur="12s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.35;0.37;1" dur="12s" repeatCount="indefinite" />
    <animate attributeName="stroke" values="#94a3b8;#ef4444;#ef4444;#10b981" keyTimes="0;0.5;0.85;1" dur="12s" repeatCount="indefinite" />
  </line>

  
  <g font-size="13" font-weight="bold">
    <text x="485" y="178" opacity="0" class="ok">显示 65% ✓一致<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.37;0.39;0.48;0.50;1" dur="12s" repeatCount="indefinite" /></text>
    <text x="485" y="195" opacity="0" class="warn">显示 58%，真实才 55%！<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.54;0.62;0.64;1" dur="12s" repeatCount="indefinite" /></text>
    <text x="485" y="101" opacity="0" class="warn">充满了，显示只有 97%<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.72;0.74;0.82;0.84;1" dur="12s" repeatCount="indefinite" /></text>
    <text x="485" y="94" opacity="0" class="ok">校准 → 100% ✓<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.87;1" dur="12s" repeatCount="indefinite" /></text>
  </g>

  
  <g>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.53;0.55;1" dur="12s" repeatCount="indefinite" />
    <circle r="6" class="fill-y"><animateMotion dur="1.2s" begin="0s" repeatCount="indefinite" path="M330,220 H160" /></circle>
    <circle r="6" class="fill-y"><animateMotion dur="1.2s" begin="-0.4s" repeatCount="indefinite" path="M330,220 H160" /></circle>
    <circle r="6" class="fill-y"><animateMotion dur="1.2s" begin="-0.8s" repeatCount="indefinite" path="M330,220 H160" /></circle>
  </g>
  
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.57;0.78;0.8;1" dur="12s" repeatCount="indefinite" />
    <circle r="6" class="fill-g"><animateMotion dur="1.2s" begin="0s" repeatCount="indefinite" path="M640,220 H470" /></circle>
    <circle r="6" class="fill-g"><animateMotion dur="1.2s" begin="-0.4s" repeatCount="indefinite" path="M640,220 H470" /></circle>
    <circle r="6" class="fill-g"><animateMotion dur="1.2s" begin="-0.8s" repeatCount="indefinite" path="M640,220 H470" /></circle>
  </g>

  
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.40;0.43;0.55;0.58;1" dur="12s" repeatCount="indefinite" />
    <text x="180" y="300" font-size="13" class="warn">👿 电流零漂 +0.1%/h，悄悄累积…</text>
  </g>

  
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.88;1" dur="12s" repeatCount="indefinite" />
    <rect x="310" y="60" width="180" height="26" rx="6" class="fill-boxg stroke-g" />
    <text x="400" y="78" text-anchor="middle" font-size="13" font-weight="bold" class="ok">满充校准：SOC 复位 100%</text>
  </g>

  
  <g font-size="14" text-anchor="middle">
    <text x="400" y="398" opacity="0" class="txt">放电：库仑计按电流积分扣减电量<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.33;0.36;1" dur="12s" repeatCount="indefinite" /></text>
    <text x="400" y="398" opacity="0" class="warn">问题：积分把零漂也一起积了进去，显示值越漂越远<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.38;0.41;0.53;0.56;1" dur="12s" repeatCount="indefinite" /></text>
    <text x="400" y="398" opacity="0" class="txt">充电到满：CV 段电流衰减到截止值 = 天然校准点<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.58;0.61;0.78;0.81;1" dur="12s" repeatCount="indefinite" /></text>
    <text x="400" y="398" opacity="0" class="ok">满充校准：显示值复位 100%，漂移清零 —— 这就是为什么纯安时积分必须配校准点<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.84;0.87;1" dur="12s" repeatCount="indefinite" /></text>
  </g>
<rect x="24" y="438.0" width="752" height="188" rx="6" class="panel" /><text x="40" y="458.0" font-size="13" class="txt">底栏：卡通上的 +0.10 %/h。24 h 累计 2.4 个百分点</text><text x="40" y="474.0" font-size="12" class="small">SOC 偏差 %</text><line x1="70.0" y1="474.0" x2="70.0" y2="588.0" stroke-width="1.5" class="stroke-axis" /><line x1="70.0" y1="588.0" x2="460.0" y2="588.0" stroke-width="1.5" class="stroke-axis" /><line x1="70.0" y1="588.0" x2="70.0" y2="593.0" class="stroke-axis" /><text x="70.0" y="606.0" text-anchor="middle" font-size="12" class="small">0</text><line x1="232.5" y1="588.0" x2="232.5" y2="593.0" class="stroke-axis" /><text x="232.5" y="606.0" text-anchor="middle" font-size="12" class="small">10</text><line x1="460.0" y1="588.0" x2="460.0" y2="593.0" class="stroke-axis" /><text x="460.0" y="606.0" text-anchor="middle" font-size="12" class="small">24</text><line x1="65.0" y1="547.3" x2="70.0" y2="547.3" class="stroke-axis" /><text x="62.0" y="551.3" text-anchor="end" font-size="12" class="small">1.0</text><line x1="65.0" y1="490.3" x2="70.0" y2="490.3" class="stroke-axis" /><text x="62.0" y="494.3" text-anchor="end" font-size="12" class="small">2.4</text><polyline points="70.0,588.0 86.2,583.9 102.5,579.9 118.8,575.8 135.0,571.7 151.2,567.6 167.5,563.6 183.8,559.5 200.0,555.4 216.2,551.4 232.5,547.3 248.8,543.2 265.0,539.1 281.2,535.1 297.5,531.0 313.8,526.9 330.0,522.9 346.2,518.8 362.5,514.7 378.8,510.6 395.0,506.6 411.2,502.5 427.5,498.4 443.8,494.4 460.0,490.3" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" class="stroke-r" /><circle r="5" class="fill-y"><animate attributeName="cx" values="70.0;118.8;167.5;216.2;265.0;313.8;362.5;411.2;460.0" keyTimes="0.0000;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1.0000" dur="8s" repeatCount="indefinite" /><animate attributeName="cy" values="588.0;575.8;563.6;551.4;539.1;526.9;514.7;502.5;490.3" keyTimes="0.0000;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1.0000" dur="8s" repeatCount="indefinite" /></circle><text x="479.4" y="606.0" text-anchor="start" font-size="12" class="small">小时</text><text x="480" y="516.0" font-size="12" class="txt">过原点的直线。10 h 正好偏 1.0%。</text>
