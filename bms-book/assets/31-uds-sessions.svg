<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="诊断会话状态机：默认、扩展、编程三态，security gate 把守编程会话">
  <rect x="0" y="0" width="960" height="360" fill="#fffdf5"/>
  <text x="24" y="32" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#293b3a">诊断会话状态机</text>
  <text x="24" y="54" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" fill="#626d65">0x10 负责切换；编程会话由 security gate 把守，任何切换都清零安全状态。</text>

  <!-- default session -->
  <rect x="60" y="140" width="190" height="72" rx="8" fill="#e4f0df" stroke="#377b60" stroke-width="2"/>
  <text x="155" y="170" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#36775e">默认会话</text>
  <text x="155" y="192" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#626d65">0x01 · 只读常态</text>

  <!-- extended session -->
  <rect x="385" y="140" width="190" height="72" rx="8" fill="#e4f0df" stroke="#377b60" stroke-width="2"/>
  <text x="480" y="170" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#36775e">扩展会话</text>
  <text x="480" y="192" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#626d65">0x03 · 诊断动作</text>

  <!-- programming session -->
  <rect x="710" y="140" width="190" height="72" rx="8" fill="#f6e2df" stroke="#7c648e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="805" y="170" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#736085">编程会话</text>
  <text x="805" y="192" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5f6a63">0x02 · 刷写专用</text>

  <!-- default <-> extended -->
  <line x1="250" y1="160" x2="377" y2="160" stroke="#377b60" stroke-width="2"/>
  <polygon points="385,160 373,154 373,166" fill="#377b60"/>
  <text x="317" y="148" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#377b60">0x10 0x03</text>
  <line x1="385" y1="196" x2="258" y2="196" stroke="#377b60" stroke-width="2"/>
  <polygon points="250,196 262,190 262,202" fill="#377b60"/>
  <text x="317" y="218" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#626d65">0x10 0x01 · 超时</text>

  <!-- security gate -->
  <rect x="612" y="144" width="62" height="64" rx="6" fill="#fbefc7" stroke="#926717" stroke-width="2"/>
  <text x="643" y="172" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#8e6518">安全门</text>
  <text x="643" y="192" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="11" fill="#8e6518">等级 2</text>
  <text x="643" y="132" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#7c648e">0x10 0x02 + 0x27 解锁</text>

  <!-- extended -> gate -> programming -->
  <line x1="575" y1="168" x2="606" y2="168" stroke="#7c648e" stroke-width="2"/>
  <polygon points="612,168 602,162 602,174" fill="#7c648e"/>
  <line x1="674" y1="168" x2="702" y2="168" stroke="#7c648e" stroke-width="2"/>
  <polygon points="710,168 700,162 700,174" fill="#7c648e"/>

  <!-- rejected: locked -->
  <line x1="643" y1="208" x2="643" y2="240" stroke="#b84745" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="643,248 637,236 649,236" fill="#b84745"/>
  <text x="657" y="236" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#b84745">未解锁 → 7F 10 33</text>

  <!-- programming -> default -->
  <path d="M805 212 L805 300 L155 300 L155 220" fill="none" stroke="#626d65" stroke-width="2"/>
  <polygon points="155,212 149,224 161,224" fill="#626d65"/>
  <text x="480" y="316" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#626d65">刷写完成 / 复位 → 回到默认会话</text>

  <text x="24" y="344" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" fill="#626d65">任何 0x10 切换都会清零安全状态；编程会话里要重新 0x27 解锁，才能 0x34 请求下载。</text>
</svg>
