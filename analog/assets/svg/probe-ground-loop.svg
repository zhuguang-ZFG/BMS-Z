<text x="270" y="188" text-anchor="middle" font-size="10.5" fill="#a4630f">磁通</text>
<path d="M70,282 L76,284 L82,286 L88,287 L94,289 L100,291 L106,292 L112,293 L118,294 L124,295 L130,296 L136,296 L142,296 L149,296 L155,296 L161,295 L167,294 L173,293 L179,292 L185,291 L191,289 L197,287 L203,286 L209,284 L215,282 L221,280 L227,278 L233,277 L239,275 L245,273 L251,272 L257,271 L263,270 L269,269 L275,268 L281,268 L288,268 L294,268 L300,268 L306,269 L312,270 L318,271 L324,272 L330,273 L336,275 L342,277 L348,278 L354,280 L360,282" fill="none" stroke="#a8321f" stroke-width="2.5"/>
<text x="214" y="316" text-anchor="middle" font-size="11" fill="#a8321f">量到 ~200 mV 假纹波</text>
<rect x="408" y="76" width="356" height="248" rx="10" fill="#e8efe6" stroke="#3d6b4a" stroke-width="1.6"/>
<text x="586" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#3d6b4a">② 弹簧地针：环路小</text>
<path d="M432 220 Q586.00 219.48 740 220" fill="none" stroke="#37424e" stroke-width="3"/>
