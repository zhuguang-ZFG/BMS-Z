<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="ui-monospace, Consolas, monospace">
  <title>电流零偏慢慢积分；分流器温漂在大电流发热那一小时里把 SOC 拧弯。5 Ah、数字均为示意。</title>

  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #bf8700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.5; fill: none; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .dotg { fill: #1a7f37; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    .boxr { fill: #ffebe9; stroke: #cf222e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .dotg { fill: #3fb950; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
      .boxr { fill: #3d1214; stroke: #ff7b72; }
    }
  </style>

  <!-- formula: Ah_off=0.001*t; hot hour Ah_tc=0.09*(t-24)^2; SOC%=Ah/5*100 -->
  <rect class="bg" width="800" height="500"/>
  <text class="title" x="24" y="32">零偏是斜线，温漂是那一弯（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="122" rx="6"/>
  <text class="txt" x="40" y="68" opacity="0.28">① 停车<tspan class="small">　真电流 0。1 mA 零偏仍在积。24 小时约 24 mAh，5 Ah 上约 0.48%。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="94" opacity="0.28">② 第 24 小时开始放电 20 A<tspan class="small">　分流器从 25 °C 线性升到 85 °C，α 示意 150 ppm/°C。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="120" opacity="0.28">③ 这一小时<tspan class="small">　温漂电量 0.09 Ah，约 1.8%。起点斜率为 0，因为刚开始还没热。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="146" opacity="0.28">④ 再停一天<tspan class="small">　温漂停住，零偏继续爬到约 0.96%。两笔账不要混成一个校准数。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="182" width="752" height="250" rx="6"/>
  <text class="small" x="40" y="204">SOC 误差 %</text>
  <line class="axis" x1="92.0" y1="214.0" x2="92.0" y2="400.0"/>
  <line class="axis" x1="92.0" y1="400.0" x2="720.0" y2="400.0"/>
  <text class="small" x="712.0" y="418" text-anchor="end">小时</text>
  <line class="grid" x1="92.0" y1="400.0" x2="92.0" y2="406.0"/>
  <text class="small" x="92.0" y="432" text-anchor="middle">0</text>
  <line class="grid" x1="406.0" y1="400.0" x2="406.0" y2="406.0"/>
  <text class="small" x="406.0" y="432" text-anchor="middle">24</text>
  <line class="grid" x1="419.1" y1="400.0" x2="419.1" y2="406.0"/>
  <text class="small" x="419.1" y="432" text-anchor="middle">25</text>
  <line class="grid" x1="720.0" y1="400.0" x2="720.0" y2="406.0"/>
  <text class="small" x="720.0" y="432" text-anchor="middle">48</text>
  <line class="grid" x1="86.0" y1="400.0" x2="92.0" y2="400.0"/>
  <text class="small" x="82.0" y="404.0" text-anchor="end">0</text>
  <line class="grid" x1="86.0" y1="361.2" x2="92.0" y2="361.2"/>
  <text class="small" x="82.0" y="365.2" text-anchor="end">0.5</text>
  <line class="grid" x1="86.0" y1="260.5" x2="92.0" y2="260.5"/>
  <text class="small" x="82.0" y="264.5" text-anchor="end">1.8</text>
  <polyline class="lineb" points="92.0,400.0 98.5,399.2 105.1,398.4 111.6,397.7 118.2,396.9 124.7,396.1 131.2,395.4 137.8,394.6 144.3,393.8 150.9,393.0 157.4,392.2 164.0,391.5 170.5,390.7 177.0,389.9 183.6,389.1 190.1,388.4 196.7,387.6 203.2,386.8 209.8,386.1 216.3,385.3 222.8,384.5 229.4,383.7 235.9,382.9 242.5,382.2 249.0,381.4 255.5,380.6 262.1,379.9 268.6,379.1 275.2,378.3 281.7,377.5 288.2,376.8 294.8,376.0 301.3,375.2 307.9,374.4 314.4,373.6 321.0,372.9 327.5,372.1 334.0,371.3 340.6,370.6 347.1,369.8 353.7,369.0 360.2,368.2 366.8,367.4 373.3,366.7 379.8,365.9 386.4,365.1 392.9,364.4 399.5,363.6 406.0,362.8 412.5,362.0 419.1,361.2 425.6,360.5 432.2,359.7 438.7,358.9 445.2,358.1 451.8,357.4 458.3,356.6 464.9,355.8 471.4,355.1 478.0,354.3 484.5,353.5 491.0,352.7 497.6,351.9 504.1,351.2 510.7,350.4 517.2,349.6 523.8,348.9 530.3,348.1 536.8,347.3 543.4,346.5 549.9,345.8 556.5,345.0 563.0,344.2 569.5,343.4 576.1,342.6 582.6,341.9 589.2,341.1 595.7,340.3 602.2,339.6 608.8,338.8 615.3,338.0 621.9,337.2 628.4,336.4 635.0,335.7 641.5,334.9 648.0,334.1 654.6,333.4 661.1,332.6 667.7,331.8 674.2,331.0 680.8,330.2 687.3,329.5 693.8,328.7 700.4,327.9 706.9,327.1 713.5,326.4 720.0,325.6" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline class="liner" points="92.0,400.0 98.5,400.0 105.1,400.0 111.6,400.0 118.2,400.0 124.7,400.0 131.2,400.0 137.8,400.0 144.3,400.0 150.9,400.0 157.4,400.0 164.0,400.0 170.5,400.0 177.0,400.0 183.6,400.0 190.1,400.0 196.7,400.0 203.2,400.0 209.8,400.0 216.3,400.0 222.8,400.0 229.4,400.0 235.9,400.0 242.5,400.0 249.0,400.0 255.5,400.0 262.1,400.0 268.6,400.0 275.2,400.0 281.7,400.0 288.2,400.0 294.8,400.0 301.3,400.0 307.9,400.0 314.4,400.0 321.0,400.0 327.5,400.0 334.0,400.0 340.6,400.0 347.1,400.0 353.7,400.0 360.2,400.0 366.8,400.0 373.3,400.0 379.8,400.0 386.4,400.0 392.9,400.0 399.5,400.0 406.0,400.0 412.5,365.1 419.1,260.5 425.6,260.5 432.2,260.5 438.7,260.5 445.2,260.5 451.8,260.5 458.3,260.5 464.9,260.5 471.4,260.5 478.0,260.5 484.5,260.5 491.0,260.5 497.6,260.5 504.1,260.5 510.7,260.5 517.2,260.5 523.8,260.5 530.3,260.5 536.8,260.5 543.4,260.5 549.9,260.5 556.5,260.5 563.0,260.5 569.5,260.5 576.1,260.5 582.6,260.5 589.2,260.5 595.7,260.5 602.2,260.5 608.8,260.5 615.3,260.5 621.9,260.5 628.4,260.5 635.0,260.5 641.5,260.5 648.0,260.5 654.6,260.5 661.1,260.5 667.7,260.5 674.2,260.5 680.8,260.5 687.3,260.5 693.8,260.5 700.4,260.5 706.9,260.5 713.5,260.5 720.0,260.5" stroke-linejoin="round" stroke-linecap="round"/>
  <text class="hi" x="160" y="360">蓝：1 mA 零偏，一直斜着爬</text>
  <text class="warn" x="400" y="250">红：热起来那 1 小时弯上去</text>
  <circle class="dotr" r="6"><animate attributeName="cx" values="92.0;144.3;196.7;249.0;301.3;353.7;406.0;458.3;510.7;563.0;615.3;667.7;720.0" keyTimes="0;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="400.0;400.0;400.0;400.0;400.0;400.0;400.0;260.5;260.5;260.5;260.5;260.5;260.5" keyTimes="0;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1" dur="12s" repeatCount="indefinite"/></circle>
  <text class="small" x="24" y="478">α=150 ppm/°C、20 A、5 Ah、1 mA 都是示意。以你焊上的那颗分流器为准。</text>
</svg>
