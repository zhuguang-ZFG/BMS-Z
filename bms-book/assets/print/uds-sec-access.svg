<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 576" role="img" font-family="ui-monospace, Consolas, monospace" data-snapshot-time="9">
  <title>UDS 0x27 安全访问：种子→密钥→解锁，连错三次罚等（示意）</title>
  <desc>金点沿箭头走：蓝箭头 27 01 要种子、67 01 回随机种子、27 02 发回算出的密钥，绿箭头 67 02 确认解锁；末段红箭头是连错三次的 7F 27 36 和罚等未到的 7F 27 37。字节、次数与 10 秒是示意。</desc>
  <style>
    .bg { fill: #fffdf5; }
    .panel { fill: #f7f2e5; stroke: #cfc6b2; }
    .txt { fill: #293b3a; font-size: 13px; }
    .small { fill: #626d65; font-size: 12px; }
    .title { fill: #293b3a; font-size: 16px; font-weight: bold; }
    .hi { fill: #176b73; }
    .warn { fill: #b84745; }
    .ok { fill: #377b60; }
    .gold { fill: #926717; }
    .lifeline { stroke: #626d65; stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
    .lineb { stroke: #176b73; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #377b60; stroke-width: 2.5; fill: none; }
    .liner { stroke: #b84745; stroke-width: 2.5; fill: none; }
    .headb { fill: #176b73; }
    .headg { fill: #377b60; }
    .headr { fill: #b84745; }
    .dotb { fill: #176b73; }
    .dotg { fill: #377b60; }
    .dotr { fill: #b84745; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #192727; }
      .panel { fill: #223333; stroke: #496160; }
      .txt { fill: #edf0e5; }
      .small { fill: #b0beb3; }
      .title { fill: #edf0e5; }
      .hi { fill: #7ec5c5; }
      .warn { fill: #f39b91; }
      .ok { fill: #8fc7a2; }
      .gold { fill: #dfbd78; }
      .lifeline { stroke: #b0beb3; }
      .lineb { stroke: #7ec5c5; }
      .lineg { stroke: #8fc7a2; }
      .liner { stroke: #f39b91; }
      .headb { fill: #7ec5c5; }
      .headg { fill: #8fc7a2; }
      .headr { fill: #f39b91; }
      .dotb { fill: #7ec5c5; }
      .dotg { fill: #8fc7a2; }
      .dotr { fill: #f39b91; }
    }
  </style>
  <!-- formula: illustrative seed/key bytes; NRC 0x35/0x36/0x37 per ISO 14229-1; 3-attempt lockout and 10 s delay illustrative, OEM-defined -->
  <rect class="bg" width="800" height="576"/>
  <text class="title" x="24" y="32">UDS 0x27 安全访问：种子→密钥→解锁，连错三次罚等（示意）</text>
  <rect class="panel" x="24" y="44" width="752" height="124" rx="6"/>
  <text class="txt" x="40" y="68" opacity="1" style="opacity: 1;">① 请求种子<tspan class="small">　27 01 要随机数，种子不复用。</tspan></text>
  <text class="txt" x="40" y="92" opacity="1" style="opacity: 1;">② 算并发回<tspan class="small">　共享密钥把种子算成密钥，27 02 发回。</tspan></text>
  <text class="txt" x="40" y="116" opacity="1" style="opacity: 1;">③ 对上解锁<tspan class="small">　67 02 确认，只解锁该等级的写服务。</tspan></text>
  <text class="txt" x="40" y="140" opacity="1" style="opacity: 1;">④ 错了罚等<tspan class="small">　连错 3 次 7F 27 36；罚等未到 7F 27 37。</tspan></text>
  <rect class="panel" x="24" y="180" width="752" height="290" rx="6"/>
  <rect class="panel" x="48" y="194" width="170" height="30" rx="5"/>
  <text class="txt" x="133" y="214" text-anchor="middle">诊断仪</text>
  <rect class="panel" x="582" y="194" width="170" height="30" rx="5"/>
  <text class="txt" x="667" y="214" text-anchor="middle">BMS / ECU</text>
  <line class="lifeline" x1="133" y1="224" x2="133" y2="456"/>
  <line class="lifeline" x1="667" y1="224" x2="667" y2="456"/>
  <g opacity="1" style="opacity: 1;">

    <text class="hi" x="400" y="239" text-anchor="middle">27 01　请求种子</text>
    <line class="lineb" x1="133" y1="250" x2="655" y2="250"/>
    <polygon class="headb" points="663,250 649,245 649,255"/>
  </g>
  <g opacity="1" style="opacity: 1;">

    <text class="hi" x="400" y="281" text-anchor="middle">67 01 + 种子 A7 F3 12 9C</text>
    <line class="lineb" x1="667" y1="292" x2="145" y2="292"/>
    <polygon class="headb" points="137,292 151,287 151,297"/>
  </g>
  <g opacity="1" style="opacity: 1;">

    <text class="hi" x="400" y="323" text-anchor="middle">27 02 + 密钥 5E 04（KDF 算的）</text>
    <line class="lineb" x1="133" y1="334" x2="655" y2="334"/>
    <polygon class="headb" points="663,334 649,329 649,339"/>
  </g>
  <g opacity="1" style="opacity: 1;">

    <text class="ok" x="400" y="365" text-anchor="middle">67 02　已解锁该等级</text>
    <line class="lineg" x1="667" y1="376" x2="145" y2="376"/>
    <polygon class="headg" points="137,376 151,371 151,381"/>
  </g>
  <g opacity="0" style="opacity: 0;">

    <text class="warn" x="400" y="403" text-anchor="middle">27 02　密钥 ×3 全错</text>
    <line class="liner" x1="133" y1="414" x2="655" y2="414"/>
    <polygon class="headr" points="663,414 649,409 649,419"/>
  </g>
  <g opacity="0" style="opacity: 0;">

    <text class="warn" x="400" y="435" text-anchor="middle">7F 27 36 超次数 · 罚等未到 7F 27 37</text>
    <line class="liner" x1="667" y1="446" x2="145" y2="446"/>
    <polygon class="headr" points="137,446 151,441 151,451"/>
  </g>
  <circle class="dotb" r="5" cx="655" cy="250" opacity="0" style="opacity: 0;"/>
  <circle class="dotb" r="5" cx="145" cy="292" opacity="0" style="opacity: 0;"/>
  <circle class="dotb" r="5" cx="655" cy="334" opacity="0" style="opacity: 0;"/>
  <circle class="dotg" r="5" cx="145" cy="376" opacity="0" style="opacity: 0;"/>
  <circle class="dotr" r="5" cx="133" cy="414" opacity="1" style="opacity: 1;"/>
  <rect class="panel" x="24" y="484" width="752" height="52" rx="6"/>
  <text class="small" x="40" y="514" opacity="0" style="opacity: 0;">t≈0.2 s　27 01 请求种子 →　← 67 01 种子 A7 F3 12 9C（示意）</text>
  <text class="small" x="40" y="514" opacity="0" style="opacity: 0;">t≈3 s　KDF(种子, 共享密钥) = 5E 04 … → 27 02 发回（示意）</text>
  <text class="small" x="40" y="514" opacity="0" style="opacity: 0;">t≈6 s　67 02 · 已解锁等级 1 · 0x2E 写参数可发（示意）</text>
  <text class="small" x="40" y="514" opacity="1" style="opacity: 1;">t≈9 s　错 3 次每次 7F 27 35 → 7F 27 36 · 罚等未到 7F 27 37（示意 10 s，OEM 定）</text>
  <text class="small" x="24" y="562">0x35 / 0x36 / 0x37 是 ISO 14229 的否定响应码。种子、密钥字节、次数与罚等时长都是示意；固定密钥等于没锁。</text>
</svg>
