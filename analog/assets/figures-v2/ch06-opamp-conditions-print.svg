<rect x="50" y="440" width="900" height="132" rx="6" fill="#f6eedb" stroke="#a8321f" stroke-width="2"/>
<rect class="ink-echo" x="50" y="440" width="900" height="132" rx="6" stroke="#a8321f" stroke-width="2" fill="none" opacity="0.32" transform="translate(-1.02 -0.80) rotate(-0.04 500.0 506.0)"/>
<text x="76" y="480" font-size="24" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">输出摆幅：另按负载电流、温度和输出电压查曲线。</text>
<text x="76" y="522" font-size="24" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">不能把输入上限 3.5 V 当作所有负载下的输出保证。</text>
<text x="76" y="556" font-size="22" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">典型 GBW 0.7 MHz、SR 0.3 V/µs 也不是保证下限。</text>
<text x="50" y="624" font-size="23" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">单电源 ≠ 轨到轨；RRI 是输入、RRO 是输出、RRIO 是两者。</text>
</svg>
