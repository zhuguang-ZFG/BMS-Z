<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">AI 陪练工作流：AI 起草，物理裁决</title>
<desc id="figDesc">三方舞台循环图：左侧“你 · 出题人”卡（人形图标、指标清单：带宽 1MHz、跨阻 100kΩ、单电源 5V，标注“指标：唯一不能外包的一步”）；中间琥珀色“AI · 起草员”卡（机器人图标、提案清单：拓扑候选、deck 骨架、备选器件，挂灰色“未验证”标签，注“流畅 ≠ 正确”）；右侧墨绿“物理裁判”台（法槌、仿真与 datasheet 两枚圆章，“✓ 通过 · ✗ 打回”）。四条带编号箭头：① 你→AI 指标与约束；② AI→裁判 提案（未验证）；③ 裁判→AI 红色虚线打回（带着理由改）；④ 裁判→你 绿色大弧定稿（直觉 +1）。中部小字“给足上下文 · 要求自洽核算 · 要求列假设”，底部深蓝横幅：“起草成本归零，裁决一步不省——你的身价，取决于握着裁决权时判得有多准”。</desc>
<rect x="0" y="0" width="960" height="640" fill="#fffdf8"/>
<text x="480" y="44" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="27" font-weight="700" fill="#14213d">AI 陪练工作流：AI 起草，物理裁决</text>
<text x="480" y="72" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="14" fill="#52606d">AI 把“起草”的成本压到接近零——“对不对”的裁决成本从来没变过</text>
<line x1="60" y1="88" x2="900" y2="88" stroke="#14213d" stroke-width="1.5" opacity="0.25"/>

