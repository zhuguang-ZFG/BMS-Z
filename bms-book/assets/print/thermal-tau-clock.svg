<svg data-sketch="1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="一阶热模型指数升温动画：曲线按 τ 节拍生长，一个 τ 走完 63.2%，两个 τ 走完 86.5%，三个 τ 走完 95.0%，稳态 31.1 摄氏度" data-snapshot-time="11.5">
  <title>τ 节拍：每过一个 τ 走完剩余差距的 63.2%</title>
  <desc>产热功率、环境温度和热参数固定时，电芯温度按指数接近稳态 31.1 摄氏度：累计经过一个 τ 即 120 秒、两个 τ 即 240 秒、三个 τ 即 360 秒，分别走完初始温差的 63.2%、86.5%、95.0%。动画按这三个节拍分段画出升温曲线，游点在曲线上前行；断电降温走同一条指数，只是方向朝下。</desc>
