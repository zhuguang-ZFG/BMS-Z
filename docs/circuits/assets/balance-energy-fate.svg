<svg xmlns="http://www.w3.org/2000/svg" width="800" height="750" viewBox="0 -156 800 750" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>被动均衡把电变成热，主动均衡把电搬到低节</title>
  <desc>左边被动均衡把高节的电荷烧成热，右边主动均衡把同一份电荷搬进低节：两个面板对比着亮。</desc><style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .fill-boxb { fill: #ddf4ff; }
    .fill-boxg { fill: #dafbe1; }
    .fill-boxr { fill: #ffebe9; }
    .fill-boxy { fill: #fff8c5; }
    .fill-b { fill: #0969da; }
    .fill-g { fill: #1a7f37; }
    .fill-r { fill: #cf222e; }
    .fill-y { fill: #9a6700; }
    .fill-ink { fill: #57606a; }
    .fill-muted { fill: #e2e8f0; }
    .fill-lockb { fill: #0969da; }
    .stroke-panel { stroke: #d0d7de; }
    .stroke-axis { stroke: #57606a; }
    .stroke-b { stroke: #0969da; }
    .stroke-g { stroke: #1a7f37; }
    .stroke-r { stroke: #cf222e; }
    .stroke-y { stroke: #bf8700; }
    .stroke-check { stroke: #ffffff; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .on { fill: #ffffff; font-size: 13px; font-weight: bold; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .fill-boxb { fill: #12233a; }
      .fill-boxg { fill: #0f2415; }
      .fill-boxr { fill: #3d1214; }
      .fill-boxy { fill: #2d2607; }
      .fill-b { fill: #4493f8; }
      .fill-g { fill: #3fb950; }
      .fill-r { fill: #ff7b72; }
      .fill-y { fill: #d29922; }
      .fill-ink { fill: #8b949e; }
      .fill-muted { fill: #30363d; }
      .fill-lockb { fill: #0969da; }
      .stroke-panel { stroke: #30363d; }
      .stroke-axis { stroke: #8b949e; }
      .stroke-b { stroke: #4493f8; }
      .stroke-g { stroke: #3fb950; }
      .stroke-r { stroke: #ff7b72; }
      .stroke-y { stroke: #d29922; }
      .stroke-check { stroke: #0d1117; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .on { fill: #ffffff; }
      .lineb { stroke: #4493f8; }
    }
</style><rect class="bg" x="0" y="-156" width="800" height="750" /><text class="title" x="24" y="-128">能量去哪：左边烧掉，右边搬走</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 能量去哪：左边烧掉，右边搬走<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 电荷没有进别的节<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 错：主动均衡也是把电烧掉<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="538" width="752" height="44" rx="6" /><text class="small" x="40" y="566">主动一拍 ½×10 µH×(2 A)² = 20 µJ。损耗仍在，这张图不写效率百分数。示意。</text><rect width="800" height="530" class="bg" />
  <rect x="24" y="52" width="400" height="250" rx="8" stroke-width="2" class="panel">
    <animate attributeName="stroke-width" values="5;2;5" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite" />
  </rect>
  <text x="224" y="80" text-anchor="middle" font-size="16" font-weight="bold" class="warn">被动：开阀放掉</text>
  <rect x="70" y="110" width="70" height="140" rx="6" class="fill-boxb stroke-b" />
  <rect x="78" y="150" width="54" height="92" class="fill-b">
    <animate attributeName="height" values="92;40;92" keyTimes="0;0.45;1" dur="8s" repeatCount="indefinite" />
    <animate attributeName="y" values="150;202;150" keyTimes="0;0.45;1" dur="8s" repeatCount="indefinite" />
  </rect>
  <text x="105" y="268" text-anchor="middle" font-size="12" class="txt">高节</text>
  <rect x="200" y="150" width="36" height="70" class="fill-boxr stroke-r" />
  <text x="218" y="242" text-anchor="middle" font-size="12" class="warn">电阻</text>
  <text x="300" y="140" font-size="13" class="warn">热量离开电池</text>
  <text x="300" y="164" font-size="13" class="txt">电荷没有进别的节</text>
  <circle cy="130" r="5" class="fill-r">
    <animate attributeName="cx" values="140;218;300;140" keyTimes="0;0.25;0.45;1" dur="8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.48;0.9;1" dur="8s" repeatCount="indefinite" />
  </circle>

  <rect x="440" y="52" width="344" height="250" rx="8" stroke-width="2" class="panel">
    <animate attributeName="stroke-width" values="2;5;2" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite" />
  </rect>
  <text x="640" y="80" text-anchor="middle" font-size="16" font-weight="bold" class="ok">主动：搬到矮节</text>
  <rect x="484" y="110" width="70" height="140" rx="6" class="fill-boxb stroke-b" />
  <rect x="492" y="150" width="54" height="92" class="fill-b">
    <animate attributeName="height" values="92;92;60;92" keyTimes="0;0.5;0.85;1" dur="8s" repeatCount="indefinite" />
    <animate attributeName="y" values="150;150;182;150" keyTimes="0;0.5;0.85;1" dur="8s" repeatCount="indefinite" />
  </rect>
  <rect x="684" y="110" width="70" height="140" rx="6" class="fill-boxg stroke-g" />
  <rect x="692" y="190" width="54" height="52" class="fill-g">
    <animate attributeName="height" values="52;52;84;52" keyTimes="0;0.5;0.85;1" dur="8s" repeatCount="indefinite" />
    <animate attributeName="y" values="190;190;158;190" keyTimes="0;0.5;0.85;1" dur="8s" repeatCount="indefinite" />
  </rect>
  <text x="519" y="268" text-anchor="middle" font-size="12" class="txt">高节</text>
  <text x="719" y="268" text-anchor="middle" font-size="12" class="txt">低节</text>
  <line x1="554" y1="160" x2="684" y2="160" stroke-width="3" stroke-dasharray="8 6" class="stroke-g">
    <animate attributeName="stroke-dashoffset" values="40;0;40" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite" />
  </line>
  <text x="619" y="150" text-anchor="middle" font-size="12" class="ok">电荷换了一节</text>
  <circle cy="160" r="5" opacity="0" class="fill-g">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.48;0.55;0.85;0.92;1" dur="8s" repeatCount="indefinite" />
    <animate attributeName="cx" values="544;684;544" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite" />
  </circle>

  <text x="400" y="340" text-anchor="middle" font-size="15" font-weight="bold" opacity="0" class="warn">错：主动均衡也是把电烧掉
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.15;0.35;1" dur="8s" repeatCount="indefinite" />
  </text>
  <text x="400" y="372" text-anchor="middle" font-size="15" opacity="0" class="ok">对：被动进电阻变热；主动交给低的那一节。开关和磁件仍有损耗。
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.45;0.55;1" dur="8s" repeatCount="indefinite" />
  </text>
  <text x="400" y="414" text-anchor="middle" font-size="13" class="small">示意图。没有同一电流、同一串数的实测效率，不在这张图上写百分数。</text>


  <rect x="24" y="430" width="752" height="86" rx="8" class="panel" />
  <text x="40" y="458" font-size="14" class="txt">示意账：被动 4.2 V、42 mA、1 小时 ≈ 0.18 Wh 变成热，邻居收到 0。</text>
  
  <circle cx="788" cy="470" r="6" class="fill-y">
    <animate attributeName="opacity" values="1;0.2;1" keyTimes="0;0.5;1" dur="2s" repeatCount="indefinite" />
  </circle>

</svg>