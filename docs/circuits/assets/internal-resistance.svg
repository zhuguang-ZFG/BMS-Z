</style><rect class="bg" x="0" y="-156" width="800" height="796" /><text class="title" x="24" y="-128">内阻：带载「腿软」，卸载回弹</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 带载时端电压腿软，卸掉负载会回弹。<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 底栏 ΔV=I×R。20 A、20 mΩ 掉 0.40 V。<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 同一电流，60 mΩ 掉 1.20 V。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 黄点沿 20 mΩ 那条走。数字是示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect width="800" height="640" class="bg" />
  <path d="M120,188 L120,150 L300,150" fill="none" stroke-width="3" class="stroke-panel" />
  <path d="M335,150 L350,150 L350,330 L120,330 L120,272" fill="none" stroke-width="3" class="stroke-panel" />

  
  <circle cx="120" cy="230" r="42" stroke-width="2.5" class="fill-boxg stroke-g" />
  <text x="120" y="226" text-anchor="middle" font-size="13" class="ok">电池</text>
  <text x="120" y="246" text-anchor="middle" font-size="13" font-weight="bold" class="ok">3.9V</text>

  
  <rect x="180" y="135" width="90" height="30" rx="4" fill="#fef3c7" stroke="#92400e" stroke-width="2" class="stroke-y">
    <animate attributeName="fill" values="#78350f;#78350f;#7f1d1d;#7f1d1d" keyTimes="0;0.62;0.66;1" dur="12s" repeatCount="indefinite" />
    <animate attributeName="stroke" values="#fcd34d;#fcd34d;#b91c1c;#b91c1c" keyTimes="0;0.62;0.66;1" dur="12s" repeatCount="indefinite" />
  </rect>
  
  <text x="225" y="156" text-anchor="middle" font-size="13" font-weight="bold" class="on">R_内</text>
  <text x="225" y="182" text-anchor="middle" font-size="12" class="gold">20mΩ（新）
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.62;0.64;1" dur="12s" repeatCount="indefinite" />
  </text>
  <text x="225" y="199" text-anchor="middle" font-size="12" opacity="0" class="warn">60mΩ（老化）
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.62;0.66;1" dur="12s" repeatCount="indefinite" />
  </text>

  
  <line x1="300" y1="150" x2="327" y2="132" stroke-width="3" class="stroke-axis">
    <animate attributeName="opacity" values="1;1;0;0;1;1;0;0" keyTimes="0;0.18;0.2;0.43;0.45;0.62;0.64;1" dur="12s" repeatCount="indefinite" />
  </line>
  <line x1="300" y1="150" x2="335" y2="150" stroke-width="3" opacity="0" class="stroke-b">
    <animate attributeName="opacity" values="0;0;1;1;0;0;1;1" keyTimes="0;0.18;0.2;0.43;0.45;0.62;0.64;1" dur="12s" repeatCount="indefinite" />
  </line>
  <text x="317" y="122" text-anchor="middle" font-size="12" class="small">开关</text>
  <text x="350" y="122" text-anchor="middle" font-size="12" class="small">端子</text>

  
  <rect x="280" y="315" width="70" height="30" rx="4" stroke-width="2" class="fill-muted stroke-axis" />
  <text x="315" y="335" text-anchor="middle" font-size="13" class="txt">负载</text>

  
  <circle r="5" opacity="0" class="fill-b">
    <animate attributeName="opacity" values="0;0;1;1;0;0;1;1" keyTimes="0;0.18;0.2;0.43;0.45;0.62;0.64;1" dur="12s" repeatCount="indefinite" />
    <animateMotion path="M120,188 L120,150 L350,150 L350,330 L120,330 L120,272" keyPoints="0;0;1;0;1;1" keyTimes="0;0.18;0.45;0.62;0.99;1" calcMode="linear" dur="12s" repeatCount="indefinite" />
  </circle>
  <circle r="5" opacity="0" class="fill-b">
    <animate attributeName="opacity" values="0;0;1;1;0;0;1;1" keyTimes="0;0.18;0.2;0.43;0.45;0.62;0.64;1" dur="12s" repeatCount="indefinite" begin="-1.1s" />
    <animateMotion path="M120,188 L120,150 L350,150 L350,330 L120,330 L120,272" keyPoints="0;0;1;0;1;1" keyTimes="0;0.18;0.45;0.62;0.99;1" calcMode="linear" dur="12s" repeatCount="indefinite" begin="-1.1s" />
  </circle>
  <text x="200" y="312" text-anchor="middle" font-size="13" font-weight="bold" opacity="0" class="hi">I = 20A（示例）
    <animate attributeName="opacity" values="0;0;1;1;0;0;1;1" keyTimes="0;0.18;0.2;0.43;0.45;0.62;0.64;1" dur="12s" repeatCount="indefinite" />
  </text>

  <text x="215" y="378" text-anchor="middle" font-size="12" class="small">内阻 = 水管里变细的那一段：流量越大，压降越多</text>

  
  <line x1="420" y1="350" x2="770" y2="350" stroke-width="1.5" class="stroke-axis" />
  <line x1="420" y1="350" x2="420" y2="88" stroke-width="1.5" class="stroke-axis" />
  <text x="412" y="84" text-anchor="end" font-size="12" class="small">V</text>
  <text x="766" y="370" text-anchor="end" font-size="12" class="small">时间</text>
  <text x="420" y="370" text-anchor="middle" font-size="12" class="small">0</text>

  <text x="412" y="104" text-anchor="end" font-size="12" class="small">4.2V</text>
  <text x="412" y="146" text-anchor="end" font-size="12" class="small">3.9V</text>
  <text x="412" y="201" text-anchor="end" font-size="12" class="small">3.5V</text>
  <text x="412" y="312" text-anchor="end" font-size="12" class="small">2.7V</text>
  <text x="412" y="354" text-anchor="end" font-size="12" class="small">2.4V</text>

  
  <line x1="420" y1="142" x2="770" y2="142" stroke-width="1" stroke-dasharray="5 4" class="stroke-axis" />
  <text x="425" y="136" text-anchor="start" font-size="12" class="small">OCV 3.9V</text>

  
  <path d="M420,142 L500,142 L500,197 L650,197 L650,142 L770,142" fill="none" stroke-width="2.5" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" opacity="0" class="stroke-b">
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.02;1" dur="12s" repeatCount="indefinite" />
    <animate attributeName="stroke-dashoffset" values="100;0;0" keyTimes="0;0.55;1" dur="12s" repeatCount="indefinite" />
  </path>

  
  <rect x="500" y="142" width="150" height="55" opacity="0" class="fill-boxr">
    <animate attributeName="opacity" values="0;0;0.55;0.55;0;0" keyTimes="0;0.3;0.35;0.55;0.6;1" dur="12s" repeatCount="indefinite" />
  </rect>

  
  <path d="M500,142 L500,308 L650,308 L650,142" fill="none" stroke-width="2.5" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" opacity="0" class="stroke-r">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.62;0.64;1" dur="12s" repeatCount="indefinite" />
    <animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.62;0.88;1" dur="12s" repeatCount="indefinite" />
  </path>

  
  <text x="520" y="122" text-anchor="start" font-size="13" opacity="0" class="txt">静置：端电压 = 电动势
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.15;0.18;1" dur="12s" repeatCount="indefinite" />
  </text>
  <text x="510" y="224" text-anchor="start" font-size="13" font-weight="bold" opacity="0" class="warn">I·R = 0.4V 落差（示例）
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.36;0.55;0.6;1" dur="12s" repeatCount="indefinite" />
  </text>
  <text x="657" y="170" text-anchor="start" font-size="13" font-weight="bold" opacity="0" class="ok">撤载 → 回弹
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.48;0.52;0.59;0.62;1" dur="12s" repeatCount="indefinite" />
  </text>
  <text x="505" y="290" text-anchor="start" font-size="13" font-weight="bold" opacity="0" class="warn">老化：同样 20A → 跌到 2.7V
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.8;0.84;1" dur="12s" repeatCount="indefinite" />
  </text>

  <text x="400" y="412" text-anchor="middle" font-size="13" class="small">关键：端电压 = 电动势 − I·R；带载读数虚低，静置才回真——老化的电池腿更软。</text>
<rect x="24" y="438.0" width="752" height="188" rx="6" class="panel" /><text x="40" y="458.0" font-size="13" class="txt">底栏：ΔV = I×R。图上的 20 A 落在 0.40 V 和 1.20 V</text><text x="40" y="474.0" font-size="12" class="small">压降 V</text><line x1="70.0" y1="474.0" x2="70.0" y2="588.0" stroke-width="1.5" class="stroke-axis" /><line x1="70.0" y1="588.0" x2="460.0" y2="588.0" stroke-width="1.5" class="stroke-axis" /><line x1="70.0" y1="588.0" x2="70.0" y2="593.0" class="stroke-axis" /><text x="70.0" y="606.0" text-anchor="middle" font-size="12" class="small">0</text><line x1="265.0" y1="588.0" x2="265.0" y2="593.0" class="stroke-axis" /><text x="265.0" y="606.0" text-anchor="middle" font-size="12" class="small">20</text><line x1="460.0" y1="588.0" x2="460.0" y2="593.0" class="stroke-axis" /><text x="460.0" y="606.0" text-anchor="middle" font-size="12" class="small">40</text><line x1="65.0" y1="570.5" x2="70.0" y2="570.5" class="stroke-axis" /><text x="62.0" y="574.5" text-anchor="end" font-size="12" class="small">0.40</text><line x1="65.0" y1="535.4" x2="70.0" y2="535.4" class="stroke-axis" /><text x="62.0" y="539.4" text-anchor="end" font-size="12" class="small">1.20</text><line x1="65.0" y1="482.8" x2="70.0" y2="482.8" class="stroke-axis" /><text x="62.0" y="486.8" text-anchor="end" font-size="12" class="small">2.40</text><polyline points="70.0,588.0 79.8,587.1 89.5,586.2 99.2,585.4 109.0,584.5 118.8,583.6 128.5,582.7 138.2,581.9 148.0,581.0 157.8,580.1 167.5,579.2 177.2,578.4 187.0,577.5 196.8,576.6 206.5,575.7 216.2,574.8 226.0,574.0 235.8,573.1 245.5,572.2 255.2,571.3 265.0,570.5 274.8,569.6 284.5,568.7 294.2,567.8 304.0,567.0 313.8,566.1 323.5,565.2 333.2,564.3 343.0,563.4 352.8,562.6 362.5,561.7 372.2,560.8 382.0,559.9 391.8,559.1 401.5,558.2 411.2,557.3 421.0,556.4 430.8,555.6 440.5,554.7 450.2,553.8 460.0,552.9" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" class="stroke-b" /><polyline points="70.0,588.0 79.8,585.4 89.5,582.7 99.2,580.1 109.0,577.5 118.8,574.8 128.5,572.2 138.2,569.6 148.0,567.0 157.8,564.3 167.5,561.7 177.2,559.1 187.0,556.4 196.8,553.8 206.5,551.2 216.2,548.5 226.0,545.9 235.8,543.3 245.5,540.6 255.2,538.0 265.0,535.4 274.8,532.8 284.5,530.1 294.2,527.5 304.0,524.9 313.8,522.2 323.5,519.6 333.2,517.0 343.0,514.3 352.8,511.7 362.5,509.1 372.2,506.4 382.0,503.8 391.8,501.2 401.5,498.6 411.2,495.9 421.0,493.3 430.8,490.7 440.5,488.0 450.2,485.4 460.0,482.8" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" class="stroke-r" /><circle r="5" class="fill-y"><animate attributeName="cx" values="70.0;118.8;167.5;216.2;265.0;313.8;362.5;411.2;460.0" keyTimes="0.0000;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1.0000" dur="8s" repeatCount="indefinite" /><animate attributeName="cy" values="588.0;583.6;579.2;574.8;570.5;566.1;561.7;557.3;552.9" keyTimes="0.0000;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1.0000" dur="8s" repeatCount="indefinite" /></circle><text x="479.4" y="606.0" text-anchor="start" font-size="12" class="small">电流 A（示意）</text><text x="480" y="516.0" font-size="12" class="txt">蓝 20 mΩ，红 60 mΩ。过原点的直线。</text>
</svg>