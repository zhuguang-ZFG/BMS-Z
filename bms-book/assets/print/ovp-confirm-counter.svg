<svg data-sketch="1" xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 800 420" font-family="ui-monospace, Consolas, monospace" aria-label="同一拍里五个保护计数器各自走：OVP 数满三拍禁充，UVP 只数到一，OCD 数到三还差两拍，SCD 本拍直接双断，OT 温度没到线。为什么这一拍不动：不是没看见，是还没数满。数字为教学示意" data-snapshot-time="8">
