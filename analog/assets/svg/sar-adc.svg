<text x="196" y="142" font-size="11" font-weight="bold" fill="#a8321f">−</text>
<circle r="4.5" fill="#6b3f63"><animateMotion dur="8s" begin="-0.5s" repeatCount="indefinite" path="M250,100 L242,100 L242,112"/></circle>
<circle r="4.5" fill="#6b3f63"><animateMotion dur="8s" begin="-1.3s" repeatCount="indefinite" path="M280,127 L280,188"/></circle>
