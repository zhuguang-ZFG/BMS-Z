<text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b">电流脉冲：面积相同，峰值可以不同</text>
<text x="360" y="54" text-anchor="middle" font-size="12.5" fill="#5b666f">示意脉形；时间轴相同，电流轴相同，阴影面积代表电荷</text>
<line x1="82" y1="360" x2="650" y2="360" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><line x1="82" y1="360" x2="82" y2="115" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><text x="30" y="120" font-size="18" fill="#2a2927" text-anchor="start">A</text><text x="82" y="387" font-size="18" fill="#2a2927" text-anchor="start">0</text><text x="632" y="387" font-size="18" fill="#2a2927" text-anchor="end">10 ms</text>
<path data-pulse="rectangle" d="M82,360 L274.5,360 L274.5,260 L439.5,260 L439.5,360 L632,360 L632,360 L82,360 Z" fill="#3d6b4a" fill-opacity=".13"/><path d="M82,360 L274.5,360 L274.5,260 L439.5,260 L439.5,360 L632,360" fill="none" stroke="#3d6b4a" stroke-width="3"/><path data-pulse="triangle" d="M82,360 L274.5,360 L357,160 L439.5,360 L632,360 L632,360 L82,360 Z" fill="#a8321f" fill-opacity=".13"/><path d="M82,360 L274.5,360 L357,160 L439.5,360 L632,360" fill="none" stroke="#a8321f" stroke-width="3" stroke-dasharray="7 4"/><text x="110" y="110" font-size="22" fill="#16202b" text-anchor="start">实线矩形 / 虚线三角：都补回 10 mC</text>
<rect x="24" y="406" width="672" height="34" rx="9" fill="#f7eedb" stroke="#c9bb9d" stroke-width="1.2"/>
<text x="360" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#16202b">3.3 A 是导通窗口平均值；实际峰值另查脉形。</text>
