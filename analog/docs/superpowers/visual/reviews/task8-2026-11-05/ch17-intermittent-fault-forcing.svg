<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1448 1086" role="img" aria-labelledby="title desc" data-print-width-mm="138" data-composition="technical-overlay-v1" data-base-medium="python-svg"><title id="title">间歇故障的逼迫流程</title><desc id="desc">五步流程：一次只用机械、温度或电压一种应力；记录复现率；在复现窗口用单次或毛刺触发等待；先拍照留现场再最小改动；最后用复现率下降验收。</desc><rect width="1448" height="1086" fill="#e2d9cf" /><g id="paper-illustration"><path data-paper-shadow="true" transform="translate(8 12)" d="M194,196 L699.98,194 L1373,197 L1376,614.66 L1373,930 L640.6800000000001,932 L190,928 Z" fill="#535453" opacity="0.08" /><path data-paper-shadow="true" transform="translate(4 7)" d="M194,196 L699.98,194 L1373,197 L1376,614.66 L1373,930 L640.6800000000001,932 L190,928 Z" fill="#535453" opacity="0.12" /><path data-paper-shadow="true" transform="translate(2 3)" d="M194,196 L699.98,194 L1373,197 L1376,614.66 L1373,930 L640.6800000000001,932 L190,928 Z" fill="#535453" opacity="0.15" /><path d="M194,196 L699.98,194 L1373,197 L1376,614.66 L1373,930 L640.6800000000001,932 L190,928 Z" fill="#f6f2ed" stroke="#c4b9ab" stroke-width="1.4" /><path d="M196,198L1369,199" fill="none" stroke="#ffffff" stroke-width="2" opacity=".7" /><path d="M208,208 L1360,210 L1362,916 L210,918 Z" fill="none" stroke="#c4b9ab" stroke-width="2" opacity=".55" />
<circle cx="136" cy="267" r="31" fill="#e2d9cf" stroke="#a4441d" stroke-width="3" />
<circle cx="136" cy="415" r="31" fill="#e2d9cf" stroke="#a4441d" stroke-width="3" />
<line x1="136" y1="328" x2="136" y2="350" stroke="#c4b9ab" stroke-width="3" stroke-dasharray="" /><polygon points="136,350 143.0,337.0 129.0,337.0" fill="#c4b9ab" />
<circle cx="136" cy="563" r="31" fill="#e2d9cf" stroke="#a4441d" stroke-width="3" />
<line x1="136" y1="476" x2="136" y2="498" stroke="#c4b9ab" stroke-width="3" stroke-dasharray="" /><polygon points="136,498 143.0,485.0 129.0,485.0" fill="#c4b9ab" />
<circle cx="136" cy="711" r="31" fill="#e2d9cf" stroke="#a4441d" stroke-width="3" />
<line x1="136" y1="624" x2="136" y2="646" stroke="#c4b9ab" stroke-width="3" stroke-dasharray="" /><polygon points="136,646 143.0,633.0 129.0,633.0" fill="#c4b9ab" />
<circle cx="136" cy="859" r="31" fill="#e2d9cf" stroke="#a4441d" stroke-width="3" />
<line x1="136" y1="772" x2="136" y2="794" stroke="#c4b9ab" stroke-width="3" stroke-dasharray="" /><polygon points="136,794 143.0,781.0 129.0,781.0" fill="#c4b9ab" /></g><g id="technical-overlay"><text x="72" y="92" fill="#2a2927" font-size="50" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">间歇故障：先逼它现身，再在窗口里等</text>
<text x="74" y="146" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">台上不出现，所有测量都失去靶子；三把扳手一次只用一把。</text>
<text x="136" y="279" fill="#a4441d" font-size="34" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#e2d9cf">一</text>
<text x="226" y="252" fill="#2a2927" font-size="36" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">只上一把扳手</text>
<text x="226" y="294" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">机械 / 温度 / 电压分开试，一次只改一个变量</text>
<text x="136" y="427" fill="#a4441d" font-size="34" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#e2d9cf">二</text>
<text x="226" y="400" fill="#2a2927" font-size="36" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">记录复现率</text>
<text x="226" y="442" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">从一天一次逼到一按就坏，才知道有没有靶子</text>
<text x="136" y="575" fill="#a4441d" font-size="34" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#e2d9cf">三</text>
<text x="226" y="548" fill="#2a2927" font-size="36" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">在窗口里等它</text>
<text x="226" y="590" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">单次 / 毛刺触发；蜂鸣档听通断，比盯屏快</text>
<text x="136" y="723" fill="#a4441d" font-size="34" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#e2d9cf">四</text>
<text x="226" y="696" fill="#2a2927" font-size="36" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">先留现场再动手</text>
<text x="226" y="738" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">拍照记录原貌；怀疑哪处，只改哪处</text>
<text x="136" y="871" fill="#a4441d" font-size="34" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#e2d9cf">五</text>
<text x="226" y="844" fill="#2a2927" font-size="36" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">用复现率验收</text>
<text x="226" y="886" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">修完复现率必须下降，并写进维修日志</text>
<path data-paper-shadow="true" transform="translate(8 12)" d="M68,988 L631.6,986 L1381,989 L1384,1030.46 L1381,1062 L565.6,1064 L64,1060 Z" fill="#535453" opacity="0.08" /><path data-paper-shadow="true" transform="translate(4 7)" d="M68,988 L631.6,986 L1381,989 L1384,1030.46 L1381,1062 L565.6,1064 L64,1060 Z" fill="#535453" opacity="0.12" /><path data-paper-shadow="true" transform="translate(2 3)" d="M68,988 L631.6,986 L1381,989 L1384,1030.46 L1381,1062 L565.6,1064 L64,1060 Z" fill="#535453" opacity="0.15" /><path d="M68,988 L631.6,986 L1381,989 L1384,1030.46 L1381,1062 L565.6,1064 L64,1060 Z" fill="#f6f2ed" stroke="#c4b9ab" stroke-width="1.4" /><path d="M70,990L1377,991" fill="none" stroke="#ffffff" stroke-width="2" opacity=".7" />
<text x="92" y="1036" fill="#2a2927" font-size="33" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">复现率不上去，就没有可测的靶子；三把扳手一起上，好了也不知是谁治的。</text></g></svg>
