<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
<title id="title">下令断开，不等于已经断开</title><desc id="desc">同一时间轴：0.30 s开始欠压，0.50 s发断开命令。正常分支0.60 s反馈开，画出开路触点；卡住分支到0.70 s仍反馈闭合，画出闭合触点并锁存ACTUATOR_STUCK。</desc>
