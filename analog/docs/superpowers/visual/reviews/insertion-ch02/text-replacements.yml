changes:
- id: ch02-protection-order
  source: docs/p1-03-ch2.md#2.8
  before: 每个伸到板外的引脚（USB、按键、传感器线、RS-485、电源入口）都是一条**挨打的通道**。人体一摸就是几千伏：ESD 人体模型（HBM）约 **100 pF + 1.5 kΩ**，2 kV 放电的峰值电流就有约 1.3 A，前沿小于 10 ns。芯片内部的 ESD 二极管只扛得住“出厂后不再挨打”的量级，扛不住现场反复放电。
  after: 每个伸到板外的引脚（USB、按键、传感器线、RS-485、电源入口）都是一条**挨打的通道**：人体一摸就是几千伏，纳秒级前沿、安培级峰值（下图红框）。芯片内部的 ESD 二极管只扛得住“出厂后不再挨打”的量级，扛不住现场反复放电。
  caption: 接口保护三件套：顺序错了等于没装。每个伸到板外的脚都是挨打的通道。三件套不是并列的三个零件，是有先后的三道手续
  removed_prose_chars: 38
  relationship: replaces-text
- id: ch02-parallel-hog
  source: docs/p1-03-ch2.md#2.9.1
  before: '**并联均流为什么难？** 两只二极管直接并联，正向特性不可能完全一致。电流大的那只先热，$V_F$ 先降，于是分到更多电流、更热。**负温度系数让“强者更强”。**功率 MOSFET 在较大电流下呈正温度系数，天生适合并联；二极管和 BJT 则常常需要均流电阻、热耦合或降额。LED 灯珠并联时每串串一颗小电阻，就是在人为制造正温度系数。'
  after: '**并联均流为什么难？** 两只二极管的正向特性不可能完全一致，负温度系数会让电流大的那只越抢越多、越来越热（下图）；所以二极管和 BJT 并联常常要加均流电阻、热耦合或降额。'
  caption: 两只二极管并联，越热的那只越抢电流。VF 负温度系数：电流大 → 先热 → VF 降 → 分到更多电流
  removed_prose_chars: 78
  relationship: replaces-text
- id: ch02-zener-budget
  source: docs/p1-03-ch2.md#2.9.2
  before: 选 0.5 W 稳压管，留 2.6 倍余量。若把稳压管直接并在 12 V 电源上、不串限流电阻，电源会把它当短路，瞬间烧毁。这是最常见的“稳压管炸机”原因。
  after: 选管余量按上图右栏的最坏功耗留。不串限流电阻直接并在电源上，稳压管等于把电源短路，瞬间烧毁——这是最常见的“稳压管炸机”原因。
  caption: 稳压管炸机，多半是没串限流。12V ±10% → 5.1V，负载 0–20mA，最小稳流 5mA；先算 R，再算最坏功耗
  removed_prose_chars: 7
  relationship: replaces-text
- id: ch02-junction-margin
  source: docs/p1-03-ch2.md#2.9.3
  before: 距离 125 °C 上限只剩 3 °C，余量已经没了：环境再高 5 °C、电流再大 10%，就超了。正确动作是降额到 0.6 A（$T_j\approx93^\circ\text{C}$）、换低 $V_F$ 的肖特基、加散热片，或者改用同步整流。
  after: 结温余量已经没了：环境再高一点、电流再大一点就超限（下图）。正确动作是降额到 0.6 A、换低 $V_F$ 的肖特基、加散热片，或者改用同步整流。
  caption: 结温只剩 3°C，设计只做了一半。1A × 0.9V × 80°C/W，环境 50°C：Tj = 122°C，离 125°C 上限只差 3°C
  removed_prose_chars: 42
  relationship: replaces-text
- id: ch02-rectifier-voltage-ledger
  source: docs/p1-03-ch2.md#2.10.4
  before: '**校验**　峰值 17 V，电容耐压至少 25 V；考虑长期可靠性和高温寿命，选 35 V 更稳。10,000 µF/35 V 的电解体积不小。纹波电流额定值要大于实际电容纹波电流（约 1~2 A，取决于 ESR 和导通角），否则电容会发热、寿命骤降。'
  after: '**校验**　电容耐压至少 25 V（上图琥珀框），考虑长期可靠性和高温寿命，选 35 V 更稳，代价是体积。纹波电流额定值要大于实际值（约 1~2 A，取决于 ESR 和导通角），否则电容发热、寿命骤降。'
  caption: 桥式整流：峰值到手里还剩多少。12 Vrms 不是 12 V 直流。峰值先扣两只管压降，再扣半个纹波，剩下的才归负载
  removed_prose_chars: 19
  relationship: replaces-text
- id: ch02-esd-chain
  source: docs/p1-03-ch2.md#2.11.3
  before: '**校验**　100 Ω 限流电阻接在 TVS 之后，只承担残差电压：$(9.2-5.7)/100=35\text{ mA}$，瞬时功率约 $3.5^2/100\approx0.12\text{ W}$，在纳秒级 ESD 脉宽下能量微不足道；真正承受 24 A、223 W 的是 TVS。若把 100 Ω 挪到 TVS 之前，它才会承受约 24 A 和 $24^2\times100=57.6\text{ kW}$ 的瞬时功率，钳位点也被抬高——这正是“先 TVS、后限流”的原因。TVS 的地回路要短：若回路电感 1 nH、电流上升率按 24 A/ns 估算，会额外产生约 24 V 压降，钳位形同虚设。'
  after: '**校验**　100 Ω 在 TVS 之后，按残差 3.5 V 算功率约 $3.5^2/100\approx0.12\text{ W}$；仍须查脉冲耐量。若前移，在本例简化模型中总源阻变为 430 Ω，电流 $(8000-9.2)/430\approx18.6\text{ A}$，电阻瞬时功率约 34.6 kW，不能沿用未串阻时的 24 A。地回路若为 1 nH、上升率 24 A/ns，附加压降约 24 V；优先在接口泄放，芯片前限流，回路短而直接。'
  caption: 8kV 简化源：先分流，再限流。330Ω/150pF 近似为 24.2A、223W，不代替 IEC 校准波形；100Ω 后仍注入 35mA。
  removed_prose_chars: 64
  relationship: replaces-text
- id: ch02-bridge-junction-ledger
  source: docs/p1-03-ch2.md#2.12.3
  before: '**桥式里每只管子平均电流只有负载的一半**：1 A 负载、桥式全波，每只二极管导通半周，平均 0.5 A；总损耗约 0.9 W（两只管子各 0.45 W）。但四只管子封在一个桥堆里，热耦合会让壳温升高。必须用桥堆的整体热阻和降额曲线，不能拿单只管子的 $R_{\theta JA}$ 直接套。'
  after: '**桥式里每只管子平均电流只有负载的一半**：1 A 负载时每只平均 0.5 A，四只各耗 0.45 W，合计 1.8 W。热耦合须按桥堆整体热阻和降额曲线校核，不能套单只管子的 $R_{\theta JA}$。'
  caption: 桥堆按封装算四管总损耗；右栏的 122 °C 只对应单管连续 1 A、环境 50 °C 的条件。两种热账不能混用。
  removed_prose_chars: 40
  relationship: replaces-text
- id: ch02-diode-fault-order
  source: docs/p1-03-ch2.md#2.13
  before: '**把五个案例压成一句话**。二极管出问题，先查**方向**：是不是接反、是不是该导通时没导通。再查**压降**：是不是把 0.7 V 用错了地方。最后查**散热**：结温有没有超。三件事按顺序走，大多数故障不用猜。'
  after: '**把五个案例压成一句话**：排故按方向、压降、散热三步走，顺序不能反（下图），大多数故障不用猜。'
  caption: 二极管排故：先方向，再压降，最后散热。五个现象，一条顺序：先查方向，再查压降，最后查散热
  removed_prose_chars: 56
  relationship: replaces-text
