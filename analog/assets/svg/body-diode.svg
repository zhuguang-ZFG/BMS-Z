<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">MOSFET 的两条命门：体二极管与栅氧层</text>

<text x="200" y="46" text-anchor="middle" font-size="14" font-weight="bold" fill="#37424e">体二极管：白送的一只「反向并联」二极管</text>
<text x="26" y="150" font-size="12" font-weight="bold" fill="#1f5d7a">D</text>
<path d="M44 146 Q62.00 146.02 80 146" fill="none" stroke="#37424e" stroke-width="2.5"/>
<path d="M80 120 Q80.08 146.00 80 172" fill="none" stroke="#37424e" stroke-width="2.5"/>
<path d="M96 120 Q95.82 146.00 96 172" fill="none" stroke="#37424e" stroke-width="2.5"/>
<path d="M96 146 Q118.00 146.02 140 146" fill="none" stroke="#37424e" stroke-width="2.5"/>
<text x="150" y="176" font-size="12" font-weight="bold" fill="#3d6b4a">S</text>
<path d="M88 146 Q87.81 173.00 88 200" fill="none" stroke="#8b8272" stroke-width="2"/>
<path d="M88 200 Q144.00 199.96 200 200" fill="none" stroke="#8b8272" stroke-width="2"/>
<path d="M200 200 Q199.94 173.00 200 146" fill="none" stroke="#8b8272" stroke-width="2"/>
<path d="M150,120 L200,120 L200,146" fill="none" stroke="#6b3f63" stroke-width="2.2"/>
<path d="M150 120 Q150.17 160.00 150 200" fill="none" stroke="#6b3f63" stroke-width="2.2"/>
<path d="M188 108 Q200.00 108.11 212 108" fill="none" stroke="#6b3f63" stroke-width="3.5"/>
<line x1="200" y1="108" x2="200" y2="120" stroke="#6b3f63" stroke-width="2"/>
<path d="M188,96 L200,86 L212,96 Z" fill="#6b3f63"/>
<text x="222" y="76" font-size="10.5" font-weight="bold" fill="#6b3f63">体二极管</text>
<circle r="5" fill="#1f5d7a"><animateMotion dur="11s" begin="-0.3s" repeatCount="indefinite" path="M46,146 L78,146"/></circle>
<circle r="5" fill="#3d6b4a"><animateMotion dur="11s" begin="-1.0s" repeatCount="indefinite" path="M98,146 L138,146"/></circle>
<circle r="5" fill="#6b3f63"><animateMotion dur="11s" begin="-1.7s" repeatCount="indefinite" path="M150,190 L198,190 L198,150"/></circle>
<path d="M236 80 Q235.88 320.00 236 560" fill="none" stroke="#c9bb9d" stroke-width="1" stroke-dasharray="6,5"/>
<text x="520" y="76" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#37424e">两处后果 + 一处保护</text>
<rect x="262" y="94" width="330" height="120" rx="8" fill="#f6eedb" stroke="#1f5d7a" stroke-width="1.8"/>
<text x="278" y="120" font-size="12" font-weight="bold" fill="#1f5d7a">① 好处：白送一只续流管</text>
<text x="278" y="144" font-size="11.5" fill="#5b666f">H 桥 / 同步 Buck 的「续流」环节，</text>
<text x="278" y="164" font-size="11.5" fill="#5b666f">正是体二极管在顶班（死区时间里）</text>
<text x="278" y="188" font-size="11.5" font-weight="bold" fill="#3d6b4a">→ 这是 MOS 能替代二极管整流的根</text>
<text x="278" y="206" font-size="11" fill="#5b666f">但它的压降比肖特基大、反向恢复更慢</text>
<rect x="262" y="228" width="330" height="110" rx="8" fill="#f6e7e1" stroke="#a8321f" stroke-width="1.8"/>
<text x="278" y="254" font-size="12" font-weight="bold" fill="#a8321f">② 坏处：不能反向阻断</text>
<text x="278" y="278" font-size="11.5" fill="#5b666f">想用 MOS 做「理想二极管」防反接？</text>
<text x="278" y="300" font-size="11.5" font-weight="bold" fill="#a8321f">单管不行——反向时体二极管照样导通</text>
<text x="278" y="324" font-size="11.5" fill="#5b666f">要用两只背靠背（共源）才有阻断能力</text>
<rect x="262" y="352" width="330" height="136" rx="8" fill="#f7eedb" stroke="#a4630f" stroke-width="1.8"/>
<text x="278" y="378" font-size="12" font-weight="bold" fill="#a4630f">③ 栅氧层只有几十 nm，耐压 ±20V</text>
<text x="278" y="402" font-size="11.5" fill="#5b666f">栅极是「电容」，不是电阻——</text>
<text x="278" y="422" font-size="11.5" fill="#5b666f">一旦过压或静电，栅氧直接击穿（永久损坏）</text>
<text x="278" y="446" font-size="11.5" font-weight="bold" fill="#a8321f">未用的 MOS 栅极不得悬空！</text>
<text x="278" y="470" font-size="11" fill="#5b666f">驱动回路串 10~100Ω 抑制振铃 + 栅极加钳位/下拉</text>
<text x="600" y="508" text-anchor="middle" font-size="12" font-weight="bold" fill="#37424e">三句话速记</text>
<text x="600" y="534" text-anchor="middle" font-size="11.5" fill="#5b666f">体二极管：白送续流、但断了「反向阻断」这条路</text>
<text x="600" y="556" text-anchor="middle" font-size="11.5" fill="#5b666f">栅极：当电容对待——防静电、防悬空、串小电阻</text>
<text x="600" y="578" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a4630f">死区时间里的续流，正是体二极管在顶班（见 13.7 H 桥）</text>
<circle r="4.5" fill="#a4630f"><animateMotion dur="11s" begin="-0.5s" repeatCount="indefinite" path="M46,146 L78,146"/></circle>
<circle r="4.5" fill="#a8321f"><animateMotion dur="11s" begin="-1.3s" repeatCount="indefinite" path="M150,190 L198,190"/></circle>
<circle cx="200" cy="104" r="5" fill="none" stroke="#6b3f63" stroke-width="2.2">
<animate attributeName="r" values="5;12;5" dur="1.9s" repeatCount="indefinite"/></circle>
<circle cx="278" cy="440" r="4" fill="#a8321f"><animate attributeName="r" values="4;9;4" dur="1.6s" repeatCount="indefinite"/></circle>
<rect x="258" y="350" width="338" height="142" rx="10" fill="none" stroke="#a4630f" stroke-width="2.5" opacity="0" filter="url(#pglow)"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.0s" repeatCount="indefinite"/></rect>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.03;0.2;0.25;1" dur="11s" repeatCount="indefinite"/><rect x="160.9" y="591.0" width="478.2" height="24.1" rx="12.0" fill="#1f5d7a" fill-opacity="0.09" stroke="#1f5d7a" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.25;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="604" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1f5d7a" opacity="0">① 体二极管是结构自带的：MOS 天然反向并联一只二极管，拆不掉<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.25;1" dur="11s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="11s" repeatCount="indefinite"/><rect x="133.9" y="591.0" width="532.2" height="24.1" rx="12.0" fill="#a8321f" fill-opacity="0.09" stroke="#a8321f" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="604" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#a8321f" opacity="0">② 好处是 H 桥/同步 Buck 的死区续流有它顶班；坏处是想反向阻断就不行<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="11s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="11s" repeatCount="indefinite"/><rect x="172.9" y="591.0" width="454.1" height="24.1" rx="12.0" fill="#a4630f" fill-opacity="0.09" stroke="#a4630f" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="604" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#a4630f" opacity="0">③ 栅氧层几十 nm、耐压 ±20V：栅极当电容看，防静电防悬空<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="11s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/><rect x="176.4" y="591.0" width="447.1" height="24.1" rx="12.0" fill="#6b3f63" fill-opacity="0.09" stroke="#6b3f63" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="604" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#6b3f63" opacity="0">④ 驱动串 10~100Ω 抑制振铃；未用管子栅极必须下拉或接地<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/></text></g></svg>