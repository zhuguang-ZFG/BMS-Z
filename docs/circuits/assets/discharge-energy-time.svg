  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">主动放电示例：同一只 1 mF 电容，两条衰减</text>
  <text x="400" y="54" text-anchor="middle" font-size="13" fill="#475569">示例值，不是示波器截图。400 V 储能 80 J。60 V 是示例目标。</text>
  <text x="200" y="86" text-anchor="middle" font-size="14" fill="#92400e">被动 47 kΩ，τ = 47 s</text>
