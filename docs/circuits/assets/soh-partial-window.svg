<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 544" font-family="ui-monospace, Consolas, monospace">
  <title>用一段局部充电估容量：不确定度与 ΔSOC 成反比。数字为示意。</title>
  <desc>亮点把窗口从 5% 逐档拉宽到 40%：不确定度与 ΔSOC 成反比，窗口越宽容量估得越准。</desc>

  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.5; fill: none; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
    }
  </style>

  <!-- formula: sigma_Q=0.02/dSOC Ah; Q=dAh/dSOC -->
  <rect class="bg" width="800" height="544"/>
  <text class="title" x="24" y="32">窗口太窄，SOH 就是噪声（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="128" rx="6"/>
  <text class="txt" x="40" y="72" opacity="0.28">① 窗口只有 5%<tspan class="small">　0.02/0.05 = 0.40 Ah。曲线贴着左边的天花板。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="98" opacity="0.28">② 10% 窗口<tspan class="small">　不确定度 0.20 Ah。还是太吵，别当 SOH。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="124" opacity="0.28">③ 40% 窗口<tspan class="small">　0.05 Ah。ΔAh=0.72 时，容量估成 1.80 Ah。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="150" opacity="0.28">④ 再拉宽<tspan class="small">　往 0 贴，但永远不为 0。窗口趋于 0 时不确定度趋于无穷。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="188" width="752" height="304" rx="6"/>
  <text class="small" x="40" y="210">容量不确定度 Ah（示意）</text>
  <line class="axis" x1="108.0" y1="228.0" x2="108.0" y2="430.0"/>
  <line class="axis" x1="108.0" y1="430.0" x2="730.0" y2="430.0"/>
  <text class="small" x="730.0" y="468.0" text-anchor="end">用到的 ΔSOC（1 = 100%）</text>
  <line class="grid" x1="144.6" y1="430.0" x2="144.6" y2="436.0"/>
  <text class="small" x="144.6" y="452.0" text-anchor="middle">0.05</text>
  <line class="grid" x1="181.2" y1="430.0" x2="181.2" y2="436.0"/>
  <text class="small" x="181.2" y="452.0" text-anchor="middle">0.10</text>
  <line class="grid" x1="400.7" y1="430.0" x2="400.7" y2="436.0"/>
  <text class="small" x="400.7" y="452.0" text-anchor="middle">0.40</text>
  <line class="grid" x1="693.4" y1="430.0" x2="693.4" y2="436.0"/>
  <text class="small" x="693.4" y="452.0" text-anchor="middle">0.80</text>
  <line class="grid" x1="102.0" y1="409.0" x2="108.0" y2="409.0"/>
  <text class="small" x="98.0" y="413.0" text-anchor="end">0.05</text>
  <line class="grid" x1="102.0" y1="345.8" x2="108.0" y2="345.8"/>
  <text class="small" x="98.0" y="349.8" text-anchor="end">0.20</text>
  <line class="grid" x1="102.0" y1="261.7" x2="108.0" y2="261.7"/>
  <text class="small" x="98.0" y="265.7" text-anchor="end">0.40</text>
  <polyline class="lineb" points="144.6,261.7 151.4,288.2 158.3,307.6 165.2,322.3 172.0,333.8 178.9,343.1 185.8,350.8 192.6,357.2 199.5,362.7 206.3,367.4 213.2,371.4 220.1,375.0 226.9,378.2 233.8,381.0 240.6,383.6 247.5,385.8 254.4,387.9 261.2,389.8 268.1,391.5 274.9,393.1 281.8,394.6 288.7,395.9 295.5,397.2 302.4,398.3 309.2,399.4 316.1,400.4 323.0,401.3 329.8,402.2 336.7,403.1 343.5,403.9 350.4,404.6 357.3,405.3 364.1,406.0 371.0,406.6 377.8,407.2 384.7,407.7 391.6,408.3 398.4,408.8 405.3,409.3 412.1,409.7 419.0,410.2 425.9,410.6 432.7,411.0 439.6,411.4 446.4,411.8 453.3,412.2 460.2,412.5 467.0,412.8 473.9,413.2 480.7,413.5 487.6,413.8 494.5,414.1 501.3,414.3 508.2,414.6 515.0,414.9 521.9,415.1 528.8,415.4 535.6,415.6 542.5,415.8 549.3,416.0 556.2,416.3 563.1,416.5 569.9,416.7 576.8,416.9 583.6,417.1 590.5,417.2 597.4,417.4 604.2,417.6 611.1,417.8 617.9,417.9 624.8,418.1 631.7,418.2 638.5,418.4 645.4,418.5 652.2,418.7 659.1,418.8 666.0,419.0 672.8,419.1 679.7,419.2 686.6,419.4 693.4,419.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="doty" r="6"><animate attributeName="cx" values="144.6;192.6;233.8;281.8;329.8;371.0;419.0;467.0;508.2;556.2;604.2;645.4;693.4" keyTimes="0.0000;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1.0000" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="261.7;357.2;381.0;394.6;402.2;406.6;410.2;412.8;414.6;416.3;417.6;418.5;419.5" keyTimes="0.0000;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1.0000" dur="12s" repeatCount="indefinite"/></circle>
  <text class="small" x="24" y="528">0.02 Ah 是示意的安时计数误差，不是电流传感器规格。ΔAh=0.72、ΔSOC=0.40、Q=1.80 Ah 也是示意。</text>
</svg>
