  <line class="grid" x1="394.0" y1="400.0" x2="394.0" y2="406.0"/>
  <text class="small" x="394.0" y="422.0" text-anchor="middle">1500</text>
  <line class="grid" x1="680.0" y1="400.0" x2="680.0" y2="406.0"/>
  <text class="small" x="680.0" y="422.0" text-anchor="middle">3000</text>
  <line class="grid" x1="102.0" y1="364.9" x2="108.0" y2="364.9"/>
  <text class="small" x="98.0" y="368.9" text-anchor="end">80</text>
  <line class="grid" x1="102.0" y1="306.3" x2="108.0" y2="306.3"/>
  <text class="small" x="98.0" y="310.3" text-anchor="end">90</text>
  <line class="grid" x1="102.0" y1="247.7" x2="108.0" y2="247.7"/>
  <text class="small" x="98.0" y="251.7" text-anchor="end">100</text>
  <line class="grid" x1="730.0" y1="381.8" x2="736.0" y2="381.8"/>
  <text class="small" x="726.0" y="385.8" text-anchor="end">20</text>
  <line class="grid" x1="730.0" y1="327.1" x2="736.0" y2="327.1"/>
  <text class="small" x="726.0" y="331.1" text-anchor="end">32</text>
  <line class="grid" x1="730.0" y1="267.9" x2="736.0" y2="267.9"/>
  <text class="small" x="726.0" y="271.9" text-anchor="end">45</text>
  <line class="liney" x1="108.0" y1="364.9" x2="680.0" y2="364.9" stroke-dasharray="6 4"/>
