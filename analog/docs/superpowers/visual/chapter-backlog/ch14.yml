status: in-progress
invariants:
- PT100 的 100mV 零点必须在乘40前扣除，量程不能只看38.5mV变化量。
- 1sigma、误差上限、置信覆盖率必须分别标明；同源基准不得重复作为独立误差相加。
- 已验收图的技术内容变化后退回generated；新图待审，不为密度直接打分。
