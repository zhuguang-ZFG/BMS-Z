<text x="510" y="247" text-anchor="middle" font-size="11" fill="#16202b">放大器</text>
<line x1="570" y1="176" x2="570" y2="188" stroke="#3d6b4a" stroke-width="3"/>
<path d="M570 256 Q569.70 222.00 570 188" fill="none" stroke="#1f5d7a" stroke-width="1.5"/>
<path d="M570 188 Q581.00 187.92 592 188" fill="none" stroke="#3d6b4a" stroke-width="3"/>
<path d="M570 188 Q581.00 187.92 592 188" fill="none" stroke="#1f5d7a" stroke-width="1.5"/>
<circle cx="592" cy="188" r="7" fill="#3d6b4a"/>
<text x="592" y="192" text-anchor="middle" font-size="10" font-weight="bold" fill="#fdf8ea">★</text>
<line x1="592" y1="195" x2="592" y2="204" stroke="#37424e" stroke-width="2"/>
<path d="M582 204 Q592.00 204.01 602 204" fill="none" stroke="#37424e" stroke-width="2"/>
<path d="M585 208 Q592.00 208.02 599 208" fill="none" stroke="#37424e" stroke-width="2"/>
<line x1="588" y1="212" x2="596" y2="212" stroke="#37424e" stroke-width="2"/>
<text x="595" y="352" text-anchor="middle" font-size="10" fill="#5b666f">没有共用段——压降只落在自己那段，信号基准纹丝不动</text>
<g filter="url(#pglow)"><circle r="5" fill="#3d6b4a"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M570,180 V188 H590" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle></g>
<g filter="url(#pglow)"><circle r="3.5" fill="#1f5d7a"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M570,250 V188 H590" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle></g>
<text x="400" y="478" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#37424e">大电流回流与小信号地分开走，汇于星形点——避免大电流压降污染小信号基准</text>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.00;0.02;0.25;0.27;1" dur="12s" repeatCount="indefinite"/><rect x="128.0" y="416.9" width="544.0" height="24.1" rx="12.0" fill="#a8321f" fill-opacity="0.09" stroke="#a8321f" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.00;0.02;0.25;0.27;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="430" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#a8321f" opacity="0">① 共用地线：负载地与信号地共用一段 AB——大电流压降直接踩进信号基准<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.00;0.02;0.25;0.27;1" dur="12s" repeatCount="indefinite"/></text></g>
