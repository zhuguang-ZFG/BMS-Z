<svg data-sketch="1" xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 800 430" font-family="ui-monospace, Consolas, monospace" aria-label="一次实跑的对账链动起来：3003 B 字节流，第 13 帧末字节被异或，CRC 重算不过即丢弃并重新同步；垃圾字节 00 ff 19 各触发一次重同步；bad_crc = 1 与 resyncs = 4 是两本账；最终 received 99，缺的正是第 13 帧。数字为教学示意" data-snapshot-time="9">
  <title>帧状态机对账链：bad_crc 与 resyncs 是两本账（教学示意）</title>
  <desc>字节流进场，第 13 帧 CRC 失败被丢弃，三个垃圾字节 00 ff 19 各触发一次重新同步；对账时 bad_crc = 1、resyncs = 4、received 99，缺的正是 [13]。</desc>

