<polygon class="marker-wash" points="43.4,22.4 261.4,22.7 518.0,21.2 517.9,64.7 244.5,62.8 44.5,64.8" fill="#a4630f" opacity="0.13"/>
<text x="52" y="58" font-size="38" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">走线压降：先把毫米换成米</text><text x="52" y="94" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">0.5 mm 宽、35 µm 厚；ρ = 1.7×10⁻⁸ Ω·m，忽略温升与过孔。</text>
<rect x="70" y="150" width="860" height="210" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<rect class="ink-echo" x="70" y="150" width="860" height="210" rx="6" stroke="#37424e" stroke-width="2" fill="none" opacity="0.32" transform="translate(-1.17 0.69) rotate(0.05 500.0 255.0)"/>
<path d="M120,270 L220,200 L320,270 L420,200 L520,270 L620,200 L820,200" fill="none" stroke="#a4630f" stroke-width="6" stroke-linejoin="round"/>
<text x="120" y="320" font-size="24" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">8 cm 长、0.5 mm 宽、1 oz 铜</text>
<text x="680" y="180" font-size="26" fill="#a4630f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">9.71 mΩ/cm</text>
<path d="M760 240 Q790.00 240.45 820 240" fill="none" stroke="#a8321f" stroke-width="2.5" stroke-linecap="round"/><polygon points="820,240 810,235 810,245" fill="#a8321f"/>
<text x="790" y="282" font-size="22" fill="#a8321f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">300 mA</text>
<rect x="70" y="400" width="400" height="150" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<rect class="ink-echo" x="70" y="400" width="400" height="150" rx="6" stroke="#37424e" stroke-width="2" fill="none" opacity="0.32" transform="translate(1.38 0.87) rotate(0.03 270.0 475.0)"/>
<text x="96" y="440" font-size="24" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">静态：300 mA</text>
<text x="96" y="480" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">8 cm 总电阻 77.71 mΩ</text>
<text x="96" y="516" font-size="24" fill="#3d6b4a" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">压降 = 23.31 mV</text>
<rect x="530" y="400" width="400" height="150" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<rect class="ink-echo" x="530" y="400" width="400" height="150" rx="6" stroke="#37424e" stroke-width="2" fill="none" opacity="0.32" transform="translate(1.11 -0.68) rotate(0.06 730.0 475.0)"/>
<text x="556" y="440" font-size="24" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">电流升至：1 A</text>
<text x="556" y="480" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">同一条 77.71 mΩ 路径</text>
<text x="556" y="516" font-size="24" fill="#a8321f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">电阻压降 = 77.71 mV</text>
<text x="70" y="620" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">这是单程电阻压降；地回路压降要另算。</text>
<text x="70" y="654" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">快速电流变化还叠加 L·di/dt；线宽同时核压降与温升。</text>
</svg>
