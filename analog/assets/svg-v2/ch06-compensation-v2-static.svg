<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">补偿电容同时约束带宽与斜率</title>
<desc id="figDesc">示意：固定跨导与可用充电电流；简化两级模型，不代表任意运放。</desc>
<metadata id="visual-timeline">{&quot;duration&quot;: 12, &quot;beats&quot;: [{&quot;name&quot;: &quot;条件&quot;, &quot;start&quot;: 0, &quot;end&quot;: 3, &quot;caption&quot;: &quot;30 pF：GBW 1 MHz，SR 0.5 V/µs。&quot;}, {&quot;name&quot;: &quot;变化&quot;, &quot;start&quot;: 3, &quot;end&quot;: 6, &quot;caption&quot;: &quot;保持 gm 与 15 µA 电流，逐渐加大电容。&quot;}, {&quot;name&quot;: &quot;比较&quot;, &quot;start&quot;: 6, &quot;end&quot;: 9, &quot;caption&quot;: &quot;60 pF：带宽与斜率都降为原来一半。&quot;}, {&quot;name&quot;: &quot;结论&quot;, &quot;start&quot;: 9, &quot;end&quot;: 12, &quot;caption&quot;: &quot;稳定性还要查其余极点与负载，不能只看 Cc。&quot;}]}</metadata>
<!-- 节拍：条件、变化、比较、结论；总时长 12s；单次播放 -->

