<svg xmlns="http://www.w3.org/2000/svg" width="800" height="680" viewBox="0 -156 800 680" role="img" font-family="ui-monospace, Consolas, monospace" data-snapshot-time="9">
  <title>Modbus RTU 用静默划帧界：帧与帧之间至少 3.5 个字符时间，帧内间隙超过 1.5 个字符时间就判这帧坏了。</title>
  <desc>字节块按时序亮起：帧间静默满 3.5 字符划界，帧内间隙超过 1.5 字符的帧当场作废。</desc><style>
