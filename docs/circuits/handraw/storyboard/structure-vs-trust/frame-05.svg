 <text x="575.0" y="120.0" font-family="KaiTi" font-size="15" fill="#003153" text-anchor="middle">0e a0</text>
 <text x="575.0" y="152.0" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="middle">数据</text>
 <rect x="617.0" y="92.0" width="62.0" height="42.0" fill="none" stroke="#003153" stroke-width="1.7" rx="3"/>
