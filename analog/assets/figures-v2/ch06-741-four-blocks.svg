<text x="635" y="176" font-size="26" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">偏置网络</text>
<text x="635" y="221" font-size="22" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">为各级设置工作电流</text>
<text x="635" y="271" font-size="22" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">补偿示意：30 pF</text>
<text x="635" y="309" font-size="23" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">15 µA → 0.5 V/µs</text>
<text x="635" y="358" font-size="22" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">A0 = 200000</text>
<text x="635" y="396" font-size="22" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">GBW = 1 MHz</text>
<text x="635" y="434" font-size="22" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">单极点 fp ≈ 5 Hz</text>
<path d="M605 178 Q580.00 178.36 555 178" fill="none" stroke="#37424e" stroke-width="2.5" stroke-dasharray=""/><polygon points="555,178 565,173 565,183" fill="#37424e"/>
<path d="M605 303 Q580.00 302.75 555 303" fill="none" stroke="#37424e" stroke-width="2.5" stroke-dasharray=""/><polygon points="555,303 565,298 565,308" fill="#37424e"/>
<path d="M605 428 Q580.00 427.76 555 428" fill="none" stroke="#37424e" stroke-width="2.5" stroke-dasharray=""/><polygon points="555,428 565,423 565,433" fill="#37424e"/>
<text x="50" y="552" font-size="24" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">CMRR 与 PSRR 受多个内部级影响，不能一项只归一个方框。</text>
<text x="50" y="600" font-size="23" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">尾电流不一定等于补偿电容可用电流；限流不等于不限功耗。</text>
</svg>
