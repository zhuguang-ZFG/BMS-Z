<text x="88" y="344" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="15" fill="#14213d">方向：要不要反向导通？</text>
<text x="88" y="368" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="15" fill="#14213d">压降：0.7 V 能不能接受？</text>
<text x="88" y="392" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="15" fill="#14213d">失效：坏了会怎样？</text>
