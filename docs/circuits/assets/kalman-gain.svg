  <polyline class="liner" points="88.0,275.6 99.1,324.1 110.2,344.3 121.2,354.9 132.3,361.4 143.4,365.5 154.5,368.3 165.5,370.2 176.6,371.6 187.7,372.6 198.8,373.4 209.8,373.9 220.9,374.3 232.0,374.6 243.1,374.8 254.2,375.0 265.2,375.1 276.3,375.2 287.4,375.3 298.5,375.3 309.5,375.4 320.6,375.4 331.7,375.4 342.8,375.4 353.8,375.5 364.9,375.5 376.0,375.5 387.1,375.5 398.2,375.5 409.2,375.5 420.3,375.5 431.4,375.5 442.5,375.5 453.5,375.5 464.6,375.5 475.7,375.5 486.8,375.5 497.8,375.5 508.9,375.5 520.0,375.5" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline class="lineg" points="88.0,218.4 99.1,266.0 110.2,270.0 121.2,270.4 132.3,270.4 143.4,270.4 154.5,270.4 165.5,270.4 176.6,270.4 187.7,270.4 198.8,270.4 209.8,270.4 220.9,270.4 232.0,270.4 243.1,270.4 254.2,270.4 265.2,270.4 276.3,270.4 287.4,270.4 298.5,270.4 309.5,270.4 320.6,270.4 331.7,270.4 342.8,270.4 353.8,270.4 364.9,270.4 376.0,270.4 387.1,270.4 398.2,270.4 409.2,270.4 420.3,270.4 431.4,270.4 442.5,270.4 453.5,270.4 464.6,270.4 475.7,270.4 486.8,270.4 497.8,270.4 508.9,270.4 520.0,270.4" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="doty" r="6" cx="88.0" cy="218.5"><animate attributeName="cx" values="88.0;99.1;110.2;143.4;198.8;520.0;520.0" keyTimes="0;0.1667;0.3333;0.5000;0.6667;0.8333;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="218.5;292.3;308.0;313.7;313.8;313.8;313.8" keyTimes="0;0.1667;0.3333;0.5000;0.6667;0.8333;1" dur="12s" repeatCount="indefinite"/></circle>
