  <!-- formula: Qmin=2.00-s/2; Qavg=2.00 fixed; symmetric spread -->
  <rect class="bg" width="800" height="544"/>
  <rect class="bms-marker" aria-hidden="true" x="18.0" y="17.1" width="350.0" height="17.3" rx="3.8" transform="rotate(-.5 18.0 25.8)"/><path class="bms-under" aria-hidden="true" d="M24.0 40.0 q 24.0 -2.4 48.0 0 t 48 0 t 48 0 t 48 0 t 48 0 t 48 0 t 48 0"/><text class="title" x="24" y="32">报平均容量，就是在替最弱的那节说谎（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="128" rx="6"/><g class="bms-doodle" aria-hidden="true" transform="matrix(0.9935352156096949 0.11352433811036843 -0.11352433811036843 0.9935352156096949 746 72)" opacity="0.788889" style="opacity: 0.788889;"><path class="bms-spark-fill" d="M0 -9 L2.3 -2.3 L9 0 L2.3 2.3 L0 9 L-2.3 2.3 L-9 0 L-2.3 -2.3 Z"/></g><g class="bms-doodle" aria-hidden="true" transform="matrix(0.9999922340240476 -0.003941052092326663 0.003941052092326663 0.9999922340240476 710 62)" opacity="0.645455" style="opacity: 0.645455;"><path class="bms-spark-soft" d="M0 -5.5 L1.4 -1.4 L5.5 0 L1.4 1.4 L0 5.5 L-1.4 1.4 L-5.5 0 L-1.4 -1.4 Z"/></g><g class="bms-doodle" aria-hidden="true"><circle class="bms-spark-fill" cx="728.0" cy="81.0" r="1.3"/><circle class="bms-spark-soft" cx="696.0" cy="78.0" r="1.1"/></g>
  <text class="txt" x="40" y="72" opacity="1" style="opacity: 1;">① 极差是 0<tspan class="small">　最弱的也是 2.00 Ah。平均没有撒谎。</tspan></text>
  <text class="txt" x="40" y="98" opacity="1" style="opacity: 1;">② 极差 0.20 Ah<tspan class="small">　最弱 1.90 Ah。你若报 2.00，多报了 0.10。</tspan></text>
  <text class="txt" x="40" y="124" opacity="1" style="opacity: 1;">③ 斜率是 −1/2<tspan class="small">　极差每大 0.10 Ah，可用少 0.05 Ah。直线，不弯。</tspan></text>
  <text class="txt" x="40" y="150" opacity="1" style="opacity: 1;">④ 极差 0.40 Ah<tspan class="small">　可用 1.80 Ah。串联认最弱，不认平均。</tspan></text>
  <rect class="panel" x="24" y="188" width="752" height="304" rx="6"/>
  <text class="small" x="40" y="210">串联可用 Ah（示意）</text>
  <line class="axis" x1="108.0" y1="228.0" x2="108.0" y2="430.0"/>
  <line class="axis" x1="108.0" y1="430.0" x2="730.0" y2="430.0"/>
  <text class="small" x="730.0" y="468.0" text-anchor="end">极差 s = 最大减最小（Ah）</text>
  <line class="grid" x1="108.0" y1="430.0" x2="108.0" y2="436.0"/>
  <text class="small" x="108.0" y="452.0" text-anchor="middle">0</text>
  <line class="grid" x1="384.4" y1="430.0" x2="384.4" y2="436.0"/>
  <text class="small" x="384.4" y="452.0" text-anchor="middle">0.20</text>
  <line class="grid" x1="660.9" y1="430.0" x2="660.9" y2="436.0"/>
  <text class="small" x="660.9" y="452.0" text-anchor="middle">0.40</text>
  <line class="grid" x1="102.0" y1="356.5" x2="108.0" y2="356.5"/>
  <text class="small" x="98.0" y="360.5" text-anchor="end">1.80</text>
  <line class="grid" x1="102.0" y1="283.1" x2="108.0" y2="283.1"/>
  <text class="small" x="98.0" y="287.1" text-anchor="end">2.00</text>
