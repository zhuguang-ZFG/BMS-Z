<rect x="50" y="272" width="900" height="86" rx="6" fill="#f6eedb" stroke="#1f5d7a" stroke-width="2"/>
<rect class="ink-echo" x="50" y="272" width="900" height="86" rx="6" stroke="#1f5d7a" stroke-width="2" fill="none" opacity="0.32" transform="translate(1.49 -0.66) rotate(-0.01 500.0 315.0)"/>
<text x="76" y="310" font-size="24" fill="#1f5d7a" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">两条降额示例（按产品要求另定）</text>
<text x="76" y="344" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">持续结温压在 125 °C 以下；V_DS 峰值压在额定的 80% 以内</text>
<rect x="50" y="372" width="900" height="150" rx="6" fill="#f6eedb" stroke="#a4630f" stroke-width="2"/>
<rect class="ink-echo" x="50" y="372" width="900" height="150" rx="6" stroke="#a4630f" stroke-width="2" fill="none" opacity="0.32" transform="translate(1.52 -0.92) rotate(-0.10 500.0 447.0)"/>
<text x="76" y="410" font-size="24" fill="#a4630f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">测量环节也会骗你：四个自欺现场</text>
<text x="76" y="446" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">20 mm 探头地线环路可能引入振铃，先缩短回路后复测</text>
<text x="76" y="478" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">电流探头与电压通道的延迟差，让损耗积分偏大或偏小</text>
<text x="76" y="510" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">R_DS(on) 要通已知电流四线测；误导通看 V_GS，耐压看 V_DS</text>
