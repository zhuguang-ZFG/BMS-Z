<text x="658" y="252" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" fill="#b45309">Zout：÷(1+Aβ) 压低</text>
<text x="658" y="273" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" fill="#52606d">实例：12.10 TIA——Rf=1MΩ，1µA→1V</text>
</g>

