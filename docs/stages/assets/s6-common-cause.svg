<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="s6-cc-t s6-cc-d">
  <title id="s6-cc-t">两道防线，被同一个原因打穿</title>
  <desc id="s6-cc-d">软件比较与硬件比较器看似两道防线。若两路共用同一路供电、同一个基准或同一条线束，一个原因会同时打穿两条通道；只有各自带供电与基准，冲击才落在一路上，另一路仍然动作。独立性要证明的是没有共用件。</desc>
  <defs>
    <marker id="ar-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path class="head-red" d="M0 0L9 4.5L0 9Z"/>
    </marker>
    <marker id="ar-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path class="head-teal" d="M0 0L9 4.5L0 9Z"/>
    </marker>
    <style>
      text { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #293b3a; }
      .title { font-size: 20px; font-weight: 700; }
      .h { font-size: 15px; font-weight: 700; fill: #293b3a; }
      .body { font-size: 13px; fill: #293b3a; }
      .small { font-size: 12px; fill: #626d65; }
      .accent { fill: #176b73; }
      .green { fill: #377b60; }
      .red { fill: #b84745; }
      .gold { fill: #926717; }
      .card { fill: #fffdf5; stroke: #968d77; stroke-width: 1.4; }
      .note { fill: #e4f0df; stroke: #377b60; stroke-width: 1.2; }
      .strip { fill: #e4f0df; stroke: #377b60; stroke-width: 1.4; }
      .warn { fill: #fbefc7; stroke: #926717; stroke-width: 1.4; }
      .danger { fill: #f6e2df; stroke: #b84745; stroke-width: 1.4; }
      .panel { fill: none; stroke: #968d77; stroke-width: 1.4; stroke-dasharray: 7 5; }
      .leader { stroke: #626d65; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
      .wire { stroke: #293b3a; stroke-width: 2; fill: none; }
      .flow { stroke: #176b73; stroke-width: 2; fill: none; }
      .load { stroke: #926717; stroke-width: 2; fill: none; }
      .leak { stroke: #b84745; stroke-width: 2; fill: none; }
      .ok { stroke: #377b60; stroke-width: 2.4; fill: none; }
      .dot { fill: #176b73; }
      .bolt { fill: #b84745; }
      .strike { stroke: #176b73; stroke-width: 2; fill: none; }
      .head-teal { fill: #176b73; }
      .head-gold { fill: #926717; }
      .head-red { fill: #b84745; }
      @media (prefers-color-scheme: dark) {
        text { fill: #edf0e5; }
        .title { fill: #edf0e5; }
        .h { fill: #edf0e5; }
        .body { fill: #edf0e5; }
        .small { fill: #b0beb3; }
        .accent { fill: #7ec5c5; }
        .green { fill: #8fc7a2; }
        .red { fill: #f39b91; }
        .gold { fill: #dfbd78; }
        .card { fill: #223333; stroke: #71908c; }
        .note { fill: #293f35; stroke: #8fc7a2; }
        .strip { fill: #293f35; stroke: #8fc7a2; }
        .warn { fill: #453e2b; stroke: #dfbd78; }
        .danger { fill: #483336; stroke: #f39b91; }
        .panel { stroke: #71908c; }
        .leader { stroke: #b0beb3; }
        .wire { stroke: #edf0e5; }
        .flow { stroke: #7ec5c5; }
        .load { stroke: #dfbd78; }
        .leak { stroke: #f39b91; }
        .ok { stroke: #8fc7a2; }
        .dot { fill: #7ec5c5; }
        .bolt { fill: #f39b91; }
        .strike { stroke: #7ec5c5; }
        .head-teal { fill: #7ec5c5; }
        .head-gold { fill: #dfbd78; }
        .head-red { fill: #f39b91; }
      }
    </style>
  </defs>

  <text x="480" y="38" text-anchor="middle" class="title">两道防线，被同一个原因打穿</text>
  <text x="480" y="64" text-anchor="middle" class="small">独立性要证明的是没有共用件，不是把同一件事写两遍</text>

  <rect class="panel" x="40" y="96" width="420" height="276" rx="12"/>
  <text x="56" y="124" class="h accent">共用一个上游</text>
  <rect class="danger" x="56" y="134" width="388" height="44" rx="9"/>
  <text x="70" y="162" class="h red">一个原因：供电塌了、线束磨破</text>
  <path d="M250 178V194" class="leak" marker-end="url(#ar-red)"/>
  <rect class="warn" x="56" y="196" width="388" height="44" rx="9"/>
  <text x="70" y="224" class="h gold">共用件：同一路供电、同一个基准</text>
  <path d="M160 240V262" class="leak" marker-end="url(#ar-red)"/>
  <path d="M340 240V262" class="leak" marker-end="url(#ar-red)"/>
  <rect class="card" x="56" y="268" width="180" height="64" rx="9"/>
  <text x="70" y="296" class="h">软件通道</text>
  <text x="70" y="318" class="small">跟着失效</text>
  <rect class="card" x="264" y="268" width="180" height="64" rx="9"/>
  <text x="278" y="296" class="h">硬件通道</text>
  <text x="278" y="318" class="small">跟着失效</text>
  <path d="M206 290L226 310" class="leak"/>
  <path d="M226 290L206 310" class="leak"/>
  <path d="M414 290L434 310" class="leak"/>
  <path d="M434 290L414 310" class="leak"/>
  <text x="56" y="352" class="small">两道一起失效，等于没有防线</text>

  <rect class="panel" x="500" y="96" width="420" height="276" rx="12"/>
  <text x="516" y="124" class="h accent">各用各的上游</text>
  <rect class="warn" x="516" y="134" width="388" height="44" rx="9"/>
  <text x="530" y="162" class="h gold">同一个原因，只落在一条路上</text>
  <path d="M600 178V262" class="leak" marker-end="url(#ar-red)"/>
  <rect class="danger" x="516" y="268" width="180" height="64" rx="9"/>
  <text x="530" y="296" class="h">软件通道</text>
  <text x="530" y="318" class="small">被打穿</text>
  <text x="740" y="240" class="small green">独立供电、独立基准</text>
  <rect class="note" x="724" y="268" width="180" height="64" rx="9"/>
  <text x="738" y="296" class="h">硬件通道</text>
  <text x="738" y="318" class="small">自己的供电与基准</text>
  <path d="M836 296L843 306L859 284" class="ok"/>
  <text x="516" y="352" class="small">打穿一条，另一条还在</text>

  <rect class="strip" x="40" y="402" width="880" height="48" rx="12"/>
  <text x="480" y="432" text-anchor="middle" class="h green">共用一件，就等于只剩一道防线</text>

  <text x="480" y="486" text-anchor="middle" class="small">独立性不是把同一件事写两遍，是没有共用件；证明靠失效注入</text>
  <text x="480" y="514" text-anchor="middle" class="small">共用件可以是一路供电、一个基准、一条线束，也可以是一处共模干扰</text>
</svg>
