<text x="600" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b">分压公式：从同一股电流开始</text>
<text x="600" y="54" text-anchor="middle" font-size="12.5" fill="#5b666f">适用条件：空载；接负载后须重新计算下臂等效电阻</text>
<line x1="130" y1="270" x2="180" y2="270" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="180" y1="270" x2="210" y2="270" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="360" y1="270" x2="390" y2="270" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><rect x="210" y="243" width="150" height="54" fill="#e2d9cf" stroke="#2a2927" stroke-width="4"/><text x="285" y="225" font-size="32" fill="#2a2927" text-anchor="middle">R1</text><line x1="390" y1="270" x2="420" y2="270" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="420" y1="270" x2="420" y2="440" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="420" y1="440" x2="390" y2="440" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="180" y1="440" x2="210" y2="440" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="360" y1="440" x2="390" y2="440" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><rect x="210" y="413" width="150" height="54" fill="#e2d9cf" stroke="#2a2927" stroke-width="4"/><text x="285" y="395" font-size="32" fill="#2a2927" text-anchor="middle">R2</text><line x1="180" y1="440" x2="130" y2="440" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><text x="80" y="220" font-size="32" fill="#2a2927" text-anchor="start">V</text><text x="420" y="220" font-size="32" fill="#2a2927" text-anchor="middle">Vout</text><line x1="420" y1="270" x2="460" y2="270" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="130" y1="440" x2="130" y2="490" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="100" y1="490" x2="160" y2="490" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="110" y1="505" x2="150" y2="505" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><line x1="120" y1="520" x2="140" y2="520" stroke="#2a2927" stroke-width="4" stroke-dasharray=""/><text x="90" y="600" font-size="28" fill="#2a2927" text-anchor="start">输出开路，无支流</text>
<g data-beat="空载条件" opacity="0"><rect x="70" y="175" width="410" height="470" rx="8" fill="none" stroke="#a4441d" stroke-width="5" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.5s" fill="freeze"/></rect><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="0s" dur="0.45s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="2s" dur="0.4s" fill="freeze"/></g>
<g data-beat="先求电流" opacity="0"><g><text x="487.04" y="210" font-size="30" fill="#2a2927" text-anchor="start">I = V / (R1 + R2)</text><animateTransform attributeName="transform" type="translate" from="0 0" to="0 -5" begin="2.2s" dur="0.5s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/></g><rect x="477.04" y="168" width="660.96" height="62" rx="8" fill="none" stroke="#a4441d" stroke-width="5" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.5s" fill="freeze"/></rect><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="2s" dur="0.45s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="4s" dur="0.4s" fill="freeze"/></g>
<g data-beat="下臂压降" opacity="0"><g><text x="487.04" y="210" font-size="30" fill="#2a2927" text-anchor="start">I = V / (R1 + R2)</text><text x="487.04" y="320" font-size="30" fill="#2a2927" text-anchor="start">Vout = I × R2</text><animateTransform attributeName="transform" type="translate" from="0 0" to="0 -5" begin="4.2s" dur="0.5s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/></g><rect x="477.04" y="278" width="660.96" height="62" rx="8" fill="none" stroke="#a4441d" stroke-width="5" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.2s" dur="0.5s" fill="freeze"/></rect><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="4s" dur="0.45s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="6s" dur="0.4s" fill="freeze"/></g>
<g data-beat="代入消元" opacity="0"><g><text x="487.04" y="210" font-size="30" fill="#2a2927" text-anchor="start">I = V / (R1 + R2)</text><text x="487.04" y="320" font-size="30" fill="#2a2927" text-anchor="start">Vout = I × R2</text><text x="487.04" y="430" font-size="30" fill="#2a2927" text-anchor="start">Vout = V × R2 / (R1 + R2)</text><text x="487.04" y="540" font-size="30" fill="#2a2927" text-anchor="start">空载成立；带载重新列式</text><animateTransform attributeName="transform" type="translate" from="0 0" to="0 -5" begin="6.2s" dur="0.5s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/></g><rect x="477.04" y="388" width="660.96" height="62" rx="8" fill="none" stroke="#a4441d" stroke-width="5" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="6.2s" dur="0.5s" fill="freeze"/></rect><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="6s" dur="0.45s" fill="freeze"/></g>
<rect x="24" y="836" width="1152" height="34" rx="9" fill="#f7eedb" stroke="#c9bb9d" stroke-width="1.2"/>
<g data-caption="空载条件" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="0s" dur="0.2s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="1.8s" dur="0.2s" fill="freeze"/><text x="600" y="860" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f5d7a">输出不抽取电流，串联两电阻中的电流相同。</text></g>
<g data-caption="先求电流" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="2s" dur="0.2s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="3.8s" dur="0.2s" fill="freeze"/><text x="600" y="860" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f5d7a">把两只串联电阻相加，先求 I。</text></g>
<g data-caption="下臂压降" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="4s" dur="0.2s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="5.8s" dur="0.2s" fill="freeze"/><text x="600" y="860" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f5d7a">Vout 是 R2 上的压降，用欧姆定律。</text></g>
<g data-caption="代入消元" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="6s" dur="0.2s" fill="freeze"/><text x="600" y="860" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f5d7a">把 I 代入后，Vout = V × R2 / (R1 + R2)。</text></g>
</svg>
