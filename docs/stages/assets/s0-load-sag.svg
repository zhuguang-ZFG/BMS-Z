<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="ls-t ls-d">
  <title id="ls-t">一拧把，电压为什么分两段掉</title>
  <desc id="ls-d">带载瞬间，电子先在界面外侧重排，形成欧姆压降；电解液里的离子要时间迁移和扩散补位，端电压随后再慢慢往下滑。</desc>
  <defs>
    <marker id="ls-arrow-accent" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path class="head-accent" d="M0 0L9 4.5L0 9Z"/>
    </marker>
    <marker id="ls-arrow-gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path class="head-gold" d="M0 0L9 4.5L0 9Z"/>
    </marker>
    <style>
      text { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #293b3a; }
      .title { font-size: 20px; font-weight: 700; }
      .h { font-size: 15px; font-weight: 700; fill: #293b3a; }
      .body { font-size: 13px; fill: #293b3a; }
      .small { font-size: 13px; fill: #626d65; }
      .tiny { font-size: 12px; fill: #626d65; }
      .muted { fill: #626d65; }
      .accent { fill: #176b73; }
      .green { fill: #377b60; }
      .red { fill: #b84745; }
      .gold { fill: #926717; }
      .paper { fill: #fffdf5; }
      .card { fill: #fffdf5; stroke: #968d77; stroke-width: 1.4; }
      .panel { fill: #e4f0df; stroke: #377b60; stroke-width: 1.6; }
      .panel2 { fill: #fbefc7; stroke: #926717; stroke-width: 1.6; }
      .panel3 { fill: #fffdf5; stroke: #176b73; stroke-width: 1.6; stroke-dasharray: 7 5; }
      .strip { fill: #e4f0df; stroke: #377b60; stroke-width: 1.4; }
      .axis { stroke: #968d77; stroke-width: 1.5; fill: none; }
      .curve { stroke: #176b73; stroke-width: 3; fill: none; stroke-linecap: round; }
      .ref { stroke: #968d77; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
      .leader { stroke: #626d65; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
      .dot { fill: #176b73; }
      .e { fill: #176b73; }
      .ion { fill: #926717; }
      .eflow { stroke: #176b73; stroke-width: 2.4; fill: none; }
      .iflow { stroke: #926717; stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
      .head-accent { fill: #176b73; }
      .head-gold { fill: #926717; }
      @media (prefers-color-scheme: dark) {
        text { fill: #edf0e5; }
        .h { fill: #edf0e5; }
        .body { fill: #edf0e5; }
        .small { fill: #b0beb3; }
        .tiny { fill: #b0beb3; }
        .muted { fill: #b0beb3; }
        .accent { fill: #7ec5c5; }
        .green { fill: #8fc7a2; }
        .red { fill: #f39b91; }
        .gold { fill: #dfbd78; }
        .paper { fill: #223333; }
        .card { fill: #223333; stroke: #71908c; }
        .panel { fill: #293f35; stroke: #8fc7a2; }
        .panel2 { fill: #453e2b; stroke: #dfbd78; }
        .panel3 { fill: #223333; stroke: #7ec5c5; }
        .strip { fill: #293f35; stroke: #8fc7a2; }
        .axis { stroke: #71908c; }
        .curve { stroke: #7ec5c5; }
        .ref { stroke: #71908c; }
        .leader { stroke: #b0beb3; }
        .dot { fill: #7ec5c5; }
        .e { fill: #7ec5c5; }
        .ion { fill: #dfbd78; }
        .eflow { stroke: #7ec5c5; }
        .iflow { stroke: #dfbd78; }
        .head-accent { fill: #7ec5c5; }
        .head-gold { fill: #dfbd78; }
      }
    </style>
  </defs>

  <rect class="paper" x="0" y="0" width="960" height="560"/>

  <text x="480" y="34" text-anchor="middle" class="title">一拧把，电压为什么分两段掉</text>
  <text x="480" y="60" text-anchor="middle" class="small">电子在界面先动，离子在电解液里随后补位</text>

  <rect class="card" x="44" y="90" width="372" height="246" rx="12"/>
  <text x="48" y="140" class="tiny">端电压</text>
  <path d="M92 126V304" class="axis"/>
  <path d="M92 304H392" class="axis"/>
  <text x="380" y="326" class="tiny">时间</text>

  <path d="M92 164H180" class="ref"/>
  <text x="98" y="156" class="tiny">开路电压</text>
  <path d="M118 164H180V216C238 228 298 252 372 270" class="curve"/>
  <circle cx="180" cy="216" r="4" class="dot"/>
  <text x="190" y="202" class="small red">第一段：欧姆</text>
  <text x="246" y="292" class="small gold">第二段：极化</text>
  <path d="M300 274V256" class="leader"/>
  <text x="300" y="240" class="tiny accent">带载后</text>

  <rect class="card" x="436" y="90" width="480" height="246" rx="12"/>
  <text x="456" y="114" class="tiny accent">带载那一拍</text>

  <rect class="panel" x="460" y="130" width="196" height="170" rx="10"/>
  <text x="478" y="156" class="h green">负极（石墨）</text>
  <text x="478" y="180" class="small">电子在这里排队</text>

  <rect class="panel2" x="656" y="130" width="40" height="170" rx="6"/>
  <text x="676" y="122" text-anchor="middle" class="tiny gold">双电层</text>

  <rect class="panel3" x="696" y="130" width="196" height="170" rx="10"/>
  <text x="714" y="156" class="h accent">电解液</text>
  <text x="714" y="180" class="small">锂离子在这里赶路</text>

  <circle cx="500" cy="224" r="6" class="e"/>
  <circle cx="540" cy="224" r="6" class="e"/>
  <circle cx="580" cy="224" r="6" class="e"/>
  <circle cx="620" cy="224" r="6" class="e"/>
  <path d="M492 250H646" class="eflow" marker-end="url(#ls-arrow-accent)"/>
  <text x="500" y="274" class="small accent">电子：瞬间重排</text>

  <circle cx="860" cy="224" r="6" class="ion"/>
  <circle cx="820" cy="224" r="6" class="ion"/>
  <circle cx="780" cy="224" r="6" class="ion"/>
  <circle cx="740" cy="224" r="6" class="ion"/>
  <path d="M868 250H706" class="iflow" marker-end="url(#ls-arrow-gold)"/>
  <text x="748" y="274" class="small gold">离子：要时间补位</text>

  <rect class="strip" x="80" y="372" width="800" height="58" rx="12"/>
  <text x="480" y="396" text-anchor="middle" class="h green">电子先动 → 欧姆压降；离子后动 → 极化压降</text>
  <text x="480" y="418" text-anchor="middle" class="small">所以端电压先陡掉一截，再慢慢往下滑</text>

  <text x="480" y="458" text-anchor="middle" class="tiny">两段紧接着发生，不是两次独立事件</text>
  <text x="480" y="540" text-anchor="middle" class="tiny">示意图：把带载压降拆成两段看，不是某颗电芯的实测曲线</text>
</svg>
