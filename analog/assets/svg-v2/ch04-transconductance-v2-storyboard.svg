<text x="36" y="430" font-size="20" fill="#2a2927" text-anchor="start">① 平方律示意：ID = 5 (VGS − 2)²，单位 A。</text>
<text x="36" y="476" font-size="20" fill="#2a2927" text-anchor="start">② Q 点 3 V / 5 A，导数 gm = 10 S。</text>
<text x="36" y="522" font-size="20" fill="#2a2927" text-anchor="start">③ 切线外推的 2.5 V 截距，不是阈值 2 V。</text>
<text x="36" y="568" font-size="20" fill="#2a2927" text-anchor="start">④ 过驱动 = 2ID/gm = 1 V，故 VGS = 3 V。</text>
<text x="36" y="620" font-size="20" fill="#2a2927" text-anchor="start">平台高度应对应实际负载下的转移或栅电荷曲线。</text>
<text x="36" y="670" font-size="20" fill="#2a2927" text-anchor="start">长沟道公式不能替代真实功率 MOSFET 的数据。</text>
</svg>