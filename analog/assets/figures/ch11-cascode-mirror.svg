<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">两只管子的两种叠法：cascode 叠罗汉与电流镜复印</title>
<desc id="figDesc">左图把共射管与共基管上下叠成 cascode，输出电阻抬到 g_m r_o 平方量级，代价是多花 0.3 至 0.5 伏电压余量。右图用两只匹配管构成电流镜，相同的 V_BE 让输出电流复制参考电流，误差来自基极电流分流与 Early 效应。共同点是用晶体管替代大电阻。</desc>
<rect width="960" height="640" fill="#fffdf8"/>
<text x="36" y="46" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="28" font-weight="700" fill="#14213d">两只管子的两种叠法</text>
<text x="36" y="76" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="15" fill="#52606d">叠罗汉抬输出电阻，复印机复制电流；共同点是拿管子换电阻。</text>
<line x1="36" y1="94" x2="924" y2="94" stroke="#14213d" stroke-width="2"/>

