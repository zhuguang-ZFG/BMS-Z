  <rect class="bms-sticker" aria-hidden="true" x="24" y="352" width="752" height="44" rx="10"/>
  <text class="txt" x="40" y="370">同一笔标定回看：R0 30.20 对 30.00 mΩ、R1 19.82 对 20.00 mΩ、τ 360 对 300 s——参数个个拟对，输的是结构。</text>
  <text class="small" x="40" y="388">总体 RMSE 会把两端的错摊进平台区里；分窗口报数，错才藏不住。</text>
</svg>
