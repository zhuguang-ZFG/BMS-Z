      .bg { fill: #192727; }
      .panel { fill: #223333; stroke: #496160; }
      .txt, .title { fill: #edf0e5; }
      .small { fill: #b0beb3; }
      .hi { fill: #7ec5c5; }
      .warn { fill: #f39b91; }
      .gold { fill: #dfbd78; }
      .cell { fill: #293f35; stroke: #7ec5c5; }
      .charge { fill: #7ec5c5; }
      .axis { stroke: #b0beb3; }
      .grid { stroke: #496160; }
      .lineb { stroke: #7ec5c5; }
      .liner { stroke: #f39b91; }
      .dot { fill: #dfbd78; stroke: #192727; }
    }
  </style><style id="bms-motion">
    /* bms-motion: 手帐式动效注记（纯装饰，不改技术几何与既有 SMIL 时序） */
    .bms-marker { fill: #fbefc7; opacity: .78; }
    .bms-under { fill: none; stroke: #926717; stroke-width: 2.4; stroke-linecap: round; opacity: .9; }
    .bms-spark-line { fill: none; stroke: #926717; stroke-width: 1.9; stroke-linecap: round; }
    .bms-spark-fill { fill: #926717; }
    .bms-spark-soft { fill: #176b73; opacity: .8; }
    .bms-sticker { fill: none; stroke: #926717; stroke-width: 2; stroke-dasharray: 7 5; stroke-linecap: round; opacity: .85; }
    .bms-halo { fill: none; stroke: #926717; stroke-width: 2; }
    .bms-marker, .bms-under, .bms-sticker, .bms-halo,
    .bms-spark, .bms-success, .bms-doodle { pointer-events: none; }
    circle:has(&gt; animateMotion) { filter: drop-shadow(0 0 2px rgba(146,103,23,.5)) drop-shadow(0 0 5px rgba(196,145,52,.45)); }
    rect:has(&gt; animateMotion) { filter: drop-shadow(0 0 3px rgba(196,145,52,.75)); }
    g:has(&gt; circle):has(&gt; path.stroke-check) { filter: drop-shadow(0 0 5px rgba(55,123,96,.5)); }
    @media (prefers-color-scheme: dark) {
      .bms-marker { fill: #453e2b; opacity: .85; }
      .bms-under { stroke: #dfbd78; }
      .bms-spark-line { stroke: #dfbd78; }
      .bms-spark-fill { fill: #dfbd78; }
      .bms-spark-soft { fill: #7ec5c5; }
      .bms-sticker { stroke: #dfbd78; }
      .bms-halo { stroke: #dfbd78; }
      circle:has(&gt; animateMotion) { filter: drop-shadow(0 0 2px rgba(223,189,120,.8)) drop-shadow(0 0 7px rgba(223,189,120,.9)); }
      rect:has(&gt; animateMotion) { filter: drop-shadow(0 0 6px rgba(223,189,120,.8)); }
      g:has(&gt; circle):has(&gt; path.stroke-check) { filter: drop-shadow(0 0 6px rgba(143,199,162,.7)); }
    }
    @media (prefers-reduced-motion: reduce) { .bms-spark, .bms-success, .bms-doodle { display: none; } }
</style>
  <rect class="bg" width="800" height="550"/>
  <rect class="bms-marker" aria-hidden="true" x="18.0" y="14.0" width="406.0" height="30.2" rx="6.7" transform="rotate(-.5 18.0 29.1)"/><path class="bms-under" aria-hidden="true" d="M24.0 48.0 q 24.0 -2.4 48.0 0 t 48 0 t 48 0 t 48 0 t 48 0 t 48 0 t 48 0 t 48 0"/><text class="title" x="24" y="40">没充电，电量显示怎么还涨了？</text>
  <text class="small" x="24" y="68">100 Ah · 初始 50% · 教学假设：忽略自放电与静态耗电</text>

  <rect class="panel" x="24" y="92" width="364" height="182" rx="12"/>
  <text class="txt label" x="46" y="126">电池里实际剩余</text>
  <rect class="cell" x="86" y="144" width="24" height="8" rx="2"/>
  <rect class="cell" x="64" y="152" width="68" height="92" rx="7"/>
  <path class="charge" d="M66 198 H130 V237 Q130 242 125 242 H71 Q66 242 66 237 Z"/>
  <path class="lineb" d="M66 198 H130"/>
  <text class="small" x="98" y="263" text-anchor="middle">液面示意</text>
  <text class="txt big hi" x="162" y="219">50%</text>
  <text class="txt" x="166" y="259">始终不变</text>

  <rect class="panel" x="412" y="92" width="364" height="182" rx="12"/>
  <text class="txt label" x="436" y="126">屏幕上的估算</text>
  <text class="txt" x="436" y="165">24h后显示</text>
  <text class="txt big warn" x="436" y="237">52.4%</text>

  <text class="txt caption" x="400" y="312" text-anchor="middle">电流计把 0 A 误读成 <tspan class="warn">+0.1 A</tspan></text>

  <path class="grid" d="M112 354 H664 M112 405 H664 M112 456 H664"/>
  <path class="axis" d="M112 344 V470 H676"/>
  <text class="txt" x="98" y="361" text-anchor="end">52.4%</text>
  <text class="txt" x="98" y="412" text-anchor="end">51.2%</text>
  <text class="txt" x="98" y="463" text-anchor="end">50%</text>
  <path class="lineb" d="M112 456 H664"/>
  <path class="liner" d="M112 456 L664 354" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="0px" style="stroke-dashoffset: 0px;">

  </path>
  <circle class="dot" r="6" cx="664" cy="354">


  </circle>
  <text class="txt" x="112" y="490" text-anchor="middle">0 h</text>
  <text class="txt" x="388" y="490" text-anchor="middle">12 h</text>
  <text class="txt" x="664" y="490" text-anchor="middle">24 h</text>
  <text class="txt warn" x="684" y="361">估算</text>
  <text class="txt hi" x="684" y="463">真实</text>

  <text class="title conclusion gold" x="400" y="531" text-anchor="middle">增加的是记录，不是电</text>
