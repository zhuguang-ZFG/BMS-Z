    <text x="460" y="74" text-anchor="middle" font-size="14" font-weight="bold" class="warn">平台区放大看（SOC 30% → 70%）</text>
    <text x="460" y="96" text-anchor="middle" font-size="13" class="warn">电压只从 3.28V 爬到 3.31V —— 40% 的 SOC 变化，</text>
    <text x="460" y="116" text-anchor="middle" font-size="13" class="warn">电压只动 30mV，而采样噪声就有 2–5mV！</text>
  <rect class="bms-sticker" aria-hidden="true" x="270.0" y="50.0" width="380.0" height="86.0" rx="8" transform="rotate(-.45 460.0 93.0)"/><g class="bms-spark" aria-hidden="true" transform="translate(634.0 66.0)"><animateTransform attributeName="transform" type="rotate" values="-8;9;-8" keyTimes="0;0.5;1" dur="4.8s" repeatCount="indefinite" additive="sum"/><animate attributeName="opacity" values="0.55;1;0.55" keyTimes="0;0.5;1" dur="3.2s" repeatCount="indefinite"/><path class="bms-spark-fill" d="M0 -9 L2.3 -2.3 L9 0 L2.3 2.3 L0 9 L-2.3 2.3 L-9 0 L-2.3 -2.3 Z"/></g></g>

  
  <circle r="7" stroke-width="2" opacity="0" class="fill-r stroke-check">
    <animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="0;0;1;1" keyTimes="0;0.52;0.56;1" dur="8s" repeatCount="indefinite" />
    <animateMotion keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.56;0.94;1" path="M260,249 C400,246 560,245 620,245" />
  </circle>

  <text x="400" y="418" text-anchor="middle" font-size="14" class="small">结论：LFP 平台区纯电压法基本失效 → 必须上"积分 + 滤波融合"（见 EKF 动画）</text>
