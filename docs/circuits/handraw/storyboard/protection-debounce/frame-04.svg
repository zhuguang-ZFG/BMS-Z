<text x="44" y="98" font-family="Microsoft YaHei" font-size="14" text-anchor="start" fill="#003153" opacity="0.8" font-weight="normal">同一条波形驱动计时与开关；先躲过毛刺，再判断是否达到动作条件。</text>
