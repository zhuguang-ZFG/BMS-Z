<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1448 1086" role="img" aria-labelledby="title desc" data-print-width-mm="138" data-composition="technical-overlay-v1" data-base-medium="python-svg"><title id="title">串扰、差分失配与级联</title><desc id="desc">双对数频率轴上两条 20dB/十倍频泄漏线：10kΩ 在 100kHz 为 −50dB、600Ω 压到 −65dB 以下；另标差分失配 10Ω 得 60dB 与每十倍频 20dB 的斜率。</desc><rect width="1448" height="1086" fill="#e2d9cf" /><g id="paper-illustration"><path d="M68,206 L631.6,204 L1381,207 L1384,605.28 L1381,906 L565.6,908 L64,904 Z" fill="#f6f2ed" stroke="#c4b9ab" stroke-width="1.4" /><path d="M70,208L1377,209" fill="none" stroke="#ffffff" stroke-width="2" opacity=".7" /><path d="M82,218 L1368,220 L1370,892 L84,894 Z" fill="none" stroke="#c4b9ab" stroke-width="2" opacity=".55" />
<line x1="190" y1="830" x2="1340" y2="830" stroke="#c4b9ab" stroke-width="3" stroke-dasharray="" /><polygon points="1340,830 1327.0,823.0 1327.0,837.0" fill="#c4b9ab" />
<line x1="190" y1="830" x2="190" y2="238" stroke="#c4b9ab" stroke-width="3" stroke-dasharray="" /><polygon points="190,238 183.0,251.0 197.0,251.0" fill="#c4b9ab" />
<polyline points="190,760 420,670 650,580 880,490 1110,400 1320,330" fill="none" stroke="#a8321f" stroke-width="5" stroke-dasharray="" />
<polyline points="190,790 420,710 650,630 880,550 1110,470 1320,400" fill="none" stroke="#1f5d7a" stroke-width="5" stroke-dasharray="" /></g><g id="technical-overlay"><text x="72" y="92" fill="#2a2927" font-size="50" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">串扰看源阻，级联看漏流</text>
<text x="74" y="146" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">同一张频率轴上，源阻降下来泄漏就降；树形扩展的极限不在导通电阻。</text>
<text x="760" y="884" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#f6f2ed">频率（对数轴，1k→2MHz）</text>
<text x="132" y="520" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#f6f2ed">泄漏比（dB）</text>
<text x="1020" y="250" fill="#a8321f" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">10kΩ：−50dB@100kHz</text>
<text x="1020" y="294" fill="#1f5d7a" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">600Ω：−65dB 以下</text>
<text x="640" y="470" fill="#a4441d" font-size="32" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">100kHz：3mV</text>
<text x="820" y="660" fill="#a4441d" font-size="32" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">每十倍频 20dB</text>
<text x="710" y="790" fill="#a4441d" font-size="32" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">差分失配 10Ω → 60dB</text>
<path data-paper-shadow="true" transform="translate(8 12)" d="M68,988 L631.6,986 L1381,989 L1384,1030.46 L1381,1062 L565.6,1064 L64,1060 Z" fill="#535453" opacity="0.08" /><path data-paper-shadow="true" transform="translate(4 7)" d="M68,988 L631.6,986 L1381,989 L1384,1030.46 L1381,1062 L565.6,1064 L64,1060 Z" fill="#535453" opacity="0.12" /><path data-paper-shadow="true" transform="translate(2 3)" d="M68,988 L631.6,986 L1381,989 L1384,1030.46 L1381,1062 L565.6,1064 L64,1060 Z" fill="#535453" opacity="0.15" /><path d="M68,988 L631.6,986 L1381,989 L1384,1030.46 L1381,1062 L565.6,1064 L64,1060 Z" fill="#f6f2ed" stroke="#c4b9ab" stroke-width="1.4" /><path d="M70,990L1377,991" fill="none" stroke="#ffffff" stroke-width="2" opacity=".7" />
<text x="92" y="1036" fill="#2a2927" font-size="33" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">串扰预算最可控的变量是源阻；两层以上该买高通道数器件，或每层先缓冲。</text></g></svg>
