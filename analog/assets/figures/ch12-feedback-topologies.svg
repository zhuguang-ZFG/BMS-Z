<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">负反馈四种拓扑对照：采样 × 混合决定稳定哪个量与阻抗方向</title>
<desc id="figDesc">四格对照图：行是输出采样（上排电压、下排电流），列是输入混合（左列串联比压、右列并联比流）。左上电压串联：同相放大器小电路，反馈经 R2/R1 分压从输出并联取样、与输入串联比压，钉死电压增益 Av=1+R2/R1，输入阻抗乘 (1+Aβ) 推高、输出阻抗压低，实例 Av=6（±0.5V→±3V）。右上电压并联：跨阻放大器 TIA 小电路，光电流灌进虚地、Rf 回送，钉死跨阻 −Rf，两种阻抗都压低，实例 Rf=1MΩ 时 1µA 变 1V。左下电流串联：运放加三极管射极电阻 RE 的恒流源，钉死跨导 Iout/Vin≈1/RE，两种阻抗都推高，实例是 3.5 节发射极电阻稳 IC。右下电流并联：输出电流经 Rs 串联取样、If 并联灌回输入节点，钉死电流增益 Ai，输入阻抗压低、输出阻抗推高。底部口诀：想稳电压就采样电压、想稳电流就采样电流；算例 A=1000、β=0.1 时 1+Aβ≈101，阻抗被推高 101 倍或压到 1/101。</desc>
<rect width="960" height="640" fill="#fffdf8"/>

<defs>
<marker id="arrowInk" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 z" fill="#14213d"/></marker>
</defs>

<text x="36" y="46" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="27" font-weight="700" fill="#14213d">负反馈四种拓扑：稳定什么，就采样什么</text>
<text x="36" y="74" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="14" fill="#52606d">输出采样（电压/电流）× 输入混合（串联/并联）＝ 2×2 全展开；阻抗都被同一只 (1+Aβ) 推，方向由格子决定</text>
<line x1="36" y1="92" x2="924" y2="92" stroke="#14213d" stroke-width="2"/>

<text x="256" y="105" text-anchor="middle" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="12" fill="#52606d">输入混合：串联比压</text>
<text x="704" y="105" text-anchor="middle" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="12" fill="#52606d">输入混合：并联比流</text>
<text x="20" y="221" text-anchor="middle" transform="rotate(-90 20 221)" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="12" fill="#52606d">输出采样：电压</text>
<text x="20" y="449" text-anchor="middle" transform="rotate(-90 20 449)" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="12" fill="#52606d">输出采样：电流</text>

