<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-label="模型给候选，程序做判定，隐藏检查守门，人签字；跳过中间两步直接下发会失去复算与追责">
  <title>模型、程序、隐藏检查与人工签字的四步链</title>
  <desc>四张卡片从左到右依次为模型给候选、程序做确定性判定、隐藏检查验证边界、人工签字。下方虚线表示模型输出直接下发的危险支路，它跳过程序与隐藏检查，结果无法复算，也无法追责。</desc>
  <style>
    .bg { fill: #fffdf5; }
    .ink { fill: #293b3a; }
    .muted { fill: #626d65; }
    .model { fill: #eee5f1; stroke: #7c648e; }
    .program { fill: #e4f0df; stroke: #377b60; }
    .gate { fill: #f6e2df; stroke: #b84745; }
    .human { fill: #fbefc7; stroke: #926717; }
    .card { stroke-width: 2.4; }
    .title { font: 700 18px "Noto Sans SC", "Microsoft YaHei", sans-serif; }
    .head { font: 700 15px "Noto Sans SC", "Microsoft YaHei", sans-serif; }
    .body { font: 13px "Noto Sans SC", "Microsoft YaHei", sans-serif; }
    .small { font: 12px "Noto Sans SC", "Microsoft YaHei", sans-serif; }
    .num { font: 700 14px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #fffdf5; }
    .purple-text { fill: #736085; }
    .green-text { fill: #36775e; }
    .red-text { fill: #ad4644; }
    .gold-text { fill: #8e6518; }
    .sketch { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #192727; }
      .ink { fill: #edf0e5; }
      .muted { fill: #b0beb3; }
      .model { fill: #392f40; stroke: #c3a8cf; }
      .program { fill: #293f35; stroke: #8fc7a2; }
      .gate { fill: #483336; stroke: #f39b91; }
      .human { fill: #453e2b; stroke: #dfbd78; }
      .purple-text { fill: #d4bde0; }
      .green-text { fill: #8fc7a2; }
      .red-text { fill: #f39b91; }
      .gold-text { fill: #dfbd78; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#626d65"/>
    </marker>
    <marker id="danger-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#b84745"/>
    </marker>
  </defs>

  <rect class="bg" width="1000" height="440"/>
  <path d="M24 39 C117 32 211 44 305 36" class="sketch" stroke="#176b73" stroke-width="3" opacity=".8"/>
  <text x="24" y="32" class="title ink">候选到签字，中间有两道硬门</text>
  <text x="24" y="58" class="body muted">模型负责排序；程序负责复算；隐藏检查负责把边界错误拦下来；人承担最后责任。</text>

  <g transform="translate(35 92)">
    <rect width="205" height="190" rx="14" class="model card"/>
    <circle cx="30" cy="32" r="17" fill="#7c648e"/><text x="30" y="37" text-anchor="middle" class="num">1</text>
    <text x="57" y="37" class="head purple-text">模型 · 给候选</text>
    <text x="22" y="78" class="body ink">读日志与原文</text>
    <text x="22" y="106" class="body ink">按可能性排序</text>
    <text x="22" y="134" class="body ink">每条附「看哪一行」</text>
    <text x="22" y="165" class="small muted">不写保护点，不替人下结论</text>
  </g>

  <line x1="246" y1="187" x2="278" y2="187" stroke="#626d65" stroke-width="2.2" marker-end="url(#arrow)"/>

  <g transform="translate(285 92)">
    <rect width="205" height="190" rx="14" class="program card"/>
    <circle cx="30" cy="32" r="17" fill="#377b60"/><text x="30" y="37" text-anchor="middle" class="num">2</text>
    <text x="57" y="37" class="head green-text">程序 · 做判定</text>
    <text x="22" y="78" class="body ink">校验与单位换算</text>
    <text x="22" y="106" class="body ink">越限比较</text>
    <text x="22" y="134" class="body ink">同样输入，同样输出</text>
    <text x="22" y="165" class="small muted">结论能复算，结果能重放</text>
  </g>

  <line x1="496" y1="187" x2="528" y2="187" stroke="#626d65" stroke-width="2.2" marker-end="url(#arrow)"/>

  <g transform="translate(535 92)">
    <rect width="205" height="190" rx="14" class="gate card"/>
    <circle cx="30" cy="32" r="17" fill="#b84745"/><text x="30" y="37" text-anchor="middle" class="num">3</text>
    <text x="57" y="37" class="head red-text">隐藏检查 · 守门</text>
    <text x="22" y="78" class="body ink">坏 CRC 计数</text>
    <text x="22" y="106" class="body ink">嵌套好帧与二进制载荷</text>
    <text x="22" y="134" class="body ink">64 字节边界</text>
    <text x="22" y="165" class="small muted">可见全绿，隐藏全红：打回</text>
  </g>

  <line x1="746" y1="187" x2="778" y2="187" stroke="#626d65" stroke-width="2.2" marker-end="url(#arrow)"/>

  <g transform="translate(785 92)">
    <rect width="180" height="190" rx="14" class="human card"/>
    <circle cx="30" cy="32" r="17" fill="#926717"/><text x="30" y="37" text-anchor="middle" class="num">4</text>
    <text x="57" y="37" class="head gold-text">人 · 签字</text>
    <text x="22" y="78" class="body ink">谁</text>
    <text x="22" y="106" class="body ink">依据哪段原文</text>
    <text x="22" y="134" class="body ink">哪天 · 哪版配置</text>
    <text x="22" y="165" class="small muted">签字记录留档</text>
  </g>

  <path d="M135 300 C260 390 728 390 875 300" class="sketch" stroke="#b84745" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#danger-arrow)"/>
  <g transform="translate(440 330)">
    <path d="M0 0 L34 34 M34 0 L0 34" class="sketch" stroke="#b84745" stroke-width="4"/>
    <text x="50" y="14" class="head red-text">模型输出直接下发</text>
    <text x="50" y="38" class="small muted">跳过程序和隐藏检查，出错后既不能复算，也找不到谁定的</text>
  </g>

  <path d="M30 410 C226 417 420 403 614 412 S838 414 970 408" class="sketch" stroke="#926717" stroke-width="2.2" opacity=".7"/>
  <text x="500" y="431" text-anchor="middle" class="small muted">测试全绿只是当前门槛；第三步不过，第四步不签。</text>
</svg>
