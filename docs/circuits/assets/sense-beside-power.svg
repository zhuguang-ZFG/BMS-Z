<svg xmlns="http://www.w3.org/2000/svg" width="800" height="680" viewBox="0 -156 800 680" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>采样线对照：成对紧贴并远离功率回路时读数稳住；贴着粗铜走时读数在示例的 3.65 V 与 3.78 V 之间跳。示意图，不是实测频谱。</title>
  <desc>黄点沿功率铜皮走动。远离采样时读数停在 3.712 V；贴着走时在 3.65 V 和 3.78 V 之间跳。示意图，不是实测频谱。</desc>
  <style>
