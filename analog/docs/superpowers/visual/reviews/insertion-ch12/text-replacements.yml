- id: ch12-integrator-cycle-v2
  source: docs/p2-02-ch12.md#12.11
  before: '**算一笔**：$RC=10k\times10n=100\mu s$。半周期 $T/2=500\mu s$ → 输出摆幅 $\Delta v = \dfrac{1V\times500\mu s}{100\mu s}=\mathbf{5V}$，这就是**峰峰值 5Vpp**，不是峰值 5V。前面的初始条件给出 $0\to-5\to0V$；若把均值移到 0，则是 ±2.5V。想得到以 0 为中心的 ±2V（4Vpp），应取 $RC=125\mu s$；$RC=250\mu s$ 则得到 2Vpp。理想积分器的直流中心由初始条件决定，实际电路还要考虑泄放与偏置；**斜率 = $v_{in}/RC$，与频率无关、只与输入幅度和 $RC$ 有关**。所以积分器天生是个"频率越低、输出越大"的低通（增益 $1/\omega RC$，−20dB/十倍频）。'
  after: 这是 5 Vpp，初值零给出 $0\to-5\to0V$；若调整直流中心为零，则是 ±2.5 V。要得到 ±2 V，即 4 Vpp，应取 $RC=125\mu s$；$RC=250\mu s$ 得到 2 Vpp。输入幅度与 RC 相同，斜率不随频率改变，但半周期持续时间改变，所以峰峰值随频率反比变化。
  caption: 恒流改变斜率，初值决定直流中心。四拍按图示模型计算，参数与线型见图。
  removed_prose_chars: 212
  relationship: replaces-text
- id: ch12-sc-charge-v2
  source: docs/p2-02-ch12.md#12.12a
  before: '> **为什么**：硅片上电阻做不准，开关电容却把"电阻"做准了。它不真造电阻，而是让电容按节拍一包包搬电荷：搬多大由电容比值定，搬多快由晶振定，两头恰好都是芯片里最准的东西。

    >

    > 「精度来源从"造准元件"变成"造准时钟"」管的正是这次偷梁换柱。但搬运天生是一包一包的，连续电阻才是细水长流，所以它逃不开采样系统的一切毛病。'
  after: 平均电阻关系只描述低频或慢变输入下的净搬运。图中每10μs完成一个周期，四个周期累计4pC；真实电流脉冲的形状取决于导通电阻、驱动阻抗和建立时间，不能用平均直线代替其峰值电流预算。
  caption: 平均电流来自每周期搬运的电荷。四拍按图示模型计算，参数与线型见图。
  removed_prose_chars: 70
  relationship: replaces-text
- id: ch12-sc-settling-v2
  source: docs/p2-02-ch12.md#12.12b
  before: '- **建立时间**：每个半周期都要建立到 $1/2^N$ 精度。和 SAR 的电荷桶是同一笔账：$\ge N\ln2$ 个时间常数，见 [13.6](p2-03-ch13.md#sec136)。'
  after: 示意 12 bit 时，一 LSB 约需 $8.318\tau$，半 LSB 约需 $9.011\tau$。实际可用建立时间还需扣除非重叠、转换及其他时序开销；高阶闭环、压摆和开关注入不能统一塞进一个 RC 时间常数。建立残差也只是总误差预算的一部分。
  caption: 半 LSB 要比一 LSB 多一个 ln2。四拍按图示模型计算，参数与线型见图。
