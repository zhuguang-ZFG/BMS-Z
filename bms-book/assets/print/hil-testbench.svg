      .bms-halo { stroke: #dfbd78; }
      circle:has(&gt; animateMotion) { filter: drop-shadow(0 0 2px rgba(223,189,120,.8)) drop-shadow(0 0 7px rgba(223,189,120,.9)); }
      rect:has(&gt; animateMotion) { filter: drop-shadow(0 0 6px rgba(223,189,120,.8)); }
      g:has(&gt; circle):has(&gt; path.stroke-check) { filter: drop-shadow(0 0 6px rgba(143,199,162,.7)); }
    }
    @media (prefers-reduced-motion: reduce) { .bms-spark, .bms-success, .bms-doodle { display: none; } }
</style>
<rect class="bg" x="0" y="-156" width="800" height="726"/><rect class="bms-marker" aria-hidden="true" x="18.0" y="-142.9" width="355.1" height="17.3" rx="3.8" transform="rotate(-.5 18.0 -134.2)"/><path class="bms-under" aria-hidden="true" d="M24.0 -119.0 q 24.0 -2.4 48.0 0 t 48 0 t 48 0 t 48 0 t 48 0 t 48 0 t 48 0"/><text class="title" x="24" y="-128" opacity="1" style="opacity: 1;">HIL 测试台：把"危险实验"搬到桌面上安全地做</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6"/><g class="bms-doodle" aria-hidden="true" transform="matrix(0.9989171118547928 0.046525301113258394 -0.046525301113258394 0.9989171118547928 746 -88)" opacity="1" style="opacity: 1;"><path class="bms-spark-fill" d="M0 -9 L2.3 -2.3 L9 0 L2.3 2.3 L0 9 L-2.3 2.3 L-9 0 L-2.3 -2.3 Z"/></g><g class="bms-doodle" aria-hidden="true" transform="matrix(0.9985091400619244 -0.05458477088709462 0.05458477088709462 0.9985091400619244 710 -98)" opacity="0.536364" style="opacity: 0.536364;"><path class="bms-spark-soft" d="M0 -5.5 L1.4 -1.4 L5.5 0 L1.4 1.4 L0 5.5 L-1.4 1.4 L-5.5 0 L-1.4 -1.4 Z"/></g><g class="bms-doodle" aria-hidden="true"><circle class="bms-spark-fill" cx="728.0" cy="-79.0" r="1.3"/><circle class="bms-spark-soft" cx="696.0" cy="-82.0" r="1.1"/></g><text class="txt" x="40" y="-88" opacity="1" style="opacity: 1;">① 电芯模拟器假装一串可编程电压。</text><text class="txt" x="40" y="-66" opacity="1" style="opacity: 1;">② 故障注入矩阵做断线、短接，不在真电池上玩火。</text><text class="txt" x="40" y="-44" opacity="1" style="opacity: 1;">③ 被测 BMS 跑真实固件，上位机逐项核对。</text><text class="txt" x="40" y="-22" opacity="1" style="opacity: 1;">④ 底栏四步累计 4.5 s。不是产线节拍标准。</text><rect class="bg" width="800" height="570"/>
  <rect class="box" x="40" y="80" width="180" height="110" rx="8"/>
  <text class="txt" x="62" y="104">电芯模拟器</text>
  <text class="small" x="52" y="126">电阻分压链 / 多路电源</text>
  <text class="small" x="52" y="146">假装 16 串电芯</text>
  <text class="small" x="52" y="166">每路电压可编程</text>


  <rect class="fault" x="260" y="80" width="180" height="110" rx="8"/>
  <text class="txt" x="282" y="104">故障注入矩阵</text>
  <text class="small" x="272" y="126">继电器开关阵列：</text>
  <text class="small" x="272" y="146">断线 / 短相邻线 / NTC 异常</text>
  <text class="small" x="272" y="166">通信中断 / 继电器粘连</text>

  <text class="small" x="276" y="183">CH7 断线注入中…</text>


  <rect class="dut" x="480" y="80" width="150" height="110" rx="8"/>
  <text class="txt" x="506" y="104">被测 BMS</text>
  <text class="small" x="492" y="126">运行真实固件</text>
  <circle class="led" cx="600" cy="150" r="7" opacity="0.976012" style="opacity: 0.976012;">

  </circle>
  <text class="small" x="492" y="156">故障灯</text>
  <text class="small" x="492" y="176">应检出 + 进故障态</text>


  <rect class="pc" x="260" y="230" width="300" height="80" rx="8"/>
  <text class="txt" x="282" y="254">上位机：脚本驱动 + 自动判定</text>
  <text class="small" x="272" y="276">遍历故障注入清单 → 逐项核对 BMS 行为是否满足安全要求</text>
  <text class="small" x="272" y="296" opacity="0.99849" style="opacity: 0.99849;">报告：CH7 断线 → 检出 ✓ 去抖 100ms ✓ 进故障态 ✓</text>


  <line class="wire" x1="220" y1="135" x2="260" y2="135"/>
  <line class="wire" x1="440" y1="135" x2="480" y2="135"/>
  <line class="wire" x1="555" y1="190" x2="555" y2="230"/>
  <line class="wire" x1="350" y1="190" x2="350" y2="230"/>
  <circle class="sig" r="5" transform="matrix(1 0 0 1 220 135)">

  </circle>


  <rect class="panel" x="40" y="326" width="720" height="28" rx="6"/>
  <text class="small" x="52" y="344">为什么必须 HIL：真电池上做「断线/短路/粘连」= 玩火；模拟器上每 fault 可重复、可自动化、进 CI 式的回归</text>

<rect class="dpanel" x="24" y="368.0" width="752" height="188" rx="6"/><text class="dtitle small" x="40" y="388.0">底栏：产线四步示意累计。绝缘 2 s，电压 1 s，过压 0.5 s，对名 1 s</text><text class="dsmall small" x="40" y="404.0">累计 s</text><line class="daxis" x1="70.0" y1="404.0" x2="70.0" y2="518.0"/><line class="daxis" x1="70.0" y1="518.0" x2="460.0" y2="518.0"/><line class="daxis" x1="243.3" y1="518.0" x2="243.3" y2="523.0"/><text class="dsmall small" x="243.3" y="536.0" text-anchor="middle">2</text><line class="daxis" x1="330.0" y1="518.0" x2="330.0" y2="523.0"/><text class="dsmall small" x="330.0" y="536.0" text-anchor="middle">3</text><line class="daxis" x1="373.3" y1="518.0" x2="373.3" y2="523.0"/><text class="dsmall small" x="373.3" y="536.0" text-anchor="middle">3.5</text><line class="daxis" x1="460.0" y1="518.0" x2="460.0" y2="523.0"/><text class="dsmall small" x="460.0" y="536.0" text-anchor="middle">4.5</text><line class="daxis" x1="65.0" y1="472.4" x2="70.0" y2="472.4"/><text class="dsmall small" x="62.0" y="476.4" text-anchor="end">2</text><line class="daxis" x1="65.0" y1="438.2" x2="70.0" y2="438.2"/><text class="dsmall small" x="62.0" y="442.2" text-anchor="end">3.5</text><line class="daxis" x1="65.0" y1="415.4" x2="70.0" y2="415.4"/><text class="dsmall small" x="62.0" y="419.4" text-anchor="end">4.5</text><polyline class="dblue" points="70.0,472.4 243.3,472.4 243.3,449.6 330.0,449.6 330.0,438.2 373.3,438.2 373.3,415.4 460.0,415.4" stroke-linejoin="round" stroke-linecap="round"/><circle class="ddot" r="5" cx="243.3000030517578" cy="472.3999938964844"/><text class="dsmall small" x="483.2" y="536.0" text-anchor="start">时间 s</text><text class="dnote small" x="480" y="446.0">四步一共 4.5 s。不是产线节拍标准。</text>
</svg>
