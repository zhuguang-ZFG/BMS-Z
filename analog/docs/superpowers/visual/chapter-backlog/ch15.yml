open_decisions:
- 本轮所有新建与改图仍待逐张目视审阅；自动边界/数值检查不代替验收。
- 小环辐射算例复算为 658uV/m，原约写 660 正确；已撤回此前疑似算错判断。
- 接地剩余图中的通用频段、过孔间距、桥接隔离边界和网格20dB结论仍需逐项重审。
- DFM、测试点及拼板图仍需核工艺/治具条件，不能作为所有板厂的强制下限。
- 数字保全检查须区分勘误与遗漏，不全局豁免。
