<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">迟滞回环与一个 200mV 毛刺的两种命运</title>
<desc id="figDesc">左图是比较器转移特性回环：横轴 Vin 纵轴 Vout，R1=10kΩ、R2=100kΩ、Vref=2.5V，上行路径在 2.73V 处输出从高翻低，下行路径在 2.27V 处输出从低翻高，中间 0.45V 宽的浅色带标注为免疫区，底部给出阈值公式 VTH±=(R2·Vref+R1·VOH或VOL)/(R1+R2) 与 ΔV=(10k/110k)×5V=0.45V，并注明信号进反相端、输入高则输出低。右图三条时间轨迹共用横轴：上方输入从 2.0V 缓慢爬升，在 2.4V 处被一个 +200mV 毛刺顶到 2.6V，尖顶距 2.73V 上阈值还差 127mV；中间无迟滞输出在毛刺穿越 2.5V 时抖成一串窄脉冲；下方有迟滞输出保持高电平不动，直到输入真爬到 2.73V 才干净翻低一次。底部四拍标记：慢速上行、毛刺来袭、迟滞消化、真过阈翻转。</desc>
<rect width="960" height="640" fill="#fffdf8"/>
<defs>
<marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker>
<marker id="arrI" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14213d"/></marker>
</defs>

<text x="36" y="46" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="28" font-weight="700" fill="#14213d">一个 200mV 毛刺的两种命运</text>
<text x="36" y="76" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="15" fill="#52606d">Vref=2.5V · R1=10kΩ · R2=100kΩ（§7.5 算例）→ 阈值 2.73V / 2.27V，免疫区 0.45V。</text>
<line x1="36" y1="94" x2="924" y2="94" stroke="#14213d" stroke-width="2"/>

<g transform="rotate(-0.4 250 300)">
<rect x="36" y="116" width="448" height="384" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
<rect x="36" y="116" width="448" height="32" rx="6" fill="#fdf3e3"/>
<rect x="36" y="134" width="448" height="14" fill="#fdf3e3"/>
<text x="52" y="139" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="15" font-weight="700" fill="#b45309">① 转移特性回环（信号进反相端）</text>

<rect x="249.1" y="156" width="31.8" height="280" fill="#fdf3e3"/>
<line x1="92" y1="436" x2="456" y2="436" stroke="#14213d" stroke-width="1.8" marker-end="url(#arrI)"/>
<line x1="92" y1="436" x2="92" y2="158" stroke="#14213d" stroke-width="1.8" marker-end="url(#arrI)"/>
<line x1="249.1" y1="156" x2="249.1" y2="436" stroke="#b45309" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="280.9" y1="156" x2="280.9" y2="436" stroke="#b45309" stroke-width="1" stroke-dasharray="4 4"/>
<text x="265" y="300" transform="rotate(-90 265 300)" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" fill="#b45309">免疫区 ΔV=0.45V</text>

<path d="M 92 170 L 276 170" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrT)"/>
<path d="M 280.9 170 L 280.9 430" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrT)"/>
<path d="M 456 430 L 255 430" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrA)"/>
<path d="M 249.1 430 L 249.1 176" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrA)"/>

<text x="296" y="200" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" fill="#0f766e">上行：爬到 2.73V</text>
<text x="296" y="216" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" fill="#0f766e">输出才 5V→0V</text>
<text x="104" y="396" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" fill="#b45309">下行：跌回 2.27V</text>
<text x="104" y="412" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" fill="#b45309">输出才 0V→5V</text>
<text x="452" y="190" text-anchor="end" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="10.5" fill="#52606d">输入高 → 输出低</text>

<text x="249" y="452" text-anchor="middle" font-family="'Book Mono',monospace" font-size="11" fill="#b45309">2.27V</text>
<text x="281" y="466" text-anchor="middle" font-family="'Book Mono',monospace" font-size="11" fill="#b45309">2.73V</text>
<text x="452" y="452" text-anchor="end" font-family="'Book Mono',monospace" font-size="11" fill="#52606d">5V</text>
<text x="452" y="470" text-anchor="end" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" fill="#52606d">Vin</text>
<text x="86" y="174" text-anchor="end" font-family="'Book Mono',monospace" font-size="10.5" fill="#52606d">5V</text>
<text x="86" y="440" text-anchor="end" font-family="'Book Mono',monospace" font-size="10.5" fill="#52606d">0</text>
<text x="70" y="300" transform="rotate(-90 70 300)" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" fill="#52606d">Vout</text>

<text x="52" y="480" font-family="'Book Mono',monospace" font-size="11" fill="#14213d">VTH± = (R2·Vref + R1·VOH,VOL)/(R1+R2)</text>
<text x="52" y="496" font-family="'Book Mono',monospace" font-size="11" fill="#14213d">ΔV = (10k/110k) × 5V = 0.45V</text>
</g>

<g transform="rotate(0.3 710 300)">
<rect x="500" y="116" width="424" height="384" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
<rect x="500" y="116" width="424" height="32" rx="6" fill="#e6f6f2"/>
<rect x="500" y="134" width="424" height="14" fill="#e6f6f2"/>
<text x="516" y="139" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="15" font-weight="700" fill="#0f766e">② 同一毛刺走两遍（时间 →）</text>

<line x1="524" y1="200.2" x2="908" y2="200.2" stroke="#0f766e" stroke-width="1" stroke-dasharray="5 4"/>
<line x1="524" y1="251.8" x2="908" y2="251.8" stroke="#b45309" stroke-width="1" stroke-dasharray="5 4"/>
<line x1="524" y1="226" x2="908" y2="226" stroke="#b42318" stroke-width="1" stroke-dasharray="2 3"/>
<text x="528" y="196" font-family="'Book Mono',monospace" font-size="10.5" fill="#0f766e">2.73V</text>
<text x="528" y="222" font-family="'Book Mono',monospace" font-size="10.5" fill="#b42318">2.5V 无迟滞</text>
<text x="528" y="247" font-family="'Book Mono',monospace" font-size="10.5" fill="#b45309">2.27V</text>

<path d="M 524 282 L 640 251.5 L 695 235.5 L 706 214.8 L 717 234 L 804 208.4 L 860 193.7 L 908 181.2" fill="none" stroke="#14213d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="650" y="272" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" fill="#b42318">毛刺 +200mV：2.4V→2.6V</text>
<line x1="702" y1="264" x2="707" y2="220" stroke="#b42318" stroke-width="1" stroke-linecap="round"/>
<line x1="716" y1="214.8" x2="716" y2="200.2" stroke="#0f766e" stroke-width="1.6" stroke-linecap="round"/>
<line x1="712" y1="214.8" x2="720" y2="214.8" stroke="#0f766e" stroke-width="1.6" stroke-linecap="round"/>
<line x1="712" y1="200.2" x2="720" y2="200.2" stroke="#0f766e" stroke-width="1.6" stroke-linecap="round"/>
<text x="700" y="196" text-anchor="end" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="10.5" fill="#0f766e">差 127mV 够不着</text>

<text x="528" y="304" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" font-weight="700" fill="#b42318">无迟滞：一次穿越抖成一串脉冲</text>
<path d="M 524 312 L 688 312 L 692 350 L 696 312 L 700 350 L 704 312 L 708 350 L 714 312 L 737 312 L 737 350 L 908 350" fill="none" stroke="#b42318" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

<text x="528" y="384" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" font-weight="700" fill="#0f766e">有迟滞：毛刺被吞，2.73V 才翻一次</text>
<path d="M 524 392 L 804 392 L 804 430 L 908 430" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="908" y="446" text-anchor="end" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="10" fill="#52606d">翻转后阈值同步挪到 2.27V</text>

<circle cx="560" cy="466" r="8.5" fill="#fffdf8" stroke="#14213d" stroke-width="1.4"/>
<text x="560" y="470" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="10.5" fill="#14213d">①</text>
<text x="560" y="488" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="10" fill="#52606d">慢速上行</text>
<circle cx="700" cy="466" r="8.5" fill="#fffdf8" stroke="#14213d" stroke-width="1.4"/>
<text x="700" y="470" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="10.5" fill="#14213d">②</text>
<text x="700" y="488" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="10" fill="#52606d">毛刺来袭</text>
<circle cx="770" cy="466" r="8.5" fill="#fffdf8" stroke="#14213d" stroke-width="1.4"/>
<text x="770" y="470" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="10.5" fill="#14213d">③</text>
<text x="770" y="488" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="10" fill="#52606d">迟滞消化</text>
<circle cx="850" cy="466" r="8.5" fill="#fffdf8" stroke="#14213d" stroke-width="1.4"/>
<text x="850" y="470" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="10.5" fill="#14213d">④</text>
<text x="850" y="488" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="10" fill="#52606d">真过阈翻转</text>
</g>

<g transform="rotate(-0.3 480 580)">
<rect x="36" y="528" width="888" height="88" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
<rect x="36" y="528" width="6" height="88" fill="#0f766e"/>
<text x="60" y="556" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="15" font-weight="700" fill="#14213d">窗口按 ≥2× 噪声峰峰值开：0.45V 窗吞 200mV 毛刺余 127mV；300mV 勉强（差 27mV），400mV 越线。</text>
<text x="60" y="580" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="13" fill="#b45309">代价同一条：迟滞宽度 = 能分辨的最小信号差。多级判决与精密过零场合，窗要压到恰好盖过噪声，再加滤波。</text>
<text x="60" y="602" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="13" fill="#0f766e">验证别省：1Hz 三角波扫一遍，X-Y 模式看回环两个翻转点，与回代值对到 mV 级（§7.3）。</text>
</g>
</svg>
