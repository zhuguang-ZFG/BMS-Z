<text x="412" y="184" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="13" fill="#52606d">单变量</text>
<text x="412" y="206" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="13" fill="#52606d">一次只改一处</text>
<text x="412" y="272" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="13" fill="#0f766e">防瞎换</text>

