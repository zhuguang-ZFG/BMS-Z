<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="active-title active-desc" font-family="'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title id="active-title">主动均衡：电感先存，低节再收</title>
  <desc id="active-desc">演示电感式均衡的一个开关周期。第一拍，高压电芯向电感供能，电感电流上升。第二拍，电感向低压电芯释放磁场能量，电感电流下降。本图电流从零开始并回到零，只表示两段能量路径和相对时序。</desc>
  <style>
    .bg { fill: #fffdf5; }
    .panel { fill: #f7f2e5; stroke: #cfc6b2; }
    .title, .ink { fill: #293b3a; }
    .title { font-size: 27px; font-weight: 750; }
    .muted { fill: #526158; }
    .rule { stroke: #65766c; }
    .guide { stroke: #c0b9a6; }
    .warm { fill: #faedcf; }
    .cool { fill: #e3efec; }
    .plain { fill: #f1ecdf; }
    .amber { fill: #8b5b13; }
    .teal { fill: #176b73; }
    .wire-amber { stroke: #8b5b13; }
    .wire-teal { stroke: #176b73; }
    .pulse { stroke: #fffdf5; }
    .playhead { stroke: #fffdf5; }
    .outline { fill: none; stroke-width: 2.5; }
    .wire { fill: none; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
    .current { fill: none; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #192727; }
      .panel { fill: #223333; stroke: #496160; }
      .title, .ink { fill: #edf0e5; }
      .muted { fill: #b0beb3; }
      .rule { stroke: #a7b9aa; }
      .guide { stroke: #596e66; }
      .warm { fill: #453e2b; }
      .cool { fill: #29423f; }
      .plain { fill: #2e3936; }
      .amber { fill: #e7c586; }
      .teal { fill: #8bd0d0; }
      .wire-amber { stroke: #e7c586; }
      .wire-teal { stroke: #8bd0d0; }
      .pulse, .playhead { stroke: #192727; }
    }
    /* Embedded images use the still picture source. Standalone SVGs use this media query. */
    @media (prefers-reduced-motion: reduce) and (scripting: enabled), print {
      .playback, .bms-doodle { display: none; }
    }
  </style><style id="bms-motion">
    /* bms-motion: 手帐式动效注记（纯装饰，不改技术几何与既有 SMIL 时序） */
    .bms-marker { fill: #fbefc7; opacity: .78; }
    .bms-under { fill: none; stroke: #926717; stroke-width: 2.4; stroke-linecap: round; opacity: .9; }
    .bms-spark-line { fill: none; stroke: #926717; stroke-width: 1.9; stroke-linecap: round; }
    .bms-spark-fill { fill: #926717; }
    .bms-spark-soft { fill: #176b73; opacity: .8; }
    .bms-sticker { fill: none; stroke: #926717; stroke-width: 2; stroke-dasharray: 7 5; stroke-linecap: round; opacity: .85; }
    .bms-halo { fill: none; stroke: #926717; stroke-width: 2; }
    .bms-marker, .bms-under, .bms-sticker, .bms-halo,
    .bms-spark, .bms-success, .bms-doodle { pointer-events: none; }
    circle:has(> animateMotion) { filter: drop-shadow(0 0 2px rgba(146,103,23,.5)) drop-shadow(0 0 5px rgba(196,145,52,.45)); }
    rect:has(> animateMotion) { filter: drop-shadow(0 0 3px rgba(196,145,52,.75)); }
    g:has(> circle):has(> path.stroke-check) { filter: drop-shadow(0 0 5px rgba(55,123,96,.5)); }
    @media (prefers-color-scheme: dark) {
      .bms-marker { fill: #453e2b; opacity: .85; }
      .bms-under { stroke: #dfbd78; }
      .bms-spark-line { stroke: #dfbd78; }
      .bms-spark-fill { fill: #dfbd78; }
      .bms-spark-soft { fill: #7ec5c5; }
      .bms-sticker { stroke: #dfbd78; }
      .bms-halo { stroke: #dfbd78; }
      circle:has(> animateMotion) { filter: drop-shadow(0 0 2px rgba(223,189,120,.8)) drop-shadow(0 0 7px rgba(223,189,120,.9)); }
      rect:has(> animateMotion) { filter: drop-shadow(0 0 6px rgba(223,189,120,.8)); }
      g:has(> circle):has(> path.stroke-check) { filter: drop-shadow(0 0 6px rgba(143,199,162,.7)); }
    }
    @media (prefers-reduced-motion: reduce) { .bms-spark, .bms-success, .bms-doodle { display: none; } }
</style>
  <rect class="bg" width="800" height="520"/>
  <rect class="bms-marker" aria-hidden="true" x="22.0" y="10.9" width="392.0" height="29.2" rx="6.5" transform="rotate(-.5 22.0 25.5)"/><path class="bms-under" aria-hidden="true" d="M28.0 44.0 q 24.0 -2.4 48.0 0 t 48 0 t 48 0 t 48 0 t 48 0 t 48 0 t 48 0"/><text class="title" x="28" y="36">主动均衡：电感先存，低节再收</text>
  <text x="28" y="69" class="muted" font-size="17">顺着箭头看两个时刻，再用下方的电感电流核对切换点。</text>

  <g aria-label="主动均衡的两拍">
    <rect x="28" y="92" width="362" height="68" rx="10" class="warm"/>
    <rect x="410" y="92" width="362" height="68" rx="10" class="cool"/>
    <g class="ink" font-size="18" font-weight="700">
      <text x="45" y="119">① 高节 → 电感</text>
      <text x="427" y="119">② 电感 → 低节</text>
    </g>
    <g class="muted" font-size="15">
      <text x="45" y="143">电流上升，磁场储能</text>
      <text x="427" y="143">电流下降，磁场能量转给低节</text>
    </g>
  </g>

  <rect x="28" y="176" width="744" height="276" rx="14" class="panel"/><g class="bms-doodle" aria-hidden="true" transform="translate(742.0 200.0)"><animateTransform attributeName="transform" type="rotate" values="-6;7;-6" keyTimes="0;0.5;1" dur="5.4s" repeatCount="indefinite" additive="sum"/><animate attributeName="opacity" values="0.62;1;0.62" keyTimes="0;0.5;1" dur="3.6s" repeatCount="indefinite"/><path class="bms-spark-fill" d="M0 -9 L2.3 -2.3 L9 0 L2.3 2.3 L0 9 L-2.3 2.3 L-9 0 L-2.3 -2.3 Z"/></g><g class="bms-doodle" aria-hidden="true" transform="translate(706.0 190.0)"><animateTransform attributeName="transform" type="rotate" values="5;-4;5" keyTimes="0;0.5;1" dur="6.2s" repeatCount="indefinite" additive="sum"/><animate attributeName="opacity" values="0.5;0.9;0.5" keyTimes="0;0.5;1" dur="4.4s" repeatCount="indefinite"/><path class="bms-spark-soft" d="M0 -5.5 L1.4 -1.4 L5.5 0 L1.4 1.4 L0 5.5 L-1.4 1.4 L-5.5 0 L-1.4 -1.4 Z"/></g><g class="bms-doodle" aria-hidden="true"><circle class="bms-spark-fill" cx="724.0" cy="209.0" r="1.3"/><circle class="bms-spark-soft" cx="692.0" cy="206.0" r="1.1"/></g>
  <g aria-label="能量路径">
    <rect x="52" y="215" width="150" height="74" rx="11" class="warm"/>
    <rect x="325" y="215" width="150" height="74" rx="11" class="plain"/>
    <rect x="598" y="215" width="150" height="74" rx="11" class="cool"/>
    <g font-size="17" font-weight="700" text-anchor="middle">
      <text x="127" y="246" class="amber">高压电芯</text>
      <text x="400" y="272" class="ink">电感</text>
      <text x="673" y="246" class="teal">低压电芯</text>
    </g>
    <g font-size="15" text-anchor="middle" class="muted">
      <text x="127" y="270">4.05 V</text>
      <text x="673" y="270">3.65 V</text>
    </g>
    <path class="wire rule" d="M366 245 h8 a7 7 0 0 1 14 0 a7 7 0 0 1 14 0 a7 7 0 0 1 14 0 h18"/>
    <path class="wire wire-amber" d="M211 253 H311 m-9 -6 9 6 -9 6"/>
    <path class="wire wire-teal" d="M484 253 H584 m-9 -6 9 6 -9 6"/>
    <text x="261" y="236" text-anchor="middle" class="amber" font-size="13">先存</text>
    <text x="534" y="236" text-anchor="middle" class="teal" font-size="13">再送</text>
  </g>

  <g aria-label="电感电流示意">
    <path d="M52 312 H748" class="guide"/>
    <text x="52" y="342" class="ink" font-size="16" font-weight="700">电感电流</text>
    <text x="52" y="364" class="muted" font-size="13">一个开关周期</text>
    <path class="wire rule" d="M206 345 V408 H725 m-8 -5 8 5 -8 5"/>
    <path d="M431 349 V408" class="guide" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path class="current wire-amber" d="M206 408 L431 349"/>
    <path class="current wire-teal" d="M431 349 L706 408"/>
    <text x="196" y="412" class="muted" font-size="13" text-anchor="end">0</text>
    <text x="431" y="433" class="muted" font-size="14" text-anchor="middle">切换到低节</text>
    <text x="731" y="433" class="muted" font-size="14" text-anchor="end">时间</text>
  </g>

  <g class="playback" opacity="0" aria-hidden="true">
    <animate attributeName="opacity" to="1" dur="0.01s" fill="freeze"/>
    <g id="active-store">
      <animate attributeName="opacity" calcMode="discrete" keyTimes="0;0.45;1" values="1;0;0" dur="10s" repeatCount="indefinite"/>
      <rect x="28" y="92" width="362" height="68" rx="10" class="outline wire-amber"/>
      <path d="M211 253 H311 m-9 -6 9 6 -9 6" class="current wire-amber"/>
      <path d="M218 253 H297" class="wire pulse" stroke-dasharray="5 16">
        <animate attributeName="stroke-dashoffset" from="21" to="0" dur="0.75s" repeatCount="indefinite"/>
      </path>
    </g>
    <g id="active-deliver" opacity="0">
      <animate attributeName="opacity" calcMode="discrete" keyTimes="0;0.45;1" values="0;1;1" dur="10s" repeatCount="indefinite"/>
      <rect x="410" y="92" width="362" height="68" rx="10" class="outline wire-teal"/>
      <path d="M484 253 H584 m-9 -6 9 6 -9 6" class="current wire-teal"/>
      <path d="M491 253 H570" class="wire pulse" stroke-dasharray="5 16">
        <animate attributeName="stroke-dashoffset" from="21" to="0" dur="0.75s" repeatCount="indefinite"/>
      </path>
    </g>
    <circle id="active-playhead" r="6" class="amber playhead" stroke-width="2">
      <animate attributeName="class" calcMode="discrete" keyTimes="0;0.45;1" values="amber playhead;teal playhead;teal playhead" dur="10s" repeatCount="indefinite"/>
      <animateMotion path="M206 408 L431 349 L706 408" calcMode="linear" keyPoints="0;0.45266175;1" keyTimes="0;0.45;1" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="28" y="467" width="744" height="31" rx="8" class="cool"/>
  <text x="48" y="488" class="muted" font-size="14">能量路径和波形均为示意。开关与电感有损耗，低节收到的能量会少一些。</text>
</svg>
