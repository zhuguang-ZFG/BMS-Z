<circle r="5" fill="#a8321f"><animateMotion dur="2.0s" begin="0.70s" repeatCount="indefinite" path="M64,96 H176 M180,104 V146 V196" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle>
