<text x="668" y="217" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#6b3f63">f₁=0.8GHz 起下坠</text>
<circle cx="698" cy="338" r="5.5" fill="#3d6b4a"/>
<text x="698" y="360" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3d6b4a">谷底 49Ω @3.6GHz（LC 谐振把 R 短路）</text>
