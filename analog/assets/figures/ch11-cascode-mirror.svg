<text x="560" y="438" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="15" fill="#b42318">误差：β 分流、Early 效应；β 越大越准。</text>
<text x="560" y="486" font-family="'Book Mono',monospace" font-size="16" fill="#0f766e">I_OUT ≈ I_REF</text>
<text x="560" y="512" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="15" fill="#52606d">一个参考电流，可以复印出十几路偏置。</text>

<g transform="rotate(-0.8 480 572)">
<rect x="196" y="548" width="568" height="48" rx="3" fill="#fdf3e3" stroke="#e4d8c3" stroke-width="1.3"/>
<text x="220" y="578" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="18" fill="#14213d">在硅片上，晶体管比电阻便宜；分立电路里不必迷信。</text>
</g>
</svg>
