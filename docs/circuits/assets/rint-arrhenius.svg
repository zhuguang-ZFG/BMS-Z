<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="ui-monospace, Consolas, monospace">
  <title>内阻随温度：冷侧按示意活化能陡增，热侧变缓。数字为示意。</title>
  <desc>内阻随温度：冷侧按示意活化能陡增，热侧变缓。数字为示意。</desc>

  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.5; fill: none; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .dotg { fill: #1a7f37; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    .boxr { fill: #ffebe9; stroke: #cf222e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .dotg { fill: #3fb950; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
      .boxr { fill: #3d1214; stroke: #ff7b72; }
    }
  </style>

  <!-- formula: R=20*exp(3000*(1/(Tc+273.15)-1/298.15)) mOhm -->
  <rect class="bg" width="800" height="500"/>
  <text class="title" x="24" y="32">同一颗电芯，冷了腿更软（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="122" rx="6"/>
  <text class="txt" x="40" y="68" opacity="0.28">① 公式<tspan class="small">　R = 20·exp[3000·(1/T − 1/298.15)] mΩ，T 用开尔文。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="94" opacity="0.28">② −20 °C<tspan class="small">　示意约 119.6 mΩ。0 °C 约 50.2 mΩ。斜率在冷侧最陡。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="120" opacity="0.28">③ 25 °C<tspan class="small">　锚在 20 mΩ。再加热，电阻下降变慢。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="146" opacity="0.28">④ 60 °C<tspan class="small">　示意约 6.9 mΩ。SOP 和压降要跟温度走，不能用室温那一个数。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="182" width="752" height="250" rx="6"/>
  <text class="small" x="40" y="204">内阻 mΩ</text>
  <line class="axis" x1="92.0" y1="214.0" x2="92.0" y2="400.0"/>
  <line class="axis" x1="92.0" y1="400.0" x2="720.0" y2="400.0"/>
  <text class="small" x="712.0" y="418" text-anchor="end">温度 °C</text>
  <line class="grid" x1="92.0" y1="400.0" x2="92.0" y2="406.0"/>
  <text class="small" x="92.0" y="432" text-anchor="middle">−20</text>
  <line class="grid" x1="249.0" y1="400.0" x2="249.0" y2="406.0"/>
  <text class="small" x="249.0" y="432" text-anchor="middle">0</text>
  <line class="grid" x1="445.2" y1="400.0" x2="445.2" y2="406.0"/>
  <text class="small" x="445.2" y="432" text-anchor="middle">25</text>
  <line class="grid" x1="720.0" y1="400.0" x2="720.0" y2="406.0"/>
  <text class="small" x="720.0" y="432" text-anchor="middle">60</text>
  <line class="grid" x1="86.0" y1="373.4" x2="92.0" y2="373.4"/>
  <text class="small" x="82.0" y="377.4" text-anchor="end">20</text>
  <line class="grid" x1="86.0" y1="333.6" x2="92.0" y2="333.6"/>
  <text class="small" x="82.0" y="337.6" text-anchor="end">50</text>
  <line class="grid" x1="86.0" y1="240.6" x2="92.0" y2="240.6"/>
  <text class="small" x="82.0" y="244.6" text-anchor="end">120</text>
  <polyline class="lineb" points="92.0,241.1 99.8,248.3 107.7,255.2 115.5,261.7 123.4,267.8 131.2,273.7 139.1,279.2 146.9,284.5 154.8,289.5 162.7,294.2 170.5,298.7 178.4,303.0 186.2,307.0 194.1,310.9 201.9,314.6 209.8,318.1 217.6,321.4 225.4,324.6 233.3,327.6 241.2,330.5 249.0,333.3 256.9,335.9 264.7,338.4 272.5,340.8 280.4,343.0 288.2,345.2 296.1,347.3 304.0,349.3 311.8,351.2 319.6,353.0 327.5,354.7 335.4,356.4 343.2,358.0 351.1,359.5 358.9,360.9 366.8,362.3 374.6,363.7 382.4,364.9 390.3,366.2 398.1,367.3 406.0,368.5 413.8,369.5 421.7,370.6 429.6,371.6 437.4,372.5 445.2,373.4 453.1,374.3 460.9,375.2 468.8,376.0 476.7,376.7 484.5,377.5 492.3,378.2 500.2,378.9 508.1,379.6 515.9,380.2 523.8,380.8 531.6,381.4 539.5,382.0 547.3,382.5 555.2,383.1 563.0,383.6 570.8,384.1 578.7,384.6 586.5,385.0 594.4,385.5 602.2,385.9 610.1,386.3 618.0,386.7 625.8,387.1 633.6,387.4 641.5,387.8 649.4,388.1 657.2,388.5 665.0,388.8 672.9,389.1 680.8,389.4 688.6,389.7 696.5,390.0 704.3,390.3 712.1,390.5 720.0,390.8" stroke-linejoin="round" stroke-linecap="round"/>
  <text class="hi" x="360" y="250">25 °C 示意 20 mΩ</text>
  <text class="warn" x="140" y="236">冷侧陡</text>
  <circle class="doty" r="6"><animate attributeName="cx" values="92.0;144.3;196.7;249.0;301.3;353.7;406.0;458.3;510.7;563.0;615.3;667.7;720.0" keyTimes="0;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="241.1;282.7;312.1;333.3;348.6;360.0;368.5;374.9;379.8;383.6;386.6;388.9;390.8" keyTimes="0;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1" dur="12s" repeatCount="indefinite"/></circle>
  <text class="small" x="24" y="478">3000 K 是教学用的 Ea/k，不是某一化学体系的活化能。20 mΩ 也是示意锚点。规格书上的内阻仍以那颗电芯为准。</text>
</svg>
