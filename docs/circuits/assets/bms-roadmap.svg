<rect x="0" y="0" width="800" height="330" rx="12" fill="#f8fafc"/>
<text x="30" y="44" font-size="20" font-weight="bold" fill="#1e293b">BMS 学习路线：从一颗电芯到产品级系统</text>
<text x="30" y="66" font-size="12" fill="#64748b">七个阶段 · 业余每天 1–2 小时约 4–8 个月 · 节点下方为建议用时（光点巡游一圈 ≈ 全程缩影）</text>
