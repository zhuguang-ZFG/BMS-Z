<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460">
  <title>BLE 长帧要先协商 MTU，再把通知分片按长度重组。默认 ATT MTU 只有 23 字节。</title>
  <desc>黄点按片 1、片 2、片 3 走。读数按每片约 20 字节累加到约 60 字节，和画面上的帧长一致。示意，不是抓包。</desc>
  <style>
    text { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .bg { fill: #f8fafc; }
    .title { fill: #1e293b; font-size: 18px; font-weight: bold; }
    .txt { fill: #334155; font-size: 15px; }
    .small { fill: #334155; font-size: 14px; }
    .frame { fill: #e2e8f0; stroke: #475569; }
    .piece { fill: #dbeafe; stroke: #2563eb; }
    .ok { fill: #065f46; font-size: 15px; font-weight: bold; }
    .no { fill: #991b1b; font-size: 15px; font-weight: bold; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a; }
      .title { fill: #f1f5f9; }
      .txt { fill: #e2e8f0; }
      .small { fill: #e2e8f0; }
      .frame { fill: #1e293b; stroke: #94a3b8; }
      .piece { fill: #172554; stroke: #60a5fa; }
      .ok { fill: #6ee7b7; }
      .no { fill: #fca5a5; }
    }
  </style>
  <rect class="bg" width="800" height="460"/>
  <text class="title" x="400" y="32" text-anchor="middle">BLE：MTU 谈不拢，帧就拼不齐</text>
  <text class="txt" x="40" y="72">一帧示意载荷，大约 60 字节</text>
  <rect class="frame" x="40" y="86" width="600" height="36" rx="4"/>
  <text class="small" x="340" y="110" text-anchor="middle">帧头 + 长度 + 电压电流 SOC + CRC</text>
  <text class="txt" x="40" y="160">默认 ATT MTU = 23，有效载荷约 20 字节，切成三片通知</text>
  <rect class="piece" x="40" y="176" width="180" height="36" rx="4"/>
  <rect class="piece" x="232" y="176" width="180" height="36" rx="4"/>
  <rect class="piece" x="424" y="176" width="180" height="36" rx="4"/>
  <text class="small" x="130" y="200" text-anchor="middle">片 1</text>
  <text class="small" x="322" y="200" text-anchor="middle">片 2</text>
  <text class="small" x="514" y="200" text-anchor="middle">片 3</text>
  <text class="no" x="40" y="248">只收了片 1：长度对不上，先缓存，不要当完整帧
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.35;0.45;1" dur="8s" repeatCount="indefinite"/>
  </text>
  <text class="ok" x="40" y="280" opacity="0">三片按顺序拼回 60 字节，再验 CRC
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.55;0.75;1" dur="8s" repeatCount="indefinite"/>
  </text>
  <text class="txt" x="40" y="328">协商到更大的 MTU 之后，片数变少，重组状态机还在</text>
  <rect class="piece" x="40" y="344" width="280" height="36" rx="4" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.3;1;1" keyTimes="0;0.55;0.7;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <rect class="piece" x="332" y="344" width="280" height="36" rx="4" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.3;1;1" keyTimes="0;0.55;0.7;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text class="small" x="180" y="368" text-anchor="middle">片 1</text>
  <text class="small" x="472" y="368" text-anchor="middle">片 2</text>
  <circle r="7" fill="#b45309" cx="130" cy="194">
    <animate attributeName="cx" values="130;322;514;180;472;472" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="194;194;194;362;362;362" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <text class="ok" x="620" y="200" opacity="1">约 20 字节<animate attributeName="opacity" values="1;0;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/></text>
  <text class="ok" x="620" y="200" opacity="0">约 40 字节<animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/></text>
  <text class="ok" x="620" y="200" opacity="0">约 60 字节<animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/></text>
  <text class="small" x="400" y="416" text-anchor="middle">连得上却看不到完整电压表，先查 MTU，再查分片超时有没有把半帧丢掉。</text>
  <text class="small" x="400" y="442" text-anchor="middle">厂商私有服务里往往是透传。GATT 找到特征值，只是拿到了字节管道。</text>
</svg>
