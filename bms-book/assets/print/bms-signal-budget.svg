<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 544" width="800" height="544" role="img" aria-labelledby="title desc">
  <title id="title">一拍软件信号链的时间账</title>
  <desc id="desc">教学预算依次为采样八毫秒、估算三毫秒、判决一毫秒、执行零点二毫秒，累计十二点二毫秒。软件链的大头在采样；硬件比较器不经过这条累加路径。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#176b73"/>
    </marker>
    <style>
      .bg{fill:#fffdf5}.panel{fill:#f7f2e5;stroke:#cfc6b2;stroke-width:1.5}.card{fill:#e4f0df;stroke:#176b73;stroke-width:2}.decision{fill:#fbefc7;stroke:#926717;stroke-width:2}.execute{fill:#f6e2df;stroke:#b84745;stroke-width:2}.title{font:700 22px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#293b3a}.head{font:700 17px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#293b3a}.txt{font:15px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#293b3a}.small{font:13px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#626d65}.metric{font:800 25px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#176b73}.gold{fill:#926717}.red{fill:#b84745}.line{fill:none;stroke:#176b73;stroke-width:3;marker-end:url(#arrow)}.axis{stroke:#626d65;stroke-width:1.5}.grid{stroke:#cfc6b2;stroke-width:1}.step{fill:none;stroke:#176b73;stroke-width:3}
      @media(prefers-color-scheme:dark){.bg{fill:#192727}.panel{fill:#223333;stroke:#496160}.card{fill:#293f35;stroke:#7ec5c5}.decision{fill:#3c3525;stroke:#dfbd78}.execute{fill:#402d2d;stroke:#f39b91}.title,.head,.txt{fill:#edf0e5}.small{fill:#b0beb3}.metric{fill:#7ec5c5}.gold{fill:#dfbd78}.red{fill:#f39b91}.line,.step{stroke:#7ec5c5}.axis{stroke:#b0beb3}.grid{stroke:#496160}}
    </style><style id="bms-motion">
    /* bms-motion: 手帐式动效注记（纯装饰，不改技术几何与既有 SMIL 时序） */
    .bms-marker { fill: #fbefc7; opacity: .78; }
    .bms-under { fill: none; stroke: #926717; stroke-width: 2.4; stroke-linecap: round; opacity: .9; }
    .bms-spark-line { fill: none; stroke: #926717; stroke-width: 1.9; stroke-linecap: round; }
    .bms-spark-fill { fill: #926717; }
    .bms-spark-soft { fill: #176b73; opacity: .8; }
    .bms-sticker { fill: none; stroke: #926717; stroke-width: 2; stroke-dasharray: 7 5; stroke-linecap: round; opacity: .85; }
    .bms-halo { fill: none; stroke: #926717; stroke-width: 2; }
    .bms-marker, .bms-under, .bms-sticker, .bms-halo,
    .bms-spark, .bms-success, .bms-doodle { pointer-events: none; }
    circle:has(> animateMotion) { filter: drop-shadow(0 0 2px rgba(146,103,23,.5)) drop-shadow(0 0 5px rgba(196,145,52,.45)); }
    rect:has(> animateMotion) { filter: drop-shadow(0 0 3px rgba(196,145,52,.75)); }
    g:has(> circle):has(> path.stroke-check) { filter: drop-shadow(0 0 5px rgba(55,123,96,.5)); }
    @media (prefers-color-scheme: dark) {
      .bms-marker { fill: #453e2b; opacity: .85; }
      .bms-under { stroke: #dfbd78; }
      .bms-spark-line { stroke: #dfbd78; }
      .bms-spark-fill { fill: #dfbd78; }
      .bms-spark-soft { fill: #7ec5c5; }
      .bms-sticker { stroke: #dfbd78; }
      .bms-halo { stroke: #dfbd78; }
      circle:has(> animateMotion) { filter: drop-shadow(0 0 2px rgba(223,189,120,.8)) drop-shadow(0 0 7px rgba(223,189,120,.9)); }
      rect:has(> animateMotion) { filter: drop-shadow(0 0 6px rgba(223,189,120,.8)); }
      g:has(> circle):has(> path.stroke-check) { filter: drop-shadow(0 0 6px rgba(143,199,162,.7)); }
    }
    @media (prefers-reduced-motion: reduce) { .bms-spark, .bms-success, .bms-doodle { display: none; } }
</style>
  </defs>
  <rect class="bg" width="800" height="544"/>
  <rect class="bms-marker" aria-hidden="true" x="22.0" y="23.1" width="286.0" height="17.3" rx="3.8" transform="rotate(-.5 22.0 31.8)"/><path class="bms-under" aria-hidden="true" d="M28.0 46.0 q 24.0 -2.4 48.0 0 t 48 0 t 48 0 t 48 0 t 48 0"/><text class="title" x="28" y="38">一拍数据从电芯走到开关，时间花在哪</text>
  <text class="small" x="28" y="64">教学预算：认顺序与累计时间，不把它当成某颗 MCU 的实测</text>

  <rect class="card" x="28" y="100" width="160" height="116" rx="18"/>
  <text class="head" x="108" y="134" text-anchor="middle">① 采样</text>
  <text class="metric" x="108" y="177" text-anchor="middle">8 ms</text>
  <text class="small" x="108" y="202" text-anchor="middle">累计 8 ms</text>
  <path class="line" d="M188 158 H222"/>

  <rect class="card" x="226" y="100" width="160" height="116" rx="18"/>
  <text class="head" x="306" y="134" text-anchor="middle">② 估算</text>
  <text class="metric" x="306" y="177" text-anchor="middle">+3 ms</text>
  <text class="small" x="306" y="202" text-anchor="middle">累计 11 ms</text>
  <path class="line" d="M386 158 H420"/>

  <rect class="decision" x="424" y="100" width="160" height="116" rx="18"/>
  <text class="head" x="504" y="134" text-anchor="middle">③ 判决</text>
  <text class="metric gold" x="504" y="177" text-anchor="middle">+1 ms</text>
  <text class="small" x="504" y="202" text-anchor="middle">累计 12 ms</text>
  <path class="line" d="M584 158 H618"/>

  <rect class="execute" x="622" y="100" width="150" height="116" rx="18"/>
  <text class="head" x="697" y="134" text-anchor="middle">④ 执行</text>
  <text class="metric red" x="697" y="177" text-anchor="middle">+0.2 ms</text>
  <text class="small" x="697" y="202" text-anchor="middle">累计 12.2 ms</text>

  <rect class="panel" x="28" y="252" width="744" height="212" rx="18"/><g class="bms-doodle" aria-hidden="true" transform="translate(742.0 276.0)"><path class="bms-spark-fill" d="M0 -9 L2.3 -2.3 L9 0 L2.3 2.3 L0 9 L-2.3 2.3 L-9 0 L-2.3 -2.3 Z"/></g><g class="bms-doodle" aria-hidden="true" transform="translate(706.0 266.0)"><path class="bms-spark-soft" d="M0 -5.5 L1.4 -1.4 L5.5 0 L1.4 1.4 L0 5.5 L-1.4 1.4 L-5.5 0 L-1.4 -1.4 Z"/></g><g class="bms-doodle" aria-hidden="true"><circle class="bms-spark-fill" cx="724.0" cy="285.0" r="1.3"/><circle class="bms-spark-soft" cx="692.0" cy="282.0" r="1.1"/></g>
  <text class="head" x="52" y="286">累计时间 / ms</text>
  <line class="axis" x1="94" y1="418" x2="730" y2="418"/>
  <line class="axis" x1="94" y1="312" x2="94" y2="418"/>
  <g class="small" text-anchor="end">
    <text x="84" y="422">0</text>
    <text x="84" y="370">8</text>
    <text x="84" y="344">12</text>
  </g>
  <g class="grid">
    <line x1="235" y1="418" x2="235" y2="424"/>
    <line x1="385" y1="418" x2="385" y2="424"/>
    <line x1="535" y1="418" x2="535" y2="424"/>
    <line x1="685" y1="418" x2="685" y2="424"/>
  </g>
  <g class="small" text-anchor="middle">
    <text x="235" y="446">采样完</text>
    <text x="385" y="446">估算完</text>
    <text x="535" y="446">判决完</text>
    <text x="685" y="446">执行完</text>
  </g>
  <path class="step" d="M94 366 H235 V341 H385 V334 H535 V332 H685"/>
  <circle cx="235" cy="366" r="5" fill="#176b73"/>
  <circle cx="385" cy="341" r="5" fill="#176b73"/>
  <circle cx="535" cy="334" r="5" fill="#926717"/>
  <circle cx="685" cy="332" r="5" fill="#b84745"/>

  <rect class="panel" x="74" y="482" width="652" height="42" rx="21"/>
  <text class="txt" x="400" y="508" text-anchor="middle">软件链的大头在采样；硬件比较器不走这条 12.2 ms 累加路径</text>
</svg>
