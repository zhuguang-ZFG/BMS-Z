<rect x="370" y="345" width="260" height="84" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<text x="500" y="395" font-size="22" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">共同项与独立残差分开</text>
