<text x="40" y="489" font-size="22" text-anchor="start">① 00 11 22 是垃圾前缀；逐字节跳过，两个计数仍为 0。</text>
<text x="40" y="528" font-size="21" text-anchor="start">原理示意 / 非实拍；0x0E74 按大端毫伏约定为 3700 mV。</text>
