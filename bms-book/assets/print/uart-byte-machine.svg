  <text class="small" x="44" y="168">示意字节流（不是某家真实协议）</text>
  <text class="byte small" x="44" y="214">AA 55</text>
  <text class="byte small" x="160" y="214">01</text>
  <text class="byte small" x="230" y="214">02</text>
  <text class="byte small" x="300" y="214">12 34</text>
  <text class="byte small" x="410" y="214">7F</text>
  <text class="small" x="44" y="242">帧头</text>
  <text class="small" x="160" y="242">地址</text>
  <text class="small" x="230" y="242">长度</text>
  <text class="small" x="300" y="242">数据</text>
  <text class="small" x="410" y="242">CRC</text>

  <text class="ok" x="44" y="310" opacity="0" style="opacity: 0;">CRC 对上：交上一层

  </text>
  <text class="bad small" x="44" y="348" opacity="0" style="opacity: 0;">CRC 失败：坏帧 +1，从下一字节重新找帧头

  </text>
  <text class="small" x="400" y="408" text-anchor="middle">坏帧必须计数。静默丢掉的话，现场分不清是线坏了还是解析坏了。</text>

