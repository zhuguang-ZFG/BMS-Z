<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440">
  <title>过放后铜集流体溶解，再充电时在隔膜附近长成针状沉积。不要用大电流激活过放电池。</title>
  <style>
    text { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .bg { fill: #f8fafc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; }
    .title { fill: #1e293b; font-size: 18px; font-weight: bold; }
    .txt { fill: #334155; font-size: 15px; }
    .small { fill: #334155; font-size: 13px; }
    .foil { fill: #b45309; }
    .ion { fill: #d97706; }
    .sep { fill: #64748b; }
    .needle { fill: #dc2626; }
    .warn { fill: #991b1b; font-size: 15px; font-weight: bold; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke: #475569; }
      .title { fill: #f1f5f9; }
      .txt { fill: #e2e8f0; }
      .small { fill: #e2e8f0; }
      .foil { fill: #fbbf24; }
      .ion { fill: #fcd34d; }
      .sep { fill: #94a3b8; }
      .needle { fill: #f87171; }
      .warn { fill: #fca5a5; }
    }
  </style>
  <rect class="bg" width="800" height="440"/>
  <text class="title" x="400" y="32" text-anchor="middle">过放溶解铜，再充电长成针</text>

  <rect class="panel" x="36" y="52" width="350" height="280" rx="8"/>
  <text class="txt" x="52" y="80">左：过放，铜离子离开集流体</text>
  <rect class="foil" x="70" y="120" width="18" height="160" rx="2"/>
  <text class="small" x="96" y="148">铜集流体</text>
  <rect class="sep" x="250" y="120" width="12" height="160"/>
  <text class="small" x="270" y="148">隔膜</text>
  <circle class="ion" r="7" cy="160">
    <animate attributeName="cx" values="96;96;200;200" keyTimes="0;0.15;0.55;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0.35" keyTimes="0;0.2;0.7;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle class="ion" r="7" cy="200">
    <animate attributeName="cx" values="96;96;210;210" keyTimes="0;0.25;0.65;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0.35" keyTimes="0;0.3;0.75;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle class="ion" r="7" cy="240">
    <animate attributeName="cx" values="96;96;190;190" keyTimes="0;0.2;0.6;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0.35" keyTimes="0;0.25;0.72;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <text class="small" x="52" y="310">这一步往往不鼓包、不发热。</text>

  <rect class="panel" x="414" y="52" width="350" height="280" rx="8"/>
  <text class="txt" x="430" y="80">右：再充电，铜沉积成针</text>
  <rect class="foil" x="448" y="120" width="18" height="160" rx="2"/>
  <text class="small" x="474" y="148">铜集流体</text>
  <rect class="sep" x="620" y="120" width="12" height="160"/>
  <text class="small" x="640" y="148">隔膜</text>
  <rect class="needle" x="612" y="250" width="8" height="8">
    <animate attributeName="height" values="8;8;78;78" keyTimes="0;0.45;0.85;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="y" values="250;250;180;180" keyTimes="0;0.45;0.85;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text class="small" x="430" y="310">针长进隔膜，就是内短路的种子。</text>

  <text class="warn" x="400" y="372" text-anchor="middle">不要用大电流激活过放电池</text>
  <text class="small" x="400" y="404" text-anchor="middle">电压与时间是示意。鼓包、漏液直接报废。恢复电流以电芯 datasheet 为准。</text>
</svg>
