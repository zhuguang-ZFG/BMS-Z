<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 544" font-family="ui-monospace, Consolas, monospace">
  <title>温度保护窗口：过温 55/45 °C，低温 0/8 °C，各带 0.8 s 确认。曲线是正弦。数字为示意。</title>
  <desc>亮点从 30 °C 升到 55 °C 触发过温锁存，回到 45 °C 以下恢复，低温段再来一次带 0.8 s 确认的动作。</desc>

  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.5; fill: none; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
    }
  </style>

  <!-- formula: T=30+32*sin(2*pi*t/12); OT 55/45; UT 0/8; confirm 0.8 s -->
  <rect class="bg" width="800" height="544"/>
  <text class="title" x="24" y="32">太烫和太冷都关充电，而且松手比出手更晚（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="128" rx="6"/>
  <text class="txt" x="40" y="72" opacity="0.28">① 从 30 °C 往上<tspan class="small">　正弦刚起步。55 °C 那条红线还在上面。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="98" opacity="0.28">② 过温锁上<tspan class="small">　连续 0.8 s 高于 55 °C 后，大约 2.51 s 禁充。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="124" opacity="0.28">③ 回到 45 °C 以下<tspan class="small">　大约 5.07 s 才松开。中间那段回差里保持断开。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="150" opacity="0.28">④ 低温再来一次<tspan class="small">　大约 9.12 s 低于 0 °C 满 0.8 s，10.56 s 升过 8 °C 才恢复。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="188" width="752" height="304" rx="6"/>
  <text class="small" x="40" y="210">温度 °C（示意）</text>
  <line class="axis" x1="108.0" y1="228.0" x2="108.0" y2="430.0"/>
  <line class="axis" x1="108.0" y1="430.0" x2="730.0" y2="430.0"/>
  <text class="small" x="730.0" y="468.0" text-anchor="end">时间 s</text>
  <line class="grid" x1="108.0" y1="430.0" x2="108.0" y2="436.0"/>
  <text class="small" x="108.0" y="452.0" text-anchor="middle">0</text>
  <line class="grid" x1="263.5" y1="430.0" x2="263.5" y2="436.0"/>
  <text class="small" x="263.5" y="452.0" text-anchor="middle">3</text>
  <line class="grid" x1="419.0" y1="430.0" x2="419.0" y2="436.0"/>
  <text class="small" x="419.0" y="452.0" text-anchor="middle">6</text>
  <line class="grid" x1="574.5" y1="430.0" x2="574.5" y2="436.0"/>
  <text class="small" x="574.5" y="452.0" text-anchor="middle">9</text>
  <line class="grid" x1="730.0" y1="430.0" x2="730.0" y2="436.0"/>
  <text class="small" x="730.0" y="452.0" text-anchor="middle">12</text>
  <line class="grid" x1="102.0" y1="409.3" x2="108.0" y2="409.3"/>
  <text class="small" x="98.0" y="413.3" text-anchor="end">0</text>
  <line class="grid" x1="102.0" y1="388.6" x2="108.0" y2="388.6"/>
  <text class="small" x="98.0" y="392.6" text-anchor="end">8</text>
  <line class="grid" x1="102.0" y1="292.7" x2="108.0" y2="292.7"/>
  <text class="small" x="98.0" y="296.7" text-anchor="end">45</text>
  <line class="grid" x1="102.0" y1="266.8" x2="108.0" y2="266.8"/>
  <text class="small" x="98.0" y="270.8" text-anchor="end">55</text>
