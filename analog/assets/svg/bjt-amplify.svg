.52;0.78;0.82;1" dur="6s" repeatCount="indefinite"/></rect><text x="400" y="448" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#a8321f" opacity="0">③ 放大：基极 ±10mV → 集电极 ∓2V——约 200 倍，方向相反<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.48;0.52;0.78;0.82;1" dur="6s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.82;0.86;1" dur="6s" repeatCount="indefinite"/><rect x="166.2" y="434.9" width="467.6" height="24.1" rx="12.0" fill="#3d6b4a" fill-opacity="0.09" stroke="#3d6b4a" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.86;1" dur="6s" repeatCount="indefinite"/></rect><text x="400" y="448" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#3d6b4a" opacity="0">④ 能量全部来自 12V 电源——三极管是阀门，从不「创造」能量<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.86;1" dur="6s" repeatCount="indefinite"/></text></g><g opacity="0">
