<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="ui-monospace, Consolas, monospace">
  <title>热失控沿电芯传播：先失控的那节、被烤到的邻居、还凉着的下一节。切断外部电流带不走已有的热。数字为示意。</title>

  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #bf8700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.5; fill: none; }
    .liney { stroke: #bf8700; stroke-width: 2.5; fill: none; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .dotg { fill: #1a7f37; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    .boxr { fill: #ffebe9; stroke: #cf222e; }
    .boxg { fill: #dafbe1; stroke: #1a7f37; }
    .boxy { fill: #fff8c5; stroke: #bf8700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .dotg { fill: #3fb950; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
      .boxr { fill: #3d1214; stroke: #ff7b72; }
      .boxg { fill: #12261e; stroke: #3fb950; }
      .boxy { fill: #3d2e00; stroke: #d29922; }
    }
  </style>

  <rect class="bg" width="800" height="460"/>

  <text class="title" x="24" y="32">热失控传到隔壁：切断外部电流，带不走已经在芯里的热（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="122" rx="6"/>
  <text class="txt" x="40" y="68" opacity="0.28">① 第 1 节越线<tspan class="small">　示意从 45 °C 冲到 120 °C 以上，开始排气。dT/dt 比绝对温度更早。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="94" opacity="0.28">② 接触器打开<tspan class="small">　外部充放电电流被切断。这一拍止住的是外面的能量，不是芯里的反应。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="120" opacity="0.28">③ 第 2 节跟着热<tspan class="small">　示意隔一段时间升到 80 °C。隔壁的温升速率是传播的早信号。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="146" opacity="0.28">④ 第 3 节仍凉<tspan class="small">　示意还在 35 °C。传播有先后，不是整包同时着。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="180" width="752" height="210" rx="6"/>
<text class="small" x="40" y="198">柱高 30–120 °C，满高仍在框内。接触器打开后第 1 节不落回去。</text>
  <rect class="boxr" x="80" y="220" width="140" height="120" rx="8"/>
  <rect class="dotr" x="120" y="316.5" width="60" height="13.5">
    <animate attributeName="height" values="13.5;81.0;81.0" keyTimes="0;0.25;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="y" values="316.5;249.0;249.0" keyTimes="0;0.25;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text class="txt" x="150" y="236" text-anchor="middle">第 1 节</text>
  <text class="small" x="150" y="358" text-anchor="middle">冲到 120 °C 后保持</text>
  <rect class="boxy" x="300" y="220" width="140" height="120" rx="8"/>
  <rect class="doty" x="340" y="325.5" width="60" height="4.5">
    <animate attributeName="height" values="4.5;4.5;45.0;45.0" keyTimes="0;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="y" values="325.5;325.5;285.0;285.0" keyTimes="0;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text class="txt" x="370" y="236" text-anchor="middle">第 2 节</text>
  <text class="small" x="370" y="358" text-anchor="middle">稍后到 80 °C</text>
  <rect class="boxg" x="520" y="220" width="140" height="120" rx="8"/>
  <rect class="dotg" x="560" y="325.5" width="60" height="4.5"/>
  <text class="txt" x="590" y="236" text-anchor="middle">第 3 节</text>
  <text class="small" x="590" y="358" text-anchor="middle">仍约 35 °C</text>
  <text class="small" x="24" y="446">温度和时间都是示意，不是热失控实验记录。打开接触器不能当成「火已经停下」。传播取决于包的隔热，不取决于这一张图。</text>

</svg>
