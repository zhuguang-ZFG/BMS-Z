t x="400" y="460" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#6b3f63" opacity="0">③ Vout=−D/(1−D)·Vin：D=0.5 时 −Vin；D>0.5 幅值超过输入——升降压还能反相<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.58;0.64;1" dur="6s" repeatCount="indefinite"/></text></g><g opacity="0">
