<svg xmlns="http://www.w3.org/2000/svg" width="800" height="588" viewBox="0 0 800 588" role="img" aria-labelledby="cccv-title cccv-desc" font-family="'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title id="cccv-title">CC–CV 充电：到压切换，到流截止</title>
  <desc id="cccv-desc">同一条时间轴上下对照端电压与充电电流。2 Ah 教学示例先用 2 A 恒流充约 48 分钟，达到 4.20 V 切到恒压，而不是结束充电。再过约 29 分钟，电流降到 0.10 A，触发本例的截止条件。</desc>
  <style>
    .bg { fill: #fffdf5; }
    .panel { fill: #f7f2e5; stroke: #cfc6b2; }
    .txt, .title { fill: #293b3a; }
    .title { font-size: 27px; font-weight: 750; }
    .muted { fill: #526158; }
    .cc { fill: #e8f1e5; }
    .cv { fill: #fbefc7; }
    .end { fill: #e3efec; }
    .fill-v { fill: #176b73; }
    .fill-i { fill: #8e6518; }
    .line-v { stroke: #176b73; }
    .line-i { stroke: #8e6518; }
    .rule { stroke: #bdb6a4; }
    .tick { stroke: #819184; }
    .cursor { stroke: #293b3a; opacity: .53; }
    .dot { stroke: #fffdf5; }
    .active { fill: none; stroke: #293b3a; stroke-width: 2; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #192727; }
      .panel { fill: #223333; stroke: #496160; }
      .txt, .title { fill: #edf0e5; }
      .muted { fill: #b0beb3; }
      .cc { fill: #293f35; }
      .cv { fill: #453e2b; }
      .end { fill: #29423f; }
      .fill-v { fill: #8bd0d0; }
      .fill-i { fill: #e7c586; }
      .line-v { stroke: #8bd0d0; }
      .line-i { stroke: #e7c586; }
      .rule { stroke: #5b706a; }
      .tick { stroke: #879b90; }
      .cursor, .active { stroke: #edf0e5; }
      .dot { stroke: #192727; }
    }
    /* Site embeds use a picture source; Chromium image mode may report reduce by default. */
    @media (prefers-reduced-motion: reduce) and (scripting: enabled), print {
      .playback, .bms-doodle { display: none; }
    }
  </style><style id="bms-motion">
    /* bms-motion: 手帐式动效注记（纯装饰，不改技术几何与既有 SMIL 时序） */
    .bms-marker { fill: #fbefc7; opacity: .78; }
    .bms-under { fill: none; stroke: #926717; stroke-width: 2.4; stroke-linecap: round; opacity: .9; }
    .bms-spark-line { fill: none; stroke: #926717; stroke-width: 1.9; stroke-linecap: round; }
    .bms-spark-fill { fill: #926717; }
    .bms-spark-soft { fill: #176b73; opacity: .8; }
    .bms-sticker { fill: none; stroke: #926717; stroke-width: 2; stroke-dasharray: 7 5; stroke-linecap: round; opacity: .85; }
    .bms-halo { fill: none; stroke: #926717; stroke-width: 2; }
    .bms-marker, .bms-under, .bms-sticker, .bms-halo,
    .bms-spark, .bms-success, .bms-doodle { pointer-events: none; }
    circle:has(> animateMotion) { filter: drop-shadow(0 0 2px rgba(146,103,23,.5)) drop-shadow(0 0 5px rgba(196,145,52,.45)); }
    rect:has(> animateMotion) { filter: drop-shadow(0 0 3px rgba(196,145,52,.75)); }
    g:has(> circle):has(> path.stroke-check) { filter: drop-shadow(0 0 5px rgba(55,123,96,.5)); }
    @media (prefers-color-scheme: dark) {
      .bms-marker { fill: #453e2b; opacity: .85; }
      .bms-under { stroke: #dfbd78; }
      .bms-spark-line { stroke: #dfbd78; }
      .bms-spark-fill { fill: #dfbd78; }
      .bms-spark-soft { fill: #7ec5c5; }
      .bms-sticker { stroke: #dfbd78; }
      .bms-halo { stroke: #dfbd78; }
      circle:has(> animateMotion) { filter: drop-shadow(0 0 2px rgba(223,189,120,.8)) drop-shadow(0 0 7px rgba(223,189,120,.9)); }
      rect:has(> animateMotion) { filter: drop-shadow(0 0 6px rgba(223,189,120,.8)); }
      g:has(> circle):has(> path.stroke-check) { filter: drop-shadow(0 0 6px rgba(143,199,162,.7)); }
    }
    @media (prefers-reduced-motion: reduce) { .bms-spark, .bms-success, .bms-doodle { display: none; } }
</style>
  <rect class="bg" width="800" height="588" />
  <rect class="bms-marker" aria-hidden="true" x="22.0" y="9.9" width="365.0" height="29.2" rx="6.5" transform="rotate(-.5 22.0 24.5)"/><path class="bms-under" aria-hidden="true" d="M28.0 43.0 q 24.0 -2.4 48.0 0 t 48 0 t 48 0 t 48 0 t 48 0 t 48 0 t 48 0"/><text x="28" y="35" class="title">CC–CV：到压切换，到流截止</text>
  <text x="28" y="65" class="muted" font-size="17">盯住同一时刻：电压先上升，稳住以后，电流才开始回落。</text>

  <g aria-label="充电的三个节点">
    <rect x="28" y="89" width="234" height="63" rx="9" class="cc" />
    <rect x="283" y="89" width="234" height="63" rx="9" class="cv" />
    <rect x="538" y="89" width="234" height="63" rx="9" class="end" />
    <g class="txt" font-size="18" font-weight="700">
      <text x="46" y="115">① 恒流 CC</text>
      <text x="301" y="115">② 恒压 CV</text>
      <text x="556" y="115">③ 截止</text>
    </g>
    <g class="muted" font-size="16">
      <text x="46" y="138">电流 2 A，电压上升</text>
      <text x="301" y="138">电压 4.20 V，电流回落</text>
      <text x="556" y="138">电流降到 0.10 A</text>
    </g>
  </g>

  <rect x="28" y="169" width="744" height="301" rx="14" class="panel" /><g class="bms-doodle" aria-hidden="true" transform="translate(742.0 193.0)"><animateTransform attributeName="transform" type="rotate" values="-6;7;-6" keyTimes="0;0.5;1" dur="5.4s" repeatCount="indefinite" additive="sum"/><animate attributeName="opacity" values="0.62;1;0.62" keyTimes="0;0.5;1" dur="3.6s" repeatCount="indefinite"/><path class="bms-spark-fill" d="M0 -9 L2.3 -2.3 L9 0 L2.3 2.3 L0 9 L-2.3 2.3 L-9 0 L-2.3 -2.3 Z"/></g><g class="bms-doodle" aria-hidden="true" transform="translate(706.0 183.0)"><animateTransform attributeName="transform" type="rotate" values="5;-4;5" keyTimes="0;0.5;1" dur="6.2s" repeatCount="indefinite" additive="sum"/><animate attributeName="opacity" values="0.5;0.9;0.5" keyTimes="0;0.5;1" dur="4.4s" repeatCount="indefinite"/><path class="bms-spark-soft" d="M0 -5.5 L1.4 -1.4 L5.5 0 L1.4 1.4 L0 5.5 L-1.4 1.4 L-5.5 0 L-1.4 -1.4 Z"/></g><g class="bms-doodle" aria-hidden="true"><circle class="bms-spark-fill" cx="724.0" cy="202.0" r="1.3"/><circle class="bms-spark-soft" cx="692.0" cy="199.0" r="1.1"/></g>
  <text x="52" y="205" class="txt" font-size="17" font-weight="700">端电压 U</text>
  <text x="52" y="322" class="txt" font-size="17" font-weight="700">充电电流 I</text>
  <g class="rule" fill="none">
    <path d="M52 302 H748 M114 422 H730 l-6 -4 m6 4 -6 4" />
    <path d="M114 231 H668 M114 346 H668 M114 407 H668" stroke-dasharray="4 5" />
  </g>
  <g class="tick" fill="none" stroke-dasharray="5 5">
    <path d="M459.3506 217 V422 M668 217 V422" />
  </g>
  <g fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <polyline id="cccv-voltage-curve" class="line-v" points="114,285 124.0727,281 459.3506,231 668,231" />
    <polyline id="cccv-current-curve" class="line-i" points="114,346 459.3506,346 481.6545,372.3 503.9584,384.7 526.2623,392.2 548.5662,398.1 578.7844,402.1 609.0026,404.6 639.2208,406.1 668,407" />
  </g>
  <g class="dot" stroke-width="2">
    <circle cx="459.3506" cy="231" r="5.5" class="fill-v" />
    <circle cx="668" cy="231" r="5.5" class="fill-v" />
    <circle cx="459.3506" cy="346" r="5.5" class="fill-i" />
    <circle cx="668" cy="407" r="5.5" class="fill-i" />
  </g>
  <g font-size="15">
    <text x="102" y="284" class="fill-v" text-anchor="end">3.60 V</text>
    <text x="661" y="218" class="fill-v" text-anchor="end">4.20 V · 示例上限</text>
    <text x="102" y="352" class="fill-i" text-anchor="end">2 A</text>
    <text x="680" y="410" class="fill-i">0.05C</text>
    <text x="114" y="447" class="muted" text-anchor="middle">0</text>
    <text x="459.3506" y="447" class="txt" text-anchor="middle">约 48 min · 转恒压</text>
    <text x="668" y="447" class="txt" text-anchor="middle">约 77 min · 截止</text>
    <text x="743" y="393" class="muted" text-anchor="end">时间</text>
  </g>

  <!-- The shared x clock maps each teaching minute to .15 s of playback. -->
  <g class="playback" opacity="0" aria-hidden="true">
    <animate attributeName="opacity" values="1;1" dur="14s" repeatCount="indefinite" />
    <g id="cccv-playhead" transform="translate(114 0)">
      <animateTransform attributeName="transform" type="translate" values="114 0;668 0;668 0" keyTimes="0;0.825;1" dur="14s" repeatCount="indefinite" />
      <path d="M0 216 V422" class="cursor" fill="none" stroke-width="1.5" />
      <circle id="cccv-voltage-dot" cy="285" r="8" class="fill-v dot" stroke-width="2.5">
        <animate attributeName="cy" values="285;281;231;231;231" keyTimes="0;0.015;0.514285714;0.825;1" dur="14s" repeatCount="indefinite" />
      </circle>
      <circle id="cccv-current-dot" cy="346" r="8" class="fill-i dot" stroke-width="2.5">
        <animate attributeName="cy" values="346;346;372.3;384.7;392.2;398.1;402.1;404.6;406.1;407;407" keyTimes="0;0.514285714;0.5475;0.580714286;0.613928571;0.647142857;0.692142857;0.737142857;0.782142857;0.825;1" dur="14s" repeatCount="indefinite" />
      </circle>
    </g>
    <rect id="cccv-active-cc" x="28" y="89" width="234" height="63" rx="9" class="active" opacity="0">
      <animate attributeName="opacity" calcMode="discrete" values="1;0;0;0" keyTimes="0;0.514285714;0.825;1" dur="14s" repeatCount="indefinite" />
    </rect>
    <rect id="cccv-active-cv" x="283" y="89" width="234" height="63" rx="9" class="active" opacity="0">
      <animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.514285714;0.825;1" dur="14s" repeatCount="indefinite" />
    </rect>
    <rect id="cccv-active-end" x="538" y="89" width="234" height="63" rx="9" class="active" opacity="0">
      <animate attributeName="opacity" calcMode="discrete" values="0;0;1;1" keyTimes="0;0.514285714;0.825;1" dur="14s" repeatCount="indefinite" />
    </rect>
    <g opacity="0">
      <animate attributeName="opacity" calcMode="discrete" values="0;0;1;1" keyTimes="0;0.514285714;0.825;1" dur="14s" repeatCount="indefinite" />
      <circle class="fill-v" cx="736" cy="120" r="10" />
      <path class="stroke-check dot" d="m732 120 3 3 5 -6" stroke-width="2" stroke-linecap="round" fill="none" />
    <g class="bms-spark" aria-hidden="true" transform="translate(755.0 108.0)"><animateTransform attributeName="transform" type="rotate" values="-8;9;-8" keyTimes="0;0.5;1" dur="4.8s" repeatCount="indefinite" additive="sum"/><animate attributeName="opacity" values="0.55;1;0.55" keyTimes="0;0.5;1" dur="3.2s" repeatCount="indefinite"/><path class="bms-spark-fill" d="M0 -9 L2.3 -2.3 L9 0 L2.3 2.3 L0 9 L-2.3 2.3 L-9 0 L-2.3 -2.3 Z"/></g><g class="bms-success" aria-hidden="true" transform="translate(736.0 120.0)"><animateTransform attributeName="transform" type="scale" values="0.55;0.55;1.28;1;1" keyTimes="0;0.8250;0.8650;0.9450;1" dur="14s" repeatCount="indefinite" additive="sum"/><circle class="bms-halo" r="12.5"/><path class="bms-spark-line" d="M14.0 0 h 8 M10.1 -10.1 l 6 -6 M-10.1 -10.1 l -6 -6 M-14.0 0 h -8 M-10.1 10.1 l -6 6 M10.1 10.1 l 6 6"/></g></g>
  </g>

  <rect x="28" y="487" width="744" height="83" rx="10" class="cv" />
  <text x="48" y="518" class="txt" font-size="18" font-weight="700">到了 4.20 V，后面还有约 0.30 Ah</text>
  <text x="48" y="543" class="txt" font-size="16">额定 2 Ah 的教学示例：恒流约 1.60 Ah，恒压再补约 0.30 Ah。</text>
  <text x="48" y="562" class="muted" font-size="13">动画压缩了时间；实际电压上限和截止电流按电芯规格设定。</text>
</svg>
