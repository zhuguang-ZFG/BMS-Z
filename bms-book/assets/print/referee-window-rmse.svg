  <rect class="barlow" x="540" y="217" width="40" height="73" opacity="0.9" style="opacity: 0.9;"/>
  <rect class="barmid" x="610" y="271" width="40" height="19" opacity="0.9" style="opacity: 0.9;"/>
  <rect class="barhi" x="680" y="191" width="40" height="99" opacity="0.9" style="opacity: 0.9;"/>
  <text class="txt" x="560" y="212" text-anchor="middle" opacity="1" style="opacity: 1;">14.32</text>
  <text class="txt" x="630" y="266" text-anchor="middle" opacity="1" style="opacity: 1;">3.08</text>
  <text class="txt" x="700" y="186" text-anchor="middle" opacity="1" style="opacity: 1;">19.87</text>
  <text class="small" x="560" y="308" text-anchor="middle">SOC&lt;0.20</text>
