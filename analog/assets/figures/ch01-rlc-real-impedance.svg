<text x="684" y="130" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="15" font-weight="700" fill="#b45309">① 三段各管一摊</text>
<text x="684" y="158" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12" fill="#14213d">低频：C 说了算，−20dB/dec 下坡</text>
<text x="684" y="178" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12" fill="#14213d">中频：ESR 兜底 → 谷底深度</text>
<text x="684" y="198" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12" fill="#14213d">高频：ESL 接管，+20dB/dec 上翘</text>
<text x="684" y="218" font-family="'Book Mono',monospace" font-size="11" fill="#52606d">f0 = 1/(2π√(ESL·C))</text>
</g>

<g>
<rect x="668" y="240" width="256" height="130" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
<rect x="668" y="240" width="256" height="28" rx="6" fill="#e6f6f2"/>
<rect x="668" y="254" width="256" height="14" fill="#e6f6f2"/>
<text x="684" y="260" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="15" font-weight="700" fill="#0f766e">② 频段分工，翻译成时间</text>
<text x="684" y="288" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12" fill="#14213d">100kHz ↔ 周期 10µs</text>
<text x="684" y="306" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12" fill="#14213d">→ 电解扛毫秒级负载阶跃</text>
<text x="684" y="326" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12" fill="#14213d">16MHz ↔ 周期 63ns</text>
<text x="684" y="344" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12" fill="#14213d">→ MLCC 接纳秒级高频瞬态</text>
<text x="684" y="364" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" font-weight="700" fill="#b45309">100MHz 处：电解 13Ω vs MLCC 0.6Ω</text>
</g>

