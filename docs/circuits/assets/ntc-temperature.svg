<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <title>NTC 测温动画：越热阻值越小</title>
  <rect width="800" height="400" fill="#f8fafc"/>
  <style>
  text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
  /* 深色模式：GitHub 深色主题下对调底色与文字色，只覆盖配色，不动几何与动画。
     stroke="#fff" 保持白色——那是彩色徽标上的勾选，不在覆盖范围内。 */
  @media (prefers-color-scheme: dark){
  rect[fill="#f8fafc"]{fill:#0f172a}
  rect[fill="#fff"]{fill:#1e293b}
  [fill="#f1f5f9"]{fill:#1e293b}
  [stroke="#f1f5f9"]{stroke:#1e293b}
  [fill="#e2e8f0"]{fill:#334155}
  [stroke="#e2e8f0"]{stroke:#334155}
  [fill="#cbd5e1"]{fill:#475569}
  [stroke="#cbd5e1"]{stroke:#475569}
  [fill="#64748b"]{fill:#94a3b8}
  [stroke="#64748b"]{stroke:#94a3b8}
  [fill="#475569"]{fill:#cbd5e1}
  [stroke="#475569"]{stroke:#cbd5e1}
  [fill="#334155"]{fill:#e2e8f0}
  [stroke="#334155"]{stroke:#e2e8f0}
  [fill="#1e293b"]{fill:#f1f5f9}
  [stroke="#1e293b"]{stroke:#f1f5f9}
  [fill="#dbeafe"]{fill:#1e3a8a}
  [stroke="#dbeafe"]{stroke:#1e3a8a}
  [fill="#eff6ff"]{fill:#172554}
  [stroke="#eff6ff"]{stroke:#172554}
  [fill="#bfdbfe"]{fill:#1e40af}
  [stroke="#bfdbfe"]{stroke:#1e40af}
  [fill="#1d4ed8"]{fill:#60a5fa}
  [stroke="#1d4ed8"]{stroke:#60a5fa}
  [fill="#1e40af"]{fill:#93c5fd}
  [stroke="#1e40af"]{stroke:#93c5fd}
  [fill="#2563eb"]{fill:#60a5fa}
  [stroke="#2563eb"]{stroke:#60a5fa}
  [fill="#3b82f6"]{fill:#60a5fa}
  [stroke="#3b82f6"]{stroke:#60a5fa}
  [fill="#ecfdf5"]{fill:#022c22}
  [stroke="#ecfdf5"]{stroke:#022c22}
  [fill="#a7f3d0"]{fill:#065f46}
  [stroke="#a7f3d0"]{stroke:#065f46}
  [fill="#86efac"]{fill:#166534}
  [stroke="#86efac"]{stroke:#166534}
  [fill="#065f46"]{fill:#6ee7b7}
  [stroke="#065f46"]{stroke:#6ee7b7}
  [fill="#059669"]{fill:#34d399}
  [stroke="#059669"]{stroke:#34d399}
  [fill="#fef2f2"]{fill:#450a0a}
  [stroke="#fef2f2"]{stroke:#450a0a}
  [fill="#fecaca"]{fill:#7f1d1d}
  [stroke="#fecaca"]{stroke:#7f1d1d}
  [fill="#fca5a5"]{fill:#b91c1c}
  [stroke="#fca5a5"]{stroke:#b91c1c}
  [fill="#991b1b"]{fill:#fca5a5}
  [stroke="#991b1b"]{stroke:#fca5a5}
  [fill="#dc2626"]{fill:#f87171}
  [stroke="#dc2626"]{stroke:#f87171}
  [fill="#fffbeb"]{fill:#451a03}
  [stroke="#fffbeb"]{stroke:#451a03}
  [fill="#fef3c7"]{fill:#78350f}
  [stroke="#fef3c7"]{stroke:#78350f}
  [fill="#92400e"]{fill:#fcd34d}
  [stroke="#92400e"]{stroke:#fcd34d}
  [fill="#b45309"]{fill:#fbbf24}
  [stroke="#b45309"]{stroke:#fbbf24}
  }
</style>

  <text x="400" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">NTC 测温：一颗电阻怎么变成温度计</text>

  <!-- 电池与温度计 -->
  <rect x="60" y="120" width="110" height="150" rx="8" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
  <text x="115" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">电池</text>
  <rect x="150" y="130" width="14" height="90" rx="7" fill="#fff" stroke="#334155" stroke-width="1.5"/>
  <rect x="153" y="200" width="8" height="17" fill="#ef4444">
    <animate attributeName="height" values="17;60;60;17" keyTimes="0;0.45;0.6;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="y" values="200;157;157;200" keyTimes="0;0.45;0.6;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="157" y="240" text-anchor="middle" font-size="10" fill="#64748b">NTC</text>

  <!-- 分压电路 -->
  <line x1="300" y1="90" x2="460" y2="90" stroke="#334155" stroke-width="2.5"/>
  <text x="300" y="82" font-size="12" fill="#334155">VCC</text>
  <polyline points="300,90 300,110 312,120 288,140 312,160 288,180 300,190" fill="none" stroke="#334155" stroke-width="2.5"/>
  <text x="330" y="145" font-size="12" fill="#334155">固定电阻 R</text>
  <line x1="300" y1="190" x2="300" y2="210" stroke="#334155" stroke-width="2.5"/>
  <!-- 中点 -->
  <circle cx="300" cy="210" r="5" fill="#334155"/>
  <line x1="300" y1="210" x2="420" y2="210" stroke="#2563eb" stroke-width="2.5"/>
  <!-- NTC（下臂） -->
  <polyline points="300,210 300,230 312,240 288,260 312,280 288,300 300,310" fill="none" stroke="#b45309" stroke-width="2.5"/>
  <line x1="300" y1="310" x2="300" y2="330" stroke="#334155" stroke-width="2.5"/>
  <line x1="270" y1="330" x2="330" y2="330" stroke="#334155" stroke-width="2.5"/>
  <g font-size="12" fill="#b45309" font-weight="bold">
    <text x="335" y="245" opacity="0">NTC = 10kΩ（25°C）<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.25;0.3;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="335" y="245" opacity="0">NTC = 6.5kΩ（42°C）<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.33;0.55;0.6;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="335" y="245" opacity="0">NTC = 4.2kΩ（60°C）<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.63;0.9;0.95;1" dur="8s" repeatCount="indefinite"/></text>
  </g>

  <!-- 中点电压表 -->
  <rect x="360" y="230" width="16" height="100" fill="none" stroke="#334155" stroke-width="1.5"/>
  <rect x="362" y="266" width="12" height="62" fill="#2563eb">
    <animate attributeName="height" values="62;30;30;62" keyTimes="0;0.45;0.6;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="y" values="266;298;298;266" keyTimes="0;0.45;0.6;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="368" y="348" text-anchor="middle" font-size="11" fill="#1d4ed8">中点电压</text>

  <!-- ADC 与读数 -->
  <line x1="420" y1="210" x2="500" y2="210" stroke="#334155" stroke-width="2.5"/>
  <rect x="500" y="170" width="110" height="80" rx="10" fill="#fff" stroke="#334155" stroke-width="2"/>
  <text x="555" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">ADC</text>
  <text x="555" y="225" text-anchor="middle" font-size="10" fill="#64748b">+ 查表</text>
  <g font-size="16" font-weight="bold" fill="#dc2626">
    <text x="650" y="215" opacity="0">25°C<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.25;0.3;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="650" y="215" opacity="0">42°C<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.33;0.55;0.6;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="650" y="215" opacity="0">60°C ⚠<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.63;0.9;0.95;1" dur="8s" repeatCount="indefinite"/></text>
  </g>

  <text x="400" y="380" text-anchor="middle" font-size="14" fill="#475569">负温度系数：越热阻值越小 → 分压点电压越低（NTC 在下臂）→ ADC 读数查表即得温度</text>
</svg>
