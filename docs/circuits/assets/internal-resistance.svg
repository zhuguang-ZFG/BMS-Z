<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640">
  <title>内阻压降与回弹动画</title>
  <rect width="800" height="640" fill="#f8fafc"/>
  <style>
  text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
  /* 深色模式：GitHub 深色主题下对调底色与文字色，只覆盖配色，不动几何与动画。
     stroke="#fff" 保持白色——那是彩色徽标上的勾选，不在覆盖范围内。 */
  @media (prefers-color-scheme: dark){
  rect[fill="#f8fafc"]{fill:#0f172a}
  rect[fill="#fff"]{fill:#1e293b}
  [fill="#f1f5f9"]{fill:#1e293b}
  [stroke="#f1f5f9"]{stroke:#1e293b}
  [fill="#e2e8f0"]{fill:#334155}
  [stroke="#e2e8f0"]{stroke:#334155}
  [fill="#cbd5e1"]{fill:#475569}
  [stroke="#cbd5e1"]{stroke:#475569}
  [fill="#64748b"]{fill:#94a3b8}
  [stroke="#64748b"]{stroke:#94a3b8}
  [fill="#475569"]{fill:#cbd5e1}
  [stroke="#475569"]{stroke:#cbd5e1}
  [fill="#334155"]{fill:#e2e8f0}
  [stroke="#334155"]{stroke:#e2e8f0}
  [fill="#1e293b"]{fill:#f1f5f9}
  [stroke="#1e293b"]{stroke:#f1f5f9}
  [fill="#dbeafe"]{fill:#1e3a8a}
  [stroke="#dbeafe"]{stroke:#1e3a8a}
  [fill="#eff6ff"]{fill:#172554}
  [stroke="#eff6ff"]{stroke:#172554}
  [fill="#bfdbfe"]{fill:#1e40af}
  [stroke="#bfdbfe"]{stroke:#1e40af}
  [fill="#1d4ed8"]{fill:#60a5fa}
  [stroke="#1d4ed8"]{stroke:#60a5fa}
  [fill="#1e40af"]{fill:#93c5fd}
  [stroke="#1e40af"]{stroke:#93c5fd}
  [fill="#2563eb"]{fill:#60a5fa}
  [stroke="#2563eb"]{stroke:#60a5fa}
  [fill="#3b82f6"]{fill:#60a5fa}
  [stroke="#3b82f6"]{stroke:#60a5fa}
  [fill="#ecfdf5"]{fill:#022c22}
  [stroke="#ecfdf5"]{stroke:#022c22}
  [fill="#a7f3d0"]{fill:#065f46}
  [stroke="#a7f3d0"]{stroke:#065f46}
  [fill="#86efac"]{fill:#166534}
  [stroke="#86efac"]{stroke:#166534}
  [fill="#065f46"]{fill:#6ee7b7}
  [stroke="#065f46"]{stroke:#6ee7b7}
  [fill="#059669"]{fill:#34d399}
  [stroke="#059669"]{stroke:#34d399}
  [fill="#fef2f2"]{fill:#450a0a}
  [stroke="#fef2f2"]{stroke:#450a0a}
  [fill="#fecaca"]{fill:#7f1d1d}
  [stroke="#fecaca"]{stroke:#7f1d1d}
  [fill="#fca5a5"]{fill:#b91c1c}
  [stroke="#fca5a5"]{stroke:#b91c1c}
  [fill="#991b1b"]{fill:#fca5a5}
  [stroke="#991b1b"]{stroke:#fca5a5}
  [fill="#dc2626"]{fill:#f87171}
  [stroke="#dc2626"]{stroke:#f87171}
  [fill="#fffbeb"]{fill:#451a03}
  [stroke="#fffbeb"]{stroke:#451a03}
  [fill="#fef3c7"]{fill:#78350f}
  [stroke="#fef3c7"]{stroke:#78350f}
  [fill="#92400e"]{fill:#fcd34d}
  [stroke="#92400e"]{stroke:#fcd34d}
  [fill="#b45309"]{fill:#fbbf24}
  [stroke="#b45309"]{stroke:#fbbf24}
  }
</style>

  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">内阻：带载「腿软」，卸载回弹</text>

  <!-- ============ 左侧：等效电路 ============ -->
  <!-- 走线（开关处断开） -->
  <path d="M120,188 L120,150 L300,150" fill="none" stroke="#cbd5e1" stroke-width="3"/>
  <path d="M335,150 L350,150 L350,330 L120,330 L120,272" fill="none" stroke="#cbd5e1" stroke-width="3"/>

  <!-- 电池（电动势不变） -->
  <circle cx="120" cy="230" r="42" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text x="120" y="226" text-anchor="middle" font-size="13" fill="#065f46">电池</text>
  <text x="120" y="246" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46">3.9V</text>

  <!-- 内阻：颜色与阻值随「老化」幕变化 -->
  <rect x="180" y="135" width="90" height="30" rx="4" fill="#fef3c7" stroke="#92400e" stroke-width="2">
    <animate attributeName="fill" values="#78350f;#78350f;#7f1d1d;#7f1d1d" keyTimes="0;0.62;0.66;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#fcd34d;#fcd34d;#b91c1c;#b91c1c" keyTimes="0;0.62;0.66;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <!-- 箱体动画色钉为深色系（SMIL 覆盖 CSS），文字只能用不重映射的白 -->
  <text x="225" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">R_内</text>
  <text x="225" y="182" text-anchor="middle" font-size="12" fill="#92400e">20mΩ（新）
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.62;0.64;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="225" y="199" text-anchor="middle" font-size="12" fill="#dc2626" opacity="0">60mΩ（老化）
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.62;0.66;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- 开关：开/合两态交叉淡入 -->
  <line x1="300" y1="150" x2="327" y2="132" stroke="#64748b" stroke-width="3">
    <animate attributeName="opacity" values="1;1;0;0;1;1;0;0" keyTimes="0;0.18;0.2;0.43;0.45;0.62;0.64;1" dur="12s" repeatCount="indefinite"/>
  </line>
  <line x1="300" y1="150" x2="335" y2="150" stroke="#2563eb" stroke-width="3" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0;1;1" keyTimes="0;0.18;0.2;0.43;0.45;0.62;0.64;1" dur="12s" repeatCount="indefinite"/>
  </line>
  <text x="317" y="122" text-anchor="middle" font-size="12" fill="#475569">开关</text>
  <text x="350" y="122" text-anchor="middle" font-size="12" fill="#475569">端子</text>

  <!-- 负载 -->
  <rect x="280" y="315" width="70" height="30" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="315" y="335" text-anchor="middle" font-size="13" fill="#475569">负载</text>

  <!-- 电流：开关合上时沿线流动的小点 -->
  <circle r="5" fill="#2563eb" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0;1;1" keyTimes="0;0.18;0.2;0.43;0.45;0.62;0.64;1" dur="12s" repeatCount="indefinite"/>
    <animateMotion path="M120,188 L120,150 L350,150 L350,330 L120,330 L120,272" keyPoints="0;0;1;0;1;1" keyTimes="0;0.18;0.45;0.62;0.99;1" calcMode="linear" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#2563eb" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0;1;1" keyTimes="0;0.18;0.2;0.43;0.45;0.62;0.64;1" dur="12s" repeatCount="indefinite" begin="-1.1s"/>
    <animateMotion path="M120,188 L120,150 L350,150 L350,330 L120,330 L120,272" keyPoints="0;0;1;0;1;1" keyTimes="0;0.18;0.45;0.62;0.99;1" calcMode="linear" dur="12s" repeatCount="indefinite" begin="-1.1s"/>
  </circle>
  <text x="200" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb" opacity="0">I = 20A（示例）
    <animate attributeName="opacity" values="0;0;1;1;0;0;1;1" keyTimes="0;0.18;0.2;0.43;0.45;0.62;0.64;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <text x="215" y="378" text-anchor="middle" font-size="12" fill="#475569">内阻 = 水管里变细的那一段：流量越大，压降越多</text>

  <!-- ============ 右侧：端电压-时间曲线 ============ -->
  <line x1="420" y1="350" x2="770" y2="350" stroke="#64748b" stroke-width="1.5"/>
  <line x1="420" y1="350" x2="420" y2="88" stroke="#64748b" stroke-width="1.5"/>
  <text x="412" y="84" text-anchor="end" font-size="11" fill="#475569">V</text>
  <text x="766" y="370" text-anchor="end" font-size="12" fill="#475569">时间</text>
  <text x="420" y="370" text-anchor="middle" font-size="11" fill="#475569">0</text>

  <text x="412" y="104" text-anchor="end" font-size="11" fill="#475569">4.2V</text>
  <text x="412" y="146" text-anchor="end" font-size="11" fill="#475569">3.9V</text>
  <text x="412" y="201" text-anchor="end" font-size="11" fill="#475569">3.5V</text>
  <text x="412" y="312" text-anchor="end" font-size="11" fill="#475569">2.7V</text>
  <text x="412" y="354" text-anchor="end" font-size="11" fill="#475569">2.4V</text>

  <!-- OCV 参考虚线 -->
  <line x1="420" y1="142" x2="770" y2="142" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="425" y="136" text-anchor="start" font-size="11" fill="#475569">OCV 3.9V</text>

  <!-- 新电池轨迹：静置→跌落→回弹，一笔画出 -->
  <path d="M420,142 L500,142 L500,197 L650,197 L650,142 L770,142" fill="none" stroke="#2563eb" stroke-width="2.5"
        pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" opacity="0">
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.02;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dashoffset" values="100;0;0" keyTimes="0;0.55;1" dur="12s" repeatCount="indefinite"/>
  </path>

  <!-- 带载期间的压落阴影 -->
  <rect x="500" y="142" width="150" height="55" fill="#fecaca" opacity="0">
    <animate attributeName="opacity" values="0;0;0.55;0.55;0;0" keyTimes="0;0.3;0.35;0.55;0.6;1" dur="12s" repeatCount="indefinite"/>
  </rect>

  <!-- 老化电池轨迹：同样负载跌穿到 2.7V -->
  <path d="M500,142 L500,308 L650,308 L650,142" fill="none" stroke="#dc2626" stroke-width="2.5"
        pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.62;0.64;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.62;0.88;1" dur="12s" repeatCount="indefinite"/>
  </path>

  <!-- 分幕标注 -->
  <text x="520" y="122" text-anchor="start" font-size="13" fill="#334155" opacity="0">静置：端电压 = 电动势
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.15;0.18;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="510" y="224" text-anchor="start" font-size="13" font-weight="bold" fill="#dc2626" opacity="0">I·R = 0.4V 落差（示例）
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.36;0.55;0.6;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="657" y="170" text-anchor="start" font-size="13" font-weight="bold" fill="#059669" opacity="0">撤载 → 回弹
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.48;0.52;0.59;0.62;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="505" y="290" text-anchor="start" font-size="13" font-weight="bold" fill="#dc2626" opacity="0">老化：同样 20A → 跌到 2.7V
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.8;0.84;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <text x="400" y="412" text-anchor="middle" font-size="13" fill="#475569">关键：端电压 = 电动势 − I·R；带载读数虚低，静置才回真——老化的电池腿更软。</text>
<!-- deepened-formula --><rect x="24" y="438.0" width="752" height="188" rx="6" fill="#fff" stroke="#e2e8f0"/><text x="40" y="458.0" font-size="13" fill="#1e293b">底栏：ΔV = I×R。图上的 20 A 落在 0.40 V 和 1.20 V</text><text x="40" y="474.0" font-size="11" fill="#475569">压降 V</text><line x1="70.0" y1="474.0" x2="70.0" y2="588.0" stroke="#64748b" stroke-width="1.5"/><line x1="70.0" y1="588.0" x2="460.0" y2="588.0" stroke="#64748b" stroke-width="1.5"/><line x1="70.0" y1="588.0" x2="70.0" y2="593.0" stroke="#64748b"/><text x="70.0" y="606.0" text-anchor="middle" font-size="11" fill="#475569">0</text><line x1="265.0" y1="588.0" x2="265.0" y2="593.0" stroke="#64748b"/><text x="265.0" y="606.0" text-anchor="middle" font-size="11" fill="#475569">20</text><line x1="460.0" y1="588.0" x2="460.0" y2="593.0" stroke="#64748b"/><text x="460.0" y="606.0" text-anchor="middle" font-size="11" fill="#475569">40</text><line x1="65.0" y1="570.5" x2="70.0" y2="570.5" stroke="#64748b"/><text x="62.0" y="574.5" text-anchor="end" font-size="11" fill="#475569">0.40</text><line x1="65.0" y1="535.4" x2="70.0" y2="535.4" stroke="#64748b"/><text x="62.0" y="539.4" text-anchor="end" font-size="11" fill="#475569">1.20</text><line x1="65.0" y1="482.8" x2="70.0" y2="482.8" stroke="#64748b"/><text x="62.0" y="486.8" text-anchor="end" font-size="11" fill="#475569">2.40</text><polyline points="70.0,588.0 79.8,587.1 89.5,586.2 99.2,585.4 109.0,584.5 118.8,583.6 128.5,582.7 138.2,581.9 148.0,581.0 157.8,580.1 167.5,579.2 177.2,578.4 187.0,577.5 196.8,576.6 206.5,575.7 216.2,574.8 226.0,574.0 235.8,573.1 245.5,572.2 255.2,571.3 265.0,570.5 274.8,569.6 284.5,568.7 294.2,567.8 304.0,567.0 313.8,566.1 323.5,565.2 333.2,564.3 343.0,563.4 352.8,562.6 362.5,561.7 372.2,560.8 382.0,559.9 391.8,559.1 401.5,558.2 411.2,557.3 421.0,556.4 430.8,555.6 440.5,554.7 450.2,553.8 460.0,552.9" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="70.0,588.0 79.8,585.4 89.5,582.7 99.2,580.1 109.0,577.5 118.8,574.8 128.5,572.2 138.2,569.6 148.0,567.0 157.8,564.3 167.5,561.7 177.2,559.1 187.0,556.4 196.8,553.8 206.5,551.2 216.2,548.5 226.0,545.9 235.8,543.3 245.5,540.6 255.2,538.0 265.0,535.4 274.8,532.8 284.5,530.1 294.2,527.5 304.0,524.9 313.8,522.2 323.5,519.6 333.2,517.0 343.0,514.3 352.8,511.7 362.5,509.1 372.2,506.4 382.0,503.8 391.8,501.2 401.5,498.6 411.2,495.9 421.0,493.3 430.8,490.7 440.5,488.0 450.2,485.4 460.0,482.8" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle r="5" fill="#b45309"><animate attributeName="cx" values="70.0;118.8;167.5;216.2;265.0;313.8;362.5;411.2;460.0" keyTimes="0.0000;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1.0000" dur="8s" repeatCount="indefinite"/><animate attributeName="cy" values="588.0;583.6;579.2;574.8;570.5;566.1;561.7;557.3;552.9" keyTimes="0.0000;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1.0000" dur="8s" repeatCount="indefinite"/></circle><text x="460.0" y="606.0" text-anchor="end" font-size="11" fill="#475569">电流 A（示意）</text><text x="480" y="516.0" font-size="12" fill="#334155">蓝 20 mΩ，红 60 mΩ。过原点的直线。</text>
</svg>
