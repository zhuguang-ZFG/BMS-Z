<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440">
  <title>锂电池工作原理动画：离子与电子分头行动</title>
  <rect width="800" height="440" fill="#f8fafc"/>
  <style>text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}</style>

  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">充放电的本质：锂离子走电解液，电子走外电路</text>

  <!-- 外电路（顶部） -->
  <path d="M130,120 V70 H670 V120" fill="none" stroke="#334155" stroke-width="3"/>
  <rect x="340" y="48" width="120" height="44" rx="8" fill="#fff" stroke="#334155" stroke-width="2"/>
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <text x="400" y="76" fill="#1d4ed8" opacity="0">充电器<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.48;0.5;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="400" y="76" fill="#b45309" opacity="0">负载<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.52;1" dur="8s" repeatCount="indefinite"/></text>
  </g>

  <!-- 正极 -->
  <rect x="90" y="120" width="80" height="200" rx="6" fill="#b45309"/>
  <text x="130" y="345" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">正极（脱锂/嵌锂）</text>
  <!-- 负极（石墨层） -->
  <rect x="630" y="120" width="80" height="200" rx="6" fill="#475569"/>
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="636" y1="160" x2="704" y2="160"/>
    <line x1="636" y1="200" x2="704" y2="200"/>
    <line x1="636" y1="240" x2="704" y2="240"/>
    <line x1="636" y1="280" x2="704" y2="280"/>
  </g>
  <text x="670" y="345" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">负极（石墨层间）</text>

  <!-- 电解液与隔膜 -->
  <rect x="170" y="140" width="460" height="160" fill="#dbeafe" opacity="0.55"/>
  <text x="400" y="290" text-anchor="middle" font-size="12" fill="#3b82f6">电解液</text>
  <line x1="400" y1="140" x2="400" y2="300" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="400" y="132" text-anchor="middle" font-size="11" fill="#64748b">隔膜（只许离子过）</text>

  <!-- ===== 充电相（0–4s） ===== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.48;0.5;1" dur="8s" repeatCount="indefinite"/>
    <!-- Li+ 从左到右 -->
    <g fill="#10b981">
      <circle r="8"><animateMotion dur="2.2s" begin="0s" repeatCount="indefinite" path="M185,220 C300,175 500,265 615,220"/></circle>
      <circle r="8"><animateMotion dur="2.2s" begin="0.7s" repeatCount="indefinite" path="M185,220 C300,175 500,265 615,220"/></circle>
      <circle r="8"><animateMotion dur="2.2s" begin="1.4s" repeatCount="indefinite" path="M185,220 C300,175 500,265 615,220"/></circle>
    </g>
    <text x="250" y="180" font-size="13" font-weight="bold" fill="#059669">Li⁺ 嵌入负极 →</text>
    <!-- 电子从左到右走外电路 -->
    <g fill="#f59e0b">
      <circle r="6"><animateMotion dur="2.0s" begin="0s" repeatCount="indefinite" path="M130,115 V70 H670 V115"/></circle>
      <circle r="6"><animateMotion dur="2.0s" begin="0.65s" repeatCount="indefinite" path="M130,115 V70 H670 V115"/></circle>
      <circle r="6"><animateMotion dur="2.0s" begin="1.3s" repeatCount="indefinite" path="M130,115 V70 H670 V115"/></circle>
    </g>
    <text x="540" y="60" font-size="13" font-weight="bold" fill="#b45309">e⁻ 经充电器 →</text>
    <text x="400" y="412" text-anchor="middle" font-size="14" fill="#1d4ed8">充电：外部电源把 Li⁺"赶"进负极石墨层间储存起来</text>
  </g>

  <!-- ===== 放电相（4–8s） ===== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.52;1" dur="8s" repeatCount="indefinite"/>
    <!-- Li+ 从右到左 -->
    <g fill="#10b981">
      <circle r="8"><animateMotion dur="2.2s" begin="0s" repeatCount="indefinite" path="M615,220 C500,265 300,175 185,220"/></circle>
      <circle r="8"><animateMotion dur="2.2s" begin="0.7s" repeatCount="indefinite" path="M615,220 C500,265 300,175 185,220"/></circle>
      <circle r="8"><animateMotion dur="2.2s" begin="1.4s" repeatCount="indefinite" path="M615,220 C500,265 300,175 185,220"/></circle>
    </g>
    <text x="480" y="180" font-size="13" font-weight="bold" fill="#059669">← Li⁺ 回到正极</text>
    <!-- 电子从右到左 -->
    <g fill="#f59e0b">
      <circle r="6"><animateMotion dur="2.0s" begin="0s" repeatCount="indefinite" path="M670,115 V70 H130 V115"/></circle>
      <circle r="6"><animateMotion dur="2.0s" begin="0.65s" repeatCount="indefinite" path="M670,115 V70 H130 V115"/></circle>
      <circle r="6"><animateMotion dur="2.0s" begin="1.3s" repeatCount="indefinite" path="M670,115 V70 H130 V115"/></circle>
    </g>
    <text x="230" y="60" font-size="13" font-weight="bold" fill="#b45309">← e⁻ 经负载做功</text>
    <text x="400" y="412" text-anchor="middle" font-size="14" fill="#b45309">放电：Li⁺ 回到正极，电子被迫绕外电路走——这就是输出给设备的电流</text>
  </g>
</svg>
