<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">起振增长与稳幅是两件事</title>
<desc id="figDesc">示意慢包络：dA/dt=0.8A(1−A²)，A(0)=0.02；不作为灯泡模型。</desc>
<metadata id="visual-timeline">{&quot;duration&quot;: 12, &quot;beats&quot;: [{&quot;name&quot;: &quot;条件&quot;, &quot;start&quot;: 0, &quot;end&quot;: 3, &quot;caption&quot;: &quot;零初值在理想方程里不会自行起振。&quot;}, {&quot;name&quot;: &quot;变化&quot;, &quot;start&quot;: 3, &quot;end&quot;: 6, &quot;caption&quot;: &quot;小幅度增长来自足够的环路余量。&quot;}, {&quot;name&quot;: &quot;比较&quot;, &quot;start&quot;: 6, &quot;end&quot;: 9, &quot;caption&quot;: &quot;幅度增加后，需要限制机制降低有效增益。&quot;}, {&quot;name&quot;: &quot;结论&quot;, &quot;start&quot;: 9, &quot;end&quot;: 12, &quot;caption&quot;: &quot;只有大于一的增益条件不足以保证所需的稳定正弦。&quot;}]}</metadata>
