<path d="M159,390 L198.0,388 L252,391 L255,445.0 L252,486 L193.0,488 L155,484 Z" fill="#2a2927" stroke="#c4b9ab" stroke-width="1.4" /><path d="M161,392L248,393" fill="none" stroke="#ffffff" stroke-width="2" opacity=".7" /><line x1="143" y1="408.0" x2="155" y2="408.0" stroke="#535453" stroke-width="7" stroke-dasharray="" /><line x1="255" y1="408.0" x2="267" y2="408.0" stroke="#535453" stroke-width="7" stroke-dasharray="" /><line x1="143" y1="428.0" x2="155" y2="428.0" stroke="#535453" stroke-width="7" stroke-dasharray="" /><line x1="255" y1="428.0" x2="267" y2="428.0" stroke="#535453" stroke-width="7" stroke-dasharray="" /><line x1="143" y1="448.0" x2="155" y2="448.0" stroke="#535453" stroke-width="7" stroke-dasharray="" /><line x1="255" y1="448.0" x2="267" y2="448.0" stroke="#535453" stroke-width="7" stroke-dasharray="" /><line x1="143" y1="468.0" x2="155" y2="468.0" stroke="#535453" stroke-width="7" stroke-dasharray="" /><line x1="255" y1="468.0" x2="267" y2="468.0" stroke="#535453" stroke-width="7" stroke-dasharray="" /><circle cx="173" cy="406" r="5" fill="#f6f2ed" />
