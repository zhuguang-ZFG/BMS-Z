<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="fv-t fv-d">
  <title id="fv-t">只动一个量，动的那一列就是它</title>
  <desc id="fv-d">把其余条件按住不动，只改一个已知量，连抓几帧按同一位置竖着对齐。别的列原样不动，只有一列的值跟着变，这一列就只能归给被改的那个量。若同时改两个量，两列一起动，谁也说不清哪一列属于哪一个量。</desc>
  <defs>
    <marker id="arrow-accent" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path class="head-accent" d="M0 0L9 4.5L0 9Z"/>
    </marker>
    <style>
      text { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #293b3a; }
      .title { font-size: 20px; font-weight: 700; fill: #293b3a; }
      .sub { font-size: 12px; fill: #626d65; }
      .h { font-size: 15px; font-weight: 700; fill: #293b3a; }
      .body { font-size: 13px; fill: #293b3a; }
      .small { font-size: 12px; fill: #626d65; }
      .accent { fill: #176b73; }
      .green { fill: #377b60; }
      .red { fill: #b84745; }
      .gold { fill: #926717; }
      .paper { fill: #fffdf5; }
      .card { fill: #fffdf5; stroke: #968d77; stroke-width: 1.4; }
      .card-green { fill: #e4f0df; stroke: #377b60; stroke-width: 1.4; }
      .card-gold { fill: #fbefc7; stroke: #926717; stroke-width: 1.4; }
      .card-red { fill: #f6e2df; stroke: #b84745; stroke-width: 1.4; }
      .panel { fill: none; stroke: #968d77; stroke-width: 1.3; stroke-dasharray: 7 5; }
      .cell { fill: #fffdf5; stroke: #968d77; stroke-width: 1.2; }
      .cell-hot { fill: #e4f0df; stroke: #377b60; stroke-width: 1.4; }
      .cell-bad { fill: #f6e2df; stroke: #b84745; stroke-width: 1.4; }
      .term { fill: #fbefc7; stroke: #926717; stroke-width: 1.6; }
      .wire { stroke: #293b3a; stroke-width: 2.2; fill: none; }
      .twist { stroke: #293b3a; stroke-width: 1.4; fill: none; }
      .bar-fix { stroke: #968d77; stroke-width: 3; fill: none; stroke-linecap: round; }
      .bar-var { stroke: #377b60; stroke-width: 3; fill: none; stroke-linecap: round; }
      .flow { stroke: #176b73; stroke-width: 2; fill: none; }
      .fault-dash { stroke: #b84745; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; }
      .leader { stroke: #626d65; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; }
      .dot-green { fill: #377b60; }
      .strike { stroke: #176b73; stroke-width: 2; fill: none; }
      .strip { fill: #e4f0df; stroke: #377b60; stroke-width: 1.4; }
      .head-accent { fill: #176b73; }
      .head-red { fill: #b84745; }
      @media (prefers-color-scheme: dark) {
        text { fill: #edf0e5; }
        .title { fill: #edf0e5; }
        .sub { fill: #b0beb3; }
        .h { fill: #edf0e5; }
        .body { fill: #edf0e5; }
        .small { fill: #b0beb3; }
        .accent { fill: #7ec5c5; }
        .green { fill: #8fc7a2; }
        .red { fill: #f39b91; }
        .gold { fill: #dfbd78; }
        .paper { fill: #223333; }
        .card { fill: #223333; stroke: #71908c; }
        .card-green { fill: #293f35; stroke: #8fc7a2; }
        .card-gold { fill: #453e2b; stroke: #dfbd78; }
        .card-red { fill: #483336; stroke: #f39b91; }
        .panel { stroke: #71908c; }
        .cell { fill: #223333; stroke: #71908c; }
        .cell-hot { fill: #293f35; stroke: #8fc7a2; }
        .cell-bad { fill: #483336; stroke: #f39b91; }
        .term { fill: #453e2b; stroke: #dfbd78; }
        .wire { stroke: #edf0e5; }
        .twist { stroke: #edf0e5; }
        .bar-fix { stroke: #71908c; }
        .bar-var { stroke: #8fc7a2; }
        .flow { stroke: #7ec5c5; }
        .fault-dash { stroke: #f39b91; }
        .leader { stroke: #b0beb3; }
        .dot-green { fill: #8fc7a2; }
        .strike { stroke: #7ec5c5; }
        .strip { fill: #293f35; stroke: #8fc7a2; }
        .head-accent { fill: #7ec5c5; }
        .head-red { fill: #f39b91; }
      }
    </style>
  </defs>

  <rect class="paper" x="0" y="0" width="960" height="560"/>

  <text x="480" y="32" text-anchor="middle" class="title">只动一个量，动的那一列就是它</text>
  <path class="strike" d="M356 42C420 40 540 44 604 41" opacity=".5"/>
  <text x="480" y="60" text-anchor="middle" class="sub">其余量按住不动，别的列就不动；跟着变的列只能归给被动的那个量</text>

  <rect class="card" x="60" y="90" width="360" height="62" rx="10"/>
  <text x="240" y="118" text-anchor="middle" class="h">只动一个量</text>
  <text x="240" y="142" text-anchor="middle" class="small">其余量按住不动</text>
  <path class="flow" d="M424 121H532" marker-end="url(#arrow-accent)"/>
  <rect class="card" x="540" y="90" width="360" height="62" rx="10"/>
  <text x="720" y="118" text-anchor="middle" class="h">连抓几帧，对齐</text>
  <text x="720" y="142" text-anchor="middle" class="small">同一位置竖着比</text>

  <text x="52" y="223" class="small">第一次</text>
  <text x="52" y="273" class="small">第二次</text>
  <text x="52" y="323" class="small">第三次</text>

  <rect class="cell" x="110" y="200" width="46" height="38" rx="4"/>
  <rect class="cell" x="156" y="200" width="46" height="38" rx="4"/>
  <rect class="cell-hot" x="202" y="200" width="46" height="38" rx="4"/>
  <rect class="cell" x="248" y="200" width="46" height="38" rx="4"/>
  <rect class="cell" x="294" y="200" width="46" height="38" rx="4"/>
  <rect class="cell" x="340" y="200" width="46" height="38" rx="4"/>
  <path class="bar-fix" d="M122 219H144"/>
  <path class="bar-fix" d="M168 219H190"/>
  <path class="bar-var" d="M209 219H221"/>
  <path class="bar-fix" d="M260 219H282"/>
  <path class="bar-fix" d="M306 219H328"/>
  <path class="bar-fix" d="M352 219H374"/>

  <rect class="cell" x="110" y="250" width="46" height="38" rx="4"/>
  <rect class="cell" x="156" y="250" width="46" height="38" rx="4"/>
  <rect class="cell-hot" x="202" y="250" width="46" height="38" rx="4"/>
  <rect class="cell" x="248" y="250" width="46" height="38" rx="4"/>
  <rect class="cell" x="294" y="250" width="46" height="38" rx="4"/>
  <rect class="cell" x="340" y="250" width="46" height="38" rx="4"/>
  <path class="bar-fix" d="M122 269H144"/>
  <path class="bar-fix" d="M168 269H190"/>
  <path class="bar-var" d="M209 269H231"/>
  <path class="bar-fix" d="M260 269H282"/>
  <path class="bar-fix" d="M306 269H328"/>
  <path class="bar-fix" d="M352 269H374"/>

  <rect class="cell" x="110" y="300" width="46" height="38" rx="4"/>
  <rect class="cell" x="156" y="300" width="46" height="38" rx="4"/>
  <rect class="cell-hot" x="202" y="300" width="46" height="38" rx="4"/>
  <rect class="cell" x="248" y="300" width="46" height="38" rx="4"/>
  <rect class="cell" x="294" y="300" width="46" height="38" rx="4"/>
  <rect class="cell" x="340" y="300" width="46" height="38" rx="4"/>
  <path class="bar-fix" d="M122 319H144"/>
  <path class="bar-fix" d="M168 319H190"/>
  <path class="bar-var" d="M209 319H241"/>
  <path class="bar-fix" d="M260 319H282"/>
  <path class="bar-fix" d="M306 319H328"/>
  <path class="bar-fix" d="M352 319H374"/>

  <text x="404" y="273" class="body">只有这一列在动</text>
  <path class="flow" d="M516 269H562" marker-end="url(#arrow-accent)"/>

  <rect class="card-green" x="570" y="232" width="346" height="74" rx="10"/>
  <text x="743" y="264" text-anchor="middle" class="h green">它就是那个量</text>
  <text x="743" y="290" text-anchor="middle" class="small">记下位置、长度、端序</text>

  <rect class="card-red" x="40" y="362" width="880" height="58" rx="10"/>
  <text x="78" y="398" class="h red">反例：同时改两个量</text>
  <text x="240" y="398" class="body">两列一起动，谁也说不清哪一列归谁</text>

  <rect class="strip" x="80" y="440" width="800" height="52" rx="12"/>
  <text x="480" y="472" text-anchor="middle" class="h green">一次只动一个量：别的列不动，动的那一列就归给它</text>

  <text x="480" y="528" text-anchor="middle" class="small">图上只画载荷列；帧尾校验位另算，别混进对比</text>
</svg>
