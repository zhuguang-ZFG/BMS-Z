</style><rect class="bg" x="0" y="-156" width="800" height="796" /><text class="title" x="24" y="-128">C 倍率：同一块电池，三种龙头开度</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 同一块电池，龙头开度就是倍率。<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 卡通按 10 Ah：0.5C=5 A，1C=10 A，2C=20 A。<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ C 跟着容量走。10 A 对 20 Ah 只是 0.5C。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 底栏直线 I=20 Ah×C。0.5C→10 A，2C→40 A。示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect width="800" height="640" class="bg" />
  <text x="180" y="68" text-anchor="middle" font-size="15" font-weight="bold" class="hi">0.5C</text>
  <text x="400" y="68" text-anchor="middle" font-size="15" font-weight="bold" class="hi">1C</text>
  <text x="620" y="68" text-anchor="middle" font-size="15" font-weight="bold" class="hi">2C</text>

  
  <rect x="135" y="90" width="90" height="100" rx="6" stroke-width="2" class="fill-boxb stroke-b" />
  <rect x="355" y="90" width="90" height="100" rx="6" stroke-width="2" class="fill-boxb stroke-b" />
  <rect x="575" y="90" width="90" height="100" rx="6" stroke-width="2" class="fill-boxb stroke-b" />
  <rect x="139" y="94" width="82" height="92" class="fill-boxb">
    <animate attributeName="height" values="92;92;69;69" keyTimes="0;0.25;0.55;1" dur="12s" repeatCount="indefinite" />
    <animate attributeName="y" values="94;94;117;117" keyTimes="0;0.25;0.55;1" dur="12s" repeatCount="indefinite" />
  </rect>
  <rect x="359" y="94" width="82" height="92" class="fill-boxb">
    <animate attributeName="height" values="92;92;46;46" keyTimes="0;0.25;0.55;1" dur="12s" repeatCount="indefinite" />
    <animate attributeName="y" values="94;94;140;140" keyTimes="0;0.25;0.55;1" dur="12s" repeatCount="indefinite" />
  </rect>
  <rect x="579" y="94" width="82" height="92" class="fill-boxb">
    <animate attributeName="height" values="92;92;2;2" keyTimes="0;0.25;0.55;1" dur="12s" repeatCount="indefinite" />
    <animate attributeName="y" values="94;94;184;184" keyTimes="0;0.25;0.55;1" dur="12s" repeatCount="indefinite" />
  </rect>
  <text x="232" y="140" text-anchor="start" font-size="13" class="txt">5A</text>
  <text x="452" y="140" text-anchor="start" font-size="13" class="txt">10A</text>
  <text x="672" y="140" text-anchor="start" font-size="13" class="txt">20A</text>
  <text x="620" y="145" text-anchor="middle" font-size="12" font-weight="bold" opacity="0" class="warn">已放空
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.48;0.52;1" dur="12s" repeatCount="indefinite" />
  </text>

  
  <line x1="180" y1="196" x2="180" y2="282" stroke-width="5" class="stroke-b" />
  <line x1="400" y1="196" x2="400" y2="282" stroke-width="9" class="stroke-b" />
  <line x1="620" y1="196" x2="620" y2="282" stroke-width="15" class="stroke-b" />
  <circle r="4" opacity="0" class="fill-b">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.25;0.28;1" dur="12s" repeatCount="indefinite" />
    <animateMotion path="M180,200 L180,278" keyPoints="0;0;1;1" keyTimes="0;0.25;0.55;1" calcMode="linear" dur="12s" repeatCount="indefinite" />
  </circle>
  <circle r="4" opacity="0" class="fill-b">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.25;0.28;1" dur="12s" repeatCount="indefinite" />
