<polygon class="marker-wash" points="45.1,23.4 259.7,23.5 670.0,24.5 667.9,63.9 370.1,62.9 43.2,62.3" fill="#a4630f" opacity="0.13"/>
<text x="52" y="58" font-size="38" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">开关电容的平均电阻仍依赖绝对电容</text><text x="52" y="94" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">两相不重叠、每相充分建立；C1 反复在 V1 与 V2 之间转接。</text>
<rect x="70" y="160" width="390" height="280" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<rect class="ink-echo" x="70" y="160" width="390" height="280" rx="6" stroke="#37424e" stroke-width="2" fill="none" opacity="0.32" transform="translate(1.31 -0.89) rotate(0.07 265.0 300.0)"/>
<text x="265" y="205" font-size="28" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">φ1：接 V1</text>
<text x="115" y="290" font-size="25" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">V1</text>
<path d="M165 280 L225 280" fill="none" stroke="#16202b" stroke-width="3"/>
<circle cx="225" cy="280" r="5" fill="#16202b"/>
<path d="M225 280 L315 280" fill="none" stroke="#16202b" stroke-width="3"/>
<path d="M315 280 L315 305" fill="none" stroke="#16202b" stroke-width="3"/><path d="M295 305 L335 305" fill="none" stroke="#16202b" stroke-width="3"/><path d="M295 317 L335 317" fill="none" stroke="#16202b" stroke-width="3"/><path d="M315 317 L315 345" fill="none" stroke="#16202b" stroke-width="3"/><text x="343" y="318" font-size="23" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">C1</text>
<text x="315" y="390" font-size="23" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">参考地</text>
<rect x="570" y="160" width="390" height="280" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<rect class="ink-echo" x="570" y="160" width="390" height="280" rx="6" stroke="#37424e" stroke-width="2" fill="none" opacity="0.32" transform="translate(-1.53 0.83) rotate(0.07 765.0 300.0)"/>
<text x="765" y="205" font-size="28" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">φ2：接 V2</text>
<text x="615" y="290" font-size="25" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">V2</text>
<path d="M665 280 L725 280" fill="none" stroke="#16202b" stroke-width="3"/>
<circle cx="725" cy="280" r="5" fill="#16202b"/>
<path d="M725 280 L815 280" fill="none" stroke="#16202b" stroke-width="3"/>
<path d="M815 280 L815 305" fill="none" stroke="#16202b" stroke-width="3"/><path d="M795 305 L835 305" fill="none" stroke="#16202b" stroke-width="3"/><path d="M795 317 L835 317" fill="none" stroke="#16202b" stroke-width="3"/><path d="M815 317 L815 345" fill="none" stroke="#16202b" stroke-width="3"/><text x="843" y="318" font-size="23" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">C1</text>
<text x="815" y="390" font-size="23" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">参考地</text>
<path d="M470 300 Q510.00 300.28 550 300" fill="none" stroke="#1f5d7a" stroke-width="2.5" stroke-dasharray=""/><polygon points="550,300 540,305 540,295" fill="#1f5d7a"/>
<text x="45" y="510" font-size="26" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">每周期 ΔQ=C1(V1−V2)，Iavg=fclk·ΔQ，Req=1/(fclk·C1)。</text>
<text x="45" y="565" font-size="25" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">C1=1 pF、fclk=100 kHz → Req=10 MΩ；1 V 差产生 100 nA。</text>
<text x="45" y="620" font-size="25" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">与 C2 组成时间常数：τ=C2/(fclk·C1)，此时才出现电容比。</text>
<text x="45" y="670" font-size="23" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">绝对 Req 看绝对 C1；滤波时间常数看比值，两者的精度来源应分开。</text>
</svg>
