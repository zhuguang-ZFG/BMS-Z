<svg xmlns="http://www.w3.org/2000/svg" width="880" height="680" viewBox="0 -156 880 680" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>主动均衡拓扑对照示意图</title>
  <desc>主动均衡拓扑对照示意图</desc><style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .fill-boxb { fill: #ddf4ff; }
    .fill-boxg { fill: #dafbe1; }
    .fill-boxr { fill: #ffebe9; }
    .fill-boxy { fill: #fff8c5; }
    .fill-b { fill: #0969da; }
    .fill-g { fill: #1a7f37; }
    .fill-r { fill: #cf222e; }
    .fill-y { fill: #9a6700; }
    .fill-ink { fill: #57606a; }
    .fill-muted { fill: #e2e8f0; }
    .fill-lockb { fill: #0969da; }
    .stroke-panel { stroke: #d0d7de; }
    .stroke-axis { stroke: #57606a; }
    .stroke-b { stroke: #0969da; }
    .stroke-g { stroke: #1a7f37; }
    .stroke-r { stroke: #cf222e; }
    .stroke-y { stroke: #bf8700; }
    .stroke-check { stroke: #ffffff; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .on { fill: #ffffff; font-size: 13px; font-weight: bold; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .fill-boxb { fill: #12233a; }
      .fill-boxg { fill: #0f2415; }
      .fill-boxr { fill: #3d1214; }
      .fill-boxy { fill: #2d2607; }
      .fill-b { fill: #4493f8; }
      .fill-g { fill: #3fb950; }
      .fill-r { fill: #ff7b72; }
      .fill-y { fill: #d29922; }
      .fill-ink { fill: #8b949e; }
      .fill-muted { fill: #30363d; }
      .fill-lockb { fill: #0969da; }
      .stroke-panel { stroke: #30363d; }
      .stroke-axis { stroke: #8b949e; }
      .stroke-b { stroke: #4493f8; }
      .stroke-g { stroke: #3fb950; }
      .stroke-r { stroke: #ff7b72; }
      .stroke-y { stroke: #d29922; }
      .stroke-check { stroke: #0d1117; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .on { fill: #ffffff; }
      .lineb { stroke: #4493f8; }
    }
</style><rect class="bg" x="0" y="-156" width="880" height="680" /><text class="title" x="24" y="-128">示意图：同一模型里，能量从哪一节搬到哪</text><rect class="panel" x="24" y="-112" width="832" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 示意图：同一模型里，能量从哪一节搬到哪<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 高节 → 电阻发热<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 损耗等于扔掉的电。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="468" width="832" height="44" rx="6" /><text class="small" x="40" y="496">电感式和开关电容式在同一电流下的实测效率仍缺，见任务板 T8。示意。</text><rect width="880" height="460" class="bg" />
  <rect x="16" y="48" width="200" height="250" rx="8" class="panel" />
  <text x="116" y="74" text-anchor="middle" font-size="15" font-weight="bold" class="txt">被动</text>
  <rect x="48" y="96" width="136" height="36" rx="4" class="fill-boxr stroke-axis" />
  <text x="116" y="119" text-anchor="middle" font-size="13" class="txt">高节 → 电阻发热</text>
  <text x="32" y="160" font-size="13" class="txt">损耗等于扔掉的电。</text>
  <text x="32" y="184" font-size="13" class="txt">用来当比较基准。</text>

  <rect x="232" y="48" width="200" height="250" rx="8" class="panel" />
  <text x="332" y="74" text-anchor="middle" font-size="15" font-weight="bold" class="txt">节到节</text>
  <rect x="248" y="100" width="70" height="36" rx="4" class="fill-boxr stroke-axis"><animate attributeName="stroke-width" values="5;2;5" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite" /></rect>
  <text x="283" y="123" text-anchor="middle" font-size="13" class="txt">高节</text>
  <rect x="346" y="100" width="70" height="36" rx="4" class="fill-boxb stroke-axis"><animate attributeName="stroke-width" values="2;5;2" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite" /></rect>
  <text x="381" y="123" text-anchor="middle" font-size="13" class="txt">低节</text>
  <circle cy="118" r="6" class="fill-b">
    <animate attributeName="cx" values="270;390;270" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite" />
  </circle>
  <text x="248" y="168" font-size="13" class="txt">模型里最快、最省。</text>
  <text x="248" y="192" font-size="13" class="txt">不是实测效率。</text>

  <rect x="448" y="48" width="200" height="250" rx="8" class="panel" />
  <text x="548" y="74" text-anchor="middle" font-size="15" font-weight="bold" class="txt">节到包</text>
  <text x="464" y="112" font-size="13" class="txt">高节先送进整包。</text>
  <text x="464" y="136" font-size="13" class="txt">比节到节绕。</text>
  <text x="464" y="170" font-size="13" class="txt">论文没有给出</text>
  <text x="464" y="194" font-size="13" class="txt">可抄的效率百分数。</text>

  <rect x="664" y="48" width="200" height="250" rx="8" class="panel" />
  <text x="764" y="74" text-anchor="middle" font-size="15" font-weight="bold" class="txt">包到节</text>
  <text x="680" y="112" font-size="13" class="txt">整包给低节补。</text>
  <text x="680" y="146" font-size="13" class="warn">效率低于 50% 时，</text>
  <text x="680" y="170" font-size="13" class="warn">损耗可以超过被动。</text>
  <text x="680" y="204" font-size="13" class="txt">50% 是模型结论。</text>

  <text x="16" y="332" font-size="14" class="txt">口径：Baronti 等，Journal of Power Sources，2014。变换器共用一个效率和速度假设，不均衡随机抽取。</text>
  <text x="16" y="358" font-size="14" class="txt">蓝点只表示节到节在搬。不看动画，四格文字已经能对照。</text>
  <text x="16" y="390" font-size="14" class="gold">这张是示意图，不是电路实拍，也不是某台主动均衡板的效率。</text>
  <text x="16" y="422" font-size="14" class="txt">电感式和开关电容式在同一电流下的实测效率仍缺，见任务板 T8。</text>
</svg>