- id: ch10-555-fault-tree
  source: docs/p1-11-ch10.md#10.3
  before: '- **输出常高、6 脚电压 >2/3 Vcc 不动**：放电管没工作——7 脚虚焊、R2 开路，或芯片损坏。放电管击穿是 555 的头号死法：它每次翻转都要硬扛放电电流。R2 取值太小或电容太大（>100 µF 的电解直挂）时峰值电流超限，管子逐渐退化，先是频率漂移，后是彻底常高。

    - **频率对但占空比漂移**：R1/R2 之一阻值变（电位器接触不良是常客），或 5 脚滤波电容漏电。漏电阻抗与内部分压链并联，阈值被拉偏，充放电时间同向变化、占空比不变才怪。换电容前先量 5 脚直流电压：应恰好 2/3 Vcc，偏离即外因。

    - **频率随温度狂漂**：X7R/Y5V 电容在干活（见上面的预算账），或定时电阻用了负温度系数的碳膜老货。判据：热风枪轻吹，频率变化 >5% 就是元件介质问题，不是芯片问题——芯片自身温漂只有几十 ppm/°C 级。

    - **起振迟缓或偶发停振**：电源爬升太慢（大容量输入电容 + 限流），电容在阈值还没建立前已充过 2/3，触发器状态不定。RESET 脚的正确用法在此：4 脚加 RC 延时，保证"阈值先立、振荡后起"。

    - **面包板行、焊到板上不行**：面包板插孔间的寄生电容（2–5 pF）与接触电阻参与了定时。高频电路（>100 kHz）移植时频率系统性偏移是常态，按板上实测重算 R 值。反向案例也存在：面包板上振荡、PCB 上不振，多半是地回路变短后放电管的开关毛刺直接耦合进 2 脚。5 脚电容和就近去耦这时已经不是建议，是处方。'
  after: 诊断从测量条件开始。输出常高可能是触发一直有效、THRES 没到门限、接线错误或放电路径故障，单看 OUT 无法判定“放电管击穿”。常低先查供电和 RESET，再查触发。CONT 开路电压以手册范围判断，不要求恰等于 $2V_{CC}/3$。温漂要分别改变芯片和 RC 的温度，排除测量负载；热风一吹频率变 5% 不能唯一锁定电容介质，更不能用这种方法证明芯片没有问题。
  caption: 555 的测量排故入口。按图内条件回代，示意不作器件保证。
  removed_prose_chars: 420
  relationship: replaces-text
- id: ch10-astable-reverse-design
  source: docs/p1-11-ch10.md#10.4
  before: 若 38.9 kHz 超出允许窗，把 18 kΩ 换成 16.9 kΩ+1.5 kΩ 串联，或者上一只多圈电位器修调。遥控器载波对频率偏差很宽容（接收头带宽 ±2 kHz 级），对占空比更不敏感——这就是它敢用 RC 振荡器的原因。
  after: 反算38kHz。先取C=1nF、RA=1kΩ，则$RA+2RB=1/(\ln2·38kHz·1nF)≈37.966kΩ$，所需RB≈18.483kΩ。取18kΩ时约38.992kHz，高占空比51.35%；若取16.9kΩ+1.5kΩ=18.4kΩ，则约38.167kHz。接着加入R/C容差、器件偏差和温区，再与具体接收头、红外协议的允许载波、突发周期和占空比比较。不能把某个接收头“±2kHz”或“对占空比不敏感”推广到所有红外系统。
  caption: 载波频率反算与回算。按图内条件回代，示意不作器件保证。
  removed_prose_chars: -118
  relationship: replaces-text
- id: ch10-duty-fifty-paths
  source: docs/p1-11-ch10.md#10.4
  before: '**占空比两个极端的代价**：标准接法占空比 $=\dfrac{R_1+R_2}{R_1+2R_2}$。想逼近 100%：$R_1\gg R_2$。但 R2 顶着放电管电流与最小阻值下限，R1 又受漏电流上限，两头一夹，99% 已是实用极限。再往下压，低电平窄脉冲宽度 $0.693R_2C$ 会逼近比较器+放电管的总延迟，波形开始畸变。想逼近 50%：$R_1\ll R_2$ 时占空比趋近 50%，但永远大于 50%，数学上达不到。R1 太小还会让放电期间电源经 R1、放电管直通：R1=100 Ω、12 V 时峰值 120 mA 直灌放电管，芯片发热、频率漂移。两个极端的教训是同一条：**公式只管理想区，元件的物理下限圈出可用区**。'
  after: RA与RB不能只为占空比逼近极限而任意取值。接近50%要RA≪RB，RA的电源直通电流随之增大；接近100%要RA≫RB，低脉冲可能短到延迟不能忽略。两端都受放电路径、漏电和接收器最小脉宽约束，没有统一的“99%是实用极限”。输入电流对大电阻的上限、寄生电容对小电容的下限，要在实际电压与器件上分别核算。
  caption: 对称占空比的条件。按图内条件回代，示意不作器件保证。
  removed_prose_chars: 147
  relationship: replaces-text
- id: ch10-monostable-budget
  source: docs/p1-11-ch10.md#10.5
  before: '**定时精度的完整预算**（单稳态版）：$t=1.1RC$ 的误差源逐项——电阻 ±1%、电容（薄膜 ±5%，COG 小容量 ±2%）、芯片阈值偏差（双极版阈值实际落在 0.65–0.68 Vcc 之间，厂商数据手册给的范围，贡献 ±2%–4%）、比较器延迟（µs 级，只在 ms 以下脉宽值得提）、温度（主项仍是电容介质）。'
  after: 上图把门限散差当作**明确的示意输入**：上阈比例 α=0.65–0.68、R±1%、C±5%，对应相对标称 $RC\ln3$ 的最短约 89.873%、最长约 109.991%，即 −10.13%/+9.99%。实际 NE555 的输入阈值表不是这个窄区间，且最新版已移除旧初始定时误差表项；不能把演示中的 α 窗口包装成手册保证。用具体手册的定时条件或经过验证的参数界限，避免同时计入已覆盖同一效应的初始定时误差和门限误差。
  caption: 单稳态精度的角点预算。按图内条件回代，示意不作器件保证。
  removed_prose_chars: -53
  relationship: replaces-text
- id: ch10-recovery-gap
  source: docs/p1-11-ch10.md#10.5
  before: 若下一个触发在电容还没放完时到达，第二次定时从"半满的电容"起算，脉宽系统性缩短——连发触发时后一拍总比前一拍短。
  after: 示意 VCC=5 V、RA=100 kΩ、C=10 µF、rd=100 Ω。恢复 1 ms 后残压约 1.228 V，下一拍只有约 0.817 s；恢复 5 ms 后残压约 27.3 mV，下一拍约 1.093 s，相比零初值 1.099 s 已接近，但是否足够仍取决于容差预算。即使无限等候，因电源还在馈电，终值也是约 5 mV 而非严格零伏。不能按“电容大于 10 µF 就统一留百微秒”判断恢复。
  caption: 恢复残压与第二拍。按图内条件回代，示意不作器件保证。
  removed_prose_chars: -116
  relationship: replaces-text
- id: ch10-first-pulse-v2
  source: docs/p1-11-ch10.md#10.2
  before: '- **第一拍永远偏长**：上电时电容从 0 V 而不是 1/3 Vcc 起充，第一个高电平宽度是 $1.1(R_1+R_2)C$ 而不是 $0.693(R_1+R_2)C$，约为稳态的 1.6 倍。拿 555 做上电时序、首拍就喂给计数器的场合，这一拍差值要进预算。'
  after: 三种模式的公式各有初始条件。标准无稳态的稳态高段为$(RA+RB)C\ln2$，低段为$RBC\ln2$；标准单稳态从零充到$2V{CC}/3$才得到$RC\ln3≈1.1RC$。双稳态没有这项RC定时。对第一拍，若供电已稳定且电容确实从零开始，无稳态高段也是$(RA+RB)C\ln3$，比稳态高段长$\ln3/\ln2≈1.585$倍。慢上电、未放完的电容和门控重启会改变初值，不能说首拍“永远”长这个倍数。
  caption: 首次从零起充，比稳态高脉冲更长。示意 9 V、RA+RB=7.8 kΩ、C=100 nF；电源已经稳定。
  removed_prose_chars: -86
  relationship: replaces-text
- id: ch10-discharge-floor-v2
  source: docs/p1-11-ch10.md#10.3
  before: '**克隆料与打磨件**：555 是仿制重灾区。廉价"NE555"的常见问题有三类。其一，分压电阻比值散（阈值偏出 0.30/0.70 之外）；其二，放电管饱和压降高（放电段放不干净，频率偏高且随温度漂）；其三，输出级缩水（标 200 mA 实测 80 mA 就限流）。'
  after: VD 增大使放电电流减小、低段变长，并不是“终点抬高使频率变高”。实际 VD 随电流和温度变化，必要时用器件曲线或仿真积分，不能把这张固定 VD 示意图当保证。板面污染的漏电则要看接到哪里：流向地的漏电减慢充电、可能加快放电；漏向电源可能相反。因此“雨天一定定时变短”也不是普遍规律。清洁、烘干、涂覆和降低阻抗都可减少问题；保护环若要减小漏电，应考虑跟随敏感节点电位，接地铜环可能只是新增漏电路径。
  caption: 放电低点抬高，放到下门限反而更慢。示意 9 V、RB=6.8 kΩ、C=100 nF；固定放电压降 VD。
  removed_prose_chars: -69
  relationship: replaces-text
- id: ch10-diode-duty-v2
  source: docs/p1-11-ch10.md#10.4
  before: '1. **二极管抄近路**：R2 两端并一只二极管（充电时导通），充电只走 R1、放电走 R2，占空比 $=\dfrac{R_1}{R_1+R_2}$，取 R1=R2 即 50%。代价是二极管正向压降（约 0.6 V）缩窄了电容的实际摆幅，频率略升且随温度微变——精密场合用肖特基把压降影响压小。

    2. **单电阻回授接法**：去掉 R1，用电阻 R 从 OUT（3 脚）直接给 C 充放电，阈值脚接在 C 上。输出高时经 R 充、低时经 R 放，充放时间常数天然相等，占空比自动 50%，$f\approx\dfrac{0.72}{RC}$。隐患：输出高电平不是满 Vcc，双极版要低 1.4 V。充电目标变了，阈值却没变，频率就随电源与负载微动。CMOS 版轨到轨输出时，这个接法最干净。

    3. **干脆换拓扑**：要 50.000% 又稳，用高一倍频率振荡再 D 触发器二分频——数字域的占空比是结构保证的，与 RC 无关。'
  after: 门限仍由内部分压链决定；降低的是充电目标。示意 5 V、RA=RB=10 kΩ、C=100 nF、VD=0，VF=0.6 V 时高占空比约 57.58%，不是 50%。还要检查二极管电流始终为正：本接法充电末端要求 $(V_{CC}-V_F-V_H)/R_A≥V_F/R_B$。不满足时，后段回到另一条电阻路径，需要分段求解；肖特基较小的压降也不能代替这个检查。
  caption: 二极管有压降，等电阻也不等于 50%。示意 5 V、RA=RB=10 kΩ、C=100 nF；VD=0、恒定 VF。
  removed_prose_chars: 205
  relationship: replaces-text
- id: ch10-output-feedback-v2
  source: docs/p1-11-ch10.md#10.4
  before: '2. **单电阻回授接法**：去掉 R1，用电阻 R 从 OUT（3 脚）直接给 C 充放电，阈值脚接在 C 上。输出高时经 R 充、低时经 R 放，充放时间常数天然相等，占空比自动 50%，$f\approx\dfrac{0.72}{RC}$。隐患：输出高电平不是满 Vcc，双极版要低 1.4 V。充电目标变了，阈值却没变，频率就随电源与负载微动。CMOS 版轨到轨输出时，这个接法最干净。

    3. **干脆换拓扑**：要 50.000% 又稳，用高一倍频率振荡再 D 触发器二分频——数字域的占空比是结构保证的，与 RC 无关。'
  after: 必须同时有 VOH>VH、VOL<VL。VOH 下滑时高段变长；一旦不能达到上阈，振荡停止。示意 5 V、R=72 kΩ、C=10 nF 的理想双轨输出约 1.002 kHz，而不是任何负载下的精密 1 kHz。更换 CMOS 可减轻轻载摆幅问题，仍需以受载电平与温度范围验收。下图固定 VOL=0.1 V，只扫描 VOH，刻意把两者影响分开。
  caption: 从输出脚充电，负载会改变计时时间。示意 5 V、R=72 kΩ、C=10 nF、VOL=0.1 V；VOH 单独扫描。
  removed_prose_chars: 83
  relationship: replaces-text
- id: ch10-control-sweep-v2
  source: docs/p1-11-ch10.md#10.4
  before: '**5 脚调制的定量边界**：把控制电压送进 CTRL，等效于把上阈值从 2/3 Vcc 挪到 $V_{CTRL}$（下阈值跟着挪到 $V_{CTRL}/2$）。充电时间变为 $t_1=-(R_1+R_2)C\ln\dfrac{V_{CC}-V_{CTRL}}{V_{CC}-V_{CTRL}/2}$，对 $V_{CTRL}$ 非线性。拿 555 做 VCO，频压特性是条弯线：只在 ±0.5 V 的小窗口里近似线性，压控增益约 $\dfrac{\partial f}{\partial V_{CTRL}}$ 随工作点变。所以 555 VCO 适合做"能扫频的蜂鸣器"，不适合做锁相环里的线性压控源。工程边界：$V_{CTRL}$ 建议在 0.45–0.9 Vcc 之间，再低放电段塌缩、再高充电段逼近 Vcc 指数尾部，频率对噪声极度敏感。'
  after: 理想放电下低段不因门限同比缩放而改变，高段则明显非线性；VC越接近VCC，末端充电越慢。示意同一9V、1kΩ/6.8kΩ/100nF网络，VC=6V时回到约988.1Hz的标称点。线性化只在选定工作点附近成立，增益应由导数和允许误差求出，不存在通用“±0.5V都线性”的窗口。可用控制范围还受输入共模、驱动阻抗、脚电流与噪声限制，不能把0.45–0.9VCC当作所有型号的保证。
  caption: CTRL 改变门限，频率响应不是直线。示意 9 V、RA=1 kΩ、RB=6.8 kΩ、C=100 nF，理想放电。
  removed_prose_chars: 153
  relationship: replaces-text
- id: ch10-monostable-leakage-v2
  source: docs/p1-11-ch10.md#10.5
  before: 查漏电账：47 µF 钽电容漏电流典型 <1 µA，在 560 kΩ 上压降 <0.56 V，约为阈值的 1/6（9 V 供电时）。定时拉长误差 <10%，可接受。若换同容量铝电解且是货架老货，漏电 3 µA 时误差翻倍还不稳——同一原理图，电容介质选了不同的世界。
  after: 示意 9 V、560 kΩ、47 µF 从零充到 6 V，无漏电约 28.915 s，恒流漏电 1 µA 时约 32.663 s，增长约 12.96%；不能用“压降只有 0.56 V”直接推出误差小于 10%。当总泄漏达到 $(9-6)/560kΩ≈5.357µA$，最终电压不高于上阈，理想模型中永远不能正常结束。真实泄漏可能随电压、温度和时间变化，需要按实际模型积分，不能把这条恒流曲线当特定钽电容或铝电解的规格。
  caption: 漏电先拉长脉宽，过大时永远达不到上阈。示意 9 V、R=560 kΩ、C=47 µF；恒流漏电流出电容节点。
  removed_prose_chars: -73
  relationship: replaces-text
- id: ch10-reset-ramp-v2
  source: docs/p1-11-ch10.md#10.5
  before: 4 脚接法：Vcc 经 100 kΩ 电阻到 4 脚，4 脚经 4.7 µF 电容到地，时间常数 0.47 s。复位阈值约 0.4–1 V（厂商数据手册范围），从 0 充到 0.7 V（12 V 系统）约 $t=0.47\,s\times\ln\dfrac{12}{12-0.7}\approx28\,ms$——远不够。
  after: RESET的RC延时不等于RC常数本身。理想高阻输入、12V阶跃、100kΩ与4.7µF时，常数为0.47s，越过0.3/0.7/1V分别只需约11.9/28.3/40.9ms。NE555§5.5给出RESET门限0.3–1V、典型0.7V，并列出明显的脚电流；直接套理想高阻公式会进一步失准。若必须在上电0.5s后才允许继电器动作，使用有保证的监控器、定时电路或已验证的控制逻辑，不能靠把电阻改成1MΩ就认为已解决。
  caption: RESET 门限低，RC 常数不是复位保持时间。示意理想高阻 RESET：12 V、100 kΩ、4.7 µF；真实脚电流另计。
  removed_prose_chars: -71
  relationship: replaces-text
