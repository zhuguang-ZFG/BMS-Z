<svg role="img" aria-labelledby="figure-title figure-desc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" width="960" height="650" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <title id="figure-title">同样14到1，为什么漏帧数不同</title>
  <desc id="figure-desc">教学模16从14经15、0到1，漏两帧；AUTOSAR R24-11 Profile 1跳过15，从14经0到1，漏一帧。方框写明未收到，虚线路径只说明计数前进。前提是同一会话、未观测跨度受控；这不是完整Profile接收算法。</desc>
