<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">SOH 的两张脸</title>
  <desc id="desc">一颗电芯从中缝分成两半：左半新鲜，极板平直、液面高、眼睛弯起；右半老化，极板区排线皱缩、散落沉积点、眼睛下垂；头顶两只量杯一满一浅。全图无文字无数字。</desc>
