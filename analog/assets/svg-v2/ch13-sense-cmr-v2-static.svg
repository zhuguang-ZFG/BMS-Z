<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">共模误差预算随抑制比分贝换算</title>
<desc id="figDesc">示意共模变化 12 V；输入等效误差=12/10^(CMRR/20)，虚线 0.2 mV。</desc>
<metadata id="visual-timeline">{&quot;duration&quot;: 12, &quot;beats&quot;: [{&quot;name&quot;: &quot;条件&quot;, &quot;start&quot;: 0, &quot;end&quot;: 3, &quot;caption&quot;: &quot;七十分贝只是假设，在本例产生约三点八毫伏。&quot;}, {&quot;name&quot;: &quot;变化&quot;, &quot;start&quot;: 3, &quot;end&quot;: 6, &quot;caption&quot;: &quot;八十分贝仍超过分配给共模的误差。&quot;}, {&quot;name&quot;: &quot;比较&quot;, &quot;start&quot;: 6, &quot;end&quot;: 9, &quot;caption&quot;: &quot;达到约九十五点五六分贝，才压到零点二毫伏。&quot;}, {&quot;name&quot;: &quot;结论&quot;, &quot;start&quot;: 9, &quot;end&quot;: 12, &quot;caption&quot;: &quot;更高抑制不替代允许共模范围，也不保证 PWM 边沿恢复。&quot;}]}</metadata>
