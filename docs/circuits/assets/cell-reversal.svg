<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -156 800 600" font-family="ui-monospace, Consolas, monospace" role="img">
  <title>最弱单体被反极：串联放电末端，容量最小的单体先放空，pack 总电压还没到下限而放电继续——该单体被同伴电流反向充电，电压变负，析铜产气造成永久损伤</title>
  <desc>放电末端继续拉电流：最弱一节先放空到 0 V，随后被同伴电流反着充成负电压，析铜产气，永久损伤。</desc><style>
    .bg { fill: #fffdf5; }
    .panel { fill: #f7f2e5; stroke: #cfc6b2; }
    .txt { fill: #293b3a; font-size: 13px; }
    .small { fill: #626d65; font-size: 12px; }
    .title { fill: #293b3a; font-size: 16px; font-weight: bold; }
    .cell { fill: #e4f0df; stroke: #176b73; stroke-width: 1.5; }
    .weak { fill: #fbefc7; stroke: #926717; stroke-width: 1.5; }
    .bar { fill: #377b60; }
    .barlow { fill: #b84745; }
    .volt { fill: #293b3a; font-size: 12px; }
    .neg { fill: #b84745; font-size: 14px; font-weight: bold; }
    .cur { stroke: #176b73; stroke-width: 2.5; fill: none; stroke-dasharray: 7 5; }
    .badge { fill: #b84745; }
    .badget { fill: #fffdf5; font-size: 12px; font-weight: bold; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #192727; }
      .panel { fill: #223333; stroke: #496160; }
      .txt { fill: #edf0e5; }
      .small { fill: #b0beb3; }
      .title { fill: #edf0e5; }
      .cell { fill: #293f35; stroke: #7ec5c5; }
      .weak { fill: #453e2b; stroke: #dfbd78; }
      .bar { fill: #8fc7a2; }
      .barlow { fill: #f39b91; }
      .volt { fill: #edf0e5; }
      .neg { fill: #f39b91; }
      .cur { stroke: #7ec5c5; }
      .badge { fill: #f39b91; }
      .badget { fill: #192727; }
    }
  </style>
  <rect class="bg" x="0" y="-156" width="800" height="600" /><text class="title" x="24" y="-128">反极：最弱的那节电芯是怎么死掉的</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 反极：最弱的那节电芯是怎么死掉的<animate calcMode="spline" keySplines="0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="308" opacity="0.28">② 放电电流继续流过每一节 →<animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 弱节先放空到 0V<animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="388" width="752" height="44" rx="6" /><text class="txt" x="40" y="416" font-size="13">最弱节先放到 0 V，放电不停就被顶成负压。</text><rect class="bg" width="800" height="380" />
  <rect class="panel" x="40" y="56" width="450" height="286" rx="6" />
  
  <path class="cur" d="M 90 248 H 440"><animate calcMode="spline" keySplines="0.7 0 0.84 0" attributeName="stroke-dashoffset" values="24;0" dur="8s" repeatCount="indefinite" /></path>
  <text class="small" x="330" y="308">放电电流继续流过每一节 →</text>

  
  <g>
    <rect class="cell" x="80" y="100" width="70" height="150" rx="5" />
    <rect class="bar" x="88" y="160" width="54" height="82">
      <animate calcMode="spline" keySplines="0.7 0 0.84 0;0.16 1 0.3 1" attributeName="height" values="90;62;90" dur="8s" repeatCount="indefinite" />
      <animate calcMode="spline" keySplines="0.16 1 0.3 1;0.7 0 0.84 0" attributeName="y" values="152;180;152" dur="8s" repeatCount="indefinite" />
    </rect>
    <text class="volt small" x="92" y="90">3.2V</text><text class="small" x="88" y="278">正常</text>
  </g>
  <g>
    <rect class="cell" x="170" y="100" width="70" height="150" rx="5" />
    <rect class="bar" x="178" y="150" width="54" height="92">
      <animate calcMode="spline" keySplines="0.7 0 0.84 0;0.16 1 0.3 1" attributeName="height" values="100;72;100" dur="8s" repeatCount="indefinite" />
      <animate calcMode="spline" keySplines="0.16 1 0.3 1;0.7 0 0.84 0" attributeName="y" values="142;170;142" dur="8s" repeatCount="indefinite" />
    </rect>
    <text class="volt small" x="182" y="90">3.3V</text><text class="small" x="178" y="278">正常</text>
  </g>
  <g>
    <rect class="weak" x="260" y="100" width="70" height="150" rx="5" />
    <rect class="barlow" x="268" y="230" width="54" height="12">
      <animate calcMode="spline" keySplines="0.7 0 0.84 0;0.16 1 0.3 1" attributeName="height" values="16;2;16" dur="8s" repeatCount="indefinite" />
      <animate calcMode="spline" keySplines="0.16 1 0.3 1;0.7 0 0.84 0" attributeName="y" values="226;240;226" dur="8s" repeatCount="indefinite" />
    </rect>
    <text class="neg small" x="258" y="90">−0.8V ⚠
      <animate calcMode="spline" keySplines="0.7 0 0.84 0;0.16 1 0.3 1" attributeName="opacity" values="1;0.3;1" dur="8s" repeatCount="indefinite" />
    </text>
    <text class="small" x="262" y="278">最弱·已反极</text>
  </g>
  <g>
    <rect class="cell" x="350" y="100" width="70" height="150" rx="5" />
    <rect class="bar" x="358" y="155" width="54" height="87">
      <animate calcMode="spline" keySplines="0.7 0 0.84 0;0.16 1 0.3 1" attributeName="height" values="95;67;95" dur="8s" repeatCount="indefinite" />
      <animate calcMode="spline" keySplines="0.16 1 0.3 1;0.7 0 0.84 0" attributeName="y" values="147;175;147" dur="8s" repeatCount="indefinite" />
    </rect>
    <text class="volt small" x="362" y="90">3.2V</text><text class="small" x="358" y="278">正常</text>
  </g>

  
  <rect class="panel" x="510" y="56" width="250" height="286" rx="6" />
  <circle class="badge" cx="534" cy="84" r="10" /><text class="badget small" x="530" y="88">1</text>
  <text class="txt" x="552" y="89">弱节先放空到 0V</text>
  <circle class="badge" cx="534" cy="126" r="10" /><text class="badget small" x="530" y="130">2</text>
  <text class="txt" x="552" y="131">总电压还没到下限，</text>
  <text class="txt" x="552" y="149">放电继续 → 电流硬推</text>
  <circle class="badge" cx="534" cy="186" r="10" /><text class="badget small" x="530" y="190">3</text>
  <text class="txt" x="552" y="191">弱节被反向充电：</text>
  <text class="txt" x="552" y="209">负极析铜、产气，</text>
  <text class="txt" x="552" y="227">永久损伤甚至内短路</text>
  <text class="small" x="524" y="262">教训：pack 总电压看似正常</text>
  <text class="small" x="524" y="282">≠ 每节都安全——欠压保护</text>
  <text class="small" x="524" y="300">必须逐节看（§2.2 保护逻辑）</text>

  <text class="small" x="60" y="368">图中电量条随放电缓慢下降：最弱一节先归零后被电流顶成负压——串联组里"木桶效应"的极端版</text>
</svg>