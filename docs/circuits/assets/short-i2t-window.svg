<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 590" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>短路示例：500 A 的矩形时窗里，I²t 与接通时间成正比。10 μs 约 2.5 A²s，1 ms 约 250 A²s。</title>
  <desc>对数轴上金点沿 I²t=500²t 移动，红点相位提前半圈。底栏读出这一档的安平方秒。示意，不是示波器。</desc>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; }
    .linek { stroke: #57606a; stroke-width: 2.2; fill: none; stroke-dasharray: 7 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .dotg { fill: #1a7f37; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .linek { stroke: #8b949e; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .dotg { fill: #3fb950; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
    }
  </style>
  <!-- formula: I2t = 500^2 * t; log-log; marks at 2 us, 10 us, 100 us, 1 ms -->
  <rect class="bg" width="800" height="590"/>
  <text class="title" x="24" y="32">同样 500 A，时窗乘 100，I²t 也乘 100（示意）</text>
  <rect class="panel" x="24" y="44" width="752" height="124" rx="6"/>
  <text class="txt" x="40" y="68" opacity="0.28">① 矩形时窗<tspan class="small">　电流一直按 500 A 算，I²t = 500² × t。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="92" opacity="0.28">② 10 μs<tspan class="small">　硬件窗口约 2.5 A²s。2 μs 那档更小，仍是示意。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="116" opacity="0.28">③ 1 ms<tspan class="small">　约 250 A²s。和时间差同一个 100 倍。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="140" opacity="0.28">④ 口诀<tspan class="small">　短路交给硬件的微秒。软件的毫秒来不及。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="180" width="752" height="268" rx="6"/>
  <text class="small" x="40" y="202">I²t / A²s（对数，示意）</text>
  <text class="small" x="200" y="218">红点与金点同一条线，相位差半圈</text>
  <line class="axis" x1="108.0" y1="248.0" x2="108.0" y2="400.0"/>
  <line class="axis" x1="108.0" y1="400.0" x2="720.0" y2="400.0"/>
  <line class="grid" x1="108.0" y1="400.0" x2="108.0" y2="406.0"/>
  <text class="small" x="108.0" y="422.0" text-anchor="middle">1μs</text>
  <line class="grid" x1="261.0" y1="400.0" x2="261.0" y2="406.0"/>
  <text class="small" x="261.0" y="422.0" text-anchor="middle">10μs</text>
  <line class="grid" x1="567.0" y1="400.0" x2="567.0" y2="406.0"/>
  <text class="small" x="567.0" y="422.0" text-anchor="middle">1ms</text>
  <line class="grid" x1="720.0" y1="400.0" x2="720.0" y2="406.0"/>
  <text class="small" x="720.0" y="422.0" text-anchor="middle">10ms</text>
  <line class="grid" x1="102.0" y1="388.6" x2="108.0" y2="388.6"/>
  <text class="small" x="98.0" y="392.6" text-anchor="end">0.5</text>
  <line class="grid" x1="102.0" y1="362.0" x2="108.0" y2="362.0"/>
  <text class="small" x="98.0" y="366.0" text-anchor="end">2.5</text>
  <line class="grid" x1="102.0" y1="286.0" x2="108.0" y2="286.0"/>
  <text class="small" x="98.0" y="290.0" text-anchor="end">250</text>
  <text class="small" x="720" y="444" text-anchor="end">接通时间（对数）</text>
  <polyline class="liner" points="108.0,400.0 118.2,397.5 128.4,394.9 138.6,392.4 148.8,389.9 159.0,387.3 169.2,384.8 179.4,382.3 189.6,379.7 199.8,377.2 210.0,374.7 220.2,372.1 230.4,369.6 240.6,367.1 250.8,364.5 261.0,362.0 271.2,359.5 281.4,356.9 291.6,354.4 301.8,351.9 312.0,349.3 322.2,346.8 332.4,344.3 342.6,341.7 352.8,339.2 363.0,336.7 373.2,334.1 383.4,331.6 393.6,329.1 403.8,326.5 414.0,324.0 424.2,321.5 434.4,318.9 444.6,316.4 454.8,313.9 465.0,311.3 475.2,308.8 485.4,306.3 495.6,303.7 505.8,301.2 516.0,298.7 526.2,296.1 536.4,293.6 546.6,291.1 556.8,288.5 567.0,286.0 577.2,283.5 587.4,280.9 597.6,278.4 607.8,275.9 618.0,273.3 628.2,270.8 638.4,268.3 648.6,265.7 658.8,263.2 669.0,260.7 679.2,258.1 689.4,255.6 699.6,253.1 709.8,250.5 720.0,248.0" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="doty" r="6" cx="154.1" cy="388.6"><animate attributeName="cx" values="154.1;261.0;414.0;567.0;567.0" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="388.6;362.0;324.0;286.0;286.0" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite"/></circle>
  <circle class="dotr" r="4" cx="154.1" cy="388.6"><animate attributeName="cx" values="154.1;261.0;414.0;567.0;567.0" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite" begin="-6s"/><animate attributeName="cy" values="388.6;362.0;324.0;286.0;286.0" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite" begin="-6s"/></circle>
  <rect class="panel" x="24" y="460" width="752" height="68" rx="6"/>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="1">t=2 μs  I²t=0.5 A²s  示意<animate attributeName="opacity" values="1;0;0;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0">t=10 μs  I²t=2.5 A²s  示意<animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0">t=100 μs  I²t=25 A²s  示意<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0">t=1 ms  I²t=250 A²s  示意<animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="24" y="560">500 A、2 μs、10 μs、1 ms 都是数量级示例，不是某颗 MOS 的安全工作区。</text>

</svg>
