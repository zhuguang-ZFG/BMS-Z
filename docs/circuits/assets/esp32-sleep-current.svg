<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -156 800 620" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>ESP32 睡眠-唤醒电流剖面：deep-sleep 约 10µA 的长平台，唤醒后 WiFi 收发形成约 150mA、数百毫秒的尖峰，占空比决定平均电流</title>
  <desc>示意剖面：深睡大约 10 µA，唤醒尖峰大约 150 mA、持续约 0.3 s。平均按 10 µA 加 100 mA 乘 0.3 除以 60 来口算，大约 0.5 mA 级。不是某一颗 ESP32 的规格。</desc>
  <style>
    .bg { fill: #fffdf5; }
    .panel { fill: #f7f2e5; stroke: #cfc6b2; }
    .axis { stroke: #626d65; stroke-width: 1.5; }
    .txt { fill: #293b3a; font-size: 13px; }
    .small { fill: #626d65; font-size: 12px; }
    .title { fill: #293b3a; font-size: 16px; font-weight: bold; }
    .curve { stroke: #176b73; stroke-width: 2.5; fill: none; }
    .spike { fill: #176b73; opacity: 0.12; }
    .sleep { stroke: #377b60; stroke-width: 2; }
    .dot { fill: #926717; }
    .warn { fill: #b84745; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #192727; }
      .panel { fill: #223333; stroke: #496160; }
      .axis { stroke: #b0beb3; }
      .txt { fill: #edf0e5; }
      .small { fill: #b0beb3; }
      .title { fill: #edf0e5; }
      .curve { stroke: #7ec5c5; }
      .spike { fill: #7ec5c5; opacity: 0.18; }
      .sleep { stroke: #8fc7a2; }
      .warn { fill: #f39b91; }
    }
  </style><style id="bms-motion">
    /* bms-motion: 手帐式动效注记（纯装饰，不改技术几何与既有 SMIL 时序） */
    .bms-marker { fill: #fbefc7; opacity: .78; }
    .bms-under { fill: none; stroke: #926717; stroke-width: 2.4; stroke-linecap: round; opacity: .9; }
    .bms-spark-line { fill: none; stroke: #926717; stroke-width: 1.9; stroke-linecap: round; }
    .bms-spark-fill { fill: #926717; }
    .bms-spark-soft { fill: #176b73; opacity: .8; }
    .bms-sticker { fill: none; stroke: #926717; stroke-width: 2; stroke-dasharray: 7 5; stroke-linecap: round; opacity: .85; }
    .bms-halo { fill: none; stroke: #926717; stroke-width: 2; }
    .bms-marker, .bms-under, .bms-sticker, .bms-halo,
    .bms-spark, .bms-success, .bms-doodle { pointer-events: none; }
    circle:has(> animateMotion) { filter: drop-shadow(0 0 2px rgba(146,103,23,.5)) drop-shadow(0 0 5px rgba(196,145,52,.45)); }
    rect:has(> animateMotion) { filter: drop-shadow(0 0 3px rgba(196,145,52,.75)); }
    g:has(> circle):has(> path.stroke-check) { filter: drop-shadow(0 0 5px rgba(55,123,96,.5)); }
    @media (prefers-color-scheme: dark) {
      .bms-marker { fill: #453e2b; opacity: .85; }
      .bms-under { stroke: #dfbd78; }
      .bms-spark-line { stroke: #dfbd78; }
      .bms-spark-fill { fill: #dfbd78; }
      .bms-spark-soft { fill: #7ec5c5; }
      .bms-sticker { stroke: #dfbd78; }
      .bms-halo { stroke: #dfbd78; }
      circle:has(> animateMotion) { filter: drop-shadow(0 0 2px rgba(223,189,120,.8)) drop-shadow(0 0 7px rgba(223,189,120,.9)); }
      rect:has(> animateMotion) { filter: drop-shadow(0 0 6px rgba(223,189,120,.8)); }
      g:has(> circle):has(> path.stroke-check) { filter: drop-shadow(0 0 6px rgba(143,199,162,.7)); }
    }
    @media (prefers-reduced-motion: reduce) { .bms-spark, .bms-success, .bms-doodle { display: none; } }
</style>
  <rect class="bg" x="0" y="-156" width="800" height="620" /><rect class="bms-marker" aria-hidden="true" x="18.0" y="-142.9" width="412.1" height="17.3" rx="3.8" transform="rotate(-.5 18.0 -134.2)"/><path class="bms-under" aria-hidden="true" d="M24.0 -119.0 q 24.0 -2.4 48.0 0 t 48 0 t 48 0 t 48 0 t 48 0 t 48 0 t 48 0 t 48 0"/><text class="title" x="24" y="-128">ESP32 电流剖面：deep-sleep 长平台 + 唤醒收发尖峰</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><g class="bms-doodle" aria-hidden="true" transform="translate(746.0 -88.0)"><animateTransform attributeName="transform" type="rotate" values="-6;7;-6" keyTimes="0;0.5;1" dur="5.4s" repeatCount="indefinite" additive="sum"/><animate attributeName="opacity" values="0.62;1;0.62" keyTimes="0;0.5;1" dur="3.6s" repeatCount="indefinite"/><path class="bms-spark-fill" d="M0 -9 L2.3 -2.3 L9 0 L2.3 2.3 L0 9 L-2.3 2.3 L-9 0 L-2.3 -2.3 Z"/></g><g class="bms-doodle" aria-hidden="true" transform="translate(710.0 -98.0)"><animateTransform attributeName="transform" type="rotate" values="5;-4;5" keyTimes="0;0.5;1" dur="6.2s" repeatCount="indefinite" additive="sum"/><animate attributeName="opacity" values="0.5;0.9;0.5" keyTimes="0;0.5;1" dur="4.4s" repeatCount="indefinite"/><path class="bms-spark-soft" d="M0 -5.5 L1.4 -1.4 L5.5 0 L1.4 1.4 L0 5.5 L-1.4 1.4 L-5.5 0 L-1.4 -1.4 Z"/></g><g class="bms-doodle" aria-hidden="true"><circle class="bms-spark-fill" cx="728.0" cy="-79.0" r="1.3"/><circle class="bms-spark-soft" cx="696.0" cy="-82.0" r="1.1"/></g><text class="txt" x="40" y="-88" opacity="1">① ESP32 电流剖面：deep-sleep 长平台 + 唤醒收发尖峰<animate calcMode="spline" keySplines="0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 电流（对数示意）<animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ deep-sleep（RTC 保持，~10µA）<animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="408" width="752" height="44" rx="6" /><text class="small" x="40" y="436">3000 mAh 的 18650 以月计；唤醒间隔再 ×10，以半年计。示意。</text><rect class="bg" width="800" height="400" />
  <rect class="panel" x="30" y="54" width="740" height="220" rx="6" />
  
  <text class="small" x="40" y="76">电流（对数示意）</text>
  <text class="small" x="46" y="106">150mA</text>
  <text class="small" x="52" y="246">10µA</text>

  
  <path class="sleep" d="M 90 242 L 400 242" />
  <text class="txt" x="140" y="230">deep-sleep（RTC 保持，~10µA）</text>

  
  <path class="spike" d="M 400 242 L 400 96 L 470 96 L 470 242 z" />
  <path class="curve" d="M 400 242 L 400 96 L 470 96 L 470 242" />
  <text class="txt" x="478" y="110">唤醒 ~150mA</text>
  <text class="small" x="478" y="128">连 WiFi + 收发 ≈ 300ms</text>

  
  <path class="sleep" d="M 470 242 L 700 242" />
  <path class="curve" d="M 700 242 L 700 96" opacity="0.35" />
  <text class="small" x="90" y="268">0s</text>
  <text class="small" x="385" y="268">t_wakeup（每分钟 / 每 10 分钟一次）</text>
  <text class="small" x="690" y="268">t</text>

  
  <circle class="dot" r="5">
    <animateMotion calcMode="spline" keySplines="0.42 0 0.58 1" dur="8s" repeatCount="indefinite" path="M 90 242 L 400 242 L 400 96 L 470 96 L 470 242 L 700 242" />
  </circle>

  
  <rect class="panel" x="30" y="284" width="740" height="100" rx="6" />
  <text class="txt" x="44" y="312">平均 ≈ 10 µA + 100 mA × (0.3 s / 60 s) ≈ 0.5 mA 级</text>
  <text class="txt" x="44" y="336">3000 mAh 的 18650 以月计；唤醒间隔再 ×10，以半年计。示意。</text>
  <text class="warn" x="44" y="362">漏关一个外设就是几十 µA。尖峰拉垮弱 LDO，会循环复位。</text>
</svg>