  <title id="title">二次保护是独立栅栏</title>
  <desc id="desc">左侧多米诺相继倒下，最右两张被一堵厚实栅栏拦住；栅栏后的小灯仍亮，绿色虚线表示第二路由独立电源供电，与失效链路之间故意断开。无文字无数字。</desc>
