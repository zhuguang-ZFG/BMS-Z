<text x="44" y="30" font-family="Microsoft YaHei" font-size="12" text-anchor="start" fill="#003153" opacity="0.65" font-weight="normal">保护去抖与回差 · 教学示意</text>
<text x="916" y="30" font-family="Microsoft YaHei" font-size="12" text-anchor="end" fill="#003153" opacity="0.65" font-weight="normal">04 / 06</text>
