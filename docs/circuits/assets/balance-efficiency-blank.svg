</style><rect class="bg" x="0" y="-156" width="880" height="680" /><text class="title" x="24" y="-128">同一工作点才能比效率</text><rect class="panel" x="24" y="-112" width="832" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 同一工作点才能比效率<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 电感式 · 4 串<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ I_bal：待填，与右图同一值<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="468" width="832" height="44" rx="6" /><text class="small" x="40" y="496">Shang 的 94.5% 是四节开关电容、输出 0.91 W。Dai 的 86% 是六节、节到模组。示意。</text><rect width="880" height="460" class="bg" />
  <text x="440" y="50" text-anchor="middle" font-size="13" class="gold">示意图·待实测</text>
  <rect x="24" y="70" width="400" height="250" rx="8" class="panel" />
  <text x="40" y="98" font-size="15" font-weight="bold" class="txt">电感式 · 4 串</text>
  <rect x="48" y="116" width="70" height="40" rx="4" class="fill-boxr stroke-axis"><animate attributeName="stroke-width" values="5;2;5" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite" /></rect>
  <text x="83" y="141" text-anchor="middle" font-size="12" class="txt">高节</text>
  <rect x="160" y="116" width="90" height="40" rx="4" class="fill-boxy stroke-y" />
  <text x="205" y="141" text-anchor="middle" font-size="12" class="txt">电感</text>
  <rect x="292" y="116" width="70" height="40" rx="4" class="fill-boxb stroke-b"><animate attributeName="stroke-width" values="2;5;2" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite" /></rect>
  <text x="327" y="141" text-anchor="middle" font-size="12" class="txt">低节</text>
  <circle cy="136" r="5" class="fill-y">
    <animate attributeName="cx" values="83;327;83" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite" />
  </circle>
  <text x="48" y="186" font-size="13" class="txt">I_bal：待填，与右图同一值</text>
  <text x="48" y="210" font-size="13" class="txt">起始电压对：待填，同一对</text>
  <text x="48" y="234" font-size="13" class="txt">开关频率：待填</text>
  <text x="48" y="266" font-size="15" font-weight="bold" class="txt">η = 待测</text>
  <text x="48" y="292" font-size="12" class="txt">低节收到的能量 / 高节交出的能量</text>
  <rect x="448" y="70" width="408" height="250" rx="8" class="panel" />
  <text x="464" y="98" font-size="15" font-weight="bold" class="txt">开关电容式 · 4 串</text>
  <rect x="472" y="116" width="70" height="40" rx="4" class="fill-boxr stroke-axis" />
  <text x="507" y="141" text-anchor="middle" font-size="12" class="txt">高节</text>
  <rect x="584" y="116" width="90" height="40" rx="4" class="fill-boxg stroke-g" />
  <text x="629" y="141" text-anchor="middle" font-size="12" class="txt">电容</text>
  <rect x="716" y="116" width="70" height="40" rx="4" class="fill-boxb stroke-b" />
  <text x="751" y="141" text-anchor="middle" font-size="12" class="txt">低节</text>
  <circle cy="136" r="5" class="fill-g">
    <animate attributeName="cx" values="507;751;507" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite" />
  </circle>
  <text x="472" y="186" font-size="13" class="txt">I_bal：与左图填写同一个数</text>
  <text x="472" y="210" font-size="13" class="txt">起始电压对：与左图同一对</text>
  <text x="472" y="234" font-size="13" class="txt">开关频率：待填</text>
  <text x="472" y="266" font-size="15" font-weight="bold" class="txt">η = 待测</text>
  <text x="472" y="292" font-size="12" class="txt">同一套表、同一个时间窗</text>
  <text x="24" y="352" font-size="14" class="txt">Shang 的 94.5% 是四节开关电容、输出 0.91 W。Dai 的 86% 是六节、节到模组。</text>
  <text x="24" y="376" font-size="14" class="txt">两篇不填进这一对空格。空格要等同一电流、同一串数的测量。</text>
  <text x="24" y="408" font-size="14" class="txt">黄点和绿点只表示能量从高节移向低节。这张不是某台板的效率。</text>

</svg>