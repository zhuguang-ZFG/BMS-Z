<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">两种电源，两种性子：恒压源与恒流源的手绘速记</title>
<desc id="figDesc">左边是恒压源的水塔比喻：水位保持不变，负载并联，各自取电流，短路相当于决堤。右边是恒流源的泵比喻：流量保持不变，负载串联，同一股水流穿过所有负载，开路相当于断流。底部口诀：恒压源接并联，恒流源接串联。</desc>
<rect width="960" height="640" fill="#fffdf8"/>
<text x="36" y="46" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="28" font-weight="700" fill="#14213d">两种电源，两种性子</text>
<text x="36" y="76" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="15" fill="#52606d">恒压源怕短路，恒流源怕开路；负载接法也跟着反过来。</text>
<line x1="36" y1="94" x2="924" y2="94" stroke="#14213d" stroke-width="2"/>

<rect x="36" y="112" width="426" height="398" fill="none" stroke="#e4d8c3" stroke-width="1.4" stroke-dasharray="10 7"/>
