<svg xmlns="http://www.w3.org/2000/svg" width="800" height="562" viewBox="0 0 800 562" role="img" aria-labelledby="ttl">
<title id="ttl">差分对：只认「差」，不认「同」——运放第一级的灵魂</title>
<desc>差分对：只认「差」，不认「同」——运放第一级的灵魂；节拍：① 差模（IN+升 IN−降）：尾电流此消彼长——vC1 降 vC2 升，输出拉开差距；② 共模（两边同升）：尾源总量钉死，两管谁也多吃不了——输出纹丝不动；③ 温度漂移是同向的=共模——被结构天然免疫，这就是运放第一级必选它的原因</desc>
<defs>
<linearGradient id="bgL" x1="0" y1="0" x2="0" y2="1">
