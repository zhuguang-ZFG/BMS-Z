<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1448 1086" role="img" aria-labelledby="title desc" data-print-width-mm="138" data-composition="technical-overlay-v1" data-base-medium="python-svg"><title id="title">采集时间的 τ 倍数账</title><desc id="desc">五步：τ=750ns、12 位 8.3τ≈6.2µs、加延时约 7µs、留 30% 余量后承诺 100kSa/s，末步提醒半 LSB 口径是 9τ。</desc><rect width="1448" height="1086" fill="#e2d9cf" /><g id="paper-illustration"><path d="M194,196 L699.98,194 L1373,197 L1376,614.66 L1373,930 L640.6800000000001,932 L190,928 Z" fill="#f6f2ed" stroke="#c4b9ab" stroke-width="1.4" /><path d="M196,198L1369,199" fill="none" stroke="#ffffff" stroke-width="2" opacity=".7" /><path d="M208,208 L1360,210 L1362,916 L210,918 Z" fill="none" stroke="#c4b9ab" stroke-width="2" opacity=".55" />
<circle cx="136" cy="267" r="31" fill="#e2d9cf" stroke="#a4441d" stroke-width="3" />
<circle cx="136" cy="415" r="31" fill="#e2d9cf" stroke="#a4441d" stroke-width="3" />
<line x1="136" y1="328" x2="136" y2="350" stroke="#c4b9ab" stroke-width="3" stroke-dasharray="" /><polygon points="136,350 143.0,337.0 129.0,337.0" fill="#c4b9ab" />
<circle cx="136" cy="563" r="31" fill="#e2d9cf" stroke="#a4441d" stroke-width="3" />
<line x1="136" y1="476" x2="136" y2="498" stroke="#c4b9ab" stroke-width="3" stroke-dasharray="" /><polygon points="136,498 143.0,485.0 129.0,485.0" fill="#c4b9ab" />
<circle cx="136" cy="711" r="31" fill="#e2d9cf" stroke="#a4441d" stroke-width="3" />
<line x1="136" y1="624" x2="136" y2="646" stroke="#c4b9ab" stroke-width="3" stroke-dasharray="" /><polygon points="136,646 143.0,633.0 129.0,633.0" fill="#c4b9ab" />
<circle cx="136" cy="859" r="31" fill="#e2d9cf" stroke="#a4441d" stroke-width="3" />
<line x1="136" y1="772" x2="136" y2="794" stroke="#c4b9ab" stroke-width="3" stroke-dasharray="" /><polygon points="136,794 143.0,781.0 129.0,781.0" fill="#c4b9ab" /></g><g id="technical-overlay"><text x="72" y="92" fill="#2a2927" font-size="50" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">采集时间：分母是两者之和</text>
<text x="74" y="146" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">源阻加 R_ON，不是 R_ON 自己；高阻源卡脖子时，先缓冲比换低阻开关管用。</text>
<text x="136" y="279" fill="#a4441d" font-size="34" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#e2d9cf">一</text>
<text x="226" y="252" fill="#2a2927" font-size="36" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">τ=750ns</text>
<text x="226" y="294" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">源阻 500Ω + R_ON 250Ω，C=1nF</text>
<text x="136" y="427" fill="#a4441d" font-size="34" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#e2d9cf">二</text>
<text x="226" y="400" fill="#2a2927" font-size="36" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">12 位取 8.3τ</text>
<text x="226" y="442" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">整 LSB 口径，约 6.2µs</text>
<text x="136" y="575" fill="#a4441d" font-size="34" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#e2d9cf">三</text>
<text x="226" y="548" fill="#2a2927" font-size="36" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">加延时与缓冲建立</text>
<text x="226" y="590" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">单次采样预算约 7µs</text>
<text x="136" y="723" fill="#a4441d" font-size="34" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#e2d9cf">四</text>
<text x="226" y="696" fill="#2a2927" font-size="36" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">留 30% 余量</text>
<text x="226" y="738" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">理论上限 140kSa/s，承诺 100kSa/s</text>
<text x="136" y="871" fill="#a4441d" font-size="34" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#e2d9cf">五</text>
<text x="226" y="844" fill="#2a2927" font-size="36" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">半 LSB 口径另算</text>
<text x="226" y="886" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">9τ，两套判据别混用</text>
<path data-paper-shadow="true" transform="translate(8 12)" d="M68,988 L631.6,986 L1381,989 L1384,1030.46 L1381,1062 L565.6,1064 L64,1060 Z" fill="#535453" opacity="0.08" /><path data-paper-shadow="true" transform="translate(4 7)" d="M68,988 L631.6,986 L1381,989 L1384,1030.46 L1381,1062 L565.6,1064 L64,1060 Z" fill="#535453" opacity="0.12" /><path data-paper-shadow="true" transform="translate(2 3)" d="M68,988 L631.6,986 L1381,989 L1384,1030.46 L1381,1062 L565.6,1064 L64,1060 Z" fill="#535453" opacity="0.15" /><path d="M68,988 L631.6,986 L1381,989 L1384,1030.46 L1381,1062 L565.6,1064 L64,1060 Z" fill="#f6f2ed" stroke="#c4b9ab" stroke-width="1.4" /><path d="M70,990L1377,991" fill="none" stroke="#ffffff" stroke-width="2" opacity=".7" />
<text x="92" y="1036" fill="#2a2927" font-size="33" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">分母写错，后面全错；采集时间的账从源阻加 R_ON 开始。</text></g></svg>
