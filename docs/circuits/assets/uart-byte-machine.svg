</style><rect class="bg" x="0" y="-156" width="800" height="806" /><text class="title" x="24" y="-128">UART：自己把帧界找回来</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① UART：自己把帧界找回来<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 示意字节流（不是某家真实协议）<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ CRC 对上：交上一层<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="bg" width="800" height="650" />
  <rect class="box" x="28" y="56" width="140" height="56" rx="8" />
  <rect class="box" x="180" y="56" width="140" height="56" rx="8" />
  <rect class="box" x="332" y="56" width="140" height="56" rx="8" />
  <rect class="box" x="484" y="56" width="140" height="56" rx="8" />
  <rect class="box" x="636" y="56" width="136" height="56" rx="8" />
  <text class="txt" x="98" y="90" text-anchor="middle">找帧头</text>
  <text class="txt" x="250" y="90" text-anchor="middle">收长度</text>
  <text class="txt" x="402" y="90" text-anchor="middle">收数据</text>
  <text class="txt" x="554" y="90" text-anchor="middle">对 CRC</text>
  <text class="txt" x="704" y="90" text-anchor="middle">计数</text>
  <rect class="hot" x="28" y="56" width="140" height="56" rx="8" opacity="0.9">
    <animate attributeName="x" values="28;180;332;484;636;28" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="8s" repeatCount="indefinite" calcMode="discrete" />
    <animate attributeName="width" values="140;140;140;140;136;140" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="8s" repeatCount="indefinite" calcMode="discrete" />
  </rect>

  <rect class="panel" x="28" y="140" width="744" height="120" rx="8" />
  <text class="small" x="44" y="168">示意字节流（不是某家真实协议）</text>
  <text class="byte small" x="44" y="214">AA 55</text>
  <text class="byte small" x="160" y="214">01</text>
  <text class="byte small" x="230" y="214">02</text>
  <text class="byte small" x="300" y="214">12 34</text>
  <text class="byte small" x="410" y="214">7F</text>
  <text class="small" x="44" y="242">帧头</text>
  <text class="small" x="160" y="242">地址</text>
  <text class="small" x="230" y="242">长度</text>
  <text class="small" x="300" y="242">数据</text>
  <text class="small" x="410" y="242">CRC</text>

  <text class="ok" x="44" y="310" opacity="0">CRC 对上：交上一层
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.62;0.78;0.82;1" dur="8s" repeatCount="indefinite" />
  </text>
  <text class="bad small" x="44" y="348" opacity="0">CRC 失败：坏帧 +1，从下一字节重新找帧头
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.8;0.88;1" dur="8s" repeatCount="indefinite" />
  </text>
  <text class="small" x="400" y="408" text-anchor="middle">坏帧必须计数。静默丢掉的话，现场分不清是线坏了还是解析坏了。</text>

<rect class="dpanel" x="24" y="448.0" width="752" height="188" rx="6" /><text class="dtitle small" x="40" y="468.0">底栏：10 位/字节。t = 10000 / 波特率，单位 ms</text><text class="dsmall small" x="40" y="484.0">每字节 ms</text><line class="daxis" x1="70.0" y1="484.0" x2="70.0" y2="598.0" /><line class="daxis" x1="70.0" y1="598.0" x2="460.0" y2="598.0" /><line class="daxis" x1="70.0" y1="598.0" x2="70.0" y2="603.0" /><text class="dsmall small" x="70.0" y="616.0" text-anchor="middle">9600</text><line class="daxis" x1="460.0" y1="598.0" x2="460.0" y2="603.0" /><text class="dsmall small" x="460.0" y="616.0" text-anchor="middle">115200</text><line class="daxis" x1="65.0" y1="589.7" x2="70.0" y2="589.7" /><text class="dsmall small" x="62.0" y="593.7" text-anchor="end">0.087</text><line class="daxis" x1="65.0" y1="499.0" x2="70.0" y2="499.0" /><text class="dsmall small" x="62.0" y="503.0" text-anchor="end">1.042</text><polyline class="dblue" points="70.0,499.0 79.8,520.4 89.5,534.2 99.2,543.8 109.0,550.9 118.8,556.3 128.5,560.7 138.2,564.2 148.0,567.1 157.8,569.5 167.5,571.6 177.2,573.4 187.0,575.0 196.8,576.4 206.5,577.6 216.2,578.7 226.0,579.7 235.8,580.6 245.5,581.4 255.2,582.1 265.0,582.8 274.8,583.4 284.5,584.0 294.2,584.5 304.0,585.0 313.8,585.4 323.5,585.9 333.2,586.3 343.0,586.6 352.8,587.0 362.5,587.3 372.2,587.6 382.0,587.9 391.8,588.2 401.5,588.4 411.2,588.7 421.0,588.9 430.8,589.1 440.5,589.4 450.2,589.6 460.0,589.8" stroke-linejoin="round" stroke-linecap="round" /><circle class="ddot" r="5"><animate attributeName="cx" values="70.0;118.8;167.5;216.2;265.0;313.8;362.5;411.2;460.0" keyTimes="0.0000;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1.0000" dur="8s" repeatCount="indefinite" /><animate attributeName="cy" values="499.0;556.3;571.6;578.7;582.8;585.4;587.3;588.7;589.8" keyTimes="0.0000;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1.0000" dur="8s" repeatCount="indefinite" /></circle><text class="dsmall small" x="494.3" y="616.0" text-anchor="start">波特率</text><text 