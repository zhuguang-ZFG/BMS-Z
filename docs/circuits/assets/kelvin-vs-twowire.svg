</style><rect class="bg" x="0" y="-156" width="800" height="680" /><text class="title" x="24" y="-128">开尔文对照：引线压降进不进读数</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 开尔文对照：引线压降进不进读数<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 示例：100 A，分流器 0.5 mΩ（本体 50 mV），<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 对：从本体取电压<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="468" width="752" height="44" rx="6" /><text class="small" x="40" y="496">多出来的 40 mV 是引线。示意。</text><rect width="800" height="460" class="bg" />
  <text x="400" y="54" text-anchor="middle" font-size="13" class="small">示例：100 A，分流器 0.5 mΩ（本体 50 mV），两侧引线共 0.4 mΩ。</text>
  <rect x="36" y="78" width="350" height="250" rx="8" class="fill-boxg stroke-g" />
  <text x="211" y="108" text-anchor="middle" font-size="15" font-weight="bold" class="ok">对：从本体取电压</text>
  <rect x="150" y="150" width="90" height="36" class="panel stroke-axis" />
  <text x="195" y="173" text-anchor="middle" font-size="12" class="txt">0.5 mΩ</text>
  <line x1="70" y1="168" x2="150" y2="168" stroke-width="4" class="stroke-y" />
  <line x1="240" y1="168" x2="340" y2="168" stroke-width="4" class="stroke-y" />
  <line x1="160" y1="186" x2="160" y2="230" stroke-width="2" class="stroke-b" />
  <line x1="230" y1="186" x2="230" y2="230" stroke-width="2" class="stroke-b" />
  <text x="211" y="260" text-anchor="middle" font-size="14" class="ok">读到 50 mV → 100 A</text>
  <circle cx="110" cy="168" r="5" class="fill-y">
    <animate attributeName="cx" values="80;330;80" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite" />
  </circle>
  <rect x="414" y="78" width="350" height="250" rx="8" class="fill-boxr stroke-r" />
  <text x="589" y="108" text-anchor="middle" font-size="15" font-weight="bold" class="warn">错：从螺丝端子取电压</text>
  <rect x="528" y="150" width="90" height="36" class="panel stroke-axis" />
  <text x="573" y="173" text-anchor="middle" font-size="12" class="txt">0.5 mΩ</text>
  <line x1="448" y1="168" x2="528" y2="168" stroke-width="4" class="stroke-y" />
  <line x1="618" y1="168" x2="730" y2="168" stroke-width="4" class="stroke-y" />
  <line x1="460" y1="150" x2="460" y2="230" stroke-width="2" class="stroke-r" />
  <line x1="710" y1="150" x2="710" y2="230" stroke-width="2" class="stroke-r" />
  <text x="589" y="260" text-anchor="middle" font-size="14" class="warn">读到 90 mV → 180 A</text>
  <text x="589" y="286" text-anchor="middle" font-size="12" class="small">多出来的 40 mV 是引线</text>
  <text x="400" y="370" text-anchor="middle" font-size="14" class="txt">安时积分会按偏大的电流一直累加。</text>
  <text x="400" y="410" text-anchor="middle" font-size="13" class="small">采样回路几乎不流电流，引线上的压降才不会进读数。</text>

</svg>