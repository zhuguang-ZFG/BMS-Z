<line x1="60" y1="168" x2="430" y2="168" stroke="#14213d" stroke-width="2.5" stroke-linecap="round"/>
<text x="372" y="160" font-family="'Book Mono',monospace" font-size="12" font-weight="700" fill="#14213d">VCC=9V</text>

<!-- divider chain -->
<line x1="110" y1="168" x2="110" y2="182" stroke="#14213d" stroke-width="1.8"/>
<rect x="96" y="182" width="28" height="40" fill="#fffdf8" stroke="#14213d" stroke-width="1.8"/>
<text x="110" y="207" text-anchor="middle" font-family="'Book Mono',monospace" font-size="10" fill="#52606d">5k</text>
<line x1="110" y1="222" x2="110" y2="232" stroke="#14213d" stroke-width="1.8"/>
<rect x="96" y="232" width="28" height="40" fill="#fffdf8" stroke="#14213d" stroke-width="1.8"/>
<text x="110" y="257" text-anchor="middle" font-family="'Book Mono',monospace" font-size="10" fill="#52606d">5k</text>
<line x1="110" y1="272" x2="110" y2="282" stroke="#14213d" stroke-width="1.8"/>
<rect x="96" y="282" width="28" height="40" fill="#fffdf8" stroke="#14213d" stroke-width="1.8"/>
<text x="110" y="307" text-anchor="middle" font-family="'Book Mono',monospace" font-size="10" fill="#52606d">5k</text>
<line x1="110" y1="322" x2="110" y2="352" stroke="#14213d" stroke-width="1.8"/>
<g stroke="#14213d" stroke-width="2">
<line x1="98" y1="352" x2="122" y2="352"/>
<line x1="102" y1="358" x2="118" y2="358"/>
<line x1="106" y1="364" x2="114" y2="364"/>
