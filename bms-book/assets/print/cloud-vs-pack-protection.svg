  <text class="txt" x="40" y="68" opacity="1" style="opacity: 1;">① 短路窗口<tspan class="small">　示例 10 μs。蓝线在这里落到已动作。</tspan></text>
  <text class="txt" x="40" y="92" opacity="1" style="opacity: 1;">② 过充延时<tspan class="small">　DW01 的 80–200 ms。绿线画在 80 ms 这道下沿。</tspan></text>
  <text class="txt" x="40" y="116" opacity="1" style="opacity: 1;">③ 云上的记录<tspan class="small">　报警存储最大 1 s，正常存储最大 30 s。</tspan></text>
  <text class="txt" x="40" y="140" opacity="1" style="opacity: 1;">④ 口诀<tspan class="small">　热失控切断不能等云端下令。晚到的报文用来复盘。</tspan></text>
