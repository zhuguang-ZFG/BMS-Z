  <text x="920.0" y="367.0" font-size="25" fill="#926717" text-anchor="end">前进 2 步，缺 1 帧</text>
  <text x="480.0" y="517.0" font-size="23" fill="#926717" text-anchor="middle">规范跳过 15；这里只缺 0</text>
