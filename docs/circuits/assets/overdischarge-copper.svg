<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 590" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>过放示意：电压穿过 3.0 V、2.8 V 和大约 2.5 V。低于约 2.5 V 时铜集流体可能溶解，再充电会在隔膜附近长成针。</title>
  <desc>蓝线是一条示意下降，不是某一颗电芯的放电记录。风险指数在 2.5 V 以下才离开 0，用来记住方向。不要大电流激活。</desc>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; }
    .linek { stroke: #57606a; stroke-width: 2.2; fill: none; stroke-dasharray: 7 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .dotg { fill: #1a7f37; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .linek { stroke: #8b949e; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .dotg { fill: #3fb950; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
    }
  </style>
  <!-- formula: V=3.4-0.24*progress; risk=clip((2.5-V)/1.5,0,1); 2.5 V and 2.8-3.0 V from the stage text -->
  <rect class="bg" width="800" height="590"/>
  <text class="title" x="24" y="32">过放可以很安静，铜针长在下一次充电（示意）</text>
  <rect class="panel" x="24" y="44" width="752" height="124" rx="6"/>
  <text class="txt" x="40" y="68" opacity="0.28">① 保护留余量<tspan class="small">　示例动作约在 2.8–3.0 V，不要放到铜开始溶解。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="92" opacity="0.28">② 大约 2.5 V<tspan class="small">　三元负极的铜集流体可能开始溶解。这是「左右」。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="116" opacity="0.28">③ 当时可以不热不鼓<tspan class="small">　风险指数只标方向，不是铜离子浓度。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="140" opacity="0.28">④ 口诀<tspan class="small">　过放当时安静。铜针长在下一次充电。别用大电流激活。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="180" width="752" height="268" rx="6"/>
  <text class="small" x="40" y="202">单体电压 V（示意进程，不是实测放电）</text>
  <text class="small" x="200" y="218">虚线 3.0 / 2.8 / 2.5 V</text>
  <line class="axis" x1="108.0" y1="248.0" x2="108.0" y2="400.0"/>
  <line class="axis" x1="108.0" y1="400.0" x2="720.0" y2="400.0"/>
  <line class="grid" x1="108.0" y1="400.0" x2="108.0" y2="406.0"/>
  <text class="small" x="108.0" y="422.0" text-anchor="middle">0</text>
  <line class="grid" x1="414.0" y1="400.0" x2="414.0" y2="406.0"/>
  <text class="small" x="414.0" y="422.0" text-anchor="middle">5</text>
  <line class="grid" x1="720.0" y1="400.0" x2="720.0" y2="406.0"/>
  <text class="small" x="720.0" y="422.0" text-anchor="middle">10</text>
  <line class="grid" x1="102.0" y1="389.1" x2="108.0" y2="389.1"/>
  <text class="small" x="98.0" y="393.1" text-anchor="end">1.0</text>
  <line class="grid" x1="102.0" y1="307.7" x2="108.0" y2="307.7"/>
  <text class="small" x="98.0" y="311.7" text-anchor="end">2.5</text>
  <line class="grid" x1="102.0" y1="258.9" x2="108.0" y2="258.9"/>
  <text class="small" x="98.0" y="262.9" text-anchor="end">3.4</text>
  <text class="small" x="720" y="444" text-anchor="end">示意进程</text>
  <polyline class="lineb" points="108.0,258.9 118.2,261.0 128.4,263.2 138.6,265.4 148.8,267.5 159.0,269.7 169.2,271.9 179.4,274.1 189.6,276.2 199.8,278.4 210.0,280.6 220.2,282.7 230.4,284.9 240.6,287.1 250.8,289.3 261.0,291.4 271.2,293.6 281.4,295.8 291.6,297.9 301.8,300.1 312.0,302.3 322.2,304.5 332.4,306.6 342.6,308.8 352.8,311.0 363.0,313.1 373.2,315.3 383.4,317.5 393.6,319.7 403.8,321.8 414.0,324.0 424.2,326.2 434.4,328.3 444.6,330.5 454.8,332.7 465.0,334.9 475.2,337.0 485.4,339.2 495.6,341.4 505.8,343.5 516.0,345.7 526.2,347.9 536.4,350.1 546.6,352.2 556.8,354.4 567.0,356.6 577.2,358.7 587.4,360.9 597.6,363.1 607.8,365.3 618.0,367.4 628.2,369.6 638.4,371.8 648.6,373.9 658.8,376.1 669.0,378.3 679.2,380.5 689.4,382.6 699.6,384.8 709.8,387.0 720.0,389.1" stroke-linejoin="round" stroke-linecap="round"/>
  <line class="lineg" x1="108" y1="280.6" x2="720" y2="280.6" stroke-dasharray="6 4"/>
  <text class="small" x="716" y="276.6" text-anchor="end">3.0 V</text>
  <line class="liney" x1="108" y1="291.4" x2="720" y2="291.4" stroke-dasharray="6 4"/>
  <text class="small" x="716" y="287.4" text-anchor="end">2.8 V</text>
  <line class="liner" x1="108" y1="307.7" x2="720" y2="307.7" stroke-dasharray="6 4"/>
  <text class="small" x="716" y="303.7" text-anchor="end">2.5 V</text>
  <circle class="dotb" r="6" cx="210.0" cy="280.6"><animate attributeName="cx" values="210.0;261.0;337.5;720.0;720.0" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="280.6;291.4;307.7;389.1;389.1" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite"/></circle>
  <circle class="dotr" r="4" cx="210.0" cy="280.6"><animate attributeName="cx" values="210.0;261.0;337.5;720.0;720.0" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite" begin="-6s"/><animate attributeName="cy" values="280.6;291.4;307.7;389.1;389.1" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite" begin="-6s"/></circle>
  <rect class="panel" x="24" y="460" width="752" height="68" rx="6"/>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="1">示意进程 1.7  V=3.00  风险指数 0.00<animate attributeName="opacity" values="1;0;0;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0">示意进程 2.5  V=2.80  风险指数 0.00<animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0">示意进程 3.8  V=2.50  风险指数 0.00<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0">示意进程 10.0  V=1.00  风险指数 1.00<animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="24" y="560">鼓包、漏液直接报废。还能看的，按这颗电芯的手册用很小的电流先抬回安全区。</text>

</svg>
