<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">三种基本拓扑：同一只运放，三条推演路径</text>

<text x="400" y="54" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5b666f">全部从「虚短 + 虚断」推出来——增益都由外接电阻决定，与运放本身无关</text>
<rect x="30" y="60" width="238" height="300" rx="10" fill="#f6eedb" stroke="#1f5d7a" stroke-width="1.8"/><text x="149" y="86" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1f5d7a">反相放大</text><text x="149" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#16202b">A_v = −R_f / R_in = −10</text><path d="M44 122 Q149.00 121.31 254 122" fill="none" stroke="#c9bb9d" stroke-width="1"/><text x="48" y="148" font-size="11.5" fill="#5b666f">R_f</text><text x="250" y="148" text-anchor="end" font-size="11.5" font-weight="bold" fill="#37424e">100k</text><text x="48" y="172" font-size="11.5" fill="#5b666f">R_in</text><text x="250" y="172" text-anchor="end" font-size="11.5" font-weight="bold" fill="#37424e">10k</text><path d="M44 190 Q149.00 190.64 254 190" fill="none" stroke="#e0d3b8" stroke-width="1"/><text x="48" y="212" font-size="11" fill="#5b666f">输入阻抗</text><text x="250" y="212" text-anchor="end" font-size="11" font-weight="bold" fill="#1f5d7a">≈ R_in = 10k（低）</text><text x="48" y="232" font-size="11" fill="#5b666f">共模抑制</text><text x="250" y="232" text-anchor="end" font-size="11" font-weight="bold" fill="#1f5d7a">无（+端接地）</text><text x="48" y="252" font-size="11" fill="#5b666f">输出相位</text><text x="250" y="252" text-anchor="end" font-size="11" font-weight="bold" fill="#1f5d7a">反相 180°</text>
<rect x="281" y="60" width="238" height="300" rx="10" fill="#f6eedb" stroke="#3d6b4a" stroke-width="1.8"/><text x="400" y="86" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3d6b4a">同相放大</text><text x="400" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#16202b">A_v = 1 + R_f / R_1 = 10</text><path d="M295 122 Q400.00 121.39 505 122" fill="none" stroke="#c9bb9d" stroke-width="1"/><text x="299" y="148" font-size="11.5" fill="#5b666f">R_f</text><text x="501" y="148" text-anchor="end" font-size="11.5" font-weight="bold" fill="#37424e">90k</text><text x="299" y="172" font-size="11.5" fill="#5b666f">R_1</text><text x="501" y="172" text-anchor="end" font-size="11.5" font-weight="bold" fill="#37424e">10k</text><path d="M295 190 Q400.00 189.97 505 190" fill="none" stroke="#e0d3b8" stroke-width="1"/><text x="299" y="212" font-size="11" fill="#5b666f">输入阻抗</text><text x="501" y="212" text-anchor="end" font-size="11" font-weight="bold" fill="#3d6b4a">≈ ∞（进 +端）</text><text x="299" y="232" font-size="11" fill="#5b666f">共模抑制</text><text x="501" y="232" text-anchor="end" font-size="11" font-weight="bold" fill="#3d6b4a">无（+端进信号）</text><text x="299" y="252" font-size="11" fill="#5b666f">输出相位</text><text x="501" y="252" text-anchor="end" font-size="11" font-weight="bold" fill="#3d6b4a">同相 0°</text>
<rect x="532" y="60" width="238" height="300" rx="10" fill="#f6eedb" stroke="#6b3f63" stroke-width="1.8"/><text x="651" y="86" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#6b3f63">差分放大</text><text x="651" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#16202b">A_v = R_f / R_1 = 10</text><path d="M546 122 Q651.00 122.53 756 122" fill="none" stroke="#c9bb9d" stroke-width="1"/><text x="550" y="148" font-size="11.5" fill="#5b666f">R_f</text><text x="752" y="148" text-anchor="end" font-size="11.5" font-weight="bold" fill="#37424e">100k</text><text x="550" y="172" font-size="11.5" fill="#5b666f">R_1</text><text x="752" y="172" text-anchor="end" font-size="11.5" font-weight="bold" fill="#37424e">10k</text><path d="M546 190 Q651.00 190.77 756 190" fill="none" stroke="#e0d3b8" stroke-width="1"/><text x="550" y="212" font-size="11" fill="#5b666f">输入阻抗</text><text x="752" y="212" text-anchor="end" font-size="11" font-weight="bold" fill="#6b3f63">≈ 2×R_1 = 20k</text><text x="550" y="232" font-size="11" fill="#5b666f">共模抑制</text><text x="752" y="232" text-anchor="end" font-size="11" font-weight="bold" fill="#6b3f63">有，但需四电阻配对</text><text x="550" y="252" font-size="11" fill="#5b666f">输出相位</text><text x="752" y="252" text-anchor="end" font-size="11" font-weight="bold" fill="#6b3f63">差模同相</text>
<path d="M40 400 Q400.00 399.69 760 400" fill="none" stroke="#c9bb9d" stroke-width="1"/>
<text x="400" y="428" text-anchor="middle" font-size="12" font-weight="bold" fill="#a4630f">同一只运放、同一组电阻比例 → 同一份 10 倍增益，差别只在「信号从哪个端进去、哪个端接地」</text>
<text x="400" y="452" text-anchor="middle" font-size="11.5" fill="#5b666f">反相：虚地把输入阻抗钉在 R_in；同相：信号直接进 +端，输入阻抗接近无穷但共模就是信号本身</text>
<text x="400" y="476" text-anchor="middle" font-size="11.5" fill="#5b666f">差分：唯一能放大「两个信号之差」的拓扑，代价是四只电阻必须配对，否则共模抑制崩掉</text>
<circle r="5" fill="#1f5d7a"><animateMotion dur="11s" begin="-0.2s" repeatCount="indefinite" path="M150,200 L150,140"/></circle>
<circle r="5" fill="#3d6b4a"><animateMotion dur="11s" begin="-0.9s" repeatCount="indefinite" path="M401,200 L401,140"/></circle>
