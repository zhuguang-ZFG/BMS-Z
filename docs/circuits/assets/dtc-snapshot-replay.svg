<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 -156 800 640" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>故障注入与快照回放示意图</title>
  <desc>亮点按拍走过：未满去抖、第 3 拍冻结过充快照，随后短路来了也不许覆盖第一现场。</desc><style>
    .bg { fill: #fffdf5; }
    .panel { fill: #f7f2e5; stroke: #cfc6b2; }
    .fill-boxb { fill: #e4f0df; }
    .fill-boxg { fill: #e4f0df; }
    .fill-boxr { fill: #f6e2df; }
    .fill-boxy { fill: #fbefc7; }
    .fill-b { fill: #176b73; }
    .fill-g { fill: #377b60; }
    .fill-r { fill: #b84745; }
    .fill-y { fill: #926717; }
    .fill-ink { fill: #626d65; }
    .fill-muted { fill: #eee6d5; }
    .fill-lockb { fill: #176b73; }
    .stroke-panel { stroke: #cfc6b2; }
    .stroke-axis { stroke: #626d65; }
    .stroke-b { stroke: #176b73; }
    .stroke-g { stroke: #377b60; }
    .stroke-r { stroke: #b84745; }
    .stroke-y { stroke: #926717; }
    .stroke-check { stroke: #fffdf5; }
    .axis { stroke: #626d65; stroke-width: 1.5; fill: none; }
    .grid { stroke: #cfc6b2; stroke-width: 1; fill: none; }
    .txt { fill: #293b3a; font-size: 13px; }
    .small { fill: #626d65; font-size: 12px; }
    .title { fill: #293b3a; font-size: 16px; font-weight: bold; }
    .hi { fill: #176b73; }
    .warn { fill: #b84745; }
    .ok { fill: #377b60; }
    .gold { fill: #926717; }
    .on { fill: #fffdf5; font-size: 13px; font-weight: bold; }
    .lineb { stroke: #176b73; stroke-width: 2.5; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #192727; }
      .panel { fill: #223333; stroke: #496160; }
      .fill-boxb { fill: #293f35; }
      .fill-boxg { fill: #293f35; }
      .fill-boxr { fill: #483336; }
      .fill-boxy { fill: #453e2b; }
      .fill-b { fill: #7ec5c5; }
      .fill-g { fill: #8fc7a2; }
      .fill-r { fill: #f39b91; }
      .fill-y { fill: #dfbd78; }
      .fill-ink { fill: #b0beb3; }
      .fill-muted { fill: #2c4040; }
      .fill-lockb { fill: #176b73; }
      .stroke-panel { stroke: #496160; }
      .stroke-axis { stroke: #b0beb3; }
      .stroke-b { stroke: #7ec5c5; }
      .stroke-g { stroke: #8fc7a2; }
      .stroke-r { stroke: #f39b91; }
      .stroke-y { stroke: #dfbd78; }
      .stroke-check { stroke: #192727; }
      .axis { stroke: #b0beb3; }
      .grid { stroke: #496160; }
      .txt { fill: #edf0e5; }
      .small { fill: #b0beb3; }
      .title { fill: #edf0e5; }
      .hi { fill: #7ec5c5; }
      .warn { fill: #f39b91; }
      .ok { fill: #8fc7a2; }
      .gold { fill: #dfbd78; }
      .on { fill: #fffdf5; }
      .lineb { stroke: #7ec5c5; }
    }
</style><rect class="bg" x="0" y="-156" width="800" height="640" /><text class="title" x="24" y="-128">示意图：先冻结过充那一帧，后面的短路不许覆盖</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 示意图：先冻结过充那一帧，后面的短路不许覆盖<animate calcMode="spline" keySplines="0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 第 1–2 拍：4300 mV，未满去抖<animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 第 3 拍：记过充，断充电<animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="428" width="752" height="44" rx="6" /><text class="small" x="40" y="456">这张是示意图，不是实验台照片。PC 命令见阶段 6 §6.2.5。</text><rect width="800" height="420" class="bg" />
  <rect x="16" y="52" width="245" height="250" rx="8" class="panel" />
  <text x="32" y="78" font-size="15" font-weight="bold" class="txt">注入脚本</text>
  <text x="32" y="108" font-size="13" class="txt">第 1–2 拍：4300 mV，未满去抖</text>
  <text x="32" y="132" font-size="13" class="txt">第 3 拍：记过充，断充电</text>
  <text x="32" y="156" font-size="13" class="txt">再注入短路电流</text>
  <text x="32" y="190" font-size="13" class="txt">显示主故障可以升级。</text>
  <text x="32" y="214" font-size="13" class="txt">第一现场停在过充。</text>
  <line x1="40" y1="250" x2="250" y2="250" class="stroke-axis" />
  <circle cy="250" r="7" class="fill-b">
    <animate calcMode="spline" keySplines="0.16 1 0.3 1;0.7 0 0.84 0" attributeName="cx" values="48;250;48" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite" />
  </circle>
  <text x="32" y="278" font-size="12" class="txt">蓝点沿时间轴走，对应上面三行。</text>

  <rect x="277" y="52" width="245" height="250" rx="8" class="panel" />
  <text x="293" y="78" font-size="15" font-weight="bold" class="txt">冻结的快照</text>
  <rect x="293" y="96" width="213" height="150" rx="6" class="fill-boxb stroke-b" />
  <text x="309" y="124" font-size="14" class="txt">故障：过充</text>
  <text x="309" y="150" font-size="14" class="txt">第 3 串：4300 mV</text>
  <text x="309" y="176" font-size="14" class="txt">电流：+2000 mA</text>
  <text x="309" y="202" font-size="14" class="txt">教学阈值，不是产品规格</text>
  <text x="309" y="228" font-size="13" class="txt">上电后的第一次故障</text>

  <rect x="538" y="52" width="245" height="250" rx="8" class="panel" />
  <text x="554" y="78" font-size="15" font-weight="bold" class="txt">稍后的现场</text>
  <rect x="554" y="96" width="213" height="72" rx="6" class="fill-boxr stroke-r" />
  <text x="570" y="126" font-size="14" class="txt">当前显示：短路</text>
  <text x="570" y="150" font-size="13" class="txt">两路都已断开</text>
  <text x="554" y="196" font-size="13" class="txt">回放仍读出过充那一帧。</text>
  <text x="554" y="220" font-size="13" class="txt">0 mV 在本骨架里会变成欠压，</text>
  <text x="554" y="242" font-size="13" class="txt">那不是开线检测。</text>
  <text x="16" y="340" font-size="14" class="txt">这张是示意图，不是实验台照片。PC 命令见阶段 6 §6.2.5。</text>
  <text x="16" y="368" font-size="14" class="gold">不要用真电池做短路或过充注入。</text>
</svg>