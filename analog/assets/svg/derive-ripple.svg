<circle r="5.5" fill="#3d6b4a"><animateMotion dur="16s" begin="7.50s" repeatCount="indefinite" path="M58,140 L135,140 L135,188" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle></g><text x="150" y="300" font-size="11.5" font-weight="bold" fill="#3d6b4a">放电时：Q 一层层流走</text><path d="M352 398 Q351.85 415.00 352 432" fill="none" stroke="#a8321f" stroke-width="2"/>
<polygon points="347,404 352,396 357,404" fill="#a8321f"/>
<polygon points="347,426 352,434 357,426" fill="#a8321f"/>
<text x="376" y="420" font-size="12" font-weight="bold" fill="#a8321f">ΔV</text><text x="196" y="330" font-size="11.5" font-weight="bold" fill="#a4630f">100Hz 的「锯齿」就是这么来的</text><rect x="75" y="454" width="243" height="24" rx="6" fill="#f6eedb" stroke="#3d6b4a" stroke-width="1"/><text x="196" y="470" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3d6b4a">C 翻倍 → ΔV 减半；f 翻倍 → ΔV 也减半</text><rect x="400" y="110" width="352" height="58" rx="7" fill="none" stroke="#a4630f" stroke-width="1.8" opacity="0.9"><animate attributeName="y" values="134;192;250;308;366;366" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/></rect>
<text x="412" y="134" font-size="11.5" font-weight="bold" fill="#a4630f">① 电容的电荷账</text><text x="412" y="159" font-size="14.5" font-weight="bold" fill="#16202b">Q = I · Δt</text><text x="412" y="176" font-size="10.5" fill="#5b666f">负载恒流 → 放掉的电荷 = 电流 × 时间</text>
<text x="412" y="192" font-size="11.5" font-weight="bold" fill="#a4630f">② 电压跟着电荷走</text><text x="412" y="217" font-size="14.5" font-weight="bold" fill="#16202b">ΔV = Q / C</text><text x="412" y="234" font-size="10.5" fill="#5b666f">由 C = Q / U 反解</text><rect x="400" y="168" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.2;0.23;1" dur="16s" repeatCount="indefinite"/></rect>
<text x="412" y="250" font-size="11.5" font-weight="bold" fill="#a4630f">③ 合起来</text><text x="412" y="275" font-size="14.5" font-weight="bold" fill="#16202b">ΔV = I · Δt / C</text><text x="412" y="292" font-size="10.5" fill="#5b666f">把第①行代进第②行</text><rect x="400" y="226" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.4;0.43;1" dur="16s" repeatCount="indefinite"/></rect>
<text x="412" y="308" font-size="11.5" font-weight="bold" fill="#a4630f">④ 桥式整流补两次</text><text x="412" y="333" font-size="14.5" font-weight="bold" fill="#16202b">ΔV = I / (2f · C)</text><text x="412" y="350" font-size="10.5" fill="#5b666f">全波每周期补两次 → Δt = 1/(2f)</text><rect x="400" y="284" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.6;0.63;1" dur="16s" repeatCount="indefinite"/></rect>
<text x="412" y="366" font-size="11.5" font-weight="bold" fill="#a4630f">⑤ 代入数字</text><text x="412" y="391" font-size="14.5" font-weight="bold" fill="#16202b">1A / (2×50×4700µF) ≈ 2.1V</text><text x="412" y="408" font-size="10.5" fill="#5b666f">50Hz 市电、1A 负载、4700µF</text><rect x="400" y="342" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.8;0.83;1" dur="16s" repeatCount="indefinite"/></rect>
<g><rect x="30" y="612" width="740" height="34.0" rx="9" fill="#e8efe6" stroke="#3d6b4a" stroke-width="1.5" filter="url(#soft)"/><rect x="36" y="619" width="3" height="20.0" rx="1.5" fill="#3d6b4a"/><text x="400" y="634.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3d6b4a">公式里的每个量都有出处：Q 是账本，C 是水桶，2f 是「每周期补两次水」</text></g></svg>