<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="ui-monospace, Consolas, monospace">
  <title>被动均衡与主动均衡的能量账：电阻上的热量可以口算，主动搬运的效率百分数留空。数字为示意。</title>
  <desc>被动均衡与主动均衡的能量账：电阻上的热量可以口算，主动搬运的效率百分数留空。数字为示意。</desc>

  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.5; fill: none; }
    .liney { stroke: #bf8700; stroke-width: 2.5; fill: none; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .dotg { fill: #1a7f37; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    .boxr { fill: #ffebe9; stroke: #cf222e; }
    .boxg { fill: #dafbe1; stroke: #1a7f37; }
    .boxy { fill: #fff8c5; stroke: #bf8700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .dotg { fill: #3fb950; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
      .boxr { fill: #3d1214; stroke: #ff7b72; }
      .boxg { fill: #12261e; stroke: #3fb950; }
      .boxy { fill: #3d2e00; stroke: #d29922; }
    }
  </style>

  <rect class="bg" width="800" height="460"/>

  <text class="title" x="24" y="32">同一小时的两本账：被动变成热，主动先存进磁件（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="122" rx="6"/>
  <text class="txt" x="40" y="68" opacity="0.28">① 被动电流<tspan class="small">　4.2 V / 100 Ω = 42 mA。这一节在往外放。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="94" opacity="0.28">② 被动能量<tspan class="small">　42 mA × 1 h = 42 mAh。4.2 V × 0.042 A × 1 h ≈ 0.18 Wh，进了电阻。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="120" opacity="0.28">③ 低节收到<tspan class="small">　被动这一笔是 0。电荷没有换节。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="146" opacity="0.28">④ 主动一拍<tspan class="small">　10 µH、峰值 2 A，½LI²=20 µJ。2 万拍每秒大约 0.4 W 的搬运量级。低节实收要扣损耗，百分数留空。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="boxr" x="40" y="200" width="340" height="180" rx="8"/>
  <text class="warn" x="210" y="230" text-anchor="middle">被动，1 小时</text>
  <text class="txt" x="60" y="270">交出 42 mAh</text>
  <text class="txt" x="60" y="298">变成热 ≈ 0.18 Wh</text>
  <text class="txt" x="60" y="326">邻居收到 0</text>
  <rect class="boxg" x="420" y="200" width="340" height="180" rx="8"/>
  <text class="ok" x="590" y="230" text-anchor="middle">主动，只算搬运量级</text>
  <text class="txt" x="440" y="270">一拍 20 µJ</text>
  <text class="txt" x="440" y="298">20 kHz → 约 0.4 W</text>
  <text class="txt" x="440" y="326">效率百分数：空</text>
  <circle class="dotr" cy="348" r="6">
    <animate attributeName="cx" values="70;300;300;300" keyTimes="0;0.5;0.749;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.749;0.75;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle class="dotg" cy="348" r="6">
    <animate attributeName="cx" values="450;450;720" keyTimes="0;0.75;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.749;0.75;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <text class="small" x="24" y="446">0.18 Wh 和 20 µJ、0.4 W 是示意口算，和均衡功耗那张图同一套假设。没有同一工况的实测之前，不写效率百分数。</text>

</svg>
