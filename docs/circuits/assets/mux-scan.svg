<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430">
  <title>MUX 扫描采样动画</title>
  <rect width="800" height="430" fill="#f8fafc"/>
  <style>
  text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
  /* 深色模式：GitHub 深色主题下对调底色与文字色，只覆盖配色，不动几何与动画。
     stroke="#fff" 保持白色——那是彩色徽标上的勾选，不在覆盖范围内。 */
  @media (prefers-color-scheme: dark){
  rect[fill="#f8fafc"]{fill:#0f172a}
  rect[fill="#fff"]{fill:#1e293b}
  [fill="#f1f5f9"]{fill:#1e293b}
  [stroke="#f1f5f9"]{stroke:#1e293b}
  [fill="#e2e8f0"]{fill:#334155}
  [stroke="#e2e8f0"]{stroke:#334155}
  [fill="#cbd5e1"]{fill:#475569}
  [stroke="#cbd5e1"]{stroke:#475569}
  [fill="#64748b"]{fill:#94a3b8}
  [stroke="#64748b"]{stroke:#94a3b8}
  [fill="#475569"]{fill:#cbd5e1}
  [stroke="#475569"]{stroke:#cbd5e1}
  [fill="#334155"]{fill:#e2e8f0}
  [stroke="#334155"]{stroke:#e2e8f0}
  [fill="#1e293b"]{fill:#f1f5f9}
  [stroke="#1e293b"]{stroke:#f1f5f9}
  [fill="#dbeafe"]{fill:#1e3a8a}
  [stroke="#dbeafe"]{stroke:#1e3a8a}
  [fill="#eff6ff"]{fill:#172554}
  [stroke="#eff6ff"]{stroke:#172554}
  [fill="#bfdbfe"]{fill:#1e40af}
  [stroke="#bfdbfe"]{stroke:#1e40af}
  [fill="#1d4ed8"]{fill:#60a5fa}
  [stroke="#1d4ed8"]{stroke:#60a5fa}
  [fill="#1e40af"]{fill:#93c5fd}
  [stroke="#1e40af"]{stroke:#93c5fd}
  [fill="#2563eb"]{fill:#60a5fa}
  [stroke="#2563eb"]{stroke:#60a5fa}
  [fill="#3b82f6"]{fill:#60a5fa}
  [stroke="#3b82f6"]{stroke:#60a5fa}
  [fill="#ecfdf5"]{fill:#022c22}
  [stroke="#ecfdf5"]{stroke:#022c22}
  [fill="#a7f3d0"]{fill:#065f46}
  [stroke="#a7f3d0"]{stroke:#065f46}
  [fill="#86efac"]{fill:#166534}
  [stroke="#86efac"]{stroke:#166534}
  [fill="#065f46"]{fill:#6ee7b7}
  [stroke="#065f46"]{stroke:#6ee7b7}
  [fill="#059669"]{fill:#34d399}
  [stroke="#059669"]{stroke:#34d399}
  [fill="#fef2f2"]{fill:#450a0a}
  [stroke="#fef2f2"]{stroke:#450a0a}
  [fill="#fecaca"]{fill:#7f1d1d}
  [stroke="#fecaca"]{stroke:#7f1d1d}
  [fill="#fca5a5"]{fill:#b91c1c}
  [stroke="#fca5a5"]{stroke:#b91c1c}
  [fill="#991b1b"]{fill:#fca5a5}
  [stroke="#991b1b"]{stroke:#fca5a5}
  [fill="#dc2626"]{fill:#f87171}
  [stroke="#dc2626"]{stroke:#f87171}
  [fill="#fffbeb"]{fill:#451a03}
  [stroke="#fffbeb"]{stroke:#451a03}
  [fill="#fef3c7"]{fill:#78350f}
  [stroke="#fef3c7"]{stroke:#78350f}
  [fill="#92400e"]{fill:#fcd34d}
  [stroke="#92400e"]{stroke:#fcd34d}
  [fill="#b45309"]{fill:#fbbf24}
  [stroke="#b45309"]{stroke:#fbbf24}
  }
</style>

  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">AFE 怎么测一串又一串？—— MUX 巡逻式扫描</text>

  <!-- 5 节电池串联 -->
  <g stroke="#334155" stroke-width="2" fill="#dbeafe">
    <rect x="120" y="90" width="46" height="54" rx="4"/>
    <rect x="120" y="148" width="46" height="54" rx="4"/>
    <rect x="120" y="206" width="46" height="54" rx="4"/>
    <rect x="120" y="264" width="46" height="54" rx="4"/>
    <rect x="120" y="322" width="46" height="54" rx="4"/>
  </g>
  <text x="95" y="121" text-anchor="end" font-size="13" fill="#334155">CELL1</text>
  <text x="95" y="179" text-anchor="end" font-size="13" fill="#334155">CELL2</text>
  <text x="95" y="237" text-anchor="end" font-size="13" fill="#334155">CELL3</text>
  <text x="95" y="295" text-anchor="end" font-size="13" fill="#334155">CELL4</text>
  <text x="95" y="353" text-anchor="end" font-size="13" fill="#334155">CELL5</text>

  <!-- 采样抽头线 -->
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="166" y1="90" x2="330" y2="90"/>
    <line x1="166" y1="148" x2="330" y2="148"/>
    <line x1="166" y1="206" x2="330" y2="206"/>
    <line x1="166" y1="264" x2="330" y2="264"/>
    <line x1="166" y1="322" x2="330" y2="322"/>
    <line x1="166" y1="380" x2="330" y2="380"/>
  </g>
  <g font-size="10" fill="#64748b">
    <text x="310" y="86">VC5</text>
    <text x="310" y="144">VC4</text>
    <text x="310" y="202">VC3</text>
    <text x="310" y="260">VC2</text>
    <text x="310" y="318">VC1</text>
    <text x="310" y="376">VC0</text>
  </g>

  <!-- 被测电池高亮框 -->
  <rect x="84" y="86" width="220" height="62" rx="6" fill="none" stroke="#2563eb" stroke-width="3">
    <animate attributeName="y" values="86;86;144;202;260;318" keyTimes="0;0.15;0.32;0.49;0.66;0.83" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.14;0.17;1" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- MUX 与 ADC -->
  <rect x="330" y="110" width="140" height="250" rx="10" fill="#fff" stroke="#334155" stroke-width="2"/>
  <text x="400" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">MUX</text>
  <text x="400" y="260" text-anchor="middle" font-size="11" fill="#64748b">多路选择器</text>

  <!-- 巡逻哨兵圆点：在 MUX 输入脚之间跳动 -->
  <circle r="7" fill="#f59e0b" cx="338">
    <animate attributeName="cy" values="90;90;148;206;264;322" keyTimes="0;0.15;0.32;0.49;0.66;0.83" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.14;0.17;1" dur="8s" repeatCount="indefinite"/>
  </circle>

  <line x1="470" y1="235" x2="540" y2="235" stroke="#334155" stroke-width="2"/>
  <rect x="540" y="190" width="120" height="90" rx="10" fill="#fff" stroke="#334155" stroke-width="2"/>
  <text x="600" y="228" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">ADC</text>
  <text x="600" y="248" text-anchor="middle" font-size="11" fill="#64748b">同一个基准</text>

  <!-- 读数轮播 -->
  <g font-size="16" font-weight="bold" fill="#1d4ed8">
    <text x="690" y="240" opacity="0">4.021V<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.15;0.17;0.30;0.32;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="690" y="240" opacity="0">3.998V<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.34;0.47;0.49;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="690" y="240" opacity="0">4.103V<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.51;0.64;0.66;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="690" y="240" opacity="0">3.967V<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.66;0.68;0.81;0.83;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="690" y="240" opacity="0">4.002V<animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.83;0.85;0.98;1" dur="8s" repeatCount="indefinite"/></text>
  </g>

  <text x="400" y="412" text-anchor="middle" font-size="14" fill="#475569">像哨兵巡逻：同一颗 ADC 轮流接到每一串——串间一致性极好（共用一个基准）</text>
</svg>
