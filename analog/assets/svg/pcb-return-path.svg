" y="420" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#a8321f" opacity="0">③ 环路=环形天线：向外辐射 EMI 认证翻车，向内拾取干扰=莫名串扰<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.68;0.74;1" dur="5s" repeatCount="indefinite"/></text></g><g opacity="0">
