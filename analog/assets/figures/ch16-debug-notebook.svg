<text x="168" y="482" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="18.5" font-weight="700" fill="#14213d">结论：是晶振焊点虚焊，不是芯片坏。</text>
<text x="168" y="508" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12.5" fill="#52606d">热风枪逐区加热，吹到晶振立刻复现。</text>
<rect x="168" y="520" width="14" height="14" fill="#fffdf8" stroke="#0f766e" stroke-width="1.6"/>
