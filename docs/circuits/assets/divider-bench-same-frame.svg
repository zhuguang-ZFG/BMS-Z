</style><rect class="bg" x="0" y="-156" width="800" height="640" /><rect class="bms-marker" aria-hidden="true" x="18.0" y="-142.9" width="302.0" height="17.3" rx="3.8" transform="rotate(-.5 18.0 -134.2)"/><path class="bms-under" aria-hidden="true" d="M24.0 -119.0 q 24.0 -2.4 48.0 0 t 48 0 t 48 0 t 48 0 t 48 0 t 48 0"/><text class="title" x="24" y="-128">同框分压实测台：四件东西要在同一张里</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><g class="bms-doodle" aria-hidden="true" transform="translate(746.0 -88.0)"><animateTransform attributeName="transform" type="rotate" values="-6;7;-6" keyTimes="0;0.5;1" dur="5.4s" repeatCount="indefinite" additive="sum"/><animate attributeName="opacity" values="0.62;1;0.62" keyTimes="0;0.5;1" dur="3.6s" repeatCount="indefinite"/><path class="bms-spark-fill" d="M0 -9 L2.3 -2.3 L9 0 L2.3 2.3 L0 9 L-2.3 2.3 L-9 0 L-2.3 -2.3 Z"/></g><g class="bms-doodle" aria-hidden="true" transform="translate(710.0 -98.0)"><animateTransform attributeName="transform" type="rotate" values="5;-4;5" keyTimes="0;0.5;1" dur="6.2s" repeatCount="indefinite" additive="sum"/><animate attributeName="opacity" values="0.5;0.9;0.5" keyTimes="0;0.5;1" dur="4.4s" repeatCount="indefinite"/><path class="bms-spark-soft" d="M0 -5.5 L1.4 -1.4 L5.5 0 L1.4 1.4 L0 5.5 L-1.4 1.4 L-5.5 0 L-1.4 -1.4 Z"/></g><g class="bms-doodle" aria-hidden="true"><circle class="bms-spark-fill" cx="728.0" cy="-79.0" r="1.3"/><circle class="bms-spark-soft" cx="696.0" cy="-82.0" r="1.1"/></g><text class="txt" x="40" y="-88" opacity="1">① 同框分压实测台：四件东西要在同一张里<animate calcMode="spline" keySplines="0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 一台，跨在整串上<animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ B0…Bn 接抽头<animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="428" width="752" height="44" rx="6" /><text class="small" x="40" y="456">共地的多路电源叠到 B1–Bn，会经地线把串短路。不要用真电池做过充。示意。</text><rect width="800" height="420" class="bg" />
  <text x="400" y="50" text-anchor="middle" font-size="13" class="gold">示意图·待实拍</text>
  <rect x="24" y="72" width="172" height="120" rx="8" class="panel"><animate calcMode="spline" keySplines="0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1" attributeName="stroke-width" values="5;2;2;2;5" keyTimes="0;0.33;0.66;0.9;1" dur="8s" repeatCount="indefinite" /></rect>
  <text x="110" y="100" text-anchor="middle" font-size="15" font-weight="bold" class="txt">直流电源</text>
  <text x="110" y="124" text-anchor="middle" font-size="12" class="txt">一台，跨在整串上</text>
  <text x="110" y="146" text-anchor="middle" font-size="12" class="txt">正负极只接两端</text>
  <rect x="220" y="72" width="172" height="120" rx="8" class="fill-boxb stroke-b"><animate calcMode="spline" keySplines="0.16 1 0.3 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="stroke-width" values="2;5;2;2;2" keyTimes="0;0.33;0.66;0.9;1" dur="8s" repeatCount="indefinite" /></rect>
  <text x="306" y="100" text-anchor="middle" font-size="15" font-weight="bold" class="txt">电阻分压链</text>
  <text x="306" y="124" text-anchor="middle" font-size="12" class="txt">相等电阻串联</text>
  <text x="306" y="146" text-anchor="middle" font-size="12" class="txt">抽头就是各串</text>
  <rect x="416" y="72" width="172" height="120" rx="8" class="panel"><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="stroke-width" values="2;2;5;2;2" keyTimes="0;0.33;0.66;0.9;1" dur="8s" repeatCount="indefinite" /></rect>
  <text x="502" y="100" text-anchor="middle" font-size="15" font-weight="bold" class="txt">保护板</text>
  <text x="502" y="124" text-anchor="middle" font-size="12" class="txt">B0…Bn 接抽头</text>
  <text x="502" y="146" text-anchor="middle" font-size="12" class="txt">看哪一拍断开</text>
  <rect x="612" y="72" width="172" height="120" rx="8" class="fill-boxy stroke-y"><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.7 0 0.84 0" attributeName="stroke-width" values="2;2;2;5;2" keyTimes="0;0.33;0.66;0.9;1" dur="8s" repeatCount="indefinite" /></rect>
  <text x="698" y="100" text-anchor="middle" font-size="15" font-weight="bold" class="txt">万用表</text>
  <text x="698" y="124" text-anchor="middle" font-size="12" class="txt">只量正在拧的一节</text>
  <text x="698" y="146" text-anchor="middle" font-size="12" class="txt">对照保护动作点</text>
  <line x1="196" y1="132" x2="220" y2="132" stroke-width="2" class="stroke-axis" />
  <line x1="392" y1="132" x2="416" y2="132" stroke-width="2" class="stroke-axis" />
  <line x1="588" y1="132" x2="612" y2="132" stroke-width="2" class="stroke-axis" />
  <circle cy="132" r="6" class="fill-b">
    <animate calcMode="spline" keySplines="0.16 1 0.3 1;0.16 1 0.3 1;0.16 1 0.3 1;0.7 0 0.84 0" attributeName="cx" values="110;306;502;698;110" keyTimes="0;0.33;0.66;0.9;1" dur="8s" repeatCount="indefinite" />
  </circle>
  <text x="24" y="230" font-size="14" class="txt">接线：电源正极到分压链顶端，负极到 B0。每一节抽头进保护板对应采样脚。</text>
  <text x="24" y="254" font-size="14" class="warn">共地的多路电源叠到 B1–Bn，会经地线把串短路。不要用真电池做过充。</text>
  <text x="24" y="286" font-size="14" class="txt">仓库里有电源、万用表、保护板的单独照片。四件出现在同一画面的实拍仍然没有。</text>
  <text x="24" y="318" font-size="14" class="txt">这张把它们画在同一框里，用来认接线。蓝点沿电源、分压、保护板、万用表走一遍。</text>

</svg>