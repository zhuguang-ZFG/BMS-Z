  <line class="grid" x1="347.2" y1="430.0" x2="347.2" y2="436.0"/>
  <text class="small" x="347.2" y="452.0" text-anchor="middle">2</text>
  <line class="grid" x1="706.1" y1="430.0" x2="706.1" y2="436.0"/>
  <text class="small" x="706.1" y="452.0" text-anchor="middle">5</text>
  <line class="grid" x1="102.0" y1="392.1" x2="108.0" y2="392.1"/>
