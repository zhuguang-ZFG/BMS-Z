<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 590" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>包级采样示意：电压可以沿一条教学直线走，但这本未公开手册的阈值格保持为空。4.25 V 只是别的体系的示例。</title>
  <desc>蓝线从 3.0 V 走到 4.2 V。红虚线钉在 4.25 V，用来记住不要借用。底栏每一拍都写着阈值格是空的。</desc>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; }
    .linek { stroke: #57606a; stroke-width: 2.2; fill: none; stroke-dasharray: 7 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .dotg { fill: #1a7f37; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .linek { stroke: #8b949e; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .dotg { fill: #3fb950; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
    }
  </style>
  <!-- formula: V=3.0+1.2*s illustrative; 4.25 V is the stage-1 ternary example and is not filled in as a threshold -->
  <rect class="bg" width="800" height="590"/>
  <text class="title" x="24" y="32">格子空着，这页就不算这本包的手册（示意）</text>
  <rect class="panel" x="24" y="44" width="752" height="124" rx="6"/>
  <text class="txt" x="40" y="68" opacity="0.28">① 电压可以示意地爬<tspan class="small">　从 3.0 V 到 4.2 V，只说明采样在动。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="92" opacity="0.28">② 阈值不画实线<tspan class="small">　钠离子、固态、结构电池的格子仍空着。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="116" opacity="0.28">③ 别借用 4.25 V<tspan class="small">　那是阶段 1 的三元示例，红虚线提醒你别填进去。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="140" opacity="0.28">④ 口诀<tspan class="small">　手册没写的数，就让格子空着。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="180" width="752" height="268" rx="6"/>
  <text class="small" x="40" y="202">示意电压 V</text>
  <text class="warn" x="200" y="218">红虚线 4.25 V 三元示例，不能填进空格</text>
  <line class="axis" x1="108.0" y1="248.0" x2="108.0" y2="400.0"/>
  <line class="axis" x1="108.0" y1="400.0" x2="720.0" y2="400.0"/>
  <line class="grid" x1="108.0" y1="400.0" x2="108.0" y2="406.0"/>
  <text class="small" x="108.0" y="422.0" text-anchor="middle">0</text>
  <line class="grid" x1="720.0" y1="400.0" x2="720.0" y2="406.0"/>
  <text class="small" x="720.0" y="422.0" text-anchor="middle">1</text>
  <line class="grid" x1="102.0" y1="381.0" x2="108.0" y2="381.0"/>
  <text class="small" x="98.0" y="385.0" text-anchor="end">3.0</text>
  <line class="grid" x1="102.0" y1="267.0" x2="108.0" y2="267.0"/>
  <text class="small" x="98.0" y="271.0" text-anchor="end">4.2</text>
  <text class="small" x="720" y="444" text-anchor="end">示意进程</text>
  <polyline class="lineb" points="108.0,381.0 123.3,378.1 138.6,375.3 153.9,372.5 169.2,369.6 184.5,366.8 199.8,363.9 215.1,361.1 230.4,358.2 245.7,355.4 261.0,352.5 276.3,349.6 291.6,346.8 306.9,343.9 322.2,341.1 337.5,338.2 352.8,335.4 368.1,332.6 383.4,329.7 398.7,326.8 414.0,324.0 429.3,321.2 444.6,318.3 459.9,315.5 475.2,312.6 490.5,309.8 505.8,306.9 521.1,304.1 536.4,301.2 551.7,298.4 567.0,295.5 582.3,292.7 597.6,289.8 612.9,286.9 628.2,284.1 643.5,281.3 658.8,278.4 674.1,275.6 689.4,272.7 704.7,269.9 720.0,267.0" stroke-linejoin="round" stroke-linecap="round"/>
  <line class="liner" x1="108" y1="262.3" x2="720" y2="262.3" stroke-dasharray="6 4"/>
  <circle class="doty" r="6" cx="108.0" cy="381.0"><animate attributeName="cx" values="108.0;352.8;536.4;720.0;720.0" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="381.0;335.4;301.2;267.0;267.0" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite"/></circle>
  <circle class="dotr" r="4" cx="108.0" cy="381.0"><animate attributeName="cx" values="108.0;352.8;536.4;720.0;720.0" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite" begin="-6s"/><animate attributeName="cy" values="381.0;335.4;301.2;267.0;267.0" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite" begin="-6s"/></circle>
  <rect class="panel" x="24" y="460" width="752" height="68" rx="6"/>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="1">示意电压 3.00 V  这本手册的阈值格：空<animate attributeName="opacity" values="1;0;0;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0">示意电压 3.48 V  这本手册的阈值格：空<animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0">示意电压 3.84 V  这本手册的阈值格：空<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0">示意电压 4.20 V  这本手册的阈值格：空<animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="24" y="560">不编寄存器地址，也不编保护阈值。包级手册该缺的还缺。</text>

</svg>
