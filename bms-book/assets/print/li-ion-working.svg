<svg data-sketch="1" xmlns="http://www.w3.org/2000/svg" width="800" height="526" viewBox="0 0 800 526" role="img" aria-label="锂电池充放电：离子与电子分头走" aria-describedby="li-ion-desc" font-family="ui-monospace, Consolas, monospace" data-snapshot-time="2">
  <title>锂电池充放电：离子与电子分头走</title>
  <desc id="li-ion-desc">充电时两种粒子从正极一侧移向负极一侧，放电时反向。锂离子走电解液并穿过隔膜，电子经充电器或负载走外电路。粒子数量、速度和时间仅为示意。</desc>
  <style>
