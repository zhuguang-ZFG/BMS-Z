  <circle class="doty" r="6"><animate attributeName="cx" values="108.0;142.6;177.1;211.7;246.2;280.8;315.3;349.9;384.4;419.0;453.6;488.1;522.7;557.2;591.8;626.3;660.9;695.4;730.0" keyTimes="0.0000;0.0556;0.1111;0.1667;0.2222;0.2778;0.3333;0.3889;0.4444;0.5000;0.5556;0.6111;0.6667;0.7222;0.7778;0.8333;0.8889;0.9444;1.0000" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="418.8;418.2;417.7;417.1;416.5;416.0;415.4;414.9;414.3;409.8;405.3;400.8;396.3;391.8;387.4;366.0;335.7;296.5;248.2" keyTimes="0.0000;0.0556;0.1111;0.1667;0.2222;0.2778;0.3333;0.3889;0.4444;0.5000;0.5556;0.6111;0.6667;0.7222;0.7778;0.8333;0.8889;0.9444;1.0000" dur="12s" repeatCount="indefinite"/></circle>
  <text class="small" x="24" y="528">全部数字是示意，不是电芯滥用试验。速率报警代替不了断流。不要用真电池做热失控演示。</text>
</svg>
