<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
<defs>
 <filter id="w" filterUnits="userSpaceOnUse" x="0" y="0" width="960" height="560">
  <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="11" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="4.5" xChannelSelector="R" yChannelSelector="G"/>
 </filter>
 <filter id="grain" filterUnits="userSpaceOnUse" x="0" y="0" width="960" height="560">
  <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="5"/>
  <feColorMatrix type="saturate" values="0"/></filter>
</defs>
<rect width="960" height="560" fill="#f6f1e3"/>
<rect width="960" height="560" filter="url(#grain)" opacity="0.22"/>
<text x="480" y="62" font-family="KaiTi" font-size="20" fill="#003153" text-anchor="middle">同一个问题问两遍，哪一栏能当依据</text>
<line x1="480.0" y1="88" x2="480.0" y2="384" stroke="#003153" stroke-width="1.2" stroke-dasharray="8 6" filter="url(#w)"/>
<rect x="150.0" y="128.0" width="250.0" height="58.0" fill="none" stroke="#003153" stroke-width="1.5" filter="url(#w)"/>
<text x="164.0" y="152.0" font-family="KaiTi" font-size="13" fill="#003153">datasheet 片段</text>
<text x="164.0" y="172.0" font-family="KaiTi" font-size="10" fill="#003153" opacity="0.8">原厂参数表，能翻到第几页</text>
<rect x="150.0" y="200.0" width="250.0" height="58.0" fill="none" stroke="#003153" stroke-width="1.5" filter="url(#w)"/>
<text x="164.0" y="224.0" font-family="KaiTi" font-size="13" fill="#003153">寄存器映射表</text>
<text x="164.0" y="244.0" font-family="KaiTi" font-size="10" fill="#003153" opacity="0.8">地址与位宽逐位对得上</text>
<rect x="150.0" y="272.0" width="250.0" height="58.0" fill="none" stroke="#003153" stroke-width="1.5" filter="url(#w)"/>
<text x="164.0" y="296.0" font-family="KaiTi" font-size="13" fill="#003153">抓包日志</text>
<text x="164.0" y="316.0" font-family="KaiTi" font-size="10" fill="#003153" opacity="0.8">线上真跑过，时间戳在</text>
<rect x="150.0" y="344.0" width="250.0" height="58.0" fill="none" stroke="#003153" stroke-width="1.5" filter="url(#w)"/>
<text x="164.0" y="368.0" font-family="KaiTi" font-size="13" fill="#003153">仓库正文</text>
<text x="164.0" y="388.0" font-family="KaiTi" font-size="10" fill="#003153" opacity="0.8">仓库正文，有提交记录</text>
<rect x="560.0" y="128.0" width="250.0" height="58.0" fill="none" stroke="#003153" stroke-width="1.3" stroke-dasharray="7 5" filter="url(#w)"/>
<text x="574.0" y="152.0" font-family="KaiTi" font-size="13" fill="#003153">参数量里的世界知识</text>
<text x="574.0" y="172.0" font-family="KaiTi" font-size="10" fill="#003153" opacity="0.8">训练语料里的统计印象</text>
<rect x="560.0" y="200.0" width="250.0" height="58.0" fill="none" stroke="#003153" stroke-width="1.3" stroke-dasharray="7 5" filter="url(#w)"/>
<text x="574.0" y="224.0" font-family="KaiTi" font-size="13" fill="#003153">上一个项目的习惯</text>
<text x="574.0" y="244.0" font-family="KaiTi" font-size="10" fill="#003153" opacity="0.8">别处的默认值，未必适用</text>
<rect x="560.0" y="272.0" width="250.0" height="58.0" fill="none" stroke="#003153" stroke-width="1.3" stroke-dasharray="7 5" filter="url(#w)"/>
<text x="574.0" y="296.0" font-family="KaiTi" font-size="13" fill="#003153">看着像的相似型号</text>
<text x="574.0" y="316.0" font-family="KaiTi" font-size="10" fill="#003153" opacity="0.8">差一个后缀，保护点换档</text>
<rect x="560.0" y="344.0" width="250.0" height="58.0" fill="none" stroke="#003153" stroke-width="1.3" stroke-dasharray="7 5" filter="url(#w)"/>
<text x="574.0" y="368.0" font-family="KaiTi" font-size="13" fill="#003153">很顺的解释</text>
<text x="574.0" y="388.0" font-family="KaiTi" font-size="10" fill="#003153" opacity="0.8">读起来顺，但查不到出处</text>
<g filter="url(#w)" fill="none" stroke="#003153" stroke-width="1.0" opacity="0.75">
 <line x1="400.0" y1="157" x2="560.0" y2="157"/>
 <line x1="400.0" y1="229" x2="560.0" y2="229"/>
