<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">升压的关断阶段才把电感电流送往输出</title>
<desc id="figDesc">示意理想 CCM：5→12 V、47 µH、100 kHz、输出 0.2 A；D=7/12。</desc>
