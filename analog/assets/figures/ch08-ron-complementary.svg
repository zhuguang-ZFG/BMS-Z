<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">传输门为什么必须 NMOS+PMOS 并联：R_ON–V_IN 互补曲线</title>
<desc id="figDesc">主图是 V_DD=5V、V_TH=1V、R0=80Ω·V 下的 R_ON–V_IN 曲线：深蓝 N 管曲线 R_on,N=R0/(V_DD-V_IN-V_TH) 从 0V 处的 20Ω 起爬，V_IN 接近 4V 时趋向无穷（阈值损失，体效应把单管上限再压到 3.5V）；琥珀 P 管曲线 R_on,P=R0/(V_IN-V_TH) 从 5V 处的 20Ω 起爬，V_IN 小于 1V 时没导通；青色并联包络在 1~4V 区间恒为 26.7Ω（两管电导之和近似常数），全程 20→26.7→20Ω 平坦。右上小图画传输门结构：IN 与 OUT 之间 N管、P管并联，栅极接互补控制 EN 与 EN 反，源漏对称故电流双向同阻。右下数字卡列出全部取值：端点 20Ω、平台 26.7Ω、盲区单管封顶 4V 缺 1V、体效应加 0.55V 退到 3.5V、配比 P管 W/L 取 N管的 2~3 倍、自举恒 V_GS=5V 时 R_ON=16Ω。结论：定量设计回到手册的 R_ON–V_IN 曲线，账按峰值算，不按端点算。</desc>
<rect width="960" height="640" fill="#fffdf8"/>
<defs>
<marker id="arrI" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14213d"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52606d"/></marker>
</defs>

<text x="36" y="46" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="28" font-weight="700" fill="#14213d">传输门为什么必须 NMOS+PMOS 并联：R_ON–V_IN 互补曲线</text>
<text x="36" y="76" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="15" fill="#52606d">V_DD = 5V · V_TH = 1V · R0 = 80Ω·V——§8.1「算一笔」的三个点，铺成整条曲线。</text>
<line x1="36" y1="94" x2="924" y2="94" stroke="#14213d" stroke-width="2"/>

<!-- ===== ① 主图：R_ON–V_IN 互补曲线 ===== -->
<g transform="rotate(-0.3 336 348)">
<rect x="36" y="116" width="600" height="464" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
<rect x="36" y="116" width="600" height="32" rx="6" fill="#e6f6f2"/>
<rect x="36" y="134" width="600" height="14" fill="#e6f6f2"/>
<text x="52" y="139" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="15" font-weight="700" fill="#0f766e">① R_ON–V_IN 互补曲线：谁行谁上，接力覆盖</text>

<!-- 并联平坦带 20~26.7Ω -->
<rect x="116" y="439.2" width="484" height="22.8" fill="#e6f6f2" opacity="0.5"/>

<!-- 网格与坐标轴 -->
<line x1="116" y1="190" x2="600" y2="190" stroke="#d0d5dd" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="116" y1="258" x2="600" y2="258" stroke="#d0d5dd" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="116" y1="394" x2="600" y2="394" stroke="#d0d5dd" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="116" y1="462" x2="600" y2="462" stroke="#d0d5dd" stroke-width="1" stroke-dasharray="4 4"/>
<text x="108" y="193.5" text-anchor="end" font-family="'Book Mono',monospace" font-size="10" fill="#52606d">100</text>
<text x="108" y="261.5" text-anchor="end" font-family="'Book Mono',monospace" font-size="10" fill="#52606d">80</text>
<text x="108" y="397.5" text-anchor="end" font-family="'Book Mono',monospace" font-size="10" fill="#52606d">40</text>
<text x="108" y="465.5" text-anchor="end" font-family="'Book Mono',monospace" font-size="10" fill="#52606d">20</text>
<line x1="116" y1="530" x2="116" y2="182" stroke="#52606d" stroke-width="1.5" marker-end="url(#arrG)"/>
<line x1="116" y1="530" x2="608" y2="530" stroke="#52606d" stroke-width="1.5" marker-end="url(#arrG)"/>
<text x="116" y="170" text-anchor="middle" font-family="'Book Mono',monospace" font-size="11" fill="#52606d">R_ON / Ω</text>
<text x="608" y="516" text-anchor="end" font-family="'Book Mono',monospace" font-size="11" fill="#52606d">V_IN / V</text>
<text x="116" y="548" text-anchor="middle" font-family="'Book Mono',monospace" font-size="10.5" fill="#52606d">0</text>
<text x="212.8" y="548" text-anchor="middle" font-family="'Book Mono',monospace" font-size="10.5" fill="#52606d">1</text>
<text x="309.6" y="548" text-anchor="middle" font-family="'Book Mono',monospace" font-size="10.5" fill="#52606d">2</text>
<text x="406.4" y="548" text-anchor="middle" font-family="'Book Mono',monospace" font-size="10.5" fill="#52606d">3</text>
<text x="503.2" y="548" text-anchor="middle" font-family="'Book Mono',monospace" font-size="10.5" fill="#52606d">4</text>
<text x="600" y="548" text-anchor="middle" font-family="'Book Mono',monospace" font-size="10.5" fill="#52606d">5</text>

<!-- 阈值参考线 -->
<line x1="503.2" y1="190" x2="503.2" y2="530" stroke="#b42318" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="212.8" y1="190" x2="212.8" y2="530" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4"/>

<!-- N管曲线 R_on,N = 80/(4-V_IN) -->
<path d="M 116 462 L 164.4 452.3 L 212.8 439.2 L 261.2 421.2 L 309.6 394 L 358 348.7 L 387 303.3 L 406.4 258 L 425.8 190" fill="none" stroke="#14213d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrI)"/>
<!-- P管曲线 R_on,P = 80/(V_IN-1) -->
<path d="M 290.2 190 L 309.6 258 L 358 348.7 L 406.4 394 L 454.8 421.2 L 503.2 439.2 L 551.6 452.3 L 600 462" fill="none" stroke="#b45309" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#arrA)"/>
<!-- 并联包络：20 → 26.7 → 20Ω -->
<path d="M 116 462 L 212.8 439.2 L 503.2 439.2 L 600 462" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

<circle cx="116" cy="462" r="3.5" fill="#0f766e"/>
<circle cx="358" cy="439.2" r="3.5" fill="#0f766e"/>
<circle cx="600" cy="462" r="3.5" fill="#0f766e"/>
<circle cx="503.2" cy="439.2" r="3.5" fill="#b45309"/>

<text x="170" y="500" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" fill="#14213d">N管 R_on,N</text>
<text x="556" y="404" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" fill="#b45309">P管 R_on,P</text>
<text x="436" y="176" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="10.5" fill="#14213d">N管 →∞</text>
<text x="283" y="172" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="10.5" fill="#b45309">P管 →∞</text>
<text x="360" y="424" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12" font-weight="700" fill="#0f766e">并联恒 26.7Ω 平台</text>
<text x="360" y="470" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="10.5" fill="#52606d">（两管电导之和 ≈ 常数）</text>
<text x="124" y="484" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" font-weight="700" fill="#0f766e">20Ω</text>
<text x="592" y="484" text-anchor="end" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" font-weight="700" fill="#0f766e">20Ω</text>
<text x="516" y="424" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="10.5" font-weight="700" fill="#b45309">26.7Ω</text>
<text x="510" y="246" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" fill="#b42318">N管阈值损失：</text>
<text x="510" y="266" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" fill="#b42318">V_IN→4V 时 →∞</text>
<text x="510" y="286" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" fill="#b42318">体效应退到 3.5V</text>
<text x="206" y="232" text-anchor="end" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="10.5" fill="#b45309">P管起点：</text>
<text x="206" y="250" text-anchor="end" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="10.5" fill="#b45309">V_IN&lt;1V 没导通</text>

<text x="56" y="566" font-family="'Book Mono',monospace" font-size="11" fill="#52606d">R_on,N = R0/(V_DD-V_IN-V_TH)    R_on,P = R0/(V_IN-V_TH)    R0 = 80Ω·V</text>
</g>

<!-- ===== ② 传输门结构小图 ===== -->
<g transform="rotate(0.25 792 214)">
<rect x="660" y="116" width="264" height="196" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
<rect x="660" y="116" width="264" height="32" rx="6" fill="#fdf3e3"/>
<rect x="660" y="134" width="264" height="14" fill="#fdf3e3"/>
<text x="676" y="139" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="15" font-weight="700" fill="#b45309">② 传输门：N管传低，P管传高</text>

<text x="676" y="204" font-family="'Book Mono',monospace" font-size="11" fill="#52606d">IN</text>
<line x1="690" y1="200" x2="716" y2="200" stroke="#52606d" stroke-width="2" stroke-linecap="round"/>
<line x1="716" y1="172" x2="716" y2="228" stroke="#52606d" stroke-width="2"/>
<line x1="796" y1="172" x2="796" y2="228" stroke="#52606d" stroke-width="2"/>
<line x1="716" y1="178" x2="736" y2="178" stroke="#14213d" stroke-width="2"/>
<line x1="784" y1="178" x2="796" y2="178" stroke="#14213d" stroke-width="2"/>
<rect x="736" y="170" width="48" height="16" rx="3" fill="#e6f6f2" stroke="#14213d" stroke-width="1.5"/>
<text x="760" y="182" text-anchor="middle" font-family="'Book Mono',monospace" font-size="9.5" fill="#14213d">NMOS</text>
<line x1="760" y1="170" x2="760" y2="156" stroke="#14213d" stroke-width="1.5"/>
<text x="760" y="150" text-anchor="middle" font-family="'Book Mono',monospace" font-size="10" fill="#14213d">EN</text>
<line x1="716" y1="222" x2="736" y2="222" stroke="#b45309" stroke-width="2"/>
<line x1="784" y1="222" x2="796" y2="222" stroke="#b45309" stroke-width="2"/>
<rect x="736" y="214" width="48" height="16" rx="3" fill="#fdf3e3" stroke="#b45309" stroke-width="1.5"/>
<text x="760" y="226" text-anchor="middle" font-family="'Book Mono',monospace" font-size="9.5" fill="#b45309">PMOS</text>
<circle cx="760" cy="216" r="2.5" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
<line x1="760" y1="219" x2="760" y2="234" stroke="#b45309" stroke-width="1.5"/>
<text x="760" y="248" text-anchor="middle" font-family="'Book Mono',monospace" font-size="10" fill="#b45309">EN</text>
<line x1="753" y1="240" x2="767" y2="240" stroke="#b45309" stroke-width="1.2"/>
<line x1="796" y1="200" x2="844" y2="200" stroke="#52606d" stroke-width="2" stroke-linecap="round"/>
<text x="852" y="204" font-family="'Book Mono',monospace" font-size="11" fill="#52606d">OUT</text>

<text x="676" y="272" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" fill="#52606d">源漏对称 → 电流双向同阻</text>
<text x="676" y="292" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" fill="#52606d">互补控制由片内反相器生成，外部一路逻辑</text>
</g>

<!-- ===== ③ 数字卡 ===== -->
<g transform="rotate(-0.2 792 456)">
<rect x="660" y="332" width="264" height="248" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
<rect x="660" y="332" width="264" height="32" rx="6" fill="#e6f6f2"/>
<rect x="660" y="350" width="264" height="14" fill="#e6f6f2"/>
<text x="676" y="355" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="15" font-weight="700" fill="#0f766e">③ 图上数字全部出自 §8.1</text>
<text x="676" y="380" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" fill="#14213d">V_IN=0V：N管 20Ω，P管→∞</text>
<text x="676" y="402" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" fill="#b45309">V_IN=4V：N管→∞，P管 26.7Ω</text>
<text x="676" y="424" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" fill="#0f766e">1~4V 并联恒 26.7Ω（电导和≈常数）</text>
<text x="676" y="446" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" fill="#0f766e">包络：20→26.7→20Ω 全程平坦</text>
<text x="676" y="468" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" fill="#b42318">盲区：单 N管传高封顶 4V（缺 1V）</text>
<text x="676" y="490" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" fill="#b42318">体效应 +0.55V → 上限 3.5V</text>
<text x="676" y="512" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" fill="#52606d">配比：P管 W/L 取 N管的 2~3 倍</text>
<text x="676" y="534" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" fill="#52606d">自举：V_GS=5V 恒定 → R_ON=16Ω</text>
</g>

<!-- ===== 结论带 ===== -->
<rect x="36" y="596" width="888" height="32" rx="6" fill="#e6f6f2"/>
<text x="54" y="617" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="13" fill="#14213d">结论：单管必有盲区，并联互补才全摆幅平坦——定量设计回到手册 R_ON–V_IN 曲线，账按峰值算，不按端点算。</text>
</svg>
