</g>
</g>
<g class="motion" data-x="1">
<text x="48.0" y="314.0" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="start">结构成立之后，语义还要继续核对：</text>
<g filter="url(#w)">
 <rect x="245.0" y="330.0" width="54.0" height="32.0" fill="none" stroke="#003153" stroke-width="1.5" rx="3"/>
 <text x="272.0" y="352.0" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="middle">缩放</text>
 <rect x="323.0" y="330.0" width="54.0" height="32.0" fill="none" stroke="#003153" stroke-width="1.5" rx="3"/>
 <text x="350.0" y="352.0" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="middle">端序</text>
 <rect x="401.0" y="330.0" width="80.0" height="32.0" fill="none" stroke="#003153" stroke-width="1.5" rx="3"/>
 <text x="441.0" y="352.0" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="middle">固件版本</text>
