<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 544" font-family="ui-monospace, Consolas, monospace">
  <title>增量容量：两座高斯峰。老化后变矮并稍微右移。数字为示意，不是某种化学的实测。</title>
  <desc>亮点扫过两座高斯峰，再看老化后峰变矮、稍微右移，提示拿峰形当 SOH 之前先对温度和倍率条件。</desc>

  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.5; fill: none; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
    }
  </style>

  <!-- formula: fresh: 1.2*N(3.40,0.04)+0.7*N(3.68,0.05); aged: 0.65x and +0.03 V -->
  <rect class="bg" width="800" height="544"/>
  <text class="title" x="24" y="32">dQ/dV 的峰，是相变在电压轴上的指纹（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="128" rx="6"/>
  <text class="txt" x="40" y="72" opacity="0.28">① 峰在斜率等于 0 的地方<tspan class="small">　新鲜曲线第一峰在 3.40 V，高度 1.20。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="98" opacity="0.28">② 第二峰<tspan class="small">　3.68 V，高度 0.70。两峰之间是谷，不是平台噪声。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="124" opacity="0.28">③ 老化<tspan class="small">　高度乘 0.65，峰还往右挪 0.03 V。红线更矮。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="150" opacity="0.28">④ 拿去当 SOH 之前<tspan class="small">　先确认是同一温度、同一倍率。峰会跟着工况跑。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="188" width="752" height="304" rx="6"/>
  <text class="small" x="40" y="210">dQ/dV（Ah/V，示意）</text>
  <line class="axis" x1="108.0" y1="228.0" x2="108.0" y2="430.0"/>
  <line class="axis" x1="108.0" y1="430.0" x2="730.0" y2="430.0"/>
  <text class="small" x="730.0" y="468.0" text-anchor="end">电压 V（示意）</text>
  <line class="grid" x1="302.4" y1="430.0" x2="302.4" y2="436.0"/>
  <text class="small" x="302.4" y="452.0" text-anchor="middle">3.40</text>
  <line class="grid" x1="520.1" y1="430.0" x2="520.1" y2="436.0"/>
  <text class="small" x="520.1" y="452.0" text-anchor="middle">3.68</text>
  <line class="grid" x1="691.1" y1="430.0" x2="691.1" y2="436.0"/>
  <text class="small" x="691.1" y="452.0" text-anchor="middle">3.90</text>
  <line class="grid" x1="102.0" y1="364.4" x2="108.0" y2="364.4"/>
  <text class="small" x="98.0" y="368.4" text-anchor="end">0.455</text>
  <line class="grid" x1="102.0" y1="329.0" x2="108.0" y2="329.0"/>
  <text class="small" x="98.0" y="333.0" text-anchor="end">0.70</text>
  <line class="grid" x1="102.0" y1="256.9" x2="108.0" y2="256.9"/>
  <text class="small" x="98.0" y="260.9" text-anchor="end">1.20</text>
