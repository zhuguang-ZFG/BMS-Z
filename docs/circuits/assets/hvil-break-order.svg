<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440">
  <title>互锁环断开之后，接触器才允许打开</title>
  <rect width="880" height="440" fill="#f8fafc"/>
  <style>
  text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
  /* 深色模式：GitHub 深色主题下对调底色与文字色，只覆盖配色，不动几何与动画。
     stroke="#fff" 保持白色——那是彩色徽标上的勾选，不在覆盖范围内。 */
  @media (prefers-color-scheme: dark){
  rect[fill="#f8fafc"]{fill:#0f172a}
  rect[fill="#fff"]{fill:#1e293b}
  [fill="#f1f5f9"]{fill:#1e293b}
  [stroke="#f1f5f9"]{stroke:#1e293b}
  [fill="#e2e8f0"]{fill:#334155}
  [stroke="#e2e8f0"]{stroke:#334155}
  [fill="#cbd5e1"]{fill:#475569}
  [stroke="#cbd5e1"]{stroke:#475569}
  [fill="#64748b"]{fill:#94a3b8}
  [stroke="#64748b"]{stroke:#94a3b8}
  [fill="#475569"]{fill:#cbd5e1}
  [stroke="#475569"]{stroke:#cbd5e1}
  [fill="#334155"]{fill:#e2e8f0}
  [stroke="#334155"]{stroke:#e2e8f0}
  [fill="#1e293b"]{fill:#f1f5f9}
  [stroke="#1e293b"]{stroke:#f1f5f9}
  [fill="#dbeafe"]{fill:#1e3a8a}
  [stroke="#dbeafe"]{stroke:#1e3a8a}
  [fill="#eff6ff"]{fill:#172554}
  [stroke="#eff6ff"]{stroke:#172554}
  [fill="#bfdbfe"]{fill:#1e40af}
  [stroke="#bfdbfe"]{stroke:#1e40af}
  [fill="#1d4ed8"]{fill:#60a5fa}
  [stroke="#1d4ed8"]{stroke:#60a5fa}
  [fill="#1e40af"]{fill:#93c5fd}
  [stroke="#1e40af"]{stroke:#93c5fd}
  [fill="#2563eb"]{fill:#60a5fa}
  [stroke="#2563eb"]{stroke:#60a5fa}
  [fill="#3b82f6"]{fill:#60a5fa}
  [stroke="#3b82f6"]{stroke:#60a5fa}
  [fill="#ecfdf5"]{fill:#022c22}
  [stroke="#ecfdf5"]{stroke:#022c22}
  [fill="#a7f3d0"]{fill:#065f46}
  [stroke="#a7f3d0"]{stroke:#065f46}
  [fill="#86efac"]{fill:#166534}
  [stroke="#86efac"]{stroke:#166534}
  [fill="#065f46"]{fill:#6ee7b7}
  [stroke="#065f46"]{stroke:#6ee7b7}
  [fill="#059669"]{fill:#34d399}
  [stroke="#059669"]{stroke:#34d399}
  [fill="#fef2f2"]{fill:#450a0a}
  [stroke="#fef2f2"]{stroke:#450a0a}
  [fill="#fecaca"]{fill:#7f1d1d}
  [stroke="#fecaca"]{stroke:#7f1d1d}
  [fill="#fca5a5"]{fill:#b91c1c}
  [stroke="#fca5a5"]{stroke:#b91c1c}
  [fill="#991b1b"]{fill:#fca5a5}
  [stroke="#991b1b"]{stroke:#fca5a5}
  [fill="#dc2626"]{fill:#f87171}
  [stroke="#dc2626"]{stroke:#f87171}
  [fill="#fffbeb"]{fill:#451a03}
  [stroke="#fffbeb"]{stroke:#451a03}
  [fill="#fef3c7"]{fill:#78350f}
  [stroke="#fef3c7"]{stroke:#78350f}
  [fill="#92400e"]{fill:#fcd34d}
  [stroke="#92400e"]{stroke:#fcd34d}
  [fill="#b45309"]{fill:#fbbf24}
  [stroke="#b45309"]{stroke:#fbbf24}
  }
</style>

  <text x="440" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">HVIL 因果：环先断，闸再开，母线最后才安全</text>
  <rect x="36" y="70" width="220" height="130" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2">
    <animate attributeName="stroke-width" values="5;2;2;5" keyTimes="0;0.3;0.7;1" dur="9s" repeatCount="indefinite"/>
  </rect>
  <text x="146" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">1 环断开</text>
  <text x="146" y="148" text-anchor="middle" font-size="13" fill="#334155">插头或 MSD 先松</text>
  <text x="146" y="172" text-anchor="middle" font-size="13" fill="#334155">低压信号没有了</text>
  <rect x="330" y="70" width="220" height="130" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2">
    <animate attributeName="stroke-width" values="2;5;2;2" keyTimes="0;0.4;0.7;1" dur="9s" repeatCount="indefinite"/>
  </rect>
  <text x="440" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e">2 接触器打开</text>
  <text x="440" y="148" text-anchor="middle" font-size="13" fill="#334155">高压源先离开母线</text>
  <text x="440" y="172" text-anchor="middle" font-size="13" fill="#334155">人还没碰到端子</text>
  <rect x="624" y="70" width="220" height="130" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2">
    <animate attributeName="stroke-width" values="2;2;5;2" keyTimes="0;0.45;0.7;1" dur="9s" repeatCount="indefinite"/>
  </rect>
  <text x="734" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#065f46">3 母线掉下来</text>
  <text x="734" y="148" text-anchor="middle" font-size="13" fill="#334155">确认断开后再泄放</text>
  <text x="734" y="172" text-anchor="middle" font-size="13" fill="#334155">然后才算安全</text>
  <circle cy="135" r="7" fill="#1d4ed8">
    <animate attributeName="cx" values="146;440;734;146" keyTimes="0;0.33;0.66;1" dur="9s" repeatCount="indefinite"/>
  </circle>
  <rect x="36" y="230" width="808" height="120" rx="8" fill="#fff" stroke="#dc2626"/>
  <text x="56" y="268" font-size="15" font-weight="bold" fill="#dc2626" opacity="1">错序：高压还在，人已经摸到端子
    <animate attributeName="opacity" values="1;0;0;1" keyTimes="0;0.25;0.8;1" dur="9s" repeatCount="indefinite"/>
  </text>
  <text x="56" y="300" font-size="15" fill="#065f46" opacity="0">对序：信号针短，先断；高压针长，后断。环没了就不要再合闸。
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.3;0.75;0.85;1" dur="9s" repeatCount="indefinite"/>
  </text>
  <text x="56" y="332" font-size="13" fill="#475569">示意图。针脚长短差是接插件的机械保证，不是软件延时。</text>
  <text x="440" y="410" text-anchor="middle" font-size="13" fill="#475569">和预充不是同一件事：这张管的是「人还没碰到，高压先离开」。</text>

</svg>
