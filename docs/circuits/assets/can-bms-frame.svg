<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="ui-monospace, Consolas, monospace">
  <title>BMS CAN 教学帧：标识符、SOC、电流、总压、温度、故障位和计数。比例与取值均为示意，不是厂商协议。</title>
  <desc>BMS CAN 教学帧：标识符、SOC、电流、总压、温度、故障位和计数。比例与取值均为示意，不是厂商协议。</desc>

  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.5; fill: none; }
    .liney { stroke: #bf8700; stroke-width: 2.5; fill: none; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .dotg { fill: #1a7f37; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    .boxr { fill: #ffebe9; stroke: #cf222e; }
    .boxg { fill: #dafbe1; stroke: #1a7f37; }
    .boxy { fill: #fff8c5; stroke: #bf8700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .dotg { fill: #3fb950; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
      .boxr { fill: #3d1214; stroke: #ff7b72; }
      .boxg { fill: #12261e; stroke: #3fb950; }
      .boxy { fill: #3d2e00; stroke: #d29922; }
    }
  </style>

  <rect class="bg" width="800" height="470"/>

  <text class="title" x="24" y="32">一帧 BMS 教学报文：标识符先走，载荷后走（示意，不是厂商 DBC）</text>
  <rect class="panel" x="24" y="48" width="752" height="122" rx="6"/>
  <text class="txt" x="40" y="68" opacity="0.28">① 标识符 0x180<tspan class="small">　标准 11 位。越小越先留下。故障帧应比这帧更小。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="94" opacity="0.28">② 字节 0<tspan class="small">　SOC = 62，单位 1%。示意。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="120" opacity="0.28">③ 字节 1–2<tspan class="small">　电流有符号，比例 0.1 A。数值 150 读成 15.0 A。示意。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="146" opacity="0.28">④ 字节 3–7<tspan class="small">　总压比例 0.1 V 时 4000 读成 400.0 V；随后温度、故障位、计数。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="180" width="752" height="220" rx="6"/>
  <text class="small" x="40" y="204">DLC = 8。字段逐个点亮。比例是这张图自己定的，换一家协议就换一套。</text>
<g opacity="0.28"><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/><rect class="boxb" x="40" y="230" width="90" height="78" rx="6"/><text class="txt" x="85" y="258" text-anchor="middle">ID</text><text class="small" x="85" y="284" text-anchor="middle">0x180</text></g>
  <g opacity="0.28"><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/><rect class="boxb" x="130" y="230" width="90" height="78" rx="6"/><text class="txt" x="175" y="258" text-anchor="middle">B0</text><text class="small" x="175" y="284" text-anchor="middle">SOC 62%</text></g>
  <g opacity="0.28"><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/><rect class="boxb" x="230" y="230" width="90" height="78" rx="6"/><text class="txt" x="275" y="258" text-anchor="middle">B1–2</text><text class="small" x="275" y="284" text-anchor="middle">15.0 A</text></g>
  <g opacity="0.28"><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/><rect class="boxb" x="340" y="230" width="90" height="78" rx="6"/><text class="txt" x="385" y="258" text-anchor="middle">B3–4</text><text class="small" x="385" y="284" text-anchor="middle">400.0 V</text></g>
  <g opacity="0.28"><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/><rect class="boxb" x="460" y="230" width="90" height="78" rx="6"/><text class="txt" x="505" y="258" text-anchor="middle">B5</text><text class="small" x="505" y="284" text-anchor="middle">35 °C</text></g>
  <g opacity="0.28"><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/><rect class="boxb" x="560" y="230" width="90" height="78" rx="6"/><text class="txt" x="605" y="258" text-anchor="middle">B6</text><text class="small" x="605" y="284" text-anchor="middle">故障 0</text></g>
  <g opacity="0.28"><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/><rect class="boxb" x="660" y="230" width="90" height="78" rx="6"/><text class="txt" x="705" y="258" text-anchor="middle">B7</text><text class="small" x="705" y="284" text-anchor="middle">计数 7</text></g>
  <circle class="doty" cy="318" r="7">
    <animate attributeName="cx" values="85;175;275;385;705;85" keyTimes="0;0.25;0.5;0.75;0.96;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <text class="gold" x="40" y="350">仲裁只看标识符。载荷对不对，要等这一帧自己的 CRC。</text>
  <text class="small" x="40" y="374">把 0x180、0.1 A、0.1 V 写进产品之前，先打开那份 DBC。</text>
  <text class="small" x="24" y="446">这一帧是教学示意，不是 Daly、宁德、GB/T 27930 或任何厂商的报文定义。</text>

</svg>
