<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 590" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>栅极回流：近环示意 10 μs 把 500 A 降到 0，远环示意 200 μs。累计 I²t 来自线性下降的积分。</title>
  <desc>金点沿远环电流走，红点相位提前半圈。底栏同时读出近环和远环在这一刻的电流和累计 I²t。示意，不是驱动器手册波形。</desc>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; }
    .linek { stroke: #57606a; stroke-width: 2.2; fill: none; stroke-dasharray: 7 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .dotg { fill: #1a7f37; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .linek { stroke: #8b949e; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .dotg { fill: #3fb950; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
    }
  </style>
  <!-- formula: i=500*max(0,1-t/tf); tf=10us or 200us; I2t=I^2*(t-t^2/tf+t^3/(3 tf^2)) until tf -->
  <rect class="bg" width="800" height="590"/>
  <text class="title" x="24" y="32">环路绕远，500 A 落得更慢（示意）</text>
  <rect class="panel" x="24" y="44" width="752" height="124" rx="6"/>
  <text class="txt" x="40" y="68" opacity="0.28">① 近环<tspan class="small">　示意 10 μs 线性落到 0。关断还在硬件窗口里。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="92" opacity="0.28">② 远环<tspan class="small">　示意 200 μs 才落完。10 μs 时电流几乎还在。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="116" opacity="0.28">③ 累计<tspan class="small">　I²t 按电流平方对时间积分。落得慢，积得多。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="140" opacity="0.28">④ 口诀<tspan class="small">　栅极电流从哪出去，就从源极旁边回来。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="180" width="752" height="268" rx="6"/>
  <text class="small" x="40" y="202">电流 A（示意线性下降）</text>
  <text class="hi" x="200" y="218">蓝 近环</text>
  <text class="warn" x="320" y="218">红 远环</text>
  <line class="axis" x1="108.0" y1="248.0" x2="108.0" y2="400.0"/>
  <line class="axis" x1="108.0" y1="400.0" x2="720.0" y2="400.0"/>
  <line class="grid" x1="108.0" y1="400.0" x2="108.0" y2="406.0"/>
  <text class="small" x="108.0" y="422.0" text-anchor="middle">0</text>
  <line class="grid" x1="261.0" y1="400.0" x2="261.0" y2="406.0"/>
  <text class="small" x="261.0" y="422.0" text-anchor="middle">10</text>
  <line class="grid" x1="720.0" y1="400.0" x2="720.0" y2="406.0"/>
  <text class="small" x="720.0" y="422.0" text-anchor="middle">40</text>
  <line class="grid" x1="102.0" y1="400.0" x2="108.0" y2="400.0"/>
  <text class="small" x="98.0" y="404.0" text-anchor="end">0</text>
  <line class="grid" x1="102.0" y1="324.0" x2="108.0" y2="324.0"/>
  <text class="small" x="98.0" y="328.0" text-anchor="end">250</text>
  <line class="grid" x1="102.0" y1="248.0" x2="108.0" y2="248.0"/>
  <text class="small" x="98.0" y="252.0" text-anchor="end">500</text>
  <text class="small" x="720" y="444" text-anchor="end">时间 μs</text>
  <polyline class="lineb" points="108.0,248.0 115.7,255.6 123.3,263.2 130.9,270.8 138.6,278.4 146.2,286.0 153.9,293.6 161.6,301.2 169.2,308.8 176.9,316.4 184.5,324.0 192.2,331.6 199.8,339.2 207.4,346.8 215.1,354.4 222.8,362.0 230.4,369.6 238.1,377.2 245.7,384.8 253.4,392.4 261.0,400.0 268.6,400.0 276.3,400.0 284.0,400.0 291.6,400.0 299.2,400.0 306.9,400.0 314.6,400.0 322.2,400.0 329.9,400.0 337.5,400.0 345.2,400.0 352.8,400.0 360.4,400.0 368.1,400.0 375.8,400.0 383.4,400.0 391.1,400.0 398.7,400.0 406.4,400.0 414.0,400.0 421.7,400.0 429.3,400.0 437.0,400.0 444.6,400.0 452.3,400.0 459.9,400.0 467.6,400.0 475.2,400.0 482.9,400.0 490.5,400.0 498.2,400.0 505.8,400.0 513.5,400.0 521.1,400.0 528.8,400.0 536.4,400.0 544.0,400.0 551.7,400.0 559.4,400.0 567.0,400.0 574.7,400.0 582.3,400.0 590.0,400.0 597.6,400.0 605.2,400.0 612.9,400.0 620.6,400.0 628.2,400.0 635.9,400.0 643.5,400.0 651.2,400.0 658.8,400.0 666.5,400.0 674.1,400.0 681.8,400.0 689.4,400.0 697.1,400.0 704.7,400.0 712.4,400.0 720.0,400.0" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline class="liner" points="108.0,248.0 115.7,248.4 123.3,248.8 130.9,249.1 138.6,249.5 146.2,249.9 153.9,250.3 161.6,250.7 169.2,251.0 176.9,251.4 184.5,251.8 192.2,252.2 199.8,252.6 207.4,252.9 215.1,253.3 222.8,253.7 230.4,254.1 238.1,254.5 245.7,254.8 253.4,255.2 261.0,255.6 268.6,256.0 276.3,256.4 284.0,256.7 291.6,257.1 299.2,257.5 306.9,257.9 314.6,258.3 322.2,258.6 329.9,259.0 337.5,259.4 345.2,259.8 352.8,260.2 360.4,260.5 368.1,260.9 375.8,261.3 383.4,261.7 391.1,262.1 398.7,262.4 406.4,262.8 414.0,263.2 421.7,263.6 429.3,264.0 437.0,264.3 444.6,264.7 452.3,265.1 459.9,265.5 467.6,265.9 475.2,266.2 482.9,266.6 490.5,267.0 498.2,267.4 505.8,267.8 513.5,268.1 521.1,268.5 528.8,268.9 536.4,269.3 544.0,269.7 551.7,270.0 559.4,270.4 567.0,270.8 574.7,271.2 582.3,271.6 590.0,271.9 597.6,272.3 605.2,272.7 612.9,273.1 620.6,273.5 628.2,273.8 635.9,274.2 643.5,274.6 651.2,275.0 658.8,275.4 666.5,275.7 674.1,276.1 681.8,276.5 689.4,276.9 697.1,277.3 704.7,277.6 712.4,278.0 720.0,278.4" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="doty" r="6" cx="108.0" cy="248.0"><animate attributeName="cx" values="108.0;184.5;261.0;720.0;720.0" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="248.0;251.8;255.6;278.4;278.4" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite"/></circle>
  <circle class="dotr" r="4" cx="108.0" cy="248.0"><animate attributeName="cx" values="108.0;184.5;261.0;720.0;720.0" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite" begin="-6s"/><animate attributeName="cy" values="248.0;251.8;255.6;278.4;278.4" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite" begin="-6s"/></circle>
  <rect class="panel" x="24" y="460" width="752" height="68" rx="6"/>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="1">t=0 μs  近环 500 A / 0.00 A²s  远环 500 A / 0.00 A²s<animate attributeName="opacity" values="1;0;0;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0">t=5 μs  近环 250 A / 0.73 A²s  远环 488 A / 1.22 A²s<animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0">t=10 μs  近环 0 A / 0.83 A²s  远环 475 A / 2.38 A²s<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0">t=40 μs  近环 0 A / 0.83 A²s  远环 400 A / 8.13 A²s<animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="24" y="560">10 μs 和 200 μs 是两条示意落点，不是从板图里抽出的电感。矩形时窗仍看 I²t 那张。</text>

</svg>
