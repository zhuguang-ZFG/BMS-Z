  <text x="80" y="210" font-size="14" class="txt">第 1 串读数 3.700 V</text>
  <text x="420" y="210" font-size="14" class="txt">第 16 串读数 3.650 V</text>
  <text x="80" y="250" font-size="13" class="small">扫描期间电流涨了 50 A</text>
  <text x="420" y="250" font-size="13" class="small">1 mΩ × 50 A = 50 mV</text>
  <rect x="80" y="280" width="20" height="40" class="fill-b">
    <animate attributeName="height" values="8;40;8" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite" />
    <animate attributeName="y" values="312;280;312" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite" />
  </rect>
  <text x="120" y="308" font-size="13" class="txt">电流在这一圈里变化（示例）</text>
  <text x="400" y="370" text-anchor="middle" font-size="14" class="warn">把 16 个数当成同一瞬间，就会对着这 50 mV 去均衡。</text>
  <text x="400" y="410" text-anchor="middle" font-size="13" class="small">50 A、1 mΩ、100 μs 都是数量级示例。</text>

<rect class="panel" x="24" y="468" width="752" height="164" rx="6" /><text class="txt" x="40" y="484">底栏：扫描这一圈电流从 0 涨到 50 A。ΔV = I × 1 mΩ。示意。</text><text class="small" x="120" y="512">电流 A</text><line class="axis" x1="108.0" y1="496.0" x2="108.0" y2="600.0" /><line class="axis" x1="108.0" y1="600.0" x2="460.0" y2="600.0" /><line class="grid" x1="108.0" y1="600.0" x2="108.0" y2="606.0" /><text class="small" x="108.0" y="622.0" text-anchor="middle">0</text><line class="grid" x1="284.0" y1="600.0" x2="284.0" y2="606.0" /><text class="small" x="284.0" y="622.0" text-anchor="middle">0.8</text><line class="grid" x1="460.0" y1="600.0" x2="460.0" y2="606.0" /><text class="small" x="460.0" y="622.0" text-anchor="middle">1.6</text><line class="grid" x1="102.0" y1="600.0" x2="108.0" y2="600.0" /><text class="small" x="98.0" y="604.0" text-anchor="end">0</text><line class="grid" x1="102.0" y1="548.0" x2="108.0" y2="548.0" /><text class="small" x="98.0" y="552.0" text-anchor="end">25</text><line class="grid" x1="102.0" y1="496.0" x2="108.0" y2="496.0" /><text class="small" x="98.0" y="500.0" text-anchor="end">50</text><polyline class="lineb" points="108.0,600.0 130.0,593.5 152.0,587.0 174.0,580.5 196.0,574.0 218.0,567.5 240.0,561.0 262.0,554.5 284.0,548.0 306.0,541.5 328.0,535.0 350.0,528.5 372.0,522.0 394.0,515.5 416.0,509.0 438.0,502.5 460.0,496.0" /><circle class="fill-y" r="5"><animate attributeName="cx" values="108.0;152.0;196.0;240.0;284.0;328.0;372.0;416.0;460.0" keyTimes="0.0000;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1.0000" dur="8s" repeatCount="indefinite" /><animate attributeName="cy" values="600.0;587.0;574.0;561.0;548.0;535.0;522.0;509.0;496.0" keyTimes="0.0000;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1.0000" dur="8s" repeatCount="indefinite" /></circle><text class="small" x="483.2" y="622.0" text-anchor="start">时间 ms</text><text class="small" x="480" y="532.0">1.6 ms 末：50 A × 1 mΩ = 50 mV</text></svg>