<path d="M340 310 L340 348 L322 348 L322 375 L345 375" fill="none" stroke="#14213d" stroke-width="1.8"/>
<text x="348" y="326" font-family="'Book Mono',monospace" font-size="11" fill="#14213d">Q̅</text>
<line x1="345" y1="362" x2="345" y2="392" stroke="#14213d" stroke-width="2.5"/>
<line x1="345" y1="370" x2="368" y2="352" stroke="#14213d" stroke-width="1.8"/>
<line x1="345" y1="384" x2="366" y2="400" stroke="#14213d" stroke-width="1.8"/>
<path d="M366 400 L357 396 L360 405 z" fill="#14213d"/>
<line x1="366" y1="400" x2="366" y2="412" stroke="#14213d" stroke-width="1.8"/>
<g stroke="#14213d" stroke-width="2">
<line x1="354" y1="412" x2="378" y2="412"/>
<line x1="358" y1="418" x2="374" y2="418"/>
<line x1="362" y1="424" x2="370" y2="424"/>
</g>
<text x="288" y="446" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="10.5" fill="#52606d">放电管（NPN）</text>

<!-- pin 7 wire -->
<path d="M132 440 V462 H368 V356" fill="none" stroke="#14213d" stroke-width="1.8"/>

<!-- external RC chain -->
<circle cx="70" cy="168" r="3" fill="#14213d"/>
<line x1="70" y1="168" x2="70" y2="440" stroke="#14213d" stroke-width="1.8"/>
<rect x="70" y="428" width="50" height="24" fill="#fffdf8" stroke="#14213d" stroke-width="1.8"/>
<text x="72" y="422" font-family="'Book Mono',monospace" font-size="10.5" fill="#14213d">R1 1k</text>
<line x1="120" y1="440" x2="140" y2="440" stroke="#14213d" stroke-width="1.8"/>
<circle cx="132" cy="440" r="4" fill="#14213d"/>
