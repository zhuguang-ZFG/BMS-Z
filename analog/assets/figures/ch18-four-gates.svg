<text x="150" y="284" text-anchor="middle" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="14" font-weight="700" fill="#ffffff">① 原理图评审</text>
<rect x="295" y="272" width="10" height="120" fill="#14213d"/>
