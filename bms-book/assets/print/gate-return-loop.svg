<svg data-sketch="1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 590" role="img" font-family="ui-monospace, Consolas, monospace" data-snapshot-time="9">
  <title>栅极回流：近环示意 10 μs 把 500 A 降到 0，远环示意 200 μs。累计 I²t 来自线性下降的积分。</title>
  <desc>金点沿远环电流走。底栏同时读出近环和远环在这一刻的电流和累计 I²t。示意，不是驱动器手册波形。</desc>
