- id: ch10-555-threshold-clamp
  source: docs/p1-11-ch10.md#10.1
  before: '1. 电容经 R1+R2 充电，电压升到 **2/3 Vcc** → 比较器 A 翻转 → 触发器复位 → OUT=低，放电管导通

    2. 电容经 R2 对地放电，降到 **1/3 Vcc** → 比较器 B 翻转 → 触发器置位 → OUT=高，放电管截止

    3. 无限循环 → 输出方波'
  after: 标准无稳态把 TRIG 与 THRES 接到同一电容。电容从下阈向上走时输出高、放电开关截止；跨上阈后输出低、放电开关导通；降过下阈再置位。由两个分离门限与状态记忆形成回环，不能泛称它比所有外加迟滞都更准。双稳态的两输入分开后，外部命令也可能互相冲突，仍须按优先级设计。
  caption: 555 内部状态路径。按图内条件回代，示意不作器件保证。
  removed_prose_chars: -19
