<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 590" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>主动放电示意：接触器断开后 200 Ω 把 400 V、1 mF 的母线拉向 60 V。闸还合着时电阻按 800 W 持续吃功率。</title>
  <desc>蓝线是 e 指数，红线停在包压。金点沿蓝线走，底栏读出功率和电容里还剩的焦耳。示意，不是示波器。</desc>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; }
    .linek { stroke: #57606a; stroke-width: 2.2; fill: none; stroke-dasharray: 7 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .dotg { fill: #1a7f37; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    .boxy { fill: #fff8c5; stroke: #d4a72c; }
    .boxr { fill: #ffebe9; stroke: #ff8182; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .linek { stroke: #8b949e; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .dotg { fill: #3fb950; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
      .boxy { fill: #3d2e00; stroke: #d29922; }
      .boxr { fill: #3d1418; stroke: #f85149; }
    }
  </style>
  <!-- formula: tau=0.2 s; V=400*exp(-t/tau); t60=-tau*ln(60/400); P=V^2/200; E=0.5*C*V^2 -->
  <rect class="bg" width="800" height="590"/>
  <text class="title" x="24" y="32">先确认触点已开，200 Ω 才拉得动母线（示意）</text>
  <rect class="panel" x="24" y="44" width="752" height="124" rx="6"/>
  <text class="txt" x="40" y="68" opacity="0.28">① 触点已经分开<tspan class="small">　τ=RC=0.2 s。电压按 400·e^(−t/0.2) 往下掉。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="92" opacity="0.28">② 到 60 V<tspan class="small">　大约 0.38 s。电容里还剩约 1.8 J。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="116" opacity="0.28">③ 闸还合着<tspan class="small">　母线停在 400 V，200 Ω 按 800 W 一直吃。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="140" opacity="0.28">④ 口诀<tspan class="small">　电阻在电容那一侧，而且要等接触器先断开。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="180" width="752" height="268" rx="6"/>
  <text class="small" x="40" y="202">母线电压 V（示意）</text>
  <text class="hi" x="200" y="218">蓝 触点已开</text>
  <text class="warn" x="360" y="218">红 闸还合着</text>
  <text class="gold" x="530" y="218">金虚线 60 V</text>
  <line class="axis" x1="108.0" y1="248.0" x2="108.0" y2="400.0"/>
  <line class="axis" x1="108.0" y1="400.0" x2="720.0" y2="400.0"/>
  <line class="grid" x1="108.0" y1="400.0" x2="108.0" y2="406.0"/>
  <text class="small" x="108.0" y="422.0" text-anchor="middle">0</text>
  <line class="grid" x1="340.6" y1="400.0" x2="340.6" y2="406.0"/>
  <text class="small" x="340.6" y="422.0" text-anchor="middle">0.38</text>
  <line class="grid" x1="720.0" y1="400.0" x2="720.0" y2="406.0"/>
  <text class="small" x="720.0" y="422.0" text-anchor="middle">1</text>
  <line class="grid" x1="102.0" y1="378.3" x2="108.0" y2="378.3"/>
  <text class="small" x="98.0" y="382.3" text-anchor="end">60</text>
  <line class="grid" x1="102.0" y1="255.2" x2="108.0" y2="255.2"/>
  <text class="small" x="98.0" y="259.2" text-anchor="end">400</text>
  <text class="small" x="720" y="444" text-anchor="end">时间 s</text>
  <polyline class="lineb" points="108.0,255.2 115.7,264.0 123.3,272.2 130.9,280.0 138.6,287.3 146.2,294.1 153.9,300.5 161.6,306.5 169.2,312.2 176.9,317.5 184.5,322.5 192.2,327.2 199.8,331.6 207.4,335.8 215.1,339.7 222.8,343.3 230.4,346.7 238.1,350.0 245.7,353.0 253.4,355.9 261.0,358.5 268.6,361.0 276.3,363.4 284.0,365.6 291.6,367.7 299.2,369.7 306.9,371.5 314.6,373.2 322.2,374.8 329.9,376.4 337.5,377.8 345.1,379.1 352.8,380.4 360.5,381.6 368.1,382.7 375.8,383.8 383.4,384.7 391.1,385.7 398.7,386.5 406.4,387.4 414.0,388.1 421.7,388.8 429.3,389.5 436.9,390.1 444.6,390.7 452.2,391.3 459.9,391.8 467.6,392.3 475.2,392.8 482.9,393.2 490.5,393.6 498.2,394.0 505.8,394.4 513.5,394.7 521.1,395.0 528.8,395.3 536.4,395.6 544.0,395.9 551.7,396.1 559.4,396.4 567.0,396.6 574.7,396.8 582.3,397.0 590.0,397.2 597.6,397.3 605.2,397.5 612.9,397.7 620.6,397.8 628.2,397.9 635.9,398.1 643.5,398.2 651.2,398.3 658.8,398.4 666.5,398.5 674.1,398.6 681.8,398.7 689.4,398.7 697.1,398.8 704.7,398.9 712.4,399.0 720.0,399.0" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline class="liner" points="108.0,255.2 115.7,255.2 123.3,255.2 130.9,255.2 138.6,255.2 146.2,255.2 153.9,255.2 161.6,255.2 169.2,255.2 176.9,255.2 184.5,255.2 192.2,255.2 199.8,255.2 207.4,255.2 215.1,255.2 222.8,255.2 230.4,255.2 238.1,255.2 245.7,255.2 253.4,255.2 261.0,255.2 268.6,255.2 276.3,255.2 284.0,255.2 291.6,255.2 299.2,255.2 306.9,255.2 314.6,255.2 322.2,255.2 329.9,255.2 337.5,255.2 345.1,255.2 352.8,255.2 360.5,255.2 368.1,255.2 375.8,255.2 383.4,255.2 391.1,255.2 398.7,255.2 406.4,255.2 414.0,255.2 421.7,255.2 429.3,255.2 436.9,255.2 444.6,255.2 452.2,255.2 459.9,255.2 467.6,255.2 475.2,255.2 482.9,255.2 490.5,255.2 498.2,255.2 505.8,255.2 513.5,255.2 521.1,255.2 528.8,255.2 536.4,255.2 544.0,255.2 551.7,255.2 559.4,255.2 567.0,255.2 574.7,255.2 582.3,255.2 590.0,255.2 597.6,255.2 605.2,255.2 612.9,255.2 620.6,255.2 628.2,255.2 635.9,255.2 643.5,255.2 651.2,255.2 658.8,255.2 666.5,255.2 674.1,255.2 681.8,255.2 689.4,255.2 697.1,255.2 704.7,255.2 712.4,255.2 720.0,255.2" stroke-linejoin="round" stroke-linecap="round"/>
  <line class="liney" x1="108" y1="378.3" x2="720" y2="378.3" stroke-dasharray="6 4"/>
  <circle class="doty" r="6" cx="108.0" cy="255.2"><animate attributeName="cx" values="108.0;340.2;475.2;720.0;720.0" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="255.2;378.3;392.8;399.0;399.0" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite"/></circle>
  <circle class="dotr" r="4" cx="108.0" cy="255.2"><animate attributeName="cx" values="108.0;340.2;475.2;720.0;720.0" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite" begin="-6s"/><animate attributeName="cy" values="255.2;378.3;392.8;399.0;399.0" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite" begin="-6s"/></circle>
  <rect class="panel" x="24" y="460" width="752" height="68" rx="6"/>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="1">t = 0.00 s · 已开母线 400 V · 电容剩余 80.0 J · 仍合 400 V / 800 W（示意）<animate attributeName="opacity" values="1;0;0;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0">t = 0.38 s · 已开母线 60 V · 电容剩余 1.8 J · 仍合 400 V / 800 W（示意）<animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0">t = 0.60 s · 已开母线 20 V · 电容剩余 0.2 J · 仍合 400 V / 800 W（示意）<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0">t = 1.00 s · 已开母线 3 V · 电容剩余 0.0 J · 仍合 400 V / 800 W（示意）<animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="24" y="560">400 V、1 mF、200 Ω、60 V、80 J 是详解④的同一笔示例。放电没完成之前不要碰母线。</text>

</svg>
