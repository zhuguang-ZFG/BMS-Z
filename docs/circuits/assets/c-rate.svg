<svg xmlns="http://www.w3.org/2000/svg" width="800" height="796" viewBox="0 -156 800 796" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>C 倍率与充放电流动画</title>
  <desc>三种龙头开度对应 0.5C、1C、2C：水柱按 10 Ah 的电池给到 5 A、10 A、20 A，底栏直线 I=20 Ah×C 随倍率抬高。</desc><style>
