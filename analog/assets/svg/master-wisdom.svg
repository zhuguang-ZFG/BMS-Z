<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">大师的排故智慧：三份心法，一条军规</text>

<text x="400" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#37424e">金句逐条读，粒子替你走流程——军规清单在底部</text>
<rect x="35" y="100" width="230" height="210" rx="12" fill="#f6eedb" stroke="#1f5d7a" stroke-width="2.5"/><text x="150" y="126" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1f5d7a">Bob Pease · 老中医</text><path d="M49 138 Q150.00 138.02 251 138" fill="none" stroke="#1f5d7a" stroke-width="1.5" opacity="0.4"/><circle cx="55" cy="161" r="3.5" fill="#1f5d7a"/><text x="69" y="166" font-size="11.5" fill="#37424e">先量电源——近一半故障藏在这里</text><circle cx="55" cy="199" r="3.5" fill="#1f5d7a"/><text x="69" y="204" font-size="11.5" fill="#37424e">怀疑一切，包括你的仪器</text><circle cx="55" cy="237" r="3.5" fill="#1f5d7a"/><text x="69" y="242" font-size="11.5" fill="#37424e">数字表测不出振荡 → 示波器复核</text><circle cx="55" cy="275" r="3.5" fill="#1f5d7a"/><text x="69" y="280" font-size="11.5" fill="#37424e">记录一切：症状-假设-结果存档</text><g filter="url(#pglow)"><circle r="5" fill="#1f5d7a"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M150,110 V295" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle>
<circle r="5" fill="#1f5d7a"><animateMotion dur="12s" begin="5.50s" repeatCount="indefinite" path="M150,110 V295" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle></g><rect x="285" y="100" width="230" height="210" rx="12" fill="#f6eedb" stroke="#a8321f" stroke-width="2.5"/><text x="400" y="126" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#a8321f">Jim Williams · 手术刀</text><path d="M299 138 Q400.00 138.13 501 138" fill="none" stroke="#a8321f" stroke-width="1.5" opacity="0.4"/><circle cx="305" cy="161" r="3.5" fill="#a8321f"/><text x="319" y="166" font-size="11.5" fill="#37424e">先想透，再动手</text><circle cx="305" cy="199" r="3.5" fill="#a8321f"/><text x="319" y="204" font-size="11.5" fill="#37424e">测量前先在脑子里预测波形</text><circle cx="305" cy="237" r="3.5" fill="#a8321f"/><text x="319" y="242" font-size="11.5" fill="#37424e">测量链不能改变被测对象</text><circle cx="305" cy="275" r="3.5" fill="#a8321f"/><text x="319" y="280" font-size="11.5" fill="#37424e">把故障做小：最小可复现电路</text><g filter="url(#pglow)"><circle r="5" fill="#a8321f"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M400,110 V295" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle>
<circle r="5" fill="#a8321f"><animateMotion dur="12s" begin="5.50s" repeatCount="indefinite" path="M400,110 V295" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle></g><rect x="535" y="100" width="230" height="210" rx="12" fill="#f6eedb" stroke="#6b3f63" stroke-width="2.5"/><text x="650" y="126" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#6b3f63">共通心法</text><path d="M549 138 Q650.00 137.94 751 138" fill="none" stroke="#6b3f63" stroke-width="1.5" opacity="0.4"/><circle cx="555" cy="161" r="3.5" fill="#6b3f63"/><text x="569" y="166" font-size="11.5" fill="#37424e">慢观察</text><circle cx="555" cy="199" r="3.5" fill="#6b3f63"/><text x="569" y="204" font-size="11.5" fill="#37424e">快假设</text><circle cx="555" cy="237" r="3.5" fill="#6b3f63"/><text x="569" y="242" font-size="11.5" fill="#37424e">严验证</text><circle cx="555" cy="275" r="3.5" fill="#6b3f63"/><text x="569" y="280" font-size="11.5" fill="#37424e">电路永远是对的，错的是你的模型</text><g filter="url(#pglow)"><circle r="5" fill="#6b3f63"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M650,110 V295" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle>
<circle r="5" fill="#6b3f63"><animateMotion dur="12s" begin="5.50s" repeatCount="indefinite" path="M650,110 V295" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle></g><rect x="60" y="345" width="150" height="44" rx="9" fill="#f6eedb" stroke="#a4630f" stroke-width="2"/><text x="135" y="372" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a4630f">先量电源</text><path d="M210 367 Q219.00 367.07 228 367" fill="none" stroke="#37424e" stroke-width="2"/><polygon points="230,367 219,361 219,373" fill="#37424e"/><rect x="230" y="345" width="150" height="44" rx="9" fill="#f6eedb" stroke="#a4630f" stroke-width="2"/><text x="305" y="372" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a4630f">预测波形再测量</text><path d="M380 367 Q389.00 367.06 398 367" fill="none" stroke="#37424e" stroke-width="2"/><polygon points="400,367 389,361 389,373" fill="#37424e"/><rect x="400" y="345" width="150" height="44" rx="9" fill="#f6eedb" stroke="#a4630f" stroke-width="2"/><text x="475" y="372" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a4630f">最小化复现</text><path d="M550 367 Q559.00 367.06 568 367" fill="none" stroke="#37424e" stroke-width="2"/><polygon points="570,367 559,361 559,373" fill="#37424e"/><rect x="570" y="345" width="150" height="44" rx="9" fill="#f6eedb" stroke="#a4630f" stroke-width="2"/><text x="645" y="372" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a4630f">示波器复核</text><g filter="url(#pglow)"><circle r="5" fill="#a4630f"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M68,367 H712" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle>
<circle r="5" fill="#a4630f"><animateMotion dur="12s" begin="5.50s" repeatCount="indefinite" path="M68,367 H712" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle></g>
<text x="400" y="478" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#37424e">排故不是体力活，是科学方法——观察 → 假设 → 实验 → 结论，一次循环逼近真相</text>
