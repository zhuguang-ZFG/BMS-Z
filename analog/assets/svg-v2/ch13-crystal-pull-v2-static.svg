<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">大步长负载偏移要直接算两个谐振频率</title>
<desc id="figDesc">示意无损晶体：Cm=10 fF、C0=1.5 pF，以 CL=12 pF 频率作基准。</desc>
<metadata id="visual-timeline">{&quot;duration&quot;: 12, &quot;beats&quot;: [{&quot;name&quot;: &quot;条件&quot;, &quot;start&quot;: 0, &quot;end&quot;: 3, &quot;caption&quot;: &quot;参考负载处相对频偏为零。&quot;}, {&quot;name&quot;: &quot;变化&quot;, &quot;start&quot;: 3, &quot;end&quot;: 6, &quot;caption&quot;: &quot;增加负载电容使并联谐振频率降低。&quot;}, {&quot;name&quot;: &quot;比较&quot;, &quot;start&quot;: 6, &quot;end&quot;: 9, &quot;caption&quot;: &quot;牵引斜率随负载变化，不能用终点斜率乘整个步长。&quot;}, {&quot;name&quot;: &quot;结论&quot;, &quot;start&quot;: 9, &quot;end&quot;: 12, &quot;caption&quot;: &quot;十五皮法约慢六十七点三 ppm，即每天约慢五点八一秒。&quot;}]}</metadata>
