<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="ui-monospace, Consolas, monospace">
  <title>OCV 滞回：同一 SOC 充电支高 20 mV、放电支低 20 mV。平台上 40 mV 能换成几十个百分点。数字为示意。</title>
  <desc>平均支加恒定滞回项。游标走到不同荷电时，读出两支电压、斜率和缝换算的荷电差。示意，不是实测。</desc>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #bf8700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; }
    .linek { stroke: #57606a; stroke-width: 2.2; fill: none; stroke-dasharray: 7 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .linek { stroke: #8b949e; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
    }
  </style>
  <!-- formula: V=OCV_mean(s)±0.020; OCV_mean anchors 3.300 V at s=0.5; plateau slope 0.075 V per unit SOC -->
  <rect class="bg" width="800" height="560"/>
  <text class="title" x="24" y="32">同一个荷电，充电电压更高（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="128" rx="6"/>
  <text class="txt" x="40" y="72" opacity="0.28">① 先看缝<tspan class="small">　充电支 = 平均支 + 20 mV，放电支 = 平均支 − 20 mV。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="98" opacity="0.28">② 走到 0.50<tspan class="small">　充 3.320 V，放 3.280 V。缝还是 40 mV。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="124" opacity="0.28">③ 平台上<tspan class="small">　斜率大约 0.75 mV/1%。40 mV 能换五十多个百分点。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="150" opacity="0.28">④ 两端变陡<tspan class="small">　同样 40 mV，换到的荷电少很多。口诀：充高放低，静置抹不平。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="188" width="752" height="280" rx="6"/>
  <text class="small" x="40" y="210">电压 V（示意）</text>
  <line class="axis" x1="108.0" y1="228.0" x2="108.0" y2="430.0"/>
  <line class="axis" x1="108.0" y1="430.0" x2="520.0" y2="430.0"/>
  <text class="small" x="520.0" y="468" text-anchor="end">荷电 SOC</text>
  <line class="grid" x1="179.7" y1="430.0" x2="179.7" y2="436.0"/>
  <text class="small" x="179.7" y="452.0" text-anchor="middle">0.2</text>
  <line class="grid" x1="314.0" y1="430.0" x2="314.0" y2="436.0"/>
  <text class="small" x="314.0" y="452.0" text-anchor="middle">0.5</text>
  <line class="grid" x1="448.3" y1="430.0" x2="448.3" y2="436.0"/>
  <text class="small" x="448.3" y="452.0" text-anchor="middle">0.8</text>
  <line class="grid" x1="102.0" y1="369.4" x2="108.0" y2="369.4"/>
  <text class="small" x="98.0" y="373.4" text-anchor="end">3.20</text>
  <line class="grid" x1="102.0" y1="329.0" x2="108.0" y2="329.0"/>
  <text class="small" x="98.0" y="333.0" text-anchor="end">3.30</text>
  <line class="grid" x1="102.0" y1="288.6" x2="108.0" y2="288.6"/>
  <text class="small" x="98.0" y="292.6" text-anchor="end">3.40</text>
  <polyline class="liner" points="108.0,398.3 112.6,393.2 117.3,386.3 121.9,378.0 126.5,368.8 131.1,359.7 135.8,351.7 140.4,345.4 145.0,340.7 149.7,337.3 154.3,335.0 158.9,333.5 163.6,332.4 168.2,331.6 172.8,330.9 177.4,330.4 182.1,330.0 186.7,329.6 191.3,329.3 196.0,328.9 200.6,328.6 205.2,328.3 209.8,328.0 214.5,327.7 219.1,327.3 223.7,327.0 228.4,326.7 233.0,326.4 237.6,326.1 242.2,325.8 246.9,325.5 251.5,325.1 256.1,324.8 260.8,324.5 265.4,324.2 270.0,323.9 274.7,323.6 279.3,323.3 283.9,323.0 288.5,322.6 293.2,322.3 297.8,322.0 302.4,321.7 307.1,321.4 311.7,321.1 316.3,320.8 320.9,320.5 325.6,320.1 330.2,319.8 334.8,319.5 339.5,319.2 344.1,318.9 348.7,318.6 353.3,318.3 358.0,317.9 362.6,317.6 367.2,317.3 371.9,317.0 376.5,316.7 381.1,316.4 385.8,316.1 390.4,315.8 395.0,315.4 399.6,315.1 404.3,314.8 408.9,314.5 413.5,314.2 418.2,313.9 422.8,313.5 427.4,313.2 432.0,312.9 436.7,312.5 441.3,312.1 445.9,311.7 450.6,311.3 455.2,310.8 459.8,310.2 464.4,309.5 469.1,308.5 473.7,307.3 478.3,305.6 483.0,303.4 487.6,300.4 492.2,296.6 496.9,291.8 501.5,286.3 506.1,280.2 510.7,274.1 515.4,268.4 520.0,263.5" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline class="lineb" points="108.0,414.4 112.6,409.3 117.3,402.5 121.9,394.2 126.5,384.9 131.1,375.9 135.8,367.9 140.4,361.5 145.0,356.8 149.7,353.5 154.3,351.2 158.9,349.6 163.6,348.5 168.2,347.7 172.8,347.1 177.4,346.6 182.1,346.2 186.7,345.8 191.3,345.4 196.0,345.1 200.6,344.8 205.2,344.5 209.8,344.1 214.5,343.8 219.1,343.5 223.7,343.2 228.4,342.9 233.0,342.6 237.6,342.2 242.2,341.9 246.9,341.6 251.5,341.3 256.1,341.0 260.8,340.7 265.4,340.4 270.0,340.1 274.7,339.7 279.3,339.4 283.9,339.1 288.5,338.8 293.2,338.5 297.8,338.2 302.4,337.9 307.1,337.5 311.7,337.2 316.3,336.9 320.9,336.6 325.6,336.3 330.2,336.0 334.8,335.7 339.5,335.4 344.1,335.0 348.7,334.7 353.3,334.4 358.0,334.1 362.6,333.8 367.2,333.5 371.9,333.2 376.5,332.9 381.1,332.5 385.8,332.2 390.4,331.9 395.0,331.6 399.6,331.3 404.3,331.0 408.9,330.6 413.5,330.3 418.2,330.0 422.8,329.7 427.4,329.4 432.0,329.0 436.7,328.7 441.3,328.3 445.9,327.9 450.6,327.5 455.2,327.0 459.8,326.4 464.4,325.6 469.1,324.7 473.7,323.4 478.3,321.8 483.0,319.5 487.6,316.6 492.2,312.7 496.9,308.0 501.5,302.4 506.1,296.4 510.7,290.3 515.4,284.6 520.0,279.7" stroke-linejoin="round" stroke-linecap="round"/>
  <text class="warn" x="400" y="250">充电支</text>
  <text class="hi" x="400" y="400">放电支</text>
  <line class="liney" y1="228.0" y2="430.0" x1="125.9" x2="125.9">
    <animate attributeName="x1" values="125.9;224.4;314.0;403.6;502.1;502.1" keyTimes="0;0.2000;0.4000;0.6000;0.8000;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="125.9;224.4;314.0;403.6;502.1;502.1" keyTimes="0;0.2000;0.4000;0.6000;0.8000;1" dur="12s" repeatCount="indefinite"/>
  </line>
  <circle class="doty" r="6" cx="125.9" cy="378.1"><animate attributeName="cx" values="125.9;224.4;314.0;403.6;502.1;502.1" keyTimes="0;0.2000;0.4000;0.6000;0.8000;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="378.1;335.1;329.0;322.9;293.6;293.6" keyTimes="0;0.2000;0.4000;0.6000;0.8000;1" dur="12s" repeatCount="indefinite"/></circle>
  <rect class="panel" x="24" y="480" width="752" height="64" rx="6"/>
  <text class="small" x="40.0" y="518.0" text-anchor="start" opacity="1">s=0.08  充 3.198 V  放 3.158 V  40 mV / 22.35 mV每1% → 1.8 个百分点<animate attributeName="opacity" values="1;0;0;0;0;0" keyTimes="0;0.2000;0.4000;0.6000;0.8000;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="518.0" text-anchor="start" opacity="0">s=0.30  充 3.305 V  放 3.265 V  40 mV / 0.75 mV每1% → 53.2 个百分点<animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.2000;0.4000;0.6000;0.8000;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="518.0" text-anchor="start" opacity="0">s=0.50  充 3.320 V  放 3.280 V  40 mV / 0.75 mV每1% → 53.3 个百分点<animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.2000;0.4000;0.6000;0.8000;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="518.0" text-anchor="start" opacity="0">s=0.70  充 3.335 V  放 3.295 V  40 mV / 0.76 mV每1% → 52.9 个百分点<animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;0.2000;0.4000;0.6000;0.8000;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="518.0" text-anchor="start" opacity="0">s=0.92  充 3.408 V  放 3.368 V  40 mV / 14.20 mV每1% → 2.8 个百分点<animate attributeName="opacity" values="0;0;0;0;1;0" keyTimes="0;0.2000;0.4000;0.6000;0.8000;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>

</svg>
