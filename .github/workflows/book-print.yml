name: book-print

# 两卷 16K 印刷分册流水线（设计 §7.4）：只产 artifact，Pages 不发布 16K。
# 卷 I 印刷装配需要先有 MkDocs 站点；卷 II 由 BMS 打印链独立装配。
on:
  push:
    branches-ignore: [main]
    paths:
      - "analog/**"
      - "bms-book/**"
      - "book/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/book-print.yml"
  pull_request:
    paths:
      - "analog/**"
      - "bms-book/**"
      - "book/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/book-print.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bms-z-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  print16k:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            analog/requirements.txt
            analog/analog-book/requirements.txt
            bms-book/requirements.txt
      - run: pip install -r analog/requirements.txt -r analog/analog-book/requirements.txt -r bms-book/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('analog/analog-book/requirements.txt') }}
      - run: python -m playwright install --with-deps chromium
      - name: 站点构建（卷 I 16K 前置）
        working-directory: analog
        run: python scripts/build_site.py --build
      - name: 16K 单元、装配与真实内容
        working-directory: analog
        run: python -B -m unittest discover -s analog-book/tests -p "test_book_*.py" -v
      - name: 16K 发布器测试
        working-directory: analog
        run: python -B -m unittest discover -s scripts -p "test_publish_book.py" -v
      - name: 安装 ngspice 与中文字体
        if: github.event_name != 'pull_request'
        run: sudo apt-get update && sudo apt-get install -y ngspice fonts-noto-cjk
      - name: SPICE 回归
        if: github.event_name != 'pull_request'
        working-directory: analog
        env:
          BOOK_REQUIRE_NGSPICE: "1"
        run: python -B -m unittest discover -s analog-book/tests -p "test_spice.py" -v
      - name: 两卷 16K 分册
        run: python book/build.py pdf --format 16k --volume all --no-build
      - name: 卷 I 16K 产物审计
        working-directory: analog
        run: python analog-book/build_print_book.py --check --no-build
      - name: 16K 样张
        if: github.event_name != 'pull_request'
        working-directory: analog
        run: python analog-book/build_print_book.py --sample
      - name: 16K 浏览器离线回归
        working-directory: analog
        run: python -B -m unittest discover -s analog-book/tests -p "test_browser_print_book.py" -v
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: book-16k-dist
          path: |
            book/dist/volume-1/book-16k-*.pdf
            book/dist/volume-2/book-16k-*.pdf
          retention-days: 14
