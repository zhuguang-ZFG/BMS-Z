<line x1="484" y1="400" x2="876" y2="400" stroke="#c9bb9d" stroke-width="1.2"/>
<line x1="620" y1="356" x2="620" y2="416" stroke="#6b3f63" stroke-width="2"/>
<text x="612" y="424" text-anchor="middle" font-size="11" fill="#6b3f63">f_sw / 2</text>
<circle cx="740" cy="400" r="5" fill="#6b3f63"/>
<text x="736" y="424" text-anchor="middle" font-size="11" fill="#5b666f">f_sw</text>
<text x="484" y="352" font-size="11.5" font-weight="bold" fill="#6b3f63">输出纹波频谱：出现半频分量</text></g></g>
<text x="502" y="666" font-size="12" font-weight="bold" fill="#6b3f63">4. 纹波半频</text>
<rect x="20" y="706" width="450" height="300" rx="10" fill="#fdf8ea" stroke="#c9bb9d" stroke-width="1.2"/>
<g data-storyboard-beat="边界指纹" transform="translate(47 720) scale(0.4129)"><rect x="56" y="92" width="380" height="120" rx="12" fill="#f6eedb" stroke="#c9bb9d" stroke-width="1.4"/>
<text x="80" y="122" font-size="12.5" font-weight="bold" fill="#37424e">占空比旋钮</text>
