<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1448 1086"><text x="72" y="92" fill="#2a2927" font-size="50" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">什么时候还需要外置 S/H</text>
<text x="74" y="146" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">ADC 的采样孔径覆盖不了的需求，才轮到分立 S/H；实测两次读数就能钉住漏流。</text>
<text x="136" y="279" fill="#a4441d" font-size="34" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#e2d9cf">一</text>
<text x="226" y="252" fill="#2a2927" font-size="36" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">三条件判定门</text>
<text x="226" y="294" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">多路复用、快于内置采样器、超长保持</text>
<text x="136" y="427" fill="#a4441d" font-size="34" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#e2d9cf">二</text>
<text x="226" y="400" fill="#2a2927" font-size="36" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">三条都否</text>
<text x="226" y="442" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">删掉分立 S/H，少一级误差</text>
<text x="136" y="575" fill="#a4441d" font-size="34" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#e2d9cf">三</text>
<text x="226" y="548" fill="#2a2927" font-size="36" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">充电电流要有出处</text>
<text x="226" y="590" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">100nF、1V、1µs 理想 100mA</text>
<text x="136" y="723" fill="#a4441d" font-size="34" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#e2d9cf">四</text>
<text x="226" y="696" fill="#2a2927" font-size="36" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">真实波形被 R_ON 限流</text>
<text x="226" y="738" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">峰值 1V/250Ω=4mA</text>
<text x="136" y="871" fill="#a4441d" font-size="34" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#e2d9cf">五</text>
<text x="226" y="844" fill="#2a2927" font-size="36" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">droop 两次读数</text>
<text x="226" y="886" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">100ms 掉 200µV → 2pA，大头在板面</text>
<path data-paper-shadow="true" transform="translate(8 12)" d="M68,988 L631.6,986 L1381,989 L1384,1030.46 L1381,1062 L565.6,1064 L64,1060 Z" fill="#535453" opacity="0.08"/><path data-paper-shadow="true" transform="translate(4 7)" d="M68,988 L631.6,986 L1381,989 L1384,1030.46 L1381,1062 L565.6,1064 L64,1060 Z" fill="#535453" opacity="0.12"/><path data-paper-shadow="true" transform="translate(2 3)" d="M68,988 L631.6,986 L1381,989 L1384,1030.46 L1381,1062 L565.6,1064 L64,1060 Z" fill="#535453" opacity="0.15"/><path d="M68,988 L631.6,986 L1381,989 L1384,1030.46 L1381,1062 L565.6,1064 L64,1060 Z" fill="#f6f2ed" stroke="#c4b9ab" stroke-width="1.4"/><path d="M70,990L1377,991" fill="none" stroke="#ffffff" stroke-width="2" opacity=".7"/>
<text x="92" y="1036" fill="#2a2927" font-size="33" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">外置 S/H 只在三个条件之一成立时出场；实测反差不只是数字，是排查结论。</text></svg>
