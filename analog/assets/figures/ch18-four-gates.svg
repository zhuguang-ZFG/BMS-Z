<text x="487" y="542" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="10.5" fill="#52606d">对应 17.6 焊接 / 17.7 上电</text>

<rect x="685" y="428" width="190" height="140" rx="6" fill="#ffffff" stroke="#b42318" stroke-width="1.5"/>
<text x="697" y="450" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" font-weight="700" fill="#b42318">拦下：温漂·偶发故障流出</text>
<text x="697" y="472" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" fill="#52606d">打勾：-20~70°C 全温一遍</text>
<text x="697" y="492" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" fill="#52606d">±10% 拉偏·老化 ≥24h</text>
<line x1="697" y1="502" x2="863" y2="502" stroke="#d0d5dd" stroke-width="1"/>
<text x="697" y="522" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11" font-weight="700" fill="#b45309">漏了 → 17.5 / 17.4</text>
<text x="697" y="542" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="10.5" fill="#52606d">对应 17.5 热 / 17.4 振荡</text>

<text x="36" y="606" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12.5" fill="#52606d">每条打勾前问一句："如果不做，17 章哪一行会中招？"——评审从走过场变成排故前置（18.4）。</text>
</svg>
