<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="ttl">
<title id="ttl">运放内部三级流水线：20 万倍增益是怎么攒出来的</title>
<desc>运放内部三级流水线：20 万倍增益是怎么攒出来的；节拍：① 输入级只认差模：共模被电流镜「踢」掉——这就是 CMRR 的出生地；② 中间级扛下几乎所有增益；Cc 把主极点压到低频——换稳定，代价是压摆率；③ 输出级 ×1 却关键：推挽跟随给低阻，过流保护藏在里面；④ 偏置镜像像自来水厂——每个 datasheet 参数都能对到具体位置</desc>
