<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 544" font-family="ui-monospace, Consolas, monospace">
  <title>教学用的残余故障率：λ 乘以 (1−覆盖率)。不是认证计算，也不是某个零件的 FIT。</title>
  <desc>教学用的残余故障率：λ 乘以 (1−覆盖率)。不是认证计算，也不是某个零件的 FIT。画面上的数字是示意，不是实测。</desc>

  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.5; fill: none; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
    }
  </style>

  <!-- formula: lambda_res=100*(1-DC) FIT -->
  <rect class="bg" width="800" height="544"/>
  <text class="title" x="24" y="32">覆盖率到 99%，残余还在（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="128" rx="6"/>
  <text class="txt" x="40" y="72" opacity="0.28">① 没有诊断<tspan class="small">　DC=0，残余就是全部 100 FIT。直线从这里出发。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="98" opacity="0.28">② 覆盖一半<tspan class="small">　还剩 50。斜率 −100 FIT：覆盖率多 0.1，残余少 10。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="124" opacity="0.28">③ 覆盖 90%<tspan class="small">　还剩 10 FIT。听起来很高，账上仍有一成。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="150" opacity="0.28">④ 覆盖 99%<tspan class="small">　还剩 1 FIT。只有 DC=1 才到 0，这张图不声称做到。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="188" width="752" height="304" rx="6"/>
  <text class="small" x="40" y="210">残余 FIT（示意）</text>
  <line class="axis" x1="108.0" y1="228.0" x2="108.0" y2="430.0"/>
  <line class="axis" x1="108.0" y1="430.0" x2="730.0" y2="430.0"/>
  <text class="small" x="730.0" y="468.0" text-anchor="end">诊断覆盖率 DC</text>
  <line class="grid" x1="108.0" y1="430.0" x2="108.0" y2="436.0"/>
  <text class="small" x="108.0" y="452.0" text-anchor="middle">0</text>
  <line class="grid" x1="404.2" y1="430.0" x2="404.2" y2="436.0"/>
  <text class="small" x="404.2" y="452.0" text-anchor="middle">0.5</text>
  <line class="grid" x1="641.1" y1="430.0" x2="641.1" y2="436.0"/>
  <text class="small" x="641.1" y="452.0" text-anchor="middle">0.9</text>
  <line class="grid" x1="694.5" y1="430.0" x2="694.5" y2="436.0"/>
  <text class="small" x="694.5" y="452.0" text-anchor="middle">0.99</text>
  <line class="grid" x1="102.0" y1="428.2" x2="108.0" y2="428.2"/>
  <text class="small" x="98.0" y="432.2" text-anchor="end">1</text>
  <line class="grid" x1="102.0" y1="411.6" x2="108.0" y2="411.6"/>
  <text class="small" x="98.0" y="415.6" text-anchor="end">10</text>
  <line class="grid" x1="102.0" y1="246.4" x2="108.0" y2="246.4"/>
  <text class="small" x="98.0" y="250.4" text-anchor="end">100</text>
  <polyline class="lineb" points="108.0,246.4 113.9,248.2 119.8,250.0 125.8,251.9 131.7,253.7 137.6,255.5 143.5,257.4 149.5,259.2 155.4,261.1 161.3,262.9 167.2,264.7 173.2,266.6 179.1,268.4 185.0,270.2 190.9,272.1 196.9,273.9 202.8,275.7 208.7,277.6 214.6,279.4 220.6,281.3 226.5,283.1 232.4,284.9 238.3,286.8 244.2,288.6 250.2,290.4 256.1,292.3 262.0,294.1 267.9,295.9 273.9,297.8 279.8,299.6 285.7,301.5 291.6,303.3 297.6,305.1 303.5,307.0 309.4,308.8 315.3,310.6 321.3,312.5 327.2,314.3 333.1,316.1 339.0,318.0 345.0,319.8 350.9,321.7 356.8,323.5 362.7,325.3 368.6,327.2 374.6,329.0 380.5,330.8 386.4,332.7 392.3,334.5 398.3,336.3 404.2,338.2 410.1,340.0 416.0,341.9 422.0,343.7 427.9,345.5 433.8,347.4 439.7,349.2 445.7,351.0 451.6,352.9 457.5,354.7 463.4,356.5 469.4,358.4 475.3,360.2 481.2,362.1 487.1,363.9 493.0,365.7 499.0,367.6 504.9,369.4 510.8,371.2 516.7,373.1 522.7,374.9 528.6,376.7 534.5,378.6 540.4,380.4 546.4,382.3 552.3,384.1 558.2,385.9 564.1,387.8 570.1,389.6 576.0,391.4 581.9,393.3 587.8,395.1 593.8,396.9 599.7,398.8 605.6,400.6 611.5,402.5 617.4,404.3 623.4,406.1 629.3,408.0 635.2,409.8 641.1,411.6 647.1,413.5 653.0,415.3 658.9,417.1 664.8,419.0 670.8,420.8 676.7,422.7 682.6,424.5 688.5,426.3 694.5,428.2" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="doty" r="6"><animate attributeName="cx" values="108.0;155.4;202.8;256.1;303.5;350.9;404.2;451.6;499.0;546.4;593.8;647.1;694.5" keyTimes="0.0000;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1.0000" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="246.4;261.1;275.7;292.3;307.0;321.7;338.2;352.9;367.6;382.3;396.9;413.5;428.2" keyTimes="0.0000;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1.0000" dur="12s" repeatCount="indefinite"/></circle>
  <text class="small" x="24" y="528">100 FIT 是教学起点，不是手册值，也不是 ASIL 预算。这张图不代替 HARA，也不证明任何产品达标。</text>
</svg>
