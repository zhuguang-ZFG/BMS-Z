<text x="52" y="58" font-size="38" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">四个过孔并联，不能只背四分之一</text><text x="52" y="94" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">示意 h = 1.6 mm、d = 0.3 mm；经验式算单孔 L ≈ 1.299 nH。</text>
<text x="60" y="145" font-size="23" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">相同支路、均匀分流；每对过孔互感均为 M</text>
<path d="M120 210 Q500.00 208.60 880 210" fill="none" stroke="#37424e" stroke-width="3"/>
<path d="M120 410 Q500.00 410.71 880 410" fill="none" stroke="#37424e" stroke-width="3"/>
<path d="M200 220 Q200.02 245.00 200 270" fill="none" stroke="#1f5d7a" stroke-width="3" stroke-linecap="round"/><polygon points="200,270 195.0,258.0 205.0,258.0" fill="#1f5d7a"/>
<rect x="146" y="280" width="108" height="72" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<text x="200" y="326" font-size="28" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">L</text>
<path d="M200 352 Q199.90 381.00 200 410" fill="none" stroke="#37424e" stroke-width="3"/>
<path d="M400 220 Q399.91 245.00 400 270" fill="none" stroke="#1f5d7a" stroke-width="3" stroke-linecap="round"/><polygon points="400,270 395.0,258.0 405.0,258.0" fill="#1f5d7a"/>
<rect x="346" y="280" width="108" height="72" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<text x="400" y="326" font-size="28" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">L</text>
<path d="M400 352 Q400.13 381.00 400 410" fill="none" stroke="#37424e" stroke-width="3"/>
<path d="M600 220 Q600.18 245.00 600 270" fill="none" stroke="#1f5d7a" stroke-width="3" stroke-linecap="round"/><polygon points="600,270 595.0,258.0 605.0,258.0" fill="#1f5d7a"/>
<rect x="546" y="280" width="108" height="72" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<text x="600" y="326" font-size="28" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">L</text>
<path d="M600 352 Q600.12 381.00 600 410" fill="none" stroke="#37424e" stroke-width="3"/>
<path d="M800 220 Q799.98 245.00 800 270" fill="none" stroke="#1f5d7a" stroke-width="3" stroke-linecap="round"/><polygon points="800,270 795.0,258.0 805.0,258.0" fill="#1f5d7a"/>
<rect x="746" y="280" width="108" height="72" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<text x="800" y="326" font-size="28" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">L</text>
<path d="M800 352 Q800.19 381.00 800 410" fill="none" stroke="#37424e" stroke-width="3"/>
<text x="500" y="460" font-size="26" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="middle">L等效 = [L + (N−1)M] / N，N = 4</text>
<text x="70" y="522" font-size="24" fill="#3d6b4a" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">忽略互感 M = 0 → 0.325 nH</text>
<text x="70" y="568" font-size="24" fill="#a8321f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">示意 M = L/2 → 0.812 nH</text>
<text x="60" y="628" font-size="22" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">实际电感取决于孔间距和回流几何；载流能力另核孔铜、温升与分流。</text>
<text x="60" y="668" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">信号换层同时安排参考面的连接，不能只数信号过孔。</text>
</svg>
