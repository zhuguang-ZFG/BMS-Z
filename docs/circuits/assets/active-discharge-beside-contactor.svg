<svg xmlns="http://www.w3.org/2000/svg" width="880" height="680" viewBox="0 -156 880 680" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>主动放电电阻装在接触器旁的示意图</title>
  <desc>主动放电电阻装在接触器旁的示意图</desc><style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .fill-boxb { fill: #ddf4ff; }
    .fill-boxg { fill: #dafbe1; }
    .fill-boxr { fill: #ffebe9; }
    .fill-boxy { fill: #fff8c5; }
    .fill-b { fill: #0969da; }
    .fill-g { fill: #1a7f37; }
    .fill-r { fill: #cf222e; }
    .fill-y { fill: #9a6700; }
    .fill-ink { fill: #57606a; }
    .fill-muted { fill: #e2e8f0; }
    .fill-lockb { fill: #0969da; }
    .stroke-panel { stroke: #d0d7de; }
    .stroke-axis { stroke: #57606a; }
    .stroke-b { stroke: #0969da; }
    .stroke-g { stroke: #1a7f37; }
    .stroke-r { stroke: #cf222e; }
    .stroke-y { stroke: #bf8700; }
    .stroke-check { stroke: #ffffff; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .on { fill: #ffffff; font-size: 13px; font-weight: bold; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .fill-boxb { fill: #12233a; }
      .fill-boxg { fill: #0f2415; }
      .fill-boxr { fill: #3d1214; }
      .fill-boxy { fill: #2d2607; }
      .fill-b { fill: #4493f8; }
      .fill-g { fill: #3fb950; }
      .fill-r { fill: #ff7b72; }
      .fill-y { fill: #d29922; }
      .fill-ink { fill: #8b949e; }
      .fill-muted { fill: #30363d; }
      .fill-lockb { fill: #0969da; }
      .stroke-panel { stroke: #30363d; }
      .stroke-axis { stroke: #8b949e; }
      .stroke-b { stroke: #4493f8; }
      .stroke-g { stroke: #3fb950; }
      .stroke-r { stroke: #ff7b72; }
      .stroke-y { stroke: #d29922; }
      .stroke-check { stroke: #0d1117; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .on { fill: #ffffff; }
      .lineb { stroke: #4493f8; }
    }
</style><rect class="bg" x="0" y="-156" width="880" height="680" /><text class="title" x="24" y="-128">预充电阻已经同框；主动放电电阻还没有</text><rect class="panel" x="24" y="-112" width="832" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 预充电阻已经同框；主动放电电阻还没有<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 已有实拍的那一侧：预充<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 实拍上标着 PRECHARGE<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="468" width="832" height="44" rx="6" /><text class="small" x="40" y="496">电容自带泄放、实验室用 100 kΩ 给电容放电，都不是这只装在高压接触器旁边的电阻。示意。</text><rect width="880" height="460" class="bg" />
  <text x="440" y="50" text-anchor="middle" font-size="13" class="gold">示意图·待实拍</text>
  <rect x="24" y="72" width="400" height="230" rx="8" class="panel" />
  <text x="40" y="98" font-size="15" font-weight="bold" class="txt">已有实拍的那一侧：预充</text>
  <rect x="48" y="116" width="140" height="56" rx="4" class="fill-muted stroke-axis" />
  <text x="118" y="149" text-anchor="middle" font-size="13" class="txt">主接触器</text>
  <rect x="220" y="116" width="170" height="56" rx="4" class="fill-boxb stroke-b" />
  <text x="305" y="140" text-anchor="middle" font-size="13" class="txt">预充电阻</text>
  <text x="305" y="158" text-anchor="middle" font-size="12" class="txt">合闸前的小电流</text>
  <text x="48" y="204" font-size="13" class="txt">实拍上标着 PRECHARGE</text>
  <text x="48" y="226" font-size="13" class="txt">RESISTOR。它在接触器旁，</text>
  <text x="48" y="248" font-size="13" class="txt">干的是上电预充，不是泄放。</text>
  <text x="48" y="278" font-size="13" class="txt">二极管和这只电阻在同一张里。</text>
  <rect x="448" y="72" width="408" height="230" rx="8" class="fill-boxy stroke-y" />
  <text x="464" y="98" font-size="15" font-weight="bold" class="txt">还缺实拍的那一侧：主动放电</text>
  <rect x="472" y="116" width="140" height="56" rx="4" class="fill-muted stroke-axis" />
  <text x="542" y="140" text-anchor="middle" font-size="13" class="txt">接触器已断开</text>
  <text x="542" y="158" text-anchor="middle" font-size="12" class="txt">触点分开</text>
  <rect x="640" y="116" width="180" height="56" rx="4" class="fill-boxr stroke-r" />
  <text x="730" y="140" text-anchor="middle" font-size="13" class="txt">主动放电电阻</text>
  <text x="730" y="158" text-anchor="middle" font-size="12" class="txt">并在母线电容上</text>
  <circle cy="144" r="6" class="fill-r">
    <animate attributeName="cx" values="650;810;650" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite" />
  </circle>
  <text x="472" y="204" font-size="13" class="txt">确认主接触器断开之后，</text>
  <text x="472" y="226" font-size="13" class="txt">这只小电阻才合上，几秒内</text>
  <text x="472" y="248" font-size="13" class="txt">把母线电容拉低。红点在这只</text>
  <text x="472" y="270" font-size="13" class="txt">电阻上走，表示泄放电流。</text>
  <text x="24" y="332" font-size="14" class="txt">电容自带泄放、实验室用 100 kΩ 给电容放电，都不是这只装在高压接触器旁边的电阻。</text>
  <text x="24" y="360" font-size="14" class="warn">不要带电拍摄高压母线。单独的线绕电阻照片只认外形。</text>

</svg>