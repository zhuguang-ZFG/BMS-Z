<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1448 1086" data-composition="python-handraw-v1" role="img" aria-labelledby="title desc">
<title id="title">测试点三条规矩</title><desc id="desc">四步流程：每个网络至少一个测试点，测试点直径至少 1.0 毫米，放在元件面并避开散热器与屏蔽罩阴影，每片区域至少两个地测试点让回流就近走。</desc>
<defs>
<linearGradient id="bgL" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#fdf8ea"/><stop offset="1" stop-color="#f6eedb"/>
</linearGradient>
<linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#141310"/><stop offset="1" stop-color="#1d1a14"/>
</linearGradient>
<radialGradient id="vig" cx="0.5" cy="0.44" r="0.78">
<stop offset="0.55" stop-color="#16202b" stop-opacity="0"/>
<stop offset="1" stop-color="#16202b" stop-opacity="0.055"/>
</radialGradient>
<linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#a4630f" stop-opacity="0.10"/>
<stop offset="0.55" stop-color="#a4630f" stop-opacity="0.028"/>
<stop offset="1" stop-color="#a4630f" stop-opacity="0"/>
</linearGradient>
<linearGradient id="hdrD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#dcab63" stop-opacity="0.13"/>
<stop offset="0.55" stop-color="#dcab63" stop-opacity="0.04"/>
<stop offset="1" stop-color="#dcab63" stop-opacity="0"/>
</linearGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
<circle cx="2.5" cy="3.5" r="0.9" fill="#c9bb9d"/>
<circle cx="19" cy="11" r="0.55" fill="#c9bb9d" opacity="0.7"/>
<circle cx="11.5" cy="22" r="0.6" fill="#c9bb9d" opacity="0.55"/>
</pattern>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
<feDropShadow dx="0" dy="1.4" stdDeviation="2" flood-color="#16202b" flood-opacity="0.13"/>
</filter>
<filter id="pglow" x="-70%" y="-70%" width="240%" height="240%">
<feGaussianBlur stdDeviation="1.7" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect class="page-bg" width="1448" height="1086" fill="url(#bgL)"/>
<rect class="page-grain" width="1448" height="1086" fill="url(#dots)"/>
<rect class="page-vig" width="1448" height="1086" fill="url(#vig)"/>
<rect class="page-hdr" width="1448" height="72" fill="url(#hdr)"/>
<style>
text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Source Han Sans SC","Noto Sans SC",sans-serif;}
line,path,polyline,polygon{stroke-linecap:round;stroke-linejoin:round}
.page-bg{fill:url(#bgL)}
.page-grain{opacity:.5}
.page-vig{opacity:1}
.page-hdr{fill:url(#hdr)}
@media (prefers-color-scheme: dark){
.page-bg{fill:url(#bgD)}
.page-grain{opacity:.34}
.page-vig{opacity:.5}
.page-hdr{fill:url(#hdrD)}
[fill="#fdf8ea"]{fill:#141310}
[stroke="#fdf8ea"]{stroke:#141310}
[fill="#f6eedb"]{fill:#1d1a14}
[stroke="#f6eedb"]{stroke:#1d1a14}
[fill="#e0d3b8"]{fill:#3b3529}
[stroke="#e0d3b8"]{stroke:#3b3529}
[fill="#c9bb9d"]{fill:#4a4436}
[stroke="#c9bb9d"]{stroke:#4a4436}
[fill="#16202b"]{fill:#ece4d3}
[stroke="#16202b"]{stroke:#ece4d3}
[fill="#37424e"]{fill:#cfc6b4}
[stroke="#37424e"]{stroke:#cfc6b4}
[fill="#5b666f"]{fill:#a79e8b}
[stroke="#5b666f"]{stroke:#a79e8b}
[fill="#8b8272"]{fill:#857c6c}
[stroke="#8b8272"]{stroke:#857c6c}
text[fill="#fdf8ea"]{fill:#f9f3e3}
[fill="#e6eff3"]{fill:#17262e}
[fill="#e4f1f3"]{fill:#15262a}
[fill="#e8efe6"]{fill:#182418}
[fill="#f6e7e1"]{fill:#281a16}
[fill="#f7eedb"]{fill:#292114}
[fill="#efe8ee"]{fill:#241c22}
text[fill="#1f5d7a"]{fill:#7fb7cf}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#1f5d7a"]{fill:#2b4d5f}
[stroke="#1f5d7a"]{stroke:#6fa3b9}
text[fill="#2f7f96"]{fill:#8ac9d8}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#2f7f96"]{fill:#2b5660}
[stroke="#2f7f96"]{stroke:#77b2c1}
text[fill="#3d6b4a"]{fill:#98c096}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#3d6b4a"]{fill:#2f4a33}
[stroke="#3d6b4a"]{stroke:#7aa87c}
text[fill="#a8321f"]{fill:#e0907a}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#a8321f"]{fill:#55231b}
[stroke="#a8321f"]{stroke:#c07a63}
text[fill="#a4630f"]{fill:#dcab63}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#a4630f"]{fill:#553a17}
[stroke="#a4630f"]{stroke:#c08a45}
text[fill="#6b3f63"]{fill:#c4a2bf}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#6b3f63"]{fill:#452c40}
[stroke="#6b3f63"]{stroke:#a17c9b}
}
</style>

<path data-paper-shadow="true" transform="translate(8 12)" d="M194,196 L699.98,194 L1373,197 L1376,530.3 L1373,782 L640.6800000000001,784 L190,780 Z" fill="#535453" opacity="0.08"/><path data-paper-shadow="true" transform="translate(4 7)" d="M194,196 L699.98,194 L1373,197 L1376,530.3 L1373,782 L640.6800000000001,784 L190,780 Z" fill="#535453" opacity="0.12"/><path data-paper-shadow="true" transform="translate(2 3)" d="M194,196 L699.98,194 L1373,197 L1376,530.3 L1373,782 L640.6800000000001,784 L190,780 Z" fill="#535453" opacity="0.15"/><path d="M194,196 L699.98,194 L1373,197 L1376,530.3 L1373,782 L640.6800000000001,784 L190,780 Z" fill="#f6f2ed" stroke="#c4b9ab" stroke-width="1.4"/><path d="M196,198L1369,199" fill="none" stroke="#fdf8ea" stroke-width="2" opacity=".7"/><path d="M208,208 L1360,210 L1362,768 L210,770 Z" fill="none" stroke="#c4b9ab" stroke-width="2" opacity=".55"/>
<circle cx="136" cy="267" r="31" fill="#e2d9cf" stroke="#a4441d" stroke-width="3"/>
<circle cx="136" cy="415" r="31" fill="#e2d9cf" stroke="#a4441d" stroke-width="3"/>
<path d="M136 328 Q136.05 339.00 136 350" fill="none" stroke="#c4b9ab" stroke-width="3" stroke-dasharray=""/><polygon points="136,350 143.0,337.0 129.0,337.0" fill="#c4b9ab"/>
<circle cx="136" cy="563" r="31" fill="#e2d9cf" stroke="#a4441d" stroke-width="3"/>
<path d="M136 476 Q135.93 487.00 136 498" fill="none" stroke="#c4b9ab" stroke-width="3" stroke-dasharray=""/><polygon points="136,498 143.0,485.0 129.0,485.0" fill="#c4b9ab"/>
<circle cx="136" cy="711" r="31" fill="#e2d9cf" stroke="#a4441d" stroke-width="3"/>
<path d="M136 624 Q135.94 635.00 136 646" fill="none" stroke="#c4b9ab" stroke-width="3" stroke-dasharray=""/><polygon points="136,646 143.0,633.0 129.0,633.0" fill="#c4b9ab"/>
<text x="72" y="92" fill="#2a2927" font-size="50" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">测试点三条规矩：每网有、够大、夹得住</text>
<text x="74" y="146" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">测试点是给未来的自己和产线留的门；夹不进去的测试点等于没有。</text>
<text x="136" y="279" fill="#a4441d" font-size="34" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#e2d9cf">一</text>
<text x="226" y="252" fill="#2a2927" font-size="36" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">每网至少一个</text>
<text x="226" y="294" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">电源轨、复位、时钟、关键模拟节点</text>
<text x="226" y="330" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">原理图阶段就标 TP</text>
<text x="136" y="427" fill="#a4441d" font-size="34" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#e2d9cf">二</text>
<text x="226" y="400" fill="#2a2927" font-size="36" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">直径 ≥1.0 mm</text>
<text x="226" y="442" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">能稳定搭探头钩或测试夹</text>
<text x="226" y="478" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">别拿过孔当测试点</text>
<text x="136" y="575" fill="#a4441d" font-size="34" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#e2d9cf">三</text>
<text x="226" y="548" fill="#2a2927" font-size="36" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">放在元件面</text>
<text x="226" y="590" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">避开散热器与屏蔽罩阴影</text>
<text x="226" y="626" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">夹不进等于没有</text>
<text x="136" y="723" fill="#a4441d" font-size="34" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#e2d9cf">四</text>
<text x="226" y="696" fill="#2a2927" font-size="36" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">地测试点给足</text>
<text x="226" y="738" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">每片区域至少两个</text>
<text x="226" y="774" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">回流就近走，少测到假噪声</text>
<path data-paper-shadow="true" transform="translate(8 12)" d="M68,988 L631.6,986 L1381,989 L1384,1030.46 L1381,1062 L565.6,1064 L64,1060 Z" fill="#535453" opacity="0.08"/><path data-paper-shadow="true" transform="translate(4 7)" d="M68,988 L631.6,986 L1381,989 L1384,1030.46 L1381,1062 L565.6,1064 L64,1060 Z" fill="#535453" opacity="0.12"/><path data-paper-shadow="true" transform="translate(2 3)" d="M68,988 L631.6,986 L1381,989 L1384,1030.46 L1381,1062 L565.6,1064 L64,1060 Z" fill="#535453" opacity="0.15"/><path d="M68,988 L631.6,986 L1381,989 L1384,1030.46 L1381,1062 L565.6,1064 L64,1060 Z" fill="#f6f2ed" stroke="#c4b9ab" stroke-width="1.4"/><path d="M70,990L1377,991" fill="none" stroke="#fdf8ea" stroke-width="2" opacity=".7"/>
<text x="92" y="1036" fill="#2a2927" font-size="33" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">测试点不是可有可无的丝印：它是测量链的第一段。</text>
</svg>
