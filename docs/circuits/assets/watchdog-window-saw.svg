  <circle class="doty" r="6"><animate attributeName="cx" values="108.0;139.1;170.2;201.3;232.4;263.5;294.6;325.7;356.8;387.9;419.0;450.1;481.2;512.3;543.4;574.5;605.6;636.7;667.8;698.9;730.0" keyTimes="0.0000;0.0500;0.1000;0.1500;0.2000;0.2500;0.3000;0.3500;0.4000;0.4500;0.5000;0.5500;0.6000;0.6500;0.7000;0.7500;0.8000;0.8500;0.9000;0.9500;1.0000" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="430.0;409.8;389.6;369.4;349.2;329.0;308.8;423.3;403.1;382.9;362.7;342.5;322.3;302.1;281.9;261.7;261.7;261.7;261.7;261.7;261.7" keyTimes="0.0000;0.0500;0.1000;0.1500;0.2000;0.2500;0.3000;0.3500;0.4000;0.4500;0.5000;0.5500;0.6000;0.6500;0.7000;0.7500;0.8000;0.8500;0.9000;0.9500;1.0000" dur="12s" repeatCount="indefinite"/></circle>
  <text class="small" x="24" y="528">80 ms、100 ms 是示意。喂得太勤（卡在循环里乱喂）是另一类故障，这张图只画「太晚」。</text>
</svg>
