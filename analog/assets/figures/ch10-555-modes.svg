<!-- ================= 底部：选型三问 ================= -->
<rect x="36" y="516" width="888" height="100" rx="12" fill="#fdf3e3" stroke="#b45309" stroke-width="1.5"/>
<text x="56" y="540" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="13" font-weight="700" fill="#14213d">选型三问：「跟时间有关」的需求，按序问三句</text>
<text x="56" y="562" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12" fill="#14213d">① 事件谁发起？自己发起 → 无稳态；外部发起要定时 → 单稳态；要记忆状态 → 双稳态</text>
<text x="56" y="583" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12" fill="#14213d">② 时间窗落在哪？几十 ms–几十 s 是主场；µs 以下或 100 kHz 以上查延迟账，分钟级以上加分频</text>
<text x="56" y="604" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12" fill="#14213d">③ 精度几位数？±5% 以外随便搭；±1%–5% 用 COG/薄膜+修调；优于 ±1% 是晶体/MCU 的疆域</text>
</svg>
