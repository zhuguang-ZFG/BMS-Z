  <text class="txt" x="40" y="72" opacity="1" style="opacity: 1;">① 阶跃<tspan class="small">　20 A × 2 mΩ，端电压立刻少 40 mV。两张图这一下是一样的。</tspan></text>
  <text class="txt" x="40" y="98" opacity="1" style="opacity: 1;">② 快路<tspan class="small">　4 mΩ、τ=1 s。电荷转移，脉冲开头几秒就坐实。</tspan></text>
  <text class="txt" x="40" y="124" opacity="1" style="opacity: 1;">③ 慢路<tspan class="small">　6 mΩ、τ=30 s。浓差还在爬，10 s 里只走完一头。</tspan></text>
  <text class="txt" x="40" y="150" opacity="1" style="opacity: 1;">④ 一阶<tspan class="small">　把 10 mΩ 合成一条 τ=12 s。前段偏高，红虚线离开蓝线。</tspan></text>
