<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="ui-monospace, Consolas, monospace">
  <title>过压故障锁存：电压回到恢复阈值以下仍保持关断，直到清除锁存。电压数字为示意。</title>

  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #bf8700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.5; fill: none; }
    .liney { stroke: #bf8700; stroke-width: 2.5; fill: none; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .dotg { fill: #1a7f37; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    .boxr { fill: #ffebe9; stroke: #cf222e; }
    .boxg { fill: #dafbe1; stroke: #1a7f37; }
    .boxy { fill: #fff8c5; stroke: #bf8700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .dotg { fill: #3fb950; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
      .boxr { fill: #3d1214; stroke: #ff7b72; }
      .boxg { fill: #12261e; stroke: #3fb950; }
      .boxy { fill: #3d2e00; stroke: #d29922; }
    }
  </style>

  <rect class="bg" width="800" height="460"/>

  <text class="title" x="24" y="32">故障锁存：电压回到恢复线以下，也不会自己走开（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="122" rx="6"/>
  <text class="txt" x="40" y="68" opacity="0.28">① 正常放电<tspan class="small">　最高节 4.18 V，低于示意门槛 4.25 V，MOS 导通。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="94" opacity="0.28">② 越过 4.25 V<tspan class="small">　比较器确认后进入故障，充电 MOS 关掉，锁存位置位。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="120" opacity="0.28">③ 电压掉回 4.10 V<tspan class="small">　4.10 V 已经低于示意恢复线 4.15 V。锁存还在，MOS 仍关。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="146" opacity="0.28">④ 清除之后<tspan class="small">　人把锁存清掉，并且电压仍在安全侧，才允许离开故障。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="180" width="752" height="210" rx="6"/>
  <rect class="boxg" x="50" y="230" width="150" height="70" rx="8"/>
  <text class="ok" x="125" y="270" text-anchor="middle">运行 4.18 V</text>
  <rect class="boxr" x="250" y="230" width="160" height="70" rx="8">
    <animate attributeName="stroke-width" values="1;4;4;1" keyTimes="0;0.3;0.75;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text class="warn" x="330" y="258" text-anchor="middle">故障锁存</text>
  <text class="small" x="330" y="280" text-anchor="middle">4.25 V 触发</text>
  <rect class="boxy" x="460" y="230" width="170" height="70" rx="8"/>
  <text class="gold" x="545" y="258" text-anchor="middle">电压已 4.10 V</text>
  <text class="small" x="545" y="280" text-anchor="middle">锁存仍为 1</text>
  <rect class="boxb" x="250" y="320" width="280" height="48" rx="8"/>
  <text class="hi" x="390" y="350" text-anchor="middle">清除锁存 + 仍低于 4.15 V → 才离开</text>
  <text class="small" x="24" y="446">4.25 V / 4.15 V 沿用本仓库保护去抖的教学门槛，不是产品阈值。锁存是为了避免在门槛附近来回抖。</text>

</svg>
