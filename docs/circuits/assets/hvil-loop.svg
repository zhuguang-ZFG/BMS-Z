<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460">
  <title>高压互锁 HVIL 动画</title>
  <rect width="800" height="460" fill="#f8fafc"/>
  <style>
  text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
  /* 深色模式：GitHub 深色主题下对调底色与文字色，只覆盖配色，不动几何与动画。
     stroke="#fff" 保持白色——那是彩色徽标上的勾选，不在覆盖范围内。 */
  @media (prefers-color-scheme: dark){
  rect[fill="#f8fafc"]{fill:#0f172a}
  rect[fill="#fff"]{fill:#1e293b}
  [fill="#f1f5f9"]{fill:#1e293b}
  [stroke="#f1f5f9"]{stroke:#1e293b}
  [fill="#e2e8f0"]{fill:#334155}
  [stroke="#e2e8f0"]{stroke:#334155}
  [fill="#cbd5e1"]{fill:#475569}
  [stroke="#cbd5e1"]{stroke:#475569}
  [fill="#64748b"]{fill:#94a3b8}
  [stroke="#64748b"]{stroke:#94a3b8}
  [fill="#475569"]{fill:#cbd5e1}
  [stroke="#475569"]{stroke:#cbd5e1}
  [fill="#334155"]{fill:#e2e8f0}
  [stroke="#334155"]{stroke:#e2e8f0}
  [fill="#1e293b"]{fill:#f1f5f9}
  [stroke="#1e293b"]{stroke:#f1f5f9}
  [fill="#dbeafe"]{fill:#1e3a8a}
  [stroke="#dbeafe"]{stroke:#1e3a8a}
  [fill="#eff6ff"]{fill:#172554}
  [stroke="#eff6ff"]{stroke:#172554}
  [fill="#bfdbfe"]{fill:#1e40af}
  [stroke="#bfdbfe"]{stroke:#1e40af}
  [fill="#1d4ed8"]{fill:#60a5fa}
  [stroke="#1d4ed8"]{stroke:#60a5fa}
  [fill="#1e40af"]{fill:#93c5fd}
  [stroke="#1e40af"]{stroke:#93c5fd}
  [fill="#2563eb"]{fill:#60a5fa}
  [stroke="#2563eb"]{stroke:#60a5fa}
  [fill="#3b82f6"]{fill:#60a5fa}
  [stroke="#3b82f6"]{stroke:#60a5fa}
  [fill="#ecfdf5"]{fill:#022c22}
  [stroke="#ecfdf5"]{stroke:#022c22}
  [fill="#a7f3d0"]{fill:#065f46}
  [stroke="#a7f3d0"]{stroke:#065f46}
  [fill="#86efac"]{fill:#166534}
  [stroke="#86efac"]{stroke:#166534}
  [fill="#065f46"]{fill:#6ee7b7}
  [stroke="#065f46"]{stroke:#6ee7b7}
  [fill="#059669"]{fill:#34d399}
  [stroke="#059669"]{stroke:#34d399}
  [fill="#fef2f2"]{fill:#450a0a}
  [stroke="#fef2f2"]{stroke:#450a0a}
  [fill="#fecaca"]{fill:#7f1d1d}
  [stroke="#fecaca"]{stroke:#7f1d1d}
  [fill="#fca5a5"]{fill:#b91c1c}
  [stroke="#fca5a5"]{stroke:#b91c1c}
  [fill="#991b1b"]{fill:#fca5a5}
  [stroke="#991b1b"]{stroke:#fca5a5}
  [fill="#dc2626"]{fill:#f87171}
  [stroke="#dc2626"]{stroke:#f87171}
  [fill="#fffbeb"]{fill:#451a03}
  [stroke="#fffbeb"]{stroke:#451a03}
  [fill="#fef3c7"]{fill:#78350f}
  [stroke="#fef3c7"]{stroke:#78350f}
  [fill="#92400e"]{fill:#fcd34d}
  [stroke="#92400e"]{stroke:#fcd34d}
  [fill="#b45309"]{fill:#fbbf24}
  [stroke="#b45309"]{stroke:#fbbf24}
  }
</style>

  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">高压互锁：先断信号，后断高压</text>

  <!-- 电池包与高压母线 -->
  <rect x="300" y="120" width="200" height="120" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="400" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#065f46">电池包</text>
  <text x="400" y="196" text-anchor="middle" font-size="11" fill="#065f46">400V（示例）</text>
  <line x1="500" y1="180" x2="585" y2="180" stroke="#dc2626" stroke-width="5"/>
  <line x1="615" y1="180" x2="700" y2="180" stroke="#dc2626" stroke-width="5"/>
  <text x="700" y="165" text-anchor="middle" font-size="11" fill="#991b1b">B+ 母线</text>

  <!-- 主接触器：开/合两态 -->
  <line x1="585" y1="180" x2="615" y2="180" stroke="#059669" stroke-width="3">
    <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.5;0.54;0.9;0.94;1" dur="12s" repeatCount="indefinite"/>
  </line>
  <line x1="585" y1="180" x2="611" y2="166" stroke="#dc2626" stroke-width="3" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.54;0.9;0.94;1" dur="12s" repeatCount="indefinite"/>
  </line>
  <text x="600" y="212" text-anchor="middle" font-size="10" fill="#64748b">主接触器</text>

  <!-- 母线电容泄放条 -->
  <rect x="655" y="220" width="30" height="60" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <rect x="658" y="223" width="24" height="54" fill="#dc2626">
    <animate attributeName="height" values="54;54;54;4;4" keyTimes="0;0.5;0.55;0.7;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="y" values="223;223;223;273;273" keyTimes="0;0.5;0.55;0.7;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text x="670" y="296" text-anchor="middle" font-size="10" fill="#64748b">母线电容</text>

  <!-- HVIL 环路：BDU → 接插件1 → 2 → 3 → MSD → BDU -->
  <rect x="100" y="210" width="80" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">BDU</text>
  <path d="M180,225 L250,150 L550,150 L550,300 L250,300 L180,255" fill="none" stroke="#2563eb" stroke-width="2">
    <animate attributeName="stroke" values="#2563eb;#2563eb;#94a3b8;#94a3b8" keyTimes="0;0.28;0.32;1" dur="12s" repeatCount="indefinite"/>
  </path>
  <rect x="240" y="140" width="20" height="20" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="540" y="140" width="20" height="20" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="540" y="290" width="20" height="20" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="240" y="290" width="20" height="20" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="250" y="132" text-anchor="middle" font-size="10" fill="#475569">接插件</text>
  <text x="250" y="326" text-anchor="middle" font-size="10" fill="#475569">MSD</text>

  <!-- 巡检小电流 -->
  <circle r="4" fill="#2563eb" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.25;0.29;1" dur="12s" repeatCount="indefinite"/>
    <animateMotion path="M180,225 L250,150 L550,150 L550,300 L250,300 L180,255" keyPoints="0;0;1;1" keyTimes="0;0.03;0.25;1" calcMode="linear" dur="12s" repeatCount="indefinite"/>
  </circle>
  <text x="140" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#059669">回路闭合 ✓
    <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.28;0.32;0.9;0.94;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="140" y="308" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626" opacity="0">信号丢失 ✗
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.32;0.9;0.94;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- ② 有人拔枪：插头分离，环路断开 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.32;1" dur="12s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -22;0 -22" keyTimes="0;0.3;0.36;1" dur="12s" repeatCount="indefinite"/>
      <rect x="536" y="118" width="28" height="16" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
    </g>
    <text x="600" y="130" text-anchor="start" font-size="11" fill="#dc2626">有人拔枪 / 开 MSD</text>
  </g>

  <!-- ③ 按序下高压 -->
  <text x="400" y="340" text-anchor="middle" font-size="12" fill="#065f46" opacity="0">BMS 立刻断接触器、主动泄放——人碰到端子前，高压已不在
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.72;0.76;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- ④ 针脚长短差：信号先断、高压后断 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.76;0.8;1" dur="12s" repeatCount="indefinite"/>
    <rect x="150" y="355" width="500" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="430" y="380" text-anchor="end" font-size="12" fill="#334155">信号针短 → 先断开</text>
    <text x="430" y="402" text-anchor="end" font-size="12" fill="#334155">高压针长 → 后断开</text>
    <line x1="480" y1="368" x2="480" y2="404" stroke="#dc2626" stroke-width="6"/>
    <line x1="520" y1="382" x2="520" y2="404" stroke="#2563eb" stroke-width="6"/>
    <text x="480" y="364" text-anchor="middle" font-size="10" fill="#991b1b">高压针</text>
    <text x="520" y="378" text-anchor="middle" font-size="10" fill="#1e40af">信号针</text>
  </g>

  <text x="400" y="444" text-anchor="middle" font-size="13" fill="#475569">关键：一根低压细线看住所有高压接口；针脚长短差让信号永远先于高压断开。</text>
</svg>
