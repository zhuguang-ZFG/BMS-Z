<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
<title id="title">时间预算，要把等待也算上</title><desc id="desc">设计预算而非实测：严格0.10 s等间隔采样，最多等待0.10 s发现越线，随后确认0.20 s，额外处理不超过0.01 s，总预算0.31 s。主尺三段按时长比例绘制；允许抖动的另一种假设还需另加最多一个采样周期。</desc>
<metadata>Self-authored editable SVG; FA-002; IG-004; C-03; C-15 only for expiry/cutoff.</metadata>
