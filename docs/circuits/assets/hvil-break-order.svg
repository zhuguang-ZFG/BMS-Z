</style><rect class="bg" x="0" y="-156" width="800" height="660" /><rect class="bms-marker" aria-hidden="true" x="18.0" y="-142.9" width="345.5" height="17.3" rx="3.8" transform="rotate(-.5 18.0 -134.2)"/><path class="bms-under" aria-hidden="true" d="M24.0 -119.0 q 24.0 -2.4 48.0 0 t 48 0 t 48 0 t 48 0 t 48 0 t 48 0"/><text class="title" x="24" y="-128">HVIL 因果：环先断，闸再开，母线最后才安全</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><g class="bms-doodle" aria-hidden="true" transform="translate(746.0 -88.0)"><animateTransform attributeName="transform" type="rotate" values="-6;7;-6" keyTimes="0;0.5;1" dur="5.4s" repeatCount="indefinite" additive="sum"/><animate attributeName="opacity" values="0.62;1;0.62" keyTimes="0;0.5;1" dur="3.6s" repeatCount="indefinite"/><path class="bms-spark-fill" d="M0 -9 L2.3 -2.3 L9 0 L2.3 2.3 L0 9 L-2.3 2.3 L-9 0 L-2.3 -2.3 Z"/></g><g class="bms-doodle" aria-hidden="true" transform="translate(710.0 -98.0)"><animateTransform attributeName="transform" type="rotate" values="5;-4;5" keyTimes="0;0.5;1" dur="6.2s" repeatCount="indefinite" additive="sum"/><animate attributeName="opacity" values="0.5;0.9;0.5" keyTimes="0;0.5;1" dur="4.4s" repeatCount="indefinite"/><path class="bms-spark-soft" d="M0 -5.5 L1.4 -1.4 L5.5 0 L1.4 1.4 L0 5.5 L-1.4 1.4 L-5.5 0 L-1.4 -1.4 Z"/></g><g class="bms-doodle" aria-hidden="true"><circle class="bms-spark-fill" cx="728.0" cy="-79.0" r="1.3"/><circle class="bms-spark-soft" cx="696.0" cy="-82.0" r="1.1"/></g><text class="txt" x="40" y="-88" opacity="1">① HVIL 因果：环先断，闸再开，母线最后才安全<animate calcMode="spline" keySplines="0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 插头或 MSD 先松<animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 高压源先离开母线<animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="448" width="752" height="44" rx="6" /><text class="small" x="40" y="476">和预充不是同一件事：这张管的是「人还没碰到，高压先离开」。</text><rect width="800" height="440" class="bg" />
  <rect x="36" y="70" width="200" height="130" rx="8" stroke-width="2" class="fill-boxr stroke-r">
    <animate calcMode="spline" keySplines="0.7 0 0.84 0;0.42 0 0.58 1;0.16 1 0.3 1" attributeName="stroke-width" values="5;2;2;5" keyTimes="0;0.3;0.7;1" dur="8s" repeatCount="indefinite" />
  </rect>
  <text x="136" y="120" text-anchor="middle" font-size="16" font-weight="bold" class="warn">1 环断开</text>
  <text x="136" y="148" text-anchor="middle" font-size="13" class="txt">插头或 MSD 先松</text>
  <text x="136" y="172" text-anchor="middle" font-size="13" class="txt">低压信号没有了</text>
  <rect x="310" y="70" width="200" height="130" rx="8" stroke-width="2" class="fill-boxy stroke-y">
    <animate calcMode="spline" keySplines="0.16 1 0.3 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="stroke-width" values="2;5;2;2" keyTimes="0;0.4;0.7;1" dur="8s" repeatCount="indefinite" />
  </rect>
  <text x="410" y="120" text-anchor="middle" font-size="16" font-weight="bold" class="gold">2 接触器打开</text>
  <text x="410" y="148" text-anchor="middle" font-size="13" class="txt">高压源先离开母线</text>
  <text x="410" y="172" text-anchor="middle" font-size="13" class="txt">人还没碰到端子</text>
  <rect x="584" y="70" width="200" height="130" rx="8" stroke-width="2" class="fill-boxg stroke-g">
    <animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.7 0 0.84 0" attributeName="stroke-width" values="2;2;5;2" keyTimes="0;0.45;0.7;1" dur="8s" repeatCount="indefinite" />
  </rect>
  <text x="684" y="120" text-anchor="middle" font-size="16" font-weight="bold" class="ok">3 母线掉下来</text>
  <text x="684" y="148" text-anchor="middle" font-size="13" class="txt">确认断开后再泄放</text>
  <text x="684" y="172" text-anchor="middle" font-size="13" class="txt">然后才算安全</text>
  <circle cy="135" r="7" class="fill-b">
    <animate calcMode="spline" keySplines="0.16 1 0.3 1;0.16 1 0.3 1;0.7 0 0.84 0" attributeName="cx" values="136;410;684;136" keyTimes="0;0.33;0.66;1" dur="8s" repeatCount="indefinite" />
  </circle>
  <rect x="36" y="230" width="748" height="120" rx="8" class="panel stroke-r" />
  <text x="56" y="268" font-size="15" font-weight="bold" opacity="1" class="warn">错序：高压还在，人已经摸到端子
    <animate calcMode="spline" keySplines="0.7 0 0.84 0;0.42 0 0.58 1;0.16 1 0.3 1" attributeName="opacity" values="1;0;0;1" keyTimes="0;0.25;0.8;1" dur="8s" repeatCount="indefinite" />
  </text>
  <text x="56" y="300" font-size="15" opacity="0" class="ok">对序：信号针短，先断；高压针长，后断。环没了就不要再合闸。
    <animate calcMode="spline" keySplines="0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.3;0.75;0.85;1" dur="8s" repeatCount="indefinite" />
  </text>
  <text x="56" y="332" font-size="13" class="small">示意图。针脚长短差是接插件的机械保证，不是软件延时。</text>
  

</svg>