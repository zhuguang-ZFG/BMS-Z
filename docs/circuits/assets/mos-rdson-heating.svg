<svg xmlns="http://www.w3.org/2000/svg" width="800" height="732" viewBox="0 -156 800 732" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>MOS 导通电阻发热动画</title>
  <desc>电流翻倍时发热柱按平方涨到四倍：P=I²R 用 5 mΩ 示例，柱高对比 1 A 与 2 A 的损耗。</desc><style>
