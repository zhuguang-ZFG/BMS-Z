<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 544" font-family="ui-monospace, Consolas, monospace">
  <title>交流充电 CP 占空比换算电流的教学直线：10% 到 85% 用 I=60×占空比。不是标准摘录，也不是某根充电枪的铭牌。</title>
  <desc>占空比从 10% 走到 85%：教学直线 I=60×占空比 逐段点亮，更高占空比不在这张图上。</desc>

  <style>
    .bg { fill: #fffdf5; }
    .panel { fill: #f7f2e5; stroke: #cfc6b2; }
    .axis { stroke: #626d65; stroke-width: 1.5; fill: none; }
    .grid { stroke: #cfc6b2; stroke-width: 1; fill: none; }
    .txt { fill: #293b3a; font-size: 13px; }
    .small { fill: #626d65; font-size: 12px; }
    .title { fill: #293b3a; font-size: 16px; font-weight: bold; }
    .hi { fill: #176b73; }
    .warn { fill: #b84745; }
    .ok { fill: #377b60; }
    .gold { fill: #926717; }
    .lineb { stroke: #176b73; stroke-width: 2.5; fill: none; }
    .liner { stroke: #b84745; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #377b60; stroke-width: 2.5; fill: none; }
    .liney { stroke: #926717; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .dotb { fill: #176b73; }
    .dotr { fill: #b84745; }
    .doty { fill: #926717; }
    .boxb { fill: #e4f0df; stroke: #176b73; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #192727; }
      .panel { fill: #223333; stroke: #496160; }
      .axis { stroke: #b0beb3; }
      .grid { stroke: #496160; }
      .txt { fill: #edf0e5; }
      .small { fill: #b0beb3; }
      .title { fill: #edf0e5; }
      .hi { fill: #7ec5c5; }
      .warn { fill: #f39b91; }
      .ok { fill: #8fc7a2; }
      .gold { fill: #dfbd78; }
      .lineb { stroke: #7ec5c5; }
      .liner { stroke: #f39b91; }
      .lineg { stroke: #8fc7a2; }
      .liney { stroke: #dfbd78; }
      .dotb { fill: #7ec5c5; }
      .dotr { fill: #f39b91; }
      .doty { fill: #dfbd78; }
      .boxb { fill: #293f35; stroke: #7ec5c5; }
    }
  </style>

  <!-- formula: I=60*duty for duty in [0.10,0.85]; 10%->6A, 85%->51A -->
  <rect class="bg" width="800" height="544"/>
  <text class="title" x="24" y="32">枪上的方波有多宽，车允许充多快（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="128" rx="6"/>
  <text class="txt" x="40" y="72" opacity="0.28">① 占空比 10%<tspan class="small">　60×0.10 = 6 A。直线过原点的延长，但 10% 以下不用这条式子。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="98" opacity="0.28">② 50%<tspan class="small">　30 A。斜率是每 1% 占空比 0.6 A。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="124" opacity="0.28">③ 85%<tspan class="small">　51 A。这一段的尽头。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="150" opacity="0.28">④ 更高占空比不在这张图上<tspan class="small">　另一段斜率不同。别把直线画出去。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="188" width="752" height="304" rx="6"/>
  <text class="small" x="40" y="210">允许电流 A（示意）</text>
  <line class="axis" x1="108.0" y1="228.0" x2="108.0" y2="430.0"/>
  <line class="axis" x1="108.0" y1="430.0" x2="730.0" y2="430.0"/>
  <text class="small" x="730.0" y="468.0" text-anchor="end">CP 占空比（0.10–0.85 这一段）</text>
  <line class="grid" x1="142.6" y1="430.0" x2="142.6" y2="436.0"/>
  <text class="small" x="142.6" y="452.0" text-anchor="middle">0.10</text>
  <line class="grid" x1="419.0" y1="430.0" x2="419.0" y2="436.0"/>
  <text class="small" x="419.0" y="452.0" text-anchor="middle">0.50</text>
  <line class="grid" x1="660.9" y1="430.0" x2="660.9" y2="436.0"/>
  <text class="small" x="660.9" y="452.0" text-anchor="middle">0.85</text>
  <line class="grid" x1="102.0" y1="409.8" x2="108.0" y2="409.8"/>
  <text class="small" x="98.0" y="413.8" text-anchor="end">6</text>
  <line class="grid" x1="102.0" y1="329.0" x2="108.0" y2="329.0"/>
  <text class="small" x="98.0" y="333.0" text-anchor="end">30</text>
  <line class="grid" x1="102.0" y1="258.3" x2="108.0" y2="258.3"/>
  <text class="small" x="98.0" y="262.3" text-anchor="end">51</text>
  <polyline class="lineb" points="142.6,409.8 149.0,407.9 155.5,406.0 162.0,404.1 168.5,402.2 175.0,400.3 181.4,398.4 187.9,396.5 194.4,394.6 200.9,392.8 207.3,390.9 213.8,389.0 220.3,387.1 226.8,385.2 233.3,383.3 239.7,381.4 246.2,379.5 252.7,377.6 259.2,375.7 265.7,373.8 272.1,371.9 278.6,370.0 285.1,368.1 291.6,366.2 298.1,364.4 304.5,362.5 311.0,360.6 317.5,358.7 324.0,356.8 330.5,354.9 336.9,353.0 343.4,351.1 349.9,349.2 356.4,347.3 362.8,345.4 369.3,343.5 375.8,341.6 382.3,339.7 388.8,337.8 395.2,335.9 401.7,334.1 408.2,332.2 414.7,330.3 421.2,328.4 427.6,326.5 434.1,324.6 440.6,322.7 447.1,320.8 453.6,318.9 460.0,317.0 466.5,315.1 473.0,313.2 479.5,311.3 486.0,309.4 492.4,307.5 498.9,305.6 505.4,303.8 511.9,301.9 518.3,300.0 524.8,298.1 531.3,296.2 537.8,294.3 544.3,292.4 550.7,290.5 557.2,288.6 563.7,286.7 570.2,284.8 576.7,282.9 583.1,281.0 589.6,279.1 596.1,277.2 602.6,275.3 609.1,273.4 615.5,271.6 622.0,269.7 628.5,267.8 635.0,265.9 641.5,264.0 647.9,262.1 654.4,260.2 660.9,258.3" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="doty" r="6"><animate data-ease="linear" attributeName="cx" values="142.6;187.9;226.8;272.1;317.5;356.4;401.7;447.1;486.0;531.3;576.7;615.5;660.9" keyTimes="0.0000;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1.0000" dur="12s" repeatCount="indefinite"/><animate data-ease="linear" attributeName="cy" values="409.8;396.5;385.2;371.9;358.7;347.3;334.1;320.8;309.4;296.2;282.9;271.6;258.3" keyTimes="0.0000;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1.0000" dur="12s" repeatCount="indefinite"/></circle>
  <text class="small" x="24" y="528">教学记忆式，不是 IEC 或国标条文摘录。85% 以上的另一段斜率这里不画。CP 电压 12/9/6 V 表示插合状态，不在这条电流线上。</text>
</svg>
