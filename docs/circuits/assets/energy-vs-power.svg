<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 544" font-family="ui-monospace, Consolas, monospace">
  <title>能量对功率：倍率上去，端电压和可用安时一起掉，瓦时下降。数字为示意。</title>
  <desc>能量对功率：倍率上去，端电压和可用安时一起掉，瓦时下降。数字为示意。</desc>

  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.5; fill: none; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
    }
  </style>

  <!-- formula: I=2*C; V=3.60-I*0.040; Q=2*C**(-0.15); E=Q*V; P=I*V; C=0.2..12 -->
  <rect class="bg" width="800" height="544"/>
  <text class="title" x="24" y="32">要更大的功率，就得还掉一些能量（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="128" rx="6"/>
  <text class="txt" x="40" y="72" opacity="0.28">① 慢放<tspan class="small">　0.2C 大约 1.43 W、9.13 Wh。功率小，能量最高。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="98" opacity="0.28">② 1C<tspan class="small">　端电压 3.52 V，约 7.04 W、7.04 Wh。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="124" opacity="0.28">③ 再要功率<tspan class="small">　10C 端电压掉到 2.80 V，能量继续降。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="150" opacity="0.28">④ 拐弯还在右边<tspan class="small">　功率还在涨，能量已经往下走。要更大的功率，就得还能量。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="188" width="752" height="304" rx="6"/>
  <text class="small" x="40" y="210">能量 Wh（示意）</text>
  <line class="axis" x1="108.0" y1="228.0" x2="108.0" y2="430.0"/>
  <line class="axis" x1="108.0" y1="430.0" x2="730.0" y2="430.0"/>
  <text class="small" x="730.0" y="468.0" text-anchor="end">功率 W（示意，端电压当平均电压）</text>
  <line class="grid" x1="121.1" y1="430.0" x2="121.1" y2="436.0"/>
  <text class="small" x="121.1" y="452.0" text-anchor="middle">1.4</text>
  <line class="grid" x1="295.0" y1="430.0" x2="295.0" y2="436.0"/>
  <text class="small" x="295.0" y="452.0" text-anchor="middle">20</text>
  <line class="grid" x1="482.0" y1="430.0" x2="482.0" y2="436.0"/>
  <text class="small" x="482.0" y="452.0" text-anchor="middle">40</text>
  <line class="grid" x1="669.0" y1="430.0" x2="669.0" y2="436.0"/>
  <text class="small" x="669.0" y="452.0" text-anchor="middle">60</text>
  <line class="grid" x1="102.0" y1="388.8" x2="108.0" y2="388.8"/>
  <text class="small" x="98.0" y="392.8" text-anchor="end">4</text>
  <line class="grid" x1="102.0" y1="333.9" x2="108.0" y2="333.9"/>
  <text class="small" x="98.0" y="337.9" text-anchor="end">6</text>
  <line class="grid" x1="102.0" y1="279.0" x2="108.0" y2="279.0"/>
  <text class="small" x="98.0" y="283.0" text-anchor="end">8</text>
  <polyline class="lineb" points="121.4,248.0 131.2,268.7 141.0,281.3 150.6,290.4 160.2,297.4 169.8,303.2 179.3,308.0 188.7,312.3 198.0,316.0 207.3,319.4 216.6,322.5 225.7,325.3 234.8,327.9 243.8,330.3 252.8,332.5 261.7,334.7 270.5,336.7 279.3,338.6 288.0,340.4 296.6,342.2 305.2,343.8 313.7,345.4 322.2,347.0 330.5,348.5 338.8,349.9 347.1,351.3 355.3,352.6 363.4,353.9 371.4,355.2 379.4,356.5 387.3,357.7 395.2,358.8 403.0,360.0 410.7,361.1 418.4,362.2 426.0,363.3 433.5,364.3 441.0,365.4 448.4,366.4 455.7,367.4 463.0,368.3 470.2,369.3 477.3,370.2 484.4,371.2 491.4,372.1 498.3,373.0 505.2,373.9 512.0,374.7 518.8,375.6 525.5,376.4 532.1,377.3 538.6,378.1 545.1,378.9 551.5,379.7 557.9,380.5 564.2,381.3 570.4,382.1 576.6,382.9 582.7,383.6 588.7,384.4 594.7,385.1 600.6,385.9 606.4,386.6 612.2,387.3 617.9,388.1 623.6,388.8 629.1,389.5 634.6,390.2 640.1,390.9 645.5,391.6 650.8,392.2 656.0,392.9 661.2,393.6 666.4,394.2 671.4,394.9 676.4,395.6 681.3,396.2 686.2,396.9 691.0,397.5 695.7,398.1 700.4,398.8" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="doty" r="6"><animate attributeName="cx" values="121.4;188.7;243.8;305.2;363.4;410.7;463.0;512.0;551.5;594.7;634.6;666.4;700.4" keyTimes="0.0000;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1.0000" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="248.0;312.3;330.3;343.8;353.9;361.1;368.3;374.7;379.7;385.1;390.2;394.2;398.8" keyTimes="0.0000;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1.0000" dur="12s" repeatCount="indefinite"/></circle>
  <text class="small" x="24" y="528">3.60 V、40 mΩ、2 Ah、k=1.15 都是示意。端电压近似平均电压。截止约 2.5 V 以内，不外推到 0 C。</text>
</svg>
