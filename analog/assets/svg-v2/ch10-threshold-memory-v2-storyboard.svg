<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 910" role="img" aria-labelledby="title desc">
<title id="title">RESET、TRIG、THRES 按优先级改变状态</title><desc id="desc">示意 9 V、标称 3/6 V 门限；不在相等边界判定保证状态。</desc>

<defs>
<linearGradient id="bgL" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#fdf8ea"/><stop offset="1" stop-color="#f6eedb"/>
</linearGradient>
<linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#141310"/><stop offset="1" stop-color="#1d1a14"/>
</linearGradient>
<radialGradient id="vig" cx="0.5" cy="0.44" r="0.78">
<stop offset="0.55" stop-color="#16202b" stop-opacity="0"/>
<stop offset="1" stop-color="#16202b" stop-opacity="0.055"/>
</radialGradient>
<linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#a4630f" stop-opacity="0.10"/>
<stop offset="0.55" stop-color="#a4630f" stop-opacity="0.028"/>
<stop offset="1" stop-color="#a4630f" stop-opacity="0"/>
</linearGradient>
<linearGradient id="hdrD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#dcab63" stop-opacity="0.13"/>
<stop offset="0.55" stop-color="#dcab63" stop-opacity="0.04"/>
<stop offset="1" stop-color="#dcab63" stop-opacity="0"/>
</linearGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
<circle cx="2.5" cy="3.5" r="0.9" fill="#c9bb9d"/>
<circle cx="19" cy="11" r="0.55" fill="#c9bb9d" opacity="0.7"/>
<circle cx="11.5" cy="22" r="0.6" fill="#c9bb9d" opacity="0.55"/>
</pattern>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
<feDropShadow dx="0" dy="1.4" stdDeviation="2" flood-color="#16202b" flood-opacity="0.13"/>
</filter>
<filter id="pglow" x="-70%" y="-70%" width="240%" height="240%">
<feGaussianBlur stdDeviation="1.7" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect class="page-bg" width="720" height="910" fill="url(#bgL)"/>
<rect class="page-grain" width="720" height="910" fill="url(#dots)"/>
<rect class="page-vig" width="720" height="910" fill="url(#vig)"/>
<rect class="page-hdr" width="720" height="72" fill="url(#hdr)"/>
<style>
text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Source Han Sans SC","Noto Sans SC",sans-serif;}
line,path,polyline,polygon{stroke-linecap:round;stroke-linejoin:round}
.page-bg{fill:url(#bgL)}
.page-grain{opacity:.5}
.page-vig{opacity:1}
.page-hdr{fill:url(#hdr)}
@media (prefers-color-scheme: dark){
.page-bg{fill:url(#bgD)}
.page-grain{opacity:.34}
.page-vig{opacity:.5}
.page-hdr{fill:url(#hdrD)}
[fill="#fdf8ea"]{fill:#141310}
[stroke="#fdf8ea"]{stroke:#141310}
[fill="#f6eedb"]{fill:#1d1a14}
[stroke="#f6eedb"]{stroke:#1d1a14}
[fill="#e0d3b8"]{fill:#3b3529}
[stroke="#e0d3b8"]{stroke:#3b3529}
[fill="#c9bb9d"]{fill:#4a4436}
[stroke="#c9bb9d"]{stroke:#4a4436}
[fill="#16202b"]{fill:#ece4d3}
[stroke="#16202b"]{stroke:#ece4d3}
[fill="#37424e"]{fill:#cfc6b4}
[stroke="#37424e"]{stroke:#cfc6b4}
[fill="#5b666f"]{fill:#a79e8b}
[stroke="#5b666f"]{stroke:#a79e8b}
[fill="#8b8272"]{fill:#857c6c}
[stroke="#8b8272"]{stroke:#857c6c}
text[fill="#fdf8ea"]{fill:#f9f3e3}
[fill="#e6eff3"]{fill:#17262e}
[fill="#e4f1f3"]{fill:#15262a}
[fill="#e8efe6"]{fill:#182418}
[fill="#f6e7e1"]{fill:#281a16}
[fill="#f7eedb"]{fill:#292114}
[fill="#efe8ee"]{fill:#241c22}
text[fill="#1f5d7a"]{fill:#7fb7cf}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#1f5d7a"]{fill:#2b4d5f}
[stroke="#1f5d7a"]{stroke:#6fa3b9}
text[fill="#2f7f96"]{fill:#8ac9d8}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#2f7f96"]{fill:#2b5660}
[stroke="#2f7f96"]{stroke:#77b2c1}
text[fill="#3d6b4a"]{fill:#98c096}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#3d6b4a"]{fill:#2f4a33}
[stroke="#3d6b4a"]{stroke:#7aa87c}
text[fill="#a8321f"]{fill:#e0907a}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#a8321f"]{fill:#55231b}
[stroke="#a8321f"]{stroke:#c07a63}
text[fill="#a4630f"]{fill:#dcab63}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#a4630f"]{fill:#553a17}
[stroke="#a4630f"]{stroke:#c08a45}
text[fill="#6b3f63"]{fill:#c4a2bf}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#6b3f63"]{fill:#452c40}
[stroke="#6b3f63"]{stroke:#a17c9b}
}
</style>

<text x="36" y="36" font-size="24" fill="#2a2927" text-anchor="start">RESET、TRIG、THRES 按优先级改变状态</text>
<g data-storyboard-beat="1" transform="translate(18 65)">
<rect width="334" height="284" rx="8" fill="none" stroke="#5b666f"/>
<text x="10" y="27" font-size="20" fill="#2a2927" text-anchor="start">1. 复位优先</text>
<g transform="translate(0 0) scale(1)"><text x="12" y="65" font-size="18" fill="#2a2927" text-anchor="start">RESET：有效</text><text x="12" y="101" font-size="18" fill="#2a2927" text-anchor="start">TRIG：1 V</text><text x="12" y="137" font-size="18" fill="#2a2927" text-anchor="start">THRES：8 V</text><line x1="160" y1="55" x2="160" y2="143" stroke="#5b666f" stroke-width="2" stroke-dasharray=""/><text x="176" y="100" font-size="20" fill="#2a2927" text-anchor="start">锁存</text><line x1="220" y1="100" x2="265" y2="100" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><text x="270" y="106" font-size="24" fill="#2a2927" text-anchor="start">0</text><text x="12" y="190" font-size="20" fill="#2a2927" text-anchor="start">DISCH：导通</text><text x="12" y="230" font-size="18" fill="#2a2927" text-anchor="start">输出与放电开关同步改变</text></g>
<text x="10" y="273" font-size="18" fill="#2a2927" text-anchor="start">OUT 低，DISCH 导通</text>
</g>
<g data-storyboard-beat="2" transform="translate(368 65)">
<rect width="334" height="284" rx="8" fill="none" stroke="#5b666f"/>
<text x="10" y="27" font-size="20" fill="#2a2927" text-anchor="start">2. 触发置位</text>
<g transform="translate(0 0) scale(1)"><text x="12" y="65" font-size="18" fill="#2a2927" text-anchor="start">RESET：释放</text><text x="12" y="101" font-size="18" fill="#2a2927" text-anchor="start">TRIG：1 V</text><text x="12" y="137" font-size="18" fill="#2a2927" text-anchor="start">THRES：8 V</text><line x1="160" y1="55" x2="160" y2="143" stroke="#5b666f" stroke-width="2" stroke-dasharray=""/><text x="176" y="100" font-size="20" fill="#2a2927" text-anchor="start">锁存</text><line x1="220" y1="100" x2="265" y2="100" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><text x="270" y="106" font-size="24" fill="#2a2927" text-anchor="start">1</text><text x="12" y="190" font-size="20" fill="#2a2927" text-anchor="start">DISCH：截止</text><text x="12" y="230" font-size="18" fill="#2a2927" text-anchor="start">输出与放电开关同步改变</text></g>
<text x="10" y="273" font-size="18" fill="#2a2927" text-anchor="start">TRIG 优先于 THRES</text>
</g>
<g data-storyboard-beat="3" transform="translate(18 365)">
<rect width="334" height="284" rx="8" fill="none" stroke="#5b666f"/>
<text x="10" y="27" font-size="20" fill="#2a2927" text-anchor="start">3. 中间区记忆</text>
<g transform="translate(0 0) scale(1)"><text x="12" y="65" font-size="18" fill="#2a2927" text-anchor="start">RESET：释放</text><text x="12" y="101" font-size="18" fill="#2a2927" text-anchor="start">TRIG：4 V</text><text x="12" y="137" font-size="18" fill="#2a2927" text-anchor="start">THRES：4 V</text><line x1="160" y1="55" x2="160" y2="143" stroke="#5b666f" stroke-width="2" stroke-dasharray=""/><text x="176" y="100" font-size="20" fill="#2a2927" text-anchor="start">锁存</text><line x1="220" y1="100" x2="265" y2="100" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><text x="270" y="106" font-size="24" fill="#2a2927" text-anchor="start">1</text><text x="12" y="190" font-size="20" fill="#2a2927" text-anchor="start">DISCH：截止</text><text x="12" y="230" font-size="18" fill="#2a2927" text-anchor="start">输出与放电开关同步改变</text></g>
<text x="10" y="273" font-size="18" fill="#2a2927" text-anchor="start">保持，不是重新计算</text>
</g>
<g data-storyboard-beat="4" transform="translate(368 365)">
<rect width="334" height="284" rx="8" fill="none" stroke="#5b666f"/>
<text x="10" y="27" font-size="20" fill="#2a2927" text-anchor="start">4. 阈值复位</text>
<g transform="translate(0 0) scale(1)"><text x="12" y="65" font-size="18" fill="#2a2927" text-anchor="start">RESET：释放</text><text x="12" y="101" font-size="18" fill="#2a2927" text-anchor="start">TRIG：4 V</text><text x="12" y="137" font-size="18" fill="#2a2927" text-anchor="start">THRES：7 V</text><line x1="160" y1="55" x2="160" y2="143" stroke="#5b666f" stroke-width="2" stroke-dasharray=""/><text x="176" y="100" font-size="20" fill="#2a2927" text-anchor="start">锁存</text><line x1="220" y1="100" x2="265" y2="100" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><text x="270" y="106" font-size="24" fill="#2a2927" text-anchor="start">0</text><text x="12" y="190" font-size="20" fill="#2a2927" text-anchor="start">DISCH：导通</text><text x="12" y="230" font-size="18" fill="#2a2927" text-anchor="start">输出与放电开关同步改变</text></g>
<text x="10" y="273" font-size="18" fill="#2a2927" text-anchor="start">OUT 低，DISCH 导通</text>
</g>
<text x="26" y="704" font-size="19" fill="#2a2927" text-anchor="start">1. RESET 有效时，即使 TRIG 低，输出也保持低。</text>
<text x="26" y="736" font-size="19" fill="#2a2927" text-anchor="start">2. 释放 RESET；TRIG 低于 3 V，优先置位输出。</text>
<text x="26" y="768" font-size="19" fill="#2a2927" text-anchor="start">3. TRIG 与 THRES 都在非动作区，锁存器保留高态。</text>
<text x="26" y="800" font-size="19" fill="#2a2927" text-anchor="start">4. TRIG 已释放，THRES 超过 6 V，输出复位并放电。</text>
<text x="26" y="870" font-size="18" fill="#2a2927" text-anchor="start">示意：示意 9 V、标称 3/6 V 门限；不在相等边界判定保证状态。</text>
</svg>