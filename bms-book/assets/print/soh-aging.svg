  <text class="txt" x="40" y="72" opacity="1" style="opacity: 1;">① 容量<tspan class="small">　Q% = 100 − 20·(n/3000)^1.5。3000 次正好到 80%。</tspan></text>
  <text class="txt" x="40" y="98" opacity="1" style="opacity: 1;">② 内阻<tspan class="small">　R0 = 20 + 25·(n/3000)^0.45，单位 mΩ。起步就抬头。</tspan></text>
  <text class="txt" x="40" y="124" opacity="1" style="opacity: 1;">③ 大约 600 次<tspan class="small">　容量仍在 98% 附近，R0 已经到 32 mΩ 上下。读数在底栏。</tspan></text>
  <text class="txt" x="40" y="150" opacity="1" style="opacity: 1;">④ 口诀<tspan class="small">　先看功率。80% 只是容量那条惯用线，不是功率还在的证明。</tspan></text>
