<svg xmlns="http://www.w3.org/2000/svg" width="800" height="750" viewBox="0 -156 800 750" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>BMS 主状态机巡游动画</title>
  <desc>令牌沿状态环巡游：初始化、待机、充电、均衡、放电，任意状态下保护触发都直接拉进故障态。</desc><style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .fill-boxb { fill: #ddf4ff; }
    .fill-boxg { fill: #dafbe1; }
    .fill-boxr { fill: #ffebe9; }
    .fill-boxy { fill: #fff8c5; }
    .fill-b { fill: #0969da; }
    .fill-g { fill: #1a7f37; }
    .fill-r { fill: #cf222e; }
    .fill-y { fill: #9a6700; }
    .fill-ink { fill: #57606a; }
    .fill-muted { fill: #e2e8f0; }
    .fill-lockb { fill: #0969da; }
    .stroke-panel { stroke: #d0d7de; }
    .stroke-axis { stroke: #57606a; }
    .stroke-b { stroke: #0969da; }
    .stroke-g { stroke: #1a7f37; }
    .stroke-r { stroke: #cf222e; }
    .stroke-y { stroke: #bf8700; }
    .stroke-check { stroke: #ffffff; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .on { fill: #ffffff; font-size: 13px; font-weight: bold; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .fill-boxb { fill: #12233a; }
      .fill-boxg { fill: #0f2415; }
      .fill-boxr { fill: #3d1214; }
      .fill-boxy { fill: #2d2607; }
      .fill-b { fill: #4493f8; }
      .fill-g { fill: #3fb950; }
      .fill-r { fill: #ff7b72; }
      .fill-y { fill: #d29922; }
      .fill-ink { fill: #8b949e; }
      .fill-muted { fill: #30363d; }
      .fill-lockb { fill: #0969da; }
      .stroke-panel { stroke: #30363d; }
      .stroke-axis { stroke: #8b949e; }
      .stroke-b { stroke: #4493f8; }
      .stroke-g { stroke: #3fb950; }
      .stroke-r { stroke: #ff7b72; }
      .stroke-y { stroke: #d29922; }
      .stroke-check { stroke: #0d1117; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .on { fill: #ffffff; }
      .lineb { stroke: #4493f8; }
    }
</style><rect class="bg" x="0" y="-156" width="800" height="750" /><text class="title" x="24" y="-128">BMS 的一天：状态机巡游</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① BMS 的一天：状态机巡游<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 令牌走一遍：初始化 → 待机 → 充电 → 均衡 → 待机 → 放电 →（保护触发）<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 工程规则：所有迁移集中在状态机一处管理；任意状态下保护触发都可直接拉进"故障"<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="538" width="752" height="44" rx="6" /><text class="small" x="40" y="566">示意门槛见保护去抖：4.25 V 触发，4.15 V 才谈恢复。</text><rect width="800" height="530" class="bg" />
  <g stroke-width="2" fill="none" class="stroke-axis">
    <path d="M130,95 L195,168" />
    <path d="M268,168 L385,95" />
    <path d="M480,80 H550" />
    <path d="M585,110 L268,192" />
    <path d="M268,232 L385,305" />
    <path d="M480,320 H550" />
    <path d="M585,290 L268,232" />
    <path d="M195,232 L130,305" />
  </g>
  <g font-size="12" class="fill-ink">
    <text x="128" y="140" class="small">自检通过</text>
    <text x="322" y="120" class="small">插充电器</text>
    <text x="500" y="72" class="small">充满·压差大</text>
    <text x="470" y="140" class="small">均衡完成</text>
    <text x="316" y="286" class="small">接负载</text>
    <text x="500" y="312" class="small">保护触发</text>
    <text x="470" y="252" class="small">恢复条件</text>
    <text x="118" y="280" class="small">静置超时</text>
  </g>

  
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <rect x="60" y="55" width="110" height="50" rx="10" stroke-width="2" class="fill-boxb stroke-axis" />
    <text x="115" y="86" class="hi">初始化</text>
    <rect x="205" y="175" width="110" height="50" rx="10" stroke-width="2" class="panel stroke-axis" />
    <text x="260" y="206" class="txt">待机</text>
    <rect x="385" y="55" width="110" height="50" rx="10" stroke-width="2" class="fill-boxg stroke-axis" />
    <text x="440" y="86" class="ok">充电</text>
    <rect x="565" y="55" width="110" height="50" rx="10" stroke-width="2" class="fill-boxy stroke-axis" />
    <text x="620" y="86" class="gold">均衡</text>
    <rect x="385" y="295" width="110" height="50" rx="10" stroke-width="2" class="fill-boxb stroke-axis" />
    <text x="440" y="326" class="hi">放电</text>
    <rect x="565" y="295" width="110" height="50" rx="10" stroke-width="2" class="fill-boxr stroke-axis" />
    <text x="620" y="326" class="warn">故障</text>
    <rect x="60" y="295" width="110" height="50" rx="10" stroke-width="2" class="panel stroke-axis" />
    <text x="115" y="326" class="small">休眠</text>
  </g>

  
  <g fill="none" stroke-width="3" class="stroke-g">
    <rect x="56" y="51" width="118" height="58" rx="12" opacity="0">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.05;0.08;1" dur="12s" repeatCount="indefinite" />
    </rect>
    <rect x="381" y="51" width="118" height="58" rx="12" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.28;0.33;0.36;1" dur="12s" repeatCount="indefinite" />
    </rect>
    <rect x="561" y="51" width="118" height="58" rx="12" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.38;0.41;0.46;0.49;1" dur="12s" repeatCount="indefinite" />
    </rect>
    <rect x="381" y="291" width="118" height="58" rx="12" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.63;0.66;0.72;0.75;1" dur="12s" repeatCount="indefinite" />
    </rect>
    <rect x="561" y="291" width="118" height="58" rx="12" opacity="0" class="stroke-r">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.76;0.79;0.86;0.89;1" dur="12s" repeatCount="indefinite" />
    </rect>
    <rect x="56" y="291" width="118" height="58" rx="12" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.92;0.95;1" dur="12s" repeatCount="indefinite" />
    </rect>
  </g>

  
  <circle r="9" stroke-width="2" class="fill-g stroke-check">
    <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;0.099;0.099;0.225;0.225;0.331;0.331;0.553;0.553;0.679;0.679;0.785;0.785;1;1" keyTimes="0;0.06;0.12;0.18;0.25;0.33;0.38;0.46;0.54;0.57;0.63;0.72;0.76;0.86;0.92;1" path="M115,80 L260,200 L440,80 L620,80 L260,200 L440,320 L620,320 L260,200 L115,320" />
  </circle>

  <text x="400" y="392" text-anchor="middle" font-size="14" class="small">令牌走一遍：初始化 → 待机 → 充电 → 均衡 → 待机 → 放电 →（保护触发）故障 → 恢复 → 休眠</text>
  <text x="400" y="416" text-anchor="middle" font-size="13" class="small">工程规则：所有迁移集中在状态机一处管理；任意状态下保护触发都可直接拉进"故障"</text>

  <rect x="40" y="432" width="720" height="84" rx="8" class="panel stroke-r" />
  <text x="56" y="458" font-size="14" font-weight="bold" class="warn">锁存：故障态里电压掉回恢复线以下，令牌也不自动离开。</text>
  <text x="56" y="482" font-size="13" class="small">图上的「恢复条件」含清除锁存，并且原因已经消失。只看电压回落，会在门槛附近来回抖。</text>
  <text x="56" y="504" font-size="13" class="gold">
    <animate attributeName="opacity" values="1;0.25;1" keyTimes="0;0.5;1" dur="2.4s" repeatCount="indefinite" />
    示意门槛见保护去抖：4.25 V 触发，4.15 V 才谈恢复。
  </text>

</svg>