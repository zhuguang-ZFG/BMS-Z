- id: ch12-bias-offset-v2
  source: docs/p2-02-ch12.md#12.13
  before: '**算一笔**：$R_s = 1\text{M}\Omega$ 的光电二极管 / 高阻传感器（25°C），代入 $V_{err} = I_b \cdot R_s$（下图两张卡片）。BJT 的 $I_b$ **每升 10°C 大约翻一倍**，到 40°C 就是 80mV，彻底不可用；CMOS 好了**四个数量级**。'
