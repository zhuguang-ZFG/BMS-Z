<svg xmlns="http://www.w3.org/2000/svg" width="800" height="740" viewBox="0 -156 800 740" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>Modbus RTU 帧解析与 RS485 差分波形动画</title>
  <desc>8 个字节从地址扫到 CRC。A 线为高的那段，B 线为低，A−B 为正。电平是示意，不是示波器。</desc>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .fill-boxb { fill: #ddf4ff; }
    .fill-boxg { fill: #dafbe1; }
    .fill-boxr { fill: #ffebe9; }
    .fill-boxy { fill: #fff8c5; }
    .fill-b { fill: #0969da; }
    .fill-g { fill: #1a7f37; }
    .fill-r { fill: #cf222e; }
    .fill-y { fill: #9a6700; }
    .fill-ink { fill: #57606a; }
    .fill-muted { fill: #e2e8f0; }
    .fill-lockb { fill: #0969da; }
    .stroke-panel { stroke: #d0d7de; }
    .stroke-axis { stroke: #57606a; }
    .stroke-b { stroke: #0969da; }
    .stroke-g { stroke: #1a7f37; }
    .stroke-r { stroke: #cf222e; }
    .stroke-y { stroke: #bf8700; }
    .stroke-check { stroke: #ffffff; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .on { fill: #ffffff; font-size: 13px; font-weight: bold; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .fill-boxb { fill: #12233a; }
      .fill-boxg { fill: #0f2415; }
      .fill-boxr { fill: #3d1214; }
      .fill-boxy { fill: #2d2607; }
      .fill-b { fill: #4493f8; }
      .fill-g { fill: #3fb950; }
      .fill-r { fill: #ff7b72; }
      .fill-y { fill: #d29922; }
      .fill-ink { fill: #8b949e; }
      .fill-muted { fill: #30363d; }
      .fill-lockb { fill: #0969da; }
      .stroke-panel { stroke: #30363d; }
      .stroke-axis { stroke: #8b949e; }
      .stroke-b { stroke: #4493f8; }
      .stroke-g { stroke: #3fb950; }
      .stroke-r { stroke: #ff7b72; }
      .stroke-y { stroke: #d29922; }
      .stroke-check { stroke: #0d1117; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .on { fill: #ffffff; }
      .lineb { stroke: #4493f8; }
    }
</style><rect class="bg" x="0" y="-156" width="800" height="740" /><text class="title" x="24" y="-128">一帧 Modbus RTU：8 个字节各司其职</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 一帧 Modbus RTU：8 个字节各司其职<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 从机地址 = 1：叫的是 1 号 BMS<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 功能码 03：读保持寄存器<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="528" width="752" height="44" rx="6" /><text class="small" x="40" y="556">长总线两端各并一颗 120Ω。少了终端电阻，回波会把帧咬坏。示意。</text><rect width="800" height="520" class="bg" />
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <rect x="60" y="60" width="80" height="46" rx="6" stroke-width="1.5" class="fill-boxb stroke-axis" />
    <text x="100" y="89" class="hi">01</text>
    <rect x="145" y="60" width="80" height="46" rx="6" stroke-width="1.5" class="fill-boxb stroke-axis" />
    <text x="185" y="89" class="hi">03</text>
    <rect x="230" y="60" width="80" height="46" rx="6" stroke-width="1.5" class="fill-boxb stroke-axis" />
    <text x="270" y="89" class="hi">00</text>
    <rect x="315" y="60" width="80" height="46" rx="6" stroke-width="1.5" class="fill-boxb stroke-axis" />
    <text x="355" y="89" class="hi">6B</text>
    <rect x="400" y="60" width="80" height="46" rx="6" stroke-width="1.5" class="fill-boxb stroke-axis" />
    <text x="440" y="89" class="hi">00</text>
    <rect x="485" y="60" width="80" height="46" rx="6" stroke-width="1.5" class="fill-boxb stroke-axis" />
    <text x="525" y="89" class="hi">03</text>
    <rect x="570" y="60" width="80" height="46" rx="6" stroke-width="1.5" class="fill-boxy stroke-axis" />
    <text x="610" y="89" class="gold">76</text>
    <rect x="655" y="60" width="80" height="46" rx="6" stroke-width="1.5" class="fill-boxy stroke-axis" />
    <text x="695" y="89" class="gold">87</text>
  </g>

  
  <rect x="56" y="54" width="88" height="58" rx="8" fill="none" stroke-width="3" class="stroke-y">
    <animate attributeName="x" values="56;56;141;226;311;396;481;566;651;651" keyTimes="0;0.08;0.18;0.28;0.38;0.48;0.58;0.68;0.78;1" calcMode="discrete" dur="12s" repeatCount="indefinite" />
  </rect>

  
  <g font-size="14">
    <text x="100" y="140" opacity="0" class="hi">从机地址 = 1：叫的是 1 号 BMS<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.15;0.18;1" dur="12s" repeatCount="indefinite" /></text>
    <text x="100" y="140" opacity="0" class="hi">功能码 03：读保持寄存器<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.18;0.21;0.25;0.28;1" dur="12s" repeatCount="indefinite" /></text>
    <text x="100" y="140" opacity="0" class="hi">起始地址高字节 0x00<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.31;0.35;0.38;1" dur="12s" repeatCount="indefinite" /></text>
    <text x="100" y="140" opacity="0" class="hi">起始地址低字节 0x6B → 从寄存器 0x006B 开始<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.38;0.41;0.45;0.48;1" dur="12s" repeatCount="indefinite" /></text>
    <text x="100" y="140" opacity="0" class="hi">数量高字节 0x00<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.48;0.51;0.55;0.58;1" dur="12s" repeatCount="indefinite" /></text>
    <text x="100" y="140" opacity="0" class="hi">数量 = 3 个寄存器（比如：SOC、总压、电流）<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.58;0.61;0.65;0.68;1" dur="12s" repeatCount="indefinite" /></text>
    <text x="100" y="140" opacity="0" class="gold">CRC16 低字节：算出来的校验必须对上，否则整帧作废<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.68;0.71;0.75;0.78;1" dur="12s" repeatCount="indefinite" /></text>
    <text x="100" y="140" opacity="0" class="gold">CRC16 高字节——帧完整，交给从机执行！<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.78;0.81;0.9;0.93;1" dur="12s" repeatCount="indefinite" /></text>
  </g>

  
  <text x="60" y="200" font-size="15" font-weight="bold" class="txt">物理层：RS485 差分波形</text>
  <line x1="60" y1="270" x2="740" y2="270" stroke-width="1" class="stroke-panel" />
  <line x1="60" y1="330" x2="740" y2="330" stroke-width="1" class="stroke-panel" />
  <text x="16" y="246" font-size="12" class="hi">A 线</text>
  <text x="16" y="300" font-size="12" class="gold">B 线</text>
  
  <path d="M90,250 H180 V270 H270 V250 H360 V270 H450 V250 H540 V250 H630 V270 H720" fill="none" stroke-width="2.5" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000" class="stroke-b">
    <animate attributeName="stroke-dashoffset" values="1000;0;0" keyTimes="0;0.5;1" dur="12s" repeatCount="indefinite" />
  </path>
  
  <path d="M90,330 H180 V310 H270 V330 H360 V310 H450 V330 H540 V330 H630 V310 H720" fill="none" stroke-width="2.5" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000" class="stroke-y">
    <animate attributeName="stroke-dashoffset" values="1000;0;0" keyTimes="0;0.5;1" dur="12s" repeatCount="indefinite" />
  </path>
  <text x="84" y="396" text-anchor="end" font-size="12" class="txt">A−B</text>
  <line x1="90" y1="392" x2="740" y2="392" stroke-width="1" class="stroke-panel" />
  <path d="M90,374 H180 V410 H270 V374 H360 V410 H450 V374 H630 V410 H720" fill="none" stroke-width="2.5" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000" class="stroke-b">
    <animate attributeName="stroke-dashoffset" values="1000;0;0" keyTimes="0;0.5;1" dur="12s" repeatCount="indefinite" />
  </path>
  <g font-size="12" opacity="0" class="fill-ink">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.55;0.6;1" dur="12s" repeatCount="indefinite" />
    <text x="90" y="444">A 高时 B 低，A−B 为正（示意）。接收端看差值，不看单线对地电压。</text>
    <text x="90" y="466">长总线两端各并一颗 120Ω。少了终端电阻，回波会把帧咬坏。</text>
  </g>

  <text x="400" y="500" text-anchor="middle" font-size="13" class="small">记忆钩子：地址叫谁、功能码干什么、数据在哪、CRC 防讹传——四件事说全就是一帧</text>
</svg>