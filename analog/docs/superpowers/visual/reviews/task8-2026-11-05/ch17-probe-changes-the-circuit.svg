<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1448 1086" role="img" aria-labelledby="title desc" data-print-width-mm="138" data-composition="technical-overlay-v1" data-base-medium="python-svg"><title id="title">探头改变电路时的四象限</title><desc id="desc">两轴四象限：无扰动无故障为常态；接探头反而正常说明探头电容补了相位裕度；拔探头就故障说明电路本在临界稳定；手靠近才振荡指向容性耦合与人体天线。</desc><rect width="1448" height="1086" fill="#e2d9cf" /><g id="paper-illustration"><path data-paper-shadow="true" transform="translate(8 12)" d="M290,228 L756.4200000000001,226 L1377,229 L1380,597.64 L1377,876 L701.72,878 L286,874 Z" fill="#535453" opacity="0.08" /><path data-paper-shadow="true" transform="translate(4 7)" d="M290,228 L756.4200000000001,226 L1377,229 L1380,597.64 L1377,876 L701.72,878 L286,874 Z" fill="#535453" opacity="0.12" /><path data-paper-shadow="true" transform="translate(2 3)" d="M290,228 L756.4200000000001,226 L1377,229 L1380,597.64 L1377,876 L701.72,878 L286,874 Z" fill="#535453" opacity="0.15" /><path d="M290,228 L756.4200000000001,226 L1377,229 L1380,597.64 L1377,876 L701.72,878 L286,874 Z" fill="#f6f2ed" stroke="#c4b9ab" stroke-width="1.4" /><path d="M292,230L1373,231" fill="none" stroke="#ffffff" stroke-width="2" opacity=".7" /><path d="M304,240 L1364,242 L1366,862 L306,864 Z" fill="none" stroke="#c4b9ab" stroke-width="2" opacity=".55" />
<line x1="300" y1="878" x2="1380" y2="878" stroke="#c4b9ab" stroke-width="3" stroke-dasharray="" /><polygon points="1380,878 1367.0,871.0 1367.0,885.0" fill="#c4b9ab" />
<line x1="300" y1="878" x2="300" y2="226" stroke="#c4b9ab" stroke-width="3" stroke-dasharray="" /><polygon points="300,226 293.0,239.0 307.0,239.0" fill="#c4b9ab" />
<rect x="312" y="564" width="512" height="296" fill="none" stroke="#c4b9ab" stroke-width="1.4" stroke-dasharray="6,6" />
<rect x="854" y="564" width="512" height="296" fill="none" stroke="#c4b9ab" stroke-width="1.4" stroke-dasharray="6,6" />
<rect x="312" y="238" width="512" height="296" fill="none" stroke="#c4b9ab" stroke-width="1.4" stroke-dasharray="6,6" />
<rect x="854" y="238" width="512" height="296" fill="none" stroke="#c4b9ab" stroke-width="1.4" stroke-dasharray="6,6" /></g><g id="technical-overlay"><text x="72" y="92" fill="#2a2927" font-size="50" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">探头一挂，故障消失</text>
<text x="74" y="146" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">测量动作本身成了电路的一部分；先判断是“治好了”还是“藏起来了”。</text>
<text x="842" y="926" fill="#535453" font-size="33" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#e2d9cf">扰动加入 →</text>
<text x="246" y="552" fill="#535453" font-size="33" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle" data-background="#e2d9cf">故障出现 →</text>
<text x="334" y="608" fill="#2a2927" font-size="36" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">常态：都不出现</text>
<text x="334" y="658" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">先建立基线</text>
<text x="334" y="706" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">记录温度与负载</text>
<text x="876" y="608" fill="#a4441d" font-size="36" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">接探头→正常</text>
<text x="876" y="658" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">探头电容补了相位裕度</text>
<text x="876" y="706" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">换 ×10 档复测</text>
<text x="334" y="282" fill="#a4441d" font-size="36" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">拔探头→故障</text>
<text x="334" y="332" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">电路本就在临界稳定</text>
<text x="334" y="380" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">修电路，不修现象</text>
<text x="876" y="282" fill="#2a2927" font-size="36" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">手靠近→振荡</text>
<text x="876" y="332" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">容性耦合 / 人体天线</text>
<text x="876" y="380" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">移开手或加屏蔽</text>
<path data-paper-shadow="true" transform="translate(8 12)" d="M68,988 L631.6,986 L1381,989 L1384,1030.46 L1381,1062 L565.6,1064 L64,1060 Z" fill="#535453" opacity="0.08" /><path data-paper-shadow="true" transform="translate(4 7)" d="M68,988 L631.6,986 L1381,989 L1384,1030.46 L1381,1062 L565.6,1064 L64,1060 Z" fill="#535453" opacity="0.12" /><path data-paper-shadow="true" transform="translate(2 3)" d="M68,988 L631.6,986 L1381,989 L1384,1030.46 L1381,1062 L565.6,1064 L64,1060 Z" fill="#535453" opacity="0.15" /><path d="M68,988 L631.6,986 L1381,989 L1384,1030.46 L1381,1062 L565.6,1064 L64,1060 Z" fill="#f6f2ed" stroke="#c4b9ab" stroke-width="1.4" /><path d="M70,990L1377,991" fill="none" stroke="#ffffff" stroke-width="2" opacity=".7" />
<text x="92" y="1036" fill="#2a2927" font-size="33" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">扰动消失不等于故障消失；先用高阻档或隔离复现，再下结论。</text></g></svg>
