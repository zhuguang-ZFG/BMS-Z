    <animate calcMode="spline" keySplines="0.16 1 0.3 1;0.7 0 0.84 0" attributeName="y" values="150;202;150" keyTimes="0;0.45;1" dur="8s" repeatCount="indefinite" />
  </rect>
  <text x="105" y="268" text-anchor="middle" font-size="12" class="txt">高节</text>
