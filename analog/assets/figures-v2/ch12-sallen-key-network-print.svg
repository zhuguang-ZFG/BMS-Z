<path d="M500 155 L525 155" fill="none" stroke="#16202b" stroke-width="3"/><path d="M525 135 L525 175" fill="none" stroke="#16202b" stroke-width="3"/><path d="M537 135 L537 175" fill="none" stroke="#16202b" stroke-width="3"/><path d="M537 155 L565 155" fill="none" stroke="#16202b" stroke-width="3"/><text x="530" y="125" font-size="23" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">C1</text>
