<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">负反馈四种拓扑：稳定什么，就采样什么</text>

<text x="400" y="60" text-anchor="middle" font-size="11" fill="#5b666f">反馈网络只干两件事：采样一个量、混合回输入 → 2×2 = 四种拓扑</text>
<rect x="30" y="86" width="164" height="150" rx="9" fill="#f6eedb" stroke="#1f5d7a" stroke-width="1.8"/><text x="112" y="112" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1f5d7a">采样电压 · 串联混合</text><path d="M42 124 Q112.00 124.35 182 124" fill="none" stroke="#c9bb9d" stroke-width="1"/><text x="42" y="146" font-size="10.5" fill="#5b666f">钉死的量</text><text x="112" y="168" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f5d7a">电压增益 A_v</text><text x="42" y="190" font-size="10.5" fill="#5b666f">等效身份</text><text x="182" y="190" text-anchor="end" font-size="10.5" font-weight="bold" fill="#37424e">压控压源</text><text x="42" y="210" font-size="10.5" fill="#5b666f">输入阻抗</text><text x="182" y="210" text-anchor="end" font-size="10.5" font-weight="bold" fill="#1f5d7a">↑</text><text x="42" y="228" font-size="10.5" fill="#5b666f">输出阻抗</text><text x="182" y="228" text-anchor="end" font-size="10.5" font-weight="bold" fill="#1f5d7a">↓</text>
<rect x="213" y="86" width="164" height="150" rx="9" fill="#f6eedb" stroke="#3d6b4a" stroke-width="1.8"/><text x="295" y="112" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3d6b4a">采样电压 · 并联混合</text><path d="M225 124 Q295.00 123.70 365 124" fill="none" stroke="#c9bb9d" stroke-width="1"/><text x="225" y="146" font-size="10.5" fill="#5b666f">钉死的量</text><text x="295" y="168" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3d6b4a">跨阻 V_out/I_in</text><text x="225" y="190" font-size="10.5" fill="#5b666f">等效身份</text><text x="365" y="190" text-anchor="end" font-size="10.5" font-weight="bold" fill="#37424e">流控压源</text><text x="225" y="210" font-size="10.5" fill="#5b666f">输入阻抗</text><text x="365" y="210" text-anchor="end" font-size="10.5" font-weight="bold" fill="#3d6b4a">↓</text><text x="225" y="228" font-size="10.5" fill="#5b666f">输出阻抗</text><text x="365" y="228" text-anchor="end" font-size="10.5" font-weight="bold" fill="#3d6b4a">↓</text>
<rect x="396" y="86" width="164" height="150" rx="9" fill="#f6eedb" stroke="#6b3f63" stroke-width="1.8"/><text x="478" y="112" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6b3f63">采样电流 · 串联混合</text><path d="M408 124 Q478.00 123.65 548 124" fill="none" stroke="#c9bb9d" stroke-width="1"/><text x="408" y="146" font-size="10.5" fill="#5b666f">钉死的量</text><text x="478" y="168" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#6b3f63">跨导 I_out/V_in</text><text x="408" y="190" font-size="10.5" fill="#5b666f">等效身份</text><text x="548" y="190" text-anchor="end" font-size="10.5" font-weight="bold" fill="#37424e">压控流源</text><text x="408" y="210" font-size="10.5" fill="#5b666f">输入阻抗</text><text x="548" y="210" text-anchor="end" font-size="10.5" font-weight="bold" fill="#6b3f63">↑</text><text x="408" y="228" font-size="10.5" fill="#5b666f">输出阻抗</text><text x="548" y="228" text-anchor="end" font-size="10.5" font-weight="bold" fill="#6b3f63">↑</text>
<rect x="579" y="86" width="164" height="150" rx="9" fill="#f6eedb" stroke="#a4630f" stroke-width="1.8"/><text x="661" y="112" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a4630f">采样电流 · 并联混合</text><path d="M591 124 Q661.00 124.20 731 124" fill="none" stroke="#c9bb9d" stroke-width="1"/><text x="591" y="146" font-size="10.5" fill="#5b666f">钉死的量</text><text x="661" y="168" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a4630f">电流增益 A_i</text><text x="591" y="190" font-size="10.5" fill="#5b666f">等效身份</text><text x="731" y="190" text-anchor="end" font-size="10.5" font-weight="bold" fill="#37424e">流控流源</text><text x="591" y="210" font-size="10.5" fill="#5b666f">输入阻抗</text><text x="731" y="210" text-anchor="end" font-size="10.5" font-weight="bold" fill="#a4630f">↓</text><text x="591" y="228" font-size="10.5" fill="#5b666f">输出阻抗</text><text x="731" y="228" text-anchor="end" font-size="10.5" font-weight="bold" fill="#a4630f">↑</text>
<path d="M30 258 Q400.00 258.15 770 258" fill="none" stroke="#c9bb9d" stroke-width="1"/>
<text x="40" y="288" font-size="12.5" font-weight="bold" fill="#37424e">判读口诀</text>
<text x="40" y="314" font-size="11.5" fill="#5b666f">想稳<tspan font-weight="bold" fill="#059669">电压</tspan> → 采样电压（输出阻抗跟着<tspan font-weight="bold">降</tspan>）　·　想稳<tspan font-weight="bold" fill="#dc2626">电流</tspan> → 采样电流（输出阻抗跟着<tspan font-weight="bold">升</tspan>）</text>
<text x="40" y="338" font-size="11.5" fill="#5b666f">想保<tspan font-weight="bold" fill="#2563eb">输入阻抗</tspan> → 串联混合　·　想泄放输入电流 → 并联混合</text>
<rect x="40" y="362" width="720" height="88" rx="8" fill="#e6eff3" stroke="#1f5d7a" stroke-width="1.6"/>
<text x="58" y="388" font-size="12" font-weight="bold" fill="#1f5d7a">已经见过的一个例子：发射极电阻 Re（3.5 节）</text>
<text x="58" y="412" font-size="11.5" fill="#5b666f">它从输出回路<tspan font-weight="bold">串联采样电流</tspan>、再<tspan font-weight="bold">串联混合</tspan>回输入 → 属于「电流串联」</text>
<text x="58" y="436" font-size="11.5" fill="#5b666f">所以它钉死的是 I_C、把输出阻抗抬高了——这正是恒流源想要的性质</text>
<path d="M40 474 Q400.00 473.06 760 474" fill="none" stroke="#c9bb9d" stroke-width="1"/>
<text x="400" y="502" text-anchor="middle" font-size="12" font-weight="bold" fill="#a4630f">反馈什么时候翻脸成振荡？</text>
<text x="400" y="526" text-anchor="middle" font-size="11.5" fill="#5b666f">内部极点每级贡献最多 −90° 相移；攒够 −180° 时负反馈原地转正反馈</text>
<text x="400" y="548" text-anchor="middle" font-size="11.5" fill="#5b666f">此时若 |Aβ| ≥ 1 → 自激振荡；|Aβ| &lt; 1 → 只是振铃。相位裕度底线 45°，舒适 60°</text>
<text x="400" y="576" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1f5d7a">救法：密勒补偿造一个足够低的主极点，让增益在危险相移攒够前先滚到 1 以下</text>
<rect x="38" y="118" width="148" height="60" rx="8" fill="none" stroke="#1f5d7a" stroke-width="2.5" opacity="0" filter="url(#pglow)"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.0s" repeatCount="indefinite"/></rect>
<rect x="221" y="118" width="148" height="60" rx="8" fill="none" stroke="#3d6b4a" stroke-width="2.5" opacity="0" filter="url(#pglow)"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.0s" repeatCount="indefinite"/></rect>
<rect x="404" y="118" width="148" height="60" rx="8" fill="none" stroke="#6b3f63" stroke-width="2.5" opacity="0" filter="url(#pglow)"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.0s" repeatCount="indefinite"/></rect>
<rect x="587" y="118" width="148" height="60" rx="8" fill="none" stroke="#a4630f" stroke-width="2.5" opacity="0" filter="url(#pglow)"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.0s" repeatCount="indefinite"/></rect>
<circle r="5" fill="#1f5d7a"><animateMotion dur="11s" repeatCount="indefinite" path="M60,246 L196,246" keyPoints="0;1" keyTimes="0;1"/></circle>
<circle r="5" fill="#a4630f"><animateMotion dur="11s" begin="-1.6s" repeatCount="indefinite" path="M610,246 L742,246" keyPoints="0;1" keyTimes="0;1"/></circle>
<circle r="5" fill="#3d6b4a"><animateMotion dur="11s" begin="-0.8s" repeatCount="indefinite" path="M243,246 L379,246"/></circle>
<circle r="5" fill="#6b3f63"><animateMotion dur="11s" begin="-0.8s" repeatCount="indefinite" path="M426,246 L562,246"/></circle>
<circle cx="112" cy="168" r="5" fill="none" stroke="#1f5d7a" stroke-width="2.2"><animate attributeName="r" values="5;13;5" dur="2.2s" repeatCount="indefinite"/></circle>
<circle cx="295" cy="168" r="5" fill="none" stroke="#3d6b4a" stroke-width="2.2"><animate attributeName="r" values="5;13;5" dur="2.2s" begin="-1.1s" repeatCount="indefinite"/></circle>
<circle cx="478" cy="168" r="5" fill="none" stroke="#6b3f63" stroke-width="2.2"><animate attributeName="r" values="5;13;5" dur="2.2s" begin="-0.55s" repeatCount="indefinite"/></circle>
<circle cx="661" cy="168" r="5" fill="none" stroke="#a4630f" stroke-width="2.2"><animate attributeName="r" values="5;13;5" dur="2.2s" begin="-1.65s" repeatCount="indefinite"/></circle>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.03;0.2;0.25;1" dur="11s" repeatCount="indefinite"/><rect x="185.7" y="593.0" width="428.5" height="24.1" rx="12.0" fill="#1f5d7a" fill-opacity="0.09" stroke="#1f5d7a" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.25;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="606" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1f5d7a" opacity="0">① 采样决定「稳什么」：采样电压稳电压、采样电流稳电流<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.25;1" dur="11s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="11s" repeatCount="indefinite"/><rect x="170.6" y="593.0" width="458.8" height="24.1" rx="12.0" fill="#3d6b4a" fill-opacity="0.09" stroke="#3d6b4a" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="606" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#3d6b4a" opacity="0">② 混合决定「阻抗往哪走」：串联升输入阻抗、并联降输入阻抗<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="11s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="11s" repeatCount="indefinite"/><rect x="158.9" y="593.0" width="482.2" height="24.1" rx="12.0" fill="#6b3f63" fill-opacity="0.09" stroke="#6b3f63" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="606" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#6b3f63" opacity="0">③ 四种拓扑各有身份：压控压源 / 流控压源 / 压控流源 / 流控流源<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="11s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/><rect x="167.2" y="593.0" width="465.6" height="24.1" rx="12.0" fill="#a4630f" fill-opacity="0.09" stroke="#a4630f" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="606" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#a4630f" opacity="0">④ 别忘后半段：相移攒够 180° 且 |Aβ|≥1，负反馈就变振荡器<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/></text></g></svg>