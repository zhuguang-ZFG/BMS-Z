  <circle class="dotb" r="6" cx="108.0" cy="247.7"><animate data-ease="linear" attributeName="cx" values="108.0;222.4;394.0;680.0;680.0" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite"/><animate data-ease="linear" attributeName="cy" values="247.7;258.2;289.1;364.9;364.9" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite"/></circle>
  <rect class="panel" x="24" y="480" width="752" height="64" rx="6"/>
  <text class="small" x="40.0" y="518.0" text-anchor="start" opacity="1">0 次　容量 100.0%　5.00 Ah　R0 20.0 mΩ<animate attributeName="opacity" values="1;0;0;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="518.0" text-anchor="start" opacity="0">600 次　容量 98.2%　4.91 Ah　R0 32.1 mΩ<animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="518.0" text-anchor="start" opacity="0">1500 次　容量 92.9%　4.65 Ah　R0 38.3 mΩ<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="518.0" text-anchor="start" opacity="0">3000 次　容量 80.0%　4.00 Ah　R0 45.0 mΩ<animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>

