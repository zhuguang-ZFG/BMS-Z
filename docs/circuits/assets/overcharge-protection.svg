  <text x="620" y="160" text-anchor="middle" font-size="12" font-weight="bold" class="txt">充电 MOS</text>

  
  <g>
    <animate attributeName="opacity" values="0;1;1;0;0;1;1" keyTimes="0;0.02;0.42;0.44;0.72;0.74;1" dur="8s" repeatCount="indefinite" />
    <circle r="6" class="fill-g"><animateMotion dur="1.6s" begin="0s" repeatCount="indefinite" path="M740,190 H170" /></circle>
    <circle r="6" class="fill-g"><animateMotion dur="1.6s" begin="-0.55s" repeatCount="indefinite" path="M740,190 H170" /></circle>
    <circle r="6" class="fill-g"><animateMotion dur="1.6s" begin="-1.1s" repeatCount="indefinite" path="M740,190 H170" /></circle>
  </g>

  
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.44;0.46;0.68;0.70;1" dur="8s" repeatCount="indefinite" />
    <g stroke-width="4" stroke-linecap="round" class="stroke-r">
      <animate attributeName="opacity" values="1;0.2;1" dur="0.7s" repeatCount="indefinite" />
      <line x1="632" y1="168" x2="656" y2="192" />
      <line x1="656" y1="168" x2="632" y2="192" />
    </g>
  </g>

  
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.44;0.47;0.63;0.66;1" dur="8s" repeatCount="indefinite" />
    <rect x="220" y="330" width="360" height="40" rx="8" class="fill-boxr stroke-r" />
    <text x="400" y="355" text-anchor="middle" font-size="15" font-weight="bold" class="warn">电压越线且超过内部延时 → 硬关断</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.74;0.78;1" dur="8s" repeatCount="indefinite" />
    <rect x="200" y="330" width="400" height="40" rx="8" class="fill-boxg stroke-g" />
    <text x="400" y="355" text-anchor="middle" font-size="15" font-weight="bold" class="ok">电压回落到恢复值 → 自动重新允许充电</text>
  </g>

  <text x="400" y="412" text-anchor="middle" font-size="13" class="small">保护三要素：阈值（4.30V）＋ 延时（内部产生，防误触发）＋ 恢复条件（电压回落）</text>
