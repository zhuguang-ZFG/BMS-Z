<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 544" font-family="ui-monospace, Consolas, monospace">
  <title>热失控早警看温升速率。示意曲线在 70 s 跨过 1 °C/s，当时温度只有 39 °C。不是实验记录。</title>
  <desc>亮点沿温度曲线走：前 40 s 缓升，40–70 s 加速，70 s 温升速率跨过 1 °C/s 时温度才 39 °C。</desc>

  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.5; fill: none; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
    }
  </style>

  <!-- formula: T=25+0.05t (t<40); 27+0.40*(t-40) (t<70); 39+1.5*(t-70)+0.08*(t-70)^2 -->
  <rect class="bg" width="800" height="544"/>
  <text class="title" x="24" y="32">温度还不高的时候，斜率已经不对了（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="128" rx="6"/>
  <text class="txt" x="40" y="72" opacity="0.28">① 前 40 s<tspan class="small">　斜率 0.05 °C/s。10 s 只涨 0.5 °C，像正常负载。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="98" opacity="0.28">② 40–70 s<tspan class="small">　斜率 0.40 °C/s，还没到 1。温度从 27 走到 39。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="124" opacity="0.28">③ 70 s 速率跨过 1<tspan class="small">　斜率变成 1.5 °C/s，随后还在加大。温度才 39 °C。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="150" opacity="0.28">④ 90 s<tspan class="small">　示意 101 °C。报警要打在 70 s，而不是等温度自己吓你。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="188" width="752" height="304" rx="6"/>
  <text class="small" x="40" y="210">温度 °C（示意）</text>
  <line class="axis" x1="108.0" y1="228.0" x2="108.0" y2="430.0"/>
  <line class="axis" x1="108.0" y1="430.0" x2="730.0" y2="430.0"/>
  <text class="small" x="730.0" y="468.0" text-anchor="end">时间 s（示意，不是燃烧实验）</text>
  <line class="grid" x1="108.0" y1="430.0" x2="108.0" y2="436.0"/>
  <text class="small" x="108.0" y="452.0" text-anchor="middle">0</text>
  <line class="grid" x1="384.4" y1="430.0" x2="384.4" y2="436.0"/>
  <text class="small" x="384.4" y="452.0" text-anchor="middle">40</text>
  <line class="grid" x1="591.8" y1="430.0" x2="591.8" y2="436.0"/>
  <text class="small" x="591.8" y="452.0" text-anchor="middle">70</text>
  <line class="grid" x1="730.0" y1="430.0" x2="730.0" y2="436.0"/>
  <text class="small" x="730.0" y="452.0" text-anchor="middle">90</text>
  <line class="grid" x1="102.0" y1="418.8" x2="108.0" y2="418.8"/>
  <text class="small" x="98.0" y="422.8" text-anchor="end">25</text>
  <line class="grid" x1="102.0" y1="387.4" x2="108.0" y2="387.4"/>
  <text class="small" x="98.0" y="391.4" text-anchor="end">39</text>
  <line class="grid" x1="102.0" y1="248.2" x2="108.0" y2="248.2"/>
  <text class="small" x="98.0" y="252.2" text-anchor="end">101</text>
  <line class="liner" x1="591.8" y1="228.0" x2="591.8" y2="430.0"/>
