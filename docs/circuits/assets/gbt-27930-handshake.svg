<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470">
  <title>GB/T 27930 充电握手动画</title>
  <rect width="800" height="470" fill="#f8fafc"/>
  <style>
  text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
  /* 深色模式：GitHub 深色主题下对调底色与文字色，只覆盖配色，不动几何与动画。
     stroke="#fff" 保持白色——那是彩色徽标上的勾选，不在覆盖范围内。 */
  @media (prefers-color-scheme: dark){
  rect[fill="#f8fafc"]{fill:#0f172a}
  rect[fill="#fff"]{fill:#1e293b}
  [fill="#f1f5f9"]{fill:#1e293b}
  [stroke="#f1f5f9"]{stroke:#1e293b}
  [fill="#e2e8f0"]{fill:#334155}
  [stroke="#e2e8f0"]{stroke:#334155}
  [fill="#cbd5e1"]{fill:#475569}
  [stroke="#cbd5e1"]{stroke:#475569}
  [fill="#64748b"]{fill:#94a3b8}
  [stroke="#64748b"]{stroke:#94a3b8}
  [fill="#475569"]{fill:#cbd5e1}
  [stroke="#475569"]{stroke:#cbd5e1}
  [fill="#334155"]{fill:#e2e8f0}
  [stroke="#334155"]{stroke:#e2e8f0}
  [fill="#1e293b"]{fill:#f1f5f9}
  [stroke="#1e293b"]{stroke:#f1f5f9}
  [fill="#dbeafe"]{fill:#1e3a8a}
  [stroke="#dbeafe"]{stroke:#1e3a8a}
  [fill="#eff6ff"]{fill:#172554}
  [stroke="#eff6ff"]{stroke:#172554}
  [fill="#bfdbfe"]{fill:#1e40af}
  [stroke="#bfdbfe"]{stroke:#1e40af}
  [fill="#1d4ed8"]{fill:#60a5fa}
  [stroke="#1d4ed8"]{stroke:#60a5fa}
  [fill="#1e40af"]{fill:#93c5fd}
  [stroke="#1e40af"]{stroke:#93c5fd}
  [fill="#2563eb"]{fill:#60a5fa}
  [stroke="#2563eb"]{stroke:#60a5fa}
  [fill="#3b82f6"]{fill:#60a5fa}
  [stroke="#3b82f6"]{stroke:#60a5fa}
  [fill="#ecfdf5"]{fill:#022c22}
  [stroke="#ecfdf5"]{stroke:#022c22}
  [fill="#a7f3d0"]{fill:#065f46}
  [stroke="#a7f3d0"]{stroke:#065f46}
  [fill="#86efac"]{fill:#166534}
  [stroke="#86efac"]{stroke:#166534}
  [fill="#065f46"]{fill:#6ee7b7}
  [stroke="#065f46"]{stroke:#6ee7b7}
  [fill="#059669"]{fill:#34d399}
  [stroke="#059669"]{stroke:#34d399}
  [fill="#fef2f2"]{fill:#450a0a}
  [stroke="#fef2f2"]{stroke:#450a0a}
  [fill="#fecaca"]{fill:#7f1d1d}
  [stroke="#fecaca"]{stroke:#7f1d1d}
  [fill="#fca5a5"]{fill:#b91c1c}
  [stroke="#fca5a5"]{stroke:#b91c1c}
  [fill="#991b1b"]{fill:#fca5a5}
  [stroke="#991b1b"]{stroke:#fca5a5}
  [fill="#dc2626"]{fill:#f87171}
  [stroke="#dc2626"]{stroke:#f87171}
  [fill="#fffbeb"]{fill:#451a03}
  [stroke="#fffbeb"]{stroke:#451a03}
  [fill="#fef3c7"]{fill:#78350f}
  [stroke="#fef3c7"]{stroke:#78350f}
  [fill="#92400e"]{fill:#fcd34d}
  [stroke="#92400e"]{stroke:#fcd34d}
  [fill="#b45309"]{fill:#fbbf24}
  [stroke="#b45309"]{stroke:#fbbf24}
  }
</style>

  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">GB/T 27930：BMS 要电，充电机跟随</text>

  <!-- 泳道 -->
  <text x="200" y="68" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">充电机（桩）</text>
  <text x="600" y="68" text-anchor="middle" font-size="14" font-weight="bold" fill="#065f46">BMS（车）</text>
  <line x1="200" y1="82" x2="200" y2="400" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="600" y1="82" x2="600" y2="400" stroke="#cbd5e1" stroke-width="2"/>

  <!-- 左侧阶段栏，当前阶段高亮。
       设计约束：animate 的值若用调色板浅色，SMIL 会压掉 @media 深色重映射（浅色底+浅字=不可见）；
       若用调色板深色，浅色模式下字看不见。唯一双模式安全的做法是「堆叠双矩形 + 只淡入淡出 opacity」：
       文字层放两组同步交叉淡入淡出——闲置组 #334155（深色模式重映射为 #e2e8f0），
       激活组 #93c5fd：它没有重映射规则，深浅模式同为浅蓝，正好配同样无规则的深蓝高亮框 #1e3a8a。 -->
  <g>
    <rect x="30" y="90" width="100" height="50" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="30" y="90" width="100" height="50" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5" opacity="0">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.18;0.22;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <text x="80" y="120" text-anchor="middle" font-size="11" fill="#334155">① 物理连接
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.18;0.22;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="80" y="120" text-anchor="middle" font-size="11" fill="#93c5fd" opacity="0">① 物理连接
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.18;0.22;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>
  <g>
    <rect x="30" y="150" width="100" height="50" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="30" y="150" width="100" height="50" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.18;0.22;0.38;0.42;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <text x="80" y="180" text-anchor="middle" font-size="11" fill="#334155">② 握手辨识
      <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.18;0.22;0.38;0.42;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="80" y="180" text-anchor="middle" font-size="11" fill="#93c5fd" opacity="0">② 握手辨识
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.18;0.22;0.38;0.42;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>
  <g>
    <rect x="30" y="210" width="100" height="50" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="30" y="210" width="100" height="50" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.38;0.42;0.58;0.62;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <text x="80" y="240" text-anchor="middle" font-size="11" fill="#334155">③ 参数配置
      <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.38;0.42;0.58;0.62;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="80" y="240" text-anchor="middle" font-size="11" fill="#93c5fd" opacity="0">③ 参数配置
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.38;0.42;0.58;0.62;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>
  <g>
    <rect x="30" y="270" width="100" height="60" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="30" y="270" width="100" height="60" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.58;0.62;0.82;0.86;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <text x="80" y="304" text-anchor="middle" font-size="11" fill="#334155">④ 充电
      <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.58;0.62;0.82;0.86;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="80" y="304" text-anchor="middle" font-size="11" fill="#93c5fd" opacity="0">④ 充电
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.58;0.62;0.82;0.86;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>
  <g>
    <rect x="30" y="340" width="100" height="50" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="30" y="340" width="100" height="50" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.86;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <text x="80" y="370" text-anchor="middle" font-size="11" fill="#334155">⑤ 结束统计
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.82;0.86;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="80" y="370" text-anchor="middle" font-size="11" fill="#93c5fd" opacity="0">⑤ 结束统计
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.86;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- ① 物理连接 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.16;0.2;1" dur="12s" repeatCount="indefinite"/>
    <line x1="200" y1="115" x2="600" y2="115" stroke="#059669" stroke-width="2.5"/>
    <circle r="5" fill="#059669">
      <animateMotion path="M200,115 L600,115" keyPoints="0;1;1" keyTimes="0;0.14;1" calcMode="linear" dur="12s" repeatCount="indefinite"/>
    </circle>
    <text x="400" y="104" text-anchor="middle" font-size="11" fill="#065f46">插枪 + 低压辅助上电 → 确认连接</text>
  </g>

  <!-- ② 握手辨识 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.18;0.22;0.36;0.4;1" dur="12s" repeatCount="indefinite"/>
    <line x1="200" y1="165" x2="592" y2="165" stroke="#2563eb" stroke-width="2"/>
    <text x="400" y="158" text-anchor="middle" font-size="11" fill="#1e40af">CHM/BHM：版本与电池信息 →</text>
    <line x1="600" y1="190" x2="208" y2="190" stroke="#059669" stroke-width="2"/>
    <text x="400" y="183" text-anchor="middle" font-size="11" fill="#065f46">← CRM 辨识（谈不拢就中止）</text>
    <circle r="4" fill="#2563eb">
      <animateMotion path="M200,165 L592,165" keyPoints="0;0;1;1" keyTimes="0;0.2;0.3;1" calcMode="linear" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#059669">
      <animateMotion path="M600,190 L208,190" keyPoints="0;0;1;1" keyTimes="0;0.26;0.36;1" calcMode="linear" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ③ 参数配置 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.38;0.42;0.56;0.6;1" dur="12s" repeatCount="indefinite"/>
    <line x1="600" y1="225" x2="208" y2="225" stroke="#059669" stroke-width="2"/>
    <text x="400" y="218" text-anchor="middle" font-size="11" fill="#065f46">← BCP：最高允许电压/电流与单体限值</text>
    <line x1="200" y1="250" x2="592" y2="250" stroke="#2563eb" stroke-width="2"/>
    <text x="400" y="243" text-anchor="middle" font-size="11" fill="#1e40af">CML/BRO/CRO：能力与就绪 →</text>
    <circle r="4" fill="#059669">
      <animateMotion path="M600,225 L208,225" keyPoints="0;0;1;1" keyTimes="0;0.4;0.48;1" calcMode="linear" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#2563eb">
      <animateMotion path="M200,250 L592,250" keyPoints="0;0;1;1" keyTimes="0;0.46;0.56;1" calcMode="linear" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ④ 充电：BMS 周期要电，充电机跟随 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.58;0.62;0.8;0.84;1" dur="12s" repeatCount="indefinite"/>
    <text x="400" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">BMS 主导：要多少，给多少</text>
    <line x1="600" y1="292" x2="208" y2="292" stroke="#059669" stroke-width="2.5"/>
    <text x="400" y="286" text-anchor="middle" font-size="11" fill="#065f46">← BCL：我要 400V/80A（示例）</text>
    <line x1="200" y1="316" x2="592" y2="316" stroke="#2563eb" stroke-width="2.5"/>
    <text x="400" y="310" text-anchor="middle" font-size="11" fill="#1e40af">CCS：输出跟随（异常立即中止）→</text>
    <circle r="4" fill="#059669">
      <animateMotion path="M600,292 L208,292" keyPoints="0;0;1;1" keyTimes="0;0.6;0.68;1" calcMode="linear" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#2563eb">
      <animateMotion path="M200,316 L592,316" keyPoints="0;0;1;1" keyTimes="0;0.66;0.74;1" calcMode="linear" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#059669">
      <animateMotion path="M600,292 L208,292" keyPoints="0;0;1;1" keyTimes="0;0.7;0.78;1" calcMode="linear" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ⑤ 结束 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.86;1" dur="12s" repeatCount="indefinite"/>
    <line x1="200" y1="365" x2="592" y2="365" stroke="#64748b" stroke-width="2"/>
    <line x1="600" y1="380" x2="208" y2="380" stroke="#64748b" stroke-width="2"/>
    <text x="400" y="358" text-anchor="middle" font-size="11" fill="#475569">BST/CST/BSD/CSD：本次充电统计 ↔</text>
  </g>

  <text x="400" y="424" text-anchor="middle" font-size="11" fill="#64748b" opacity="0">报文缩写仅作示例，帧定义以 GB/T 27930 标准原文为准
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.18;0.22;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <text x="400" y="452" text-anchor="middle" font-size="13" fill="#475569">关键：充电不是桩说了算——BMS 按电池状态要电，充电机只是跟随。</text>
</svg>
