    <animateMotion path="M400,200 L400,278" keyPoints="0;0;1;1" keyTimes="0;0.25;0.55;1" calcMode="linear" dur="12s" repeatCount="indefinite" begin="-1.8s" />
  </circle>
  <circle r="4" opacity="0" class="fill-b">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.25;0.28;1" dur="12s" repeatCount="indefinite" />
    <animateMotion path="M620,200 L620,278" keyPoints="0;0;1;1" keyTimes="0;0.25;0.55;1" calcMode="linear" dur="12s" repeatCount="indefinite" />
  </circle>
  <circle r="4" opacity="0" class="fill-b">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.25;0.28;1" dur="12s" repeatCount="indefinite" begin="-0.9s" />
    <animateMotion path="M620,200 L620,278" keyPoints="0;0;1;1" keyTimes="0;0.25;0.55;1" calcMode="linear" dur="12s" repeatCount="indefinite" begin="-0.9s" />
  </circle>
  <circle r="4" opacity="0" class="fill-b">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.25;0.28;1" dur="12s" repeatCount="indefinite" begin="-1.8s" />
    <animateMotion path="M620,200 L620,278" keyPoints="0;0;1;1" keyTimes="0;0.25;0.55;1" calcMode="linear" dur="12s" repeatCount="indefinite" begin="-1.8s" />
