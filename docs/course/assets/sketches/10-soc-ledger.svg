<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
<title id="title">电量靠逐笔记账，不靠电压猜</title><desc id="desc">恒定1 A放电持续0.5 h，电流时间图的面积为0.5 Ah。电量账本从2 Ah扣去0.5 Ah得到1.5 Ah，除以2 Ah得SOC 75%。账本及积分面积表达电量，不把电压画成液位，不使用独立练习数据。</desc>
