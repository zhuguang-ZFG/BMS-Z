<title id="figTitle">纹波判读：先问频率，再问幅度</title>
<desc id="figDesc">三栏纹波对比：100Hz 工频纹波指向整流后大电解干涸；开关频率及谐波是开关电源固有纹波；LDO 输出上的 100Hz 是从输入漏进来（压差太小或 PSRR 不够）。判读条：先问频率再问幅度，测量必须能区分候选假设。底部教学示例链路：5V 只有 3.1V、纹波 400mV → 量频率得 100Hz → 量大电解烫手、容量只剩标称三成 → 根因落定，两次测量没拆一颗芯片。</desc>
<text x="480" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">纹波判读：先问频率，再问幅度</text>
<text x="480" y="56" text-anchor="middle" font-size="13" fill="#5b666f">表 17-2 验证手法展开——同样的"纹波大"，频率指认的方向完全不同</text>
<g>
<rect x="40" y="88" width="266" height="36" rx="8" fill="#f6eedb" stroke="#37424e" stroke-width="1.6"/>
<rect x="48" y="96" width="5" height="20" rx="2.5" fill="#a8321f"/>
<text x="64" y="112" font-size="14.5" font-weight="bold" fill="#16202b">100Hz 工频纹波</text>
<rect x="56" y="140" width="234" height="112" rx="6" fill="#fdf8ea" stroke="#c9bb9d" stroke-width="1"/>
<path d="M60 196 Q173.00 196.86 286 196" fill="none" stroke="#c9bb9d" stroke-width="1" stroke-dasharray="4,4"/>
<text x="64" y="156" font-size="10.5" fill="#8b8272">全波整流后</text>
<path d="M56,196 q23,-40 47,0 t47,0 t47,0 t47,0 t47,0" fill="none" stroke="#a8321f" stroke-width="2.6"/>
<text x="40" y="282" font-size="12.5" font-weight="bold" fill="#16202b">嫌疑：整流后的大电解干涸（ESR 升高）</text>
<text x="40" y="306" font-size="11.5" fill="#5b666f">动作：换低 ESR 电解，或并联陶瓷分频段去耦</text>
</g>
<g>
<rect x="347" y="88" width="266" height="36" rx="8" fill="#f6eedb" stroke="#37424e" stroke-width="1.6"/>
<rect x="355" y="96" width="5" height="20" rx="2.5" fill="#1f5d7a"/>
<text x="371" y="112" font-size="14.5" font-weight="bold" fill="#16202b">开关频率 + 谐波</text>
<rect x="363" y="140" width="234" height="112" rx="6" fill="#fdf8ea" stroke="#c9bb9d" stroke-width="1"/>
<path d="M367 196 Q480.00 195.47 593 196" fill="none" stroke="#c9bb9d" stroke-width="1" stroke-dasharray="4,4"/>
<text x="371" y="156" font-size="10.5" fill="#8b8272">f_sw 及其谐波</text>
<path d="M363,196 q6,-11 13,0 t13,0 t13,0 t13,0 t13,0 t13,0 t13,0 t13,0 t13,0 t13,0 t13,0 t13,0 t13,0 t13,0 t13,0 t13,0 t13,0 t13,0" fill="none" stroke="#1f5d7a" stroke-width="2.2"/>
<text x="347" y="282" font-size="12.5" font-weight="bold" fill="#16202b">嫌疑：输出滤波不足（开关电源固有纹波）</text>
<text x="347" y="306" font-size="11.5" fill="#5b666f">动作：看 SW 波形找谐波源，加 LC / 磁珠</text>
</g>
<g>
<rect x="654" y="88" width="266" height="36" rx="8" fill="#f6eedb" stroke="#37424e" stroke-width="1.6"/>
<rect x="662" y="96" width="5" height="20" rx="2.5" fill="#a4630f"/>
<text x="678" y="112" font-size="14.5" font-weight="bold" fill="#16202b">LDO 输出上的 100Hz</text>
<rect x="670" y="140" width="234" height="112" rx="6" fill="#fdf8ea" stroke="#c9bb9d" stroke-width="1"/>
<path d="M674 196 Q787.00 195.60 900 196" fill="none" stroke="#c9bb9d" stroke-width="1" stroke-dasharray="4,4"/>
<text x="678" y="156" font-size="10.5" fill="#8b8272">从输入漏入</text>
<path d="M670,196 q23,-15 47,0 t47,0 t47,0 t47,0 t47,0" fill="none" stroke="#a4630f" stroke-width="2.4"/>
<text x="654" y="282" font-size="12.5" font-weight="bold" fill="#16202b">嫌疑：压差太小 / PSRR 不够</text>
<text x="654" y="306" font-size="11.5" fill="#5b666f">动作：查压差与输入纹波，选高 PSRR 器件</text>
</g>
<rect x="40" y="436" width="880" height="42" rx="10" fill="#f7eedb" stroke="#a4630f" stroke-width="2.2"/>
<text x="480" y="462" text-anchor="middle" font-size="15" font-weight="bold" fill="#a4630f">先问频率，再问幅度——测量必须能区分候选假设，只答"大不大"等于没测</text>
<g>
<rect x="40" y="494" width="880" height="146" rx="12" fill="#f6eedb" stroke="#37424e" stroke-width="1.6"/>
<rect x="64" y="506" width="88" height="24" rx="12" fill="#f7eedb" stroke="#a4630f" stroke-width="1.6"/>
<text x="108" y="523" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a4630f">教学示例</text>
<g>
<rect x="64" y="540" width="180" height="82" rx="9" fill="#fdf8ea" stroke="#a8321f" stroke-width="1.6"/>
<text x="76" y="564" font-size="12.5" font-weight="bold" fill="#37424e">症状</text>
<text x="76" y="588" font-size="13" font-weight="bold" fill="#16202b">5V 只有 3.1V</text>
<text x="76" y="608" font-size="11.5" fill="#5b666f">纹波 400mV</text>
</g>
<path d="M246 581 Q256.00 581.02 266 581" fill="none" stroke="#37424e" stroke-width="1.8"/>
<polygon points="272,581 262,576 262,586" fill="#37424e"/>
<g>
<rect x="276" y="540" width="180" height="82" rx="9" fill="#e6eff3" stroke="#1f5d7a" stroke-width="1.6"/>
<text x="288" y="564" font-size="12.5" font-weight="bold" fill="#1f5d7a">测量① 量频率</text>
<text x="288" y="588" font-size="13" font-weight="bold" fill="#16202b">100Hz 整流纹波</text>
<text x="288" y="608" font-size="11.5" fill="#5b666f">→ 指向大电解</text>
</g>
<path d="M458 581 Q468.00 581.00 478 581" fill="none" stroke="#37424e" stroke-width="1.8"/>
<polygon points="484,581 474,576 474,586" fill="#37424e"/>
<g>
<rect x="488" y="540" width="180" height="82" rx="9" fill="#f7eedb" stroke="#a4630f" stroke-width="1.6"/>
<text x="500" y="564" font-size="12.5" font-weight="bold" fill="#a4630f">测量② 量大电解</text>
<text x="500" y="588" font-size="13" font-weight="bold" fill="#16202b">烫手 · ESR 升高</text>
<text x="500" y="608" font-size="11.5" fill="#5b666f">容量只剩标称三成</text>
</g>
<path d="M670 581 Q680.00 580.91 690 581" fill="none" stroke="#37424e" stroke-width="1.8"/>
<polygon points="696,581 686,576 686,586" fill="#37424e"/>
<g>
<rect x="700" y="540" width="200" height="82" rx="9" fill="#e8efe6" stroke="#3d6b4a" stroke-width="1.8"/>
<text x="712" y="564" font-size="12.5" font-weight="bold" fill="#3d6b4a">根因落定</text>
<text x="712" y="588" font-size="13" font-weight="bold" fill="#16202b">换低 ESR 电解</text>
<text x="712" y="608" font-size="11.5" fill="#5b666f">两次测量 · 没拆一颗芯片</text>
</g>
</g>
<text x="480" y="664" text-anchor="middle" font-size="11.5" fill="#5b666f">100Hz=全波整流 · 50Hz=半波——频率的"户口"指认整流与滤波</text>
</svg>
