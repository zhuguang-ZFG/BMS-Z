<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="ui-monospace, Consolas, monospace" aria-label="同一拍里五个保护计数器各自走：OVP 数满三拍禁充，UVP 只数到一，OCD 数到三还差两拍，SCD 本拍直接双断，OT 温度没到线。为什么这一拍不动：不是没看见，是还没数满。数字为教学示意">
  <title>同一拍里，五个保护计数器各自走（教学示意）</title>
  <desc>OVP 第 1–3 拍连续越限，第 3 拍数满禁充；UVP 只数到 1；OCD 数到 3 还差 2 拍；SCD 本拍立即双断；OT 温度未到 60 °C 不计数。</desc>

  <style>
    .bg { fill: #fffdf5; }
    .panel { fill: #f7f2e5; stroke: #cfc6b2; }
    .txt { fill: #293b3a; font-size: 13px; }
    .small { fill: #626d65; font-size: 12px; }
    .title { fill: #293b3a; font-size: 16px; font-weight: bold; }
    .head { fill: #293b3a; font-size: 14px; font-weight: bold; }
    .warn { fill: #b84745; }
    .ok { fill: #377b60; }
    .gold { fill: #926717; }
    .cell { fill: none; stroke: #926717; stroke-width: 1.4; }
    .fill-warn { fill: #b84745; opacity: 0; }
    .fill-ok { fill: #377b60; opacity: 0; }
    .fill-dim { fill: #926717; opacity: 0; }
    .line { stroke: #626d65; stroke-width: 1.4; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #192727; }
      .panel { fill: #223333; stroke: #496160; }
      .txt, .title, .head { fill: #edf0e5; }
      .small { fill: #b0beb3; }
      .warn { fill: #f39b91; }
      .ok { fill: #8fc7a2; }
      .gold { fill: #dfbd78; }
      .cell { stroke: #dfbd78; }
      .line { stroke: #b0beb3; }
    }
  </style><style id="bms-motion">
    /* bms-motion: 手帐式动效注记（纯装饰，不改技术几何与既有 SMIL 时序） */
    .bms-marker { fill: #fbefc7; opacity: .78; }
    .bms-under { fill: none; stroke: #926717; stroke-width: 2.4; stroke-linecap: round; opacity: .9; }
    .bms-spark-fill { fill: #926717; }
    .bms-sticker { fill: none; stroke: #926717; stroke-width: 2; stroke-dasharray: 7 5; stroke-linecap: round; opacity: .85; }
    .bms-halo { fill: none; stroke: #b84745; stroke-width: 2.4; }
    .bms-marker, .bms-under, .bms-sticker, .bms-halo, .bms-doodle { pointer-events: none; }
    circle:has(> animateMotion) { filter: drop-shadow(0 0 2px rgba(146,103,23,.5)) drop-shadow(0 0 5px rgba(196,145,52,.45)); }
    @media (prefers-color-scheme: dark) {
      .bms-marker { fill: #453e2b; opacity: .85; }
      .bms-under { stroke: #dfbd78; }
      .bms-spark-fill { fill: #dfbd78; }
      .bms-sticker { stroke: #dfbd78; }
      .bms-halo { stroke: #dfbd78; }
      circle:has(> animateMotion) { filter: drop-shadow(0 0 2px rgba(223,189,120,.8)) drop-shadow(0 0 7px rgba(223,189,120,.9)); }
    }
    @media (prefers-reduced-motion: reduce) { .bms-doodle { display: none; } }
</style>

  <!-- counters: ovp 3/3 trip@t3, uvp 1/3, ocd 3/5, scd immediate@t6.5, ot idle -->
  <rect class="bg" width="800" height="420"/>
  <rect class="bms-marker" aria-hidden="true" x="18" y="15.1" width="412" height="17.3" rx="3.8" transform="rotate(-.5 18 23.8)"/><path class="bms-under" aria-hidden="true" d="M24 29 q 24 -2.4 48 0 t 48 0 t 48 0 t 48 0 t 48 0 t 48 0 t 48 0"/><text class="title" x="24" y="30">同一拍里，五个计数器各自走（教学示意）</text>
  <rect class="panel" x="24" y="46" width="752" height="56" rx="6"/><g class="bms-doodle" aria-hidden="true" transform="translate(748 68)"><animateTransform attributeName="transform" type="rotate" values="-6;7;-6" keyTimes="0;0.5;1" dur="5.4s" repeatCount="indefinite" additive="sum"/><animate attributeName="opacity" values="0.62;1;0.62" keyTimes="0;0.5;1" dur="3.6s" repeatCount="indefinite"/><path class="bms-spark-fill" d="M0 -8 L2.1 -2.1 L8 0 L2.1 2.1 L0 8 L-2.1 2.1 L-8 0 L-2.1 -2.1 Z"/></g>
  <text class="txt" x="40" y="68">状态机每拍评估全部保护，再合并成禁充与禁放。</text>
  <text class="txt" x="40" y="92" opacity="0.28">OVP 第 3 拍数满动作；其余项目这一拍为什么不动？看各自的格子。<animate calcMode="spline" keySplines="0.42 0 0.58 1;0 0 1 1" attributeName="opacity" values="0.28;1;1" keyTimes="0;0.08;1" dur="13s" repeatCount="indefinite"/></text>

  <rect class="panel" x="24" y="112" width="752" height="252" rx="6"/>
  <text class="small" x="40" y="134">项目</text>
  <text class="small" x="256" y="134">计数格（每格一拍）</text>
  <text class="small" x="608" y="134">这一拍的动作</text>

  <!-- OVP row -->
  <text class="txt" x="40" y="166">OVP &gt;4250 mV</text>
  <rect class="cell" x="256" y="150" width="44" height="24" rx="5"/><rect class="cell" x="304" y="150" width="44" height="24" rx="5"/><rect class="cell" x="352" y="150" width="44" height="24" rx="5"/>
  <rect class="fill-warn" x="256" y="150" width="44" height="24" rx="5"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.055;1" dur="13s" repeatCount="indefinite" fill="freeze" /></rect>
  <rect class="fill-warn" x="304" y="150" width="44" height="24" rx="5"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.14;1" dur="13s" repeatCount="indefinite" fill="freeze" /></rect>
  <rect class="fill-warn" x="352" y="150" width="44" height="24" rx="5"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.225;1" dur="13s" repeatCount="indefinite" fill="freeze" /></rect>
  <text class="txt" x="608" y="166" opacity="0.25">计数中 1/3…<animate attributeName="opacity" values="0.25;0.25;1;0;0" keyTimes="0;0.054;0.225;0.25;1" dur="13s" repeatCount="indefinite"/></text>
  <text class="warn" x="700" y="166" opacity="0">禁充<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.23;1" dur="13s" repeatCount="indefinite" fill="freeze" /></text>

  <!-- UVP row -->
  <text class="txt" x="40" y="212">UVP &lt;2800 mV</text>
  <rect class="cell" x="256" y="196" width="44" height="24" rx="5"/><rect class="cell" x="304" y="196" width="44" height="24" rx="5"/><rect class="cell" x="352" y="196" width="44" height="24" rx="5"/>
  <rect class="fill-dim" x="256" y="196" width="44" height="24" rx="5"><animate attributeName="opacity" values="0;0.85;0.85" keyTimes="0;0.32;1" dur="13s" repeatCount="indefinite" fill="freeze" /></rect>
  <text class="txt" x="608" y="212">计数中 1/3，不动</text>

  <!-- OCD row -->
  <text class="txt" x="40" y="258">OCD &gt;10 A</text>
  <rect class="cell" x="256" y="242" width="44" height="24" rx="5"/><rect class="cell" x="304" y="242" width="44" height="24" rx="5"/><rect class="cell" x="352" y="242" width="44" height="24" rx="5"/><rect class="cell" x="400" y="242" width="44" height="24" rx="5"/><rect class="cell" x="448" y="242" width="44" height="24" rx="5"/>
  <rect class="fill-dim" x="256" y="242" width="44" height="24" rx="5"><animate attributeName="opacity" values="0;0.85;0.85" keyTimes="0;0.40;1" dur="13s" repeatCount="indefinite" fill="freeze" /></rect>
  <rect class="fill-dim" x="304" y="242" width="44" height="24" rx="5"><animate attributeName="opacity" values="0;0.85;0.85" keyTimes="0;0.48;1" dur="13s" repeatCount="indefinite" fill="freeze" /></rect>
  <rect class="fill-dim" x="352" y="242" width="44" height="24" rx="5"><animate attributeName="opacity" values="0;0.85;0.85" keyTimes="0;0.56;1" dur="13s" repeatCount="indefinite" fill="freeze" /></rect>
  <text class="txt" x="608" y="258">计数中 3/5，不动</text>

  <!-- SCD row -->
  <text class="txt" x="40" y="304">SCD &gt;30 A</text>
  <rect class="cell" x="256" y="288" width="44" height="24" rx="5"/>
  <rect class="fill-warn" x="256" y="288" width="44" height="24" rx="5"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.47;1" dur="13s" repeatCount="indefinite" fill="freeze" /></rect>
  <rect class="bms-halo" aria-hidden="true" x="252" y="284" width="52" height="32" rx="8" opacity="0"><animate attributeName="opacity" values="0;0.9;0;0.9;0;0" keyTimes="0;0.49;0.53;0.62;0.68;1" dur="13s" repeatCount="indefinite"/></rect>
  <text class="txt" x="608" y="304" opacity="0.25">等条件…<animate attributeName="opacity" values="0.25;0.25;1;0;0" keyTimes="0;0.465;0.475;0.50;1" dur="13s" repeatCount="indefinite"/></text>
  <text class="warn" x="700" y="304" opacity="0">本拍双断<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.48;1" dur="13s" repeatCount="indefinite" fill="freeze" /></text>

  <!-- OT row -->
  <text class="txt" x="40" y="350">OT &gt;60 °C</text>
  <rect class="cell" x="256" y="334" width="44" height="24" rx="5"/>
  <text class="txt" x="608" y="350">48 °C 未到线，不计数</text>

  <line class="line" x1="248" y1="122" x2="248" y2="352"/>
  <line class="line" x1="598" y1="122" x2="598" y2="352"/>

  <rect class="bms-sticker" aria-hidden="true" x="24" y="374" width="752" height="34" rx="10"/>
  <text class="txt" x="40" y="396">为什么这一拍不动：不是没看见，是还没数满；SCD 不等确认，OT 没到线。</text>
</svg>
