<rect x="132" y="308" width="129" height="24" rx="6" fill="#f6eedb" stroke="#a8321f" stroke-width="1"/><text x="196" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#a8321f">RTC 每天慢 4.8 秒</text><rect x="400" y="110" width="352" height="58" rx="7" fill="none" stroke="#a4630f" stroke-width="1.8" opacity="0.9"><animate attributeName="y" values="134;192;250;308;308" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/></rect>
<text x="412" y="134" font-size="11.5" font-weight="bold" fill="#a4630f">① 标称</text><text x="412" y="159" font-size="14.5" font-weight="bold" fill="#16202b">CL = 12pF</text><text x="412" y="176" font-size="10.5" fill="#5b666f">晶振按这个值校频</text>
<text x="412" y="192" font-size="11.5" font-weight="bold" fill="#a4630f">② 实配</text><text x="412" y="217" font-size="14.5" font-weight="bold" fill="#16202b">两只 22pF → CL ≈ 15pF</text><text x="412" y="234" font-size="10.5" fill="#5b666f">(C1·C2)/(C1+C2)+Cstray</text><rect x="400" y="168" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.25;0.28;1" dur="14s" repeatCount="indefinite"/></rect>
<text x="412" y="250" font-size="11.5" font-weight="bold" fill="#a4630f">③ 牵引</text><text x="412" y="275" font-size="14.5" font-weight="bold" fill="#16202b">约 20ppm/pF × 3pF ≈ 55~60ppm</text><text x="412" y="292" font-size="10.5" fill="#5b666f">频偏由此来</text><rect x="400" y="226" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.5;0.53;1" dur="14s" repeatCount="indefinite"/></rect>
<text x="412" y="308" font-size="11.5" font-weight="bold" fill="#a4630f">④ 后果</text><text x="412" y="333" font-size="14.5" font-weight="bold" fill="#16202b">32.768kHz RTC 每天差 ≈4.8s</text><text x="412" y="350" font-size="10.5" fill="#5b666f">负载电容错配的账</text><rect x="400" y="284" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.75;0.78;1" dur="14s" repeatCount="indefinite"/></rect>
