<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="CC-CV 充电：恒流 48 分钟后转恒压，电流衰减到 0.05C 截止">
  <rect x="0" y="0" width="960" height="480" fill="#fffdf5"/>
  <text x="24" y="32" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#293b3a">CC-CV：一段恒流，一段恒压</text>
  <text x="24" y="54" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" fill="#626d65">合成教学参数：2 Ah、1C 恒流、4.20 V 钳位、截止 0.05C；跑 code/cccv_charge.py 复算。</text>

  <!-- 端电压面板 -->
  <text x="94" y="84" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" fill="#626d65">端电压</text>
  <g stroke="#cfc6b2" stroke-width="1">
    <line x1="90" y1="210" x2="890" y2="210"/>
    <line x1="90" y1="90" x2="90" y2="210"/>
    <line x1="90" y1="165" x2="890" y2="165" stroke-dasharray="4 4"/>
    <line x1="90" y1="135" x2="890" y2="135" stroke-dasharray="4 4"/>
  </g>
  <g font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#626d65">
    <text x="48" y="199">3.6</text>
    <text x="48" y="139">4.0</text>
  </g>
  <line x1="90" y1="105" x2="890" y2="105" stroke="#b84745" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="770" y="98" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#b84745">CV 4.20 V</text>
  <polyline points="90,195 104,189 570,105 860,105" fill="none" stroke="#377b60" stroke-width="4"/>
  <text x="102" y="222" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#377b60">3.60 V</text>

  <!-- 电流面板 -->
  <text x="94" y="254" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" fill="#626d65">电流</text>
  <g stroke="#cfc6b2" stroke-width="1">
    <line x1="90" y1="390" x2="890" y2="390"/>
    <line x1="90" y1="260" x2="90" y2="390"/>
    <line x1="90" y1="325" x2="890" y2="325" stroke-dasharray="4 4"/>
  </g>
  <g font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#626d65">
    <text x="48" y="264">2 A</text>
    <text x="48" y="329">1 A</text>
    <text x="48" y="394">0</text>
    <text x="90" y="404" text-anchor="middle">0</text>
    <text x="330" y="404" text-anchor="middle">24</text>
    <text x="570" y="404" text-anchor="middle">48</text>
    <text x="860" y="404" text-anchor="middle">77</text>
  </g>
  <polyline points="90,260 570,260 601,313 632,338 663,353 694,365 736,373 778,378 820,381 860,383" fill="none" stroke="#377b60" stroke-width="4"/>
  <text x="150" y="250" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#377b60">1C = 2 A</text>

  <!-- 数据点 -->
  <g fill="#377b60">
    <circle cx="90" cy="195" r="5"/>
    <circle cx="570" cy="105" r="5"/>
    <circle cx="860" cy="105" r="5"/>
    <circle cx="90" cy="260" r="5"/>
    <circle cx="570" cy="260" r="5"/>
    <circle cx="860" cy="383" r="5"/>
  </g>

  <!-- 判满 pill -->
  <rect x="778" y="346" width="118" height="26" rx="13" fill="#fbefc7" stroke="#926717"/>
  <text x="837" y="363" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#8e6518" font-weight="700">I&lt;0.05C 判满</text>

  <!-- 转恒压 marker -->
  <line x1="570" y1="60" x2="570" y2="398" stroke="#7c648e" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="495" y="62" width="150" height="26" rx="13" fill="#f6e2df" stroke="#7c648e"/>
  <text x="570" y="80" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#736085" font-weight="700">转恒压：SOC 才 0.80</text>

  <!-- 安时账 bracket -->
  <path d="M90 412 L90 424 L566 424 L566 412" fill="none" stroke="#926717" stroke-width="2"/>
  <text x="328" y="442" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" fill="#926717" font-weight="700">恒流 48 min，收 1.60 Ah</text>
  <path d="M574 412 L574 424 L860 424 L860 412" fill="none" stroke="#926717" stroke-width="2"/>
  <text x="717" y="442" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" fill="#926717" font-weight="700">恒压 29 min，才 0.30 Ah</text>

  <text x="24" y="468" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" fill="#626d65">恒压段只多收 0.30 Ah（16%），却占总时间 37%——最后一安时最贵；电压碰到 4.20 V 不等于充满，判满看 CV 电流 &lt; 0.05C（触发时 SOC 真值 0.95）。</text>
</svg>
