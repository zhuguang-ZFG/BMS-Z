<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 514" width="800" height="514" role="img" aria-label="S3 预充功率路径视觉试版">
<title>S3 预充功率路径视觉试版</title>
<desc>电池正端分出主触点支路与预充触点加电阻的并联支路，预充支路闭合而主触点断开，电流经电阻给母线电容充电，并从电容负端回到电池负端。</desc>
<style>
  .bg { fill: #f6f1e3; }
  .paper-grain { fill: url(#paper-grain); }
  .grain-dot { fill: #b6a988; opacity: 0.55; }
  .rule { stroke: #b9ab8d; stroke-width: 1.1; fill: none; stroke-linecap: round; }
  .title { fill: #003153; font: 700 20px 'KaiTi','STKaiti','Noto Serif SC',serif; letter-spacing: 0.2px; }
  .sub { fill: #5c6d73; font: 13px 'Noto Sans SC','Microsoft YaHei',sans-serif; }
  .stamp { fill: #8a8271; font: 12px 'KaiTi','STKaiti','Noto Serif SC',serif; }
  .axis { stroke: #5c6d73; stroke-width: 1.35; fill: none; stroke-linecap: round; }
  .grid { stroke: #d9cfba; stroke-width: 0.9; fill: none; }
  .lbl { fill: #4d5a5f; font: 13px 'Noto Sans SC','Microsoft YaHei',sans-serif; }
  .small { fill: #4d5a5f; font: 12px 'Noto Sans SC','Microsoft YaHei',sans-serif; }
  .value { fill: #003153; font: 700 20px 'Noto Sans SC','Microsoft YaHei',sans-serif; }
  .eq { fill: #003153; font: 700 19px 'KaiTi','STKaiti','Noto Serif SC',serif; }
  .sym { fill: #003153; font: 700 22px 'KaiTi','STKaiti','Noto Serif SC',serif; }
  .ocv { stroke: #003153; stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .term { stroke: #1d6a62; stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .ohm { stroke: #9a5b22; stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .pol { stroke: #b23a2e; stroke-width: 3.2; fill: none; stroke-dasharray: 10 5; stroke-linecap: round; }
  .cur { stroke: #34495c; stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .soc-a { stroke: #9a5b22; stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .soc-b { stroke: #003153; stroke-width: 3.2; fill: none; stroke-dasharray: 10 5; stroke-linecap: round; }
  .overlap { stroke: #9a5b22; stroke-width: 2.1; fill: none; stroke-dasharray: 3 3; stroke-linecap: round; }
  .note { fill: #b23a2e; font: 700 13px 'Noto Sans SC','Microsoft YaHei',sans-serif; }
  .good { fill: #1d6a62; font: 700 13px 'Noto Sans SC','Microsoft YaHei',sans-serif; }
  .window { fill: url(#hatch-window); stroke: #b23a2e; stroke-width: 1.6; stroke-dasharray: 4 3; }
  .bar-a { fill: #9a5b22; opacity: 0.16; }
  .bar-b { fill: #1d6a62; opacity: 0.14; }
  .wire { stroke: #003153; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .plate { stroke: #003153; stroke-width: 4.2; fill: none; stroke-linecap: round; }
  .dash { stroke: #5c6d73; stroke-width: 1.6; fill: none; stroke-dasharray: 7 5; stroke-linecap: round; }
  .r0 { stroke: #9a5b22; stroke-width: 2.6; fill: url(#hatch-umber); }
  .rc { stroke: #b23a2e; stroke-width: 2.6; fill: url(#hatch-red); }
  .load { stroke: #003153; stroke-width: 2.2; fill: url(#hatch-ink); }
  .cur2 { stroke: #34495c; stroke-width: 2.8; fill: none; stroke-linecap: round; }
  .node { fill: #003153; }
  .mark { stroke: #b23a2e; stroke-width: 2; fill: none; }
  .boundary-dot { fill: none; stroke: #b23a2e; stroke-width: 2; }
  .halo { paint-order: stroke; stroke: #f6f1e3; stroke-width: 4; stroke-linejoin: round; }
  .hatch-umber-line { stroke: #9a5b22; stroke-width: 1.1; opacity: 0.42; fill: none; }
  .hatch-red-line { stroke: #b23a2e; stroke-width: 1.0; opacity: 0.38; fill: none; }
  .hatch-ink-line { stroke: #003153; stroke-width: 1.0; opacity: 0.30; fill: none; }
  .hatch-window-line { stroke: #b23a2e; stroke-width: 0.9; opacity: 0.30; fill: none; }
</style>
<defs>
<pattern id="paper-grain" width="120" height="120" patternUnits="userSpaceOnUse">
<circle class="grain-dot" cx="11" cy="29" r="0.55"/><circle class="grain-dot" cx="58" cy="100" r="0.77"/><circle class="grain-dot" cx="105" cy="51" r="0.99"/><circle class="grain-dot" cx="32" cy="2" r="1.21"/><circle class="grain-dot" cx="79" cy="73" r="0.55"/><circle class="grain-dot" cx="6" cy="24" r="0.77"/><circle class="grain-dot" cx="53" cy="95" r="0.99"/><circle class="grain-dot" cx="100" cy="46" r="1.21"/><circle class="grain-dot" cx="27" cy="117" r="0.55"/><circle class="grain-dot" cx="74" cy="68" r="0.77"/><circle class="grain-dot" cx="1" cy="19" r="0.99"/><circle class="grain-dot" cx="48" cy="90" r="1.21"/><circle class="grain-dot" cx="95" cy="41" r="0.55"/><circle class="grain-dot" cx="22" cy="112" r="0.77"/><circle class="grain-dot" cx="69" cy="63" r="0.99"/><circle class="grain-dot" cx="116" cy="14" r="1.21"/><circle class="grain-dot" cx="43" cy="85" r="0.55"/><circle class="grain-dot" cx="90" cy="36" r="0.77"/><circle class="grain-dot" cx="17" cy="107" r="0.99"/><circle class="grain-dot" cx="64" cy="58" r="1.21"/><circle class="grain-dot" cx="111" cy="9" r="0.55"/><circle class="grain-dot" cx="38" cy="80" r="0.77"/><circle class="grain-dot" cx="85" cy="31" r="0.99"/><circle class="grain-dot" cx="12" cy="102" r="1.21"/><circle class="grain-dot" cx="59" cy="53" r="0.55"/><circle class="grain-dot" cx="106" cy="4" r="0.77"/>
</pattern>
<pattern id="hatch-umber" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path class="hatch-umber-line" d="M0.6 0 V7 M0 0.6 H7"/></pattern>
<pattern id="hatch-red" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path class="hatch-red-line" d="M0.6 0 V8 M0 0.6 H8"/></pattern>
<pattern id="hatch-ink" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path class="hatch-ink-line" d="M0.6 0 V9 M0 0.6 H9"/></pattern>
<pattern id="hatch-window" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path class="hatch-window-line" d="M0.6 0 V8 M0 0.6 H8"/></pattern>
</defs>
<rect class="bg" x="0" y="0" width="800" height="514"/>
<rect class="paper-grain" x="0" y="0" width="800" height="514"/>
<path class="rule" d="M24 39 Q400 37.4 776 39"/>
<text class="stamp" x="776.0" y="32.0" text-anchor="end">自绘示意 · 教学合成值</text>
<text class="title" x="24.0" y="32.0" text-anchor="start">S3 功率回路试版：先经预充电阻，不走主闸</text>
<text class="sub" x="24.0" y="66.0" text-anchor="start">当前只画预充阶段：预充触点闭合、主触点断开，外部负载已卸；回流明确接回负端。</text>
<circle class="wire" cx="70" cy="300" r="30"/>
<text class="sym" x="70.0" y="298.0" text-anchor="middle">+</text>
<text class="sym" x="70.0" y="321.0" text-anchor="middle">−</text>
<line class="wire" x1="70" y1="270" x2="70" y2="210"/>
<line class="wire" x1="70" y1="330" x2="70" y2="390"/>
<line class="wire" x1="70" y1="210" x2="230" y2="210"/>
<line class="wire" x1="330" y1="210" x2="620" y2="210"/>
<line class="wire" x1="230" y1="210" x2="316" y2="178"/>
<circle class="node" cx="230" cy="210" r="3.5"/>
<circle class="node" cx="330" cy="210" r="3.5"/>
<text class="lbl" x="282.0" y="245.0" text-anchor="middle">主触点 Km：断</text>
<line class="wire" x1="170" y1="210" x2="170" y2="120"/>
<line class="wire" x1="170" y1="120" x2="225" y2="120"/>
<line class="wire" x1="225" y1="120" x2="285" y2="120"/>
<circle class="node" cx="225" cy="120" r="3.5"/>
<circle class="node" cx="285" cy="120" r="3.5"/>
<line class="wire" x1="285" y1="120" x2="350" y2="120"/>
<rect class="r0" x="350" y="107" width="80" height="26"/>
<line class="wire" x1="430" y1="120" x2="470" y2="120"/>
<line class="wire" x1="470" y1="120" x2="470" y2="210"/>
<circle class="node" cx="170" cy="210" r="3.5"/>
<circle class="node" cx="470" cy="210" r="3.5"/>
<text class="lbl" x="252.0" y="94.0" text-anchor="middle">预充触点 Kp：合</text>
<text class="lbl" x="390.0" y="94.0" text-anchor="middle">预充电阻</text>
<line class="wire" x1="620" y1="210" x2="620" y2="285"/>
<line class="plate" x1="600" y1="285" x2="640" y2="285"/>
<line class="plate" x1="600" y1="305" x2="640" y2="305"/>
<line class="wire" x1="620" y1="305" x2="620" y2="390"/>
<line class="wire" x1="620" y1="390" x2="70" y2="390"/>
<text class="lbl" x="650.0" y="302.0" text-anchor="start">母线电容</text>
<text class="lbl" x="112.0" y="353.0" text-anchor="start">电池组</text>
<polygon class="node" points="320,120 310,114 310,126"/>
<polygon class="node" points="620,263 614,253 626,253"/>
<polygon class="node" points="430,390 440,384 440,396"/>
<text class="eq" x="24.0" y="437.0" text-anchor="start">电流路径：正端 → Kp → 电阻 → 电容 → 负端</text>
<text class="small" x="24.0" y="470.0" text-anchor="start">合主闸还要另查：采样有效、反馈一致、压差与器件限制；电容电压高不等于已获许可。</text>
<text class="small" x="24.0" y="494.0" text-anchor="start">试版边界：仅核对物理回路与视觉；不是高压搭建指南，也不是 S3 实验完成证据。</text>
</svg>
