<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="ui-monospace, Consolas, monospace">
  <title>包级休眠电流：大部分时间停在几十微安，周期唤醒打出毫安尖峰。平均由占空比决定。数字为示意。</title>
  <desc>亮点看电流轨迹：大部分时间停在几十微安，每 2 s 醒 50 ms 打出毫安尖峰，平均由占空比决定，5 mA 没关掉时整条线垫高。</desc>

  <style>
    .bg { fill: #fffdf5; }
