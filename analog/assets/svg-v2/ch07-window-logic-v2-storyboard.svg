<text x="36" y="36" font-size="24" fill="#2a2927" text-anchor="start">窗口内放行，要先接对两路比较极性</text>
<g data-storyboard-beat="1" transform="translate(18 65)">
<rect width="334" height="284" rx="8" fill="none" stroke="#5b666f"/>
<text x="10" y="27" font-size="20" fill="#2a2927" text-anchor="start">1. 欠压：电池 2.8 V</text>
<path d="M145,72 L145,128 L190,100 Z" fill="none" stroke="#16202b" stroke-width="2"/><text x="135" y="88" font-size="18" fill="#2a2927" text-anchor="end">1.4 V</text><text x="135" y="122" font-size="18" fill="#2a2927" text-anchor="end">1.5 V</text><text x="149" y="93" font-size="18" fill="#2a2927" text-anchor="start">+</text><text x="149" y="122" font-size="18" fill="#2a2927" text-anchor="start">−</text><line x1="190" y1="100" x2="230" y2="100" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><text x="245" y="105" font-size="18" fill="#a8321f" text-anchor="start">拉低</text><path d="M145,160 L145,216 L190,188 Z" fill="none" stroke="#16202b" stroke-width="2"/><text x="135" y="176" font-size="18" fill="#2a2927" text-anchor="end">1.8 V</text><text x="135" y="210" font-size="18" fill="#2a2927" text-anchor="end">1.4 V</text><text x="149" y="181" font-size="18" fill="#2a2927" text-anchor="start">+</text><text x="149" y="210" font-size="18" fill="#2a2927" text-anchor="start">−</text><line x1="190" y1="188" x2="230" y2="188" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><text x="245" y="193" font-size="18" fill="#42654d" text-anchor="start">松手</text><line x1="230" y1="100" x2="230" y2="188" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><line x1="230" y1="100" x2="230" y2="83" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><rect x="224" y="65" width="12" height="18" fill="none" stroke="#16202b" stroke-width="2"/><line x1="230" y1="65" x2="230" y2="55" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><text x="248" y="80" font-size="18" fill="#2a2927" text-anchor="start">Rp</text><text x="230" y="50" font-size="18" fill="#2a2927" text-anchor="middle">VPU</text><line x1="230" y1="144" x2="270" y2="144" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><text x="245" y="169" font-size="22" fill="#16202b" text-anchor="start">L</text><text x="14" y="50" font-size="18" fill="#2a2927" text-anchor="start">电池 2.8 V → 分压 1.4 V</text>
<text x="10" y="274" font-size="18" fill="#2a2927" text-anchor="start">A 拉低；B 松手</text>
</g>
<g data-storyboard-beat="2" transform="translate(368 65)">
<rect width="334" height="284" rx="8" fill="none" stroke="#5b666f"/>
<text x="10" y="27" font-size="20" fill="#2a2927" text-anchor="start">2. 窗内：电池 3.2 V</text>
<path d="M145,72 L145,128 L190,100 Z" fill="none" stroke="#16202b" stroke-width="2"/><text x="135" y="88" font-size="18" fill="#2a2927" text-anchor="end">1.6 V</text><text x="135" y="122" font-size="18" fill="#2a2927" text-anchor="end">1.5 V</text><text x="149" y="93" font-size="18" fill="#2a2927" text-anchor="start">+</text><text x="149" y="122" font-size="18" fill="#2a2927" text-anchor="start">−</text><line x1="190" y1="100" x2="230" y2="100" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><text x="245" y="105" font-size="18" fill="#42654d" text-anchor="start">松手</text><path d="M145,160 L145,216 L190,188 Z" fill="none" stroke="#16202b" stroke-width="2"/><text x="135" y="176" font-size="18" fill="#2a2927" text-anchor="end">1.8 V</text><text x="135" y="210" font-size="18" fill="#2a2927" text-anchor="end">1.6 V</text><text x="149" y="181" font-size="18" fill="#2a2927" text-anchor="start">+</text><text x="149" y="210" font-size="18" fill="#2a2927" text-anchor="start">−</text><line x1="190" y1="188" x2="230" y2="188" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><text x="245" y="193" font-size="18" fill="#42654d" text-anchor="start">松手</text><line x1="230" y1="100" x2="230" y2="188" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><line x1="230" y1="100" x2="230" y2="83" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><rect x="224" y="65" width="12" height="18" fill="none" stroke="#16202b" stroke-width="2"/><line x1="230" y1="65" x2="230" y2="55" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><text x="248" y="80" font-size="18" fill="#2a2927" text-anchor="start">Rp</text><text x="230" y="50" font-size="18" fill="#2a2927" text-anchor="middle">VPU</text><line x1="230" y1="144" x2="270" y2="144" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><text x="245" y="169" font-size="22" fill="#16202b" text-anchor="start">H</text><text x="14" y="50" font-size="18" fill="#2a2927" text-anchor="start">电池 3.2 V → 分压 1.6 V</text>
<text x="10" y="274" font-size="18" fill="#2a2927" text-anchor="start">两路松手：高</text>
</g>
<g data-storyboard-beat="3" transform="translate(18 365)">
<rect width="334" height="284" rx="8" fill="none" stroke="#5b666f"/>
<text x="10" y="27" font-size="20" fill="#2a2927" text-anchor="start">3. 过压：电池 3.8 V</text>
<path d="M145,72 L145,128 L190,100 Z" fill="none" stroke="#16202b" stroke-width="2"/><text x="135" y="88" font-size="18" fill="#2a2927" text-anchor="end">1.9 V</text><text x="135" y="122" font-size="18" fill="#2a2927" text-anchor="end">1.5 V</text><text x="149" y="93" font-size="18" fill="#2a2927" text-anchor="start">+</text><text x="149" y="122" font-size="18" fill="#2a2927" text-anchor="start">−</text><line x1="190" y1="100" x2="230" y2="100" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><text x="245" y="105" font-size="18" fill="#42654d" text-anchor="start">松手</text><path d="M145,160 L145,216 L190,188 Z" fill="none" stroke="#16202b" stroke-width="2"/><text x="135" y="176" font-size="18" fill="#2a2927" text-anchor="end">1.8 V</text><text x="135" y="210" font-size="18" fill="#2a2927" text-anchor="end">1.9 V</text><text x="149" y="181" font-size="18" fill="#2a2927" text-anchor="start">+</text><text x="149" y="210" font-size="18" fill="#2a2927" text-anchor="start">−</text><line x1="190" y1="188" x2="230" y2="188" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><text x="245" y="193" font-size="18" fill="#a8321f" text-anchor="start">拉低</text><line x1="230" y1="100" x2="230" y2="188" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><line x1="230" y1="100" x2="230" y2="83" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><rect x="224" y="65" width="12" height="18" fill="none" stroke="#16202b" stroke-width="2"/><line x1="230" y1="65" x2="230" y2="55" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><text x="248" y="80" font-size="18" fill="#2a2927" text-anchor="start">Rp</text><text x="230" y="50" font-size="18" fill="#2a2927" text-anchor="middle">VPU</text><line x1="230" y1="144" x2="270" y2="144" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><text x="245" y="169" font-size="22" fill="#16202b" text-anchor="start">L</text><text x="14" y="50" font-size="18" fill="#2a2927" text-anchor="start">电池 3.8 V → 分压 1.9 V</text>
<text x="10" y="274" font-size="18" fill="#2a2927" text-anchor="start">A 松手；B 拉低</text>
</g>
<g data-storyboard-beat="4" transform="translate(368 365)">
<rect width="334" height="284" rx="8" fill="none" stroke="#5b666f"/>
<text x="10" y="27" font-size="20" fill="#2a2927" text-anchor="start">4. 回到窗内 3.2 V</text>
<path d="M145,72 L145,128 L190,100 Z" fill="none" stroke="#16202b" stroke-width="2"/><text x="135" y="88" font-size="18" fill="#2a2927" text-anchor="end">1.6 V</text><text x="135" y="122" font-size="18" fill="#2a2927" text-anchor="end">1.5 V</text><text x="149" y="93" font-size="18" fill="#2a2927" text-anchor="start">+</text><text x="149" y="122" font-size="18" fill="#2a2927" text-anchor="start">−</text><line x1="190" y1="100" x2="230" y2="100" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><text x="245" y="105" font-size="18" fill="#42654d" text-anchor="start">松手</text><path d="M145,160 L145,216 L190,188 Z" fill="none" stroke="#16202b" stroke-width="2"/><text x="135" y="176" font-size="18" fill="#2a2927" text-anchor="end">1.8 V</text><text x="135" y="210" font-size="18" fill="#2a2927" text-anchor="end">1.6 V</text><text x="149" y="181" font-size="18" fill="#2a2927" text-anchor="start">+</text><text x="149" y="210" font-size="18" fill="#2a2927" text-anchor="start">−</text><line x1="190" y1="188" x2="230" y2="188" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><text x="245" y="193" font-size="18" fill="#42654d" text-anchor="start">松手</text><line x1="230" y1="100" x2="230" y2="188" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><line x1="230" y1="100" x2="230" y2="83" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><rect x="224" y="65" width="12" height="18" fill="none" stroke="#16202b" stroke-width="2"/><line x1="230" y1="65" x2="230" y2="55" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><text x="248" y="80" font-size="18" fill="#2a2927" text-anchor="start">Rp</text><text x="230" y="50" font-size="18" fill="#2a2927" text-anchor="middle">VPU</text><line x1="230" y1="144" x2="270" y2="144" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><text x="245" y="169" font-size="22" fill="#16202b" text-anchor="start">H</text><text x="14" y="50" font-size="18" fill="#2a2927" text-anchor="start">电池 3.2 V → 分压 1.6 V</text>
<text x="10" y="274" font-size="18" fill="#2a2927" text-anchor="start">共享上拉；逻辑线与</text>
</g>
<text x="26" y="704" font-size="20" fill="#2a2927" text-anchor="start">1. 欠压路：被测电压进正端，1.5 V 基准进负端。</text>
<text x="26" y="736" font-size="20" fill="#2a2927" text-anchor="start">2. 过压路：1.8 V 基准进正端，被测电压进负端。</text>
<text x="26" y="768" font-size="20" fill="#2a2927" text-anchor="start">3. 欠压或过压时，任一路输出管都能拉低公共节点。</text>
<text x="26" y="800" font-size="20" fill="#2a2927" text-anchor="start">4. 只有两路都松手，上拉才能给出窗口内的高电平。</text>
<text x="26" y="870" font-size="18" fill="#2a2927" text-anchor="start">示意：电池减半分压；理想门限 3.0 / 3.6 V，等于门限时不保证状态。</text>
</svg>