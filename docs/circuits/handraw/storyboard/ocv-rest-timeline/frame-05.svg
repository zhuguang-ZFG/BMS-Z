</g>
<g font-family="KaiTi" font-size="12" fill="#003153">
 <text x="172" y="348" text-anchor="end">3.50</text>
 <text x="172" y="293" text-anchor="end">3.56</text>
 <text x="172" y="238" text-anchor="end">3.62</text>
 <text x="172" y="184" text-anchor="end">3.68</text>
