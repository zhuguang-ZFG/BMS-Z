 <text x="449.0" y="152.0" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="middle">命令</text>
 <rect x="477.0" y="92.0" width="56.0" height="42.0" fill="none" stroke="#003153" stroke-width="1.7" rx="3"/>
