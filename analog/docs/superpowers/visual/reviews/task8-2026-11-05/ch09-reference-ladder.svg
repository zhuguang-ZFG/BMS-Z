<rect x="285" y="435" width="210" height="90" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<rect class="ink-echo" x="285" y="435" width="210" height="90" rx="6" stroke="#37424e" stroke-width="2" fill="none" opacity="0.32" transform="translate(-1.33 -0.64) rotate(-0.04 390.0 480.0)"/>
