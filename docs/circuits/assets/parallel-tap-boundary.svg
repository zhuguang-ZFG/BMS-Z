<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 590" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>并联示意：对外只有一个电压。总电流 10 A 时，两支路按内阻的反比分配，内阻大的那支电流更小。</title>
  <desc>蓝线随阻值比升高，红线下降，两者之和保持 10 A。金点沿蓝线走。示意，不是两节电芯的实测内阻。</desc>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; }
    .linek { stroke: #57606a; stroke-width: 2.2; fill: none; stroke-dasharray: 7 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .dotg { fill: #1a7f37; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .linek { stroke: #8b949e; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .dotg { fill: #3fb950; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
    }
  </style>
  <!-- formula: I1=10*k/(1+k); I2=10/(1+k); k=R2/R1; example k=2 is 20 mohm and 40 mohm -->
  <rect class="bg" width="800" height="590"/>
  <text class="title" x="24" y="32">并联只有一个电压，电流按内阻分（示意）</text>
  <rect class="panel" x="24" y="44" width="752" height="124" rx="6"/>
  <text class="txt" x="40" y="68" opacity="0.28">① 表笔只看得到一个电压<tspan class="small">　两节并在一起，端电压是同一点。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="92" opacity="0.28">② 总电流 10 A<tspan class="small">　示意。I1 = 10·k/(1+k)，k 是 R2/R1。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="116" opacity="0.28">③ k=2<tspan class="small">　若 R1=20 mΩ、R2=40 mΩ，电流大约 6.67 A 和 3.33 A。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="140" opacity="0.28">④ 口诀<tspan class="small">　电压一样，不代表两节一样用力。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="180" width="752" height="268" rx="6"/>
  <text class="small" x="40" y="202">支路电流 A（示意总电流 10 A）</text>
  <text class="hi" x="200" y="218">蓝 支路 1</text>
  <text class="warn" x="340" y="218">红 支路 2</text>
  <line class="axis" x1="108.0" y1="248.0" x2="108.0" y2="400.0"/>
  <line class="axis" x1="108.0" y1="400.0" x2="720.0" y2="400.0"/>
  <line class="grid" x1="108.0" y1="400.0" x2="108.0" y2="406.0"/>
  <text class="small" x="108.0" y="422.0" text-anchor="middle">1</text>
  <line class="grid" x1="312.0" y1="400.0" x2="312.0" y2="406.0"/>
  <text class="small" x="312.0" y="422.0" text-anchor="middle">2</text>
  <line class="grid" x1="720.0" y1="400.0" x2="720.0" y2="406.0"/>
  <text class="small" x="720.0" y="422.0" text-anchor="middle">4</text>
  <line class="grid" x1="102.0" y1="369.6" x2="108.0" y2="369.6"/>
  <text class="small" x="98.0" y="373.6" text-anchor="end">2</text>
  <line class="grid" x1="102.0" y1="324.0" x2="108.0" y2="324.0"/>
  <text class="small" x="98.0" y="328.0" text-anchor="end">5</text>
  <line class="grid" x1="102.0" y1="278.4" x2="108.0" y2="278.4"/>
  <text class="small" x="98.0" y="282.4" text-anchor="end">8</text>
  <text class="small" x="720" y="444" text-anchor="end">R2 / R1</text>
  <polyline class="lineb" points="108.0,324.0 123.3,321.3 138.6,318.7 153.9,316.3 169.2,314.1 184.5,312.0 199.8,310.0 215.1,308.2 230.4,306.5 245.7,304.8 261.0,303.3 276.3,301.8 291.6,300.4 306.9,299.1 322.2,297.8 337.5,296.6 352.8,295.5 368.1,294.4 383.4,293.4 398.7,292.4 414.0,291.4 429.3,290.5 444.6,289.6 459.9,288.8 475.2,288.0 490.5,287.2 505.8,286.5 521.1,285.8 536.4,285.1 551.7,284.4 567.0,283.8 582.3,283.1 597.6,282.5 612.9,282.0 628.2,281.4 643.5,280.9 658.8,280.3 674.1,279.8 689.4,279.3 704.7,278.9 720.0,278.4" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline class="liner" points="108.0,324.0 123.3,326.7 138.6,329.3 153.9,331.7 169.2,333.9 184.5,336.0 199.8,338.0 215.1,339.8 230.4,341.5 245.7,343.2 261.0,344.7 276.3,346.2 291.6,347.6 306.9,348.9 322.2,350.2 337.5,351.4 352.8,352.5 368.1,353.6 383.4,354.6 398.7,355.6 414.0,356.6 429.3,357.5 444.6,358.4 459.9,359.2 475.2,360.0 490.5,360.8 505.8,361.5 521.1,362.2 536.4,362.9 551.7,363.6 567.0,364.2 582.3,364.9 597.6,365.5 612.9,366.0 628.2,366.6 643.5,367.1 658.8,367.7 674.1,368.2 689.4,368.7 704.7,369.1 720.0,369.6" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="doty" r="6" cx="108.0" cy="324.0"><animate attributeName="cx" values="108.0;312.0;516.0;720.0;720.0" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="324.0;298.7;286.0;278.4;278.4" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite"/></circle>
  <circle class="dotr" r="4" cx="108.0" cy="324.0"><animate attributeName="cx" values="108.0;312.0;516.0;720.0;720.0" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite" begin="-6s"/><animate attributeName="cy" values="324.0;298.7;286.0;278.4;278.4" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite" begin="-6s"/></circle>
  <rect class="panel" x="24" y="460" width="752" height="68" rx="6"/>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="1">R2/R1=1  I1=5.00 A  I2=5.00 A  端电压只有一个  示意<animate attributeName="opacity" values="1;0;0;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0">R2/R1=2  I1=6.67 A  I2=3.33 A  端电压只有一个  示意<animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0">R2/R1=3  I1=7.50 A  I2=2.50 A  端电压只有一个  示意<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0">R2/R1=4  I1=8.00 A  I2=2.00 A  端电压只有一个  示意<animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="24" y="560">20 mΩ 只是和 SOH 示意同一量级。不能从端电压看出哪一节在偷懒。</text>

</svg>
