<svg xmlns="http://www.w3.org/2000/svg" width="800" height="680" viewBox="0 -156 800 680" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>均衡示例：4.2 V、100 Ω 被动约 0.18 W；10 μH、2 A 主动一拍约 20 μJ。不写效率百分数。示例值。</title>
  <desc>两笔账并排亮：左边被动的热是 4.2 V 压在 100 Ω 上约 0.18 W，右边主动一拍是 10 µH、2 A 存下 20 µJ。</desc><style>
