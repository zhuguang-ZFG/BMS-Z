<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460">
  <title>MOS 导通电阻发热动画</title>
  <rect width="800" height="460" fill="#f8fafc"/>
  <style>
  text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
  /* 深色模式：GitHub 深色主题下对调底色与文字色，只覆盖配色，不动几何与动画。
     stroke="#fff" 保持白色——那是彩色徽标上的勾选，不在覆盖范围内。 */
  @media (prefers-color-scheme: dark){
  rect[fill="#f8fafc"]{fill:#0f172a}
  rect[fill="#fff"]{fill:#1e293b}
  [fill="#f1f5f9"]{fill:#1e293b}
  [stroke="#f1f5f9"]{stroke:#1e293b}
  [fill="#e2e8f0"]{fill:#334155}
  [stroke="#e2e8f0"]{stroke:#334155}
  [fill="#cbd5e1"]{fill:#475569}
  [stroke="#cbd5e1"]{stroke:#475569}
  [fill="#64748b"]{fill:#94a3b8}
  [stroke="#64748b"]{stroke:#94a3b8}
  [fill="#475569"]{fill:#cbd5e1}
  [stroke="#475569"]{stroke:#cbd5e1}
  [fill="#334155"]{fill:#e2e8f0}
  [stroke="#334155"]{stroke:#e2e8f0}
  [fill="#1e293b"]{fill:#f1f5f9}
  [stroke="#1e293b"]{stroke:#f1f5f9}
  [fill="#dbeafe"]{fill:#1e3a8a}
  [stroke="#dbeafe"]{stroke:#1e3a8a}
  [fill="#eff6ff"]{fill:#172554}
  [stroke="#eff6ff"]{stroke:#172554}
  [fill="#bfdbfe"]{fill:#1e40af}
  [stroke="#bfdbfe"]{stroke:#1e40af}
  [fill="#1d4ed8"]{fill:#60a5fa}
  [stroke="#1d4ed8"]{stroke:#60a5fa}
  [fill="#1e40af"]{fill:#93c5fd}
  [stroke="#1e40af"]{stroke:#93c5fd}
  [fill="#2563eb"]{fill:#60a5fa}
  [stroke="#2563eb"]{stroke:#60a5fa}
  [fill="#3b82f6"]{fill:#60a5fa}
  [stroke="#3b82f6"]{stroke:#60a5fa}
  [fill="#ecfdf5"]{fill:#022c22}
  [stroke="#ecfdf5"]{stroke:#022c22}
  [fill="#a7f3d0"]{fill:#065f46}
  [stroke="#a7f3d0"]{stroke:#065f46}
  [fill="#86efac"]{fill:#166534}
  [stroke="#86efac"]{stroke:#166534}
  [fill="#065f46"]{fill:#6ee7b7}
  [stroke="#065f46"]{stroke:#6ee7b7}
  [fill="#059669"]{fill:#34d399}
  [stroke="#059669"]{stroke:#34d399}
  [fill="#fef2f2"]{fill:#450a0a}
  [stroke="#fef2f2"]{stroke:#450a0a}
  [fill="#fecaca"]{fill:#7f1d1d}
  [stroke="#fecaca"]{stroke:#7f1d1d}
  [fill="#fca5a5"]{fill:#b91c1c}
  [stroke="#fca5a5"]{stroke:#b91c1c}
  [fill="#991b1b"]{fill:#fca5a5}
  [stroke="#991b1b"]{stroke:#fca5a5}
  [fill="#dc2626"]{fill:#f87171}
  [stroke="#dc2626"]{stroke:#f87171}
  [fill="#fffbeb"]{fill:#451a03}
  [stroke="#fffbeb"]{stroke:#451a03}
  [fill="#fef3c7"]{fill:#78350f}
  [stroke="#fef3c7"]{stroke:#78350f}
  [fill="#92400e"]{fill:#fcd34d}
  [stroke="#92400e"]{stroke:#fcd34d}
  [fill="#b45309"]{fill:#fbbf24}
  [stroke="#b45309"]{stroke:#fbbf24}
  }
</style>

  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">P = I²·R：电流翻倍，发热四倍</text>

  <!-- 左：MOS 与电流 -->
  <rect x="110" y="150" width="80" height="70" fill="#bfdbfe" stroke="#475569" stroke-width="2">
    <animate attributeName="fill" values="#172554;#172554;#b91c1c;#b91c1c;#b91c1c" keyTimes="0;0.25;0.35;0.5;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <line x1="95" y1="185" x2="110" y2="185" stroke="#475569" stroke-width="2.5"/>
  <line x1="150" y1="120" x2="150" y2="150" stroke="#475569" stroke-width="2.5"/>
  <line x1="150" y1="220" x2="150" y2="250" stroke="#475569" stroke-width="2.5"/>
  <text x="86" y="189" text-anchor="middle" font-size="11" fill="#475569">G</text>
  <text x="164" y="128" text-anchor="start" font-size="11" fill="#475569">D</text>
  <text x="164" y="246" text-anchor="start" font-size="11" fill="#475569">S</text>
  <text x="150" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">I = 10A
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.23;0.26;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="150" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626" opacity="0">I = 20A
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.27;0.3;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="150" y="304" text-anchor="middle" font-size="11" fill="#475569">R_DS(on) = 5mΩ（示例）</text>

  <!-- 中：功率柱对比（0.5W vs 2W） -->
  <text x="340" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b" opacity="0">I ×2 → P ×4（平方关系）
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3;0.34;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <line x1="270" y1="300" x2="450" y2="300" stroke="#64748b" stroke-width="1.5"/>
  <rect x="295" y="270" width="50" height="0" fill="#f59e0b">
    <animate attributeName="height" values="0;0;30;30" keyTimes="0;0.05;0.2;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="y" values="300;300;270;270" keyTimes="0;0.05;0.2;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <rect x="385" y="180" width="50" height="0" fill="#dc2626">
    <animate attributeName="height" values="0;0;120;120" keyTimes="0;0.28;0.45;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="y" values="300;300;180;180" keyTimes="0;0.28;0.45;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text x="320" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309" opacity="0">0.5W
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.18;0.22;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="410" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626" opacity="0">2W
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.43;0.47;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="320" y="318" text-anchor="middle" font-size="11" fill="#475569">10A</text>
  <text x="410" y="318" text-anchor="middle" font-size="11" fill="#475569">20A</text>

  <!-- 右：正反馈环 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.55;1" dur="12s" repeatCount="indefinite"/>
    <circle cx="640" cy="150" r="34" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="640" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">温度↑</text>
    <circle cx="720" cy="240" r="34" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="720" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">电阻↑</text>
    <circle cx="560" cy="240" r="34" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="560" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">发热↑</text>
    <path d="M662,178 L694,212" fill="none" stroke="#dc2626" stroke-width="2"/>
    <path d="M686,240 L594,240" fill="none" stroke="#dc2626" stroke-width="2"/>
    <path d="M586,212 L618,178" fill="none" stroke="#dc2626" stroke-width="2"/>
    <circle r="5" fill="#dc2626">
      <animateMotion path="M640,150 L720,240 L560,240 L640,150" calcMode="linear" dur="12s" repeatCount="indefinite"/>
    </circle>
    <text x="640" y="308" text-anchor="middle" font-size="11" fill="#991b1b">正温系数：越热阻越大，发热更多</text>
  </g>

  <!-- 底部：四张解法卡 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.72;0.76;1" dur="12s" repeatCount="indefinite"/>
    <rect x="60" y="350" width="165" height="46" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="142" y="369" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">多颗并联分流</text>
    <text x="142" y="386" text-anchor="middle" font-size="12" fill="#475569">热的那颗阻大自动让流</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.77;0.81;1" dur="12s" repeatCount="indefinite"/>
    <rect x="240" y="350" width="165" height="46" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="322" y="369" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">加铜皮 / 散热</text>
    <text x="322" y="386" text-anchor="middle" font-size="12" fill="#475569">把热导出去</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.86;1" dur="12s" repeatCount="indefinite"/>
    <rect x="420" y="350" width="165" height="46" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="502" y="369" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">按高温阻值选型</text>
    <text x="502" y="386" text-anchor="middle" font-size="12" fill="#475569">别看手册首页 25℃ 的数</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.87;0.91;1" dur="12s" repeatCount="indefinite"/>
    <rect x="600" y="350" width="165" height="46" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="682" y="369" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">限持续电流</text>
    <text x="682" y="386" text-anchor="middle" font-size="12" fill="#475569">靠降额避开长时间大电流</text>
  </g>

  <text x="400" y="444" text-anchor="middle" font-size="13" fill="#475569">关键：发热随电流平方涨，温度又反过来抬高电阻——会自我放大，选型按最坏工况。</text>
</svg>
