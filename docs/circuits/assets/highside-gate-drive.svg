  </line>
  <text x="452" y="52" text-anchor="end" font-size="12" opacity="0" class="warn">58V
    <animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.32;1" dur="12s" repeatCount="indefinite" />
  </text>
  
  <text x="600" y="330" text-anchor="middle" font-size="13" font-weight="bold" opacity="0" class="warn">V_G = V_S + 10V = 58V，比 B+ 还高
    <animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.34;0.46;0.49;1" dur="12s" repeatCount="indefinite" />
  </text>
  <text x="600" y="352" text-anchor="middle" font-size="12" opacity="0" class="small">好处：断开时负载端彻底脱离 B+
