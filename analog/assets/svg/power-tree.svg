<rect x="430" y="194" width="104" height="52" rx="10" fill="#f6eedb" stroke="#6b3f63" stroke-width="2"/>
<text x="482" y="216" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6b3f63">DCDC 5V</text>
<text x="482" y="234" text-anchor="middle" font-size="9.5" fill="#5b666f">高效，喂数字</text>
<path d="M534 220 Q592.00 220.19 650 220" fill="none" stroke="#8b8272" stroke-width="2.5"/>
<rect x="650" y="194" width="118" height="52" rx="10" fill="#f6eedb" stroke="#6b3f63" stroke-width="2"/>
<text x="709" y="218" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b3f63">MCU（数字）</text>
<text x="709" y="236" text-anchor="middle" font-size="9.5" fill="#5b666f">+100nF 就近去耦</text>
<g filter="url(#pglow)"><circle r="4.5" fill="#e4f1f3"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M534,220 H650" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle>
