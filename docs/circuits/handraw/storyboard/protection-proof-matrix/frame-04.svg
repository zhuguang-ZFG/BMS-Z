<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
<defs>
 <filter id="w" filterUnits="userSpaceOnUse" x="0" y="0" width="960" height="560">
  <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="11" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="4.5" xChannelSelector="R" yChannelSelector="G"/>
 </filter>
 <filter id="grain" filterUnits="userSpaceOnUse" x="0" y="0" width="960" height="560">
  <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="5"/>
  <feColorMatrix type="saturate" values="0"/></filter>
</defs>
<rect width="960" height="560" fill="#f6f1e3"/>
<rect width="960" height="560" filter="url(#grain)" opacity="0.22"/>
<text x="480" y="62" font-family="KaiTi" font-size="20" fill="#003153" text-anchor="middle">两路一起切断，能证明两路都有效吗？</text>
<text x="480" y="108" font-family="KaiTi" font-size="15" fill="#003153" text-anchor="middle">限流模拟台架 · 相同故障条件 · 图中均为预期结果</text>
<text x="145" y="163" font-family="KaiTi" font-size="18" fill="#003153" text-anchor="middle">试验条件</text>
<text x="370" y="163" font-family="KaiTi" font-size="18" fill="#003153" text-anchor="middle">硬件路径</text>
<text x="560" y="163" font-family="KaiTi" font-size="18" fill="#003153" text-anchor="middle">软件路径</text>
<text x="790" y="163" font-family="KaiTi" font-size="18" fill="#003153" text-anchor="middle">预期观测</text>
<line x1="62" y1="184" x2="898" y2="184" stroke="#003153" stroke-width="1.3" filter="url(#w)" opacity="0.65"/>
<line x1="62" y1="260" x2="898" y2="260" stroke="#003153" stroke-width="1.3" filter="url(#w)" opacity="0.65"/>
<line x1="62" y1="337" x2="898" y2="337" stroke="#003153" stroke-width="1.3" filter="url(#w)" opacity="0.65"/>
<line x1="62" y1="414" x2="898" y2="414" stroke="#003153" stroke-width="1.3" filter="url(#w)" opacity="0.65"/>
<text x="145" y="225" font-family="KaiTi" font-size="17" fill="#003153" text-anchor="middle">联合试验</text>
<text x="370" y="225" font-family="KaiTi" font-size="17" fill="#003153" text-anchor="middle">允许动作</text>
<text x="560" y="225" font-family="KaiTi" font-size="17" fill="#003153" text-anchor="middle">允许动作</text>
<text x="790" y="225" font-family="KaiTi" font-size="17" fill="#003153" text-anchor="middle">切断：归因不明</text>
<text x="145" y="302" font-family="KaiTi" font-size="17" fill="#003153" text-anchor="middle">仅测硬件</text>
<text x="370" y="302" font-family="KaiTi" font-size="17" fill="#003153" text-anchor="middle">允许动作</text>
<text x="560" y="302" font-family="KaiTi" font-size="17" fill="#003153" text-anchor="middle">屏蔽动作</text>
<text x="790" y="302" font-family="KaiTi" font-size="17" fill="#003153" text-anchor="middle">应切断</text>
<text x="145" y="379" font-family="KaiTi" font-size="17" fill="#003153" text-anchor="middle">仅测软件</text>
<text x="370" y="379" font-family="KaiTi" font-size="17" fill="#003153" text-anchor="middle">屏蔽动作</text>
<text x="560" y="379" font-family="KaiTi" font-size="17" fill="#003153" text-anchor="middle">允许动作</text>
<text x="790" y="379" font-family="KaiTi" font-size="17" fill="#003153" text-anchor="middle">应切断</text>
<text x="480" y="454" font-family="KaiTi" font-size="17" fill="#003153" text-anchor="middle">在隔离限流台架上，仅测软件动作。</text>
<text x="480" y="490" font-family="KaiTi" font-size="18" fill="#003153" text-anchor="middle">两组分别留证，才有两条路径各自有效的证据。</text>
<text x="480" y="540" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="middle">原理示意 / 非实拍　不用于真电池屏蔽保护；操作与恢复按芯片及台架规程</text>
</svg>
