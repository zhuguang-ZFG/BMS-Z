<circle r="4" fill="#2f7f96"><animateMotion dur="6s" begin="3.50s" repeatCount="indefinite" path="M566,108 H656" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle></g></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.02;0.2;0.26;1" dur="6s" repeatCount="indefinite"/><rect x="146.7" y="386.9" width="506.7" height="24.1" rx="12.0" fill="#a8321f" fill-opacity="0.09" stroke="#a8321f" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.2;0.26;1" dur="6s" repeatCount="indefinite"/></rect><text x="400" y="400" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#a8321f" opacity="0">① 限幅：输出想越过 基准+0.7V，二极管开闸泄流——波形顶部被削平<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.2;0.26;1" dur="6s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.26;0.32;0.5;0.56;1" dur="6s" repeatCount="indefinite"/><rect x="131.9" y="386.9" width="536.2" height="24.1" rx="12.0" fill="#a4630f" fill-opacity="0.09" stroke="#a4630f" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.26;0.32;0.5;0.56;1" dur="6s" repeatCount="indefinite"/></rect><text x="400" y="400" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#a4630f" opacity="0">② 双向版就是 ADC 引脚保护：两只二极管把信号锁进 ±0.7V——第一道墙<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.26;0.32;0.5;0.56;1" dur="6s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.56;0.62;0.78;0.84;1" dur="6s" repeatCount="indefinite"/><rect x="49.0" y="386.9" width="702.0" height="24.1" rx="12.0" fill="#3d6b4a" fill-opacity="0.09" stroke="#3d6b4a" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.56;0.62;0.78;0.84;1" dur="6s" repeatCount="indefinite"/></rect><text x="400" y="400" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#3d6b4a" opacity="0">③ 钳位：负半周瞬间 D 导通，C 充到 ≈2.3V（峰值 3V − 0.7V）——此后 D 常关，C 变成串联电池<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.56;0.62;0.78;0.84;1" dur="6s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.84;0.9;1" dur="6s" repeatCount="indefinite"/><rect x="148.4" y="386.9" width="503.2" height="24.1" rx="12.0" fill="#2f7f96" fill-opacity="0.09" stroke="#2f7f96" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.84;0.9;1" dur="6s" repeatCount="indefinite"/></rect><text x="400" y="400" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2f7f96" opacity="0">④ 输出整体垫高：±3V 进来，−0.7~5.3V 出去——直流分量被恢复了<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.84;0.9;1" dur="6s" repeatCount="indefinite"/></text></g><g opacity="0">
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.86;1" dur="6s" repeatCount="indefinite"/>
<rect x="55" y="406" width="690" height="52.0" rx="9" fill="#e8efe6" stroke="#3d6b4a" stroke-width="1.5" filter="url(#soft)"/><rect x="61" y="413" width="3" height="38.0" rx="1.5" fill="#3d6b4a"/><text x="400" y="428.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3d6b4a">一句话分清：限幅动「幅度」（削顶），钳位动「直流」（垫高）。同</text><text x="400" y="446.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3d6b4a">一个 0.7V，闸门还是垫脚石，取决于二极管朝哪边、取样的是哪只。</text>
</g></svg>