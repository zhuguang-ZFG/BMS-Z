 <text x="648.0" y="152.0" font-family="KaiTi" font-size="13" fill="#003153" text-anchor="middle">CRC8</text>
</g>
</g>
<g class="motion" data-x="1">
<g filter="url(#w)">
 <text x="323.0" y="180.0" font-family="KaiTi" font-size="14" fill="#003153" text-anchor="middle" font-weight="bold">过</text>
 <text x="505.0" y="180.0" font-family="KaiTi" font-size="14" fill="#003153" text-anchor="middle" font-weight="bold">过</text>
 <text x="648.0" y="180.0" font-family="KaiTi" font-size="14" fill="#003153" text-anchor="middle" font-weight="bold">过</text>
 <text x="480.0" y="202.0" font-family="KaiTi" font-size="14" fill="#003153" text-anchor="middle">结构合法：头、长度、CRC 全过</text>
 <line x1="120" y1="212.0" x2="840" y2="212.0" stroke="#003153" stroke-width="1.5" stroke-dasharray="7 5"/>
</g>
</g>
<g class="motion" data-x="1">
<g filter="url(#w)">
 <line x1="300.0" y1="262.0" x2="660.0" y2="262.0" stroke="#003153" stroke-width="1.7"/>
 <line x1="300.0" y1="253.0" x2="300.0" y2="271.0" stroke="#003153" stroke-width="1.5"/>
 <line x1="660.0" y1="253.0" x2="660.0" y2="271.0" stroke="#003153" stroke-width="1.5"/>
 <path d="M649.0,257.0 L660.0,262.0 L649.0,267.0" fill="none" stroke="#003153" stroke-width="1.6"/>
