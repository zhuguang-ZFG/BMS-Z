<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">信号注入与二分：每测一次，砍掉一半</title>
<desc id="figDesc">上排是一条手绘信号链：传感器、放大、滤波、ADC。每个环节的输入用琥珀色箭头标出注入点，输出用青色箭头标出测量点，右上角盖有“先电源后信号”的印章。下排把 16 个节点按二分逐轮缩小：16 剩 8、剩 4、剩 2、剩 1，四轮测量分别标出测量位置。底部写着“每测一次，砍掉一半”，并注明 4 次等于 log₂16。</desc>
<rect width="960" height="620" fill="#fffdf8"/>

<text x="36" y="48" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="28" font-weight="700" fill="#14213d">信号注入与二分：每测一次，砍掉一半</text>
<text x="36" y="78" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="15" fill="#52606d">链路不吭声时，先送一个已知信号；范围不明时，每次切一半。</text>
<line x1="36" y1="96" x2="924" y2="96" stroke="#14213d" stroke-width="2"/>

<g transform="rotate(-0.5 480 250)">
<rect x="36" y="116" width="888" height="250" fill="#fffef9" stroke="#14213d" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="56" y="146" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="18" font-weight="700" fill="#14213d">一条不吭声的链路</text>

<g transform="rotate(-3 836 170)">
<rect x="774" y="148" width="132" height="42" rx="3" fill="none" stroke="#b42318" stroke-width="2.2"/>
<rect x="780" y="154" width="120" height="30" fill="none" stroke="#b42318" stroke-width="0.8"/>
<text x="840" y="174" text-anchor="middle" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="14" font-weight="700" fill="#b42318">先电源，后信号</text>
</g>

<g font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="15" font-weight="700" fill="#14213d">
<rect x="80" y="222" width="140" height="62" rx="4" fill="#fffdf8" stroke="#14213d" stroke-width="2"/>
<text x="150" y="259" text-anchor="middle">传感器</text>
<rect x="280" y="222" width="140" height="62" rx="4" fill="#fffdf8" stroke="#14213d" stroke-width="2"/>
<text x="350" y="259" text-anchor="middle">放大</text>
<rect x="480" y="222" width="140" height="62" rx="4" fill="#fffdf8" stroke="#14213d" stroke-width="2"/>
<text x="550" y="259" text-anchor="middle">滤波</text>
<rect x="680" y="222" width="140" height="62" rx="4" fill="#fffdf8" stroke="#14213d" stroke-width="2"/>
<text x="750" y="259" text-anchor="middle">ADC</text>
</g>

<g stroke="#14213d" stroke-width="2" fill="none">
<line x1="220" y1="253" x2="274" y2="253"/>
<line x1="420" y1="253" x2="474" y2="253"/>
<line x1="620" y1="253" x2="674" y2="253"/>
<line x1="820" y1="253" x2="874" y2="253"/>
</g>
<g fill="#14213d">
<path d="M274 249 l8 4 l-8 4 z"/>
<path d="M474 249 l8 4 l-8 4 z"/>
<path d="M674 249 l8 4 l-8 4 z"/>
<path d="M874 249 l8 4 l-8 4 z"/>
</g>
<text x="884" y="231" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12" fill="#52606d">输出</text>

<g fill="#b45309" font-family="'Book Mono',monospace" font-size="12">
<text x="80" y="190">注入 A</text>
<text x="280" y="190">注入 B</text>
<text x="480" y="190">注入 C</text>
<text x="680" y="190">注入 D</text>
</g>
<g stroke="#b45309" stroke-width="2.4" stroke-dasharray="5 4">
<line x1="105" y1="198" x2="105" y2="216"/>
<line x1="305" y1="198" x2="305" y2="216"/>
<line x1="505" y1="198" x2="505" y2="216"/>
<line x1="705" y1="198" x2="705" y2="216"/>
</g>
<g fill="#b45309">
<path d="M101 214 l4 8 l4 -8 z"/>
<path d="M301 214 l4 8 l4 -8 z"/>
<path d="M501 214 l4 8 l4 -8 z"/>
<path d="M701 214 l4 8 l4 -8 z"/>
</g>

<g fill="#0f766e" font-family="'Book Mono',monospace" font-size="12">
<text x="118" y="326">测 A</text>
<text x="318" y="326">测 B</text>
<text x="518" y="326">测 C</text>
<text x="718" y="326">测 D</text>
</g>
<g stroke="#0f766e" stroke-width="2.4" stroke-dasharray="5 4">
<line x1="145" y1="290" x2="145" y2="308"/>
<line x1="345" y1="290" x2="345" y2="308"/>
<line x1="545" y1="290" x2="545" y2="308"/>
<line x1="745" y1="290" x2="745" y2="308"/>
</g>
<g fill="#0f766e">
<path d="M141 306 l4 8 l4 -8 z"/>
<path d="M341 306 l4 8 l4 -8 z"/>
<path d="M541 306 l4 8 l4 -8 z"/>
<path d="M741 306 l4 8 l4 -8 z"/>
</g>
</g>

<g transform="rotate(0.5 480 470)">
<text x="56" y="410" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="18" font-weight="700" fill="#14213d">二分：把 16 个节点切成 1 个</text>

<g font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="15" font-weight="700">
<rect x="60" y="436" width="132" height="58" rx="4" fill="#fdf3e3" stroke="#b45309" stroke-width="2"/>
<text x="126" y="471" text-anchor="middle" fill="#b42318">16 个节点</text>
<rect x="248" y="436" width="118" height="58" rx="4" fill="#fffdf8" stroke="#14213d" stroke-width="1.8"/>
<text x="307" y="471" text-anchor="middle" fill="#14213d">剩 8</text>
<rect x="422" y="436" width="118" height="58" rx="4" fill="#fffdf8" stroke="#14213d" stroke-width="1.8"/>
<text x="481" y="471" text-anchor="middle" fill="#14213d">剩 4</text>
<rect x="596" y="436" width="118" height="58" rx="4" fill="#fffdf8" stroke="#14213d" stroke-width="1.8"/>
<text x="655" y="471" text-anchor="middle" fill="#14213d">剩 2</text>
<rect x="770" y="436" width="118" height="58" rx="4" fill="#eef7f4" stroke="#0f766e" stroke-width="2.2"/>
<text x="829" y="471" text-anchor="middle" fill="#0f766e">剩 1</text>
</g>

<g stroke="#14213d" stroke-width="2" fill="none">
<line x1="192" y1="465" x2="242" y2="465"/>
<line x1="366" y1="465" x2="416" y2="465"/>
<line x1="540" y1="465" x2="590" y2="465"/>
<line x1="714" y1="465" x2="764" y2="465"/>
</g>
<g fill="#14213d">
<path d="M242 461 l8 4 l-8 4 z"/>
<path d="M416 461 l8 4 l-8 4 z"/>
<path d="M590 461 l8 4 l-8 4 z"/>
<path d="M764 461 l8 4 l-8 4 z"/>
</g>

<g font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="11.5" fill="#52606d">
<text x="126" y="520" text-anchor="middle">第 1 次</text>
<text x="126" y="536" text-anchor="middle">测 8/9 之间</text>
<text x="307" y="520" text-anchor="middle">第 2 次</text>
<text x="307" y="536" text-anchor="middle">测 12/13 之间</text>
<text x="481" y="520" text-anchor="middle">第 3 次</text>
<text x="481" y="536" text-anchor="middle">测 10/11 之间</text>
<text x="655" y="520" text-anchor="middle">第 4 次</text>
<text x="655" y="536" text-anchor="middle">测第 11 级输出</text>
<text x="829" y="520" text-anchor="middle">故障级锁定</text>
<text x="829" y="536" text-anchor="middle">第 11 级</text>
</g>

<text x="906" y="444" text-anchor="end" font-family="'Book Mono',monospace" font-size="13" fill="#b45309">4 次 = log₂16</text>
</g>

<path d="M66 574 Q250 580 440 574" fill="none" stroke="#b45309" stroke-width="1.6" stroke-linecap="round"/>
<text x="36" y="604" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="20" font-weight="700" fill="#14213d">每测一次，砍掉一半。</text>
<text x="300" y="604" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="13" fill="#52606d">测点选在剩余嫌疑的中点；异常点再往前切一刀，直到正常与异常相邻。</text>
</svg>
