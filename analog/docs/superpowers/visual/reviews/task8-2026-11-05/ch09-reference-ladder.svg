<text x="45" y="299" font-size="26" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">基准分配</text>
<rect x="205" y="265" width="160.0" height="52" rx="6" fill="#f6eedb" stroke="#1f5d7a" stroke-width="2"/>
<rect class="ink-echo" x="205" y="265" width="160.0" height="52" rx="6" stroke="#1f5d7a" stroke-width="2" fill="none" opacity="0.32" transform="translate(-1.59 -0.70) rotate(0.03 285.0 291.0)"/>
<text x="380.0" y="301" font-size="24" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">0.2 mV</text>
<text x="50" y="385" font-size="25" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">0.2 mV / 3.3 V ≈ 60.6 ppm，不能在多项里重复花。</text>
<rect x="50" y="435" width="210" height="90" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
