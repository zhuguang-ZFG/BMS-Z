<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 800 500" font-family="ui-monospace, Consolas, monospace" data-snapshot-time="8">
  <title>放电峰值电流由端电压下限决定：I=(OCV−Vmin)/R。平台上变化慢，快放空时掉向零。数字为示意。</title>
  <desc>亮点沿 SOC 从满电走到 0.10：平台上峰值电流变化慢，快放空时按 I=(OCV−Vmin)/R 掉向零。</desc>

  <style>
    .bg { fill: #fffdf5; }
    .panel { fill: #f7f2e5; stroke: #cfc6b2; }
    .axis { stroke: #626d65; stroke-width: 1.5; fill: none; }
    .grid { stroke: #cfc6b2; stroke-width: 1; fill: none; }
    .txt { fill: #293b3a; font-size: 13px; }
    .small { fill: #626d65; font-size: 12px; }
    .title { fill: #293b3a; font-size: 16px; font-weight: bold; }
    .hi { fill: #176b73; }
    .warn { fill: #b84745; }
    .ok { fill: #377b60; }
    .gold { fill: #926717; }
    .lineb { stroke: #176b73; stroke-width: 2.5; fill: none; }
    .liner { stroke: #b84745; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #377b60; stroke-width: 2.5; fill: none; }
    .liney { stroke: #926717; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .dotb { fill: #176b73; }
    .dotr { fill: #b84745; }
    .dotg { fill: #377b60; }
    .doty { fill: #926717; }
    .boxb { fill: #e4f0df; stroke: #176b73; }
    .boxr { fill: #f6e2df; stroke: #b84745; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #192727; }
      .panel { fill: #223333; stroke: #496160; }
      .axis { stroke: #b0beb3; }
      .grid { stroke: #496160; }
      .txt { fill: #edf0e5; }
      .small { fill: #b0beb3; }
      .title { fill: #edf0e5; }
      .hi { fill: #7ec5c5; }
      .warn { fill: #f39b91; }
      .ok { fill: #8fc7a2; }
      .gold { fill: #dfbd78; }
      .lineb { stroke: #7ec5c5; }
      .liner { stroke: #f39b91; }
      .lineg { stroke: #8fc7a2; }
      .liney { stroke: #dfbd78; }
      .dotb { fill: #7ec5c5; }
      .dotr { fill: #f39b91; }
      .dotg { fill: #8fc7a2; }
      .doty { fill: #dfbd78; }
      .boxb { fill: #293f35; stroke: #7ec5c5; }
      .boxr { fill: #483336; stroke: #f39b91; }
    }
  </style>

  <!-- formula: I=max(0,(OCV_lfp(z)-3.00)/0.015) -->
  <rect class="bg" width="800" height="500"/>
  <text class="title" x="24" y="32">电压这道墙先把电流拦住（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="122" rx="6"/>
  <text class="txt" x="40" y="68" opacity="1" style="opacity: 1;">① 满电附近<tspan class="small">　OCV 抬头，示意电流最大。公式 I=max(0,(OCV−3.00)/0.015)。</tspan></text>
  <text class="txt" x="40" y="94" opacity="1" style="opacity: 1;">② 到 SOC 0.80<tspan class="small">　约 25.4 A，功率约 76.2 W。平台开始了。</tspan></text>
  <text class="txt" x="40" y="120" opacity="1" style="opacity: 1;">③ SOC 0.50<tspan class="small">　仍约 22.7 A。铁锂中段电压几乎不动，电流也几乎不动。</tspan></text>
  <text class="txt" x="40" y="146" opacity="1" style="opacity: 1;">④ 过了 0.10<tspan class="small">　电流掉下去。0.05 以下 OCV 低于 3.00 V，电流为 0。温度和电流上限还要再取更小的。</tspan></text>
  <rect class="panel" x="24" y="182" width="752" height="250" rx="6"/>
  <text class="small" x="40" y="204">电压限位电流 A</text>
  <line class="axis" x1="92.0" y1="214.0" x2="92.0" y2="400.0"/>
  <line class="axis" x1="92.0" y1="400.0" x2="720.0" y2="400.0"/>
  <text class="small" x="712.0" y="418" text-anchor="end">SOC</text>
  <line class="grid" x1="154.8" y1="400.0" x2="154.8" y2="406.0"/>
  <text class="small" x="154.8" y="432" text-anchor="middle">0.1</text>
  <line class="grid" x1="406.0" y1="400.0" x2="406.0" y2="406.0"/>
  <text class="small" x="406.0" y="432" text-anchor="middle">0.5</text>
  <line class="grid" x1="594.4" y1="400.0" x2="594.4" y2="406.0"/>
  <text class="small" x="594.4" y="432" text-anchor="middle">0.8</text>
  <line class="grid" x1="720.0" y1="400.0" x2="720.0" y2="406.0"/>
  <text class="small" x="720.0" y="432" text-anchor="middle">1</text>
  <line class="grid" x1="86.0" y1="400.0" x2="92.0" y2="400.0"/>
  <text class="small" x="82.0" y="404.0" text-anchor="end">0</text>
  <line class="grid" x1="86.0" y1="322.5" x2="92.0" y2="322.5"/>
  <text class="small" x="82.0" y="326.5" text-anchor="end">25</text>
  <line class="grid" x1="86.0" y1="245.0" x2="92.0" y2="245.0"/>
  <text class="small" x="82.0" y="249.0" text-anchor="end">50</text>
  <polyline class="lineb" points="104.6,400.0 110.8,400.0 117.1,400.0 123.4,400.0 129.7,400.0 136.0,396.2 142.2,388.3 148.5,380.5 154.8,373.0 161.1,366.0 167.4,359.9 173.6,354.7 179.9,350.3 186.2,346.8 192.5,343.9 198.8,341.7 205.0,339.9 211.3,338.5 217.6,337.4 223.9,336.6 230.2,335.9 236.4,335.3 242.7,334.9 249.0,334.5 255.3,334.2 261.6,333.9 267.8,333.6 274.1,333.4 280.4,333.2 286.7,333.0 293.0,332.8 299.2,332.6 305.5,332.4 311.8,332.2 318.1,332.1 324.4,331.9 330.6,331.7 336.9,331.6 343.2,331.4 349.5,331.2 355.8,331.1 362.0,330.9 368.3,330.7 374.6,330.6 380.9,330.4 387.2,330.2 393.4,330.1 399.7,329.9 406.0,329.7 412.3,329.6 418.6,329.4 424.8,329.2 431.1,329.1 437.4,328.9 443.7,328.7 450.0,328.6 456.2,328.4 462.5,328.2 468.8,328.1 475.1,327.9 481.4,327.7 487.6,327.5 493.9,327.4 500.2,327.2 506.5,327.0 512.8,326.8 519.0,326.6 525.3,326.4 531.6,326.1 537.9,325.9 544.2,325.6 550.4,325.3 556.7,325.0 563.0,324.6 569.3,324.1 575.6,323.6 581.8,323.0 588.1,322.2 594.4,321.3 600.7,320.2 607.0,318.9 613.2,317.2 619.5,315.2 625.8,312.9 632.1,310.0 638.4,306.7 644.6,302.7 650.9,298.3 657.2,293.3 663.5,287.8 669.8,282.1 676.0,276.1 682.3,270.2 688.6,264.4 694.9,259.0 701.2,254.0 707.4,249.5 713.7,245.6 720.0,242.2" stroke-linejoin="round" stroke-linecap="round"/>
  <text class="hi" x="360" y="250">平台上电流几乎不动</text>
  <text class="warn" x="120" y="340">快放空时掉向 0</text>
  <circle class="doty" r="6" cx="195.05641174316406" cy="350.1794738769531"/>
  <text class="small" x="24" y="478">3.00 V、15 mΩ 和铁锂示意 OCV 是一套教学数。截止电压以规格书为准。这里还没把极化尾巴算进去。</text>
</svg>
