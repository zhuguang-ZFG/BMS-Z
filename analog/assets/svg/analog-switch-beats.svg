<animate attributeName="opacity" values="0;1;1" keyTimes="0.000000000;0.400000000;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
<rect x="22" y="515" width="756" height="87" rx="9" fill="#e6eff3" stroke="#1f5d7a" stroke-width="1.5"/>
<text x="40" y="540" font-size="12" font-weight="bold" fill="#1f5d7a">四拍账本：精度与速度，在模拟开关这一级就定死了</text>
<text x="40" y="563" font-size="11" fill="#5b666f">Q_ch = C_ox·W·L·(V_GS−V_TH) ≈ 0.2pC（随信号电压变化）；ΔV = Q_ch/2C_h = 0.2pC/(2×10pF) = 10mV</text>
<text x="40" y="585" font-size="11" fill="#5b666f">12 位 / 2.048V：1 LSB = 500µV → 10mV = 20 个 LSB！加大 C_h 到 100pF 使 ΔV→1mV，代价 τ=R_on·C_h 长 10 倍</text>
<text x="40" y="597" font-size="10.5" font-weight="bold" fill="#a8321f">对策：dummy 半尺寸管反向注入 / 加大 C_h 摊薄 / 差分结构两侧等量相消</text>
