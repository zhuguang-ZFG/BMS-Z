[stroke="#a8321f"]{stroke:#c07a63}
text[fill="#a4630f"]{fill:#dcab63}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#a4630f"]{fill:#553a17}
[stroke="#a4630f"]{stroke:#c08a45}
text[fill="#6b3f63"]{fill:#c4a2bf}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#6b3f63"]{fill:#452c40}
[stroke="#6b3f63"]{stroke:#a17c9b}
}
</style>

<text x="52" y="58" font-size="38" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">输入滤波：先算谐振，再查阻尼与交互</text><text x="52" y="94" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">示意 C入 = C出 = 10 µF、L = 1 µH；不承诺固定插入损耗。</text>
<rect x="50" y="220" width="140" height="100" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<text x="120" y="278" font-size="26" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">电源</text>
<rect x="770" y="220" width="180" height="100" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<text x="860" y="278" font-size="26" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">Buck</text>
<path d="M190 250 H440 M560 250 H770 M120 320 V420 H860 V320" fill="none" stroke="#37424e" stroke-width="3"/>
<rect x="440" y="224" width="120" height="52" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<text x="500" y="259" font-size="24" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">L</text>
<path d="M300 250 V320 M268 320 H332 M268 338 H332 M300 338 V420" fill="none" stroke="#1f5d7a" stroke-width="3"/>
<text x="342" y="350" font-size="23" fill="#1f5d7a" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">C入</text>
<path d="M670 250 V320 M638 320 H702 M638 338 H702 M670 338 V420" fill="none" stroke="#1f5d7a" stroke-width="3"/>
<text x="712" y="350" font-size="23" fill="#1f5d7a" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">C出</text>
<text x="60" y="470" font-size="24" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">理想低源阻时，L 与 C出 的 f₀ ≈ 50.33 kHz</text>
<text x="60" y="520" font-size="22" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">目标：500 kHz 衰减 ≥40 dB；需带源阻、负载、ESR/ESL 验证。</text>
<text x="60" y="566" font-size="22" fill="#a8321f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">不是两级各 20 dB/dec 的保证；谐振峰可能反而放大噪声。</text>
<text x="60" y="612" font-size="22" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">闭环 Buck 可呈负增量输入阻抗；核对滤波器输出阻抗与阻尼。</text>
<text x="60" y="658" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">再检查电感偏置/温升、电容有效容值与启动波形。</text>
</svg>
