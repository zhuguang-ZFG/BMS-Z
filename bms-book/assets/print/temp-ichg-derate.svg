<svg data-sketch="1" xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 800 460" font-family="ui-monospace, Consolas, monospace" data-snapshot-time="8">
  <title>充电电流随温度降额的示意曲线：冰点以下不充，常温允许更大电流，高温再收到零。</title>
  <desc>折线按温度逐段亮起：冰点以下电流为零，0–10 °C 给 0.2C，常温放开到 1C，45 °C 以上再收到零。</desc>

