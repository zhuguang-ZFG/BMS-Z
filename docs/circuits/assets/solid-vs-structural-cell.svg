</style><rect class="bg" x="0" y="-156" width="880" height="760" /><text class="title" x="24" y="-128">四种说法对照：离子走哪一层，碳纤维是电极还是外壳</text><rect class="panel" x="24" y="-112" width="832" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 四种说法对照：离子走哪一层，碳纤维是电极还是外壳<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 隔膜 + 液态电解液<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 电子仍走外电路。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="548" width="832" height="44" rx="6" /><text class="small" x="40" y="576">4.2 V / 3.65 V。示意。</text><rect width="880" height="540" class="bg" />
  <rect x="16" y="48" width="420" height="220" rx="8" class="panel" />
  <text x="32" y="72" font-size="15" font-weight="bold" class="txt">液态锂电</text>
  <rect x="32" y="84" width="168" height="36" rx="4" class="fill-boxr stroke-axis" />
  <text x="116" y="107" text-anchor="middle" font-size="13" class="txt">正极</text>
  <rect x="32" y="124" width="168" height="52" rx="4" class="fill-boxb stroke-axis" />
  <text x="116" y="146" text-anchor="middle" font-size="13" class="txt">隔膜 + 液态电解液</text>
  <text x="116" y="164" text-anchor="middle" font-size="12" class="txt">锂离子走这里</text>
  <circle cy="150" r="5" class="fill-b">
    <animate attributeName="cx" values="48;184;48" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite" />
  </circle>
  <rect x="32" y="180" width="168" height="36" rx="4" class="fill-muted stroke-axis" />
  <text x="116" y="203" text-anchor="middle" font-size="13" class="txt">石墨负极</text>
  <text x="216" y="120" font-size="13" class="txt">电子仍走外电路。</text>
  <text x="216" y="142" font-size="13" class="txt">4.2 V / 3.65 V</text>
  <text x="216" y="162" font-size="13" class="txt">只是常见液态体系</text>
  <text x="216" y="182" font-size="13" class="txt">的示例红线。</text>

  <rect x="448" y="48" width="416" height="220" rx="8" class="panel" />
  <text x="464" y="72" font-size="15" font-weight="bold" class="txt">固态电池（示意）</text>
  <rect x="464" y="84" width="168" height="36" rx="4" class="fill-boxr stroke-axis" />
  <text x="548" y="107" text-anchor="middle" font-size="13" class="txt">正极</text>
  <rect x="464" y="124" width="168" height="52" rx="4" class="fill-boxg stroke-axis" />
  <text x="548" y="146" text-anchor="middle" font-size="13" class="txt">固体电解质</text>
  <text x="548" y="164" text-anchor="middle" font-size="12" class="txt">锂离子改走固体</text>
  <circle cy="150" r="5" class="fill-g">
    <animate attributeName="cx" values="480;616;480" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite" />
  </circle>
  <rect x="464" y="180" width="168" height="36" rx="4" class="fill-boxy stroke-axis" />
  <text x="548" y="203" text-anchor="middle" font-size="13" class="txt">金属锂或其他负极</text>
  <text x="648" y="116" font-size="13" class="txt">界面有时仍有</text>
  <text x="648" y="136" font-size="13" class="txt">少量液体。</text>
  <text x="648" y="164" font-size="13" class="warn">短路仍会放热。</text>
  <text x="648" y="184" font-size="13" class="txt">阈值看这颗电芯。</text>

  <rect x="16" y="280" width="420" height="200" rx="8" class="panel" />
  <text x="32" y="304" font-size="15" font-weight="bold" class="txt">结构电池</text>
  <rect x="32" y="316" width="220" height="36" rx="4" class="fill-boxy stroke-y" />
  <text x="142" y="339" text-anchor="middle" font-size="13" class="txt">碳纤维负极，同时承力</text>
  <rect x="32" y="356" width="220" height="36" rx="4" class="fill-boxb stroke-axis" />
  <text x="142" y="379" text-anchor="middle" font-size="13" class="txt">结构电解质 + 隔膜</text>
  <rect x="32" y="396" width="220" height="36" rx="4" class="fill-boxr stroke-axis" />
  <text x="142" y="419" text-anchor="middle" font-size="13" class="txt">正极（如磷酸铁锂）</text>
  <text x="268" y="348" font-size="13" class="txt">碳纤维是电极。</text>
  <text x="268" y="372" font-size="13" class="txt">论文样件约</text>
  <text x="268" y="396" font-size="13" class="txt">几十 Wh/kg。</text>
  <text x="268" y="420" font-size="13" class="txt">不是装车规格。</text>

  <rect x="448" y="280" width="416" height="200" rx="8" class="panel" />
  <text x="464" y="304" font-size="15" font-weight="bold" class="txt">碳纤维外壳</text>
  <rect x="464" y="320" width="250" height="120" rx="8" fill="none" stroke-width="3" stroke-dasharray="7 4" class="stroke-axis" />
  <text x="589" y="340" text-anchor="middle" font-size="12" class="txt">碳纤维壳体</text>
  <rect x="488" y="356" width="90" height="64" rx="4" class="fill-boxr stroke-r" />
  <text x="533" y="392" text-anchor="middle" font-size="12" class="txt">普通电芯</text>
  <rect x="592" y="356" width="90" height="64" rx="4" class="fill-boxr stroke-r" />
  <text x="637" y="392" text-anchor="middle" font-size="12" class="txt">普通电芯</text>
  <text x="728" y="360" font-size="13" class="txt">碳纤维</text>
  <text x="728" y="380" font-size="13" class="txt">只是箱子。</text>
  <text x="728" y="408" font-size="13" class="txt">BMS 看</text>
  <text x="728" y="428" font-size="13" class="txt">里面的电芯。</text>

  <text x="440" y="512" text-anchor="middle" font-size="13" class="txt">示意图，不是实拍。层厚不成比例。蓝点只表示离子在电解质里移动。</text>
  <text x="440" y="530" text-anchor="middle" font-size="13" class="warn">不要拆电芯，不要用液态锂电的默认保护档去充固态或结构电池试样。</text>
</svg>