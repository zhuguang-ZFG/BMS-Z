    <animate calcMode="spline" keySplines="0.7 0 0.84 0;0.42 0 0.58 1" attributeName="stroke-dashoffset" values="100;0;0" keyTimes="0;0.75;1" dur="12s" repeatCount="indefinite" />
  </path>

  
  
  <text x="80" y="282" text-anchor="start" font-size="12" class="small">去抖计时器</text>
  <text x="152" y="282" text-anchor="start" font-size="12" class="small">窗口 20ms（示例）</text>
  <rect x="80" y="290" width="300" height="18" rx="4" stroke-width="1.5" class="fill-muted stroke-axis" />
  <rect x="80" y="290" width="0" height="18" rx="4" class="fill-y">
    <animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.7 0 0.84 0;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="width" values="0;0;90;0;0;300;300;0;0" keyTimes="0;0.206;0.25;0.27;0.45;0.58;0.68;0.7;1" dur="12s" repeatCount="indefinite" />
  </rect>

  
  <text x="480" y="282" text-anchor="start" font-size="12" class="small">MOS 开关</text>
  <line x1="500" y1="299" x2="530" y2="299" stroke-width="3" class="stroke-panel" />
  <line x1="556" y1="299" x2="586" y2="299" stroke-width="3" class="stroke-panel" />
  <line x1="530" y1="299" x2="556" y2="299" stroke-width="3.5" class="stroke-g">
    <animate calcMode="spline" keySplines="0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.56;0.58;0.68;0.7;1" dur="12s" repeatCount="indefinite" />
  </line>
  <line x1="530" y1="299" x2="552" y2="283" stroke-width="3.5" opacity="0" class="stroke-r">
    <animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.56;0.58;0.68;0.7;1" dur="12s" repeatCount="indefinite" />
  </line>
  <text x="610" y="294" text-anchor="start" font-size="13" font-weight="bold" class="ok">导通
    <animate calcMode="spline" keySplines="0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.56;0.58;0.68;0.7;1" dur="12s" repeatCount="indefinite" />
  </text>
  <text x="610" y="316" text-anchor="start" font-size="13" font-weight="bold" opacity="0" class="warn">断开
    <animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.56;0.58;0.68;0.7;1" dur="12s" repeatCount="indefinite" />
  </text>

  
  <text x="400" y="380" text-anchor="middle" font-size="13" opacity="0" class="txt">毛刺短于去抖时间 → 计时清零，不动作
    <animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.16;0.2;0.3;0.34;1" dur="12s" repeatCount="indefinite" />
  </text>
  <text x="400" y="402" text-anchor="middle" font-size="13" font-weight="bold" opacity="0" class="warn">持续超限 → 计时走满 → 保护断开
    <animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.42;0.46;0.58;0.62;1" dur="12s" repeatCount="indefinite" />
  </text>
  <text x="400" y="424" text-anchor="middle" font-size="13" opacity="0" class="txt">回落到阈值与恢复线之间：仍保持断开——回差防反复跳闸
    <animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.62;0.66;0.82;0.86;1" dur="12s" repeatCount="indefinite" />
  </text>
  <text x="150" y="56" text-anchor="start" font-size="12" opacity="0" class="warn">短路/过温等严重故障用锁存型：需人工或上位机清除
    <animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="12s" repeatCount="indefinite" />
  </text>

  <text x="400" y="444" text-anchor="middle" font-size="13" class="small">关键：去抖躲毛刺，回差防颤振，锁存留证据——保护不是一根线，是一套决策。</text>
<text class="small" x="74.0" y="144.0" text-anchor="end">4.25</text><text class="small" x="74.0" y="184.0" text-anchor="end">4.15</text><line class="grid" x1="80" y1="140" x2="86" y2="140" /><line class="grid" x1="80" y1="180" x2="86" y2="180" /></svg>