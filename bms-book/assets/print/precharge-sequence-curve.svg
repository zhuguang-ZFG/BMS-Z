  <!-- formula: V=400*(1-exp(-t/0.17)); I=(400-V)/170; E=0.5*0.001*400^2=80 J; close K1 near 3 tau -->
  <rect class="bg" width="800" height="590"/>
  <rect class="bms-marker" aria-hidden="true" x="18.0" y="17.1" width="317.4" height="17.3" rx="3.8" transform="rotate(-.5 18.0 25.8)"/><path class="bms-under" aria-hidden="true" d="M24.0 40.0 q 24.0 -2.4 48.0 0 t 48 0 t 48 0 t 48 0 t 48 0 t 48 0"/><text class="title" x="24" y="32">电压先爬。大约 0.51 s 才合主闸（示意）</text>
