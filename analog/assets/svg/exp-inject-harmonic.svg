<text x="412" y="134" font-size="11.5" font-weight="bold" fill="#a4630f">① 注入随信号走</text><text x="412" y="159" font-size="14.5" font-weight="bold" fill="#16202b">0V→2pC，4V→1.6pC</text><text x="412" y="176" font-size="10.5" fill="#5b666f">峰谷差 0.4pC</text>
<text x="412" y="192" font-size="11.5" font-weight="bold" fill="#a4630f">② 落到电容上</text><text x="412" y="217" font-size="14.5" font-weight="bold" fill="#16202b">0.4pC / 10nF = 40µV</text><text x="412" y="234" font-size="10.5" fill="#5b666f">12 位系统无感</text><rect x="400" y="168" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.25;0.28;1" dur="14s" repeatCount="indefinite"/></rect>
