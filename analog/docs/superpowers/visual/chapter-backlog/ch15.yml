status: in-progress
invariants:
- 铜线电阻必须用 SI 尺寸从 R=rho*l/(w*t) 复算。
- 单程电阻压降、地回路压降与 L*di/dt 分开。
- 字节或技术内容改变后不继承旧图审阅。
