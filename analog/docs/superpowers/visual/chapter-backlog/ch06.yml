corrections:
- Finite open-loop error and offset both matter; microvolt input difference is not a universal diagnostic
  threshold.
- Unit-gain stable does not guarantee stability with arbitrary loads or feedback networks.
- CMRR and PSRR are normally input referred; apply noise gain before calling a quantity output error.
- RRI describes input range, RRO output range, RRIO both; output sourcing and sinking depend on operating
  point.
- Resistor thermal voltage density scales with square root of resistance; integrate noise with the circuit
  transfer function.
- Equal-component Sallen-Key at Q=0.5 is critically damped, not a Bessel section; f0 is not always the
  -3 dB cutoff.
- Attenuator before buffer remains loaded by source resistance; it does not isolate the source by itself.
- Slew limiting reduces incremental response but does not sever feedback or make loop gain universally
  zero.
