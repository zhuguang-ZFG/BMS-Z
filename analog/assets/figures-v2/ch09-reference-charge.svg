<polygon class="marker-wash" points="46.2,22.2 439.4,21.3 743.0,23.3 745.4,62.1 420.0,64.3 43.0,62.9" fill="#a4630f" opacity="0.13"/>
<text x="52" y="58" font-size="38" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">参考端抽电荷，缓冲器在两次采样间补回</text><text x="52" y="94" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">示意每 10 µs 抽走 1 nC；R=10 Ω、C=1 µF，忽略其他寄生。</text>
<text x="70" y="200" font-size="25" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">理想基准</text>
<path d="M80 235 Q172.50 235.78 265 235" fill="none" stroke="#16202b" stroke-width="3" stroke-dasharray=""/>
<rect x="265" y="222" width="75" height="26" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<text x="300" y="198" font-size="25" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">10 Ω</text>
<path d="M340 235 Q570.00 232.91 800 235" fill="none" stroke="#16202b" stroke-width="3" stroke-dasharray=""/>
<path d="M500 235 Q499.74 282.50 500 330" fill="none" stroke="#16202b" stroke-width="3" stroke-dasharray=""/>
<path d="M465 330 Q500.00 330.39 535 330" fill="none" stroke="#16202b" stroke-width="3" stroke-dasharray=""/>
<path d="M465 345 Q500.00 344.99 535 345" fill="none" stroke="#16202b" stroke-width="3" stroke-dasharray=""/>
<path d="M500 345 Q500.33 377.50 500 410" fill="none" stroke="#16202b" stroke-width="3" stroke-dasharray=""/>
<path d="M480 410 Q500.00 410.08 520 410" fill="none" stroke="#16202b" stroke-width="3" stroke-dasharray=""/>
<text x="565" y="348" font-size="25" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">1 µF</text>
<text x="770" y="202" font-size="25" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">ADC 参考端</text>
<path d="M800 260 Q800.30 312.50 800 365" fill="none" stroke="#a8321f" stroke-width="2.5" stroke-dasharray=""/><polygon points="800,365 795,355 805,355" fill="#a8321f"/>
<text x="800" y="410" font-size="25" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">每拍取 1 nC</text>
<path d="M365 285 Q407.50 285.00 450 285" fill="none" stroke="#1f5d7a" stroke-width="2.5" stroke-dasharray=""/><polygon points="450,285 440,290 440,280" fill="#1f5d7a"/>
<text x="300" y="330" font-size="25" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">补电</text>
<text x="50" y="490" font-size="25" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">一次下降 Q/C = 1 mV；RC = 10 µs，下一拍前没补完。</text>
<text x="50" y="545" font-size="25" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">重复后最大下降约 1.582 mV，最小约 0.582 mV。</text>
<text x="50" y="600" font-size="23" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">平均补电电流 Q/T = 100 µA；瞬时电流由电容和驱动共同承担。</text>
<text x="50" y="645" font-size="24" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">实际网络必须按 ADC 推荐、缓冲稳定性和建立时间核对。</text>
</svg>
