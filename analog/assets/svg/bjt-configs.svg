<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img" aria-labelledby="ttl">
<title id="ttl">一只晶体管的三种人生：共射、共集、共基</title>
<desc>一只晶体管的三种人生：共射、共集、共基；节拍：① 共射：电压增益最高但阻抗平庸，还好反相——放大主力的代价；② 共集：电压增益 ≈1 却成神器——高输入阻抗 + 极低输出阻抗 = 缓冲器；③ 共基：输入阻抗极低，但高频性能最好（没有 Miller 效应拖后腿）；④ 级联心法：共射打头阵放大、射随器垫后驱动、共基守高频前线</desc>
