  <path d="M-0.77 0Q0 0 0 0L400 0.72L800 0Q800 0 800 0L799.99 230L800 460Q800 460 800 460L400 460.65L0 460Q0 460 0 460L0 -0.46" class="bg"/>

  <path d="M17.18 20.9Q18 17.1 21.8 17.1L233 16.89L444.2 17.1Q448 17.1 448 20.9L447.83 25.75L448 30.6Q448 34.4 444.2 34.4L233 33.59L21.8 34.4Q18 34.4 18 30.6L18 20.41" class="bms-marker" aria-hidden="true" transform="rotate(-.5 18.0 25.8)"/><path d="M24 40Q47.85 37.36 72 40Q96.75 42.63 120 40Q143.48 36.89 168 40Q191.53 42.94 216 40Q239.36 38.17 264 40Q288.16 41.72 312 40Q336.02 37.78 360 40Q384.3 41.65 408 40" class="bms-under" aria-hidden="true"/><text class="title" x="24" y="32">充电电流跟着温度走：太冷不充，太热把电流收掉（示意）</text>
  <path d="M23.45 54Q24 48 30 48L400 47.7L770 48Q776 48 776 54L776.06 109L776 164Q776 170 770 170L400 169.48L30 170Q24 170 24 164L24 53.67" class="panel"/><g class="bms-doodle" aria-hidden="true" transform="matrix(0.9935352156096949 0.11352433811036843 -0.11352433811036843 0.9935352156096949 746 72)" opacity="0.788889" style="opacity: 0.788889;"><path d="M0 -9L1.68 -5.83L2.3 -2.3L5.65 -1.14L9 0L5.83 1.66L2.3 2.3L1.4 5.73L0 9L-1.08 5.63L-2.3 2.3L-5.61 1.02L-9 0L-5.54 -0.82L-2.3 -2.3Z" class="bms-spark-fill"/></g><g class="bms-doodle" aria-hidden="true" transform="matrix(0.9999922340240476 -0.003941052092326663 0.003941052092326663 0.9999922340240476 710 62)" opacity="0.645455" style="opacity: 0.645455;"><path d="M0 -5.5L1.4 -1.4L5.5 0L1.4 1.4L0 5.5L-1.4 1.4L-5.5 0L-1.4 -1.4Z" class="bms-spark-soft"/></g><g class="bms-doodle" aria-hidden="true"><circle class="bms-spark-fill" cx="728.0" cy="81.0" r="1.3"/><circle class="bms-spark-soft" cx="696.0" cy="78.0" r="1.1"/></g>
  <text class="txt" x="40" y="68" opacity="1" style="opacity: 1;">① 低于 0 °C<tspan class="small">　示意充电电流 0。低温硬充容易在负极析锂。</tspan></text>
  <text class="txt" x="40" y="94" opacity="1" style="opacity: 1;">② 0 到 10 °C<tspan class="small">　示意 0.2C。2 Ah 的例子里是 0.4 A。</tspan></text>
  <text class="txt" x="40" y="120" opacity="1" style="opacity: 1;">③ 10 到 45 °C<tspan class="small">　示意允许 1C，也就是 2 A。这不是所有电芯的窗口。</tspan></text>
  <text class="txt" x="40" y="146" opacity="1" style="opacity: 1;">④ 45 到 55 °C 以上<tspan class="small">　电流收到 0。再热就停充。放电窗口常常不一样，另查规格书。</tspan></text>
  <path d="M23.4 186Q24 180 30 180L400 180.9L770 180Q776 180 776 186L775.92 285L776 384Q776 390 770 390L400 389.48L30 390Q24 390 24 384L24 185.64" class="panel"/>
  <text class="small" x="40" y="202">允许充电电流（2 Ah 电芯的示意，1C = 2 A）</text>
  <path d="M60 200L59.38 253.33L59.77 306.67L60 360" class="axis"/>
  <path d="M60 360L280 360.7L500 359.36L720 360" class="axis"/>
  <text class="small" x="28" y="244">2 A</text>
  <text class="small" x="28" y="340">0.4 A</text>
  <text class="small" x="36" y="364">0</text>
  <path d="M70 360L98 359.19L126 360.17L154 360L153.59 352L153.51 344L154 336L182 336.59L210 336.4L238 336L238.33 304L238.31 272L238 240L336 239.58L434 239.63L532 240L560.11 279.93L587.31 320.49L616 360L644 359.43L672 360.13L700 360" class="lineb" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="doty" r="6" transform="matrix(1 0 0 1 534.70556640625 243.86505126953125)"/>
  <text class="warn" x="72" y="300">0 °C 以下：0 A</text>
  <text class="gold" x="160" y="328">0.2C = 0.4 A</text>
  <text class="hi" x="340" y="230">1C = 2 A</text>
  <text class="warn" x="628" y="328">55 °C：0 A</text>
  <text class="small" x="142" y="378">0 °C</text>
  <text class="small" x="224" y="378">10 °C</text>
  <text class="small" x="518" y="378">45 °C</text>
  <text class="small" x="602" y="378">55 °C</text>
  <text class="small" x="24" y="446">折线和 2 Ah、0.2C、1C 都是示意。某一颗电芯允许多大电流，只看它的规格书，不看这张图。</text>

