</style><rect class="bg" x="0" y="-156" width="800" height="680" /><text class="title" x="24" y="-128">HVIL 示例时序：环先断，母线后掉</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① HVIL 示例时序：环先断，母线后掉<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 毫秒都是示例，不是某只插头的实测。不是示波器截图。<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 15 ms 开闸<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="468" width="752" height="44" rx="6" /><text class="small" x="40" y="496">去抖拉到 500 ms：人已经摸到端子，母线还在。示意。</text><rect width="800" height="460" class="bg" />
  <text x="400" y="54" text-anchor="middle" font-size="13" class="small">毫秒都是示例，不是某只插头的实测。不是示波器截图。</text>
  <text x="36" y="110" font-size="13" class="txt">环</text>
  <polyline fill="none" stroke-width="3" points="80,100 200,100 200,124 720,124" class="stroke-b" />
  <text x="36" y="170" font-size="13" class="txt">闸</text>
  <polyline fill="none" stroke-width="3" points="80,160 360,160 360,184 720,184" class="stroke-y" />
  <text x="36" y="230" font-size="13" class="txt">母线</text>
  <polyline fill="none" stroke-width="3" points="80,210 480,210 560,250 720,250" class="stroke-g" />
  <line x1="80" y1="80" x2="80" y2="270" class="stroke-panel" />
  <rect x="78" y="80" width="3" height="190" class="fill-b">
    <animate attributeName="x" values="80;200;360;520;700;80" keyTimes="0;0.2;0.4;0.6;0.85;1" dur="8s" repeatCount="indefinite" />
  </rect>
  <text x="200" y="300" text-anchor="middle" font-size="12" class="small">0 环断</text>
  <text x="360" y="300" text-anchor="middle" font-size="12" class="small">15 ms 开闸</text>
  <text x="540" y="300" text-anchor="middle" font-size="12" class="small">30 ms 母线开始掉</text>
  <text x="400" y="350" text-anchor="middle" font-size="14" opacity="1" class="warn">去抖拉到 500 ms：人已经摸到端子，母线还在
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.3;0.45;1" dur="8s" repeatCount="indefinite" />
  </text>
  <text x="400" y="382" text-anchor="middle" font-size="14" opacity="0" class="ok">去抖几十毫秒，短针先断。泄放排在触点分开之后。
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4;0.55;1" dur="8s" repeatCount="indefinite" />
  </text>
  <text x="400" y="424" text-anchor="middle" font-size="13" class="small">针脚长短差是机械顺序。软件去抖只是第二道。</text>

</svg>