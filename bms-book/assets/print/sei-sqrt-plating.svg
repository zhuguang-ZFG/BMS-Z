  <text class="txt" x="40" y="68" opacity="1" style="opacity: 1;">① 常温成膜<tspan class="small">　δ = 5 + 2√N nm。开头陡，后来变缓。</tspan></text>
  <text class="txt" x="40" y="94" opacity="1" style="opacity: 1;">② 第 100 圈<tspan class="small">　√100=10，膜厚示意 25 nm。第 400 圈约 45 nm。</tspan></text>
  <text class="txt" x="40" y="120" opacity="1" style="opacity: 1;">③ 若每圈都低温大电流充<tspan class="small">　析锂当量按 0.15 nm/圈往上加，不走平方根。</tspan></text>
  <text class="txt" x="40" y="146" opacity="1" style="opacity: 1;">④ 大约第 240 圈<tspan class="small">　直线追上弯线。BMS 要在变冷时先把充电电流收回来。</tspan></text>
