<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">运放选型地图：速度（横）× 直流精度（纵）</text>

<text x="400" y="46" text-anchor="middle" font-size="14" font-weight="bold" fill="#37424e">越往右上越贵 —— 先问「我到底需要哪一头」</text>
<path d="M90 396 Q410.00 397.38 730 396" fill="none" stroke="#5b666f" stroke-width="1.6"/>
<path d="M90 96 Q89.15 246.00 90 396" fill="none" stroke="#5b666f" stroke-width="1.6"/>
<text x="730" y="420" text-anchor="end" font-size="11" fill="#5b666f">GBW（速度）→</text>
<text x="100" y="112" font-size="11" font-weight="bold" fill="#8b8272">↑ 精度高</text>
<text x="100" y="388" font-size="11" font-weight="bold" fill="#8b8272">↓ 精度低</text>
<line x1="210" y1="396" x2="210" y2="401" stroke="#5b666f" stroke-width="1.2"/><text x="210" y="414" text-anchor="middle" font-size="10" fill="#5b666f">1MHz</text><line x1="401" y1="396" x2="401" y2="401" stroke="#5b666f" stroke-width="1.2"/><text x="401" y="414" text-anchor="middle" font-size="10" fill="#5b666f">3MHz</text><line x1="610" y1="396" x2="610" y2="401" stroke="#5b666f" stroke-width="1.2"/><text x="610" y="414" text-anchor="middle" font-size="10" fill="#5b666f">10MHz</text><text x="84" y="400" text-anchor="end" font-size="10" fill="#5b666f">10mV</text><text x="84" y="325" text-anchor="end" font-size="10" fill="#5b666f">1mV</text><text x="84" y="250" text-anchor="end" font-size="10" fill="#5b666f">100µV</text><text x="84" y="175" text-anchor="end" font-size="10" fill="#5b666f">10µV</text><text x="84" y="100" text-anchor="end" font-size="10" fill="#5b666f">1µV</text><circle cx="210" cy="344" r="8" fill="#8b8272" opacity="0.85"/><text x="250" y="331" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8b8272">µA741</text><text x="250" y="368" text-anchor="middle" font-size="10" fill="#5b666f">教学化石</text><circle cx="210" cy="344" r="8" fill="#1f5d7a" opacity="0.85"/><text x="136" y="331" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1f5d7a">LM358</text><text x="136" y="368" text-anchor="middle" font-size="10" fill="#5b666f">低速信号链</text><circle cx="401" cy="357" r="8" fill="#3d6b4a" opacity="0.85"/><text x="421" y="344" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3d6b4a">TL072</text><text x="421" y="381" text-anchor="middle" font-size="10" fill="#5b666f">音频前级</text><circle cx="610" cy="298" r="8" fill="#a4630f" opacity="0.85"/><text x="670" y="285" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a4630f">NE5532</text><text x="670" y="322" text-anchor="middle" font-size="10" fill="#5b666f">音频黄金标准</text><circle cx="122" cy="237" r="8" fill="#6b3f63" opacity="0.85"/><text x="122" y="224" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6b3f63">OP07</text><text x="122" y="261" text-anchor="middle" font-size="10" fill="#5b666f">直流测量</text><circle cx="331" cy="96" r="8" fill="#a8321f" opacity="0.85"/><text x="407" y="83" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a8321f">斩波零漂</text><text x="407" y="120" text-anchor="middle" font-size="10" fill="#5b666f">称重/热电偶</text><circle cx="210" cy="370" r="8" fill="#2f7f96" opacity="0.85"/><text x="306" y="357" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f7f96">MCP6001</text><text x="306" y="336" text-anchor="middle" font-size="10" fill="#5b666f">电池 RRIO</text>
<path d="M40 424 Q400.00 422.71 760 424" fill="none" stroke="#c9bb9d" stroke-width="1"/>
<text x="400" y="450" text-anchor="middle" font-size="12" font-weight="bold" fill="#37424e">两把尺子先量清楚，再挑型号</text>
<text x="70" y="478" font-size="11.5" fill="#5b666f">① <tspan font-weight="bold" fill="#2563eb">速度尺</tspan>：GBW ≥ 增益 × 信号最高频率 × 10（裕量十倍）。LM358 增益 100 → 只有 10kHz 带宽</text>
<text x="70" y="502" font-size="11.5" fill="#5b666f">② <tspan font-weight="bold" fill="#7c3aed">精度尺</tspan>：$V_{OS}$ 会被增益放大——2mV 失调 × 100 倍 = 输出端 200mV 误差，直流电路第一杀手</text>
<text x="70" y="528" font-size="11.5" font-weight="bold" fill="#a4630f">③ 还要看 $I_B$：源阻抗 &gt;100kΩ 必须选 FET 输入（TL072 的 30pA vs LM358 的 45nA，差 1000 倍）</text>
<text x="70" y="554" font-size="11.5" fill="#5b666f">④ 最后才比价格与封装——<tspan font-weight="bold">先定需求，再挑型号，别反过来</tspan></text>
