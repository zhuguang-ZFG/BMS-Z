<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
<title id="title">重算后比较，只让有效记录前进</title><desc id="desc">收到的八字节记录分成前六字节数据与后两字节CRC。接收端对前六字节重算得到0x31b4，与小端尾部b431还原出的0x31b4比较；相同后继续质量范围与序号检查，不同则拒收，只有全部有效才更新成功记录。没有演示独立练习的序号答案。</desc>
<metadata>Self-authored editable SVG; FA-002; IG-008; C-03; C-15 only for expiry/cutoff.</metadata>
<rect width="1440" height="1080" fill="#fffdf5"/>
<g font-family="KaiTi, STKaiti, serif">
<text x="720" y="110" font-size="64" text-anchor="middle" fill="#003153" font-weight="bold">重算后比较，只让有效记录前进</text>
<path d="M180 225 L840 225 L840 355 L180 355 Z" fill="none" stroke="#003153" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<path d="M905 225 L1270 225 L1270 355 L905 355 Z" fill="none" stroke="#003153" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<text x="510" y="304" font-size="64" text-anchor="middle" fill="#003153" font-weight="normal">da 39 1e fb ff 01</text>
<text x="1090" y="304" font-size="64" text-anchor="middle" fill="#003153" font-weight="normal">b4 31</text>
<text x="510" y="418" font-size="56" text-anchor="middle" fill="#003153" font-weight="normal">前六字节重算</text>
<text x="1090" y="418" font-size="56" text-anchor="middle" fill="#003153" font-weight="normal">尾部小端还原</text>
