<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430">
  <title>过充保护动作动画（DW01）</title>
  <rect width="800" height="430" fill="#f8fafc"/>
  <style>
  text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
  /* 深色模式：GitHub 深色主题下对调底色与文字色，只覆盖配色，不动几何与动画。
     stroke="#fff" 保持白色——那是彩色徽标上的勾选，不在覆盖范围内。 */
  @media (prefers-color-scheme: dark){
  rect[fill="#f8fafc"]{fill:#0f172a}
  rect[fill="#fff"]{fill:#1e293b}
  [fill="#f1f5f9"]{fill:#1e293b}
  [stroke="#f1f5f9"]{stroke:#1e293b}
  [fill="#e2e8f0"]{fill:#334155}
  [stroke="#e2e8f0"]{stroke:#334155}
  [fill="#cbd5e1"]{fill:#475569}
  [stroke="#cbd5e1"]{stroke:#475569}
  [fill="#64748b"]{fill:#94a3b8}
  [stroke="#64748b"]{stroke:#94a3b8}
  [fill="#475569"]{fill:#cbd5e1}
  [stroke="#475569"]{stroke:#cbd5e1}
  [fill="#334155"]{fill:#e2e8f0}
  [stroke="#334155"]{stroke:#e2e8f0}
  [fill="#1e293b"]{fill:#f1f5f9}
  [stroke="#1e293b"]{stroke:#f1f5f9}
  [fill="#dbeafe"]{fill:#1e3a8a}
  [stroke="#dbeafe"]{stroke:#1e3a8a}
  [fill="#eff6ff"]{fill:#172554}
  [stroke="#eff6ff"]{stroke:#172554}
  [fill="#bfdbfe"]{fill:#1e40af}
  [stroke="#bfdbfe"]{stroke:#1e40af}
  [fill="#1d4ed8"]{fill:#60a5fa}
  [stroke="#1d4ed8"]{stroke:#60a5fa}
  [fill="#1e40af"]{fill:#93c5fd}
  [stroke="#1e40af"]{stroke:#93c5fd}
  [fill="#2563eb"]{fill:#60a5fa}
  [stroke="#2563eb"]{stroke:#60a5fa}
  [fill="#3b82f6"]{fill:#60a5fa}
  [stroke="#3b82f6"]{stroke:#60a5fa}
  [fill="#ecfdf5"]{fill:#022c22}
  [stroke="#ecfdf5"]{stroke:#022c22}
  [fill="#a7f3d0"]{fill:#065f46}
  [stroke="#a7f3d0"]{stroke:#065f46}
  [fill="#86efac"]{fill:#166534}
  [stroke="#86efac"]{stroke:#166534}
  [fill="#065f46"]{fill:#6ee7b7}
  [stroke="#065f46"]{stroke:#6ee7b7}
  [fill="#059669"]{fill:#34d399}
  [stroke="#059669"]{stroke:#34d399}
  [fill="#fef2f2"]{fill:#450a0a}
  [stroke="#fef2f2"]{stroke:#450a0a}
  [fill="#fecaca"]{fill:#7f1d1d}
  [stroke="#fecaca"]{stroke:#7f1d1d}
  [fill="#fca5a5"]{fill:#b91c1c}
  [stroke="#fca5a5"]{stroke:#b91c1c}
  [fill="#991b1b"]{fill:#fca5a5}
  [stroke="#991b1b"]{stroke:#fca5a5}
  [fill="#dc2626"]{fill:#f87171}
  [stroke="#dc2626"]{stroke:#f87171}
  [fill="#fffbeb"]{fill:#451a03}
  [stroke="#fffbeb"]{stroke:#451a03}
  [fill="#fef3c7"]{fill:#78350f}
  [stroke="#fef3c7"]{stroke:#78350f}
  [fill="#92400e"]{fill:#fcd34d}
  [stroke="#92400e"]{stroke:#fcd34d}
  [fill="#b45309"]{fill:#fbbf24}
  [stroke="#b45309"]{stroke:#fbbf24}
  }
</style>

  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">过充保护现场：电压越线 → DW01 拉低 OC → 充电 MOS 断开</text>

  <!-- 电压表（左） -->
  <rect x="90" y="80" width="80" height="240" fill="none" stroke="#334155" stroke-width="2.5"/>
  <rect x="93" y="176" width="74" height="141" fill="#3b82f6" opacity="0.85">
    <animate attributeName="height" values="141;206;206;153" keyTimes="0;0.5;0.65;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="y" values="176;111;111;164" keyTimes="0;0.5;0.65;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#3b82f6;#ef4444;#ef4444;#3b82f6" keyTimes="0;0.42;0.65;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <!-- 阈值线 -->
  <line x1="80" y1="118" x2="180" y2="118" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="185" y="122" font-size="12" fill="#ef4444">过充阈值 4.30V</text>
  <text x="130" y="345" text-anchor="middle" font-size="13" fill="#334155">电池电压</text>

  <!-- 电压读数轮播 -->
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <text x="130" y="70" fill="#1d4ed8" opacity="0">3.60V<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.2;0.24;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="130" y="70" fill="#1d4ed8" opacity="0">4.25V<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.26;0.40;0.42;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="130" y="70" fill="#dc2626" opacity="0">4.35V ⚠<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.42;0.44;0.63;0.65;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="130" y="70" fill="#1d4ed8" opacity="0">3.90V<animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.70;0.72;0.98;1" dur="8s" repeatCount="indefinite"/></text>
  </g>

  <!-- DW01 芯片 -->
  <line x1="170" y1="160" x2="300" y2="160" stroke="#94a3b8" stroke-width="2"/>
  <text x="235" y="150" text-anchor="middle" font-size="10" fill="#64748b">VDD 监测</text>
  <rect x="300" y="130" width="160" height="160" rx="10" fill="#fff" stroke="#334155" stroke-width="2"/>
  <text x="380" y="205" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">DW01</text>
  <text x="380" y="225" text-anchor="middle" font-size="11" fill="#64748b">比较器 + 内部延时</text>

  <!-- OC 控制线 -->
  <line x1="460" y1="240" x2="620" y2="240" stroke="#10b981" stroke-width="3">
    <animate attributeName="stroke" values="#10b981;#ef4444;#ef4444;#10b981" keyTimes="0;0.42;0.65;1" dur="8s" repeatCount="indefinite"/>
  </line>
  <line x1="620" y1="240" x2="620" y2="200" stroke="#10b981" stroke-width="3">
    <animate attributeName="stroke" values="#10b981;#ef4444;#ef4444;#10b981" keyTimes="0;0.42;0.65;1" dur="8s" repeatCount="indefinite"/>
  </line>
  <g font-size="11" text-anchor="middle">
    <text x="540" y="232" fill="#059669" opacity="0">OC = 高（允许充电）<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.40;0.42;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="540" y="232" fill="#dc2626" opacity="0">OC = 低（关断！）<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.42;0.44;0.70;0.72;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="540" y="232" fill="#059669" opacity="0">OC = 高（恢复）<animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.72;0.74;0.98;1" dur="8s" repeatCount="indefinite"/></text>
  </g>

  <!-- 充电回路：充电器 → 充电MOS → 电池 -->
  <line x1="170" y1="190" x2="580" y2="190" stroke="#334155" stroke-width="3"/>
  <line x1="660" y1="190" x2="740" y2="190" stroke="#334155" stroke-width="3"/>
  <text x="745" y="185" font-size="13" font-weight="bold" fill="#334155">充电器</text>
  <!-- 充电 MOS 开关 -->
  <g>
    <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.42;0.44;0.70;0.72;1" dur="8s" repeatCount="indefinite"/>
    <line x1="580" y1="190" x2="660" y2="190" stroke="#2563eb" stroke-width="4"/>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.42;0.44;0.70;0.72;1" dur="8s" repeatCount="indefinite"/>
    <line x1="580" y1="190" x2="652" y2="162" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  </g>
  <circle cx="580" cy="190" r="5" fill="#334155"/>
  <circle cx="660" cy="190" r="5" fill="#334155"/>
  <text x="620" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">充电 MOS</text>

  <!-- 充电电流（右→左） -->
  <g>
    <animate attributeName="opacity" values="0;1;1;0;0;1;1" keyTimes="0;0.02;0.42;0.44;0.72;0.74;1" dur="8s" repeatCount="indefinite"/>
    <circle r="6" fill="#10b981"><animateMotion dur="1.6s" begin="0s" repeatCount="indefinite" path="M740,190 H170"/></circle>
    <circle r="6" fill="#10b981"><animateMotion dur="1.6s" begin="0.55s" repeatCount="indefinite" path="M740,190 H170"/></circle>
    <circle r="6" fill="#10b981"><animateMotion dur="1.6s" begin="1.1s" repeatCount="indefinite" path="M740,190 H170"/></circle>
  </g>

  <!-- 阻断标记 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.44;0.46;0.68;0.70;1" dur="8s" repeatCount="indefinite"/>
    <g stroke="#ef4444" stroke-width="4" stroke-linecap="round">
      <animate attributeName="opacity" values="1;0.2;1" dur="0.7s" repeatCount="indefinite"/>
      <line x1="632" y1="168" x2="656" y2="192"/>
      <line x1="656" y1="168" x2="632" y2="192"/>
    </g>
  </g>

  <!-- 阶段横幅 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.44;0.47;0.63;0.66;1" dur="8s" repeatCount="indefinite"/>
    <rect x="220" y="330" width="360" height="40" rx="8" fill="#fef2f2" stroke="#ef4444"/>
    <text x="400" y="355" text-anchor="middle" font-size="15" font-weight="bold" fill="#dc2626">电压越线且超过内部延时 → 硬关断</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.74;0.78;1" dur="8s" repeatCount="indefinite"/>
    <rect x="200" y="330" width="400" height="40" rx="8" fill="#ecfdf5" stroke="#10b981"/>
    <text x="400" y="355" text-anchor="middle" font-size="15" font-weight="bold" fill="#059669">电压回落到恢复值 → 自动重新允许充电</text>
  </g>

  <text x="400" y="412" text-anchor="middle" font-size="13" fill="#475569">保护三要素：阈值（4.30V）＋ 延时（内部产生，防误触发）＋ 恢复条件（电压回落）</text>
</svg>
