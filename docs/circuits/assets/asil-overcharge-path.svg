</style><rect class="bg" x="0" y="-156" width="800" height="680" /><rect class="bms-marker" aria-hidden="true" x="18.0" y="-142.9" width="366.0" height="17.3" rx="3.8" transform="rotate(-.5 18.0 -134.2)"/><path class="bms-under" aria-hidden="true" d="M24.0 -119.0 q 24.0 -2.4 48.0 0 t 48 0 t 48 0 t 48 0 t 48 0 t 48 0 t 48 0"/><text class="title" x="24" y="-128">示意图：先问这串电压是不是线，再问是不是过充</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><g class="bms-doodle" aria-hidden="true" transform="translate(746.0 -88.0)"><animateTransform attributeName="transform" type="rotate" values="-6;7;-6" keyTimes="0;0.5;1" dur="5.4s" repeatCount="indefinite" additive="sum"/><animate attributeName="opacity" values="0.62;1;0.62" keyTimes="0;0.5;1" dur="3.6s" repeatCount="indefinite"/><path class="bms-spark-fill" d="M0 -9 L2.3 -2.3 L9 0 L2.3 2.3 L0 9 L-2.3 2.3 L-9 0 L-2.3 -2.3 Z"/></g><g class="bms-doodle" aria-hidden="true" transform="translate(710.0 -98.0)"><animateTransform attributeName="transform" type="rotate" values="5;-4;5" keyTimes="0;0.5;1" dur="6.2s" repeatCount="indefinite" additive="sum"/><animate attributeName="opacity" values="0.5;0.9;0.5" keyTimes="0;0.5;1" dur="4.4s" repeatCount="indefinite"/><path class="bms-spark-soft" d="M0 -5.5 L1.4 -1.4 L5.5 0 L1.4 1.4 L0 5.5 L-1.4 1.4 L-5.5 0 L-1.4 -1.4 Z"/></g><g class="bms-doodle" aria-hidden="true"><circle class="bms-spark-fill" cx="728.0" cy="-79.0" r="1.3"/><circle class="bms-spark-soft" cx="696.0" cy="-82.0" r="1.1"/></g><text class="txt" x="40" y="-88" opacity="1">① 示意图：先问这串电压是不是线，再问是不是过充<animate calcMode="spline" keySplines="0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 只有一串，其余正常<animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 悬空脚可以被拉到异常电平<animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="468" width="752" height="44" rx="6" /><text class="small" x="40" y="496">文中 &lt;100 ms 是教学示例，不是条款号。示意。</text><rect width="800" height="460" class="bg" />
  <rect x="16" y="52" width="240" height="120" rx="8" class="fill-boxy stroke-y"><animate calcMode="spline" keySplines="0.7 0 0.84 0;0.42 0 0.58 1;0.16 1 0.3 1" attributeName="stroke-width" values="5;2;2;5" keyTimes="0;0.33;0.66;1" dur="8s" repeatCount="indefinite" /></rect>
  <text x="136" y="84" text-anchor="middle" font-size="15" font-weight="bold" class="txt">读数冲高</text>
  <text x="136" y="110" text-anchor="middle" font-size="13" class="txt">只有一串，其余正常</text>
  <text x="136" y="134" text-anchor="middle" font-size="13" class="txt">充电电流还在</text>

  <rect x="280" y="52" width="240" height="120" rx="8" class="fill-boxb stroke-b"><animate calcMode="spline" keySplines="0.16 1 0.3 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="stroke-width" values="2;5;2;2" keyTimes="0;0.33;0.66;1" dur="8s" repeatCount="indefinite" /></rect>
  <text x="400" y="84" text-anchor="middle" font-size="15" font-weight="bold" class="txt">先查开线</text>
  <text x="400" y="110" text-anchor="middle" font-size="13" class="txt">悬空脚可以被拉到异常电平</text>
  <text x="400" y="134" text-anchor="middle" font-size="13" class="txt">和电芯真实电压不是一回事</text>

  <rect x="544" y="52" width="240" height="120" rx="8" class="fill-boxg stroke-g"><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.7 0 0.84 0" attributeName="stroke-width" values="2;2;5;2" keyTimes="0;0.33;0.66;1" dur="8s" repeatCount="indefinite" /></rect>
  <text x="664" y="84" text-anchor="middle" font-size="15" font-weight="bold" class="txt">硬件比较器</text>
  <text x="664" y="110" text-anchor="middle" font-size="13" class="txt">不经过这颗 MCU</text>
  <text x="664" y="134" text-anchor="middle" font-size="13" class="txt">软件死了仍能切断</text>

  <circle cy="112" r="7" class="fill-b">
    <animate calcMode="spline" keySplines="0.16 1 0.3 1;0.16 1 0.3 1;0.7 0 0.84 0" attributeName="cx" values="136;400;664;136" keyTimes="0;0.33;0.66;1" dur="8s" repeatCount="indefinite" />
  </circle>

  <rect x="16" y="200" width="420" height="160" rx="8" class="fill-boxr stroke-r"><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.7 0 0.84 0;0.16 1 0.3 1" attributeName="stroke-width" values="5;5;2;5" keyTimes="0;0.33;0.66;1" dur="8s" repeatCount="indefinite" /></rect>
  <text x="32" y="228" font-size="15" font-weight="bold" class="warn">误诊</text>
  <text x="32" y="256" font-size="14" class="txt">只把 ADC 记成过充。</text>
  <text x="32" y="280" font-size="14" class="txt">维修去换电芯，线还是断的。</text>
  <text x="32" y="304" font-size="14" class="txt">或把软件阈值放宽，并旁路硬件比较器。</text>
  <text x="32" y="336" font-size="14" class="txt">ASIL 等级由 HARA 定，不是固定牌。</text>

  <rect x="452" y="200" width="332" height="160" rx="8" class="panel"><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.7 0 0.84 0" attributeName="stroke-width" values="2;2;5;2" keyTimes="0;0.33;0.66;1" dur="8s" repeatCount="indefinite" /></rect>
  <text x="468" y="228" font-size="15" font-weight="bold" class="txt">要注入的两件事</text>
  <text x="468" y="256" font-size="14" class="txt">拔掉采样线：应报开线，或开线优先。</text>
  <text x="468" y="280" font-size="14" class="txt">抬高模拟电压且停喂狗：硬件仍切断。</text>
  <text x="468" y="312" font-size="14" class="txt">文中 &lt;100 ms 是教学示例，不是条款号。</text>
  <text x="468" y="336" font-size="14" class="gold">示意图。不要对真电池做失效注入。</text>
</svg>