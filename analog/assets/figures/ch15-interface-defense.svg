<text x="140" y="486" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12" fill="#0f766e">高频下仍是低阻泄放</text>
<line x1="480" y1="432" x2="480" y2="500" stroke="#d0d5dd" stroke-width="1.2"/>
