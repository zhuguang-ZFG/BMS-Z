<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460">
  <title>过充功能安全路径示意图</title>
  <rect width="880" height="460" fill="#f8fafc"/>
  <style>
  text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
  @media (prefers-color-scheme: dark){
  rect[fill="#f8fafc"]{fill:#0f172a}
  rect[fill="#fff"]{fill:#1e293b}
  [fill="#e2e8f0"]{fill:#334155}
  [stroke="#e2e8f0"]{stroke:#334155}
  [fill="#334155"]{fill:#e2e8f0}
  [stroke="#334155"]{stroke:#e2e8f0}
  [fill="#1e293b"]{fill:#f1f5f9}
  [stroke="#1e293b"]{stroke:#f1f5f9}
  [fill="#dbeafe"]{fill:#1e3a8a}
  [stroke="#dbeafe"]{stroke:#1e3a8a}
  [fill="#bfdbfe"]{fill:#1e40af}
  [stroke="#bfdbfe"]{stroke:#1e40af}
  [fill="#1d4ed8"]{fill:#60a5fa}
  [stroke="#1d4ed8"]{stroke:#60a5fa}
  [fill="#ecfdf5"]{fill:#022c22}
  [stroke="#ecfdf5"]{stroke:#022c22}
  [fill="#a7f3d0"]{fill:#065f46}
  [stroke="#a7f3d0"]{stroke:#065f46}
  [fill="#059669"]{fill:#34d399}
  [stroke="#059669"]{stroke:#34d399}
  [fill="#fffbeb"]{fill:#451a03}
  [stroke="#fffbeb"]{stroke:#451a03}
  [fill="#fef3c7"]{fill:#78350f}
  [stroke="#fef3c7"]{stroke:#78350f}
  [fill="#b45309"]{fill:#fbbf24}
  [stroke="#b45309"]{stroke:#fbbf24}
  [fill="#fef2f2"]{fill:#450a0a}
  [stroke="#fef2f2"]{stroke:#450a0a}
  [fill="#fecaca"]{fill:#7f1d1d}
  [stroke="#fecaca"]{stroke:#7f1d1d}
  [fill="#dc2626"]{fill:#f87171}
  [stroke="#dc2626"]{stroke:#f87171}
  }
  </style>
  <text x="440" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">示意图：先问这串电压是不是线，再问是不是过充</text>
  <rect x="16" y="52" width="260" height="120" rx="8" fill="#fffbeb" stroke="#b45309"><animate attributeName="stroke-width" values="5;2;2;5" keyTimes="0;0.33;0.66;1" dur="8s" repeatCount="indefinite"/></rect>
  <text x="146" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">读数冲高</text>
  <text x="146" y="110" text-anchor="middle" font-size="13" fill="#334155">只有一串，其余正常</text>
  <text x="146" y="134" text-anchor="middle" font-size="13" fill="#334155">充电电流还在</text>

  <rect x="310" y="52" width="260" height="120" rx="8" fill="#dbeafe" stroke="#1d4ed8"><animate attributeName="stroke-width" values="2;5;2;2" keyTimes="0;0.33;0.66;1" dur="8s" repeatCount="indefinite"/></rect>
  <text x="440" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">先查开线</text>
  <text x="440" y="110" text-anchor="middle" font-size="13" fill="#334155">悬空脚可以被拉到异常电平</text>
  <text x="440" y="134" text-anchor="middle" font-size="13" fill="#334155">和电芯真实电压不是一回事</text>

  <rect x="604" y="52" width="260" height="120" rx="8" fill="#ecfdf5" stroke="#059669"><animate attributeName="stroke-width" values="2;2;5;2" keyTimes="0;0.33;0.66;1" dur="8s" repeatCount="indefinite"/></rect>
  <text x="734" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">硬件比较器</text>
  <text x="734" y="110" text-anchor="middle" font-size="13" fill="#334155">不经过这颗 MCU</text>
  <text x="734" y="134" text-anchor="middle" font-size="13" fill="#334155">软件死了仍能切断</text>

  <circle cy="112" r="7" fill="#1d4ed8">
    <animate attributeName="cx" values="146;440;734;146" keyTimes="0;0.33;0.66;1" dur="8s" repeatCount="indefinite"/>
  </circle>

  <rect x="16" y="200" width="420" height="160" rx="8" fill="#fef2f2" stroke="#dc2626"><animate attributeName="stroke-width" values="5;5;2;5" keyTimes="0;0.33;0.66;1" dur="8s" repeatCount="indefinite"/></rect>
  <text x="32" y="228" font-size="15" font-weight="bold" fill="#dc2626">误诊</text>
  <text x="32" y="256" font-size="14" fill="#1e293b">只把 ADC 记成过充。</text>
  <text x="32" y="280" font-size="14" fill="#1e293b">维修去换电芯，线还是断的。</text>
  <text x="32" y="304" font-size="14" fill="#1e293b">或把软件阈值放宽，并旁路硬件比较器。</text>
  <text x="32" y="336" font-size="14" fill="#334155">ASIL 等级由 HARA 定，不是固定牌。</text>

  <rect x="452" y="200" width="412" height="160" rx="8" fill="#fff" stroke="#e2e8f0"><animate attributeName="stroke-width" values="2;2;5;2" keyTimes="0;0.33;0.66;1" dur="8s" repeatCount="indefinite"/></rect>
  <text x="468" y="228" font-size="15" font-weight="bold" fill="#1e293b">要注入的两件事</text>
  <text x="468" y="256" font-size="14" fill="#334155">拔掉采样线：应报开线，或开线优先。</text>
  <text x="468" y="280" font-size="14" fill="#334155">抬高模拟电压且停喂狗：硬件仍切断。</text>
  <text x="468" y="312" font-size="14" fill="#334155">文中 &lt;100 ms 是教学示例，不是条款号。</text>
  <text x="468" y="336" font-size="14" fill="#b45309">示意图。不要对真电池做失效注入。</text>
</svg>
