<text x="412" y="364" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="15" fill="#0f766e">抬高</text>

<text x="64" y="478" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="15.5" fill="#14213d">下面管把电压变成电流，上面管像一堵电流墙。</text>
<text x="64" y="502" font-family="'Book Mono',monospace" font-size="16" fill="#0f766e">R_out ≈ g_m·r_o²</text>
<text x="64" y="524" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="15" fill="#b42318">代价：少 0.3~0.5 V 电压余量。</text>

