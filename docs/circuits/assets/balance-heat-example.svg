</style><rect class="bg" x="0" y="-156" width="800" height="680" /><text class="title" x="24" y="-128">均衡示例：被动的热，主动的一拍能量</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 均衡示例：被动的热，主动的一拍能量<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 示例值。没有同一工况的实测效率，图上不写百分数。<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 被动 4.2 V / 100 Ω<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="468" width="752" height="44" rx="6" /><text class="small" x="40" y="496">200 °C/W 是小封装悬空的数量级。铺铜以后以电阻手册的热降额为准。示意。</text><rect width="800" height="460" class="bg" />
  <text x="400" y="54" text-anchor="middle" font-size="13" class="small">示例值。没有同一工况的实测效率，图上不写百分数。</text>
  <rect x="40" y="78" width="340" height="250" rx="8" class="fill-boxy stroke-y" />
  <text x="210" y="108" text-anchor="middle" font-size="15" font-weight="bold" class="gold">被动 4.2 V / 100 Ω</text>
  <text x="70" y="140" font-size="13" class="txt">I = 42 mA</text>
  <text x="70" y="164" font-size="13" class="txt">P = 0.18 W</text>
  <text x="70" y="188" font-size="13" class="txt">2 倍余量：电阻额定 ≥ 0.35 W</text>
  <rect x="70" y="210" width="36" height="90" class="panel stroke-y" />
  <rect x="74" y="250" width="28" height="46" class="fill-r">
    <animate attributeName="height" values="8;46;46" keyTimes="0;0.45;1" dur="8s" repeatCount="indefinite" />
    <animate attributeName="y" values="288;250;250" keyTimes="0;0.45;1" dur="8s" repeatCount="indefinite" />
  </rect>
  <text x="120" y="250" font-size="12" class="small">热阻取 200 °C/W 时</text>
  <text x="120" y="272" font-size="12" class="small">ΔT ≈ 35 °C（悬空示例）</text>
  <rect x="420" y="78" width="340" height="250" rx="8" class="fill-boxb stroke-b" />
  <text x="590" y="108" text-anchor="middle" font-size="15" font-weight="bold" class="hi">主动一拍 10 μH、2 A</text>
  <text x="450" y="148" font-size="13" class="txt">½LI² = 20 μJ / 拍</text>
  <text x="450" y="176" font-size="13" class="txt">2 万次/秒 → 搬动约 0.4 W</text>
  <text x="450" y="214" font-size="13" opacity="0" class="warn">把 0.4 W 写成效率 80%
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.15;0.4;0.55;1" dur="8s" repeatCount="indefinite" />
  </text>
  <text x="450" y="246" font-size="13" opacity="0" class="ok">开关和磁件仍有损耗。百分数要有工况。
    <animate attributeName="opacity" values="0;0;0;1;1" keyTimes="0;0.4;0.55;0.7;1" dur="8s" repeatCount="indefinite" />
  </text>
  <text x="400" y="360" text-anchor="middle" font-size="14" class="txt">八串一起被动均衡，板子上大约 1.4 W。别堆在基准旁边。</text>
  <text x="400" y="400" text-anchor="middle" font-size="13" class="small">200 °C/W 是小封装悬空的数量级。铺铜以后以电阻手册的热降额为准。</text>

</svg>