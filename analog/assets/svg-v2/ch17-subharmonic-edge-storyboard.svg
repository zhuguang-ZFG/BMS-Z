<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1241" role="img" aria-labelledby="sbTitle sbDesc">
<title id="sbTitle">次谐波振荡：50% 占空比边界——打印分镜</title>
<desc id="sbDesc">5 格分镜，每格画该拍结束态</desc>

<defs>
