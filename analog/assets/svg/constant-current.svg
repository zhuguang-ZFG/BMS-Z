<title id="ttl">恒流源：电压随便变，电流我包了</title>
<desc>恒流源：电压随便变，电流我包了；节拍：① 基准把 V_B 钉死 → V_E=V_B−0.7 钉死 → I=V_E/R_E 钉死：电流与负载脱钩；② 负载变化只改 V_CE——管子默默吸收全部电压波动，电流纹丝不动；③ 温度捣乱？R_E 负反馈摁住（3.4 偏置同款机制）——这就是 11.2 差分对的「尾巴」</desc>
