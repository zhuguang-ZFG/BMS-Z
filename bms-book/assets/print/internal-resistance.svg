  <text x="520" y="122" text-anchor="start" font-size="13" opacity="0" class="txt" style="opacity: 0;">静置：端电压 = 电动势

  </text>
  <text x="510" y="224" text-anchor="start" font-size="13" font-weight="bold" opacity="0" class="warn" style="opacity: 0;">I·R = 0.4V 落差（示例）

  </text>
  <text x="657" y="170" text-anchor="start" font-size="13" font-weight="bold" opacity="0" class="ok" style="opacity: 0;">撤载 → 回弹

  </text>
  <text x="505" y="290" text-anchor="start" font-size="13" font-weight="bold" opacity="0" class="warn" style="opacity: 0;">老化：同样 20A → 跌到 2.7V

  </text>

  <text x="400" y="412" text-anchor="middle" font-size="13" class="small">关键：端电压 = 电动势 − I·R；带载读数虚低，静置才回真——老化的电池腿更软。</text>
