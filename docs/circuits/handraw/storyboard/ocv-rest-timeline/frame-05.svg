 <text x="200" y="226">3.620 V（放电支极限）</text>
 <text x="200" y="190">3.660 V（充电支）</text>
 <text x="640" y="220" font-size="12">40 mV 滞回</text>
</g>
<g font-family="KaiTi" fill="#003153">
 <text x="60" y="470" font-size="17">同一 SOC：充电支 3.660 V，静置支极限 3.620 V，差 40 mV——滞回还在</text>
 <text x="60" y="500" font-size="17">静置不等于充电；τ = 3 min 也不等于已经平衡</text>
</g>
<text x="480" y="546" font-family="KaiTi" font-size="14" fill="#003153" opacity="0.75" text-anchor="middle">原理示意 / 非实拍</text>
