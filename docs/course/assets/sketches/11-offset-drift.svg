<title id="title">电流没有流，账本却在扣</title><desc id="desc">开关已经断开，示意回路真实电流为0 A，传感器仍带+0.020 A固定偏移。5 h后多记放电0.10 Ah，对2 Ah为多扣比例+0.05，drift函数返回正。若误差定义为估计SOC减真实SOC，则为-0.05，即低估5个百分点。</desc>
