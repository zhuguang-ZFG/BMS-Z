<title id="ttl">桥式全波整流：四只二极管接力，负半周也「翻上来」（1N4007）</title>
<desc>桥式全波整流：四只二极管接力，负半周也「翻上来」（1N4007）；节拍：① 正半周（L+ R−）：D1、D4 导通——绿路走一遍；② 负半周（L− R+）：D2、D3 导通——走红路，负载电流方向不变！</desc>
