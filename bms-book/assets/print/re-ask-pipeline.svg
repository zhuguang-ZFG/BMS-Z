    <text class="head" x="288" y="106">① 哈希对得上吗？</text>
    <text class="small" x="288" y="126">复算 SHA-256，与数据卡比对</text>
    <text class="ok" x="724" y="112" text-anchor="end" opacity="1" style="opacity: 1;">对得上</text>
  </g>
  <!-- Q2 -->
  <g>
    <path d="M271.27 152Q272 144 280 144L516 143.8L752 144Q760 144 760 152L760.59 170L760 188Q760 196 752 196L516 196.36L280 196Q272 196 272 188L272 151.56" class="answer"/>
