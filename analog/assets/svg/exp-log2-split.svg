<text x="412" y="134" font-size="11.5" font-weight="bold" fill="#a4630f">① 公式</text><text x="412" y="159" font-size="14.5" font-weight="bold" fill="#16202b">n 个节点 ≤ ⌈log₂n⌉ 次测量</text><text x="412" y="176" font-size="10.5" fill="#5b666f">每刀砍掉一半嫌疑</text>
