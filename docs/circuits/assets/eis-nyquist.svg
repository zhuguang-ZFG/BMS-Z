<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="ui-monospace, Consolas, monospace">
  <title>EIS 奈奎斯特图：高频截距是 R0，中频是 RC 半圆，低频是约 45° 的 Warburg 尾巴。频率点沿曲线移动。数字为示意。</title>

  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #bf8700; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .liner { stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #1a7f37; stroke-width: 2.5; fill: none; }
    .liney { stroke: #bf8700; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .dotb { fill: #0969da; }
    .dotr { fill: #cf222e; }
    .dotg { fill: #1a7f37; }
    .doty { fill: #bf8700; }
    .boxb { fill: #ddf4ff; stroke: #0969da; }
    .boxr { fill: #ffebe9; stroke: #cf222e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .lineb { stroke: #4493f8; }
      .liner { stroke: #ff7b72; }
      .lineg { stroke: #3fb950; }
      .liney { stroke: #d29922; }
      .dotb { fill: #4493f8; }
      .dotr { fill: #ff7b72; }
      .dotg { fill: #3fb950; }
      .doty { fill: #d29922; }
      .boxb { fill: #12233a; stroke: #4493f8; }
      .boxr { fill: #3d1214; stroke: #ff7b72; }
    }
  </style>

  <!-- formula: Z=R0+1/(1/(Rct+Zw)+j*w*Cdl), Zw=sigma*(1-j)/sqrt(w) -->
  <rect class="bg" width="800" height="500"/>
  <text class="title" x="24" y="32">一个扫频，三段阻抗（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="122" rx="6"/>
  <text class="txt" x="40" y="68" opacity="0.28">① 高频<tspan class="small">　约 2000 Hz，点在实轴 20 mΩ，这是 R0。</tspan><animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="94" opacity="0.28">② 往半圆顶上走<tspan class="small">　这一拍结束时虚部最高，约 20.6 mΩ，频率约 4.58 Hz。</tspan><animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="120" opacity="0.28">③ 半圆走完<tspan class="small">　落到约 63.9 mΩ、虚部 7.2 mΩ。再往低频就不沿圆了。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="146" opacity="0.28">④ 尾巴<tspan class="small">　末端约 76.7 mΩ / 17.2 mΩ，斜率约 0.94。扩散不要当成又一个电阻。</tspan><animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="182" width="752" height="250" rx="6"/>
  <text class="small" x="40" y="204">−虚部 mΩ</text>
  <line class="axis" x1="92.0" y1="214.0" x2="92.0" y2="400.0"/>
  <line class="axis" x1="92.0" y1="400.0" x2="720.0" y2="400.0"/>
  <text class="small" x="712.0" y="418" text-anchor="end">实部 mΩ</text>
  <line class="grid" x1="139.1" y1="400.0" x2="139.1" y2="406.0"/>
  <text class="small" x="139.1" y="432" text-anchor="middle">20</text>
  <line class="grid" x1="327.3" y1="400.0" x2="327.3" y2="406.0"/>
  <text class="small" x="327.3" y="432" text-anchor="middle">40</text>
  <line class="grid" x1="515.5" y1="400.0" x2="515.5" y2="406.0"/>
  <text class="small" x="515.5" y="432" text-anchor="middle">60</text>
  <line class="grid" x1="703.7" y1="400.0" x2="703.7" y2="406.0"/>
  <text class="small" x="703.7" y="432" text-anchor="middle">80</text>
  <line class="grid" x1="86.0" y1="400.0" x2="92.0" y2="400.0"/>
  <text class="small" x="82.0" y="404.0" text-anchor="end">0</text>
  <line class="grid" x1="86.0" y1="321.4" x2="92.0" y2="321.4"/>
  <text class="small" x="82.0" y="325.4" text-anchor="end">10</text>
  <line class="grid" x1="86.0" y1="242.7" x2="92.0" y2="242.7"/>
  <text class="small" x="82.0" y="246.7" text-anchor="end">20</text>
  <polyline class="lineb" points="139.1,399.2 139.1,399.1 139.1,399.0 139.1,398.8 139.1,398.7 139.1,398.5 139.1,398.3 139.1,398.1 139.1,397.8 139.1,397.5 139.1,397.1 139.1,396.8 139.1,396.3 139.1,395.8 139.1,395.2 139.2,394.6 139.2,393.8 139.2,393.0 139.3,392.0 139.4,390.9 139.5,389.6 139.6,388.2 139.7,386.6 139.9,384.7 140.2,382.6 140.5,380.2 141.0,377.5 141.5,374.5 142.3,371.0 143.2,367.1 144.4,362.7 145.9,357.7 147.9,352.1 150.4,345.9 153.6,339.0 157.7,331.3 162.8,323.0 169.2,314.0 177.1,304.4 186.8,294.4 198.5,284.1 212.4,273.9 228.7,264.2 247.2,255.5 267.9,248.1 290.2,242.6 313.8,239.2 337.8,238.3 361.6,239.7 384.4,243.2 405.7,248.7 425.2,255.6 442.6,263.4 457.8,271.8 471.0,280.4 482.3,288.8 492.0,296.8 500.3,304.2 507.3,311.1 513.5,317.2 518.8,322.6 523.5,327.3 527.8,331.3 531.8,334.7 535.4,337.5 539.0,339.6 542.4,341.3 545.8,342.4 549.1,343.0 552.6,343.2 556.1,343.0 559.7,342.3 563.5,341.3 567.4,339.9 571.5,338.1 575.9,335.9 580.4,333.4 585.3,330.5 590.4,327.3 595.8,323.7 601.6,319.7 607.7,315.4 614.2,310.6 621.1,305.4 628.4,299.8 636.2,293.8 644.6,287.2 653.4,280.2 662.9,272.7 672.9,264.6" stroke-linejoin="round" stroke-linecap="round"/>
  <text class="hi" x="120" y="246">高频在左：先碰到 R0</text>
  <text class="gold" x="430" y="360">低频尾巴约 45°</text>
  <circle class="doty" r="6"><animate attributeName="cx" values="139.1;139.1;139.1;139.5;141.5;153.6;198.5;337.8;442.6;507.3;535.4;552.6;571.5;595.8;628.4;672.9" keyTimes="0;0.0714;0.1429;0.2143;0.2857;0.3571;0.4286;0.5000;0.5625;0.6250;0.6875;0.7500;0.8125;0.8750;0.9375;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="399.2;398.1;395.8;389.6;374.5;339.0;284.1;238.3;263.4;311.1;337.5;343.2;338.1;323.7;299.8;264.6" keyTimes="0;0.0714;0.1429;0.2143;0.2857;0.3571;0.4286;0.5000;0.5625;0.6250;0.6875;0.7500;0.8125;0.8750;0.9375;1" dur="12s" repeatCount="indefinite"/></circle>
  <text class="small" x="24" y="478">R0=20 mΩ，Rct=40 mΩ，Cdl=0.80 F，σ=0.006。Randles 示意，不是频谱仪记录。</text>
</svg>
