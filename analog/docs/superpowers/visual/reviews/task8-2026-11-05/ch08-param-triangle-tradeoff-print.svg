<line x1="508" y1="536" x2="742" y2="305" stroke="#c4b9ab" stroke-width="2.6" stroke-dasharray="" /><polygon points="742,305 727.8307873825577,309.1513147076215 737.6662099206148,319.1144700059132" fill="#c4b9ab" />
<path d="M760,410 L1026.04,408 L1381,411 L1384,491.22 L1381,552 L994.64,554 L756,550 Z" fill="#f6f2ed" stroke="#c4b9ab" stroke-width="1.4" /><path d="M762,412L1377,413" fill="none" stroke="#ffffff" stroke-width="2" opacity=".7" /><path d="M774,422 L1368,424 L1370,538 L776,540 Z" fill="none" stroke="#c4b9ab" stroke-width="2" opacity=".55" />
<line x1="508" y1="536" x2="742" y2="481" stroke="#c4b9ab" stroke-width="2.6" stroke-dasharray="" /><polygon points="742,481 727.7432157459241,477.1601949616247 730.9465200574614,490.7887987598018" fill="#c4b9ab" />
<path d="M760,586 L1026.04,584 L1381,587 L1384,667.22 L1381,728 L994.64,730 L756,726 Z" fill="#f6f2ed" stroke="#c4b9ab" stroke-width="1.4" /><path d="M762,588L1377,589" fill="none" stroke="#ffffff" stroke-width="2" opacity=".7" /><path d="M774,598 L1368,600 L1370,714 L776,716 Z" fill="none" stroke="#c4b9ab" stroke-width="2" opacity=".55" />
<line x1="508" y1="536" x2="742" y2="657" stroke="#c4b9ab" stroke-width="2.6" stroke-dasharray="" /><polygon points="742,657 733.6677138478512,644.8109472279955 727.2372387946666,657.2467419589475" fill="#c4b9ab" /></g><g id="technical-overlay"><text x="72" y="92" fill="#2a2927" font-size="50" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">参数三角：没有三项全优</text>
<text x="74" y="146" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#e2d9cf">大沟道降 R_ON，却把注入与寄生一起抬高；小沟道反过来。</text>
<text x="92" y="456" fill="#a4441d" font-size="40" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#efe7dc">先问三个测试条件</text>
<text x="92" y="506" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#efe7dc">什么负载？</text>
<text x="92" y="550" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#efe7dc">什么温度？</text>
<text x="92" y="594" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#efe7dc">什么信号幅度？</text>
<text x="92" y="638" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#efe7dc">答不上来，不许进预算表。</text>
<text x="786" y="286" fill="#2a2927" font-size="35" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">R_ON 低</text>
<text x="786" y="328" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">要大沟道，代价立刻转到下两项</text>
<text x="786" y="462" fill="#2a2927" font-size="35" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">注入与寄生电容</text>
<text x="786" y="504" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">沟道电荷多、Cout 大，台阶与馈通一起涨</text>
<text x="786" y="638" fill="#2a2927" font-size="35" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">带宽与串扰</text>
<text x="786" y="680" fill="#535453" font-size="32" font-weight="400" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">小沟道降注入，却让 R_ON 高、建立慢</text>
<path data-paper-shadow="true" transform="translate(8 12)" d="M68,988 L631.6,986 L1381,989 L1384,1030.46 L1381,1062 L565.6,1064 L64,1060 Z" fill="#535453" opacity="0.08" /><path data-paper-shadow="true" transform="translate(4 7)" d="M68,988 L631.6,986 L1381,989 L1384,1030.46 L1381,1062 L565.6,1064 L64,1060 Z" fill="#535453" opacity="0.12" /><path data-paper-shadow="true" transform="translate(2 3)" d="M68,988 L631.6,986 L1381,989 L1384,1030.46 L1381,1062 L565.6,1064 L64,1060 Z" fill="#535453" opacity="0.15" /><path d="M68,988 L631.6,986 L1381,989 L1384,1030.46 L1381,1062 L565.6,1064 L64,1060 Z" fill="#f6f2ed" stroke="#c4b9ab" stroke-width="1.4" /><path d="M70,990L1377,991" fill="none" stroke="#ffffff" stroke-width="2" opacity=".7" />
<text x="92" y="1036" fill="#2a2927" font-size="33" font-weight="700" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="start" data-background="#f6f2ed">先算允许注入与最慢建立，再反推沟道档位，最后才比价格与封装。</text></g></svg>
