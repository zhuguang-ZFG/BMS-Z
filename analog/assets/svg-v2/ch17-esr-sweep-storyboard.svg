<text x="84" y="484" font-size="13" font-weight="bold" fill="#3d6b4a">闭环：量 100Hz 纹波幅度 = 免费的 ESR 表</text>
<text x="84" y="512" font-size="12" fill="#16202b">纹波电流生热 → 热又推高 ESR → ESR 再抬纹波 → 更热</text>
<text x="84" y="536" font-size="12" font-weight="bold" fill="#a4630f">先问频率，再问幅度——测量必须能区分候选假设</text>
<path d="M760,470 q60,40 0,80" fill="none" stroke="#3d6b4a" stroke-width="1.6"/>
<polygon points="760,550 754,540 766,540" fill="#3d6b4a"/></g></g>
<text x="32" y="984" font-size="12" font-weight="bold" fill="#3d6b4a">5. 闭环</text>
<text x="24" y="1036" font-size="22" fill="#16202b">1. 扫描对象：输出大电解——ESR 从 0.1Ω 扫到 3Ω</text>
<text x="24" y="1066" font-size="22" fill="#16202b">2. ESR 越大，100Hz 纹波越高：400mV 已经烫手</text>
<text x="24" y="1096" font-size="22" fill="#16202b">3. 纹波电流在电解液里生热，热积在铝壳里散不掉</text>
<text x="24" y="1126" font-size="22" fill="#16202b">4. 电解液被蒸干，容量只剩标称三成</text>
<text x="24" y="1156" font-size="22" fill="#16202b">5. 量 100Hz 纹波幅度 = 免费的 ESR 表——先问频率，再问幅度</text>
