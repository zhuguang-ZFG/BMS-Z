<svg data-sketch="1" xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 800 460" font-family="ui-monospace, Consolas, monospace" data-snapshot-time="9">
  <title>阶跃放电的端电压：欧姆压降立刻出现，RC 极化尾巴随后跟上。数字为示意。</title>
  <desc>亮点走一次阶跃放电：t=0 立刻掉下欧姆压降，随后约 8 s 的 RC 尾巴慢慢跟上，卸流瞬间反向弹回。</desc>

