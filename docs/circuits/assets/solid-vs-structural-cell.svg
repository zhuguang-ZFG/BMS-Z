  <polyline class="liner" points="108.0,286.0 115.7,288.3 123.3,290.6 130.9,292.8 138.6,294.9 146.2,297.0 153.9,299.0 161.6,300.9 169.2,302.8 176.9,304.6 184.5,306.4 192.2,308.1 199.8,309.8 207.4,311.4 215.1,312.9 222.8,314.4 230.4,315.9 238.0,317.3 245.7,318.7 253.3,320.0 261.0,321.3 268.6,322.6 276.3,323.8 283.9,325.0 291.6,326.1 299.2,327.2 306.9,328.3 314.6,329.3 322.2,330.3 329.9,331.3 337.5,332.2 345.1,333.2 352.8,334.0 360.4,334.9 368.1,335.7 375.8,336.5 383.4,337.3 391.1,338.1 398.7,338.8 406.3,339.5 414.0,340.2 421.6,340.9 429.3,341.5 436.9,342.2 444.6,342.8 452.2,343.4 459.9,343.9 467.6,344.5 475.2,345.0 482.9,345.6 490.5,346.1 498.1,346.6 505.8,347.0 513.5,347.5 521.1,347.9 528.8,348.4 536.4,348.8 544.0,349.2 551.7,349.6 559.4,350.0 567.0,350.3 574.6,350.7 582.3,351.1 590.0,351.4 597.6,351.7 605.2,352.0 612.9,352.3 620.6,352.6 628.2,352.9 635.9,353.2 643.5,353.5 651.1,353.7 658.8,354.0 666.4,354.2 674.1,354.5 681.8,354.7 689.4,354.9 697.1,355.1 704.7,355.4 712.4,355.6 720.0,355.8" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="doty" r="6" cx="108.0" cy="286.0"><animate attributeName="cx" values="108.0;138.6;352.8;720.0;720.0" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="286.0;294.9;334.0;355.8;355.8" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite"/></circle>
  <circle class="dotr" r="4" cx="108.0" cy="286.0"><animate attributeName="cx" values="108.0;138.6;352.8;720.0;720.0" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite" begin="-6s"/><animate attributeName="cy" values="286.0;294.9;334.0;355.8;355.8" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite" begin="-6s"/></circle>
  <rect class="panel" x="24" y="460" width="752" height="68" rx="6"/>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="1">t = 0 s · 液态界面 3.700 V · 固体界面 3.700 V（示意）<animate attributeName="opacity" values="1;0;0;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0">t = 1 s · 液态界面 3.687 V · 固体界面 3.691 V（示意）<animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0">t = 8 s · 液态界面 3.680 V · 固体界面 3.649 V（示意）<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0">t = 20 s · 液态界面 3.680 V · 固体界面 3.627 V（示意）<animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="24" y="560">毫欧和秒不是氧化物、硫化物或聚合物的手册。短路时放热可以更大，这张图不画温度，也不改阈值。</text>

</svg>
