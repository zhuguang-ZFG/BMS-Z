[stroke="#a8321f"]{stroke:#c07a63}
text[fill="#a4630f"]{fill:#dcab63}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#a4630f"]{fill:#553a17}
[stroke="#a4630f"]{stroke:#c08a45}
text[fill="#6b3f63"]{fill:#c4a2bf}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#6b3f63"]{fill:#452c40}
[stroke="#6b3f63"]{stroke:#a17c9b}
}
</style>

<text x="480" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b">地址跳变的路过通道</text>
<text x="480" y="54" text-anchor="middle" font-size="12.5" fill="#5b666f">011→100 可能路过 111；INH 高电平时全部通道断开</text>
<rect x="48" y="96" width="864" height="300" rx="14" fill="#f6eedb" stroke="#c9bb9d" stroke-width="1.4"/>
<text x="72" y="128" font-size="12" fill="#5b666f">三位地址时间线</text>
<line x1="96" y1="230" x2="864" y2="230" stroke="#c9bb9d" stroke-width="1.6"/>
<line x1="96" y1="360" x2="864" y2="360" stroke="#c9bb9d" stroke-width="1.2"/>
<text x="72" y="386" font-size="12" fill="#5b666f">选中通道</text>
<text x="72" y="430" font-size="12" fill="#5b666f">INH</text>
<line x1="96" y1="446" x2="864" y2="446" stroke="#c9bb9d" stroke-width="1.2"/>
<text x="480" y="480" text-anchor="middle" font-size="12" fill="#5b666f">时间（切换沿几十 ns 级）</text>
<g transform="translate(0 -4)"><rect x="120" y="204" width="120" height="52" rx="8" fill="#e6eff3" stroke="#1f5d7a" stroke-width="2"/><text x="180" y="238" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f5d7a">011</text>
<rect x="340" y="204" width="120" height="52" rx="8" fill="#f7eedb" stroke="#a4630f" stroke-width="2"/><text x="400" y="238" text-anchor="middle" font-size="18" font-weight="bold" fill="#a4630f">111</text>
<rect x="620" y="204" width="120" height="52" rx="8" fill="#e6eff3" stroke="#1f5d7a" stroke-width="2"/><text x="680" y="238" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f5d7a">100</text>
<text x="120" y="284" font-size="12.5" fill="#16202b">原地址</text>
<text x="340" y="284" font-size="12.5" fill="#a4630f">一种可能的中间态</text>
<text x="620" y="284" font-size="12.5" fill="#16202b">新地址稳定</text>
<rect x="120" y="310" width="180" height="34" rx="6" fill="#e6eff3" stroke="#1f5d7a" stroke-width="1.6"/>
<text x="210" y="334" text-anchor="middle" font-size="12.5" fill="#1f5d7a">通道 3</text>
<rect x="300" y="310" width="480" height="34" rx="6" fill="#e8efe6" stroke="#3d6b4a" stroke-width="2"/>
<text x="540" y="334" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3d6b4a">全断：不接通任何通道</text>
<rect x="780" y="310" width="120" height="34" rx="6" fill="#e6eff3" stroke="#1f5d7a" stroke-width="1.6"/>
<text x="840" y="334" text-anchor="middle" font-size="11" fill="#1f5d7a">通道 4：接通/建立</text>
<path d="M120,440 L300,440 L300,404 L780,404 L780,440 L900,440" fill="none" stroke="#3d6b4a" stroke-width="3"/>
<text x="320" y="394" font-size="12.5" font-weight="bold" fill="#3d6b4a">先拉 INH，再改地址；稳定后释放</text>
<line x1="848" y1="352" x2="848" y2="454" stroke="#6b3f63" stroke-width="1.6" stroke-dasharray="4,4"/>
<text x="814" y="368" text-anchor="end" font-size="12" fill="#6b3f63">等 ≥ t_ON</text>
<text x="856" y="368" font-size="12" fill="#6b3f63">采样</text>
<rect x="96" y="500" width="816" height="76" rx="10" fill="#e8efe6" stroke="#3d6b4a" stroke-width="1.6"/>
<text x="120" y="530" font-size="13" font-weight="bold" fill="#3d6b4a">INH 拉高 → 改地址 → 地址稳定 → 释放 INH → 等够再采</text>
<text x="120" y="556" font-size="12" fill="#16202b">至少等 t_ON 接通，另留信号建立时间；格雷码只减少地址中间态。</text></g>
<rect x="24" y="596" width="912" height="34" rx="9" fill="#f7eedb" stroke="#c9bb9d" stroke-width="1.2"/>
<text x="480" y="620" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b3f63">释放 INH 后等接通、再等信号建立，最后才采样</text>
</svg>
