<svg xmlns="http://www.w3.org/2000/svg" width="800" height="660" viewBox="0 -156 800 660" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>锂电池工作原理动画：离子与电子分头行动</title>
  <desc>锂电池工作原理动画：离子与电子分头行动。示意。</desc><style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #d0d7de; }
    .fill-boxb { fill: #ddf4ff; }
    .fill-boxg { fill: #dafbe1; }
    .fill-boxr { fill: #ffebe9; }
    .fill-boxy { fill: #fff8c5; }
    .fill-b { fill: #0969da; }
    .fill-g { fill: #1a7f37; }
    .fill-r { fill: #cf222e; }
    .fill-y { fill: #9a6700; }
    .fill-ink { fill: #57606a; }
    .fill-muted { fill: #e2e8f0; }
    .fill-lockb { fill: #0969da; }
    .stroke-panel { stroke: #d0d7de; }
    .stroke-axis { stroke: #57606a; }
    .stroke-b { stroke: #0969da; }
    .stroke-g { stroke: #1a7f37; }
    .stroke-r { stroke: #cf222e; }
    .stroke-y { stroke: #bf8700; }
    .stroke-check { stroke: #ffffff; }
    .axis { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .txt { fill: #1f2328; font-size: 13px; }
    .small { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 16px; font-weight: bold; }
    .hi { fill: #0969da; }
    .warn { fill: #cf222e; }
    .ok { fill: #1a7f37; }
    .gold { fill: #9a6700; }
    .on { fill: #ffffff; font-size: 13px; font-weight: bold; }
    .lineb { stroke: #0969da; stroke-width: 2.5; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .fill-boxb { fill: #12233a; }
      .fill-boxg { fill: #0f2415; }
      .fill-boxr { fill: #3d1214; }
      .fill-boxy { fill: #2d2607; }
      .fill-b { fill: #4493f8; }
      .fill-g { fill: #3fb950; }
      .fill-r { fill: #ff7b72; }
      .fill-y { fill: #d29922; }
      .fill-ink { fill: #8b949e; }
      .fill-muted { fill: #30363d; }
      .fill-lockb { fill: #0969da; }
      .stroke-panel { stroke: #30363d; }
      .stroke-axis { stroke: #8b949e; }
      .stroke-b { stroke: #4493f8; }
      .stroke-g { stroke: #3fb950; }
      .stroke-r { stroke: #ff7b72; }
      .stroke-y { stroke: #d29922; }
      .stroke-check { stroke: #0d1117; }
      .axis { stroke: #8b949e; }
      .grid { stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .small { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .hi { fill: #4493f8; }
      .warn { fill: #ff7b72; }
      .ok { fill: #3fb950; }
      .gold { fill: #d29922; }
      .on { fill: #ffffff; }
      .lineb { stroke: #4493f8; }
    }
</style><rect class="bg" x="0" y="-156" width="800" height="660" /><text class="title" x="24" y="-128">充放电的本质：锂离子走电解液，电子走外电路</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 充电半圈：锂离子经电解液嵌进负极。<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 电子不穿隔膜，经充电器走外电路。<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 放电半圈：锂离子回正极，电子经负载做功。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 两段各占半个循环。离子和箭头是示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="448" width="752" height="44" rx="6" /><text class="small" x="40" y="476">放电：Li⁺ 回到正极，电子被迫绕外电路走——这就是输出给设备的电流。示意。</text><rect width="800" height="440" class="bg" />
  <path d="M130,120 V70 H670 V120" fill="none" stroke-width="3" class="stroke-axis" />
  <rect x="340" y="48" width="120" height="44" rx="8" stroke-width="2" class="panel stroke-axis" />
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <text x="400" y="76" opacity="0" class="hi">充电器<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.49;0.5;1" dur="8s" repeatCount="indefinite" /></text>
    <text x="400" y="76" opacity="0" class="gold">负载<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.49;0.5;1" dur="8s" repeatCount="indefinite" /></text>
  </g>

  
  <rect x="90" y="120" width="80" height="200" rx="6" class="fill-y" />
  <text x="130" y="345" text-anchor="middle" font-size="14" font-weight="bold" class="gold">正极（脱锂/嵌锂）</text>
  
  <rect x="630" y="120" width="80" height="200" rx="6" class="fill-ink" />
  <g stroke-width="1.5" class="stroke-axis">
    <line x1="636" y1="160" x2="704" y2="160" />
    <line x1="636" y1="200" x2="704" y2="200" />
    <line x1="636" y1="240" x2="704" y2="240" />
    <line x1="636" y1="280" x2="704" y2="280" />
  </g>
  <text x="670" y="345" text-anchor="middle" font-size="14" font-weight="bold" class="txt">负极（石墨层间）</text>

  
  <rect x="170" y="140" width="460" height="160" opacity="0.55" class="fill-boxb" />
  <text x="270" y="290" text-anchor="middle" font-size="12" class="hi">电解液</text>
  <line x1="400" y1="140" x2="400" y2="300" stroke-width="2" stroke-dasharray="6 5" class="stroke-axis" />
  <text x="400" y="132" text-anchor="middle" font-size="12" class="small">隔膜（只许离子过）</text>

  
  <g opacity="0">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.49;0.5;1" dur="8s" repeatCount="indefinite" />
    
    <g class="fill-g">
      <circle r="8"><animateMotion dur="2.2s" begin="0s" repeatCount="indefinite" path="M185,220 C300,175 500,265 615,220" /></circle>
      <circle r="8"><animateMotion dur="2.2s" begin="0.7s" repeatCount="indefinite" path="M185,220 C300,175 500,265 615,220" /></circle>
      <circle r="8"><animateMotion dur="2.2s" begin="1.4s" repeatCount="indefinite" path="M185,220 C300,175 500,265 615,220" /></circle>
    </g>
    <text x="250" y="180" font-size="13" font-weight="bold" class="ok">Li⁺ 嵌入负极 →</text>
    
    <g class="fill-y">
      <circle r="6"><animateMotion dur="2.0s" begin="0s" repeatCount="indefinite" path="M130,115 V70 H670 V115" /></circle>
      <circle r="6"><animateMotion dur="2.0s" begin="0.65s" repeatCount="indefinite" path="M130,115 V70 H670 V115" /></circle>
      <circle r="6"><animateMotion dur="2.0s" begin="1.3s" repeatCount="indefinite" path="M130,115 V70 H670 V115" /></circle>
    </g>
    <text x="540" y="60" font-size="13" font-weight="bold" class="gold">e⁻ 经充电器 →</text>
    <text x="400" y="412" text-anchor="middle" font-size="14" class="hi">充电：外部电源把 Li⁺"赶"进负极石墨层间储存起来</text>
  </g>

  
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.49;0.5;1" dur="8s" repeatCount="indefinite" />
    
    <g class="fill-g">
      <circle r="8"><animateMotion dur="2.2s" begin="0s" repeatCount="indefinite" path="M615,220 C500,265 300,175 185,220" /></circle>
      <circle r="8"><animateMotion dur="2.2s" begin="0.7s" repeatCount="indefinite" path="M615,220 C500,265 300,175 185,220" /></circle>
      <circle r="8"><animateMotion dur="2.2s" begin="1.4s" repeatCount="indefinite" path="M615,220 C500,265 300,175 185,220" /></circle>
    </g>
    <text x="480" y="180" font-size="13" font-weight="bold" class="ok">← Li⁺ 回到正极</text>
    
    <g class="fill-y">
      <circle r="6"><animateMotion dur="2.0s" begin="0s" repeatCount="indefinite" path="M670,115 V70 H130 V115" /></circle>
      <circle r="6"><animateMotion dur="2.0s" begin="0.65s" repeatCount="indefinite" path="M670,115 V70 H130 V115" /></circle>
      <circle r="6"><animateMotion dur="2.0s" begin="1.3s" repeatCount="indefinite" path="M670,115 V70 H130 V115" /></circle>
    </g>
    <text x="230" y="60" font-size="13" font-weight="bold" class="gold">← e⁻ 经负载做功</text>
    <text x="400" y="412" text-anchor="middle" font-size="14" class="gold">放电：Li⁺ 回到正极，电子被迫绕外电路走——这就是输出给设备的电流</text>
  </g>
</svg>