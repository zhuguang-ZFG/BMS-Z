<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="s6-ota-t s6-ota-d">
  <title id="s6-ota-t">新固件先进备用区，起不来就回旧区</title>
  <desc id="s6-ota-d">升级包把新固件写进备用区，校验通过才翻标记；bootloader 不参与升级，开机只看标记决定从哪个区起。写入中断电时标记还没翻，仍从旧区启动；重启起不来就把标记翻回去。</desc>
  <defs>
    <marker id="ar-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path class="head-teal" d="M0 0L9 4.5L0 9Z"/>
    </marker>
    <style>
      text { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #293b3a; }
      .title { font-size: 20px; font-weight: 700; }
      .h { font-size: 15px; font-weight: 700; fill: #293b3a; }
      .body { font-size: 13px; fill: #293b3a; }
      .small { font-size: 12px; fill: #626d65; }
      .accent { fill: #176b73; }
      .green { fill: #377b60; }
      .red { fill: #b84745; }
      .gold { fill: #926717; }
      .card { fill: #fffdf5; stroke: #968d77; stroke-width: 1.4; }
      .note { fill: #e4f0df; stroke: #377b60; stroke-width: 1.2; }
      .strip { fill: #e4f0df; stroke: #377b60; stroke-width: 1.4; }
      .warn { fill: #fbefc7; stroke: #926717; stroke-width: 1.4; }
      .danger { fill: #f6e2df; stroke: #b84745; stroke-width: 1.4; }
      .panel { fill: none; stroke: #968d77; stroke-width: 1.4; stroke-dasharray: 7 5; }
      .leader { stroke: #626d65; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
      .wire { stroke: #293b3a; stroke-width: 2; fill: none; }
      .flow { stroke: #176b73; stroke-width: 2; fill: none; }
      .load { stroke: #926717; stroke-width: 2; fill: none; }
      .leak { stroke: #b84745; stroke-width: 2; fill: none; }
      .ok { stroke: #377b60; stroke-width: 2.4; fill: none; }
      .dot { fill: #176b73; }
      .bolt { fill: #b84745; }
      .strike { stroke: #176b73; stroke-width: 2; fill: none; }
      .head-teal { fill: #176b73; }
      .head-gold { fill: #926717; }
      .head-red { fill: #b84745; }
      @media (prefers-color-scheme: dark) {
        text { fill: #edf0e5; }
        .title { fill: #edf0e5; }
        .h { fill: #edf0e5; }
        .body { fill: #edf0e5; }
        .small { fill: #b0beb3; }
        .accent { fill: #7ec5c5; }
        .green { fill: #8fc7a2; }
        .red { fill: #f39b91; }
        .gold { fill: #dfbd78; }
        .card { fill: #223333; stroke: #71908c; }
        .note { fill: #293f35; stroke: #8fc7a2; }
        .strip { fill: #293f35; stroke: #8fc7a2; }
        .warn { fill: #453e2b; stroke: #dfbd78; }
        .danger { fill: #483336; stroke: #f39b91; }
        .panel { stroke: #71908c; }
        .leader { stroke: #b0beb3; }
        .wire { stroke: #edf0e5; }
        .flow { stroke: #7ec5c5; }
        .load { stroke: #dfbd78; }
        .leak { stroke: #f39b91; }
        .ok { stroke: #8fc7a2; }
        .dot { fill: #7ec5c5; }
        .bolt { fill: #f39b91; }
        .strike { stroke: #7ec5c5; }
        .head-teal { fill: #7ec5c5; }
        .head-gold { fill: #dfbd78; }
        .head-red { fill: #f39b91; }
      }
    </style>
  </defs>

  <text x="480" y="38" text-anchor="middle" class="title">新固件先进备用区，起不来就回旧区</text>
  <text x="480" y="64" text-anchor="middle" class="small">切换只靠一个标记，bootloader 自己永不被覆盖</text>

  <rect class="card" x="40" y="110" width="170" height="68" rx="9"/>
  <text x="54" y="138" class="h">升级包</text>
  <text x="54" y="162" class="small">新固件镜像</text>
  <path d="M210 144H234" class="flow" marker-end="url(#ar-teal)"/>

  <rect class="warn" x="40" y="200" width="170" height="120" rx="9"/>
  <text x="54" y="228" class="h gold">bootloader</text>
  <text x="54" y="252" class="small">不参与升级</text>
  <text x="54" y="276" class="small">开机先看标记</text>
  <rect x="54" y="290" width="20" height="14" rx="3" class="wire"/>
  <path d="M58 290v-6a6 6 0 0 1 12 0v6" class="wire"/>
  <path d="M210 284H234" class="flow" marker-end="url(#ar-teal)"/>

  <rect class="card" x="240" y="96" width="260" height="72" rx="9"/>
  <text x="254" y="124" class="h">备用区</text>
  <text x="254" y="148" class="small">正在写入新固件</text>

  <rect class="danger" x="240" y="180" width="260" height="56" rx="9"/>
  <text x="254" y="208" class="h red">写入中断电</text>
  <text x="254" y="232" class="small">标记还没翻，仍从旧区起</text>

  <rect class="card" x="240" y="248" width="260" height="72" rx="9"/>
  <text x="254" y="276" class="h">现用区</text>
  <text x="254" y="300" class="small">旧固件在跑</text>

  <rect class="card" x="540" y="96" width="360" height="36" rx="8"/>
  <text x="554" y="119" class="h">写：新固件进备用区</text>
  <path d="M556 134V154" class="flow" marker-end="url(#ar-teal)"/>
  <rect class="card" x="540" y="160" width="360" height="36" rx="8"/>
  <text x="554" y="183" class="h">校验：对不上就不翻</text>
  <path d="M556 198V218" class="flow" marker-end="url(#ar-teal)"/>
  <rect class="card" x="540" y="224" width="360" height="36" rx="8"/>
  <text x="554" y="247" class="h">翻标记：唯一的开关</text>
  <path d="M556 262V282" class="flow" marker-end="url(#ar-teal)"/>
  <rect class="card" x="540" y="288" width="360" height="36" rx="8"/>
  <text x="554" y="311" class="h">重启：起来了才算数</text>
  <path d="M580 326V346" class="flow" marker-end="url(#ar-teal)"/>
  <path d="M800 326V346" class="flow" marker-end="url(#ar-teal)"/>

  <rect class="note" x="540" y="352" width="150" height="36" rx="8"/>
  <text x="554" y="376" class="h green">通过：新区生效</text>
  <rect class="danger" x="710" y="352" width="190" height="36" rx="8"/>
  <text x="724" y="376" class="h red">不通过：回滚旧区</text>

  <path d="M900 370H928V242H904" class="leader" marker-end="url(#ar-teal)"/>

  <rect class="strip" x="40" y="420" width="880" height="44" rx="12"/>
  <text x="480" y="448" text-anchor="middle" class="h green">标记是唯一的开关；bootloader 与旧镜像都不在升级路径上</text>

  <text x="480" y="500" text-anchor="middle" class="small">新固件先写备用区，校验通过才翻标记；重启起不来就把标记翻回去</text>
  <text x="480" y="528" text-anchor="middle" class="small">升级路径上不碰 bootloader，断电才有得救</text>
</svg>
