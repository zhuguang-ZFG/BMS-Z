<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="三步实验：构造合成 SPMe 味裁判、平台核心标定一阶 Thevenin、分窗口报 RMSE；左：SPM、SPMe、DFN 三档模型阶梯；右：分 SOC 窗口的 RMSE 柱状图，平台区 3.08 mV，两端 14.32 与 19.87 mV">
  <rect x="0" y="0" width="960" height="480" fill="#f8fafc"/>
  <text x="24" y="32" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#0f172a">仿真当裁判：平台区像，两端露馅</text>
  <text x="24" y="54" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">python code/pybamm_fit.py（stdlib，seed 42）：合成“SPMe 味”端电压当裁判，6573 s 充放双程 + 1 mV 噪声；数字为 demo 输出。</text>

  <!-- step strip -->
  <g font-family="Noto Sans SC, Microsoft YaHei, sans-serif">
    <rect x="60" y="68" width="258" height="34" rx="17" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <circle cx="86" cy="85" r="11" fill="#0f766e"/>
    <text x="86" y="90" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="104" y="90" font-size="13" fill="#0f172a">构造合成 SPMe 味裁判</text>
    <path d="M322 85 L346 85 M342 80 L348 85 L342 90" fill="none" stroke="#64748b" stroke-width="1.6"/>

    <rect x="352" y="68" width="258" height="34" rx="17" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <circle cx="378" cy="85" r="11" fill="#1d4ed8"/>
    <text x="378" y="90" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="396" y="90" font-size="13" fill="#0f172a">平台核心 0.3–0.7 标定 ECM</text>
    <path d="M614 85 L638 85 M634 80 L640 85 L634 90" fill="none" stroke="#64748b" stroke-width="1.6"/>

    <rect x="644" y="68" width="258" height="34" rx="17" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <circle cx="670" cy="85" r="11" fill="#7c3aed"/>
    <text x="670" y="90" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="688" y="90" font-size="13" fill="#0f172a">分窗口报 RMSE 找露馅处</text>
  </g>

  <!-- left: three-tier staircase -->
  <g font-family="Noto Sans SC, Microsoft YaHei, sans-serif">
    <text x="70" y="140" font-size="13" font-weight="700" fill="#334155">三档模型：按问题选型</text>
    <rect x="70" y="340" width="130" height="60" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
    <text x="135" y="366" font-size="14" font-weight="700" fill="#0f766e" text-anchor="middle">SPM</text>
    <text x="135" y="386" font-size="11" fill="#475569" text-anchor="middle">单粒子 · 快速估算</text>

    <rect x="220" y="290" width="130" height="110" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="285" y="318" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">SPMe</text>
    <text x="285" y="338" font-size="11" fill="#475569" text-anchor="middle">加电解液修正</text>
    <text x="285" y="356" font-size="11" fill="#475569" text-anchor="middle">精度速度折中</text>

    <rect x="370" y="240" width="130" height="160" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="435" y="268" font-size="14" font-weight="700" fill="#5b21b6" text-anchor="middle">DFN</text>
    <text x="435" y="288" font-size="11" fill="#475569" text-anchor="middle">固液两相全耦合</text>
    <text x="435" y="306" font-size="11" fill="#475569" text-anchor="middle">研究 · 参数辨识基准</text>

    <path d="M80 330 L200 280 L350 230 L490 198" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
    <path d="M490 198 L478 202 M490 198 L486 210" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <text x="404" y="192" font-size="12" fill="#64748b">计算量与机理细节递增</text>
    <text x="70" y="422" font-size="12" fill="#475569">选型看问题：要快用 SPM，要信一点用 SPMe，要机理用 DFN。</text>
  </g>

  <!-- right: RMSE by SOC window -->
  <g font-family="Noto Sans SC, Microsoft YaHei, sans-serif">
    <text x="600" y="124" font-size="13" font-weight="700" fill="#334155">同一个平台标定的 Thevenin，分窗口再考一次</text>
    <line x1="600" y1="370" x2="920" y2="370" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="600" y1="370" x2="600" y2="160" stroke="#cbd5e1" stroke-width="1"/>

    <rect x="640" y="227" width="70" height="143" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <rect x="740" y="339" width="70" height="31" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
    <rect x="840" y="171" width="70" height="199" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>

    <text x="675" y="217" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">14.32 mV</text>
    <text x="675" y="205" font-size="11" fill="#b45309" text-anchor="middle">n = 828</text>
    <text x="775" y="329" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">3.08 mV</text>
    <text x="775" y="317" font-size="11" fill="#0f766e" text-anchor="middle">n = 4703</text>
    <text x="875" y="161" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">19.87 mV</text>
    <text x="875" y="149" font-size="11" fill="#5b21b6" text-anchor="middle">n = 1042</text>
    <text x="675" y="392" font-size="12" fill="#475569" text-anchor="middle">SOC &lt; 0.20</text>
    <text x="775" y="392" font-size="12" fill="#475569" text-anchor="middle">0.20–0.80</text>
    <text x="875" y="392" font-size="12" fill="#475569" text-anchor="middle">SOC &gt; 0.80</text>

    <path d="M742 300 L742 306 L808 306 L808 300" fill="none" stroke="#0f766e" stroke-width="1.2"/>
    <text x="775" y="296" font-size="11" fill="#0f766e" text-anchor="middle">含标定窗口 0.3–0.7</text>

    <line x1="600" y1="278" x2="920" y2="278" stroke="#be123c" stroke-width="1.2" stroke-dasharray="6 4"/>
    <text x="775" y="268" font-size="11" fill="#be123c" text-anchor="middle">3× 平台区（断言线）</text>

    <text x="600" y="412" font-size="12" fill="#475569">两端平均为平台的 5.5×——裁判的两端 R1 20→40 mΩ、τ 300→900 s，</text>
    <text x="600" y="430" font-size="12" fill="#475569">常参 ECM 结构上就跟不住（分窗口诊断见第 17 章）。</text>
  </g>

  <rect x="24" y="446" width="912" height="26" rx="5" fill="#1e293b"/>
  <text x="480" y="464" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" fill="#f8fafc" text-anchor="middle">拟合回看：R0 30.20/30.00、R1 19.82/20.00、τ 360/300 s——参数个个拟对，输的是结构。</text>
</svg>
