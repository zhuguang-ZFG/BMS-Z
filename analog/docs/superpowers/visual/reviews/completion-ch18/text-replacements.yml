- id: legacy-figures-ch18-four-gates
  source: docs/p4-03-ch18.md#18.4
  before: '清单的边界就是故障的入口。边界画到哪里，评审就要跟到哪里。


    清单本身也要克制：压到一页纸以内，宁要二十条有人执行的，不要两百条没人看的。它同时是新人最好的培训教材——每条背后都站着一起真实故障，带新人过一遍清单，就是把团队交过的学费一次性讲透。四道关口的时间账也摆在这里：原理图与布局评审各约一小时，首板检查半天，回归数天；与一次返工重投、一次现场召回相比，这点时间微不足道。


    最后给清单配上维护人：每条评审项有明确的责任所有者，条目失效由他提出修订，新故障回写由他审核入库。没有维护人的清单会像过期的地图，地形已变，图上一片祥和。章首那句军规至此闭环：先量电源、预测波形、最小化复现，是把眼前的故障查清楚；四道关口与这张活清单，是让下一批故障不再发生——排故智慧的两半，一半在探头尖端，一半在画板之前。'
  after: 清单尽量控制在一页，二十条能执行的检查胜过两百条无人落实的条目；培训时用每条背后的真实故障解释原因。时间预算可按原理图与布局评审各约一小时、首板检查半天、回归数天安排。维护人负责修订失效条目、审核新故障回写，保证清单随产品更新。
  caption: 表 18-1 的立体版：潜在故障从左流入，原理图、布局、首板上电、出货回归四道闸依次削窄流带；闸顶阶梯按 1-10-100 法则爬升——几分钟、几小时加重布、几周加打样费、召回。闸下卡片列出各关的打勾判据（100nF、2×
    余量、<2mm、50mA、-20~70°C、±10%、≥24h），以及漏判后落进的 17 章条目。
