    <circle cx="330" cy="219" r="4" class="fill-b" />
    <text x="510" y="78" text-anchor="start" font-size="15" font-weight="bold" class="hi">采样路数 = S = 4</text>
    <text x="548" y="106" text-anchor="start" font-size="13" class="small">与并联数 P 无关</text>
    <text x="400" y="313" text-anchor="middle" font-size="12" class="warn">并联块内两颗被导线强制等电位——测不出单颗</text>
  </g>

  <text x="400" y="342" text-anchor="middle" font-size="13" class="small">关键：串联抬压、并联扩容；BMS 按并联块采样——4S2P 只需 4 路，块内单颗测不到。</text>
<rect x="24" y="366.0" width="752" height="188" rx="6" class="panel" /><text x="40" y="386.0" font-size="13" class="txt">底栏：电压只跟串数走。V = 3.7 × Ns。4 串 = 14.8 V</text><text x="40" y="402.0" font-size="12" class="small">总压 V</text><line x1="70.0" y1="402.0" x2="70.0" y2="516.0" stroke-width="1.5" class="stroke-axis" /><line x1="70.0" y1="516.0" x2="460.0" y2="516.0" stroke-width="1.5" class="stroke-axis" /><line x1="156.7" y1="516.0" x2="156.7" y2="521.0" class="stroke-axis" /><text x="156.7" y="534.0" text-anchor="middle" font-size="12" class="small">1</text><line x1="243.3" y1="516.0" x2="243.3" y2="521.0" class="stroke-axis" /><text x="243.3" y="534.0" text-anchor="middle" font-size="12" class="small">2</text><line x1="330.0" y1="516.0" x2="330.0" y2="521.0" class="stroke-axis" /><text x="330.0" y="534.0" text-anchor="middle" font-size="12" class="small">3</text><line x1="416.7" y1="516.0" x2="416.7" y2="521.0" class="stroke-axis" /><text x="416.7" y="534.0" text-anchor="middle" font-size="12" class="small">4</text><line x1="65.0" y1="489.6" x2="70.0" y2="489.6" class="stroke-axis" /><text x="62.0" y="493.6" text-anchor="end" font-size="12" class="small">3.7</text><line x1="65.0" y1="463.3" x2="70.0" y2="463.3" class="stroke-axis" /><text x="62.0" y="467.3" text-anchor="end" font-size="12" class="small">7.4</text><line x1="65.0" y1="410.5" x2="70.0" y2="410.5" class="stroke-axis" /><text x="62.0" y="414.5" text-anchor="end" font-size="12" class="small">14.8</text><polyline points="156.7,489.6 243.3,463.3 330.0,436.9 416.7,410.5" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" class="stroke-b" /><circle r="5" class="fill-y"><animate data-ease="linear" attributeName="cx" values="156.7;156.7;243.3;243.3;330.0;330.0;330.0;416.7;416.7" keyTimes="0.0000;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1.0000" dur="8s" repeatCount="indefinite" /><animate data-ease="linear" attributeName="cy" values="489.6;489.6;463.3;463.3;436.9;436.9;436.9;410.5;410.5" keyTimes="0.0000;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1.0000" dur="8s" repeatCount="indefinite" /></circle><text x="432.4" y="534.0" text-anchor="start" font-size="12" class="small">串联节数</text><text x="480" y="444.0" font-size="12" class="txt">2 并仍是 20 Ah，不出现在这条线上。</text>
