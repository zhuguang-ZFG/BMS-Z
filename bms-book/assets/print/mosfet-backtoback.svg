</style><rect class="bg" x="0" y="-156" width="800" height="620"/><text class="title" x="24" y="-128" opacity="1" style="opacity: 1;">保护开关为什么必须两颗 MOS"背靠背"</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6"/><text class="txt" x="40" y="-88" opacity="1" style="opacity: 1;">① 保护开关为什么必须两颗 MOS"背靠背"</text><text class="txt" x="40" y="-66" opacity="1" style="opacity: 1;">② 二极管方向 B-→P-</text><text class="txt" x="40" y="-44" opacity="1" style="opacity: 1;">③ 二极管方向 P-→B-</text><text class="txt" x="40" y="-22" opacity="1" style="opacity: 1;">④ 循环里亮着的那一步对应当前画面。数字标示意。</text><rect class="panel" x="24" y="408" width="752" height="44" rx="6"/><text class="small" x="40" y="436">结论：禁充电关 M2、禁放电关 M1，两颗二极管方向相反才能双向都关断。</text><rect width="800" height="400" class="bg"/>
