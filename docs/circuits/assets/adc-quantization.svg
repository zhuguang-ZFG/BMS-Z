<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440">
  <title>ADC 量化与误差动画</title>
  <rect width="800" height="440" fill="#f8fafc"/>
  <style>
  text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
  /* 深色模式：GitHub 深色主题下对调底色与文字色，只覆盖配色，不动几何与动画。
     stroke="#fff" 保持白色——那是彩色徽标上的勾选，不在覆盖范围内。 */
  @media (prefers-color-scheme: dark){
  rect[fill="#f8fafc"]{fill:#0f172a}
  rect[fill="#fff"]{fill:#1e293b}
  [fill="#f1f5f9"]{fill:#1e293b}
  [stroke="#f1f5f9"]{stroke:#1e293b}
  [fill="#e2e8f0"]{fill:#334155}
  [stroke="#e2e8f0"]{stroke:#334155}
  [fill="#cbd5e1"]{fill:#475569}
  [stroke="#cbd5e1"]{stroke:#475569}
  [fill="#64748b"]{fill:#94a3b8}
  [stroke="#64748b"]{stroke:#94a3b8}
  [fill="#475569"]{fill:#cbd5e1}
  [stroke="#475569"]{stroke:#cbd5e1}
  [fill="#334155"]{fill:#e2e8f0}
  [stroke="#334155"]{stroke:#e2e8f0}
  [fill="#1e293b"]{fill:#f1f5f9}
  [stroke="#1e293b"]{stroke:#f1f5f9}
  [fill="#dbeafe"]{fill:#1e3a8a}
  [stroke="#dbeafe"]{stroke:#1e3a8a}
  [fill="#eff6ff"]{fill:#172554}
  [stroke="#eff6ff"]{stroke:#172554}
  [fill="#bfdbfe"]{fill:#1e40af}
  [stroke="#bfdbfe"]{stroke:#1e40af}
  [fill="#1d4ed8"]{fill:#60a5fa}
  [stroke="#1d4ed8"]{stroke:#60a5fa}
  [fill="#1e40af"]{fill:#93c5fd}
  [stroke="#1e40af"]{stroke:#93c5fd}
  [fill="#2563eb"]{fill:#60a5fa}
  [stroke="#2563eb"]{stroke:#60a5fa}
  [fill="#3b82f6"]{fill:#60a5fa}
  [stroke="#3b82f6"]{stroke:#60a5fa}
  [fill="#ecfdf5"]{fill:#022c22}
  [stroke="#ecfdf5"]{stroke:#022c22}
  [fill="#a7f3d0"]{fill:#065f46}
  [stroke="#a7f3d0"]{stroke:#065f46}
  [fill="#86efac"]{fill:#166534}
  [stroke="#86efac"]{stroke:#166534}
  [fill="#065f46"]{fill:#6ee7b7}
  [stroke="#065f46"]{stroke:#6ee7b7}
  [fill="#059669"]{fill:#34d399}
  [stroke="#059669"]{stroke:#34d399}
  [fill="#fef2f2"]{fill:#450a0a}
  [stroke="#fef2f2"]{stroke:#450a0a}
  [fill="#fecaca"]{fill:#7f1d1d}
  [stroke="#fecaca"]{stroke:#7f1d1d}
  [fill="#fca5a5"]{fill:#b91c1c}
  [stroke="#fca5a5"]{stroke:#b91c1c}
  [fill="#991b1b"]{fill:#fca5a5}
  [stroke="#991b1b"]{stroke:#fca5a5}
  [fill="#dc2626"]{fill:#f87171}
  [stroke="#dc2626"]{stroke:#f87171}
  [fill="#fffbeb"]{fill:#451a03}
  [stroke="#fffbeb"]{stroke:#451a03}
  [fill="#fef3c7"]{fill:#78350f}
  [stroke="#fef3c7"]{stroke:#78350f}
  [fill="#92400e"]{fill:#fcd34d}
  [stroke="#92400e"]{stroke:#fcd34d}
  [fill="#b45309"]{fill:#fbbf24}
  [stroke="#b45309"]{stroke:#fbbf24}
  }
</style>

  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">ADC：刻度细 ≠ 尺子准</text>

  <!-- 坐标系：3.48V~3.84V，1mV=1px -->
  <line x1="80" y1="330" x2="540" y2="330" stroke="#64748b" stroke-width="1.5"/>
  <line x1="80" y1="330" x2="80" y2="90" stroke="#64748b" stroke-width="1.5"/>
  <text x="72" y="94" text-anchor="end" font-size="11" fill="#475569">3.84V</text>
  <text x="72" y="174" text-anchor="end" font-size="11" fill="#475569">3.72V</text>
  <text x="72" y="254" text-anchor="end" font-size="11" fill="#475569">3.60V</text>
  <text x="72" y="334" text-anchor="end" font-size="11" fill="#475569">3.48V</text>
  <text x="536" y="350" text-anchor="end" font-size="12" fill="#475569">时间</text>

  <!-- 真实电压（连续曲线） -->
  <path d="M80,300 C200,280 260,220 340,200 C420,180 480,160 540,140" fill="none" stroke="#334155" stroke-width="2"
        pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" opacity="0">
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.02;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dashoffset" values="100;0;0" keyTimes="0;0.28;1" dur="12s" repeatCount="indefinite"/>
  </path>
  <text x="300" y="105" text-anchor="middle" font-size="12" fill="#334155" opacity="0">真实电压（连续）
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.24;0.3;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- 量化台阶（蓝色，读数只能落在台阶上） -->
  <path d="M80,300 L140,300 L140,270 L200,270 L200,240 L260,240 L260,220 L320,220 L320,200 L380,200 L380,180 L440,180 L440,160 L540,160"
        fill="none" stroke="#2563eb" stroke-width="2.5" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3;0.33;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.3;0.55;1" dur="12s" repeatCount="indefinite"/>
  </path>
  <text x="170" y="258" text-anchor="middle" font-size="12" fill="#2563eb" opacity="0">1 LSB
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.34;0.38;0.6;0.64;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="310" y="360" text-anchor="middle" font-size="12" fill="#475569" opacity="0">12bit ADC：读数落在台阶上（台阶已放大示意，实际 1 LSB ≈ 1.2mV）
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.36;0.6;0.64;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- 同一把尺整体读高：偏移误差 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.62;0.66;1" dur="12s" repeatCount="indefinite"/>
    <path d="M80,300 L140,300 L140,270 L200,270 L200,240 L260,240 L260,220 L320,220 L320,200 L380,200 L380,180 L440,180 L440,160 L540,160"
          fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -24;0 -24" keyTimes="0;0.62;0.72;1" dur="12s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="310" y="388" text-anchor="middle" font-size="12" fill="#dc2626" opacity="0">参考源一偏，所有读数同方向偏（示意 +24mV）
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.72;0.78;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- 右侧四张概念卡 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.55;0.59;1" dur="12s" repeatCount="indefinite"/>
    <rect x="580" y="90" width="180" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="592" y="109" text-anchor="start" font-size="12" font-weight="bold" fill="#1e293b">分辨率 = 刻度多细</text>
    <text x="592" y="126" text-anchor="start" font-size="11" fill="#475569">12bit → 4096 格（示例）</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.63;0.67;1" dur="12s" repeatCount="indefinite"/>
    <rect x="580" y="146" width="180" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="592" y="165" text-anchor="start" font-size="12" font-weight="bold" fill="#1e293b">偏移误差 = 整体平移</text>
    <text x="592" y="182" text-anchor="start" font-size="11" fill="#475569">零点不准，处处同偏</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.71;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="580" y="202" width="180" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="592" y="221" text-anchor="start" font-size="12" font-weight="bold" fill="#1e293b">增益误差 = 比例不对</text>
    <text x="592" y="238" text-anchor="start" font-size="11" fill="#475569">读数随幅度按比例偏</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.79;0.83;1" dur="12s" repeatCount="indefinite"/>
    <rect x="580" y="258" width="180" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="592" y="277" text-anchor="start" font-size="12" font-weight="bold" fill="#1e293b">温漂 = 随温度变</text>
    <text x="592" y="294" text-anchor="start" font-size="11" fill="#475569">参考源自己也随温度晃</text>
  </g>

  <text x="400" y="422" text-anchor="middle" font-size="13" fill="#475569">示意：12 bit、5 V 参考，1 LSB=5/4096≈1.22 mV。黄点沿放大的台阶走。整尺上移 24 mV 是基准偏移，平均消不掉。</text>

  <circle r="5" fill="#f59e0b">
    <animateMotion dur="12s" repeatCount="indefinite" path="M80,300 L140,300 L140,270 L200,270 L200,240 L260,240 L260,220 L320,220 L320,200 L380,200 L380,180 L440,180 L440,160 L540,160" keyPoints="0;0;1;1" keyTimes="0;0.3300;0.5500;1" calcMode="linear"/>
  </circle>
</svg>
