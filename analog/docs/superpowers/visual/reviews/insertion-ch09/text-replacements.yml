changes:
- id: ch09-reference-ladder
  source: docs/p1-10-ch9.md#9.1
  before: '**基准芯片选型的一页地图**（按精度从粗到精）：


    1. 稳压二极管（5% 级）

    2. LM385 微功耗带隙（1–3% 初始精度，静态 10 µA 级，电池仪表常客）

    3. TL431（0.5%–2% 分级，可调价）

    4. REF50xx/ADR45xx 串联带隙（0.05%–0.1%，3–10 ppm/°C）

    5. LM399 恒温埋入齐纳（0.3–2 ppm/°C 级，台表专用）'
  after: '**用误差预算选基准**：先定义准确度、温区、校准方法、采样带宽、负载和供电，再比较初始误差、温漂、噪声、长期漂移与负载调整。12 位 ADC 也可能需要精密基准；高位数 ADC 在比例式测量中对绝对参考精度的要求反而可能较低。价格、功耗和精度没有统一的逐级十倍关系，不能靠一张型号阶梯替代系统预算。图中给出的是误差分栏的方法，不把不同测试条件的“最好参数”排成保证榜。'
  caption: 基准误差预算。按图内条件回代，示意不作器件保证。
  removed_prose_chars: -8
  relationship: replaces-text
- id: ch09-tl431-divider-floor
  source: docs/p1-10-ch9.md#9.2
  before: 回查误差：REF 电流 2 µA 流经 R1（10 kΩ）产生 20 mV 偏差，输出 4.98 V，偏 0.4%。若把电阻抬到 100 kΩ 档，同一偏置电流造成 0.2 V、4% 的崩盘。**TL431 的分压电阻不能为了省电随意放大**，这就是
    2 µA 偏置电流在元件表上写出的下限。
  after: '**回代偏流误差**：规定 VREF=2.5V、IREF=2µA，R1=R2=10kΩ 时，下支路 250µA，上支路 252µA，输出为 **5.020V**。各 100kΩ 时为 **5.200V**，偏移 0.2V。若只将参考改为典型
    2.495V，前一组变成 5.010V，仍不是 4.980V。设计时用适用的偏流最大值而非典型值求上电阻上限：允许该项误差 20mV、IREF,max=4µA 时，$R_1≤5kΩ$；分压电流是否为偏流的“100 倍”只是粗略口径，直接算误差更明确。'
  caption: TL431 参考偏流符号。按图内条件回代，示意不作器件保证。
  removed_prose_chars: -107
  relationship: replaces-text
- id: ch09-esr-window
  source: docs/p1-10-ch9.md#9.3
  before: '**稳定性大坑**：老式 LDO（LM1117 等 NPN 准 LDO）**依赖输出电容的 ESR 造零点**，要求 ESR 在 0.3~22Ω 区间。全贴陶瓷电容（ESR≈5mΩ）反而**振荡**！现代"陶瓷电容稳定"（ceramic-stable）LDO
    才允许用 MLCC。→ 换料必查此项。'
  after: '**电容选型必须绑定型号**：TI LM1117、SNOS412Q（2023-01）§9.2.2.1.3 明确最低 10µF 钽电容、ESR 0.3～22Ω；可调版加 CADJ 时要求 22µF。这个窗口不是所有 AMS1117、所有
    NPN 调整管或所有 LDO 的共同规律。若换成 5mΩ MLCC，就已经不满足这份手册的 ESR 条件，不能继续引用其稳定保证；也不能从这一点断言任何实际板必然振荡。'
  caption: 特定 LM1117 的电容条件。按图内条件回代，示意不作器件保证。
  removed_prose_chars: -50
  relationship: replaces-text
- id: ch09-ldo-four-accounts
  source: docs/p1-10-ch9.md#9.4
  before: '**升级路径的决策账**：卡在 7805 的热墙上时，三条路——① 降输入：前级若有 12 V，先 Buck 到 7.5 V 再进 7805，线性级功耗立减 2/3，纹波还更好；② 加散热：成本最低但治标不治本，且热区就在精密模拟旁边时等于埋漂移源；③
    换 DCDC：Buck 模块效率 85%–95%，2.1 W 的热变成 0.3 W，代价是开关噪声与成本。经验分界：**压差×电流 >1 W，就别让线性稳压硬扛**；<0.3 W 时线性方案在噪声、成本、可靠性上全面占优。'
  after: '**三种改热路径**：减小线性级输入差值、改善散热或改用开关转换。12→5V/300mA 的纯调整损耗是 2.1W；先降到 7.5V 再线性稳压为 0.75W，减少约 64.3%，还要加前级损耗。若直接用效率 90% 的 Buck
    给同一 1.5W 负载，损耗约 $1.5(1/0.9-1)=0.167W$。这些是规定工况下的对照，不能定成“大于 1W 一律 Buck、小于 0.3W 线性全面更好”。噪声、成本、空间和启动要求也参与选择。'
  caption: 稳压器排故测量入口。按图内条件回代，示意不作器件保证。
  removed_prose_chars: 11
  relationship: replaces-text
- id: ch09-bandgap-balance-v2
  source: docs/p1-10-ch9.md#9.1
  before: '**算一笔（配比 K 从哪来）**：两只晶体管电流密度比 $N=8$ → $\Delta V_{BE}=V_T\ln 8\approx 26mV\times2.08=54mV$。'
  after: '**读补偿图**：实线 CTAT 项下降，虚线加权 PTAT 项上升，和线平直只是所列线性模型的结果。传统用 26mV、0.085mV/°C 近似会算出 K≈11.3、总值约 1.26V；这是舍入与所设 VBE 的组合，不能拿它当所有芯片的固定输出。3ppm/°C
    或 1ppm/°C 必须来自具体型号、温度档和计算定义，也不代表某个局部斜率永远不变。教材中的 [带隙动画](p5-00-part5.md#demo20) 与 [基准路线对照](p5-00-part5.md#demo55) 可用于复习补偿思路，数值条件以本节为准。'
  caption: 带隙的一阶补偿，要把电流密度比算进去。线性示意：25°C 的 VBE 为 0.65 V，斜率 −2 mV/°C，N=8。
  removed_prose_chars: -167
  relationship: replaces-text
- id: ch09-shunt-corners-v2
  source: docs/p1-10-ch9.md#9.1
  before: 回查另外两个角：输入最高 13.2 V、空载时，全部电流灌进齐纳，$I_Z=\dfrac{13.2-5.1}{360}\approx 22.5\,mA$，功耗 $P_Z=5.1\times 22.5\,mA\approx 115\,mW$。离
    1N4733A 的 1 W 限额很远，70 °C 环境温度下按数据手册降额曲线折掉三成仍有富余。
  after: 输入最高 13.2V、空载时，分流电流 22.5mA，齐纳约耗 115mW，电阻约耗 182mW。选 0.5W 电阻可作起点，仍要看环境温度、封装与实际降额。齐纳标称 1W 的测试可能约束引线温度或安装条件，不能随口按环境 70°C“打七折”。实际回查还包括电阻容差、齐纳电压上下限与短路工况；恒压模型只帮助辨认最坏组合在哪个角。
  caption: 分流稳压，最小电流和最大功耗不在同一角。示意恒定 5.1 V 分流器，R=360 Ω，输入 10.8–13.2 V，负载 0–10 mA。
  removed_prose_chars: 1
  relationship: replaces-text
- id: ch09-tl431-bias-v2
  source: docs/p1-10-ch9.md#9.2
  before: 按 REF 偏置电流约束选量级：分压电流取 250 µA（≥100× 2 µA），$R_1+R_2=\dfrac{5\,V}{250\,µA}=20\,kΩ$，各 10 kΩ、1% 金属膜。
  after: 两只 10kΩ 各承受约 2.5V，单只功耗约 0.625mW，并非笼统“只有几微瓦”。24V 输出时上电阻约承受 21.5V；工作电压额定取决于具体电阻系列，0805 封装不能一律保证 150V。高压被测网络需要串联耐压分配，同时让
    TL431 阴极和参考端保持合法，不能让芯片直接承受上百伏。
  caption: TL431 偏流流入 REF，输出误差是加号。示意 Vref=2.5 V、Iref=2 µA，两电阻相等；忽略其余误差。
  removed_prose_chars: -52
  relationship: replaces-text
- id: ch09-dropout-ripple-v2
  source: docs/p1-10-ch9.md#9.3
  before: 电池应用还有一条动态账。放电末期电池电压一路下滑，输出开始"掉压差"的那个临界点，决定了你实际能用掉多少电量。3.3 V 输出配 100 mV 压差的 LDO，锂电池用到 3.4 V 以下才开始丢稳压，整段放电曲线几乎吃干榨净。换
    1.1 V 压差的 AMS1117，4.4 V 就投降，半块电池作废。
  after: 3.3V 输出配保证压差 100mV 的器件，需要输入最低至少 3.4V 再加系统余量；这不等于锂电池全部容量都能用尽。若某工况要 1.1V 压差，则需 4.4V 输入，常见单节锂电池连充满 4.2V 也不够，不能描述成只浪费后半段容量。掉压后环路抑制能力通常下降，但
    PSRR 不一定处处严格为 0dB，仍受调整管阻抗、频率和电容影响。静态电流是否上升也依架构，不能推广到所有 LDO。
  caption: 稳压余量看输入谷值，不只看平均值。准静态示意：目标 3.3 V，负载 0.5 A，Ron=0.3 Ω，输入正弦 1 kHz。
  removed_prose_chars: -43
  relationship: replaces-text
- id: ch09-thermal-budget-v2
  source: docs/p1-10-ch9.md#9.3
  before: 耗散 $P=(12-5)\times0.3=2.1\,W$。TO-220 不加散热片时，结到环境热阻 $R_{\theta JA}\approx 50\,°C/W$，温升 $2.1\times50=105\,°C$。25 °C
    室温下结温 130 °C，贴着 150 °C 关断线——夏天必挂。
  after: '**同一负载，两条热路径**：示意 12→5V、300mA、IQ=5mA，调整损耗 2.1W，加地脚损耗 60mW，共 2.16W。TA=45°C、θ=50°C/W 时 TJ≈153°C；若只在 25°C 看则为 133°C。它们都需要与工作结温限值和设计余量比较，不能把“150°C”一律当成保证热关断线。热保护是故障保护，不能当连续工作点。'
  caption: 热预算把地脚电流和环境温度一起算。示意 12→5 V、IQ=5 mA、环境 45°C；热阻 50 或 21°C/W。
  removed_prose_chars: -29
  relationship: replaces-text
- id: ch09-light-load-efficiency-v2
  source: docs/p1-10-ch9.md#9.3
  before: 把静态电流加回来更扎心。AMS1117 的 $I_Q\approx5\,mA$，放在 10 mA 平均负载的系统里，效率还要再乘 $\dfrac{10}{10+5}$，跌到 37%。**轻载电池设备里，$I_Q$ 比压差更致命**——这就是电池场景把
    TPS7A02（25 nA）当宝、把 AMS1117 拒之门外的原因。
  after: '**效率也用完整输入功率**：$\eta=V_{OUT}I_{OUT}/[V_{IN}(I_{OUT}+I_Q)]$。忽略 IQ 时，12→5V 约 41.7%，5→3.3V 为 66%，3.3→1.8V 为 54.5%；没有附加驱动电源等其他功耗时，这些才是对应的理想比值。示意
    5→3.3V、IOUT=10mA、IQ=5mA，实际效率是 44%，不能把另一组电压比混进来算成 37%。'
  caption: 轻载效率，要用完整输入功率作分母。示意 5→3.3 V；恒定 IQ 分别为 5 mA 和 50 µA，不对应特定型号。
  removed_prose_chars: -34
  relationship: replaces-text
- id: ch09-load-transient-v2
  source: docs/p1-10-ch9.md#9.5
  before: '**中间态**（三幕，对应动画里的"跌落→拉回"）：

    ① **ESR 跳变**（零延迟）：$\Delta V_1 = 490mA \times 50mΩ ≈ 25mV$，瞬间发生，神仙也拦不住。

    ② **电容放电**（µs 级）：环路带宽有限还没反应，电容独自供电：$\Delta V_2 = \dfrac{I\cdot\Delta t}{C} = \dfrac{0.49A \times 5µs}{10µF} ≈ 245mV$，继续下跌。

    ③ **环路接管**：误差放大器驱动调整管"调小电阻" → VOUT 回升 → 过冲/振铃（相位裕度决定）→ 重新锁定。'
  after: '**拍② 电容继续放电**：前 5µs 的电流缺口不变，所以电容电压下降 $\Delta I\Delta t/C=245mV$，此刻输出偏差为 −269.5mV。该区间的电压斜坡来自恒定缺口电流，不能把每颗实际 LDO 都画成固定时长的直线。输出变化通式为
    $\Delta V_C=\int i_Cdt/C$，ESR 项为 $ESR\cdot i_C$，两者必须使用同一个时刻的真实电容电流。'
  caption: 控制开始恢复时，电容仍可能继续放电。示意 ΔI=0.49 A、C=10 µF、ESR=50 mΩ；延迟 5 µs，恢复 τ=5 µs。
  removed_prose_chars: 69
  relationship: replaces-text
