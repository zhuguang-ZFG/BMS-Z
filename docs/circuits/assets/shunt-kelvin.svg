<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <title>检流电阻四线开尔文接法动画</title>
  <rect width="800" height="450" fill="#f8fafc"/>
  <style>
  text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
  /* 深色模式：GitHub 深色主题下对调底色与文字色，只覆盖配色，不动几何与动画。
     stroke="#fff" 保持白色——那是彩色徽标上的勾选，不在覆盖范围内。 */
  @media (prefers-color-scheme: dark){
  rect[fill="#f8fafc"]{fill:#0f172a}
  rect[fill="#fff"]{fill:#1e293b}
  [fill="#f1f5f9"]{fill:#1e293b}
  [stroke="#f1f5f9"]{stroke:#1e293b}
  [fill="#e2e8f0"]{fill:#334155}
  [stroke="#e2e8f0"]{stroke:#334155}
  [fill="#cbd5e1"]{fill:#475569}
  [stroke="#cbd5e1"]{stroke:#475569}
  [fill="#64748b"]{fill:#94a3b8}
  [stroke="#64748b"]{stroke:#94a3b8}
  [fill="#475569"]{fill:#cbd5e1}
  [stroke="#475569"]{stroke:#cbd5e1}
  [fill="#334155"]{fill:#e2e8f0}
  [stroke="#334155"]{stroke:#e2e8f0}
  [fill="#1e293b"]{fill:#f1f5f9}
  [stroke="#1e293b"]{stroke:#f1f5f9}
  [fill="#dbeafe"]{fill:#1e3a8a}
  [stroke="#dbeafe"]{stroke:#1e3a8a}
  [fill="#eff6ff"]{fill:#172554}
  [stroke="#eff6ff"]{stroke:#172554}
  [fill="#bfdbfe"]{fill:#1e40af}
  [stroke="#bfdbfe"]{stroke:#1e40af}
  [fill="#1d4ed8"]{fill:#60a5fa}
  [stroke="#1d4ed8"]{stroke:#60a5fa}
  [fill="#1e40af"]{fill:#93c5fd}
  [stroke="#1e40af"]{stroke:#93c5fd}
  [fill="#2563eb"]{fill:#60a5fa}
  [stroke="#2563eb"]{stroke:#60a5fa}
  [fill="#3b82f6"]{fill:#60a5fa}
  [stroke="#3b82f6"]{stroke:#60a5fa}
  [fill="#ecfdf5"]{fill:#022c22}
  [stroke="#ecfdf5"]{stroke:#022c22}
  [fill="#a7f3d0"]{fill:#065f46}
  [stroke="#a7f3d0"]{stroke:#065f46}
  [fill="#86efac"]{fill:#166534}
  [stroke="#86efac"]{stroke:#166534}
  [fill="#065f46"]{fill:#6ee7b7}
  [stroke="#065f46"]{stroke:#6ee7b7}
  [fill="#059669"]{fill:#34d399}
  [stroke="#059669"]{stroke:#34d399}
  [fill="#fef2f2"]{fill:#450a0a}
  [stroke="#fef2f2"]{stroke:#450a0a}
  [fill="#fecaca"]{fill:#7f1d1d}
  [stroke="#fecaca"]{stroke:#7f1d1d}
  [fill="#fca5a5"]{fill:#b91c1c}
  [stroke="#fca5a5"]{stroke:#b91c1c}
  [fill="#991b1b"]{fill:#fca5a5}
  [stroke="#991b1b"]{stroke:#fca5a5}
  [fill="#dc2626"]{fill:#f87171}
  [stroke="#dc2626"]{stroke:#f87171}
  [fill="#fffbeb"]{fill:#451a03}
  [stroke="#fffbeb"]{stroke:#451a03}
  [fill="#fef3c7"]{fill:#78350f}
  [stroke="#fef3c7"]{stroke:#78350f}
  [fill="#92400e"]{fill:#fcd34d}
  [stroke="#92400e"]{stroke:#fcd34d}
  [fill="#b45309"]{fill:#fbbf24}
  [stroke="#b45309"]{stroke:#fbbf24}
  }
</style>

  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">四线开尔文：只测电阻本体上的那点压降</text>

  <!-- 电压表 -->
  <rect x="320" y="55" width="160" height="50" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="400" y="74" text-anchor="middle" font-size="12" fill="#475569">电压表</text>
  <text x="400" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626" opacity="0">66mV → 算大 32%
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.24;0.48;0.52;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="400" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#059669" opacity="0">50mV ✓
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.52;0.56;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- 功率通路：端子-走线-焊盘-本体-焊盘-走线-端子 -->
  <line x1="60" y1="180" x2="200" y2="180" stroke="#94a3b8" stroke-width="8"/>
  <line x1="440" y1="180" x2="700" y2="180" stroke="#94a3b8" stroke-width="8"/>
  <rect x="200" y="165" width="60" height="30" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
  <rect x="380" y="165" width="60" height="30" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
  <rect x="260" y="165" width="120" height="30" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="320" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">检流电阻 1mΩ</text>
  <text x="60" y="160" text-anchor="middle" font-size="11" fill="#475569">B-</text>
  <text x="700" y="160" text-anchor="middle" font-size="11" fill="#475569">负载</text>

  <!-- 大电流沿通路流动 -->
  <circle r="5" fill="#2563eb">
    <animateMotion path="M60,180 L700,180" keyPoints="0;1;1" keyTimes="0;0.18;1" calcMode="linear" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#2563eb">
    <animateMotion path="M60,180 L700,180" keyPoints="0;1;1" keyTimes="0;0.18;1" calcMode="linear" dur="12s" repeatCount="indefinite" begin="-6s"/>
  </circle>
  <text x="380" y="215" text-anchor="middle" font-size="12" fill="#2563eb">50A（示例）</text>

  <!-- 各段压降解剖（示例：走线+焊盘每侧 0.16mΩ → 8mV） -->
  <text x="160" y="155" text-anchor="middle" font-size="11" fill="#dc2626" opacity="0">+8mV
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.08;0.12;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="320" y="155" text-anchor="middle" font-size="11" font-weight="bold" fill="#065f46" opacity="0">50mV（本体）
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.08;0.12;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="570" y="155" text-anchor="middle" font-size="11" fill="#dc2626" opacity="0">+8mV
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.08;0.12;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- 两线制：采样点取在焊盘外侧（红色） -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.18;0.22;0.48;0.52;1" dur="12s" repeatCount="indefinite"/>
    <path d="M180,180 L180,95 L320,95" fill="none" stroke="#dc2626" stroke-width="2"/>
    <path d="M460,180 L460,95 L480,95" fill="none" stroke="#dc2626" stroke-width="2"/>
    <circle cx="180" cy="180" r="4" fill="#dc2626"/>
    <circle cx="460" cy="180" r="4" fill="#dc2626"/>
    <rect x="130" y="162" width="120" height="36" fill="#dc2626" opacity="0.15"/>
    <rect x="390" y="162" width="120" height="36" fill="#dc2626" opacity="0.15"/>
  </g>

  <!-- 四线制：采样点移到本体内侧（绿色） -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.54;1" dur="12s" repeatCount="indefinite"/>
    <path d="M275,165 L275,115 L345,115 L345,105" fill="none" stroke="#059669" stroke-width="2"/>
    <path d="M365,165 L365,128 L455,128 L455,105" fill="none" stroke="#059669" stroke-width="2"/>
    <circle cx="275" cy="165" r="4" fill="#059669"/>
    <circle cx="365" cy="165" r="4" fill="#059669"/>
  </g>

  <!-- 分幕解说 -->
  <text x="400" y="278" text-anchor="middle" font-size="13" fill="#334155" opacity="0">两线制：采样点在焊盘外侧，把走线/焊点压降一起算了进去
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.24;0.46;0.5;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="400" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46" opacity="0">四线制：采样引线从本体内侧取，采样支路不流电流 → 线上无压降
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.56;0.8;0.84;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="400" y="322" text-anchor="middle" font-size="12" fill="#991b1b" opacity="0">电流误差会被安时积分一直累加——这里决定 SOC 的漂移速度
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.87;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="400" y="360" text-anchor="middle" font-size="11" fill="#475569" opacity="0">类比：量水管压差，表管要接在被测那一段的正中间，而不是接头外面
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.52;0.56;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <text x="400" y="434" text-anchor="middle" font-size="13" fill="#475569">关键：功率走外侧，采样取内侧；采样线不流电流，才测得准本体压降。</text>
</svg>
