corrections:
- Remove the duplicate intrinsic emitter resistance from the follower output-resistance formula; 10 kΩ
  source gives about 125 Ω.
- VBE=0 V does not prove an open emitter junction; check drive, B-E short and reference node.
- Distinguish clipping headroom from a guaranteed distortion-free amplitude.
- Move photos to the relevant packaging and diagnostic paragraphs and shorten repeated summaries.
