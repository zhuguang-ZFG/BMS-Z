<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="ttl">
<title id="ttl">运放阶跃：直线爬坡，不是指数曲线</title>
<desc>运放阶跃：直线爬坡，不是指数曲线；节拍：① 阶跃瞬间 V_+−V_−=1V：差分对彻底失衡，放大功能直接「宕机」；② 补偿电容被恒定电流充电 → 输出以 SR=0.5V/µs 直线上升（2µs 爬 1V）；③ 退出饱和后按 GBW 走指数收尾：τ≈0.16µs，可能带过冲振铃；④ 大信号看 SR、小信号看 GBW：两条曲线谁慢，就决定建立时间</desc>
