  <circle class="doty" r="6"><animate attributeName="cx" values="108.0;162.4;209.1;263.5;317.9;364.6;419.0;473.4;520.1;574.5;628.9;675.6;730.0" keyTimes="0.0000;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1.0000" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="411.6;385.7;366.0;348.3;337.1;331.9;329.0;326.1;320.9;309.7;292.0;272.3;246.4" keyTimes="0.0000;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1.0000" dur="12s" repeatCount="indefinite"/></circle>
  <text class="small" x="24" y="528">这条正弦只是为了让曲线有弯。不是三元也不是铁锂的 OCV。插值误差示意大约 25 mV（s=0.125）。</text>
</svg>
