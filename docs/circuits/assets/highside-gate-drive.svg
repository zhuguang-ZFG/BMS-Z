      <animate calcMode="spline" keySplines="0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.16;0.2;1" dur="12s" repeatCount="indefinite" begin="6s" />
    </text>
