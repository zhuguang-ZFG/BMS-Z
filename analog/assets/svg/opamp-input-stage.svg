<svg xmlns="http://www.w3.org/2000/svg" width="800" height="590" viewBox="0 0 800 590" role="img" aria-labelledby="ttl">
<title id="ttl">运放输入级选型：源阻抗决定一切</title>
<desc>运放输入级选型：源阻抗决定一切；节拍：① 三种输入级：先看 I_b、e_n、i_n 三个数，别看"低噪声"三个字；② 低源阻抗：热噪声 12.9 nV/√Hz 是地板，比的是 e_n → BJT 赢 1.7 倍；③ 高源阻抗 1 MΩ：BJT 的 I_b·R_s = 20 mV，CMOS 只有 1 µV —— 差四个数量级；④ RRIO 的代价：互补输入对在中点 g_m 凹陷 → 交越失真 + 失调台阶</desc>
<defs>
<linearGradient id="bgL" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#fdf8ea"/><stop offset="1" stop-color="#f6eedb"/>
</linearGradient>
<linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#141310"/><stop offset="1" stop-color="#1d1a14"/>
</linearGradient>
<radialGradient id="vig" cx="0.5" cy="0.44" r="0.78">
<stop offset="0.55" stop-color="#16202b" stop-opacity="0"/>
<stop offset="1" stop-color="#16202b" stop-opacity="0.055"/>
</radialGradient>
<linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#a4630f" stop-opacity="0.10"/>
<stop offset="0.55" stop-color="#a4630f" stop-opacity="0.028"/>
<stop offset="1" stop-color="#a4630f" stop-opacity="0"/>
</linearGradient>
<linearGradient id="hdrD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#dcab63" stop-opacity="0.13"/>
<stop offset="0.55" stop-color="#dcab63" stop-opacity="0.04"/>
<stop offset="1" stop-color="#dcab63" stop-opacity="0"/>
</linearGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
<circle cx="2.5" cy="3.5" r="0.9" fill="#c9bb9d"/>
<circle cx="19" cy="11" r="0.55" fill="#c9bb9d" opacity="0.7"/>
<circle cx="11.5" cy="22" r="0.6" fill="#c9bb9d" opacity="0.55"/>
</pattern>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
<feDropShadow dx="0" dy="1.4" stdDeviation="2" flood-color="#16202b" flood-opacity="0.13"/>
</filter>
<filter id="pglow" x="-70%" y="-70%" width="240%" height="240%">
<feGaussianBlur stdDeviation="1.7" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect class="page-bg" width="800" height="590" fill="url(#bgL)"/>
<rect class="page-grain" width="800" height="590" fill="url(#dots)"/>
<rect class="page-vig" width="800" height="590" fill="url(#vig)"/>
<rect class="page-hdr" width="800" height="72" fill="url(#hdr)"/>
<style>
text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Source Han Sans SC","Noto Sans SC",sans-serif;}
line,path,polyline,polygon{stroke-linecap:round;stroke-linejoin:round}
.page-bg{fill:url(#bgL)}
.page-grain{opacity:.5}
.page-vig{opacity:1}
.page-hdr{fill:url(#hdr)}
@media (prefers-color-scheme: dark){
.page-bg{fill:url(#bgD)}
.page-grain{opacity:.34}
.page-vig{opacity:.5}
.page-hdr{fill:url(#hdrD)}
[fill="#fdf8ea"]{fill:#141310}
[stroke="#fdf8ea"]{stroke:#141310}
[fill="#f6eedb"]{fill:#1d1a14}
[stroke="#f6eedb"]{stroke:#1d1a14}
[fill="#e0d3b8"]{fill:#3b3529}
[stroke="#e0d3b8"]{stroke:#3b3529}
[fill="#c9bb9d"]{fill:#4a4436}
[stroke="#c9bb9d"]{stroke:#4a4436}
[fill="#16202b"]{fill:#ece4d3}
[stroke="#16202b"]{stroke:#ece4d3}
[fill="#37424e"]{fill:#cfc6b4}
[stroke="#37424e"]{stroke:#cfc6b4}
[fill="#5b666f"]{fill:#a79e8b}
[stroke="#5b666f"]{stroke:#a79e8b}
[fill="#8b8272"]{fill:#857c6c}
[stroke="#8b8272"]{stroke:#857c6c}
text[fill="#fdf8ea"]{fill:#f9f3e3}
[fill="#e6eff3"]{fill:#17262e}
[fill="#e4f1f3"]{fill:#15262a}
[fill="#e8efe6"]{fill:#182418}
[fill="#f6e7e1"]{fill:#281a16}
[fill="#f7eedb"]{fill:#292114}
[fill="#efe8ee"]{fill:#241c22}
text[fill="#1f5d7a"]{fill:#7fb7cf}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#1f5d7a"]{fill:#2b4d5f}
[stroke="#1f5d7a"]{stroke:#6fa3b9}
text[fill="#2f7f96"]{fill:#8ac9d8}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#2f7f96"]{fill:#2b5660}
[stroke="#2f7f96"]{stroke:#77b2c1}
text[fill="#3d6b4a"]{fill:#98c096}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#3d6b4a"]{fill:#2f4a33}
[stroke="#3d6b4a"]{stroke:#7aa87c}
text[fill="#a8321f"]{fill:#e0907a}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#a8321f"]{fill:#55231b}
[stroke="#a8321f"]{stroke:#c07a63}
text[fill="#a4630f"]{fill:#dcab63}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#a4630f"]{fill:#553a17}
[stroke="#a4630f"]{stroke:#c08a45}
text[fill="#6b3f63"]{fill:#c4a2bf}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#6b3f63"]{fill:#452c40}
[stroke="#6b3f63"]{stroke:#a17c9b}
}
</style>
<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">运放输入级选型：源阻抗决定一切</text>
<text x="400" y="53" text-anchor="middle" font-size="12" fill="#5b666f">判据只有一条：V_err = I_b × R_s —— 低阻比 e_n，高阻比 I_b</text>
<rect x="40" y="80" width="234" height="220" rx="10" fill="#f6eedb" stroke="#a8321f" stroke-width="2"/>
<text x="157" y="109" text-anchor="middle" font-size="15" font-weight="bold" fill="#a8321f">BJT 输入级</text>
<path d="M56 121 Q157.00 121.02 258 121" fill="none" stroke="#a8321f" stroke-opacity="0.35" stroke-width="1.5"/>
<text x="56" y="148" font-size="11.5" fill="#5b666f">偏置电流 I_b</text>
<text x="258" y="148" text-anchor="end" font-size="12" font-weight="bold" fill="#16202b">10 nA ~ 1 µA</text>
<text x="56" y="174" font-size="11.5" fill="#5b666f">电压噪声 e_n</text>
<text x="258" y="174" text-anchor="end" font-size="12" font-weight="bold" fill="#16202b">3 ~ 10 nV/√Hz</text>
<text x="56" y="200" font-size="11.5" fill="#5b666f">电流噪声 i_n</text>
<text x="258" y="200" text-anchor="end" font-size="12" font-weight="bold" fill="#16202b">较高</text>
<path d="M56 226 Q157.00 226.02 258 226" fill="none" stroke="#a8321f" stroke-opacity="0.35" stroke-width="1.5"/>
<text x="56" y="248" font-size="11.5" fill="#5b666f">最佳区间</text>
<text x="56" y="270" font-size="13" font-weight="bold" fill="#a8321f">Rs &lt; 30 kΩ</text>
<text x="56" y="290" font-size="11" fill="#5b666f">低阻下 e_n 主导</text>
<rect x="283" y="80" width="234" height="220" rx="10" fill="#f6eedb" stroke="#1f5d7a" stroke-width="2"/>
<text x="400" y="109" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f5d7a">CMOS 输入级</text>
<path d="M299 121 Q400.00 120.27 501 121" fill="none" stroke="#1f5d7a" stroke-opacity="0.35" stroke-width="1.5"/>
<text x="299" y="148" font-size="11.5" fill="#5b666f">偏置电流 I_b</text>
<text x="501" y="148" text-anchor="end" font-size="12" font-weight="bold" fill="#16202b">1 pA ~ 1 nA</text>
<text x="299" y="174" font-size="11.5" fill="#5b666f">电压噪声 e_n</text>
<text x="501" y="174" text-anchor="end" font-size="12" font-weight="bold" fill="#16202b">10 ~ 30 nV/√Hz</text>
<text x="299" y="200" font-size="11.5" fill="#5b666f">电流噪声 i_n</text>
<text x="501" y="200" text-anchor="end" font-size="12" font-weight="bold" fill="#16202b">极低</text>
<path d="M299 226 Q400.00 225.40 501 226" fill="none" stroke="#1f5d7a" stroke-opacity="0.35" stroke-width="1.5"/>
<text x="299" y="248" font-size="11.5" fill="#5b666f">最佳区间</text>
<text x="299" y="270" font-size="13" font-weight="bold" fill="#1f5d7a">Rs &gt; 300 kΩ</text>
<text x="299" y="290" font-size="11" fill="#5b666f">I_b·R_s 几乎为零</text>
<rect x="526" y="80" width="234" height="220" rx="10" fill="#f6eedb" stroke="#3d6b4a" stroke-width="2"/>
<text x="643" y="109" text-anchor="middle" font-size="15" font-weight="bold" fill="#3d6b4a">JFET 输入级</text>
<path d="M542 121 Q643.00 120.56 744 121" fill="none" stroke="#3d6b4a" stroke-opacity="0.35" stroke-width="1.5"/>
<text x="542" y="148" font-size="11.5" fill="#5b666f">偏置电流 I_b</text>
<text x="744" y="148" text-anchor="end" font-size="12" font-weight="bold" fill="#16202b">1 pA ~ 30 pA</text>
<text x="542" y="174" font-size="11.5" fill="#5b666f">电压噪声 e_n</text>
<text x="744" y="174" text-anchor="end" font-size="12" font-weight="bold" fill="#16202b">10 ~ 20 nV/√Hz</text>
<text x="542" y="200" font-size="11.5" fill="#5b666f">电流噪声 i_n</text>
<text x="744" y="200" text-anchor="end" font-size="12" font-weight="bold" fill="#16202b">极低</text>
<path d="M542 226 Q643.00 226.40 744 226" fill="none" stroke="#3d6b4a" stroke-opacity="0.35" stroke-width="1.5"/>
<text x="542" y="248" font-size="11.5" fill="#5b666f">最佳区间</text>
<text x="542" y="270" font-size="13" font-weight="bold" fill="#3d6b4a">30 kΩ ~ 300 kΩ</text>
<text x="542" y="290" font-size="11" fill="#5b666f">e_n 与 I_b 都低</text>
<rect x="40" y="320" width="720" height="112" rx="10" fill="#e6eff3" stroke="#1f5d7a" stroke-opacity="0.45" stroke-width="1.5"/>
<text x="400" y="344" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f5d7a">按源阻抗选输入级（横轴为对数刻度）</text>
<path d="M70 396 Q400.00 397.17 730 396" fill="none" stroke="#5b666f" stroke-width="1.4" stroke-dasharray="3,4"/>
<path d="M70 396 Q192.00 396.49 314 396" fill="none" stroke="#a8321f" stroke-width="9"/>
<text x="192" y="372" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a8321f">BJT 最佳</text>
<path d="M314 396 Q396.50 396.03 479 396" fill="none" stroke="#3d6b4a" stroke-width="9"/>
<text x="396" y="372" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3d6b4a">JFET 过渡区</text>
<path d="M479 396 Q604.50 396.02 730 396" fill="none" stroke="#1f5d7a" stroke-width="9"/>
<text x="604" y="372" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1f5d7a">CMOS 最佳</text>
<text x="70" y="418" text-anchor="middle" font-size="10.5" fill="#5b666f">1 kΩ</text>
<text x="314" y="418" text-anchor="middle" font-size="10.5" fill="#5b666f">30 kΩ</text>
<text x="479" y="418" text-anchor="middle" font-size="10.5" fill="#5b666f">300 kΩ</text>
<text x="730" y="418" text-anchor="middle" font-size="10.5" fill="#5b666f">10 MΩ</text>
<circle r="6" fill="#a4630f" filter="url(#pglow)"><animateMotion dur="12s" begin="-3s" repeatCount="indefinite" path="M70,396 L730,396"/></circle>
<g opacity="0">
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.86;1" dur="12s" repeatCount="indefinite"/>
<rect x="60" y="446" width="680" height="52.0" rx="9" fill="#e8efe6" stroke="#3d6b4a" stroke-width="1.5" filter="url(#soft)"/><rect x="66" y="453" width="3" height="38.0" rx="1.5" fill="#3d6b4a"/><text x="400" y="468.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3d6b4a">低阻源看 e_n（BJT 胜），高阻源看 I_b（CMOS / JFET 胜）：1 MΩ</text><text x="400" y="486.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3d6b4a"> 配 20 nA 就是 20 mV 直流误差，比运放自身的 V_os 大两个数量级。</text>
</g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.02;0.23;0.25;1" dur="12s" repeatCount="indefinite"/><rect x="159.8" y="542.0" width="480.3" height="24.1" rx="12.0" fill="#1f5d7a" fill-opacity="0.09" stroke="#1f5d7a" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.23;0.25;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="555" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1f5d7a" opacity="0">① 三种输入级：先看 I_b、e_n、i_n 三个数，别看"低噪声"三个字<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.23;0.25;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.25;0.27;0.48;0.5;1" dur="12s" repeatCount="indefinite"/><rect x="130.6" y="542.0" width="538.8" height="24.1" rx="12.0" fill="#a8321f" fill-opacity="0.09" stroke="#a8321f" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.48;0.5;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="555" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#a8321f" opacity="0">② 低源阻抗：热噪声 12.9 nV/√Hz 是地板，比的是 e_n → BJT 赢 1.7 倍<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.48;0.5;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.5;0.52;0.73;0.75;1" dur="12s" repeatCount="indefinite"/><rect x="101.0" y="542.0" width="598.1" height="24.1" rx="12.0" fill="#3d6b4a" fill-opacity="0.09" stroke="#3d6b4a" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.73;0.75;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="555" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#3d6b4a" opacity="0">③ 高源阻抗 1 MΩ：BJT 的 I_b·R_s = 20 mV，CMOS 只有 1 µV —— 差四个数量级<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.73;0.75;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 -4.0" keyTimes="0;0.75;0.77;0.98;1" dur="12s" repeatCount="indefinite"/><rect x="150.5" y="542.0" width="499.0" height="24.1" rx="12.0" fill="#6b3f63" fill-opacity="0.09" stroke="#6b3f63" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.77;0.98;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="555" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#6b3f63" opacity="0">④ RRIO 的代价：互补输入对在中点 g_m 凹陷 → 交越失真 + 失调台阶<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.77;0.98;1" dur="12s" repeatCount="indefinite"/></text></g>
</svg>