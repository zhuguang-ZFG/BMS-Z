<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">恒压源与恒流源：电源的两种性格</text>

<text x="400" y="46" text-anchor="middle" font-size="14" font-weight="bold" fill="#37424e">横轴 I、纵轴 V：恒压水平、恒流竖直；斜率幅值对应输出阻抗</text>
<text x="200" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f5d7a">① 电压源：I 怎么变，V 都不动</text>
<path d="M70 290 Q200.00 288.97 330 290" fill="none" stroke="#5b666f" stroke-width="1.6"/>
<path d="M70 110 Q69.40 200.00 70 290" fill="none" stroke="#5b666f" stroke-width="1.6"/>
<text x="330" y="310" text-anchor="end" font-size="10.5" fill="#5b666f">负载电流 I →</text>
<text x="62" y="120" text-anchor="end" font-size="10.5" fill="#5b666f">5.0V</text>
<text x="62" y="220" text-anchor="end" font-size="10.5" fill="#5b666f">4.8V</text>
<path d="M70 120 Q200.00 120.74 330 120" fill="none" stroke="#8b8272" stroke-width="1" stroke-dasharray="4,3"/>
<path d="M70 220 Q200.00 219.88 330 220" fill="none" stroke="#8b8272" stroke-width="1" stroke-dasharray="4,3"/>
<path d="M70 120 Q200.00 120.74 330 120" fill="none" stroke="#3d6b4a" stroke-width="3.5"/>
<text x="82" y="148" font-size="10.5" font-weight="bold" fill="#3d6b4a">理想：水平线</text>
<path d="M70 120 Q200.16 169.58 330 220" fill="none" stroke="#a8321f" stroke-width="3"/>
<text x="238" y="212" font-size="11" font-weight="bold" fill="#a8321f">实际：斜线</text>
<text x="202" y="244" font-size="10.5" fill="#5b666f">斜率绝对值 = 输出阻抗</text>
<text x="70" y="266" font-size="10.5" fill="#5b666f">0A</text>
<text x="330" y="266" text-anchor="end" font-size="10.5" fill="#5b666f">2A</text>
<circle r="5" fill="#a4630f"><animateMotion dur="11s" repeatCount="indefinite" path="M74,120 L326,120" keyPoints="0;1" keyTimes="0;1"/></circle>
<circle r="5" fill="#a8321f"><animateMotion dur="11s" begin="-1.4s" repeatCount="indefinite" path="M72,121 L328,219" keyPoints="0;1" keyTimes="0;1"/></circle>
<path d="M420 76 Q420.83 216.00 420 356" fill="none" stroke="#c9bb9d" stroke-width="1" stroke-dasharray="6,5"/>
<text x="600" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b3f63">② 电流源：V 怎么变，I 都不动</text>
<path d="M470 290 Q600.00 289.09 730 290" fill="none" stroke="#5b666f" stroke-width="1.6"/>
<path d="M470 110 Q469.65 200.00 470 290" fill="none" stroke="#5b666f" stroke-width="1.6"/>
<text x="730" y="330" text-anchor="end" font-size="10.5" fill="#5b666f">负载电流 I →</text>
<text x="462" y="124" text-anchor="end" font-size="10.5" fill="#5b666f">10V</text>
<text x="462" y="294" text-anchor="end" font-size="10.5" fill="#5b666f">0V</text>
<text x="470" y="310" font-size="10.5" fill="#5b666f">0.99mA</text>
<text x="730" y="310" text-anchor="end" font-size="10.5" fill="#5b666f">1.00mA</text>
<path d="M470 120 Q600.00 119.72 730 120" fill="none" stroke="#8b8272" stroke-width="1" stroke-dasharray="4,3"/>
<path d="M470 200 Q600.00 200.07 730 200" fill="none" stroke="#8b8272" stroke-width="1" stroke-dasharray="4,3"/>
<path d="M730 120 Q729.65 205.00 730 290" fill="none" stroke="#3d6b4a" stroke-width="3.5"/>
<text x="478" y="104" font-size="11" font-weight="bold" fill="#3d6b4a">理想：竖线（任何电压都 1mA）</text>
<path d="M730 290 Q716.24 205.12 704 120" fill="none" stroke="#a8321f" stroke-width="3" stroke-dasharray="8,4"/>
<text x="478" y="246" font-size="10.5" font-weight="bold" fill="#a8321f">实际：近竖直（Ro=10MΩ，电流微降）</text>
<circle r="5" fill="#a4630f"><animateMotion dur="11s" begin="-0.7s" repeatCount="indefinite" path="M730,286 L730,124" keyPoints="0;1" keyTimes="0;1"/></circle>
<circle r="5" fill="#a8321f"><animateMotion dur="11s" begin="-2.1s" repeatCount="indefinite" path="M730,288 L704,122" keyPoints="0;1" keyTimes="0;1"/></circle>
<circle r="5" fill="#3d6b4a"><animateMotion dur="11s" begin="-2.8s" repeatCount="indefinite" path="M326,120 L74,120" keyPoints="0;1" keyTimes="0;1"/></circle>
<circle r="5" fill="#1f5d7a"><animateMotion dur="11s" begin="-3.5s" repeatCount="indefinite" path="M730,124 L730,286" keyPoints="0;1" keyTimes="0;1"/></circle>
<rect x="66" y="112" width="268" height="182" rx="10" fill="none" stroke="#1f5d7a" stroke-width="2.5" opacity="0" filter="url(#pglow)"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.4s" repeatCount="indefinite"/></rect>
<rect x="466" y="112" width="268" height="182" rx="10" fill="none" stroke="#6b3f63" stroke-width="2.5" opacity="0" filter="url(#pglow)"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.4s" repeatCount="indefinite"/></rect>
<text x="200" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#3d6b4a">斜率幅值越小 = 内阻越小 = 越「恒压」</text>
<text x="600" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b3f63">斜率幅值越大 = 输出阻抗越大 = 越「恒流」</text>
<path d="M40 372 Q400.00 371.08 760 372" fill="none" stroke="#c9bb9d" stroke-width="1"/>
<text x="400" y="400" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#37424e">算一笔：内阻怎么毁掉「恒压」</text>
<rect x="40" y="416" width="352" height="70" rx="8" fill="#e6eff3" stroke="#1f5d7a" stroke-width="1.6"/>
<text x="56" y="440" font-size="11.5" font-weight="bold" fill="#1f5d7a">实验室电源：Zout ≈ 1mΩ</text>
<text x="56" y="462" font-size="11.5" fill="#5b666f">5A 时跌 5mV（0.1%）→ 基本可以当恒压源</text>
<text x="56" y="480" font-size="10.5" fill="#5b666f">ΔV = I × Zout = 5A × 1mΩ = 5mV</text>
<rect x="408" y="416" width="352" height="70" rx="8" fill="#f6e7e1" stroke="#a8321f" stroke-width="1.6"/>
<text x="424" y="440" font-size="11.5" font-weight="bold" fill="#a8321f">劣质适配器：Zout ≈ 100mΩ</text>
<text x="424" y="462" font-size="11.5" fill="#5b666f">2A 时跌 200mV（4%）→ 负载一重电压就塌</text>
<text x="424" y="480" font-size="10.5" fill="#5b666f">ΔV = 2A × 100mΩ = 200mV</text>
<rect x="40" y="498" width="720" height="76" rx="8" fill="#f7eedb" stroke="#a4630f" stroke-width="1.6"/>
<text x="56" y="522" font-size="12" font-weight="bold" fill="#a4630f">对偶关系（记住这张表，两个概念就不会混）</text>
<text x="56" y="546" font-size="11" fill="#5b666f">电压源：短路是灾难 / 开路正常 / 负载<b>并联</b>接（各自取电流）　‖　电流源：开路是灾难 / 短路正常 / 负载<b>串联</b>接（同一电流穿过）</text>
<text x="56" y="566" font-size="11.5" font-weight="bold" fill="#3d6b4a">实际元件：温度传感器激励、LED 驱动要「恒流」；供电、基准要「恒压」——同一套元件，两种用法</text>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.03;0.2;0.25;1" dur="11s" repeatCount="indefinite"/><rect x="202.0" y="599.0" width="396.1" height="24.1" rx="12.0" fill="#1f5d7a" fill-opacity="0.09" stroke="#1f5d7a" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.25;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="612" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1f5d7a" opacity="0">① 横 I 纵 V：电压源是水平线，电流变化时端电压不动<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.25;1" dur="11s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="11s" repeatCount="indefinite"/><rect x="164.1" y="599.0" width="471.8" height="24.1" rx="12.0" fill="#6b3f63" fill-opacity="0.09" stroke="#6b3f63" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="612" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#6b3f63" opacity="0">② 横 I 纵 V：电流源是竖线，电压变化时电流不动——输出阻抗高<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="11s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 -4.0;0 6.0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="11s" repeatCount="indefinite"/><rect x="95.6" y="599.0" width="608.8" height="24.1" rx="12.0" fill="#a8321f" fill-opacity="0.09" stroke="#a8321f" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="612" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#a8321f" opacity="0">③ 内阻是唯一变量：1mΩ 是恒压源、100mΩ 就是「会塌的电源」——两个都能现场算<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="11s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/><rect x="119.4" y="599.0" width="561.2" height="24.1" rx="12.0" fill="#a4630f" fill-opacity="0.09" stroke="#a4630f" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="612" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#a4630f" opacity="0">④ 唯一真源是「恒压源」：恒流源都是拿恒压源 + 负反馈做出来的（见 13.5）<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/></text></g></svg>