  <circle class="doty" r="6"><animate attributeName="cx" values="108.0;146.0;184.0;225.5;263.5;301.5;343.0;381.0;419.0;457.0;495.0;536.5;574.5;612.5;654.0;692.0;730.0" keyTimes="0.0000;0.0625;0.1250;0.1875;0.2500;0.3125;0.3750;0.4375;0.5000;0.5625;0.6250;0.6875;0.7500;0.8125;0.8750;0.9375;1.0000" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="331.6;300.5;274.0;254.8;248.7;254.8;274.0;300.5;331.6;362.6;389.2;408.4;414.5;408.4;389.2;362.6;331.6" keyTimes="0.0000;0.0625;0.1250;0.1875;0.2500;0.3125;0.3750;0.4375;0.5000;0.5625;0.6250;0.6875;0.7500;0.8125;0.8750;0.9375;1.0000" dur="12s" repeatCount="indefinite"/></circle>
  <text class="small" x="24" y="528">55 °C、45 °C、0 °C、8 °C、0.8 s 都是示意。低温禁的是充电，放电策略另看规格书。不要用这条正弦当热模型。</text>
</svg>
