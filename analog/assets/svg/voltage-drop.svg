<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">电压降：同一股电流，谁 R 大谁分得多</text>

<text x="400" y="46" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#37424e">同一股电流流过所有电阻——每个电阻「留下」一份电压，加起来恰好等于电源</text>
<text x="190" y="86" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#37424e">电路：5V → 4kΩ → 1kΩ → GND</text>
<path d="M80 110 Q160.00 110.60 240 110" fill="none" stroke="#37424e" stroke-width="2.5"/>
<text x="62" y="104" font-size="12.5" font-weight="bold" fill="#a4630f">5V</text>
<circle cx="160" cy="110" r="3.5" fill="#37424e"/>
<path d="M160 110 Q160.01 117.00 160 124" fill="none" stroke="#37424e" stroke-width="2.5"/>
<rect x="148" y="124" width="24" height="56" fill="#f6eedb" stroke="#37424e" stroke-width="2.5"/>
<text x="182" y="146" font-size="12" font-weight="bold" fill="#a4630f">4kΩ</text>
<text x="182" y="164" font-size="11" font-weight="bold" fill="#a8321f">降 4V</text>
<path d="M160 180 Q159.94 189.00 160 198" fill="none" stroke="#37424e" stroke-width="2.5"/>
<circle cx="160" cy="202" r="3.5" fill="#37424e"/>
<text x="182" y="206" font-size="12" font-weight="bold" fill="#3d6b4a">1V（节点）</text>
<path d="M160 206 Q159.94 214.00 160 222" fill="none" stroke="#37424e" stroke-width="2.5"/>
<rect x="148" y="222" width="24" height="56" fill="#f6eedb" stroke="#37424e" stroke-width="2.5"/>
<text x="182" y="244" font-size="12" font-weight="bold" fill="#a4630f">1kΩ</text>
<text x="182" y="262" font-size="11" font-weight="bold" fill="#a8321f">降 1V</text>
<path d="M160 278 Q159.96 288.00 160 298" fill="none" stroke="#37424e" stroke-width="2.5"/>
<path d="M140 302 Q160.00 301.96 180 302" fill="none" stroke="#37424e" stroke-width="2.5"/>
<path d="M146 310 Q160.00 310.13 174 310" fill="none" stroke="#37424e" stroke-width="2.5"/>
<path d="M152 318 Q160.00 317.98 168 318" fill="none" stroke="#37424e" stroke-width="2.5"/>
<g filter="url(#pglow)"><circle r="5" fill="#a4630f"><animateMotion dur="10s" begin="-0.50s" repeatCount="indefinite" path="M160,112 L160,298" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle>
<circle r="5" fill="#a4630f"><animateMotion dur="10s" begin="2.00s" repeatCount="indefinite" path="M160,112 L160,298" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle>
<circle r="5" fill="#a4630f"><animateMotion dur="10s" begin="4.50s" repeatCount="indefinite" path="M160,112 L160,298" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle>
<circle r="5" fill="#a4630f"><animateMotion dur="10s" begin="7.00s" repeatCount="indefinite" path="M160,112 L160,298" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle></g>
<text x="128" y="202" text-anchor="end" font-size="11.5" font-weight="bold" fill="#1f5d7a">I = 1mA</text>
<text x="190" y="338" text-anchor="middle" font-size="11" fill="#5b666f">5V ÷ (4k+1k) = 1mA —— 同一股电流，处处相等</text>
<text x="600" y="86" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#37424e">沿回路走一圈，看电压怎么一级级掉下去</text>
<path d="M430 350 Q605.00 349.86 780 350" fill="none" stroke="#c9bb9d" stroke-width="1"/>
<path d="M430 310 Q605.00 308.95 780 310" fill="none" stroke="#c9bb9d" stroke-width="1" stroke-dasharray="4,3"/>
<path d="M430 150 Q605.00 151.46 780 150" fill="none" stroke="#c9bb9d" stroke-width="1" stroke-dasharray="4,3"/>
<text x="424" y="154.0" text-anchor="end" font-size="10.5" fill="#5b666f">5V</text>
<text x="424" y="314.0" text-anchor="end" font-size="10.5" fill="#5b666f">1V</text>
<text x="424" y="354.0" text-anchor="end" font-size="10.5" fill="#5b666f">0V</text>
<path d="M432,150.0 L510,150.0 L510,310.0 L590,310.0 L590,350.0 L770,350.0" fill="none" stroke="#1f5d7a" stroke-width="3"/>
<text x="514" y="230.0" font-size="11.5" font-weight="bold" fill="#a8321f">4kΩ 分到 4V</text>
<text x="594" y="330.0" font-size="11.5" font-weight="bold" fill="#a8321f">1kΩ 分到 1V</text>
<text x="600" y="404" text-anchor="middle" font-size="11" fill="#5b666f">每一段竖降 = 跨过一个电阻的电压降；横走 = 沿理想导线（不降压）</text>
<circle r="4.5" fill="#1f5d7a"><animateMotion dur="10s" repeatCount="indefinite" path="M432,150.0 L510,150.0 L510,310.0 L590,310.0 L590,350.0 L770,350.0"/></circle>
<circle r="4.5" fill="#1f5d7a" opacity="0.6"><animateMotion dur="10s" begin="-3.33s" repeatCount="indefinite" path="M432,150.0 L510,150.0 L510,310.0 L590,310.0 L590,350.0 L770,350.0"/></circle>
<circle r="4.5" fill="#1f5d7a" opacity="0.35"><animateMotion dur="10s" begin="-6.67s" repeatCount="indefinite" path="M432,150.0 L510,150.0 L510,310.0 L590,310.0 L590,350.0 L770,350.0"/></circle>
<circle cx="160" cy="202" r="5" fill="none" stroke="#3d6b4a" stroke-width="2">
<animate attributeName="r" values="5;12;5" dur="1.7s" repeatCount="indefinite"/></circle>
<circle cx="160" cy="110" r="5" fill="none" stroke="#a4630f" stroke-width="2">
<animate attributeName="r" values="5;12;5" dur="1.7s" begin="-0.85s" repeatCount="indefinite"/></circle>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.8;0.86;1" dur="10s" repeatCount="indefinite"/><rect x="137.6" y="440.3" width="524.8" height="21.6" rx="10.8" fill="#1f5d7a" fill-opacity="0.09" stroke="#1f5d7a" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.8;0.86;1" dur="10s" repeatCount="indefinite"/></rect><text x="400" y="452" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f5d7a" opacity="0">口诀：V = I×R —— 同一电流下电压按电阻成比例分配（4k:1k = 4:1 → 4V:1V）<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.8;0.86;1" dur="10s" repeatCount="indefinite"/></text></g></svg>