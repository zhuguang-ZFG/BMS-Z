<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 800 430" font-family="ui-monospace, Consolas, monospace" aria-label="分窗口 RMSE：平台区 3.08 mV、两端 14.32/19.87 mV（demo 输出）；同一笔标定回看 R0 30.20 对 30.00 mΩ、R1 19.82 对 20.00 mΩ、τ 360 对 300 s——参数个个拟对，输的是结构。数字为教学示意" data-snapshot-time="8">
  <title>分窗口 RMSE：参数拟对≠模型对（教学示意）</title>
  <desc>三扇窗亮出 RMSE：SOC&lt;0.20 处 14.32，0.20–0.80 处 3.08，&gt;0.80 处 19.87；窗口滑过电压曲线，标定回看参数几乎全对，输的是两端结构。</desc>

  <style>
    .bg { fill: #fffdf5; }
    .panel { fill: #f7f2e5; stroke: #cfc6b2; }
    .txt { fill: #293b3a; font-size: 13px; }
    .small { fill: #626d65; font-size: 12px; }
    .title { fill: #293b3a; font-size: 17px; font-weight: bold; }
    .head { fill: #293b3a; font-size: 14px; font-weight: bold; }
    .warn { fill: #b84745; }
    .ok { fill: #377b60; }
    .gold { fill: #926717; }
    .axis { stroke: #626d65; stroke-width: 1.5; fill: none; }
    .grid { stroke: #cfc6b2; stroke-width: 1; fill: none; }
    .curve { fill: none; stroke: #176b73; stroke-width: 2.6; }
    .win { fill: #926717; opacity: 0.20; }
    .winb { fill: none; stroke: #926717; stroke-width: 1.4; }
    .barlow { fill: #b84745; opacity: 0; }
    .barmid { fill: #377b60; opacity: 0; }
    .barhi { fill: #b84745; opacity: 0; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #192727; }
