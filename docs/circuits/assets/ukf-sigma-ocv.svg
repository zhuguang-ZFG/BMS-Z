<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="ui-monospace, Consolas, monospace">
  <title>无迹卡尔曼：三个示意 sigma 点穿过弯曲的 OCV，变换后的电压平均不等于平均点的电压。数字为示意。</title>
  <desc>亮点把三个 sigma 点沿竖线搬到弯曲的 OCV 上：直接代均值和按权重平均电压对不上，弯得越厉害差得越多。</desc>

  <style>
    .bg { fill: #fffdf5; }
    .panel { fill: #f7f2e5; stroke: #cfc6b2; }
    .axis { stroke: #626d65; stroke-width: 1.5; fill: none; }
    .grid { stroke: #cfc6b2; stroke-width: 1; fill: none; }
    .txt { fill: #293b3a; font-size: 13px; }
    .small { fill: #626d65; font-size: 12px; }
    .title { fill: #293b3a; font-size: 16px; font-weight: bold; }
    .hi { fill: #176b73; }
    .warn { fill: #b84745; }
    .ok { fill: #377b60; }
    .gold { fill: #926717; }
    .lineb { stroke: #176b73; stroke-width: 2.5; fill: none; }
    .liner { stroke: #b84745; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #377b60; stroke-width: 2.5; fill: none; }
    .liney { stroke: #926717; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .dotb { fill: #176b73; }
    .dotr { fill: #b84745; }
    .dotg { fill: #377b60; }
    .doty { fill: #926717; }
    .boxb { fill: #e4f0df; stroke: #176b73; }
    .boxr { fill: #f6e2df; stroke: #b84745; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #192727; }
      .panel { fill: #223333; stroke: #496160; }
      .axis { stroke: #b0beb3; }
      .grid { stroke: #496160; }
      .txt { fill: #edf0e5; }
      .small { fill: #b0beb3; }
      .title { fill: #edf0e5; }
      .hi { fill: #7ec5c5; }
      .warn { fill: #f39b91; }
      .ok { fill: #8fc7a2; }
      .gold { fill: #dfbd78; }
      .lineb { stroke: #7ec5c5; }
      .liner { stroke: #f39b91; }
      .lineg { stroke: #8fc7a2; }
      .liney { stroke: #dfbd78; }
      .dotb { fill: #7ec5c5; }
      .dotr { fill: #f39b91; }
      .dotg { fill: #8fc7a2; }
      .doty { fill: #dfbd78; }
      .boxb { fill: #293f35; stroke: #7ec5c5; }
      .boxr { fill: #483336; stroke: #f39b91; }
    }
  </style>

  <!-- formula: Vbar=sum wi*OCV(xi); xi around 0.15 with weights 1/6,2/3,1/6 -->
  <rect class="bg" width="800" height="500"/>
  <text class="title" x="24" y="32">先散开，再穿过那条弯的（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="122" rx="6"/>
  <text class="txt" x="40" y="68" opacity="0.28">① 荷电 0.07、0.15、0.23<tspan class="small">　权重 1/6、2/3、1/6。点还在横轴上。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="94" opacity="0.28">② 沿竖线走到 OCV<tspan class="small">　膝部是弯的，三颗点的电压间距并不均匀。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="120" opacity="0.28">③ 直接代进均值<tspan class="small">　V(0.15) = 3.257 V。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="146" opacity="0.28">④ 三个电压按权重平均<tspan class="small">　得到 3.227 V，差 -30.6 mV。线性化会漏掉这一截。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="182" width="752" height="250" rx="6"/>
  <text class="small" x="40" y="204">OCV V</text>
  <line class="axis" x1="92.0" y1="214.0" x2="92.0" y2="400.0"/>
  <line class="axis" x1="92.0" y1="400.0" x2="720.0" y2="400.0"/>
  <text class="small" x="712.0" y="418" text-anchor="end">SOC</text>
  <line class="grid" x1="92.0" y1="400.0" x2="92.0" y2="406.0"/>
  <text class="small" x="92.0" y="432" text-anchor="middle">0</text>
  <line class="grid" x1="186.2" y1="400.0" x2="186.2" y2="406.0"/>
  <text class="small" x="186.2" y="432" text-anchor="middle">0.15</text>
  <line class="grid" x1="406.0" y1="400.0" x2="406.0" y2="406.0"/>
  <text class="small" x="406.0" y="432" text-anchor="middle">0.5</text>
  <line class="grid" x1="720.0" y1="400.0" x2="720.0" y2="406.0"/>
  <text class="small" x="720.0" y="432" text-anchor="middle">1</text>
  <line class="grid" x1="86.0" y1="385.7" x2="92.0" y2="385.7"/>
  <text class="small" x="82.0" y="389.7" text-anchor="end">2.8</text>
  <line class="grid" x1="86.0" y1="328.5" x2="92.0" y2="328.5"/>
  <text class="small" x="82.0" y="332.5" text-anchor="end">3.2</text>
  <line class="grid" x1="86.0" y1="271.2" x2="92.0" y2="271.2"/>
  <text class="small" x="82.0" y="275.2" text-anchor="end">3.6</text>
  <polyline class="lineb" points="92.0,379.7 98.3,377.8 104.6,375.3 110.8,372.3 117.1,368.7 123.4,364.4 129.7,359.7 136.0,354.4 142.2,349.0 148.5,343.6 154.8,338.4 161.1,333.6 167.4,329.3 173.6,325.7 179.9,322.7 186.2,320.2 192.5,318.3 198.8,316.7 205.0,315.5 211.3,314.5 217.6,313.8 223.9,313.2 230.2,312.7 236.4,312.3 242.7,312.0 249.0,311.7 255.3,311.5 261.6,311.3 267.8,311.1 274.1,311.0 280.4,310.8 286.7,310.7 293.0,310.5 299.2,310.4 305.5,310.3 311.8,310.2 318.1,310.0 324.4,309.9 330.6,309.8 336.9,309.7 343.2,309.6 349.5,309.5 355.8,309.3 362.0,309.2 368.3,309.1 374.6,309.0 380.9,308.9 387.2,308.8 393.4,308.7 399.7,308.5 406.0,308.4 412.3,308.3 418.6,308.2 424.8,308.1 431.1,308.0 437.4,307.9 443.7,307.7 450.0,307.6 456.2,307.5 462.5,307.4 468.8,307.3 475.1,307.2 481.4,307.0 487.6,306.9 493.9,306.8 500.2,306.7 506.5,306.5 512.8,306.4 519.0,306.2 525.3,306.1 531.6,305.9 537.9,305.8 544.2,305.6 550.4,305.4 556.7,305.1 563.0,304.9 569.3,304.5 575.6,304.2 581.8,303.7 588.1,303.2 594.4,302.6 600.7,301.8 607.0,300.9 613.2,299.8 619.5,298.4 625.8,296.7 632.1,294.8 638.4,292.5 644.6,289.7 650.9,286.7 657.2,283.2 663.5,279.4 669.8,275.4 676.0,271.3 682.3,267.2 688.6,263.2 694.9,259.4 701.2,256.0 707.4,252.9 713.7,250.2 720.0,247.9" stroke-linejoin="round" stroke-linecap="round"/>
  <line class="liney" x1="186.2" y1="400.0" x2="186.2" y2="320.2"/>
  <text class="gold" x="194.2" y="322.4">均值之差 -30.6 mV</text>
  <circle class="dotb" r="6"><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="cx" values="136.0;136.0;136.0;136.0" keyTimes="0;0.2500;0.5000;1" dur="12s" repeatCount="indefinite"/><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="cy" values="400.0;400.0;354.4;354.4" keyTimes="0;0.2500;0.5000;1" dur="12s" repeatCount="indefinite"/></circle>
  <circle class="doty" r="6"><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="cx" values="186.2;186.2;186.2;186.2" keyTimes="0;0.2500;0.5000;1" dur="12s" repeatCount="indefinite"/><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="cy" values="400.0;400.0;320.2;320.2" keyTimes="0;0.2500;0.5000;1" dur="12s" repeatCount="indefinite"/></circle>
  <circle class="dotr" r="6"><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="cx" values="236.4;236.4;236.4;236.4" keyTimes="0;0.2500;0.5000;1" dur="12s" repeatCount="indefinite"/><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="cy" values="400.0;400.0;312.3;312.3" keyTimes="0;0.2500;0.5000;1" dur="12s" repeatCount="indefinite"/></circle>
  <text class="small" x="24" y="478">OCV 用的是本页铁锂示意式，不是电芯规格。权重对应 n=1、λ=2 的一组无迹权重，用来看弯的那一下。</text>
</svg>
