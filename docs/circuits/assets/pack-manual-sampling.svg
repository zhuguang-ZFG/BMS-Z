  <line class="grid" x1="720.0" y1="400.0" x2="720.0" y2="406.0"/>
  <text class="small" x="720.0" y="422.0" text-anchor="middle">1</text>
  <line class="grid" x1="102.0" y1="381.0" x2="108.0" y2="381.0"/>
  <text class="small" x="98.0" y="385.0" text-anchor="end">3.0</text>
  <line class="grid" x1="102.0" y1="267.0" x2="108.0" y2="267.0"/>
  <text class="small" x="98.0" y="271.0" text-anchor="end">4.2</text>
  <text class="small" x="720" y="444" text-anchor="end">示意进程</text>
  <polyline class="lineb" points="108.0,381.0 123.3,378.1 138.6,375.3 153.9,372.5 169.2,369.6 184.5,366.8 199.8,363.9 215.1,361.1 230.4,358.2 245.7,355.4 261.0,352.5 276.3,349.6 291.6,346.8 306.9,343.9 322.2,341.1 337.5,338.2 352.8,335.4 368.1,332.6 383.4,329.7 398.7,326.8 414.0,324.0 429.3,321.2 444.6,318.3 459.9,315.5 475.2,312.6 490.5,309.8 505.8,306.9 521.1,304.1 536.4,301.2 551.7,298.4 567.0,295.5 582.3,292.7 597.6,289.8 612.9,286.9 628.2,284.1 643.5,281.3 658.8,278.4 674.1,275.6 689.4,272.7 704.7,269.9 720.0,267.0" stroke-linejoin="round" stroke-linecap="round"/>
  <line class="liner" x1="108" y1="262.3" x2="720" y2="262.3" stroke-dasharray="6 4"/>
  <circle class="doty" r="6" cx="108.0" cy="381.0"><animate data-ease="linear" attributeName="cx" values="108.0;352.8;536.4;720.0;720.0" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite"/><animate data-ease="linear" attributeName="cy" values="381.0;335.4;301.2;267.0;267.0" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite"/></circle>
  <circle class="dotr" r="4" cx="108.0" cy="381.0"><animate data-ease="linear" attributeName="cx" values="108.0;352.8;536.4;720.0;720.0" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite" begin="-6s"/><animate data-ease="linear" attributeName="cy" values="381.0;335.4;301.2;267.0;267.0" keyTimes="0;0.2500;0.5000;0.7500;1" dur="12s" repeatCount="indefinite" begin="-6s"/></circle>
  <rect class="panel" x="24" y="460" width="752" height="68" rx="6"/>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="1">示意电压 3.00 V · 这本手册的阈值格 空（示意）<animate attributeName="opacity" values="1;0;0;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0">示意电压 3.48 V · 这本手册的阈值格 空（示意）<animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0">示意电压 3.84 V · 这本手册的阈值格 空（示意）<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="40.0" y="500.0" text-anchor="start" opacity="0">示意电压 4.20 V · 这本手册的阈值格 空（示意）<animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.2500;0.5000;0.7500;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="small" x="24" y="560">不编寄存器地址，也不编保护阈值。包级手册该缺的还缺。</text>

</svg>
