<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">推挽、开漏加上拉、三态：三种输出级能力对照表</title>
<desc id="figDesc">三栏并排。左栏推挽（墨色）：小电路为上管 P 下管 N 图腾柱，主场是点对点独享线与 GPIO 默认；拉高靠上管硬顶、输出阻抗 20~50Ω，拉低靠下管强灌；上升沿 1~2ns 级但需串 22~33Ω 阻尼；多点并联禁止——一推一拉 5V÷(25+25)Ω=100mA 白烧；典型故障是两推挽直连烧 IO 与换班直通。中栏开漏加上拉（青色）：小电路为上拉电阻 Rp 加单下管 N，主场是 I2C、共享中断、电平转换；拉高只能靠 Rp 对总线电容慢充，拉低靠下管灌流（I2C 标准模式 3mA）；上升沿 tr≈0.847·Rp·Cb（4.7kΩ×100pF→400ns），下降沿几十 ns，波形缓升陡降；多点并联天然线与，是 I2C 仲裁与时钟延展的地基；典型故障是忘焊上拉总线全高、Rp 太大爬坡、被拉低时上拉持续耗电。右栏三态（琥珀色）：小电路为图腾柱外套使能开关，主场是并行总线与 74LVC245；使能时同推挽，关闭即高阻（漏流 ±10µA×N 叠加）；空档无人驱动时 20pF×10kΩ→0.2µs 电平就开漂；多点并联有条件——同一时刻只许一个说话，先关后开、交接 tDIS 10~30ns；典型故障是使能重叠 10ns 的微型对撞与上电随机使能。底部结论条：选型口诀「独占线求快选推挽；共享线求不冲突选开漏；分时复用大总线选三态＋时序」，并给出开漏上拉窗口算例 967Ω~3.5kΩ 取 2.2kΩ。</desc>
<rect width="960" height="640" fill="#fffdf8"/>

<text x="36" y="46" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="27" font-weight="700" fill="#14213d">三种输出级一张桌：谁推高、谁拉低、谁闭嘴</text>
<text x="36" y="74" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="15" fill="#52606d">推挽强且快但不许共享；开漏用速度换零冲突；三态把冲突风险交给时序管理。</text>
<line x1="36" y1="92" x2="924" y2="92" stroke="#14213d" stroke-width="2"/>

