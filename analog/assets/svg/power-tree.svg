<path d="M360 322 Q395.00 321.81 430 322" fill="none" stroke="#8b8272" stroke-width="2.5"/>
<rect x="430" y="296" width="104" height="52" rx="10" fill="#f6eedb" stroke="#3d6b4a" stroke-width="2"/>
<text x="482" y="318" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3d6b4a">LDO 1.8V</text>
<text x="482" y="336" text-anchor="middle" font-size="9.5" fill="#5b666f">核心电压</text>
<path d="M534 322 Q592.00 322.39 650 322" fill="none" stroke="#8b8272" stroke-width="2.5"/>
<rect x="650" y="296" width="118" height="52" rx="10" fill="#f6eedb" stroke="#3d6b4a" stroke-width="2"/>
<text x="709" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#3d6b4a">FPGA 核</text>
<text x="709" y="338" text-anchor="middle" font-size="9.5" fill="#5b666f">+100nF 就近去耦</text>
<g filter="url(#pglow)"><circle r="4.5" fill="#e4f1f3"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M534,322 H650" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle>
<circle r="4.5" fill="#e4f1f3"><animateMotion dur="12s" begin="3.50s" repeatCount="indefinite" path="M534,322 H650" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle>
<circle r="4.5" fill="#e4f1f3"><animateMotion dur="12s" begin="7.50s" repeatCount="indefinite" path="M534,322 H650" keyPoints="0;0.3;0.7;1" keyTimes="0;0.35;0.65;1" calcMode="linear"/></circle></g>

<text x="400" y="384" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f7f96">逐级净化：大电解挡低频脉动 → 稳压器压掉纹波 → 100nF 兜住芯片开关瞬间的高频</text>
<text x="400" y="406" text-anchor="middle" font-size="10.5" fill="#5b666f">压差小/电流小/噪声敏感 → LDO；压差大/电流大 → DCDC（效率优先）+ 后级 LDO 净化</text>
