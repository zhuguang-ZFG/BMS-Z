<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>STM32 ADC 注入组同步采样时序：定时器硬件触发，电流电压背靠背转换，DMA 搬运；对比软件轮询的采样时差</title>
  <desc>注入组在同一次触发里先采电流再采电压，间隔小于 1 微秒（示意）。软件轮询要几十微秒。这段里示意电流 I=10+0.5·t，40 微秒从 10 A 到 30 A。不是某一块板的采样记录。</desc>
  <style>
    .bg { fill: #fffdf5; }
    .panel { fill: #f7f2e5; stroke: #cfc6b2; }
    .axis { stroke: #626d65; stroke-width: 1.5; fill: none; }
    .txt { fill: #293b3a; font-size: 13px; }
    .small { fill: #626d65; font-size: 12px; }
    .title { fill: #293b3a; font-size: 16px; font-weight: bold; }
    .hi { fill: #176b73; }
    .ok { fill: #377b60; }
    .warn { fill: #b84745; }
    .trig { stroke: #b84745; stroke-width: 2; }
    .conv-i { fill: #176b73; }
    .conv-v { fill: #377b60; }
    .sw { fill: #f7f2e5; stroke: #968d77; }
    .lineb { stroke: #176b73; stroke-width: 2.5; fill: none; }
    .doty { fill: #926717; }
    .badge { fill: #176b73; }
    .badget { fill: #fffdf5; font-size: 12px; font-weight: bold; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #192727; }
      .panel { fill: #223333; stroke: #496160; }
      .axis { stroke: #b0beb3; }
      .txt { fill: #edf0e5; }
      .small { fill: #b0beb3; }
      .title { fill: #edf0e5; }
      .hi { fill: #7ec5c5; }
      .ok { fill: #8fc7a2; }
      .warn { fill: #f39b91; }
      .trig { stroke: #f39b91; }
      .conv-i { fill: #7ec5c5; }
      .conv-v { fill: #8fc7a2; }
      .sw { fill: #223333; stroke: #71908c; }
      .lineb { stroke: #7ec5c5; }
      .doty { fill: #dfbd78; }
      .badge { fill: #7ec5c5; }
      .badget { fill: #192727; }
    }
  </style>
  <rect class="bg" width="800" height="560"/>
  <text class="title" x="24" y="32">注入组把电流和电压挨在同一拍（示意）</text>
  <rect class="panel" x="24" y="44" width="752" height="104" rx="6"/>
  <text class="txt" x="40" y="68" opacity="0.28">① 定时器沿<tspan class="small">　TRGO 触发，和 PWM 同一拍。不靠软件去点开始。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="8s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="90" opacity="0.28">② 背靠背<tspan class="small">　先 I 后 V，间隔小于 1 µs。当成同一个物理时刻。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="8s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="112" opacity="0.28">③ DMA<tspan class="small">　成对搬走，CPU 不用站在旁边等转换结束。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="8s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="134" opacity="0.28">④ 轮询<tspan class="small">　先读 I，几十 µs 后再读 V。脉冲负载里电流已经变了。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="8s" repeatCount="indefinite"/></text>

  <rect class="panel" x="24" y="160" width="752" height="52" rx="6"/>
  <text class="small" x="40" y="180">定时器触发沿</text>
  <line class="trig" x1="180" y1="200" x2="180" y2="176">
    <animate calcMode="spline" keySplines="0.7 0 0.84 0;0.16 1 0.3 1" attributeName="opacity" values="1;0.25;1" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite"/>
  </line>
  <text class="small" x="192" y="196">触发</text>
  <line class="trig" x1="520" y1="200" x2="520" y2="176" opacity="0.35"/>
  <text class="small" x="532" y="196">下一拍</text>

  <rect class="panel" x="24" y="220" width="752" height="56" rx="6"/>
  <text class="small" x="40" y="240">注入组</text>
  <rect class="conv-i" x="168" y="228" width="28" height="22" rx="3"/>
  <text class="badget" x="176" y="244">I</text>
  <rect class="conv-v" x="200" y="228" width="28" height="22" rx="3"/>
  <text class="badget" x="208" y="244">V</text>
  <text class="small" x="244" y="246">间隔 &lt; 1 µs</text>
  <rect class="conv-i" x="508" y="228" width="28" height="22" rx="3" opacity="0.35"/>
  <rect class="conv-v" x="540" y="228" width="28" height="22" rx="3" opacity="0.35"/>

  <rect class="panel" x="24" y="284" width="752" height="44" rx="6"/>
  <text class="small" x="40" y="310">软件轮询：两格之间空着几十微秒</text>
  <rect class="sw" x="300" y="294" width="28" height="22" rx="3"/>
  <text class="txt" x="308" y="310">I</text>
  <rect class="sw" x="460" y="294" width="28" height="22" rx="3"/>
  <text class="txt" x="468" y="310">V</text>
  <line class="trig" x1="332" y1="305" x2="456" y2="305" stroke-dasharray="5 4"/>

  <rect class="panel" x="24" y="340" width="752" height="168" rx="6"/>
  <text class="small" x="40" y="360">轮询这 40 µs 里的电流（示意）　I = 10 + 0.5·t</text>
  <line class="axis" x1="88" y1="376" x2="88" y2="470"/>
  <line class="axis" x1="88" y1="470" x2="640" y2="470"/>
  <text class="small" x="78" y="380" text-anchor="end">30 A</text>
  <text class="small" x="78" y="428" text-anchor="end">20 A</text>
  <text class="small" x="78" y="474" text-anchor="end">10 A</text>
  <text class="small" x="88" y="492" text-anchor="middle">0</text>
  <text class="small" x="364" y="492" text-anchor="middle">20 µs</text>
  <text class="small" x="640" y="492" text-anchor="middle">40 µs</text>
  <polyline class="lineb" points="88.0,470.0 115.8,465.3 143.6,460.6 171.4,455.9 199.2,451.2 227.0,446.5 254.8,441.8 282.6,437.1 310.4,432.4 338.2,427.6 366.0,422.9 393.8,418.2 421.6,413.5 449.4,408.8 477.2,404.1 505.0,399.4 532.8,394.7 560.6,390.0 588.4,385.3 616.2,380.6 644.0,375.9"/>
  <circle class="doty" r="6" cx="88" cy="470">
    <animate calcMode="spline" keySplines="0.16 1 0.3 1;0.16 1 0.3 1;0.16 1 0.3 1;0.16 1 0.3 1" attributeName="cx" values="88.0;227.0;366.0;505.0;644.0" keyTimes="0;0.25;0.5;0.75;1" dur="8s" repeatCount="indefinite"/>
    <animate calcMode="spline" keySplines="0.7 0 0.84 0;0.7 0 0.84 0;0.7 0 0.84 0;0.7 0 0.84 0" attributeName="cy" values="470.0;446.5;422.9;399.4;375.9" keyTimes="0;0.25;0.5;0.75;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <text class="small" x="24" y="536">ΔI = 20 A。按 2 mΩ 再掉 40 mV。注入组几乎同时取 I 和 V，轮询把两头乘在一起。示意，不是示波器。</text>
</svg>
