changes:
- id: ch14-pt100-zero-v2
  source: docs/p3-01-ch14.md#14.4
  before: '**第二环：放大**。38.5µV 坐在导线拾取的 50Hz 工频共模干扰（可达伏级！）上。这一环用 [12.3](p2-02-ch12.md#ch12) 仪表放大器：增益设 40（$R_G$ 一只可调），CMRR>100dB
    把共模压到十万分之一。输出灵敏度 $385\mu V/°C\times40=15.4mV/°C$（0.1°C 步进=1.54mV），100°C 满量程落在 1.54V = 满量程的 75%。

    **增益要按满量程倒推**：×100 会让 100°C 时的输出冲到 3.85V，超出 ADC 输入范围；放大到接近满量程、又留少量余量，才算合适。


    **第三环：滤波**。ADC 采样率定 100sps → 奈奎斯特红线 50Hz（[13.6](p2-03-ch13.md#ch13)）。这一环用 [12.5](p2-02-ch12.md#ch12) Sallen-Key
    二阶低通，fc=10Hz：二阶在 50Hz 处衰减 $20\log_{10}\sqrt{1+(50/10)^4}\approx$ **−28dB**，混叠风险小；工频残余交给软件平均（100sps 对 20ms 整周期平均，50Hz
    天然归零）。


    **第四环：转换**。信号范围 0~1.54V（0~100°C）。转换用 12 位 ADC、V_FS=2.048V：台阶 $2.048V/4096=500\mu V$，

    经仪放增益 40 折算回传感器端是 **12.5µV ≈ 0.032°C/码**，比 0.1°C 的目标分辨率细 3 倍。

    算这笔账时，关键是把 ADC 的台阶一路除回传感器端，折成温度。本例的 0.032°C/码比 0.1°C 的目标细三倍，所以 ADC 分辨率不是这条链的瓶颈。

    （想要更高分辨率就上 16 位 Σ-Δ：ADS1115，[6.2](p6-00-part6.md#part6)；采样保持由 ADC 内置。）'
  after: '**第二环：先扣零点，再放大增量。** 1mA 激励下，100Ω 的零点已有 100mV；直接乘40会得到4–5.54V，并非0–1.54V。须用差分基准或桥式接法扣除这100mV，再以40倍放大38.5mV变化量。理想增量范围为0–1.54V，灵敏度15.4mV/°C；实际加基线偏置，核对仪放输入共模、输出摆幅和ADC端点余量。CMRR须在实际增益与50Hz处核对，不能只看DC标称。


    **第三环：滤波与采样共同设计。** 100sps 对应奈奎斯特频率50Hz。二阶 Butterworth 低通取fc=10Hz时，50Hz增益为 $-10\log_{10}[1+(50/10)^4]\approx-28dB$；是否足够仍取决于带外干扰预算。100sps下两点平均仅对严格50Hz有零点，工频偏移会留下残差。


    **第四环：分辨力不等于准确度。** 12位、2.048V ADC 的1 LSB为2.048V/4096=500µV；除以40得12.5µV，按385µV/°C折算为0.03247°C/码。扣零点后的38.5mV增量若乘100，仍会达3.85V而超量程。16位Σ-Δ（如[ADS1115](p6-00-part6.md#part6)；见6.2）的量程、有效位数和滤波延迟须按配置核对。'
  caption: 两行使用相同0–6V电压轴；只有扣除零点的增量才落入目标量程，真实器件还需共模和摆幅余量。
  relationship: replaces-text
  removed_prose_chars: 212
- id: ch14-meas-window-v2
  source: docs/p3-01-ch14.md#14.6
  before: '**五个最常见的坑**：


    1. **理想 vs 真实**：默认电源是理想电压源、导线零阻抗、电容无 ESR。真实世界这三样全都有。**关键仿真必须手动加上**：给电源串 0.1Ω、给电容串 ESR、给运放串输出电阻。

    2. **运放模型选错**：理想运放（opamp）没有带宽限制与压摆率 → 仿真永远"完美"，实测一塌糊涂。**必须用厂商真实模型**（如 LT1012、OPA192），才能看到压摆率、GBW、输出限幅的真实效应

    3. **收敛失败（"Time step too small"）**：常见于开关电路、强非线性、理想器件。对策：加小串联电阻（1mΩ~1Ω）、给电容并大电阻（1Meg）、设 `.options gmin=1e-10
    abstol=1e-9`、或加初始条件 `.ic`

    4. **时间步长不对**：`.tran 10m` 默认自适应步长可能太粗，看不出开关尖峰 → 加 `maxstep`（`.tran 0 10m 0 100n`）或 `.options plotwinsize=0`
    关掉波形压缩

    5. **忘了"仿真≠实测"**：仿真验证的是**拓扑与数量级**，不是精确值。寄生参数、器件离散性、PCB 布局不在模型里。仿真过了不代表能工作，但**仿真不过一定不能工作**。


    **一个 `.meas` 例子**（自动测过冲，配合 `.step` 批量对比补偿电容）：


    ```

    .tran 0 5m 4m 100n

    .meas tran overshoot MAX V(out) FROM 4m TO 5m

    .meas tran vfinal AVG V(out) FROM 4.9m TO 5m

    .step param Cf 1p 10p 1p

    ```


    → 跑完直接列出 10 组 `Cf` 各自的过冲百分比。哪个值裕度最足，一目了然。跑完之后，补偿电容的选择依据是数据，而不是手感。


    > **精髓**：LTspice 的价值不在"画得漂亮"，而在**把"我猜"变成"我知道"**：`.op` 定偏置、`.tran` 验时域、`.ac` 量裕度、`.step` 扫极限、`.meas` 出数据。记住一条铁律——**先工作点，后动态；先理想，后真实；仿真过
    ≠ 能工作，仿真不过 = 一定不能工作。**'
  after: '**仿真先核模型和观测窗口。** 电源、地、工作点与器件引脚映射出错，会得到形式正确的曲线；理想运放不包含真实摆幅、限流和稳定性边界。小时间步不自动等于可信结果，须检查收敛、初始条件与参数角点。


    示例假设阶跃发生于4ms之前，最终稳态已在4.9–5ms建立：


    ```spice

    .tran 0 5m 0 1u

    .meas tran vmax MAX V(out) FROM 4m TO 5m

    .meas tran vfinal AVG V(out) FROM 4.9m TO 5m

    .meas tran overshoot PARAM vmax-vfinal

    ```


    窗口和最大步长须按实际边沿修改。若测百分比过冲，还需明确初值与阶跃幅值。`.ac`只对工作点线性化；启动、饱和与限流用`.tran`验证。仿真失败也可能是模型或数值问题，应定位后再判电路。'
  caption: 峰值、稳态和建立时间各有观测条件；指定时间窗才能让 .step 的比较可复现。
  relationship: replaces-text
  removed_prose_chars: 531
- id: ch14-buck-budget-v2
  source: docs/p3-01-ch14.md#14.8
  before: '$1\sigma$ 按"规格 = $3\sigma$"折算；RSS 列 = $\sqrt{0.24^2+0.33^2+0.07^2+0.17^2}$。**RSS 的 $3\sigma$ 大约只有 WC
    的一半**，这就是那条"最坏情况比实际悲观一倍"的经验法则的算术来源。


    **算一笔（良率）**：设输出电压规格是 ±2%。$3\sigma=1.35\%<2\%$ → 良率 > **99.7%**，很稳。但若规格收紧到 ±1%：需要 $1\%/0.45\%=2.24\sigma$ → 良率
    $=2\Phi(2.24)-1\approx\mathbf{97.5\%}$ → **每 1000 块有 25 块超规**。想做到 99.7%，就必须把某项贡献压下来：换 0.1% 电阻，或者用更准的基准。


    所谓设计裕量，从此有了具体算法：把规格放在 $3\sigma$ 之外，而不是随手留 20%。选 WC 还是 RSS 看场合：**车规 / 医疗用 WC，消费类用 RSS + $3\sigma$ 良率估计**。'
  after: '**本表是分布假设示例。** 当R1=R2时，一阶灵敏度为 $\delta V=\delta V_{ref}+(\delta R_1-\delta R_2)/2$。假定每项独立、零均值，且表中限值代表3σ，两只电阻合成贡献为
    $\sqrt2\times(1\%/3)/2\approx0.2357\%$；合成σ约0.4460%，3σ约1.3379%。这是假设，不是datasheet极限可自动除以3的规则。


    一阶WC约2.7%；真实电阻比非线性及相关项另算。只有在正态近似成立、均值居中且模型覆盖全部误差时，才能用 $2\Phi(a/\sigma)-1$ 估良率：±1%窗口约97.5%，±2%窗口高于99.7%。每1000块约25块超规只是该模型的期望，不是批次保证。选择WC、统计良率或两者结合，由风险与适用标准决定，不能按“消费/车规”一刀切。'
  caption: 柱宽按1σ贡献成比例；WC、分布、偏置和相关性必须分别记录，预算结果才有含义。
  relationship: replaces-text
  removed_prose_chars: 44
- id: ch14-ratio-cancel-v2
  source: docs/p3-01-ch14.md#14.9
  before: '注意"激励"和"基准"两行。如果激励电流和 ADC 基准来自**同一只基准**，电流的绝对误差会同时改变传感器输出。ADC 的刻度也跟着变，比值不变。**比率测量（ratiometric）**把这两项的大部分误差直接约掉。这是
    PT100/电桥采集最便宜的一次精度升级：不用买更贵的器件，只要把接法改对。预算表里剩下的 0.04°C，是匹配残差和走线不对称留下的。


    > **为什么**：基准漂了，读数却几乎不动，因为激励电流和 ADC 刻度同出一源。好比量水深的尺子拴在浮子上：水面涨，尺子也涨，读到的深度不变。「比率测量」约掉的正是这种两头同向的漂移。失调和自热不随水面浮，所以预算里仍要给失配留残项。


    [在线演示：惠斯通电桥](https://www.falstad.com/circuit/e-wheatstone.html)：拨动桥臂电阻让检流计归零，再失衡一只臂，看输出电压如何跟着电阻比例走——刻度跟激励同源，漂也一起漂。'
  after: '**比率测量先合并共同项。** 理想 $I=V_{ref}/R_{set}$、$V_{PT}=I R_{PT}$，ADC归一化码为 $V_{PT}/V_{ref}=R_{PT}/R_{set}$。共同参考的初始误差和温漂因子均可约掉；设定电阻、引线、自热、失调、带宽差及参考缓冲残差仍需预算。


    同一参考误差不能既作为激励误差又作为独立基准误差重复RSS。下表两项0.04°C分别是假设独立的激励链残差与参考路径残差，必须用实测证明这种分解。[电桥演示](https://www.falstad.com/circuit/e-wheatstone.html)可观察比值关系，但不能代替整机误差验证。'
  caption: 共同因子在代数式中抵消；独立残差另列，不能将相同温漂重复算入两行。
  relationship: replaces-text
  removed_prose_chars: 115
- id: ch14-error-budget-v2
  source: docs/p3-01-ch14.md#14.9
  before: '读预算表则要按**方差份额**排序，而不是按单项大小凭直觉。某项占方差 40%，把它减半，总 RSS 只降到 $\sqrt{0.6+0.4\times0.25}=\sqrt{0.7}\approx0.84$，改善约
    16%；某项只占 1%，就算归零，总 RSS 也几乎不动。**先砍方差份额最大的那一项，砍到各项大致均衡为止**。这就是预算图那三根长条存在的意义。




    **看图**：左边按 1σ 从大到小排，先压最长的三条，收益最大；右边把 RSS 与 WC 放在同一根 0.1°C 预算尺上：RSS 留 18% 余量，WC 直接顶穿。**预算图用来告诉你下一步改哪里；算完存档没有意义。**'
  after: '**改进按方差份额排序。** 在独立小信号模型下，某项占方差40%，把它减半，总标准差变为原来的 $\sqrt{0.6+0.4\times0.25}=\sqrt{0.7}\approx0.84$，改善约16%；占1%的项即使归零，整体改善也很小。先确认误差的灵敏度、统计单位与相关性，再按图中的贡献排序。'
  caption: 同一组演示数字的两种解释必须分开；柱长给出单项大小，不能用RSS小于规格代替覆盖率验收。
  relationship: replaces-text
  removed_prose_chars: 124
- id: ch14-uniform-sum-v2
  source: docs/p3-01-ch14.md#14.10
  before: '**相关项不能直接 RSS。** 同一只基准同时给激励和 ADC 供电，同一批电阻的温漂同向，同一颗 LDO 的负载调整率影响两级。这些误差"同涨同落"，必须先合并成一个等效项，再参与平方和。把相关的两项当独立项
    RSS，会把总误差算小；这是预算表最常见的"看起来很美"。


    > **为什么**：各项独立随机偏时，同时顶到同一方向极限的机会很小，所以 RSS 比 WC 乐观得多。但同一只基准喂的两项，像一条泉眼灌的两只水缸：一旱一起旱。「相关项先合并再平方和」管的就是先认出共用源水的缸。缸各有各的泉眼，才谈得上互不相干。


    **Monte Carlo 做的事，是把公差分布跑很多次**：


    1. 给每个元件指定分布：均匀、正态或实测数据。相关项用协方差或共同随机源；

    2. 用同一组随机数跑 N 次（N=10,000 起，3σ 良率建议 100,000）；

    3. 统计输出的均值、σ、0.1%/99.9% 分位数，判断规格外比例；

    4. 换随机种子重跑，确认均值/σ 变化小于 1%。**否则样本还不够**。


    它的价值在**非线性**：WC 只会取端点，RSS 假设线性叠加；如果输出是增益的倒数、或者运放会饱和，端点不一定最坏，Monte Carlo 才能看见中间的反常。**但模型错了，Monte Carlo 只会更快地给你一个错答案。**


    **"规格 = 3σ"还是"规格 = WC"？** 消费类用 3σ：允许千分之三的超规，用良率换成本；车规/医疗用 WC：不允许"倒霉的少数"流到路上。两者比的是**风险定价**，不分数学对错。本章的 PT100 案例两种都算：RSS
    0.082°C 给设计信心，WC 0.175°C 提醒你"别把 0.1°C 当绝对精度卖"。'
  after: '**相关项保留符号与协方差。** 一般形式 $\sigma_y^2=\sum_i c_i^2\sigma_i^2+2\sum_{i<j}c_i c_j\operatorname{Cov}(x_i,x_j)$。共同参考既可能增强也可能抵消，取决于灵敏度方向，不能断言忽略相关性总会低估。


    **Monte Carlo步骤**：指定边缘分布和共同随机源；记录种子及模型版本；从N=10,000开始评估均值、标准差与分位数，再按尾部置信区间决定是否增到100,000或更多。换种子后均值变化小于1%不足以证明罕见失效概率已收敛。WC需要搜索完整容差域的最坏点，不只取端点；Monte
    Carlo擅长分布探索，却不保证找到全局极限。'
  caption: 曲线以0%为中心；有界分布的3σ不自动对应99.7%，精确覆盖率、统计估计与最坏界限回答不同问题。
  relationship: replaces-text
  removed_prose_chars: 377
- id: ch14-bom-trace-v2
  source: docs/p3-01-ch14.md#14.12
  before: '读 BOM 要顺着三条线交叉检查，而不是从上往下看型号。**第一条线是预算**：每一行都应能追溯到 14.9 的某一项误差或 14.11 的某一条测试。0.1% 电阻对应增益误差，低温漂基准对应 0.04°C
    的温漂预算，TVS 对应 ESD 判据；找不到对应项的行，要么多余，要么预算漏了。**第二条线是不可替代性**：先锁定传感器、基准、ADC 这些决定架构的器件，再选运放、LDO，最后定被动件与保护；顺序反了，就会为了迁就一颗运放去改整条链。**第三条线是替代料**：同一型号换封装、换批次，ESR、温漂、饱和电流都可能变；BOM
    必须写清关键参数与容差，不能只写型号。BOM 不只是购物清单：它是一张可采购的预算表。任何一行对不上预算，对应的指标就会在测试时暴露出来。


    还有一件必须在画板前定下来的事：**封装**。同一颗运放，SOT-23 与 MSOP 的热阻、引脚寄生、可布线性都不同；BOM 只写型号不写封装，layout 就会按"最顺手"的封装画，最后热预算和寄生参数全对不上。**封装是电气参数的一部分。**


    BOM 也是一次**成本与可得性的权衡**：0.1% 电阻与低温漂基准能买来精度，但价格、交期、替代料要一起算；车规/医疗还要看认证与批次追溯。**多问一句"明年还买得到吗"，比事后改板便宜。**'
  after: '**BOM按预算、封装和替代条件复核。** 0.1%增益电阻要对应40倍增益与校准要求；参考链10ppm/°C先区分共同项和独立残差；保护器件的单体ESD等级不等于整板通过。每一行都应指向14.9预算或14.11试验。


    锁定传感器、参考和ADC架构后，再定放大器、电源及被动件。封装会改变热阻、寄生与引脚，不能只写型号。替代料需同时满足电容有效容值、ESR、电感偏置与温漂等条件；成本、供货、追溯和认证也要在采购前核对。'
  caption: 图将器件参数连到预算和试验；这里只是选型窗口，实际原理图、型号和板级测量仍不可省。
  relationship: replaces-text
  removed_prose_chars: 331
- id: ch14-design-evidence-v2
  source: docs/p3-01-ch14.md#设计说明作业（精通出口）
  before: '本章是「设计方法」的主场。按全书精通标准交一份自己的设计说明，五块齐全：


    | 块 | 你要交什么 |

    |---|---|

    | 指标 | 输入/输出范围、带宽或响应、功耗或效率、精度、环境温度 |

    | 选型 | 关键器件型号或明确选型窗（含备选与否决理由） |

    | 极限工况 | 至少 3 个 corner（温度、负载、供电、容差等）及预期行为 |

    | 测试步骤 | 可复现的测量顺序、仪器与合格判据 |

    | 失败预案 | 若不合格，优先怀疑点与下一刀测量 |


