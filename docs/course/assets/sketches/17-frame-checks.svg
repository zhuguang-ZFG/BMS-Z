<text x="1040" y="969" font-size="44" text-anchor="middle" fill="#003153" font-weight="normal">全有效才更新</text>
<text x="720" y="1034" font-size="36" text-anchor="middle" fill="#003153" font-weight="normal">原理示意 / 非实拍</text>
