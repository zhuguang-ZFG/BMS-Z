  <polyline class="curve" opacity="0.32" points="84,336.0 91.4,333.5 98.9,331.3 106.3,329.2 113.8,327.3 121.2,325.5 128.7,323.8 136.1,322.2 143.6,320.7 151.0,319.3 158.5,318.0 165.9,316.8 173.4,315.6 180.8,314.5 188.3,313.5 195.7,312.6 203.2,311.7 210.6,310.9 218.1,310.1 225.5,309.4 233.0,308.7 240.4,308.0 247.9,307.4 255.3,306.8 262.8,306.2 270.2,305.7 277.7,305.2 285.1,304.7 292.6,304.3 300.0,303.9 300.0,303.9 307.5,303.5 314.9,303.1 322.4,302.7 329.8,302.3 337.3,302.0 344.7,301.6 352.2,301.3 359.6,301.0 367.1,300.7 374.5,300.4 382.0,300.1 389.4,299.9 396.9,299.6 404.3,299.4 411.8,299.1 419.2,298.9 426.7,298.7 434.1,298.5 441.6,298.3 449.0,298.1 456.5,297.9 463.9,297.7 471.4,297.6 478.8,297.4 486.3,297.2 493.7,297.1 501.2,296.9 508.6,296.8 516.1,296.6 516.1,296.6 523.5,296.5 531.0,296.4 538.4,296.3 545.9,296.2 553.3,296.1 560.8,296.0 568.2,295.9 575.7,295.8 583.1,295.7 590.6,295.7 598.0,295.6 605.5,295.5 612.9,295.4 620.4,295.4 627.8,295.3 635.3,295.3 642.7,295.2 650.2,295.1 657.6,295.1 665.1,295.0 672.5,295.0 680.0,294.9 687.4,294.9 694.9,294.8 702.3,294.8 709.8,294.8 717.2,294.7 724.7,294.7 732.1,294.6 739.6,294.6 747.0,294.6"/>
