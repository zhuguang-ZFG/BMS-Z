    <animate data-ease="linear" attributeName="cy" values="610.0;600.0;590.0;580.0;570.0;560.0;550.0;540.0;530.0;520.0;510.0" keyTimes="0;0.1000;0.2000;0.3000;0.4000;0.5000;0.6000;0.7000;0.8000;0.9000;1" dur="12s" repeatCount="indefinite" />
  </circle>
