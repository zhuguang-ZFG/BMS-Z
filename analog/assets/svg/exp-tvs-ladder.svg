<polygon points="175,180 185,180 180,192" fill="#8b8272"/>
<rect x="70" y="206" width="220" height="40" rx="6" fill="#f6eedb" stroke="#a4630f" stroke-width="1.6"/>
<text x="180" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#a4630f">TVS 9.2V · 泄放大能量</text>
<path d="M180 246 Q180.18 266.00 180 286" fill="none" stroke="#8b8272" stroke-width="2"/>
<polygon points="175,280 185,280 180,292" fill="#8b8272"/>
<rect x="70" y="306" width="220" height="40" rx="6" fill="#f6eedb" stroke="#1f5d7a" stroke-width="1.6"/>
<text x="180" y="332" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f5d7a">330Ω → 10mA · 电阻限流</text>
<path d="M180 346 Q179.91 366.00 180 386" fill="none" stroke="#8b8272" stroke-width="2"/>
<polygon points="175,380 185,380 180,392" fill="#8b8272"/>
<rect x="70" y="406" width="220" height="40" rx="6" fill="#f6eedb" stroke="#3d6b4a" stroke-width="1.6"/>
<text x="180" y="432" text-anchor="middle" font-size="13" font-weight="bold" fill="#3d6b4a">GPIO 安全 · 内部钳位兜底</text>
<rect x="400" y="110" width="352" height="58" rx="7" fill="none" stroke="#a4630f" stroke-width="1.8" opacity="0.9"><animate attributeName="y" values="134;192;250;308;308" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/></rect>
<text x="412" y="134" font-size="11.5" font-weight="bold" fill="#a4630f">① 浪涌进来</text><text x="412" y="159" font-size="14.5" font-weight="bold" fill="#16202b">IEC 8kV：330Ω/150pF</text><text x="412" y="176" font-size="10.5" fill="#5b666f">系统级波形，前沿小于 1ns</text>
<text x="412" y="192" font-size="11.5" font-weight="bold" fill="#a4630f">② TVS 先泄放</text><text x="412" y="217" font-size="14.5" font-weight="bold" fill="#16202b">钳到 9.2V @ 24A</text><text x="412" y="234" font-size="10.5" fill="#5b666f">能量走地，Ppp≈223W</text><rect x="400" y="168" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.25;0.28;1" dur="14s" repeatCount="indefinite"/></rect>
<text x="412" y="250" font-size="11.5" font-weight="bold" fill="#a4630f">③ 电阻限流</text><text x="412" y="275" font-size="14.5" font-weight="bold" fill="#16202b">(9.2−5.7)/330 ≈ 10mA</text><text x="412" y="292" font-size="10.5" fill="#5b666f">把残压压到毫安级</text><rect x="400" y="226" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.5;0.53;1" dur="14s" repeatCount="indefinite"/></rect>
<text x="412" y="308" font-size="11.5" font-weight="bold" fill="#a4630f">④ 芯片钳位兜底</text><text x="412" y="333" font-size="14.5" font-weight="bold" fill="#16202b">内部二极管最后一级</text><text x="412" y="350" font-size="10.5" fill="#5b666f">三级缺一，芯片先死</text><rect x="400" y="284" width="352" height="58" rx="6" fill="#fdf8ea" opacity="0"><animate attributeName="opacity" values="0.42;0.42;0;0" keyTimes="0;0.75;0.78;1" dur="14s" repeatCount="indefinite"/></rect>
<g><rect x="30" y="612" width="740" height="52.0" rx="9" fill="#e8efe6" stroke="#3d6b4a" stroke-width="1.5" filter="url(#soft)"/><rect x="36" y="619" width="3" height="38.0" rx="1.5" fill="#3d6b4a"/><text x="400" y="634.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3d6b4a">TVS 负责泄大能量，电阻+内部钳位负责毫安级残压——只</text><text x="400" y="652.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3d6b4a">装 TVS 不串电阻，芯片还是可能被打死（2.11 例 2-2）</text></g></svg>