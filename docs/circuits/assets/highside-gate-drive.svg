  <text x="200" y="62" text-anchor="middle" font-size="14" font-weight="bold" class="ok">低边：驱动最简单</text>
  <line x1="60" y1="90" x2="340" y2="90" stroke-width="3" class="stroke-axis" />
  <text x="52" y="94" text-anchor="end" font-size="12" class="small">B+</text>
