<text x="88" y="430" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="13" fill="#52606d">输出端直接短接，电流只受内阻限制。</text>
<text x="88" y="486" font-family="'Book Mono',monospace" font-size="18" fill="#b45309">V = 常数</text>

<text x="518" y="148" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="22" font-weight="700" fill="#0f766e">恒流源 · 流量不变</text>

