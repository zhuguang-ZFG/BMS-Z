  <rect x="180" y="384" width="440" height="32" rx="6" stroke-width="1.5" opacity="0" class="fill-boxy stroke-y">
    <animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="0;0;1;1" keyTimes="0;0.78;0.83;1" dur="12s" repeatCount="indefinite" />
  </rect>
  <text x="400" y="404" text-anchor="middle" font-size="12" opacity="0" class="gold">自举靠循环充电：不能 100% 常开——常开主开关用电荷泵或隔离驱动
    <animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="0;0;1;1" keyTimes="0;0.78;0.83;1" dur="12s" repeatCount="indefinite" />
  </text>

  <text x="400" y="452" text-anchor="middle" font-size="13" class="small">关键：高边 N 沟道要 V_G 高过 B+；自举能省钱但不能常开，常开用电荷泵。</text>
