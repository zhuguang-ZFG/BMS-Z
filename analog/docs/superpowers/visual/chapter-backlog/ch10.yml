chapter: 10
source: docs/p1-11-ch10.md
planned_on: 2026-11-08
workflow: article-illustration-planner; derive models and bind datasheet conditions before drawing
style: FA-029 with C-34/C-32; physical axes, circuit paths and separate logic tracks
sources:
- url: https://www.ti.com/lit/ds/symlink/ne555.pdf
  revision: SLFS022K, March 2026
  sections:
  - '5.1'
  - '5.3'
  - '5.5'
  - '5.6'
  - 6.3.2
  - '6.4'
  findings: NE555 4.5–16 V, 0–70 C; nominal RESET > TRIG > THRES priority. Recommended astable frequency
    at most 100 kHz to reduce distortion. Output levels depend on load. The latest revision removes the
    old initial timing error specification.
- url: https://www.ti.com/lit/ds/symlink/tlc555.pdf
  revision: SLFS043K, January 2026
  sections:
  - '5.3'
  - '5.5'
  - '5.6'
  - 6.3.2
  - '7.2'
  findings: 'Minimum supply depends on grade: C 2 V, I 3 V, M/Q 5 V. Source and sink capability differ;
    MHz operation and light-load rail swing are not generic guarantees for all loads.'
- url: https://www.ti.com/lit/ds/symlink/lm555.pdf
  revision: SNAS548D, January 2015
  sections:
  - '8.1'
  - 8.2.2.2
  findings: Monostable trigger should return high at least 10 us before interval end. Driving trigger
    to ground can cause comparator storage up to 10 us. These are LM555-specific notes, not an all-555
    minimum trigger guarantee.
