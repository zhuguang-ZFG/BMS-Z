<text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b">RESET、TRIG、THRES 按优先级改变状态</text>
<text x="360" y="54" text-anchor="middle" font-size="12.5" fill="#5b666f">示意：示意 9 V、标称 3/6 V 门限；不在相等边界判定保证状态。</text>
<text x="40" y="117" font-size="20" fill="#2a2927" text-anchor="start">OUT 低，DISCH 导通</text>
<g transform="translate(100 70) scale(1.6)"><text x="12" y="65" font-size="18" fill="#2a2927" text-anchor="start">RESET：释放</text><text x="12" y="101" font-size="18" fill="#2a2927" text-anchor="start">TRIG：4 V</text><text x="12" y="137" font-size="18" fill="#2a2927" text-anchor="start">THRES：7 V</text><line x1="160" y1="55" x2="160" y2="143" stroke="#5b666f" stroke-width="2" stroke-dasharray=""/><text x="176" y="100" font-size="20" fill="#2a2927" text-anchor="start">锁存</text><line x1="220" y1="100" x2="265" y2="100" stroke="#16202b" stroke-width="2" stroke-dasharray=""/><text x="270" y="106" font-size="24" fill="#2a2927" text-anchor="start">0</text><text x="12" y="190" font-size="20" fill="#2a2927" text-anchor="start">DISCH：导通</text></g>
<rect x="24" y="406" width="672" height="34" rx="9" fill="#f7eedb" stroke="#c9bb9d" stroke-width="1.2"/>
<text x="360" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#16202b">TRIG 已释放，THRES 超过 6 V，输出复位并放电。</text>
</svg>
