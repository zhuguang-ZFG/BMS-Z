<svg role="img" aria-labelledby="figure-title figure-desc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" width="960" height="690" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <title id="figure-title">一条新息怎样分到两个状态</title>
  <desc id="figure-desc">本书第1拍：SOC对线性化端电压的贡献为88.26%，极化项为负27.04%，合计61.22%。分项可能相互抵消，不能把SOC分项当成整体信任概率；C乘K只是局部线性化解释。</desc>
  <rect width="960" height="690" fill="#FFFDF5"/>
  <defs>
