  <rect x="489" y="70" width="140" height="64" rx="8" class="panel" stroke-width="2px"/>
  <text x="559" y="98" text-anchor="middle" font-size="14" class="txt">包序列号</text>
  <text x="559" y="118" text-anchor="middle" font-size="12" class="txt">整机</text>
