<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240" role="img" aria-label="BMS 帧格式与 CRC 覆盖范围">
  <rect x="0" y="0" width="960" height="240" fill="#f8fafc"/>
  <text x="24" y="32" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#0f172a">帧不是“一条消息”，是字节流里找回来的边界</text>

  <g font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle">
    <rect x="40" y="80" width="100" height="54" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="90" y="104" fill="#1e3a8a" font-weight="700">AA 55</text>
    <text x="90" y="124" fill="#475569" font-size="11">帧头</text>

    <rect x="140" y="80" width="90" height="54" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
    <text x="185" y="104" fill="#115e59" font-weight="700">addr</text>
    <text x="185" y="124" fill="#475569" font-size="11">地址</text>

    <rect x="230" y="80" width="80" height="54" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
    <text x="270" y="104" fill="#115e59" font-weight="700">cmd</text>
    <text x="270" y="124" fill="#475569" font-size="11">命令</text>

    <rect x="310" y="80" width="80" height="54" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="350" y="104" fill="#92400e" font-weight="700">len</text>
    <text x="350" y="124" fill="#475569" font-size="11">长度</text>

    <rect x="390" y="80" width="330" height="54" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="555" y="104" fill="#5b21b6" font-weight="700">data[len]</text>
    <text x="555" y="124" fill="#475569" font-size="11">载荷；里面可以出现 AA 55，不能抢帧头</text>

    <rect x="720" y="80" width="100" height="54" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="770" y="104" fill="#991b1b" font-weight="700">crc8</text>
    <text x="770" y="124" fill="#475569" font-size="11">校验</text>
  </g>

  <path d="M140 158 L140 172 L820 172 L820 158" fill="none" stroke="#be123c" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="480" y="192" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#9f1239">CRC 覆盖 addr..data，不含帧头</text>

  <text x="24" y="222" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">坏帧只排除当前帧头，余下字节重新扫描；孤立 AA 留到下一字节。</text>
</svg>
