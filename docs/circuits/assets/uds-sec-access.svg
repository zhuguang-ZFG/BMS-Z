      .warn { fill: #f39b91; }
      .ok { fill: #8fc7a2; }
      .gold { fill: #dfbd78; }
      .lifeline { stroke: #b0beb3; }
      .lineb { stroke: #7ec5c5; }
      .lineg { stroke: #8fc7a2; }
      .liner { stroke: #f39b91; }
      .headb { fill: #7ec5c5; }
