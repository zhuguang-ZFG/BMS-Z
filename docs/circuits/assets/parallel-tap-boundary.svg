<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440">
  <title>并联在一起的电芯只有一个可测电压</title>
  <rect width="880" height="440" fill="#f8fafc"/>
  <style>
  text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
  /* 深色模式：GitHub 深色主题下对调底色与文字色，只覆盖配色，不动几何与动画。
     stroke="#fff" 保持白色——那是彩色徽标上的勾选，不在覆盖范围内。 */
  @media (prefers-color-scheme: dark){
  rect[fill="#f8fafc"]{fill:#0f172a}
  rect[fill="#fff"]{fill:#1e293b}
  [fill="#f1f5f9"]{fill:#1e293b}
  [stroke="#f1f5f9"]{stroke:#1e293b}
  [fill="#e2e8f0"]{fill:#334155}
  [stroke="#e2e8f0"]{stroke:#334155}
  [fill="#cbd5e1"]{fill:#475569}
  [stroke="#cbd5e1"]{stroke:#475569}
  [fill="#64748b"]{fill:#94a3b8}
  [stroke="#64748b"]{stroke:#94a3b8}
  [fill="#475569"]{fill:#cbd5e1}
  [stroke="#475569"]{stroke:#cbd5e1}
  [fill="#334155"]{fill:#e2e8f0}
  [stroke="#334155"]{stroke:#e2e8f0}
  [fill="#1e293b"]{fill:#f1f5f9}
  [stroke="#1e293b"]{stroke:#f1f5f9}
  [fill="#dbeafe"]{fill:#1e3a8a}
  [stroke="#dbeafe"]{stroke:#1e3a8a}
  [fill="#eff6ff"]{fill:#172554}
  [stroke="#eff6ff"]{stroke:#172554}
  [fill="#bfdbfe"]{fill:#1e40af}
  [stroke="#bfdbfe"]{stroke:#1e40af}
  [fill="#1d4ed8"]{fill:#60a5fa}
  [stroke="#1d4ed8"]{stroke:#60a5fa}
  [fill="#1e40af"]{fill:#93c5fd}
  [stroke="#1e40af"]{stroke:#93c5fd}
  [fill="#2563eb"]{fill:#60a5fa}
  [stroke="#2563eb"]{stroke:#60a5fa}
  [fill="#3b82f6"]{fill:#60a5fa}
  [stroke="#3b82f6"]{stroke:#60a5fa}
  [fill="#ecfdf5"]{fill:#022c22}
  [stroke="#ecfdf5"]{stroke:#022c22}
  [fill="#a7f3d0"]{fill:#065f46}
  [stroke="#a7f3d0"]{stroke:#065f46}
  [fill="#86efac"]{fill:#166534}
  [stroke="#86efac"]{stroke:#166534}
  [fill="#065f46"]{fill:#6ee7b7}
  [stroke="#065f46"]{stroke:#6ee7b7}
  [fill="#059669"]{fill:#34d399}
  [stroke="#059669"]{stroke:#34d399}
  [fill="#fef2f2"]{fill:#450a0a}
  [stroke="#fef2f2"]{stroke:#450a0a}
  [fill="#fecaca"]{fill:#7f1d1d}
  [stroke="#fecaca"]{stroke:#7f1d1d}
  [fill="#fca5a5"]{fill:#b91c1c}
  [stroke="#fca5a5"]{stroke:#b91c1c}
  [fill="#991b1b"]{fill:#fca5a5}
  [stroke="#991b1b"]{stroke:#fca5a5}
  [fill="#dc2626"]{fill:#f87171}
  [stroke="#dc2626"]{stroke:#f87171}
  [fill="#fffbeb"]{fill:#451a03}
  [stroke="#fffbeb"]{stroke:#451a03}
  [fill="#fef3c7"]{fill:#78350f}
  [stroke="#fef3c7"]{stroke:#78350f}
  [fill="#92400e"]{fill:#fcd34d}
  [stroke="#92400e"]{stroke:#fcd34d}
  [fill="#b45309"]{fill:#fbbf24}
  [stroke="#b45309"]{stroke:#fbbf24}
  }
</style>

  <text x="440" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">采样边界：测的是并联块，不是块里的每一颗</text>
  <rect x="24" y="60" width="400" height="250" rx="8" fill="#fff" stroke="#059669" stroke-width="2">
    <animate attributeName="stroke-width" values="5;2;5" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="224" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#065f46">对：一个抽头</text>
  <rect x="80" y="120" width="70" height="90" rx="6" fill="#ecfdf5" stroke="#059669"/>
  <rect x="170" y="120" width="70" height="90" rx="6" fill="#ecfdf5" stroke="#059669"/>
  <line x1="115" y1="110" x2="205" y2="110" stroke="#059669" stroke-width="3"/>
  <line x1="115" y1="120" x2="115" y2="110" stroke="#059669" stroke-width="3"/>
  <line x1="205" y1="120" x2="205" y2="110" stroke="#059669" stroke-width="3"/>
  <text x="160" y="170" text-anchor="middle" font-size="13" fill="#1e293b">两颗被导线短在一起</text>
  <line x1="160" y1="110" x2="300" y2="110" stroke="#2563eb" stroke-width="2"/>
  <rect x="300" y="90" width="90" height="44" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="345" y="116" text-anchor="middle" font-size="13" fill="#1e40af">一路电压</text>
  <circle cy="110" r="5" fill="#1d4ed8">
    <animate attributeName="cx" values="160;330;160" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite"/>
  </circle>

  <rect x="456" y="60" width="400" height="250" rx="8" fill="#fff" stroke="#dc2626" stroke-width="2">
    <animate attributeName="stroke-width" values="2;5;2" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="656" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">错：当成两路</text>
  <rect x="520" y="120" width="70" height="90" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <rect x="610" y="120" width="70" height="90" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <line x1="555" y1="110" x2="645" y2="110" stroke="#dc2626" stroke-width="3"/>
  <text x="600" y="250" text-anchor="middle" font-size="13" fill="#991b1b">导线已经把它们拉成同一个电位</text>
  <text x="720" y="150" font-size="13" fill="#dc2626">探头 A</text>
  <text x="720" y="190" font-size="13" fill="#dc2626">探头 B</text>
  <text x="720" y="220" font-size="13" fill="#334155">读数会一样</text>
  <text x="440" y="350" text-anchor="middle" font-size="15" fill="#1e293b">4S2P 要 4 路采样。路数等于串联数，不乘并联数。</text>
  <text x="440" y="382" text-anchor="middle" font-size="14" fill="#334155">块里某一颗先坏，端电压仍可能正常。总电压保护看不出它。</text>
  <text x="440" y="418" text-anchor="middle" font-size="13" fill="#475569">示意图。水路：并联是两桶底连通，水面只能有一个高度。</text>

</svg>
