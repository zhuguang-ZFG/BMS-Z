<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="覆盖与隔离审查矩阵及教学 FMEA">
<title>覆盖与隔离审查矩阵及教学 FMEA</title>
<desc>按已分析失效模式核查诊断覆盖、共因隔离和残余风险；教学FMEA展示一项未闭合共因缺口，不代替安全论证。</desc>
<style>
  .bg { fill: #f6f1e3; }
  .title { fill: #003153; font: 700 20px 'KaiTi','STKaiti','Noto Serif SC',serif; }
  .sub { fill: #5c6d73; font: 13px 'Noto Sans SC','Microsoft YaHei',sans-serif; }
  .lbl { fill: #4d5d63; font: 13px 'Noto Sans SC','Microsoft YaHei',sans-serif; }
  .small { fill: #4d5d63; font: 12px 'Noto Sans SC','Microsoft YaHei',sans-serif; }
  .value { fill: #003153; font: 700 18px 'Noto Sans SC','Microsoft YaHei',sans-serif; }
  .sym { fill: #003153; font: 700 19px 'KaiTi','STKaiti','Noto Serif SC',serif; }
  .wire { stroke: #003153; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .kill { stroke: #a3322a; stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-dasharray: 7 5; }
  .ok { stroke: #176b64; stroke-width: 2.6; fill: none; stroke-linecap: round; }
  .box { fill: #fbf8f1; stroke: #003153; stroke-width: 2; rx: 8; }
  .cell-bad { fill: #a3322a; opacity: 0.14; }
  .cell-mid { fill: #8a5019; opacity: 0.16; }
  .cell-good { fill: #176b64; opacity: 0.18; }
  .axis { stroke: #5c6d73; stroke-width: 1.3; }
  .halo { paint-order: stroke; stroke: #f6f1e3; stroke-width: 4; stroke-linejoin: round; }
</style>
<rect class="bg" x="0" y="0" width="800" height="600"/>
<text class="title" x="40.0" y="40.0" text-anchor="start">图 D09-F2　覆盖与隔离：按失效模式审证据</text>
<text class="sub" x="40.0" y="66.0" text-anchor="start">矩阵是检查提示，不是安全等级；高覆盖与隔离也不能替代残余风险论证</text>
<rect class="cell-bad" x="90" y="116" width="328" height="74" rx="8"/>
<text class="lbl" x="254.0" y="146.0" text-anchor="middle">漏诊风险</text>
<text class="lbl" x="254.0" y="170.0" text-anchor="middle">共因风险仍在</text>
<rect class="cell-mid" x="430" y="116" width="328" height="74" rx="8"/>
<text class="lbl" x="594.0" y="146.0" text-anchor="middle">已有诊断覆盖</text>
<text class="lbl" x="594.0" y="170.0" text-anchor="middle">共因仍可使两路同时失效</text>
<rect class="cell-mid" x="90" y="200" width="328" height="74" rx="8"/>
<text class="lbl" x="254.0" y="230.0" text-anchor="middle">已识别共因有隔离</text>
<text class="lbl" x="254.0" y="254.0" text-anchor="middle">未检出的随机失效仍需控制</text>
<rect class="cell-good" x="430" y="200" width="328" height="74" rx="8"/>
<text class="lbl" x="594.0" y="230.0" text-anchor="middle">已分析模式有覆盖与隔离证据</text>
<text class="lbl" x="594.0" y="254.0" text-anchor="middle">仍需核查遗漏模式与残余风险</text>
<text class="lbl" x="254.0" y="104.0" text-anchor="middle">覆盖低</text>
<text class="lbl" x="594.0" y="104.0" text-anchor="middle">覆盖高</text>
<text class="lbl" x="80.0" y="158.0" text-anchor="end">不隔离</text>
<text class="lbl" x="80.0" y="242.0" text-anchor="end">隔离</text>
<text class="sym" x="40.0" y="330.0" text-anchor="start">教学 FMEA：控制、证据与残余风险逐项列</text>
<rect class="box" x="40" y="352" width="350" height="76"/>
<text class="lbl" x="52.0" y="375.0" text-anchor="start">主 MCU 死机</text>
<text class="small" x="52.0" y="396.0" text-anchor="start">独立硬件比较器通道（隔离供电）</text>
<rect class="box" x="410" y="352" width="350" height="76"/>
<text class="lbl" x="422.0" y="375.0" text-anchor="start">电流传感失效卡值</text>
<text class="small" x="422.0" y="396.0" text-anchor="start">窗口稽核（D5.3）</text>
<rect class="box" x="40" y="440" width="350" height="76"/>
<text class="lbl" x="52.0" y="463.0" text-anchor="start">驱动电源跌落</text>
<text class="small" x="52.0" y="484.0" text-anchor="start">欠压锁定(UVLO) + 下拉电阻</text>
<rect class="box" x="410" y="440" width="350" height="76"/>
<text class="lbl" x="422.0" y="463.0" text-anchor="start">传感链共因漂移</text>
<text class="small" x="422.0" y="484.0" text-anchor="start">无（共因缺口明示）</text>
<text class="lbl" x="40.0" y="552.0" text-anchor="start">本例保留一项共因缺口；真实项目不要求固定留一行“无”。</text>
<text class="lbl" x="40.0" y="578.0" text-anchor="start">表格全绿本身不证明安全；每项控制仍需有效性证据。</text>
</svg>
