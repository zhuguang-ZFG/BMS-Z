    <animateMotion keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" path="M200,90 L200,250" keyPoints="0;0;1;1" keyTimes="0;0.08;0.25;1" calcMode="linear" dur="12s" repeatCount="indefinite" />
  </circle>
  <text x="200" y="290" text-anchor="middle" font-size="12" opacity="0" class="ok">源极接地：10V 驱动直接开
    <animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.05;0.08;0.25;0.28;1" dur="12s" repeatCount="indefinite" />
