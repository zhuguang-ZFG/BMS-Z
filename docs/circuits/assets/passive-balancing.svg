</style><rect class="bg" x="0" y="-156" width="800" height="650" /><text class="title" x="24" y="-128">被动均衡：水位（电压）高的电池，开阀放掉一点</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 被动均衡：水位（电压）高的电池，开阀放掉一点<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 4.05V ↑高<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 充电中：四节电池同时"进水"，但水位（电压）有高有低<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="438" width="752" height="44" rx="6" /><text class="small" x="40" y="466">注意：均衡电流只有 50–200mA，远小于充电电流，只能慢慢修正差异。示意。</text><rect width="800" height="430" class="bg" />
  <g class="fill-b">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.72;0.75;1" dur="8s" repeatCount="indefinite" />
    <circle r="5"><animateMotion dur="0.9s" begin="0s" repeatCount="indefinite" path="M140,55 V96" /></circle>
    <circle r="5"><animateMotion dur="0.9s" begin="-0.3s" repeatCount="indefinite" path="M300,55 V96" /></circle>
    <circle r="5"><animateMotion dur="0.9s" begin="-0.15s" repeatCount="indefinite" path="M460,55 V96" /></circle>
    <circle r="5"><animateMotion dur="0.9s" begin="-0.5s" repeatCount="indefinite" path="M620,55 V96" /></circle>
  </g>

  
  <g fill="none" stroke-width="2.5" class="stroke-axis">
    <rect x="100" y="100" width="80" height="200" rx="4" />
    <rect x="260" y="100" width="80" height="200" rx="4" />
    <rect x="420" y="100" width="80" height="200" rx="4" />
    <rect x="580" y="100" width="80" height="200" rx="4" />
  </g>

  
  <rect x="103" y="160" width="74" height="137" opacity="0.85" class="fill-b">
    <animate attributeName="height" values="137;137;149;149" keyTimes="0;0.15;0.75;1" dur="8s" repeatCount="indefinite" />
    <animate attributeName="y" values="160;160;148;148" keyTimes="0;0.15;0.75;1" dur="8s" repeatCount="indefinite" />
  </rect>
  <rect x="423" y="164" width="74" height="133" opacity="0.85" class="fill-b">
    <animate attributeName="height" values="133;133;145;145" keyTimes="0;0.15;0.75;1" dur="8s" repeatCount="indefinite" />
    <animate attributeName="y" values="164;164;152;152" keyTimes="0;0.15;0.75;1" dur="8s" repeatCount="indefinite" />
  </rect>
  <rect x="583" y="158" width="74" height="139" opacity="0.85" class="fill-b">
    <animate attributeName="height" values="139;139;151;151" keyTimes="0;0.15;0.75;1" dur="8s" repeatCount="indefinite" />
    <animate attributeName="y" values="158;158;146;146" keyTimes="0;0.15;0.75;1" dur="8s" repeatCount="indefinite" />
  </rect>

  
  <rect x="263" y="116" width="74" height="181" opacity="0.85" class="fill-b">
    <animate attributeName="height" values="181;181;149;149" keyTimes="0;0.15;0.75;1" dur="8s" repeatCount="indefinite" />
    <animate attributeName="y" values="116;116;148;148" keyTimes="0;0.15;0.75;1" dur="8s" repeatCount="indefinite" />
  </rect>

  
  <g font-size="13" text-anchor="middle" class="fill-ink">
    <text x="140" y="322" class="small">3.68V</text>
    <text x="300" y="322" class="small">4.05V ↑高</text>
    <text x="460" y="322" class="small">3.65V</text>
    <text x="620" y="322" class="small">3.69V</text>
  </g>

  
  <path d="M340,116 H370" stroke-width="2" fill="none" class="stroke-axis" />
  
  <g>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.13;0.15;1" dur="8s" repeatCount="indefinite" />
    <line x1="370" y1="116" x2="402" y2="96" stroke-width="3" stroke-linecap="round" class="stroke-b" />
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.13;0.15;0.75;0.78;1" dur="8s" repeatCount="indefinite" />
    <line x1="370" y1="116" x2="410" y2="116" stroke-width="3" class="stroke-b" />
  </g>
  <circle cx="370" cy="116" r="4" class="fill-ink" />
  <circle cx="410" cy="116" r="4" class="fill-ink" />
  
  <polyline points="410,116 420,106 435,126 450,106 465,126 480,106 495,126 505,116" fill="none" stroke="#64748b" stroke-width="2.5" class="stroke-axis">
    <animate attributeName="stroke" values="#94a3b8;#fbbf24;#fbbf24;#94a3b8" keyTimes="0;0.15;0.75;1" dur="8s" repeatCount="indefinite" />
  </polyline>
  <text x="455" y="145" text-anchor="middle" font-size="12" class="small">均衡电阻</text>

  
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.15;0.18;0.72;0.75;1" dur="8s" repeatCount="indefinite" />
    <circle r="5" class="fill-y"><animateMotion dur="1.1s" begin="0s" repeatCount="indefinite" path="M344,116 H500" /></circle>
    <circle r="5" class="fill-y"><animateMotion dur="1.1s" begin="-0.55s" repeatCount="indefinite" path="M344,116 H500" /></circle>
    <g fill="none" stroke-width="2" class="stroke-y">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" repeatCount="indefinite" />
      <path d="M430,88 q5,-10 10,0 t10,0" />
      <path d="M450,78 q5,-10 10,0 t10,0" />
      <path d="M470,88 q5,-10 10,0 t10,0" />
    </g>
    <text x="455" y="62" text-anchor="middle" font-size="12" class="gold">能量变热散掉</text>
  </g>

  
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.13;0.15;1" dur="8s" repeatCount="indefinite" />
    <text x="400" y="370" text-anchor="middle" font-size="14" class="txt">充电中：四节电池同时"进水"，但水位（电压）有高有低</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.15;0.18;0.72;0.75;1" dur="8s" repeatCount="indefinite" />
    <text x="400" y="370" text-anchor="middle" font-size="14" class="gold">2 号水位过高 → 打开它的泄放阀（均衡开关），多余能量经电阻变成热</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.8;1" dur="8s" repeatCount="indefinite" />
    
    <rect x="155" y="348" width="490" height="34" rx="8" class="fill-boxg stroke-g" />
    <text x="400" y="370" text-anchor="middle" font-size="14" font-weight="bold" class="ok">水位趋于一致 —— 被动均衡就是"把高个子的水舀掉"</text>
  </g>

  
</svg>