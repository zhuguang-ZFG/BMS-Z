<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -156 800 560" font-family="ui-monospace, Consolas, monospace" role="img">
  <title>DTC 故障快照：单体电压越过阈值瞬间，BMS 冻结电压电流温度 SOC 时间戳写入快照区，售后据此还原事故现场</title>
  <desc>电压曲线爬过 4.20 V 示例阈值的那一拍，快照区冻结电压、电流、温度、SOC 和时间戳，后面的波动不再改写。</desc><style>
    .bg { fill: #fffdf5; }
    .panel { fill: #f7f2e5; stroke: #cfc6b2; }
    .txt { fill: #293b3a; font-size: 13px; }
    .small { fill: #626d65; font-size: 12px; }
    .title { fill: #293b3a; font-size: 16px; font-weight: bold; }
    .wave { stroke: #176b73; stroke-width: 2.5; fill: none; }
    .thr { stroke: #b84745; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .snap { fill: #fbefc7; stroke: #926717; stroke-width: 2; }
    .flash { fill: #b84745; }
    .arrow { stroke: #926717; stroke-width: 2; fill: none; marker-end: url(#arr2); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #192727; }
      .panel { fill: #223333; stroke: #496160; }
      .txt { fill: #edf0e5; }
      .small { fill: #b0beb3; }
      .title { fill: #edf0e5; }
      .wave { stroke: #7ec5c5; }
      .thr { stroke: #f39b91; }
      .snap { fill: #453e2b; stroke: #dfbd78; }
      .flash { fill: #f39b91; }
      .arrow { stroke: #dfbd78; }
    }
  </style><style id="bms-motion">
    /* bms-motion: 手帐式动效注记（纯装饰，不改技术几何与既有 SMIL 时序） */
    .bms-marker { fill: #fbefc7; opacity: .78; }
    .bms-under { fill: none; stroke: #926717; stroke-width: 2.4; stroke-linecap: round; opacity: .9; }
    .bms-spark-line { fill: none; stroke: #926717; stroke-width: 1.9; stroke-linecap: round; }
    .bms-spark-fill { fill: #926717; }
    .bms-spark-soft { fill: #176b73; opacity: .8; }
    .bms-sticker { fill: none; stroke: #926717; stroke-width: 2; stroke-dasharray: 7 5; stroke-linecap: round; opacity: .85; }
    .bms-halo { fill: none; stroke: #926717; stroke-width: 2; }
    .bms-marker, .bms-under, .bms-sticker, .bms-halo,
    .bms-spark, .bms-success, .bms-doodle { pointer-events: none; }
    circle:has(> animateMotion) { filter: drop-shadow(0 0 2px rgba(146,103,23,.5)) drop-shadow(0 0 5px rgba(196,145,52,.45)); }
    rect:has(> animateMotion) { filter: drop-shadow(0 0 3px rgba(196,145,52,.75)); }
    g:has(> circle):has(> path.stroke-check) { filter: drop-shadow(0 0 5px rgba(55,123,96,.5)); }
    @media (prefers-color-scheme: dark) {
      .bms-marker { fill: #453e2b; opacity: .85; }
      .bms-under { stroke: #dfbd78; }
      .bms-spark-line { stroke: #dfbd78; }
      .bms-spark-fill { fill: #dfbd78; }
      .bms-spark-soft { fill: #7ec5c5; }
      .bms-sticker { stroke: #dfbd78; }
      .bms-halo { stroke: #dfbd78; }
      circle:has(> animateMotion) { filter: drop-shadow(0 0 2px rgba(223,189,120,.8)) drop-shadow(0 0 7px rgba(223,189,120,.9)); }
      rect:has(> animateMotion) { filter: drop-shadow(0 0 6px rgba(223,189,120,.8)); }
      g:has(> circle):has(> path.stroke-check) { filter: drop-shadow(0 0 6px rgba(143,199,162,.7)); }
    }
    @media (prefers-reduced-motion: reduce) { .bms-spark, .bms-success, .bms-doodle { display: none; } }
</style>
  <rect class="bg" x="0" y="-156" width="800" height="560" /><rect class="bms-marker" aria-hidden="true" x="18.0" y="-142.9" width="239.9" height="17.3" rx="3.8" transform="rotate(-.5 18.0 -134.2)"/><path class="bms-under" aria-hidden="true" d="M24.0 -119.0 q 24.0 -2.4 48.0 0 t 48 0 t 48 0 t 48 0"/><text class="title" x="24" y="-128">DTC 快照：触发瞬间，冻结现场</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><g class="bms-doodle" aria-hidden="true" transform="translate(746.0 -88.0)"><animateTransform attributeName="transform" type="rotate" values="-6;7;-6" keyTimes="0;0.5;1" dur="5.4s" repeatCount="indefinite" additive="sum"/><animate attributeName="opacity" values="0.62;1;0.62" keyTimes="0;0.5;1" dur="3.6s" repeatCount="indefinite"/><path class="bms-spark-fill" d="M0 -9 L2.3 -2.3 L9 0 L2.3 2.3 L0 9 L-2.3 2.3 L-9 0 L-2.3 -2.3 Z"/></g><g class="bms-doodle" aria-hidden="true" transform="translate(710.0 -98.0)"><animateTransform attributeName="transform" type="rotate" values="5;-4;5" keyTimes="0;0.5;1" dur="6.2s" repeatCount="indefinite" additive="sum"/><animate attributeName="opacity" values="0.5;0.9;0.5" keyTimes="0;0.5;1" dur="4.4s" repeatCount="indefinite"/><path class="bms-spark-soft" d="M0 -5.5 L1.4 -1.4 L5.5 0 L1.4 1.4 L0 5.5 L-1.4 1.4 L-5.5 0 L-1.4 -1.4 Z"/></g><g class="bms-doodle" aria-hidden="true"><circle class="bms-spark-fill" cx="728.0" cy="-79.0" r="1.3"/><circle class="bms-spark-soft" cx="696.0" cy="-82.0" r="1.1"/></g><text class="txt" x="40" y="-88" opacity="1">① DTC 快照：触发瞬间，冻结现场<animate calcMode="spline" keySplines="0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 单体电压（充电中）<animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 过压阈值 4.20V<animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 循环里亮着的那一步对应当前画面。数字标示意。<animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect class="panel" x="24" y="348" width="752" height="44" rx="6" /><text class="small" x="40" y="376">时间戳 = 2026-10-05 14:03:22。示意。</text><defs>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="context-stroke" />
    </marker>
  </defs>
  <rect class="bg" width="800" height="340" />
  <rect class="panel" x="40" y="60" width="440" height="180" rx="6" />
  <text class="small" x="52" y="80">单体电压（充电中）</text>
  <line class="thr" x1="60" y1="120" x2="460" y2="120" />
  <text class="small" x="370" y="112">过压阈值 4.20V</text>
  
  <path class="wave" d="M 60 200 C 160 190, 240 175, 300 150 C 330 138, 345 128, 360 100" />
  
  <circle class="flash" cx="338" cy="122" r="6">
    <animate calcMode="spline" keySplines="0.16 1 0.3 1;0.7 0 0.84 0" attributeName="r" values="4;9;4" dur="8s" repeatCount="indefinite" />
    <animate calcMode="spline" keySplines="0.7 0 0.84 0;0.16 1 0.3 1" attributeName="opacity" values="1;0.3;1" dur="8s" repeatCount="indefinite" />
  </circle>
  <text class="small" x="300" y="230">t = 触发时刻</text>
  <line class="thr" x1="338" y1="122" x2="338" y2="225" opacity="0.5" />

  
  <rect class="snap" x="520" y="70" width="240" height="150" rx="8">
    <animate calcMode="spline" keySplines="0.16 1 0.3 1;0.7 0 0.84 0" attributeName="stroke-width" values="2;4;2" dur="8s" repeatCount="indefinite" />
  </rect>
  <text class="txt" x="540" y="96">📸 快照（冻结一帧）</text>
  <text class="small" x="540" y="122">U_cell = 4.217V ↑触发</text>
  <text class="small" x="540" y="142">I = 32.4A　T = 41.2°C</text>
  <text class="small" x="540" y="162">SOC = 78%　故障码 = OVP-03</text>
  <text class="small" x="540" y="182">时间戳 = 2026-10-05 14:03:22</text>
  <text class="small" x="540" y="206">写入 Flash 快照区（双备份）</text>

  <path class="arrow" d="M 345 118 C 420 100, 460 110, 516 128" />

  
  <rect class="panel" x="40" y="256" width="720" height="60" rx="6" />
  <text class="txt" x="56" y="280">没有快照：「昨天充不进电了」→ 摊手。有快照：办公室看见事故现场那一帧。</text>
  <text class="small" x="56" y="302">五要素：触发条件 + 去抖 + 等级 + 恢复条件 + 是否锁存；故障码对外按 UDS 风格或自定义表</text>
</svg>