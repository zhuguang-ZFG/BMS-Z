<svg xmlns="http://www.w3.org/2000/svg" width="800" height="648" viewBox="0 0 800 648" role="img" aria-labelledby="ttl">
<title id="ttl">真实电阻：高频时它不再是「一个电阻」</title>
<desc>真实电阻：高频时它不再是「一个电阻」；节拍：① 低频：R 说了算——远低于 f₁ 时，蓝线与理想 1kΩ 几乎重合；② 中频：体电容 0.2pF 开始分流，阻抗按约 −20dB/dec 下坠；③ 谷底：3.6GHz 处只剩 49Ω——L 与 C 谐振，把 R 整个短路掉；④ 再往上：引线电感接管，阻抗重新爬升到 6275Ω@100GHz——元件又「变回电感」</desc>
