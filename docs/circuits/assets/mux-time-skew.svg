</style><rect class="bg" x="0" y="-156" width="800" height="796" /><text class="title" x="24" y="-128">MUX 示例：一圈 1.6 ms，首尾不是同一瞬间</text><rect class="panel" x="24" y="-112" width="752" height="100" rx="6" /><text class="txt" x="40" y="-88" opacity="1">① 16 串轮流采样，每串示意 100 µs，一圈 1.6 ms。<animate attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-66" opacity="0.28">② 这一圈里电流如果涨了 50 A，首尾不是同一瞬间。<animate attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-44" opacity="0.28">③ 1 mΩ×50 A=50 mV。第 1 串 3.700 V，第 16 串 3.650 V。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><text class="txt" x="40" y="-22" opacity="0.28">④ 把 16 个数当成同时，就会对着这 50 mV 去均衡。示意。<animate attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite" /></text><rect width="800" height="460" class="bg" />
  <text x="400" y="54" text-anchor="middle" font-size="13" class="small">每串 100 μs 是示例，不是某一颗 AFE 手册里的转换时间。</text>
  <rect x="40" y="100" width="28" height="36" class="fill-boxb stroke-b">
    <animate attributeName="x" values="48;92;136;180;224;268;312;356;400;444;488;532;576;620;664;708" keyTimes="0;0.067;0.133;0.200;0.267;0.333;0.400;0.467;0.533;0.600;0.667;0.733;0.800;0.867;0.933;1" calcMode="discrete" dur="8s" repeatCount="indefinite" />
  </rect>
