<svg xmlns="http://www.w3.org/2000/svg" width="800" height="680" viewBox="0 0 800 680">
  <title>高边驱动与自举电容动画</title>
  <rect width="800" height="680" fill="#f8fafc"/>
  <style>
  text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
  /* 深色模式：GitHub 深色主题下对调底色与文字色，只覆盖配色，不动几何与动画。
     stroke="#fff" 保持白色——那是彩色徽标上的勾选，不在覆盖范围内。 */
  @media (prefers-color-scheme: dark){
  rect[fill="#f8fafc"]{fill:#0f172a}
  rect[fill="#fff"]{fill:#1e293b}
  [fill="#f1f5f9"]{fill:#1e293b}
  [stroke="#f1f5f9"]{stroke:#1e293b}
  [fill="#e2e8f0"]{fill:#334155}
  [stroke="#e2e8f0"]{stroke:#334155}
  [fill="#cbd5e1"]{fill:#475569}
  [stroke="#cbd5e1"]{stroke:#475569}
  [fill="#64748b"]{fill:#94a3b8}
  [stroke="#64748b"]{stroke:#94a3b8}
  [fill="#475569"]{fill:#cbd5e1}
  [stroke="#475569"]{stroke:#cbd5e1}
  [fill="#334155"]{fill:#e2e8f0}
  [stroke="#334155"]{stroke:#e2e8f0}
  [fill="#1e293b"]{fill:#f1f5f9}
  [stroke="#1e293b"]{stroke:#f1f5f9}
  [fill="#dbeafe"]{fill:#1e3a8a}
  [stroke="#dbeafe"]{stroke:#1e3a8a}
  [fill="#eff6ff"]{fill:#172554}
  [stroke="#eff6ff"]{stroke:#172554}
  [fill="#bfdbfe"]{fill:#1e40af}
  [stroke="#bfdbfe"]{stroke:#1e40af}
  [fill="#1d4ed8"]{fill:#60a5fa}
  [stroke="#1d4ed8"]{stroke:#60a5fa}
  [fill="#1e40af"]{fill:#93c5fd}
  [stroke="#1e40af"]{stroke:#93c5fd}
  [fill="#2563eb"]{fill:#60a5fa}
  [stroke="#2563eb"]{stroke:#60a5fa}
  [fill="#3b82f6"]{fill:#60a5fa}
  [stroke="#3b82f6"]{stroke:#60a5fa}
  [fill="#ecfdf5"]{fill:#022c22}
  [stroke="#ecfdf5"]{stroke:#022c22}
  [fill="#a7f3d0"]{fill:#065f46}
  [stroke="#a7f3d0"]{stroke:#065f46}
  [fill="#86efac"]{fill:#166534}
  [stroke="#86efac"]{stroke:#166534}
  [fill="#065f46"]{fill:#6ee7b7}
  [stroke="#065f46"]{stroke:#6ee7b7}
  [fill="#059669"]{fill:#34d399}
  [stroke="#059669"]{stroke:#34d399}
  [fill="#fef2f2"]{fill:#450a0a}
  [stroke="#fef2f2"]{stroke:#450a0a}
  [fill="#fecaca"]{fill:#7f1d1d}
  [stroke="#fecaca"]{stroke:#7f1d1d}
  [fill="#fca5a5"]{fill:#b91c1c}
  [stroke="#fca5a5"]{stroke:#b91c1c}
  [fill="#991b1b"]{fill:#fca5a5}
  [stroke="#991b1b"]{stroke:#fca5a5}
  [fill="#dc2626"]{fill:#f87171}
  [stroke="#dc2626"]{stroke:#f87171}
  [fill="#fffbeb"]{fill:#451a03}
  [stroke="#fffbeb"]{stroke:#451a03}
  [fill="#fef3c7"]{fill:#78350f}
  [stroke="#fef3c7"]{stroke:#78350f}
  [fill="#92400e"]{fill:#fcd34d}
  [stroke="#92400e"]{stroke:#fcd34d}
  [fill="#b45309"]{fill:#fbbf24}
  [stroke="#b45309"]{stroke:#fbbf24}
  }
</style>

  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">高边开关：栅压必须顶到母线之上</text>

  <!-- 左：低边开关 -->
  <text x="200" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#065f46">低边：驱动最简单</text>
  <line x1="60" y1="90" x2="340" y2="90" stroke="#94a3b8" stroke-width="3"/>
  <text x="52" y="94" text-anchor="end" font-size="11" fill="#475569">B+</text>
  <line x1="200" y1="90" x2="200" y2="110" stroke="#94a3b8" stroke-width="2.5"/>
  <rect x="170" y="110" width="60" height="36" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="200" y="133" text-anchor="middle" font-size="11" fill="#475569">负载</text>
  <line x1="200" y1="146" x2="200" y2="160" stroke="#94a3b8" stroke-width="2.5"/>
  <rect x="170" y="160" width="60" height="60" fill="#bfdbfe" stroke="#475569" stroke-width="2">
    <animate attributeName="fill" values="#172554;#166534;#166534" keyTimes="0;0.08;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <line x1="200" y1="220" x2="200" y2="250" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="60" y1="250" x2="340" y2="250" stroke="#94a3b8" stroke-width="3"/>
  <text x="52" y="254" text-anchor="end" font-size="11" fill="#475569">GND</text>
  <rect x="80" y="165" width="60" height="34" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="110" y="187" text-anchor="middle" font-size="11" font-weight="bold" fill="#065f46">10V</text>
  <line x1="140" y1="182" x2="170" y2="190" stroke="#059669" stroke-width="2"/>
  <circle r="4" fill="#2563eb" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0.9;0.9" keyTimes="0;0.08;0.11;0.25;0.27;1" dur="12s" repeatCount="indefinite"/>
    <animateMotion path="M200,90 L200,250" keyPoints="0;0;1;1" keyTimes="0;0.08;0.25;1" calcMode="linear" dur="12s" repeatCount="indefinite"/>
  </circle>
  <text x="200" y="290" text-anchor="middle" font-size="12" fill="#065f46" opacity="0">源极接地：10V 驱动直接开
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.05;0.08;0.25;0.28;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- 右：高边开关 -->
  <text x="600" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">高边：源极浮在母线上</text>
  <line x1="460" y1="90" x2="740" y2="90" stroke="#94a3b8" stroke-width="3"/>
  <text x="452" y="94" text-anchor="end" font-size="11" fill="#475569">B+ 48V（示例）</text>
  <line x1="600" y1="90" x2="600" y2="110" stroke="#94a3b8" stroke-width="2.5"/>
  <rect x="570" y="110" width="60" height="60" fill="#bfdbfe" stroke="#475569" stroke-width="2"/>
  <line x1="600" y1="170" x2="600" y2="200" stroke="#94a3b8" stroke-width="2.5"/>
  <rect x="570" y="200" width="60" height="36" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="600" y="223" text-anchor="middle" font-size="11" fill="#475569">负载</text>
  <line x1="600" y1="236" x2="600" y2="280" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="460" y1="280" x2="740" y2="280" stroke="#94a3b8" stroke-width="3"/>
  <text x="452" y="284" text-anchor="end" font-size="11" fill="#475569">GND</text>
  <text x="648" y="150" text-anchor="start" font-size="11" fill="#334155" opacity="0">开通后 源极 ≈ 48V
    <animate attributeName="opacity" values="0;0;1;1;0.9;0.9" keyTimes="0;0.27;0.3;0.5;0.52;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- 58V 标尺：栅压要比母线还高 -->
  <line x1="460" y1="48" x2="590" y2="48" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.32;1" dur="12s" repeatCount="indefinite"/>
  </line>
  <text x="452" y="52" text-anchor="end" font-size="11" fill="#dc2626" opacity="0">58V
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.32;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <!-- 这两行与下方自举幕的 ①② 字幕同在 y≈300~350 一带，所以必须在 0.5（=6s，
       自举组开始淡入）之前就淡完，否则两幕字幕会在交接处叠字。 -->
  <text x="600" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626" opacity="0">V_G = V_S + 10V = 58V，比 B+ 还高
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.34;0.46;0.49;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="600" y="352" text-anchor="middle" font-size="11" fill="#475569" opacity="0">好处：断开时负载端彻底脱离 B+
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.34;0.46;0.49;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- 自举电容：先充电，再被源极抬上去 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.54;1" dur="12s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -190;0 -190" keyTimes="0;0.55;0.68;1" dur="12s" repeatCount="indefinite"/>
      <line x1="490" y1="240" x2="530" y2="240" stroke="#475569" stroke-width="3">
        <animate attributeName="stroke" values="#94a3b8;#94a3b8;#60a5fa;#60a5fa" keyTimes="0;0.52;0.58;1" dur="12s" repeatCount="indefinite"/>
      </line>
      <line x1="490" y1="252" x2="530" y2="252" stroke="#475569" stroke-width="3"/>
      <line x1="510" y1="228" x2="510" y2="240" stroke="#475569" stroke-width="2"/>
      <line x1="510" y1="252" x2="510" y2="264" stroke="#475569" stroke-width="2"/>
    </g>
    <text x="460" y="302" text-anchor="start" font-size="11" fill="#2563eb" opacity="0">① 先充电到 10V
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.1;0.14;1" dur="12s" repeatCount="indefinite" begin="6s"/>
    </text>
    <text x="460" y="322" text-anchor="start" font-size="11" fill="#2563eb" opacity="0">② 源极抬起，电容跟着上 48V
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.16;0.2;1" dur="12s" repeatCount="indefinite" begin="6s"/>
    </text>
    <path d="M510,50 L556,50 L556,140 L568,140" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="120" stroke-dashoffset="120">
      <animate attributeName="stroke-dashoffset" values="120;120;0;0" keyTimes="0;0.68;0.75;1" dur="12s" repeatCount="indefinite"/>
    </path>
    <text x="596" y="44" text-anchor="start" font-size="12" font-weight="bold" fill="#059669" opacity="0">栅压被顶到 58V ✓
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7;0.74;0.78;0.8;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- 代价与出路 -->
  <rect x="180" y="384" width="440" height="32" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.78;0.83;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text x="400" y="404" text-anchor="middle" font-size="12" fill="#92400e" opacity="0">自举靠循环充电：不能 100% 常开——常开主开关用电荷泵或隔离驱动
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.78;0.83;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <text x="400" y="452" text-anchor="middle" font-size="13" fill="#475569">关键：高边 N 沟道要 V_G 高过 B+；自举能省钱但不能常开，常开用电荷泵。</text>
<!-- deepened-formula --><rect x="24" y="478.0" width="752" height="188" rx="6" fill="#fff" stroke="#e2e8f0"/><text x="40" y="498.0" font-size="13" fill="#1e293b">底栏：100 nF、漏电 10 µA，每毫秒掉 0.1 V</text><text x="40" y="514.0" font-size="11" fill="#475569">Vgs 余量 V</text><line x1="70.0" y1="514.0" x2="70.0" y2="628.0" stroke="#64748b" stroke-width="1.5"/><line x1="70.0" y1="628.0" x2="460.0" y2="628.0" stroke="#64748b" stroke-width="1.5"/><line x1="70.0" y1="628.0" x2="70.0" y2="633.0" stroke="#64748b"/><text x="70.0" y="646.0" text-anchor="middle" font-size="11" fill="#475569">0</text><line x1="330.0" y1="628.0" x2="330.0" y2="633.0" stroke="#64748b"/><text x="330.0" y="646.0" text-anchor="middle" font-size="11" fill="#475569">20</text><line x1="460.0" y1="628.0" x2="460.0" y2="633.0" stroke="#64748b"/><text x="460.0" y="646.0" text-anchor="middle" font-size="11" fill="#475569">30</text><line x1="65.0" y1="536.8" x2="70.0" y2="536.8" stroke="#64748b"/><text x="62.0" y="540.8" text-anchor="end" font-size="11" fill="#475569">10</text><line x1="65.0" y1="582.4" x2="70.0" y2="582.4" stroke="#64748b"/><text x="62.0" y="586.4" text-anchor="end" font-size="11" fill="#475569">8</text><line x1="65.0" y1="605.2" x2="70.0" y2="605.2" stroke="#64748b"/><text x="62.0" y="609.2" text-anchor="end" font-size="11" fill="#475569">7</text><polyline points="70.0,536.8 79.8,538.5 89.5,540.2 99.2,541.9 109.0,543.6 118.8,545.4 128.5,547.1 138.2,548.8 148.0,550.5 157.8,552.2 167.5,553.9 177.2,555.6 187.0,557.3 196.8,559.0 206.5,560.7 216.2,562.5 226.0,564.2 235.8,565.9 245.5,567.6 255.2,569.3 265.0,571.0 274.8,572.7 284.5,574.4 294.2,576.1 304.0,577.8 313.8,579.5 323.5,581.3 333.2,583.0 343.0,584.7 352.8,586.4 362.5,588.1 372.2,589.8 382.0,591.5 391.8,593.2 401.5,594.9 411.2,596.6 421.0,598.4 430.8,600.1 440.5,601.8 450.2,603.5 460.0,605.2" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle r="5" fill="#b45309"><animate attributeName="cx" values="70.0;118.8;167.5;216.2;265.0;313.8;362.5;411.2;460.0" keyTimes="0.0000;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1.0000" dur="8s" repeatCount="indefinite"/><animate attributeName="cy" values="536.8;545.4;553.9;562.5;571.0;579.5;588.1;596.6;605.2" keyTimes="0.0000;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1.0000" dur="8s" repeatCount="indefinite"/></circle><text x="460.0" y="646.0" text-anchor="end" font-size="11" fill="#475569">开通后 ms</text><text x="480" y="556.0" font-size="12" fill="#334155">20 ms：栅压余量从 10 V 到 8 V。</text>
</svg>
