<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="参数共享合同示意">
<title>参数共享合同示意</title>
<desc>两脉冲联合拟合中共享参数与逐工况自由参数的边界</desc>
<style>
  .bg { fill: #f6f1e3; }
  .title { fill: #003153; font: 700 20px 'KaiTi','STKaiti','Noto Serif SC',serif; }
  .sub { fill: #5c6d73; font: 13px 'Noto Sans SC','Microsoft YaHei',sans-serif; }
  .lbl { fill: #4d5d63; font: 13px 'Noto Sans SC','Microsoft YaHei',sans-serif; }
  .small { fill: #4d5d63; font: 12px 'Noto Sans SC','Microsoft YaHei',sans-serif; }
  .value { fill: #003153; font: 700 18px 'Noto Sans SC','Microsoft YaHei',sans-serif; }
  .sym { fill: #003153; font: 700 19px 'KaiTi','STKaiti','Noto Serif SC',serif; }
  .share { stroke: #176b64; stroke-width: 2.6; fill: none; stroke-linecap: round; }
  .free { stroke: #8a5019; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
  .bad { stroke: #a3322a; stroke-width: 2.6; fill: none; stroke-linecap: round; }
  .box { fill: #fbf8f1; stroke: #003153; stroke-width: 2; rx: 8; }
  .bar-ok { fill: #176b64; opacity: 0.3; }
  .bar-bad { fill: #a3322a; opacity: 0.3; }
  .axis { stroke: #5c6d73; stroke-width: 1.3; }
  .halo { paint-order: stroke; stroke: #f6f1e3; stroke-width: 4; stroke-linejoin: round; }
</style>
<rect class="bg" x="0" y="0" width="800" height="420"/>
<text class="title" x="40.0" y="40.0" text-anchor="start">图 D11-F1　参数共享合同：τ 共享，K 逐工况</text>
<text class="sub" x="40.0" y="64.0" text-anchor="start">绿实线=跨工况共享；棕虚线=逐脉冲自由；K 的局部性用 160 mV 的留出差计量</text>
<rect class="box" x="120" y="110" width="180" height="56"/>
<text class="lbl" x="210.0" y="134.0" text-anchor="middle">脉冲 A（z=0.60）</text>
<text class="small" x="210.0" y="154.0" text-anchor="middle">K/A 逐脉冲自由</text>
<rect class="box" x="520" y="110" width="180" height="56"/>
<text class="lbl" x="610.0" y="134.0" text-anchor="middle">脉冲 B（z=0.40）</text>
<text class="small" x="610.0" y="154.0" text-anchor="middle">K/A 逐脉冲自由</text>
<path class="share" d="M 210 166 V 240 M 610 166 V 240 M 210 240 H 610"/>
<text class="sym" x="410.0" y="232.0" text-anchor="middle">τ = 45 s（共享）</text>
<path class="bad" d="M 300 138 H 520"/>
<text class="small" x="410.0" y="128.0" text-anchor="middle">K 直接迁移 → 留出 160 mV</text>
<text class="lbl" x="40.0" y="300.0" text-anchor="start">参数共享合同：每个参数注明共享/自由及物理理由；写不出理由默认逐工况自由</text>
<text class="lbl" x="40.0" y="330.0" text-anchor="start">边界命中报告：网格最优压在边缘 → 标记并扩网格确认，不静默当真值</text>
</svg>
