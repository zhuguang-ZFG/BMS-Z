<text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b">强制 β 越小，基流越大</text>
<text x="360" y="54" text-anchor="middle" font-size="12.5" fill="#5b666f">示意：负载 70 mA 保持不变；不把设计比值当成器件保证</text>
<text x="36" y="104" font-size="24" fill="#2a2927" text-anchor="start">IC = 70 mA</text><line x1="140" y1="130" x2="560" y2="130" stroke="#16202b" stroke-width="6" stroke-dasharray=""/><text x="140" y="388" font-size="20" fill="#2a2927" text-anchor="start">IB / mA：各行同一比例</text><line x1="140" y1="166" x2="140" y2="353" stroke="#5b666f" stroke-width="1" stroke-dasharray="3 5"/><text x="140" y="370" font-size="18" fill="#2a2927" text-anchor="middle">0</text><line x1="224" y1="166" x2="224" y2="353" stroke="#5b666f" stroke-width="1" stroke-dasharray="3 5"/><text x="224" y="370" font-size="18" fill="#2a2927" text-anchor="middle">7</text><line x1="560" y1="166" x2="560" y2="353" stroke="#5b666f" stroke-width="1" stroke-dasharray="3 5"/><text x="560" y="370" font-size="18" fill="#2a2927" text-anchor="middle">35</text>
