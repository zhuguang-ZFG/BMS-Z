<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="ui-monospace, Consolas, monospace">
  <title>绝缘故障靠近哪一端，机壳相对负极的电压就靠近那一端的电位。漏电阻远小于采样电阻时，位置分数约等于电压比。数字为示意。</title>
  <desc>亮点把漏电点从 1/4 处挪到中点，机壳电压跟着靠近那一端的电位，直线给出位置分数与电压比的对应。</desc>

  <style>
    .bg { fill: #fffdf5; }
    .panel { fill: #f7f2e5; stroke: #cfc6b2; }
    .axis { stroke: #626d65; stroke-width: 1.5; fill: none; }
    .grid { stroke: #cfc6b2; stroke-width: 1; fill: none; }
    .txt { fill: #293b3a; font-size: 13px; }
    .small { fill: #626d65; font-size: 12px; }
    .title { fill: #293b3a; font-size: 16px; font-weight: bold; }
    .hi { fill: #176b73; }
    .warn { fill: #b84745; }
    .ok { fill: #377b60; }
    .gold { fill: #926717; }
    .lineb { stroke: #176b73; stroke-width: 2.5; fill: none; }
    .liner { stroke: #b84745; stroke-width: 2.5; fill: none; }
    .lineg { stroke: #377b60; stroke-width: 2.5; fill: none; }
    .liney { stroke: #926717; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .dotb { fill: #176b73; }
    .dotr { fill: #b84745; }
    .dotg { fill: #377b60; }
    .doty { fill: #926717; }
    .boxb { fill: #e4f0df; stroke: #176b73; }
    .boxr { fill: #f6e2df; stroke: #b84745; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #192727; }
      .panel { fill: #223333; stroke: #496160; }
      .axis { stroke: #b0beb3; }
      .grid { stroke: #496160; }
      .txt { fill: #edf0e5; }
      .small { fill: #b0beb3; }
      .title { fill: #edf0e5; }
      .hi { fill: #7ec5c5; }
      .warn { fill: #f39b91; }
      .ok { fill: #8fc7a2; }
      .gold { fill: #dfbd78; }
      .lineb { stroke: #7ec5c5; }
      .liner { stroke: #f39b91; }
      .lineg { stroke: #8fc7a2; }
      .liney { stroke: #dfbd78; }
      .dotb { fill: #7ec5c5; }
      .dotr { fill: #f39b91; }
      .dotg { fill: #8fc7a2; }
      .doty { fill: #dfbd78; }
      .boxb { fill: #293f35; stroke: #7ec5c5; }
      .boxr { fill: #483336; stroke: #f39b91; }
    }
  </style>

  <!-- formula: V_neg_to_chassis = alpha * 400 when R_fault << R_sense -->
  <rect class="bg" width="800" height="500"/>
  <text class="title" x="24" y="32">电压比告诉你漏在哪一截（示意）</text>
  <rect class="panel" x="24" y="48" width="752" height="122" rx="6"/>
  <text class="txt" x="40" y="68" opacity="0.28">① 包压示意 400 V<tspan class="small">　α=0 在负极，α=1 在正极。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="1;1;0.28;0.28;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="94" opacity="0.28">② 漏在 1/4 处<tspan class="small">　负极到机壳约 100 V。点走到这里。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;1;1;0.28;0.28;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="120" opacity="0.28">③ 漏在中点<tspan class="small">　约 200 V。只有 Y 电容、两侧都很好时，也会停在中间，那时还没有位置。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1;0.7 0 0.84 0;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;1;1;0.28;0.28" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <text class="txt" x="40" y="146" opacity="0.28">④ 前提<tspan class="small">　漏电阻要远小于采样电阻，读数才贴着这根直线。否则会被采样电阻和电容往中间拉。</tspan><animate calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.16 1 0.3 1;0.42 0 0.58 1" attributeName="opacity" values="0.28;0.28;0.28;0.28;0.28;0.28;1;1" keyTimes="0;0.2490;0.2500;0.4990;0.5000;0.7490;0.7500;1" dur="12s" repeatCount="indefinite"/></text>
  <rect class="panel" x="24" y="182" width="752" height="250" rx="6"/>
  <text class="small" x="40" y="204">负极到机壳 V</text>
  <line class="axis" x1="92.0" y1="214.0" x2="92.0" y2="400.0"/>
  <line class="axis" x1="92.0" y1="400.0" x2="720.0" y2="400.0"/>
  <text class="small" x="712.0" y="418" text-anchor="end">故障离负极的分数 α</text>
  <line class="grid" x1="92.0" y1="400.0" x2="92.0" y2="406.0"/>
  <text class="small" x="92.0" y="432" text-anchor="middle">B−</text>
  <line class="grid" x1="249.0" y1="400.0" x2="249.0" y2="406.0"/>
  <text class="small" x="249.0" y="432" text-anchor="middle">0.25</text>
  <line class="grid" x1="406.0" y1="400.0" x2="406.0" y2="406.0"/>
  <text class="small" x="406.0" y="432" text-anchor="middle">0.5</text>
  <line class="grid" x1="720.0" y1="400.0" x2="720.0" y2="406.0"/>
  <text class="small" x="720.0" y="432" text-anchor="middle">B+</text>
  <line class="grid" x1="86.0" y1="400.0" x2="92.0" y2="400.0"/>
  <text class="small" x="82.0" y="404.0" text-anchor="end">0</text>
  <line class="grid" x1="86.0" y1="353.5" x2="92.0" y2="353.5"/>
  <text class="small" x="82.0" y="357.5" text-anchor="end">100</text>
  <line class="grid" x1="86.0" y1="307.0" x2="92.0" y2="307.0"/>
  <text class="small" x="82.0" y="311.0" text-anchor="end">200</text>
  <line class="grid" x1="86.0" y1="214.0" x2="92.0" y2="214.0"/>
  <text class="small" x="82.0" y="218.0" text-anchor="end">400</text>
  <polyline class="lineb" points="92.0,400.0 123.4,390.7 154.8,381.4 186.2,372.1 217.6,362.8 249.0,353.5 280.4,344.2 311.8,334.9 343.2,325.6 374.6,316.3 406.0,307.0 437.4,297.7 468.8,288.4 500.2,279.1 531.6,269.8 563.0,260.5 594.4,251.2 625.8,241.9 657.2,232.6 688.6,223.3 720.0,214.0" stroke-linejoin="round" stroke-linecap="round"/>
  <text class="hi" x="180" y="250">V ≈ α × 400 V</text>
  <circle class="doty" r="6"><animate data-ease="linear" attributeName="cx" values="92.0;170.5;249.0;327.5;406.0;484.5;563.0;641.5;720.0" keyTimes="0;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1" dur="12s" repeatCount="indefinite"/><animate data-ease="linear" attributeName="cy" values="400.0;376.8;353.5;330.2;307.0;283.8;260.5;237.2;214.0" keyTimes="0;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1" dur="12s" repeatCount="indefinite"/></circle>
  <text class="small" x="24" y="478">400 V 和这根直线是教学极限，不是绝缘监测仪的定位精度。报警门槛仍按适用标准算 Ω/V，不按这张图。</text>
</svg>
