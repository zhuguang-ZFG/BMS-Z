<svg xmlns="http://www.w3.org/2000/svg" width="800" height="550" viewBox="0 0 800 550" role="img" font-family="ui-monospace, Consolas, monospace" data-snapshot-time="11">
  <title>没充电，电量显示怎么还涨了？</title>
  <desc>教学假设：同一块 100 Ah 电池，初始剩余 50 Ah，即 50%；真实电流始终为 0 A，忽略自放电与静态耗电。电流计把 0 A 误读成 +0.1 A，正号表示充电，因此估算不断多记电量。12 小时多记 1.2 Ah，估算为 51.2%；24 小时多记 2.4 Ah，估算为 52.4%。左卡和蓝线表示真实电量，始终为 50%；右卡固定预告 24 小时后的显示结果，不表示动画当前时刻。红线表示估算从 50% 线性升至 52.4%，金点标记沿线推进的时刻。每轮动画共 12 秒，前 8 秒线性展示 0 至 24 小时，最后 4 秒停在终点；无动画时红线完整，金点位于 24 小时终点。电池半满的液面仅为电量示意，不是电芯内的真实液面。增加的是记录，不是电。</desc>
  <style>
    .bg { fill: #fffdf5; }
    .panel { fill: #f7f2e5; stroke: #cfc6b2; }
    .txt { fill: #293b3a; font-size: 20px; }
