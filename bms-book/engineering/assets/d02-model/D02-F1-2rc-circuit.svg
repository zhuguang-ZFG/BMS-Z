<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="二阶 RC 等效电路">
<title>二阶 RC 等效电路</title>
<desc>R0 加两条 R-C 极化支路的串联二端网络拓扑，标注各元件教学值与时间常数</desc>
<style>
  .bg { fill: #f6f1e3; }
  .title { fill: #003153; font: 700 20px 'KaiTi','STKaiti','Noto Serif SC',serif; }
  .sub { fill: #5c6d73; font: 13px 'Noto Sans SC','Microsoft YaHei',sans-serif; }
  .lbl { fill: #4d5d63; font: 13px 'Noto Sans SC','Microsoft YaHei',sans-serif; }
  .small { fill: #4d5d63; font: 12px 'Noto Sans SC','Microsoft YaHei',sans-serif; }
  .sym { fill: #003153; font: 700 20px 'KaiTi','STKaiti','Noto Serif SC',serif; }
  .wire { stroke: #003153; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .cmp { stroke: #8a5019; stroke-width: 2.6; fill: none; stroke-linecap: round; }
  .good { stroke: #176b64; stroke-width: 2.8; fill: none; stroke-linecap: round; }
  .node { fill: #003153; }
  .box { fill: none; stroke: #003153; stroke-width: 2; }
  .axis { stroke: #5c6d73; stroke-width: 1.3; fill: none; }
  .grid { stroke: #d9cfba; stroke-width: 0.9; fill: none; }
  .dev { stroke: #a3322a; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
  .halo { paint-order: stroke; stroke: #f6f1e3; stroke-width: 4; stroke-linejoin: round; }
</style>
<rect class="bg" x="0" y="0" width="800" height="420"/>
<text class="title" x="40.0" y="40.0" text-anchor="start">图 D02-F1　二阶 RC 等效电路（极性与 D01 一致）</text>
<text class="sub" x="40.0" y="64.0" text-anchor="start">R0 是瞬时项；两条 R∥C 串联支路分别记 vp1（慢）与 vp2（快）</text>
<circle class="node" cx="80" cy="210" r="5"/>
<text class="sym" x="64.0" y="196.0" text-anchor="middle">＋</text>
<line class="wire" x1="85" y1="210" x2="120" y2="210"/>
<path class="wire" d="M 120 210 l 8 -12 l 12 24 l 12 -24 l 12 24 l 12 -24 l 12 24 l 8 -12"/>
<line class="wire" x1="196" y1="210" x2="230" y2="210"/>
<text class="small" x="158.0" y="176.0" text-anchor="middle">R0 20 mΩ（欧姆，µs–ms）</text>
<line class="wire" x1="230" y1="210" x2="230" y2="140"/>
<line class="wire" x1="230" y1="140" x2="320" y2="140"/>
<path class="wire" d="M 320 140 l 0 14 l 60 0 l 0 -14"/>
<text class="small" x="350.0" y="128.0" text-anchor="middle">R1 15 mΩ</text>
<line class="wire" x1="320" y1="154" x2="320" y2="190"/>
<line class="wire" x1="380" y1="154" x2="380" y2="190"/>
<line class="wire" x1="314" y1="190" x2="326" y2="190"/>
<line class="wire" x1="374" y1="190" x2="386" y2="190"/>
<text class="small" x="350.0" y="202.0" text-anchor="middle">C1 3000 F（τ1 = 45 s，慢）</text>
<line class="wire" x1="320" y1="190" x2="320" y2="210"/>
<line class="wire" x1="380" y1="190" x2="380" y2="210"/>
<line class="wire" x1="230" y1="210" x2="320" y2="210"/>
<line class="wire" x1="380" y1="210" x2="470" y2="210"/>
<line class="wire" x1="470" y1="210" x2="470" y2="280"/>
<line class="wire" x1="470" y1="280" x2="560" y2="280"/>
<path class="wire" d="M 560 280 l 0 14 l 60 0 l 0 -14"/>
<text class="small" x="590.0" y="268.0" text-anchor="middle">R2 5 mΩ</text>
<line class="wire" x1="560" y1="294" x2="560" y2="330"/>
<line class="wire" x1="620" y1="294" x2="620" y2="330"/>
<line class="wire" x1="554" y1="330" x2="566" y2="330"/>
<line class="wire" x1="614" y1="330" x2="626" y2="330"/>
<text class="small" x="590.0" y="350.0" text-anchor="middle">C2 200 F（τ2 = 1 s，快）</text>
<line class="wire" x1="560" y1="330" x2="560" y2="344"/>
<line class="wire" x1="620" y1="330" x2="620" y2="344"/>
<line class="wire" x1="470" y1="344" x2="560" y2="344"/>
<line class="wire" x1="620" y1="344" x2="710" y2="344"/>
<line class="wire" x1="710" y1="210" x2="710" y2="344"/>
<line class="wire" x1="710" y1="210" x2="770" y2="210"/>
<line class="wire" x1="710" y1="344" x2="770" y2="344"/>
<rect class="box" x="770" y="194" width="70" height="32"/>
<text class="lbl" x="805.0" y="216.0" text-anchor="middle">负载 I</text>
<line class="wire" x1="840" y1="210" x2="880" y2="210"/>
<line class="wire" x1="880" y1="210" x2="880" y2="344"/>
<line class="wire" x1="880" y1="344" x2="840" y2="344"/>
<circle class="node" cx="885" cy="277" r="5"/>
<text class="small" x="906.0" y="272.0" text-anchor="start">vp1 慢支路撤载后 45 s 尺度消退；vp2 快支路 1 s 尺度——S2 看不见它，因为它没有这条支路</text>
</svg>
