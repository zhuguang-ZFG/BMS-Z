ributeName="cx" values="70.0;118.8;167.5;216.2;265.0;313.8;362.5;411.2;460.0" keyTimes="0.0000;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1.0000" dur="8s" repeatCount="indefinite" /><animate data-ease="linear" attributeName="cy" values="575.2;566.7;558.1;549.6;541.0;532.5;523.9;515.3;506.8" keyTimes="0.0000;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1.0000" dur="8s" repeatCount="indefinite" /></circle><text x="479.4" y="616.0" text-anchor="start" font-size="12" class="small">SOC %</text><text x="480" y="526.0" font-size="12" class="txt">50% 时是 3.295 V。噪声 2–5 mV 能盖住好几步。</text>
