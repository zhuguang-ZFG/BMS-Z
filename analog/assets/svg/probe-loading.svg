<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">探头是负载：测量的动作本身就会改电路</text>

<text x="270" y="50" text-anchor="middle" font-size="14" font-weight="bold" fill="#37424e">① 探头一碰上去，电路就变了</text>
<path d="M60 150 Q90.00 150.19 120 150" fill="none" stroke="#37424e" stroke-width="2.5"/>
<circle cx="120" cy="150" r="4" fill="#37424e"/>
<text x="44" y="146" font-size="11" fill="#5b666f">源</text>
<path d="M120 150 Q135.00 149.98 150 150" fill="none" stroke="#37424e" stroke-width="2.5"/>
<rect x="150" y="138" width="50" height="24" rx="3" fill="#f6eedb" stroke="#37424e" stroke-width="2.5"/>
<text x="175" y="126" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a4630f">100k</text>
<path d="M200 150 Q225.00 149.89 250 150" fill="none" stroke="#37424e" stroke-width="2.5"/>
<circle cx="250" cy="150" r="4" fill="#37424e"/>
<path d="M250 150 Q249.98 158.00 250 166" fill="none" stroke="#37424e" stroke-width="2.5"/>
<path d="M222 166 Q270.00 166.37 318 166" fill="none" stroke="#37424e" stroke-width="2.5"/>
<line x1="222" y1="166" x2="222" y2="178" stroke="#37424e" stroke-width="2.5"/>
<path d="M210 178 Q222.00 178.03 234 178" fill="none" stroke="#a8321f" stroke-width="3.5"/>
<path d="M210 190 Q222.00 190.02 234 190" fill="none" stroke="#a8321f" stroke-width="3.5"/>
<path d="M222 190 Q222.24 217.00 222 244" fill="none" stroke="#37424e" stroke-width="2.5"/>
<line x1="318" y1="166" x2="318" y2="178" stroke="#37424e" stroke-width="2.5"/>
<rect x="300" y="178" width="36" height="24" rx="3" fill="#f6eedb" stroke="#a8321f" stroke-width="2.5"/>
<path d="M318 202 Q318.13 223.00 318 244" fill="none" stroke="#37424e" stroke-width="2.5"/>
<path d="M222 244 Q270.00 244.24 318 244" fill="none" stroke="#37424e" stroke-width="2.5"/>
<path d="M270 244 Q269.95 251.00 270 258" fill="none" stroke="#37424e" stroke-width="2.5"/>
<path d="M270 258 Q269.95 265.00 270 272" fill="none" stroke="#37424e" stroke-width="2.5"/><path d="M254 272 Q270.00 272.01 286 272" fill="none" stroke="#37424e" stroke-width="3"/><path d="M260 278 Q270.00 278.02 280 278" fill="none" stroke="#37424e" stroke-width="3"/><line x1="266" y1="284" x2="274" y2="284" stroke="#37424e" stroke-width="3"/>
<text x="204" y="184" text-anchor="end" font-size="11" font-weight="bold" fill="#a8321f">100pF</text>
<text x="344" y="196" font-size="11" font-weight="bold" fill="#a8321f">1MΩ</text>
<text x="352" y="222" font-size="11" font-weight="bold" fill="#a4630f">探头</text>
<text x="300" y="140" text-anchor="end" font-size="11" font-weight="bold" fill="#1f5d7a">读到 V×0.91</text>
<rect x="40" y="296" width="380" height="86" rx="8" fill="#f6e7e1" stroke="#a8321f" stroke-width="1.5"/>
<text x="54" y="320" font-size="11.5" font-weight="bold" fill="#a8321f">×1 档：误差 9%，还想测什么？</text>
<text x="54" y="342" font-size="11" fill="#5b666f">100kΩ 源阻 + 1MΩ 探头 = 分压到 0.909</text>
<text x="54" y="362" font-size="11" fill="#5b666f">而且 100k×100pF = 10µs → fc 只剩 16kHz</text>
<text x="54" y="376" font-size="11" font-weight="bold" fill="#a8321f">高频信号直接被探头削圆</text>
<text x="440" y="320" font-size="11.5" font-weight="bold" fill="#3d6b4a">×10 档：10MΩ‖10pF</text>
<text x="440" y="342" font-size="11" fill="#5b666f">分压系数 0.990（误差 1%）</text>
<text x="440" y="362" font-size="11" fill="#5b666f">时间常数 1µs → fc 提到 159kHz</text>
<text x="440" y="382" font-size="11" font-weight="bold" fill="#3d6b4a">代价：探头电容被「等效缩小」10 倍</text>
<text x="270" y="426" text-anchor="middle" font-size="11" fill="#5b666f">Jim Williams：先问「这个测量会不会改电路」，再按下探头</text>
<path d="M60 470 Q280.00 471.30 500 470" fill="none" stroke="#c9bb9d" stroke-width="1" stroke-dasharray="6,5"/>
<text x="270" y="502" text-anchor="middle" font-size="14" font-weight="bold" fill="#37424e">② 另外两个「一按就出事」的动作</text>
<circle cx="90" cy="540" r="26" fill="#f6e7e1" stroke="#a8321f" stroke-width="2.5"/>
<text x="90" y="536" text-anchor="middle" font-size="12" font-weight="bold" fill="#a8321f">A</text>
<text x="90" y="554" text-anchor="middle" font-size="11" font-weight="bold" fill="#a8321f">表</text>
<text x="132" y="534" font-size="11.5" font-weight="bold" fill="#a8321f">电流档 = 短路</text>
<text x="132" y="554" font-size="11" fill="#5b666f">万用表电流档内阻≈0，并到电源上就是放炮</text>
<text x="132" y="574" font-size="11" font-weight="bold" fill="#a8321f">测完立刻把表笔插回电压孔</text>
<text x="420" y="536" font-size="11.5" font-weight="bold" fill="#a8321f">探头地夹 = 市电地</text>
<text x="420" y="556" font-size="11" fill="#5b666f">示波器地夹与市电共地</text>
<text x="420" y="574" font-size="11" font-weight="bold" fill="#a8321f">隔离变压器 或 差分探头，二选一</text>
<text x="270" y="604" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a4630f">上电第一次：串限流灯泡 / 恒流 50mA —— 冒烟的是灯泡，不是芯片</text>
<circle r="5" fill="#a4630f"><animateMotion dur="11s" begin="-0.3s" repeatCount="indefinite" path="M70,150 L148,150"/></circle>
<circle r="5" fill="#a4630f"><animateMotion dur="11s" begin="-0.8s" repeatCount="indefinite" path="M202,150 L248,150"/></circle>
