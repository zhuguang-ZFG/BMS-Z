<rect x="35" y="450" width="730" height="34.0" rx="9" fill="#e8efe6" stroke="#3d6b4a" stroke-width="1.5" filter="url(#soft)"/><rect x="41" y="457" width="3" height="20.0" rx="1.5" fill="#3d6b4a"/><text x="400" y="472.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3d6b4a">谐振不是「放大」——是阻抗抵消后电源只面对 R；峰顶的电压/电流可以远超激励，这就是谐振的危险与价值</text>
