<text x="52" y="58" font-size="38" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">Sallen-Key 的电容位置决定 Q 公式</text><text x="52" y="94" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">串联 R1、R2：输入 → 中间节点 X → 运放正输入 Y；下图 K=1。</text>
<text x="30" y="275" font-size="25" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">Vin</text>
<path d="M80 270 L120 270" fill="none" stroke="#16202b" stroke-width="3"/>
<path d="M120 270 L135 270" fill="none" stroke="#16202b" stroke-width="3"/><rect x="135" y="258" width="65" height="24" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/><path d="M200 270 L215 270" fill="none" stroke="#16202b" stroke-width="3"/><text x="167" y="242" font-size="23" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">R1</text>
