<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <title>背靠背 MOS 动画：为什么一颗 MOS 关不断</title>
  <rect width="800" height="400" fill="#f8fafc"/>
  <style>text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}</style>

  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">保护开关为什么必须两颗 MOS"背靠背"</text>

  <!-- 节点标签 -->
  <text x="70" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">电池 B-</text>
  <text x="730" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">对外 P-</text>

  <!-- 主回路导线 -->
  <line x1="70" y1="190" x2="210" y2="190" stroke="#334155" stroke-width="3"/>
  <line x1="350" y1="190" x2="450" y2="190" stroke="#334155" stroke-width="3"/>
  <line x1="590" y1="190" x2="730" y2="190" stroke="#334155" stroke-width="3"/>

  <!-- ============ M1 组 ============ -->
  <g>
    <animate attributeName="opacity" values="1;1;0.25;0.25" keyTimes="0;0.63;0.68;1" dur="10s" repeatCount="indefinite"/>
    <!-- 开关闭合态 -->
    <g>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.28;0.30;1" dur="10s" repeatCount="indefinite"/>
      <line x1="210" y1="190" x2="350" y2="190" stroke="#2563eb" stroke-width="4"/>
    </g>
    <!-- 开关断开态 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.30;1" dur="10s" repeatCount="indefinite"/>
      <line x1="210" y1="190" x2="338" y2="152" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    </g>
    <circle cx="210" cy="190" r="5" fill="#334155"/>
    <circle cx="350" cy="190" r="5" fill="#334155"/>
    <!-- 体二极管支路（方向：左→右） -->
    <path d="M210,190 V255 H265" fill="none" stroke="#64748b" stroke-width="2"/>
    <path d="M295,255 H350 V190" fill="none" stroke="#64748b" stroke-width="2"/>
    <polygon points="265,243 265,267 295,255" fill="#64748b"/>
    <line x1="300" y1="243" x2="300" y2="267" stroke="#64748b" stroke-width="3"/>
    <text x="280" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">M1（防充电）</text>
    <text x="280" y="318" text-anchor="middle" font-size="11" fill="#64748b">二极管方向 B-→P-</text>
  </g>

  <!-- ============ M2 组 ============ -->
  <g>
    <!-- 开关闭合态 -->
    <g>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.60;0.65;1" dur="10s" repeatCount="indefinite"/>
      <line x1="450" y1="190" x2="590" y2="190" stroke="#2563eb" stroke-width="4"/>
    </g>
    <!-- 开关断开态 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.60;0.65;1" dur="10s" repeatCount="indefinite"/>
      <line x1="450" y1="190" x2="578" y2="152" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    </g>
    <circle cx="450" cy="190" r="5" fill="#334155"/>
    <circle cx="590" cy="190" r="5" fill="#334155"/>
    <!-- 体二极管支路（方向：右→左） -->
    <path d="M590,190 V255 H535" fill="none" stroke="#64748b" stroke-width="2"/>
    <path d="M505,255 H450 V190" fill="none" stroke="#64748b" stroke-width="2"/>
    <polygon points="535,243 535,267 505,255" fill="#64748b"/>
    <line x1="500" y1="243" x2="500" y2="267" stroke="#64748b" stroke-width="3"/>
    <text x="520" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">M2（防放电）</text>
    <text x="520" y="318" text-anchor="middle" font-size="11" fill="#64748b">二极管方向 P-→B-</text>
  </g>

  <!-- P3 中 M1 位置的虚线空框 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.65;0.68;1" dur="10s" repeatCount="indefinite"/>
    <rect x="195" y="135" width="170" height="200" rx="8" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="280" y="125" text-anchor="middle" font-size="13" fill="#ef4444">假如不装 M1</text>
  </g>

  <!-- ======== 相位 1：放电，两颗都导通 ======== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.28;0.30;1" dur="10s" repeatCount="indefinite"/>
    <rect x="190" y="52" width="420" height="52" rx="8" fill="#ecfdf5" stroke="#10b981"/>
    <text x="400" y="74" text-anchor="middle" font-size="15" font-weight="bold" fill="#059669">放电：M1、M2 全部导通</text>
    <text x="400" y="93" text-anchor="middle" font-size="13" fill="#065f46">电流 B- → P- 畅通无阻</text>
    <circle r="7" fill="#f59e0b"><animateMotion dur="1.5s" begin="0s" repeatCount="indefinite" path="M90,190 H710"/></circle>
    <circle r="7" fill="#f59e0b"><animateMotion dur="1.5s" begin="0.5s" repeatCount="indefinite" path="M90,190 H710"/></circle>
    <circle r="7" fill="#f59e0b"><animateMotion dur="1.5s" begin="1.0s" repeatCount="indefinite" path="M90,190 H710"/></circle>
  </g>

  <!-- ======== 相位 2：禁充电，关 M1 ======== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.30;0.33;0.62;0.65;1" dur="10s" repeatCount="indefinite"/>
    <rect x="160" y="52" width="480" height="52" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="400" y="74" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">禁止充电：关断 M1，充电电流被阻断</text>
    <text x="400" y="93" text-anchor="middle" font-size="13" fill="#1e40af">M1 开关断开 + 其二极管方向反向 → 双重阻断</text>
    <circle r="7" fill="#2563eb"><animateMotion dur="1.2s" begin="0s" repeatCount="indefinite" path="M710,190 H365"/></circle>
    <circle r="7" fill="#2563eb"><animateMotion dur="1.2s" begin="0.6s" repeatCount="indefinite" path="M710,190 H365"/></circle>
    <g stroke="#ef4444" stroke-width="4" stroke-linecap="round">
      <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
      <line x1="330" y1="150" x2="354" y2="174"/>
      <line x1="354" y1="150" x2="330" y2="174"/>
    </g>
  </g>

  <!-- ======== 相位 3：反例，单颗关不住 ======== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.65;0.68;0.97;1" dur="10s" repeatCount="indefinite"/>
    <rect x="140" y="52" width="520" height="52" rx="8" fill="#fef2f2" stroke="#ef4444"/>
    <text x="400" y="74" text-anchor="middle" font-size="15" font-weight="bold" fill="#dc2626">假如只有 M2：关断 M2，充电电流仍从它的体二极管漏过去！</text>
    <text x="400" y="93" text-anchor="middle" font-size="13" fill="#991b1b">体二极管永远导通一个方向 —— 所以必须两颗二极管方向相反的 MOS 串联</text>
    <circle r="7" fill="#ef4444"><animateMotion dur="1.8s" begin="0s" repeatCount="indefinite" path="M710,190 H590 V255 H450 V190 H90"/></circle>
    <circle r="7" fill="#ef4444"><animateMotion dur="1.8s" begin="0.6s" repeatCount="indefinite" path="M710,190 H590 V255 H450 V190 H90"/></circle>
    <circle r="7" fill="#ef4444"><animateMotion dur="1.8s" begin="1.2s" repeatCount="indefinite" path="M710,190 H590 V255 H450 V190 H90"/></circle>
  </g>

  <text x="400" y="378" text-anchor="middle" font-size="14" fill="#475569">结论：禁充电关 M1、禁放电关 M2，两颗二极管方向相反才能双向都关断</text>
</svg>
