<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="st-t st-d">
  <title id="st-t">油表还是那只油表，油箱已经缩了</title>
  <desc id="st-d">屏幕上的 SOC 是油表读数，分母是当前满充容量；SOH 下降让油箱变小、出口变窄，所以同一个满格装下的电更少、放得也更软。</desc>
  <defs>
    <marker id="st-arrow-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path class="head-red" d="M0 0L9 4.5L0 9Z"/>
    </marker>
    <style>
      text { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #293b3a; }
      .title { font-size: 20px; font-weight: 700; }
      .h { font-size: 15px; font-weight: 700; fill: #293b3a; }
      .body { font-size: 13px; fill: #293b3a; }
      .small { font-size: 13px; fill: #626d65; }
      .tiny { font-size: 12px; fill: #626d65; }
      .muted { fill: #626d65; }
      .accent { fill: #176b73; }
      .green { fill: #377b60; }
      .red { fill: #b84745; }
      .gold { fill: #926717; }
      .paper { fill: #fffdf5; }
      .gauge { stroke: #968d77; stroke-width: 2; fill: none; }
      .needle { stroke: #b84745; stroke-width: 2.6; fill: none; stroke-linecap: round; }
      .tank { stroke: #377b60; stroke-width: 2.4; fill: none; }
      .tank2 { stroke: #926717; stroke-width: 2.4; fill: none; }
      .fuel { fill: #e4f0df; stroke: #377b60; stroke-width: 1.2; }
      .fuel2 { fill: #fbefc7; stroke: #926717; stroke-width: 1.2; }
      .strip { fill: #e4f0df; stroke: #377b60; stroke-width: 1.4; }
      .leader { stroke: #626d65; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
      .dot { fill: #176b73; }
      .head-red { fill: #b84745; }
      @media (prefers-color-scheme: dark) {
        text { fill: #edf0e5; }
        .h { fill: #edf0e5; }
        .body { fill: #edf0e5; }
        .small { fill: #b0beb3; }
        .tiny { fill: #b0beb3; }
        .muted { fill: #b0beb3; }
        .accent { fill: #7ec5c5; }
        .green { fill: #8fc7a2; }
        .red { fill: #f39b91; }
        .gold { fill: #dfbd78; }
        .paper { fill: #223333; }
        .gauge { stroke: #71908c; }
        .needle { stroke: #f39b91; }
        .tank { stroke: #8fc7a2; }
        .tank2 { stroke: #dfbd78; }
        .fuel { fill: #293f35; stroke: #8fc7a2; }
        .fuel2 { fill: #453e2b; stroke: #dfbd78; }
        .strip { fill: #293f35; stroke: #8fc7a2; }
        .leader { stroke: #b0beb3; }
        .dot { fill: #7ec5c5; }
        .head-red { fill: #f39b91; }
      }
    </style>
  </defs>

  <rect class="paper" x="0" y="0" width="960" height="560"/>

  <text x="480" y="34" text-anchor="middle" class="title">油表还是那只油表，油箱已经缩了</text>
  <text x="480" y="60" text-anchor="middle" class="small">SOC 看还剩多少，SOH 看油箱还能装多少</text>

  <path d="M390 170A90 90 0 0 1 570 170" class="gauge"/>
  <path d="M390 170H402" class="gauge"/>
  <path d="M416 106L425 115" class="gauge"/>
  <path d="M480 80V92" class="gauge"/>
  <path d="M544 106L535 115" class="gauge"/>
  <path d="M570 170H558" class="gauge"/>
  <path d="M480 170V92" class="needle"/>
  <circle cx="480" cy="170" r="5" class="dot"/>
  <text x="494" y="104" class="small red">满</text>
  <text x="480" y="198" text-anchor="middle" class="h">屏幕上的 SOC</text>
  <text x="480" y="218" text-anchor="middle" class="small">同一只表，同一个满格</text>

  <path d="M420 230L225 250" class="leader"/>
  <circle cx="225" cy="250" r="4" class="dot"/>
  <path d="M540 230L720 300" class="leader"/>
  <circle cx="720" cy="300" r="4" class="dot"/>

  <rect class="tank" x="110" y="250" width="230" height="160" rx="16"/>
  <rect class="fuel" x="114" y="300" width="222" height="106" rx="10"/>
  <text x="225" y="240" text-anchor="middle" class="h green">出厂时</text>
  <text x="225" y="356" text-anchor="middle" class="small green">满格</text>
  <text x="225" y="430" text-anchor="middle" class="small">油箱大</text>

  <rect class="tank2" x="620" y="300" width="200" height="110" rx="14"/>
  <rect class="fuel2" x="624" y="340" width="192" height="66" rx="8"/>
  <text x="720" y="282" text-anchor="middle" class="h gold">现在</text>
  <text x="720" y="380" text-anchor="middle" class="small gold">满格</text>
  <text x="632" y="432" text-anchor="start" class="small">油箱缩了</text>

  <path d="M720 410V440" class="tank2"/>
  <path d="M706 440H734" class="tank2"/>
  <path d="M712 440V466" class="tank2"/>
  <path d="M728 440V466" class="tank2"/>
  <text x="746" y="458" class="tiny gold">出口变窄</text>
  <text x="746" y="478" class="tiny gold">内阻变大，放得更软</text>

  <text x="110" y="474" class="small">SOH 缩水：油箱变小，出口变窄</text>

  <rect class="strip" x="80" y="490" width="800" height="40" rx="12"/>
  <text x="480" y="515" text-anchor="middle" class="h green">SOC 的分母是当前满充容量；SOH 缩水，满格也变少</text>

  <text x="480" y="548" text-anchor="middle" class="tiny">示意图：容量缩水与内阻上升，不是某颗电芯的实测</text>
</svg>
