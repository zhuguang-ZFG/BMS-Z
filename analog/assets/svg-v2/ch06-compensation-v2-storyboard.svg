<text x="26" y="704" font-size="20" fill="#2a2927" text-anchor="start">1. 30 pF：GBW 1 MHz，SR 0.5 V/µs。</text>
<text x="26" y="736" font-size="20" fill="#2a2927" text-anchor="start">2. 保持 gm 与 15 µA 电流，逐渐加大电容。</text>
<text x="26" y="768" font-size="20" fill="#2a2927" text-anchor="start">3. 60 pF：带宽与斜率都降为原来一半。</text>
<text x="26" y="800" font-size="20" fill="#2a2927" text-anchor="start">4. 稳定性还要查其余极点与负载，不能只看 Cc。</text>
<text x="26" y="865" font-size="18" fill="#2a2927" text-anchor="start">示意：固定跨导与可用充电电流；简化两级模型，不代表任意运放。</text>
</svg>