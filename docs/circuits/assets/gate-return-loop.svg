<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460">
  <title>栅极回流对照：回流就近包住驱动和源极；绕到板子另一头的大环路会拖慢关断。示意图，不是驱动器手册波形。</title>
  <rect width="800" height="460" fill="#f8fafc"/>
  <style>
  text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
  /* 深色模式：GitHub 深色主题下对调底色与文字色，只覆盖配色，不动几何与动画。
     stroke="#fff" 保持白色——那是彩色徽标上的勾选，不在覆盖范围内。 */
  @media (prefers-color-scheme: dark){
  rect[fill="#f8fafc"]{fill:#0f172a}
  rect[fill="#fff"]{fill:#1e293b}
  [fill="#f1f5f9"]{fill:#1e293b}
  [stroke="#f1f5f9"]{stroke:#1e293b}
  [fill="#e2e8f0"]{fill:#334155}
  [stroke="#e2e8f0"]{stroke:#334155}
  [fill="#cbd5e1"]{fill:#475569}
  [stroke="#cbd5e1"]{stroke:#475569}
  [fill="#64748b"]{fill:#94a3b8}
  [stroke="#64748b"]{stroke:#94a3b8}
  [fill="#475569"]{fill:#cbd5e1}
  [stroke="#475569"]{stroke:#cbd5e1}
  [fill="#334155"]{fill:#e2e8f0}
  [stroke="#334155"]{stroke:#e2e8f0}
  [fill="#1e293b"]{fill:#f1f5f9}
  [stroke="#1e293b"]{stroke:#f1f5f9}
  [fill="#dbeafe"]{fill:#1e3a8a}
  [stroke="#dbeafe"]{stroke:#1e3a8a}
  [fill="#eff6ff"]{fill:#172554}
  [stroke="#eff6ff"]{stroke:#172554}
  [fill="#bfdbfe"]{fill:#1e40af}
  [stroke="#bfdbfe"]{stroke:#1e40af}
  [fill="#1d4ed8"]{fill:#60a5fa}
  [stroke="#1d4ed8"]{stroke:#60a5fa}
  [fill="#1e40af"]{fill:#93c5fd}
  [stroke="#1e40af"]{stroke:#93c5fd}
  [fill="#2563eb"]{fill:#60a5fa}
  [stroke="#2563eb"]{stroke:#60a5fa}
  [fill="#3b82f6"]{fill:#60a5fa}
  [stroke="#3b82f6"]{stroke:#60a5fa}
  [fill="#ecfdf5"]{fill:#022c22}
  [stroke="#ecfdf5"]{stroke:#022c22}
  [fill="#a7f3d0"]{fill:#065f46}
  [stroke="#a7f3d0"]{stroke:#065f46}
  [fill="#86efac"]{fill:#166534}
  [stroke="#86efac"]{stroke:#166534}
  [fill="#065f46"]{fill:#6ee7b7}
  [stroke="#065f46"]{stroke:#6ee7b7}
  [fill="#059669"]{fill:#34d399}
  [stroke="#059669"]{stroke:#34d399}
  [fill="#fef2f2"]{fill:#450a0a}
  [stroke="#fef2f2"]{stroke:#450a0a}
  [fill="#fecaca"]{fill:#7f1d1d}
  [stroke="#fecaca"]{stroke:#7f1d1d}
  [fill="#fca5a5"]{fill:#b91c1c}
  [stroke="#fca5a5"]{stroke:#b91c1c}
  [fill="#991b1b"]{fill:#fca5a5}
  [stroke="#991b1b"]{stroke:#fca5a5}
  [fill="#dc2626"]{fill:#f87171}
  [stroke="#dc2626"]{stroke:#f87171}
  [fill="#fffbeb"]{fill:#451a03}
  [stroke="#fffbeb"]{stroke:#451a03}
  [fill="#fef3c7"]{fill:#78350f}
  [stroke="#fef3c7"]{stroke:#78350f}
  [fill="#92400e"]{fill:#fcd34d}
  [stroke="#92400e"]{stroke:#fcd34d}
  [fill="#b45309"]{fill:#fbbf24}
  [stroke="#b45309"]{stroke:#fbbf24}
  }
</style>

  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">栅极回路：回流就近，还是绕全板</text>
  <text x="400" y="54" text-anchor="middle" font-size="13" fill="#475569">示意图。环路面积决定关断时的电感和振铃，不是某颗驱动器的手册波形。</text>
  <rect x="36" y="78" width="350" height="250" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="211" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#065f46">对：栅极电阻旁就近回源极</text>
  <rect x="150" y="160" width="70" height="50" fill="#fff" stroke="#334155"/>
  <text x="185" y="190" text-anchor="middle" font-size="12" fill="#1e293b">MOS</text>
  <path d="M120 150 h40 v-20 h50 v50" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="80" stroke-dashoffset="80">
    <animate attributeName="stroke-dashoffset" values="80;0;0" keyTimes="0;0.45;1" dur="4s" repeatCount="indefinite"/>
  </path>
  <path d="M185 210 v30 h-70 v-70" fill="none" stroke="#059669" stroke-width="2"/>
  <text x="211" y="280" text-anchor="middle" font-size="13" fill="#065f46">回路只包住驱动和源极</text>
  <rect x="414" y="78" width="350" height="250" rx="8" fill="#fef2f2" stroke="#dc2626">
    <animate attributeName="stroke-width" values="2;5;2" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="589" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">错：回流绕到板子另一头</text>
  <rect x="520" y="160" width="70" height="50" fill="#fff" stroke="#334155"/>
  <text x="555" y="190" text-anchor="middle" font-size="12" fill="#1e293b">MOS</text>
  <path d="M470 140 h220 v120 h-180 v-70" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="120" stroke-dashoffset="120">
    <animate attributeName="stroke-dashoffset" values="120;0;0" keyTimes="0;0.6;1" dur="4s" repeatCount="indefinite"/>
  </path>
  <text x="589" y="280" text-anchor="middle" font-size="13" fill="#991b1b">大环路把关断拖出短路窗口</text>
  <text x="400" y="370" text-anchor="middle" font-size="14" fill="#1e293b">μs 级短路保护要的是小回路，不是更细的栅极走线。</text>
  <text x="400" y="410" text-anchor="middle" font-size="13" fill="#475569">驱动芯片、栅极电阻、源极引脚放在同一小块铜上。</text>

</svg>
