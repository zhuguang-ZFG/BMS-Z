<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420">
  <title>电池 HIL 实验台场景示意图</title>
  <rect width="880" height="420" fill="#f8fafc"/>
  <style>
  text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
  @media (prefers-color-scheme: dark){
  rect[fill="#f8fafc"]{fill:#0f172a}
  rect[fill="#fff"]{fill:#1e293b}
  [fill="#e2e8f0"]{fill:#334155}
  [stroke="#e2e8f0"]{stroke:#334155}
  [fill="#334155"]{fill:#e2e8f0}
  [stroke="#334155"]{stroke:#e2e8f0}
  [fill="#1e293b"]{fill:#f1f5f9}
  [stroke="#1e293b"]{stroke:#f1f5f9}
  [fill="#dbeafe"]{fill:#1e3a8a}
  [stroke="#dbeafe"]{stroke:#1e3a8a}
  [fill="#1d4ed8"]{fill:#60a5fa}
  [stroke="#1d4ed8"]{stroke:#60a5fa}
  [fill="#ecfdf5"]{fill:#022c22}
  [fill="#059669"]{fill:#34d399}
  [stroke="#059669"]{stroke:#34d399}
  [fill="#fffbeb"]{fill:#451a03}
  [fill="#fef3c7"]{fill:#78350f}
  [fill="#b45309"]{fill:#fbbf24}
  [stroke="#b45309"]{stroke:#fbbf24}
  [fill="#fef2f2"]{fill:#450a0a}
  [fill="#fecaca"]{fill:#7f1d1d}
  [fill="#dc2626"]{fill:#f87171}
  [stroke="#dc2626"]{stroke:#f87171}
  }
  </style>

  <text x="440" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">电池 HIL 台：电芯模拟器、注入、被测包</text>
  <text x="440" y="50" text-anchor="middle" font-size="13" fill="#b45309">示意图·待实拍</text>
  <rect x="24" y="78" width="190" height="130" rx="8" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="119" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">可编程电源</text>
  <text x="119" y="136" text-anchor="middle" font-size="12" fill="#334155">每串一个浮地电压</text>
  <text x="119" y="158" text-anchor="middle" font-size="12" fill="#334155">代替真电芯</text>
  <rect x="238" y="78" width="190" height="130" rx="8" fill="#fffbeb" stroke="#b45309"/>
  <text x="333" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">故障注入</text>
  <text x="333" y="136" text-anchor="middle" font-size="12" fill="#334155">断采样线、短 NTC</text>
  <text x="333" y="158" text-anchor="middle" font-size="12" fill="#334155">停掉一路电压</text>
  <rect x="452" y="78" width="190" height="130" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="547" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">被测 BMS</text>
  <text x="547" y="136" text-anchor="middle" font-size="12" fill="#334155">跑真实固件</text>
  <text x="547" y="158" text-anchor="middle" font-size="12" fill="#334155">看去抖和快照</text>
  <rect x="666" y="78" width="190" height="130" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="761" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">上位机</text>
  <text x="761" y="136" text-anchor="middle" font-size="12" fill="#334155">对清单逐项判定</text>
  <text x="761" y="158" text-anchor="middle" font-size="12" fill="#334155">记下第一现场</text>
  <circle cy="143" r="6" fill="#1d4ed8">
    <animate attributeName="cx" values="119;333;547;761;119" keyTimes="0;0.3;0.6;0.85;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <text x="24" y="246" font-size="14" fill="#1e293b">1985 年的模拟计算机局部不是这张台子，所以没有收那张照片。</text>
  <text x="24" y="274" font-size="14" fill="#334155">PC 上的 hil_replay 只喂脚本电压，没有机架，也没有开线检测。</text>
  <text x="24" y="302" font-size="14" fill="#dc2626">不要对真电池做短路或过充注入。蓝点沿模拟器、注入、被测板、上位机走。</text>

</svg>
