<animate attributeName="opacity" values="0;0.9;0" dur="2.2s" repeatCount="indefinite"/></polygon>
<path d="M408 76 Q408.06 318.00 408 560" fill="none" stroke="#c9bb9d" stroke-width="1" stroke-dasharray="6,5"/>
<text x="590" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#37424e">异常读数 → 故障定位</text>
<rect x="420" y="112" width="348" height="70" rx="8" fill="#f6eedb" stroke="#a8321f" stroke-width="1.6"/><text x="434" y="136" font-size="12" font-weight="bold" fill="#a8321f">V_BE = 0V</text><text x="434" y="156" font-size="11" fill="#5b666f">→ 发射结开路 / 基极电阻虚焊</text><text x="434" y="174" font-size="10.5" font-weight="bold" fill="#37424e">动作：查 R_B 焊点与管子 B-E 通断</text><rect x="420" y="188" width="348" height="70" rx="8" fill="#f6eedb" stroke="#a4630f" stroke-width="1.6"/><text x="434" y="212" font-size="12" font-weight="bold" fill="#a4630f">V_BE = 0.7V，但 V_C ≈ +12V</text><text x="434" y="232" font-size="11" fill="#5b666f">→ 集电结开路 / R_C 虚焊（无电流）</text><text x="434" y="250" font-size="10.5" font-weight="bold" fill="#37424e">动作：测 R_C 两端压差；断电测集电极回路</text><rect x="420" y="264" width="348" height="70" rx="8" fill="#f6eedb" stroke="#6b3f63" stroke-width="1.6"/><text x="434" y="288" font-size="12" font-weight="bold" fill="#6b3f63">V_BE = 0.7V，但 V_C ≈ 0.2V</text><text x="434" y="308" font-size="11" fill="#5b666f">→ 管子已饱和（基极电流过大）</text><text x="434" y="326" font-size="10.5" font-weight="bold" fill="#37424e">动作：加大 R_B 或查负载是否短路</text><rect x="420" y="340" width="348" height="70" rx="8" fill="#f6eedb" stroke="#1f5d7a" stroke-width="1.6"/><text x="434" y="364" font-size="12" font-weight="bold" fill="#1f5d7a">V_B ≈ 0V</text><text x="434" y="384" font-size="11" fill="#5b666f">→ 基极回路断（R_B 开路/驱动没输出）</text><text x="434" y="402" font-size="10.5" font-weight="bold" fill="#37424e">动作：测 R_B 左侧（驱动端）有没有电平</text><rect x="420" y="416" width="348" height="70" rx="8" fill="#f6eedb" stroke="#2f7f96" stroke-width="1.6"/><text x="434" y="440" font-size="12" font-weight="bold" fill="#2f7f96">V_E > V_B</text><text x="434" y="460" font-size="11" fill="#5b666f">→ 管子未导通（V_BE 反偏）/ 装反</text><text x="434" y="478" font-size="10.5" font-weight="bold" fill="#37424e">动作：查极性：NPN 还是 PNP？</text><rect x="420" y="492" width="348" height="70" rx="8" fill="#f6eedb" stroke="#3d6b4a" stroke-width="1.6"/><text x="434" y="516" font-size="12" font-weight="bold" fill="#3d6b4a">三个电压都对但发热</text><text x="434" y="536" font-size="11" fill="#5b666f">→ 功耗问题，非电气故障</text><text x="434" y="554" font-size="10.5" font-weight="bold" fill="#37424e">动作：核算 P=V_CE·I_C vs 散热能力</text>
<text x="200" y="330" font-size="12" font-weight="bold" fill="#a4630f">记忆法：把三个电压当「三个人」</text>
<text x="60" y="358" font-size="11" fill="#5b666f">B 是「咽喉」：必须比 E 高 0.7V，否则没开</text>
<text x="60" y="382" font-size="11" fill="#5b666f">E 是「地线延伸」：直耦时贴地，抬高=发射极电阻太大</text>
<text x="60" y="406" font-size="11" fill="#5b666f">C 是「结果」：高=没电流，低=饱和了</text>
<rect x="60" y="430" width="300" height="110" rx="8" fill="#f7eedb" stroke="#a4630f" stroke-width="1.6"/>
<text x="76" y="456" font-size="11.5" font-weight="bold" fill="#a4630f">为什么先量电压、不先拆管子？</text>
<text x="76" y="480" font-size="11" fill="#5b666f">拆焊一次就有损伤风险（尤其多层板），</text>
<text x="76" y="500" font-size="11" fill="#5b666f">而三个电压在线 30 秒就能测完，</text>
<text x="76" y="520" font-size="11" font-weight="bold" fill="#a8321f">能定向到「哪个回路」，再动手。</text>
