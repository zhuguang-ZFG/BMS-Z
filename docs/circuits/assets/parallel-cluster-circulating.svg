<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470">
  <title>并簇环流动画</title>
  <rect width="800" height="470" fill="#f8fafc"/>
  <style>
  text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
  /* 深色模式：GitHub 深色主题下对调底色与文字色，只覆盖配色，不动几何与动画。
     stroke="#fff" 保持白色——那是彩色徽标上的勾选，不在覆盖范围内。 */
  @media (prefers-color-scheme: dark){
  rect[fill="#f8fafc"]{fill:#0f172a}
  rect[fill="#fff"]{fill:#1e293b}
  [fill="#f1f5f9"]{fill:#1e293b}
  [stroke="#f1f5f9"]{stroke:#1e293b}
  [fill="#e2e8f0"]{fill:#334155}
  [stroke="#e2e8f0"]{stroke:#334155}
  [fill="#cbd5e1"]{fill:#475569}
  [stroke="#cbd5e1"]{stroke:#475569}
  [fill="#64748b"]{fill:#94a3b8}
  [stroke="#64748b"]{stroke:#94a3b8}
  [fill="#475569"]{fill:#cbd5e1}
  [stroke="#475569"]{stroke:#cbd5e1}
  [fill="#334155"]{fill:#e2e8f0}
  [stroke="#334155"]{stroke:#e2e8f0}
  [fill="#1e293b"]{fill:#f1f5f9}
  [stroke="#1e293b"]{stroke:#f1f5f9}
  [fill="#dbeafe"]{fill:#1e3a8a}
  [stroke="#dbeafe"]{stroke:#1e3a8a}
  [fill="#eff6ff"]{fill:#172554}
  [stroke="#eff6ff"]{stroke:#172554}
  [fill="#bfdbfe"]{fill:#1e40af}
  [stroke="#bfdbfe"]{stroke:#1e40af}
  [fill="#1d4ed8"]{fill:#60a5fa}
  [stroke="#1d4ed8"]{stroke:#60a5fa}
  [fill="#1e40af"]{fill:#93c5fd}
  [stroke="#1e40af"]{stroke:#93c5fd}
  [fill="#2563eb"]{fill:#60a5fa}
  [stroke="#2563eb"]{stroke:#60a5fa}
  [fill="#3b82f6"]{fill:#60a5fa}
  [stroke="#3b82f6"]{stroke:#60a5fa}
  [fill="#ecfdf5"]{fill:#022c22}
  [stroke="#ecfdf5"]{stroke:#022c22}
  [fill="#a7f3d0"]{fill:#065f46}
  [stroke="#a7f3d0"]{stroke:#065f46}
  [fill="#86efac"]{fill:#166534}
  [stroke="#86efac"]{stroke:#166534}
  [fill="#065f46"]{fill:#6ee7b7}
  [stroke="#065f46"]{stroke:#6ee7b7}
  [fill="#059669"]{fill:#34d399}
  [stroke="#059669"]{stroke:#34d399}
  [fill="#fef2f2"]{fill:#450a0a}
  [stroke="#fef2f2"]{stroke:#450a0a}
  [fill="#fecaca"]{fill:#7f1d1d}
  [stroke="#fecaca"]{stroke:#7f1d1d}
  [fill="#fca5a5"]{fill:#b91c1c}
  [stroke="#fca5a5"]{stroke:#b91c1c}
  [fill="#991b1b"]{fill:#fca5a5}
  [stroke="#991b1b"]{stroke:#fca5a5}
  [fill="#dc2626"]{fill:#f87171}
  [stroke="#dc2626"]{stroke:#f87171}
  [fill="#fffbeb"]{fill:#451a03}
  [stroke="#fffbeb"]{stroke:#451a03}
  [fill="#fef3c7"]{fill:#78350f}
  [stroke="#fef3c7"]{stroke:#78350f}
  [fill="#92400e"]{fill:#fcd34d}
  [stroke="#92400e"]{stroke:#fcd34d}
  [fill="#b45309"]{fill:#fbbf24}
  [stroke="#b45309"]{stroke:#fbbf24}
  }
</style>

  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">并簇环流：压差直接落在毫欧级回路上</text>

  <!-- 两簇电池 -->
  <rect x="150" y="120" width="160" height="100" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="230" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46">簇A</text>
  <text x="230" y="182" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46">52.0V</text>
  <rect x="490" y="120" width="160" height="100" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="570" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46">簇B</text>
  <text x="570" y="182" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">50.5V
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.55;0.58;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="570" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46" opacity="0">51.8V（已拉平）
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6;0.64;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="400" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626" opacity="0">ΔV = 1.5V（示例）
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.08;0.12;0.44;0.48;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- 母线、主接触器、负载 -->
  <line x1="310" y1="160" x2="385" y2="160" stroke="#475569" stroke-width="4"/>
  <line x1="415" y1="160" x2="700" y2="160" stroke="#475569" stroke-width="4"/>
  <rect x="680" y="140" width="60" height="40" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="710" y="165" text-anchor="middle" font-size="11" fill="#475569">负载</text>
  <line x1="385" y1="160" x2="415" y2="160" stroke="#059669" stroke-width="3.5" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0;1;1" keyTimes="0;0.2;0.24;0.46;0.5;0.62;0.66;1" dur="12s" repeatCount="indefinite"/>
  </line>
  <line x1="385" y1="160" x2="411" y2="146" stroke="#64748b" stroke-width="3.5">
    <animate attributeName="opacity" values="1;1;0;0;1;1;0;0" keyTimes="0;0.2;0.24;0.46;0.5;0.62;0.66;1" dur="12s" repeatCount="indefinite"/>
  </line>
  <!-- 标注挪到母线下方：原来在 y=138，与第③幕「限流电阻」框内标注（x=370..430,
       y=113..137）实测重叠 41×5px——两者都在 t≈6.1s 同时全不透明。母线与簇体下沿
       之间（y=160..220）是空白区，放这里既不碰限流电阻，也仍紧贴它标注的那个开关。 -->
  <text x="400" y="188" text-anchor="middle" font-size="12" fill="#475569">并联接触器</text>

  <!-- 负极回路 -->
  <line x1="230" y1="220" x2="230" y2="260" stroke="#475569" stroke-width="3"/>
  <line x1="570" y1="220" x2="570" y2="260" stroke="#475569" stroke-width="3"/>
  <line x1="230" y1="260" x2="710" y2="260" stroke="#475569" stroke-width="3"/>
  <line x1="710" y1="180" x2="710" y2="260" stroke="#475569" stroke-width="3"/>

  <!-- ② 直接合闸：环流在包间对冲 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.22;0.26;0.44;0.48;1" dur="12s" repeatCount="indefinite"/>
    <path d="M310,160 L570,160 L570,180 L570,260 L230,260 L230,180" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 5"/>
    <circle r="5" fill="#dc2626">
      <animateMotion path="M310,160 L570,160 L570,260 L230,260 L230,180 L230,160 L310,160" keyPoints="0;0;1;1" keyTimes="0;0.22;0.46;1" calcMode="linear" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="#dc2626">
      <animateMotion path="M310,160 L570,160 L570,260 L230,260 L230,180 L230,160 L310,160" keyPoints="0;0;1;1" keyTimes="0;0.22;0.46;1" calcMode="linear" dur="12s" repeatCount="indefinite" begin="-1.2s"/>
    </circle>
    <circle r="5" fill="#dc2626">
      <animateMotion path="M310,160 L570,160 L570,260 L230,260 L230,180 L230,160 L310,160" keyPoints="0;0;1;1" keyTimes="0;0.22;0.46;1" calcMode="linear" dur="12s" repeatCount="indefinite" begin="-2.4s"/>
    </circle>
    <rect x="383" y="146" width="34" height="28" fill="#dc2626" opacity="0.3">
      <animate attributeName="opacity" values="0.15;0.45;0.15;0.45;0.15" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <text x="400" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc2626">环流 ≈ 300A（示例）：不过负载，只在两包之间对冲</text>
    <text x="400" y="322" text-anchor="middle" font-size="11" fill="#dc2626">ΔV 1.5V ÷ 回路 5mΩ（内阻+线束，示例）</text>
  </g>

  <!-- ③ 正确做法：先比压，限流拉平，再合闸 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.48;0.52;1" dur="12s" repeatCount="indefinite"/>
    <path d="M340,160 L340,125 L460,125 L460,160" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <rect x="370" y="113" width="60" height="24" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <text x="400" y="130" text-anchor="middle" font-size="12" fill="#92400e">限流电阻</text>
    <circle r="4" fill="#f59e0b">
      <animateMotion path="M340,160 L340,125 L460,125 L460,160" keyPoints="0;0;1;1" keyTimes="0;0.52;0.62;1" calcMode="linear" dur="12s" repeatCount="indefinite"/>
    </circle>
    <text x="400" y="84" text-anchor="middle" font-size="12" fill="#b45309">先比压：压差超限禁止并机；用限流电阻/DC/DC 拉平再合闸</text>
  </g>

  <!-- ④ 运行中按簇降额 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.72;0.76;1" dur="12s" repeatCount="indefinite"/>
    <text x="400" y="340" text-anchor="middle" font-size="12" fill="#334155">运行中：电流分配不均，弱簇先到保护边界 → 按簇降额，不按总包</text>
    <rect x="150" y="360" width="96" height="16" fill="#f59e0b"/>
    <rect x="490" y="360" width="64" height="16" fill="#f59e0b" opacity="0.7"/>
    <text x="254" y="373" text-anchor="start" font-size="12" fill="#b45309">簇A 出力 60%（示例）</text>
    <text x="562" y="373" text-anchor="start" font-size="12" fill="#b45309">簇B 40%</text>
  </g>

  <text x="400" y="452" text-anchor="middle" font-size="13" fill="#475569">关键：并机先比压，压差先拉平；运行按簇降额——环流不过负载，却烧接触器和线束。</text>
</svg>
