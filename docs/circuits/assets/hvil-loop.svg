  <polyline class="lineg" points="108.0,248.0 114.9,248.0 121.8,248.0 128.6,248.0 135.5,248.0 142.4,248.0 149.3,248.0 156.1,248.0 163.0,248.0 169.9,248.0 176.8,248.0 183.6,248.0 190.5,248.0 197.4,248.0 204.3,248.0 211.1,248.0 218.0,248.0 224.9,248.0 231.8,248.0 238.7,248.0 245.5,248.0 252.4,248.0 259.3,248.0 266.2,248.0 273.0,248.0 279.9,248.0 286.8,248.0 293.7,248.0 300.5,248.0 307.4,248.0 314.3,248.0 321.2,248.0 328.0,248.0 334.9,248.0 341.8,248.0 348.7,248.0 355.6,248.0 362.4,248.0 369.3,248.0 376.2,248.0 383.1,248.0 389.9,248.0 396.8,248.0 403.7,248.0 410.6,400.0 417.4,400.0 424.3,400.0 431.2,400.0 438.1,400.0 444.9,400.0 451.8,400.0 458.7,400.0 465.6,400.0 472.4,400.0 479.3,400.0 486.2,400.0 493.1,400.0 500.0,400.0 506.8,400.0 513.7,400.0 520.6,400.0 527.5,400.0 534.3,400.0 541.2,400.0 548.1,400.0 555.0,400.0 561.8,400.0 568.7,400.0 575.6,400.0 582.5,400.0 589.3,400.0 596.2,400.0 603.1,400.0 610.0,400.0 616.9,400.0 623.7,400.0 630.6,400.0 637.5,400.0 644.4,400.0 651.2,400.0 658.1,400.0 665.0,400.0 671.9,400.0 678.7,400.0 685.6,400.0 692.5,400.0 699.4,400.0 706.2,400.0 713.1,400.0 720.0,400.0" stroke-linejoin="round" stroke-linecap="round"/>
