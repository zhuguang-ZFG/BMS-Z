<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">CTRL 改变门限，频率响应不是直线</title>
<desc id="figDesc">示意：示意 9 V、RA=1 kΩ、RB=6.8 kΩ、C=100 nF，理想放电。</desc>
