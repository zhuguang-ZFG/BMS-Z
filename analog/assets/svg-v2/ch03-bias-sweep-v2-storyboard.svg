<text x="110" y="78" font-size="20" fill="#a8321f" text-anchor="start">实线：固定偏置</text>
<text x="390" y="78" font-size="20" fill="#1f5d7a" text-anchor="start">虚线：分压偏置</text>
<text x="36" y="404" font-size="22" fill="#2a2927" text-anchor="start">③ 同一组 β，分别代入两种电路</text>
<text x="36" y="442" font-size="20" fill="#2a2927" text-anchor="start">β</text>
<text x="240" y="442" font-size="20" fill="#a8321f" text-anchor="start">固定偏置 / mA</text>
<text x="470" y="442" font-size="20" fill="#1f5d7a" text-anchor="start">分压偏置 / mA</text>
<text x="36" y="478" font-size="20" fill="#2a2927" text-anchor="start">100</text>
<text x="240" y="478" font-size="20" fill="#a8321f" text-anchor="start">1.000</text>
<text x="470" y="478" font-size="20" fill="#1f5d7a" text-anchor="start">0.866</text>
<text x="36" y="513" font-size="20" fill="#2a2927" text-anchor="start">300</text>
<text x="240" y="513" font-size="20" fill="#a8321f" text-anchor="start">3.000</text>
<text x="470" y="513" font-size="20" fill="#1f5d7a" text-anchor="start">0.908</text>
<text x="36" y="548" font-size="20" fill="#2a2927" text-anchor="start">600</text>
<text x="240" y="548" font-size="20" fill="#a8321f" text-anchor="start">5.900</text>
<text x="470" y="548" font-size="20" fill="#1f5d7a" text-anchor="start">0.919</text>
<text x="36" y="597" font-size="20" fill="#2a2927" text-anchor="start">④ 饱和不是 β 放大：固定偏置在 5.9 mA 截止增长。</text>
<text x="36" y="635" font-size="18" fill="#2a2927" text-anchor="start">12 V；RB 1.13 MΩ，RC 2 kΩ；VBE 0.7 V，VCEsat 0.2 V。</text>
<text x="36" y="670" font-size="18" fill="#2a2927" text-anchor="start">分压：R1 51 kΩ，R2 9.1 kΩ，RE 1.2 kΩ。</text>
<text x="36" y="706" font-size="20" fill="#2a2927" text-anchor="start">IC = β (VTH − VBE) / [RTH + (β + 1) RE]</text>
<text x="36" y="746" font-size="20" fill="#2a2927" text-anchor="start">示意模型先算 β 漂移，再另算温漂、容差与摆幅。</text>
</svg>