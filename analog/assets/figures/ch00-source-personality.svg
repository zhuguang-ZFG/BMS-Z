<text x="788" y="216" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="14" fill="#52606d">负载串联</text>

<text x="518" y="360" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="17" fill="#14213d">同一股水流穿过所有负载</text>
<path d="M518 372 Q570 378 620 372" fill="none" stroke="#0f766e" stroke-width="1.8" stroke-linecap="round"/>

<path d="M550 402 L562 386 L574 402 L586 386" fill="none" stroke="#b42318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="596" y="404" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="19" fill="#b42318">开路 = 断流</text>
<text x="550" y="430" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="13" fill="#52606d">回路一断，电流归零，负载电压可能飞高。</text>
<text x="550" y="486" font-family="'Book Mono',monospace" font-size="18" fill="#0f766e">I = 常数</text>

<g transform="rotate(-1.2 480 576)">
<rect x="238" y="534" width="484" height="68" rx="4" fill="#fdf3e3" stroke="#e4d8c3" stroke-width="1.4"/>
<text x="262" y="564" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="20" fill="#14213d">接法口诀：恒压 → 并联；恒流 → 串联</text>
<text x="262" y="588" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12.5" fill="#52606d">接反了不会立刻冒烟，但测量结果会开始说谎。</text>
</g>
</svg>
