<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="BMS 端到端通信保护与接收判定">
  <title>端到端通信的身份、连续性、质量与时序检查</title>
  <desc>教学保护壳包含数据ID、计数器、载荷、状态与CRC。接收端核对完整性和样本连续性，并维护超时。源端年龄还需采样时间或延迟边界，CRC不提供发送者认证。</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf5"/>
      <stop offset="1" stop-color="#f7f2e5"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#176b73"/>
    </marker>
  </defs>
  <rect width="960" height="360" rx="18" fill="url(#panel)"/>
  <text x="30" y="38" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#293b3a">端到端保护：帧正确只是第一关</text>
  <text x="30" y="63" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#626d65">发送端把身份与生命周期一起封装；接收端输出的不只是值，还包括质量和年龄。</text>

  <g transform="translate(30 98)" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">
    <text x="0" y="-12" font-size="12" font-weight="700" fill="#626d65">发送端保护壳</text>
    <g font-size="12" text-anchor="middle">
      <rect x="0" y="0" width="120" height="64" rx="9" fill="#e4f0df" stroke="#176b73" stroke-width="2"/>
      <text x="60" y="28" fill="#176b73" font-weight="700">data_id</text><text x="60" y="47" fill="#626d65">身份</text>
      <rect x="120" y="0" width="120" height="64" rx="9" fill="#f6e2df" stroke="#7c648e" stroke-width="2"/>
      <text x="180" y="28" fill="#736085" font-weight="700">counter</text><text x="180" y="47" fill="#5f6a63">连续性</text>
      <rect x="240" y="0" width="210" height="64" rx="9" fill="#e4f0df" stroke="#377b60" stroke-width="2"/>
      <text x="345" y="28" fill="#36775e" font-weight="700">payload</text><text x="345" y="47" fill="#626d65">电压 / SOC / 限值</text>
      <rect x="450" y="0" width="120" height="64" rx="9" fill="#fbefc7" stroke="#926717" stroke-width="2"/>
      <text x="510" y="28" fill="#8e6518" font-weight="700">status</text><text x="510" y="47" fill="#626d65">质量</text>
      <rect x="570" y="0" width="100" height="64" rx="9" fill="#f6e2df" stroke="#b84745" stroke-width="2"/>
      <text x="620" y="28" fill="#ad4644" font-weight="700">crc</text><text x="620" y="47" fill="#5f6a63">完整性</text>
    </g>
    <path d="M0 82 V94 H670 V82" fill="none" stroke="#b84745" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="335" y="113" text-anchor="middle" font-size="11" fill="#b84745">CRC 覆盖身份、序号、载荷与状态</text>
  </g>

  <path d="M720 130 H790" fill="none" stroke="#176b73" stroke-width="3" marker-end="url(#arr)"/>
  <g transform="translate(800 90)" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">
    <rect width="130" height="146" rx="14" fill="#f7f2e5" stroke="#176b73" stroke-width="2"/>
    <text x="65" y="29" text-anchor="middle" font-size="14" font-weight="700" fill="#176b73">接收判定</text>
    <text x="17" y="57" font-size="12" fill="#293b3a">1 身份匹配</text>
    <text x="17" y="80" font-size="12" fill="#293b3a">2 CRC 正确</text>
    <text x="17" y="103" font-size="12" fill="#293b3a">3 序号连续</text>
    <text x="17" y="126" font-size="12" fill="#293b3a">4 年龄未超时</text>
  </g>

  <g transform="translate(140 270)" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">
    <rect width="680" height="60" rx="14" fill="#223333"/>
    <text x="32" y="37" font-size="15" font-weight="700" fill="#edf0e5">交给应用：</text>
    <text x="145" y="37" font-size="15" fill="#7ec5c5">value</text>
    <text x="230" y="37" font-size="15" fill="#b0beb3">+</text>
    <text x="265" y="37" font-size="15" fill="#8fc7a2">quality</text>
    <text x="365" y="37" font-size="15" fill="#b0beb3">+</text>
    <text x="400" y="37" font-size="15" fill="#dfbd78">age_ms</text>
    <text x="490" y="37" font-size="15" fill="#b0beb3">+</text>
    <text x="525" y="37" font-size="15" fill="#baa4cf">sequence_state</text>
  </g>
</svg>
