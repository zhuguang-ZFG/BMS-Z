<text x="67" y="542" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="10.5" fill="#52606d">对应 17.1 电源 / 17.7 上电</text>

<rect x="265" y="428" width="190" height="140" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
