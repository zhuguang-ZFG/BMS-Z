    keep_facts:
      - 馈通是容性分压不是沟道电荷：$C_{gd}$ 1 pF 对 $C_h$ 10 nF，5 V 控制沿 → $5\times1/10001\approx0.5$ mV
      - 它出现在拍①与拍③的沿上，宽度等于控制沿；方向与注入台阶可同向可反向，示波器看到的是净台阶
      - 拆开方法：只改控制摆幅重测——注入基本不动，馈通线性随摆幅变（0.5 mV @5 V → 0.33 mV @3.3 V）
      - 拍①：控制沿之后保持节点向输入值爬，前段陡后段缓，时间常数就是你算的 τ
      - 拍③：断开沿先有一小段快速台阶（馈通与注入叠加），随后进入平直段；平直段缓慢下滑就是 droop
      - 时基打到 100 ms/div，下滑斜率 × 电容 = 总漏流
      - 量得的 τ 与斜率若和预算差一倍以上，先查漏流路径（板面、探头、缓冲偏流），再怀疑器件
      - 图上所有波形均为预期描述，非本书实测
    design: >-
      一张示波器屏面（带网格与时基标签 100 ms/div）：一个完整周期的电压轨迹——指数爬升段（拍①）、沿上窄台阶（拍③馈通＋注入叠加，宽度＝控制沿）、平直缓降段（droop）、再采样；四条时间旗标逐段指认拍①—④，屏角标"预期波形，非实测"；右栏两张对照小条：控制摆幅 5 V 与 3.3 V 下的净台阶（馈通 0.5→0.33 mV、注入那条不动），下方一句"两个斜率不同的误差源，两次测量拆开"。
