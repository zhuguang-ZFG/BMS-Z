<text x="686" y="432" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="13" fill="#14213d">选谷底低、谷底宽的那条；</text>
<text x="686" y="452" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="13" fill="#14213d">贴脸放——走线 5nH/cm 会废掉好意。</text>
</g>

<g>
<rect x="36" y="520" width="888" height="94" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
<rect x="36" y="520" width="6" height="94" fill="#14213d"/>
<text x="60" y="550" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="16" font-weight="700" fill="#14213d">谷底深度＝ESR，谷底位置＝f0，谷底宽度 ≈ C 与 ESL 之比。</text>
<text x="60" y="576" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="13.5" fill="#0f766e">低频储能交给电解（100kHz 以下、毫秒级），高频去耦交给小封装 MLCC（MHz 级、纳秒级）：</text>
<text x="60" y="598" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="13.5" fill="#0f766e">两者是分工，谁也不能替谁；并联时小心两条谷底之间挤出的谐振峰。</text>
</g>
</svg>
