    <animate attributeName="stroke" values="#34d399;#f87171;#f87171;#34d399" keyTimes="0;0.42;0.65;1" dur="8s" repeatCount="indefinite" />
  </line>
  <g font-size="12" text-anchor="middle">
    <text x="540" y="232" opacity="0" class="ok">OC = 高（允许充电）<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.40;0.42;1" dur="8s" repeatCount="indefinite" /></text>
    <text x="540" y="232" opacity="0" class="warn">OC = 低（关断！）<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.42;0.44;0.70;0.72;1" dur="8s" repeatCount="indefinite" /></text>
    <text x="540" y="232" opacity="0" class="ok">OC = 高（恢复）<animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.72;0.74;0.98;1" dur="8s" repeatCount="indefinite" /></text>
  </g>

  
