<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" width="960" height="800" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" fill="#003153">
  <title id="title">4.5 mV 的测量误差怎样进入 SOC、过压保护与串间差判断</title>
  <desc id="desc">原理示意，非实拍。四项教学误差上界 2.0、1.2、0.8、0.5 mV 同向相加为 4.50 mV。SOC 除以局部斜率，分别得 0.56 和 6.00 个百分点。过压保护从 3650 mV 扣除 4.50 mV 低读误差和 2.00 mV 延迟裕量，触发点不高于 3643.50 mV。只有在 AFE、温漂与标定三项完全共用的教学假设下，串间差才只剩两路输入残差，相对界为 2.4 mV，均衡动作线为 12.4 mV。随机噪声 RSS 标准差 1.0 mV 另记，不能替代最大误差。</desc>
  <rect width="960" height="800" fill="#fffdf5"/>
  <text x="36" y="44" font-size="28" font-weight="700">4.5 mV 的误差，到了决策处怎样算？</text>
  <text x="36" y="76" font-size="18">先列来源，再看用途。教学合成值，非芯片指标；原理示意 / 非实拍。</text>
  <!-- Numerical bar lengths stay exact; only the surrounding pen strokes vary. -->
  <g text-anchor="middle" font-size="18">
    <text x="248" y="120">AFE：2.0</text>
    <text x="536" y="120">输入网络：1.2</text>
    <text x="716" y="120">温漂：0.8</text>
    <text x="833" y="120">标定：0.5</text>
  </g>
  <g stroke="#003153" stroke-width="1.6">
    <rect x="68" y="134" width="360" height="26" fill="#dce7ec"/>
    <rect x="428" y="134" width="216" height="26" fill="#edf2f4"/>
    <rect x="644" y="134" width="144" height="26" fill="#dce7ec"/>
    <rect x="788" y="134" width="90" height="26" fill="#edf2f4"/>
  </g>
  <text x="892" y="154" font-size="17">mV</text>
  <path d="M68 170 L69 181 Q280 184 470 182 Q674 180 878 182 L878 170" fill="none" stroke="#003153" stroke-width="1.8" stroke-linecap="round"/>
  <text x="480" y="214" text-anchor="middle" font-size="21" font-weight="700">同向最坏上界：2.0 + 1.2 + 0.8 + 0.5 = 4.50 mV</text>
  <path d="M33 236 Q460 233 928 236 L927 355 Q480 358 32 354 Z" fill="#edf2f4" stroke="#003153" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="54" y="270" font-size="22" font-weight="700">① SOC：换成多少电量误差？</text>
  <text x="54" y="306" font-size="18">除以当前位置的 OCV 斜率。</text>
  <text x="54" y="335" font-size="18">平台越平，同样的电压误差放大越多。</text>
  <text x="530" y="271" font-size="17">示例斜率的单位：mV / 百分点</text>
  <text x="530" y="303" font-size="22" font-weight="700">4.5 ÷ 8 → 0.56 个百分点</text>
  <text x="530" y="340" font-size="22" font-weight="700">4.5 ÷ 0.75 → 6.00 个百分点</text>
  <path d="M33 374 Q470 372 927 375 L928 538 Q470 540 32 537 Z" fill="none" stroke="#003153" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="54" y="407" font-size="22" font-weight="700">② 保护：要提前多少动作？</text>
  <text x="54" y="444" font-size="18">最坏低读：4.50 mV</text>
  <text x="54" y="475" font-size="18">延迟升压：10 mV/s × 0.2 s = 2.00 mV</text>
  <!-- Same scale: 4.50 mV = 225 px, 2.00 mV = 100 px. -->
  <g stroke="#003153" fill="none" stroke-width="2">
    <path d="M554 443 L879 443"/>
    <path d="M554 436 L554 450 M779 436 L779 450"/>
    <path d="M565 428 Q660 412 768 428" stroke-width="1.5"/>
  </g>
  <path d="M879 429 L879 453" stroke="#e34234" stroke-width="3"/>
  <g text-anchor="middle" font-size="18">
    <text x="554" y="405">3643.50</text>
    <text x="779" y="405">3648</text>
    <text x="879" y="405">3650</text>
    <text x="660" y="437" font-size="16">+4.50</text>
    <text x="829" y="437" font-size="16">+2.00</text>
    <text x="554" y="476">读数触发</text>
    <text x="779" y="476">当时真值</text>
    <text x="879" y="476">延迟后</text>
  </g>
  <text x="54" y="518" font-size="21" font-weight="700">触发点 ≤ 3650 − 4.50 − 2.00 = 3643.50 mV</text>
  <text x="881" y="518" text-anchor="end" font-size="16">上方数轴：mV</text>
  <path d="M32 558 Q490 556 928 559 L927 723 Q480 725 33 721 Z" fill="#edf2f4" stroke="#003153" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="54" y="591" font-size="22" font-weight="700">③ 均衡：两串相减，还剩哪些误差？</text>
  <text x="54" y="624" font-size="18">前提：AFE、温漂、标定三项在两串中完全共用（教学假设）。</text>
  <text x="54" y="661" font-size="19">共用的 +3.3 mV 在求差时抵消</text>
  <path d="M56 670 Q204 673 366 670 M61 675 L81 679 M90 674 L111 678" fill="none" stroke="#003153" stroke-width="1.2" stroke-linecap="round"/>
  <text x="54" y="704" font-size="18">绝对过压判断仍保留完整 4.50 mV。</text>
  <text x="528" y="663" font-size="22" font-weight="700">相对界：2 × 1.2 = 2.4 mV</text>
  <text x="528" y="702" font-size="21" font-weight="700">动作线：10 + 2.4 = 12.4 mV</text>
  <text x="36" y="756" font-size="17">随机噪声另算：σ₁ = 0.6、σ₂ = 0.8 mV → RSS σ = 1.0 mV（非最大误差）。</text>
  <text x="36" y="784" font-size="17">RSS 此处要求零均值、互不相关；存在相关性时还要计入协方差。计算见 §5.3–§5.5。</text>
</svg>
