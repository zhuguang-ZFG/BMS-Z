<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="ttl">
<title id="ttl">Buck 降压：电感是「水车惯性」，把断续水流碾成直流</title>
<desc>Buck 降压：电感是「水车惯性」，把断续水流碾成直流；节拍：① 开关闭合：12V 经电感向输出灌能量——电感电流斜坡上升（储 ½LI²）；② 开关断开：电感不许电流突变，把节点拉到负压——二极管接住续流；③ 伏秒平衡：电感一周期平均电压必须为 0 → Vout = D×Vin = 0.42×12 = 5V</desc>
