<svg xmlns="http://www.w3.org/2000/svg" width="800" height="724" viewBox="0 -156 800 724" role="img" font-family="ui-monospace, Consolas, monospace">
  <title>串并联成组动画</title>
  <desc>串联把电压相加，并联把容量相加。4 串仍是 4 路采样，底栏电压按 3.7 V 乘串数。示意。</desc><style>
    .bg { fill: #ffffff; }
