<text x="168" y="152" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="16" font-weight="700" fill="#52606d">排故记录</text>
<text x="270" y="152" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12.5" fill="#8a8f98">日期 ____　板号 ____</text>
<text x="776" y="152" text-anchor="end" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="12.5" fill="#8a8f98">第 1 页</text>

<g transform="rotate(-1.5 316 236)">
<rect x="168" y="180" width="296" height="112" fill="#fdf3e3" stroke="#b42318" stroke-width="1.8"/>
<rect x="206" y="172" width="66" height="16" fill="#f0d9a8" stroke="#c9a86a" stroke-width="0.8" opacity="0.9" transform="rotate(-3 239 180)"/>
<rect x="360" y="172" width="66" height="16" fill="#f0d9a8" stroke="#c9a86a" stroke-width="0.8" opacity="0.9" transform="rotate(3 393 180)"/>
<text x="186" y="210" font-family="'KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" font-size="18" font-weight="700" fill="#b42318">症状卡 · 先看再做</text>
<text x="186" y="238" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="13.5" fill="#14213d">合盖 10 分钟后偶发复位</text>
<text x="186" y="262" font-family="'Book Sans','Noto Sans SC',sans-serif" font-size="13.5" fill="#14213d">空载、冷机不复现</text>
<text x="186" y="286" font-family="'Book Mono',monospace" font-size="12.5" fill="#b42318">线索：温度？接触？</text>
</g>

<g transform="rotate(2 585 218)">
