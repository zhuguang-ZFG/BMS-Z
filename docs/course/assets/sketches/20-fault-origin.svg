<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
<title id="title">找起因，沿三条轨迹向前看</title><desc id="desc">同一时间轴上的三条轨迹：0.30 s出现持续欠压；0.50 s发断开命令；反馈始终闭合，到0.70 s追加执行器卡住。最早观察到的异常是欠压，最后报错不替代起因。</desc>
<metadata>Self-authored editable SVG; FA-002; IG-008; C-03; C-15 only for expiry/cutoff.</metadata>
